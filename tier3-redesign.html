<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08121b">
<title>3분류 재설계 아트북</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#08121b;color:#edf7ff;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif}body{background:radial-gradient(circle at 85% 0,#173b52 0,#0d2230 34%,#08121b 72%)}a{color:inherit;text-decoration:none}.wrap{width:min(100%,1040px);margin:auto;padding:14px 12px 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.back{min-height:42px;padding:0 13px;display:flex;align-items:center;border:1px solid #ffffff24;border-radius:12px;background:#ffffff0b;font-size:11px;font-weight:900}.badge{font-size:9px;color:#77d5ff;font-weight:1000;letter-spacing:.08em}.hero{padding:20px;border:1px solid #ffffff1f;border-radius:22px;background:linear-gradient(135deg,#13384f,#102635 62%,#162733);box-shadow:0 20px 55px #0007}.hero small{font-size:9px;color:#7fd7ff;font-weight:1000}.hero h1{margin:6px 0 8px;font-size:28px;line-height:1.1}.hero p{margin:0;color:#c8deea;font-size:11px;line-height:1.55;font-weight:730}.principles{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.principles span{padding:6px 8px;border:1px solid #ffffff20;border-radius:999px;background:#ffffff0a;color:#d5e8f2;font-size:8px;font-weight:900}.nav{display:flex;gap:7px;overflow:auto;padding:12px 0 8px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav button{flex:0 0 auto;min-height:39px;padding:0 11px;border:1px solid #ffffff20;border-radius:11px;background:#102431;color:#d9eaf3;font-size:9px;font-weight:950}.nav button.active{background:#eff9ff;color:#143349;border-color:#eff9ff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{overflow:hidden;border:1px solid #ffffff1d;border-radius:20px;background:#0e1d28;scroll-margin-top:12px}.head{display:grid;grid-template-columns:104px 1fr;gap:13px;padding:12px;background:linear-gradient(135deg,#112c3e,#101f2b)}.cover{aspect-ratio:1;border-radius:14px;overflow:hidden;background:#163244}.cover img{width:100%;height:100%;object-fit:cover}.eyebrow{font-size:8px;color:#73d0ff;font-weight:1000}.head h2{margin:4px 0 6px;font-size:21px;line-height:1.1}.hook{font-size:11px;line-height:1.45;font-weight:900}.body{padding:12px;display:grid;gap:8px}.row{padding:10px;border:1px solid #ffffff12;border-radius:13px;background:#ffffff06}.row b{display:block;margin-bottom:5px;font-size:9px;color:#83d8ff}.row p{margin:0;color:#d8e8f0;font-size:10px;line-height:1.5;font-weight:720}.tags{display:flex;gap:5px;flex-wrap:wrap}.tags span{padding:5px 7px;border-radius:999px;background:#ffffff0a;border:1px solid #ffffff15;font-size:8px;color:#c8dce7;font-weight:900}.foot{margin-top:15px;padding:12px;border:1px solid #ffffff16;border-radius:15px;background:#ffffff07;color:#9fb8c7;font-size:9px;line-height:1.55;font-weight:760}.loading{padding:40px 16px;text-align:center;color:#a8c3d2;font-size:11px;font-weight:800}.error{padding:20px;border:1px solid #ff9c9c44;border-radius:16px;background:#ff77770d;color:#ffd5d5;font-size:11px;line-height:1.6}@media(max-width:760px){.grid{grid-template-columns:1fr}.head{grid-template-columns:94px 1fr}.hero h1{font-size:25px}.wrap{padding-left:10px;padding-right:10px}}@media(max-width:390px){.head{grid-template-columns:82px 1fr;gap:10px}.head h2{font-size:19px}.hook{font-size:10px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="back" href="/">← 홈</a><div class="badge">TIER 3 · DESIGN ONLY</div></div>
  <section class="hero">
    <small>2026-09-11 REDESIGN</small>
    <h1>3분류 재설계 아트북</h1>
    <p>아트북은 핵심만 보여준다. 상세 시스템·밸런스·실패학습·프로토타입 질문은 별도 설계 원본에 저장되어 있고, 여기서는 게임의 정체성과 플레이 이유만 빠르게 읽는다.</p>
    <div class="principles"><span>핵심 재미</span><span>대표 루프</span><span>시그니처 시스템</span><span>비주얼 방향</span></div>
  </section>
  <nav class="nav" id="nav"></nav>
  <main class="grid" id="cards"><div class="loading">재설계 아트북 불러오는 중…</div></main>
  <div class="foot">3분류는 설계 전용이다. 이 페이지는 게임 코드를 바꾸지 않는다. 상세 게임설계 원본은 <b>design/tier3-redesign-2026-09-11.json</b>에 분리되어 있다.</div>
</div>
<script>
const imageMap={
  'crystal-defense':'assets/crystal-v2.webp',
  'human-go':'assets/card-rpg-v2.webp',
  'island-village':'assets/title-island-village.svg',
  'egg-heist':'assets/title-egg-heist.svg',
  'chess-battle':'assets/title-chess-battle.svg',
  'survival2':'assets/title-survival2.svg',
  'territory-war':'assets/title-territory-war.svg'
};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('design/tier3-redesign-2026-09-11.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('설계 데이터를 불러오지 못함');return r.json()}).then(data=>{
  const games=Array.isArray(data.games)?data.games:[];
  const nav=document.getElementById('nav'),cards=document.getElementById('cards');
  nav.innerHTML=games.map((g,i)=>`<button data-id="${esc(g.id)}" class="${i===0?'active':''}">${esc(g.name)}</button>`).join('');
  cards.innerHTML=games.map(g=>{
    const a=g.artbook||{};
    return `<article class="card" id="${esc(g.id)}">
      <div class="head"><div class="cover"><img src="${esc(imageMap[g.id]||'')}" alt="${esc(g.name)}" loading="lazy"></div><div><div class="eyebrow">3분류 · 재설계</div><h2>${esc(g.name)}</h2><div class="hook">${esc(a.oneLineHook)}</div><div class="tags">${(g.genre||[]).map(x=>`<span>${esc(x)}</span>`).join('')}</div></div></div>
      <div class="body">
        <div class="row"><b>게임 정체성</b><p>${esc(a.identity)}</p></div>
        <div class="row"><b>핵심 루프</b><p>${esc(a.coreLoop)}</p></div>
        <div class="row"><b>대표 시스템</b><p>${esc(a.signatureSystem)}</p></div>
        <div class="row"><b>비주얼 방향</b><p>${esc(a.visualDirection)}</p></div>
      </div>
    </article>`;
  }).join('');
  const buttons=[...nav.querySelectorAll('button')];
  buttons.forEach(btn=>btn.addEventListener('click',()=>{document.getElementById(btn.dataset.id)?.scrollIntoView({behavior:'smooth',block:'start'});buttons.forEach(x=>x.classList.toggle('active',x===btn));}));
  const obs=new IntersectionObserver(entries=>{const hit=entries.filter(x=>x.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];if(!hit)return;buttons.forEach(x=>x.classList.toggle('active',x.dataset.id===hit.target.id));},{threshold:[.25,.55]});
  games.forEach(g=>{const el=document.getElementById(g.id);if(el)obs.observe(el)});
}).catch(err=>{document.getElementById('cards').innerHTML=`<div class="error">${esc(err.message)}<br>잠시 뒤 새로고침해 줘.</div>`});
</script>
</body>
</html>
