<body>
<canvas id="game"></canvas>
<div class="hud">
 <div class="card main"><div class="title">개미 시뮬레이터</div><div class="hp"><i id="hpBar"></i></div><div class="status"><span>종족 <b id="factionLabel">-</b></span><span>클래스 <b id="classLabel">-</b></span><span>운반 <b id="carryLabel">0</b></span><span>식량 <b id="colonyFood">0</b></span><span>개미 <b id="antCount">10</b></span></div></div>
 <div class="rightHud"><button class="hudBtn" id="multiBtn">멀티</button><a class="home" href="/">홈</a></div>
</div>
<div class="notice" id="notice"></div>
<div class="multi" id="multiPanel"><h3>실시간 멀티</h3><small id="multiStatus">오프라인 · 방 번호 1~10</small><div class="multiRow"><input id="roomInput" inputmode="numeric" maxlength="2" value="1"><button id="joinBtn">참가</button><button id="leaveBtn">나가기</button></div><div class="multiRow"><button id="copyBtn">초대 링크 복사</button></div></div>

<div class="start" id="start">
 <section class="panel">
  <h1>개미 시뮬레이터</h1>
  <p>거대한 정원에서 종족을 선택하고 굴을 키워. 각 종족은 AI 개미 10마리와 AI 여왕을 가지고 시작해.</p>
  <div class="sectionTitle">종족 선택</div>
  <div class="choiceGrid" id="factionChoices">
   <button class="choice on" data-faction="red">빨간개미<small>남서쪽 굴</small></button>
   <button class="choice" data-faction="blue">파란개미<small>북쪽 굴</small></button>
   <button class="choice" data-faction="yellow">노란개미<small>동쪽 굴</small></button>
  </div>
  <div class="sectionTitle">클래스 선택</div>
  <div class="choiceGrid two" id="classChoices">
   <button class="choice on" data-class="worker">일개미<small>채집량 2배 · 이동 빠름</small></button>
   <button class="choice" data-class="soldier">병정개미<small>공격력 2배 · 체력 증가</small></button>
  </div>
  <div class="sectionTitle">멀티 방</div>
  <div class="startRoom"><input id="startRoom" inputmode="numeric" maxlength="2" value="1"><button class="startBtn" id="startMulti">멀티로 시작</button></div>
  <button class="offline" id="startOffline">혼자 시작</button>
  <div class="legend"><div>공격적: 거미 · 바퀴벌레</div><div>중립: 딱정벌레 · 무당벌레</div><div>비공격: 나비</div><div>모바일: 왼쪽 이동 · 오른쪽 행동</div></div>
 </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.91.1"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d'),mapCanvas=$('map'),mctx=mapCanvas.getContext('2d');
const MULTI_SUPABASE_URL='https://njpexgqvituaxrjpnqsi.supabase.co';
const MULTI_SUPABASE_KEY='sb_publishable_ybAF71npJQz6PJVpnwsQ4g_rsyzlkFQ';
const WORLD={w:9000,h:6000},TAU=Math.PI*2;
const factions={red:{name:'빨간개미',color:'#d94b4e',dark:'#74272b',x:1300,y:3300},blue:{name:'파란개미',color:'#4b86e8',dark:'#263f76',x:4500,y:1150},yellow:{name:'노란개미',color:'#e1c34a',dark:'#806a21',x:7600,y:4200}};
const bugTypes={spider:{name:'거미',color:'#292229',hp:95,damage:18,speed:90,hostile:true,r:23},beetle:{name:'딱정벌레',color:'#173d32',hp:120,damage:14,speed:54,hostile:false,r:24},ladybug:{name:'무당벌레',color:'#c83e38',hp:80,damage:8,speed:50,hostile:false,r:21},roach:{name:'바퀴벌레',color:'#5b3b25',hp:105,damage:16,speed:78,hostile:true,r:22},butterfly:{name:'나비',color:'#c67de7',hp:55,damage:0,speed:86,hostile:false,harmless:true,r:20}};
const multi={client:null,channel:null,room:'',connected:false,playerId:sessionStorage.getItem('ant-sim-id')||('p'+Math.random().toString(36).slice(2,10)),joinedAt:Date.now(),hostId:null,remote:new Map(),presenceIds:new Set(),sendAt:0,worldAt:0};
sessionStorage.setItem('ant-sim-id',multi.playerId);
const state={started:false,faction:'red',classId:'worker',player:{x:1400,y:3300,hp:100,maxHp:100,carry:0,faceX:1,faceY:0,attackAt:0,deadUntil:0,depositAt:0},ants:[],queens:[],bugs:[],food:[],colonyFood:{red:20,blue:20,yellow:20},camera:{x:0,y:0},last:performance.now()};
let keys={},joy={x:0,y:0,id:null},noticeTimer=0,entitySeq=1;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b,c,d)=>Math.hypot(a-c,b-d),rand=(a,b)=>a+Math.random()*(b-a);
function resize(){const d=Math.min(2,devicePixelRatio||1);canvas.width=Math.floor(innerWidth*d);canvas.height=Math.floor(innerHeight*d);canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',resize);resize();
function showNotice(t){$('notice').textContent=t;$('notice').classList.add('on');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('notice').classList.remove('on'),1700)}
function seeded(n){let x=Math.sin(n*91.133+17.71)*43758.5453;return x-Math.floor(x)}
function newId(prefix){return prefix+(entitySeq++)}
function spawnWorld(){
 state.ants=[];state.queens=[];state.bugs=[];state.food=[];entitySeq=1;
 Object.entries(factions).forEach(([f,c])=>{
  state.queens.push({id:newId('q'),faction:f,x:c.x,y:c.y,hp:600,maxHp:600});
  for(let i=0;i<10;i++){const a=i/10*TAU,rr=115+(i%3)*28;state.ants.push({id:newId('a'),faction:f,classId:i<4?'soldier':'worker',x:c.x+Math.cos(a)*rr,y:c.y+Math.sin(a)*rr,hp:i<4?150:95,maxHp:i<4?150:95,vx:0,vy:0,wander:0,target:null,attackAt:0});}
 });
 for(let i=0;i<120;i++){const x=250+seeded(i+11)*(WORLD.w-500),y=250+seeded(i+101)*(WORLD.h-500);state.food.push({id:newId('f'),x,y,amount:3+Math.floor(seeded(i+211)*5),active:true});}
 const typeList=['spider','spider','spider','roach','roach','beetle','beetle','ladybug','ladybug','butterfly','butterfly'];
 for(let i=0;i<45;i++){const typeId=typeList[i%typeList.length],t=bugTypes[typeId];state.bugs.push({id:newId('b'),typeId,x:400+seeded(i+401)*(WORLD.w-800),y:400+seeded(i+601)*(WORLD.h-800),hp:t.hp,maxHp:t.hp,vx:0,vy:0,wander:0,attackAt:0,provoked:false});}
}
spawnWorld();
function resetPlayer(){const c=factions[state.faction],p=state.player;p.x=c.x+110;p.y=c.y+40;p.maxHp=state.classId==='soldier'?150:100;p.hp=p.maxHp;p.carry=0;p.deadUntil=0}
function factionName(f){return factions[f]?.name||f}
function className(c){return c==='soldier'?'병정개미':'일개미'}
function updateHud(){const p=state.player;$('hpBar').style.width=(100*p.hp/p.maxHp)+'%';$('factionLabel').textContent=factionName(state.faction);$('classLabel').textContent=className(state.classId);$('carryLabel').textContent=p.carry;$('colonyFood').textContent=Math.floor(state.colonyFood[state.faction]||0);$('antCount').textContent=state.ants.filter(a=>a.faction===state.faction&&a.hp>0).length}
function isHost(){return multi.connected&&multi.hostId===multi.playerId}
function authoritative(){return !multi.connected||isHost()}
function multiSend(event,payload){if(!multi.connected||!multi.channel)return;multi.channel.send({type:'broadcast',event,payload}).catch(()=>{})}
function updateMultiStatus(extra=''){const count=Math.max(1,multi.presenceIds.size||1),role=isHost()?'호스트':'참가자';$('multiStatus').textContent=multi.connected?`방 ${multi.room} · ${count}명 · ${role}${extra?' · '+extra:''}`:'오프라인 · 방 번호 1~10'}
function syncPresence(){if(!multi.channel)return;const rows=Object.values(multi.channel.presenceState()||{}).flat().filter(Boolean),ids=new Set(rows.map(x=>x.id).filter(Boolean));ids.add(multi.playerId);multi.presenceIds=ids;const sorted=rows.filter(x=>x.id).sort((a,b)=>(a.joinedAt||0)-(b.joinedAt||0)||String(a.id).localeCompare(String(b.id)));multi.hostId=sorted[0]?.id||multi.playerId;for(const id of [...multi.remote.keys()])if(!ids.has(id))multi.remote.delete(id);updateMultiStatus()}
function remoteState(p){if(!p||p.id===multi.playerId)return;multi.remote.set(p.id,{...p,seenAt:performance.now()})}
function worldSnapshot(){return{ants:state.ants.map(a=>({id:a.id,faction:a.faction,classId:a.classId,x:a.x,y:a.y,hp:a.hp,maxHp:a.maxHp})),queens:state.queens.map(q=>({...q})),bugs:state.bugs.map(b=>({id:b.id,typeId:b.typeId,x:b.x,y:b.y,hp:b.hp,maxHp:b.maxHp,provoked:b.provoked})),food:state.food.map(f=>({id:f.id,x:f.x,y:f.y,amount:f.amount,active:f.active})),colonyFood:{...state.colonyFood}}}
function applyWorld(w){if(!w||isHost())return;if(Array.isArray(w.ants))state.ants=w.ants.map(a=>({...a,vx:0,vy:0,wander:0,target:null,attackAt:0}));if(Array.isArray(w.queens))state.queens=w.queens.map(q=>({...q}));if(Array.isArray(w.bugs))state.bugs=w.bugs.map(b=>({...b,vx:0,vy:0,wander:0,attackAt:0}));if(Array.isArray(w.food))state.food=w.food.map(f=>({...f}));if(w.colonyFood)state.colonyFood={...w.colonyFood}}
function hitMe(p){if(!p||p.targetId!==multi.playerId)return;damagePlayer(Number(p.damage)||0)}
function applyPlayerAttack(p){if(!authoritative()||!p)return;const range=p.classId==='soldier'?105:82,damage=p.classId==='soldier'?36:17;let best=null,bd=range;for(const b of state.bugs){if(b.hp<=0)continue;const d=dist(p.x,p.y,b.x,b.y);if(d<bd){bd=d;best={kind:'bug',e:b}}}for(const a of state.ants){if(a.hp<=0||a.faction===p.faction)continue;const d=dist(p.x,p.y,a.x,a.y);if(d<bd){bd=d;best={kind:'ant',e:a}}}if(best){best.e.hp=Math.max(0,best.e.hp-damage);if(best.kind==='bug')best.e.provoked=true}}
async function connectRoom(raw){const room=String(raw||'').trim();if(!/^([1-9]|10)$/.test(room)){showNotice('방 번호는 1~10만 가능해');return false}if(!window.supabase?.createClient){showNotice('멀티 모듈을 불러오지 못했어');return false}await leaveRoom(false);multi.room=room;multi.joinedAt=Date.now();multi.client=window.supabase.createClient(MULTI_SUPABASE_URL,MULTI_SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});multi.channel=multi.client.channel('ant-simulator:'+room,{config:{broadcast:{self:false,ack:false},presence:{key:multi.playerId}}});multi.channel.on('presence',{event:'sync'},syncPresence).on('broadcast',{event:'player-state'},({payload})=>remoteState(payload)).on('broadcast',{event:'world-state'},({payload})=>applyWorld(payload)).on('broadcast',{event:'player-attack'},({payload})=>applyPlayerAttack(payload)).on('broadcast',{event:'player-hit'},({payload})=>hitMe(payload)).on('broadcast',{event:'gather-request'},({payload})=>hostGatherRequest(payload)).on('broadcast',{event:'gather-result'},({payload})=>applyGatherResult(payload)).on('broadcast',{event:'deposit-request'},({payload})=>hostDepositRequest(payload)).on('broadcast',{event:'deposit-result'},({payload})=>applyDepositResult(payload)).subscribe(async status=>{if(status==='SUBSCRIBED'){multi.connected=true;await multi.channel.track({id:multi.playerId,joinedAt:multi.joinedAt,faction:state.faction,classId:state.classId});const u=new URL(location.href);u.searchParams.set('room',room);history.replaceState(null,'',u);syncPresence();showNotice('멀티 방 '+room+' 참가')}else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')updateMultiStatus('연결 오류')});return true}
async function leaveRoom(clearUrl=true){if(multi.channel){try{await multi.channel.untrack()}catch{}try{await multi.channel.unsubscribe()}catch{}}multi.channel=null;multi.client=null;multi.connected=false;multi.room='';multi.hostId=null;multi.remote.clear();multi.presenceIds.clear();updateMultiStatus();if(clearUrl){const u=new URL(location.href);u.searchParams.delete('room');history.replaceState(null,'',u)}}
async function copyLink(){if(!multi.room){showNotice('먼저 멀티 방에 참가해');return}const u=new URL(location.href);u.searchParams.set('room',multi.room);try{await navigator.clipboard.writeText(u.toString());showNotice('초대 링크 복사됨')}catch{showNotice('방 번호 '+multi.room)}}
function damagePlayer(n){const p=state.player;if(p.deadUntil)return;p.hp=Math.max(0,p.hp-n);$('damageFlash').classList.add('on');setTimeout(()=>$('damageFlash').classList.remove('on'),100);if(p.hp<=0){p.deadUntil=performance.now()+2200;showNotice('쓰러졌어 · 굴에서 부활')}updateHud()}
function nearestFood(x,y,max=95){let best=null,bd=max;for(const f of state.food){if(!f.active||f.amount<=0)continue;const d=dist(x,y,f.x,f.y);if(d<bd){bd=d;best=f}}return best}
function hostGatherRequest(req){if(!authoritative()||!req?.targetId)return;const local=req.targetId===multi.playerId,source=local?{x:state.player.x,y:state.player.y,classId:state.classId,carry:state.player.carry}:multi.remote.get(req.targetId);if(!source)return;const food=nearestFood(Number(source.x)||0,Number(source.y)||0,95);if(!food){if(local)showNotice('가까운 먹이가 없어');else multiSend('gather-result',{targetId:req.targetId,amount:0,message:'가까운 먹이가 없어'});return}const take=Math.min(food.amount,source.classId==='worker'?2:1);food.amount-=take;if(food.amount<=0)food.active=false;if(local){state.player.carry+=take;showNotice('먹이 +'+take);updateHud()}else{source.carry=Math.max(0,Number(source.carry)||0)+take;multi.remote.set(req.targetId,source);multiSend('gather-result',{targetId:req.targetId,amount:take})}}
function applyGatherResult(p){if(!p||p.targetId!==multi.playerId)return;const amount=Math.max(0,Math.floor(Number(p.amount)||0));if(amount){state.player.carry+=amount;showNotice('먹이 +'+amount);updateHud()}else showNotice(p.message||'채집 실패')}
function gatherFood(){const p=state.player;if(p.deadUntil)return;if(multi.connected&&!isHost()){multiSend('gather-request',{targetId:multi.playerId});return}hostGatherRequest({targetId:multi.playerId})}
function hostDepositRequest(req){if(!authoritative()||!req?.targetId)return;const local=req.targetId===multi.playerId,source=local?{x:state.player.x,y:state.player.y,faction:state.faction,carry:state.player.carry}:multi.remote.get(req.targetId);if(!source)return;const faction=source.faction,c=factions[faction],available=Math.max(0,Math.floor(Number(source.carry)||0)),requested=Math.max(0,Math.floor(Number(req.amount)||0)),amount=Math.min(available,requested);if(!c||!amount||dist(Number(source.x)||0,Number(source.y)||0,c.x,c.y)>=190){if(!local)multiSend('deposit-result',{targetId:req.targetId,amount:0});return}state.colonyFood[faction]=(state.colonyFood[faction]||0)+amount;if(local){state.player.carry=Math.max(0,state.player.carry-amount);showNotice('여왕 굴에 먹이 '+amount+' 전달');updateHud()}else{source.carry=Math.max(0,available-amount);multi.remote.set(req.targetId,source);multiSend('deposit-result',{targetId:req.targetId,amount})}}
function applyDepositResult(p){if(!p||p.targetId!==multi.playerId)return;const amount=Math.max(0,Math.floor(Number(p.amount)||0));if(!amount)return;state.player.carry=Math.max(0,state.player.carry-amount);showNotice('여왕 굴에 먹이 '+amount+' 전달');updateHud()}
function depositFood(){const p=state.player,c=factions[state.faction];if(p.carry<=0||dist(p.x,p.y,c.x,c.y)>=190)return false;const now=performance.now();if(now-(p.depositAt||0)<700)return false;p.depositAt=now;if(multi.connected&&!isHost())multiSend('deposit-request',{targetId:multi.playerId,amount:p.carry});else hostDepositRequest({targetId:multi.playerId,amount:p.carry});return true}
function attack(){const p=state.player;if(p.deadUntil)return;p.attackAt=performance.now();const payload={id:multi.playerId,x:p.x,y:p.y,faction:state.faction,classId:state.classId};if(multi.connected&&!isHost())multiSend('player-attack',payload);else applyPlayerAttack(payload)}
function nearestPlayerTarget(x,y,max=420){let best={id:multi.playerId,x:state.player.x,y:state.player.y,d:state.player.deadUntil?Infinity:dist(x,y,state.player.x,state.player.y),local:true};if(multi.connected&&isHost()){const now=performance.now();for(const [id,r] of multi.remote){if(now-(r.seenAt||0)>1700||(Number(r.hp)||0)<=0)continue;const d=dist(x,y,r.x,r.y);if(d<best.d)best={id,x:r.x,y:r.y,d,local:false}}}return best.d<=max?best:null}
function updateAuthority(dt,now){
 for(const a of state.ants){if(a.hp<=0)continue;const home=factions[a.faction];a.wander-=dt;let tx=home.x,ty=home.y;if(a.wander<=0){a.wander=1.5+Math.random()*3;const ang=Math.random()*TAU,rr=100+Math.random()*550;tx=clamp(home.x+Math.cos(ang)*rr,80,WORLD.w-80);ty=clamp(home.y+Math.sin(ang)*rr,80,WORLD.h-80);a.target={x:tx,y:ty}}else if(a.target){tx=a.target.x;ty=a.target.y}let enemy=null,ed=a.classId==='soldier'?230:130;for(const b of state.bugs){if(b.hp<=0)continue;const d=dist(a.x,a.y,b.x,b.y);if(d<ed&&(bugTypes[b.typeId].hostile||b.provoked)){ed=d;enemy=b}}if(enemy){tx=enemy.x;ty=enemy.y;if(ed<48&&now-a.attackAt>700){enemy.hp=Math.max(0,enemy.hp-(a.classId==='soldier'?22:8));enemy.provoked=true;a.attackAt=now}}const dx=tx-a.x,dy=ty-a.y,d=Math.hypot(dx,dy)||1,s=a.classId==='soldier'?80:95;if(d>18){a.x+=dx/d*s*dt;a.y+=dy/d*s*dt}}
 for(const b of state.bugs){if(b.hp<=0)continue;const t=bugTypes[b.typeId];let tx=null,ty=null,target=null;if(t.hostile||b.provoked){target=nearestPlayerTarget(b.x,b.y,t.hostile?470:300);if(target){tx=target.x;ty=target.y}}if(tx==null){b.wander-=dt;if(b.wander<=0){b.wander=1.2+Math.random()*3;const ang=Math.random()*TAU;b.vx=Math.cos(ang);b.vy=Math.sin(ang)}tx=b.x+b.vx*100;ty=b.y+b.vy*100}const dx=tx-b.x,dy=ty-b.y,d=Math.hypot(dx,dy)||1;if(d>26){b.x=clamp(b.x+dx/d*t.speed*dt,35,WORLD.w-35);b.y=clamp(b.y+dy/d*t.speed*dt,35,WORLD.h-35)}if(target&&dist(b.x,b.y,target.x,target.y)<45&&now-b.attackAt>900&&!t.harmless){b.attackAt=now;if(target.local)damagePlayer(t.damage);else multiSend('player-hit',{targetId:target.id,damage:t.damage,sourceId:b.id})}}
 for(const f of ['red','blue','yellow']){const alive=state.ants.filter(a=>a.faction===f&&a.hp>0).length;if(alive<10&&state.colonyFood[f]>=3){state.colonyFood[f]-=3;const c=factions[f],soldiers=state.ants.filter(a=>a.faction===f&&a.hp>0&&a.classId==='soldier').length;const classId=soldiers<4?'soldier':'worker';state.ants.push({id:newId('a'),faction:f,classId,x:c.x+rand(-80,80),y:c.y+rand(-80,80),hp:classId==='soldier'?150:95,maxHp:classId==='soldier'?150:95,vx:0,vy:0,wander:0,target:null,attackAt:0})}}
}
function updatePlayer(dt,now){const p=state.player;if(p.deadUntil){if(now>=p.deadUntil)resetPlayer();return}let x=(keys['d']||keys['arrowright']?1:0)-(keys['a']||keys['arrowleft']?1:0)+joy.x,y=(keys['s']||keys['arrowdown']?1:0)-(keys['w']||keys['arrowup']?1:0)+joy.y,d=Math.hypot(x,y);if(d>0.08){x/=Math.max(1,d);y/=Math.max(1,d);p.faceX=x;p.faceY=y;const speed=state.classId==='worker'?190:160;p.x=clamp(p.x+x*speed*dt,30,WORLD.w-30);p.y=clamp(p.y+y*speed*dt,30,WORLD.h-30)}depositFood();if(multi.connected&&now>=multi.sendAt){multi.sendAt=now+120;multiSend('player-state',{id:multi.playerId,x:p.x,y:p.y,hp:p.hp,maxHp:p.maxHp,faction:state.faction,classId:state.classId,faceX:p.faceX,faceY:p.faceY,carry:p.carry})}if(multi.connected&&isHost()&&now>=multi.worldAt){multi.worldAt=now+250;multiSend('world-state',worldSnapshot())}}
function update(dt,now){if(!state.started)return;updatePlayer(dt,now);if(authoritative())updateAuthority(dt,now);updateHud()}
function drawCircle(x,y,r,fill,stroke=''){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke();}
function drawAnt(x,y,faction,classId,angle=0,alpha=1){const c=factions[faction]||factions.red;ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);ctx.rotate(angle);ctx.fillStyle=c.dark;ctx.beginPath();ctx.ellipse(-12,0,10,8,0,0,TAU);ctx.ellipse(1,0,9,7,0,0,TAU);ctx.ellipse(13,0,classId==='soldier'?10:8,classId==='soldier'?9:7,0,0,TAU);ctx.fill();ctx.strokeStyle=c.color;ctx.lineWidth=3;for(const yy of [-7,7]){ctx.beginPath();ctx.moveTo(-5,yy*.5);ctx.lineTo(-14,yy*1.5);ctx.moveTo(4,yy*.5);ctx.lineTo(12,yy*1.5);ctx.moveTo(9,yy*.4);ctx.lineTo(21,yy*1.3);ctx.stroke()}ctx.fillStyle=c.color;drawCircle(13,0,classId==='soldier'?5:4,c.color);ctx.restore()}
function drawQueen(q){const s=worldToScreen(q.x,q.y),c=factions[q.faction];ctx.save();ctx.translate(s.x,s.y);ctx.fillStyle=c.dark;ctx.beginPath();ctx.ellipse(-20,0,22,15,0,0,TAU);ctx.ellipse(2,0,17,13,0,0,TAU);ctx.ellipse(23,0,14,12,0,0,TAU);ctx.fill();ctx.fillStyle=c.color;ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.fillText('여왕',0,-24);ctx.restore()}
function drawBug(b){const t=bugTypes[b.typeId],s=worldToScreen(b.x,b.y);ctx.save();ctx.translate(s.x,s.y);if(b.typeId==='butterfly'){ctx.fillStyle=t.color;ctx.beginPath();ctx.ellipse(-10,0,12,8,-.5,0,TAU);ctx.ellipse(10,0,12,8,.5,0,TAU);ctx.fill();ctx.fillStyle='#241d28';ctx.fillRect(-2,-7,4,14)}else{drawCircle(0,0,t.r,t.color);ctx.strokeStyle='#111';ctx.lineWidth=3;for(const side of [-1,1])for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(side*8,i*8);ctx.lineTo(side*(t.r+11),i*13);ctx.stroke()}}ctx.fillStyle='#fff';ctx.font='bold 9px sans-serif';ctx.textAlign='center';ctx.fillText(t.name,0,-t.r-8);if(b.hp<b.maxHp){ctx.fillStyle='#281415';ctx.fillRect(-22,t.r+7,44,5);ctx.fillStyle='#de5b5b';ctx.fillRect(-22,t.r+7,44*b.hp/b.maxHp,5)}ctx.restore()}
function draw(){const w=innerWidth,h=innerHeight,p=state.player;state.camera.x=clamp(p.x-w/2,0,WORLD.w-w);state.camera.y=clamp(p.y-h/2,0,WORLD.h-h);ctx.clearRect(0,0,w,h);ctx.fillStyle='#4a6336';ctx.fillRect(0,0,w,h);ctx.save();ctx.translate(-state.camera.x,-state.camera.y);ctx.strokeStyle='#5d7547';ctx.lineWidth=2;for(let x=0;x<WORLD.w;x+=240){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,WORLD.h);ctx.stroke()}for(let y=0;y<WORLD.h;y+=240){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(WORLD.w,y);ctx.stroke()}for(const [f,c] of Object.entries(factions)){ctx.fillStyle=c.dark+'99';ctx.beginPath();ctx.arc(c.x,c.y,310,0,TAU);ctx.fill();ctx.strokeStyle=c.color;ctx.lineWidth=8;ctx.beginPath();ctx.arc(c.x,c.y,120,0,TAU);ctx.stroke();ctx.fillStyle='#120f0a';ctx.beginPath();ctx.arc(c.x,c.y,72,0,TAU);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.fillText(factionName(f)+' 굴',c.x,c.y-140)}for(const f of state.food){if(!f.active)continue;ctx.fillStyle='#e7d391';ctx.beginPath();ctx.arc(f.x,f.y,7+f.amount,0,TAU);ctx.fill()}ctx.restore();for(const q of state.queens)drawQueen(q);for(const a of state.ants){if(a.hp<=0)continue;const s=worldToScreen(a.x,a.y);if(s.x<-50||s.y<-50||s.x>w+50||s.y>h+50)continue;drawAnt(s.x,s.y,a.faction,a.classId,Math.atan2(a.vy||0,a.vx||1))}for(const b of state.bugs){if(b.hp<=0)continue;const s=worldToScreen(b.x,b.y);if(s.x<-60||s.y<-60||s.x>w+60||s.y>h+60)continue;drawBug(b)}for(const [id,r] of multi.remote){if(performance.now()-(r.seenAt||0)>1700)continue;const s=worldToScreen(r.x,r.y);drawAnt(s.x,s.y,r.faction,r.classId,Math.atan2(r.faceY||0,r.faceX||1),.85);ctx.fillStyle='#fff';ctx.font='bold 9px sans-serif';ctx.textAlign='center';ctx.fillText('플레이어',s.x,s.y-25)}const ps=worldToScreen(p.x,p.y);drawAnt(ps.x,ps.y,state.faction,state.classId,Math.atan2(p.faceY,p.faceX));ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(ps.x,ps.y,27,0,TAU);ctx.stroke();if(performance.now()-p.attackAt<160){ctx.strokeStyle='#ffdfb5';ctx.lineWidth=5;ctx.beginPath();ctx.arc(ps.x,ps.y,45,-.8,.8);ctx.stroke()}drawMap()}
function drawMap(){const W=mapCanvas.width,H=mapCanvas.height;mctx.clearRect(0,0,W,H);mctx.fillStyle='#27351f';mctx.fillRect(0,0,W,H);for(const [f,c] of Object.entries(factions)){mctx.fillStyle=c.color;mctx.beginPath();mctx.arc(c.x/WORLD.w*W,c.y/WORLD.h*H,7,0,TAU);mctx.fill()}for(const [id,r] of multi.remote){mctx.fillStyle=factions[r.faction]?.color||'#fff';mctx.fillRect(r.x/WORLD.w*W-2,r.y/WORLD.h*H-2,4,4)}mctx.fillStyle='#fff';mctx.beginPath();mctx.arc(state.player.x/WORLD.w*W,state.player.y/WORLD.h*H,4,0,TAU);mctx.fill()}
function loop(now){const dt=Math.min(.04,(now-state.last)/1000||0);state.last=now;update(dt,now);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' ')attack()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const stick=$('stick'),knob=$('knob');function joyMove(e){const r=stick.getBoundingClientRect(),t=[...e.touches].find(x=>x.identifier===joy.id);if(!t)return;let x=t.clientX-(r.left+r.width/2),y=t.clientY-(r.top+r.height/2),d=Math.hypot(x,y),m=r.width*.33;if(d>m){x=x/d*m;y=y/d*m}joy.x=x/m;joy.y=y/m;knob.style.transform=`translate(${x}px,${y}px)`}stick.addEventListener('touchstart',e=>{if(joy.id!==null)return;joy.id=e.changedTouches[0].identifier;joyMove(e);e.preventDefault()},{passive:false});stick.addEventListener('touchmove',e=>{joyMove(e);e.preventDefault()},{passive:false});stick.addEventListener('touchend',e=>{if([...e.changedTouches].some(x=>x.identifier===joy.id)){joy.id=null;joy.x=joy.y=0;knob.style.transform=''}e.preventDefault()},{passive:false});
$('gather').onclick=gatherFood;$('attack').onclick=attack;$('multiBtn').onclick=()=>$('multiPanel').classList.toggle('open');$('joinBtn').onclick=()=>connectRoom($('roomInput').value);$('leaveBtn').onclick=()=>leaveRoom();$('copyBtn').onclick=copyLink;
document.querySelectorAll('[data-faction]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-faction]').forEach(x=>x.classList.remove('on'));b.classList.add('on');state.faction=b.dataset.faction});document.querySelectorAll('[data-class]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-class]').forEach(x=>x.classList.remove('on'));b.classList.add('on');state.classId=b.dataset.class});
async function begin(multiplayer){state.started=true;resetPlayer();$('start').classList.add('hide');updateHud();if(multiplayer){const room=$('startRoom').value;$('roomInput').value=room;await connectRoom(room)}showNotice(factionName(state.faction)+' · '+className(state.classId)+' 시작')}
$('startOffline').onclick=()=>begin(false);$('startMulti').onclick=()=>begin(true);
const roomFromUrl=new URL(location.href).searchParams.get('room');if(roomFromUrl&&/^([1-9]|10)$/.test(roomFromUrl)){$('startRoom').value=roomFromUrl;$('roomInput').value=roomFromUrl}
updateHud();
})();
