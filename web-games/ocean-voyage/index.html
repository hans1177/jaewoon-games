<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<title>푸른 항로 · 영국 항해기</title>
<style>
/* 파일명: web-games/ocean-voyage/index.html | 디자인: 모바일 3D 항해 게임 인터페이스 */
:root{color-scheme:dark;--navy:#0b2636;--panel:rgba(7,24,37,.92);--line:rgba(204,230,230,.21);--gold:#f4c774;--white:#f2f4ee;--sub:#adc3ca;--teal:#72c5ce}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#082534;color:var(--white);font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif}
button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.35;cursor:not-allowed}
#sea{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#veil{position:fixed;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(5,20,34,.36),transparent 40%,rgba(5,20,34,.22)),linear-gradient(180deg,rgba(5,20,34,.45),transparent 23%,transparent 65%,rgba(5,20,34,.55))}
#top{position:fixed;top:0;left:0;right:0;z-index:6;display:flex;gap:18px;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 12px) 17px 13px;background:linear-gradient(180deg,rgba(5,24,39,.96),rgba(5,24,39,.73));border-bottom:1px solid var(--line)}
#brand{display:flex;flex-direction:column;flex-shrink:0}#brand small{font-size:10px;letter-spacing:2.3px;color:var(--gold);font-weight:800}#brand strong{font-family:Georgia,serif;font-size:23px;letter-spacing:-.7px;color:#fff5df}
#status{display:flex;gap:16px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.stat{display:flex;gap:6px;flex-direction:column;align-items:flex-end}.stat small{color:var(--sub);font-size:10px;letter-spacing:.5px}.stat b{font-size:14px;white-space:nowrap}
#nav{position:fixed;left:17px;top:calc(env(safe-area-inset-top) + 94px);width:166px;display:grid;gap:7px;z-index:7}
.nav{width:100%;display:flex;gap:12px;align-items:center;padding:12px 13px;border:1px solid var(--line);border-radius:9px;background:rgba(6,28,43,.82);color:#e7f1f3;backdrop-filter:blur(10px);text-align:left;font-size:13px;font-weight:700}
.nav:active,.nav.active{color:var(--gold);border-color:rgba(244,199,116,.55);background:rgba(35,44,47,.92)}
.nav span{font-size:17px;width:22px;text-align:center}
#details{position:fixed;right:16px;top:calc(env(safe-area-inset-top) + 92px);width:min(360px,calc(100vw - 32px));bottom:135px;min-height:220px;z-index:8;display:none;flex-direction:column;border:1px solid var(--line);border-radius:13px;background:var(--panel);box-shadow:0 12px 50px #00131b90;overflow:hidden;backdrop-filter:blur(18px)}
#details.open{display:flex}
#panelHead{padding:17px 16px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
#panelHead h2{margin:0;font-family:Georgia,serif;font-size:20px;color:var(--gold)}
.icon{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:7px;color:var(--white);padding:6px 10px}
#content{overflow:auto;overscroll-behavior:contain;padding:14px 15px 20px;flex:1}
.info{color:var(--sub);font-size:12px;line-height:1.5}
#content h3{font-size:14px;color:var(--gold);margin:18px 0 10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:10px 0}
.row strong{font-size:13px}.row small{font-size:11px;color:var(--sub)}
.row .desc{display:flex;flex-direction:column;gap:4px;min-width:0}
.stack{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.action{border:1px solid #8c7650;background:linear-gradient(180deg,#8b6942,#624c35);border-radius:7px;padding:7px 10px;color:#fff5e8;font-size:11px;font-weight:700}
.action.sub{border-color:#427a89;background:linear-gradient(180deg,#285667,#173b4b)}
.action:disabled{opacity:.4}
#message{position:fixed;left:50%;bottom:calc(142px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:min(530px,90vw);padding:9px 15px;border:1px solid rgba(244,199,116,.35);border-radius:8px;color:#ffefce;background:rgba(12,31,42,.9);text-align:center;font-size:12px;z-index:10;pointer-events:none}
#compass{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 84px);transform:translateX(-50%);border:1px solid var(--line);border-radius:30px;padding:7px 17px;color:#e4eff0;background:rgba(6,28,43,.75);font-size:12px;font-weight:750;z-index:5;white-space:nowrap}
#controls{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:14px;right:14px;display:flex;align-items:flex-end;justify-content:space-between;z-index:7;pointer-events:none;gap:8px}
.group{display:flex;gap:8px;align-items:flex-end;pointer-events:auto}
.pad{border:1px solid #76a5b0aa;box-shadow:0 3px 16px #06202aaa;background:rgba(9,34,51,.84);color:#fff;border-radius:13px;min-width:61px;height:60px;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;user-select:none;-webkit-user-select:none;touch-action:none}
.pad b{font-size:22px}.pad:active,.pad.pressed{background:rgba(91,139,146,.8)}
.pad.fire{height:76px;min-width:77px;border-radius:50%;border-color:#f0ae71;background:linear-gradient(135deg,#bc7146,#672b2e)}
.pad.dock{border-color:#d1bc86}
#loading{position:fixed;inset:0;background:#061d2c;z-index:18;display:grid;place-items:center;text-align:center;padding:24px}
#loading h1{font-family:Georgia,serif;color:var(--gold);font-size:28px}#loading p{color:var(--sub);font-size:13px;line-height:1.6}
#loading.hide{display:none}
#mapCanvas{display:block;width:100%;aspect-ratio:1.3;background:radial-gradient(circle at 30% 24%,#204f63,#092536);border-radius:10px;border:1px solid var(--line)}
.mapDot{cursor:pointer}.mapDot circle{stroke:#0d2432;stroke-width:1.6}.mapDot text{font-size:7px;fill:#f9e5ba;font-weight:700;paint-order:stroke;stroke:#0d2432;stroke-width:1.6}
#hint{position:fixed;right:15px;bottom:calc(106px + env(safe-area-inset-bottom));font-size:11px;color:#d3e8ec;opacity:.86;z-index:4;text-shadow:0 2px 6px #091c28}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:7px}.kpi div{padding:10px;border-radius:8px;background:#ffffff0a;border:1px solid var(--line)}.kpi b{display:block;color:var(--gold);margin-top:4px;font-size:17px}
@media(max-width:740px){
#top{gap:4px;padding-left:12px;padding-right:12px}
#brand strong{font-size:16px}#brand small{font-size:8px}
#status{gap:8px}.stat{gap:2px}.stat b{font-size:11px}.stat small{font-size:9px}
#status .extra{display:none}
#nav{left:7px;top:calc(env(safe-area-inset-top) + 75px);width:53px;gap:6px}
.nav{justify-content:center;padding:9px 7px;font-size:0}.nav span{font-size:18px;width:auto}
#details{left:67px;right:7px;top:calc(env(safe-area-inset-top) + 78px);bottom:calc(119px + env(safe-area-inset-bottom));width:auto}
#compass{top:calc(env(safe-area-inset-top) + 78px);left:auto;right:8px;transform:none;font-size:10px;padding:6px}
#controls{left:7px;right:7px;bottom:calc(7px + env(safe-area-inset-bottom));gap:4px}
.group{gap:5px}.pad{min-width:49px;height:53px;border-radius:10px;font-size:10px}.pad b{font-size:19px}.pad.fire{min-width:65px;height:65px}
#hint{display:none}#message{bottom:calc(98px + env(safe-area-inset-bottom));font-size:11px}
}
@media(max-width:375px){.pad{min-width:42px}.pad.fire{min-width:59px}}
</style>

<style id="british-voyage-ui">
/* Recolored and resized Kenney CC0 original UI & cartography sprites. */
:root{--gold:#e6c185;--white:#f5e7ca;--sub:#d1b995;--teal:#b1dfdf;--line:#b28c5a99;--panel:#3f2c21eF}
html,body{font-family:Georgia,"Times New Roman","Malgun Gothic",serif!important;background:#0d334a}
#top{background:linear-gradient(180deg,#2a2018fa,#453425dd);border-bottom:3px double #c6a46f;padding-bottom:11px}
#brand strong{color:#fae6b6;text-shadow:1px 2px #1a130f;font-variant:small-caps;letter-spacing:1.5px}
#brand small{color:#d4ac6b}
#details{background:linear-gradient(125deg,#e0c69aeb,#b99c74f0),url('./assets/cc0/ui/panel_brown.png') repeat;color:#291c13;border:9px solid transparent;border-image:url("./assets/cc0/ui/panel_border_brown_detail.png") 10 fill / 9px / 0 stretch;box-shadow:0 16px 55px #040c12db}
#panelHead{background:#3b2b1d;color:#f3d7a6;border-color:#9a7449}
#panelHead h2{color:#f2d3a0}
#content{color:#3b281a}

#content h3{color:#61391f;border-bottom:1px solid #a58054}
#content .kpi div{color:#4b321e;background:#e8cda53d;border-color:#906d4c}
#content .kpi b{color:#613b1c}
#content .action,.action{background:#725037 url("./assets/cc0/ui/button_brown.png") center/100% 100%;border-color:#a77f4e;color:#fff1d4;text-shadow:0 1px #3e281a}
#content .action.sub{background:#30445b;border-color:#7893a2}
.nav{border:2px solid #a68a5d;background:linear-gradient(100deg,#4b3325ee,#2b2926e9);color:#f3deba;border-radius:3px;font-family:Georgia,serif}
.nav.active{color:#fff0c7;background:#846342}
#compass{color:#f6dfa7;background:#3e2b22e8 url('./assets/cc0/map/compass.png') 7px center / 23px 23px no-repeat;border:2px solid #bca078;padding:7px 14px 7px 38px}
#message{color:#f4dfae;background:#30261de8;border:2px solid #b59360}
#joystick{width:126px;display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none}

#joystickLabel{font-family:Georgia,serif;color:#ead3ab;text-shadow:0 2px #101b24;font-size:12px}
#legacy-controls{display:none!important}
#controls{align-items:flex-end}
.pad{background:#46372adf;border:2px solid #bf9b65;border-radius:6px;color:#f8dfa8;font-family:Georgia,serif}
.pad.fire{border-color:#efb67b;background:#8d3f35}
.pad.music{min-width:53px}
#loading{background:radial-gradient(ellipse at 40% 20%,#4b604e,#162d39 70%,#0f1b24);color:#f6e4ba}
#loading h1{font-size:35px;color:#f8d393;background:url('./assets/cc0/ui/banner_classic_curtain.png') center / 100% 100% no-repeat;padding:20px 28px}
#loading .action{padding:15px 26px;font-size:17px}
#mapCanvas{border:4px solid #705032;background:#c1b390 url('./assets/cc0/map/textureWater.png') repeat}
.cc0-portrait{width:72px;height:72px;display:block;flex-shrink:0;border:5px double #96734a;background-color:#a88a67;background-image:url("./assets/cc0/portraits/rpgportraits.png");background-size:656px 224px;image-rendering:pixelated;background-repeat:no-repeat}
.crew-card{display:flex;gap:12px;align-items:center;padding:11px 3px;border-bottom:1px solid #836b4c}
.crew-name{font-size:16px;font-weight:bold}.crew-detail{color:#755333;font-size:12px;margin-top:4px}
.crew-lore{font-size:12px;line-height:1.55;margin-top:7px}
.scene-card{padding:15px;background:#e6cda753;border:2px solid #a48761;margin:9px 0}
.scene-card h3{margin-top:5px}
.port-scene{display:flex;gap:12px;align-items:center}

.cargo-badge{padding:3px 7px;border:1px solid #a48761;background:#e6d1ae99;border-radius:3px;font-size:11px}
@media(max-width:740px){
#top{padding-top:calc(7px + env(safe-area-inset-top))}#brand strong{font-size:16px}
#nav{top:calc(73px + env(safe-area-inset-top));width:51px}
#details{top:calc(77px + env(safe-area-inset-top));left:65px;right:5px;bottom:calc(118px + env(safe-area-inset-bottom))}
#joystick{width:108px}#joystickRim{width:102px;height:102px}#joystickHandle{width:44px;height:44px}
#joystickLabel{font-size:10px}#controls{bottom:calc(5px + env(safe-area-inset-bottom))}
.pad{min-width:43px;padding:3px;font-size:10px;height:53px}.pad.music{min-width:42px}

}

<body>
<canvas id="sea" aria-label="3D 바다와 항구, 이동하는 함선"></canvas><div id="veil"></div>
<header id="top">
 <div id="brand"><small>THE BRITISH VOYAGE · 1590</small><strong>푸른 항로</strong></div>
 <div id="status"><span class="stat"><small>항해일</small><b id="day">1일</b></span><span class="stat"><small>금화</small><b id="gold">3,400 G</b></span><span class="stat"><small>선체</small><b id="hull">100%</b></span><span class="stat extra"><small>식량 / 선원</small><b id="supplies">80 / 34</b></span></div>
</header>
<div id="compass">⚜ 영국 왕실 · 런던</div>
<nav id="nav" aria-label="게임 메뉴">
 <button class="nav" data-panel="port"><span>♜</span> 항구와 도시</button>
 <button class="nav" data-panel="crew"><span>♙</span> 선장 · 동료</button>
 <button class="nav" data-panel="inventory"><span>◈</span> 가방 · 화물</button>
 <button class="nav" data-panel="chart"><span>⌖</span> 해도 · 자동항해</button>
 <button class="nav" data-panel="market"><span>⚖</span> 교역소</button>
 <button class="nav" data-panel="fleet"><span>⚓</span> 함대 · 조선소</button>
 <button class="nav" data-panel="quests"><span>✦</span> 의뢰 · 탐험</button>
 <button class="nav" data-panel="journal"><span>☷</span> 항해 일지</button>
</nav>
<aside id="details" aria-label="게임 정보 창"><div id="panelHead"><h2 id="panelTitle">해도</h2><button id="close" class="icon" aria-label="닫기">✕</button></div><div id="content"></div></aside>
<div id="message" role="status" aria-live="polite">좌우로 방향을 바꾸고 전진해서 바다를 탐험해.</div>
<div id="hint">W / S 돛 · A / D 선회 · 스페이스 포격 · M 지도</div>
<div id="controls">
 <div class="group" id="joystickGroup"><div id="joystick" role="group" aria-label="범선 조종 스틱"><div id="joystickRim"><div id="joystickHandle"></div></div><span id="joystickLabel">조타 스틱</span></div><div id="legacy-controls" hidden>
  <button class="pad" data-hold="left" aria-label="좌현 선회"><b>↶</b>좌현</button>
  <button class="pad" data-hold="right" aria-label="우현 선회"><b>↷</b>우현</button>
  <button class="pad" data-hold="ahead" aria-label="전진"><b>↑</b>전진</button>
  <button class="pad" data-hold="astern" aria-label="후진"><b>↓</b>후진</button>
 </div></div>
 <div class="group">
  <button id="dock" class="pad dock"><b>⚓</b>입항</button>
  <button id="fire" class="pad fire"><b>✹</b>포격</button>
  <button id="music-toggle" class="pad music" aria-label="음악 재생 또는 중지"><b>♫</b>음악</button>
 </div>
</div>
<section id="loading"><div><h1>푸른 항로 · 영국편</h1><p>1590년, 런던 왕립항. 바다의 길을 열어라.<br>범선과 항구의 CC0 3D 모델을 불러오고 있어.</p><button id="start" class="action" style="margin-top:18px">항해 시작</button></div></section>
<audio id="sea-music" loop preload="none" src="./assets/cc0/music/pirate_ship_in_game.ogg"></audio>
<script type="module" src="./main.mjs"></script>
</body>
</html>
