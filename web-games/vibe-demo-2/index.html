<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6fc7ff"><title>나의 디펜스 실험실</title><style>html,body{margin:0;background:#16283d;color:#fff;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif}body{padding:10px}main{max-width:760px;margin:auto}.card{background:#223b56;border:2px solid #41617c;border-radius:18px;padding:12px}h1{font-size:24px;margin:0 0 6px}.sub{font-size:12px;color:#bcd3e6;margin:0 0 10px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.stat{padding:6px 9px;border-radius:10px;background:#304e6b;font-size:12px;font-weight:800}.game{position:relative;overflow:hidden;border-radius:14px;background:#9fc8a1}.game canvas{display:block;width:100%;height:auto;aspect-ratio:16/10}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:7px}.controls button{min-height:46px;border:0;border-radius:12px;background:#318fe8;color:#fff;font-size:16px;font-weight:900}.hint{font-size:11px;color:#bcd3e6;margin:8px 2px 0}</style></head><body><main><div class="card"><h1>🛡️ 나의 디펜스 실험실</h1><p class="sub">포탑을 세우고 적을 막아봐.</p><div class="bar"><span class="stat" id="hp">성벽 100</span><span class="stat" id="gold">골드 50</span><span class="stat" id="wave">웨이브 1</span></div><div class="game"><canvas id="c" width="960" height="600"></canvas></div><div class="controls"><button id="left">←</button><button id="build">포탑 설치</button><button id="right">→</button></div><p class="hint">좌우로 움직이고, 포탑을 설치해. 자동 저장은 이 시연 게임에선 단순 상태 저장으로 처리해.</p></div></main><script>(function(){const c=document.getElementById('c'),x=c.getContext('2d'),hpEl=document.getElementById('hp'),goldEl=document.getElementById('gold'),waveEl=document.getElementById('wave');let hp=100,gold=50,wave=1,playerX=480,enemies=[],turrets=[],last=0,keys=new Set();function spawn(){enemies.push({x:900+Math.random()*50,y:500-Math.random()*260,hp:25,s:30})}function shoot(){for(const t of turrets){const e=enemies.find(v=>v.hp>0);if(!e)continue;e.hp-=10;if(e.hp<=0)gold+=3}}function update(dt,now){if(keys.has('ArrowLeft'))playerX-=180*dt;if(keys.has('ArrowRight'))playerX+=180*dt;playerX=Math.max(30,Math.min(930,playerX));if(now-last>1800){last=now;for(let i=0;i<2;i++)spawn();wave=Math.min(99,wave+1);waveEl.textContent='웨이브 '+wave}for(const e of enemies){e.x-=e.s*dt;if(e.x<70){hp=Math.max(0,hp-5);e.hp=0}}shoot();enemies=enemies.filter(e=>e.hp>0);hpEl.textContent='성벽 '+Math.ceil(hp);goldEl.textContent='골드 '+gold}function render(){x.clearRect(0,0,c.width,c.height);x.fillStyle='#8fbf8e';x.fillRect(0,0,c.width,c.height);x.fillStyle='#66835d';x.fillRect(0,520,c.width,80);x.fillStyle='#6f7d8c';x.fillRect(40,250,55,270);x.fillStyle='#adc2d5';x.fillRect(47,310,41,210);x.fillStyle='#3b7ee8';x.beginPath();x.arc(playerX,500,18,0,Math.PI*2);x.fill();for(const t of turrets){x.fillStyle='#5b4cc0';x.fillRect(t.x-16,484,32,36);x.fillStyle='#f6d266';x.fillRect(t.x-5,464,10,20)}for(const e of enemies){x.fillStyle='#d85f5f';x.beginPath();x.arc(e.x,e.y,16,0,Math.PI*2);x.fill();x.fillStyle='#18253a';x.fillRect(e.x-16,e.y-24,32,4);x.fillStyle='#63d16d';x.fillRect(e.x-16,e.y-24,32*Math.max(0,e.hp/25),4)}if(hp<=0){x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,0,c.width,c.height);x.fillStyle='#fff';x.font='900 44px system-ui';x.fillText('게임오버',385,300)}}function loop(now){const dt=Math.min(.05,(now-(loop.last||now))/1000);loop.last=now;if(hp>0)update(dt,now);render();requestAnimationFrame(loop)}window.addEventListener('keydown',e=>keys.add(e.key));window.addEventListener('keyup',e=>keys.delete(e.key));left.onpointerdown=()=>keys.add('ArrowLeft');left.onpointerup=()=>keys.delete('ArrowLeft');right.onpointerdown=()=>keys.add('ArrowRight');right.onpointerup=()=>keys.delete('ArrowRight');build.onclick=()=>{if(gold<20)return;gold-=20;turrets.push({x:playerX});goldEl.textContent='골드 '+gold};requestAnimationFrame(loop)})();</script></body></html>
