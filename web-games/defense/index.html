<!doctype html>
<html lang="ko" data-disable-universal-touch="true">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#15261e">
<title>숲길 디펜스</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101a15;color:#fff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;touch-action:manipulation}
button{font:inherit}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;background:#183426}
.hud{position:fixed;z-index:20;left:7px;right:7px;top:max(7px,env(safe-area-inset-top));display:flex;gap:6px;justify-content:space-between;pointer-events:none}
.panel{background:#102019e8;border:1px solid #476a54;border-radius:12px;box-shadow:0 4px 12px #0007}
.stats{display:flex;gap:5px;flex-wrap:wrap;padding:6px}.pill{padding:4px 7px;border-radius:999px;background:#223b2d;border:1px solid #557564;font-size:10px;font-weight:900}.gold{background:#725f22;color:#fff4b0}.hp{background:#5f2e32;color:#ffd7d9}
.wavebox{padding:6px 9px;text-align:right}.wavebox b{display:block;font-size:11px}.wavebox small{font-size:9px;color:#b9d1c2}
.message{position:fixed;z-index:21;left:50%;top:61px;transform:translateX(-50%);max-width:88vw;padding:6px 9px;border-radius:999px;background:#0e1814df;border:1px solid #43634f;font-size:10px;font-weight:800;text-align:center;pointer-events:none}
.bottom{position:fixed;z-index:30;left:0;right:0;bottom:0;padding:7px 7px max(9px,env(safe-area-inset-bottom));background:#0e1b16f3;border-top:1px solid #42604e}
.builds{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.builds::-webkit-scrollbar{display:none}
.build{flex:1;min-width:92px;border:2px solid #385845;border-radius:11px;background:#193427;color:#fff;padding:7px 5px;min-height:54px;font-weight:900}
.build b,.build small{display:block}.build b{font-size:11px}.build small{font-size:8px;color:#b9cfbf;margin-top:2px}.build.on{outline:3px solid #ffe082;background:#31563f}.build:disabled{opacity:.45}
.tools{display:flex;gap:6px;margin-top:6px}.tools button{min-height:36px;border:1px solid #496a56;border-radius:9px;background:#203d2e;color:#fff;font-size:10px;font-weight:900}.tools #startWave{flex:1;background:#6d5d1e;color:#fff7bd}.tools #pause{width:72px}
.towerPanel{position:fixed;z-index:40;left:9px;right:9px;bottom:94px;padding:8px;background:#102019f2;border:1px solid #51735f;border-radius:12px;display:none}.towerPanel.on{display:block}.towerTitle{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;font-weight:900}.towerActions{display:flex;gap:6px;margin-top:7px}.towerActions button{flex:1;min-height:34px;border:1px solid #5b7867;border-radius:8px;background:#244734;color:#fff;font-size:10px;font-weight:900}
.overlay{position:fixed;z-index:100;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:#07100cdc}.overlay[hidden]{display:none}.card{width:min(94vw,480px);padding:18px 15px;background:#14251c;border:2px solid #577665;border-radius:18px;text-align:center;box-shadow:0 10px 35px #0009}.card h1{margin:0 0 6px;font-size:26px}.card p{margin:6px 0;color:#c1d5c7;font-size:12px;line-height:1.55}.start{width:100%;min-height:46px;margin-top:12px;border:2px solid #6d5f24;border-radius:12px;background:#d9bd4a;color:#182015;font-size:13px;font-weight:1000}.mini{margin-top:8px;padding:8px;border-radius:10px;background:#0d1b14;color:#b9cfbf;font-size:10px}
.toast{position:fixed;z-index:120;left:50%;top:18%;transform:translate(-50%,-8px);padding:8px 11px;border-radius:10px;background:#f4ffe9;color:#142014;font-size:10px;font-weight:900;opacity:0;transition:.18s;pointer-events:none}.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:380px){.build{min-width:84px;padding:6px 3px}.pill{font-size:9px}.message{font-size:9px}}
</style>
</head>
<body>
<!-- 파일명: web-games/defense/index.html -->
<canvas id="game"></canvas>

<div class="hud">
  <div class="stats panel">
    <span class="pill gold" id="gold">골드 240</span>
    <span class="pill hp" id="hp">기지 20</span>
    <span class="pill" id="enemyCount">적 0</span>
  </div>
  <div class="wavebox panel"><b id="wave">웨이브 0 / 10</b><small id="best">최고 0</small></div>
</div>
<div class="message" id="message">타워를 고르고 빈 발판을 눌러 설치해</div>

<div class="towerPanel" id="towerPanel">
  <div class="towerTitle"><span id="towerTitle">타워</span><span id="towerStats"></span></div>
  <div class="towerActions"><button id="upgrade">강화</button><button id="sell">판매</button><button id="closeTower">닫기</button></div>
</div>

<div class="bottom" id="bottom">
  <div class="builds">
    <button class="build" data-build="archer"><b>🏹 궁수 타워 · 80</b><small>빠른 단일 공격</small></button>
    <button class="build" data-build="cannon"><b>💣 대포 타워 · 140</b><small>느리지만 범위 공격</small></button>
    <button class="build" data-build="frost"><b>❄️ 빙결 타워 · 120</b><small>적 이동속도 감소</small></button>
  </div>
  <div class="tools"><button id="startWave">웨이브 시작</button><button id="pause">일시정지</button></div>
</div>

<div class="overlay" id="startOverlay">
  <div class="card">
    <h1>숲길 디펜스</h1>
    <p>적이 숲길 끝의 기지에 도착하기 전에 타워로 막아.<br>5·10웨이브에는 보스가 등장해.</p>
    <div class="mini">궁수 = 빠른 단일 공격 · 대포 = 범위 피해 · 빙결 = 둔화</div>
    <button class="start" id="startGame">게임 시작</button>
  </div>
</div>

<div class="overlay" id="endOverlay" hidden>
  <div class="card">
    <h1 id="endTitle">게임 종료</h1>
    <p id="endText"></p>
    <button class="start" id="restart">다시 시작</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(()=>{
'use strict';

// ===== 기본 =====
const C=document.getElementById('game'),X=C.getContext('2d'),q=id=>document.getElementById(id);
const KEY='jaewoon-defense-v1',MAX_WAVE=10;
let W=0,H=0,DPR=1,last=0,raf=0,toastTimer=0,selectedBuild=null,selectedTower=null;
let state=null;

const TOWERS={
  archer:{name:'궁수 타워',cost:80,range:150,damage:18,rate:.46,projectile:520},
  cannon:{name:'대포 타워',cost:140,range:135,damage:42,rate:1.35,projectile:350,splash:56},
  frost:{name:'빙결 타워',cost:120,range:130,damage:9,rate:.8,projectile:420,slow:.55,slowTime:1.4}
};

const ENEMY_TYPES={
  grunt:{name:'숲 고블린',hp:80,speed:42,reward:16,damage:1,size:13},
  runner:{name:'그림자 러너',hp:58,speed:70,reward:18,damage:1,size:11},
  tank:{name:'돌갑옷 오우거',hp:230,speed:27,reward:34,damage:2,size:17},
  boss:{name:'고대 숲 거인',hp:1100,speed:22,reward:180,damage:5,size:25,boss:true}
};

const PATH_N=[
  [-.07,.23],[.17,.23],[.17,.48],[.48,.48],[.48,.25],[.78,.25],[.78,.67],[1.07,.67]
];
const PADS_N=[
  [.08,.11],[.29,.16],[.31,.37],[.08,.58],[.34,.62],
  [.58,.12],[.62,.38],[.89,.15],[.90,.42],[.62,.72],[.43,.76],[.88,.80]
];

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function loadBest(){try{return Math.max(0,Number(JSON.parse(localStorage.getItem(KEY)||'{}').best)||0)}catch(e){return 0}}
function saveBest(){try{localStorage.setItem(KEY,JSON.stringify({best:Math.max(loadBest(),state.wave)}))}catch(e){}}
function toast(t){const el=q('toast');el.textContent=t;el.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('on'),1100)}
function resize(){
  DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;
  C.width=Math.round(W*DPR);C.height=Math.round(H*DPR);C.style.width=W+'px';C.style.height=H+'px';
  X.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize,{passive:true});resize();

function pathPoints(){return PATH_N.map(p=>({x:p[0]*W,y:p[1]*H}))}
function pads(){return PADS_N.map((p,i)=>({id:i,x:p[0]*W,y:p[1]*H}))}
function dist(a,b,c,d){return Math.hypot(a-c,b-d)}
function fresh(){
  return{
    running:true,paused:false,wave:0,gold:240,baseHp:20,enemies:[],towers:[],shots:[],
    spawn:[],spawnTimer:0,inWave:false,cleared:false,time:0
  }
}
function updateHud(){
  q('gold').textContent='골드 '+Math.floor(state.gold);
  q('hp').textContent='기지 '+Math.max(0,state.baseHp);
  q('enemyCount').textContent='적 '+state.enemies.length+(state.spawn.length?' +'+state.spawn.length:'');
  q('wave').textContent='웨이브 '+state.wave+' / '+MAX_WAVE;
  q('best').textContent='최고 '+loadBest();
  q('startWave').disabled=state.inWave||state.wave>=MAX_WAVE||state.baseHp<=0;
  q('startWave').textContent=state.inWave?'전투 중':(state.wave>=MAX_WAVE?'최종 웨이브 완료':'웨이브 시작');
  document.querySelectorAll('[data-build]').forEach(b=>{
    const t=TOWERS[b.dataset.build];
    b.disabled=state.gold<t.cost||state.baseHp<=0;
    b.classList.toggle('on',selectedBuild===b.dataset.build);
  });
  updateTowerPanel();
}

function buildWave(n){
  const list=[],count=6+n*2;
  for(let i=0;i<count;i++){
    let type='grunt';
    if(n>=2&&i%4===2)type='runner';
    if(n>=3&&i%5===4)type='tank';
    list.push(type);
  }
  if(n===5||n===10)list.push('boss');
  return list;
}
function startWave(){
  if(state.inWave||state.wave>=MAX_WAVE||state.baseHp<=0)return;
  state.wave++;
  state.spawn=buildWave(state.wave);
  state.spawnTimer=.25;
  state.inWave=true;
  q('message').textContent=(state.wave===5||state.wave===10)?'보스 웨이브!':'웨이브 '+state.wave+' 시작';
  updateHud();
}
function spawnEnemy(type){
  const b=ENEMY_TYPES[type],scale=1+(state.wave-1)*.12;
  const p=pathPoints()[0];
  state.enemies.push({
    type,x:p.x,y:p.y,pathIndex:1,progress:0,
    hp:Math.round(b.hp*scale),maxHp:Math.round(b.hp*scale),
    speed:b.speed*(1+Math.min(.35,(state.wave-1)*.025)),
    reward:Math.round(b.reward*(1+(state.wave-1)*.06)),
    damage:b.damage,size:b.size,slowUntil:0,slowMult:1,boss:!!b.boss,flash:0
  });
}
function enemyProgress(e){
  return e.pathIndex+e.progress;
}
function moveEnemies(dt){
  const pp=pathPoints();
  for(let i=state.enemies.length-1;i>=0;i--){
    const e=state.enemies[i];
    if(e.slowUntil<state.time)e.slowMult=1;
    let remain=e.speed*e.slowMult*dt;
    while(remain>0&&e.pathIndex<pp.length){
      const to=pp[e.pathIndex],dx=to.x-e.x,dy=to.y-e.y,d=Math.hypot(dx,dy)||1;
      if(remain>=d){
        e.x=to.x;e.y=to.y;remain-=d;e.pathIndex++;e.progress=0;
      }else{
        e.x+=dx/d*remain;e.y+=dy/d*remain;e.progress+=remain/d;remain=0;
      }
    }
    e.flash=Math.max(0,e.flash-dt*4);
    if(e.pathIndex>=pp.length){
      state.baseHp-=e.damage;
      state.enemies.splice(i,1);
      toast('기지 피해 -'+e.damage);
      if(state.baseHp<=0){endGame(false);return}
    }
  }
}
function towerStats(t){
  const b=TOWERS[t.type],m=1+(t.level-1)*.45;
  return{
    range:b.range+(t.level-1)*8,
    damage:Math.round(b.damage*m),
    rate:Math.max(.22,b.rate*(1-(t.level-1)*.10)),
    projectile:b.projectile,
    splash:b.splash||0,
    slow:b.slow||0,
    slowTime:b.slowTime||0
  }
}
function updateTowers(dt){
  for(const t of state.towers){
    t.cd=Math.max(0,t.cd-dt);
    if(t.cd>0)continue;
    const s=towerStats(t);
    let target=null,best=-1;
    for(const e of state.enemies){
      if(dist(t.x,t.y,e.x,e.y)<=s.range){
        const pr=enemyProgress(e);
        if(pr>best){best=pr;target=e}
      }
    }
    if(!target)continue;
    t.cd=s.rate;
    state.shots.push({x:t.x,y:t.y,target,damage:s.damage,speed:s.projectile,type:t.type,splash:s.splash,slow:s.slow,slowTime:s.slowTime});
  }
}
function updateShots(dt){
  for(let i=state.shots.length-1;i>=0;i--){
    const s=state.shots[i],e=s.target;
    if(!state.enemies.includes(e)){state.shots.splice(i,1);continue}
    const dx=e.x-s.x,dy=e.y-s.y,d=Math.hypot(dx,dy)||1,step=s.speed*dt;
    if(step>=d){
      hitEnemy(e,s);
      state.shots.splice(i,1);
    }else{
      s.x+=dx/d*step;s.y+=dy/d*step;
    }
  }
}
function hitEnemy(e,s){
  if(s.splash>0){
    for(const x of [...state.enemies])if(dist(e.x,e.y,x.x,x.y)<=s.splash)damageEnemy(x,s.damage,s);
  }else damageEnemy(e,s.damage,s);
}
function damageEnemy(e,dmg,shot){
  if(!state.enemies.includes(e))return;
  e.hp-=dmg;e.flash=1;
  if(shot.slow){e.slowMult=Math.min(e.slowMult,shot.slow);e.slowUntil=state.time+shot.slowTime}
  if(e.hp<=0){
    state.gold+=e.reward;
    const idx=state.enemies.indexOf(e);if(idx>=0)state.enemies.splice(idx,1);
  }
}
function checkWaveEnd(){
  if(state.inWave&&state.spawn.length===0&&state.enemies.length===0){
    state.inWave=false;
    state.gold+=55+state.wave*12;
    saveBest();
    if(state.wave>=MAX_WAVE){endGame(true);return}
    q('message').textContent='웨이브 '+state.wave+' 클리어 · 다음 준비';
    toast('클리어 보너스 +'+(55+state.wave*12));
  }
}
function endGame(win){
  state.running=false;state.inWave=false;saveBest();
  q('endTitle').textContent=win?'방어 성공!':'기지 함락';
  q('endText').textContent=win?'10웨이브를 전부 막았어.':'웨이브 '+state.wave+'에서 기지가 무너졌어.';
  q('endOverlay').hidden=false;
  updateHud();
}

function towerAtPad(id){return state.towers.find(t=>t.pad===id)}
function buildAt(id){
  if(!selectedBuild)return false;
  if(towerAtPad(id))return false;
  const def=TOWERS[selectedBuild];
  if(state.gold<def.cost){toast('골드가 부족해');return false}
  const p=pads().find(x=>x.id===id);
  state.gold-=def.cost;
  state.towers.push({pad:id,type:selectedBuild,x:p.x,y:p.y,level:1,cd:0,spent:def.cost});
  toast(def.name+' 설치');
  selectedBuild=null;
  updateHud();
  return true;
}
function selectTower(t){
  selectedTower=t;selectedBuild=null;document.querySelectorAll('[data-build]').forEach(b=>b.classList.remove('on'));updateTowerPanel();
}
function updateTowerPanel(){
  const p=q('towerPanel');
  if(!selectedTower||!state.towers.includes(selectedTower)){selectedTower=null;p.classList.remove('on');return}
  const t=selectedTower,s=towerStats(t),nextCost=t.level>=3?Infinity:Math.round(TOWERS[t.type].cost*(.8+t.level*.55));
  q('towerTitle').textContent=TOWERS[t.type].name+' Lv.'+t.level;
  q('towerStats').textContent='공격 '+s.damage+' · 사거리 '+Math.round(s.range);
  q('upgrade').disabled=t.level>=3||state.gold<nextCost;
  q('upgrade').textContent=t.level>=3?'강화 MAX':'강화 '+nextCost;
  q('sell').textContent='판매 +'+Math.round(t.spent*.65);
  p.classList.add('on');
}
q('upgrade').onclick=()=>{
  if(!selectedTower)return;
  const t=selectedTower,cost=t.level>=3?Infinity:Math.round(TOWERS[t.type].cost*(.8+t.level*.55));
  if(state.gold<cost||t.level>=3)return;
  state.gold-=cost;t.spent+=cost;t.level++;toast('Lv.'+t.level+' 강화');updateHud()
};
q('sell').onclick=()=>{
  if(!selectedTower)return;
  const gain=Math.round(selectedTower.spent*.65);state.gold+=gain;
  state.towers=state.towers.filter(t=>t!==selectedTower);selectedTower=null;toast('판매 +'+gain);updateHud()
};
q('closeTower').onclick=()=>{selectedTower=null;updateTowerPanel()};

function pickPointer(clientX,clientY){
  const ps=pads();
  let nearest=null,nd=9999;
  for(const p of ps){const d=dist(clientX,clientY,p.x,p.y);if(d<nd){nd=d;nearest=p}}
  if(nearest&&nd<34){
    const t=towerAtPad(nearest.id);
    if(t)selectTower(t);
    else buildAt(nearest.id);
    return;
  }
  selectedTower=null;updateTowerPanel();
}
C.addEventListener('pointerdown',e=>{e.preventDefault();pickPointer(e.clientX,e.clientY)},{passive:false});

document.querySelectorAll('[data-build]').forEach(b=>b.addEventListener('click',()=>{
  const id=b.dataset.build;
  if(state.gold<TOWERS[id].cost)return;
  selectedBuild=selectedBuild===id?null:id;selectedTower=null;
  q('message').textContent=selectedBuild?'빈 발판을 눌러 '+TOWERS[id].name+' 설치':'타워를 골라 설치해';
  updateHud();
}));
q('startWave').onclick=startWave;
q('pause').onclick=()=>{
  state.paused=!state.paused;q('pause').textContent=state.paused?'계속':'일시정지';q('message').textContent=state.paused?'일시정지':'전투 계속'
};

function roundedRect(x,y,w,h,r){
  X.beginPath();X.roundRect(x,y,w,h,r);X.fill()
}
function drawWorld(){
  const g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#355f45');g.addColorStop(.5,'#264a36');g.addColorStop(1,'#172b21');X.fillStyle=g;X.fillRect(0,0,W,H);
  // 멀리 산/숲
  X.fillStyle='#1c3b2a';X.beginPath();X.moveTo(0,H*.18);
  for(let x=0;x<=W;x+=70)X.lineTo(x,H*.14-Math.sin(x*.018)*22);
  X.lineTo(W,H*.42);X.lineTo(0,H*.42);X.fill();
  // 나무 그림자와 수관
  for(let i=0;i<18;i++){
    const x=((i*83+37)%Math.max(1,W)),y=H*(.12+((i*47)%60)/100);
    X.fillStyle='#0b1c13aa';X.beginPath();X.ellipse(x+7,y+12,18,8,0,0,Math.PI*2);X.fill();
    X.fillStyle='#143923';X.fillRect(x-3,y-5,6,22);
    X.fillStyle=i%2?'#2e623d':'#387349';X.beginPath();X.arc(x,y-8,14+(i%3)*3,0,Math.PI*2);X.fill();
  }
  // 길: 그림자 + 상단
  const p=pathPoints();
  X.lineCap='round';X.lineJoin='round';
  X.strokeStyle='#0c1510aa';X.lineWidth=48;X.beginPath();X.moveTo(p[0].x+5,p[0].y+8);for(let i=1;i<p.length;i++)X.lineTo(p[i].x+5,p[i].y+8);X.stroke();
  X.strokeStyle='#8d7b58';X.lineWidth=42;X.beginPath();X.moveTo(p[0].x,p[0].y);for(let i=1;i<p.length;i++)X.lineTo(p[i].x,p[i].y);X.stroke();
  X.strokeStyle='#ad9a71';X.lineWidth=28;X.beginPath();X.moveTo(p[0].x,p[0].y-3);for(let i=1;i<p.length;i++)X.lineTo(p[i].x,p[i].y-3);X.stroke();
  // 기지
  const end=p[p.length-1];
  X.fillStyle='#07100baa';X.fillRect(end.x-43,end.y-21,47,47);
  X.fillStyle='#7b8f8b';X.fillRect(end.x-48,end.y-30,46,42);X.fillStyle='#a7b8b2';X.fillRect(end.x-44,end.y-34,11,11);X.fillRect(end.x-17,end.y-34,11,11);
  X.fillStyle='#4d2c28';X.fillRect(end.x-31,end.y-15,12,27);
  // 발판
  for(const p0 of pads()){
    const occupied=towerAtPad(p0.id);
    X.fillStyle='#07100b66';X.beginPath();X.ellipse(p0.x+4,p0.y+8,24,10,0,0,Math.PI*2);X.fill();
    X.fillStyle=occupied?'#4c5c51':'#568464';X.beginPath();X.ellipse(p0.x,p0.y,22,10,0,0,Math.PI*2);X.fill();
    X.strokeStyle=occupied?'#26372d':'#95c19f';X.lineWidth=2;X.stroke();
  }
}
function drawTowers(){
  for(const t of state.towers){
    const s=towerStats(t),sel=t===selectedTower;
    if(sel){X.strokeStyle='#ffe082';X.lineWidth=2;X.beginPath();X.arc(t.x,t.y,s.range,0,Math.PI*2);X.stroke()}
    X.fillStyle='#06100a88';X.beginPath();X.ellipse(t.x+5,t.y+10,16,7,0,0,Math.PI*2);X.fill();
    X.fillStyle=t.type==='archer'?'#6e855e':t.type==='cannon'?'#555f59':'#628ca6';
    X.fillRect(t.x-10,t.y-23,20,24);
    X.fillStyle=t.type==='archer'?'#a9c47f':t.type==='cannon'?'#8d9690':'#a9e4ff';
    X.beginPath();X.arc(t.x,t.y-25,11,0,Math.PI*2);X.fill();
    if(t.type==='archer'){X.strokeStyle='#e7d6a4';X.lineWidth=3;X.beginPath();X.moveTo(t.x,t.y-25);X.lineTo(t.x+17,t.y-34);X.stroke()}
    if(t.type==='cannon'){X.strokeStyle='#222';X.lineWidth=7;X.beginPath();X.moveTo(t.x,t.y-25);X.lineTo(t.x+19,t.y-25);X.stroke()}
    if(t.type==='frost'){X.fillStyle='#d9f6ff';X.beginPath();X.moveTo(t.x,t.y-42);X.lineTo(t.x+8,t.y-29);X.lineTo(t.x,t.y-17);X.lineTo(t.x-8,t.y-29);X.closePath();X.fill()}
    X.fillStyle='#fff';X.font='800 9px system-ui';X.textAlign='center';X.fillText('Lv.'+t.level,t.x,t.y+20)
  }
}
function drawEnemies(){
  for(const e of state.enemies){
    X.fillStyle='#07100b88';X.beginPath();X.ellipse(e.x+4,e.y+e.size*.65,e.size*.9,e.size*.42,0,0,Math.PI*2);X.fill();
    X.fillStyle=e.flash>0?'#fff':e.boss?'#72513b':e.type==='runner'?'#493f68':e.type==='tank'?'#59665c':'#587943';
    X.beginPath();X.arc(e.x,e.y-e.size*.15,e.size,0,Math.PI*2);X.fill();
    if(e.boss){X.fillStyle='#c6a665';X.fillRect(e.x-e.size*.8,e.y-e.size*1.3,e.size*1.6,6)}
    const w=e.size*2.2;X.fillStyle='#241315';X.fillRect(e.x-w/2,e.y-e.size-10,w,4);X.fillStyle='#e16a62';X.fillRect(e.x-w/2,e.y-e.size-10,w*clamp(e.hp/e.maxHp,0,1),4);
    if(e.slowMult<1){X.strokeStyle='#a8ebff';X.lineWidth=2;X.beginPath();X.arc(e.x,e.y,e.size+4,0,Math.PI*2);X.stroke()}
  }
}
function drawShots(){
  for(const s of state.shots){
    X.fillStyle=s.type==='frost'?'#b8f0ff':s.type==='cannon'?'#20241f':'#ffe5a1';
    X.beginPath();X.arc(s.x,s.y-5,s.type==='cannon'?5:3,0,Math.PI*2);X.fill();
  }
}
function render(){
  X.clearRect(0,0,W,H);drawWorld();drawTowers();drawEnemies();drawShots()
}

function tick(ts){
  const dt=Math.min(.033,Math.max(0,(ts-last)/1000||0));last=ts;
  if(state&&state.running&&!state.paused){
    state.time+=dt;
    if(state.inWave&&state.spawn.length){
      state.spawnTimer-=dt;
      if(state.spawnTimer<=0){
        spawnEnemy(state.spawn.shift());
        state.spawnTimer=.72;
      }
    }
    moveEnemies(dt);updateTowers(dt);updateShots(dt);checkWaveEnd();updateHud();
  }
  if(state)render();
  raf=requestAnimationFrame(tick);
}

function startGame(){
  state=fresh();selectedBuild=null;selectedTower=null;q('startOverlay').hidden=true;q('endOverlay').hidden=true;q('pause').textContent='일시정지';q('message').textContent='타워를 고르고 빈 발판을 눌러 설치해';updateHud()
}
q('startGame').onclick=startGame;q('restart').onclick=startGame;
state=fresh();state.running=false;updateHud();raf=requestAnimationFrame(tick);
})();
</script>
</body>
</html>
