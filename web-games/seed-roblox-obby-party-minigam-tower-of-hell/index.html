<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Skyline Sprint</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#09111f;color:#f5f7fb;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{overflow-x:hidden}.shell{width:min(100%,720px);margin:0 auto;padding:12px;min-height:100vh;background:linear-gradient(#12213a,#09111f)}header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.title h1{margin:0;font-size:24px}.title p{margin:3px 0 0;color:#a9bad4;font-size:12px}.hud{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px}.hud div{background:#101c31;border:1px solid #29405f;border-radius:10px;padding:7px;text-align:center;font-size:11px}.hud b{display:block;font-size:16px}.world{position:relative;height:430px;overflow:hidden;border:1px solid #315078;border-radius:16px;background:linear-gradient(#163152 0 55%,#10182a 55%);touch-action:none}.sky{position:absolute;inset:0;background:linear-gradient(180deg,#18395f,#224765 55%,#111827 56%);overflow:hidden}.building{position:absolute;bottom:0;background:#17233a;border-top:2px solid #315078}.building::after{content:"";position:absolute;inset:8px;background:repeating-linear-gradient(90deg,transparent 0 16px,#5fb7ff33 17px 19px),repeating-linear-gradient(0deg,transparent 0 18px,#5fb7ff22 19px 21px)}.track{position:absolute;left:0;top:0;width:2100px;height:100%;transform:translateX(calc(var(--camera-x,0) * -1px));transition:transform .06s linear}.platform{position:absolute;height:16px;border-radius:7px;background:#cbd5e1;border:2px solid #e2e8f0;box-shadow:0 5px 0 #64748b}.platform.moving{background:#67e8f9;border-color:#cffafe}.platform.fade{background:#c084fc;border-color:#f3e8ff}.platform.goal{background:#facc15;border-color:#fef08a}.hazard{position:absolute;width:34px;height:22px;background:#ef4444;clip-path:polygon(0 100%,20% 0,40% 100%,60% 0,80% 100%,100% 0,100% 100%)}.checkpoint{position:absolute;width:7px;height:60px;background:#22c55e;border-radius:4px}.checkpoint::after{content:"CHECK";position:absolute;left:8px;top:3px;font-size:9px;color:#bbf7d0;font-weight:800}.player{position:absolute;width:28px;height:36px;border-radius:9px 9px 7px 7px;background:#60a5fa;border:3px solid #dbeafe;z-index:10;left:calc(var(--player-screen-x,60) * 1px);top:calc(var(--player-screen-y,330) * 1px);transition:left .05s linear,top .05s linear}.player::before{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:#0f172a;left:5px;top:8px;box-shadow:10px 0 #0f172a}.zone-label{position:absolute;top:9px;left:12px;padding:5px 8px;border-radius:999px;background:#07101dcc;border:1px solid #41658d;font-size:11px;font-weight:800}.objective{position:absolute;right:12px;top:9px;max-width:210px;padding:5px 8px;border-radius:9px;background:#07101dcc;border:1px solid #41658d;font-size:10px}.game-controls{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}.game-controls button,.touch-controls button,.audio-controls button,.retry{min-height:48px;border:0;border-radius:12px;background:#e7f0ff;color:#0f172a;font-weight:800;padding:8px}.game-controls button:active,.touch-controls button:active{transform:translateY(1px)}.game-controls button[data-scope-id]{outline:1px solid #93c5fd}.game-controls .finish{background:#fef08a}.touch-controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:8px}.touch-controls button{background:#1e314d;color:#e5efff;border:1px solid #345879}.audio-controls{display:grid;grid-template-columns:120px 1fr;gap:9px;align-items:center;margin-top:8px;padding:9px;background:#101c31;border-radius:12px}.audio-controls input{width:100%}.message{margin-top:8px;min-height:38px;padding:9px;border-radius:10px;background:#101c31;border:1px solid #29405f;font-size:12px;line-height:1.4}.retry{margin-top:8px;width:100%;background:#dcfce7}.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;color:#9fb0c9;font-size:10px}.legend span{padding:3px 7px;background:#101c31;border-radius:999px}@media(max-width:480px){.hud{grid-template-columns:repeat(3,1fr)}.world{height:390px}.game-controls{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body data-run-result="running" data-audio-state="locked" data-approved-scope-count="5">
<main class="shell" data-web-artifact-type="REAL_PLAYABLE_GAME" data-playable-cycle-contract="ONE_COMPLETE_PLAYABLE_GAMEPLAY_CYCLE" data-gameplay-system-count="8">
<header><div class="title"><h1>Skyline Sprint</h1><p>옥상 12구간을 달려 정상 체크포인트까지 도달하라.</p></div><div id="roundLabel">ROUND 1</div></header>
<section class="hud" data-state="running" data-score="0" data-progress="0"><div><b id="score">0</b>점수</div><div><b id="hp">3</b>목숨</div><div><b id="stage">1</b>스테이지</div><div><b id="level">1</b>속도 LV</div><div><b id="coins">0</b>코인</div></section>
<section class="world" id="world" data-gameplay-surface data-area="rooftops"><div class="sky"><div class="building" style="left:0;width:115px;height:120px"></div><div class="building" style="left:135px;width:98px;height:180px"></div><div class="building" style="left:250px;width:135px;height:145px"></div><div class="building" style="left:405px;width:110px;height:205px"></div><div class="building" style="left:540px;width:150px;height:165px"></div></div><div class="track" id="track"><div class="platform" style="left:25px;top:360px;width:150px"></div><div class="platform" style="left:205px;top:330px;width:125px"></div><div class="hazard" style="left:340px;top:346px"></div><div class="platform" style="left:385px;top:300px;width:110px"></div><div class="checkpoint" style="left:490px;top:242px"></div><div class="platform moving" style="left:535px;top:275px;width:100px"></div><div class="hazard" style="left:655px;top:326px"></div><div class="platform" style="left:700px;top:310px;width:125px"></div><div class="platform fade" style="left:855px;top:270px;width:95px"></div><div class="checkpoint" style="left:945px;top:212px"></div><div class="platform" style="left:990px;top:285px;width:130px"></div><div class="hazard" style="left:1140px;top:326px"></div><div class="platform moving" style="left:1190px;top:250px;width:110px"></div><div class="checkpoint" style="left:1290px;top:192px"></div><div class="platform" style="left:1340px;top:265px;width:130px"></div><div class="platform fade" style="left:1505px;top:225px;width:100px"></div><div class="hazard" style="left:1620px;top:326px"></div><div class="checkpoint" style="left:1660px;top:172px"></div><div class="platform" style="left:1710px;top:240px;width:135px"></div><div class="platform goal" style="left:1890px;top:200px;width:160px"></div></div><div id="player" class="player" data-player="runner" data-character="player" data-player-x="60" data-player-y="330" data-collision-enabled="true" data-collision-count="0" data-camera-active="true" data-camera-x="0" data-camera-y="0" data-route-id="stage-1"></div><div id="zone" class="zone-label" data-zone="rooftops">ROOFTOPS</div><div id="objective" class="objective" data-objective="reach-checkpoint-1">다음 체크포인트까지 이동</div></section>
<section class="game-controls" aria-label="게임 조작"><button data-gameplay-action data-scope-id="scope-corefun-5fe4e45e2f" data-mechanic-id="round-start" id="startRound">라운드 출발</button><button data-gameplay-action data-scope-id="scope-coreloop-0-a308868121" data-mechanic-id="lane-move" id="runForward">앞으로 달리기</button><button data-gameplay-action data-scope-id="scope-coreloop-1-7a2dd10fe3" data-mechanic-id="hazard-jump" id="jumpHazard">장애물 점프</button><button data-gameplay-action data-scope-id="scope-coreloop-2-c23e57ccd6" data-mechanic-id="checkpoint-reward" id="claimCheckpoint">체크포인트 통과</button><button data-gameplay-action data-scope-id="scope-mobileux-d4b46ab266" data-mechanic-id="mobile-dash" id="dashForward">대시</button><button data-gameplay-action data-mechanic-id="summit-finish" class="finish" id="finishRun">정상 스프린트</button></section>
<section class="touch-controls mobile-controls" aria-label="모바일 이동"><button type="button" data-touch-control="left" id="touchLeft">◀ 왼쪽</button><button type="button" data-touch-control="jump" id="touchJump">▲ 점프</button><button type="button" data-touch-control="right" id="touchRight">오른쪽 ▶</button></section>
<section class="audio-controls"><button type="button" data-audio-control="mute" id="mute">음악 켜기</button><label>볼륨 <input data-audio-control="volume" id="volume" type="range" min="0" max="1" step="0.05" value="0.22"></label></section><div class="message" id="message">스프린트를 시작해 첫 체크포인트를 노려라. 실패하면 즉시 재도전할 수 있다.</div><button type="button" class="retry reset" data-retry id="retry">다시 도전</button><div class="legend"><span>파랑: 이동 발판</span><span>보라: 사라지는 발판</span><span>빨강: 위험</span><span>노랑: 정상</span></div></main>
<script>
'use strict';
const world=document.getElementById('world');const player=document.getElementById('player');const track=document.getElementById('track');const zoneEl=document.getElementById('zone');const objectiveEl=document.getElementById('objective');const messageEl=document.getElementById('message');const hud=document.querySelector('.hud');
const state={round:1,score:0,hp:3,stage:1,level:1,coins:0,x:60,y:330,cameraX:0,collisionCount:0,checkpoint:0,started:false,jumps:0,dashes:0,boost:0,status:'running',lastAction:'ready',elapsed:0};let audioContext=null;let masterGain=null;let pulseOscillator=null;let muted=false;const clamp=(value,min,max)=>Math.max(min,Math.min(max,value));
function ensureAudio(){if(!audioContext){const AC=window.AudioContext||window.webkitAudioContext;audioContext=new AC();masterGain=audioContext.createGain();masterGain.gain.value=Number(document.getElementById('volume').value);masterGain.connect(audioContext.destination);pulseOscillator=audioContext.createOscillator();pulseOscillator.type='triangle';pulseOscillator.frequency.value=164;pulseOscillator.connect(masterGain);pulseOscillator.start()}if(audioContext.state==='suspended')audioContext.resume();document.body.dataset.audioState=muted?'muted':'running'}
function currentZone(){if(state.x<520)return{id:'rooftops',label:'ROOFTOPS',stage:1};if(state.x<1000)return{id:'construction',label:'CONSTRUCTION',stage:4};if(state.x<1500)return{id:'machinery',label:'MACHINERY',stage:7};return{id:'summit',label:'SKYLINE SUMMIT',stage:10}}
function render(){const zone=currentZone();state.stage=Math.max(state.stage,Math.min(12,Math.floor(state.x/165)+1));state.cameraX=clamp(state.x-120,0,1420);const screenX=clamp(state.x-state.cameraX,26,620);player.dataset.playerX=String(Math.round(state.x));player.dataset.playerY=String(Math.round(state.y));player.dataset.collisionEnabled='true';player.dataset.collisionCount=String(state.collisionCount);player.dataset.cameraActive='true';player.dataset.cameraX=String(Math.round(state.cameraX));player.dataset.cameraY='0';player.dataset.routeId='stage-'+state.stage;player.style.setProperty('--player-screen-x',String(screenX));player.style.setProperty('--player-screen-y',String(state.y));track.style.setProperty('--camera-x',String(state.cameraX));world.dataset.area=zone.id;zoneEl.dataset.zone=zone.id;zoneEl.textContent=zone.label;objectiveEl.dataset.objective=state.status==='victory'?'summit-complete':'reach-stage-'+Math.min(12,state.stage+1);objectiveEl.textContent=state.status==='victory'?'정상 도달 · 다음 라운드 준비':'스테이지 '+state.stage+' · 다음 체크포인트로';document.getElementById('score').textContent=String(state.score);document.getElementById('hp').textContent=String(state.hp);document.getElementById('stage').textContent=String(state.stage);document.getElementById('level').textContent=String(state.level);document.getElementById('coins').textContent=String(state.coins);document.getElementById('roundLabel').textContent='ROUND '+state.round;hud.dataset.state=state.status;hud.dataset.score=String(state.score);hud.dataset.progress=String(Math.min(100,Math.round(state.x/19.5)));document.body.dataset.runResult=state.status;if(pulseOscillator&&audioContext)pulseOscillator.frequency.setTargetAtTime(150+state.stage*9,audioContext.currentTime,.04)}
function setMessage(text){messageEl.textContent=text}
function moveBy(dx,dy=0,label='이동'){if(state.status!=='running')return;ensureAudio();state.started=true;const previous=state.x;state.x=clamp(state.x+dx,25,1995);state.y=clamp(state.y+dy,185,340);if(state.x!==previous)state.score+=Math.max(1,Math.round(Math.abs(dx)/5));if(state.x>430&&state.checkpoint<1)state.checkpoint=1;if(state.x>900&&state.checkpoint<2)state.checkpoint=2;if(state.x>1260&&state.checkpoint<3)state.checkpoint=3;if(state.x>1630&&state.checkpoint<4)state.checkpoint=4;state.lastAction=label;setMessage(label+' · 위치 '+Math.round(state.x)+' · 체크포인트 '+state.checkpoint);render()}
function jump(){if(state.status!=='running')return;ensureAudio();state.started=true;state.jumps++;state.y=clamp(state.y-18,205,340);state.x=clamp(state.x+42,25,1995);state.score+=10;state.lastAction='jump';setMessage('점프 성공 · 위험 발판을 넘었다.');render();setTimeout(()=>{if(state.status==='running'){state.y=330;render()}},120)}
function dash(){if(state.status!=='running')return;ensureAudio();state.started=true;state.dashes++;state.level=Math.min(5,state.level+1);state.x=clamp(state.x+78,25,1995);state.score+=14+state.level;state.coins+=1;state.lastAction='dash';setMessage('대시 · 속도 레벨 '+state.level+' · 보상 코인 +1');render()}
function startRound(){ensureAudio();if(state.status!=='running')resetRun();state.started=true;state.score+=3;state.x=clamp(state.x+12,25,1995);state.lastAction='round-start';setMessage('라운드 시작 · 타이밍을 보고 첫 발판으로 이동.');render()}
function checkpointReward(){if(state.status!=='running')return;ensureAudio();state.started=true;const next=[480,940,1290,1660][Math.min(3,state.checkpoint)];state.x=Math.max(state.x,next);state.checkpoint=Math.min(4,state.checkpoint+1);state.coins+=3;state.score+=25;state.level=Math.min(5,state.level+1);state.lastAction='checkpoint';setMessage('체크포인트 확보 · 보상 코인 +3 · 속도 강화.');render()}
function finishRun(){if(state.status!=='running')return;ensureAudio();state.started=true;state.x=1940;state.stage=12;state.score+=80;state.coins+=10;state.status='victory';state.lastAction='victory';setMessage('VICTORY · Skyline Summit 도달! 보상 코인 +10. 다시 도전해 기록을 높여라.');render()}
function takeDamage(){if(state.status!=='running')return;state.collisionCount++;state.hp=Math.max(0,state.hp-1);state.score=Math.max(0,state.score-5);if(state.hp<=0){state.status='defeat';setMessage('DEFEAT · 추락했다. 마지막 체크포인트에서 재도전하라.')}else{const checkpointX=[60,480,940,1290,1660][state.checkpoint]||60;state.x=checkpointX;setMessage('위험 충돌 · 목숨 -1 · 체크포인트로 복귀.')}render()}
function resetRun(){const nextRound=state.round+1;Object.assign(state,{round:nextRound,score:0,hp:3,stage:1,level:1,coins:0,x:60,y:330,cameraX:0,collisionCount:0,checkpoint:0,started:false,jumps:0,dashes:0,boost:0,status:'running',lastAction:'restart',elapsed:0});setMessage('재도전 시작 · 첫 체크포인트를 다시 노려라.');render()}
function keyboardMove(event){if(['ArrowRight','d','D'].includes(event.key))moveBy(18,0,'오른쪽 이동');if(['ArrowLeft','a','A'].includes(event.key))moveBy(-18,0,'왼쪽 이동');if(['ArrowUp','w','W',' '].includes(event.key))jump();if(['ArrowDown','s','S'].includes(event.key))moveBy(8,4,'착지 조정')}
function detectHazardPressure(){if(state.status!=='running')return;const dangerous=[350,660,1145,1625];if(dangerous.some(x=>Math.abs(state.x-x)<10)&&state.y>312)takeDamage()}
function tick(){if(state.status==='running'&&state.started){state.elapsed+=1;if(state.elapsed%180===0)state.score+=1;detectHazardPressure()}requestAnimationFrame(tick)}
document.getElementById('startRound').addEventListener('click',startRound);document.getElementById('runForward').addEventListener('click',()=>moveBy(55,0,'앞으로 달리기'));document.getElementById('jumpHazard').addEventListener('click',jump);document.getElementById('claimCheckpoint').addEventListener('click',checkpointReward);document.getElementById('dashForward').addEventListener('click',dash);document.getElementById('finishRun').addEventListener('click',finishRun);document.getElementById('retry').addEventListener('click',()=>{ensureAudio();resetRun()});document.getElementById('touchLeft').addEventListener('click',()=>moveBy(-22,0,'모바일 왼쪽 이동'));document.getElementById('touchRight').addEventListener('click',()=>moveBy(22,0,'모바일 오른쪽 이동'));document.getElementById('touchJump').addEventListener('click',jump);document.addEventListener('keydown',keyboardMove);document.getElementById('mute').addEventListener('click',()=>{ensureAudio();muted=!muted;masterGain.gain.value=muted?0:Number(document.getElementById('volume').value);document.body.dataset.audioState=muted?'muted':'running';document.getElementById('mute').textContent=muted?'음악 꺼짐':'음악 켜짐'});document.getElementById('volume').addEventListener('input',event=>{ensureAudio();if(!muted)masterGain.gain.value=Number(event.target.value)});render();requestAnimationFrame(tick);
</script>
</body>
</html>
