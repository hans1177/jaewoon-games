<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vibe2 bootstrap</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #222;
      color: #fff;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    h1 {
      font-size: 2em;
      margin-bottom: 1em;
    }
    button {
      padding: 0.5em 1em;
      font-size: 0.9em;
      margin: 0 0.5em;
      background-color: #444;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #666;
    }
  </style>
</head>
<body>
  <main id="game">
    <h1>Vibe2</h1>
    <button id="startButton">Start Game</button>
    <div id="gameArea"></div>
  </main>

  <script>
    const gameArea = document.getElementById('gameArea');
    const startButton = document.getElementById('startButton');

    startButton.addEventListener('click', () => {
      gameArea.innerHTML = `
        <div class="game-state">
          <h2>Game State</h2>
          <p>Player: <span id="player">Player 1</span></p>
          <p>Progress: <span id="progress">0%</span></p>
          <p>Score: <span id="score">0</span></p>
        </div>
        <div class="game-mechanics">
          <h2>Game Mechanics</h2>
          <p>Move: <span id="move">Move 1</span></p>
          <p>Attack: <span id="attack">Attack 1</span></p>
          <p>Defend: <span id="defend">Defend 1</span></p>
        </div>
        <div class="game-ai">
          <h2>AI Response</h2>
          <p>AI Action: <span id="aiAction">AI 1</span></p>
        </div>
      `;
    });
  </script>
</body>
</html>
