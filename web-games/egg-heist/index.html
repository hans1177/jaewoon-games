<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vibe2 bootstrap</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #111;
      color: #fff;
    }
    main {
      padding: 20px;
      background-color: #222;
      min-height: 100vh;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 16px;
      background-color: #333;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #555;
    }
  </style>
</head>
<body>
  <main id="game">
    <h1>잠입 → 알 획득 → 위험 증가 → 추격 → 탈출</h1>
    <button id="start">시작</button>
    <div id="game-content"></div>
  </main>

  <script>
    const game = document.getElementById('game');
    const startButton = document.getElementById('start');
    const gameContent = document.getElementById('game-content');

    startButton.addEventListener('click', () => {
      gameContent.innerHTML = `
        <p>잠입 중...</p>
        <button id="get-al">알 획득</button>
        <p>위험 증가</p>
        <button id="increase-risk">위험 증가</button>
        <p>추격 중...</p>
        <button id="chase">추격</button>
        <p>탈출 중...</p>
        <button id="escape">탈출</button>
      `;
    });

    document.getElementById('get-al').addEventListener('click', () => {
      gameContent.innerHTML = `
        <p>알을 획득!</p>
        <p>위험 증가</p>
        <button id="increase-risk">위험 증가</button>
        <p>추격 중...</p>
        <button id="chase">추격</button>
        <p>탈출 중...</p>
        <button id="escape">탈출</button>
      `;
    });

    document.getElementById('increase-risk').addEventListener('click', () => {
      gameContent.innerHTML = `
        <p>위험 증가!</p>
        <p>추격 중...</p>
        <button id="chase">추격</button>
        <p>탈출 중...</p>
        <button id="escape">탈출</button>
      `;
    });

    document.getElementById('chase').addEventListener('click', () => {
      gameContent.innerHTML = `
        <p>추격 중...</p>
        <p>탈출 중...</p>
        <button id="escape">탈출</button>
      `;
    });

    document.getElementById('escape').addEventListener('click', () => {
      gameContent.innerHTML = `
        <p>탈출!</p>
        <button id="restart">재시작</button>
      `;
    });

    document.getElementById('restart').addEventListener('click', () => {
      gameContent.innerHTML = `
        <h1>잠입 → 알 획득 → 위험 증가 → 추격 → 탈출</h1>
        <button id="start">시작</button>
        <div id="game-content"></div>
      `;
    });
  </script>
</body>
</html>
