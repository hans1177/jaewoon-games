<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vibe2 bootstrap</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f0f0f0;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1 {
      margin-bottom: 10px;
      color: #333;
    }
    .game-container {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .game-buttons {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .game-buttons button {
      padding: 10px 20px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .game-buttons button:hover {
      background-color: #e0e0e0;
    }
    .game-status {
      margin-bottom: 20px;
      font-size: 18px;
      color: #333;
    }
    .game-score {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .game-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .game-actions button {
      padding: 10px 15px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .game-actions button:hover {
      background-color: #e0e0e0;
    }
    .game-over {
      color: red;
      font-weight: bold;
    }
  </style>
</head>

</html>
