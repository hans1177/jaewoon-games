let gameState = {
  player: {
    health: 100,
    inventory: [],
    position: { x: 0, y: 0 }
  },
  map: {
    width: 20,
    height: 20,
    tiles: Array(20).fill().map(() => Array(20).fill(0))
  },
  items: []
};

// Add player interaction
document.addEventListener('click', (e) => {
  const rect = e.target.getBoundingClientRect();
  const x = rect.x + e.clientX - window.innerWidth / 2;
  const y = rect.y + e.clientY - window.innerHeight / 2;

  // Check if click is within game area
  if (x > 0 && x < 20 && y > 0 && y < 20) {
    const tile = gameState.map.tiles[Math.floor(x / 20) * 20 + Math.floor(y / 20)];
    if (tile === 1) {
      // Player encounters a trap
      gameState.player.health -= 20;
      alert("You stepped on a trap! You're hurt.");
    } else if (tile === 3) {
      // Player finds an item
      gameState.items.push(Math.random() < 0.5 ? 'key' : 'potion');
      alert("You found an item!");
    }
  }
});

// Update game state
function updateGameState() {
  // Simple state transition: player moves right
  gameState.player.position.x += 1;
  if (gameState.player.position.x >= gameState.map.width) {
    gameState.player.position.x = 0;
  }
}

// Game loop
// [회귀] 중복 자동 이동 타이머를 제거한다.

// Check for win condition

  if (gameState.player.health <= 0) {
    alert("You lost!");
    resetGame();
  }
}

// Reset game
function resetGame() {
  gameState.player.health = 100;
  gameState.player.inventory = [];
  gameState.player.position = { x: 0, y: 0 };
  gameState.map.tiles = Array(20).fill().map(() => Array(20).fill(0));
  gameState.items = [];
  alert("Game reset. Start fresh!");
}

const eggBoard=document.createElement('div');
eggBoard.id='eggBoard';

gameRoot.appendChild(eggBoard);
const eggCells=[];
for(let y=0;y<20;y++)for(let x=0;x<20;x++){
  const cell=document.createElement('span');
  cell.className='eggCell';
  cell.setAttribute('aria-hidden','true');
  eggBoard.appendChild(cell);
  eggCells.push(cell);
}
const eggControls=document.createElement('section');
eggControls.className='eggControls';
eggControls.setAttribute('aria-label','이동 조작');
eggControls.innerHTML='<button type="button" data-dx="0" data-dy="-1">위</button>' +
  '<button type="button" data-dx="-1" data-dy="0">왼쪽</button>' +
  '<button type="button" data-dx="1" data-dy="0">오른쪽</button>' +
  '<button type="button" data-dx="0" data-dy="1">아래</button>';
gameRoot.appendChild(eggControls);
function renderEggHud(){
  const x=gameState.player.position.x,y=gameState.player.position.y;
  document.getElementById('eggStatus').textContent='체력 '+gameState.player.health+
    ' · 좌표 ('+x+','+y+') · 아이템 '+gameState.items.length+'개';
  for(let row=0;row<20;row++)for(let col=0;col<20;col++){
    const cell=eggCells[row*20+col];
    const tile=gameState.map.tiles[row]?.[col]??0;
    cell.className='eggCell'+(tile===1?' trap':tile===3||tile===5||tile===6?' item':'')+
      (x===col&&y===row?' player':'')+
      (col===19&&row===19?' goal':'');
  }
}
function moveEgg(dx,dy){
  gameState.player.position.x=Math.max(0,Math.min(19,gameState.player.position.x+dx));
  gameState.player.position.y=Math.max(0,Math.min(19,gameState.player.position.y+dy));
  saveGame();renderEggHud();
  checkWinCondition();
}
eggControls.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{
  moveEgg(Number(button.dataset.dx),Number(button.dataset.dy));
}));
document.addEventListener('keydown',event=>{
  const move={ArrowUp:[0,-1],ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowDown:[0,1]}[event.key];
  if(!move||event.repeat||/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||''))return;
  event.preventDefault();moveEgg(...move);
});
