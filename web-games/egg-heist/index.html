<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Egg Heist</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#141d29;color:#f2f7ff;font:16px system-ui,sans-serif}
  main{max-width:750px;padding:16px;margin:auto}
  h1{margin:0 0 12px;font-size:clamp(1.6rem,6vw,2.2rem)}
  #status{display:grid;gap:5px;padding:12px;background:#223249;border-radius:9px;margin-bottom:12px}
  #map{display:block;width:100%;height:auto;aspect-ratio:1;border:2px solid #6c8caa;border-radius:8px;touch-action:manipulation}
  #controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:360px;margin:12px auto}
  button{padding:12px;min-height:48px;background:#34567d;border:1px solid #87a8c4;border-radius:8px;color:white;
    font:inherit;font-weight:600;touch-action:manipulation;cursor:pointer}
  button:focus-visible,canvas:focus-visible{outline:3px solid #fff79c;outline-offset:2px}
  button:disabled{opacity:.5;cursor:default}
  #up{grid-column:2}#left{grid-column:1;grid-row:2}#down{grid-column:2;grid-row:2}#right{grid-column:3;grid-row:2}
  #restart{grid-column:1/4}
  .hint{color:#c0d3e6;font-size:.88rem;line-height:1.55}
  #message{min-height:1.4em;color:#ffda8d}
</style>
</head>
<body>
<main id="game">
  <h1>Egg Heist</h1>
  <div id="status" aria-live="polite">
    <div id="health">Health: 100</div>
    <div id="inventory">Items: 0 / 5</div>
    <div id="position">Position: (0, 0)</div>
    <strong id="message"></strong>
  </div>
  <canvas id="map" width="480" height="480" tabindex="0" role="img"
    aria-label="20 by 20 board; player position and trap and item cells"></canvas>
  <div id="controls">
    <button id="up" type="button" aria-label="Move up">↑</button>
    <button id="left" type="button" aria-label="Move left">←</button>
    <button id="down" type="button" aria-label="Move down">↓</button>
    <button id="right" type="button" aria-label="Move right">→</button>
    <button id="restart" type="button">Restart</button>
  </div>
  <p class="hint">Use arrows or the direction buttons. Reach the bottom-right corner or collect five items. A step onto an existing trap removes 20 health. The saved board and inventory are preserved.</p>
</main>
<script>
// FILE: web-games/egg-heist/index.html
// MAIN: existing 20x20 board, player health, inventory, trap, item and restart logic.
// SAVE: keep the original localStorage key and object keys unchanged.
(() => {
  'use strict';
  const STORAGE_KEY = 'vibe2_game_state';
  const BOARD_SIZE = 20;
  const canvas = document.getElementById('map');
  const ctx = canvas.getContext('2d');
  const find = id => document.getElementById(id);

  function initialState() {
    return {
      player: { health:100, inventory:[], position:{x:0,y:0} },
      map: { width:BOARD_SIZE, height:BOARD_SIZE,
        tiles:Array.from({length:BOARD_SIZE}, () => Array(BOARD_SIZE).fill(0)) },
      items:[]
    };
  }

  // UTIL: A restored save is data, not an instruction to execute, and may be malformed.
  // Keep the same storage shape: player/map/items, without renaming old fields.
  function validateSavedState(saved) {
    if (!saved || typeof saved !== 'object' || Array.isArray(saved)) return null;
    const p = saved.player, board = saved.map;
    if (!p || !board || !Array.isArray(board.tiles) ||
      board.width !== BOARD_SIZE || board.height !== BOARD_SIZE ||
      board.tiles.length !== BOARD_SIZE ||
      board.tiles.some(row => !Array.isArray(row) || row.length !== BOARD_SIZE ||
        row.some(v => !Number.isInteger(v) || v < 0 || v > 6))) return null;
    if (!Number.isFinite(p.health) || p.health < 0 ||
      !Number.isInteger(p.position?.x) || !Number.isInteger(p.position?.y) ||
      p.position.x < 0 || p.position.x >= BOARD_SIZE ||
      p.position.y < 0 || p.position.y >= BOARD_SIZE ||
      !Array.isArray(p.inventory) || !Array.isArray(saved.items)) return null;
    return {
      player: {health:p.health,inventory:p.inventory.slice(0,200),
        position:{x:p.position.x,y:p.position.y}},
      map: {width:BOARD_SIZE,height:BOARD_SIZE,
        tiles:board.tiles.map(row=>row.slice())},
      items:saved.items.slice(0,200)
    };
  }

  let gameState=initialState(),ended=false,message='';
  function restore() {
    try {
      const raw=localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const parsed=JSON.parse(raw);
      const state=validateSavedState(parsed);
      if (state) gameState=state;
      else message='Saved state is invalid. Current progress is not overwritten until your next action.';
    } catch (_) {
      message='Saved state could not be read. Start playing to save a new session.';
    }
  }
  function saveGame() {
    try {localStorage.setItem(STORAGE_KEY,JSON.stringify(gameState));}
    catch (_) { message='Saving is unavailable in this browser session.'; }
  }

  // RENDER: canvas visualizes the actual persisted board, not a separate mock state.
  function drawBoard() {
    const cell=canvas.width/BOARD_SIZE;
    const colors=['#294158','#c75653','#395670','#e2a34c','#395670','#6fb0c4','#76ad78'];
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(let y=0;y<BOARD_SIZE;y++){
      for(let x=0;x<BOARD_SIZE;x++){
        const kind=gameState.map.tiles[y][x],left=x*cell,top=y*cell;
        ctx.fillStyle=colors[kind]||colors[0];
        ctx.fillRect(left,top,cell,cell);
        ctx.strokeStyle='rgba(255,255,255,.09)';
        ctx.strokeRect(left+.5,top+.5,cell-1,cell-1);
        if([3,5,6].includes(kind)){
          ctx.fillStyle='#0c2235';
          ctx.beginPath();
          ctx.arc(left+cell/2,top+cell/2,cell*.22,0,Math.PI*2);
          ctx.fill();
        }
      }
    }
    const p=gameState.player.position;
    ctx.fillStyle='#f8dc84';
    ctx.beginPath();
    ctx.arc((p.x+.5)*cell,(p.y+.5)*cell,cell*.4,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle='#413315';ctx.lineWidth=2;ctx.stroke();
    const goal=cell*(BOARD_SIZE-1);
    ctx.strokeStyle='#adf1cb';
    ctx.lineWidth=2;
    ctx.strokeRect(goal+3,goal+3,cell-6,cell-6);
  }
  function render() {
    const p=gameState.player;
    find('health').textContent='Health: '+p.health;
    find('inventory').textContent='Items: '+gameState.items.length+' / 5';
    find('position').textContent='Position: ('+p.position.x+', '+p.position.y+')';
    find('message').textContent=message;
    for(const id of ['up','down','left','right']) find(id).disabled=ended;
    drawBoard();
  }

  // GAME: these are the original tile meanings (1 trap, 3 random item, 5 key, 6 potion).
  // A tile is consumed only after an actual player movement and stored immediately.
  function enterTile(x,y) {
    const tile=gameState.map.tiles[y][x];
    if(tile===1) {
      gameState.player.health=Math.max(0,gameState.player.health-20);
      message='Trap: -20 health';
    } else if(tile===3 || tile===5 || tile===6) {
      const item=tile===3?(Math.random()<.5?'key':'potion'):tile===5?'key':'potion';
      gameState.items.push(item);
      message='Found '+item+'!';
      gameState.map.tiles[y][x]=0;
    } else {
      message='Moved to '+x+', '+y;
    }
    if(gameState.player.health<=0) {ended=true;message='You lost!';}
    else if(gameState.items.length>=5 ||
      (x===BOARD_SIZE-1 && y===BOARD_SIZE-1)) {
      ended=true;message='You won!';
    }
  }

  function move(dx,dy) {
    if(ended) return;
    const p=gameState.player.position;
    const nextX=p.x+dx,nextY=p.y+dy;
    if(nextX<0||nextX>=BOARD_SIZE||nextY<0||nextY>=BOARD_SIZE) return;
    p.x=nextX;p.y=nextY;
    enterTile(nextX,nextY);
    saveGame();render();
  }

  // Input is handled once. A touch-generated click is not also processed as a second move.
  find('up').addEventListener('click',()=>move(0,-1));
  find('down').addEventListener('click',()=>move(0,1));
  find('left').addEventListener('click',()=>move(-1,0));
  find('right').addEventListener('click',()=>move(1,0));
  document.addEventListener('keydown',event=>{
    if(event.repeat || event.ctrlKey || event.metaKey || event.altKey) return;
    const direction={
      ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],
      w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]
    }[event.key];
    if(direction){event.preventDefault();move(...direction);}
  });
  canvas.addEventListener('click',event=>{
    if(ended)return;
    const bounds=canvas.getBoundingClientRect();
    const x=Math.floor((event.clientX-bounds.left)*BOARD_SIZE/bounds.width);
    const y=Math.floor((event.clientY-bounds.top)*BOARD_SIZE/bounds.height);
    const p=gameState.player.position;
    if(Math.abs(x-p.x)+Math.abs(y-p.y)===1)move(x-p.x,y-p.y);
  });
  find('restart').addEventListener('click',()=>{
    gameState=initialState();
    ended=false;message='Game reset. Start fresh!';
    saveGame();render();
  });

  // The existing one-second rightward progression remains part of the initial game.
  // Stop mutations on a terminal state and record every real position transition.
  setInterval(()=>{
    if(ended)return;
    const p=gameState.player.position;
    p.x=(p.x+1)%BOARD_SIZE;
    enterTile(p.x,p.y);
    saveGame();render();
  },1000);
  restore();
  if(gameState.player.health<=0){ended=true;message='You lost!';}
  else if(gameState.items.length>=5 ||
    (gameState.player.position.x===BOARD_SIZE-1 &&
      gameState.player.position.y===BOARD_SIZE-1)){ended=true;message='You won!';}
  render();
})();
</script>
</body>
</html>
