function humanoid(material,scale=1){

  const hp=(kind==='brute'?85:kind==='ghost'?38:45)*(1+(state.wave-1)*.2);
  state.enemies.push({obj:enemy,shape,kind,hp,maxHp:hp,speed:kind==='brute'?1.55:kind==='ghost'?2.25:2.75,
    radius:kind==='brute'?1.07:.65,damage:kind==='brute'?18:kind==='ghost'?11:9,cd:.8+Math.random(),phase:Math.random()*5,hit:0});
}
function spawnEnemy(){
  const angle=Math.random()*Math.PI*2;
  const radius=16+Math.random()*4;
  const kind=state.wave>2&&state.spawned%6===4?'brute':state.wave>1&&state.spawned%4===3?'ghost':'walker';
  createEnemy(kind,angle,radius);state.spawned++;
}
function spawnDrop(x,z){
  const obj=new THREE.Group();scene.add(obj);obj.position.set(x,.48,z);
  mesh(new THREE.OctahedronGeometry(.35,0),materials.crystal,obj,0,0,0);
  state.drops.push({obj,phase:Math.random()*6});
}
function spark(x,y,z,color=0xe4d2ff){
  const obj=mesh(new THREE.IcosahedronGeometry(.25,0),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.9}),scene,x,y,z);
  state.effects.push({obj,life:.36,max:.36});
}
function hurt(amount){
  if(state.invincible>0||state.mode!=='playing')return;
  state.hp=Math.max(0,state.hp-amount);state.invincible=.56;
  notice('체력 -'+amount);playSound(125,'sawtooth');
  if(state.hp<=0)endGame(false);
}
function damageEnemy(e,amount){
  if(!state.enemies.includes(e))return;
  e.hp-=amount;e.hit=.13;
  spark(e.obj.position.x,1.5,e.obj.position.z,0xffc391);
  if(e.hp<=0){
    state.enemies.splice(state.enemies.indexOf(e),1);
    scene.remove(e.obj);
    spawnDrop(e.obj.position.x,e.obj.position.z);
    state.kills++;state.exp++;
    if(state.exp>=state.level*4){
      state.exp=0;state.level++;state.hp=Math.min(state.maxHp,state.hp+12);
      notice('레벨 '+state.level+' · 체력 일부 회복!');
    }
    playSound(540,'triangle');
  }
}
function slash(){
  if(state.mode!=='playing'||state.slashCd>0)return;
  state.slashCd=.43;state.swing=.25;state.combo++;
  const nearby=state.enemies.filter(e=>distance(pos,e.obj.position)<3.15)
    .sort((a,b)=>distance(pos,a.obj.position)-distance(pos,b.obj.position));
  if(nearby.length){
    const target=nearby[0].obj.position;
    state.lastDir.set(target.x-pos.x,0,target.z-pos.z).normalize();
  }
  const face=Math.atan2(-state.lastDir.x,-state.lastDir.z);
  actor.body.rotation.y=face;
  for(const e of nearby){
    const d=new THREE.Vector3(e.obj.position.x-pos.x,0,e.obj.position.z-pos.z).normalize();
    if(d.dot(state.lastDir)>.2)damageEnemy(e,state.attack);
  }
  halo.visible=true;halo.rotation.z=0;
  playSound(360,'triangle');
}
function dash(){
  if(state.mode!=='playing'||state.dashCd>0)return;
  const dx=input.x+(input.keys.has('ArrowRight')||input.keys.has('d')?1:0)-(input.keys.has('ArrowLeft')||input.keys.has('a')?1:0);
  const dz=input.z+(input.keys.has('ArrowDown')||input.keys.has('s')?1:0)-(input.keys.has('ArrowUp')||input.keys.has('w')?1:0);
  if(Math.hypot(dx,dz)>.05)state.lastDir.set(dx,0,dz).normalize();
  state.dashTime=.18;state.dashCd=2.5;state.invincible=.3;
  playSound(640,'sine');
}
function buy(kind){
  if(state.mode!=='playing')return;
  const price=kind==='speed'?4:3;
  if(state.gems<price){notice('마력 결정이 부족해');return;}
  state.gems-=price;
  if(kind==='strength'){state.attack+=9;notice('검 공격력 +9');}
  if(kind==='life'){state.maxHp+=20;state.hp=Math.min(state.maxHp,state.hp+35);notice('최대 체력 +20');}
  if(kind==='speed'){state.speed=Math.min(9,state.speed+.65);notice('이동 속도 증가');}
  playSound(790,'sine');updateHud();
}
function fireEnemyShot(e){
  const obj=mesh(new THREE.IcosahedronGeometry(.24,0),materials.ghost,scene,e.obj.position.x,1.3,e.obj.position.z);
  const dir=new THREE.Vector3(pos.x-e.obj.position.x,0,pos.z-e.obj.position.z).normalize();
  state.shots.push({obj,dir,life:4,damage:e.damage});
}
function collisions(next){
  const dist=Math.hypot(next.x,next.z);
  if(dist>22){const f=22/dist;next.x*=f;next.z*=f;}
  for(const r of ruins){
    const dx=next.x-r.x,dz=next.z-r.z,d=Math.hypot(dx,dz);
    if(d<r.r+.35&&d>.0001){next.x=r.x+dx/d*(r.r+.35);next.z=r.z+dz/d*(r.r+.35);}
  }
}
function update(dt){
  state.time+=dt;
  if(state.nextNotice&&state.time>state.nextNotice){$('message').classList.remove('show');state.nextNotice=0;}
  state.slashCd=Math.max(0,state.slashCd-dt);
  state.dashCd=Math.max(0,state.dashCd-dt);
  state.invincible=Math.max(0,state.invincible-dt);
  state.dashTime=Math.max(0,state.dashTime-dt);
  state.swing=Math.max(0,state.swing-dt);
  const k=input.keys;
  let x=input.x+(k.has('ArrowRight')||k.has('d')?1:0)-(k.has('ArrowLeft')||k.has('a')?1:0);
  let z=input.z+(k.has('ArrowDown')||k.has('s')?1:0)-(k.has('ArrowUp')||k.has('w')?1:0);
  const len=Math.hypot(x,z);
  if(len>.05){x/=Math.max(1,len);z/=Math.max(1,len);if(state.dashTime<=0)state.lastDir.set(x,0,z).normalize();}
  else{x=0;z=0;}
  if(state.dashTime>0){x=state.lastDir.x;z=state.lastDir.z;}
  const runSpeed=state.dashTime>0?18:state.speed;
  const next={x:pos.x+x*runSpeed*dt,z:pos.z+z*runSpeed*dt};collisions(next);
  pos.x=next.x;pos.z=next.z;
  const facing=Math.atan2(-state.lastDir.x,-state.lastDir.z);
  actor.body.rotation.y+=Math.atan2(Math.sin(facing-actor.body.rotation.y),Math.cos(facing-actor.body.rotation.y))*Math.min(1,dt*12);
  const stride=Math.sin(state.time*(len>.05?11:2))*(len>.05?.52:.045);
  actor.legs[0].rotation.x=stride;actor.legs[1].rotation.x=-stride;
  actor.arms[0].rotation.x=-stride*.55;
  actor.arms[1].rotation.x=state.swing>0?-1.4*Math.sin((1-state.swing/.25)*Math.PI):stride*.3;
  actor.torso.rotation.z=Math.sin(state.time*2.7)*.025;
  cape.rotation.x=Math.sin(state.time*6)*.14+(len>.05?.2:0);
  halo.visible=state.swing>0;
  if(halo.visible)halo.rotation.z+=dt*10;
  actor.body.visible=state.invincible<=0||Math.floor(state.time*24)%2===0;
  portal.visible=state.wave>=6;
  portalLight.material.opacity=.4+Math.sin(state.time*2)*.15;
  portal.rotation.y=Math.sin(state.time)*.16;
  if(state.wave>=6&&distance(pos,portal.position)<1.6){endGame(true);return;}
  if(state.wave<=5){
    if(state.spawned<state.toSpawn){
      state.spawnTimer-=dt;
      if(state.spawnTimer<=0){spawnEnemy();state.spawnTimer=Math.max(.42,1.05-state.wave*.07);}
    }else if(state.enemies.length===0){
      state.clearDelay+=dt;
      if(state.clearDelay>2.4){state.wave++;record();if(state.wave===6){portal.visible=true;notice('봉인문 개방! 빛나는 문으로 이동해!');}else startWave();}
    }
  }
  // 몬스터 인공지능: 추적, 근접 공격, 투사체
  for(const e of state.enemies){
    const target=pos,enemy=e.obj;
    const dx=target.x-enemy.position.x,dz=target.z-enemy.position.z,d=Math.hypot(dx,dz)||1;
    e.cd-=dt;e.hit=Math.max(0,e.hit-dt);
    e.phase+=dt*(e.kind==='brute'?6:10);
    e.shape.legs[0].rotation.x=Math.sin(e.phase)*.4;
    e.shape.legs[1].rotation.x=-Math.sin(e.phase)*.4;
    if(e.kind==='ghost')e.shape.body.position.y=Math.sin(state.time*3+e.phase)*.18;
    const attackRange=e.kind==='ghost'?8:e.radius+.7;
    if(d>attackRange){
      enemy.position.x+=dx/d*e.speed*dt;
      enemy.position.z+=dz/d*e.speed*dt;
    }else if(e.cd<=0){
      if(e.kind==='ghost'){fireEnemyShot(e);e.cd=2.2;}
      else{hurt(e.damage);e.cd=e.kind==='brute'?1.7:1.15;}
    }
    enemy.rotation.y=Math.atan2(-dx,-dz);
    e.shape.torso.rotation.z=e.hit>0?-.3:Math.sin(e.phase)*.05;
  }
  for(let i=state.shots.length-1;i>=0;i--){
    const s=state.shots[i];
    s.obj.position.addScaledVector(s.dir,dt*7);
    s.obj.rotation.y+=dt*5;s.life-=dt;
    if(distance(s.obj.position,pos)<.7){hurt(s.damage);s.life=0;}
    if(s.life<=0){scene.remove(s.obj);state.shots.splice(i,1);}
  }
  for(let i=state.drops.length-1;i>=0;i--){
    const item=state.drops[i];item.obj.rotation.y+=dt*2;
    item.obj.position.y=.45+Math.sin(state.time*3+item.phase)*.13;
    if(distance(item.obj.position,pos)<1.2){
      scene.remove(item.obj);state.drops.splice(i,1);state.gems++;playSound(870,'sine');
    }
  }
  for(let i=state.effects.length-1;i>=0;i--){
    const v=state.effects[i];v.life-=dt;
    v.obj.scale.setScalar(Math.max(.02,v.life/v.max)*1.6);
    v.obj.position.y+=dt;
    if(v.life<=0){scene.remove(v.obj);v.obj.material.dispose();state.effects.splice(i,1);}
  }
  for(const r of ruins){r.torch.rotation.y+=dt;r.torch.position.y=r.torchBase+Math.sin(state.time*2+r.phase)*.04;}
  updateHud();
}
function render(dt){
  const center=new THREE.Vector3(pos.x,0,pos.z);
  const offset=new THREE.Vector3(0,13.5,17.5);
  camera.position.lerp(center.clone().add(offset),Math.min(1,dt*4));
  camera.lookAt(center.x,1,center.z);
  renderer.render(scene,camera);
}
function frame(time){
  const dt=Math.min(.04,(time-state.lastFrame)/1000||.016);
  state.lastFrame=time;
  if(state.mode==='playing')update(dt);
  render(dt);
  requestAnimationFrame(frame);
}
function pause(){
  if(state.mode==='playing'){
    state.mode='paused';$('pauseBtn').textContent='계속';
    notice('일시정지');
  }else if(state.mode==='paused'){
    state.mode='playing';$('pauseBtn').textContent='일시정지';
  }
  updateHud();
}
function resize(){
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);
}
window.addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.mode==='playing')pause();});
$('startBtn').addEventListener('click',reset);
$('pauseBtn').addEventListener('click',pause);
$('soundBtn').addEventListener('click',()=>{
  state.sound=!state.sound;$('soundBtn').textContent=state.sound?'소리 켬':'소리 끔';if(state.sound)playSound(460);
});
$('slash').addEventListener('pointerdown',e=>{e.preventDefault();slash();});
$('dash').addEventListener('click',dash);
$('strengthBtn').addEventListener('click',()=>buy('strength'));
$('lifeBtn').addEventListener('click',()=>buy('life'));
$('speedBtn').addEventListener('click',()=>buy('speed'));
const joystick=$('joystick'),knob=$('knob');
function moveStick(e){
  const rect=joystick.getBoundingClientRect(),cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
  const r=rect.width*.31;
  const dx=e.clientX-cx,dy=e.clientY-cy;
  const distance=Math.max(r,Math.hypot(dx,dy));
  input.x=dx/distance;input.z=dy/distance;
  knob.style.transform='translate('+input.x*r+'px,'+input.z*r+'px)';
}
joystick.addEventListener('pointerdown',e=>{if(input.joystick!==-1)return;input.joystick=e.pointerId;joystick.setPointerCapture(e.pointerId);moveStick(e);});
joystick.addEventListener('pointermove',e=>{if(input.joystick===e.pointerId)moveStick(e);});
function releaseStick(e){if(input.joystick!==e.pointerId)return;input.joystick=-1;input.x=0;input.z=0;knob.style.transform='';}
joystick.addEventListener('pointerup',releaseStick);
joystick.addEventListener('pointercancel',releaseStick);
window.addEventListener('keydown',e=>{
  const key=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' ','shift','w','a','s','d'].includes(key)){e.preventDefault();}
  input.keys.add(key==='arrowup'?'ArrowUp':key==='arrowdown'?'ArrowDown':key==='arrowleft'?'ArrowLeft':key==='arrowright'?'ArrowRight':key);
  if(key===' '&&!e.repeat)slash();
  if(key==='shift'&&!e.repeat)dash();
  if(key==='escape'&&!e.repeat)pause();
});
window.addEventListener('keyup',e=>{
  const key=e.key.toLowerCase();
  input.keys.delete(key==='arrowup'?'ArrowUp':key==='arrowdown'?'ArrowDown':key==='arrowleft'?'ArrowLeft':key==='arrowright'?'ArrowRight':key);
});
window.addEventListener('blur',()=>{input.keys.clear();input.x=0;input.z=0;knob.style.transform='';input.joystick=-1;});
// 정적 첫 프레임 및 실행
pos.set(0,0,3);
updateHud();
requestAnimationFrame(frame);
</script>
</body>
