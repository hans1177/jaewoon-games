<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#151922">
<title>카드 워즈</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#0f131b;color:#f7f8fb;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
body{padding:10px 10px max(18px,env(safe-area-inset-bottom));touch-action:manipulation}
button{font:inherit;color:inherit}.app{width:min(980px,100%);margin:auto}.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}.top h1{margin:0;font-size:20px}.top .sub{font-size:10px;color:#aeb9c9}.home{margin-left:auto;color:#fff;text-decoration:none;background:#283244;border-radius:9px;padding:8px 10px;font-size:11px;font-weight:900}
.panel{background:#171e2a;border:1px solid #2b374a;border-radius:14px;padding:10px;margin-bottom:9px;box-shadow:0 8px 24px #0005}.row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.stat{background:#222c3b;border-radius:9px;padding:6px 8px;font-size:11px;font-weight:900}.grow{flex:1}.muted{color:#9cabbe;font-size:10px}.title{font-size:13px;font-weight:1000;margin-bottom:7px}.hidden{display:none!important}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.tabs button,.btn{min-height:40px;border:0;border-radius:10px;background:#2a3a52;font-size:11px;font-weight:1000;padding:8px}.tabs button.on,.btn.primary{background:#3b73d1}.btn.warn{background:#b44343}.btn.gold{background:#8f6927}.btn:disabled{opacity:.4}.gridBtns{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.stageBtn{text-align:left}.stageBtn b{display:block;font-size:12px}.stageBtn small{display:block;margin-top:3px;color:#b9c6d7;font-size:9px;line-height:1.35}
.battleLayout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:9px}.boardWrap{overflow:auto}.board{display:grid;gap:3px;background:#0a0e14;border:3px solid #34425a;border-radius:12px;padding:4px;min-width:300px;aspect-ratio:1.35/1}.cell{position:relative;min-width:44px;min-height:44px;border:0;border-radius:7px;background:#263044;display:flex;align-items:center;justify-content:center;padding:0}.cell:nth-child(2n){background:#2c374b}.cell.selected{outline:3px solid #ffd25c}.cell.can{box-shadow:inset 0 0 0 3px #65a8ff}.cell.enemyTarget{box-shadow:inset 0 0 0 3px #ff6666}.tile{position:absolute;left:3px;top:2px;font-size:11px;opacity:.9}.piece{position:relative;z-index:2;width:84%;height:84%;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;border:2px solid #ffffff55;font-weight:1000;box-shadow:0 4px 10px #0007}.piece.ally1{background:#2866c3}.piece.ally2{background:#7c4cc9}.piece.enemy{background:#a43f46}.piece .n{font-size:9px;line-height:1.05}.piece .hp{font-size:8px;margin-top:2px}.piece.stun:after{content:"공격불가";position:absolute;inset:auto -10px -13px;background:#e4a62d;color:#171717;border-radius:5px;font-size:7px;padding:1px 3px;white-space:nowrap}
.side{display:flex;flex-direction:column;gap:8px}.turnBox{padding:9px;border-radius:10px;background:#202a39}.turnBox b{font-size:13px}.turnBox span{display:block;margin-top:3px;font-size:9px;color:#b5c2d3}.unitList{display:grid;grid-template-columns:1fr;gap:5px;max-height:290px;overflow:auto}.unitBtn{border:1px solid #354762;background:#202a39;border-radius:9px;padding:7px;text-align:left}.unitBtn b{font-size:10px}.unitBtn small{display:block;margin-top:2px;color:#b8c5d6;font-size:8px}.unitBtn.on{border-color:#ffd15e;background:#3a3220}
.log{height:115px;overflow:auto;background:#0c1119;border-radius:8px;padding:7px;font-size:9px;line-height:1.5;color:#bac6d5}.log b{color:#fff}.overlay{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:20;padding:15px}.overlay.show{display:flex}.modal{width:min(94vw,430px);max-height:86vh;overflow:auto;background:#1a2230;border:2px solid #41516b;border-radius:16px;padding:14px}.modal h2{margin:0 0 8px;font-size:18px}.modal p{font-size:11px;line-height:1.6;color:#c2cede}.upgradeRow{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid #ffffff16}.upgradeRow b{font-size:10px}.upgradeRow span{margin-left:auto;font-size:9px;color:#aebbd0}.upgradeRow button{border:0;border-radius:8px;background:#3c6db8;padding:7px 8px;font-size:9px;font-weight:900}.legend{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.tag{font-size:8px;padding:4px 6px;border-radius:7px;background:#222d3d}.specialInfo{font-size:9px;line-height:1.6;color:#bec9d9}.footBtns{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}
@media(max-width:760px){body{padding:6px 6px max(12px,env(safe-area-inset-bottom))}.battleLayout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr;gap:6px}.side .full{grid-column:1/-1}.board{width:100%;min-width:0}.cell{min-width:0;min-height:49px}.piece .n{font-size:8px}.unitList{max-height:190px}.log{height:95px}.tabs button{padding:6px 3px;font-size:10px}}
</style>
</head>
<body>
<main class="app">
 <div class="top"><div><h1>카드 워즈</h1><div class="sub">3명이 하는 턴제 보드게임 · 아군 2명 vs 적군 1명</div></div><a class="home" href="/">홈</a></div>
 <section class="panel row">
  <span class="stat">열쇠 <b id="keys">0</b></span><span class="stat">다이아 <b id="diamonds">0</b></span><span class="stat">최고 스테이지 <b id="unlocked">1</b></span><span class="stat">골드 <b id="gold">0</b></span><span class="grow"></span><button id="saveReset" class="btn warn">저장 초기화</button>
 </section>
 <section class="panel">
  <div class="tabs"><button id="tabStage" class="on">스테이지</button><button id="tabGacha">뽑기</button><button id="tabUpgrade">업그레이드</button><button id="tabRules">규칙</button></div>
 </section>
 <section id="menuPanel" class="panel">
  <div class="title">스테이지 선택</div>
  <div id="stageList" class="gridBtns"></div>
 </section>
 <section id="gachaPanel" class="panel hidden"></section>
 <section id="upgradePanel" class="panel hidden"></section>
 <section id="rulesPanel" class="panel hidden"></section>
 <section id="battle" class="hidden">
  <div class="battleLayout">
   <div class="panel boardWrap"><div id="board" class="board"></div></div>
   <aside class="side">
    <div class="turnBox full"><b id="turnTitle">아군 1 차례</b><span id="turnDesc">유닛을 소환하거나 움직이고 공격해.</span></div>
    <div class="panel"><div class="title">소환</div><div id="unitList" class="unitList"></div></div>
    <div class="panel"><div class="title">턴</div><button id="endTurn" class="btn primary" style="width:100%">턴 종료</button><button id="leaveBattle" class="btn" style="width:100%;margin-top:6px">스테이지 나가기</button></div>
    <div class="panel full"><div class="title">전투 기록</div><div id="log" class="log"></div></div>
   </aside>
  </div>
 </section>
</main>
<div id="result" class="overlay"><div class="modal"><h2 id="resultTitle"></h2><p id="resultText"></p><button id="resultOk" class="btn primary" style="width:100%">확인</button></div></div>
<script>
// ==============================
// 저장 / 데이터
// ==============================
(()=>{'use strict';
const $=id=>document.getElementById(id), SAVE_KEY='card-wars-v1';
const baseSave={keys:0,diamonds:0,unlockedStage:1,upgradeUnlocked:false,newFourUnlocked:false,owned:['검사','궁수','마법사','방패병'],upgrades:{}};
let save=loadSave();
function loadSave(){try{return {...baseSave,...JSON.parse(localStorage.getItem(SAVE_KEY)||'{}'),upgrades:{...baseSave.upgrades,...(JSON.parse(localStorage.getItem(SAVE_KEY)||'{}').upgrades||{})}}}catch{return structuredClone(baseSave)}}
function persist(){localStorage.setItem(SAVE_KEY,JSON.stringify(save));renderMeta()}
const UNIT={
 '검사':{hp:100,atk:30,range:1,cost:50,type:'단일'},
 '궁수':{hp:70,atk:25,range:2,cost:50,type:'단일'},
 '마법사':{hp:60,atk:35,range:2,cost:70,type:'범위',splash:15},
 '방패병':{hp:150,atk:18,range:1,cost:60,type:'단일',reduce:.30},
 '창병':{hp:130,atk:60,range:1,cost:65,type:'단일'},
 '쇠뇌병':{hp:60,atk:55,range:2,cost:70,type:'단일'},
 '망치병':{hp:170,atk:80,range:1,cost:60,type:'특수',hammer:true}
};
const ENEMY={
 '고블린':{hp:50,atk:15,range:1},
 '스켈레톤 전사':{hp:70,atk:25,range:1},
 '강화 고블린':{hp:80,atk:30,range:1},
 '골렘':{hp:180,atk:45,range:1,golem:true},
 '멧돼지':{hp:100,atk:35,range:1,boar:true},
 '방패 고블린':{hp:120,atk:30,range:1,reduce:.40},
 '독 전갈':{hp:90,atk:35,range:1,poison:true},
 '돌격 오크':{hp:150,atk:45,range:1,charger:true},
 '유적 수호자':{hp:190,atk:40,range:1,guardian:true}
};
const STAGE={
 1:{name:'초원의 습격',w:5,h:5,gold:200,allyMax:10,enemyMax:6,enemies:['고블린','고블린','고블린','고블린','고블린','고블린'],reward:'열쇠 2개'},
 2:{name:'폐허가 된 성',w:5,h:5,gold:250,allyMax:12,enemyMax:8,enemies:Array(8).fill('스켈레톤 전사'),reward:'열쇠 1개 + 다이아 200 + 업그레이드 해금'},
 3:{name:'바위 협곡',w:5,h:5,gold:250,allyMax:12,enemyMax:8,enemies:['강화 고블린','강화 고블린','강화 고블린','골렘','골렘','멧돼지','멧돼지','멧돼지'],reward:'열쇠 3개 + 신규 캐릭터 4종 뽑기 해금'},
 4:{name:'특수 발판 전장',w:7,h:5,gold:250,allyMax:12,enemyMax:8,enemies:['방패 고블린','방패 고블린','독 전갈','독 전갈','돌격 오크','돌격 오크','유적 수호자','유적 수호자'],reward:'클리어'}
};
const TILE_TYPES=['가시','회복','점프','균열'];
let game=null, selected=null, summonChoice=null;

// ==============================
// 메뉴
// ==============================
function renderMeta(){ $('keys').textContent=save.keys; $('diamonds').textContent=save.diamonds; $('unlocked').textContent=save.unlockedStage; $('gold').textContent=game?game.gold:'-'; }
function showPanel(which){
 ['menuPanel','gachaPanel','upgradePanel','rulesPanel'].forEach(id=>$(id).classList.add('hidden'));
 ['tabStage','tabGacha','tabUpgrade','tabRules'].forEach(id=>$(id).classList.remove('on'));
 if(which==='stage'){$('menuPanel').classList.remove('hidden');$('tabStage').classList.add('on');renderStages()}
 if(which==='gacha'){$('gachaPanel').classList.remove('hidden');$('tabGacha').classList.add('on');renderGacha()}
 if(which==='upgrade'){$('upgradePanel').classList.remove('hidden');$('tabUpgrade').classList.add('on');renderUpgrades()}
 if(which==='rules'){$('rulesPanel').classList.remove('hidden');$('tabRules').classList.add('on');renderRules()}
}
function renderStages(){
 $('stageList').innerHTML=Object.entries(STAGE).map(([n,s])=>`<button class="btn stageBtn ${Number(n)<=save.unlockedStage?'primary':''}" data-stage="${n}" ${Number(n)>save.unlockedStage?'disabled':''}><b>${n}스테이지 · ${s.name}</b><small>${s.w}×${s.h} · 시작 골드 ${s.gold} · 아군 최대 ${s.allyMax} · 적 최대 ${s.enemyMax}<br>보상: ${s.reward}</small></button>`).join('');
 $('stageList').querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>startStage(Number(b.dataset.stage)));
}
function renderGacha(){
 const basePool=['창병','쇠뇌병','망치병'];
 const newText=save.newFourUnlocked?'<div class="specialInfo" style="margin-top:8px">3스테이지 보상으로 신규 캐릭터 4종 뽑기 슬롯이 해금됐어. 현재 이름/수치가 확정되지 않은 캐릭터는 임의로 만들지 않았어.</div>':'';
 $('gachaPanel').innerHTML=`<div class="title">열쇠 뽑기</div><div class="muted">열쇠 1개로 1회. 1스테이지 이후 창병·쇠뇌병·망치병을 획득할 수 있어.</div><div class="legend">${basePool.map(n=>`<span class="tag">${n}${save.owned.includes(n)?' · 보유':''}</span>`).join('')}</div><button id="drawBtn" class="btn gold" style="width:100%;margin-top:9px" ${save.keys<1?'disabled':''}>열쇠 1개 사용</button>${newText}`;
 $('drawBtn').onclick=()=>{if(save.keys<1)return;save.keys--;const notOwned=basePool.filter(n=>!save.owned.includes(n));const pool=notOwned.length?notOwned:basePool;const got=pool[Math.floor(Math.random()*pool.length)];if(!save.owned.includes(got))save.owned.push(got);persist();showResult('뽑기 결과',got+' 획득');renderGacha()};
}
function renderUpgrades(){
 if(!save.upgradeUnlocked){$('upgradePanel').innerHTML='<div class="title">업그레이드</div><div class="muted">2스테이지를 클리어하면 해금돼.</div>';return}
 $('upgradePanel').innerHTML='<div class="title">업그레이드</div><div class="muted">최대 3회 · 첫 비용 50골드 · 다음 비용은 1.3배 · HP/공격력 ×1.25</div><div id="upgradeRows"></div>';
 $('upgradeRows').innerHTML=save.owned.filter(n=>UNIT[n]).map(n=>{const lv=save.upgrades[n]||0,cost=Math.round(50*Math.pow(1.3,lv));return `<div class="upgradeRow"><b>${n} · 강화 ${lv}/3</b><span>비용 ${cost}골드</span><button data-up="${n}" ${lv>=3?'disabled':''}>강화</button></div>`}).join('');
 $('upgradeRows').querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const n=b.dataset.up,lv=save.upgrades[n]||0;if(lv>=3)return;const cost=Math.round(50*Math.pow(1.3,lv));if(!game||game.gold<cost){showResult('강화 불가','업그레이드는 스테이지 전투 중 보유 골드로 진행해. 골드가 부족해.');return}game.gold-=cost;save.upgrades[n]=lv+1;persist();renderUpgrades();renderBattle()});
}
function renderRules(){
 $('rulesPanel').innerHTML=`<div class="title">기본 규칙</div><div class="specialInfo">• 맵은 1~3스테이지 5×5, 4스테이지 7×5.<br>• 1명은 적군, 2명은 아군을 움직이는 로컬 턴제 방식.<br>• 유닛은 기본 1칸 이동. 사거리 안의 적을 눌러 공격.<br>• 아군 1 → 아군 2 → 적군 순서로 반복.<br>• 망치병은 공격을 지정한 뒤 다음 자기 차례에 80 피해.<br>• 4스테이지에는 랜덤 특수 발판 5개.<br>• 방패 고블린은 받는 피해 40% 감소.<br>• 돌격 오크는 적군 턴마다 40% 확률로 왼쪽 끝까지 돌진. 닿은 아군은 55 피해 + 1턴 공격 불가.</div>`;
}

// ==============================
// 전투 생성
// ==============================
function startStage(stageNo){
 const s=STAGE[stageNo]; game={stageNo,s,gold:s.gold,turn:'ally1',turnNo:1,enemyTurnCount:0,pieces:[],tiles:[],log:[],spawnOwner:1,finished:false};selected=null;summonChoice=null;
 if(stageNo===4)makeSpecialTiles();
 const slots=[];for(let y=0;y<s.h;y++)for(let x=Math.max(0,s.w-2);x<s.w;x++)slots.push({x,y});
 s.enemies.slice(0,s.enemyMax).forEach((name,i)=>{const p=slots[i%slots.length];spawnPiece(name,'enemy',p.x,p.y)});
 $('battle').classList.remove('hidden');['menuPanel','gachaPanel','upgradePanel','rulesPanel'].forEach(id=>$(id).classList.add('hidden'));addLog(`${stageNo}스테이지 시작 · ${s.name}`);renderBattle();
}
function makeSpecialTiles(){
 const s=STAGE[4],candidates=[];for(let y=0;y<s.h;y++)for(let x=1;x<s.w-2;x++)candidates.push({x,y});shuffle(candidates);for(let i=0;i<5;i++){game.tiles.push({...candidates[i],type:TILE_TYPES[i%TILE_TYPES.length],used:false})}
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function unitStats(name){
 const b=UNIT[name],lv=save.upgrades[name]||0,m=Math.pow(1.25,lv);return {...b,hp:Math.round(b.hp*m),atk:Math.round(b.atk*m)};
}
function spawnPiece(name,team,x,y){
 const b=team==='enemy'?ENEMY[name]:unitStats(name);const owner=team==='enemy'?'enemy':team;
 game.pieces.push({id:crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2),name,team:owner,x,y,hp:b.hp,maxHp:b.hp,atk:b.atk,range:b.range||1,moved:false,attacked:false,reduce:b.reduce||0,splash:b.splash||0,hammer:b.hammer||false,hammerTarget:null,golem:!!b.golem,boar:!!b.boar,poison:!!b.poison,charger:!!b.charger,guardian:!!b.guardian,poisonTurns:0,attackLock:0});
}
function pieceAt(x,y){return game.pieces.find(p=>p.hp>0&&p.x===x&&p.y===y)}
function ownTeam(){return game.turn==='enemy'?'enemy':game.turn}
function canControl(p){return p&&p.team===ownTeam()}
function alive(team){return game.pieces.filter(p=>p.hp>0&&(team?teamMatch(p,team):true))}
function teamMatch(p,team){return team==='ally'?p.team!=='enemy':p.team===team}
function allies(){return alive('ally')}
function enemies(){return alive('enemy')}
function dist(a,b){return Math.abs(a.x-b.x)+Math.abs(a.y-b.y)}
function inside(x,y){return x>=0&&y>=0&&x<game.s.w&&y<game.s.h}

// ==============================
// 렌더
// ==============================
function renderBattle(){
 renderMeta(); if(!game)return;
 const labels={ally1:'아군 1',ally2:'아군 2',enemy:'적군'};$('turnTitle').textContent=`${labels[game.turn]} 차례 · ${game.turnNo}턴`;
 $('turnDesc').textContent=game.turn==='enemy'?'적군 유닛을 움직이고 공격해.':'왼쪽 두 열에 유닛을 소환하거나 내 유닛을 움직여.';
 $('board').style.gridTemplateColumns=`repeat(${game.s.w},1fr)`;$('board').style.gridTemplateRows=`repeat(${game.s.h},1fr)`;$('board').innerHTML='';
 for(let y=0;y<game.s.h;y++)for(let x=0;x<game.s.w;x++){
  const c=document.createElement('button');c.className='cell';c.dataset.x=x;c.dataset.y=y;const tile=game.tiles.find(t=>t.x===x&&t.y===y&&!t.used);if(tile){const t=document.createElement('span');t.className='tile';t.textContent={가시:'▲',회복:'✚',점프:'➜',균열:'◆'}[tile.type];t.title=tile.type;c.appendChild(t)}
  const p=pieceAt(x,y);if(p){const d=document.createElement('div');d.className='piece '+p.team+(p.attackLock>0?' stun':'');d.innerHTML=`<span class="n">${p.name}</span><span class="hp">${Math.max(0,p.hp)}/${p.maxHp}</span>`;c.appendChild(d)}
  if(selected&&selected.id===p?.id)c.classList.add('selected');if(selected&&!p&&dist(selected,{x,y})===1&&!selected.moved)c.classList.add('can');if(selected&&p&&p.team!==selected.team&&dist(selected,p)<=selected.range&&!selected.attacked&&selected.attackLock<=0)c.classList.add('enemyTarget');
  c.onclick=()=>cellClick(x,y);$('board').appendChild(c)
 }
 renderUnits();$('log').innerHTML=game.log.slice(-60).map(t=>`<div>${t}</div>`).join('');$('log').scrollTop=$('log').scrollHeight;
}
function renderUnits(){
 if(!game||game.turn==='enemy'){$('unitList').innerHTML='<div class="muted">적군 차례에는 소환하지 않아.</div>';return}
 const count=allies().length;$('unitList').innerHTML=save.owned.filter(n=>UNIT[n]).map(n=>{const u=unitStats(n),off=game.gold<u.cost||count>=game.s.allyMax;return `<button class="unitBtn ${summonChoice===n?'on':''}" data-unit="${n}" ${off?'disabled':''}><b>${n} · ${u.cost}G</b><small>HP ${u.hp} · 공격 ${u.atk} · 사거리 ${u.range}${u.hammer?' · 다음 턴 타격':''}</small></button>`}).join('');
 $('unitList').querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{summonChoice=b.dataset.unit;selected=null;renderBattle()});
}

// 입력 / 이동 / 공격
// ==============================
function cellClick(x,y){
 if(!game||game.finished)return;const p=pieceAt(x,y);
 if(game.turn!=='enemy'&&summonChoice&&!p&&x<=1){summonAt(summonChoice,x,y);return}
 if(p&&canControl(p)){selected=p;summonChoice=null;renderBattle();return}
 if(!selected)return;
 if(!p&&dist(selected,{x,y})===1&&!selected.moved){movePiece(selected,x,y);return}
 if(p&&p.team!==selected.team&&dist(selected,p)<=selected.range&&!selected.attacked&&selected.attackLock<=0){attackPiece(selected,p);return}
}
function summonAt(name,x,y){
 const u=unitStats(name);if(game.gold<u.cost||allies().length>=game.s.allyMax||pieceAt(x,y))return;const team=game.turn;game.gold-=u.cost;spawnPiece(name,team,x,y);addLog(`<b>${team==='ally1'?'아군1':'아군2'}</b> ${name} 소환 (-${u.cost}G)`);summonChoice=null;renderBattle();
}
function movePiece(p,x,y){const ox=p.x,oy=p.y;p.x=x;p.y=y;p.moved=true;applyTile(p,ox,oy);selected=p;cleanup();renderBattle()}
function applyTile(p,fromX,fromY){
 const t=game.tiles.find(v=>!v.used&&v.x===p.x&&v.y===p.y);if(!t)return;
 if(t.type==='가시'){damage(null,p,20,true);addLog(`${p.name}이 가시 발판으로 20 피해`)}
 if(t.type==='회복'){const before=p.hp;p.hp=Math.min(p.maxHp,p.hp+30);addLog(`${p.name} 회복 발판 +${p.hp-before}`)}
 if(t.type==='균열'){t.used=true;addLog('균열 발판이 사라짐')}
 if(t.type==='점프'){
  const dx=Math.sign(p.x-fromX),dy=Math.sign(p.y-fromY),tx=p.x+dx*2,ty=p.y+dy*2;if((dx||dy)&&inside(tx,ty)&&!pieceAt(tx,ty)){p.x=tx;p.y=ty;addLog(`${p.name} 점프 발판으로 2칸 이동`)}
 }
}
function attackPiece(a,t){
 if(a.hammer){a.hammerTarget=t.id;a.attacked=true;addLog(`${a.name}이 ${t.name}을 공격 예약 · 다음 자기 차례에 80 피해`);renderBattle();return}
 if(a.boar&&Math.random()<.65){boarRush(a);a.attacked=true;cleanup();renderBattle();return}
 damage(a,t,a.atk);a.attacked=true;addLog(`${a.name} → ${t.name} ${a.atk} 공격`);
 if(a.splash>0){game.pieces.filter(p=>p.hp>0&&p.team===t.team&&p.id!==t.id&&dist(p,t)<=1).forEach(p=>damage(a,p,a.splash));addLog(`${a.name} 범위 피해 ${a.splash}`)}
 if(a.golem&&Math.random()<.40){const target=allies().sort((x,y)=>x.hp-y.hp)[0];if(target){damage(a,target,50,true);addLog(`골렘 특수공격 · 최저 체력 ${target.name}에게 돌 50 피해`)}}
 if(a.poison&&Math.random()<.40&&t.hp>0){t.poisonTurns=2;addLog(`${t.name} 독 2턴`)}
 cleanup();renderBattle();
}
