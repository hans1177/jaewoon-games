<div id="bag" class="glass"><h2>🎒 인벤토리</h2><div id="slots"></div><p>자원을 모으고 무기를 제작해. 채집 버튼으로 가까운 자원을 얻을 수 있어.</p><button data-make="axe">🪓 도끼 제작 · 나무 3, 돌 2</button><button data-make="spear">🗡️ 창 제작 · 나무 4, 돌 2</button><button data-make="eat">🍓 열매 먹기 · 열매 1</button><button id="share">🔗 서버 초대 링크 복사</button><button id="exit">🚪 게임 나가기</button><button id="close">닫기</button></div>
<section id="intro"><div class="card"><label>WILD SURVIVAL · MULTIPLAYER</label><div class="hero">🌲 🧑‍🌾 🐺 🌙</div><h1>야생 협동 생존</h1><p>광활한 숲에서 채집하고 제작하며 생존해.<br>몬스터는 처음부터 나오지 않고, 주로 외곽에 나타나.</p><button id="solo" class="main">혼자 시작</button><button id="create">서버 만들기 · 번호 1~10 자동 배정</button><div class="join"><input id="code" type="number" min="1" max="10" inputmode="numeric" placeholder="1~10"><button id="join">번호로 서버 참가</button></div><p id="status">로그인 없이 최대 4명 협동</p><p>낮·밤 모두 출현 2종 / 밤 전용 2종<br>중립 동물은 맵 어디에서나 드물게 등장</p><p style="font-size:11px">이동: 왼쪽 조이스틱 / 방향키 / WASD<br>공격·채집: 오른쪽 버튼 / 스페이스·E키</p></div></section>
<script type="module">
import {JaewoonMultiplayerClient} from '../../multiplayer/multiplayer-client.js';
// ===== 파일명: web-games/room-survival/index.html =====
// ===== 메인: 상태와 월드 생성 =====
const el=id=>document.getElementById(id),canvas=el('world'),cx=canvas.getContext('2d',{alpha:false});
const WORLD={w:3000,h:2400},CENTER={x:1500,y:1200},GAME='room-survival',SAVE='jg-room-survival-solo-v1';
const MOBS=[{icon:'🐺',name:'늑대',hp:50,atk:8,spd:70,night:false},{icon:'🐗',name:'멧돼지',hp:80,atk:10,spd:48,night:false},{icon:'🦇',name:'박쥐',hp:36,atk:6,spd:94,night:true},{icon:'👻',name:'유령',hp:55,atk:9,spd:63,night:true}];
const RES=[{icon:'🌲',item:'wood'},{icon:'🪨',item:'stone'},{icon:'🍓',item:'berry'},{icon:'🌿',item:'fiber'}];
const INVENTORY={wood:'🪵 나무',stone:'🪨 돌',berry:'🍓 열매',fiber:'🌿 풀',meat:'🥩 고기'};
const clamp=(n,a,b)=>Math.min(b,Math.max(a,n)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
let game=null,screenW=innerWidth,screenH=innerHeight,last=0,joy={x:0,y:0},drag=null,keys=new Set(),camera={x:1500,y:1200},notice=0,hudDelay=0,hitParticles=[];
const net={client:null,mode:'solo',code:'',me:'',leader:'',players:1,peers:new Map(),send:0,sync:0};
function random(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=(t+Math.imul(t^t>>>7,61|t))^t;return((t^t>>>14)>>>0)/4294967296;}}
function worldMap(seed){
 const r=random(seed*1933+97),items=[],neutral=[];
 for(let i=0;i<165;i++){const chance=r();items.push({id:i,type:chance<.38?0:chance<.65?1:chance<.82?2:3,x:80+r()*(WORLD.w-160),y:75+r()*(WORLD.h-150),down:0});}
 for(let i=0;i<8;i++)neutral.push({id:i,type:i%2,x:150+r()*(WORLD.w-300),y:150+r()*(WORLD.h-300),angle:r()*Math.PI*2,move:1+r()*5});
 return{items,neutral};
}
function toast(t,ms=2400){el('notify').textContent=t;el('notify').style.opacity=1;notice=performance.now()+ms;}
function start(seed){
 const map=worldMap(seed);
 game={seed,clock:0,day:1,id:0,spawn:0,save:0,mobs:[],items:map.items,neutral:map.neutral,player:{x:CENTER.x,y:CENTER.y,hp:100,food:100,inv:{wood:0,stone:0,berry:2,fiber:0,meat:0},weapon:'맨손',atk:12}};
 if(net.mode==='solo'){try{const s=JSON.parse(localStorage.getItem(SAVE)||'null');if(s&&s.seed===seed){Object.assign(game,{clock:s.clock||0,day:s.day||1});game.player={...game.player,...s.player};}}catch{}}
 camera={x:game.player.x,y:game.player.y};el('intro').style.display='none';el('bag').style.display='none';updateHud();toast('첫 45초는 몬스터가 나오지 않아. 재료를 모아!',4000);
}
function night(){return game&&game.clock%185>=110;}
function host(){return net.mode==='solo'||Boolean(net.me&&net.me===net.leader);}
function allPlayers(){return[game.player,...net.peers.values()];}
function spawn(){
 if(game.clock<45||game.mobs.length>=22)return;
 const type=night()?Math.floor(Math.random()*4):Math.floor(Math.random()*2),edge=Math.random()<.85;
 let x,y;
 for(let tries=0;tries<24;tries++){
  if(edge){const n=Math.floor(Math.random()*4);x=n===0?85:n===1?WORLD.w-85:100+Math.random()*(WORLD.w-200);y=n===2?85:n===3?WORLD.h-85:100+Math.random()*(WORLD.h-200);}
  else{x=90+Math.random()*(WORLD.w-180);y=90+Math.random()*(WORLD.h-180);}
  if(allPlayers().every(p=>Math.hypot(p.x-x,p.y-y)>420))break;
 }
 if(allPlayers().some(p=>Math.hypot(p.x-x,p.y-y)<420))return;
 game.mobs.push({id:++game.id,type,x,y,hp:MOBS[type].hp,cool:1});
}
function updateHud(){
 if(!game)return;const p=game.player;
 el('hpLabel').textContent=Math.ceil(p.hp);el('hpBar').style.width=clamp(p.hp,0,100)+'%';
 el('foodLabel').textContent=Math.ceil(p.food);el('foodBar').style.width=clamp(p.food,0,100)+'%';
 el('day').textContent=(night()?'🌙 ':'☀️ ')+game.day+'일차 · '+(night()?'밤':'낮');
 el('room').textContent=net.mode==='solo'?'혼자 생존':net.code+'번 서버 · '+net.players+'/4명';
 el('danger').textContent=game.clock<45?'안전시간 '+Math.ceil(45-game.clock)+'초':'몬스터 '+game.mobs.length+' · '+p.weapon;
 el('slots').innerHTML=Object.entries(INVENTORY).map(([k,v])=>'<div class="slot">'+v+' <b>'+Math.max(0,p.inv[k]||0)+'</b></div>').join('');
 el('share').style.display=net.mode==='solo'?'none':'block';
}
function gain(item){if(!INVENTORY[item]||!game)return;game.player.inv[item]=(game.player.inv[item]||0)+1;toast(INVENTORY[item]+' 획득');updateHud();}
function pick(id,user){
 const item=game.items[id],p=user?net.peers.get(user):game.player;
 if(!item||item.down>0||!p||dist(item,p)>90)return;
 item.down=40;
 if(user)net.client.sendEvent({action:'survival-loot',target:user,item:RES[item.type].item});
 else gain(RES[item.type].item);
}
function gather(){
 if(!game)return;let nearest=null,d=90;
 for(const item of game.items)if(item.down<=0&&dist(item,game.player)<d){nearest=item;d=dist(item,game.player);}
 if(!nearest)return toast('가까운 나무·돌·열매로 이동해.');
 if(host())pick(nearest.id);else net.client?.sendEvent({action:'survival-pick',id:nearest.id});
}
function hitMob(m,amount){
 if(!m)return;m.hp=Math.max(0,m.hp-amount);hitParticles.push({x:m.x,y:m.y,time:.8,text:'-'+amount});
 if(m.hp<=0){game.mobs=game.mobs.filter(x=>x!==m);toast(MOBS[m.type].name+' 처치!');if(Math.random()<.5)gain('meat');}
}
function attack(){
 if(!game)return;let target=null,d=112;
 for(const m of game.mobs)if(dist(m,game.player)<d){target=m;d=dist(m,game.player);}
 if(!target)return toast('공격 범위 안에 몬스터가 없어.',950);
 if(host())hitMob(target,game.player.atk);else net.client?.sendEvent({action:'survival-hit',id:target.id,atk:game.player.atk});
}
function make(which){
 if(!game)return;const p=game.player;
 if(which==='eat'){if(!p.inv.berry)return toast('열매가 부족해.');p.inv.berry--;p.food=clamp(p.food+30,0,100);p.hp=clamp(p.hp+6,0,100);}
 else{const a=which==='axe'?3:4;if(p.inv.wood<a||p.inv.stone<2)return toast('재료가 부족해.');p.inv.wood-=a;p.inv.stone-=2;p.weapon=which==='axe'?'도끼':'창';p.atk=which==='axe'?22:30;}
 toast(which==='eat'?'열매를 먹었어!':p.weapon+' 제작 성공!');updateHud();
}
// ===== 메인: 서버의 방과 다른 플레이어 =====
function participants(rows){net.players=rows.length||1;net.leader=rows[0]?.userId||net.me;const active=new Set(rows.map(v=>v.userId));for(const id of net.peers.keys())if(!active.has(id))net.peers.delete(id);updateHud();}
function onMessage(m){
 if(!m||!game)return;
 if(m.type==='connected'){net.me=m.userId||'';participants(m.players||[]);toast('서버와 연결됐어.');return;}
 if(m.type==='presence'){participants(m.players||[]);return;}
 if(m.type!=='event'||m.userId===net.me)return;
 if(m.action==='survival-player'){
  if(net.peers.size>=3&&!net.peers.has(m.userId))return;
  net.peers.set(m.userId,{x:clamp(Number(m.x)||CENTER.x,0,WORLD.w),y:clamp(Number(m.y)||CENTER.y,0,WORLD.h),hp:clamp(Number(m.hp)||100,0,100),name:m.nickname||'동료'});
 }
 if(m.action==='survival-world'&&!host()&&m.userId===net.leader&&Array.isArray(m.mobs)&&Array.isArray(m.down)){
  game.clock=Number(m.clock)||game.clock;game.day=Math.max(1,Number(m.day)||1);
  game.mobs=m.mobs.slice(0,22).filter(v=>Array.isArray(v)&&v.length===5&&MOBS[v[1]]).map(v=>({id:v[0],type:v[1],x:v[2],y:v[3],hp:v[4],cool:1}));
  const down=new Map(m.down.slice(0,165).filter(v=>Array.isArray(v)));for(const r of game.items)r.down=down.get(r.id)||0;
 }
 if(host()&&m.action==='survival-pick')pick(Number(m.id),m.userId);
 if(host()&&m.action==='survival-hit'){
  const mob=game.mobs.find(v=>v.id===Number(m.id)),peer=net.peers.get(m.userId);
  if(mob&&peer&&dist(mob,peer)<118)hitMob(mob,clamp(Number(m.atk)||12,0,30));
 }
 if(m.action==='survival-loot'&&m.userId===net.leader&&m.target===net.me)gain(m.item);
 if(m.action==='survival-hurt'&&m.userId===net.leader&&m.target===net.me)game.player.hp=Math.max(0,game.player.hp-clamp(Number(m.amount)||0,0,20));
}
function client(){
 if(net.client)return net.client;
 const c=net.client=new JaewoonMultiplayerClient();
 c.on('message_received',e=>onMessage(e.detail));
 c.on('websocket_disconnected',()=>toast('연결 끊김 · 재접속 중',4500));
 return c;
}
async function connect(action){
 const code=el('code').value.trim();
 if(action==='join'&&!/^(?:[1-9]|10)$/.test(code)){el('status').textContent='번호는 1부터 10까지 입력해.';return;}
 el('create').disabled=el('join').disabled=true;el('status').textContent='서버에 연결하는 중…';
 try{
  const c=client(),r=action==='create'?await c.createNumberRoomForGame(GAME):await c.joinNumberRoomForGame(GAME,code);
  if(!r.ok||r.data?.gameId!==GAME)throw Error(({invalid_game:'서버 업데이트가 필요해.',network_error:'서버 연결 실패',rooms_full:'서버 10개 모두 사용 중',room_full:'정원 4명 초과',room_not_found:'없는 서버 번호'}[r.data?.error])||'서버 접속 실패');
  net.mode='multi';net.code=String(r.data.inviteCode);net.players=r.data.players||1;net.me='';net.leader='';net.peers.clear();
  el('code').value=net.code;history.replaceState(null,'',location.pathname+'?room='+net.code);start(Number(net.code));
 }catch(e){el('status').textContent=String(e.message||e);}
 finally{el('create').disabled=el('join').disabled=false;}
}
function save(){if(net.mode!=='solo'||!game)return;try{localStorage.setItem(SAVE,JSON.stringify({seed:game.seed,clock:game.clock,day:game.day,player:game.player}));}catch{}}
async function leave(){
 if(net.mode==='multi'&&net.client)await net.client.leaveGemRoom().catch(()=>{});
 net.mode='solo';net.code='';net.me='';net.leader='';net.peers.clear();net.players=1;game=null;
 el('intro').style.display='grid';el('bag').style.display='none';el('status').textContent='로그인 없이 최대 4명 협동';history.replaceState(null,'',location.pathname);
}
// ===== 메인: 몬스터 출현과 행동 =====
function simulate(dt){
 const s=game,p=s.player,wasNight=night();s.clock+=dt;
 if(s.clock%185<dt){s.day++;if(s.day>1)toast('날이 밝았어!');}
 if(wasNight&&!night())s.mobs=s.mobs.filter(m=>!MOBS[m.type].night);
 s.spawn-=dt;if(s.spawn<=0){spawn();s.spawn=night()?4+Math.random()*3:7+Math.random()*4;}
 for(const item of s.items)if(item.down>0)item.down=Math.max(0,item.down-dt);
 for(const a of s.neutral){a.move-=dt;if(a.move<0){a.move=1.8+Math.random()*4;a.angle=Math.random()*6.28;}a.x=clamp(a.x+Math.cos(a.angle)*dt*9,40,WORLD.w-40);a.y=clamp(a.y+Math.sin(a.angle)*dt*9,40,WORLD.h-40);}
 for(const m of s.mobs){
  let target=null,d=370;for(const q of allPlayers())if(dist(m,q)<d){target=q;d=dist(m,q);}
  if(!target)continue;
  if(d>33){m.x+=(target.x-m.x)/d*MOBS[m.type].spd*dt;m.y+=(target.y-m.y)/d*MOBS[m.type].spd*dt;}
  m.cool-=dt;
  if(d<43&&m.cool<=0){m.cool=1.5;const amount=MOBS[m.type].atk;
   if(target===p)p.hp=Math.max(0,p.hp-amount);
   else for(const[id,q]of net.peers)if(q===target){net.client?.sendEvent({action:'survival-hurt',target:id,amount});break;}
  }
 }
}
function tick(dt){
 const p=game.player;let x=joy.x,y=joy.y;
 if(keys.has('ArrowLeft')||keys.has('a'))x--;if(keys.has('ArrowRight')||keys.has('d'))x++;
 if(keys.has('ArrowUp')||keys.has('w'))y--;if(keys.has('ArrowDown')||keys.has('s'))y++;
 const n=Math.hypot(x,y)||1;p.x=clamp(p.x+x/n*180*dt,20,WORLD.w-20);p.y=clamp(p.y+y/n*180*dt,20,WORLD.h-20);
 if(host())simulate(dt);
 p.food=Math.max(0,p.food-dt*.06);if(p.food===0)p.hp=Math.max(0,p.hp-dt*.55);
 if(p.hp<=0){p.hp=100;p.food=50;p.x=CENTER.x;p.y=CENTER.y;toast('쓰러졌어! 평원에서 다시 시작해.',3600);}
 for(const fx of hitParticles)fx.time-=dt;hitParticles=hitParticles.filter(f=>f.time>0);
 net.send+=dt;net.sync+=dt;
 if(net.mode==='multi'&&net.client?.isRoomConnected()){
  if(net.send>.12){net.send=0;net.client.sendEvent({action:'survival-player',x:Math.round(p.x),y:Math.round(p.y),hp:Math.ceil(p.hp)});}
  if(host()&&net.sync>.25){net.sync=0;net.client.sendEvent({action:'survival-world',clock:Math.round(game.clock*10)/10,day:game.day,mobs:game.mobs.map(m=>[m.id,m.type,Math.round(m.x),Math.round(m.y),m.hp]),down:game.items.filter(v=>v.down>0).map(v=>[v.id,Math.round(v.down)])});}
 }
 hudDelay+=dt;if(hudDelay>.2){hudDelay=0;updateHud();}
 if(net.mode==='solo'){game.save+=dt;if(game.save>8){game.save=0;save();}}
}
// ===== 그래픽: 모바일 화면·기존 시스템 문자 스프라이트 =====
function resize(){const d=Math.min(devicePixelRatio||1,2);screenW=innerWidth;screenH=innerHeight;canvas.width=Math.round(screenW*d);canvas.height=Math.round(screenH*d);cx.setTransform(d,0,0,d,0,0);}
function sprite(t,x,y,size=35){cx.font=size+'px "Apple Color Emoji","Segoe UI Emoji",sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(t,x,y);}
function visible(v){return v.x>camera.x-screenW/2-60&&v.x<camera.x+screenW/2+60&&v.y>camera.y-screenH/2-60&&v.y<camera.y+screenH/2+60;}
function draw(){
 cx.fillStyle='#28533b';cx.fillRect(0,0,screenW,screenH);
 if(!game)return;
 const p=game.player;camera.x+=(p.x-camera.x)*.16;camera.y+=(p.y-camera.y)*.16;
 cx.save();cx.translate(screenW/2-camera.x,screenH/2-camera.y);
 const step=92,i0=Math.floor((camera.x-screenW/2)/step)-1,i1=Math.ceil((camera.x+screenW/2)/step)+1,j0=Math.floor((camera.y-screenH/2)/step)-1,j1=Math.ceil((camera.y+screenH/2)/step)+1;
 for(let i=i0;i<=i1;i++)for(let j=j0;j<=j1;j++){
  const n=((i*928371+j*19231)^((i*37+j*71)<<4))>>>0;
  cx.fillStyle=n%3===0?'#29573d':n%3===1?'#244e35':'#2b5439';cx.fillRect(i*step,j*step,step+1,step+1);
  cx.fillStyle='#6e9b5c8e';cx.fillRect(i*step+13+n%25,j*step+14+(n>>5)%40,2,6);
  if(n%17===0)sprite('🌼',i*step+48,j*step+48,12);
 }
 cx.strokeStyle='#f5d78095';cx.lineWidth=7;cx.setLineDash([18,12]);cx.strokeRect(4,4,WORLD.w-8,WORLD.h-8);cx.setLineDash([]);
 for(const o of game.items)if(o.down<=0&&visible(o))sprite(RES[o.type].icon,o.x,o.y,o.type===0?49:35);
 for(const o of game.neutral)if(visible(o))sprite(o.type===0?'🦌':'🐇',o.x,o.y,36);
 for(const m of game.mobs)if(visible(m)){sprite(MOBS[m.type].icon,m.x,m.y,40);cx.fillStyle='#4d2526';cx.fillRect(m.x-21,m.y-37,42,5);cx.fillStyle='#f16f63';cx.fillRect(m.x-21,m.y-37,42*m.hp/MOBS[m.type].hp,5);}
 for(const peer of net.peers.values())if(visible(peer)){sprite('🧑‍🌾',peer.x,peer.y,42);cx.fillStyle='#eef8da';cx.font='bold 12px sans-serif';cx.fillText(peer.name,peer.x,peer.y-34);}
 sprite('🧑‍🌾',p.x,p.y,43);cx.fillStyle='#fff1ae';cx.font='bold 12px sans-serif';cx.fillText('나 · '+p.weapon,p.x,p.y-39);
 for(const fx of hitParticles){cx.fillStyle='#ffb1a0';cx.font='bold 20px sans-serif';cx.fillText(fx.text,fx.x,fx.y-50+(fx.time-.8)*35);}
 cx.restore();if(night()){cx.fillStyle='#09112681';cx.fillRect(0,0,screenW,screenH);}
 if(performance.now()>notice)el('notify').style.opacity=0;
}
function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;if(game)tick(dt);draw();requestAnimationFrame(loop);}
// ===== 버튼·키보드·터치 =====
el('solo').onclick=()=>{net.mode='solo';net.code='';net.peers.clear();history.replaceState(null,'',location.pathname);start(117)};
el('create').onclick=()=>connect('create');el('join').onclick=()=>connect('join');
el('hit').onclick=attack;el('collect').onclick=gather;
function bag(open){el('bag').style.display=open?'block':'none';updateHud();}
el('bagBtn').onclick=()=>bag(el('bag').style.display!=='block');el('menu').onclick=()=>bag(true);el('close').onclick=()=>bag(false);
el('bag').addEventListener('click',e=>{const btn=e.target.closest('[data-make]');if(btn)make(btn.dataset.make);});
el('exit').onclick=leave;
el('share').onclick=async()=>{if(net.mode!=='multi')return;const link=location.origin+location.pathname+'?room='+net.code;try{await navigator.clipboard.writeText(link);toast('링크 복사 완료 · 서버 '+net.code);}catch{prompt('초대 링크 복사',link);}};
document.addEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(k))e.preventDefault();keys.add(k);if(k===' '&&!e.repeat)attack();if(k==='e'&&!e.repeat)gather();});
document.addEventListener('keyup',e=>keys.delete(e.key.length===1?e.key.toLowerCase():e.key));addEventListener('blur',()=>keys.clear());
const pad=el('pad'),nub=el('nub');
function moveStick(e){const b=pad.getBoundingClientRect(),x=e.clientX-b.left-b.width/2,y=e.clientY-b.top-b.height/2,m=Math.max(1,Math.hypot(x,y)),s=Math.min(m,44)/44;joy.x=x/m*s;joy.y=y/m*s;nub.style.transform='translate('+(joy.x*43)+'px,'+(joy.y*43)+'px)';}
pad.onpointerdown=e=>{drag=e.pointerId;pad.setPointerCapture(drag);moveStick(e);};
pad.onpointermove=e=>{if(drag===e.pointerId)moveStick(e);};
function release(e){if(drag===e.pointerId){drag=null;joy.x=joy.y=0;nub.style.transform='translate(0,0)';}}
pad.onpointerup=release;pad.onpointercancel=release;
addEventListener('resize',resize);addEventListener('pagehide',save);
const queryRoom=new URLSearchParams(location.search).get('room');if(/^(?:[1-9]|10)$/.test(queryRoom||''))el('code').value=queryRoom;
resize();requestAnimationFrame(loop);
</script></body></html>
