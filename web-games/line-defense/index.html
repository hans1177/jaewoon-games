0%;top:20%;transform:translate(-50%,-7px);max-width:84vw;padding:8px 10px;border-radius:11px;background:#13243ced;color:#fff;font-size:10px;font-weight:1000;text-align:center;opacity:0;transition:.18s;pointer-events:none}.toast.on{opacity:1;transform:translate(-50%,0)}@media(max-width:360px){.unit{flex-basis:72px}.upgrades{grid-template-columns:1fr}.upgrade{min-height:49px}.pill{padding:3px 5px}}

<body>
<!-- 파일명: web-games/line-defense/index.html -->
<canvas id="game"></canvas>
<div class="hud"><div class="stats panel"><span class="pill money" id="money">0 / 800</span><span class="pill" id="income">초당 +28</span><span class="pill" id="timer">0초</span></div><div class="phase panel"><b id="phase">준비</b><small id="stageLabel">스테이지 1</small></div></div>
<div class="bases"><div class="baseBox">우리 아지트 <span id="allyText">1200 / 1200</span><div class="bar"><div class="fill" id="allyBar"></div></div></div><div class="baseBox">적 성 <span id="enemyText">1500 / 1500</span><div class="bar"><div class="fill enemyFill" id="enemyBar"></div></div></div></div>
<div class="tip">돈을 모아 고양이 군단을 출격시켜 적 기지를 부숴! 사거리 안의 아군은 같이 공격해.</div><div class="toast" id="toast"></div>
<div class="bottom" id="battleBar" hidden><div class="units" id="unitBar"></div><div class="tools"><button id="walletBattle" type="button">최대 재화 Lv.1 · 90</button><button id="pause" type="button">일시정지</button></div></div>
<div class="overlay" id="startOverlay"><div class="card"><h1>고양이 전선</h1><p>고양이 군단을 뽑아 한 줄 전선에서 적 기지를 밀어붙이는 독자적인 라인 배틀이야.</p><div class="meta">진행 <b id="stageMeta">1스테이지</b></div><button class="start" id="start" type="button">1스테이지 시작</button><div class="roster"><div><b>●</b>꼬마 고양이</div><div><b>▣</b>방패 고양이</div><div><b>▲</b>창병 고양이</div><div><b>✦</b>궁수 고양이</div><div><b>◆</b>돌격 고양이</div></div></div></div>
<div class="overlay" id="result" hidden><div class="card"><h1 id="resultTitle">승리!</h1><p id="resultDesc"></p><button class="start" id="retry" type="button">다시 도전</button></div></div>
<script>
const C=document.getElementById('game'),X=C.getContext('2d'),q=id=>document.getElementById(id),KEY='jaewoon-line-defense-v1';
const U={blob:{name:'꼬마 고양이',icon:'●',cost:60,hp:85,atk:11,range:28,speed:34,rate:.72,cool:2.2,size:17,kind:'blob'},shield:{name:'방패 고양이',icon:'▣',cost:120,hp:280,atk:7,range:29,speed:21,rate:1.05,cool:4.5,size:20,kind:'shield'},spear:{name:'창병 고양이',icon:'▲',cost:180,hp:135,atk:36,range:47,speed:27,rate:.82,cool:5,size:18,kind:'spear'},ranger:{name:'궁수 고양이',icon:'✦',cost:240,hp:95,atk:28,range:145,speed:22,rate:1.2,cool:6.5,size:17,kind:'ranger'},rush:{name:'돌격 고양이',icon:'◆',cost:360,hp:165,atk:68,range:34,speed:50,rate:.95,cool:9,size:20,kind:'rush'}};
const E={mouse:{name:'먼지쥐',hp:90,atk:9,range:27,speed:29,rate:.9,size:16,reward:13,kind:'mouse'},rabbit:{name:'뿔토끼',hp:155,atk:17,range:30,speed:36,rate:.78,size:18,reward:22,kind:'rabbit'},mole:{name:'갑옷두더지',hp:360,atk:22,range:28,speed:19,rate:1.05,size:22,reward:40,kind:'mole'},boar:{name:'붉은멧돼지',hp:460,atk:39,range:34,speed:30,rate:1.8,size:24,reward:55,kind:'boar',splash:62},boss:{name:'바위왕',hp:1350,atk:58,range:42,speed:14,rate:2.2,size:34,reward:180,kind:'boss',splash:86}};
const STAGE_PLANS={
1:[[2,'mouse'],[5,'rabbit'],[8,'mouse'],[11,'rabbit'],[14,'mouse'],[17,'rabbit'],[21,'mouse'],[25,'rabbit']],
2:[[2,'mouse'],[5,'rabbit'],[8,'boar'],[11,'mouse'],[14,'rabbit'],[17,'boar'],[21,'mouse'],[25,'rabbit'],[29,'boar']],
3:[[2,'rabbit'],[5,'boar'],[8,'rabbit'],[11,'rabbit'],[14,'boar'],[18,'rabbit'],[22,'boar'],[26,'rabbit']],
4:[[2,'rabbit'],[5,'mole'],[8,'boar'],[11,'rabbit'],[14,'mole'],[17,'boar'],[21,'rabbit'],[25,'mole'],[29,'boar']],
5:[[2,'mouse'],[5,'rabbit'],[8,'mole'],[11,'boar'],[14,'mouse'],[17,'rabbit'],[20,'mole'],[23,'boar'],[27,'mouse'],[31,'rabbit'],[35,'mole'],[39,'boar']]
};
let save=load(),s=null,last=0,raf=0,toastTimer=0;
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function load(){try{let v=JSON.parse(localStorage.getItem(KEY)||'{}');return{gold:Math.max(0,v.gold||0),baseLv:clamp(v.baseLv||1,1,10),incomeLv:clamp(v.incomeLv||1,1,10),walletLv:clamp(v.walletLv||1,1,10),stage:clamp(v.stage||1,1,6)}}catch(e){return{gold:0,baseLv:1,incomeLv:1,walletLv:1,stage:1}}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}}
function baseMax(){return 1200} function incomeRate(){return 28} function walletMax(lv){return 800+(lv-1)*120}
function resize(){let d=Math.min(2,devicePixelRatio||1);C.width=innerWidth*d;C.height=innerHeight*d;C.style.width=innerWidth+'px';C.style.height=innerHeight+'px';X.setTransform(d,0,0,d,0,0)} addEventListener('resize',resize,{passive:true});resize();
function fighter(t,x,team){return Object.assign({},t,{x:x,team:team,maxHp:t.hp,hp:t.hp,cd:Math.random()*.12,flash:0,dead:false})}
function fresh(){let h=baseMax(),stage=save.stage;return{running:true,paused:false,time:0,money:160,income:incomeRate(),walletLv:1,maxMoney:walletMax(1),ally:{hp:h,maxHp:h},enemy:{hp:1500,maxHp:1500},a:[],e:[],stage:stage,plan:STAGE_PLANS[stage]||[],spawn:0,nextRabbit:2,bossSpawned:false,cools:{},shake:0}}
function start(){s=fresh();q('startOverlay').hidden=true;q('result').hidden=true;q('battleBar').hidden=false;q('phase').textContent='전투 중';q('stageLabel').textContent='스테이지 '+s.stage;last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);hud()}
function buttons(){let bar=q('unitBar');bar.innerHTML='';Object.keys(U).forEach(k=>{let u=U[k],b=document.createElement('button');b.type='button';b.className='unit';b.dataset.unit=k;b.innerHTML='<b>'+u.icon+' '+u.name+'</b><small>HP '+u.hp+' · 공격 '+u.atk+'</small><em>'+u.cost+'</em><i class="cd"></i>';b.addEventListener('click',()=>summon(k));bar.appendChild(b)})}
function summon(k){if(!s||!s.running||s.paused)return;let u=U[k];if((s.cools[k]||0)>0||s.money<u.cost)return;s.money-=u.cost;s.cools[k]=u.cool;s.a.push(fighter(u,86,'ally'));toast(u.name+' 출격!')}
function spawn(k){s.e.push(fighter(E[k],innerWidth-92,'enemy'));if(k==='boss')toast('보스 바위왕 등장!')}
function loop(now){if(!s||!s.running)return;let dt=Math.min(.035,(now-last)/1000||0);last=now;if(!s.paused)update(dt);draw();hud();if(s&&s.running)raf=requestAnimationFrame(loop)}
function update(dt){s.time+=dt;s.money=Math.min(s.maxMoney,s.money+s.income*dt);Object.keys(s.cools).forEach(k=>s.cools[k]=Math.max(0,s.cools[k]-dt));if(s.stage===6){while(!s.bossSpawned&&s.time>=s.nextRabbit){spawn('rabbit');s.nextRabbit+=4}}else{while(s.spawn<s.plan.length&&s.plan[s.spawn][0]<=s.time){spawn(s.plan[s.spawn][1]);s.spawn++}}team(s.a,s.e,'ally',dt);team(s.e,s.a,'enemy',dt);s.a=s.a.filter(v=>!v.dead);s.e=s.e.filter(v=>!v.dead);s.shake=Math.max(0,s.shake-dt*18);if(s.enemy.hp<=0)finish(true);else if(s.ally.hp<=0)finish(false)}
function team(group,foes,side,dt){let dir=side==='ally'?1:-1,frontX=side==='ally'?Math.max(-Infinity,...group.filter(o=>!o.dead).map(o=>o.x)):-Infinity;group.forEach(f=>{f.cd=Math.max(0,f.cd-dt);f.flash=Math.max(0,f.flash-dt);let target=null,best=1e9;foes.forEach(e=>{if(e.dead)return;let dist=Math.abs(e.x-f.x)-(e.size+f.size)*.62;if((side==='ally'&&e.x<f.x-4)||(side==='enemy'&&e.x>f.x+4))return;if(dist<best){best=dist;target=e}});let bx=side==='ally'?innerWidth-57:57,bd=Math.abs(bx-f.x)-28;if(target&&best<=f.range)hit(f,target,foes);else if(bd<=f.range){if(f.cd<=0){if(side==='ally'&&s.stage===6&&!s.bossSpawned){s.bossSpawned=true;spawn('boss');toast('성을 공격했다! 바위왕 등장!')}let b=side==='ally'?s.enemy:s.ally;b.hp=Math.max(0,b.hp-f.atk);f.cd=f.rate;s.shake=Math.min(6,s.shake+1.5)}}else{let block=side==='ally'?null:ahead(group,f,dir),catchup=side==='ally'&&frontX-f.x>6?Math.min(2.2,1+(frontX-f.x)/70):1;if(side==='ally'||!block||Math.abs(block.x-f.x)>f.size+block.size+3)f.x+=dir*f.speed*catchup*dt;f.x=clamp(f.x,63,innerWidth-63)}})}
function ahead(group,f,dir){let r=null,d=1e9;group.forEach(o=>{if(o===f||o.dead)return;let z=(o.x-f.x)*dir;if(z>0&&z<d){d=z;r=o}});return r}
function hit(a,t,foes){if(a.cd>0)return;const targets=a.team==='enemy'&&a.splash?foes.filter(o=>!o.dead&&Math.abs(o.x-t.x)<=a.splash):[t];targets.forEach(o=>{o.hp-=a.atk;o.flash=.16;if(o.hp<=0&&!o.dead){o.dead=true;if(a.team==='ally')s.money=Math.min(s.maxMoney,s.money+(o.reward||0))}});a.cd=a.rate;if(a.team==='enemy'&&a.splash&&targets.length>1){s.shake=Math.min(7,s.shake+2.2)}}
function finish(win){if(!s||!s.running)return;s.running=false;cancelAnimationFrame(raf);q('battleBar').hidden=true;let reward=win?120:25,cleared=s.stage;save.gold+=reward;if(win&&save.stage<6)save.stage++;persist();q('resultTitle').textContent=win?(cleared===6?'최종 스테이지 승리!':'승리!'):'아지트 함락';q('resultDesc').textContent=win?(cleared===6?'바위왕과 적 성을 모두 무너뜨렸어.':cleared+'스테이지 클리어. '+save.stage+'스테이지 해금!'):'이번엔 밀렸어. 다시 도전해.';q('retry').textContent=win&&cleared<6?'다음 스테이지 준비':'다시 도전';q('result').hidden=false;meta()}
function world(w,h,g){let sky=X.createLinearGradient(0,0,0,g);sky.addColorStop(0,'#bde9ff');sky.addColorStop(1,'#f9f1c3');X.fillStyle=sky;X.fillRect(0,0,w,g);X.fillStyle='#d9f2a7';X.beginPath();X.moveTo(0,g-90);for(let x=0;x<=w;x+=70)X.quadraticCurveTo(x+35,g-125+(x%140?16:0),x+70,g-90);X.lineTo(w,g);X.lineTo(0,g);X.fill();X.fillStyle='#caa36a';X.fillRect(0,g,w,h-g);X.fillStyle='#b48a56';for(let x=0;x<w;x+=42)X.fillRect(x,g+18+(x%84?7:0),24,5);base(42,g-22,'ally');base(w-42,g-22,'enemy')}
function base(x,y,side){X.save();X.translate(x,y);X.fillStyle=side==='ally'?'#f6fbff':'#594a57';X.strokeStyle='#26374e';X.lineWidth=3;X.fillRect(-27,-51,54,51);X.strokeRect(-27,-51,54,51);X.fillStyle=side==='ally'?'#7bd0ff':'#ff806f';X.beginPath();X.moveTo(-33,-51);X.lineTo(0,-75);X.lineTo(33,-51);X.closePath();X.fill();X.stroke();X.fillStyle='#26374e';X.fillRect(-7,-20,14,20);X.fillStyle='#fff';X.font='bold 12px system-ui';X.textAlign='center';X.fillText(side==='ally'?'고양이':'상대',0,-32);X.restore()}
function draw(){let w=innerWidth,h=innerHeight,g=h-Math.min(110,h*.19)-58;X.save();if(s)X.translate((Math.random()-.5)*s.shake,0);world(w,h,g);if(s){s.a.forEach(f=>actor(f,g));s.e.forEach(f=>actor(f,g))}X.restore()}
function actor(f,g){let y=g-8;X.save();X.translate(f.x,y);if(f.team==='enemy')X.scale(-1,1);X.lineWidth=2.5;X.strokeStyle='#26374e';X.fillStyle=f.flash>0?'#fff':(f.team==='ally'?'#f7fbff':enemyColor(f.kind));body(f);X.stroke();face(f);gear(f);if(f.team==='enemy')X.scale(-1,1);let hp=clamp(f.hp/f.maxHp,0,1);X.fillStyle='#26374e';X.fillRect(-f.size,-f.size-18,f.size*2,5);X.fillStyle=f.team==='ally'?'#65d77a':'#ff6c69';X.fillRect(-f.size+1,-f.size-17,(f.size*2-2)*hp,3);if(f.kind==='boss'){X.fillStyle='#26374e';X.font='bold 9px system-ui';X.textAlign='center';X.fillText('바위왕',0,-f.size-23)}X.restore()}
function body(f){let z=f.size;X.beginPath();if(f.kind==='rush'||f.kind==='boar')X.ellipse(0,-z*.5,z*1.08,z*.72,0,0,Math.PI*2);else if(f.kind==='boss'){X.moveTo(-z,-z*.2);for(let i=0;i<8;i++){let a=i/8*Math.PI*2,r=i%2?z*.86:z;X.lineTo(Math.cos(a)*r,Math.sin(a)*r-z*.55)}X.closePath()}else X.arc(0,-z*.55,z,0,Math.PI*2);X.fill();if(f.team==='ally'){X.beginPath();X.moveTo(-z*.65,-z*1.18);X.lineTo(-z*.28,-z*1.78);X.lineTo(-z*.05,-z*1.2);X.closePath();X.moveTo(z*.05,-z*1.2);X.lineTo(z*.28,-z*1.78);X.lineTo(z*.65,-z*1.18);X.closePath();X.fill();}}
function face(f){let z=f.size;X.fillStyle='#26374e';X.beginPath();X.arc(-z*.28,-z*.68,2.2,0,Math.PI*2);X.arc(z*.28,-z*.68,2.2,0,Math.PI*2);X.fill();X.beginPath();X.arc(0,-z*.5,z*.2,0,Math.PI);X.stroke()}
function gear(f){let z=f.size;X.strokeStyle='#26374e';X.fillStyle='#26374e';X.lineWidth=3;if(f.kind==='shield'){X.fillStyle='#8bc9ff';X.fillRect(z*.45,-z*1.12,z*.72,z*1.12);X.strokeRect(z*.45,-z*1.12,z*.72,z*1.12)}else if(f.kind==='spear'){X.beginPath();X.moveTo(z*.45,-z*.7);X.lineTo(z*1.65,-z*1.3);X.stroke()}else if(f.kind==='ranger'){X.beginPath();X.arc(z*.6,-z*.55,z*.55,-1.2,1.2);X.stroke()}else if(f.kind==='rush'){X.beginPath();X.moveTo(-z*.55,-z*1.25);X.lineTo(-z*.25,-z*1.7);X.lineTo(0,-z*1.2);X.moveTo(z*.25,-z*1.2);X.lineTo(z*.55,-z*1.65);X.lineTo(z*.75,-z*1.08);X.stroke()}else if(f.kind==='rabbit'){X.beginPath();X.ellipse(-z*.35,-z*1.55,z*.22,z*.65,-.2,0,Math.PI*2);X.ellipse(z*.35,-z*1.55,z*.22,z*.65,.2,0,Math.PI*2);X.stroke()}else if(f.kind==='mole'){X.fillStyle='#78879a';X.fillRect(-z*.85,-z*1.1,z*1.7,z*.42)}else if(f.kind==='boar'){X.fillStyle='#fff3da';X.beginPath();X.moveTo(z*.7,-z*.55);X.lineTo(z*1.15,-z*.34);X.lineTo(z*.72,-z*.2);X.fill()}else if(f.kind==='boss'){X.fillStyle='#ffd15a';X.fillRect(-z*.5,-z*1.6,z,.3)}}
function enemyColor(k){return{mouse:'#c7b7a7',rabbit:'#ffb2aa',mole:'#8291a2',boar:'#d86d61',boss:'#7d746d'}[k]||'#ddd'}
function walletUpgradeCost(){return s.walletLv>=10?Infinity:Math.round(90*Math.pow(1.65,s.walletLv-1))}
function upgradeBattleWallet(){if(!s||!s.running||s.paused)return;if(s.walletLv>=10)return toast('최대 레벨이야');let cost=walletUpgradeCost();if(s.money<cost)return toast('재화가 부족해');s.money-=cost;s.walletLv++;s.maxMoney=walletMax(s.walletLv);toast('최대 재화 '+s.maxMoney+'까지 증가!');hud()}
function hud(){if(!s)return;q('money').textContent=Math.floor(s.money)+' / '+s.maxMoney;q('income').textContent='초당 +'+s.income;q('timer').textContent=Math.floor(s.time)+'초';q('allyText').textContent=Math.ceil(s.ally.hp)+' / '+s.ally.maxHp;q('enemyText').textContent=Math.ceil(s.enemy.hp)+' / '+s.enemy.maxHp;q('allyBar').style.width=100*s.ally.hp/s.ally.maxHp+'%';q('enemyBar').style.width=100*s.enemy.hp/s.enemy.maxHp+'%';let wc=walletUpgradeCost(),wb=q('walletBattle');wb.disabled=s.paused||s.walletLv>=10||s.money<wc;wb.textContent=s.walletLv>=10?'최대 재화 MAX':'최대 재화 Lv.'+s.walletLv+' · '+wc;document.querySelectorAll('.unit').forEach(b=>{let k=b.dataset.unit,u=U[k],cd=s.cools[k]||0;b.disabled=s.paused||s.money<u.cost||cd>0;b.querySelector('.cd').style.height=100*cd/u.cool+'%'})}
function toast(m){let t=q('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('on'),1300)}
function meta(){q('stageMeta').textContent=save.stage+'스테이지';q('stageLabel').textContent='스테이지 '+save.stage;q('start').textContent=save.stage+'스테이지 시작'}
q('start').addEventListener('click',start);q('retry').addEventListener('click',()=>{q('result').hidden=true;q('startOverlay').hidden=false;meta()});q('walletBattle').addEventListener('click',upgradeBattleWallet);q('pause').addEventListener('click',()=>{if(!s||!s.running)return;s.paused=!s.paused;q('pause').textContent=s.paused?'계속':'일시정지';q('phase').textContent=s.paused?'일시정지':'전투 중';last=performance.now()});
buttons();meta();draw();
</script>
</body>
</html>
