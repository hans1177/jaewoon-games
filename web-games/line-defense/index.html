*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#a7ddff;color:#142033;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;touch-action:manipulation}button{font:inherit}#game{position:fixed;inset:0;width:100%;height:100%;display:block}.panel{background:#ffffffed;border:2px solid #24364f;border-radius:13px;box-shadow:0 4px 0 #24364f}.hud{position:fixed;z-index:20;left:7px;right:7px;top:max(7px,env(safe-area-inset-top));display:grid;grid-template-columns:1fr auto;gap:6px;pointer-events:none}.stats{padding:6px;display:flex;gap:5px;flex-wrap:wrap}.pill{padding:4px 6px;border:1px solid #24364f;border-radius:999px;background:#f6fbff;font-size:9px;font-weight:1000}.money{background:#fff1a9}.phase{padding:6px 8px;text-align:right;min-width:83px}.phase b{display:block;font-size:10px}.phase small{font-size:8px;color:#58708f}.bases{position:fixed;z-index:19;left:8px;right:8px;top:62px;display:grid;grid-template-columns:1fr 1fr;gap:8px;pointer-events:none}.baseBox{padding:5px 7px;border-radius:10px;background:#10233bdc;color:#fff;font-size:8px;font-weight:900}.baseBox:last-child{text-align:right}.bar{height:5px;margin-top:4px;border-radius:99px;background:#ffffff33;overflow:hidden}.fill{height:100%;background:#7de18b}.enemyFill{background:#ff9382}.tip{position:fixed;z-index:21;left:50%;top:91px;transform:translateX(-50%);max-width:78vw;padding:5px 8px;border-radius:999px;background:#13243cdb;color:#fff;font-size:8px;font-weight:900;text-align:center;pointer-events:none}.bottom{position:fixed;z-index:30;left:0;right:0;bottom:0;padding:6px 7px max(8px,env(safe-area-inset-bottom));background:#13243cf2;border-top:2px solid #263d5e}.units{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:1px 1px 4px}.units::-webkit-scrollbar{display:none}.unit{position:relative;flex:0 0 78px;min-height:58px;padding:5px 3px;border:2px solid #253852;border-radius:12px;background:#fff;color:#142033;font-weight:1000;overflow:hidden}.unit b{display:block;font-size:9px}.unit small{display:block;margin-top:2px;font-size:8px;color:#596f89}.unit em{display:inline-block;margin-top:3px;padding:2px 5px;border-radius:999px;background:#ffe66b;border:1px solid #26374e;font-size:8px;font-style:normal}.unit:disabled{opacity:.45;filter:grayscale(.6)}.cd{position:absolute;left:0;right:0;bottom:0;height:0;background:#253852aa;pointer-events:none}.tools{display:flex;gap:6px}.tools button{min-height:35px;border:2px solid #253852;border-radius:10px;background:#edf7ff;color:#15243a;font-size:9px;font-weight:1000}.tools #cannon{flex:1;background:#ffd86b}.tools #pause{width:62px}.overlay{position:fixed;z-index:100;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;background:#10233bdc}.overlay[hidden]{display:none}.card{width:min(94vw,490px);max-height:88%;overflow:auto;padding:18px 15px;border:3px solid #21334c;border-radius:20px;background:#f8fcff;box-shadow:0 7px 0 #21334c;text-align:center}.card h1{margin:0 0 6px;font-size:26px}.card p{margin:5px 0;color:#58708f;font-size:11px;line-height:1.5}.meta{margin-top:8px;padding:7px;border-radius:10px;background:#e8f4ff;font-size:9px;font-weight:900}.upgrades{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.upgrade{min-height:66px;border:2px solid #30415a;border-radius:11px;background:#edf7ff;color:#17243a;font-size:9px;font-weight:900}.upgrade b,.upgrade span,.upgrade small{display:block}.upgrade small{margin-top:4px;color:#9b6500}.start{width:100%;min-height:48px;margin-top:11px;border:2px solid #263852;border-radius:13px;background:#ffe26b;color:#18273c;font-size:14px;font-weight:1000;box-shadow:0 4px 0 #263852}.roster{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:10px;font-size:8px}.roster div{padding:5px 2px;border-radius:9px;background:#e8f4ff}.roster b{display:block;font-size:17px}.toast{position:fixed;z-index:80;left:50%;top:20%;transform:translate(-50%,-7px);max-width:84vw;padding:8px 10px;border-radius:11px;background:#13243ced;color:#fff;font-size:10px;font-weight:1000;text-align:center;opacity:0;transition:.18s;pointer-events:none}.toast.on{opacity:1;transform:translate(-50%,0)}@media(max-width:360px){.unit{flex-basis:72px}.upgrades{grid-template-columns:1fr}.upgrade{min-height:49px}.pill{padding:3px 5px}}

<body>
<!-- 파일명: web-games/line-defense/index.html -->
<canvas id="game"></canvas>
<div class="hud"><div class="stats panel"><span class="pill money" id="money">0 / 800</span><span class="pill" id="income">초당 +28</span><span class="pill" id="timer">0초</span></div><div class="phase panel"><b id="phase">준비</b><small>골목 1</small></div></div>
<div class="bases"><div class="baseBox">우리 아지트 <span id="allyText">1200 / 1200</span><div class="bar"><div class="fill" id="allyBar"></div></div></div><div class="baseBox">상대 아지트 <span id="enemyText">1500 / 1500</span><div class="bar"><div class="fill enemyFill" id="enemyBar"></div></div></div></div>
<div class="tip">재화를 모아 군단을 출격시켜 상대 아지트를 부숴!</div><div class="toast" id="toast"></div>
<div class="bottom"><div class="units" id="unitBar"></div><div class="tools"><button id="cannon" type="button">📣 응원포 <span id="cannonText">준비</span></button><button id="pause" type="button">일시정지</button></div></div>
<div class="overlay" id="startOverlay"><div class="card"><h1>골목 군단 대전</h1><p>한 줄 자동 전투와 유닛 소환의 재미를 살린 독자적인 라인 디펜스야.</p><div class="meta">강화 골드 <b id="gold">0G</b></div><div class="upgrades"><button class="upgrade" id="upBase" type="button"><b>아지트 강화</b><span id="baseLv">Lv.1</span><small id="baseCost">80G</small></button><button class="upgrade" id="upIncome" type="button"><b>생산 강화</b><span id="incomeLv">Lv.1</span><small id="incomeCost">100G</small></button><button class="upgrade" id="upWallet" type="button"><b>최대 재화 강화</b><span id="walletLv">Lv.1</span><small id="walletCost">90G</small></button></div><button class="start" id="start" type="button">골목 1 시작</button><div class="roster"><div><b>●</b>몽글이</div><div><b>▣</b>방패콩</div><div><b>▲</b>창발이</div><div><b>✦</b>새총이</div><div><b>◆</b>돌진멍</div></div></div></div>
<div class="overlay" id="result" hidden><div class="card"><h1 id="resultTitle">승리!</h1><p id="resultDesc"></p><button class="start" id="retry" type="button">다시 도전</button></div></div>
<script>
const C=document.getElementById('game'),X=C.getContext('2d'),q=id=>document.getElementById(id),KEY='jaewoon-line-defense-v1';
const U={blob:{name:'몽글이',icon:'●',cost:60,hp:85,atk:11,range:28,speed:34,rate:.72,cool:2.2,size:17,kind:'blob'},shield:{name:'방패콩',icon:'▣',cost:120,hp:280,atk:7,range:29,speed:21,rate:1.05,cool:4.5,size:20,kind:'shield'},spear:{name:'창발이',icon:'▲',cost:180,hp:135,atk:36,range:47,speed:27,rate:.82,cool:5,size:18,kind:'spear'},ranger:{name:'새총이',icon:'✦',cost:240,hp:95,atk:28,range:145,speed:22,rate:1.2,cool:6.5,size:17,kind:'ranger'},rush:{name:'돌진멍',icon:'◆',cost:360,hp:165,atk:68,range:34,speed:50,rate:.95,cool:9,size:20,kind:'rush'}};
const U={blob:{name:'몽글이',icon:'●',cost:60,hp:85,atk:11,range:28,speed:34,rate:.72,cool:2.2,size:17,kind:'blob'},shield:{name:'방패콩',icon:'▣',cost:120,hp:280,atk:7,range:29,speed:21,rate:1.05,cool:4.5,size:20,kind:'shield'},spear:{name:'창발이',icon:'▲',cost:180,hp:135,atk:36,range:47,speed:27,rate:.82,cool:5,size:18,kind:'spear'},ranger:{name:'새총이',icon:'✦',cost:240,hp:95,atk:28,range:145,speed:22,rate:1.2,cool:6.5,size:17,kind:'ranger'},rush:{name:'돌진멍',icon:'◆',cost:360,hp:165,atk:68,range:34,speed:50,rate:.95,cool:9,size:20,kind:'rush'}};
const E={mouse:{name:'먼지쥐',hp:90,atk:9,range:27,speed:29,rate:.9,size:16,reward:13,kind:'mouse'},rabbit:{name:'뿔토끼',hp:155,atk:17,range:30,speed:36,rate:.78,size:18,reward:22,kind:'rabbit'},mole:{name:'갑옷두더지',hp:360,atk:22,range:28,speed:19,rate:1.05,size:22,reward:40,kind:'mole'},boar:{name:'붉은멧돼지',hp:460,atk:39,range:34,speed:30,rate:1.2,size:24,reward:55,kind:'boar'},boss:{name:'바위왕',hp:1350,atk:58,range:42,speed:14,rate:1.25,size:34,reward:180,kind:'boss'}};
const PLAN=[[2,'mouse'],[5,'mouse'],[8,'rabbit'],[11,'mouse'],[14,'rabbit'],[17,'mole'],[20,'mouse'],[22,'rabbit'],[25,'rabbit'],[28,'mole'],[31,'boar'],[34,'mouse'],[36,'rabbit'],[38,'mole'],[41,'boar'],[44,'rabbit'],[46,'mole'],[49,'boss'],[53,'boar'],[57,'mole']];
let save=load(),s=null,last=0,raf=0,toastTimer=0;
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function load(){try{let v=JSON.parse(localStorage.getItem(KEY)||'{}');return{gold:Math.max(0,v.gold||0),baseLv:clamp(v.baseLv||1,1,10),incomeLv:clamp(v.incomeLv||1,1,10),walletLv:clamp(v.walletLv||1,1,10)}}catch(e){return{gold:0,baseLv:1,incomeLv:1,walletLv:1}}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}}
function baseMax(){return 1200+(save.baseLv-1)*180} function incomeRate(){return 28+(save.incomeLv-1)*5} function walletMax(){return 800+(save.walletLv-1)*120}
function resize(){let d=Math.min(2,devicePixelRatio||1);C.width=innerWidth*d;C.height=innerHeight*d;C.style.width=innerWidth+'px';C.style.height=innerHeight+'px';X.setTransform(d,0,0,d,0,0)} addEventListener('resize',resize,{passive:true});resize();
function fighter(t,x,team){return Object.assign({},t,{x:x,team:team,maxHp:t.hp,hp:t.hp,cd:Math.random()*.12,flash:0,dead:false})}
function fresh(){let h=baseMax();return{running:true,paused:false,time:0,money:160,income:incomeRate(),maxMoney:walletMax(),ally:{hp:h,maxHp:h},enemy:{hp:1500,maxHp:1500},a:[],e:[],spawn:0,cools:{},cannon:0,cannonReady:true,shake:0}}
function start(){s=fresh();q('startOverlay').hidden=true;q('result').hidden=true;q('phase').textContent='전투 중';last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);hud()}
function buttons(){let bar=q('unitBar');bar.innerHTML='';Object.keys(U).forEach(k=>{let u=U[k],b=document.createElement('button');b.type='button';b.className='unit';b.dataset.unit=k;b.innerHTML='<b>'+u.icon+' '+u.name+'</b><small>HP '+u.hp+' · 공격 '+u.atk+'</small><em>'+u.cost+'</em><i class="cd"></i>';b.addEventListener('click',()=>summon(k));bar.appendChild(b)})}
function summon(k){if(!s||!s.running||s.paused)return;let u=U[k];if((s.cools[k]||0)>0||s.money<u.cost)return;s.money-=u.cost;s.cools[k]=u.cool;s.a.push(fighter(u,86,'ally'));toast(u.name+' 출격!')}
function spawn(k){s.e.push(fighter(E[k],innerWidth-92,'enemy'));if(k==='boss')toast('보스 바위왕 등장!')}
function loop(now){if(!s||!s.running)return;let dt=Math.min(.035,(now-last)/1000||0);last=now;if(!s.paused)update(dt);draw();hud();if(s&&s.running)raf=requestAnimationFrame(loop)}
function update(dt){s.time+=dt;s.money=Math.min(s.maxMoney,s.money+s.income*dt);Object.keys(s.cools).forEach(k=>s.cools[k]=Math.max(0,s.cools[k]-dt));if(!s.cannonReady){s.cannon-=dt;if(s.cannon<=0){s.cannon=0;s.cannonReady=true;toast('응원포 충전 완료!')}}while(s.spawn<PLAN.length&&PLAN[s.spawn][0]<=s.time){spawn(PLAN[s.spawn][1]);s.spawn++}team(s.a,s.e,'ally',dt);team(s.e,s.a,'enemy',dt);s.a=s.a.filter(v=>!v.dead);s.e=s.e.filter(v=>!v.dead);s.shake=Math.max(0,s.shake-dt*18);if(s.enemy.hp<=0)finish(true);else if(s.ally.hp<=0)finish(false)}
function team(group,foes,side,dt){let dir=side==='ally'?1:-1;group.forEach(f=>{f.cd=Math.max(0,f.cd-dt);f.flash=Math.max(0,f.flash-dt);let target=null,best=1e9;foes.forEach(e=>{if(e.dead)return;let dist=Math.abs(e.x-f.x)-(e.size+f.size)*.62;if((side==='ally'&&e.x<f.x-4)||(side==='enemy'&&e.x>f.x+4))return;if(dist<best){best=dist;target=e}});let bx=side==='ally'?innerWidth-57:57,bd=Math.abs(bx-f.x)-28;if(target&&best<=f.range)hit(f,target);else if(bd<=f.range){if(f.cd<=0){let b=side==='ally'?s.enemy:s.ally;b.hp=Math.max(0,b.hp-f.atk);f.cd=f.rate;s.shake=Math.min(6,s.shake+1.5)}}else{let block=ahead(group,f,dir);if(!block||Math.abs(block.x-f.x)>f.size+block.size+3)f.x+=dir*f.speed*dt;f.x=clamp(f.x,63,innerWidth-63)}})}
function ahead(group,f,dir){let r=null,d=1e9;group.forEach(o=>{if(o===f||o.dead)return;let z=(o.x-f.x)*dir;if(z>0&&z<d){d=z;r=o}});return r}
function hit(a,t){if(a.cd>0)return;t.hp-=a.atk;t.flash=.12;a.cd=a.rate;if(t.hp<=0&&!t.dead){t.dead=true;if(a.team==='ally')s.money=Math.min(s.maxMoney,s.money+(t.reward||0))}}
function fire(){if(!s||!s.running||s.paused||!s.cannonReady)return;s.cannonReady=false;s.cannon=25;s.e.forEach(e=>{e.hp-=95;e.flash=.2;e.x=Math.min(innerWidth-75,e.x+34);if(e.hp<=0)e.dead=true});s.shake=6;toast('응원포 발사! 적 전체 95 피해')}
function finish(win){if(!s||!s.running)return;s.running=false;cancelAnimationFrame(raf);let reward=win?120:25;save.gold+=reward;persist();q('resultTitle').textContent=win?'승리!':'아지트 함락';q('resultDesc').textContent=win?'상대 아지트를 부쉈어. 강화 골드 '+reward+'G 획득!':'이번엔 밀렸어. 재도전 지원금 '+reward+'G 획득.';q('retry').textContent=win?'강화하고 다시 하기':'다시 도전';q('result').hidden=false;meta()}
function world(w,h,g){let sky=X.createLinearGradient(0,0,0,g);sky.addColorStop(0,'#bde9ff');sky.addColorStop(1,'#f9f1c3');X.fillStyle=sky;X.fillRect(0,0,w,g);X.fillStyle='#d9f2a7';X.beginPath();X.moveTo(0,g-90);for(let x=0;x<=w;x+=70)X.quadraticCurveTo(x+35,g-125+(x%140?16:0),x+70,g-90);X.lineTo(w,g);X.lineTo(0,g);X.fill();X.fillStyle='#caa36a';X.fillRect(0,g,w,h-g);X.fillStyle='#b48a56';for(let x=0;x<w;x+=42)X.fillRect(x,g+18+(x%84?7:0),24,5);base(42,g-22,'ally');base(w-42,g-22,'enemy')}
function base(x,y,side){X.save();X.translate(x,y);X.fillStyle=side==='ally'?'#f6fbff':'#594a57';X.strokeStyle='#26374e';X.lineWidth=3;X.fillRect(-27,-51,54,51);X.strokeRect(-27,-51,54,51);X.fillStyle=side==='ally'?'#7bd0ff':'#ff806f';X.beginPath();X.moveTo(-33,-51);X.lineTo(0,-75);X.lineTo(33,-51);X.closePath();X.fill();X.stroke();X.fillStyle='#26374e';X.fillRect(-7,-20,14,20);X.fillStyle='#fff';X.font='bold 12px system-ui';X.textAlign='center';X.fillText(side==='ally'?'우리':'상대',0,-32);X.restore()}
function draw(){let w=innerWidth,h=innerHeight,g=h-Math.min(110,h*.19)-58;X.save();if(s)X.translate((Math.random()-.5)*s.shake,0);world(w,h,g);if(s){s.a.forEach(f=>actor(f,g));s.e.forEach(f=>actor(f,g))}X.restore()}
function actor(f,g){let y=g-8;X.save();X.translate(f.x,y);if(f.team==='enemy')X.scale(-1,1);X.lineWidth=2.5;X.strokeStyle='#26374e';X.fillStyle=f.flash>0?'#fff':(f.team==='ally'?'#f7fbff':enemyColor(f.kind));body(f);X.stroke();face(f);gear(f);if(f.team==='enemy')X.scale(-1,1);let hp=clamp(f.hp/f.maxHp,0,1);X.fillStyle='#26374e';X.fillRect(-f.size,-f.size-18,f.size*2,5);X.fillStyle=f.team==='ally'?'#65d77a':'#ff6c69';X.fillRect(-f.size+1,-f.size-17,(f.size*2-2)*hp,3);if(f.kind==='boss'){X.fillStyle='#26374e';X.font='bold 9px system-ui';X.textAlign='center';X.fillText('바위왕',0,-f.size-23)}X.restore()}
function body(f){let z=f.size;X.beginPath();if(f.kind==='rush'||f.kind==='boar')X.ellipse(0,-z*.5,z*1.08,z*.72,0,0,Math.PI*2);else if(f.kind==='boss'){X.moveTo(-z,-z*.2);for(let i=0;i<8;i++){let a=i/8*Math.PI*2,r=i%2?z*.86:z;X.lineTo(Math.cos(a)*r,Math.sin(a)*r-z*.55)}X.closePath()}else X.arc(0,-z*.55,z,0,Math.PI*2);X.fill()}
function face(f){let z=f.size;X.fillStyle='#26374e';X.beginPath();X.arc(-z*.28,-z*.68,2.2,0,Math.PI*2);X.arc(z*.28,-z*.68,2.2,0,Math.PI*2);X.fill();X.beginPath();X.arc(0,-z*.5,z*.2,0,Math.PI);X.stroke()}
function gear(f){let z=f.size;X.strokeStyle='#26374e';X.fillStyle='#26374e';X.lineWidth=3;if(f.kind==='shield'){X.fillStyle='#8bc9ff';X.fillRect(z*.45,-z*1.12,z*.72,z*1.12);X.strokeRect(z*.45,-z*1.12,z*.72,z*1.12)}else if(f.kind==='spear'){X.beginPath();X.moveTo(z*.45,-z*.7);X.lineTo(z*1.65,-z*1.3);X.stroke()}else if(f.kind==='ranger'){X.beginPath();X.arc(z*.6,-z*.55,z*.55,-1.2,1.2);X.stroke()}else if(f.kind==='rush'){X.beginPath();X.moveTo(-z*.55,-z*1.25);X.lineTo(-z*.25,-z*1.7);X.lineTo(0,-z*1.2);X.moveTo(z*.25,-z*1.2);X.lineTo(z*.55,-z*1.65);X.lineTo(z*.75,-z*1.08);X.stroke()}else if(f.kind==='rabbit'){X.beginPath();X.ellipse(-z*.35,-z*1.55,z*.22,z*.65,-.2,0,Math.PI*2);X.ellipse(z*.35,-z*1.55,z*.22,z*.65,.2,0,Math.PI*2);X.stroke()}else if(f.kind==='mole'){X.fillStyle='#78879a';X.fillRect(-z*.85,-z*1.1,z*1.7,z*.42)}else if(f.kind==='boar'){X.fillStyle='#fff3da';X.beginPath();X.moveTo(z*.7,-z*.55);X.lineTo(z*1.15,-z*.34);X.lineTo(z*.72,-z*.2);X.fill()}else if(f.kind==='boss'){X.fillStyle='#ffd15a';X.fillRect(-z*.5,-z*1.6,z,.3)}}
function enemyColor(k){return{mouse:'#c7b7a7',rabbit:'#ffb2aa',mole:'#8291a2',boar:'#d86d61',boss:'#7d746d'}[k]||'#ddd'}
function hud(){if(!s)return;q('money').textContent=Math.floor(s.money)+' / '+s.maxMoney;q('income').textContent='초당 +'+s.income;q('timer').textContent=Math.floor(s.time)+'초';q('allyText').textContent=Math.ceil(s.ally.hp)+' / '+s.ally.maxHp;q('enemyText').textContent=Math.ceil(s.enemy.hp)+' / '+s.enemy.maxHp;q('allyBar').style.width=100*s.ally.hp/s.ally.maxHp+'%';q('enemyBar').style.width=100*s.enemy.hp/s.enemy.maxHp+'%';q('cannon').disabled=!s.cannonReady||s.paused;q('cannonText').textContent=s.cannonReady?'준비':Math.ceil(s.cannon)+'초';document.querySelectorAll('.unit').forEach(b=>{let k=b.dataset.unit,u=U[k],cd=s.cools[k]||0;b.disabled=s.paused||s.money<u.cost||cd>0;b.querySelector('.cd').style.height=100*cd/u.cool+'%'})}
function toast(m){let t=q('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('on'),1300)}
function upgradeCost(k,lv){return Math.round({baseLv:80,incomeLv:100,walletLv:90}[k]*Math.pow(1.65,lv-1))}
function upgrade(k){let lv=save[k];if(lv>=10)return toast('최대 레벨이야');let c=upgradeCost(k,lv);if(save.gold<c)return toast('골드가 부족해');save.gold-=c;save[k]++;persist();meta();toast('강화 완료!')}
function meta(){q('gold').textContent=save.gold+'G';[['base','baseLv'],['income','incomeLv'],['wallet','walletLv']].forEach(v=>{q(v[0]+'Lv').textContent='Lv.'+save[v[1]];q(v[0]+'Cost').textContent=save[v[1]]>=10?'MAX':upgradeCost(v[1],save[v[1]])+'G'})}
q('start').addEventListener('click',start);q('retry').addEventListener('click',()=>{q('result').hidden=true;q('startOverlay').hidden=false;meta()});q('cannon').addEventListener('click',fire);q('pause').addEventListener('click',()=>{if(!s||!s.running)return;s.paused=!s.paused;q('pause').textContent=s.paused?'계속':'일시정지';q('phase').textContent=s.paused?'일시정지':'전투 중';last=performance.now()});q('upBase').addEventListener('click',()=>upgrade('baseLv'));q('upIncome').addEventListener('click',()=>upgrade('incomeLv'));q('upWallet').addEventListener('click',()=>upgrade('walletLv'));
buttons();meta();draw();
</script>
</body>
</html>
