<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08111b">
  <title>수정의 개화</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1e2a38;
      color: #ffffff;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #08111b;
      color: #ffffff;
      padding: 1rem;
      text-align: center;
    }
    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 0;
    }
    .game-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #2a3e4d;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }
    .game-title {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    .game-description {
      font-size: 1.2rem;
      max-width: 800px;
      margin-bottom: 1rem;
    }
    .progression-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      max-width: 800px;
      margin: 1rem auto;
    }
    .progression-step {
      background-color: #3a4e5e;
      padding: 1rem;
      border-radius: 8px;
      width: 100%;
      text-align: center;
      font-size: 0.9rem;
      color: #ffffff;
    }
    .progression-step.completed {
      background-color: #4f6a7d;
    }
    .progression-step.active {
      background-color: #5f7a8a;
    }
    .progression-step.disabled {
      background-color: #7f9a9f;
    }
    .progression-step button {
      padding: 0.5rem 1rem;
      font-size: 0.8rem;
      border: 1px solid #ffffff;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .progression-step button:hover {
      background-color: #ffffff;
    }
    .progression-step button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .ui-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      max-width: 800px;
      margin: 1rem auto;
    }
    .ui-element {
      background-color: #4f6a7d;
      padding: 1rem;
      border-radius: 8px;
      width: 100%;
      text-align: center;
      font-size: 0.9rem;
      color: #ffffff;
    }
    .ui-element button {
      padding: 0.5rem 1rem;
      font-size: 0.8rem;
      border: 1px solid #ffffff;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .ui-element button:hover {
      background-color: #ffffff;
    }
    .ui-element button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .combat-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      max-width: 800px;
      margin: 1rem auto;
    }
    .combat-element {
      background-color: #5f7a8a;
      padding: 1rem;
      border-radius: 8px;
      width: 100%;
      text-align: center;
      font-size: 0.9rem;
      color: #ffffff;
    }
    .combat-element button {
      padding: 0.5rem 1rem;
      font-size: 0.8rem;
      border: 1px solid #ffffff;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .combat-element button:hover {
      background-color: #ffffff;
    }
    .combat-element button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .economy-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      max-width: 800px;
      margin: 1rem auto;
    }
    .economy-element {
      background-color: #7f9a9f;
      padding: 1rem;
      border-radius: 8px;
      width: 100%;
      text-align: center;
      font-size: 0.9rem;
      color: #ffffff;
    }
    .economy-element button {
      padding: 0.5rem 1rem;
      font-size: 0.8rem;
      border: 1px solid #ffffff;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .economy-element button:hover {
      background-color: #ffffff;
    }
    .economy-element button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .restart-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      max-width: 800px;
      margin: 1rem auto;
    }
    .restart-element {
      background-color: #9faeab;
      padding: 1rem;
      border-radius: 8px;
      width: 100%;
      text-align: center;
      font-size: 0.9rem;
      color: #ffffff;
    }
    .restart-element button {
      padding: 0.5rem 1rem;
      font-size: 0.8rem;
      border: 1px solid #ffffff;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .restart-element button:hover {
      background-color: #ffffff;
    }
    .restart-element button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .save-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      max-width: 800px;
      margin: 1rem auto;
    }
    .save-element {
      background-color: #bfcfd6;
      padding: 1rem;
      border-radius: 8px;
      width: 100%;
      text-align: center;
      font-size: 0.9rem;
      color: #ffffff;
    }
    .save-element button {
      padding: 0.5rem 1rem;
      font-size: 0.8rem;
      border: 1px solid #ffffff;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .save-element button:hover {
      background-color: #ffffff;
    }
    .save-element button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <header>
    <h1>수정의 개화</h1>
    <p>전투로 골드를 얻고 장비를 강화하며 수정 군주 10단계를 돌파하는 방치 성장 RPG.</p>
  </header>
  <div class="game-container">
    <div class="game-content">
      <div class="game-title">수정의 개화</div>
      <div class="game-description">전투로 골드를 얻고 장비를 강화하며 수정 군주 10단계를 돌파하는 방치 성장 RPG.</div>
      <div class="progression-section">
        <div class="progression-step" data-step="1" data-state="active">
          <div class="progression-step-text">1단계</div>
          <button>진행</button>
        </div>
        <div class="progression-step" data-step="2" data-state="active">
          <div class="progression-step-text">2단계</div>
          <button>진행</button>
        </div>
        <div class="progression-step" data-step="3" data-state="active">
          <div class="progression-step-text">3단계</div>
          <button>진행</button>
        </div>
        <div class="progression-step" data-step="4" data-state="active">
          <div class="progression-step-text">4단계</div>
          <button>진행</button>
        </div>
        <div class="progression-step" data-step="5" data-state="active">
          <div class="progression-step-text">5단계</div>
          <button>진행</button>
        </div>
        <div class="progression-step" data-step="6" data-state="active">
          <div class="progression-step-text">6단계</div>
          <button>진행</button>
        </div>
        <div class="progression-step" data-step="7" data-state="active">
          <div class="progression-step-text">7단계</div>
          <button>진행</button>
        </div>
        <div class="progression-step" data-step="8" data-state="active">
          <div class="progression-step-text">8단계</div>
          <button>진행</button>
        </div>
        <div class="progression-step" data-step="9" data-state="active">
          <div class="progression-step-text">9단계</div>
          <button>진행</button>
        </div>
        <div class="progression-step" data-step="10" data-state="active">
          <div class="progression-step-text">10단계</div>
          <button>진행</button>
        </div>
      </div>
      <div class="ui-section">
        <div class="ui-element">골드</div>
        <div class="ui-element">장비 강화</div>
        <div class="ui-element">전투 피드백</div>
        <div class="ui-element">강화 경제</div>
        <div class="ui-element">패배·복구·재시작</div>
        <div class="ui-element">저장 호환</div>
        <div class="ui-element">모바일 조작</div>
      </div>
      <div class="combat-section">
        <div class="combat-element">전투</div>
        <div class="combat-element">골드</div>
        <div class="combat-element">장비</div>
        <div class="combat-element">강화</div>
        <div class="combat-element">자동전투</div>
      </div>
      <div class="economy-section">
        <div class="economy-element">골드</div>
        <div class="economy-element">장비</div>
        <div class="economy-element">강화</div>
        <div class="economy-element">패배·복구</div>
        <div class="economy-element">재시작</div>
      </div>
      <div class="restart-section">
        <div class="restart-element">재시작</div>
        <div class="restart-element">복구</div>
        <div class="restart-element">패배</div>
        <div class="restart-element">저장</div>
      </div>
      <div class="save-section">
        <div class="save-element">저장</div>
        <div class="save-element">복구</div>
        <div class="save-element">재시작</div>
        <div class="save-element">패배</div>
      </div>
    </div>
  </div>
  <script src="/web-games/_shared/vibe2-final.js"></script>
</body>
</html>
