<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08111b">
  <title>수정의 개화</title>
  <link rel="stylesheet" href="/web-games/_shared/styles.css">
</head>
<body>
  <script>
    window.GAME_CONFIG = {
      id: 'seed-idle-growth-rpg-crystal-bloom',
      name: '수정의 개화',
      mode: 'crystal-idle',
      hp: 100,
      desc: '전투로 골드를 얻고 장비를 강화하며 수정 군주 10단계를 돌파하는 방치 성장 RPG.'
    };

    // Initialize game state
    let player = {
      hp: window.GAME_CONFIG.hp,
      gold: 0,
      level: 1,
      equipment: [],
      progress: 0,
      isRestarted: false
    };

    // Game loop
    function gameLoop() {
      if (player.isRestarted) {
        player.hp = window.GAME_CONFIG.hp;
        player.gold = 0;
        player.level = 1;
        player.equipment = [];
        player.progress = 0;
        player.isRestarted = false;
      }

      // Progression system
      player.progress += 0.01;
      if (player.progress >= 10) {
        player.level += 1;
        player.progress = 0;
      }

      // Combat system
      const enemy = {
        hp: 100,
        damage: 10
      };

      // Simulate combat
      while (player.hp > 0 && enemy.hp > 0) {
        player.hp -= enemy.damage;
        enemy.hp -= player.damage;
      }

      // Reward system
      if (player.gold < 100) {
        player.gold += 10;
      }

      // UI system
      const ui = document.getElementById('ui');
      ui.innerHTML = `
        <h1>수정의 개화</h1>
        <p>현재 레벨: ${player.level}</p>
        <p>현재 HP: ${player.hp}</p>
        <p>금액: ${player.gold}</p>
        <p>진행: ${player.progress.toFixed(2)} 단계</p>
        <button onclick="restartGame()">재시작</button>
      `;

      // Auto combat
      if (Math.random() < 0.1) {
        const enemy = {
          hp: 100,
          damage: 15
        };
        while (player.hp > 0 && enemy.hp > 0) {
          player.hp -= enemy.damage;
          enemy.hp -= player.damage;
        }
      }

      // Save system
      if (player.isRestarted) {
        localStorage.setItem('player', JSON.stringify(player));
      }
    }

    // Start game
    gameLoop();
  </script>
</body>
</html>
