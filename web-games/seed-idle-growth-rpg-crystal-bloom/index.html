<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08111b">
  <title>수정의 개화</title>
  <link rel="stylesheet" href="/web-games/_shared/styles.css">
</head>
<body>
  <script>
    window.GAME_CONFIG = {
      id: 'seed-idle-growth-rpg-crystal-bloom',
      name: '수정의 개화',
      mode: 'crystal-idle',
      hp: 100,
      desc: '전투로 골드를 얻고 장비를 강화하며 수정 군주 10단계를 돌파하는 방치 성장 RPG.'
    };

    // Initialize game state
    let player = {
      hp: window.GAME_CONFIG.hp,
      gold: 0,
      level: 1,
      equipment: [],
      progress: {
        stage: 1,
        target: 10
      },
      inventory: []
    };

    // Game loop
    function gameLoop() {
      // Check for progress
      if (player.progress.stage === player.progress.target) {
        alert('수정 군주 10단계를 돌파했습니다!');
        player.progress.stage = 11;
      }

      // Handle input
      const input = document.getElementById('input');
      if (input) {
        const action = input.value.trim();
        if (action) {
          // Process action
          processAction(action);
        }
      }

      // Update UI
      updateUI();

      // Request next frame
      requestAnimationFrame(gameLoop);
    }

    // Process action
    function processAction(action) {
      // Handle action logic
      // Example: collect gold, upgrade equipment, etc.
      if (action === 'collect_gold') {
        player.gold += 10;
        alert('골드를 10개 수집했습니다!');
      } else if (action === 'upgrade_equipment') {
        // Logic to upgrade equipment
        alert('장비를 강화했습니다!');
      }
    }

    // Update UI
    function updateUI() {
      document.getElementById('hp').innerText = player.hp;
      document.getElementById('gold').innerText = player.gold;
      document.getElementById('level').innerText = player.level;
      document.getElementById('progress').innerText = `현재 단계: ${player.progress.stage} / ${player.progress.target}`;
    }

    // Initialize game
    window.addEventListener('load', gameLoop);
  </script>
  <div id="input">
    <input type="text" placeholder="입력하세요">
  </div>
  <div id="hp">100</div>
  <div id="gold">0</div>
  <div id="level">1</div>
  <div id="progress">현재 단계: 1 / 10</div>
</body>
</html>
