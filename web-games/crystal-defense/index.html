<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vibe2 bootstrap</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #222;
      color: #fff;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 {
      margin-bottom: 10px;
    }
    .game {
      width: 100%;
      max-width: 800px;
      background: #111;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }
    .controls {
      margin-bottom: 20px;
    }
    .controls button {
      margin: 0 5px;
      padding: 10px 15px;
      background: #333;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .status {
      margin-top: 10px;
      font-size: 0.9em;
      color: #aaa;
    }
  </style>
</head>
<body>
  <main id="game">
    <h1>Vibe2</h1>
    <div class="game">
      <div class="controls">
        <button id="start">시작</button>
        <button id="restart">재시작</button>
      </div>
      <div class="status" id="status">준비 중...</div>
      <div class="status" id="game-over">게임 종료</div>
    </div>
  </main>
  <script>
    const game = document.getElementById('game');
    const status = document.getElementById('status');
    const gameOver = document.getElementById('game-over');
    const startBtn = document.getElementById('start');
    const restartBtn = document.getElementById('restart');

    let gameRunning = false;

    startBtn.addEventListener('click', () => {
      if (!gameRunning) {
        game.innerHTML = `
          <div class="controls">
            <button id="start">시작</button>
            <button id="restart">재시작</button>
          </div>
          <div class="status" id="status">준비 중...</div>
          <div class="status" id="game-over">게임 종료</div>
        `;
        gameRunning = true;
        status.textContent = "게임 시작";
      }
    });

    restartBtn.addEventListener('click', () => {
      if (gameRunning) {
        gameRunning = false;
        status.textContent = "게임 중지";
        gameOver.textContent = "게임 종료";
      }
    });
  </script>
</body>
</html>
