<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crystal Defense</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#131b29;color:#f0f5ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh}
#game{width:min(960px,100%);margin:0 auto;padding:clamp(12px,3vw,28px);padding-bottom:calc(20px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:clamp(24px,5vw,34px);margin:0}
#score{font-size:22px;font-weight:700}
#status{min-height:48px;padding:12px;border:1px solid #425577;border-radius:10px;background:#202e45}
#actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.panel{min-height:155px;padding:16px;border-radius:12px;border:1px solid #465575;background:#29384e;display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.panel h2{font-size:19px;margin:0}
.panel p{margin:0;line-height:1.4}
button{min-height:48px;border:0;border-radius:9px;background:#3988e9;color:white;font-size:17px;font-weight:700;touch-action:manipulation;cursor:pointer}
button:focus-visible{outline:3px solid #f3db80;outline-offset:2px}
button:disabled{opacity:.55;cursor:default}
.panel[data-done="true"]{border-color:#65b6d9;background:#204f63}
.panel[data-done="true"] button{background:#216f74}
#restart{display:block;width:100%;margin-top:16px;background:#45536b}
#last-action{margin:12px 0 0;color:#bbcbe6}
@media(max-width:460px){#actions{grid-template-columns:1fr}.panel{min-height:130px}#game{padding:12px;padding-bottom:calc(20px + env(safe-area-inset-bottom))}}
</style>
</head>
<body>
<main id="game">
  <header><h1>Crystal Defense</h1><output id="score" aria-live="polite">Score: 0</output></header>
  <p id="status" role="status" aria-live="polite">Defend and move to progress.</p>
  <section id="actions" aria-label="Game controls">
    <article class="panel defense-area" data-action-panel="defend">
      <h2>Defense</h2><p class="defense-text">Click to defend!</p>
      <button type="button" class="defense-button" data-action="defend">Defend!</button>
    </article>
    <article class="panel move-area" data-action-panel="move">
      <h2>Movement</h2><p class="move-text">Move to progress!</p>
      <button type="button" class="move-button" data-action="move">Move!</button>
    </article>
    <article class="panel win-area" data-action-panel="win">
      <h2>Victory</h2><p class="win-text">Complete the round after defending and moving.</p>
      <button type="button" class="win-button" data-action="win">Win!</button>
    </article>
    <article class="panel lose-area" data-action-panel="lose">
      <h2>Retreat</h2><p class="lose-text">End this round and restart.</p>
      <button type="button" class="lose-button" data-action="lose">Lose!</button>
    </article>
  </section>
  <button id="restart" type="button">Restart</button>
  <p id="last-action" aria-live="polite">Last action: None</p>
</main>
<script>
// 파일명: web-games/crystal-defense/index.html
// 메인: 기존 버튼 동작과 gameState 저장 형식을 유지한다.
const state={defense:false,move:false,win:false,lose:false,score:0,lastAction:null};
const actions=document.getElementById('actions');
const scoreOutput=document.getElementById('score');
const statusOutput=document.getElementById('status');
const actionOutput=document.getElementById('last-action');

function updateState(){
  scoreOutput.textContent='Score: '+state.score;
  actionOutput.textContent='Last action: '+(state.lastAction||'None');
  const finished=state.win||state.lose;
  for(const [action,field] of [['defend','defense'],['move','move'],['win','win'],['lose','lose']]){
    const panel=actions.querySelector('[data-action-panel="'+action+'"]');
    const button=panel.querySelector('button');
    panel.dataset.done=String(Boolean(state[field]));
    button.disabled=finished||(action==='win'&&(!state.defense||!state.move));
  }
  statusOutput.textContent=state.win?'You won!':state.lose?'You lost!':state.defense&&state.move?'Ready to win!':state.defense?'Defended! Move to progress.':state.move?'Moved! Defend to proceed.':'Defend and move to progress.';
  try{localStorage.setItem('gameState',JSON.stringify(state));}catch{}
}

function defend(){
  if(state.win||state.lose)return;
  state.defense=true;
  state.score+=1;
  state.lastAction='defend';
  updateState();
}

function move(){
  if(state.win||state.lose)return;
  state.move=true;
  state.score+=1;
  state.lastAction='move';
  updateState();
}

function restart(){
  Object.assign(state,{defense:false,move:false,win:false,lose:false,score:0,lastAction:null});
  updateState();
}

// 유틸: 저장 복원과 모바일 터치/키보드 입력.
function finish(action){
  if(state.win||state.lose)return;
  if(action==='win'&&(!state.defense||!state.move))return;
  state[action]=true;
  state.score+=action==='win'?100:-50;
  state.lastAction=action;
  updateState();
}
actions.addEventListener('click',event=>{
  const button=event.target.closest('button[data-action]');
  if(!button||button.disabled)return;
  const action=button.dataset.action;
  if(action==='defend')defend();
  else if(action==='move')move();
  else if(action==='win'||action==='lose')finish(action);
});
document.getElementById('restart').addEventListener('click',restart);
document.addEventListener('keydown',event=>{
  if(event.altKey||event.ctrlKey||event.metaKey||event.repeat||event.target instanceof HTMLInputElement)return;
  const action={d:'defend',m:'move',w:'win',l:'lose'}[event.key.toLowerCase()];
  if(action==='defend')defend();
  else if(action==='move')move();
  else if(action)finish(action);
});
try{
  const saved=JSON.parse(localStorage.getItem('gameState')||'null');
  if(saved&&typeof saved==='object'&&!Array.isArray(saved)){
    for(const key of ['defense','move','win','lose'])state[key]=saved[key]===true;
    if(Number.isSafeInteger(saved.score))state.score=saved.score;
    if(typeof saved.lastAction==='string')state.lastAction=saved.lastAction;
  }
}catch{}
updateState();
</script>
</body>
</html>
