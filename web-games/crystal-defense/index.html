<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수정 디펜스</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; color: #f7f8ff; background: #101828; }
  #game { min-height: 100dvh; max-width: 720px; margin: 0 auto; padding: 20px 16px 32px; }
  h1 { margin: 8px 0 10px; font-size: 1.55rem; }
  .stats { padding: 14px; background: #1e3050; border-radius: 12px; line-height: 1.7; }
  .controls { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 18px; }
  button { border: 1px solid #7199cf; border-radius: 12px; background: #274467; color: white;
    padding: 18px 8px; min-height: 62px; font-size: 1rem; touch-action: manipulation; }
  button:focus-visible { outline: 3px solid #ffe082; outline-offset: 2px; }
  button:active { background: #416a9b; }
  button[aria-pressed="true"] { border-color: #77e0bf; background: #246652; }
  .result { margin-top: 16px; min-height: 3.5em; padding: 14px; border-radius: 12px; background: #202d43; }
  .result[data-outcome="win"] { background: #155c4d; }
  .result[data-outcome="lose"] { background: #772d35; }
  .restart { display: block; margin-top: 16px; width: 100%; }
</style>
</head>
<body>
<main id="game">
  <h1>수정 디펜스</h1>
  <div class="stats" aria-live="polite">
    <div class="score-text">점수: <span id="score">0</span></div>
    <div class="last-action">마지막 행동: <span id="lastAction">없음</span></div>
  </div>
  <div class="controls">
    <button type="button" class="defense-button" id="defend">방어 (D)</button>
    <button type="button" class="move-button" id="move">이동 (M)</button>
    <button type="button" class="win-button" id="win">승리 (W)</button>
    <button type="button" class="lose-button" id="lose">패배 (L)</button>
  </div>
  <div class="result" id="result" role="status">행동을 선택해 진행해.</div>
  <button type="button" class="restart restart-button" id="restart">다시 시작</button>
</main>
<script>
// 파일명: web-games/crystal-defense/index.html
// [저장] 기존 'gameState' 키와 defense/move/win/lose/score/lastAction 필드를 유지한다.
const storageKey = 'gameState';
const initialState = () => ({defense:false, move:false, win:false, lose:false, score:0, lastAction:null});
let state = initialState();
try {
  const saved = JSON.parse(localStorage.getItem(storageKey) || 'null');
  if (saved && typeof saved === 'object' && !Array.isArray(saved)) {
    state = {
      defense:saved.defense === true, move:saved.move === true,
      win:saved.win === true, lose:saved.lose === true,
      score:Number.isFinite(saved.score) ? saved.score : 0,
      lastAction:typeof saved.lastAction === 'string' ? saved.lastAction : null
    };
  }
} catch (_) { /* 저장소 접근 불가·손상 시 기존 초기 상태로 실행 */ }

// [메인] 기존 방어·이동·승리·패배 입력과 점수 변경을 한 경로로 연결한다.
function render() {
  document.getElementById('score').textContent = String(state.score);
  document.getElementById('lastAction').textContent = state.lastAction || '없음';
  document.getElementById('defend').setAttribute('aria-pressed', String(state.defense));
  document.getElementById('move').setAttribute('aria-pressed', String(state.move));
  document.getElementById('win').setAttribute('aria-pressed', String(state.win));
  document.getElementById('lose').setAttribute('aria-pressed', String(state.lose));
  const result = document.getElementById('result');
  result.dataset.outcome = state.win ? 'win' : state.lose ? 'lose' : '';
  result.textContent = state.win ? '승리!' : state.lose ? '패배!' :
    state.defense && state.move ? '방어와 이동을 완료했어.' :
    state.defense ? '방어했어.' : state.move ? '이동했어.' : '행동을 선택해 진행해.';
}
function persist() {
  try { localStorage.setItem(storageKey, JSON.stringify(state)); } catch (_) { /* 저장 불가 시 플레이 유지 */ }
}
function act(action) {
  if (action === 'restart') {
    state = initialState();
  } else if (action === 'defend') {
    state.defense = !state.defense;
    if (state.defense) state.score += 1;
    state.lastAction = 'defend';
  } else if (action === 'move') {
    state.move = !state.move;
    if (state.move) state.score += 1;
    state.lastAction = 'move';
  } else if (action === 'win') {
    if (!state.win) state.score += 100;
    state.win = true;
    state.lose = false;
    state.lastAction = 'win';
  } else if (action === 'lose') {
    if (!state.lose) state.score -= 50;
    state.lose = true;
    state.win = false;
    state.lastAction = 'lose';
  } else {
    return;
  }
  persist();
  render();
}
for (const action of ['defend','move','win','lose','restart']) {
  document.getElementById(action).addEventListener('click', () => act(action));
}
document.addEventListener('keydown', event => {
  if (event.repeat || /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '')) return;
  const action = {d:'defend', m:'move', w:'win', l:'lose'}[event.key.toLowerCase()];
  if (action) act(action);
});
render();
</script>
</body>
</html>
