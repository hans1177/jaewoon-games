<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crystal Defense</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}
body{margin:0;background:#101828;color:#eef6ff}
main{max-width:720px;margin:auto;padding:24px}
h1{margin:0 0 12px}p{line-height:1.5}
section{border:1px solid #475569;background:#1e293b;border-radius:12px;padding:20px;margin:16px 0}
.actions{display:flex;gap:12px;flex-wrap:wrap}button{font:inherit;cursor:pointer;padding:12px 18px;border-radius:8px;border:1px solid #94a3b8;background:#334155;color:white}
button:focus-visible{outline:3px solid #38bdf8}button:disabled{opacity:.5;cursor:not-allowed}
#crystal{font-size:5rem;text-align:center}#status{font-weight:700}small{color:#cbd5e1}
</style>
</head>
<body>
<main id="game">
<h1>Crystal Defense</h1>
<p>Defend the crystal from each wave. Reinforce it, then push attackers back to progress.</p>
<section aria-live="polite">
<div id="crystal" aria-hidden="true">💎</div>
<p id="status"></p><p id="stats"></p>
<p id="score-text" class="score-text"></p>
<p id="last-action" class="last-action"></p>
</section>
<div class="actions">
<button id="defend" class="defense-button" type="button">Defend (+2 shield)</button>
<button id="move" class="move-button" type="button">Push wave</button>
<button id="restart" type="button">Restart</button>
</div>
<small>Keyboard: D = defend, M = push, R = restart. Progress is saved locally.</small>
</main>
<script>
(() => {
  'use strict';
  const SAVE_KEY='gameState';
  const fresh=()=>({defense:false,move:false,win:false,lose:false,score:0,lastAction:null,wave:1,shield:3,health:10});
  const state=fresh();
  const $=id=>document.getElementById(id);
  try {
    const saved=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');
    if(saved && typeof saved==='object') {
      for(const key of ['defense','move','win','lose']) if(typeof saved[key]==='boolean') state[key]=saved[key];
      for(const key of ['score','wave','shield','health']) if(Number.isFinite(saved[key])) state[key]=Math.max(0,Math.floor(saved[key]));
      if(typeof saved.lastAction==='string') state.lastAction=saved.lastAction.slice(0,120);
    }
  } catch { /* Storage can be blocked or a legacy save may be invalid. */ }
  state.wave=Math.min(6,Math.max(1,state.wave));
  state.health=Math.min(10,state.health);
  state.shield=Math.min(10,state.shield);
  function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(state));}catch{/* Private mode */}}
  function render(){
    $('status').textContent=state.win?'Victory! The crystal is safe.':state.lose?'The crystal shattered!':'Wave '+state.wave+' of 5';
    $('stats').textContent='Crystal HP: '+state.health+' · Shield: '+state.shield;
    $('score-text').textContent='Score: '+state.score;
    $('last-action').textContent='Last action: '+(state.lastAction||'None');
    $('defend').disabled=state.win||state.lose;
    $('move').disabled=state.win||state.lose;
  }
  function defend(){
    if(state.win||state.lose)return;
    state.shield=Math.min(10,state.shield+2);
    state.defense=true;state.lastAction='defend';state.score+=5;
    persist();render();
  }
  function move(){
    if(state.win||state.lose)return;
    const damage=Math.max(0,state.wave*2-state.shield);
    state.shield=Math.max(0,state.shield-state.wave*2);
    state.health=Math.max(0,state.health-damage);
    state.move=true;state.lastAction='push';state.score+=10;
    if(state.health===0){state.lose=true;state.lastAction='lose';}
    else if(state.wave>=5){state.win=true;state.lastAction='win';state.score+=100;}
    else state.wave++;
    persist();render();
  }
  function restart(){
    Object.assign(state,fresh());state.lastAction='restart';persist();render();
  }
  $('defend').addEventListener('click',defend);
  $('move').addEventListener('click',move);
  $('restart').addEventListener('click',restart);
  document.addEventListener('keydown',e=>{
    if(e.altKey||e.ctrlKey||e.metaKey||e.repeat||/INPUT|TEXTAREA/.test(e.target?.tagName||''))return;
    const key=e.key.toLowerCase();
    if(key==='d')defend();
    else if(key==='m')move();
    else if(key==='r')restart();
  });
  render();
})();
</script>
</body>
</html>
