<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vibe2 bootstrap</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #111;
      color: #fff;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 {
      margin-bottom: 20px;
    }
    .game {
      width: 100%;
      max-width: 800px;
      background: #222;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }
    .controls {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .controls button {
      padding: 10px 15px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      background-color: #333;
      color: #fff;
    }
    .controls button:hover {
      background-color: #555;
    }
    .status {
      margin-bottom: 10px;
      font-size: 14px;
      color: #aaa;
    }
    .health {
      width: 100px;
      height: 20px;
      background-color: #444;
      border-radius: 4px;
      margin-right: 10px;
    }
    .health-fill {
      width: 70%;
      background-color: #0f0;
    }
    .health-empty {
      width: 0;
      background-color: #fff;
    }
    .score {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .score span {
      display: inline-block;
      margin-right: 10px;
    }
    .message {
      font-size: 14px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <main id="game">
    <h1>Vibe2</h1>
    <div class="game">
      <div class="controls">
        <button onclick="startGame()">Start</button>
        <button onclick="restartGame()">Restart</button>
      </div>
      <div class="status">
        <div class="health health-fill"></div>
        <div class="health health-empty"></div>
        <div class="score">Score: <span>0</span></div>
        <div class="message">Press to attack</div>
      </div>
    </div>
  </main>
</body>
</html>
