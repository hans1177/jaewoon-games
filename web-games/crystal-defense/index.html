<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crystal Defense</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#172536;color:#f7f9ff;font:16px system-ui,sans-serif}
  main{max-width:680px;margin:0 auto;padding:24px 16px 48px}
  h1{margin:0 0 16px;font-size:clamp(1.6rem,6vw,2.3rem)}
  #status{padding:18px;border:1px solid #42607e;border-radius:12px;background:#23374c}
  #score{font-size:1.2rem;font-weight:700}
  #outcome{min-height:2em;font-weight:700}
  #actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
  button{min-height:52px;padding:12px;border:1px solid #8aaccd;border-radius:10px;
    background:#285780;color:#fff;font:inherit;font-weight:650;cursor:pointer;touch-action:manipulation}
  button:focus-visible{outline:3px solid #e2cc82;outline-offset:2px}
  button:disabled{opacity:.55;cursor:default}
  #restart{width:100%;margin-top:12px;background:#3c485c}
  .help{color:#c5d5e5;font-size:.9rem}
  @media(max-width:360px){main{padding:16px 10px 32px}#actions{gap:8px}button{padding:10px}}
</style>
</head>
<body>
<main id="game">
  <h1>Crystal Defense</h1>
  <section id="status" aria-live="polite">
    <div id="score">Score: 0</div>
    <div id="last-action">Last action: None</div>
    <div id="outcome"></div>
  </section>
  <section id="actions" aria-label="Game actions">
    <button id="defense-button" type="button">Defend!</button>
    <button id="move-button" type="button">Move!</button>
    <button id="win-button" type="button">Win</button>
    <button id="lose-button" type="button">Lose</button>
  </section>
  <button id="restart" type="button">Restart</button>
  <p class="help">Keyboard: D defend, M move, W win, L lose.</p>
</main>
<script>
// FILE: web-games/crystal-defense/index.html
// MAIN: existing defend, move, win, lose, restart actions and gameState save key.
(() => {
  'use strict';
  const STORAGE_KEY = 'gameState';
  const defaultState = () => ({
    defense:false, move:false, win:false, lose:false, score:0, lastAction:null
  });
  let state = defaultState();
  const byId = id => document.getElementById(id);

  function render() {
    byId('score').textContent = 'Score: ' + state.score;
    byId('last-action').textContent = 'Last action: ' + (state.lastAction || 'None');
    byId('outcome').textContent = state.win ? 'You won!' : state.lose ? 'You lost!' : '';
    byId('defense-button').textContent = state.defense ? 'Defended!' : 'Defend!';
    byId('move-button').textContent = state.move ? 'Moved!' : 'Move!';
    for (const id of ['defense-button','move-button','win-button','lose-button']) {
      byId(id).disabled = state.win || state.lose;
    }
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (_) {
      // Private browsing and restricted storage must not prevent gameplay.
    }
  }

  function restore() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      if (saved && typeof saved === 'object' && !Array.isArray(saved)) {
        state.defense = saved.defense === true;
        state.move = saved.move === true;
        state.win = saved.win === true;
        state.lose = saved.lose === true;
        state.score = Number.isFinite(saved.score) ? saved.score : 0;
        state.lastAction = typeof saved.lastAction === 'string' ? saved.lastAction : null;
      }
    } catch (_) {
      // An invalid prior save must not crash the page or overwrite it on load.
    }
  }

  function act(action) {
    if (state.win || state.lose) return;
    if (action === 'defend') {
      state.defense = true;
      state.score += 1;
    } else if (action === 'move') {
      state.move = true;
      state.score += 1;
    } else if (action === 'win') {
      state.win = true;
      state.score += 100;
    } else if (action === 'lose') {
      state.lose = true;
      state.score -= 50;
    } else return;
    state.lastAction = action;
    save();
    render();
  }

  for (const action of ['defend','move','win','lose']) {
    byId((action === 'defend' ? 'defense' : action) + '-button')
      .addEventListener('click', () => act(action));
  }
  byId('restart').addEventListener('click', () => {
    state = defaultState();
    save();
    render();
  });
  document.addEventListener('keydown', event => {
    if (event.repeat || event.ctrlKey || event.metaKey || event.altKey) return;
    const action = {d:'defend',m:'move',w:'win',l:'lose'}[event.key.toLowerCase()];
    if (action) act(action);
  });
  restore();
  render();
})();
</script>
</body>
</html>
