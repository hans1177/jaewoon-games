    <style>body{margin:0;background:#0e2636;color:#edf7f5;font-family:system-ui,sans-serif}#game{max-width:820px;min-height:100dvh;margin:auto;padding:18px;display:grid;gap:10px;align-content:start;box-sizing:border-box}.enemy,.item,.effect,.sound-effect{padding:12px;background:#204d62;border:1px solid #3d7587;border-radius:10px}.enemy,.item,.effect{cursor:pointer;touch-action:manipulation}.player{font-size:22px;font-weight:bold}.ui,.game-status{padding:14px;background:#164554;border-radius:10px;line-height:1.6}.action-button,.restart-button{padding:14px;border:1px solid #63a6bd;background:#17445a;color:white;border-radius:10px;min-height:52px;text-align:left;font:inherit;touch-action:manipulation}.action-button:focus-visible{outline:3px solid #f8cb5f}.action-button:disabled{opacity:.65}.is-finished .game-status{background:#665d35}@media(min-width:550px){#game{grid-template-columns:repeat(2,minmax(0,1fr))}.player,.ui,.game-status,.restart-button{grid-column:1/-1}} .game-progress,.game-guide{padding:13px;background:#173d4c;border-radius:10px;display:grid;gap:5px;line-height:1.55}.game-progress progress{display:block;width:100%;height:16px;accent-color:#62d4a5}.game-progress label{font-weight:700}.game-guide p{margin:3px 0;font-size:.94rem}.game-status{position:sticky;bottom:0;z-index:2;border:1px solid #62d4a566;box-shadow:0 5px 18px #0006}button{cursor:pointer}button:focus-visible{outline:3px solid #fbd35f;outline-offset:3px}</style>

<script>
// [게임 입력] 기존 적 체력·피해·보상·아이템 종류를 그대로 연결한다.
const enemyButtons = [...document.querySelectorAll('.enemy')];
const itemButtons = [...document.querySelectorAll('.item')];
const effectButtons = [...document.querySelectorAll('.effect')];
const updateHud = () => {
  const ui = document.querySelector('.ui');
  if (ui) ui.textContent = '체력: ' + gameState.player.health +
    ' | 점수: ' + gameState.player.score +
    ' | 소지품: ' + (gameState.player.inventory.map(item=>item.type).join(', ') || '없음');
};
gameState.game.enemies = enemies.map(enemy => ({...enemy}));
gameState.game.items = items.map(item => ({...item}));
enemyButtons.forEach((button,index) => {
  const original=enemies[index];
  button.dataset.id=String(original.id);
  button.classList.add('action-button');
  button.textContent='전투: ' + original.type + ' (체력 ' + original.health + ')';
  button.addEventListener('click', () => {
    if (gameState.player.health<=0 || gameState.player.score>=1000) return;
    const enemy=gameState.game.enemies.find(entry=>entry.id===original.id);
    if(!enemy || enemy.health<=0)return;
    const damage=gameState.player.inventory.some(item=>item.type==='damage')?1:5;
    enemy.health=Math.max(0,enemy.health-damage);
    if(enemy.health===0){
      gameState.player.score+=100;
      button.disabled=true;
      button.textContent=original.type+' 처치 (+100점)';
    }else{
      gameState.player.health=Math.max(0,gameState.player.health-enemy.damage);
      button.textContent='전투: '+original.type+' (체력 '+enemy.health+')';
    }
    updateHud();
    checkGameOutcome();
  });
});
itemButtons.forEach((button,index)=>{
  const item=items[index];
  button.dataset.type=item.type;
  button.classList.add('action-button');
  button.textContent='획득: '+(item.type==='health-potion'?'체력 물약 (+20)':'점수 물약 (+100)');
  button.addEventListener('click',()=>{
    if(button.disabled || gameState.player.health<=0)return;
    if(item.type==='health-potion')gameState.player.health=Math.min(100,gameState.player.health+20);
    if(item.type==='score-potion')gameState.player.score+=100;
    gameState.player.inventory.push({...item});
    gameState.game.items=gameState.game.items.filter(entry=>entry.id!==item.id);
    button.disabled=true;
    button.textContent='획득 완료: '+item.type;
    updateHud();
    checkGameOutcome();
  });
});
effectButtons.forEach((button,index)=>{
  const effect=effects[index];
  button.dataset.type=effect.type;
  button.classList.add('action-button');
  button.textContent=effect.type==='damage'?'피해 효과 (-1 체력)':'치유 효과 (+10 체력)';
  button.addEventListener('click',()=>{
    if(gameState.player.health<=0)return;
    if(effect.type==='damage')gameState.player.health=Math.max(0,gameState.player.health-1);
    if(effect.type==='heal')gameState.player.health=Math.min(100,gameState.player.health+10);
    updateHud();
    checkGameOutcome();
  });
});
updateHud();
</script>

<script>
// [진행·결과] 기존 승리 기준 점수 1000, 패배 기준 체력 0을 유지한다.
const statusNode=document.createElement('div');
statusNode.className='game-status';
statusNode.setAttribute('role','status');
statusNode.setAttribute('aria-live','polite');
statusNode.textContent='적과 아이템을 눌러 진행해.';
gameContainer.appendChild(statusNode);

// [모바일 진행 정보] 기존 체력·목표 점수를 실시간 막대로 보여준다.
const progressPanel=document.createElement('section');
progressPanel.className='game-progress';
progressPanel.setAttribute('aria-label','체력과 목표 진행 상태');
progressPanel.innerHTML=
  '<label for="islandHealth">현재 체력</label>' +
  '<progress id="islandHealth" max="100" value="100"></progress>' +
  '<output id="islandHealthText">100 / 100</output>' +
  '<label for="islandScore">승리 목표 1000점</label>' +
  '<progress id="islandScore" max="1000" value="0"></progress>' +
  '<output id="islandScoreText">0 / 1000</output>';
gameContainer.insertBefore(progressPanel,statusNode);
const guidePanel=document.createElement('aside');
guidePanel.className='game-guide';
guidePanel.innerHTML=
  '<strong>조작 안내</strong>' +
  '<p>몬스터를 탭하거나 클릭하면 피해를 주고, 몬스터가 살아 있으면 반격해. ' +
  '물약은 한 번만 획득할 수 있어. 피해·치유 효과 버튼으로 상태를 바꿀 수 있어.</p>' +
  '<p>터치 화면에서는 버튼을 누르고, 키보드에서는 방향키로 버튼을 고른 뒤 확인을 누르면 돼. ' +
  '체력이 0이 되면 패배하고 점수 1000점이면 승리해.</p>';
gameContainer.appendChild(guidePanel);
const restartNode=document.createElement('button');
restartNode.className='restart-button action-button';
restartNode.type='button';
restartNode.textContent='다시 시작';
gameContainer.appendChild(restartNode);
function checkGameOutcome(){
  document.getElementById('islandHealth').value=gameState.player.health;
  document.getElementById('islandScore').value=Math.min(1000,gameState.player.score);
  document.getElementById('islandHealthText').textContent=gameState.player.health+' / 100';
  document.getElementById('islandScoreText').textContent=gameState.player.score+' / 1000';
  if(gameState.player.health<=0){
    statusNode.textContent='패배: 체력이 0이 됐어. 다시 시작할 수 있어.';
  }else if(gameState.player.score>=1000){
    statusNode.textContent='승리: 1000점 달성!';
  }else{
    const remaining=gameState.game.enemies.filter(e=>e.health>0).length;
    statusNode.textContent='남은 적 '+remaining+'명 · 현재 점수 '+gameState.player.score+' / 목표 1000';
  }
  gameContainer.classList.toggle('is-finished',gameState.player.health<=0||gameState.player.score>=1000);
}
function resetGame(){
  // 기존 데이터 구조·기본 수치로 되돌린다.
  gameState.player.health=100;
  gameState.player.score=0;
  gameState.player.inventory=[];
  gameState.game.level=1;
  gameState.game.enemies=enemies.map(e=>({...e}));
  gameState.game.items=items.map(e=>({...e}));
  enemyButtons.forEach((button,index)=>{
    button.disabled=false;
    button.textContent='전투: '+enemies[index].type+' (체력 '+enemies[index].health+')';
  });
  itemButtons.forEach((button,index)=>{
    button.disabled=false;
    button.textContent='획득: '+(items[index].type==='health-potion'?'체력 물약 (+20)':'점수 물약 (+100)');
  });
  updateHud();
  checkGameOutcome();
}
restartNode.addEventListener('click',resetGame);

// [모바일/키보드] 버튼의 기본 클릭·터치 동작을 사용하고 방향키로 이동 선택을 지원한다.
let selectedIndex=0;
const activeButtons=[...enemyButtons,...itemButtons,...effectButtons,restartNode];
document.addEventListener('keydown',event=>{
  if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter',' '].includes(event.key))return;
  if(event.target instanceof HTMLElement && /INPUT|TEXTAREA|SELECT/.test(event.target.tagName))return;
  const visible=activeButtons.filter(button=>!button.disabled);
  if(!visible.length)return;
  if(event.key==='Enter'||event.key===' '){
    if(document.activeElement?.matches('button'))return; // 기본 버튼 동작 우선
    event.preventDefault();visible[selectedIndex % visible.length].click();
  }else{
    event.preventDefault();
    selectedIndex=(selectedIndex+(event.key==='ArrowLeft'||event.key==='ArrowUp'?-1:1)+visible.length)%visible.length;
    visible[selectedIndex].focus();
  }
});
const animateNode=()=>{
  const animation=document.querySelector('.animation');
  if(animation)animation.textContent='섬 마을 · '+(gameState.player.health>0?'탐험 중':'게임 종료');
};
function gameLoop(){
  checkGameOutcome();
  animateNode();
}
gameLoop();
</script>
</body>
