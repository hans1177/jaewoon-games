<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:#43add4;color:#183e4b}button{font:inherit;color:inherit}.app{position:relative;width:100%;height:100dvh;overflow:hidden;background:linear-gradient(#66cae8,#299bc8)}
.top{position:absolute;z-index:20;left:0;right:0;top:0;padding:max(7px,env(safe-area-inset-top)) 7px 0;pointer-events:none}.row{display:flex;align-items:center;gap:5px;max-width:1000px;margin:auto}.home,.pill,.clock{pointer-events:auto;background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.9);box-shadow:0 5px 14px #19556b22}.home{display:grid;place-items:center;width:39px;height:39px;border-radius:12px;text-decoration:none;font-weight:1000}.res{display:flex;gap:4px;min-width:0;flex:1;overflow-x:auto;scrollbar-width:none}.res::-webkit-scrollbar{display:none}.pill{flex:0 0 auto;min-width:53px;padding:5px 7px;border-radius:11px;text-align:center;font-size:9px;font-weight:900}.pill b{display:block;font-size:12px}.clock{padding:5px 7px;border-radius:11px;text-align:center;font-size:9px;font-weight:900}.clock b{display:block;font-size:12px}.objective{max-width:590px;margin:5px auto 0;padding:6px 10px;border-radius:999px;background:rgba(17,72,65,.78);color:#fff;text-align:center;font-size:10px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:auto}
.world{position:absolute;inset:0;padding:70px 0 72px;display:grid;place-items:center}canvas{display:block;width:100%;height:100%;max-width:1180px;max-height:800px;touch-action:none}.bottom{position:absolute;z-index:20;left:0;right:0;bottom:0;padding:0 7px max(8px,env(safe-area-inset-bottom));pointer-events:none}.dock{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;max-width:560px;margin:auto;padding:5px;border-radius:18px;background:rgba(255,255,255,.92);box-shadow:0 -7px 24px #16495d2b;pointer-events:auto}.dock button{min-height:48px;border:0;border-radius:13px;background:#edf9fa;font-size:9px;font-weight:1000}.dock button span{display:block;font-size:19px}.dock button.active{background:#dbf4df;color:#176f39}.dock button:disabled{opacity:.42}
.shade{position:absolute;z-index:29;inset:0;background:#092f393f;opacity:0;pointer-events:none}.shade.open{opacity:1;pointer-events:auto}.panel{position:absolute;z-index:30;left:50%;bottom:70px;width:min(94%,560px);max-height:64dvh;overflow:auto;transform:translate(-50%,calc(100% + 100px));transition:.2s;border-radius:20px;background:#f8fdfb;padding:12px;box-shadow:0 16px 45px #11384444}.panel.open{transform:translate(-50%,0)}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}.head h2{margin:0;font-size:17px}.close{width:34px;height:34px;border:0;border-radius:11px;background:#e5f2ef;font-size:19px;font-weight:1000}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.card{border:1px solid #dceae5;border-radius:15px;background:#fff;padding:9px;text-align:left}.card strong{display:block;font-size:12px}.card small{display:block;margin-top:3px;color:#687f79;font-size:9px;line-height:1.35}.card .icon{float:right;font-size:22px}.cost{margin-top:6px;font-size:9px;font-weight:900;color:#376858}.card.locked{opacity:.45}.resident{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:7px;padding:8px 2px;border-bottom:1px solid #e3ece8}.avatar{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#f4ce77;font-size:20px}.resident b{font-size:12px}.resident small{display:block;color:#71827e;font-size:9px}.job{height:36px;min-width:98px;border:1px solid #cfdfda;border-radius:11px;background:#fff;font-size:10px;font-weight:900}.storage{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.storage div{padding:11px 6px;border-radius:14px;background:#fff;border:1px solid #e0ece8;text-align:center;font-size:20px}.storage b{display:block;font-size:14px}.storage small{display:block;font-size:8px;color:#71847e}.explore{padding:13px;border-radius:16px;background:#e8f8fc}.explore h3{margin:0 0 5px}.explore p{margin:0;color:#5d777d;font-size:10px;line-height:1.5}.explore button,.danger{width:100%;height:44px;margin-top:10px;border:0;border-radius:13px;font-weight:1000}.explore button{background:#2da8d1;color:#fff}.explore button:disabled{opacity:.45}.danger{background:#fff0ef;color:#b64139}
.toast{position:absolute;z-index:40;left:50%;top:105px;max-width:88%;transform:translate(-50%,-12px);opacity:0;pointer-events:none;padding:8px 13px;border-radius:999px;background:rgba(17,57,58,.9);color:#fff;font-size:10px;font-weight:900;transition:.18s}.toast.show{opacity:1;transform:translate(-50%,0)}.splash{position:absolute;z-index:50;inset:0;display:grid;place-items:center;padding:18px;background:linear-gradient(#207f9dc9,#174e55d4)}.splash.hide{display:none}.splashCard{width:min(92%,460px);overflow:hidden;border-radius:25px;background:#fff;box-shadow:0 22px 60px #0c33494d}.splashArt{position:relative;height:165px;background:linear-gradient(#6fd0e9 0 44%,#f0d18b 44% 54%,#79b65a 54%)}.splashIsland{position:absolute;left:50%;top:68px;width:260px;height:92px;transform:translateX(-50%);border-radius:50%;background:#73b557;border:8px solid #f0cf87}.splashTitle{position:absolute;z-index:2;left:16px;bottom:12px;color:#fff;text-shadow:0 2px 5px #173b46}.splashTitle h1{margin:0;font-size:29px}.splashTitle p{margin:2px 0 0;font-size:10px;font-weight:800}.splashBody{padding:14px}.splashBody p{margin:0 0 10px;color:#5d7470;font-size:11px;line-height:1.55}.start{width:100%;height:49px;border:0;border-radius:14px;background:#43aa61;color:#fff;font-size:15px;font-weight:1000;box-shadow:0 5px 0 #2b8147}
@media(max-height:600px) and (orientation:landscape){.world{padding:57px 0 58px}.objective{display:none}.dock button{min-height:42px}.panel{bottom:59px;max-height:70dvh}}

</head>
<body>
<div class="app">
<div class="top"><div class="row"><a class="home" href="/">⌂</a><div class="res"><div class="pill">🪵 나무<b id="wood">0</b></div><div class="pill">🪨 돌<b id="stone">0</b></div><div class="pill">🫐 베리<b id="food">0</b></div><div class="pill">🐟 물고기<b id="fish">0</b></div><div class="pill">🪙 골드<b id="gold">0</b></div></div><div class="clock"><span id="phase">아침</span><b><span id="day">1</span>일</b></div></div><div class="objective" id="objective">나무·돌·베리덤불을 누르면 주민이 가서 채집합니다.</div></div>
<main class="world"><canvas id="game" width="1000" height="700"></canvas></main>
<div class="bottom"><nav class="dock"><button data-panel="build"><span>🔨</span>건설</button><button data-panel="residents"><span>🧑‍🌾</span>주민</button><button data-panel="storage"><span>📦</span>창고</button><button id="exploreDock" data-panel="explore" disabled><span>⛵</span>탐험</button></nav></div>
<div class="shade" id="shade"></div><section class="panel" id="panel"></section><div class="toast" id="toast"></div>
<div class="splash" id="splash"><div class="splashCard"><div class="splashArt"><div class="splashIsland"></div><div class="splashTitle"><h1>무인도 마을</h1><p>작은 섬을 살아있는 마을로 키워보세요</p></div></div><div class="splashBody"><p>섬의 나무, 돌, 베리덤불을 누르면 주민이 직접 이동해 채집합니다. 주민은 작업지에 도착한 뒤 3초마다 자원 1개를 얻습니다.</p><button class="start" id="startBtn">게임 시작</button></div></div></div>
</div>
<script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),SAVE_KEY='jaewoon-island-v2';
const BUILDINGS={hut:{name:'오두막',icon:'🏠',cost:{wood:20,stone:5},desc:'주민 최대 수 +1'},storage:{name:'창고',icon:'📦',cost:{wood:25,stone:15},desc:'자원 보관량 +100'},farm:{name:'농장',icon:'🌾',cost:{wood:20,stone:10},desc:'농부가 베리를 생산'},fishery:{name:'낚시터',icon:'🎣',cost:{wood:15,stone:5},desc:'어부가 물고기를 생산'},shop:{name:'상점',icon:'🏪',cost:{wood:30,stone:20,gold:20},desc:'상인이 골드를 생산',needs:'storage'},port:{name:'항구',icon:'⚓',cost:{wood:50,stone:35,gold:60},desc:'주변 섬 탐험',needs:'shop'}};
const JOBS=['한가함','나무꾼','광부','농부','어부','상인'],ICONS={'한가함':'🙂','나무꾼':'🪓','광부':'⛏️','농부':'🫐','어부':'🎣','상인':'🪙'};
const plots=[{x:385,y:310},{x:525,y:280},{x:645,y:360},{x:530,y:455},{x:365,y:465},{x:710,y:475}];
const resources=[['tree',285,265],['tree',245,375],['tree',325,520],['tree',690,255],['tree',760,330],['tree',720,550],['rock',410,230],['rock',620,225],['rock',785,430],['rock',305,455],['berry',470,530],['berry',610,520],['berry',220,455]].map((r,i)=>({id:i,type:r[0],x:r[1],y:r[2],pulse:Math.random()*6.28}));
const names=['마루','하람','보라','도담','라온','세나','유리','태오'];let state,buildMode=null,panelName=null,last=performance.now(),toastTimer=0,autosave=0;const villagers=[];
function fresh(){return{wood:25,stone:12,food:20,fish:0,gold:40,day:1,time:.16,happiness:86,buildings:[],residents:[{name:'마루',job:'한가함'}],started:false,exploreCooldown:0}}
function load(){try{state=Object.assign(fresh(),JSON.parse(localStorage.getItem(SAVE_KEY)||'{}'))}catch(e){state=fresh()}if(!Array.isArray(state.buildings))state.buildings=[];if(!Array.isArray(state.residents)||!state.residents.length)state.residents=fresh().residents;syncVillagers();if(state.started)document.querySelector('#splash').classList.add('hide');renderHud()}
function save(){localStorage.setItem(SAVE_KEY,JSON.stringify(state))}function has(type){return state.buildings.some(b=>b.type===type)}function count(type){return state.buildings.filter(b=>b.type===type).length}function capacity(){return 100+count('storage')*100}function housing(){return Math.min(8,1+count('hut'))}function add(k,n){state[k]=Math.min(capacity(),Math.max(0,(state[k]||0)+n))}
function syncVillagers(){while(villagers.length<state.residents.length){let i=villagers.length;villagers.push({index:i,x:470+Math.random()*70,y:355+Math.random()*70,tx:470,ty:380,speed:72+Math.random()*12,target:null,working:false,harvest:0,phase:Math.random()*6.28})}villagers.length=state.residents.length;villagers.forEach((v,i)=>v.index=i)}
function setTarget(node){if(!villagers.length)return showToast('채집할 주민이 없습니다.');let v=villagers.find(x=>!x.target)||villagers[0];v.target=node.id;v.working=false;v.harvest=0;let side=node.type==='tree'?28:node.type==='rock'?30:29;v.tx=node.x+(v.x<node.x?-side:side);v.ty=node.y+22;let label=node.type==='tree'?'나무':node.type==='rock'?'돌':'베리덤불';showToast(`${state.residents[v.index].name} → ${label} 채집 시작`)}
function updateVillagers(dt){villagers.forEach(v=>{if(v.target!==null){let node=resources.find(r=>r.id===v.target);if(!node){v.target=null;return}let d=Math.hypot(v.tx-v.x,v.ty-v.y);if(d>4){v.x+=(v.tx-v.x)/d*v.speed*dt;v.y+=(v.ty-v.y)/d*v.speed*dt;v.working=false}else{v.working=true;v.harvest+=dt;if(v.harvest>=3){v.harvest-=3;if(node.type==='tree')add('wood',1);if(node.type==='rock')add('stone',1);if(node.type==='berry')add('food',1);renderHud();save()}}}else{let d=Math.hypot(v.tx-v.x,v.ty-v.y);if(d<7){v.tx=330+Math.random()*350;v.ty=285+Math.random()*230}else{v.x+=(v.tx-v.x)/d*v.speed*.22*dt;v.y+=(v.ty-v.y)/d*v.speed*.22*dt}}})}
function production(){state.residents.forEach(r=>{if(r.job==='농부'&&has('farm'))add('food',.35);if(r.job==='어부'&&has('fishery'))add('fish',.3);if(r.job==='상인'&&has('shop')&&state.food>=.2){state.food-=.2;add('gold',.25)}});let need=state.residents.length*.05;if(state.food>=need){state.food-=need;state.happiness=Math.min(100,state.happiness+.03)}else state.happiness=Math.max(10,state.happiness-.25);if(state.exploreCooldown>0)state.exploreCooldown=Math.max(0,state.exploreCooldown-1);renderHud();if(panelName==='explore')renderPanel()}
function canPay(c){return Object.entries(c).every(([k,v])=>(state[k]||0)>=v)}function pay(c){Object.entries(c).forEach(([k,v])=>state[k]-=v)}function build(type,i){let d=BUILDINGS[type];if(state.buildings.some(b=>b.plot===i))return showToast('이미 건물이 있습니다.');if(d.needs&&!has(d.needs))return showToast(`${BUILDINGS[d.needs].name}이 먼저 필요합니다.`);if(!canPay(d.cost))return showToast('자원이 부족합니다.');pay(d.cost);state.buildings.push({type,plot:i});buildMode=null;if(type==='hut')setTimeout(attract,800);showToast(`${d.name} 완성!`);save();renderHud()}
function attract(){if(state.residents.length>=housing())return;let used=new Set(state.residents.map(r=>r.name)),name=names.find(n=>!used.has(n))||`주민${state.residents.length+1}`;state.residents.push({name,job:'한가함'});syncVillagers();showToast(`${name} 주민이 도착했습니다.`);save()}
const panel=document.querySelector('#panel'),shade=document.querySelector('#shade');function header(t){return`<div class="head"><h2>${t}</h2><button class="close" id="close">×</button></div>`}function openPanel(n){panelName=n;buildMode=null;shade.classList.add('open');panel.classList.add('open');document.querySelectorAll('.dock button').forEach(b=>b.classList.toggle('active',b.dataset.panel===n));renderPanel()}function closePanel(){panelName=null;shade.classList.remove('open');panel.classList.remove('open');document.querySelectorAll('.dock button').forEach(b=>b.classList.remove('active'))}
function renderPanel(){if(!panelName)return;if(panelName==='build'){panel.innerHTML=header('건설')+`<div class="cards">${Object.entries(BUILDINGS).map(([k,b])=>{let locked=b.needs&&!has(b.needs),cost=Object.entries(b.cost).map(([a,v])=>`${{wood:'🪵',stone:'🪨',gold:'🪙'}[a]} ${v}`).join(' · ');return`<button class="card ${locked?'locked':''}" data-build="${k}"><span class="icon">${b.icon}</span><strong>${b.name}</strong><small>${b.desc}${locked?`<br>${BUILDINGS[b.needs].name} 필요`:''}</small><div class="cost">${cost}</div></button>`}).join('')}</div><p style="font-size:9px;color:#71827d">건물을 고른 뒤 점선 부지를 누르세요.</p>`}else if(panelName==='residents'){panel.innerHTML=header(`주민 ${state.residents.length} / ${housing()}`)+state.residents.map((r,i)=>{let v=villagers[i],work=v?.target!==null?(v.working?'채집 중':'이동 중'):'대기';return`<div class="resident"><div class="avatar">${ICONS[r.job]}</div><div><b>${r.name}</b><small>${work} · 행복 ${Math.round(state.happiness)}%</small></div><button class="job" data-job="${i}">${r.job} ▾</button></div>`}).join('')}else if(panelName==='storage'){panel.innerHTML=header(`창고 · 한도 ${capacity()}`)+`<div class="storage">${[['🪵','나무','wood'],['🪨','돌','stone'],['🫐','베리','food'],['🐟','물고기','fish'],['🪙','골드','gold'],['😊','행복','happiness']].map(([a,n,k])=>`<div>${a}<b>${Math.floor(state[k])}</b><small>${n}</small></div>`).join('')}</div><button class="danger" id="reset">저장 데이터 초기화</button>`}else{let unlocked=has('port');panel.innerHTML=header('주변 섬 탐험')+`<div class="explore"><h3>⛵ 보급섬</h3><p>${unlocked?'배를 보내면 10초 뒤 자원을 가져옵니다.':'항구를 완성하면 탐험할 수 있습니다.'}</p><button id="explore" ${!unlocked||state.exploreCooldown>0?'disabled':''}>${state.exploreCooldown>0?`귀항까지 ${state.exploreCooldown}초`:'탐험 출발'}</button></div>`}panel.querySelector('#close')?.addEventListener('click',closePanel);panel.querySelectorAll('[data-build]').forEach(b=>b.addEventListener('click',()=>{if(b.classList.contains('locked'))return;buildMode=b.dataset.build;closePanel();showToast(`${BUILDINGS[buildMode].name}: 점선 부지를 누르세요.`)}));panel.querySelectorAll('[data-job]').forEach(b=>b.addEventListener('click',()=>{let i=+b.dataset.job,r=state.residents[i];r.job=JOBS[(JOBS.indexOf(r.job)+1)%JOBS.length];save();renderPanel()}));panel.querySelector('#reset')?.addEventListener('click',()=>{if(confirm('처음부터 다시 시작할까요?')){localStorage.removeItem(SAVE_KEY);location.reload()}});panel.querySelector('#explore')?.addEventListener('click',startExplore)}
function startExplore(){if(!has('port')||state.exploreCooldown>0)return;state.exploreCooldown=10;showToast('탐험 출발!');setTimeout(()=>{let rs=[['wood',15,'나무'],['stone',10,'돌'],['food',14,'베리'],['fish',12,'물고기'],['gold',18,'골드']],r=rs[Math.floor(Math.random()*rs.length)];add(r[0],r[1]);state.exploreCooldown=0;showToast(`${r[2]} +${r[1]}`);save();renderHud();if(panelName==='explore')renderPanel()},10000)}
document.querySelectorAll('.dock button[data-panel]').forEach(b=>b.addEventListener('click',()=>{if(!b.disabled)openPanel(b.dataset.panel)}));shade.addEventListener('click',closePanel);
function point(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}function tap(e){e.preventDefault();let p=point(e);if(buildMode){let i=plots.findIndex((q,j)=>!state.buildings.some(b=>b.plot===j)&&Math.hypot(q.x-p.x,q.y-p.y)<48);if(i>=0)build(buildMode,i);else showToast('점선 건설 부지를 누르세요.');return}let node=resources.find(r=>Math.hypot(r.x-p.x,r.y-p.y)<43);if(node)setTarget(node)}canvas.addEventListener('pointerdown',tap,{passive:false});
function renderHud(){['wood','stone','food','fish','gold'].forEach(k=>document.querySelector('#'+k).textContent=Math.floor(state[k]||0));document.querySelector('#day').textContent=state.day;let t=state.time;document.querySelector('#phase').textContent=t<.25?'아침':t<.58?'낮':t<.75?'노을':'밤';document.querySelector('#exploreDock').disabled=!has('port');let active=villagers.filter(v=>v.target!==null).length;document.querySelector('#objective').textContent=active?`주민 ${active}명 채집 중 · 다른 자원을 누르면 작업을 바꿀 수 있습니다.`:'나무·돌·베리덤불을 누르면 주민이 가서 3초마다 1개씩 채집합니다.'}function showToast(t){let e=document.querySelector('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),1400)}
function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}function water(time){let g=ctx.createLinearGradient(0,0,0,700);g.addColorStop(0,'#62cce9');g.addColorStop(1,'#2496c7');ctx.fillStyle=g;ctx.fillRect(0,0,1000,700);for(let y=80;y<680;y+=58){ctx.beginPath();for(let x=-50;x<1050;x+=20)ctx.lineTo(x,y+Math.sin(x*.025+time*1.8)*4);ctx.strokeStyle='#ffffff28';ctx.stroke()}}function islandPath(){ctx.beginPath();ctx.moveTo(170,400);ctx.bezierCurveTo(160,285,255,180,390,150);ctx.bezierCurveTo(545,115,710,160,820,270);ctx.bezierCurveTo(890,345,870,475,785,565);ctx.bezierCurveTo(680,650,500,660,345,615);ctx.bezierCurveTo(225,580,175,505,170,400);ctx.closePath()}function island(){ctx.save();ctx.translate(0,12);islandPath();ctx.fillStyle='#efcf88';ctx.fill();ctx.restore();islandPath();ctx.fillStyle='#78b759';ctx.fill();ctx.lineWidth=8;ctx.strokeStyle='#f2d18c';ctx.stroke()}
function tree(r,t){ctx.save();ctx.translate(r.x,r.y);ctx.rotate(Math.sin(t*1.5+r.pulse)*.009);ctx.fillStyle='#785038';rounded(-5,1,10,36,4);ctx.fill();ctx.fillStyle='#2e8c49';[[-13,-5,16],[13,-5,16],[0,-17,19],[0,2,17]].forEach(([x,y,s])=>{ctx.beginPath();ctx.arc(x,y,s,0,7);ctx.fill()});ctx.restore()}function rock(r){ctx.save();ctx.translate(r.x,r.y);ctx.fillStyle='#72817f';ctx.beginPath();ctx.moveTo(-19,13);ctx.lineTo(-12,-13);ctx.lineTo(5,-18);ctx.lineTo(19,-5);ctx.lineTo(14,14);ctx.closePath();ctx.fill();ctx.fillStyle='#a7b3ad';ctx.beginPath();ctx.moveTo(-11,-11);ctx.lineTo(5,-15);ctx.lineTo(12,-5);ctx.lineTo(-1,-2);ctx.closePath();ctx.fill();ctx.restore()}function berry(r){ctx.save();ctx.translate(r.x,r.y);ctx.fillStyle='#348c49';ctx.beginPath();ctx.arc(0,4,19,0,7);ctx.fill();ctx.fillStyle='#9455ad';[[-9,-2],[5,-7],[10,7],[-3,10]].forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,4,0,7);ctx.fill()});ctx.restore()}function drawResource(r,t){ctx.save();ctx.shadowColor='#0003';ctx.shadowBlur=7;ctx.shadowOffsetY=3;if(r.type==='tree')tree(r,t);if(r.type==='rock')rock(r);if(r.type==='berry')berry(r);ctx.restore();let workers=villagers.filter(v=>v.target===r.id);if(workers.length){ctx.fillStyle='#163d36c9';rounded(r.x-23,r.y-48,46,17,8);ctx.fill();ctx.fillStyle='#fff';ctx.font='800 9px system-ui';ctx.textAlign='center';ctx.fillText('채집 중',r.x,r.y-36)}}
function plot(p,i){if(state.buildings.some(b=>b.plot===i))return;ctx.save();ctx.setLineDash([7,6]);ctx.strokeStyle=buildMode?'#fff':'#265e423d';ctx.fillStyle=buildMode?'#ffffff1f':'#ffffff0c';ctx.beginPath();ctx.ellipse(p.x,p.y,42,27,0,0,7);ctx.fill();ctx.stroke();ctx.restore()}function building(b){let p=plots[b.plot],d=BUILDINGS[b.type];ctx.save();ctx.translate(p.x,p.y);ctx.shadowColor='#173d3338';ctx.shadowBlur=8;ctx.shadowOffsetY=5;if(b.type==='farm'){ctx.fillStyle='#9b6842';ctx.fillRect(-38,-22,76,48);for(let x=-27;x<35;x+=14){ctx.strokeStyle='#4a994c';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x,-15);ctx.lineTo(x,18);ctx.stroke()}}else if(b.type==='fishery'||b.type==='port'){ctx.fillStyle='#85593d';ctx.fillRect(-40,2,80,12);for(let x=-34;x<40;x+=18)ctx.fillRect(x,2,5,27);if(b.type==='port'){ctx.fillStyle='#f5f0d9';ctx.beginPath();ctx.moveTo(5,-38);ctx.lineTo(5,1);ctx.lineTo(34,-4);ctx.closePath();ctx.fill()}}else{ctx.fillStyle=b.type==='shop'?'#eadfbe':'#b27a4d';ctx.fillRect(-29,-13,58,40);ctx.fillStyle=b.type==='shop'?'#df5c4f':'#efc879';ctx.beginPath();ctx.moveTo(-35,-13);ctx.lineTo(0,-38);ctx.lineTo(35,-13);ctx.closePath();ctx.fill()}ctx.restore();ctx.fillStyle='#163d35bf';rounded(p.x-29,p.y+31,58,18,8);ctx.fill();ctx.fillStyle='#fff';ctx.font='800 9px system-ui';ctx.textAlign='center';ctx.fillText(d.name,p.x,p.y+43)}function villager(v,t){let r=state.residents[v.index];ctx.save();ctx.translate(v.x,v.y+Math.sin(t*4+v.phase)*1.2);ctx.fillStyle='#f0c18a';ctx.beginPath();ctx.arc(0,-12,8,0,7);ctx.fill();ctx.fillStyle=['#e95f59','#4e9ed8','#786fc2','#e29a42'][v.index%4];rounded(-8,-4,16,20,5);ctx.fill();ctx.fillStyle='#44382f';ctx.fillRect(-7,14,5,7);ctx.fillRect(2,14,5,7);if(v.working){ctx.font='16px system-ui';ctx.fillText(resources.find(n=>n.id===v.target)?.type==='rock'?'⛏️':'🪓',8,-5)}ctx.restore();ctx.fillStyle='#173f35d9';ctx.font='800 9px system-ui';ctx.textAlign='center';ctx.fillText(r.name,v.x,v.y-27)}function overlay(){let a=0,c='0,0,0';if(state.time>.75){a=.34;c='8,24,58'}else if(state.time>.62){a=(state.time-.62)/.13*.16;c='255,112,45'}if(a){ctx.fillStyle=`rgba(${c},${a})`;ctx.fillRect(0,0,1000,700)}}
function frame(now){let dt=Math.min(.05,(now-last)/1000);last=now;state.time+=dt/150;if(state.time>=1){state.time-=1;state.day++;showToast(`${state.day}일차 아침`)}updateVillagers(dt);ctx.clearRect(0,0,1000,700);let t=now/1000;water(t);island();plots.forEach(plot);resources.forEach(r=>drawResource(r,t));state.buildings.forEach(building);villagers.forEach(v=>villager(v,t));overlay();autosave+=dt;if(autosave>5){autosave=0;save()}requestAnimationFrame(frame)}
document.querySelector('#startBtn').addEventListener('click',()=>{state.started=true;document.querySelector('#splash').classList.add('hide');save();showToast('섬의 자원을 눌러 주민에게 채집을 시켜보세요!')});setInterval(production,1000);window.addEventListener('beforeunload',save);load();requestAnimationFrame(frame);
</script>
</body></html>
