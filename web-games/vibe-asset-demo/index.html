<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>바이브 에셋 3D 테스트</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#15212c;color:white;font-family:sans-serif}#status{position:absolute;top:16px;left:16px;right:16px;z-index:2;background:#0009;padding:12px;border-radius:10px}canvas{display:block}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js"}}</script></head><body><div id="status">바이브 3D 에셋 불러오는 중...</div><script type="module">const THREE=await import('three');const {GLTFLoader}=await import('https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/loaders/GLTFLoader.js');const status=document.getElementById('status');try{const scene=new THREE.Scene();scene.background=new THREE.Color('#24384b');const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);camera.position.set(2,2,5);camera.lookAt(0,1,0);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x556677,2.5));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(3,6,5);scene.add(light);const floor=new THREE.Mesh(new THREE.CylinderGeometry(2,2,.15,48),new THREE.MeshStandardMaterial({color:0x436c55}));floor.position.y=-.1;scene.add(floor);const url=new URL('../../assets/shared/humanoid-traveler.glb',location.href).href;const assetResponse=await fetch(url);if(!assetResponse.ok)throw Error('에셋 HTTP '+assetResponse.status+' '+url);const gltf=await new GLTFLoader().parseAsync(await assetResponse.arrayBuffer(),url.substring(0,url.lastIndexOf('/')+1));const model=gltf.scene;const box=new THREE.Box3().setFromObject(model);const size=box.getSize(new THREE.Vector3());const center=box.getCenter(new THREE.Vector3());model.position.sub(center);const scale=2/Math.max(size.x,size.y,size.z,0.001);model.scale.setScalar(scale);model.position.y+=size.y*scale/2;scene.add(model);status.textContent='바이브 에셋 로딩 성공: humanoid-traveler.glb';function animate(t){requestAnimationFrame(animate);model.rotation.y=t*.0005;renderer.render(scene,camera)}requestAnimationFrame(animate);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})}catch(e){status.textContent='로딩 실패: '+e.message+' (상세 오류는 개발자 도구 참조)';console.error(e)}</script></body></html>
