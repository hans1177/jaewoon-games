<style>

:8px;flex-wrap:wrap;align-items:center;margin:13px 0}.bar>*{max-width:100%}input,select,textarea{background:#10201e;color:#f2faf5;border:1px solid #395148;border-radius:9px;padding:10px;min-width:0}input::placeholder,textarea::placeholder{color:#8ca59c}textarea{resize:vertical;min-height:80px}label{display:block;color:#bfd7ca;font-size:12px;margin:9px 0 4px}.wide{width:100%}.tabs{display:flex;gap:6px;overflow-x:auto;max-width:100%;padding-bottom:6px}.pill{white-space:nowrap;border:1px solid #355346;padding:8px 11px;border-radius:9px;background:#162824;color:#abc6b8}.pill.active{background:#245e49;color:#dcffe8;border-color:#51a581}.table-wrap{overflow:auto;border:1px solid #2d483d;border-radius:12px}table{border-collapse:collapse;width:100%;min-width:680px}th,td{padding:12px 13px;border-bottom:1px solid #294138;text-align:left;font-size:13px;vertical-align:middle}th{background:#1a3029;color:#a7c5b5;font-size:12px;position:sticky;top:0}tr:last-child td{border-bottom:0}.status{display:inline-block;border:1px solid #42695c;border-radius:30px;background:#1a4134;padding:5px 8px;color:#bbf3d9;font-size:11px;white-space:nowrap}.status.warn{color:#ffd4a8;background:#463523;border-color:#6c5539}.status.bad{color:#ffc6c6;background:#43262a;border-color:#70404c}.list{display:grid;gap:9px}.entry{padding:12px 14px;border:1px solid #345046;border-radius:10px;background:#10211d}.entry strong{display:block;margin-bottom:4px}.entry p{margin:6px 0;color:#adc4b7;font-size:13px;white-space:pre-wrap}.itemrow{display:flex;justify-content:space-between;align-items:center;gap:10px}.empty{padding:30px;text-align:center;color:#a6bfb2}.hint{padding:11px 13px;border-left:3px solid #72cca7;background:#1b3029;border-radius:7px;color:#bdd4c9;font-size:12px;margin-bottom:15px}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stats>div{border:1px solid #31473f;border-radius:9px;padding:11px}.stats b{display:block;margin-bottom:6px}.pre{white-space:pre-wrap;overflow-wrap:anywhere}.stack>*+*{margin-top:8px}dialog{width:min(560px,calc(100vw - 24px));max-height:88vh;overflow:auto;background:#12241f;color:#f2f9f3;border:1px solid #4b7a63;border-radius:15px;padding:22px}dialog::backdrop{background:#000b;backdrop-filter:blur(5px)}dialog h3{font-size:20px}.twoinput{display:grid;grid-template-columns:1fr 1fr;gap:10px}.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}.foot button{min-width:85px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}.badge{font-size:11px;color:#8ab5a2}.selectrow{display:flex;gap:8px;flex-wrap:wrap}hr{border:0;border-top:1px solid #345046;margin:15px 0}.check{accent-color:#45c794;width:20px;height:20px;vertical-align:middle}.footer{max-width:1200px;margin:0 auto;padding:10px 16px 26px;color:#6e9183;font-size:11px}
@media(max-width:760px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.compare{grid-template-columns:1fr}h2{font-size:22px}main{padding:18px 12px 40px}.panel{padding:13px}.bar{align-items:stretch}.bar input,.bar select{flex:1 1 140px}.twoinput{grid-template-columns:1fr}dialog{padding:16px}header{padding:13px 12px}}

<header><div class="brand"><div class="mark">✦</div><div><h1>마력숲 개발관리</h1><small>콘텐츠 · 버그 · 적용 기록</small></div></div><nav id="nav"></nav></header><main><div id="app"></div></main><div class="footer">마력숲 개발 기록 전용 · 게임 세이브 및 밸런스와 분리 저장 · GitHub 자동 수정/동기화 없음</div>
<dialog id="dialog"><h3 id="dialogTitle">항목 수정</h3><form id="editForm"><div id="fields"></div><div class="foot"><button type="button" class="btn ghost" id="cancel">취소</button><button type="submit" class="btn primary">저장</button></div></form></dialog>
<script>
"use strict";
// 파일명: manage.html / 저장 / 초기 목록
const KEY="magic-forest-development-manager-v1",VIEWS=["대시보드","콘텐츠","비교","버그","체크리스트","변경 기록","백업"],KINDS=["지역","몬스터","무기","방어구","퀘스트","도감","건축물","스테이지"];
const REGION_NAMES=["초원 마을 (튜토리얼)","세계수 숲","불꽃 화산 협곡","오아시스 지하","안개 늪지","불타는 성채","바람 절벽","북부 고원","고대 협곡","혼돈의 대지","남부 습원","황금 사막","죽음의 늪","안개 늪","서리 고원","잠긴 왕도","별빛 호수","용의 등뼈 산맥","심연의 문"];
const EQUIPMENT=[["무기","방랑자의 검","공격력 0 · 방어력 0"],["무기","사냥꾼 장검","공격력 4 · 방어력 0"],["무기","룬 장검","공격력 9 · 방어력 0"],["무기","숲 수호자의 검","공격력 15 · 방어력 0"],["무기","이슬 단검","공격력 3 · 방어력 1"],["무기","가시 도끼","공격력 11 · 방어력 0"],["무기","세계수 지팡이","공격력 14 · 방어력 1"],["무기","마그마 대검","공격력 24 · 방어력 0"],["방어구","여행자 조끼","방어력 0"],["방어구","사냥꾼 갑옷","방어력 3"],["방어구","수호자 흉갑","방어력 6"],["방어구","강화 장갑","방어력 2"],["방어구","수호자 바지","방어력 3"],["방어구","수호자 장화","방어력 2"],["방어구","세계수 갑주","공격력 1 · 방어력 18"]];
const QUESTS=["01 · 낯선 초원","02 · 마을의 물자","03 · 위험한 흔적","04 · 초원 생존 기록","05 · 세계수 조사 기록","06 · 외곽 늑대 우두머리","07 · 이름 없는 깃발","08 · 울부짖는 동료","09 · 이름을 부르면","10 · 식지 않는 모루","11 · 물에 비친 얼굴","12 · 미나의 장부"];
const BESTIARY=["늑대","황혼 박쥐","우두머리 늑대"];
const BUGS=["몬스터 2회 눌러도 도감 등록과 이름 표시 안 됨","도감 등록 후 몬스터 이름이 흐리게 보임","건축물 청사진 및 설치된 건축물 표시 문제","맵 크기·표현 확인 필요","몬스터 외형 중복 및 설정 불일치","허공 공격 시 처치 표시 알림 발생","무기·방어구 아이콘 외형 중복","스킬트리 아이콘 부족 및 표시 검증 필요"];
function id(){return "r"+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function now(){return new Date().toISOString()}
function blankItem(kind,name,stats,description,source){return {id:id(),kind:kind,name:name||"",appearance:"",stats:stats||"",description:description||"",status:"확인 필요",source:source||"",evidence:"",createdAt:now(),updatedAt:now()}}
function seed(){const source="roblox-games/fantasy-survival/shared/GameConfig.luau";let items=REGION_NAMES.map((n,i)=>blankItem("지역",n,"",i<13?"설정상 Open":"설정상 Reserved",source));
EQUIPMENT.forEach(r=>items.push(blankItem(r[0],r[1],r[2],"게임 설정에 기재된 능력치. 실제 배포·모델 적용은 별도 확인 필요.",source)));
QUESTS.forEach(q=>items.push(blankItem("퀘스트",q,"","메인 퀘스트 설정에 등록됨. 플레이 검증은 별도.",source)));
BESTIARY.forEach(q=>items.push(blankItem("도감",q,"","도감 설정 항목. 게임 내 등록/표시 작동은 확인 필요.",source)));
BESTIARY.forEach(q=>items.push(blankItem("몬스터",q,"","도감상 이름 확인. 개별 외형·전투 수치 미검증.",source)));
["모닥불 복구","요리 화덕 설치","숙소 건설"].forEach(q=>items.push(blankItem("건축물",q,"","야영지 업그레이드 설정. 실제 표시 미검증.",source)));
for(let n=7;n<=12;n++)items.push(blankItem("스테이지","메인 스토리 "+n+"장","", "게임 설정에 등록된 장면. 실행 검증은 별도.",source));
return {version:1,items:items,bugs:BUGS.map((name,i)=>({id:id(),name:name,kind:i===2?"건축물":i===3?"지역":i===5?"전투":i===6?"장비":i===7?"스킬":"도감",severity:i===0||i===2?"높음":"보통",status:"신규",description:"사용자 제보 · 재현 및 해결 여부 미검증",reproduction:"",expected:"",evidence:"",createdAt:now(),updatedAt:now()})),tasks:[],logs:[]};}
function load(){try{const raw=localStorage.getItem(KEY);if(!raw)return seed();const v=JSON.parse(raw);if(!Array.isArray(v.items)||!Array.isArray(v.bugs)||!Array.isArray(v.tasks)||!Array.isArray(v.logs))throw Error("invalid");return v}catch(e){alert("저장 자료가 손상되어 기본 목록으로 열었어. 백업 가져오기로 복원할 수 있어.");return seed();}}
let data=load(),view="대시보드",kind="지역",search="",statusFilter="",compareKind="무기",leftId="",rightId="";
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert("저장 실패: 저장 공간이나 브라우저 설정을 확인해.");return false}}
if(!localStorage.getItem(KEY))save();
function h(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function date(v){return v?new Date(v).toLocaleString("ko-KR"):"-"}
function badge(v){const bad=["신규","재발","수정 필요"].includes(v),warn=["확인 필요","확인중","제작중","수정중"].includes(v);return '<span class="status '+(bad?"bad":warn?"warn":"")+'">'+h(v||"미등록")+'</span>'}
function log(action,name,before,after){data.logs.unshift({id:id(),date:now(),action:action,name:name,before:before??null,after:after??null});if(data.logs.length>1500)data.logs.length=1500}
const app=document.getElementById("app");const nav=document.getElementById("nav");
function renderNav(){nav.innerHTML=VIEWS.map(v=>'<button data-view="'+h(v)+'" class="'+(view===v?'active':'')+'">'+h(v)+'</button>').join("")}
function head(title,desc,action){return '<div class="hero"><div><h2>'+h(title)+'</h2><div class="muted small">'+h(desc)+'</div></div>'+(action||"")+'</div>'}
function itemTable(rows){if(!rows.length)return '<div class="empty">등록된 항목이 없어. 새 항목을 추가해.</div>';return '<div class="table-wrap"><table><thead><tr><th>이름</th><th>구분</th><th>능력치</th><th>적용 상태</th><th>수정일</th><th>관리</th></tr></thead><tbody>'+rows.map(r=>'<tr><td><b>'+h(r.name)+'</b><div class="badge">'+h(r.source?.split("/").pop()||"수동")+'</div></td><td>'+h(r.kind)+'</td><td>'+h(r.stats||"미등록")+'</td><td>'+badge(r.status)+'</td><td>'+h(date(r.updatedAt))+'</td><td><button class="btn" data-action="editItem" data-id="'+h(r.id)+'">수정</button> <button class="btn ghost" data-action="removeItem" data-id="'+h(r.id)+'">삭제</button></td></tr>').join("")+'</tbody></table></div>'}
function renderHome(){const open=data.bugs.filter(b=>b.status!=="검증완료").length,ready=data.items.filter(i=>i.status==="검증됨").length;
app.innerHTML=head("개발 현황","마력숲의 설정과 작업 기록을 분리해서 관리해.",'<a class="btn primary" href="https://github.com/hans1177/jaewoon-games/tree/main/web-games/fantasy-survival" target="_blank" rel="noopener">원본 소스</a>')+
'<div class="hint">현재 이 웹앱 기록은 이 브라우저에만 저장돼. 다른 기기로 자동 동기화되지 않아. 백업 화면에서 파일을 내려받아 보관해. 게임 적용·검증 상태는 실제 배포 증거를 별도 확인해야 해.</div>'+
'<div class="cards"><div class="card"><div class="muted">전체 콘텐츠</div><div class="number">'+data.items.length+'</div></div><div class="card"><div class="muted">검증 증거 기록</div><div class="number">'+ready+'</div></div><div class="card"><div class="muted">미해결 버그</div><div class="number">'+open+'</div></div><div class="card"><div class="muted">남은 체크</div><div class="number">'+data.tasks.filter(t=>!t.done).length+'</div></div></div>'+
'<div class="grid2"><section class="panel"><h3>최근 작업 내역</h3>'+(data.logs.length?'<div class="list">'+data.logs.slice(0,8).map(r=>'<div class="entry"><b>'+h(r.action)+' · '+h(r.name)+'</b><span class="muted small">'+h(date(r.date))+'</span></div>').join("")+'</div>':'<div class="empty">아직 작업 기록이 없어</div>')+'</section><section class="panel"><h3>우선 확인할 버그</h3><div class="list">'+(data.bugs.filter(b=>b.status!=="검증완료").slice(0,6).map(b=>'<div class="entry itemrow"><div><strong>'+h(b.name)+'</strong>'+badge(b.severity)+'</div><button class="btn" data-action="editBug" data-id="'+h(b.id)+'">확인</button></div>').join("")||'<div class="empty">미해결 버그 없음</div>')+'</div></section></div>'}
function renderContent(){const rows=data.items.filter(i=>i.kind===kind&&(!search||[i.name,i.description,i.appearance,i.stats].join(" ").toLowerCase().includes(search.toLowerCase()))&&(!statusFilter||i.status===statusFilter));
app.innerHTML=head("콘텐츠 관리","기획 정보·외형·능력치·적용 상태를 직접 추가하고 수정해.",'<button class="btn primary" data-action="newItem">+ 항목 추가</button>')+
'<div class="tabs">'+KINDS.map(k=>'<button class="pill '+(k===kind?"active":"")+'" data-kind="'+k+'">'+k+' ('+data.items.filter(i=>i.kind===k).length+')</button>').join("")+'</div>'+
'<div class="bar"><input id="q" placeholder="이름·설명 검색" value="'+h(search)+'"><select id="filter"><option value="">모든 상태</option>'+["확인 필요","기획","제작중","적용됨","검증됨","수정 필요"].map(s=>'<option '+(statusFilter===s?"selected":"")+'>'+s+'</option>').join("")+'</select><button class="btn" data-action="clear">초기화</button></div><div class="muted small" style="margin-bottom:9px">'+rows.length+'건 표시</div>'+itemTable(rows)}
function renderCompare(){const rows=data.items.filter(i=>i.kind===compareKind),select=(id,side)=>'<select class="wide" id="'+side+'"><option value="">항목 선택</option>'+rows.map(i=>'<option value="'+h(i.id)+'" '+(id===i.id?"selected":"")+'>'+h(i.name)+'</option>').join("")+'</select>';const a=rows.find(x=>x.id===leftId),b=rows.find(x=>x.id===rightId);
function cell(i){if(!i)return '<div class="panel empty">비교할 항목을 골라.</div>';return '<div class="panel stack"><h3>'+h(i.name)+'</h3><div>상태 '+badge(i.status)+'</div><hr><b>외형</b><p class="pre">'+h(i.appearance||"미등록")+'</p><hr><b>능력치</b><p class="pre">'+h(i.stats||"미등록")+'</p><hr><b>설명</b><p class="pre">'+h(i.description||"미등록")+'</p><hr><div class="muted small">소스: '+h(i.source||"미등록")+'</div></div>'}
app.innerHTML=head("항목 비교","외형·능력치·설명·상태를 나란히 비교해.")+'<div class="bar"><select id="compareKind">'+KINDS.map(k=>'<option '+(k===compareKind?"selected":"")+'>'+k+'</option>').join("")+'</select></div><div class="compare"><div>'+select(leftId,"left")+cell(a)+'</div><div>'+select(rightId,"right")+cell(b)+'</div></div>'+(a&&b?'<div class="panel"><h3>차이 요약</h3><div class="stats">'+["appearance","stats","description","status"].map((k,i)=>'<div><b>'+["외형","능력치","설명","적용 상태"][i]+'</b>'+(String(a[k])===String(b[k])?"같음":"차이 있음")+'</div>').join("")+'</div></div>':"")}
function renderBugs(){const rows=data.bugs.filter(b=>!search||[b.name,b.description,b.kind].join(" ").toLowerCase().includes(search.toLowerCase()));app.innerHTML=head("버그 목록","제보와 실제 재현·수정·배포·검증을 따로 기록해.",'<button class="btn primary" data-action="newBug">+ 버그 추가</button>')+'<div class="bar"><input id="q" placeholder="버그 검색" value="'+h(search)+'"></div><div class="list">'+(rows.map(b=>'<div class="entry itemrow"><div><strong>'+h(b.name)+'</strong><span class="muted small">'+h(b.kind)+' · '+h(date(b.updatedAt))+'</span><p>'+h(b.description)+'</p>'+badge(b.severity)+' '+badge(b.status)+'</div><div><button class="btn" data-action="editBug" data-id="'+h(b.id)+'">수정</button> <button class="btn ghost" data-action="removeBug" data-id="'+h(b.id)+'">삭제</button></div></div>').join("")||'<div class="empty">등록된 버그가 없어</div>')+'</div>'}
function renderTasks(){app.innerHTML=head("적용 체크리스트","체크 완료와 GitHub 반영·배포·검증 증거는 서로 다르게 관리해.",'<button class="btn primary" data-action="newTask">+ 작업 추가</button>')+'<div class="hint">체크를 해도 실제 게임 수정이나 배포가 실행되지 않아. 확인할 소스 링크와 커밋·배포·실행 증거를 함께 기록해.</div><div class="list">'+(data.tasks.map(t=>'<div class="entry itemrow"><div><strong><input class="check" type="checkbox" data-action="toggleTask" data-id="'+h(t.id)+'" '+(t.done?"checked":"")+'> '+h(t.name)+'</strong><div class="muted small">'+h(t.stage)+' · '+(t.done?"기록상 완료":"대기")+' · '+(t.evidence?"증거 링크 기록":"증거 없음")+'</div><p>'+h(t.description||"")+'</p></div><div><button class="btn" data-action="editTask" data-id="'+h(t.id)+'">수정</button> <button class="btn ghost" data-action="removeTask" data-id="'+h(t.id)+'">삭제</button></div></div>').join("")||'<div class="empty">작업을 추가해.</div>')+'</div>'}
function renderLogs(){app.innerHTML=head("변경 기록","등록·수정·삭제·체크 변경을 시간순으로 남겨.",'<button class="btn primary" data-action="newLog">+ 작업일지</button>')+'<div class="list">'+(data.logs.map(x=>'<div class="entry"><div class="itemrow"><strong>'+h(x.action)+' · '+h(x.name)+'</strong><span class="muted small">'+h(date(x.date))+'</span></div>'+(x.before!==null||x.after!==null?'<details><summary class="muted small">이전·이후 보기</summary><div class="grid2"><div class="pre small">'+h(JSON.stringify(x.before,null,2))+'</div><div class="pre small">'+h(JSON.stringify(x.after,null,2))+'</div></div></details>':"")+'</div>').join("")||'<div class="empty">아직 변경 기록이 없어.</div>')+'</div>'}
function renderBackup(){app.innerHTML=head("백업 및 복원","다른 기기로 옮길 때 JSON 파일을 사용해.")+'<div class="panel"><h3>JSON 내보내기</h3><p class="muted small">전체 콘텐츠, 버그, 체크리스트, 활동 기록을 하나의 파일로 저장해.</p><button class="btn primary" data-action="export">파일 저장</button></div><div class="panel"><h3>JSON 가져오기</h3><p class="muted small">복원 시 이 기기에 저장된 기존 기록을 덮어써. 먼저 내보내기를 권장해.</p><input id="importFile" type="file" accept=".json,application/json" class="wide"></div><div class="panel"><h3>출처와 저장 방식</h3><p class="small muted">GitHub: <a href="https://github.com/hans1177/jaewoon-games/tree/main/web-games/fantasy-survival" target="_blank" rel="noopener">마력숲 원본</a></p><p class="small muted">초기 지역·장비·스토리 등은 main의 GameConfig 설정 기준이며 실제 모바일 실행·화면 표시·게시 버전 일치는 확인하지 않았어.</p><p class="small muted">이 앱은 로그인이나 서버 저장이 없어. 브라우저 데이터 삭제 시 기록이 사라질 수 있어.</p></div>'}
function render(){renderNav();if(view==="대시보드")renderHome();else if(view==="콘텐츠")renderContent();else if(view==="비교")renderCompare();else if(view==="버그")renderBugs();else if(view==="체크리스트")renderTasks();else if(view==="변경 기록")renderLogs();else renderBackup()}
// 파일명: manage.html / 편집
const dialog=document.getElementById("dialog"),editForm=document.getElementById("editForm"),fields=document.getElementById("fields");
let editType="",editId="";
function field(name,label,value,textarea){return '<label for="f_'+name+'">'+h(label)+'</label>'+(textarea?'<textarea class="wide" id="f_'+name+'" name="'+name+'">'+h(value||"")+'</textarea>':'<input class="wide" id="f_'+name+'" name="'+name+'" value="'+h(value||"")+'">')}
function choice(name,label,options,current){return '<label for="f_'+name+'">'+h(label)+'</label><select class="wide" id="f_'+name+'" name="'+name+'">'+options.map(x=>'<option value="'+h(x)+'" '+(x===current?"selected":"")+'>'+h(x)+'</option>').join("")+'</select>'}
function openEditor(type,uid){editType=type;editId=uid||"";const list=type==="item"?data.items:type==="bug"?data.bugs:data.tasks;const old=list.find(r=>r.id===uid)||{};document.getElementById("dialogTitle").textContent=({item:"콘텐츠",bug:"버그",task:"적용 작업",log:"작업일지"}[type]||"")+" "+(uid?"수정":"추가");
let content=field("name","이름 / 제목",old.name);
if(type==="item"){content+=choice("kind","카테고리",KINDS,old.kind||kind)+field("appearance","외형 · 이미지 설명",old.appearance,true)+field("stats","능력치 (자유 입력)",old.stats,true)+field("description","설명",old.description,true)+choice("status","적용 상태",["확인 필요","기획","제작중","적용됨","검증됨","수정 필요"],old.status||"확인 필요")+field("source","GitHub 소스 경로",old.source)+field("evidence","적용·검증 증거 URL",old.evidence)}
else if(type==="bug"){content+=choice("kind","분야",KINDS.concat(["전투","장비","스킬","기타"]),old.kind||"몬스터")+choice("severity","우선순위",["긴급","높음","보통","낮음"],old.severity||"보통")+choice("status","진행 상태",["신규","확인중","수정중","배포됨","검증완료","재발"],old.status||"신규")+field("description","문제 현상",old.description,true)+field("reproduction","재현 방법",old.reproduction,true)+field("expected","기대 동작",old.expected,true)+field("evidence","재현·수정·검증 증거 URL",old.evidence)}
else if(type==="task"){content+=choice("stage","적용 단계",["기획","에셋","코드","main반영","배포","실행검증"],old.stage||"기획")+field("description","작업 내용",old.description,true)+field("evidence","증거 URL / 커밋 SHA",old.evidence)+choice("done","기록상 완료",["아니오","예"],old.done?"예":"아니오")}
else{content+=field("description","작업일지 내용","",true)}
fields.innerHTML=content;editForm.elements.name?.focus();dialog.showModal();}
document.getElementById("cancel").onclick=()=>dialog.close();
editForm.addEventListener("submit",e=>{e.preventDefault();const row=Object.fromEntries(new FormData(editForm).entries());row.name=String(row.name||"").trim();if(!row.name){alert("이름을 입력해.");return}if((editType==="bug"&&row.status==="검증완료"||editType==="item"&&row.status==="검증됨")&&!String(row.evidence||"").trim()){alert("검증 완료는 증거 URL이 있어야 기록할 수 있어.");return}
if(editType==="log"){log("수동 작업일지",row.name,null,row.description);save();dialog.close();render();return}
const name=editType==="item"?"items":editType==="bug"?"bugs":"tasks";const list=data[name],ix=list.findIndex(x=>x.id===editId),before=ix>=0?structuredClone(list[ix]):null;
const after=Object.assign({},before||{id:id(),createdAt:now()},{...row,updatedAt:now()});if(editType==="task")after.done=row.done==="예";if(ix>=0)list[ix]=after;else list.unshift(after);
log(ix>=0?"수정":"추가",after.name,before,after);save();dialog.close();render()});
// 파일명: manage.html / 이벤트
document.addEventListener("click",e=>{const el=e.target.closest("[data-view],[data-kind],[data-action]");if(!el)return;
if(el.dataset.view){view=el.dataset.view;search="";render();return}if(el.dataset.kind){kind=el.dataset.kind;search="";render();return}
const action=el.dataset.action,uid=el.dataset.id;if(["newItem","newBug","newTask","newLog"].includes(action)){openEditor({newItem:"item",newBug:"bug",newTask:"task",newLog:"log"}[action]);return}
if(["editItem","editBug","editTask"].includes(action)){openEditor({editItem:"item",editBug:"bug",editTask:"task"}[action],uid);return}
if(["removeItem","removeBug","removeTask"].includes(action)){const key={removeItem:"items",removeBug:"bugs",removeTask:"tasks"}[action],i=data[key].findIndex(x=>x.id===uid);if(i>=0&&confirm("정말 삭제할까? 삭제 내역은 로그에 남아.")){const prev=data[key].splice(i,1)[0];log("삭제",prev.name,prev,null);save();render()}return}
if(action==="clear"){search="";statusFilter="";render();return}
if(action==="export"){const file=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(file);a.download="마력숲-개발기록-"+new Date().toISOString().slice(0,10)+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1200);return}});
document.addEventListener("change",async e=>{const t=e.target;
if(t.id==="filter"){statusFilter=t.value;render()}
else if(t.id==="compareKind"){compareKind=t.value;leftId="";rightId="";render()}
else if(t.id==="left"||t.id==="right"){if(t.id==="left")leftId=t.value;else rightId=t.value;render()}
else if(t.dataset.action==="toggleTask"){const x=data.tasks.find(x=>x.id===t.dataset.id);if(x){let old={...x};x.done=t.checked;x.updatedAt=now();log("체크 변경",x.name,old,x);save();render()}}
else if(t.id==="importFile"&&t.files?.[0]){try{const raw=await t.files[0].text(),v=JSON.parse(raw);if(!Array.isArray(v.items)||!Array.isArray(v.bugs)||!Array.isArray(v.tasks)||!Array.isArray(v.logs))throw Error("형식 오류");if(confirm("가져온 기록으로 기존 기록을 전부 교체할까? 기존 기록을 먼저 백업했는지 확인해.")){data=v;log("복원","JSON 백업 파일",null,{items:v.items.length,bugs:v.bugs.length});save();render()}}catch(err){alert("백업 파일이 올바르지 않아: "+err.message)}}});
document.addEventListener("input",e=>{if(e.target.id==="q"){const value=e.target.value;const start=e.target.selectionStart;search=value;render();const q=document.getElementById("q");if(q){q.focus();q.setSelectionRange(start,start)}}});
render();
</script></body></html>
