function fieldScene(local){groundScene('forest');let z,orientation=0,fall=0,confused=false;
 if(local<4){z=mix(-8,-12,sm(1,4,local));orientation=0;}
 else if(local<7.1){z=mix(-12,1.40,sm(4,7.1,local));orientation=0;}
 else if(local<12.5){z=1.20;orientation=.15*Math.sin(local*17);confused=local>=9;}
 else if(local<18.4){z=mix(1.2,-2.1,sm(12.5,14.5,local));orientation=local<16?Math.sin(local*4)*.9:0;confused=true;}
 else {z=-2.1;fall=sm(18.2,19.3,local);}
 const firing=shotTimes.some(x=>local>=x&&local<x+.095);const hits=shotTimes.filter(x=>local>=x).length;
 // 도주 → 반전 돌진 → 물기 → 네 번 사격 → 후방 이동 → 머리 뒤 두 발 사격 → 쓰러짐

 if(confused||fall){ // 늑대의 혼란/낙상: 기존 늑대 몸체 전체를 한 번에 회전, 부위 분리 없음
  let wobble=confused&&!fall?Math.sin(local*9)*.22:0;

  for(let j=wolfBegin;j<drawn.length;j++)drawn[j].model=M.mul(root,drawn[j].model);
 }
 for(let n=0;n<shotTimes.length;n++){if(local>=shotTimes[n]&&local<shotTimes[n]+.19){
  let headZ=z+(n>=4?1.55:1.37),a=(local-shotTimes[n])/.19;

 }}
 const newbieX=local<12?0:mix(0,2.8,sm(12.0,15.2,local)), newbieZ=local<12?3.25:mix(3.25,-4.3,sm(12,15.6,local));

 // 6발은 정확히 발사 타이밍에서만 효과 표시

 }
 if(local>=19.2){const n=local>=21?2:1;for(let b=0;b<n;b++)box(newbieX+.18+b*.15,1.16,newbieZ-.20,.12,.06,.33,'white');}
 if(local<9){cam(0,1.76,5.4,0,1.04,-6);bulletGuns(false,local)}
 else if(local<12.2){cam(.3,1.7,5.55,0,1.08,z);bulletGuns(firing,local)}
 else{cam(4.0,2.72,6.0,0,1.10,-2.1);}
 show('hit',local>=9&&local<20);$('hit').textContent=`그림자늑대 · 사격 ${hits} / 6발`;
 show('wound',local>=19&&local<28);$('wound').textContent=`방어복 보호 · 작은 상처 · 밴드 ${local<21?1:2}개`;
 $('hurt').style.opacity=local>=7.0&&local<9?String((1-sm(8.4,9,local))*.73):'0';

 lineAt(local,[
 [0,'신입 연구원','일반지역 첫 실전… 저기 그림자늑대가 있어.'],
 [3.1,'신입 연구원','뒤로 가네? 도망치는 건가?'],

 [7.15,'신입 연구원','아악! 물렸어! 방어복이 버텨 줘!'],
 [9.0,'신입 연구원','침착하게… 우선 네 발!'],
 [12.2,'신입 연구원','혼란스러워하는 사이에 뒤로 이동하자.'],

function activeScene(t){for(let i=segments.length-1;i>=0;i--)if(t>=starts[i])return i;return 0;}
function draw(t){time=t;drawn.length=0;const i=activeScene(t),s=segments[i],local=t-starts[i];
 show('guide',s.kind==='guide'||s.kind==='toc');show('rank',s.kind==='rank');if(s.kind!=='field'){show('hit',false);show('wound',false);$('hurt').style.opacity='0';$('flash').style.opacity='0';}
 $('sceneTitle').textContent=s.label;$('chapterNum').textContent=`기록 ${i+1} / ${segments.length}`;$('clock').textContent=`${String(Math.floor(t/60)).padStart(2,'0')}:${String(Math.floor(t%60)).padStart(2,'0')}`;
 $('bar').style.width=(t/total*100).toFixed(3)+'%';
 if(s.kind==='intro')labScene(local);else if(s.kind==='rank')rankScene(s.index,local);else if(s.kind==='toc')tocScene(local);else if(s.kind==='guide')guideScene(s.index,local);else if(s.kind==='field')fieldScene(local);else if(s.kind==='home')homeScene(local);
 let dpr=Math.min(devicePixelRatio||1,innerWidth<700?1:1.4),budget=Math.min(1,Math.sqrt(850000/(Math.max(1,innerWidth*innerHeight)*dpr*dpr)));let w=Math.max(2,Math.round(innerWidth*dpr*budget)),h=Math.max(2,Math.round(innerHeight*dpr*budget));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}
 gl.viewport(0,0,w,h);gl.clearColor(.03,.11,.15,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);drawSky();renderObjects();
}
// 로그 · 재생 상태, 프레임별 중복 재생 방지
let running=false,paused=false,ended=false,speed=1,seconds=0,last=null,seenShots=new Set();
function playAudio(){try{const ctx=window._mfAudio||(window._mfAudio=new (window.AudioContext||window.webkitAudioContext)());if(ctx.state==='suspended')ctx.resume();const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='triangle';osc.frequency.setValueAtTime(190,ctx.currentTime);osc.frequency.exponentialRampToValueAtTime(46,ctx.currentTime+.11);gain.gain.setValueAtTime(.07,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.12);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.13)}catch(_){}}
function tick(stamp){if(!running)return;if(last===null)last=stamp;const delta=Math.min(.08,(stamp-last)/1000);last=stamp;if(!paused){let old=seconds;seconds=Math.min(total,seconds+delta*speed);for(let n=0;n<shotTimes.length;n++){let at=fieldStart+shotTimes[n];if(seconds>=at&&old<at&&!seenShots.has(n)){seenShots.add(n);playAudio()}}}
 draw(seconds);
 if(seconds>=total){running=false;ended=true;show('end',true);return;}
 requestAnimationFrame(tick);
}
function begin(){seconds=0;last=null;paused=false;ended=false;seenShots.clear();show('start',false);show('end',false);$('pause').textContent='일시정지';running=true;requestAnimationFrame(tick)}
$('play').addEventListener('click',begin);$('replay').addEventListener('click',begin);
$('pause').addEventListener('click',()=>{if(!running)return;paused=!paused;last=null;$('pause').textContent=paused?'이어보기':'일시정지'});
$('speed').addEventListener('click',()=>{speed=speed===1?1.5:speed===1.5?2:1;$('speed').textContent=`${speed}배속`});
$('next').addEventListener('click',()=>{if(!running)return;let i=activeScene(seconds);seconds=Math.min(total,starts[Math.min(i+1,starts.length-1)]);seenShots.clear();for(let k=0;k<shotTimes.length;k++)if(seconds>=fieldStart+shotTimes[k])seenShots.add(k);last=null;draw(seconds)});
window.addEventListener('pagehide',()=>{running=false});

window.research11QA=()=>({duration:total,guideCount:guides.length,rankCount:ranks.length,shotCount:shotTimes.length,homeSeconds:segments.at(-1).duration,guideWarnings:guides.every(x=>!!x.warn),chapterCount:segments.length,chapterNames:segments.map(s=>s.label)});
window.research11SetTime=t=>{seconds=clamp(Number(t)||0,0,total-.01);draw(seconds)};
if(new URLSearchParams(location.search).has('qa')){draw(Number(new URLSearchParams(location.search).get('time')||0));}
})();
