<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1712;color:#f3fff6;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}body{position:fixed;inset:0}button{font:inherit}#game{position:absolute;inset:0;width:100%;height:100%;display:block;background:#1c3629;touch-action:none}.hud{position:absolute;left:max(7px,env(safe-area-inset-left));right:max(7px,env(safe-area-inset-right));top:max(7px,env(safe-area-inset-top));display:flex;gap:6px;align-items:flex-start;pointer-events:none}.card{pointer-events:auto;background:#0c1915e8;border:1px solid #d9f4e02d;border-radius:12px;padding:7px 9px;box-shadow:0 5px 16px #0006}.main{flex:1;min-width:0}.top{display:flex;align-items:center;gap:7px}.title{font-size:12px;font-weight:1000;white-space:nowrap}.hp{height:9px;flex:1;min-width:70px;max-width:200px;border-radius:999px;overflow:hidden;background:#3b2026}.hp>i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#e95568,#f3916f)}.small{font-size:10px;font-weight:900;white-space:nowrap}.sub{display:flex;gap:7px;flex-wrap:wrap;margin-top:4px;color:#bad0c1;font-size:9px;font-weight:850}.sub b{color:#fff}.res{display:grid;grid-template-columns:auto auto;gap:3px 8px;font-size:9px;font-weight:1000;white-space:nowrap}.save,.home{pointer-events:auto;min-width:41px;min-height:37px;border:1px solid #ffffff2c;border-radius:10px;background:#1d352b;color:#fff;font-size:10px;font-weight:1000;text-decoration:none;display:flex;align-items:center;justify-content:center;padding:0 7px}.notice{position:absolute;top:82px;left:50%;transform:translateX(-50%);max-width:min(88vw,460px);padding:8px 11px;border-radius:10px;background:#07110de9;border:1px solid #ffffff25;text-align:center;font-size:11px;font-weight:900;opacity:0;transition:.18s;pointer-events:none;z-index:30}.notice.on{opacity:1}.stick{position:absolute;left:max(15px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inse 1px solid #ffffff1d;border-radius:11px;background:#162a22;color:#fff;padding:8px}.recipe:disabled,.invItem:disabled{opacity:.4}.recipe b,.invItem b{display:block;font-size:12px;margin-bottom:3px}.recipe small,.invItem small{display:block;color:#b8d0c0;font-size:9px;line-height:1.4}.recipe .cost{margin-top:4px;color:#ffe09b;font-weight:900}.invSection{margin:10px 0 6px;font-size:11px;font-weight:1000;color:#d8f6df}.invMaterials{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:8px}.mat{padding:8px;border-radius:10px;background:#12251e;border:1px solid #ffffff12;font-size:10px}.mat b{float:right;color:#ffe09b}.slot{margin-top:5px;color:#98e8b8!important;font-weight:900}.smelt{position:absolute;right:max(10px,env(safe-area-inset-right));bottom:112px;width:min(290px,78vw);display:none;background:#17140ff2;border:1px solid #ffd59138;border-radius:14px;padding:10px;z-index:25;box-shadow:0 10px 28px #0009}.smelt.open{display:block}.smelt h3{font-size:13px;margin:0 0 6px}.smelt p{font-size:10px;color:#d7c7a8;margin:5px 0}.smeltRow{display:flex;gap:7px}.smelt button{border:0;border-radius:10px;min-height:38px;padding:0 12px;font-weight:1000}.smeltBtn{flex:1;background:#d88143;color:#1c1108}.smeltClose{width:42px;background:#ffffff14;color:#fff}.progress{height:7px;background:#241d15;border-radius:999px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;width:0;background:#ffb45f}.legend{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);font-size:9px;font-weight:850;color:#c7dccf;background:#07120dc4;border:1px solid #ffffff16;border-radius:9px;padding:5px 8px;pointer-events:none}.flash{position:absolute;inset:0;background:#ff4d6530;opacity:0;pointer-events:none;transition:.1s}.flash.on{opacity:1}@media(max-width:720px){.sheet{left:7px;right:7px;top:auto;bottom:7px;width:auto;max-height:72%}.sheetBody{padding-bottom:max(10px,env(safe-area-inset-bottom))}.legend{display:none}.hud{gap:4px}.card{padding:6px 7px}.res{display:none}.save,.home{min-width:37px;padding:0 5px}.grid{grid-template-columns:1fr 1fr}}@media(max-width:430px){.grid{grid-template-columns:1fr}.stick{width:106px;height:106px}.knob{left:31px;top:31px;width:44px;height:44px}.actions{gap:5px}.gather,.craft,.inventory{width:54px;height:50px;font-size:10px}.attack{width:68px;height:68px}}

<body>
<canvas id="game"></canvas>
<div class="hud"><div class="card main"><div class="top"><span class="title">마력숲 생존기</span><div class="hp"><i id="hpfill"></i></div><span id="hptext" class="small">100/100</span></div><div class="sub"><span>무기 <b id="weapon">맨손</b></span><span>도구 <b id="tool">없음</b></span><span>방어 <b id="armor">없음</b></span><span>지역 <b id="zone">마력숲</b></span><span>처치 <b id="kills">0</b></span></div></div><div class="card res"><span>나무 <b id="wood">0</b></span><span>돌 <b id="stone">0</b></span><span>섬유 <b id="fiber">0</b></span><span>철광석 <b id="ironOre">0</b></span><span>구운철 <b id="ironIngot">0</b></span></div><button id="save" class="save">저장</button><a class="home" href="/">홈</a></div>
<div id="notice" class="notice"></div><div id="stick" class="stick"><div id="knob" class="knob"></div></div>
<div class="actions"><button id="gather" class="act gather">채집</button><button id="craft" class="act craft">제작</button><button id="inventory" class="act inventory">가방</button><button id="attack" class="act attack">공격</button></div>
<div id="sheet" class="sheet"><div class="sheetHead"><div class="tabs"><button id="handTab" class="tab on">맨손</button><button id="benchTab" class="tab">제작대</button><button id="ironBenchTab" class="tab">철 제작대</button><button id="inventoryTab" class="tab">인벤토리</button></div><button id="close" class="close">×</button></div><div id="sheetBody" class="sheetBody"></div></div>
<div id="smeltPanel" class="smelt"><h3>화로 · 철 굽기</h3><p id="smeltText">철광석 1개를 5초 동안 굽습니다.</p><div class="smeltRow"><button id="smeltBtn" class="smeltBtn">굽기</button><button id="smeltClose" class="smeltClose">×</button></div><div class="progress"><i id="smeltProgress"></i></div></div>
<div class="legend">E 채집 · C 제작 · I 인벤토리 · 화로 두 번 누르기 · WASD 이동</div><div id="flash" class="flash"></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const ui={hpfill:document.getElementById('hpfill'),hptext:document.getElementById('hptext'),weapon:document.getElementById('weapon'),tool:document.getElementById('tool'),armor:document.getElementById('armor'),zone:document.getElementById('zone'),kills:document.getElementById('kills'),wood:document.getElementById('wood'),stone:document.getElementById('stone'),fiber:document.getElementById('fiber'),ironOre:document.getElementById('ironOre'),ironIngot:document.getElementById('ironIngot'),notice:document.getElementById('notice'),sheet:document.getElementById('sheet'),sheetBody:document.getElementById('sheetBody'),handTab:document.getElementById('handTab'),benchTab:document.getElementById('benchTab'),ironBenchTab:document.getElementById('ironBenchTab'),inventoryTab:document.getElementById('inventoryTab'),attack:document.getElementById('attack'),flash:document.getElementById('flash'),smeltPanel:document.getElementById('smeltPanel'),smeltText:document.getElementById('smeltText'),smeltBtn:document.getElementById('smeltBtn'),smeltProgress:document.getElementById('smeltProgress')};
const WORLD={w:12000,h:8000},START={x:6000,y:4000},SAVE_KEY='jaewoon_fantasy_survival_v1',SAVE_VERSION=4,RESOURCE_RESPAWN_MS=300000;
const CANYON_POLY=[{x:7300,y:1200},{x:12000,y:3000},{x:12000,y:8000},{x:8700,y:8000},{x:6500,y:5000}];
const recipes=[
{id:'bench',name:'제작대',where:'hand',cost:{wood:10,stone:6,fiber:4},desc:'상위 제작을 위한 기본 제작대',kind:'structure'},
{id:'wood-spear',name:'나무창',where:'hand',cost:{wood:6,fiber:3},desc:'공격력 10 · 긴 사거리',kind:'weapon',power:10,range:96,cooldown:480},
{id:'bandage',name:'섬유붕대',where:'hand',cost:{fiber:6},desc:'사용 시 체력 35 회복',kind:'consumable',heal:35},
{id:'torch',name:'마력 횃불',where:'hand',cost:{wood:4,stone:1,fiber:2},desc:'주변을 밝히는 횃불',kind:'torch'},
{id:'stone-sword',name:'돌검',where:'bench',cost:{wood:5,stone:9,fiber:2},desc:'공격력 18',kind:'weapon',power:18,range:75,cooldown:380},
{id:'stone-axe',name:'돌도끼',where:'bench',cost:{wood:6,stone:8,fiber:3},desc:'나무 채집량 3배',kind:'tool',target:'tree',mult:3},
{id:'stone-pick',name:'돌곡괭이',where:'bench',cost:{wood:6,stone:10,fiber:3},desc:'돌·철 채집량 3배',kind:'tool',target:'rock',mult:3},
{id:'fiber-knife',name:'섬유칼',where:'bench',cost:{wood:4,stone:5,fiber:8},desc:'섬유 채집량 3배',kind:'tool',target:'fiber',mult:3},
{id:'rune-shield',name:'룬 방패',where:'bench',cost:{wood:8,stone:12,fiber:6},desc:'받는 피해 30% 감소',kind:'armor',reduce:.30},
{id:'forest-armor',name:'숲 갑옷',where:'bench',cost:{wood:5,stone:7,fiber:14},desc:'최대 체력 +40',kind:'armor',maxHp:40},
{id:'furnace',name:'화로',where:'bench',cost:{wood:3,stone:6},desc:'철광석을 1개당 5초에 구움 · 설치 후 두 번 누르기',kind:'structure'},
{id:'iron-bench',name:'철 제작대',where:'bench',cost:{wood:1,stone:3,ironIngot:5},desc:'철 장비와 좋은 붕대 제작',kind:'structure'},
{id:'iron-sword',name:'철 검',where:'ironbench',cost:{wood:1,stone:2,fiber:3,ironIngot:3},desc:'공격력 54 · 돌검의 3배',kind:'weapon',power:54,range:80,cooldown:380},
{id:'iron-axe',name:'철 도끼',where:'ironbench',cost:{wood:1,stone:2,fiber:3,ironIngot:3},desc:'공격력 70.2 · 철 검의 1.3배 · 공격속도 1초',kind:'weapon',power:70.2,range:76,cooldown:1000},
{id:'good-bandage',name:'좋은 붕대',where:'ironbench',cost:{wood:1,fiber:3},desc:'1초마다 체력 10 · 5초 지속',kind:'consumable',regen:true}
];
const creatures={mossboar:{id:'mossboar',name:'이끼멧돼지',mood:'neutral',hp:72,dmg:9,speed:62,r:20,color:'#73935d',detect:430},golem:{id:'golem',name:'돌정령',mood:'neutral',hp:150,dmg:18,speed:42,r:22,color:'#9ba59b',detect:430},goblin:{id:'goblin',name:'숲 고블린',mood:'aggressive',hp:42,dmg:7,speed:72,r:18,color:'#b0c35a',detect:430},shadowwolf:{id:'shadowwolf',name:'그림자늑대',mood:'aggressive',hp:95,dmg:14,speed:90,r:19,color:'#59687c',detect:430},fairy:{id:'fairy',name:'빛의 요정',mood:'harmless',hp:26,dmg:0,speed:55,r:12,color:'#f7ef9c',detect:0},ironspirit:{id:'ironspirit',name:'철 정령',mood:'aggressive',hp:66.5,dmg:9.8,speed:180,r:18,color:'#87949c',detect:860,canyon:true}};
const state={player:{x:START.x,y:START.y,hp:100,maxHp:100,speed:185,wood:0,stone:0,fiber:0,ironOre:0,ironIngot:0,kills:0,weapon:null,tool:null,armor:null,torch:false,inventory:{},attackAt:0,attackFx:0,faceX:1,faceY:0,invuln:0,regenTicks:0,regenNext:0},bench:null,furnace:null,ironBench:null,trees:[],rocks:[],fibers:[],irons:[],enemies:[],camera:{x:0,y:0},keys:new Set(),stick:{x:0,y:0},last:performance.now(),respawns:[],craftMode:'hand',panelMode:'craft',smelting:{endAt:0},dirty:false};
let noticeTimer=0,autosave=0,lastWorldTap={target:null,at:0};
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
function pointInPoly(x,y,poly=CANYON_POLY){let inside=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const xi=poly[i].x,yi=poly[i].y,xj=poly[j].x,yj=poly[j].y,hit=((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi);if(hit)inside=!inside}return inside}
function randomCanyonPoint(){let x,y,guard=0;do{x=rand(6500,11920);y=rand(1150,7920);guard++}while(!pointInPoly(x,y)&&guard<400);return{x,y}}
function makeNode(kind,i){let x,y;if(kind==='iron'){const p=randomCanyonPoint();x=p.x;y=p.y}else{do{x=rand(110,WORLD.w-110);y=rand(110,WORLD.h-110)}while(dist(x,y,START.x,START.y)<170||pointInPoly(x,y))}const maxHp=kind==='tree'?3:kind==='rock'?4:kind==='iron'?5:2;return{id:kind+i,kind,x,y,hp:maxHp,maxHp,dead:false,respawnAt:0}}
function spawnCreature(type,index=0,anchor=null,packId=null){let x,y;if(type.canyon){if(anchor){x=clamp(anchor.x+rand(-72,72),6520,11940);y=clamp(anchor.y+rand(-72,72),1180,7940);if(!pointInPoly(x,y)){x=anchor.x;y=anchor.y}}else{const p=randomCanyonPoint();x=p.x;y=p.y}}else if(type.mood==='aggressive'){let band=0,tries=0;do{x=rand(80,WORLD.w-80);y=rand(80,WORLD.h-80);const nx=Math.abs(x-START.x)/(WORLD.w/2),ny=Math.abs(y-START.y)/(WORLD.h/2);band=Math.max(nx,ny);tries++}while((band<.38||band>.92||pointInPoly(x,y))&&tries<300)}else{const a=index*2.399+rand(-.7,.7),d=type.mood==='neutral'?rand(420,2600):rand(250,1800);x=clamp(START.x+Math.cos(a)*d,60,WORLD.w-60);y=clamp(START.y+Math.sin(a)*d,60,WORLD.h-60);if(pointInPoly(x,y)){x=START.x+rand(-1000,1000);y=START.y+rand(-900,900)}}return{type,hp:type.hp,maxHp:type.hp,x,y,spawnX:x,spawnY:y,packId,attackAt:0,hitAt:0,hostile:type.mood==='aggressive',wander:packId===null?rand(0,Math.PI*2):packId*1.73,wanderAt:0}}
function spawnAt(type,x,y,packId=null){return{type,hp:type.hp,maxHp:type.hp,x,y,spawnX:x,spawnY:y,packId,attackAt:0,hitAt:0,hostile:type.mood==='aggressive',wander:packId===null?rand(0,Math.PI*2):packId*1.73,wanderAt:0}}
function initWorld(){
  state.trees=Array.from({length:420},(_,i)=>makeNode('tree',i));
  state.rocks=Array.from({length:340},(_,i)=>makeNode('rock',i));
  state.fibers=Array.from({length:440},(_,i)=>makeNode('fiber',i));
  state.irons=Array.from({length:95},(_,i)=>makeNode('iron',i));
  state.enemies=[];
  const counts={mossboar:18,golem:10,goblin:18,shadowwolf:15,fairy:8};
  for(const [id,count] of Object.entries(counts))for(let i=0;i<count;i++)state.enemies.push(spawnCreature(creatures[id],i));
  const starter=[
    ['mossboar',START.x-520,START.y-260],
    ['mossboar',START.x+620,START.y+180],
    ['golem',START.x-780,START.y+520],
    ['goblin',START.x+900,START.y-420],
    ['goblin',START.x-980,START.y-620],
    ['shadowwolf',START.x+1150,START.y+650]
  ];
  for(const [id,x,y] of starter)state.enemies.push(spawnAt(creatures[id],x,y));
  const canyonPacks=[
    {x:7900,y:3000},
    {x:9600,y:4700},
    {x:10800,y:6500}
  ];
  canyonPacks.forEach((anchor,pack)=>{
    const a=pointInPoly(anchor.x,anchor.y)?anchor:randomCanyonPoint();
    for(let i=0;i<3;i++){
      const angle=i*Math.PI*2/3,rad=55;
      const x=a.x+Math.cos(angle)*rad,y=a.y+Math.sin(angle)*rad;
      state.enemies.push(spawnAt(creatures.ironspirit,x,y,pack));
    }
  });
}
function item(id){return recipes.find(r=>r.id===id)}function nameOf(id,fallback='없음'){return item(id)?.name||fallback}function invCount(id){return Math.max(0,Number(state.player.inventory[id])||0)}function addInv(id,n=1){state.player.inventory[id]=invCount(id)+n;state.dirty=true}
function showNotice(text){ui.notice.textContent=text;ui.notice.classList.add('on');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>ui.notice.classList.remove('on'),1500)}
function updateHud(){const p=state.player;ui.hpfill.style.width=100*p.hp/p.maxHp+'%';ui.hptext.textContent=Math.ceil(p.hp)+'/'+p.maxHp;ui.weapon.textContent=nameOf(p.weapon,'맨손');ui.tool.textContent=nameOf(p.tool);ui.armor.textContent=nameOf(p.armor);ui.zone.textContent=pointInPoly(p.x,p.y)?'동쪽 철 협곡':'마력숲';ui.kills.textContent=p.kills;ui.wood.textContent=p.wood;ui.stone.textContent=p.stone;ui.fiber.textContent=p.fiber;ui.ironOre.textContent=p.ironOre;ui.ironIngot.textContent=p.ironIngot;ui.attack.classList.toggle('ready',!!p.weapon);ui.attack.disabled=!p.weapon}
function normalizeCost(c={}){return{wood:c.wood||0,stone:c.stone||0,fiber:c.fiber||0,ironOre:c.ironOre||0,ironIngot:c.ironIngot||0}}function canPay(cost){const p=state.player,c=normalizeCost(cost);return p.wood>=c.wood&&p.stone>=c.stone&&p.fiber>=c.fiber&&p.ironOre>=c.ironOre&&p.ironIngot>=c.ironIngot}function pay(cost){const p=state.player,c=normalizeCost(cost);p.wood-=c.wood;p.stone-=c.stone;p.fiber-=c.fiber;p.ironOre-=c.ironOre;p.ironIngot-=c.ironIngot;state.dirty=true}function costText(cost){const c=normalizeCost(cost),out=[];if(c.wood)out.push('나무 '+c.wood);if(c.stone)out.push('돌 '+c.stone);if(c.fiber)out.push('섬유 '+c.fiber);if(c.ironOre)out.push('철광석 '+c.ironOre);if(c.ironIngot)out.push('구운철 '+c.ironIngot);return out.join(' · ')||'재료 없음'}
function nearStructure(s,range=155){return!!s&&dist(state.player.x,state.player.y,s.x,s.y)<range}function nearBench(){return nearStructure(state.bench)}function nearIronBench(){return nearStructure(state.ironBench)}function nearFurnace(){return nearStructure(state.furnace,175)}
function setArmor(id){const p=state.player,old=item(p.armor);if(old?.maxHp){p.maxHp-=old.maxHp;p.hp=Math.min(p.hp,p.maxHp)}p.armor=id;const cur=item(id);if(cur?.maxHp){p.maxHp+=cur.maxHp;p.hp=Math.min(p.maxHp,p.hp+cur.maxHp)}}

function placeStructure(id){const p=state.player,pos={x:clamp(p.x+55,40,WORLD.w-40),y:clamp(p.y+25,40,WORLD.h-40)};if(id==='bench')state.bench=pos;if(id==='furnace')state.furnace=pos;if(id==='iron-bench')state.ironBench=pos}function structureExists(id){return id==='bench'?!!state.bench:id==='furnace'?!!state.furnace:id==='iron-bench'?!!state.ironBench:false}

function renderInventory(){tabState();const p=state.player,gear=recipes.filter(r=>['weapon','tool','armor','consumable'].includes(r.kind)&&invCount(r.id)>0);let html=`<div class="info"><b>인벤토리</b><br>재료 수량과 보유 아이템을 확인하고 무기·도구·방어구를 장착할 수 있어.</div><div class="invSection">재료</div><div class="invMaterials"><div class="mat">나무 <b>${p.wood}</b></div><div class="mat">돌 <b>${p.stone}</b></div><div class="mat">섬유 <b>${p.fiber}</b></div><div class="mat">철광석 <b>${p.ironOre}</b></div><div class="mat">구운철 <b>${p.ironIngot}</b></div></div><div class="invSection">설치물</div><div class="invMaterials"><div class="mat">제작대 <b>${state.bench?'설치됨':'없음'}</b></div><div class="mat">화로 <b>${state.furnace?'설치됨':'없음'}</b></div><div class="mat">철 제작대 <b>${state.ironBench?'설치됨':'없음'}</b></div></div><div class="invSection">아이템</div><div class="grid">`;if(!gear.length)html+='<div class="info">아직 보유한 장비나 소모품이 없어.</div>';for(const r of gear){let action='보유';if(r.kind==='weapon')action=p.weapon===r.id?'장착 중':'장착';if(r.kind==='tool')action=p.tool===r.id?'장착 중':'장착';if(r.kind==='armor')action=p.armor===r.id?'장착 중':'장착';if(r.kind==='consumable')action='사용';const clickable=r.kind==='consumable'||(['weapon','tool','armor'].includes(r.kind)&&action!=='장착 중');html+=`<button class="invItem" data-id="${r.id}" ${clickable?'':'disabled'}><b>${r.name} ×${invCount(r.id)}</b><small>${r.desc}</small><small class="slot">${action}</small></button>`}html+='</div>';ui.sheetBody.innerHTML=html;ui.sheetBody.querySelectorAll('.invItem:not(:disabled)').forEach(b=>b.addEventListener('click',()=>{const r=item(b.dataset.id);if(r?.kind==='consumable')useItem(r.id);else equipItem(r.id)}))}
function renderPanel(){if(!ui.sheet.classList.contains('open'))return;if(state.panelMode==='inventory')renderInventory();else renderCraft()}function openCraft(mode=state.craftMode){state.panelMode='craft';state.craftMode=mode;ui.sheet.classList.add('open');renderCraft()}function openInventory(){state.panelMode='inventory';ui.sheet.classList.add('open');renderInventory()}function closeSheet(){ui.sheet.classList.remove('open')}
function gather(){const p=state.player;let best=null,bestD=92;for(const n of [...state.trees,...state.rocks,...state.fibers,...state.irons]){if(n.dead)continue;const d=dist(p.x,p.y,n.x,n.y);if(d<bestD){best=n;bestD=d}}if(!best){showNotice('자원 가까이 가');return}let amount=1;const tool=item(p.tool);if(tool?.target===best.kind)amount=tool.mult;if(best.kind==='iron'&&tool?.id==='stone-pick')amount=3;best.hp--;if(best.kind==='tree')p.wood+=amount;else if(best.kind==='rock')p.stone+=amount;else if(best.kind==='fiber')p.fiber+=amount;else p.ironOre+=amount;if(best.hp<=0){best.dead=true;best.respawnAt=performance.now()+RESOURCE_RESPAWN_MS}state.dirty=true;updateHud();renderPanel()}
function currentWeapon(){return item(state.player.weapon)}function currentDamage(){return currentWeapon()?.power||0}function currentRange(){return currentWeapon()?.range||0}function currentCooldown(){return currentWeapon()?.cooldown||380}
function attack(){const now=performance.now(),p=state.player;if(!p.weapon||now-p.attackAt<currentCooldown())return;p.attackAt=now;p.attackFx=now+150;let hit=false;for(const e of state.enemies){if(e.hp<=0||e.type.mood==='harmless')continue;const dx=e.x-p.x,dy=e.y-p.y,d=Math.hypot(dx,dy);if(d>currentRange()+e.type.r)continue;const dot=(dx*p.faceX+dy*p.faceY)/(d||1);if(dot<-.18)continue;e.hp-=currentDamage();e.hitAt=now+110;hit=true;if(e.type.mood==='neutral')e.hostile=true;if(e.hp<=0){p.kills++;state.respawns.push({typeId:e.type.id,packId:e.packId,at:now+12000});showNotice(e.type.name+' 처치')}}if(hit)state.dirty=true;updateHud()}
function damagePlayer(n){const p=state.player,now=performance.now();if(now<p.invuln)return;const armor=item(p.armor);n*=1-(armor?.reduce||0);p.hp=Math.max(0,p.hp-n);p.invuln=now+520;ui.flash.classList.add('on');setTimeout(()=>ui.flash.classList.remove('on'),100);if(p.hp<=0){p.hp=p.maxHp;p.x=START.x;p.y=START.y;p.wood=Math.max(0,p.wood-2);p.stone=Math.max(0,p.stone-2);p.fiber=Math.max(0,p.fiber-2);p.ironOre=Math.max(0,p.ironOre-1);showNotice('쓰러져 숲 중앙에서 부활했어')}state.dirty=true;updateHud()}
function startSmelt(){const p=state.player;if(!nearFurnace()){showNotice('화로 가까이 가야 해');return}if(state.smelting.endAt>Date.now()){showNotice('이미 철을 굽는 중이야');return}if(p.ironOre<1){showNotice('철광석이 없어');return}p.ironOre--;state.smelting.endAt=Date.now()+5000;state.dirty=true;updateHud();updateSmeltUi()}
function finishSmeltIfReady(){if(state.smelting.endAt&&Date.now()>=state.smelting.endAt){state.smelting.endAt=0;state.player.ironIngot++;state.dirty=true;updateHud();renderPanel();updateSmeltUi();showNotice('철 1개 굽기 완료')}}

function openSmelt(){if(!state.furnace)return;if(!nearFurnace()){showNotice('화로 가까이 가야 해');return}ui.smeltPanel.classList.add('open');updateSmeltUi()}function handleWorldTap(e){if(!state.furnace)return;const wx=e.clientX+state.camera.x,wy=e.clientY+state.camera.y;if(dist(wx,wy,state.furnace.x,state.furnace.y)>62)return;const now=performance.now();if(lastWorldTap.target==='furnace'&&now-lastWorldTap.at<430){openSmelt();lastWorldTap={target:null,at:0}}else{lastWorldTap={target:'furnace',at:now};showNotice('화로를 한 번 더 눌러 굽기 열기')}}
function update(dt,now){const p=state.player;let mx=(state.keys.has('KeyD')||state.keys.has('ArrowRight')?1:0)-(state.keys.has('KeyA')||state.keys.has('ArrowLeft')?1:0)+state.stick.x,my=(state.keys.has('KeyS')||state.keys.has('ArrowDown')?1:0)-(state.keys.has('KeyW')||state.keys.has('ArrowUp')?1:0)+state.stick.y,m=Math.hypot(mx,my);if(m>.01){mx/=Math.max(1,m);my/=Math.max(1,m);p.x=clamp(p.x+mx*p.speed*dt,24,WORLD.w-24);p.y=clamp(p.y+my*p.speed*dt,24,WORLD.h-24);p.faceX=mx;p.faceY=my}for(const n of [...state.trees,...state.rocks,...state.fibers,...state.irons])if(n.dead&&now>=n.respawnAt){n.dead=false;n.hp=n.maxHp}if(p.regenTicks>0&&now>=p.regenNext){p.hp=Math.min(p.maxHp,p.hp+10);p.regenTicks--;p.regenNext=now+1000;state.dirty=true;updateHud()}for(const e of state.enemies){if(e.hp<=0)continue;const d=dist(e.x,e.y,p.x,p.y);let vx=0,vy=0;if(e.type.mood==='harmless'){if(now>e.wanderAt){e.wanderAt=now+rand(800,1800);e.wander+=rand(-1.6,1.6)}vx=Math.cos(e.wander)*e.type.speed*.35;vy=Math.sin(e.wander)*e.type.speed*.35}else if(e.hostile&&d<(e.type.detect||430)){vx=(p.x-e.x)/(d||1)*e.type.speed;vy=(p.y-e.y)/(d||1)*e.type.speed;if(d<e.type.r+25&&now-e.attackAt>900){e.attackAt=now;damagePlayer(e.type.dmg)}}else{if(now>e.wanderAt){e.wanderAt=now+rand(900,2200);e.wander+=rand(-1.2,1.2)}vx=Math.cos(e.wander)*e.type.speed*.28;vy=Math.sin(e.wander)*e.type.speed*.28}if(e.type.canyon&&d>=(e.type.detect||860)){const mates=state.enemies.filter(m=>m!==e&&m.hp>0&&m.packId===e.packId);if(mates.length){const cx=mates.reduce((s,m)=>s+m.x,0)/mates.length,cy=mates.reduce((s,m)=>s+m.y,0)/mates.length,cd=dist(e.x,e.y,cx,cy);if(cd>85){vx+=(cx-e.x)/(cd||1)*e.type.speed*.55;vy+=(cy-e.y)/(cd||1)*e.type.speed*.55}}if(!pointInPoly(e.x,e.y)){const sd=dist(e.x,e.y,e.spawnX,e.spawnY);vx+=(e.spawnX-e.x)/(sd||1)*e.type.speed*.8;vy+=(e.spawnY-e.y)/(sd||1)*e.type.speed*.8}}e.x=clamp(e.x+vx*dt,35,WORLD.w-35);e.y=clamp(e.y+vy*dt,35,WORLD.h-35)}for(let i=state.respawns.length-1;i>=0;i--)if(now>=state.respawns[i].at){const r=state.respawns[i],type=creatures[r.typeId];if(type){let anchor=null;if(type.canyon&&r.packId!==null&&r.packId!==undefined){const mates=state.enemies.filter(m=>m.hp>0&&m.packId===r.packId);anchor=mates.length?{x:mates.reduce((s,m)=>s+m.x,0)/mates.length,y:mates.reduce((s,m)=>s+m.y,0)/mates.length}:randomCanyonPoint()}state.enemies.push(spawnCreature(type,Math.random()*20,anchor,r.packId??null))}state.respawns.splice(i,1)}state.enemies=state.enemies.filter(e=>e.hp>0);finishSmeltIfReady();if(ui.smeltPanel.classList.contains('open')){if(!nearFurnace())ui.smeltPanel.classList.remove('open');else updateSmeltUi()}state.camera.x=clamp(p.x-innerWidth/2,0,Math.max(0,WORLD.w-innerWidth));state.camera.y=clamp(p.y-innerHeight/2,0,Math.max(0,WORLD.h-innerHeight));autosave+=dt;if(autosave>10&&state.dirty){autosave=0;saveGame(false)}if(ui.sheet.classList.contains('open')&&Math.floor(now/700)!==Math.floor((now-dt*1000)/700))renderPanel();updateHud()}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
function drawBackground(cx,cy,w,h){ctx.fillStyle='#1d392b';ctx.fillRect(0,0,w,h);ctx.save();ctx.translate(-cx,-cy);ctx.beginPath();ctx.moveTo(CANYON_POLY[0].x,CANYON_POLY[0].y);for(let i=1;i<CANYON_POLY.length;i++)ctx.lineTo(CANYON_POLY[i].x,CANYON_POLY[i].y);ctx.closePath();ctx.fillStyle='#523824';ctx.fill();ctx.strokeStyle='#a27750';ctx.lineWidth=18;ctx.stroke();ctx.fillStyle='#d0ad85';ctx.font='bold 24px system-ui';ctx.textAlign='center';ctx.fillText('동쪽 철 협곡',9600,4200);ctx.restore();ctx.strokeStyle='#8ec69a10';ctx.lineWidth=1;const s=80;for(let x=-(cx%s);x<w;x+=s){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=-(cy%s);y<h;y+=s){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}if(state.player.torch){const px=state.player.x-cx,py=state.player.y-cy,g=ctx.createRadialGradient(px,py,30,px,py,180);g.addColorStop(0,'#ffe6a322');g.addColorStop(1,'#ffe6a300');ctx.fillStyle=g;ctx.fillRect(0,0,w,h)}}
function drawNode(n,cx,cy){const x=n.x-cx,y=n.y-cy;if(x<-40||y<-40||x>innerWidth+40||y>innerHeight+40)return;if(n.kind==='tree'){ctx.fillStyle='#6f4f32';ctx.fillRect(x-5,y,10,28);ctx.fillStyle='#4e8f58';ctx.beginPath();ctx.arc(x,y-8,21,0,Math.PI*2);ctx.fill()}else if(n.kind==='rock'){ctx.fillStyle='#95a4a5';ctx.beginPath();ctx.moveTo(x-18,y+12);ctx.lineTo(x-12,y-12);ctx.lineTo(x+7,y-18);ctx.lineTo(x+20,y+8);ctx.closePath();ctx.fill()}else if(n.kind==='iron'){ctx.fillStyle='#59646b';ctx.beginPath();ctx.moveTo(x-18,y+13);ctx.lineTo(x-10,y-15);ctx.lineTo(x+8,y-19);ctx.lineTo(x+20,y+9);ctx.closePath();ctx.fill();ctx.fillStyle='#c1d0d8';ctx.fillRect(x-7,y-7,6,5);ctx.fillRect(x+5,y+1,7,5)}else{ctx.strokeStyle='#76b96f';ctx.lineWidth=3;for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(x,y+13);ctx.quadraticCurveTo(x+i*6,y,x+i*7,y-13);ctx.stroke()}}}
function drawStructure(s,cx,cy,type){if(!s)return;const x=s.x-cx,y=s.y-cy;if(x<-80||y<-80||x>innerWidth+80||y>innerHeight+80)return;ctx.textAlign='center';if(type==='bench'){ctx.fillStyle='#8d663f';ctx.fillRect(x-25,y-12,50,24);ctx.fillStyle='#ccb07a';ctx.fillRect(x-28,y-15,56,8);ctx.fillStyle='#fff1bf';ctx.font='bold 9px system-ui';ctx.fillText('제작대',x,y+28)}else if(type==='furnace'){ctx.fillStyle='#3b342f';roundRect(x-24,y-20,48,42,10);ctx.fill();ctx.fillStyle='#e07139';ctx.beginPath();ctx.arc(x,y+5,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffe1bd';ctx.font='bold 9px system-ui';ctx.fillText('화로 · 두 번 누르기',x,y+34)}else{ctx.fillStyle='#59666b';ctx.fillRect(x-27,y-13,54,26);ctx.fillStyle='#aebdc2';ctx.fillRect(x-30,y-17,60,8);ctx.fillStyle='#dce8ec';ctx.font='bold 9px system-ui';ctx.fillText('철 제작대',x,y+29)}}
function drawCreature(e,cx,cy){const x=e.x-cx,y=e.y-cy;if(x<-55||y<-55||x>innerWidth+55||y>innerHeight+55)return;ctx.save();if(performance.now()<e.hitAt)ctx.globalAlpha=.5;ctx.fillStyle=e.type.color;ctx.strokeStyle='#18221a';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,e.type.r,0,Math.PI*2);ctx.fill();ctx.stroke();if(e.type.id==='fairy'){ctx.strokeStyle='#fffbd0';ctx.beginPath();ctx.arc(x,y,e.type.r+6,0,Math.PI*2);ctx.stroke()}if(e.type.id==='ironspirit'){ctx.strokeStyle='#d9e6eb';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,e.type.r-6,0,Math.PI*2);ctx.stroke()}ctx.restore();if(e.type.mood!=='harmless'){ctx.fillStyle='#07100d';ctx.fillRect(x-21,y-e.type.r-13,42,4);ctx.fillStyle=e.type.mood==='aggressive'?'#e65f66':'#e1b85f';ctx.fillRect(x-21,y-e.type.r-13,42*Math.max(0,e.hp/e.maxHp),4)}ctx.fillStyle='#f4fff7';ctx.font='bold 9px system-ui';ctx.textAlign='center';ctx.fillText(e.type.name,x,y+e.type.r+14)}
function drawPlayer(cx,cy,now){const p=state.player,x=p.x-cx,y=p.y-cy;ctx.save();if(now<p.invuln&&Math.floor(now/80)%2===0)ctx.globalAlpha=.45;ctx.fillStyle='#e0c4a4';ctx.beginPath();ctx.arc(x,y-11,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#4d7398';roundRect(x-11,y-2,22,25,6);ctx.fill();ctx.fillStyle='#302c36';ctx.fillRect(x-9,y+21,6,12);ctx.fillRect(x+3,y+21,6,12);if(p.weapon){ctx.strokeStyle=p.weapon.startsWith('iron-')?'#d8e3e8':p.weapon==='stone-sword'?'#c9d0d2':'#b78652';ctx.lineWidth=p.weapon==='iron-axe'?7:5;ctx.beginPath();ctx.moveTo(x+7,y+4);ctx.lineTo(x+7+p.faceX*27,y+4+p.faceY*27);ctx.stroke()}if(p.armor){ctx.strokeStyle='#d5cf9b';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y+8,14,0,Math.PI);ctx.stroke()}if(now<p.attackFx){ctx.strokeStyle='#f7e699';ctx.lineWidth=4;ctx.beginPath();const a=Math.atan2(p.faceY,p.faceX);ctx.arc(x,y,currentRange()*.72,a-.55,a+.55);ctx.stroke()}ctx.restore()}
function draw(){const cx=state.camera.x,cy=state.camera.y,now=performance.now();drawBackground(cx,cy,innerWidth,innerHeight);for(const n of state.trees)if(!n.dead)drawNode(n,cx,cy);for(const n of state.rocks)if(!n.dead)drawNode(n,cx,cy);for(const n of state.fibers)if(!n.dead)drawNode(n,cx,cy);for(const n of state.irons)if(!n.dead)drawNode(n,cx,cy);drawStructure(state.bench,cx,cy,'bench');drawStructure(state.furnace,cx,cy,'furnace');drawStructure(state.ironBench,cx,cy,'ironbench');for(const e of state.enemies)drawCreature(e,cx,cy);drawPlayer(cx,cy,now)}
function resize(){const d=Math.min(2,devicePixelRatio||1);canvas.width=Math.floor(innerWidth*d);canvas.height=Math.floor(innerHeight*d);canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(d,0,0,d,0,0)}function loop(now){const dt=Math.min(.033,(now-state.last)/1000);state.last=now;update(dt,now);draw();requestAnimationFrame(loop)}
function saveGame(manual=true){try{const p=state.player;localStorage.setItem(SAVE_KEY,JSON.stringify({v:SAVE_VERSION,player:{x:p.x,y:p.y,hp:p.hp,maxHp:p.maxHp,wood:p.wood,stone:p.stone,fiber:p.fiber,ironOre:p.ironOre,ironIngot:p.ironIngot,kills:p.kills,weapon:p.weapon,tool:p.tool,armor:p.armor,torch:p.torch,inventory:p.inventory},bench:state.bench,furnace:state.furnace,ironBench:state.ironBench,smelting:state.smelting}));state.dirty=false;if(manual)showNotice('저장 완료')}catch(e){if(manual)showNotice('저장 실패')}}
function ensureEquippedInInventory(){const p=state.player;for(const id of [p.weapon,p.tool,p.armor])if(id&&item(id)&&invCount(id)<1)p.inventory[id]=1}
function loadGame(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(!s||!s.player)return;const o=s.player,p=state.player,version=Number(s.v)||1,legacyScale=version<3,scale=legacyScale?5:1,ox=Number(o.x),oy=Number(o.y);p.x=clamp((Number.isFinite(ox)?ox:(legacyScale?1200:START.x))*scale,25,WORLD.w-25);p.y=clamp((Number.isFinite(oy)?oy:(legacyScale?800:START.y))*scale,25,WORLD.h-25);p.wood=Math.max(0,Number(o.wood)||0);p.stone=Math.max(0,Number(o.stone)||0);p.fiber=Math.max(0,Number(o.fiber)||0);p.ironOre=Math.max(0,Number(o.ironOre)||0);p.ironIngot=Math.max(0,Number(o.ironIngot)||0);p.kills=Math.max(0,Number(o.kills)||0);p.inventory=o.inventory&&typeof o.inventory==='object'?{...o.inventory}:{};p.weapon=item(o.weapon)?.kind==='weapon'?o.weapon:(o.weapon==='wood-sword'?'wood-spear':null);p.tool=item(o.tool)?.kind==='tool'?o.tool:(item(o.axe)?.kind==='tool'?o.axe:(item(o.pick)?.kind==='tool'?o.pick:null));p.armor=item(o.armor)?.kind==='armor'?o.armor:(o.shield==='stone-shield'?'rune-shield':null);p.torch=!!o.torch;p.maxHp=p.armor==='forest-armor'?140:100;p.hp=clamp(Number(o.hp)||p.maxHp,1,p.maxHp);ensureEquippedInInventory();const loadPos=obj=>{if(!obj||!Number.isFinite(Number(obj.x))||!Number.isFinite(Number(obj.y)))return null;return{x:clamp(Number(obj.x)*scale,35,WORLD.w-35),y:clamp(Number(obj.y)*scale,35,WORLD.h-35)}};state.bench=loadPos(s.bench);state.furnace=loadPos(s.furnace);state.ironBench=loadPos(s.ironBench);if(s.smelting&&Number(s.smelting.endAt)>0)state.smelting.endAt=Number(s.smelting.endAt);if(version<SAVE_VERSION)state.dirty=true;finishSmeltIfReady()}catch(e){}}
window.addEventListener('resize',resize);window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();state.keys.add(e.code);if(e.code==='Space')attack();if(e.code==='KeyE')gather();if(e.code==='KeyC')openCraft();if(e.code==='KeyI')openInventory()});window.addEventListener('keyup',e=>state.keys.delete(e.code));document.getElementById('attack').addEventListener('pointerdown',e=>{e.preventDefault();attack()});document.getElementById('gather').addEventListener('pointerdown',e=>{e.preventDefault();gather()});document.getElementById('craft').addEventListener('click',()=>openCraft());document.getElementById('inventory').addEventListener('click',()=>openInventory());document.getElementById('close').addEventListener('click',closeSheet);document.getElementById('save').addEventListener('click',()=>saveGame(true));ui.handTab.addEventListener('click',()=>openCraft('hand'));ui.benchTab.addEventListener('click',()=>openCraft('bench'));ui.ironBenchTab.addEventListener('click',()=>openCraft('ironbench'));ui.inventoryTab.addEventListener('click',openInventory);ui.smeltBtn.addEventListener('click',startSmelt);document.getElementById('smeltClose').addEventListener('click',()=>ui.smeltPanel.classList.remove('open'));canvas.addEventListener('pointerdown',handleWorldTap);
const stick=document.getElementById('stick'),knob=document.getElementById('knob');let sp=null;function moveStick(e){const r=stick.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,max=r.width*.3,m=Math.hypot(dx,dy),k=m>max?max/m:1,x=dx*k,y=dy*k;state.stick.x=x/max;state.stick.y=y/max;knob.style.transform=`translate(${x}px,${y}px)`}function endStick(e){if(sp!==e.pointerId)return;sp=null;state.stick.x=state.stick.y=0;knob.style.transform='translate(0,0)'}stick.addEventListener('pointerdown',e=>{e.preventDefault();sp=e.pointerId;stick.setPointerCapture(e.pointerId);moveStick(e)});stick.addEventListener('pointermove',e=>{if(sp===e.pointerId){e.preventDefault();moveStick(e)}});stick.addEventListener('pointerup',endStick);stick.addEventListener('pointercancel',endStick);window.addEventListener('pagehide',()=>saveGame(false));
initWorld();loadGame();resize();updateHud();requestAnimationFrame(loop);showNotice('가방이 생겼어 · 동쪽 철 협곡에서 철을 찾아봐');
})();
</script>
