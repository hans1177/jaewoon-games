  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;music.noise=buf
 }

 music.started=true;if(!music.nextAt){music.nextAt=music.ctx.currentTime+.03;music.trackStart=music.ctx.currentTime}
}
function scaleFreq(root,degree,minor=false,oct=0){

 let d=degree,shift=0;while(d<0){d+=7;shift--}while(d>=7){d-=7;shift++}
 return root*Math.pow(2,(scale[d]+12*(shift+oct))/12)
}

 o.connect(sh);sh.connect(f);f.connect(g);g.connect(music.master);o.start(at);o.stop(at+dur+.04)

function scheduleBandBeat(key,t,beat,at){
 const beatDur=60/t.bpm,bar=Math.floor(beat/4),beatInBar=beat%4,section=Math.floor(bar/8)%6,minor=t.mode==='minor';

 if(section===0){if(beatInBar===0||beatInBar===2)guitarVoice(lead,at,beatDur*1.6,t.drive*.72,t.brightness)}

 else if(section===2){guitarVoice(lead,at,beatDur*.46,t.drive*.82,t.brightness);if(beatInBar%2===0)guitarVoice(scaleFreq(t.root,deg+2,minor,guitarOct),at+.035,beatDur*.4,t.drive*.62,t.brightness*1.05)}
 else if(section===3){if(beatInBar!==2)guitarVoice(lead,at,beatDur*.72,t.drive*.9,t.brightness)}
 else if(section===4){guitarVoice(lead,at,beatDur*.54,Math.min(1,t.drive+(.08)),t.brightness*1.08);if(key==='battle'||key==='boss')guitarVoice(lead*2,at+.018,beatDur*.48,.94,t.brightness*1.1)}
 else{if(beatInBar===0||beatInBar===1||beatInBar===3)guitarVoice(lead,at,beatDur*.75,t.drive*.8,t.brightness)}
 if(t.ominous&&beatInBar===0){guitarVoice(root/2,at,beatDur*3.7,Math.min(.95,t.drive+.1),Math.max(520,t.brightness*.65))}
}
function musicTick(){

 const key=desiredMusicTheme(),t=MUSIC_THEMES[key]||MUSIC_THEMES.forest,beatDur=60/t.bpm;
 if(music.theme!==key){music.theme=key;music.beatIndex=0;music.trackStart=music.ctx.currentTime+.03;music.nextAt=music.trackStart}
 const now=music.ctx.currentTime,elapsed=now-music.trackStart;
 if(elapsed>=MUSIC_TRACK_SECONDS){music.beatIndex=0;music.trackStart=now+.03;music.nextAt=music.trackStart}

  scheduleBandBeat(key,t,music.beatIndex,music.nextAt);
  music.beatIndex++;music.nextAt+=beatDur
 }
}

function drawMap(){
 const mc=document.getElementById('mapCanvas');if(!mc)return;
 const m=mc.getContext('2d'),sx=mc.width/WORLD.w,sy=mc.height/WORLD.h;
 m.fillStyle='#040806';m.fillRect(0,0,mc.width,mc.height);
 for(const key of Object.keys(state.explored)){
   const [gx,gy]=key.split(',').map(Number),wx=gx*MAP_CELL,wy=gy*MAP_CELL,cx=wx+MAP_CELL/2,cy=wy+MAP_CELL/2,r=regionAt(cx,cy);
   m.fillStyle=r==='worldtree'?'#173d24':r==='canyon'?'#523824':r==='volcano'?'#5a251f':r==='crystal'?'#392c5c':'#1d392b';
   m.fillRect(wx*sx,wy*sy,MAP_CELL*sx+1,MAP_CELL*sy+1)
 }
 if(state.discovered.crystal){m.strokeStyle='#9a84e8';m.lineWidth=2;m.strokeRect(CRYSTAL_REGION.x*sx,0,CRYSTAL_REGION.w*sx,WORLD.h*sy);m.fillStyle='#d7ccff';m.font='bold 11px system-ui';m.fillText('수정 지대',15500*sx,800*sy);m.beginPath();m.arc(CRYSTAL_HEART.x*sx,CRYSTAL_HEART.y*sy,5,0,Math.PI*2);m.fill()}
 if(state.discovered.volcano){m.strokeStyle='#d55b3c';m.lineWidth=2;m.strokeRect(2400*sx,2000*sy,12000*sx,3200*sy);m.fillStyle='#ff9a69';m.font='bold 11px system-ui';m.fillText('화산',12700*sx,2500*sy)}
 if(state.discovered.canyon){m.strokeStyle='#a27750';m.lineWidth=2;m.beginPath();m.moveTo(CANYON_POLY[0].x*sx,CANYON_POLY[0].y*sy);for(let i=1;i<CANYON_POLY.length;i++)m.lineTo(CANYON_POLY[i].x*sx,CANYON_POLY[i].y*sy);m.closePath();m.stroke();m.fillStyle='#e0b990';m.font='bold 11px system-ui';m.fillText('협곡',12900*sx,7000*sy)}
 if(state.discovered.worldtree){m.strokeStyle='#3d7c4c';m.lineWidth=2;m.strokeRect(6180*sx,9150*sy,5640*sx,850*sy);m.fillStyle='#9bd09e';m.font='bold 11px system-ui';m.fillText('세계수',WORLD_TREE.x*sx-16,WORLD_TREE.y*sy-8);m.fillStyle='#78b96f';m.beginPath();m.arc(WORLD_TREE.x*sx,WORLD_TREE.y*sy,6,0,Math.PI*2);m.fill()}
 m.fillStyle='#ffffff';m.beginPath();m.arc(state.player.x*sx,state.player.y*sy,4,0,Math.PI*2);m.fill()
}

 if(best.kind==='iron')amount=1;

 if(best.kind==='tree')p.wood+=amount;else if(best.kind==='rock')p.stone+=amount;else if(best.kind==='fiber')p.fiber+=amount;else if(best.kind==='iron')p.ironOre+=amount;else if(best.kind==='gold')p.goldOre+=amount;else if(best.kind==='essence')p.essence+=1;else if(best.kind==='carrot')addInv('carrot',1);

 state.dirty=true;updateHud();renderPanel()
}

function applyWorldSnapshot(w){
 if(!w||multiIsHost())return;
 const list=Array.isArray(w.enemies)?w.enemies:[];
 state.enemies=list.map(n=>{
  const type=creatures[n.typeId];if(!type)return null;
  return{type,hp:n.hp,maxHp:n.maxHp||type.hp,x:n.x,y:n.y,spawnX:n.x,spawnY:n.y,packId:null,area:n.area||'surface',enemyTarget:null,stunnedUntil:n.stunnedUntil||0,bossState:n.bossState||null,emerged:n.emerged!==false,emergeAt:0,attackAt:0,hitAt:0,hostile:!!n.hostile,wander:0,wanderAt:0,special:null,rageUsed:(n.rageUntil||0)>0,rageUntil:n.rageUntil||0,nextThrowAt:0,nextRoarAt:0,netId:n.id}
 }).filter(Boolean);
 state.projectiles=Array.isArray(w.projectiles)?w.projectiles.map(q=>({...q})):[];

function grantRemoteKillReward(payload){
 if(!payload||payload.targetId!==multiplayer.playerId)return;
 const type=creatures[payload.typeId];if(!type)return;
 state.player.kills++;awardLoot({type});
 if(type.boss){addInv('forest-wooden-sword',1);unlockBestiary('rootsovereign');showNotice('공동 보스 처치 · 숲의 목검 획득')}
 state.dirty=true;updateHud()

function hostApplyRemoteAttack(a){
 if(!multiIsHost()||!a||!a.attackerId)return;
 const now=performance.now();
 for(const e of state.enemies){
  if(e.hp<=0||e.area!==a.area||(e.type.mood==='harmless'&&!e.type.huntable))continue;
  const dx=e.x-a.x,dy=e.y-a.y,d=Math.hypot(dx,dy);if(d>(a.range||0)+e.type.r)continue;
  const dot=(dx*(a.faceX||1)+dy*(a.faceY||0))/(d||1);if(dot<-.18)continue;
  let dmg=Number(a.damage)||0;if(a.neutralDouble&&e.type.mood==='neutral')dmg*=2;
  if(e.type.burrower)e.provokedByPlayer=true;
  e.hp-=dmg;e.hitAt=now+110;if(e.type.mood==='neutral')e.hostile=true;
  if(a.bind&&Math.random()<a.bind)e.stunnedUntil=now+2000;
  if(e.hp<=0){
   e.hp=0;
   if(e.type.boss){rewardBoss()}else if(!e.type.summoned&&!e.type.sealSpawn&&!e.noRespawn)state.respawns.push({typeId:e.type.id,packId:e.packId,at:now+12000});
   multiSend('kill-reward',{targetId:a.attackerId,typeId:e.type.id});
  }
 }
}

async function connectMultiplayer(rawRoom){
 const room=String(rawRoom||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);if(room.length<4){showNotice('방 코드를 4~8자리로 입력해');return}
 if(!window.supabase?.createClient){showNotice('멀티 서버 모듈을 불러오지 못했어');return}
 await leaveMultiplayer(false);
 multiplayer.room=room;multiplayer.joinedAt=Date.now();
 multiplayer.client=window.supabase.createClient(MULTI_SUPABASE_URL,MULTI_SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
 multiplayer.channel=multiplayer.client.channel('fantasy-survival:'+room,{config:{broadcast:{self:false,ack:false},presence:{key:multiplayer.playerId}}});
 multiplayer.channel
  .on('presence',{event:'sync'},syncMultiPresence)
  .on('broadcast',{event:'player-state'},({payload})=>remotePlayerState(payload))
  .on('broadcast',{event:'world-state'},({payload})=>applyWorldSnapshot(payload))
  .on('broadcast',{event:'attack'},({payload})=>hostApplyRemoteAttack(payload))
  .on('broadcast',{event:'pet-attack'},({payload})=>hostApplyPetAttack(payload))
  .on('broadcast',{event:'kill-reward'},({payload})=>grantRemoteKillReward(payload))
  .subscribe(async status=>{
    if(status==='SUBSCRIBED'){
      multiplayer.connected=true;ui.multiRoom.value=room;
      await multiplayer.channel.track({id:multiplayer.playerId,joinedAt:multiplayer.joinedAt});
      const u=new URL(location.href);u.searchParams.set('room',room);history.replaceState(null,'',u);syncMultiPresence();showNotice('멀티 방 '+room+' 참가')
    }else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'){updateMultiStatus('연결 오류')}
  })
}
async function leaveMultiplayer(clearUrl=true){
 if(multiplayer.channel){try{await multiplayer.channel.untrack()}catch{}try{await multiplayer.channel.unsubscribe()}catch{}}
 multiplayer.channel=null;multiplayer.client=null;multiplayer.connected=false;multiplayer.room='';multiplayer.hostId=null;multiplayer.remote.clear();multiplayer.presenceIds.clear();updateMultiStatus();
 if(clearUrl){const u=new URL(location.href);u.searchParams.delete('room');history.replaceState(null,'',u)}

function petStrike(e,manual=false){

 for(const e of state.enemies){if(e.hp<=0||e.area!==state.area||(e.type.mood==='harmless'&&!e.type.huntable))continue;const d=dist(state.pet.x,state.pet.y,e.x,e.y);if(d<bd){best=e;bd=d}}
 if(best){state.pet.targetId=best.netId;petStrike(best,true)}else showNotice('근처에 공격할 적이 없어');return true
}
function updatePet(dt,now){
 const pet=state.pet,p=state.player;
 if(state.incubation.eggPlaced&&!pet.hatched&&Date.now()>=state.incubation.hatchAt)hatchShadowWolf();
 if(pet.hatched&&!pet.alive&&pet.respawnAt&&Date.now()>=pet.respawnAt){pet.alive=true;pet.hp=pet.maxHp;pet.respawnAt=0;pet.reviveClickUntil=0;pet.x=p.x+55;pet.y=p.y+25;pet.targetId=null;state.dirty=true;showNotice('그림자 늑대가 부활했어')}
 if(!petAlive())return;
 if(pet.mounted){pet.x=p.x;pet.y=p.y;return}
 const target=petTarget();
 if(target){
  const d=dist(pet.x,pet.y,target.x,target.y);
  if(d>78){pet.x+=((target.x-pet.x)/(d||1))*245*dt;pet.y+=((target.y-pet.y)/(d||1))*245*dt}
  else petStrike(target);
 }else{
  pet.targetId=null;const d=dist(pet.x,pet.y,p.x,p.y);
  if(d>700){pet.x=p.x-45;pet.y=p.y+30}
  else if(d>72){pet.x+=((p.x-pet.x)/(d||1))*220*dt;pet.y+=((p.y-pet.y)/(d||1))*220*dt}
 }
}

 p.attackAt=now;p.attackFx=now+150;

   const dx=e.x-p.x,dy=e.y-p.y,d=Math.hypot(dx,dy);if(d>currentRange()+e.type.r)continue;
   const dot=(dx*p.faceX+dy*p.faceY)/(d||1);if(dot<-.18)continue;
   if(e.type.burrower)e.provokedByPlayer=true;

   if(w?.bearTripleChance&&Math.random()<w.bearTripleChance){
     const bonus=item(p.armor)?.bonusDamage||0;

   }

   if(w?.bindChance&&Math.random()<w.bindChance){e.stunnedUntil=now+2000;showNotice(e.type.name+' 속박 · 2초')}
   if(e.hp<=0){

   }
 }

function beginNextSmelt(startAt=Date.now()){
 const q=state.smelting.queue||[];
 if(!q.length){state.smelting={endAt:0,type:null,duration:0,queue:[]};return false}
 const type=q.shift(),duration=smeltDuration(type);
 state.smelting.type=type;state.smelting.duration=duration;state.smelting.endAt=startAt+duration;state.smelting.queue=q;return true
}
function startSmelt(kind='iron'){
 if(!nearFurnace()){showNotice('화로 가까이 가야 해');return}
 const spec=SMELT_SPECS[kind];if(!spec)return;
 if(!spec.has()){showNotice(spec.name+' 재료가 없어');return}
 spec.take();
 state.smelting.queue=Array.isArray(state.smelting.queue)?state.smelting.queue:[];
 if(state.smelting.endAt>Date.now()){
   state.smelting.queue.push(kind);showNotice(spec.name+' 굽기/제련 대기줄에 추가')
 }else{
   state.smelting.type=kind;state.smelting.duration=spec.duration;state.smelting.endAt=Date.now()+spec.duration
 }
 state.dirty=true;updateHud();updateSmeltUi();renderPanel()
}
function finishSmeltIfReady(){

 while(state.smelting.endAt&&now>=state.smelting.endAt){
   const finishedAt=state.smelting.endAt,spec=SMELT_SPECS[state.smelting.type];if(spec)spec.give();
   state.dirty=true;if(!beginNextSmelt(finishedAt))break
 }

}
function updateSmeltUi(){
 const end=state.smelting.endAt,now=Date.now(),type=state.smelting.type,spec=SMELT_SPECS[type],duration=state.smelting.duration||smeltDuration(type),q=Array.isArray(state.smelting.queue)?state.smelting.queue:[];
 const counts={iron:0,gold:0,deer:0,bug:0};for(const x of q)if(x in counts)counts[x]++;
 if(end>now){
   const remain=Math.max(0,end-now),pct=100*(1-remain/duration);
   ui.smeltText.textContent=`${spec?.name||'재료'} 처리 중 · ${(remain/1000).toFixed(1)}초 · 대기 철 ${counts.iron} / 금 ${counts.gold} / 사슴 ${counts.deer} / 벌레 ${counts.bug}`;
   ui.smeltProgress.style.width=clamp(pct,0,100)+'%'
 }else{
   ui.smeltText.textContent=`철광석 ${state.player.ironOre} · 금광석 ${state.player.goldOre} · 사슴고기 ${invCount('raw-deer-meat')} · 벌레고기 ${invCount('raw-bug-meat')}`;
   ui.smeltProgress.style.width='0%'

      if(!monsterFight&&e.type.caveLeader&&playerD<(e.type.detect||760)){
        if(now>=(e.nextSpecialAt||0)){e.nextSpecialAt=now+1000;if(Math.random()<.25)summonLeaderWolves(e)}
      }
      if(!monsterFight&&e.type.vampireBat&&playerD<e.type.r+27&&now>=(e.nextSpecialAt||0)){
        e.nextSpecialAt=now+2000;
        if(Math.random()<.30){e.attackAt=now;enemyDamageTarget(e,30,false);e.hp=Math.min(e.maxHp,e.hp+30);showNotice('거대 흡혈 박쥐 · 흡혈');monsterFight=true}
      }
      if(!monsterFight&&e.type.guardian){
        const rage=guardianRageState(e,p,now),gt=guardianTarget(e);
        if(gt){
          e.enemyTarget=gt;const chase=chaseMonster(e,gt,now,rage,rage);if(chase){vx=chase.vx;vy=chase.vy;monsterFight=true}
        }else{
          e.enemyTarget=null;
          if(playerD<(e.type.detect||1050)){
            if(playerD>e.type.r+30&&now>=(e.nextThrowAt||0))throwGuardianCrystal(e,p,now);
            if(playerD<=e.type.r+30&&now-e.attackAt>(e.type.attackCooldown||1050)){e.attackAt=now;enemyDamageTarget(e,e.type.dmg*rage,false);monsterFight=true}
            else if(!monsterFight){vx=(p.x-e.x)/(playerD||1)*e.type.speed*rage;vy=(p.y-e.y)/(playerD||1)*e.type.speed*rage;monsterFight=true}
          }
        }
      }
      if(!monsterFight&&e.type.id==='ironspirit'){
        const pick=monsterTargetForIronSpirit(e);
        if(pick){
          e.enemyTarget=pick.target;
          const chase=chaseMonster(e,pick.target,now);
          if(chase){vx=chase.vx;vy=chase.vy;monsterFight=true}
        }else{
          e.enemyTarget=null;
        }
      }else if(!monsterFight&&e.enemyTarget){
        if(e.enemyTarget.hp<=0){
          e.enemyTarget=null;
        }else{
          const chase=chaseMonster(e,e.enemyTarget,now);
          if(chase){vx=chase.vx;vy=chase.vy;monsterFight=true}
        }
      }
  
      if(!monsterFight&&e.type.burrower&&p.armor==='sand-armor'&&!e.provokedByPlayer){e.emergeAt=0;vx=0;vy=0;monsterFight=true}
      if(!monsterFight&&e.type.burrower&&!e.emerged){

        vx=0;vy=0;monsterFight=true
      }
      if(!monsterFight&&e.type.crystalSpecial){
        const sp=updateCrystalBoarSpecial(e,p,now);
        if(sp){vx=sp.vx;vy=sp.vy;monsterFight=true}
      }
      if(!monsterFight&&e.type.crystalSpecial&&e.hostile&&playerD<(e.type.detect||560)&&playerD<e.type.r+28&&now-e.attackAt>(e.type.attackCooldown||1100)){
        e.attackAt=now;
        const roll=Math.random();
        if(roll<.30){e.special={kind:'charge',started:now,retreatUntil:now+700,chargeAt:now+2000,endAt:now+5000};showNotice('수정 멧돼지 · 기절 돌진 준비');monsterFight=true}
        else if(roll<.50){summonCrystalJunior(e);monsterFight=true}
        else{enemyDamageTarget(e,e.type.dmg,false);monsterFight=true}
      }
      if(!monsterFight){
        if(e.type.mood==='harmless'){
          if(now>e.wanderAt){e.wanderAt=now+rand(800,1800);e.wander+=rand(-1.6,1.6)}
          vx=Math.cos(e.wander)*e.type.speed*.35;vy=Math.sin(e.wander)*e.type.speed*.35
        }else if(e.hostile&&!(e.type.burrower&&p.armor==='sand-armor'&&!e.provokedByPlayer)&&playerD<(e.type.detect||430)){
          vx=(p.x-e.x)/(playerD||1)*e.type.speed;vy=(p.y-e.y)/(playerD||1)*e.type.speed;
          if(playerD<e.type.r+25&&now-e.attackAt>(e.type.attackCooldown||900)){e.attackAt=now;if(e.type.flame&&Math.random()<.30){enemyDamageTarget(e,e.type.dmg*2,false);applyBurn()}else enemyDamageTarget(e,e.type.dmg,false)}
        }else{
          if(now>e.wanderAt){e.wanderAt=now+rand(900,2200);e.wander+=rand(-1.2,1.2)}
          vx=Math.cos(e.wander)*e.type.speed*.28;vy=Math.sin(e.wander)*e.type.speed*.28
        }
      }
  
      if(e.type.canyon&&!monsterFight&&playerD>=(e.type.detect||860)){
        const mates=state.enemies.filter(m=>m!==e&&m.hp>0&&m.packId===e.packId);
        if(mates.length){
          const cx=mates.reduce((s,m)=>s+m.x,0)/mates.length,cy=mates.reduce((s,m)=>s+m.y,0)/mates.length,cd=dist(e.x,e.y,cx,cy);
          if(cd>85){vx+=(cx-e.x)/(cd||1)*e.type.speed*.55;vy+=(cy-e.y)/(cd||1)*e.type.speed*.55}
        }

          const sd=dist(e.x,e.y,e.spawnX,e.spawnY);

        }
      }
      e.x=clamp(e.x+vx*dt,35,WORLD.w-35);
      e.y=clamp(e.y+vy*dt,35,WORLD.h-35)
    }
    updateProjectiles(dt,now);
    for(let i=state.respawns.length-1;i>=0;i--)if(now>=state.respawns[i].at){
      const r=state.respawns[i],type=creatures[r.typeId];
      if(type&&!type.boss){
        let anchor=null;
        if(type.canyon&&r.packId!==null&&r.packId!==undefined){
          const mates=state.enemies.filter(m=>m.hp>0&&m.packId===r.packId);
          anchor=mates.length?{x:mates.reduce((s,m)=>s+m.x,0)/mates.length,y:mates.reduce((s,m)=>s+m.y,0)/mates.length}:randomCanyonPoint()
        }

      }
      state.respawns.splice(i,1)
    }
    state.enemies=state.enemies.filter(e=>e.hp>0);
  }
  multiTick(now);
  musicTick();
  finishSmeltIfReady();
  if(ui.smeltPanel.classList.contains('open')){if(!nearFurnace())ui.smeltPanel.classList.remove('open');else updateSmeltUi()}
  const camW=state.area==='questcave'?QUEST_CAVE.w:state.area==='underground'?6000:WORLD.w,camH=state.area==='questcave'?QUEST_CAVE.h:state.area==='underground'?4000:WORLD.h;state.camera.x=clamp(p.x-innerWidth/2,0,Math.max(0,camW-innerWidth));
  state.camera.y=clamp(p.y-innerHeight/2,0,Math.max(0,camH-innerHeight));
  autosave+=dt;
  if(autosave>10&&state.dirty){autosave=0;saveGame(false)}
  if(ui.sheet.classList.contains('open')&&state.panelMode!=='cooking'&&Math.floor(now/700)!==Math.floor((now-dt*1000)/700))renderPanel();
  updateHud()
}

function drawCreature(e,cx,cy){const x=e.x-cx,y=e.y-cy;if(x<-55||y<-55||x>innerWidth+55||y>innerHeight+55)return;if(e.type.burrower&&!e.emerged){ctx.fillStyle='#6f5134';ctx.beginPath();ctx.ellipse(x,y+10,34,13,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#a67b4b';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x-25,y+6);ctx.lineTo(x+23,y+13);ctx.stroke();return}ctx.save();if(performance.now()<e.hitAt)ctx.globalAlpha=.5;ctx.fillStyle=e.type.color;ctx.strokeStyle='#18221a';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,e.type.r,0,Math.PI*2);ctx.fill();ctx.stroke();if(e.type.id==='fairy'){ctx.strokeStyle='#fffbd0';ctx.beginPath();ctx.arc(x,y,e.type.r+6,0,Math.PI*2);ctx.stroke()}if(e.type.id==='ironspirit'){ctx.strokeStyle='#d9e6eb';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,e.type.r-6,0,Math.PI*2);ctx.stroke()}if(e.type.id==='worldtreebear'){ctx.fillStyle='#8b6747';ctx.beginPath();ctx.arc(x-19,y-22,9,0,Math.PI*2);ctx.arc(x+19,y-22,9,0,Math.PI*2);ctx.fill()}if(e.type.id==='firewolf'||e.type.id==='firesnake'){ctx.strokeStyle='#ff9b45';ctx.lineWidth=4;ctx.beginPath();ctx.arc(x,y,e.type.r+5,0,Math.PI*2);ctx.stroke()}if(e.type.id.includes('firegolem')){ctx.fillStyle='#ff6f35';ctx.beginPath();ctx.arc(x,y,8,0,Math.PI*2);ctx.fill()}if(e.type.id==='sandwalker'){ctx.strokeStyle='#d8b06a';ctx.lineWidth=4;for(let a=0;a<6;a++){const ang=a*Math.PI/3;ctx.beginPath();ctx.moveTo(x+Math.cos(ang)*20,y+Math.sin(ang)*20);ctx.lineTo(x+Math.cos(ang)*42,y+Math.sin(ang)*42);ctx.stroke()}}if(e.type.guardian){ctx.strokeStyle='#efe8ff';ctx.lineWidth=5;ctx.beginPath();for(let i=0;i<6;i++){const a=i*Math.PI/3,rr=i%2?e.type.r+12:e.type.r+20,px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)}ctx.closePath();ctx.stroke();if(performance.now()<(e.rageUntil||0)){ctx.strokeStyle='#ff6f8f';ctx.lineWidth=4;ctx.beginPath();ctx.arc(x,y,e.type.r+15,0,Math.PI*2);ctx.stroke()}}if(e.type.crystalVariant){ctx.strokeStyle='#cfbfff';ctx.lineWidth=4;ctx.beginPath();ctx.arc(x,y,e.type.r+6,
