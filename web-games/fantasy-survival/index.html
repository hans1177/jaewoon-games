<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#14251d">
<title>마력숲 생존기</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1712;color:#f3fff6;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}body{position:fixed;inset:0}#game{position:absolute;inset:0;width:100%;height:100%;display:block;background:#1c3629}.hud{position:absolute;left:max(7px,env(safe-area-inset-left));right:max(7px,env(safe-area-inset-right));top:max(7px,env(safe-area-inset-top));display:flex;gap:6px;align-items:flex-start;pointer-events:none}.card{pointer-events:auto;background:#0c1915e8;border:1px solid #d9f4e02d;border-radius:12px;padding:7px 9px;box-shadow:0 5px 16px #0006}.main{flex:1;min-width:0}.top{display:flex;align-items:center;gap:7px}.title{font-size:12px;font-weight:1000;white-space:nowrap}.hp{height:9px;flex:1;min-width:70px;max-width:200px;border-radius:999px;overflow:hidden;background:#3b2026}.hp>i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#e95568,#f3916f)}.small{font-size:10px;font-weight:900;white-space:nowrap}.sub{display:flex;gap:7px;flex-wrap:wrap;margin-top:4px;color:#bad0c1;font-size:9px;font-weight:850}.sub b{color:#fff}.res{display:grid;grid-template-columns:auto auto;gap:3px 8px;font-size:10px;font-weight:1000;white-space:nowrap}.res .fiber{grid-column:1/-1}.save,.home{pointer-events:auto;min-width:41px;min-height:37px;border:1px solid #ffffff2c;border-radius:10px;background:#1d352b;color:#fff;font-size:10px;font-weight:1000;text-decoration:none;display:flex;align-items:center;justify-content:center;padding:0 7px}.notice{position:absolute;top:78px;left:50%;transform:translateX(-50%);max-width:min(88vw,460px);padding:8px 11px;border-radius:10px;background:#07110de9;border:1px solid #ffffff25;text-align:center;font-size:11px;font-weight:900;opacity:0;transition:.18s;pointer-events:none}.notice.on{opacity:1}.stick{position:absolute;left:max(15px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:116px;height:116px;border:2px solid #e5ffe637;border-radius:50%;background:#07110c70}.knob{position:absolute;left:34px;top:34px;width:48px;height:48px;border-radius:50%;background:#effff0d9;border:2px solid #fff7}.actions{position:absolute;right:max(12px,env(safe-area-inset-right));bottom:max(17px,env(safe-area-inset-bottom));display:grid;grid-template-columns:68px 82px;grid-template-rows:54px 68px;gap:8px}.act{border:1px solid #ffffff43;border-radius:16px;color:#fff;font-size:12px;font-weight:1000;background:#254538e8}.act:active{transform:scale(.96)}.attack{grid-column:2;grid-row:1/3;width:82px;height:82px;border-radius:50%;align-self:end;background:linear-gradient(145deg,#74333a,#b64c56)}.gather{grid-column:1;grid-row:2;background:linear-gradient(145deg,#5b482f,#896737)}.craft{grid-column:1;grid-row:1;background:linear-gradient(145deg,#315247,#43785f)}.sheet{position:absolute;right:8px;top:76px;bottom:110px;width:min(370px,48vw);display:none;flex-direction:column;background:#091712f6;border:1px solid #ffffff25;border-radius:16px;overflow:hidden;box-shadow:0 10px 28px #0009}.sheet.open{display:flex}.sheetHead{display:flex;align-items:center;justify-content:space-between;padding:10px 11px;border-bottom:1px solid #ffffff1c}.tabs{display:flex;gap:5px}.tab,.close{border:0;border-radius:9px;background:#ffffff12;color:#fff;min-height:34px;padding:0 10px;font-weight:1000}.tab.on{background:#376a53}.close{width:34px;padding:0;font-size:18px}.sheetBody{padding:9px;overflow:auto;touch-action:pan-y}.info{padding:9px;border-radius:11px;background:#173027;border:1px solid #ffffff12;margin-bottom:8px;font-size:11px;line-height:1.45}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.recipe{min-height:81px;text-align:left;border:1px solid #ffffff1d;border-radius:11px;background:#162a22;color:#fff;padding:8px}.recipe:disabled{opacity:.4}.recipe b{display:block;font-size:12px;margin-bottom:3px}.recipe small{display:block;color:#b8d0c0;font-size:9px;line-height:1.4}.recipe .cost{margin-top:4px;color:#ffe09b;font-weight:900}.legend{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);font-size:9px;font-weight:850;color:#c7dccf;background:#07120dc4;border:1px solid #ffffff16;border-radius:9px;padding:5px 8px;pointer-events:none}.flash{position:absolute;inset:0;background:#ff4d6530;opacity:0;pointer-events:none;transition:.1s}.flash.on{opacity:1}@media(max-width:720px){.sheet{left:7px;right:7px;top:auto;bottom:7px;width:auto;max-height:68%}.sheetBody{padding-bottom:max(10px,env(safe-area-inset-bottom))}.legend{display:none}.hud{gap:4px}.card{padding:6px 7px}.res{font-size:9px}.save,.home{min-width:37px;padding:0 5px}.grid{grid-template-columns:1fr 1fr}}@media(max-width:370px){.grid{grid-template-columns:1fr}.stick{width:106px;height:106px}.knob{left:31px;top:31px;width:44px;height:44px}.actions{grid-template-columns:62px 76px}.attack{width:76px;height:76px}.act{font-size:11px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">
 <div class="card main"><div class="top"><span class="title">마력숲 생존기</span><div class="hp"><i id="hpfill"></i></div><span id="hptext" class="small">100/100</span></div><div class="sub"><span>무기 <b id="weapon">맨손</b></span><span>도구 <b id="tool">없음</b></span><span>방어 <b id="armor">없음</b></span><span>처치 <b id="kills">0</b></span></div></div>
 <div class="card res"><span>나무 <b id="wood">0</b></span><span>돌 <b id="stone">0</b></span><span class="fiber">섬유 <b id="fiber">0</b></span></div>
 <button id="save" class="save">저장</button><a class="home" href="/">홈</a>
</div>
<div id="notice" class="notice"></div>
<div id="stick" class="stick"><div id="knob" class="knob"></div></div>
<div class="actions"><button id="craft" class="act craft">제작</button><button id="gather" class="act gather">채집</button><button id="attack" class="act attack">공격</button></div>
<div id="sheet" class="sheet"><div class="sheetHead"><div class="tabs"><button id="handTab" class="tab on">맨손 4</button><button id="benchTab" class="tab">제작대 6</button></div><button id="close" class="close">×</button></div><div id="sheetBody" class="sheetBody"></div></div>
<div class="legend">WASD 이동 · E 채집 · Space 공격 · C 제작</div><div id="flash" class="flash"></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const ui={hpfill:document.getElementById('hpfill'),hptext:document.getElementById('hptext'),weapon:document.getElementById('weapon'),tool:document.getElementById('tool'),armor:document.getElementById('armor'),kills:document.getElementById('kills'),wood:document.getElementById('wood'),stone:document.getElementById('stone'),fiber:document.getElementById('fiber'),notice:document.getElementById('notice'),sheet:document.getElementById('sheet'),sheetBody:document.getElementById('sheetBody'),handTab:document.getElementById('handTab'),benchTab:document.getElementById('benchTab'),flash:document.getElementById('flash')};
const WORLD={w:2400,h:1600},SAVE_KEY='jaewoon_fantasy_survival_v1';
const recipes=[
{id:'bench',name:'제작대',where:'hand',cost:{wood:10,stone:6,fiber:4},desc:'상위 아이템 6종 제작',kind:'bench'},
{id:'wood-spear',name:'나무창',where:'hand',cost:{wood:6,stone:0,fiber:3},desc:'공격력 10 · 긴 사거리',kind:'weapon',power:10,range:96},
{id:'bandage',name:'섬유붕대',where:'hand',cost:{wood:0,stone:0,fiber:6},desc:'체력 35 즉시 회복',kind:'heal',heal:35},
{id:'torch',name:'마력 횃불',where:'hand',cost:{wood:4,stone:1,fiber:2},desc:'주변을 밝히는 횃불',kind:'torch'},
{id:'stone-sword',name:'돌검',where:'bench',cost:{wood:5,stone:9,fiber:2},desc:'공격력 18',kind:'weapon',power:18,range:75},
{id:'stone-axe',name:'돌도끼',where:'bench',cost:{wood:6,stone:8,fiber:3},desc:'나무 채집량 3배',kind:'tool',target:'tree',mult:3},
{id:'stone-pick',name:'돌곡괭이',where:'bench',cost:{wood:6,stone:10,fiber:3},desc:'돌 채집량 3배',kind:'tool',target:'rock',mult:3},
{id:'fiber-knife',name:'섬유칼',where:'bench',cost:{wood:4,stone:5,fiber:8},desc:'섬유 채집량 3배',kind:'tool',target:'fiber',mult:3},
{id:'rune-shield',name:'룬 방패',where:'bench',cost:{wood:8,stone:12,fiber:6},desc:'받는 피해 30% 감소',kind:'armor',reduce:.30},
{id:'forest-armor',name:'숲 갑옷',where:'bench',cost:{wood:5,stone:7,fiber:14},desc:'최대 체력 +40',kind:'armor',maxHp:40}
];
const creatures=[
{id:'mossboar',name:'이끼멧돼지',mood:'neutral',hp:60,dmg:8,speed:62,r:20,color:'#73935d'},
{id:'golem',name:'돌정령',mood:'neutral',hp:85,dmg:10,speed:42,r:22,color:'#9ba59b'},
{id:'goblin',name:'숲 고블린',mood:'aggressive',hp:48,dmg:8,speed:72,r:18,color:'#b0c35a'},
{id:'shadowwolf',name:'그림자늑대',mood:'aggressive',hp:58,dmg:10,speed:90,r:19,color:'#59687c'},
{id:'fairy',name:'빛의 요정',mood:'harmless',hp:1,dmg:0,speed:55,r:12,color:'#f7ef9c'}
];
const state={player:{x:1200,y:800,hp:100,maxHp:100,speed:185,wood:0,stone:0,fiber:0,kills:0,weapon:null,tool:null,armor:null,torch:false,attackAt:0,attackFx:0,faceX:1,faceY:0,invuln:0},bench:null,trees:[],rocks:[],fibers:[],enemies:[],camera:{x:0,y:0},keys:new Set(),stick:{x:0,y:0},last:performance.now(),respawns:[],craftMode:'hand',dirty:false};
let noticeTimer=0,autosave=0;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
function makeNode(kind,i){const m=110;let x,y;do{x=rand(m,WORLD.w-m);y=rand(m,WORLD.h-m)}while(dist(x,y,1200,800)<140);return{id:kind+i,kind,x,y,hp:kind==='tree'?3:kind==='rock'?4:2,maxHp:kind==='tree'?3:kind==='rock'?4:2,dead:false,respawnAt:0}}
function spawnCreature(type,index=0){const a=index/creatures.length*Math.PI*2+rand(-.35,.35),d=rand(300,520);return{type,hp:type.hp,maxHp:type.hp,x:clamp(state.player.x+Math.cos(a)*d,60,WORLD.w-60),y:clamp(state.player.y+Math.sin(a)*d,60,WORLD.h-60),attackAt:0,hitAt:0,hostile:type.mood==='aggressive',wander:rand(0,Math.PI*2),wanderAt:0}}
function initWorld(){state.trees=Array.from({length:26},(_,i)=>makeNode('tree',i));state.rocks=Array.from({length:22},(_,i)=>makeNode('rock',i));state.fibers=Array.from({length:28},(_,i)=>makeNode('fiber',i));state.enemies=creatures.map((t,i)=>spawnCreature(t,i))}
function item(id){return recipes.find(r=>r.id===id)}
function nameOf(id,fallback='없음'){return item(id)?.name||fallback}
function showNotice(text){ui.notice.textContent=text;ui.notice.classList.add('on');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>ui.notice.classList.remove('on'),1400)}
function updateHud(){const p=state.player;ui.hpfill.style.width=(100*p.hp/p.maxHp)+'%';ui.hptext.textContent=Math.ceil(p.hp)+'/'+p.maxHp;ui.weapon.textContent=nameOf(p.weapon,'맨손');ui.tool.textContent=nameOf(p.tool);ui.armor.textContent=nameOf(p.armor);ui.kills.textContent=p.kills;ui.wood.textContent=p.wood;ui.stone.textContent=p.stone;ui.fiber.textContent=p.fiber}
function canPay(c){const p=state.player;return p.wood>=c.wood&&p.stone>=c.stone&&p.fiber>=c.fiber}
function pay(c){const p=state.player;p.wood-=c.wood;p.stone-=c.stone;p.fiber-=c.fiber;state.dirty=true}
function nearBench(){return state.bench&&dist(state.player.x,state.player.y,state.bench.x,state.bench.y)<145}
function setArmor(id){const p=state.player;const old=item(p.armor);if(old?.maxHp){p.maxHp-=old.maxHp;p.hp=Math.min(p.hp,p.maxHp)}p.armor=id;const cur=item(id);if(cur?.maxHp){p.maxHp+=cur.maxHp;p.hp=Math.min(p.maxHp,p.hp+cur.maxHp)}}
function craftItem(id){const r=item(id);if(!r)return;if(r.where==='bench'&&!nearBench()){showNotice('제작대 가까이 가야 해');return}if(r.id==='bench'&&state.bench){showNotice('제작대는 이미 있어');return}if(!canPay(r.cost)){showNotice('재료가 부족해');return}pay(r.cost);const p=state.player;if(r.kind==='bench')state.bench={x:clamp(p.x+45,35,WORLD.w-35),y:clamp(p.y+20,35,WORLD.h-35)};else if(r.kind==='weapon')p.weapon=r.id;else if(r.kind==='tool')p.tool=r.id;else if(r.kind==='armor')setArmor(r.id);else if(r.kind==='heal')p.hp=Math.min(p.maxHp,p.hp+r.heal);else if(r.kind==='torch')p.torch=true;showNotice(r.name+' 제작 완료');updateHud();renderCraft();saveGame(false)}
function renderCraft(){const mode=state.craftMode;ui.handTab.classList.toggle('on',mode==='hand');ui.benchTab.classList.toggle('on',mode==='bench');const list=recipes.filter(r=>r.where===mode);let html=`<div class="info"><b>${mode==='hand'?'맨손 제작 4종':'제작대 제작 6종'}</b><br>${mode==='bench'?(nearBench()?'제작대 사용 가능':'제작대 가까이에서만 제작 가능'):'재료만 있으면 어디서든 제작 가능'}</div><div class="grid">`;for(const r of list){const disabled=!canPay(r.cost)||(r.where==='bench'&&!nearBench())||(r.id==='bench'&&!!state.bench);html+=`<button class="recipe" data-id="${r.id}" ${disabled?'disabled':''}><b>${r.name}</b><small>${r.desc}</small><small class="cost">나무 ${r.cost.wood} · 돌 ${r.cost.stone} · 섬유 ${r.cost.fiber}</small></button>`}html+='</div>';ui.sheetBody.innerHTML=html;ui.sheetBody.querySelectorAll('.recipe').forEach(b=>b.addEventListener('click',()=>craftItem(b.dataset.id)))}
function toggleCraft(open){const v=open??!ui.sheet.classList.contains('open');ui.sheet.classList.toggle('open',v);if(v)renderCraft()}
function gather(){const p=state.player;let best=null,bestD=88;for(const n of [...state.trees,...state.rocks,...state.fibers]){if(n.dead)continue;const d=dist(p.x,p.y,n.x,n.y);if(d<bestD){best=n;bestD=d}}if(!best){showNotice('자원 가까이 가');return}let amount=1;const tool=item(p.tool);if(tool?.target===best.kind)amount=tool.mult;best.hp--;if(best.kind==='tree')p.wood+=amount;else if(best.kind==='rock')p.stone+=amount;else p.fiber+=amount;if(best.hp<=0){best.dead=true;best.respawnAt=performance.now()+20000}state.dirty=true;updateHud();if(ui.sheet.classList.contains('open'))renderCraft()}
function currentDamage(){return item(state.player.weapon)?.power||6}function currentRange(){return item(state.player.weapon)?.range||64}
function attack(){const now=performance.now(),p=state.player;if(now-p.attackAt<380)return;p.attackAt=now;p.attackFx=now+140;for(const e of state.enemies){if(e.hp<=0||e.type.mood==='harmless')continue;const dx=e.x-p.x,dy=e.y-p.y,d=Math.hypot(dx,dy);if(d>currentRange()+e.type.r)continue;const dot=(dx*p.faceX+dy*p.faceY)/(d||1);if(dot<-.18)continue;e.hp-=currentDamage();e.hitAt=now+100;if(e.type.mood==='neutral')e.hostile=true;if(e.hp<=0){p.kills++;state.respawns.push({type:e.type,at:now+12000});showNotice(e.type.name+' 처치')}}state.dirty=true;updateHud()}
function damagePlayer(n){const p=state.player,now=performance.now();if(now<p.invuln)return;const armor=item(p.armor);n*=1-(armor?.reduce||0);p.hp=Math.max(0,p.hp-n);p.invuln=now+520;ui.flash.classList.add('on');setTimeout(()=>ui.flash.classList.remove('on'),100);if(p.hp<=0){p.hp=p.maxHp;p.x=1200;p.y=800;p.wood=Math.max(0,p.wood-2);p.stone=Math.max(0,p.stone-2);p.fiber=Math.max(0,p.fiber-2);showNotice('쓰러져 숲 중앙에서 부활했어')}state.dirty=true;updateHud()}
function update(dt,now){const p=state.player;let mx=(state.keys.has('KeyD')||state.keys.has('ArrowRight')?1:0)-(state.keys.has('KeyA')||state.keys.has('ArrowLeft')?1:0)+state.stick.x,my=(state.keys.has('KeyS')||state.keys.has('ArrowDown')?1:0)-(state.keys.has('KeyW')||state.keys.has('ArrowUp')?1:0)+state.stick.y,m=Math.hypot(mx,my);if(m>.01){mx/=Math.max(1,m);my/=Math.max(1,m);p.x=clamp(p.x+mx*p.speed*dt,24,WORLD.w-24);p.y=clamp(p.y+my*p.speed*dt,24,WORLD.h-24);p.faceX=mx;p.faceY=my}for(const n of [...state.trees,...state.rocks,...state.fibers])if(n.dead&&now>=n.respawnAt){n.dead=false;n.hp=n.maxHp}for(const e of state.enemies){if(e.hp<=0)continue;const d=dist(e.x,e.y,p.x,p.y);let vx=0,vy=0;if(e.type.mood==='harmless'){if(now>e.wanderAt){e.wanderAt=now+rand(800,1800);e.wander+=rand(-1.6,1.6)}vx=Math.cos(e.wander)*e.type.speed*.35;vy=Math.sin(e.wander)*e.type.speed*.35}else if(e.hostile&&d<430){vx=(p.x-e.x)/(d||1)*e.type.speed;vy=(p.y-e.y)/(d||1)*e.type.speed;if(d<e.type.r+25&&now-e.attackAt>900){e.attackAt=now;damagePlayer(e.type.dmg)}}else{if(now>e.wanderAt){e.wanderAt=now+rand(900,2200);e.wander+=rand(-1.2,1.2)}vx=Math.cos(e.wander)*e.type.speed*.28;vy=Math.sin(e.wander)*e.type.speed*.28}e.x=clamp(e.x+vx*dt,35,WORLD.w-35);e.y=clamp(e.y+vy*dt,35,WORLD.h-35)}for(let i=state.respawns.length-1;i>=0;i--)if(now>=state.respawns[i].at){state.enemies.push(spawnCreature(state.respawns[i].type,Math.random()*5));state.respawns.splice(i,1)}state.enemies=state.enemies.filter(e=>e.hp>0);state.camera.x=clamp(p.x-innerWidth/2,0,Math.max(0,WORLD.w-innerWidth));state.camera.y=clamp(p.y-innerHeight/2,0,Math.max(0,WORLD.h-innerHeight));autosave+=dt;if(autosave>10&&state.dirty){autosave=0;saveGame(false)}if(ui.sheet.classList.contains('open')&&state.craftMode==='bench'&&Math.floor(now/500)!==Math.floor((now-dt*1000)/500))renderCraft()}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):(ctx.rect(x,y,w,h))}
function drawGrid(cx,cy,w,h){ctx.fillStyle='#1d392b';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#8ec69a10';ctx.lineWidth=1;const s=80;for(let x=-(cx%s);x<w;x+=s){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=-(cy%s);y<h;y+=s){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}if(state.player.torch){const g=ctx.createRadialGradient(state.player.x-cx,state.player.y-cy,30,state.player.x-cx,state.player.y-cy,180);g.addColorStop(0,'#ffe6a322');g.addColorStop(1,'#ffe6a300');ctx.fillStyle=g;ctx.fillRect(0,0,w,h)}}
function drawNode(n,cx,cy){const x=n.x-cx,y=n.y-cy;if(x<-40||y<-40||x>innerWidth+40||y>innerHeight+40)return;if(n.kind==='tree'){ctx.fillStyle='#6f4f32';ctx.fillRect(x-5,y,10,28);ctx.fillStyle='#4e8f58';ctx.beginPath();ctx.arc(x,y-8,21,0,Math.PI*2);ctx.fill()}else if(n.kind==='rock'){ctx.fillStyle='#95a4a5';ctx.beginPath();ctx.moveTo(x-18,y+12);ctx.lineTo(x-12,y-12);ctx.lineTo(x+7,y-18);ctx.lineTo(x+20,y+8);ctx.closePath();ctx.fill()}else{ctx.strokeStyle='#76b96f';ctx.lineWidth=3;for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(x,y+13);ctx.quadraticCurveTo(x+i*6,y,x+i*7,y-13);ctx.stroke()}}}
function drawBench(cx,cy){if(!state.bench)return;const x=state.bench.x-cx,y=state.bench.y-cy;ctx.fillStyle='#8d663f';ctx.fillRect(x-25,y-12,50,24);ctx.fillStyle='#ccb07a';ctx.fillRect(x-28,y-15,56,8);ctx.fillStyle='#fff1bf';ctx.font='bold 9px system-ui';ctx.textAlign='center';ctx.fillText('제작대',x,y+28)}
function drawCreature(e,cx,cy){const x=e.x-cx,y=e.y-cy;if(x<-50||y<-50||x>innerWidth+50||y>innerHeight+50)return;ctx.save();if(performance.now()<e.hitAt)ctx.globalAlpha=.5;ctx.fillStyle=e.type.color;ctx.strokeStyle='#18221a';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,e.type.r,0,Math.PI*2);ctx.fill();ctx.stroke();if(e.type.id==='fairy'){ctx.strokeStyle='#fffbd0';ctx.beginPath();ctx.arc(x,y,e.type.r+6,0,Math.PI*2);ctx.stroke()}ctx.restore();if(e.type.mood!=='harmless'){ctx.fillStyle='#07100d';ctx.fillRect(x-21,y-e.type.r-13,42,4);ctx.fillStyle=e.type.mood==='aggressive'?'#e65f66':'#e1b85f';ctx.fillRect(x-21,y-e.type.r-13,42*Math.max(0,e.hp/e.maxHp),4)}ctx.fillStyle='#f4fff7';ctx.font='bold 9px system-ui';ctx.textAlign='center';ctx.fillText(e.type.name,x,y+e.type.r+14)}
function drawPlayer(cx,cy,now){const p=state.player,x=p.x-cx,y=p.y-cy;ctx.save();if(now<p.invuln&&Math.floor(now/80)%2===0)ctx.globalAlpha=.45;ctx.fillStyle='#e0c4a4';ctx.beginPath();ctx.arc(x,y-11,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#4d7398';roundRect(x-11,y-2,22,25,6);ctx.fill();ctx.fillStyle='#302c36';ctx.fillRect(x-9,y+21,6,12);ctx.fillRect(x+3,y+21,6,12);if(p.weapon){ctx.strokeStyle=p.weapon==='stone-sword'?'#d9e1df':'#b78652';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x+7,y+4);ctx.lineTo(x+7+p.faceX*25,y+4+p.faceY*25);ctx.stroke()}if(p.armor){ctx.strokeStyle='#d5cf9b';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y+8,14,0,Math.PI);ctx.stroke()}if(now<p.attackFx){ctx.strokeStyle='#f7e699';ctx.lineWidth=4;ctx.beginPath();const a=Math.atan2(p.faceY,p.faceX);ctx.arc(x,y,currentRange()*.72,a-.55,a+.55);ctx.stroke()}ctx.restore()}
function draw(){const cx=state.camera.x,cy=state.camera.y,now=performance.now();drawGrid(cx,cy,innerWidth,innerHeight);for(const n of state.trees)if(!n.dead)drawNode(n,cx,cy);for(const n of state.rocks)if(!n.dead)drawNode(n,cx,cy);for(const n of state.fibers)if(!n.dead)drawNode(n,cx,cy);drawBench(cx,cy);for(const e of state.enemies)drawCreature(e,cx,cy);drawPlayer(cx,cy,now)}
function resize(){const d=Math.min(2,devicePixelRatio||1);canvas.width=Math.floor(innerWidth*d);canvas.height=Math.floor(innerHeight*d);canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(d,0,0,d,0,0)}function loop(now){const dt=Math.min(.033,(now-state.last)/1000);state.last=now;update(dt,now);draw();requestAnimationFrame(loop)}
function saveGame(manual=true){try{const p=state.player;localStorage.setItem(SAVE_KEY,JSON.stringify({v:2,player:{x:p.x,y:p.y,hp:p.hp,maxHp:p.maxHp,wood:p.wood,stone:p.stone,fiber:p.fiber,kills:p.kills,weapon:p.weapon,tool:p.tool,armor:p.armor,torch:p.torch},bench:state.bench}));state.dirty=false;if(manual)showNotice('저장 완료')}catch(e){if(manual)showNotice('저장 실패')}}
function loadGame(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(!s||!s.player)return;const o=s.player,p=state.player;p.x=clamp(Number(o.x)||1200,25,WORLD.w-25);p.y=clamp(Number(o.y)||800,25,WORLD.h-25);p.wood=Math.max(0,Number(o.wood)||0);p.stone=Math.max(0,Number(o.stone)||0);p.fiber=Math.max(0,Number(o.fiber)||0);p.kills=Math.max(0,Number(o.kills)||0);p.weapon=item(o.weapon)?.kind==='weapon'?o.weapon:(o.weapon==='wood-sword'?'wood-spear':null);p.tool=item(o.tool)?.kind==='tool'?o.tool:(item(o.axe)?.kind==='tool'?o.axe:(item(o.pick)?.kind==='tool'?o.pick:null));p.armor=item(o.armor)?.kind==='armor'?o.armor:(o.shield==='stone-shield'?'rune-shield':null);p.torch=!!o.torch;if(p.armor==='forest-armor')p.maxHp=140;else p.maxHp=100;p.hp=clamp(Number(o.hp)||p.maxHp,1,p.maxHp);if(s.bench&&Number.isFinite(s.bench.x)&&Number.isFinite(s.bench.y))state.bench={x:s.bench.x,y:s.bench.y}}catch(e){}}
window.addEventListener('resize',resize);window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();state.keys.add(e.code);if(e.code==='Space')attack();if(e.code==='KeyE')gather();if(e.code==='KeyC')toggleCraft()});window.addEventListener('keyup',e=>state.keys.delete(e.code));document.getElementById('attack').addEventListener('pointerdown',e=>{e.preventDefault();attack()});document.getElementById('gather').addEventListener('pointerdown',e=>{e.preventDefault();gather()});document.getElementById('craft').addEventListener('click',()=>toggleCraft());document.getElementById('close').addEventListener('click',()=>toggleCraft(false));document.getElementById('save').addEventListener('click',()=>saveGame(true));ui.handTab.addEventListener('click',()=>{state.craftMode='hand';renderCraft()});ui.benchTab.addEventListener('click',()=>{state.craftMode='bench';renderCraft()});
const stick=document.getElementById('stick'),knob=document.getElementById('knob');let sp=null;function moveStick(e){const r=stick.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,max=r.width*.3,m=Math.hypot(dx,dy),k=m>max?max/m:1,x=dx*k,y=dy*k;state.stick.x=x/max;state.stick.y=y/max;knob.style.transform=`translate(${x}px,${y}px)`}function endStick(e){if(sp!==e.pointerId)return;sp=null;state.stick.x=state.stick.y=0;knob.style.transform='translate(0,0)'}stick.addEventListener('pointerdown',e=>{sp=e.pointerId;stick.setPointerCapture(e.pointerId);moveStick(e)});stick.addEventListener('pointermove',e=>{if(sp===e.pointerId)moveStick(e)});stick.addEventListener('pointerup',endStick);stick.addEventListener('pointercancel',endStick);window.addEventListener('pagehide',()=>saveGame(false));initWorld();loadGame();resize();updateHud();requestAnimationFrame(loop);showNotice('나무·돌·섬유를 모아 살아남아');
})();
</script>
