let recorderAudio=null,recorderStopTimer=0,recorderBlobUrl='';
function setRecorderOverlay(text,stateText='재생 중'){
 ui.recorderCaption.textContent=text;ui.recorderState.textContent=stateText;ui.recorderOverlay.classList.add('on')
}
function closeRecorderOverlay(delay=0){
 clearTimeout(recorderStopTimer);recorderStopTimer=setTimeout(()=>ui.recorderOverlay.classList.remove('on'),delay)
}
function duckBgmForRecorder(on){
 if(!music.master||!music.ctx)return;
 const now=music.ctx.currentTime;music.master.gain.cancelScheduledValues(now);music.master.gain.setTargetAtTime(on?.06:(music.enabled?1.44:.0001),now,.08)

function recorderBlobSrc(){
 if(recorderBlobUrl)return recorderBlobUrl;
 const raw=atob(LAB_RECORDER_AUDIO_B64),bytes=new Uint8Array(raw.length);
 for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
 recorderBlobUrl=URL.createObjectURL(new Blob([bytes],{type:'audio/mpeg'}));
 return recorderBlobUrl
}
function createRecorderAudio(){
 const a=document.createElement('audio');a.preload='auto';a.playsInline=true;a.setAttribute('playsinline','');a.src=recorderBlobSrc();a.volume=1;a.load();return a
}
function primeLabRecorderAudio(){
 if(recorderAudio)return;
 recorderAudio=createRecorderAudio();
}
function stopRecorderVoice(){
 if(recorderAudio){try{recorderAudio.pause();recorderAudio.currentTime=0}catch{}}
 duckBgmForRecorder(false)
}
function playLabRecorder(){
 unlockRecord('lab');clearTimeout(recorderStopTimer);
 if(!recorderAudio)recorderAudio=createRecorderAudio();
 const a=recorderAudio;try{a.pause();a.currentTime=0}catch{}
 setRecorderOverlay(LAB_RECORDER_LINES.join('\n\n'),'▶ 실제 한국어 녹음 재생 중 · 다시 두 번 누르면 처음부터');
 a.onplay=()=>{duckBgmForRecorder(true);ui.recorderState.textContent='▶ 실제 한국어 녹음 재생 중'};
 a.onended=()=>{if(recorderAudio!==a)return;duckBgmForRecorder(false);ui.recorderState.textContent='■ 녹음 종료';closeRecorderOverlay(3500)};
 a.onerror=()=>{if(recorderAudio!==a)return;duckBgmForRecorder(false);ui.recorderState.textContent='내장 음성 디코딩 실패';closeRecorderOverlay(7000)};
 const p=a.play();
 if(p&&typeof p.then==='function')p.then(()=>showNotice('연구소 녹음기 · 한국어 음성 재생')).catch(()=>{ui.recorderState.textContent='재생 권한이 막혔어 · 녹음기를 다시 두 번 눌러줘'});
 else showNotice('연구소 녹음기 · 한국어 음성 재생')
}
function unlockRecord(id){if(state.records[id])return false;state.records[id]=true;state.dirty=true;showNotice(id==='lab'?'연구소 녹음 기록 획득':'공사장 일기 획득');return true}
function renderBestiary(){
 tabState();
 let html='<div class="bookTabs">';
 for(const cat of ['neutral','aggressive','harmless','boss','records'])html+=`<button data-cat="${cat}" class="${state.bookCategory===cat?'on':''}">${BOOK_LABELS[cat]}</button>`;
 html+='</div>';
 if(state.bookCategory==='records'){
   for(const id of ['lab','construction']){
     if(state.records[id])html+=`<div class="recordCard"><h4>${RECORD_TEXTS[id].title}</h4><p>${RECORD_TEXTS[id].text}</p></div>`;
     else html+='<div class="recordCard"><h4>미발견 기록</h4><p>화산의 폐허를 조사해 기록을 찾아야 한다.</p></div>'
   }
 }else{
   html+='<div class="bookGrid">';
   for(const [id,info] of Object.entries(BESTIARY_INFO)){
     if(info.cat!==state.bookCategory)continue;
     const t=creatures[id],unlocked=!!state.bestiary[id];
     if(!unlocked){html+='<div class="bookCard"><div class="lockedPortrait">?</div><h4>미발견</h4><p>몬스터를 두 번 눌러 조사하면 기록된다.</p></div>';continue}
     html+=`<div class="bookCard"><div class="creaturePortrait">${bestiaryPortrait(id)}</div><h4>${t.name}<span class="tierBadge">${creatureTier(id)}티어</span></h4><p>${info.desc}</p></div>`
   }
   html+='</div>'
 }
 ui.sheetBody.innerHTML=html;
 ui.sheetBody.querySelectorAll('.bookTabs button').forEach(b=>b.addEventListener('click',()=>{state.bookCategory=b.dataset.cat;renderBestiary()}))
}
function openBestiary(){state.panelMode='bestiary';ui.sheet.classList.add('open');renderBestiary()}
function questObjective(){
 const q=state.story;
 if(q.completed)return'';
 if(q.stage==='find-survivor')return'수정 북쪽 끝으로 가세요';
 if(q.stage==='talk')return'죽기 직전의 생존자와 이야기하세요';
 if(q.stage==='go-cave')return'동굴로 가기위해 화산 황무지로 가세요';
 if(q.stage==='find-radio')return'동굴 맨 끝에서 무전기 부품을 찾으세요';
 if(q.stage==='return-survivor'||q.stage==='sensor-briefing'||q.stage==='sensor-choice')return'무전기 부품을 생존자에게 전하세요';
 if(q.stage==='find-lab')return'거대한 나무 서쪽 끝의 연구소 입구를 찾으세요';
 if(q.stage==='lab-maze')return'연구소 1층 미로의 출구를 찾으세요';
 if(q.stage==='lab-floor2')return'2층의 수정 화염골렘을 처치하세요';
 if(q.stage==='lab-loot')return'셔터 안에서 부품센서와 보고서를 찾으세요';
 if(q.stage==='return-survivor-lab'||q.stage==='crystal-report')return'부품센서와 보고서를 생존자에게 전하세요';
 if(q.stage==='ask-crystal')return'생존자와 한 번 더 이야기하세요';
 if(q.stage==='touch-crystal')return'이곳 가운데의 큰 수정을 만져보세요';
 if(q.stage==='return-after-crystal')return'생존자에게 돌아가세요';
 return''
}
function setStoryDialog(text,choices=[]){state.storyDialog={text,choices};state.panelMode='story';ui.sheet.classList.add('open');renderStory()}
function renderStory(){
 const d=state.storyDialog;if(!d)return closeSheet();
 ui.sheetBody.innerHTML=`<div class="storyText">${d.text}</div><div class="storyChoices">${d.choices.map((x,i)=>`<button data-story="${i}">${x.label}</button>`).join('')}</div>`;
 ui.sheetBody.querySelectorAll('[data-story]').forEach(b=>b.addEventListener('click',()=>{const ch=d.choices[Number(b.dataset.story)];if(ch)storyChoice(ch.id)}))
}
function storyChoice(id){
 const q=state.story;
 if(id==='just'){q.path='just';setStoryDialog('정말 고마워 모르는거 있으면 말해',[{id:'escape-just',label:'이 곳을 빠져나가려면 어떡하나요?'}]);return}
 if(id==='where'){q.path='where';setStoryDialog('나도 잘 모르는데',[{id:'escape-where',label:'저는 여기서 어떻게 나가죠?'}]);return}
 if(id==='escape-just'||id==='escape-where'){q.stage='go-cave';state.storyDialog=null;closeSheet();showNotice('일단 동굴로 들어가봐 그곳에는 이 곳을 빠져나갈 방법이 있을거야');state.dirty=true;updateHud();saveGame(false);return}
 if(id==='sensor-confirm'){
  q.labUnlocked=true;q.stage='find-lab';state.dirty=true;
  setStoryDialog('내가 문 비밀번호를 알려줄게 잠깐만..     그 거대한 나무 서쪽 끝에 연구소 입구가 있어');
  updateHud();saveGame(false);return
 }
 if(id==='crystal-beast'){
  setStoryDialog('그럼 괴물의 정체는 밝혀졌는데. 그 온몸에 수정이 박힌이유가 있지 않을까?',[{id:'agree-crystal',label:'그러니까요..'}]);return
 }
 if(id==='agree-crystal'){
  q.stage='ask-crystal';state.dirty=true;
  setStoryDialog('혹시 아주 혹시나 이곳 가운데의 수정이 만든거 아닐까 원래 저 수정은 저런거를 만들어 내더라고. 그게 연구소를 침략한거 같아.');

function survivorInteract(){

  let bandage=invCount('bandage')>0?'bandage':invCount('good-bandage')>0?'good-bandage':null;

  state.player.inventory[bandage]--;q.treated=true;q.stage='talk';state.dirty=true;setStoryDialog('고마워 근데 어떻게 왔어?',[{id:'just',label:'그냥 왔어요'},{id:'where',label:'여기 어디예요'}]);saveGame(false);return
 }
 if(q.stage==='talk'){setStoryDialog('고마워 근데 어떻게 왔어?',[{id:'just',label:'그냥 왔어요'},{id:'where',label:'여기 어디예요'}]);return}
 if(q.stage==='go-cave'||q.stage==='find-radio'){showNotice('일단 황무지 서쪽 동굴로 가봐');return}

 }

 }
 if(q.stage==='ask-crystal'){

async function connectMultiplayer(rawRoom){
 const room=String(rawRoom||'').trim(),roomNumber=Number(room);if(!/^([1-9]|10)$/.test(room)||!Number.isInteger(roomNumber)||roomNumber<1||roomNumber>10){showNotice('방 번호는 1~10 중 하나만 입력해');return}
 if(!window.supabase?.createClient){showNotice('멀티 서버 모듈을 불러오지 못했어');return}
 await leaveMultiplayer(false);

 multiplayer.channel=multiplayer.client.channel('fantasy-survival:'+room,{config:{broadcast:{self:false,ack:false},presence:{key:multiplayer.playerId}}});
 multiplayer.channel
  .on('presence',{event:'sync'},syncMultiPresence)
  .on('broadcast',{event:'player-state'},({payload})=>remotePlayerState(payload))
  .on('broadcast',{event:'world-state'},({payload})=>applyWorldSnapshot(payload))
  .on('broadcast',{event:'structure-place'},({payload})=>hostApplyStructurePlace(payload))
  .on('broadcast',{event:'enemy-hit'},({payload})=>applyRemoteEnemyHit(payload))
  .on('broadcast',{event:'enemy-effect'},({payload})=>applyRemoteEnemyEffect(payload))
  .on('broadcast',{event:'attack'},({payload})=>hostApplyRemoteAttack(payload))
  .on('broadcast',{event:'pet-attack'},({payload})=>hostApplyPetAttack(payload))
  .on('broadcast',{event:'kill-reward'},({payload})=>grantRemoteKillReward(payload))
  .subscribe(async status=>{
    if(status==='SUBSCRIBED'){
      multiplayer.connected=true;ui.multiRoom.value=room;
      await multiplayer.channel.track({id:multiplayer.playerId,joinedAt:multiplayer.joinedAt});
      const u=new URL(location.href);u.searchParams.set('room',room);history.replaceState(null,'',u);syncMultiPresence();showNotice('멀티 방 '+room+' 참가')

  })
}

        }else{
          e.enemyTarget=null;
          if(playerD<(e.type.detect||1050)){
            if(playerD>e.type.r+30&&now>=(e.nextThrowAt||0))throwGuardianCrystal(e,targetP,now);
            if(playerD<=e.type.r+30&&now-e.attackAt>(e.type.attackCooldown||1050)){e.attackAt=now;enemyDamageTarget(e,e.type.dmg*rage,false);monsterFight=true}

        }
      }

      }

        }
        state.enemies.push(spawnCreature(type,Math.random()*20,anchor,r.packId??null))
      }
      state.respawns.splice(i,1)
    }
    state.enemies=state.enemies.filter(e=>e.hp>0);
  }

  musicTick();
  finishSmeltIfReady();
  if(ui.smeltPanel.classList.contains('open')){if(!nearFurnace())ui.smeltPanel.classList.remove('open');else updateSmeltUi()}

}
