<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#14251d">
<title>마력숲 생존기</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none}
:root{--panel:rgba(15,28,23,.9);--line:rgba(216,241,225,.24);--text:#f1fff5;--muted:#b9d2c2;--gold:#f2d078;--wood:#d49758;--stone:#b7c6cc}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0e1813;color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
body{position:fixed;inset:0}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;background:#213c2d}
.hud{position:absolute;left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));display:flex;gap:7px;align-items:flex-start;pointer-events:none}
.hudCard{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;box-shadow:0 6px 18px #0005;backdrop-filter:blur(6px)}
.mainHud{flex:1;min-width:0}.topline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.name{font-weight:900;font-size:13px}.hpbar{height:9px;flex:1;min-width:90px;max-width:220px;border-radius:999px;background:#351f24;overflow:hidden;border:1px solid #ffffff22}.hpfill{height:100%;background:linear-gradient(90deg,#ec5e6c,#f79a74);width:100%}.stats{margin-top:5px;display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:11px;font-weight:800}.stats b{color:#fff}.res{display:flex;gap:8px;font-size:12px;font-weight:900}.res span{white-space:nowrap}.wood{color:#ffd09a}.stone{color:#dbe9ed}.smallBtn{pointer-events:auto;border:1px solid var(--line);background:#21382e;color:#eefcf4;border-radius:10px;min-width:44px;min-height:38px;padding:0 9px;font-weight:900;font-size:11px}
.notice{position:absolute;top:84px;left:50%;transform:translateX(-50%);max-width:min(86vw,480px);padding:8px 12px;border-radius:11px;background:rgba(8,18,14,.9);border:1px solid #ffffff22;font-weight:800;font-size:12px;text-align:center;opacity:0;transition:opacity .18s;pointer-events:none}.notice.show{opacity:1}
.controls{position:absolute;inset:0;pointer-events:none}.stick{pointer-events:auto;position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(22px,env(safe-area-inset-bottom));width:126px;height:126px;border-radius:50%;background:#07100c70;border:2px solid #d5f8df36;box-shadow:inset 0 0 20px #0007}.knob{position:absolute;left:38px;top:38px;width:50px;height:50px;border-radius:50%;background:#e6ffedcc;border:2px solid #fff8;box-shadow:0 4px 12px #0007;transform:translate(0,0)}
.actionWrap{position:absolute;right:max(16px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));display:grid;grid-template-columns:74px 86px;grid-template-rows:58px 72px;gap:9px;align-items:end;pointer-events:none}.action{pointer-events:auto;border:1px solid #ffffff4a;border-radius:18px;background:#1e382dE8;color:#fff;font-weight:1000;box-shadow:0 5px 16px #0006;font-size:13px}.action:active{transform:scale(.96)}.attack{grid-column:2;grid-row:1/3;border-radius:50%;width:86px;height:86px;align-self:end;background:linear-gradient(145deg,#7d343a,#bc4b55)}.gather{grid-column:1;grid-row:2;background:linear-gradient(145deg,#5c472d,#8a6638)}.craft{grid-column:1;grid-row:1;background:linear-gradient(145deg,#315347,#41745d)}
.sheet{position:absolute;right:10px;top:82px;bottom:118px;width:min(360px,46vw);display:none;flex-direction:column;background:rgba(10,21,17,.96);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 10px 32px #0008;backdrop-filter:blur(10px)}.sheet.open{display:flex}.sheetHead{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;border-bottom:1px solid var(--line)}.sheetHead strong{font-size:16px}.closeBtn{border:0;background:#ffffff16;color:#fff;width:36px;height:36px;border-radius:10px;font-size:20px}.sheetBody{padding:10px;overflow:auto;touch-action:pan-y}.benchBox{padding:10px;border-radius:12px;background:#1b3128;border:1px solid #ffffff17;margin-bottom:9px;font-size:12px;line-height:1.45}.benchBox b{color:var(--gold)}.recipeGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.recipe{min-height:82px;text-align:left;border:1px solid #ffffff1f;background:#182b23;color:#fff;border-radius:12px;padding:9px}.recipe:disabled{opacity:.42}.recipe b{display:block;font-size:13px;margin-bottom:3px}.recipe small{display:block;color:var(--muted);font-size:10px;line-height:1.35}.cost{margin-top:5px;color:#ffe1a8!important;font-weight:900}.benchCraft{width:100%;min-height:52px;border:1px solid #fff4;background:#65502d;color:#fff;border-radius:12px;font-weight:1000;font-size:14px}.tip{margin:7px 0 0;color:var(--muted);font-size:10px;line-height:1.45}
.legend{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);padding:6px 10px;border-radius:10px;background:#0b1612b8;border:1px solid #ffffff1b;color:#c8ddd0;font-size:10px;font-weight:800;pointer-events:none;white-space:nowrap}
.flash{position:absolute;inset:0;background:#ff536633;opacity:0;pointer-events:none;transition:opacity .12s}.flash.on{opacity:1}
@media(max-width:720px){.hud{right:6px;left:6px}.hudCard{padding:7px 8px}.mainHud .stats{gap:6px;font-size:10px}.res{font-size:11px}.sheet{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:70%;border-radius:18px}.sheetBody{padding-bottom:max(12px,env(safe-area-inset-bottom))}.legend{display:none}.recipeGrid{grid-template-columns:1fr 1fr}.stick{width:118px;height:118px}.knob{left:35px;top:35px;width:48px;height:48px}.actionWrap{right:12px;bottom:18px}}
@media(max-width:380px){.recipeGrid{grid-template-columns:1fr}.stick{width:108px;height:108px}.knob{left:32px;top:32px;width:44px;height:44px}.actionWrap{grid-template-columns:66px 78px}.attack{width:78px;height:78px}.action{font-size:12px}}
</style>
</head>
<body>
<canvas id="game" aria-label="마력숲 생존기 게임 화면"></canvas>
<div class="hud">
  <div class="hudCard mainHud">
    <div class="topline"><span class="name">마력숲 생존기</span><div class="hpbar"><div id="hpfill" class="hpfill"></div></div><span id="hptext" style="font-size:11px;font-weight:900">100 / 100</span></div>
    <div class="stats"><span>무기 <b id="weaponText">맨손</b></span><span>도끼 <b id="axeText">없음</b></span><span>곡괭이 <b id="pickText">없음</b></span><span>방패 <b id="shieldText">없음</b></span><span>처치 <b id="killText">0</b></span></div>
  </div>
  <div class="hudCard res"><span class="wood">나무 <b id="woodText">0</b></span><span class="stone">돌 <b id="stoneText">0</b></span></div>
  <button id="saveBtn" class="smallBtn" type="button">저장</button>
  <a class="smallBtn" href="/" style="display:flex;align-items:center;justify-content:center;text-decoration:none">홈</a>
</div>
<div id="notice" class="notice" role="status" aria-live="polite"></div>
<div class="controls">
  <div id="stick" class="stick" aria-label="이동 조이스틱"><div id="knob" class="knob"></div></div>
  <div class="actionWrap">
    <button id="craftBtn" class="action craft" type="button">제작</button>
    <button id="gatherBtn" class="action gather" type="button">채집</button>
    <button id="attackBtn" class="action attack" type="button">공격</button>
  </div>
</div>
<div id="sheet" class="sheet" aria-hidden="true">
  <div class="sheetHead"><strong>제작</strong><button id="closeSheet" class="closeBtn" type="button" aria-label="제작창 닫기">×</button></div>
  <div id="sheetBody" class="sheetBody"></div>
</div>
<div class="legend">이동 WASD · 공격 Space · 채집 E · 제작 C</div>
<div id="flash" class="flash"></div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const ui={hpfill:document.getElementById('hpfill'),hptext:document.getElementById('hptext'),weapon:document.getElementById('weaponText'),axe:document.getElementById('axeText'),pick:document.getElementById('pickText'),shield:document.getElementById('shieldText'),kills:document.getElementById('killText'),wood:document.getElementById('woodText'),stone:document.getElementById('stoneText'),notice:document.getElementById('notice'),sheet:document.getElementById('sheet'),sheetBody:document.getElementById('sheetBody'),flash:document.getElementById('flash')};
const WORLD={w:2400,h:1600};
const SAVE_KEY='jaewoon_fantasy_survival_v1';
const recipes=[
{id:'wood-sword',name:'나무검',cost:{wood:8,stone:0},desc:'공격력 10',kind:'weapon',power:10,range:72},
{id:'stone-sword',name:'돌검',cost:{wood:6,stone:8},desc:'공격력 16',kind:'weapon',power:16,range:74},
{id:'wood-axe',name:'나무도끼',cost:{wood:7,stone:2},desc:'나무 채집량 2배',kind:'axe',mult:2},
{id:'stone-axe',name:'돌도끼',cost:{wood:8,stone:8},desc:'나무 채집량 3배',kind:'axe',mult:3},
{id:'wood-pick',name:'나무곡괭이',cost:{wood:6,stone:3},desc:'돌 채집량 2배',kind:'pick',mult:2},
{id:'stone-pick',name:'돌곡괭이',cost:{wood:7,stone:9},desc:'돌 채집량 3배',kind:'pick',mult:3},
{id:'wood-shield',name:'나무방패',cost:{wood:10,stone:2},desc:'받는 피해 15% 감소',kind:'shield',reduce:.15},
{id:'stone-shield',name:'돌방패',cost:{wood:8,stone:12},desc:'받는 피해 30% 감소',kind:'shield',reduce:.30},
{id:'stone-spear',name:'돌창',cost:{wood:9,stone:10},desc:'공격력 13 · 사거리 증가',kind:'weapon',power:13,range:104},
{id:'campfire',name:'모닥불',cost:{wood:10,stone:6},desc:'현재 위치에 설치 · 체력 40 회복',kind:'campfire'}
];
const enemyTypes=[
{id:'slime',name:'초록 슬라임',hp:32,dmg:5,speed:54,r:18,color:'#6fd27d'},
{id:'goblin',name:'숲 고블린',hp:45,dmg:7,speed:70,r:18,color:'#b7c95a'},
{id:'bat',name:'어둠 박쥐',hp:26,dmg:6,speed:96,r:14,color:'#8b71bb'},
{id:'skeleton',name:'해골병사',hp:65,dmg:9,speed:56,r:19,color:'#dedbc5'},
{id:'wolf',name:'마력늑대',hp:50,dmg:8,speed:84,r:19,color:'#6b8fae'}
];
const state={player:{x:WORLD.w/2,y:WORLD.h/2,hp:100,maxHp:100,speed:185,wood:0,stone:0,kills:0,weapon:null,axe:null,pick:null,shield:null,attackAt:0,attackFx:0,faceX:1,faceY:0,invuln:0},bench:null,campfires:[],trees:[],rocks:[],enemies:[],camera:{x:0,y:0},keys:new Set(),stick:{x:0,y:0},last:performance.now(),respawns:[],dirty:false};
let noticeTimer=0,autoSaveTimer=0,spawnTimer=0;
function rand(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function dist(ax,ay,bx,by){return Math.hypot(ax-bx,ay-by)}
function makeNode(kind,i){const margin=130;let x,y;do{x=rand(margin,WORLD.w-margin);y=rand(margin,WORLD.h-margin)}while(dist(x,y,WORLD.w/2,WORLD.h/2)<150);return{id:kind+'-'+i,kind,x,y,hp:kind==='tree'?3:4,maxHp:kind==='tree'?3:4,dead:false,respawnAt:0}}
function initWorld(){state.trees=Array.from({length:24},(_,i)=>makeNode('tree',i));state.rocks=Array.from({length:20},(_,i)=>makeNode('rock',i));state.enemies=enemyTypes.map((t,i)=>spawnEnemy(t,i))}
function spawnEnemy(type,index=0){const a=(index/enemyTypes.length)*Math.PI*2+rand(-.35,.35),d=rand(280,480);return{type,hp:type.hp,maxHp:type.hp,x:clamp(state.player.x+Math.cos(a)*d,70,WORLD.w-70),y:clamp(state.player.y+Math.sin(a)*d,70,WORLD.h-70),vx:0,vy:0,hitAt:0,attackAt:0,wander:rand(0,Math.PI*2),wanderAt:performance.now()+rand(500,1800)}}
function showNotice(text){clearTimeout(noticeTimer);ui.notice.textContent=text;ui.notice.classList.add('show');noticeTimer=setTimeout(()=>ui.notice.classList.remove('show'),1500)}
function itemName(id){const r=recipes.find(x=>x.id===id);return r?r.name:'없음'}
function currentWeapon(){return recipes.find(r=>r.id===state.player.weapon)||null}
function currentShield(){return recipes.find(r=>r.id===state.player.shield)||null}
function updateHud(){const p=state.player;ui.hpfill.style.width=(p.hp/p.maxHp*100)+'%';ui.hptext.textContent=Math.ceil(p.hp)+' / '+p.maxHp;ui.wood.textContent=p.wood;ui.stone.textContent=p.stone;ui.kills.textContent=p.kills;ui.weapon.textContent=p.weapon?itemName(p.weapon):'맨손';ui.axe.textContent=p.axe?itemName(p.axe):'없음';ui.pick.textContent=p.pick?itemName(p.pick):'없음';ui.shield.textContent=p.shield?itemName(p.shield):'없음'}
function canPay(cost){return state.player.wood>=cost.wood&&state.player.stone>=cost.stone}
function pay(cost){state.player.wood-=cost.wood;state.player.stone-=cost.stone;state.dirty=true}
function nearBench(){return state.bench&&dist(state.player.x,state.player.y,state.bench.x,state.bench.y)<150}
function craftBench(){const cost={wood:10,stone:8};if(state.bench){showNotice('제작대는 이미 설치돼 있어');return}if(!canPay(cost)){showNotice('나무 10, 돌 8이 필요해');return}pay(cost);state.bench={x:state.player.x+45,y:state.player.y+18};showNotice('제작대를 설치했어');renderCraft();updateHud();saveGame()}
function craft(id){const r=recipes.find(x=>x.id===id);if(!r||!nearBench()){showNotice('제작대 가까이에서 만들 수 있어');return}if(!canPay(r.cost)){showNotice('재료가 부족해');return}pay(r.cost);const p=state.player;if(r.kind==='weapon')p.weapon=r.id;else if(r.kind==='axe')p.axe=r.id;else if(r.kind==='pick')p.pick=r.id;else if(r.kind==='shield')p.shield=r.id;else if(r.kind==='campfire'){state.campfires.push({x:p.x+38,y:p.y+18});p.hp=Math.min(p.maxHp,p.hp+40)}showNotice(r.name+' 제작 완료');updateHud();renderCraft();saveGame()}
function renderCraft(){if(!state.bench){ui.sheetBody.innerHTML=`<div class="benchBox"><b>제작대가 필요해</b><br>먼저 나무와 돌을 모아 제작대를 설치해.</div><button id="benchMake" class="benchCraft" type="button" ${canPay({wood:10,stone:8})?'':'disabled'}>제작대 만들기 · 나무 10 / 돌 8</button><p class="tip">나무와 돌 가까이에서 채집 버튼을 눌러. 제작대는 현재 위치 옆에 설치돼.</p>`;document.getElementById('benchMake')?.addEventListener('click',craftBench);return}const near=nearBench();let html=`<div class="benchBox"><b>${near?'제작대 사용 가능':'제작대에서 너무 멀어'}</b><br>${near?'아래 10종을 제작할 수 있어.':'지도에 보이는 제작대 가까이 가.'}</div><div class="recipeGrid">`;for(const r of recipes){const disabled=!near||!canPay(r.cost);html+=`<button class="recipe" data-id="${r.id}" type="button" ${disabled?'disabled':''}><b>${r.name}</b><small>${r.desc}</small><small class="cost">나무 ${r.cost.wood} · 돌 ${r.cost.stone}</small></button>`}html+='</div><p class="tip">검·창/도끼/곡괭이/방패는 새로 만들면 해당 장비 칸에 바로 장착돼.</p>';ui.sheetBody.innerHTML=html;ui.sheetBody.querySelectorAll('.recipe').forEach(btn=>btn.addEventListener('click',()=>craft(btn.dataset.id)))}
function toggleCraft(force){const open=force??!ui.sheet.classList.contains('open');ui.sheet.classList.toggle('open',open);ui.sheet.setAttribute('aria-hidden',String(!open));if(open)renderCraft()}
function gather(){const p=state.player;let best=null,bestD=90;for(const n of [...state.trees,...state.rocks]){if(n.dead)continue;const d=dist(p.x,p.y,n.x,n.y);if(d<bestD){best=n;bestD=d}}if(!best){showNotice('나무나 돌에 더 가까이 가');return}let amount=1;if(best.kind==='tree'&&p.axe){amount=recipes.find(r=>r.id===p.axe)?.mult||1}if(best.kind==='rock'&&p.pick){amount=recipes.find(r=>r.id===p.pick)?.mult||1}best.hp--;if(best.kind==='tree')p.wood+=amount;else p.stone+=amount;if(best.hp<=0){best.dead=true;best.respawnAt=performance.now()+20000;showNotice((best.kind==='tree'?'나무':'돌')+' 자원이 20초 뒤 다시 생겨')}state.dirty=true;updateHud();if(ui.sheet.classList.contains('open'))renderCraft()}
function attack(){const now=performance.now(),p=state.player;if(now-p.attackAt<380)return;p.attackAt=now;p.attackFx=now+150;const w=currentWeapon(),range=w?.range||66,damage=w?.power||6;for(const e of state.enemies){if(e.hp<=0)continue;const dx=e.x-p.x,dy=e.y-p.y,d=Math.hypot(dx,dy);if(d>range+e.type.r)continue;const dot=(dx*p.faceX+dy*p.faceY)/(d||1);if(dot<-.15)continue;e.hp-=damage;e.hitAt=now+110;if(e.hp<=0){p.kills++;state.respawns.push({type:e.type,at:now+10000});showNotice(e.type.name+' 처치!')}}state.dirty=true;updateHud()}
function damagePlayer(amount){const now=performance.now(),p=state.player;if(now<p.invuln)return;const shield=currentShield();amount*=1-(shield?.reduce||0);p.hp=Math.max(0,p.hp-amount);p.invuln=now+520;ui.flash.classList.add('on');setTimeout(()=>ui.flash.classList.remove('on'),100);if(p.hp<=0)respawnPlayer();state.dirty=true;updateHud()}
function respawnPlayer(){const p=state.player;p.hp=p.maxHp;p.x=WORLD.w/2;p.y=WORLD.h/2;p.wood=Math.max(0,p.wood-3);p.stone=Math.max(0,p.stone-3);showNotice('쓰러졌어. 나무와 돌을 조금 잃고 숲 중앙에서 부활했어')}
function update(dt,now){const p=state.player;let mx=0,my=0;if(state.keys.has('KeyW')||state.keys.has('ArrowUp'))my-=1;if(state.keys.has('KeyS')||state.keys.has('ArrowDown'))my+=1;if(state.keys.has('KeyA')||state.keys.has('ArrowLeft'))mx-=1;if(state.keys.has('KeyD')||state.keys.has('ArrowRight'))mx+=1;mx+=state.stick.x;my+=state.stick.y;const m=Math.hypot(mx,my);if(m>.08){mx/=Math.max(1,m);my/=Math.max(1,m);p.x=clamp(p.x+mx*p.speed*dt,25,WORLD.w-25);p.y=clamp(p.y+my*p.speed*dt,25,WORLD.h-25);p.faceX=mx;p.faceY=my}for(const n of [...state.trees,...state.rocks])if(n.dead&&now>=n.respawnAt){n.dead=false;n.hp=n.maxHp;n.x=rand(120,WORLD.w-120);n.y=rand(120,WORLD.h-120)}state.enemies=state.enemies.filter(e=>e.hp>0);for(const e of state.enemies){const d=dist(e.x,e.y,p.x,p.y);let dx=0,dy=0;if(d<330){dx=(p.x-e.x)/(d||1);dy=(p.y-e.y)/(d||1)}else{if(now>e.wanderAt){e.wander=rand(0,Math.PI*2);e.wanderAt=now+rand(900,2200)}dx=Math.cos(e.wander)*.45;dy=Math.sin(e.wander)*.45}e.x=clamp(e.x+dx*e.type.speed*dt,30,WORLD.w-30);e.y=clamp(e.y+dy*e.type.speed*dt,30,WORLD.h-30);if(d<e.type.r+22&&now-e.attackAt>900){e.attackAt=now;damagePlayer(e.type.dmg)}}for(let i=state.respawns.length-1;i>=0;i--){if(now>=state.respawns[i].at){state.enemies.push(spawnEnemy(state.respawns[i].type,Math.floor(rand(0,5))));state.respawns.splice(i,1)}}if(state.enemies.length<5&&state.respawns.length===0&&now>spawnTimer){const missing=enemyTypes.find(t=>!state.enemies.some(e=>e.type.id===t.id))||enemyTypes[Math.floor(rand(0,enemyTypes.length))];state.enemies.push(spawnEnemy(missing,Math.floor(rand(0,5))));spawnTimer=now+3000}const cw=canvas.clientWidth,ch=canvas.clientHeight;state.camera.x=clamp(p.x-cw/2,0,Math.max(0,WORLD.w-cw));state.camera.y=clamp(p.y-ch/2,0,Math.max(0,WORLD.h-ch));if(ui.sheet.classList.contains('open')&&now%700<20)renderCraft();autoSaveTimer+=dt;if(autoSaveTimer>5){autoSaveTimer=0;if(state.dirty)saveGame(false)}}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function drawGrid(camX,camY,w,h){ctx.fillStyle='#25452f';ctx.fillRect(0,0,w,h);ctx.strokeStyle='rgba(201,241,211,.035)';ctx.lineWidth=1;const step=80;for(let x=(-camX%step);x<w;x+=step){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=(-camY%step);y<h;y+=step){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}for(let i=0;i<16;i++){const sx=((i*173)%WORLD.w)-camX,sy=((i*97+250)%WORLD.h)-camY;if(sx>-20&&sy>-20&&sx<w+20&&sy<h+20){ctx.fillStyle='rgba(123,220,167,.11)';ctx.beginPath();ctx.arc(sx,sy,3+(i%3),0,Math.PI*2);ctx.fill()}}}
function drawTree(n,cx,cy){const x=n.x-cx,y=n.y-cy;ctx.fillStyle='#6d4a2d';ctx.fillRect(x-6,y-1,12,27);ctx.fillStyle='#33734a';ctx.beginPath();ctx.arc(x,y-10,20,0,Math.PI*2);ctx.arc(x-14,y-2,14,0,Math.PI*2);ctx.arc(x+14,y-1,14,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#86d39455';ctx.stroke()}
function drawRock(n,cx,cy){const x=n.x-cx,y=n.y-cy;ctx.fillStyle='#85959a';ctx.beginPath();ctx.moveTo(x-18,y+12);ctx.lineTo(x-13,y-9);ctx.lineTo(x,y-18);ctx.lineTo(x+17,y-7);ctx.lineTo(x+20,y+12);ctx.closePath();ctx.fill();ctx.strokeStyle='#d7eef255';ctx.stroke();ctx.fillStyle='#bfe5dc55';ctx.beginPath();ctx.moveTo(x-4,y-10);ctx.lineTo(x+2,y-24);ctx.lineTo(x+8,y-8);ctx.fill()}
function drawBench(cx,cy){if(!state.bench)return;const x=state.bench.x-cx,y=state.bench.y-cy;ctx.fillStyle='#6f4b2c';ctx.fillRect(x-23,y-9,46,18);ctx.fillRect(x-18,y+7,6,17);ctx.fillRect(x+12,y+7,6,17);ctx.strokeStyle='#d7b070';ctx.strokeRect(x-23,y-9,46,18);ctx.fillStyle='#f0ce77';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText('제작대',x,y-16)}
function drawCampfire(c,cx,cy){const x=c.x-cx,y=c.y-cy;ctx.strokeStyle='#91704e';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x-13,y+8);ctx.lineTo(x+13,y-8);ctx.moveTo(x-13,y-8);ctx.lineTo(x+13,y+8);ctx.stroke();ctx.fillStyle='#ff9b45';ctx.beginPath();ctx.moveTo(x,y-20);ctx.quadraticCurveTo(x+15,y-2,x,y+7);ctx.quadraticCurveTo(x-15,y-2,x,y-20);ctx.fill();ctx.fillStyle='#ffd66a';ctx.beginPath();ctx.moveTo(x,y-11);ctx.quadraticCurveTo(x+7,y-1,x,y+4);ctx.quadraticCurveTo(x-7,y-1,x,y-11);ctx.fill()}
function drawEnemy(e,cx,cy){const x=e.x-cx,y=e.y-cy;if(x<-60||y<-60||x>canvas.clientWidth+60||y>canvas.clientHeight+60)return;ctx.save();if(performance.now()<e.hitAt)ctx.globalAlpha=.5;ctx.fillStyle=e.type.color;ctx.strokeStyle='#152018';ctx.lineWidth=3;if(e.type.id==='bat'){ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x-25,y-20,x-15,y+7);ctx.quadraticCurveTo(x,y-4,x+15,y+7);ctx.quadraticCurveTo(x+25,y-20,x,y);ctx.fill();ctx.stroke()}else if(e.type.id==='wolf'){ctx.beginPath();ctx.moveTo(x-20,y+10);ctx.lineTo(x-15,y-14);ctx.lineTo(x-5,y-6);ctx.lineTo(x+7,y-15);ctx.lineTo(x+22,y+7);ctx.lineTo(x+8,y+18);ctx.lineTo(x-10,y+18);ctx.closePath();ctx.fill();ctx.stroke()}else{ctx.beginPath();ctx.arc(x,y,e.type.r,0,Math.PI*2);ctx.fill();ctx.stroke()}ctx.restore();ctx.fillStyle='#07110d';ctx.fillRect(x-22,y-e.type.r-15,44,5);ctx.fillStyle='#e46967';ctx.fillRect(x-22,y-e.type.r-15,44*(Math.max(0,e.hp)/e.maxHp),5);ctx.fillStyle='#f7fff9';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText(e.type.name,x,y+e.type.r+16)}
function drawPlayer(cx,cy,now){const p=state.player,x=p.x-cx,y=p.y-cy;ctx.save();if(now<p.invuln&&Math.floor(now/80)%2===0)ctx.globalAlpha=.45;ctx.fillStyle='#e3c9a8';ctx.beginPath();ctx.arc(x,y-12,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#496e9b';roundRect(x-12,y-3,24,27,7);ctx.fill();ctx.fillStyle='#302735';ctx.fillRect(x-10,y+22,7,13);ctx.fillRect(x+3,y+22,7,13);const w=currentWeapon();if(w){ctx.strokeStyle=w.id==='wood-sword'?'#b9824f':'#d8e2e5';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x+8,y+4);ctx.lineTo(x+8+p.faceX*25,y+4+p.faceY*25);ctx.stroke()}if(p.shield){ctx.fillStyle=p.shield==='wood-shield'?'#8c633e':'#9aa9ae';ctx.beginPath();ctx.arc(x-12,y+7,9,Math.PI/2,Math.PI*1.5);ctx.lineTo(x-12,y+16);ctx.fill()}if(now<p.attackFx){ctx.strokeStyle='#f8e49d';ctx.lineWidth=5;ctx.beginPath();const ang=Math.atan2(p.faceY,p.faceX);ctx.arc(x,y,(w?.range||66)*.75,ang-.55,ang+.55);ctx.stroke()}ctx.restore()}
function draw(){const w=canvas.clientWidth,h=canvas.clientHeight,cx=state.camera.x,cy=state.camera.y,now=performance.now();drawGrid(cx,cy,w,h);ctx.strokeStyle='rgba(146,213,167,.16)';ctx.lineWidth=4;ctx.beginPath();ctx.arc(WORLD.w/2-cx,WORLD.h/2-cy,110,0,Math.PI*2);ctx.stroke();for(const n of state.trees)if(!n.dead)drawTree(n,cx,cy);for(const n of state.rocks)if(!n.dead)drawRock(n,cx,cy);drawBench(cx,cy);for(const c of state.campfires)drawCampfire(c,cx,cy);for(const e of state.enemies)drawEnemy(e,cx,cy);drawPlayer(cx,cy,now)}
function resize(){const dpr=Math.min(2,window.devicePixelRatio||1),w=innerWidth,h=innerHeight;canvas.width=Math.floor(w*dpr);canvas.height=Math.floor(h*dpr);canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
function loop(now){const dt=Math.min(.033,(now-state.last)/1000);state.last=now;update(dt,now);draw();requestAnimationFrame(loop)}
function saveGame(manual=true){try{const p=state.player;localStorage.setItem(SAVE_KEY,JSON.stringify({v:1,player:{x:p.x,y:p.y,hp:p.hp,wood:p.wood,stone:p.stone,kills:p.kills,weapon:p.weapon,axe:p.axe,pick:p.pick,shield:p.shield},bench:state.bench,campfires:state.campfires.slice(-8)}));state.dirty=false;if(manual)showNotice('저장 완료')}catch(err){if(manual)showNotice('저장하지 못했어')}}
function loadGame(){try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return;const s=JSON.parse(raw);if(!s||s.v!==1)return;const p=s.player||{};Object.assign(state.player,{x:clamp(Number(p.x)||WORLD.w/2,25,WORLD.w-25),y:clamp(Number(p.y)||WORLD.h/2,25,WORLD.h-25),hp:clamp(Number(p.hp)||100,1,100),wood:Math.max(0,Number(p.wood)||0),stone:Math.max(0,Number(p.stone)||0),kills:Math.max(0,Number(p.kills)||0),weapon:recipes.some(r=>r.id===p.weapon)?p.weapon:null,axe:recipes.some(r=>r.id===p.axe)?p.axe:null,pick:recipes.some(r=>r.id===p.pick)?p.pick:null,shield:recipes.some(r=>r.id===p.shield)?p.shield:null});if(s.bench&&Number.isFinite(s.bench.x)&&Number.isFinite(s.bench.y))state.bench={x:s.bench.x,y:s.bench.y};if(Array.isArray(s.campfires))state.campfires=s.campfires.filter(c=>Number.isFinite(c.x)&&Number.isFinite(c.y)).slice(-8)}catch(err){}}
window.addEventListener('resize',resize);window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();state.keys.add(e.code);if(e.code==='Space')attack();if(e.code==='KeyE')gather();if(e.code==='KeyC')toggleCraft()});window.addEventListener('keyup',e=>state.keys.delete(e.code));
document.getElementById('attackBtn').addEventListener('pointerdown',e=>{e.preventDefault();attack()});document.getElementById('gatherBtn').addEventListener('pointerdown',e=>{e.preventDefault();gather()});document.getElementById('craftBtn').addEventListener('click',()=>toggleCraft());document.getElementById('closeSheet').addEventListener('click',()=>toggleCraft(false));document.getElementById('saveBtn').addEventListener('click',()=>saveGame(true));
const stick=document.getElementById('stick'),knob=document.getElementById('knob');let stickPointer=null;function moveStick(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.31,m=Math.hypot(dx,dy),k=m>max?max/m:1;const x=dx*k,y=dy*k;state.stick.x=x/max;state.stick.y=y/max;knob.style.transform=`translate(${x}px,${y}px)`}function endStick(e){if(stickPointer!==e.pointerId)return;stickPointer=null;state.stick.x=0;state.stick.y=0;knob.style.transform='translate(0,0)'}stick.addEventListener('pointerdown',e=>{stickPointer=e.pointerId;stick.setPointerCapture(e.pointerId);moveStick(e)});stick.addEventListener('pointermove',e=>{if(stickPointer===e.pointerId)moveStick(e)});stick.addEventListener('pointerup',endStick);stick.addEventListener('pointercancel',endStick);
window.addEventListener('pagehide',()=>saveGame(false));
loadGame();initWorld();resize();updateHud();showNotice('나무와 돌을 모아 제작대부터 만들어');requestAnimationFrame(loop);
})();
</script>
