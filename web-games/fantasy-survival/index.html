function initWorld(){
  state.trees=Array.from({length:420},(_,i)=>makeNode('tree',i));
  state.rocks=Array.from({length:340},(_,i)=>makeNode('rock',i));
  state.fibers=Array.from({length:440},(_,i)=>makeNode('fiber',i));
  state.irons=Array.from({length:95},(_,i)=>makeNode('iron',i));
  state.enemies=[];
  const counts={mossboar:18,golem:10,goblin:18,shadowwolf:15,fairy:8};
  for(const [id,count] of Object.entries(counts))for(let i=0;i<count;i++)state.enemies.push(spawnCreature(creatures[id],i));
  const starter=[
    ['mossboar',START.x-260,START.y-130],
    ['mossboar',START.x+310,START.y+90],
    ['golem',START.x-390,START.y+260],
    ['goblin',START.x+450,START.y-210],
    ['goblin',START.x-490,START.y-310],
    ['shadowwolf',START.x+575,START.y+325]
  ];
  for(const [id,x,y] of starter)state.enemies.push(spawnAt(creatures[id],x,y));
  const bearCount=3+Math.floor(Math.random()*3);
  for(let i=0;i<bearCount;i++){
    const p=randomWorldTreePoint();
    if(dist(p.x,p.y,WORLD_TREE.x,WORLD_TREE.y)<180){p.x=clamp(p.x+300,260,5740)}
    state.enemies.push(spawnAt(creatures.worldtreebear,p.x,p.y,null));
  }
  const canyonPacks=[
    {x:4250,y:1250},
    {x:5050,y:2200},
    {x:5450,y:3250}
  ];
  canyonPacks.forEach((anchor,pack)=>{
    const a=pointInPoly(anchor.x,anchor.y)&&!pointInWorldTree(anchor.x,anchor.y)?anchor:randomCanyonPoint();
    for(let i=0;i<3;i++){
      const angle=i*Math.PI*2/3,rad=55;
      const x=a.x+Math.cos(angle)*rad,y=a.y+Math.sin(angle)*rad;
      state.enemies.push(spawnAt(creatures.ironspirit,x,y,pack));
    }
  });
}

function gather(){

}

function monsterTargetForIronSpirit(e){
  let best=null,bestD=e.type.detect||860;
  for(const other of state.enemies){
    if(other===e||other.hp<=0||other.area!==e.area||other.type.id==='ironspirit'||other.type.boss)continue;
    const d=dist(e.x,e.y,other.x,other.y);
    if(d<bestD){best=other;bestD=d}
  }
  return best?{target:best,d:bestD}:null
}
function damageMonster(target,amount,attacker,now){
  if(!target||target.hp<=0)return;
  target.hp-=amount;
  target.hitAt=now+110;
  target.hostile=true;
  if(attacker?.type?.id==='ironspirit'&&target.type.id!=='ironspirit')target.enemyTarget=attacker;
  if(target.hp<=0){
    target.hp=0;
    target.enemyTarget=null;
    state.respawns.push({typeId:target.type.id,packId:target.packId,at:now+12000});
  }
}
function chaseMonster(e,target,now){
  if(!target||target.hp<=0)return null;
  const d=dist(e.x,e.y,target.x,target.y);
  let vx=(target.x-e.x)/(d||1)*e.type.speed,vy=(target.y-e.y)/(d||1)*e.type.speed;
  if(d<e.type.r+target.type.r+8&&now-e.attackAt>(e.type.attackCooldown||900)){
    e.attackAt=now;
    damageMonster(target,e.type.dmg,e,now);
  }
  return{vx,vy}
}

   return{vx:0,vy:0}
 }
 if(s.mode==='telegraph-triple'){
   setBossBanner('3연참 예고 · 1초 간격');
   if(now>=s.telegraphUntil&&s.hitIndex===0){s.hitIndex=1;s.nextHitAt=now}

     if(d<135)damagePlayer(20);
     s.hitIndex++;s.nextHitAt=now+1000;
     if(s.hitIndex>3){s.mode='idle';s.nextAt=now+rand(2000,3000);setBossBanner('')}
   }
   return{vx:0,vy:0}
 }
 setBossBanner('');
 if(d>110){return{vx:(p.x-e.x)/(d||1)*e.type.speed,vy:(p.y-e.y)/(d||1)*e.type.speed}}
 if(now>=s.nextAt){
   if(Math.random()<.30){s.mode='telegraph-triple';s.telegraphUntil=now+700;s.hitIndex=0}

function update(dt,now){
  const p=state.player;
  let mx=(state.keys.has('KeyD')||state.keys.has('ArrowRight')?1:0)-(state.keys.has('KeyA')||state.keys.has('ArrowLeft')?1:0)+state.stick.x,
      my=(state.keys.has('KeyS')||state.keys.has('ArrowDown')?1:0)-(state.keys.has('KeyW')||state.keys.has('ArrowUp')?1:0)+state.stick.y,
      m=Math.hypot(mx,my);
  if(m>.01){
    mx/=Math.max(1,m);my/=Math.max(1,m);
    if(state.area==='underground'){p.x=clamp(p.x+mx*p.speed*dt,1150,4850);p.y=clamp(p.y+my*p.speed*dt,900,3450)}else{p.x=clamp(p.x+mx*p.speed*dt,24,WORLD.w-24);p.y=clamp(p.y+my*p.speed*dt,24,WORLD.h-24)}
    p.faceX=mx;p.faceY=my
  }
  if(state.area==='surface'){markExplored();discoverRegion()}
  if(state.area==='surface')for(const n of [...state.trees,...state.rocks,...state.fibers,...state.irons])if(n.dead&&now>=n.respawnAt){n.dead=false;n.hp=n.maxHp}
  if(p.regenTicks>0&&now>=p.regenNext){p.hp=Math.min(p.maxHp,p.hp+10);p.regenTicks--;p.regenNext=now+1000;state.dirty=true;updateHud()}
  for(const e of state.enemies){
    if(e.hp<=0||e.area!==state.area)continue;
    const playerD=dist(e.x,e.y,p.x,p.y);
    let vx=0,vy=0,monsterFight=false;
    if(e.type.boss){const b=updateBoss(e,p,now);vx=b.vx;vy=b.vy;monsterFight=true}
    if(!e.type.boss&&now<(e.stunnedUntil||0)){vx=0;vy=0;monsterFight=true}

    if(!monsterFight&&e.type.id==='ironspirit'){
      const pick=monsterTargetForIronSpirit(e);
      if(pick){
        e.enemyTarget=pick.target;
        const chase=chaseMonster(e,pick.target,now);
        if(chase){vx=chase.vx;vy=chase.vy;monsterFight=true}
      }else{
        e.enemyTarget=null;
      }
    }else if(!monsterFight&&e.enemyTarget){
      if(e.enemyTarget.hp<=0){
        e.enemyTarget=null;
      }else{
        const chase=chaseMonster(e,e.enemyTarget,now);
        if(chase){vx=chase.vx;vy=chase.vy;monsterFight=true}
      }
    }

    if(!monsterFight){
      if(e.type.mood==='harmless'){
        if(now>e.wanderAt){e.wanderAt=now+rand(800,1800);e.wander+=rand(-1.6,1.6)}
        vx=Math.cos(e.wander)*e.type.speed*.35;vy=Math.sin(e.wander)*e.type.speed*.35
      }else if(e.hostile&&playerD<(e.type.detect||430)){
        vx=(p.x-e.x)/(playerD||1)*e.type.speed;vy=(p.y-e.y)/(playerD||1)*e.type.speed;
        if(playerD<e.type.r+25&&now-e.attackAt>(e.type.attackCooldown||900)){e.attackAt=now;damagePlayer(e.type.dmg)}
      }else{
        if(now>e.wanderAt){e.wanderAt=now+rand(900,2200);e.wander+=rand(-1.2,1.2)}
        vx=Math.cos(e.wander)*e.type.speed*.28;vy=Math.sin(e.wander)*e.type.speed*.28
      }
    }

    if(e.type.canyon&&!monsterFight&&playerD>=(e.type.detect||860)){
      const mates=state.enemies.filter(m=>m!==e&&m.hp>0&&m.packId===e.packId);
      if(mates.length){
        const cx=mates.reduce((s,m)=>s+m.x,0)/mates.length,cy=mates.reduce((s,m)=>s+m.y,0)/mates.length,cd=dist(e.x,e.y,cx,cy);
        if(cd>85){vx+=(cx-e.x)/(cd||1)*e.type.speed*.55;vy+=(cy-e.y)/(cd||1)*e.type.speed*.55}
      }
      if(!pointInPoly(e.x,e.y)){
        const sd=dist(e.x,e.y,e.spawnX,e.spawnY);
        vx+=(e.spawnX-e.x)/(sd||1)*e.type.speed*.8;vy+=(e.spawnY-e.y)/(sd||1)*e.type.speed*.8
      }
    }
    e.x=clamp(e.x+vx*dt,35,WORLD.w-35);
    e.y=clamp(e.y+vy*dt,35,WORLD.h-35)
  }
  for(let i=state.respawns.length-1;i>=0;i--)if(now>=state.respawns[i].at){
    const r=state.respawns[i],type=creatures[r.typeId];
    if(type&&!type.boss){
      let anchor=null;
      if(type.canyon&&r.packId!==null&&r.packId!==undefined){
        const mates=state.enemies.filter(m=>m.hp>0&&m.packId===r.packId);
        anchor=mates.length?{x:mates.reduce((s,m)=>s+m.x,0)/mates.length,y:mates.reduce((s,m)=>s+m.y,0)/mates.length}:randomCanyonPoint()
      }
      state.enemies.push(spawnCreature(type,Math.random()*20,anchor,r.packId??null))
    }
    state.respawns.splice(i,1)
  }
  state.enemies=state.enemies.filter(e=>e.hp>0);
  finishSmeltIfReady();
  if(ui.smeltPanel.classList.contains('open')){if(!nearFurnace())ui.smeltPanel.classList.remove('open');else updateSmeltUi()}
  state.camera.x=clamp(p.x-innerWidth/2,0,Math.max(0,WORLD.w-innerWidth));
  state.camera.y=clamp(p.y-innerHeight/2,0,Math.max(0,WORLD.h-innerHeight));
  autosave+=dt;
  if(autosave>10&&state.dirty){autosave=0;saveGame(false)}
  if(ui.sheet.classList.contains('open')&&Math.floor(now/700)!==Math.floor((now-dt*1000)/700))renderPanel();
  updateHud()
}

function drawNode(n,cx,cy){const x=n.x-cx,y=n.y-cy;if(x<-40||y<-40||x>innerWidth+40||y>innerHeight+40)return;if(n.kind==='tree'){ctx.fillStyle='#6f4f32';ctx.fillRect(x-5,y,10,28);ctx.fillStyle='#4e8f58';ctx.beginPath();ctx.arc(x,y-8,21,0,Math.PI*2);ctx.fill()}else if(n.kind==='rock'){ctx.fillStyle='#95a4a5';ctx.beginPath();ctx.moveTo(x-18,y+12);ctx.lineTo(x-12,y-12);ctx.lineTo(x+7,y-18);ctx.lineTo(x+20,y+8);ctx.closePath();ctx.fill()}else if(n.kind==='iron'){ctx.fillStyle='#59646b';ctx.beginPath();ctx.moveTo(x-18,y+13);ctx.lineTo(x-10,y-15);ctx.lineTo(x+8,y-19);ctx.lineTo(x+20,y+9);ctx.closePath();ctx.fill();ctx.fillStyle='#c1d0d8';ctx.fillRect(x-7,y-7,6,5);ctx.fillRect(x+5,y+1,7,5)}else{ctx.strokeStyle='#76b96f';ctx.lineWidth=3;for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(x,y+13);ctx.quadraticCurveTo(x+i*6,y,x+i*7,y-13);ctx.stroke()}}}
function drawStructure(s,cx,cy,type){if(!s)return;const x=s.x-cx,y=s.y-cy;if(x<-80||y<-80||x>innerWidth+80||y>innerHeight+80)return;ctx.textAlign='center';if(type==='bench'){ctx.fillStyle='#8d663f';ctx.fillRect(x-25,y-12,50,24);ctx.fillStyle='#ccb07a';ctx.fillRect(x-28,y-15,56,8);ctx.fillStyle='#fff1bf';ctx.font='bold 9px system-ui';ctx.fillText('제작대',x,y+28)}else if(type==='furnace'){ctx.fillStyle='#3b342f';roundRect(x-24,y-20,48,42,10);ctx.fill();ctx.fillStyle='#e07139';ctx.beginPath();ctx.arc(x,y+5,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffe1bd';ctx.font='bold 9px system-ui';ctx.fillText('화로 · 두 번 누르기',x,y+34)}else{ctx.fillStyle='#59666b';ctx.fillRect(x-27,y-13,54,26);ctx.fillStyle='#aebdc2';ctx.fillRect(x-30,y-17,60,8);ctx.fillStyle='#dce8ec';ctx.font='bold 9px system-ui';ctx.fillText('철 제작대',x,y+29)}}
function drawCreature(e,cx,cy){const x=e.x-cx,y=e.y-cy;if(x<-55||y<-55||x>innerWidth+55||y>innerHeight+55)return;ctx.save();if(performance.now()<e.hitAt)ctx.globalAlpha=.5;ctx.fillStyle=e.type.color;ctx.strokeStyle='#18221a';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,e.type.r,0,Math.PI*2);ctx.fill();ctx.stroke();if(e.type.id==='fairy'){ctx.strokeStyle='#fffbd0';ctx.beginPath();ctx.arc(x,y,e.type.r+6,0,Math.PI*2);ctx.stroke()}if(e.type.id==='ironspirit'){ctx.strokeStyle='#d9e6eb';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,e.type.r-6,0,Math.PI*2);ctx.stroke()}if(e.type.id==='worldtreebear'){ctx.fillStyle='#8b6747';ctx.beginPath();ctx.arc(x-19,y-22,9,0,Math.PI*2);ctx.arc(x+19,y-22,9,0,Math.PI*2);ctx.fill()}if(e.type.boss){const s=e.bossState;if(s?.mode?.startsWith('telegraph')){ctx.globalAlpha=.22;ctx.fillStyle=s.mode==='telegraph-triple'?'#ff466f':'#9cffb0';for(let i=1;i<=3;i++){ctx.beginPath();ctx.arc(x-i*18,y+i*7,e.type.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.strokeStyle=s.mode==='telegraph-triple'?'#ff6689':'#a8ffc0';ctx.lineWidth=5;ctx.beginPath();ctx.arc(x,y,e.type.r+16,0,Math.PI*2);ctx.stroke()}}ctx.restore();if(e.type.mood!=='harmless'){ctx.fillStyle='#07100d';ctx.fillRect(x-21,y-e.type.r-13,42,4);ctx.fillStyle=e.type.mood==='aggressive'?'#e65f66':'#e1b85f';ctx.fillRect(x-21,y-e.type.r-13,42*Math.max(0,e.hp/e.maxHp),4)}ctx.fillStyle='#f4fff7';ctx.font='bold 9px system-ui';ctx.textAlign='center';ctx.fillText(e.type.name,x,y+e.type.r+14)}
function drawPlayer(cx,cy,now){const p=state.player,x=p.x-cx,y=p.y-cy;ctx.save();if(now<p.invuln&&Math.floor(now/80)%2===0)ctx.globalAlpha=.45;ctx.fillStyle='#e0c4a4';ctx.beginPath();ctx.arc(x,y-11,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#4d7398';roundRect(x-11,y-2,22,25,6);ctx.fill();ctx.fillStyle='#302c36';ctx.fillRect(x-9,y+21,6,12);ctx.fillRect(x+3,y+21,6,12);if(p.weapon){ctx.strokeStyle=p.weapon.startsWith('iron-')?'#d8e3e8':p.weapon==='stone-sword'?'#c9d0d2':'#b78652';ctx.lineWidth=p.weapon==='iron-axe'?7:5;ctx.beginPath();ctx.moveTo(x+7,y+4);ctx.lineTo(x+7+p.faceX*27,y+4+p.faceY*27);ctx.stroke()}if(p.armor){ctx.strokeStyle='#d5cf9b';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y+8,14,0,Math.PI);ctx.stroke()}if(now<p.attackFx){ctx.strokeStyle='#f7e699';ctx.lineWidth=4;ctx.beginPath();const a=Math.atan2(p.faceY,p.faceX);ctx.arc(x,y,currentRange()*.72,a-.55,a+.55);ctx.stroke()}ctx.restore()}
function draw(){const cx=state.camera.x,cy=state.camera.y,now=performance.now();if(state.area==='underground')drawCave(cx,cy,innerWidth,innerHeight);else{drawBackground(cx,cy,innerWidth,innerHeight);for(const n of state.trees)if(!n.dead)drawNode(n,cx,cy);for(const n of state.rocks)if(!n.dead)drawNode(n,cx,cy);for(const n of state.fibers)if(!n.dead)drawNode(n,cx,cy);for(const n of state.irons)if(!n.dead)drawNode(n,cx,cy);drawStructure(state.bench,cx,cy,'bench');drawStructure(state.furnace,cx,cy,'furnace');drawStructure(state.ironBench,cx,cy,'ironbench')}for(const e of state.enemies)if(e.area===state.area)drawCreature(e,cx,cy);drawPlayer(cx,cy,now)}
function resize(){const d=Math.min(2,devicePixelRatio||1);canvas.width=Math.floor(innerWidth*d);canvas.height=Math.floor(innerHeight*d);canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(d,0,0,d,0,0)}function loop(now){const dt=Math.min(.033,(now-state.last)/1000);state.last=now;update(dt,now);draw();requestAnimationFrame(loop)}
function saveGame(manual=true){try{const p=state.player;localStorage.setItem(SAVE_KEY,JSON.stringify({v:SAVE_VERSION,player:{x:p.x,y:p.y,hp:p.hp,maxHp:p.maxHp,wood:p.wood,stone:p.stone,fiber:p.fiber,ironOre:p.ironOre,ironIngot:p.ironIngot,kills:p.kills,weapon:p.weapon,tool:p.tool,armor:p.armor,torch:p.torch,map:p.map,root:p.root,inventory:p.inventory},bench:state.bench,furnace:state.furnace,ironBench:state.ironBench,smelting:state.smelting,discovered:state.discovered,explored:state.explored,area:state.area,surfacePos:state.surfacePos,rootTaken:state.rootTaken,altarUsed:state.altarUsed,bossSummoned:state.bossSummoned,bossDefeated:state.bossDefeated,bestiary:state.bestiary}));state.dirty=false;if(manual)showNotice('저장 완료')}catch(e){if(manual)showNotice('저장 실패')}}
function ensureEquippedInInventory(){const p=state.player;for(const id of [p.weapon,p.tool,p.armor])if(id&&item(id)&&invCount(id)<1)p.inventory[id]=1}
function loadGame(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(!s||!s.player)return;const o=s.player,p=state.player,version=Number(s.v)||1,legacyScale=version<3,scale=legacyScale?2.5:(version<6?.5:1),ox=Number(o.x),oy=Number(o.y);p.x=clamp((Number.isFinite(ox)?ox:(legacyScale?1200:START.x))*scale,25,WORLD.w-25);p.y=clamp((Number.isFinite(oy)?oy:(legacyScale?800:START.y))*scale,25,WORLD.h-25);p.wood=Math.max(0,Number(o.wood)||0);p.stone=Math.max(0,Number(o.stone)||0);p.fiber=Math.max(0,Number(o.fiber)||0);p.ironOre=Math.max(0,Number(o.ironOre)||0);p.ironIngot=Math.max(0,Number(o.ironIngot)||0);p.kills=Math.max(0,Number(o.kills)||0);p.inventory=o.inventory&&typeof o.inventory==='object'?{...o.inventory}:{};p.weapon=item(o.weapon)?.kind==='weapon'?o.weapon:(o.weapon==='wood-sword'?'wood-spear':null);p.tool=item(o.tool)?.kind==='tool'?o.tool:(item(o.axe)?.kind==='tool'?o.axe:(item(o.pick)?.kind==='tool'?o.pick:null));p.armor=item(o.armor)?.kind==='armor'?o.armor:(o.shield==='stone-shield'?'rune-shield':null);p.torch=!!o.torch;p.map=!!o.map;p.root=Math.max(0,Number(o.root)||0);p.maxHp=p.armor==='forest-armor'?140:100;p.hp=clamp(Number(o.hp)||p.maxHp,1,p.maxHp);ensureEquippedInInventory();const loadPos=obj=>{if(!obj||!Number.isFinite(Number(obj.x))||!Number.isFinite(Number(obj.y)))return null;return{x:clamp(Number(obj.x)*scale,35,WORLD.w-35),y:clamp(Number(obj.y)*scale,35,WORLD.h-35)}};state.bench=loadPos(s.bench);state.furnace=loadPos(s.furnace);state.ironBench=loadPos(s.ironBench);if(s.smelting&&Number(s.smelting.endAt)>0)state.smelting.endAt=Number(s.smelting.endAt);state.discovered={canyon:!!s.discovered?.canyon,worldtree:!!s.discovered?.worldtree};state.explored=s.explored&&typeof s.explored==='object'?{...s.explored}:{};state.area=s.area==='underground'?'underground':'surface';state.surfacePos=s.surfacePos&&Number.isFinite(Number(s.surfacePos.x))?{x:clamp(Number(s.surfacePos.x),25,WORLD.w-25),y:clamp(Number(s.surfacePos.y),25,WORLD.h-25)}:{x:START.x,y:START.y};state.rootTaken=!!s.rootTaken;state.altarUsed=!!s.altarUsed;state.bossSummoned=!!s.bossSummoned;state.bossDefeated=!!s.bossDefeated;state.bestiary=s.bestiary&&typeof s.bestiary==='object'?{...s.bestiary}:{};if(state.bossSummoned&&!state.bossDefeated){const boss=spawnAt(creatures.rootsovereign,3000,1550,null);boss.area='underground';boss.bossState={mode:'idle',nextAt:performance.now()+1000,telegraphUntil:0,hitIndex:0,nextHitAt:0};state.enemies.push(boss)}if(version<SAVE_VERSION)state.dirty=true;finishSmeltIfReady()}catch(e){}}
window.addEventListener('resize',resize);window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();state.keys.add(e.code);if(e.code==='Space')attack();if(e.code==='KeyE')gather();if(e.code==='KeyC')openCraft();if(e.code==='KeyI')openInventory();if(e.code==='KeyM')openMap()});window.addEventListener('keyup',e=>state.keys.delete(e.code));document.getElementById('attack').addEventListener('pointerdown',e=>{e.preventDefault();attack()});document.getElementById('gather').addEventListener('pointerdown',e=>{e.preventDefault();gather()});document.getElementById('craft').addEventListener('click',()=>openCraft());document.getElementById('inventory').addEventListener('click',()=>openInventory());ui.mapBtn.addEventListener('click',openMap);document.getElementById('close').addEventListener('click',closeSheet);document.getElementById('save').addEventListener('click',()=>saveGame(true));ui.bestiaryBtn.addEventListener('click',openBestiary);ui.handTab.addEventListener('click',()=>openCraft('hand'));ui.benchTab.addEventListener('click',()=>openCraft('bench'));ui.ironBenchTab.addEventListener('click',()=>openCraft('ironbench'));ui.inventoryTab.addEventListener('click',openInventory);ui.mapTab.addEventListener('click',openMap);ui.smeltBtn.addEventListener('click',startSmelt);document.getElementById('smeltClose').addEventListener('click',()=>ui.smeltPanel.classList.remove('open'));canvas.addEventListener('pointerdown',handleWorldTap);
const stick=document.getElementById('stick'),knob=document.getElementById('knob');let sp=null;function moveStick(e){const r=stick.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,max=r.width*.3,m=Math.hypot(dx,dy),k=m>max?max/m:1,x=dx*k,y=dy*k;state.stick.x=x/max;state.stick.y=y/max;knob.style.transform=`translate(${x}px,${y}px)`}function endStick(e){if(sp!==e.pointerId)return;sp=null;state.stick.x=state.stick.y=0;knob.style.transform='translate(0,0)'}stick.addEventListener('pointerdown',e=>{e.preventDefault();sp=e.pointerId;stick.setPointerCapture(e.pointerId);moveStick(e)});stick.addEventListener('pointermove',e=>{if(sp===e.pointerId){e.preventDefault();moveStick(e)}});stick.addEventListener('pointerup',endStick);stick.addEventListener('pointercancel',endStick);window.addEventListener('pagehide',()=>saveGame(false));
initWorld();loadGame();markExplored();discoverRegion();resize();updateHud();requestAnimationFrame(loop);showNotice('가방이 생겼어 · 동쪽 철 협곡에서 철을 찾아봐');
})();
