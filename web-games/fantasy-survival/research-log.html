<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>마력숲 연구 일지 · 1화</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030a07;color:#e5f4e6;font-family:system-ui,sans-serif}canvas{width:100%;height:100%;display:block}#noise,#black,#white,#caption{position:fixed;inset:0;pointer-events:none}#noise{opacity:0;image-rendering:pixelated;mix-blend-mode:screen}#black{background:#000;opacity:0}#white{background:white;opacity:0}#caption{z-index:5;display:none;align-items:center;justify-content:center;flex-direction:column;color:#19251b;text-align:center;font-size:clamp(19px,4.5vw,34px);font-weight:800}#caption p{opacity:0;transition:opacity 1s}#rec{position:fixed;top:15px;left:14px;text-shadow:0 2px 4px #000;font-size:11px}#rec b{color:#f66}#start,#end{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:radial-gradient(circle,#19422a,#040b07);text-align:center}#end{display:none;background:#fff;color:#1a291f}.panel{max-width:430px;padding:26px;border:1px solid #719b7766;border-radius:16px;background:#08180f}.panel p{font-size:13px;line-height:1.8;color:#bed1bf}button{width:100%;height:50px;border:0;border-radius:9px;color:#fff;background:#397552;font:inherit;font-weight:800}.back{display:block;color:#b7daba;margin-top:20px;text-decoration:none}#end .panel{background:#fff}#end .panel p{color:#506252}#end .back{color:#42634b}</style></head><body>
<canvas id="scene"></canvas><canvas id="noise"></canvas><div id="black"></div><div id="white"></div><div id="rec"><b>●</b> 연구원 01 · 세계수 내부 · <span id="clock">00:00</span></div><div id="caption"><p id="l1">저희는 도저히 안 되겠다 싶었고</p><p id="l2">결국 지원을 보냈습니다.</p></div>
<div id="start"><div class="panel"><small>연구 기록 01</small><h1>마력숲 연구 일지</h1><p>세계수 내부. 돌 창을 든 연구원 한 명의<br>1인칭 3D 기록.</p><button id="play">1화 재생</button><a class="back" href="./">마력숲 본편</a></div></div><div id="end"><div class="panel"><h1>연구 기록 종료</h1><p>지원 요청이 전달됐어.</p><button id="again">다시 보기</button><a class="back" href="./">마력숲 본편</a></div></div>
<script>
(()=>{'use strict';
const E=id=>document.getElementById(id),gl=E('scene').getContext('webgl',{alpha:false,depth:true});if(!gl){E('start').querySelector('p').textContent='이 기기에서는 3D 영상 재생이 지원되지 않아.';E('play').disabled=true;return}
const vertex='attribute vec3 p;attribute vec3 c;uniform vec3 eye;uniform vec2 rot;uniform float aspect;varying vec3 tint;void main(){vec3 a=p-eye;float k=cos(rot.x),s=sin(rot.x);vec3 b=vec3(k*a.x-s*a.z,a.y,s*a.x+k*a.z);float q=cos(rot.y),r=sin(rot.y);vec3 d=vec3(b.x,q*b.y-r*b.z,r*b.y+q*b.z);float z=-d.z;gl_Position=vec4(d.x*1.7/aspect,d.y*1.7,z*1.012-.15,z);tint=mix(c,vec3(.012,.044,.025),clamp((length(a)-3.)/26.,0.,.87));}';
const frag='precision mediump float;varying vec3 tint;void main(){gl_FragColor=vec4(tint,1.);}';
function shader(type,source){let x=gl.createShader(type);gl.shaderSource(x,source);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(x));return x}
let pg=gl.createProgram();gl.attachShader(pg,shader(gl.VERTEX_SHADER,vertex));gl.attachShader(pg,shader(gl.FRAGMENT_SHADER,frag));gl.linkProgram(pg);gl.useProgram(pg);gl.enable(gl.DEPTH_TEST);
const loc=n=>gl.getUniformLocation(pg,n),pos=gl.getAttribLocation(pg,'p'),col=gl.getAttribLocation(pg,'c'),buf=gl.createBuffer();let data=[],seed=96;const rnd=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296},smooth=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)},phase=(t,a,b)=>smooth((t-a)/(b-a)),mix=(a,b,t)=>a+(b-a)*t;
function tri(a,b,c,color){for(const p of [a,b,c])data.push(...p,...color)}
function quad(a,b,c,d,color){tri(a,b,c,color);tri(a,c,d,color)}
function rod(a,b,r,color){let dx=b[0]-a[0],dy=b[1]-a[1],dz=b[2]-a[2],l=Math.hypot(dx,dy,dz)||1;let nx=dx/l,ny=dy/l,nz=dz/l,u=[-nz,0,nx],v=[-nx*ny,nx*nx+nz*nz,-ny*nz];for(let i=0;i<7;i++){let ang=i*2*Math.PI/7,bng=(i+1)*2*Math.PI/7,p=(q,f)=>q.map((x,k)=>x+r*(u[k]*Math.cos(f)+v[k]*Math.sin(f)));quad(p(a,ang),p(a,bng),p(b,bng),p(b,ang),color)}}
function globe(x,y,z,r,color){for(let a=0;a<6;a++){let f=a*Math.PI/3,g=(a+1)*Math.PI/3;tri([x,y+r,z],[x+r*Math.cos(f),y,z+r*Math.sin(f)],[x+r*Math.cos(g),y,z+r*Math.sin(g)],color);tri([x,y-r,z],[x+r*Math.cos(g),y,z+r*Math.sin(g)],[x+r*Math.cos(f),y,z+r*Math.sin(f)],color)}}
for(let z=-27;z<12;z+=1.3)for(let x=-6;x<6;x+=1.3)quad([x,-.65,z],[x+1.3,-.65,z],[x+1.3,-.65,z+1.3],[x,-.65,z+1.3],[.05+rnd()*.035,.12+rnd()*.05,.07]);
for(let i=0;i<32;i++){let z=-24+i*1.4,x=(i%2?1:-1)*(4.5+rnd()*.8);rod([x,-.6,z],[x*.7,4.4,z-.8],.54,[.26,.21,.13]);rod([x,2,z],[0,4.4,z-2.0],.2,[.25,.28,.16]);globe(x,1.2,z,1.5,[.09,.18,.1]);}
for(let i=0;i<50;i++){let x=(rnd()-.5)*9,z=rnd()*28-20;globe(x,-.2,z,.14,[.21,.49,.31]);}
const cave=new Float32Array(data);
function snake(x,z,size,t){let prev=[x,-.3,z];for(let i=1;i<14;i++){let f=i/13,next=[x+Math.sin(t*4-f*8)*.36*size,-.24+Math.sin(f*Math.PI)*.13,z+f*1.8*size];rod(prev,next,.18*size,[.14,.52,.25]);prev=next}globe(x+Math.sin(t*4)*.15*size,-.18,z-.2*size,.39*size,[.17,.58,.27]);for(let k of [-1,1])globe(x+k*.22*size,-.08,z-.48*size,.065*size,[.99,.79,.24])}
function draw(a){gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,a,gl.DYNAMIC_DRAW);gl.enableVertexAttribArray(pos);gl.enableVertexAttribArray(col);gl.vertexAttribPointer(pos,3,gl.FLOAT,false,24,0);gl.vertexAttribPointer(col,3,gl.FLOAT,false,24,12);gl.drawArrays(gl.TRIANGLES,0,a.length/6)}
let playing=false,start=0,prev=0,t=0,ended=false,audio,events=new Set();
function tone(f,d=.15){if(!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.type='sawtooth';o.frequency.value=f;g.gain.setValueAtTime(.025,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}
const noise=E('noise'),nx=noise.getContext('2d');noise.width=150;noise.height=90;
function tick(now){requestAnimationFrame(tick);if(!playing)return;if(document.hidden){start+=now-prev;prev=now;return}prev=now;t=(now-start)/1000;let d=Math.min(devicePixelRatio||1,1.4),w=Math.floor(innerWidth*d),h=Math.floor(innerHeight*d),cv=E('scene');if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;gl.viewport(0,0,w,h)}
const down=phase(t,12,17)*(1-phase(t,26,29)),shake=t>37?phase(t,37,43)*.28:.018*phase(t,8,20),z=mix(4.8,1.4,phase(t,0,18));
gl.clearColor(.015,.07,.042,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.uniform3f(loc('eye'),0,1.5+Math.sin(t*7)*.024,z);gl.uniform2f(loc('rot'),Math.sin(t*.6)*.03+(rnd()-.5)*shake,-down*.46+(rnd()-.5)*shake);gl.uniform1f(loc('aspect'),w/h);draw(cave);data=[];
if(t<33)rod([-1.4,-.4,-3],[-.1,.15,-3.8],.23,[.31,.20,.11]);
else if(t<39){let m=phase(t,33,37);rod([-1.4,-.4,-3],[-.1,.15,-3.8],.23*(1-m),[.31,.20,.11]);snake(-1.3,-3,Math.max(.04,m*1.5),t)}
if(t>=13&&t<26)snake(.3,z-2.4,.9,t);
if(t>=38&&t<44)snake(mix(-1.3,0,phase(t,38,41)),mix(-3,z-.4,phase(t,38,41)),1.6,t);
const jab=phase(t,19,20.5);rod([.95,-1.5,z-1],[mix(.65,.1,jab),mix(-.6,.0,jab),z-mix(1.9,2.6,jab)],.07,[.43,.28,.14]);globe(mix(.65,.1,jab),mix(-.6,.0,jab),z-mix(1.9,2.6,jab),.15,[.6,.61,.57]);
draw(new Float32Array(data));
E('white').style.opacity=Math.max(phase(t,23,26)*(1-phase(t,26.5,29)),phase(t,45,45.7));E('black').style.opacity=phase(t,43,45)*(1-phase(t,45,45.6));
const level=phase(t,38,44)*.85;noise.style.opacity=level;noise.width=Math.max(100,Math.floor(innerWidth/5));noise.height=Math.max(70,Math.floor(innerHeight/5));if(level>.01){let im=nx.createImageData(noise.width,noise.height);for(let i=0;i<im.data.length;i+=4){let v=rnd()*255;im.data[i]=v;im.data[i+1]=v;im.data[i+2]=v;im.data[i+3]=150}nx.putImageData(im,0,0)}
E('clock').textContent='00:'+String(Math.floor(Math.min(50,t))).padStart(2,'0');E('rec').style.opacity=t>44?0:1;
for(const sec of [9,14,20,25,34,38,40]){if(t>=sec&&!events.has(sec)){events.add(sec);tone(sec>=38?70:200,.5)}}
if(t>45.7){E('caption').style.display='flex';E('l1').style.opacity=phase(t,46.2,47.1);E('l2').style.opacity=phase(t,47.7,48.8)}
if(t>51&&!ended){ended=true;playing=false;E('end').style.display='grid'}
}
function begin(){events.clear();playing=true;ended=false;start=performance.now();prev=start;t=0;E('start').style.display='none';E('end').style.display='none';E('caption').style.display='none';E('l1').style.opacity=0;E('l2').style.opacity=0;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume()}catch{}}
E('play').onclick=begin;E('again').onclick=begin;requestAnimationFrame(tick);
})();
</script></body></html>
