<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>마력숲 연구 일지 · 3화</title><style>*{box-sizing:border-box}body{margin:0;background:#05080b;color:#edf3f3;font-family:system-ui,sans-serif;overflow:hidden}canvas{width:100vw;height:100dvh;display:block}#ui{position:fixed;inset:0;pointer-events:none}#top{position:absolute;top:15px;left:15px;font-size:12px;color:#cdd}#caption{position:absolute;bottom:8%;width:100%;padding:0 18px;text-align:center;font-weight:700;font-size:clamp(14px,3.8vw,21px);text-shadow:0 2px 8px #000}#overlay{position:absolute;inset:0;background:#000;display:grid;place-items:center;text-align:center;padding:24px;transition:opacity 1s}#intro{max-width:750px;line-height:1.9;font-size:clamp(18px,4.5vw,29px)}#start,#end{position:fixed;inset:0;display:grid;place-items:center;background:#070e12e8;padding:20px;text-align:center}#end{display:none}.panel{width:min(100%,500px);background:#0d2028;border:1px solid #496877;padding:26px;border-radius:16px}button{background:#307e95;border:0;color:white;padding:16px 35px;border-radius:8px;font-size:18px;font-weight:bold}a{color:#9ed7ef}#label{position:absolute;right:16px;top:15px;color:#ffba79;font-size:12px}</style></head><body><canvas id="scene"></canvas><div id="ui"><div id="top">● REC · 연구원 01 · <span id="clock">00:00</span></div><div id="label"></div><div id="caption"></div><div id="overlay"><div id="intro">4번 연구원은 형체를 알아볼 수 없을 정도로 신체의 일부가 사라져 있었으며,<br>몸에서는 다른 생물의 독가스가 남아있었습니다.</div></div></div><div id="start"><div class="panel"><small>연구 기록 03</small><h1>마력숲 연구 일지 · 3화</h1><p>화산의 화염 골렘과 오아시스의 초거대 벌레.<br>연구원 1의 1인칭 기록</p><button id="play">3화 재생</button></div></div><div id="end"><div class="panel"><h1>연구 기록 종료</h1><p>생존자와 연구원들은 초거대 벌레를 쓰러뜨렸다.</p><button id="again">다시 보기</button><p><a href="./research-log.html">1화 보기</a></p></div></div><script>
(()=>{'use strict';const c=document.querySelector('canvas'),ctx=c.getContext('2d'),$=s=>document.querySelector(s);let start=0,playing=false,finished=false;const scenes=[
[0,7,'검은 화면','4번 연구원은 형체를 알아볼 수 없을 정도로 신체의 일부가 사라져 있었으며, 몸에서는 다른 생물의 독가스가 남아있었습니다.'],
[7,17,'연구소','연구원 1: 4번 연구원… 끝내 돌아오지 못했군.'],
[17,24,'연구소','연구원 2: 우리가 반드시 기억할게.'],
[24,31,'연구소','연구원 3: 이제 다음 탐사를 준비하자.'],
[31,40,'화산','화산 방호복 착용 완료. 연구원 1, 2, 3이 화산으로 진입했다.'],
[40,50,'화산','연구원 2: 열기가 엄청나! 앞에 화염 골렘이다!'],
[50,62,'골렘','연구원 1: 거리를 벌려! 사격 개시! …총알이 거의 먹히지 않아!'],
[62,70,'골렘','연구원 3: 으악! 골렘에게 붙잡혔어!'],
[70,79,'골렘','생존자: 비켜! (금 곡괭이가 날아와 골렘 옆구리에 박힌다.)'],
[79,91,'골렘','연구원 1: 2번, 나랑 시선을 끌자! 3번은 생존자에게 양동이를 받아!'],
[91,102,'골렘','연구원 3: 물을 떠 왔어! 핵에 부을게!'],
[102,113,'골렘 붕괴','뜨거운 핵이 식자 골렘의 돌덩어리가 하나씩 부서져 떨어진다!'],
[113,125,'핵','연구원 2: 식은 핵이 약점이다! 세 번 공격해서 화염 골렘을 쓰러뜨렸다!'],
[125,136,'오아시스','연구원 1: 오아시스에 도착했어. 잠시 쉬자.'],
[136,146,'오아시스','연구원 2: 내 다리가! 땅속에서 뭔가 잡아당겨!'],
[146,157,'오아시스','연구원 3과 생존자까지 땅속으로 끌려갔다!'],
[157,169,'거대 벌레','연구원 1: 땅이 흔들려! 피해야 해! 초거대 벌레다!'],
[169,181,'거대 벌레','벌레가 튀어나온 틈에 총을 쏘자 분노하며 땅을 연달아 들이받았다!'],
[181,193,'지하 동굴','지반이 무너졌다! 아래에는 연구원들과 생존자, 수많은 시체가 있었다.'],
[193,207,'최종 전투','연구원 1, 2, 3은 총과 무기를 들고, 생존자는 악어 턱날을 휘두른다!'],
[207,219,'승리','모두 힘을 합쳐 초거대 벌레를 쓰러뜨렸다.']
];function resize(){let d=Math.min(devicePixelRatio||1,1.5);c.width=innerWidth*d;c.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();function polygon(points,color){ctx.fillStyle=color;ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fill()}function circle(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}function person(x,y,s,color){ctx.fillStyle=color;ctx.fillRect(x-9*s,y-23*s,18*s,30*s);circle(x,y-31*s,9*s,'#d4bd9c');ctx.fillStyle='#131e25';ctx.fillRect(x-13*s,y+7*s,10*s,22*s);ctx.fillRect(x+3*s,y+7*s,10*s,22*s)}function golem(x,y,s,cracked){for(let i=0;i<8;i++){let a=i*2.4;ctx.fillStyle=cracked?'#665d52':'#4c3c31';ctx.save();ctx.translate(x+Math.sin(a)*45*s,y+Math.cos(a)*50*s);ctx.rotate(a);ctx.fillRect(-22*s,-24*s,44*s,48*s);ctx.restore()}circle(x,y,30*s,cracked?'#7188a0':'#ff7d13');circle(x,y,17*s,cracked?'#a6c9e5':'#ffeb69')}function worm(x,y,s){ctx.strokeStyle='#77453e';ctx.lineWidth=85*s;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-150*s,y+210*s);ctx.bezierCurveTo(x-90*s,y+50*s,x+90*s,y+110*s,x,y);ctx.stroke();circle(x,y,45*s,'#9d6456');circle(x-13*s,y-5*s,7*s,'#ffda72');circle(x+13*s,y-5*s,7*s,'#ffda72');polygon([[x-30*s,y+20*s],[x,y+55*s],[x+30*s,y+20*s]],'#321a19')}function draw(t,name){const w=innerWidth,h=innerHeight,shift=Math.sin(t*1.9)*3;ctx.save();ctx.translate(0,shift);let volcanic=['화산','골렘','골렘 붕괴','핵'].includes(name),oasis=['오아시스','거대 벌레'].includes(name),lab=name==='연구소';let g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,lab?'#1c3539':volcanic?'#8e3220':oasis?'#428da2':'#26272f');g.addColorStop(1,lab?'#091318':volcanic?'#34100d':oasis?'#c9a46c':'#101014');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);const horizon=h*.67;if(lab){for(let i=0;i<7;i++){ctx.fillStyle='#263e42';ctx.fillRect(i*w/7+8,h*.22,w/9,h*.42);ctx.fillStyle='#82b3ac';ctx.fillRect(i*w/7+15,h*.29,w/13,h*.12)}person(w*.36,h*.67,1.2,'#e8e5d2');person(w*.64,h*.67,1.2,'#d7d3b7');ctx.fillStyle='#889';ctx.fillRect(w*.43,h*.5,w*.14,9)}else{polygon([[0,horizon],[w*.18,h*.4],[w*.35,h*.63],[w*.62,h*.35],[w,horizon]],volcanic?'#54231a':oasis?'#d5b17a':'#28282b');polygon([[0,horizon],[w,horizon],[w,h],[0,h]],volcanic?'#3c2520':oasis?'#bc9b68':'#292a2a');if(oasis){ctx.fillStyle='#43a8b5';ctx.beginPath();ctx.ellipse(w*.5,h*.79,w*.3,h*.09,0,0,Math.PI*2);ctx.fill()}}if(name.includes('골렘')||name==='핵'){golem(w*.5,h*.51,Math.min(w/470,h/600),name!=='골렘');if(t>=70&&t<79){ctx.strokeStyle='#edcb5d';ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(w*.18,h*.34);ctx.lineTo(w*.48,h*.5);ctx.stroke()}if(t>=91&&t<113){ctx.strokeStyle='#83d4f8';ctx.lineWidth=14;for(let i=0;i<8;i++){ctx.beginPath();ctx.moveTo(w*.22+i*5,h*.25);ctx.lineTo(w*.48+i*3,h*.49);ctx.stroke()}}}if(name==='거대 벌레'||name==='최종 전투'||name==='승리')worm(w*.55,h*.53,Math.min(w/520,h/600)*(name==='승리'?.5:1));if(name==='지하 동굴'||name==='최종 전투'||name==='승리'){for(let i=0;i<12;i++){ctx.fillStyle='#a0a0a0';ctx.fillRect((i+.3)*w/13,h*.84,15,5)}person(w*.22,h*.72,.75,'#d7c4a1');person(w*.33,h*.72,.75,'#d7c4a1');person(w*.43,h*.72,.75,'#d7c4a1')}if(!lab&&t>=31){ctx.fillStyle='#1b2226';ctx.fillRect(w*.68,h*.75,w*.08,h*.22);ctx.fillStyle='#56616b';ctx.fillRect(w*.68,h*.75,w*.24,h*.06);ctx.fillStyle='#c2a587';ctx.fillRect(w*.56,h*.83,w*.16,h*.12)}ctx.restore()}function frame(now){if(!playing)return;let t=(now-start)/1000;$('#clock').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0');let sc=scenes.find(s=>t>=s[0]&&t<s[1]);if(!sc){playing=false;$('#end').style.display='grid';return}let black=t<7;$('#overlay').style.display=black?'grid':'none';$('#label').textContent=black?'':sc[2];$('#caption').textContent=black?'':sc[3];if(!black)draw(t,sc[2]);requestAnimationFrame(frame)}function play(){playing=true;$('#start').style.display='none';$('#end').style.display='none';start=performance.now();requestAnimationFrame(frame)}$('#play').onclick=play;$('#again').onclick=play;})();
</script></body></html>
