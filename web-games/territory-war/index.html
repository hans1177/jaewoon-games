<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Approved Web Bootstrap</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #222;
            color: #fff;
            margin: 0;
            padding: 0;
        }
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        h1 {
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin-top: 10px;
            background-color: #444;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #666;
        }
    </style>
</head>
<body>
    <main id="game">
        <h1>Territory War</h1>
        <button onclick="startGame()">Start Game</button>
    </main>
    <script>
        function startGame() {
            const gameContainer = document.getElementById('game');
            gameContainer.innerHTML = `
                <div id="map">
                    <div class="tile" data-id="1" style="background-color: #f00;"></div>
                    <div class="tile" data-id="2" style="background-color: #0f0;"></div>
                    <div class="tile" data-id="3" style="background-color: #00f;"></div>
                    <div class="tile" data-id="4" style="background-color: #ff0;"></div>
                    <div class="tile" data-id="5" style="background-color: #0ff;"></div>
                    <div class="tile" data-id="6" style="background-color: #f0f;"></div>
                    <div class="tile" data-id="7" style="background-color: #000;"></div>
                    <div class="tile" data-id="8" style="background-color: #fff;"></div>
                    <div class="tile" data-id="9" style="background-color: #0ff;"></div>
                </div>
                <div id="status">Status: Ready</div>
            `;
        }
    </script>
</body>
</html>
