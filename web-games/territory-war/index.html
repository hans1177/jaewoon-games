<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>영토전쟁</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#101827;color:#fff;font-family:system-ui;overflow:hidden}header{height:56px;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#172033}h1{font-size:19px}.wrap{height:calc(100dvh - 56px);display:grid;grid-template-rows:1fr 145px}.map{position:relative;background:#587b62}.map svg{width:100%;height:100%}.land{stroke:#eadfbd;stroke-width:3}.land.sel{stroke:#fff;stroke-width:8}.txt{fill:#fff;font-size:18px;font-weight:900;text-anchor:middle;paint-order:stroke;stroke:#172033;stroke-width:4;pointer-events:none}.panel{padding:9px 11px;background:#172033}.small{font-size:13px;color:#cbd5e1}.row{display:flex;gap:6px;margin-top:9px}.row button{flex:1;border:0;border-radius:10px;padding:11px 3px;color:#fff;font-weight:900;background:#28754b}.row .atk{background:#b93636}.battle{display:none;position:absolute;inset:0;z-index:5;background:#718c55}.battle.on{display:block}.battle b{display:block;background:#172033;padding:12px}.unit{position:absolute;width:14px;height:14px;border-radius:50%}.me{background:#3b82f6}.enemy{background:#ef4444}.back{position:absolute;right:8px;bottom:8px;padding:10px;border:0;border-radius:9px;font-weight:900}</style></head><body><header><h1>영토전쟁</h1><span id="money"></span></header><div class="wrap"><div class="map"><svg id="map" viewBox="0 0 900 620"></svg><div class="battle" id="battle"><b id="bt">전투</b><button class="back" onclick="battle.classList.remove('on')">지도</button></div></div><div class="panel"><b id="title">영지를 선택해</b><div class="small" id="info">파란색이 네 영토야.</div><div class="row"><button onclick="build('farm')">농장</button><button onclick="build('market')">시장</button><button onclick="build('barracks')">병영</button><button class="atk" onclick="attackMode()">공격</button></div></div></div><script>const col=['#3b82f6','#ef4444','#f59e0b','#8b5cf6','#16a34a','#db2777'];let gold=120,food=120,sel=-1,targetMode=false;const rows=4,cols=5,W=180,H=155,S=[];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){let i=r*cols+c;S.push({i,r,c,owner:i===12?0:1+(Math.floor(i/4)%5),troops:i===12?55:25+Math.floor(Math.random()*20),farm:0,market:0,barracks:0,capital:[0,4,12,15,19].includes(i)})}function poly(s){let x=s.c*W+(s.r%2?45:0),y=s.r*H;return[[x+8,y+8],[x+W-8,y+8],[x+W-2,y+H-15],[x+W/2,y+H],[x+2,y+H-15]].map(p=>p.join(',')).join(' ')}function adjacent(a,b){return Math.abs(a.r-b.r)<=1&&Math.abs(a.c-b.c)<=1&&(a.i!==b.i)}function render(){map.innerHTML='';S.forEach(s=>{let p=document.createElementNS('http://www.w3.org/2000/svg','polygon');p.setAttribute('points',poly(s));p.setAttribute('fill',col[s.owner]);p.setAttribute('class','land'+(sel===s.i?' sel':''));p.onclick=()=>pick(s.i);map.appendChild(p);let t=document.createElementNS(p.namespaceURI,'text');t.setAttribute('x',s.c*W+(s.r%2?45:0)+90);t.setAttribute('y',s.r*H+85);t.setAttribute('class','txt');t.textContent=(s.capital?'♛':'')+s.troops;map.appendChild(t)});money.textContent='G '+Math.floor(gold)+' · F '+Math.floor(food)}function pick(i){if(targetMode){targetMode=false;let a=S[sel],d=S[i];if(a&&a.owner===0&&d.owner!==0&&adjacent(a,d))fight(a,d);else info.textContent='인접한 적 영지를 골라.';return}sel=i;let s=S[i];title.textContent='영지 '+(i+1)+(s.capital?' · 수도':'');info.textContent=(s.owner===0?'내 영토':'적 영토')+' · 병력 '+s.troops+' · 농장 '+s.farm+' 시장 '+s.market+' 병영 '+s.barracks;render()}function build(k){let s=S[sel];if(!s||s.owner!==0)return info.textContent='내 영지를 선택해.';let cost=k==='barracks'?45:35;if(gold<cost)return info.textContent='골드가 부족해.';gold-=cost;s[k]++;render();pick(sel)}function attackMode(){let s=S[sel];if(!s||s.owner!==0)return info.textContent='내 영지를 먼저 선택해.';if(s.troops<12)return info.textContent='병력이 너무 적어.';targetMode=true;info.textContent='공격할 인접 적 영지를 터치해.'}function fight(a,d){let send=Math.max(10,Math.floor(a.troops*.65));a.troops-=send;let def=d.troops*(d.capital?1.22:1),atk=send*(.9+Math.random()*.25),win=atk>def;battle.classList.add('on');battle.querySelectorAll('.unit').forEach(x=>x.remove());bt.textContent='영지 '+(a.i+1)+' → '+(d.i+1)+' · '+send+' vs '+d.troops;for(let i=0;i<Math.min(send,35);i++)spawn('me',10+Math.random()*30,20+Math.random()*60);for(let i=0;i<Math.min(d.troops,35);i++)spawn('enemy',60+Math.random()*30,20+Math.random()*60);setTimeout(()=>{if(win){d.owner=0;d.troops=Math.max(5,Math.floor(send-def*.55));bt.textContent+=' · 승리! 영토 점령'}else{d.troops=Math.max(5,Math.floor(d.troops-send*.55));a.troops+=Math.floor(send*.18);bt.textContent+=' · 패배, 생존병 후퇴'}render();save()},1300)}function spawn(c,x,y){let u=document.createElement('i');u.className='unit '+c;u.style.left=x+'%';u.style.top=y+'%';battle.appendChild(u);let dx=c==='me'?35:-35;u.animate([{transform:'translateX(0)'},{transform:'translateX('+dx+'vw)'}],{duration:1200,fill:'forwards'})}function ai(){for(let owner=1;owner<6;owner++){let own=S.filter(s=>s.owner===owner);if(!own.length)continue;let a=own.sort((x,y)=>y.troops-x.troops)[0],targets=S.filter(s=>s.owner!==owner&&adjacent(a,s));a.troops+=1;if(targets.length&&a.troops>45&&Math.random()<.22){let d=targets.sort((x,y)=>x.troops-y.troops)[0],send=Math.floor(a.troops*.55);if(send>d.troops*1.12){a.troops-=send;d.owner=owner;d.troops=Math.max(6,send-Math.floor(d.troops*.6))}}}render()}function save(){localStorage.setItem('territory-war-v1',JSON.stringify({gold,food,S}))}setInterval(()=>{let own=S.filter(s=>s.owner===0);gold+=2+own.reduce((n,s)=>n+s.market*2,0);food+=2+own.reduce((n,s)=>n+s.farm*2,0);own.forEach(s=>{if(s.barracks&&food>=s.barracks){s.troops+=s.barracks;food-=s.barracks}});ai();save()},4000);try{let z=JSON.parse(localStorage.getItem('territory-war-v1'));if(z&&z.S?.length===S.length){gold=z.gold;food=z.food;z.S.forEach((v,i)=>Object.assign(S[i],v))}}catch(e){}render();</script></body></html>
