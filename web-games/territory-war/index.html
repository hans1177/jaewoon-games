<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vibe2 bootstrap</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #222;
    }
    #game {
      width: 100%;
      max-width: 800px;
      padding: 20px;
      background-color: #111;
      border: 1px solid #333;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    .game-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .game-header {
      text-align: center;
      font-size: 24px;
      color: #fff;
    }
    .game-content {
      flex: 1;
    }
    .game-buttons {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }
    .game-buttons button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #333;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .game-buttons button:hover {
      background-color: #555;
    }
    .game-status {
      text-align: center;
      font-size: 18px;
      color: #fff;
      background-color: #444;
      padding: 10px;
      border-radius: 4px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <main id="game">
    <div class="game-container">
      <div class="game-header">Vibe2</div>
      <div class="game-content">
        <div class="game-buttons">
          <button id="startButton">Start Game</button>
          <button id="restartButton">Restart</button>
        </div>
        <div class="game-status" id="status">Status: Ready</div>
        <div class="game-buttons">
          <button id="moveUpButton">Move Up</button>
          <button id="moveDownButton">Move Down</button>
        </div>
        <div class="game-buttons">
          <button id="attackButton">Attack</button>
          <button id="defendButton">Defend</button>
        </div>
      </div>
    </div>
  </main>
  <script>
    const gameContainer = document.getElementById('game');
    const status = document.getElementById('status');
    const startButton = document.getElementById('startButton');
    const restartButton = document.getElementById('restartButton');
    const moveUpButton = document.getElementById('moveUpButton');
    const moveDownButton = document.getElementById('moveDownButton');
    const attackButton = document.getElementById('attackButton');
    const defendButton = document.getElementById('defendButton');

    startButton.addEventListener('click', () => {
      status.textContent = 'Status: Playing';
      gameContainer.style.display = 'flex';
      // Game logic here
    });

    restartButton.addEventListener('click', () => {
      status.textContent = 'Status: Ready';
      gameContainer.style.display = 'none';
    });

    moveUpButton.addEventListener('click', () => {
      status.textContent = 'Status: Moving Up';
      // Game logic here
    });

    moveDownButton.addEventListener('click', () => {
      status.textContent = 'Status: Moving Down';
      // Game logic here
    });

    attackButton.addEventListener('click', () => {
      status.textContent = 'Status: Attacking';
      // Game logic here
    });

    defendButton.addEventListener('click', () => {
      status.textContent = 'Status: Defending';
      // Game logic here
    });
  </script>
</body>
</html>
