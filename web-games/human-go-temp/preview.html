<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Human GO 그래픽 임시 프리뷰</title><style>html,body{margin:0;height:100%;background:#080d16;color:#fff;font-family:system-ui,sans-serif}header{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#111827;border-bottom:1px solid #334155;box-sizing:border-box}b{font-size:14px}a{color:#ffd66b;font-size:13px}iframe{width:100%;height:calc(100% - 49px);border:0;background:#000}</style></head><body><header><b>Human GO · 그래픽 작업본</b><a href="./index.html">기존 임시본</a></header><iframe id="game" src="./index.html" title="Human GO temporary build"></iframe><script>const f=document.getElementById('game');f.addEventListener('load',()=>{try{const d=f.contentDocument;const css=d.createElement('link');css.rel='stylesheet';css.href='./graphics-upgrade.css';d.head.appendChild(css);const applyStage=()=>{const b=d.getElementById('battle');if(!b)return;const txt=d.body.innerText||'';let s=1;const m=txt.match(/(?:STAGE|스테이지)\s*[-:]?\s*(\d+)/i);if(m)s=Math.max(1,Math.min(5,parseInt(m[1],10)||1));b.classList.remove('hg-stage-1','hg-stage-2','hg-stage-3','hg-stage-4','hg-stage-5');b.classList.add('hg-stage-'+s)};applyStage();new MutationObserver(applyStage).observe(d.body,{subtree:true,childList:true,characterData:true})}catch(e){console.error('Human GO visual layer:',e)}})</script></body></html>
