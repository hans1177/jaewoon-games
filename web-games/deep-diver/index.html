function sizedModel(source,maxSize){
 const node=source.clone(true),box=new THREE.Box3().setFromObject(node),s=box.getSize(new THREE.Vector3()),max=Math.max(.001,s.x,s.y,s.z);
 const root=new THREE.Group();node.scale.multiplyScalar(maxSize/max);root.add(node);
 box.setFromObject(node);const center=box.getCenter(new THREE.Vector3());
 node.position.sub(center);return root;
}
function addBubbles(){
 const count=220;particlePositions=new Float32Array(count*3);bubbleOrigins=new Float32Array(count);
 for(let i=0;i<count;i++){particlePositions[3*i]=(rand(i+31)-.5)*145;particlePositions[3*i+1]=-rand(i+57)*65;particlePositions[3*i+2]=(rand(i+13)-.5)*145;bubbleOrigins[i]=.14+rand(i+17)*.45;}
 const geo=new THREE.BufferGeometry();geo.setAttribute("position",new THREE.BufferAttribute(particlePositions,3));

function makeTerrain(){
 const geo=new THREE.PlaneGeometry(178,178,62,62);geo.rotateX(-Math.PI/2);
 const pos=geo.getAttribute("position"),c=[];
 const low=new THREE.Color("#142e32"),high=new THREE.Color("#426569");
 for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getZ(i),y=floorY(x,z);pos.setY(i,y);
  const hue=clamp((Math.sin(x*.18+z*.19)+1)*.25+.22,0,1),color=low.clone().lerp(high,hue);c.push(color.r,color.g,color.b);}
 geo.setAttribute("color",new THREE.Float32BufferAttribute(c,3));geo.computeVertexNormals();
 const seabed=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:1,metalness:0,side:THREE.DoubleSide}));
 seabed.receiveShadow=false;scene.add(seabed);
}
function makeRocks(){
 for(let i=0;i<46;i++){
  const x=(rand(i*3+9)-.5)*143,z=(rand(i*4+19)-.5)*143;
  if(TARGETS.some(t=>Math.hypot(t.x-x,t.z-z)<7))continue;
  const rock=sizedModel(rockSource,2.5+rand(i+67)*6);
  rock.position.set(x,floorY(x,z)+.3,z);rock.rotation.y=rand(i+99)*6.28;scene.add(rock);
 }
}
function makeLoot(){
 loot=[];
 TARGETS.forEach((t,i)=>{const chest=sizedModel(chestSource,3.2);chest.position.set(t.x,floorY(t.x,t.z)+1.5,t.z);
  chest.rotation.y=i*.85;scene.add(chest);loot.push(chest);});
}
function makeMonster(){

}
async function setup(){
 if(initialized)return;
 const canvas=$("view");
 renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:"high-performance"});
 renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight,false);

 const shafts=new THREE.DirectionalLight("#b9efff",2.5);shafts.position.set(-35,20,30);scene.add(shafts);
 const water=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshPhongMaterial({color:"#125a70",transparent:true,opacity:.30,side:THREE.DoubleSide,depthWrite:false}));
 water.rotation.x=-Math.PI/2;water.position.y=0;scene.add(water);
 makeTerrain();addBubbles();
 const loader=new GLTFLoader();
 const load=(url)=>new Promise((resolve,reject)=>loader.load(url,g=>resolve(g.scene),undefined,reject));
 [chestSource,rockSource,fishSource]=await Promise.all([
  load("../ocean-voyage/assets/chest.glb"),
  load("../../assets/shared/party/rock-large.glb"),
  load("../../assets/shared/forest/fish.glb")
 ]);
 // 기존 CC0 모델만 사용한다. 필수 모델에 문제가 있으면 가짜 도형으로 대체하지 않는다.
 makeRocks();makeLoot();makeMonster();

}
function resize(){if(!renderer)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight,false);}
function reset(){
 Object.assign(state,{live:true,paused:false,finished:false,x:0,y:-7,z:21,yaw:0,pitch:-.16,oxygen:100,hp:100,treasures:0,elapsed:0,found:new Set(),lastHit:-99,pulseUntil:-99,pulseCooldown:0,noticeUntil:0});
 held.clear();joy.x=0;joy.y=0;$("nub").style.left="50%";$("nub").style.top="50%";
 for(const b of document.querySelectorAll(".action"))b.classList.remove("pressed");
 loot.forEach(c=>{c.visible=true;});monster.position.set(20,-20,-19);
 $("overlay").hidden=true;$("message").hidden=true;last=performance.now();note("음파를 눌러 보물 위치를 찾아!");
}
function end(won){
 state.live=false;state.paused=true;state.finished=true;saveScore(state.treasures);
 const s=won?"심해 탐사 성공":"잠수 실패";
 changeTitle(s,won?"보물 4개를 모두 회수하고 무사히 돌아왔어.":"산소 또는 체력이 다했어. 다시 도전할 수 있어.","다시 잠수");
 $("status").textContent="이번 탐사 "+state.treasures+"/4 · 최고 기록 "+score()+"/4";
}
function collect(){
 if(!state.live||state.paused)return;
 let picked=false;
 TARGETS.forEach((t,i)=>{
  if(state.found.has(i))return;
  const chest=loot[i];
  if(Math.hypot(state.x-t.x,state.z-t.z)<5 && Math.abs(state.y-chest.position.y)<7){
   state.found.add(i);state.treasures++;chest.visible=false;state.oxygen=clamp(state.oxygen+13,0,100);
   note("보물 회수 "+state.treasures+"/4 · 산소 +13");picked=true;
  }
 });
 if(!picked)note("보물 상자에 더 가까이 다가가!");
 if(state.treasures===4)note("보물 전부 발견! 부상해서 수면으로 돌아가.",5);
}
function pulse(){
 if(!state.live||state.paused)return;
 if(state.elapsed<state.pulseCooldown){note("음파 재충전 "+Math.ceil(state.pulseCooldown-state.elapsed)+"초");return;}

function movements(dt){
 let forward=joy.y,side=joy.x;
 if(held.has("w")||held.has("arrowup"))forward+=1;
 if(held.has("s")||held.has("arrowdown"))forward-=1;
 if(held.has("a")||held.has("arrowleft"))side-=1;
 if(held.has("d")||held.has("arrowright"))side+=1;

 const ascend=held.has("q")||held.has("up");
 const descend=held.has("e")||held.has("down");

 state.y=clamp(state.y+(Number(ascend)-Number(descend))*dt*11,Math.max(-62,minY),-1.5);

}

 if(!monster)return;

 const scared=state.elapsed<state.pulseUntil;
 const target=scared?new THREE.Vector3(state.x+35,Math.max(-44,state.y-12),state.z+25):
  danger<43?new THREE.Vector3(state.x,state.y,state.z):
  new THREE.Vector3(21+Math.sin(state.elapsed*.2)*18,-23+Math.sin(state.elapsed*.37)*4,-20+Math.cos(state.elapsed*.2)*15);

  state.lastHit=state.elapsed;state.hp=clamp(state.hp-24,0,100);state.oxygen=clamp(state.oxygen-8,0,100);
  note("거대 생물에게 공격받았어! 음파로 밀어내.");

}
function paintSonar(){

 ctx.beginPath();ctx.moveTo(-120,0);ctx.lineTo(120,0);ctx.moveTo(0,-120);ctx.lineTo(0,120);ctx.stroke();
 const ang=-state.yaw;ctx.rotate(ang);
 if(state.elapsed<state.pulseUntil){TARGETS.forEach((t,i)=>{if(state.found.has(i))return;
  const x=(t.x-state.x)*2.1,z=(t.z-state.z)*2.1;if(Math.hypot(x,z)>112)return;
  ctx.fillStyle="#f7d879";ctx.fillRect(x-5,z-5,10,10);

}
function updateUI(){

function animate(now){

  for(let i=0;i<bubbleOrigins.length;i++){const k=i*3+1;particlePositions[k]+=dt*bubbleOrigins[i]*5;if(particlePositions[k]>-1)particlePositions[k]=-65;}

 }
 camera.position.set(state.x,state.y,state.z);
 const dir=new THREE.Vector3(Math.sin(state.yaw)*Math.cos(state.pitch),Math.sin(state.pitch),-Math.cos(state.yaw)*Math.cos(state.pitch));
 camera.lookAt(camera.position.clone().add(dir));
 scene.fog.density=.012+Math.min(0.017,Math.abs(state.y)*.00025);
 renderer.render(scene,camera);
 if(frame++%5===0){updateUI();paintSonar();}
}
/* 입력: 모바일 터치/시점 및 키보드. 다른 게임의 입력이나 저장을 건드리지 않는다. */
function installInputs(){
 const stick=$("stick"),nub=$("nub");let stickId=null;
 const clearStick=()=>{stickId=null;joy.x=0;joy.y=0;nub.style.left="50%";nub.style.top="50%";};
 stick.addEventListener("pointerdown",e=>{if(stickId!==null)return;stickId=e.pointerId;stick.setPointerCapture(e.pointerId);moveStick(e);e.preventDefault();});
 function moveStick(e){if(e.pointerId!==stickId)return;const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  const x=clamp((e.clientX-cx)/(r.width*.34),-1,1),y=clamp((e.clientY-cy)/(r.height*.34),-1,1);
  joy.x=x;joy.y=-y;nub.style.left=(50+x*30)+"%";nub.style.top=(50+y*30)+"%";}
 stick.addEventListener("pointermove",moveStick);
 stick.addEventListener("pointerup",clearStick);stick.addEventListener("pointercancel",clearStick);stick.addEventListener("lostpointercapture",clearStick);
 [["up","up"],["down","down"]].forEach(([id,key])=>{
  const b=$(id),off=()=>{held.delete(key);b.classList.remove("pressed");};
  b.addEventListener("pointerdown",e=>{b.setPointerCapture(e.pointerId);held.add(key);b.classList.add("pressed");e.preventDefault();});
  ["pointerup","pointercancel","lostpointercapture"].forEach(name=>b.addEventListener(name,off));
 });
 $("collect").addEventListener("click",collect);$("pulse").addEventListener("click",pulse);
 const view=$("view");
 view.addEventListener("pointerdown",e=>{if(state.paused)return;view.setPointerCapture(e.pointerId);viewTouches.set(e.pointerId,{x:e.clientX,y:e.clientY});});
 view.addEventListener("pointermove",e=>{const old=viewTouches.get(e.pointerId);if(!old||state.paused)return;
  state.yaw-=(e.clientX-old.x)*.005;state.pitch=clamp(state.pitch-(e.clientY-old.y)*.004,-1.22,.85);
  old.x=e.clientX;old.y=e.clientY;});
 ["pointerup","pointercancel","lostpointercapture"].forEach(name=>view.addEventListener(name,e=>viewTouches.delete(e.pointerId)));
 window.addEventListener("keydown",e=>{const key=e.key.toLowerCase();
  if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(key))e.preventDefault();
  held.add(key);if(e.repeat)return;
  if(key==="f")collect();if(key===" ")pulse();if(key==="p"||key==="escape")togglePause();});
 window.addEventListener("keyup",e=>held.delete(e.key.toLowerCase()));
 window.addEventListener("blur",()=>{held.clear();if(state.live&&!state.paused)togglePause();});
 document.addEventListener("visibilitychange",()=>{if(document.hidden&&state.live&&!state.paused)togglePause();});
}
function togglePause(){
 if(!state.live)return;
 state.paused=!state.paused;held.clear();viewTouches.clear();
 if(state.paused){changeTitle("잠시 쉬는 중","현재 위치와 보물 진행은 유지돼.","계속 잠수");$("status").textContent="보물 "+state.treasures+"/4";}
 else{$("overlay").hidden=true;last=performance.now();}
}
$("pause").addEventListener("click",togglePause);
$("primary").addEventListener("click",async()=>{
 if(state.live&&state.paused){togglePause();return;}
 $("primary").disabled=true;$("primary").textContent="심해 장비 불러오는 중...";
 try{await setup();reset();if(!animate.started){animate.started=true;requestAnimationFrame(animate);}}
 catch(error){console.error("심해 자산 로딩 실패",error);changeTitle("시작하지 못했어","그래픽 엔진 또는 필수 바다 자산을 불러오지 못했어. 연결 상태를 확인한 뒤 다시 시도해.","다시 시도");$("status").textContent="필수 게임 자산 미확인";}
 finally{$("primary").disabled=false;}
});
installInputs();$("status").textContent="최고 기록 "+score()+"/4";
</script>
