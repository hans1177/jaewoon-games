<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080d1c">
<title>천상의 보루</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b16;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}.hud{position:fixed;z-index:5;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 10px 0;pointer-events:none}.row{display:flex;gap:7px;justify-content:space-between;align-items:center}.pill{min-width:0;padding:7px 9px;border:1px solid #ffffff20;border-radius:13px;background:#071129d9;box-shadow:0 6px 20px #0008;backdrop-filter:blur(8px);font-size:11px;font-weight:900}.pill b{color:#8fe9ff}.corebar{margin-top:7px}.label{display:flex;justify-content:space-between;font-size:10px;font-weight:900;color:#c7d7f8;margin:0 2px 2px}.bar{height:10px;border-radius:99px;overflow:hidden;background:#ffffff18;border:1px solid #ffffff22}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#52e7ff,#7ba8ff);transition:width .15s}.controls{position:fixed;z-index:7;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);display:grid;grid-template-columns:1.1fr .9fr .9fr;gap:8px}.btn{min-height:54px;border:1px solid #ffffff26;border-radius:15px;background:#14284bdd;color:#fff;font-weight:950;box-shadow:0 7px 22px #0009;font-size:12px}.btn.primary{background:#235fb7}.btn:disabled{opacity:.45}.status{position:fixed;z-index:6;left:50%;bottom:calc(env(safe-area-inset-bottom) + 76px);transform:translateX(-50%);max-width:88vw;padding:6px 10px;border-radius:99px;background:#071127c9;border:1px solid #ffffff1b;color:#bed0ef;font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}.panelMask{position:fixed;z-index:20;inset:0;display:none;align-items:flex-end;justify-content:center;background:#02050bc4;backdrop-filter:blur(5px)}.panelMask.show{display:flex}.panel{width:min(100%,480px);border-radius:24px 24px 0 0;background:linear-gradient(180deg,#142542,#091225);border:1px solid #6b8fc544;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);box-shadow:0 -20px 60px #000b}.panel h2{margin:0 0 5px;font-size:21px}.panel p{margin:0 0 14px;color:#b8c9e5;font-size:12px;line-height:1.5}.panelBtns{display:grid;gap:8px}.panelBtn{min-height:52px;border:1px solid #ffffff22;border-radius:14px;background:#1b3156;color:#fff;font-weight:900;text-align:left;padding:10px 12px}.panelBtn small{display:block;margin-top:3px;color:#a9bbda;font-weight:700}.start{position:fixed;z-index:30;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;background:radial-gradient(circle at 50% 25%,#162b50,#050914 65%)}.start.hidden{display:none}.card{width:min(100%,430px);border:1px solid #6c92c844;border-radius:24px;background:#101c34;padding:21px;box-shadow:0 20px 70px #000b}.eyebrow{font-size:10px;font-weight:950;letter-spacing:.14em;color:#70e7ff}.card h1{margin:5px 0 8px;font-size:30px}.card p{margin:0 0 15px;color:#bdcce7;line-height:1.55;font-size:13px}.wide{width:100%;min-height:58px;border:0;border-radius:16px;background:#2a6cca;color:#fff;font-size:15px;font-weight:950}.audio{display:flex;gap:8px;margin-top:10px}.audio button{min-height:38px;padding:0 12px;border-radius:11px;border:1px solid #ffffff24;background:#172a49;color:#fff;font-weight:900}.audio input{flex:1}.boss{position:fixed;z-index:6;left:50%;top:calc(env(safe-area-inset-top) + 80px);transform:translateX(-50%);width:min(76vw,390px);display:none}.boss.show{display:block}.boss .label{color:#ffd1df}.boss .bar i{background:linear-gradient(90deg,#ff4d8b,#ffb255)}
</style>
</head>
<body data-audio-state="locked">
<canvas id="game"></canvas>
<div class="hud">
  <div class="row">
    <div class="pill">웨이브 <b id="wave">1</b></div>
    <div class="pill">별가루 <b id="gold">120</b></div>
    <div class="pill">처치 <b id="kills">0</b></div>
  </div>
  <div class="corebar"><div class="label"><span>천상핵</span><span id="coreText">20 / 20</span></div><div class="bar"><i id="coreBar"></i></div></div>
</div>
<div id="bossHud" class="boss"><div class="label"><span>심연 거신</span><span id="bossText"></span></div><div class="bar"><i id="bossBar"></i></div></div>
<div id="status" class="status">빈 수정대 탭 → 포탑 건설</div>
<div class="controls">
  <button id="waveBtn" class="btn primary">웨이브 시작</button>
  <button id="speedBtn" class="btn">속도 ×1</button>
  <button id="sellModeBtn" class="btn">판매 OFF</button>
</div>
<div id="towerPanel" class="panelMask"><div class="panel"><h2 id="towerTitle">수정 포탑</h2><p id="towerInfo"></p><div class="panelBtns"><button id="upgradeBtn" class="panelBtn"></button><button id="sellBtn" class="panelBtn"></button><button id="closePanel" class="panelBtn">닫기</button></div><div class="audio"><button id="mute" data-audio-control="mute">음악 켜짐</button><input id="volume" data-audio-control="volume" type="range" min="0" max="1" value="0.25" step="0.05"></div></div></div>
<div id="start" class="start"><div class="card"><div class="eyebrow">MOBILE TOWER DEFENSE</div><h1>천상의 보루</h1><p>수정대에 포탑을 세우고 적의 경로를 막아 천상핵을 지켜. 처치 보상으로 업그레이드하고 5웨이브마다 등장하는 거신을 버텨.</p><button id="startBtn" class="wide">방어 시작</button></div></div>
<div id="end" class="start hidden"><div class="card"><div class="eyebrow">BASTION FALLEN</div><h1>보루 붕괴</h1><p id="result"></p><button id="restartBtn" class="wide">다시 방어</button></div></div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);const ui={wave:$('wave'),gold:$('gold'),kills:$('kills'),coreText:$('coreText'),coreBar:$('coreBar'),waveBtn:$('waveBtn'),speedBtn:$('speedBtn'),sellModeBtn:$('sellModeBtn'),status:$('status'),bossHud:$('bossHud'),bossText:$('bossText'),bossBar:$('bossBar')};
let W=innerWidth,H=innerHeight,DPR=1,last=performance.now(),running=false,gameSpeed=1,wave=1,gold=120,kills=0,core=20,maxCore=20,waveActive=false,spawnLeft=0,spawnTimer=0,nextWaveDelay=0,boss=null,sellMode=false,audio=null,master=null,osc=null,muted=false;
const enemies=[],towers=[],shots=[],sparks=[];let selectedTower=null;
let path=[],pads=[];
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);buildMap()}
function buildMap(){const top=112,bottom=86;const playH=Math.max(300,H-top-bottom);path=[{x:-30,y:top+playH*.2},{x:W*.23,y:top+playH*.2},{x:W*.23,y:top+playH*.68},{x:W*.57,y:top+playH*.68},{x:W*.57,y:top+playH*.34},{x:W*.82,y:top+playH*.34},{x:W+35,y:top+playH*.75}];pads=[{x:W*.12,y:top+playH*.48},{x:W*.34,y:top+playH*.38},{x:W*.4,y:top+playH*.8},{x:W*.67,y:top+playH*.78},{x:W*.7,y:top+playH*.18},{x:W*.88,y:top+playH*.52}];for(const t of towers){const p=pads[t.pad];if(p){t.x=p.x;t.y=p.y}}}
addEventListener('resize',resize);resize();
function ensureAudio(){try{audio ||= new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();if(!master){master=audio.createGain();master.gain.value=Number($('volume').value);master.connect(audio.destination);osc=audio.createOscillator();osc.type='triangle';osc.frequency.value=92;osc.connect(master);osc.start()}document.body.dataset.audioState=muted?'muted':'running'}catch{}}
function tone(freq,dur=.05,vol=.025){try{ensureAudio();const o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.value=freq;g.gain.value=muted?0:vol;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+dur);o.stop(audio.currentTime+dur)}catch{}}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function reset(){enemies.length=towers.length=shots.length=sparks.length=0;wave=1;gold=120;kills=0;core=maxCore=20;waveActive=false;spawnLeft=0;spawnTimer=0;nextWaveDelay=0;boss=null;sellMode=false;selectedTower=null;running=true;gameSpeed=1;ui.bossHud.classList.remove('show');ui.speedBtn.textContent='속도 ×1';ui.sellModeBtn.textContent='판매 OFF';ui.status.textContent='빈 수정대 탭 → 포탑 건설';updateUi()}
function pathPos(progress){let remain=progress;for(let i=0;i<path.length-1;i++){const a=path[i],b=path[i+1],seg=dist(a,b);if(remain<=seg){const t=remain/seg;return{x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t,end:false}}remain-=seg}return{x:path[path.length-1].x,y:path[path.length-1].y,end:true}}
function pathLength(){let n=0;for(let i=0;i<path.length-1;i++)n+=dist(path[i],path[i+1]);return n}
function spawnEnemy(kind='normal'){const scale=1+(wave-1)*.14;let e={kind,progress:0,x:path[0].x,y:path[0].y,r:11,hp:44*scale,maxHp:44*scale,speed:46+wave*1.8,reward:12,damage:1,color:'#ff667f',slow:0,boss:false};if(kind==='fast')Object.assign(e,{r:8,hp:28*scale,maxHp:28*scale,speed:76+wave*2.4,reward:10,color:'#ffc454'});if(kind==='tank')Object.assign(e,{r:17,hp:115*scale,maxHp:115*scale,speed:30+wave,reward:22,damage:2,color:'#ae7cff'});if(kind==='boss'){const hp=820*(1+(wave-5)*.09);Object.assign(e,{r:30,hp,maxHp:hp,speed:23+wave*.6,reward:140,damage:6,color:'#ff4d9b',boss:true});boss=e;ui.bossHud.classList.add('show')}enemies.push(e)}
function startWave(){if(!running||waveActive)return;ensureAudio();waveActive=true;spawnLeft=8+wave*2;spawnTimer=.05;if(wave%5===0)spawnLeft+=1;ui.waveBtn.disabled=true;ui.status.textContent=`웨이브 ${wave} 방어 중`;tone(340,.12,.035)}
function finishWave(){waveActive=false;gold+=20+wave*3;wave++;nextWaveDelay=.8;ui.waveBtn.disabled=false;ui.waveBtn.textContent='다음 웨이브';ui.status.textContent=`방어 성공 · 보너스 +${20+(wave-1)*3}`;tone(700,.16,.035)}
function enemyKind(index){if(wave%5===0&&index===0)return'boss';const r=Math.random();if(wave>=3&&r<.2)return'tank';if(r<.48)return'fast';return'normal'}
function buildTower(padIndex){const p=pads[padIndex];if(!p)return;const occupied=towers.find(t=>t.pad===padIndex);if(occupied){openTower(occupied);return}if(gold<40){ui.status.textContent='별가루가 부족해 · 포탑 40';tone(95,.1,.03);return}gold-=40;const t={pad:padIndex,x:p.x,y:p.y,level:1,range:118,damage:18,fireRate:.65,cool:0,totalSpent:40};towers.push(t);ui.status.textContent='수정 포탑 건설 완료';burst(p.x,p.y,'#8cecff',14);tone(520,.08,.03);updateUi()}
function openTower(t){selectedTower=t;$('towerTitle').textContent=`수정 포탑 Lv.${t.level}`;const cost=upgradeCost(t);$('towerInfo').textContent=`피해 ${Math.round(t.damage)} · 사거리 ${Math.round(t.range)} · 공격간격 ${t.fireRate.toFixed(2)}초`;$('upgradeBtn').innerHTML=`강화 · ${cost} 별가루<small>피해 +35% · 사거리 +10 · 연사 +8%</small>`;$('sellBtn').innerHTML=`판매 · ${Math.floor(t.totalSpent*.65)} 별가루<small>포탑을 철거하고 일부 비용 회수</small>`;$('towerPanel').classList.add('show')}
function upgradeCost(t){return 35+t.level*22}function upgradeTower(){const t=selectedTower;if(!t)return;const cost=upgradeCost(t);if(gold<cost){ui.status.textContent='강화 비용이 부족해';return}gold-=cost;t.totalSpent+=cost;t.level++;t.damage*=1.35;t.range+=10;t.fireRate=Math.max(.25,t.fireRate*.92);openTower(t);burst(t.x,t.y,'#d5b3ff',12);tone(640,.09,.03);updateUi()}
function sellTower(t=selectedTower){if(!t)return;const refund=Math.floor(t.totalSpent*.65);gold+=refund;const i=towers.indexOf(t);if(i>=0)towers.splice(i,1);$('towerPanel').classList.remove('show');selectedTower=null;ui.status.textContent=`포탑 판매 +${refund}`;tone(260,.07,.025);updateUi()}
function burst(x,y,color,n=7){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=30+Math.random()*100;sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.25+Math.random()*.35,max:.6,r:1.5+Math.random()*3,color})}}
function fireTower(t,target){const a=Math.atan2(target.y-t.y,target.x-t.x);shots.push({x:t.x,y:t.y,vx:Math.cos(a)*430,vy:Math.sin(a)*430,damage:t.damage,target,life:.7,r:3});tone(780,.025,.008)}
function hitEnemy(e,damage,x,y){e.hp-=damage;burst(x,y,'#c7f8ff',3);if(e.hp<=0){const index=enemies.indexOf(e);if(index>=0)enemies.splice(index,1);gold+=e.reward;kills++;burst(e.x,e.y,e.color,e.boss?24:9);if(e===boss){boss=null;ui.bossHud.classList.remove('show');tone(880,.28,.05)}updateUi()}}
function leak(e){const i=enemies.indexOf(e);if(i>=0)enemies.splice(i,1);core-=e.damage;if(e===boss){boss=null;ui.bossHud.classList.remove('show')}burst(W-20,H*.65,'#ff526f',14);tone(110,.15,.04);if(core<=0)endGame();updateUi()}
function endGame(){running=false;waveActive=false;$('result').textContent=`${wave}웨이브 도달 · ${kills}마리 처치 · 포탑 ${towers.length}기 건설`;$('end').classList.remove('hidden')}
function update(dt){if(!running)return;dt*=gameSpeed;if(nextWaveDelay>0)nextWaveDelay=Math.max(0,nextWaveDelay-dt);if(waveActive){spawnTimer-=dt;if(spawnLeft>0&&spawnTimer<=0){const spawned=(8+wave*2+(wave%5===0?1:0))-spawnLeft;spawnEnemy(enemyKind(spawned));spawnLeft--;spawnTimer=Math.max(.18,.72-wave*.018)}if(spawnLeft===0&&enemies.length===0)finishWave()}
 for(const e of [...enemies]){e.progress+=e.speed*dt;const p=pathPos(e.progress);e.x=p.x;e.y=p.y;if(p.end||e.progress>pathLength()+20){leak(e);continue}}
 for(const t of towers){t.cool-=dt;if(t.cool>0)continue;let target=null,best=-1;for(const e of enemies){const d=dist(t,e);if(d<=t.range&&e.progress>best){best=e.progress;target=e}}if(target){fireTower(t,target);t.cool=t.fireRate}}
 for(let i=shots.length-1;i>=0;i--){const s=shots[i];s.life-=dt;if(!s.target||!enemies.includes(s.target)||s.life<=0){shots.splice(i,1);continue}const a=Math.atan2(s.target.y-s.y,s.target.x-s.x);s.vx=Math.cos(a)*430;s.vy=Math.sin(a)*430;s.x+=s.vx*dt;s.y+=s.vy*dt;if(dist(s,s.target)<s.target.r+5){hitEnemy(s.target,s.damage,s.x,s.y);shots.splice(i,1)}}
 for(let i=sparks.length-1;i>=0;i--){const p=sparks[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;p.life-=dt;if(p.life<=0)sparks.splice(i,1)}updateUi()}
function updateUi(){ui.wave.textContent=wave;ui.gold.textContent=Math.floor(gold);ui.kills.textContent=kills;ui.coreText.textContent=`${Math.max(0,core)} / ${maxCore}`;ui.coreBar.style.width=(clamp(core/maxCore,0,1)*100)+'%';if(boss){ui.bossText.textContent=`${Math.max(0,Math.ceil(boss.hp))} / ${Math.ceil(boss.maxHp)}`;ui.bossBar.style.width=(clamp(boss.hp/boss.maxHp,0,1)*100)+'%'}}
function draw(){ctx.clearRect(0,0,W,H);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#111d3a');g.addColorStop(.55,'#0a1226');g.addColorStop(1,'#050913');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#ffffff12';for(let i=0;i<55;i++){const x=(i*97)%W,y=(i*53+performance.now()*.006*(i%3))%H;ctx.fillRect(x,y,1.2,1.2)}
 ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#243a63';ctx.lineWidth=30;ctx.beginPath();ctx.moveTo(path[0].x,path[0].y);for(let i=1;i<path.length;i++)ctx.lineTo(path[i].x,path[i].y);ctx.stroke();ctx.strokeStyle='#4c6fa1';ctx.lineWidth=3;ctx.setLineDash([9,11]);ctx.stroke();ctx.setLineDash([]);
 for(let i=0;i<pads.length;i++){const p=pads[i],tower=towers.find(t=>t.pad===i);if(!tower){ctx.fillStyle='#142542';ctx.strokeStyle='#6ebbd455';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,20,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#8fe9ff99';ctx.font='bold 19px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('+',p.x,p.y)} }
 for(const t of towers){ctx.save();ctx.translate(t.x,t.y);ctx.fillStyle='#88e7ff';ctx.shadowColor='#55dbff';ctx.shadowBlur=14;ctx.beginPath();ctx.arc(0,0,15,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#dffaff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,-17);ctx.lineTo(11,10);ctx.lineTo(-11,10);ctx.closePath();ctx.stroke();ctx.fillStyle='#d9c1ff';ctx.font='bold 9px system-ui';ctx.textAlign='center';ctx.fillText(''+t.level,0,4);ctx.restore()}
 for(const e of enemies){ctx.save();ctx.translate(e.x,e.y);ctx.fillStyle=e.color;ctx.shadowColor=e.color;ctx.shadowBlur=e.boss?22:9;ctx.beginPath();ctx.arc(0,0,e.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#ffffff44';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,e.r*.55,0,Math.PI*2);ctx.stroke();const w=e.r*1.8;ctx.fillStyle='#1d2739';ctx.fillRect(-w/2,-e.r-9,w,4);ctx.fillStyle='#7ef7a4';ctx.fillRect(-w/2,-e.r-9,w*clamp(e.hp/e.maxHp,0,1),4);ctx.restore()}
 for(const s of shots){ctx.fillStyle='#e3fbff';ctx.shadowColor='#79eaff';ctx.shadowBlur=9;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}ctx.shadowBlur=0;for(const p of sparks){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
 ctx.fillStyle='#88dcff';ctx.shadowColor='#6fe6ff';ctx.shadowBlur=28;ctx.beginPath();ctx.arc(W+4,path[path.length-1].y,29,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}
function frame(now){const dt=Math.min(.035,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
function hitTest(x,y){for(const t of towers){if(Math.hypot(x-t.x,y-t.y)<27)return{tower:t}}for(let i=0;i<pads.length;i++){const p=pads[i];if(Math.hypot(x-p.x,y-p.y)<29)return{pad:i}}return null}
canvas.addEventListener('pointerdown',e=>{if(!running)return;ensureAudio();const hit=hitTest(e.clientX,e.clientY);if(!hit)return;if(hit.tower){if(sellMode)sellTower(hit.tower);else openTower(hit.tower)}else if(hit.pad!==undefined)buildTower(hit.pad)});
ui.waveBtn.onclick=startWave;ui.speedBtn.onclick=()=>{gameSpeed=gameSpeed===1?2:1;ui.speedBtn.textContent=`속도 ×${gameSpeed}`};ui.sellModeBtn.onclick=()=>{sellMode=!sellMode;ui.sellModeBtn.textContent=sellMode?'판매 ON':'판매 OFF';ui.status.textContent=sellMode?'포탑을 탭하면 즉시 판매':'빈 수정대 탭 → 포탑 건설'};$('upgradeBtn').onclick=upgradeTower;$('sellBtn').onclick=()=>sellTower();$('closePanel').onclick=()=>{$('towerPanel').classList.remove('show');selectedTower=null};$('towerPanel').addEventListener('pointerdown',e=>{if(e.target===$('towerPanel')){$('towerPanel').classList.remove('show');selectedTower=null}});$('mute').onclick=()=>{ensureAudio();muted=!muted;if(master)master.gain.value=muted?0:Number($('volume').value);$('mute').textContent=muted?'음악 꺼짐':'음악 켜짐';document.body.dataset.audioState=muted?'muted':'running'};$('volume').oninput=()=>{ensureAudio();if(master&&!muted)master.gain.value=Number($('volume').value)};$('startBtn').onclick=()=>{$('start').classList.add('hidden');ensureAudio();reset()};$('restartBtn').onclick=()=>{$('end').classList.add('hidden');reset()};
})();
</script>
</body>
</html>
