  if(!running)return;const dt=Math.min(.04,(now-last)/1000||.016);last=now;update(dt);draw(dt);if(running)requestAnimationFrame(loop);
}
$('startHuman').onclick=()=>setup('human');$('startMonster').onclick=()=>setup('monster');$('restart').onclick=()=>setup(save.lastRole==='monster'?'monster':'human');
})();
</script>
