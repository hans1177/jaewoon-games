  const types = {

    dragonfly:{name:"청동 잠자리",hp:18000,speed:1.05,damage:35,reward:450,color:"#39a7a2",size:13},

    centipede:{name:"붉은 왕지네",hp:160000,speed:0.66,damage:70,reward:1000,color:"#a33d28",size:20},
    stagBeetle:{name:"철갑 사슴벌레",hp:280000,speed:0.42,damage:90,reward:1400,color:"#263d38",size:22},

  let state;

      if(!discovered)return `<div class="bd-codex-item"><b>???</b><span>체력 ??? · 공격 ??? · 보상 ???</span><span>아직 발견하지 못한 곤충</span></div>`;

    }).join("");

  function pathPoint(progress,laneOffset=0){
    const p=Math.max(0,Math.min(1,progress));
    return {x:70+820*p,y:270+155*Math.sin(Math.PI*2*p)+laneOffset};
  }
  function distanceFromPath(x,y){
    let nearest=Infinity;
    for(let index=0;index<=100;index++){
      const point=pathPoint(index/100);
      nearest=Math.min(nearest,Math.hypot(x-point.x,y-point.y));
    }
    return nearest;
  }

  function canvasPointFromEvent(event){
    const bounds=canvas.getBoundingClientRect();
    const scale=Math.min(bounds.width/canvas.width,bounds.height/canvas.height);
    const drawnWidth=canvas.width*scale;
    const drawnHeight=canvas.height*scale;
    const localX=event.clientX-bounds.left-(bounds.width-drawnWidth)/2;
    const localY=event.clientY-bounds.top-(bounds.height-drawnHeight)/2;
    if(localX<0||localY<0||localX>drawnWidth||localY>drawnHeight)return null;
    return{x:localX/scale,y:localY/scale};
  }
  function openPlacementMenu(event){
    if(!state.running)return;
    const point=canvasPointFromEvent(event);
    if(!point)return;
    const{x,y}=point;
    const clickedTurret=state.turrets.map(turret=>({turret,distance:Math.hypot(turret.x-x,turret.y-y)})).sort((a,b)=>a.distance-b.distance)[0];
    if(clickedTurret&&clickedTurret.distance<30){
      if(clickedTurret.turret.type==="healing")openHealingUpgrade(clickedTurret.turret);
      else ui.message.textContent="이 포탑은 개별 강화 대상이 아닙니다";
      return;
    }
    const blockedByPath=distanceFromPath(x,y)<58;
    const blockedByBase=x<95||x>865;
    const blockedByTurret=state.turrets.some(t=>Math.hypot(t.x-x,t.y-y)<42);
    if(blockedByPath||blockedByBase||blockedByTurret){ui.message.textContent="길과 기지에는 포탑을 설치할 수 없습니다";return;}
    state.pendingPlacement={x,y};
    ui.placeMenu.hidden=false;
    updateUi();
  }
