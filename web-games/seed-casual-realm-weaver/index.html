<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08111b">
  <title>세계의 직조자</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1e1e1e;
      color: #ffffff;
      margin: 0;
      padding: 0;
    }
    h1 {
      text-align: center;
      margin-top: 20px;
    }
    #game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 20px;
      background-color: #1a1a1a;
    }
    #game-container h2 {
      margin-bottom: 20px;
    }
    #game-container p {
      max-width: 600px;
      margin: 0 auto;
      font-size: 16px;
    }
    #game-container button {
      margin: 10px;
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      background-color: #007bff;
      color: white;
      cursor: pointer;
    }
    #game-container button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <h1>세계의 직조자</h1>
    <p>마나로 숲·물길·마을을 창조하고 세계 안정도와 인구 목표를 달성하는 캐주얼 세계 창조 게임.</p>
    <button onclick="startGame()">시작</button>
    <div id="game-status"></div>
    <div id="game-map"></div>
  </div>

  <script>
    // Game logic and initialization
    let gameStatus = document.getElementById('game-status');
    let gameMap = document.getElementById('game-map');

    function startGame() {
      gameStatus.textContent = "게임 시작 중...";
      gameMap.innerHTML = "<div id='map-container'>게임 맵이 로딩 중...</div>";
      // Simulate map loading
      setTimeout(() => {
        gameMap.innerHTML = "<div id='map-container'>숲, 물길, 마을이 배치됨</div>";
        gameStatus.textContent = "게임 시작 완료";
      }, 1500);
    }

    // Game progression and interaction
    function updateProgress() {
      const progress = Math.floor(Math.random() * 100);
      gameStatus.textContent = `진행률: ${progress}%`;
      if (progress >= 80) {
        gameStatus.textContent = "세계 안정도가 80% 달성됨!";
      }
    }

    // Mobile input handling
    document.addEventListener('touchstart', (e) => {
      if (e.touches.length > 0) {
        const touch = e.touches[0];
        const map = document.getElementById('map-container');
        const cell = findCellFromTouch(touch, map);
        if (cell) {
          updateProgress();
          gameStatus.textContent = "마나 사용됨";
        }
      }
    });

    // Restart functionality
    document.getElementById('game-container').addEventListener('click', () => {
      gameStatus.textContent = "게임 재시작 중...";
      setTimeout(() => {
        gameStatus.textContent = "게임 재시작 완료";
        startGame();
      }, 1500);
    });
  </script>
</body>
</html>
