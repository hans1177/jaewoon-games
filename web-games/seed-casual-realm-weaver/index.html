<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08111b">
  <title>세계의 직조자</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #222;
      color: #fff;
      margin: 0;
      padding: 0;
    }
    h1 {
      text-align: center;
      margin-top: 20px;
    }
    #game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #111;
    }
    #game-container h2 {
      margin-bottom: 20px;
    }
    #game-container button {
      padding: 10px 20px;
      font-size: 16px;
      margin: 10px;
      background-color: #333;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    #game-container p {
      margin-top: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <h1>세계의 직조자</h1>
    <h2>마나로 숲·물길·마을을 창조하고 세계 안정도와 인구 목표를 달성하세요!</h2>
    <button id="create-forest">숲 창조</button>
    <button id="create-paths">물길 창조</button>
    <button id="create-cities">마을 창조</button>
    <p>마나를 조절하여 각 기능을 사용하세요.</p>
  </div>
  <script>
    // Game logic here
    document.getElementById('create-forest').addEventListener('click', () => {
      // Logic to create forest
      alert('숲이 창조되었습니다!');
    });

    document.getElementById('create-paths').addEventListener('click', () => {
      // Logic to create paths
      alert('물길이 창조되었습니다!');
    });

    document.getElementById('create-cities').addEventListener('click', () => {
      // Logic to create cities
      alert('마을이 창조되었습니다!');
    });
  </script>
</body>
</html>
