<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08111b">
  <title>세계의 직조자</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f0f0f0;
    }
    h1 {
      text-align: center;
      color: #08111b;
    }
    #game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #ffffff;
    }
    #game-container h2 {
      margin: 20px 0;
    }
    #game-container p {
      margin: 10px 0;
      font-size: 16px;
    }
    #game-container button {
      margin: 10px;
      padding: 10px 20px;
      font-size: 16px;
      background-color: #08111b;
      color: #ffffff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    #game-container button:hover {
      background-color: #002b4a;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <h1>세계의 직조자</h1>
    <h2>마나로 숲·물길·마을을 창조하고 세계 안정도와 인구 목표를 달성하는 캐주얼 세계 창조 게임.</h2>
    <p>마나를 수집하여 숲, 물길, 마을을 배치하고, 세계의 안정도와 인구 목표를 달성하세요.</p>
    <button onclick="startGame()">시작</button>
    <div id="game-status"></div>
    <div id="game-map"></div>
    <div id="game-stats"></div>
  </div>

  <script>
    // Game logic and state management would go here
    // This is a placeholder for the actual game implementation

    function startGame() {
      document.getElementById('game-status').innerText = '게임 시작!';
      document.getElementById('game-map').style.display = 'block';
      document.getElementById('game-stats').style.display = 'block';
    }

    // Placeholder for game logic
    // Actual game logic would go here
  </script>
</body>
</html>
