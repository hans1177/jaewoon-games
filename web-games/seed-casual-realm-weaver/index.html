<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08111b">
  <title>세계의 직조자</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f0f0f0;
    }
    header {
      background-color: #08111b;
      color: white;
      padding: 1rem;
      text-align: center;
    }
    h1 {
      margin: 0;
    }
    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 2rem;
    }
    .game-title {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    .game-description {
      font-size: 0.9rem;
      color: #555;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      margin-top: 1rem;
    }
    .control {
      background-color: #fff;
      border: 1px solid #ccc;
      border-radius: 5px;
      padding: 0.5rem 1rem;
      width: 150px;
      text-align: center;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .control:hover {
      background-color: #e0e0e0;
    }
    .game-over {
      margin-top: 2rem;
      text-align: center;
      color: red;
    }
    .game-over h2 {
      margin-bottom: 0.5rem;
    }
    .game-over p {
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>세계의 직조자</h1>
    <p class="game-description">마나로 숲·물길·마을을 창조하고 세계 안정도와 인구 목표를 달성하는 캐주얼 세계 창조 게임.</p>
  </header>
  <div class="game-container">
    <div class="game-title">세계의 직조자</div>
    <div class="game-description">마나로 숲·물길·마을을 창조하고 세계 안정도와 인구 목표를 달성하는 캐주얼 세계 창조 게임.</div>
    <div class="controls">
      <div class="control" id="createForest">숲 창조</div>
      <div class="control" id="createPath">물길 창조</div>
      <div class="control" id="createVillage">마을 창조</div>
      <div class="control" id="buildStructure">구조 건축</div>
      <div class="control" id="upgrade">업그레이드</div>
      <div class="control" id="restart">재시작</div>
    </div>
    <div class="game-over" id="gameOver">
      <h2>게임 종료</h2>
      <p>게임이 종료되었습니다. 현재 상태를 확인하시고, 재시작을 원하시면 <button id="restartButton">재시작</button>을 클릭해주세요.</p>
    </div>
  </div>
  <script>
    // Game logic and state management would go here

    // The game would have a UI with controls for creating and managing the world

    // The game would have a system for restart and responsive layout
    // The game would have a system for mobile input and touch controls
    // The game would have a system for saving and restoring game state
    // The game would have a system for telemetry and design intelligence
  </script>
</body>
</html>
