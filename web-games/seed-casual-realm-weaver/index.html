<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08111b">
  <title>세계의 직조자</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1a1a1a;
      color: #ffffff;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #08111b;
      padding: 1rem;
      text-align: center;
    }
    header h1 {
      margin: 0;
      font-size: 2rem;
    }
    main {
      padding: 2rem;
    }
    .game-container {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .game-section {
      flex: 1;
      background-color: #2a2a2a;
      padding: 1rem;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    .game-section h2 {
      margin-top: 0;
      font-size: 1.2rem;
      color: #ffcc00;
    }
    .game-section p {
      font-size: 0.9rem;
      color: #ccc;
    }
    .game-section button {
      background-color: #444;
      color: #fff;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .game-section button:hover {
      background-color: #666;
    }
    footer {
      background-color: #08111b;
      color: #ccc;
      text-align: center;
      padding: 1rem;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>세계의 직조자</h1>
  </header>
  <main>
    <div class="game-container">
      <div class="game-section">
        <h2>게임 설명</h2>
        <p>마나로 숲·물길·마을을 창조하고 세계 안정도와 인구 목표를 달성하는 캐주얼 세계 창조 게임.</p>
        <button onclick="startGame()">게임 시작</button>
      </div>
      <div class="game-section">
        <h2>게임 메뉴</h2>
        <p>1. 숲·물길·마을 배치<br>2. 지형·주민·자원 피드백<br>3. 목표·진행·실패 또는 장기 성장<br>4. 되돌리기·재시작<br>5. 모바일 직접 조작과 명확한 시각 피드백</p>
        <button onclick="showMenu()">게임 메뉴</button>
      </div>
      <div class="game-section">
        <h2>게임 진행</h2>
        <p>게임은 단순 버튼으로 수치만 증가하는 형태로 끝내지 않는다.</p>
        <button onclick="increaseProgression()">수치 증가</button>
      </div>
    </div>
  </main>
  <footer>
    <p>세계의 직조자 - 캐주얼 세계 창조 게임</p>
  </footer>
  <script>
    let gameProgress = 0;
    const progressionBar = document.createElement('div');
    progressionBar.style.width = '100%';
    progressionBar.style.height = '20px';
    progressionBar.style.backgroundColor = '#ffcc00';
    progressionBar.style.position = 'absolute';
    progressionBar.style.top = '0';
    progressionBar.style.left = '0';
    progressionBar.style.zIndex = 1000;
    document.body.appendChild(progressionBar);

    function startGame() {
      gameProgress = 0;
      updateProgressionBar();
    }

    function updateProgressionBar() {
      const progress = gameProgress / 100;
      progressionBar.style.width = `${progress * 100}%`;
    }

    function increaseProgression() {
      gameProgress += 1;
      updateProgressionBar();
    }

    function showMenu() {
      alert('게임 메뉴를 보여줍니다.');
    }
  </script>
</body>
</html>
