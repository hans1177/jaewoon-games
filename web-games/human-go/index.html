<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>휴먼 GO!</title><style>*{box-sizing:border-box}body{margin:0;background:#071018;color:#eef7ff;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;overflow-x:hidden}button{font:inherit;color:inherit;border:0}.app{max-width:920px;margin:auto;min-height:100vh;background:radial-gradient(circle at 50% 15%,#263b4a 0,#0d1821 45%,#05090d 100%);position:relative}.hud{position:sticky;top:0;z-index:20;padding:10px;background:#071018e8;backdrop-filter:blur(10px);border-bottom:1px solid #ffffff18}.row{display:flex;gap:8px;align-items:center}.tag{padding:5px 9px;border-radius:10px;background:#ffffff12;font-size:12px}.bars{flex:1}.bar{height:10px;background:#0008;border-radius:9px;overflow:hidden;margin:3px 0}.fill{height:100%;transition:.25s}.hp{background:linear-gradient(90deg,#ff3b4e,#ff8a4c)}.xp{background:linear-gradient(90deg,#4ba8ff,#a86bff)}.screen{padding:14px;display:none}.screen.on{display:block}.heroCard,.panel{background:linear-gradient(145deg,#ffffff12,#ffffff06);border:1px solid #ffffff20;border-radius:18px;padding:14px;box-shadow:0 14px 35px #0007}.title{text-align:center;font-size:28px;font-weight:900;letter-spacing:1px;margin:8px}.sub{text-align:center;color:#9fb1c0}.btn{padding:13px 16px;border-radius:14px;background:linear-gradient(#3c88ff,#2258c7);font-weight:800;box-shadow:0 5px 0 #143574;min-height:48px}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #143574}.btn.alt{background:linear-gradient(#45515d,#27313a);box-shadow:0 5px 0 #151b20}.btn.danger{background:linear-gradient(#c44755,#7e2631)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.class{padding:14px 8px;text-align:center;border-radius:16px;background:#ffffff0d;border:2px solid transparent}.class.sel{border-color:#66b9ff;background:#66b9ff20}.portrait{height:90px;display:grid;place-items:center;font-size:56px;filter:drop-shadow(0 8px 8px #0008)}.map{display:grid;gap:12px}.node{display:flex;align-items:center;gap:12px;padding:13px;border-radius:15px;background:#ffffff0b;border:1px solid #ffffff18}.node.lock{opacity:.38}.node .num{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#245da8;font-weight:900}.battlefield{height:330px;position:relative;overflow:hidden;border-radius:20px;background:linear-gradient(#182d3c 0 55%,#263126 56% 100%);border:1px solid #ffffff20;box-shadow:inset 0 -30px 70px #0005}.battlefield.waste{background:linear-gradient(#6e5036 0 50%,#a87845 51% 70%,#60452e 71%)}.battlefield.waste:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 15% 70%,#d7aa6555 0 3%,transparent 4%),radial-gradient(circle at 75% 68%,#2c211c 0 2%,transparent 3%);animation:dust 7s linear infinite}.fighter{position:absolute;bottom:48px;width:130px;text-align:center;transition:.18s}.fighter.hero{left:7%}.fighter.enemy{right:7%}.sprite{font-size:82px;filter:drop-shadow(0 12px 10px #0008);transform-origin:center bottom}.name{font-weight:900;text-shadow:0 2px 3px #000}.mini{height:9px;background:#000a;border-radius:8px;overflow:hidden}.mini>i{display:block;height:100%;background:#ff455b}.attack .sprite{animation:atk .32s}.hit .sprite{animation:hit .28s}.boss .sprite{animation:bossin .7s}.damage{position:absolute;font-weight:1000;font-size:28px;color:#fff2a0;text-shadow:0 3px 4px #000;animation:float .8s forwards;z-index:8}.status{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:center;gap:6px;flex-wrap:wrap}.status span{background:#0009;padding:5px 9px;border-radius:10px;font-size:12px}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}.skill{position:relative}.cd{position:absolute;inset:0;border-radius:14px;background:#000b;display:grid;place-items:center;font-size:22px}.log{height:96px;overflow:auto;margin-top:10px;padding:10px;border-radius:12px;background:#0006;color:#c8d3dc;font-size:13px}.inv{display:grid;gap:8px;max-height:60vh;overflow:auto}.item{padding:12px;border-radius:13px;background:#ffffff0d;border:1px solid #ffffff16;display:flex;justify-content:space-between;gap:10px}.common{border-left:4px solid #aaa}.rare{border-left:4px solid #4aa6ff}.epic{border-left:4px solid #b06cff}.legend{border-left:4px solid #ffb33b}.modal{position:fixed;inset:0;background:#000c;z-index:50;display:none;place-items:center;padding:18px}.modal.on{display:grid}.modal .panel{width:min(560px,100%);max-height:85vh;overflow:auto;background:#111d27}.bossbar{display:none;margin:8px 0}.bossbar.on{display:block}.warn{animation:pulse .6s infinite}.quality{position:fixed;right:10px;bottom:10px;z-index:30;background:#0009;padding:7px;border-radius:10px;font-size:11px}@keyframes atk{50%{transform:translateX(42px) scale(1.08)}}@keyframes hit{30%{transform:translateX(-9px);filter:brightness(3)}70%{transform:translateX(7px)}}@keyframes bossin{0%{transform:scale(2);opacity:0}70%{transform:scale(.92)}}@keyframes float{to{transform:translateY(-70px);opacity:0}}@keyframes pulse{50%{box-shadow:inset 0 0 60px #ff3d3d88}}@keyframes dust{to{background-position:240px 0,-180px 0}}@media(max-width:560px){.screen{padding:9px}.battlefield{height:300px}.fighter{width:112px}.sprite{font-size:68px}.fighter.hero{left:2%}.fighter.enemy{right:2%}.grid{grid-template-columns:1fr}.class{display:flex;align-items:center;text-align:left}.portrait{height:64px;width:72px;font-size:45px}.actions{position:sticky;bottom:6px}.btn{min-height:54px}}body.lowfx *{animation-duration:.01ms!important;box-shadow:none!important}</style></head><body><div class="app"><div class="hud"><div class="row"><b id="hudName">휴먼 GO!</b><span class="tag" id="hudJob">모험가</span><span class="tag" id="hudStage">HOME</span></div><div class="row"><span id="hpText">100/100</span><div class="bars"><div class="bar"><div id="hpFill" class="fill hp"></div></div><div class="bar"><div id="xpFill" class="fill xp"></div></div></div><span id="gold">0G</span></div></div><main id="home" class="screen on"><h1 class="title">휴먼 GO!</h1><p class="sub">영웅이 되어 네르시아와 스칸디움을 향해 나아가라</p><div class="heroCard"><div class="portrait">🧑‍🚀</div><h2>모험을 다시 시작한다</h2><p>전투·전직·장비·상태이상·저장 기능을 포함한 모바일 RPG.</p><div class="row"><button class="btn" onclick="openClass()">게임 시작</button><button class="btn alt" onclick="loadGame(true)">이어하기</button></div></div></main><main id="classes" class="screen"><h2>직업 선택</h2><div class="grid" id="classGrid"></div><button class="btn" style="width:100%;margin-top:12px" onclick="confirmClass()">선택 완료</button></main><main id="map" class="screen"><h2>모험 지도</h2><div class="map" id="mapList"></div><div class="row" style="margin-top:12px"><button class="btn alt" onclick="openInv()">인벤토리</button><button class="btn alt" onclick="saveGame();toast('저장 완료')">저장</button></div></main><main id="battle" class="screen"><div id="bossBar" class="bossbar panel"><b id="bossName">BOSS</b><div class="bar"><div id="bossFill" class="fill hp"></div></div></div><div id="field" class="battlefield"><div id="statuses" class="status"></div><div id="heroF" class="fighter hero"><div class="name" id="heroName">영웅</div><div class="sprite" id="heroSprite">⚔️</div><div class="mini"><i id="heroMini"></i></div></div><div id="enemyF" class="fighter enemy"><div class="name" id="enemyName">적</div><div class="sprite" id="enemySprite">👹</div><div class="mini"><i id="enemyMini"></i></div></div></div><div class="actions"><button class="btn" onclick="attack()">공격</button><button class="btn skill" onclick="skill()">스킬 <span id="skillLabel"></span></button><button class="btn alt" onclick="usePotion()">회복약</button><button class="btn alt" onclick="openInv()">장비</button></div><div id="log" class="log"></div></main></div><button class="quality" onclick="toggleFx()">그래픽 <span id="fxLabel">높음</span></button><div id="modal" class="modal"><div class="panel"><h2 id="modalTitle"></h2><div id="modalBody"></div><button class="btn alt" style="width:100%;margin-top:12px" onclick="closeModal()">닫기</button></div></div><script>const KEY='humanGoRecoverySaveV1';const jobs={warrior:{name:'검사',icon:'🗡️',hp:130,atk:32,skill:'검기',desc:'높은 체력과 강한 일격'},archer:{name:'궁수',icon:'🏹',hp:100,atk:38,skill:'더블 애로우',desc:'빠르고 강한 연속 공격'},mage:{name:'마법사',icon:'🪄',hp:90,atk:44,skill:'번개 마법',desc:'강력한 마법 공격'}};const stageNames=['숲의 입구','고블린 길목','폐허 도시','박사의 연구소','황무지'];const S={job:null,hp:100,maxHp:100,atk:25,xp:0,gold:0,unlocked:1,stage:1,wave:1,potions:3,inventory:[],equipped:null,status:{poison:0,bleed:0,stun:0},fx:'high'};let enemy=null,busy=false,selected='warrior';function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');updateHud()}function openClass(){show('classes');renderClasses()}function renderClasses(){classGrid.innerHTML=Object.entries(jobs).map(([k,j])=>`<button class="class ${selected===k?'sel':''}" onclick="selected='${k}';renderClasses()"><div class="portrait">${j.icon}</div><div><b>${j.name}</b><p>${j.desc}</p><small>HP ${j.hp} · 공격 ${j.atk}</small></div></button>`).join('')}function confirmClass(){S.job=selected;let j=jobs[selected];S.maxHp=j.hp;S.hp=j.hp;S.atk=j.atk;saveGame();show('map');renderMap()}function renderMap(){mapList.innerHTML=stageNames.map((n,i)=>{let st=i+1,lock=st>S.unlocked;return `<button class="node ${lock?'lock':''}" ${lock?'disabled':''} onclick="startStage(${st})"><span class="num">${st}</span><span><b>${n}</b><br><small>${st===5?'15전투 · 황무지 보스전':'전투 지역'}</small></span></button>`}).join('')}function startStage(st){S.stage=st;S.wave=1;if(st===5)story('황무지','박사와의 치열한 전투 끝에 로봇을 파괴했다. 박사는 “나를 다시 찾으면 그때 결판을 내도록 하지.”라는 말을 남기고 사라졌다. 황무지를 넘어 네르시아와 스칸디움으로 향한다.');spawn()}const normal=[['고블린','👺',70,14],['강화 고블린','👹',100,18],['해골 기사','💀',140,22],['박사 로봇','🤖',190,27]];function enemyFor(){if(S.stage<5){let a=normal[S.stage-1];return {name:a[0],icon:a[1],max:a[2]+S.wave*8,hp:a[2]+S.wave*8,atk:a[3],boss:S.wave===5}}let w=S.wave;if(w===8)return{name:'옴니디 스파이크',icon:'🦔',max:9000,hp:9000,atk:200,boss:true};if(w===15)return{name:'스캐빈저 도그',icon:'🐕',max:11000,hp:11000,atk:300,boss:true,special:'bite'};if(w%4===0)return{name:'거대 독전갈',icon:'🦂',max:7000,hp:7000,atk:200,special:'poison'};if(w%3===0)return{name:'콘도르',icon:'🦅',max:7000,hp:7000,atk:180,special:'stun'};return{name:'갑각 좀비 낙타',icon:'🐪',max:8000,hp:8000,atk:100}}function spawn(){show('battle');field.className='battlefield'+(S.stage===5?' waste':'');if(S.stage===5&&[3,9,12].includes(S.wave))eventBox();if(S.stage===5&&S.wave===7){S.hp=S.maxHp;story('신비의 우물','신비한 물이 상처를 모두 회복시켰다. 체력이 완전히 회복되었다.')}enemy=enemyFor();enemyName.textContent=enemy.name;enemySprite.textContent=enemy.icon;enemyF.className='fighter enemy'+(enemy.boss?' boss':'');bossBar.classList.toggle('on',!!enemy.boss);bossName.textContent=enemy.name;log.innerHTML='';say(`${S.stage}-${S.wave} ${enemy.name} 등장!`);renderBattle()}function renderBattle(){heroName.textContent=jobs[S.job]?.name||'영웅';heroSprite.textContent=jobs[S.job]?.icon||'⚔️';skillLabel.textContent=jobs[S.job]?.skill||'';heroMini.style.width=Math.max(0,S.hp/S.maxHp*100)+'%';enemyMini.style.width=Math.max(0,enemy.hp/enemy.max*100)+'%';bossFill.style.width=Math.max(0,enemy.hp/enemy.max*100)+'%';statuses.innerHTML=Object.entries(S.status).filter(x=>x[1]>0).map(([k,v])=>`<span>${k} ${v}턴</span>`).join('');updateHud()}function attack(){if(busy||S.status.stun>0)return turnStatus();hitEnemy(S.atk+Math.floor(Math.random()*9));enemyTurn()}function skill(){if(busy||S.status.stun>0)return turnStatus();let mult=S.job==='warrior'?2:S.job==='archer'?1.75:2.25;hitEnemy(Math.floor(S.atk*mult),true);if(S.job==='archer'&&enemy.hp>0)hitEnemy(Math.floor(S.atk*.8),true);enemyTurn()}function hitEnemy(d,sp=false){heroF.classList.add('attack');setTimeout(()=>heroF.classList.remove('attack'),350);enemy.hp=Math.max(0,enemy.hp-d);pop(enemyF,d);enemyF.classList.add('hit');setTimeout(()=>enemyF.classList.remove('hit'),300);say(`${sp?'스킬':'공격'}! ${d} 피해`);renderBattle();if(enemy.hp<=0)win()}function enemyTurn(){if(!enemy||enemy.hp<=0)return;busy=true;setTimeout(()=>{let d=enemy.atk;if(enemy.special==='bite'&&Math.random()<.25)d=600;if(enemy.special==='poison'&&Math.random()<.4)S.status.poison=3;if(enemy.special==='stun'&&Math.random()<.3){d=250;S.status.stun=1}S.hp=Math.max(0,S.hp-d);pop(heroF,d);heroF.classList.add('hit');setTimeout(()=>heroF.classList.remove('hit'),300);say(`${enemy.name}의 공격! ${d} 피해`);tickStatus();busy=false;if(S.hp<=0)lose();renderBattle()},480)}function tickStatus(){if(S.status.poison>0){S.hp=Math.max(0,S.hp-88);S.status.poison--;say('독 피해 88')}if(S.status.bleed>0){S.hp=Math.max(0,S.hp-90);S.status.bleed--}if(S.status.stun>0)S.status.stun--}function turnStatus(){say('기절하여 행동할 수 없다.');tickStatus();enemyTurn()}function win(){busy=true;S.gold+=enemy.boss?30:8;S.xp+=20;if(Math.random()<.28)S.inventory.push({name:enemy.boss?'보스의 유물':'낡은 장비',rarity:enemy.boss?'epic':'common',atk:enemy.boss?18:5});setTimeout(()=>{busy=false;let max=S.stage===5?15:5;if(S.wave>=max){S.unlocked=Math.max(S.unlocked,Math.min(5,S.stage+1));saveGame();story('지역 클리어',`${stageNames[S.stage-1]} 클리어!`);show('map');renderMap()}else{S.wave++;saveGame();spawn()}},650)}function lose(){busy=true;setTimeout(()=>{busy=false;S.hp=S.maxHp;saveGame();story('전투 패배','직전 안전 지점으로 복구했습니다. 체력을 회복하고 지도로 돌아갑니다.');show('map');renderMap()},500)}function usePotion(){if(S.potions<=0)return say('회복약이 없다.');S.potions--;S.hp=Math.min(S.maxHp,S.hp+Math.floor(S.maxHp*.4));say('회복약 사용');renderBattle()}function eventBox(){let r=Math.random();if(r<.34){S.gold+=40;story('황무지 이벤트','모래 속 보급품을 발견했다. 40G 획득.')}else if(r<.67){S.potions++;story('황무지 이벤트','버려진 가방에서 회복약을 발견했다.')}else{S.hp=Math.max(1,S.hp-50);story('황무지 이벤트','모래폭풍을 만나 체력 50을 잃었다.')}}function openInv(){modalTitle.textContent='인벤토리';modalBody.innerHTML=`<p>회복약 ${S.potions}개 · 장착: ${S.equipped?.name||'없음'}</p><div class="inv">${S.inventory.length?S.inventory.map((x,i)=>`<button class="item ${x.rarity}" onclick="equip(${i})"><b>${x.name}</b><span>공격 +${x.atk}</span></button>`).join(''):'아이템이 없습니다.'}</div>`;modal.classList.add('on')}function equip(i){S.equipped=S.inventory[i];updateStats();saveGame();openInv()}function updateStats(){let j=jobs[S.job];if(j)S.atk=j.atk+(S.equipped?.atk||0)}function story(t,b){modalTitle.textContent=t;modalBody.innerHTML=`<p>${b}</p>`;modal.classList.add('on')}function closeModal(){modal.classList.remove('on')}function say(t){log.innerHTML+=`<div>› ${t}</div>`;log.scrollTop=log.scrollHeight}function pop(el,n){let d=document.createElement('div');d.className='damage';d.textContent='-'+n;d.style.left=(el.offsetLeft+30)+'px';d.style.top=(el.offsetTop+30)+'px';field.appendChild(d);setTimeout(()=>d.remove(),850)}function updateHud(){hudJob.textContent=jobs[S.job]?.name||'모험가';hudStage.textContent=document.getElementById('battle').classList.contains('on')?`${S.stage}-${S.wave}`:`STAGE ${S.stage}`;hpText.textContent=`${Math.ceil(S.hp)}/${S.maxHp}`;hpFill.style.width=Math.max(0,S.hp/S.maxHp*100)+'%';xpFill.style.width=(S.xp%100)+'%';gold.textContent=S.gold+'G'}function saveGame(){try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem(KEY+'_backup',JSON.stringify(S))}catch(e){}}function loadGame(go=false){try{let raw=localStorage.getItem(KEY)||localStorage.getItem(KEY+'_backup');if(!raw)return go&&openClass();let d=JSON.parse(raw);if(!d||typeof d!=='object')throw 0;Object.assign(S,d);updateStats();if(go){show('map');renderMap()}updateHud()}catch(e){try{localStorage.removeItem(KEY)}catch(_){}}}function toggleFx(){S.fx=S.fx==='high'?'low':'high';document.body.classList.toggle('lowfx',S.fx==='low');fxLabel.textContent=S.fx==='low'?'낮음':'높음';saveGame()}function toast(t){story('알림',t)}window.addEventListener('error',()=>{try{localStorage.setItem(KEY+'_crash',JSON.stringify({time:Date.now(),state:S}))}catch(e){}});loadGame(false);renderClasses();updateHud();</script></body></html>
