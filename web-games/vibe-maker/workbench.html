<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>재운게임즈 바이브 작업실</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#eef3f8;color:#142235;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif}body{padding:10px}main{width:min(100%,980px);margin:auto}.card{background:#fff;border-radius:18px;padding:14px;box-shadow:0 10px 30px rgba(20,40,60,.1)}h1{margin:0;font-size:22px}.sub{margin:6px 0 14px;color:#60758a;font-size:12px;font-weight:700}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{min-height:46px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:900;padding:0 12px}button.secondary{background:#e8f0f7;color:#19527c}.status{margin-top:10px;padding:10px;border-radius:12px;background:#f5f9fc;font-size:12px;font-weight:800;overflow-wrap:anywhere}.request{margin-top:10px}.request textarea{width:100%;min-height:92px;border:2px solid #d5e2ed;border-radius:12px;padding:12px;font:700 15px/1.45 inherit;resize:vertical;outline:0}.request textarea:focus{border-color:#5da7e8}.grid{display:grid;grid-template-columns:280px 1fr;gap:10px;margin-top:10px}.panel{min-width:0;border:1px solid #dde6ed;border-radius:14px;padding:10px}.title{font-size:13px;font-weight:1000;margin-bottom:7px;color:#1d5d88}.files{max-height:480px;overflow:auto;display:grid;gap:6px}.fileItem{text-align:left;min-height:42px;padding:8px 10px;background:#f4f8fb;color:#234a67;border:1px solid #dbe6ee;white-space:normal;overflow-wrap:anywhere}.editor{width:100%;min-height:420px;border:1px solid #26384a;border-radius:10px;background:#0f172a;color:#e7eef6;padding:12px;font:600 12px/1.5 ui-monospace,SFMono-Regular,monospace;resize:vertical;outline:0}.meta{display:grid;grid-template-columns:1fr 1fr;gap:6px}.meta div{padding:8px;border-radius:10px;background:#f5f8fb;font-size:11px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:7px 9px;border-radius:999px;background:#eaf4fb;color:#1768aa;font-size:11px;font-weight:900}.steps{white-space:pre-wrap;max-height:300px;overflow:auto;padding:10px;border-radius:10px;background:#f6f9fb;font:700 11px/1.5 ui-monospace,SFMono-Regular,monospace}.hint{margin-top:10px;font-size:10px;color:#71859a;line-height:1.4}@media(max-width:720px){.grid{grid-template-columns:1fr}.files{max-height:220px}.editor{min-height:360px}.toolbar{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><main><div class="card">
<h1>바이브 개발 작업실</h1>
<p class="sub">게임 폴더를 열고 원하는 결과를 말하면 게임 구조와 품질 영역까지 분석해.</p>
<div class="toolbar"><button id="openWorkspace">게임 폴더 열기</button><button class="secondary" id="refreshFiles">파일 다시 읽기</button></div>
<div class="request"><textarea id="request" placeholder="예: 그래픽을 고급화하고 공격/피격 애니메이션, 타격 이펙트, BGM과 효과음을 넣고 조작도 편하게 해줘"></textarea><div class="toolbar" style="margin-top:8px"><button id="inspectProject">프로젝트 분석</button><button id="planChange">수정 계획 만들기</button></div></div>
<div class="status" id="status">아직 프로젝트를 열지 않았어.</div>
<div class="status" id="summary">프로젝트 정보 없음</div>
<div class="grid">
<section class="panel"><div class="title">파일</div><div class="files" id="files"></div></section>
<section class="panel"><div class="title">선택 파일 · <span id="selectedFile">없음</span></div><textarea class="editor" id="editor" spellcheck="false" placeholder="왼쪽에서 텍스트 파일을 골라줘."></textarea><div class="toolbar" style="margin-top:8px"><button id="saveFile">저장</button><button class="secondary" id="restoreSnapshot">읽었을 때 상태로 복원</button></div></section>
</div>
<section class="panel" style="margin-top:10px"><div class="title">품질 작업 영역</div><div class="chips" id="qualitySystems"><span class="chip">요청을 분석하면 자동 분류</span></div></section>
<section class="panel" style="margin-top:10px"><div class="title">작업 계획</div><div class="meta"><div><b>대상</b><br><span id="plan-target">-</span></div><div><b>작업</b><br><span id="plan-intent">-</span></div><div><b>영향</b><br><span id="plan-affected">-</span></div><div><b>보존</b><br><span id="plan-protected">-</span></div><div><b>그래픽 스타일</b><br><span id="plan-style">-</span></div><div><b>애니메이션</b><br><span id="plan-animation">-</span></div><div><b>모바일</b><br><span id="plan-mobile">-</span></div><div><b>품질</b><br><span id="plan-quality">-</span></div></div><div class="title" style="margin-top:10px">단계</div><div class="steps" id="steps">-</div><div class="toolbar" style="margin-top:8px"><button class="secondary" id="exportPlan">작업 계획 저장</button></div></section>
<p class="hint">기존 게임은 자동으로 바꾸지 않아. 저장할 때 읽었던 원본을 먼저 백업하고, 잘못된 수정은 세션에서 복원할 수 있어.</p>
</div></main>
<script type="module">import { createVibeWorkbenchController } from './workbench.js';createVibeWorkbenchController();</script>
</body>
</html>
