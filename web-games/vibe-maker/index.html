<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6fc7ff">
<title>재운게임즈 바이브 게임 만들기</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;background:#bfe9ff;color:#17375e}body{padding:10px}main{width:min(100%,760px);margin:auto}.card{background:#fff;border:2px solid #d8ebf5;border-radius:20px;padding:14px;box-shadow:0 12px 30px rgba(31,101,151,.12)}h1{margin:0;color:#1463a8;font-size:24px}.sub{margin:6px 0 14px;color:#67869b;font-weight:700;font-size:13px}textarea{width:100%;min-height:110px;border:2px solid #b7dcf0;border-radius:14px;padding:12px;font:700 16px/1.5 inherit;outline:0}textarea:focus{border-color:#43a1e8}.row,.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}button{min-height:46px;border:0;border-radius:12px;background:#2e8fe5;color:#fff;font-weight:900;font-size:14px}button.secondary{background:#eef8ff;color:#1e75b4}.status{margin-top:10px;padding:10px 12px;border-radius:12px;background:#f4fbff;color:#4f7187;font-size:12px;font-weight:800}.section{margin-top:12px}.title{margin-bottom:6px;color:#1b669f;font-weight:1000;font-size:14px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:7px 9px;border-radius:999px;background:#eef8ff;color:#1768aa;font-size:11px;font-weight:900}.item{padding:9px;border-radius:11px;background:#f7fbfd;min-height:54px}.item b{display:block;color:#307cab;font-size:10px;margin-bottom:3px}.item span{font-size:12px;font-weight:800}pre{margin:0;max-height:250px;overflow:auto;padding:10px;border-radius:11px;background:#15263a;color:#eaf7ff;font:600 10px/1.4 ui-monospace,SFMono-Regular,monospace}.hidden{display:none}.preview{margin-top:7px;overflow:hidden;border-radius:14px;background:#102536}.preview canvas{display:block;width:100%;height:auto;aspect-ratio:16/10;touch-action:none}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:7px}.controls button{min-height:42px}.hint{margin-top:10px;color:#728d9f;font-size:11px;line-height:1.45}@media(max-width:520px){.grid,.row{grid-template-columns:1fr}}
</style>
</head>
<body><main><div class="card">
<h1>🎮 바이브로 게임 만들기</h1>
<p class="sub">부품 이름을 몰라도 하고 싶은 게임을 그냥 말하면 돼.</p>
<textarea id="prompt" placeholder="예: 체력 100 공격력 20으로 하고 밤에는 괴물 5마리씩 3초마다 나오게 해줘"></textarea>
<div class="row"><button id="build">게임 만들기</button><button class="secondary" id="example">예시 넣기</button></div>
<div class="status" id="status">아직 게임을 만들지 않았어.</div>
<div class="section"><div class="title">게임으로 알아들은 것</div><div class="grid" id="summary"></div></div>
<div class="section"><div class="title">자동으로 준비한 기능</div><div class="chips" id="systems"></div></div>
<div class="section"><div class="title">읽어낸 게임 규칙</div><pre id="rules">-</pre></div>
<div class="section hidden" id="previewSection"><div class="title">초기 게임 프로토타입</div><div class="status" id="previewInfo">준비 중</div><div class="preview"><canvas id="canvas" width="960" height="600"></canvas></div><div class="controls"><button id="left">←</button><button id="attack">⚔ 공격</button><button id="right">→</button></div></div>
<div class="section"><div class="title">게임 세션</div><div class="status" id="session">아직 세션을 만들지 않았어.</div></div>
<p class="hint">자연어에서 읽은 숫자와 조건은 이 초기 프로토타입에만 적용해. 기존 게임 파일과 기존 저장 데이터는 자동으로 바꾸지 않아.</p>
</div></main>
<script type="module">
const $=id=>document.getElementById(id);const promptBox=$('prompt');const status=$('status');const summary=$('summary');const systems=$('systems');const rules=$('rules');const previewSection=$('previewSection');const previewInfo=$('previewInfo');const sessionBox=$('session');const canvas=$('canvas');const ctx=canvas.getContext('2d');
const examples=['체력 100 공격력 20으로 하고 밤에는 괴물 5마리씩 3초마다 나오게 해줘','모바일 디펜스 게임 만들어줘. 포탑으로 성을 지키고 적은 2초마다 나와','Godot으로 턴제 RPG 만들어줘. 주사위 굴리고 레벨업하고 퀘스트 넣어줘'];
$('example').onclick=()=>{promptBox.value=examples[Math.floor(Math.random()*examples.length)];promptBox.focus()};
function showBlueprint(bp){const i=bp.intent||{};const rows=[['장르',bp.genre],['플랫폼',bp.platform],['인원',i.playerCount?`${i.playerCount}명`:'자동'],['방향',i.presentation?.orientation||'자동'],['모바일',i.presentation?.mobileFirst?'우선':'기본']];summary.innerHTML=rows.map(([a,b])=>`<div class="item"><b>${a}</b><span>${b??'자동'}</span></div>`).join('');const keys=Object.entries(bp.kitConfig||{}).filter(([k,v])=>k!=='gameId'&&v).map(([k])=>k);systems.innerHTML=keys.length?keys.map(k=>`<span class="chip">${k}</span>`).join(''):'<span class="chip">기본 시스템</span>';rules.textContent=JSON.stringify({rules:i.rules||{},entityRules:i.entityRules||{}},null,2)}
let session=null;let state={genre:'action',hp:100,maxHp:100,damage:10,spawnInterval:4,enemyCount:3,enemyHp:20,x:480,y:300,score:0,enemies:[],phase:'day',lastSpawn:0};let keys=new Set();let raf=0,last=0;
function num(v,f,min=0){const n=Number(v);return Number.isFinite(n)&&n>min?n:f}
function readRules(bp){const r=bp.intent?.rules||{};const e=bp.intent?.entityRules||{};let enemyHp=20;let enemyCount=3;const first=Object.values(e)[0];if(first?.hp!=null)enemyHp=num(first.hp,enemyHp);if(r.hp!=null)state.maxHp=num(r.hp,state.maxHp);if(r.damage!=null)state.damage=num(r.damage,state.damage);if(r.interval!=null)state.spawnInterval=Math.max(.25,num(r.interval,state.spawnInterval));if(r.count!=null)enemyCount=Math.max(1,Math.floor(num(r.count,enemyCount)));if(r.waves!=null)state.waves=Math.max(1,Math.floor(r.waves));state.enemyCount=enemyCount;state.enemyHp=enemyHp;state.nightOnly=Array.isArray(r.conditions)&&r.conditions.includes('night-only')}
function reset(bp){state.genre=bp.genre||'action';state.hp=state.maxHp;state.x=480;state.y=300;state.score=0;state.phase='day';state.enemies=[];readRules(bp);const initial=Math.max(1,state.enemyCount);for(let i=0;i<initial;i++)spawn(i);previewSection.classList.remove('hidden');previewInfo.textContent=`${state.genre} · HP ${state.maxHp} · 공격 ${state.damage}`;cancelAnimationFrame(raf);last=performance.now();raf=requestAnimationFrame(loop)}
function spawn(i=0){const a=(i*1.9)%6.28;state.enemies.push({x:480+Math.cos(a)*350,y:300+Math.sin(a)*220,hp:state.enemyHp,r:15})}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function attack(){let t=null,b=1e9;for(const e of state.enemies){const d=Math.hypot(e.x-state.x,e.y-state.y);if(d<b){b=d;t=e}}if(t&&b<130){t.hp-=state.damage;if(t.hp<=0){state.enemies.splice(state.enemies.indexOf(t),1);state.score++;if(state.score%3===0)spawn()}}}
function update(dt,now){let dx=(keys.has('ArrowRight')||keys.has('d')?1:0)-(keys.has('ArrowLeft')||keys.has('a')?1:0);let dy=(keys.has('ArrowDown')||keys.has('s')?1:0)-(keys.has('ArrowUp')||keys.has('w')?1:0);const m=Math.hypot(dx,dy)||1;if(dx||dy){state.x+=dx/m*220*dt;state.y+=dy/m*220*dt}state.x=clamp(state.x,20,940);state.y=clamp(state.y,20,580);if(state.genre==='survival'){state.phase=(Math.floor(now/1000)%20)<12?'day':'night'}else state.phase='day';const hostile=!state.nightOnly||state.phase==='night';if(hostile){for(const e of state.enemies){const ex=state.x-e.x,ey=state.y-e.y,d=Math.hypot(ex,ey)||1;e.x+=ex/d*32*dt;e.y+=ey/d*32*dt;if(d<28)state.hp=Math.max(0,state.hp-8*dt)}if(now/1000-state.lastSpawn>=state.spawnInterval){state.lastSpawn=now/1000;for(let i=0;i<state.enemyCount;i++)spawn(i)}}else state.lastSpawn=now/1000}
function render(){ctx.clearRect(0,0,960,600);ctx.fillStyle=state.phase==='night'?'#142438':'#9fd7a6';ctx.fillRect(0,0,960,600);for(let i=0;i<18;i++){ctx.fillStyle='#2a6b3a';ctx.fillRect((i*101)%940+10,(i*59)%560+20,5,5)}for(const e of state.enemies){ctx.fillStyle='#cf5d5d';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#3b7ee8';ctx.beginPath();ctx.arc(state.x,state.y,17,0,Math.PI*2);ctx.fill();ctx.fillStyle='#102536';ctx.fillRect(14,14,285,62);ctx.fillStyle='#fff';ctx.font='700 18px system-ui';ctx.fillText(`HP ${Math.ceil(state.hp)} / ${state.maxHp}`,28,40);ctx.fillText(`공격 ${state.damage} · 점수 ${state.score} · ${state.phase}`,28,63);if(state.hp<=0){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,960,600);ctx.fillStyle='#fff';ctx.font='900 40px system-ui';ctx.fillText('게임오버',395,285)}}
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(state.hp>0)update(dt,now);render();raf=requestAnimationFrame(loop)}
window.addEventListener('keydown',e=>{keys.add(e.key);if(e.key===' ')attack()});window.addEventListener('keyup',e=>keys.delete(e.key));$('left').onpointerdown=()=>keys.add('ArrowLeft');$('left').onpointerup=()=>keys.delete('ArrowLeft');$('right').onpointerdown=()=>keys.add('ArrowRight');$('right').onpointerup=()=>keys.delete('ArrowRight');$('attack').onclick=attack;
$('build').onclick=async()=>{const prompt=promptBox.value.trim();if(!prompt){status.textContent='하고 싶은 게임을 한마디로 적어줘.';promptBox.focus();return}status.textContent='자연어 규칙을 읽는 중...';sessionBox.textContent='게임 세션 준비 중...';try{const mod=await import('../../assets/game-kit.js');const result=await mod.createGameSessionFromPrompt({gameId:`vibe-${Date.now()}`,prompt,autoRestore:false});session=result.session;window.__vibeSession=session;showBlueprint(result.blueprint);reset(result.blueprint);sessionBox.textContent=`세션 생성 성공 · 시스템 ${session.kit.enabledSystems().length}개 준비`;status.textContent='완료: 읽은 규칙을 초기 프로토타입에 적용했어.'}catch(error){status.textContent=`만들기에 실패했어: ${error?.message||error}`;sessionBox.textContent='세션 생성 실패';console.error(error)}};
</script></body></html>
