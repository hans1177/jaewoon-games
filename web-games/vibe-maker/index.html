<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6fc7ff">
<title>재운게임즈 바이브 게임 만들기</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;background:#bfe9ff;color:#17375e}body{padding:10px}main{width:min(100%,760px);margin:auto}.card{background:#fff;border:2px solid #d8ebf5;border-radius:20px;padding:14px;box-shadow:0 12px 30px rgba(31,101,151,.12)}h1{margin:0;color:#1463a8;font-size:24px}.sub{margin:6px 0 14px;color:#67869b;font-weight:700;font-size:13px}textarea{width:100%;min-height:110px;border:2px solid #b7dcf0;border-radius:14px;padding:12px;font:700 16px/1.5 inherit;outline:0}textarea:focus{border-color:#43a1e8}.row,.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}button{min-height:46px;border:0;border-radius:12px;background:#2e8fe5;color:#fff;font-weight:900;font-size:14px}button.secondary{background:#eef8ff;color:#1e75b4}.status{margin-top:10px;padding:10px 12px;border-radius:12px;background:#f4fbff;color:#4f7187;font-size:12px;font-weight:800}.section{margin-top:12px}.title{margin-bottom:6px;color:#1b669f;font-weight:1000;font-size:14px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:7px 9px;border-radius:999px;background:#eef8ff;color:#1768aa;font-size:11px;font-weight:900}.item{padding:9px;border-radius:11px;background:#f7fbfd;min-height:54px}.item b{display:block;color:#307cab;font-size:10px;margin-bottom:3px}.item span{font-size:12px;font-weight:800}pre{margin:0;max-height:250px;overflow:auto;padding:10px;border-radius:11px;background:#15263a;color:#eaf7ff;font:600 10px/1.4 ui-monospace,SFMono-Regular,monospace}.hidden{display:none}.preview{margin-top:7px;overflow:hidden;border-radius:14px;background:#102536}.preview canvas{display:block;width:100%;height:auto;aspect-ratio:16/10;touch-action:none}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:7px}.controls button{min-height:42px}.hint{margin-top:10px;color:#728d9f;font-size:11px;line-height:1.45}@media(max-width:520px){.grid,.row{grid-template-columns:1fr}}
</style>
</head>
<body><main><div class="card">
<h1>🎮 바이브로 게임 만들기</h1>
<p class="sub">부품 이름을 몰라도 하고 싶은 게임을 그냥 말하면 돼.</p>
<textarea id="prompt" placeholder="예: 체력 100 공격력 20으로 하고 밤에는 괴물 5마리씩 3초마다 나오게 해줘"></textarea>
<div class="row"><button id="build">게임 만들기</button><button class="secondary" id="example">예시 넣기</button></div>
<div class="status" id="status">아직 게임을 만들지 않았어.</div>
<div class="section"><div class="title">게임으로 알아들은 것</div><div class="grid" id="summary"></div></div>
<div class="section"><div class="title">자동으로 준비한 기능</div><div class="chips" id="systems"></div></div>
<div class="section"><div class="title">읽어낸 게임 규칙</div><pre id="rules">-</pre></div>
<div class="section hidden" id="previewSection"><div class="title">초기 게임 프로토타입</div><div class="status" id="previewInfo">준비 중</div><div class="preview"><canvas id="canvas" width="960" height="600"></canvas></div><div class="controls"><button id="left">←</button><button id="attack">⚔ 공격</button><button id="right">→</button></div></div>
<div class="section"><div class="title">게임 세션</div><div class="status" id="session">아직 세션을 만들지 않았어.</div></div>
<p class="hint">자연어에서 읽은 숫자와 조건은 이 초기 프로토타입에만 적용해. 기존 게임 파일과 기존 저장 데이터는 자동으로 바꾸지 않아.</p>
</div></main>
<script type="module">
const $=id=>document.getElementById(id);const promptBox=$('prompt');const status=$('status');const summary=$('summary');const systems=$('systems');const rules=$('rules');const previewSection=$('previewSection');const previewInfo=$('previewInfo');const sessionBox=$('session');const canvas=$('canvas');const ctx=canvas.getContext('2d');
const examples=['체력 100 공격력 20으로 하고 밤에는 괴물 5마리씩 3초마다 나오게 해줘','모바일 디펜스 게임 만들어줘. 포탑으로 성을 지키고 적은 2초마다 나와','Godot으로 턴제 RPG 만들어줘. 주사위 굴리고 레벨업하고 퀘스트 넣어줘'];
$('example').onclick=()=>{promptBox.value=examples[Math.floor(Math.random()*examples.length)];promptBox.focus()};
function showBlueprint(bp){const i=bp.intent||{};const rows=[['장르',bp.genre],['플랫폼',bp.platform],['인원',i.playerCount?`${i.playerCount}명`:'자동'],['방향',i.presentation?.orientation||'자동'],['모바일',i.presentation?.mobileFirst?'우선':'기본']];summary.innerHTML=rows.map(([a,b])=>`<div class="item"><b>${a}</b><span>${b??'자동'}</span></div>`).join('');const keys=Object.entries(bp.kitConfig||{}).filter(([k,v])=>k!=='gameId'&&v).map(([k])=>k);systems.innerHTML=keys.length?keys.map(k=>`<span class="chip">${k}</span>`).join(''):'<span class="chip">기본 시스템</span>';rules.textContent=JSON.stringify({rules:i.rules||{},entityRules:i.entityRules||{},objectSpecs:i.objectSpecs||[]},null,2)}
let session=null;let state={genre:'action',hp:100,maxHp:100,damage:10,spawnInterval:4,enemyCount:3,enemyHp:20,x:480,y:300,score:0,enemies:[],phase:'day',lastSpawn:0,lastAutoAttack:0,autoAttack:false,attackRange:130,enemyRange:28,enemySpeed:32,enemyBehavior:'chase',areaRadius:80,areaDamage:0,knockback:0,stun:0,slow:0};let keys=new Set();let raf=0,last=0;
function num(v,f,min=0){const n=Number(v);return Number.isFinite(n)&&n>min?n:f}
function collectSpecs(bp){return bp.intent?.objectSpecs||[]}
function findSpec(specs,predicates){return specs.find(spec=>predicates.some(predicate=>String(spec.name||'').includes(predicate)))||null}
function applyObjectRules(bp){
  const specs=collectSpecs(bp);const player=findSpec(specs,['주인공','플레이어','캐릭터','영웅','기사','나']);const enemy=findSpec(specs,['고블린','오크','좀비','전갈','거미','벌','적','몬스터','보스']);const weapon=findSpec(specs,['검','칼','활','총','창','도끼','무기','지팡이']);const skill=findSpec(specs,['스킬','특수기','필살기','기술','마법']);
  if(player?.properties?.hp!=null)state.maxHp=num(player.properties.hp,state.maxHp);
  if(player?.properties?.damage!=null)state.damage=num(player.properties.damage,state.damage);
  if(weapon?.properties?.damage!=null)state.damage=num(weapon.properties.damage,state.damage);
  const activeTarget=weapon||player;
  if(activeTarget?.properties?.range!=null)state.attackRange=Math.max(40,num(activeTarget.properties.range,state.attackRange));
  if(activeTarget?.properties?.speed!=null)state.attackSpeed=Math.max(.1,num(activeTarget.properties.speed,1));
  if(player?.effects?.includes('auto-attack')||weapon?.effects?.includes('auto-attack')||skill?.effects?.includes('auto-attack'))state.autoAttack=true;
  if(enemy?.properties?.hp!=null)state.enemyHp=num(enemy.properties.hp,state.enemyHp);
  if(enemy?.properties?.damage!=null)state.enemyDamage=num(enemy.properties.damage,8);
  if(enemy?.properties?.range!=null)state.enemyRange=Math.max(28,num(enemy.properties.range,state.enemyRange));
  if(enemy?.properties?.speed!=null)state.enemySpeed=Math.max(4,num(enemy.properties.speed,state.enemySpeed));
  const behavior=[...(enemy?.effects||[]),...(enemy?.properties?.actions||[])];
  if(behavior.includes('ranged'))state.enemyBehavior='ranged';
  if(behavior.includes('flee'))state.enemyBehavior='flee';
  if(behavior.includes('chase'))state.enemyBehavior='chase';
  if(behavior.includes('melee'))state.enemyBehavior='melee';
  if(behavior.includes('nearest'))state.targetPriority='nearest';
  if(behavior.includes('farthest'))state.targetPriority='farthest';
  if(behavior.includes('lowest-hp'))state.targetPriority='lowest-hp';
  if(behavior.includes('highest-hp'))state.targetPriority='highest-hp';
  const areaSource=skill||enemy||weapon;
  if(areaSource?.properties?.range!=null&&areaSource.effects?.includes('area-effect'))state.areaRadius=Math.max(35,num(areaSource.properties.range,state.areaRadius));
  if(areaSource?.effects?.includes('area-effect'))state.areaDamage=num(areaSource.properties.damage,state.damage);
  if(areaSource?.effects?.includes('knockback'))state.knockback=120;
  if(areaSource?.effects?.includes('stun'))state.stun=1.5;
  if(areaSource?.effects?.includes('slow'))state.slow=.5;
}
function readRules(bp){const r=bp.intent?.rules||{};if(r.hp!=null)state.maxHp=num(r.hp,state.maxHp);if(r.damage!=null)state.damage=num(r.damage,state.damage);if(r.interval!=null)state.spawnInterval=Math.max(.25,num(r.interval,state.spawnInterval));if(r.count!=null)state.enemyCount=Math.max(1,Math.floor(num(r.count,state.enemyCount)));if(r.waves!=null)state.waves=Math.max(1,Math.floor(r.waves));state.nightOnly=Array.isArray(r.conditions)&&r.conditions.includes('night-only');if(Array.isArray(r.conditions)&&r.conditions.includes('auto-attack'))state.autoAttack=true;if(Array.isArray(r.conditions)&&r.conditions.includes('area-effect'))state.areaRadius=80;applyObjectRules(bp)}
function reset(bp){state={...state,genre:bp.genre||'action',hp:100,maxHp:100,damage:10,spawnInterval:4,enemyCount:3,enemyHp:20,x:480,y:300,score:0,enemies:[],phase:'day',lastSpawn:performance.now()/1000,lastAutoAttack:0,autoAttack:false,attackRange:130,enemyRange:28,enemySpeed:32,enemyBehavior:'chase',areaRadius:80,areaDamage:0,knockback:0,stun:0,slow:0};readRules(bp);state.hp=state.maxHp;previewSection.classList.remove('hidden');previewInfo.textContent=`${state.genre} · HP ${state.maxHp} · 공격 ${state.damage}${state.autoAttack?' · 자동공격':''}`;for(let i=0;i<Math.max(1,state.enemyCount);i++)spawn(i);cancelAnimationFrame(raf);last=performance.now();raf=requestAnimationFrame(loop)}
function spawn(i=0){const a=(i*1.9)%6.28;state.enemies.push({x:480+Math.cos(a)*350,y:300+Math.sin(a)*220,hp:state.enemyHp,r:15,stunUntil:0,slowUntil:0})}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function chooseTarget(){const alive=state.enemies.filter(e=>e.hp>0);if(!alive.length)return null;if(state.targetPriority==='farthest')return alive.reduce((a,b)=>Math.hypot(a.x-state.x,a.y-state.y)>Math.hypot(b.x-state.x,b.y-state.y)?a:b);if(state.targetPriority==='lowest-hp')return alive.reduce((a,b)=>a.hp<b.hp?a:b);if(state.targetPriority==='highest-hp')return alive.reduce((a,b)=>a.hp>b.hp?a:b);return alive.reduce((a,b)=>Math.hypot(a.x-state.x,a.y-state.y)<Math.hypot(b.x-state.x,b.y-state.y)?a:b)}
function damageTarget(target){if(!target)return false;target.hp-=state.damage;if(state.areaDamage>0&&state.areaRadius>0){for(const e of state.enemies){if(e===target||e.hp<=0)continue;if(Math.hypot(e.x-target.x,e.y-target.y)<=state.areaRadius)e.hp-=state.areaDamage}}if(state.knockback){const dx=target.x-state.x,dy=target.y-state.y,d=Math.hypot(dx,dy)||1;target.x=clamp(target.x+dx/d*state.knockback,20,940);target.y=clamp(target.y+dy/d*state.knockback,20,580)}return true}
function attack(){const target=chooseTarget();if(target&&Math.hypot(target.x-state.x,target.y-state.y)<=state.attackRange){damageTarget(target);cleanup();return true}return false}
function cleanup(){for(let i=state.enemies.length-1;i>=0;i--)if(state.enemies[i].hp<=0){state.enemies.splice(i,1);state.score++;if(state.score%3===0)spawn()}}
function update(dt,now){let dx=(keys.has('ArrowRight')||keys.has('d')?1:0)-(keys.has('ArrowLeft')||keys.has('a')?1:0);let dy=(keys.has('ArrowDown')||keys.has('s')?1:0)-(keys.has('ArrowUp')||keys.has('w')?1:0);const m=Math.hypot(dx,dy)||1;if(dx||dy){state.x+=dx/m*220*dt;state.y+=dy/m*220*dt}state.x=clamp(state.x,20,940);state.y=clamp(state.y,20,580);if(state.genre==='survival')state.phase=(Math.floor(now/1000)%20)<12?'day':'night';const hostile=!state.nightOnly||state.phase==='night';for(const e of state.enemies){if(e.hp<=0)continue;if(now<e.stunUntil)continue;const ex=state.x-e.x,ey=state.y-e.y,d=Math.hypot(ex,ey)||1;const slowFactor=now<e.slowUntil?state.slow||.5:1;if(state.enemyBehavior==='flee'){e.x-=ex/d*state.enemySpeed*slowFactor*dt;e.y-=ey/d*state.enemySpeed*slowFactor*dt}else if(state.enemyBehavior==='ranged'){if(d>state.enemyRange+30){e.x+=ex/d*state.enemySpeed*slowFactor*dt;e.y+=ey/d*state.enemySpeed*slowFactor*dt}if(d<=state.enemyRange)state.hp=Math.max(0,state.hp-4*dt)}else{e.x+=ex/d*state.enemySpeed*slowFactor*dt;e.y+=ey/d*state.enemySpeed*slowFactor*dt;if(d<=state.enemyRange)state.hp=Math.max(0,state.hp-state.enemyDamage*dt)}}if(hostile&&now-state.lastSpawn>=state.spawnInterval){state.lastSpawn=now;for(let i=0;i<state.enemyCount;i++)spawn(i)}if(state.autoAttack&&now-state.lastAutoAttack>=Math.max(.1,state.attackSpeed||.8)){state.lastAutoAttack=now;attack()}cleanup()}
function render(){ctx.clearRect(0,0,960,600);ctx.fillStyle=state.phase==='night'?'#142438':'#9fd7a6';ctx.fillRect(0,0,960,600);for(let i=0;i<18;i++){ctx.fillStyle='#2a6b3a';ctx.fillRect((i*101)%940+10,(i*59)%560+20,5,5)}for(const e of state.enemies){ctx.fillStyle=e.hp<state.enemyHp*.4?'#8c4f4f':'#cf5d5d';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(e.x-6,e.y-3,3,3);ctx.fillRect(e.x+3,e.y-3,3,3);ctx.fillStyle='#233';ctx.fillRect(e.x-15,e.y-23,30,4);ctx.fillStyle='#6ec46e';ctx.fillRect(e.x-15,e.y-23,30*Math.max(0,e.hp/state.enemyHp),4)}ctx.fillStyle='#3b7ee8';ctx.beginPath();ctx.arc(state.x,state.y,17,0,Math.PI*2);ctx.fill();ctx.fillStyle='#102536';ctx.fillRect(14,14,310,62);ctx.fillStyle='#fff';ctx.font='700 18px system-ui';ctx.fillText(`HP ${Math.ceil(state.hp)} / ${state.maxHp}`,28,40);ctx.fillText(`공격 ${state.damage} · 점수 ${state.score} · ${state.phase}`,28,63);if(state.autoAttack){ctx.font='700 13px system-ui';ctx.fillText('자동공격 ON',210,40)}if(state.hp<=0){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,960,600);ctx.fillStyle='#fff';ctx.font='900 40px system-ui';ctx.fillText('게임오버',395,285)}}
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(state.hp>0)update(dt,now);render();raf=requestAnimationFrame(loop)}
window.addEventListener('keydown',e=>{keys.add(e.key);if(e.key===' ')attack()});window.addEventListener('keyup',e=>keys.delete(e.key));$('left').onpointerdown=()=>keys.add('ArrowLeft');$('left').onpointerup=()=>keys.delete('ArrowLeft');$('right').onpointerdown=()=>keys.add('ArrowRight');$('right').onpointerup=()=>keys.delete('ArrowRight');$('attack').onclick=attack;
$('build').onclick=async()=>{const prompt=promptBox.value.trim();if(!prompt){status.textContent='하고 싶은 게임을 한마디로 적어줘.';promptBox.focus();return}status.textContent='자연어 규칙을 읽는 중...';sessionBox.textContent='게임 세션 준비 중...';try{const mod=await import('../../assets/game-kit.js');const result=await mod.createGameSessionFromPrompt({gameId:`vibe-${Date.now()}`,prompt,autoRestore:false});session=result.session;window.__vibeSession=session;showBlueprint(result.blueprint);reset(result.blueprint);sessionBox.textContent=`세션 생성 성공 · 시스템 ${session.kit.enabledSystems().length}개 준비`;status.textContent='완료: 읽은 객체 행동을 초기 프로토타입에 적용했어.'}catch(error){status.textContent=`만들기에 실패했어: ${error?.message||error}`;sessionBox.textContent='세션 생성 실패';console.error(error)}};
</script></body></html>
