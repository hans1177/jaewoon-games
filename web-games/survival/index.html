<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>나의 생존기</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0e1720;color:#fff;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;touch-action:none}#app{position:relative;width:100%;height:100%;overflow:hidden}canvas{display:block;width:100%;height:100%;background:#294d32}.hud{position:absolute;z-index:5;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.box{padding:7px 9px;border:1px solid #ffffff35;border-radius:12px;background:#0c1820c9;backdrop-filter:blur(4px);font-weight:900;font-size:12px}.hp{color:#ff7777}.small{font-size:10px;opacity:.88}.actions{position:absolute;z-index:6;right:10px;top:54px;display:grid;gap:7px}.btn{border:1px solid #ffffff35;border-radius:11px;background:#0c1820d9;color:#fff;padding:9px 11px;font-weight:900;font-size:11px}.btn:active{transform:scale(.97)}#craft,#inv{max-height:68dvh;overflow:auto;touch-action:pan-y}.panel{position:absolute;z-index:10;left:10px;right:10px;top:54px;bottom:10px;padding:12px;border:1px solid #ffffff35;border-radius:16px;background:#071118f5;overflow:auto;display:none;touch-action:pan-y}.panel h2{margin:0 0 9px;font-size:18px}.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px;margin:6px 0;border-radius:12px;background:#12232b;border:1px solid #ffffff12;color:#fff;text-align:left}.item strong{font-size:12px}.item small{display:block;opacity:.72;margin-top:3px;font-weight:700}.item button{border:0;border-radius:9px;background:#3d9b61;color:#fff;padding:8px 10px;font-weight:900}.close{position:sticky;top:-4px;float:right;border:0;border-radius:9px;background:#ffffff1a;color:#fff;padding:7px 9px;font-weight:900}.joystick{position:absolute;z-index:7;left:18px;bottom:20px;width:126px;height:126px;border-radius:50%;background:#ffffff13;border:2px solid #ffffff2b}.stick{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:#ffffff50;border:2px solid #fff6}.hint{position:absolute;z-index:4;left:50%;bottom:14px;transform:translateX(-50%);padding:7px 10px;border-radius:10px;background:#071118b8;font-size:10px;font-weight:800;white-space:nowrap}.toast{position:absolute;z-index:30;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 14px;border-radius:12px;background:#000c;color:#fff;font-weight:900;display:none}.hidden{display:none!important}
</style>
</head>
<body>
<div id="app">
<canvas id="game"></canvas>
<div class="hud"><div class="box">❤️ <span id="hp">100/100</span> · ⚔️ <span id="atk">5</span></div><div class="box">☀️ <span id="clock">낮 08:00</span><br><span class="small">📅 <span id="day">1</span>일 · 🪵 <span id="wood">0</span> · 🪨 <span id="stone">0</span> · 🌿 <span id="fiber">0</span> · 🍎 <span id="food">0</span></span></div></div>
<div class="actions"><button class="btn" id="craftBtn">🛠 제작</button><button class="btn" id="invBtn">🎒 인벤토리</button><button class="btn" id="eatBtn">🍎 음식 먹기</button></div>
<div class="joystick" id="joystick"><div class="stick" id="stick"></div></div><div class="hint">나무·돌·식물을 가까이에서 채집하고 밤에는 적을 피하거나 싸워</div>
<div class="panel" id="craft"><button class="close" data-close="craft">닫기</button><h2>🛠 제작</h2><div id="craftList"></div></div>
<div class="panel" id="inv"><button class="close" data-close="inv">닫기</button><h2>🎒 인벤토리</h2><div id="invList"></div></div>
<div class="toast" id="toast"></div>
</div>
<script>
// 파일명: web-games/survival/index.html
// 메인: 나의 생존기 1차 생존 루프
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const ui={hp:document.getElementById('hp'),atk:document.getElementById('atk'),clock:document.getElementById('clock'),day:document.getElementById('day'),wood:document.getElementById('wood'),stone:document.getElementById('stone'),fiber:document.getElementById('fiber'),food:document.getElementById('food'),toast:document.getElementById('toast')};
const saveKey='jaewoon-survival-v1';
const state={day:1,time:480,wood:0,stone:0,fiber:0,food:0,hp:100,maxHp:100,atk:5,weapon:'맨손',axe:false,club:false,bandage:0,player:{x:0,y:0},resources:[],enemies:[],lastSave:0};
let dpr=1,w=0,h=0,worldW=2400,worldH=1800,dragging=false,joyX=0,joyY=0,attackCooldown=0,resourceCooldown=0,enemySpawn=0,toastTimer=0;
const recipes=[
 {id:'axe',name:'돌도끼',cost:'나무 3 · 돌 2',can:s=>s.wood>=3&&s.stone>=2,make:s=>{s.wood-=3;s.stone-=2;s.axe=true}},
 {id:'club',name:'돌몽둥이',cost:'나무 4 · 돌 4',can:s=>s.wood>=4&&s.stone>=4,make:s=>{s.wood-=4;s.stone-=4;s.club=true}},
 {id:'bandage',name:'붕대 1개',cost:'섬유 3',can:s=>s.fiber>=3,make:s=>{s.fiber-=3;s.bandage++}},
 {id:'meal',name:'생존식 1개',cost:'나무 1 · 식물 2',can:s=>s.wood>=1&&s.fiber>=2,make:s=>{s.wood--;s.fiber-=2;s.food++}}
];
function resize(){dpr=Math.min(2,devicePixelRatio||1);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function rand(a,b){return a+Math.random()*(b-a)}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function toast(t){ui.toast.textContent=t;ui.toast.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>ui.toast.style.display='none',1300)}
function seedWorld(){state.resources=[];state.enemies=[];for(let i=0;i<90;i++){const type=['tree','stone','plant'][i%3];state.resources.push({id:i,type,x:rand(60,worldW-60),y:rand(60,worldH-60),amount:type==='tree'?3:type==='stone'?2:4})}state.player.x=worldW/2;state.player.y=worldH/2}
function save(){try{const copy=JSON.parse(JSON.stringify(state));localStorage.setItem(saveKey,JSON.stringify(copy))}catch(e){}}
function load(){try{const raw=localStorage.getItem(saveKey);if(!raw){seedWorld();return}const s=JSON.parse(raw);Object.assign(state,s);if(!state.resources?.length)seedWorld();if(!state.enemies)state.enemies=[]}catch(e){seedWorld()}}
load();
function worldToScreen(x,y){return{x:x-state.player.x+w/2,y:y-state.player.y+h/2}}
function night(){return state.time>=1260||state.time<360}
function updateClock(dt){state.time+=dt*1.6;if(state.time>=1440){state.time-=1440;state.day++;state.enemies=[];toast('새로운 하루가 시작됐어');}ui.clock.textContent=`${night()?'🌙 밤':'☀️ 낮'} ${String(Math.floor(state.time/60)).padStart(2,'0')}:${String(Math.floor(state.time%60)).padStart(2,'0')}`;ui.day.textContent=state.day}
function nearestResource(){let best=null,bd=999;for(const r of state.resources){const dd=dist(state.player,r);if(dd<bd){bd=dd;best=r}}return best&&bd<58?best:null}
function gather(){if(resourceCooldown>0)return;const r=nearestResource();if(!r)return;resourceCooldown=.25;if(r.type==='tree')state.wood++;if(r.type==='stone')state.stone++;if(r.type==='plant')state.fiber++;r.amount--;toast(r.type==='tree'?'나무 +1':r.type==='stone'?'돌 +1':'식물 +1');if(r.amount<=0){state.resources.splice(state.resources.indexOf(r),1);setTimeout(()=>{state.resources.push({id:Date.now()+Math.random(),type:r.type,x:rand(50,worldW-50),y:rand(50,worldH-50),amount:r.type==='tree'?3:r.type==='stone'?2:4})},6000)}}
function spawnEnemy(){if(!night()||state.enemies.length>=8)return;const side=Math.floor(Math.random()*4),m=70;let x,y;if(side===0){x=state.player.x+rand(-450,450);y=state.player.y-600-m}else if(side===1){x=state.player.x+600+m;y=state.player.y+rand(-450,450)}else if(side===2){x=state.player.x+rand(-450,450);y=state.player.y+600+m}else{x=state.player.x-600-m;y=state.player.y+rand(-450,450)}x=clamp(x,40,worldW-40);y=clamp(y,40,worldH-40);state.enemies.push({x,y,hp:30,maxHp:30,atk:6,cool:0})}
function attack(){if(attackCooldown>0)return;attackCooldown=.55;let target=null,bd=64;for(const e of state.enemies){const dd=dist(state.player,e);if(dd<bd){bd=dd;target=e}}if(!target){gather();return}target.hp-=state.atk;if(target.hp<=0){state.food+=1;state.enemies.splice(state.enemies.indexOf(target),1);toast('적 처치 · 생존식 +1')}}
function updateEnemies(dt){for(const e of state.enemies){const dx=state.player.x-e.x,dy=state.player.y-e.y,dd=Math.hypot(dx,dy)||1;if(dd>38){e.x+=dx/dd*34*dt;e.y+=dy/dd*34*dt}else{e.cool-=dt;if(e.cool<=0){e.cool=.9;state.hp=clamp(state.hp-e.atk,0,state.maxHp);toast(`피해 -${e.atk}`);if(state.hp<=0)die()}}}}
function die(){state.hp=state.maxHp;state.player.x=worldW/2;state.player.y=worldH/2;state.enemies=[];state.food=Math.max(0,state.food-1);toast('쓰러졌어. 시작 지점으로 돌아왔어.');save()}
function eat(){if(!state.food){toast('생존식이 없어');return}if(state.hp>=state.maxHp){toast('체력이 가득 차 있어');return}state.food--;state.hp=clamp(state.hp+25,0,state.maxHp);toast('체력 +25');}
function craft(id){const r=recipes.find(x=>x.id===id);if(!r)return;if(!r.can(state)){toast('재료가 부족해');return}r.make(state);toast(`${r.name} 제작 완료`);renderPanels();save()}
function renderPanels(){document.getElementById('craftList').innerHTML=recipes.map(r=>{const owned=r.id==='axe'?state.axe:r.id==='club'?state.club: r.id==='bandage'?state.bandage:r.id==='meal'?state.food:0;return `<div class="item"><div><strong>${r.name}${owned?` · 보유 ${owned===true?'완료':owned}`:''}</strong><small>${r.cost}</small></div><button data-craft="${r.id}">${(r.id==='axe'&&state.axe)||(r.id==='club'&&state.club)?'제작완료':'제작'}</button></div>`}).join('');document.getElementById('invList').innerHTML=`<div class="item"><div><strong>무기</strong><small>${state.club?'돌몽둥이 · 공격력 +8':state.axe?'돌도끼 · 공격력 +3':'맨손'}</small></div></div><div class="item"><div><strong>방어</strong><small>기본 최대 체력 ${state.maxHp}</small></div></div><div class="item"><div><strong>붕대</strong><small>${state.bandage}개 · 사용 시 체력 30 회복</small></div><button id="useBandage">사용</button></div>`}
function useBandage(){if(!state.bandage){toast('붕대가 없어');return}if(state.hp>=state.maxHp){toast('체력이 가득 차 있어');return}state.bandage--;state.hp=clamp(state.hp+30,0,state.maxHp);toast('붕대 사용 · 체력 +30');renderPanels();save()}
function uiTick(){ui.hp.textContent=`${Math.ceil(state.hp)}/${state.maxHp}`;ui.atk.textContent=state.atk+(state.club?8:state.axe?3:0);ui.wood.textContent=state.wood;ui.stone.textContent=state.stone;ui.fiber.textContent=state.fiber;ui.food.textContent=state.food}
document.addEventListener('click',e=>{const c=e.target.closest('[data-craft]');if(c)craft(c.dataset.craft);if(e.target.id==='useBandage')useBandage();const close=e.target.closest('[data-close]');if(close)document.getElementById(close.dataset.close).style.display='none'});
document.getElementById('craftBtn').onclick=()=>{renderPanels();document.getElementById('craft').style.display='block'};document.getElementById('invBtn').onclick=()=>{renderPanels();document.getElementById('inv').style.display='block'};document.getElementById('eatBtn').onclick=eat;
function stickMove(clientX,clientY){const r=document.getElementById('joystick').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let x=clientX-cx,y=clientY-cy,l=Math.hypot(x,y),m=43;if(l>m){x=x/l*m;y=y/l*m}joyX=x/m;joyY=y/m;document.getElementById('stick').style.transform=`translate(${x}px,${y}px)`}
const joy=document.getElementById('joystick');joy.addEventListener('pointerdown',e=>{dragging=true;joy.setPointerCapture(e.pointerId);stickMove(e.clientX,e.clientY)});joy.addEventListener('pointermove',e=>{if(dragging)stickMove(e.clientX,e.clientY)});joy.addEventListener('pointerup',()=>{dragging=false;joyX=joyY=0;document.getElementById('stick').style.transform='translate(0,0)'});joy.addEventListener('pointercancel',()=>{dragging=false;joyX=joyY=0;document.getElementById('stick').style.transform='translate(0,0)'});
canvas.addEventListener('pointerdown',e=>{if(e.target!==canvas)return;attack()});
addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter')attack();if(e.key==='e')gather();if(e.key==='c')document.getElementById('craftBtn').click();if(e.key==='i')document.getElementById('invBtn').click();if(e.key==='h')eat();});
function draw(){ctx.clearRect(0,0,w,h);const dark=night();ctx.fillStyle=dark?'#16251d':'#4d8a4e';ctx.fillRect(0,0,w,h);for(let gx=-40;gx<w+40;gx+=80){for(let gy=-40;gy<h+40;gy+=80){const wx=state.player.x-w/2+gx,wy=state.player.y-h/2+gy;ctx.fillStyle=((Math.floor(wx/80)+Math.floor(wy/80))&1)?(dark?'#192c22':'#548e53'):(dark?'#1b3025':'#4f874f');ctx.fillRect(gx,gy,80,80)}}
for(const r of state.resources){const s=worldToScreen(r.x,r.y);if(s.x<-50||s.y<-50||s.x>w+50||s.y>h+50)continue;ctx.save();if(r.type==='tree'){ctx.fillStyle='#66452c';ctx.fillRect(s.x-6,s.y-2,12,24);ctx.fillStyle='#2d6939';ctx.beginPath();ctx.arc(s.x,s.y-10,22,0,7);ctx.fill();ctx.fillStyle='#3e8247';ctx.beginPath();ctx.arc(s.x-15,s.y-1,14,0,7);ctx.arc(s.x+15,s.y-1,14,0,7);ctx.fill()}else if(r.type==='stone'){ctx.fillStyle='#9ca8ad';ctx.beginPath();ctx.ellipse(s.x,s.y,16,12,-.2,0,7);ctx.fill()}else{ctx.strokeStyle='#79bd68';ctx.lineWidth=4;for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(s.x+i*6,s.y+8);ctx.lineTo(s.x+i*3,s.y-10);ctx.stroke()}}ctx.restore()}
for(const e of state.enemies){const s=worldToScreen(e.x,e.y);ctx.fillStyle='#7e2730';ctx.beginPath();ctx.arc(s.x,s.y,18,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(s.x-8,s.y-5,5,5);ctx.fillRect(s.x+4,s.y-5,5,5);ctx.fillStyle='#0008';ctx.fillRect(s.x-22,s.y-30,44,5);ctx.fillStyle='#e85c55';ctx.fillRect(s.x-22,s.y-30,44*Math.max(0,e.hp/e.maxHp),5)}
const p=worldToScreen(state.player.x,state.player.y);ctx.fillStyle='#2a2f38';ctx.beginPath();ctx.arc(p.x,p.y+5,17,0,7);ctx.fill();ctx.fillStyle='#d7a77a';ctx.beginPath();ctx.arc(p.x,p.y-9,12,0,7);ctx.fill();ctx.fillStyle='#473021';ctx.fillRect(p.x-13,p.y-19,26,7);ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(p.x+7,p.y);ctx.lineTo(p.x+25,p.y-7);ctx.stroke();if(dark){ctx.fillStyle='#061009aa';ctx.fillRect(0,0,w,h)}
ctx.fillStyle='#fff';ctx.font='900 11px system-ui';ctx.textAlign='center';ctx.fillText('나',p.x,p.y+3);
}
let last=performance.now();function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;const speed=120;state.player.x=clamp(state.player.x+joyX*speed*dt,25,worldW-25);state.player.y=clamp(state.player.y+joyY*speed*dt,25,worldH-25);updateClock(dt);attackCooldown=Math.max(0,attackCooldown-dt);resourceCooldown=Math.max(0,resourceCooldown-dt);enemySpawn-=dt;if(enemySpawn<=0){enemySpawn=3.2;spawnEnemy()}updateEnemies(dt);if(state.hp<=0)die();if(now-state.lastSave>4500){state.lastSave=now;save()}uiTick();draw();requestAnimationFrame(loop)}
setInterval(()=>{if(state.bandage>0&&state.hp<state.maxHp){}renderPanels()},1000);renderPanels();uiTick();requestAnimationFrame(loop);
</script>
</body>
</html>
