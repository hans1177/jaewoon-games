<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>나의 생존기</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0e1720;color:#fff;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;touch-action:none}#app{position:relative;width:100%;height:100%;overflow:hidden}canvas{display:block;width:100%;height:100%;background:#294d32}.hud{position:absolute;z-index:5;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.box{padding:7px 9px;border:1px solid #ffffff35;border-radius:12px;background:#0c1820c9;font-weight:900;font-size:12px}.small{font-size:10px;opacity:.88}.actions{position:absolute;z-index:6;right:10px;top:54px;display:grid;gap:7px}.btn{border:1px solid #ffffff35;border-radius:11px;background:#0c1820d9;color:#fff;padding:9px 11px;font-weight:900;font-size:11px}.btn:active{transform:scale(.97)}.panel{position:absolute;z-index:10;left:10px;right:10px;top:54px;bottom:10px;padding:12px;border:1px solid #ffffff35;border-radius:16px;background:#071118f5;overflow:auto;display:none;touch-action:pan-y}.panel h2{margin:0 0 9px;font-size:18px}.sectionTitle{margin:14px 0 6px;font-size:13px;color:#9fe3b5}.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px;margin:6px 0;border-radius:12px;background:#12232b;border:1px solid #ffffff12;color:#fff;text-align:left}.item strong{font-size:12px}.item small{display:block;opacity:.72;margin-top:3px;font-weight:700;line-height:1.35}.item button{border:0;border-radius:9px;background:#3d9b61;color:#fff;padding:8px 10px;font-weight:900}.item button:disabled{background:#5a6870}.close{position:sticky;top:-4px;float:right;border:0;border-radius:9px;background:#ffffff1a;color:#fff;padding:7px 9px;font-weight:900}.joystick{position:absolute;z-index:7;left:18px;bottom:20px;width:126px;height:126px;border-radius:50%;background:#ffffff13;border:2px solid #ffffff2b}.stick{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:#ffffff50;border:2px solid #fff6}.hint{position:absolute;z-index:4;left:50%;bottom:14px;transform:translateX(-50%);padding:7px 10px;border-radius:10px;background:#071118b8;font-size:10px;font-weight:800;white-space:nowrap}.toast{position:absolute;z-index:30;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 14px;border-radius:12px;background:#000c;color:#fff;font-weight:900;display:none}</style></head><body><div id="app"><canvas id="game"></canvas><div class="hud"><div class="box">❤️ <span id="hp">100/100</span> · ⚔️ <span id="atk">5</span><br><span class="small">무기: <span id="weapon">맨손</span></span></div><div class="box"><span id="phase">☀️ 낮</span> <span id="clock">08:00</span><br><span class="small">📅 <span id="day">1</span>일 · 🪵 <span id="wood">0</span> · 🪨 <span id="stone">0</span> · 🌿 <span id="fiber">0</span> · 🍄 <span id="mushroom">0</span></span></div></div><div class="actions"><button class="btn" id="craftBtn">🛠 제작</button><button class="btn" id="invBtn">🎒 인벤</button><button class="btn" id="attackBtn">⚔️ 공격</button><button class="btn" id="eatBtn">🍎 먹기</button></div><div class="joystick" id="joystick"><div class="stick" id="stick"></div></div><div class="hint">자원 가까이에서 공격 버튼 · 돌도끼로 까끌까끌 나무와 버섯 채집</div><div class="panel" id="craft"><button class="close" data-close="craft">닫기</button><h2>🛠 제작</h2><div id="craftList"></div></div><div class="panel" id="bench"><button class="close" data-close="bench">닫기</button><h2>🔨 제작대</h2><div id="benchList"></div></div><div class="panel" id="inv"><button class="close" data-close="inv">닫기</button><h2>🎒 인벤토리</h2><div id="invList"></div></div><div class="toast" id="toast"></div></div><script>
// 파일명: web-games/survival/index.html
// 메인: 나의 생존기 · 제작대/돌창/돌도끼/특수자원
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const ui={hp:document.getElementById('hp'),atk:document.getElementById('atk'),weapon:document.getElementById('weapon'),phase:document.getElementById('phase'),clock:document.getElementById('clock'),day:document.getElementById('day'),wood:document.getElementById('wood'),stone:document.getElementById('stone'),fiber:document.getElementById('fiber'),mushroom:document.getElementById('mushroom'),toast:document.getElementById('toast')};
const saveKey='jaewoon-survival-v1',worldW=3000,worldH=3000,spawnPoint={x:1500,y:1500};
const monsters=[
{name:'달팽이',type:'무해',hp:20,atk:0,speed:22,r:12,color:'#8bbf68',spawnMin:120,spawnMax:240},
{name:'토끼',type:'무해',hp:18,atk:0,speed:62,r:14,color:'#a6c989',spawnMin:120,spawnMax:240},
{name:'나비',type:'무해',hp:12,atk:0,speed:78,r:10,color:'#d6c56d',spawnMin:800,spawnMax:1050},
{name:'사슴',type:'중립',hp:50,atk:7,speed:30,r:18,color:'#c3a34b',spawnMin:380,spawnMax:650},
{name:'멧돼지',type:'중립',hp:70,atk:10,speed:45,r:19,color:'#ad8a55',spawnMin:380,spawnMax:650},
{name:'독도마뱀',type:'중립',hp:40,atk:9,speed:42,r:15,color:'#9e9d42',spawnMin:380,spawnMax:650},
{name:'늑대',type:'공격적',hp:45,atk:8,speed:55,r:17,color:'#b34c4c',spawnMin:380,spawnMax:650},
{name:'거미',type:'공격적',hp:35,atk:6,speed:65,r:14,color:'#a53b66',spawnMin:380,spawnMax:650},
{name:'좀비',type:'공격적',hp:60,atk:12,speed:28,r:19,color:'#8f524a',spawnMin:380,spawnMax:650},
{name:'들개',type:'공격적',hp:30,atk:6,speed:50,r:16,color:'#b85f45',spawnMin:380,spawnMax:650}
];
const monsterMap=Object.fromEntries(monsters.map(m=>[m.name,m]));
const state={day:1,time:480,wood:0,stone:0,fiber:0,mushroom:0,hp:100,maxHp:100,weapon:'맨손',axe:false,club:false,spear:false,shield:false,torch:0,bandage:0,workbenches:[],resources:[],enemies:[],player:{x:spawnPoint.x,y:spawnPoint.y},lastSave:0};
let dpr=1,w=0,h=0,dragging=false,joyX=0,joyY=0,attackCooldown=0,resourceCooldown=0,enemySpawn=0,toastTimer=0;
function resize(){dpr=Math.min(2,devicePixelRatio||1);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function rand(a,b){return a+Math.random()*(b-a)}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function toast(t){ui.toast.textContent=t;ui.toast.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>ui.toast.style.display='none',1300)}
function save(){try{localStorage.setItem(saveKey,JSON.stringify(state))}catch(e){}}
function seedWorld(){state.resources=[];state.enemies=[];state.workbenches=[];state.player.x=spawnPoint.x;state.player.y=spawnPoint.y;for(let i=0;i<72;i++){const type=['tree','stone','plant'][i%3];state.resources.push({id:i,type,x:rand(70,worldW-70),y:rand(70,worldH-70),amount:type==='tree'?3:type==='stone'?2:4})}for(let i=0;i<18;i++)state.resources.push({id:'rough'+i,type:'rough_tree',x:spawnPoint.x+Math.cos(i)*rand(320,750),y:spawnPoint.y+Math.sin(i)*rand(320,750),amount:2});for(let i=0;i<18;i++){const a=Math.random()*Math.PI*2,d=rand(320,750);state.resources.push({id:'mush'+i,type:'mushroom',x:clamp(spawnPoint.x+Math.cos(a)*d,70,worldW-70),y:clamp(spawnPoint.y+Math.sin(a)*d,70,worldH-70),amount:2})}}
function normalizeEnemy(e){const m=monsterMap[e.kind]||monsters[9];return Object.assign({kind:m.name,behavior:m.type,hp:m.hp,maxHp:m.hp,atk:m.atk,speed:m.speed,r:m.r,cool:0,provoked:false,wander:Math.random()*6.28,wanderTime:rand(.5,2)},e)}
function load(){try{const raw=localStorage.getItem(saveKey);if(!raw){seedWorld();return}const s=JSON.parse(raw);Object.assign(state,s);state.workbenches=Array.isArray(state.workbenches)?state.workbenches:[];state.resources=Array.isArray(state.resources)?state.resources:[];state.enemies=Array.isArray(state.enemies)?state.enemies.map(normalizeEnemy):[];state.mushroom=Number(state.mushroom)||0;state.axe=!!state.axe;state.spear=!!state.spear;state.club=!!state.club;state.shield=!!state.shield;if(state.weapon==='돌칼')state.weapon='맨손';if(!state.resources.length)seedWorld()}catch(e){seedWorld()}}
load();
function night(){return state.time>=1260||state.time<360}function weaponDamage(){return state.weapon==='돌창'?10:state.weapon==='돌몽둥이'?8:state.weapon==='돌도끼'?8:5}
function nearestResource(){let best=null,bd=999;for(const r of state.resources){const d=dist(state.player,r);if(d<bd){bd=d;best=r}}return best&&bd<62?best:null}function nearestWorkbench(){let best=null,bd=999;for(const b of state.workbenches){const d=dist(state.player,b);if(d<bd){bd=d;best=b}}return best&&bd<95?best:null}
function canGather(r){if((r.type==='rough_tree'||r.type==='mushroom')&&!state.axe){toast('돌도끼가 필요해');return false}return true}
function gather(){if(resourceCooldown>0)return;const r=nearestResource();if(!r){if(nearestWorkbench()){openPanel('bench');renderBench()}return}if(!canGather(r))return;resourceCooldown=.25;if(r.type==='tree'||r.type==='rough_tree')state.wood++;else if(r.type==='stone')state.stone++;else if(r.type==='plant')state.fiber++;else if(r.type==='mushroom')state.mushroom++;const names={tree:'나무',rough_tree:'까끌까끌 나무',stone:'돌',plant:'섬유',mushroom:'버섯'};r.amount--;toast(`${names[r.type]} +1`);if(r.amount<=0){state.resources.splice(state.resources.indexOf(r),1);const typ=r.type;setTimeout(()=>{const a=Math.random()*6.28,d=(typ==='rough_tree'||typ==='mushroom')?rand(320,750):rand(70,1200);state.resources.push({id:Date.now()+Math.random(),type:typ,x:clamp(spawnPoint.x+Math.cos(a)*d,70,worldW-70),y:clamp(spawnPoint.y+Math.sin(a)*d,70,worldH-70),amount:typ==='stone'?2:2})},5000)}}
function spawnEnemy(){if(!night()||state.enemies.length>=10)return;const m=monsters[Math.floor(Math.random()*monsters.length)],a=Math.random()*6.28,d=rand(m.spawnMin,m.spawnMax);state.enemies.push({x:clamp(spawnPoint.x+Math.cos(a)*d,40,worldW-40),y:clamp(spawnPoint.y+Math.sin(a)*d,40,worldH-40),kind:m.name,behavior:m.type,hp:m.hp,maxHp:m.hp,atk:m.atk,speed:m.speed,r:m.r,cool:0,provoked:false,wander:Math.random()*6.28,wanderTime:rand(.5,2)})}
function wander(e,dt,rate){e.wanderTime-=dt;if(e.wanderTime<=0){e.wander=Math.random()*6.28;e.wanderTime=rand(.5,2.2)}e.x+=Math.cos(e.wander)*e.speed*rate*dt;e.y+=Math.sin(e.wander)*e.speed*rate*dt;e.x=clamp(e.x,35,worldW-35);e.y=clamp(e.y,35,worldH-35)}
function updateEnemies(dt){for(const e of state.enemies){const dx=state.player.x-e.x,dy=state.player.y-e.y,dd=Math.hypot(dx,dy)||1;if(e.behavior==='무해'){if(dd<220){e.x-=dx/dd*e.speed*dt;e.y-=dy/dd*e.speed*dt}else wander(e,dt,.24);continue}if(e.behavior==='중립'&&!e.provoked){wander(e,dt,.24);continue}if(e.behavior==='공격적'&&!e.provoked&&dd>500){wander(e,dt,.12);continue}if(dd>e.r+18){e.x+=dx/dd*e.speed*dt;e.y+=dy/dd*e.speed*dt}else{e.cool-=dt;if(e.cool<=0){e.cool=.9;state.hp=clamp(state.hp-e.atk,0,state.maxHp);toast(`${e.kind} 공격 · -${e.atk}`)}}}}
function die(){state.hp=state.maxHp;state.player.x=spawnPoint.x;state.player.y=spawnPoint.y;state.enemies=[];state.food=Math.max(0,state.food-1);toast('쓰러졌어. 시작 지점으로 돌아왔어.');save()}
function attack(){if(attackCooldown>0)return;attackCooldown=.55;let target=null,bd=70;for(const e of state.enemies){const d=dist(state.player,e);if(d<bd){bd=d;target=e}}if(!target){gather();return}if(target.behavior==='중립')target.provoked=true;target.hp-=weaponDamage();if(target.hp<=0){state.enemies.splice(state.enemies.indexOf(target),1);state.food++;toast(`${target.kind} 처치 · 생존식 +1`)}else toast(`${target.kind} 피해 ${weaponDamage()}`)}
function eat(){if(!state.food)return toast('생존식이 없어');if(state.hp>=state.maxHp)return toast('체력이 가득 차 있어');state.food--;state.hp=Math.min(state.maxHp,state.hp+25);toast('체력 +25')}
const recipes=[{id:'workbench',name:'제작대',cost:'나무 5',can:s=>s.wood>=5,make:s=>{s.wood-=5;s.workbenches.push({x:clamp(s.player.x+55,35,worldW-35),y:s.player.y})}},{id:'axe',name:'돌도끼',cost:'섬유 2 · 돌 3 · 나무 2',desc:'특수 자원 채집 도구 · 공격력 8',can:s=>s.fiber>=2&&s.stone>=3&&s.wood>=2,make:s=>{s.fiber-=2;s.stone-=3;s.wood-=2;s.axe=true;s.weapon='돌도끼'}},{id:'club',name:'돌몽둥이',cost:'나무 4 · 돌 4',can:s=>s.wood>=4&&s.stone>=4,make:s=>{s.wood-=4;s.stone-=4;s.club=true;s.weapon='돌몽둥이'}},{id:'bandage',name:'붕대 1개',cost:'섬유 3',can:s=>s.fiber>=3,make:s=>{s.fiber-=3;s.bandage++}},{id:'meal',name:'생존식 1개',cost:'나무 1 · 식물 2',can:s=>s.wood>=1&&s.fiber>=2,make:s=>{s.wood--;s.fiber-=2;s.food++}}];
const benchRecipes=[{id:'spear',name:'돌창',cost:'섬유 3 · 돌 1 · 나무 1',desc:'공격력 10',can:s=>s.fiber>=3&&s.stone>=1&&s.wood>=1,make:s=>{s.fiber-=3;s.stone--;s.wood--;s.spear=true;s.weapon='돌창'}},{id:'shield',name:'나무 방패',cost:'나무 6 · 돌 2',desc:'최대 체력 +20',can:s=>s.wood>=6&&s.stone>=2,make:s=>{s.wood-=6;s.stone-=2;if(!s.shield){s.shield=true;s.maxHp+=20;s.hp=Math.min(s.maxHp,s.hp+20)}}},{id:'torch',name:'횃불 1개',cost:'나무 2 · 섬유 2',desc:'밤 시야 보조',can:s=>s.wood>=2&&s.fiber>=2,make:s=>{s.wood-=2;s.fiber-=2;s.torch++}}];
function craft(id){const r=recipes.find(v=>v.id===id);if(!r)return;if(!r.can(state))return toast('재료가 부족해');r.make(state);renderAll();save();toast(`${r.name} 제작 완료`)}function craftBench(id){if(!nearestWorkbench())return toast('제작대 근처에서만 가능해');const r=benchRecipes.find(v=>v.id===id);if(!r||!r.can(state))return toast('재료가 부족해');r.make(state);renderAll();renderBench();save();toast(`${r.name} 제작 완료`)}
function equip(name){if(name==='돌창'&&!state.spear){toast('보유하지 않은 무기야');return}state.weapon=name;renderAll();save();toast(`${name} 장착`)}function useBandage(){if(!state.bandage)return toast('붕대가 없어');if(state.hp>=state.maxHp)return toast('체력이 가득 차 있어');state.bandage--;state.hp=Math.min(state.maxHp,state.hp+30);renderAll();save();toast('붕대 사용 · 체력 +30')}
function openPanel(id){for(const p of ['craft','bench','inv'])document.getElementById(p).style.display='none';document.getElementById(id).style.display='block'}
function renderAll(){document.getElementById('craftList').innerHTML=recipes.map(r=>`<div class="item"><div><strong>${r.name}</strong><small>${r.cost}${r.desc?`<br>${r.desc}`:''}</small></div><button data-craft="${r.id}">제작</button></div>`).join('')+'<div class="sectionTitle">특수 채집</div><div class="item"><div><strong>까끌까끌 나무 · 버섯</strong><small>조금 멀리 배치 · 돌도끼 필요</small></div></div>';document.getElementById('invList').innerHTML=`<div class="item"><div><strong>현재 무기</strong><small>${state.weapon} · 공격력 ${weaponDamage()}</small></div>${state.spear?'<button data-equip="돌창">돌창</button>':''}${state.axe&&state.weapon!=='돌도끼'?'<button data-equip="돌도끼">도끼</button>':''}</div><div class="item"><div><strong>자원</strong><small>나무 ${state.wood} · 돌 ${state.stone} · 섬유 ${state.fiber} · 버섯 ${state.mushroom}</small></div></div><div class="item"><div><strong>방패/소모품</strong><small>${state.shield?'나무 방패 · 최대 체력 +20':'방패 없음'} · 붕대 ${state.bandage} · 횃불 ${state.torch}</small></div><button id="useBandage">붕대</button></div>`}
function renderBench(){document.getElementById('benchList').innerHTML=`<div class="sectionTitle">제작대 전용</div>`+benchRecipes.map(r=>`<div class="item"><div><strong>${r.name}</strong><small>${r.cost}<br>${r.desc}</small></div><button data-bench="${r.id}">제작</button></div>`).join('')}
document.addEventListener('click',e=>{const c=e.target.closest('[data-craft]');if(c)return craft(c.dataset.craft);const b=e.target.closest('[data-bench]');if(b)return craftBench(b.dataset.bench);const q=e.target.closest('[data-equip]');if(q)return equip(q.dataset.equip);if(e.target.id==='useBandage')return useBandage();const x=e.target.closest('[data-close]');if(x)document.getElementById(x.dataset.close).style.display='none'});
document.getElementById('craftBtn').onclick=()=>{renderAll();openPanel('craft')};document.getElementById('invBtn').onclick=()=>{renderAll();openPanel('inv')};document.getElementById('attackBtn').onclick=attack;document.getElementById('eatBtn').onclick=eat;
function stickMove(x,y){const r=document.getElementById('joystick').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=x-cx,dy=y-cy,l=Math.hypot(dx,dy),m=43;if(l>m){dx=dx/l*m;dy=dy/l*m}joyX=dx/m;joyY=dy/m;document.getElementById('stick').style.transform=`translate(${dx}px,${dy}px)`}const joy=document.getElementById('joystick');joy.addEventListener('pointerdown',e=>{dragging=true;joy.setPointerCapture(e.pointerId);stickMove(e.clientX,e.clientY)});joy.addEventListener('pointermove',e=>{if(dragging)stickMove(e.clientX,e.clientY)});const stop=()=>{dragging=false;joyX=joyY=0;document.getElementById('stick').style.transform='translate(0,0)'};joy.addEventListener('pointerup',stop);joy.addEventListener('pointercancel',stop);
function worldToScreen(x,y){return{x:x-state.player.x+w/2,y:y-state.player.y+h/2}}function draw(){const dark=night();ctx.clearRect(0,0,w,h);ctx.fillStyle=dark?'#16251d':'#4d8a4e';ctx.fillRect(0,0,w,h);for(let gx=-40;gx<w+40;gx+=80)for(let gy=-40;gy<h+40;gy+=80){const wx=state.player.x-w/2+gx,wy=state.player.y-h/2+gy;ctx.fillStyle=((Math.floor(wx/80)+Math.floor(wy/80))&1)?(dark?'#192c22':'#548e53'):(dark?'#1b3025':'#4f874f');ctx.fillRect(gx,gy,80,80)}for(const r of state.resources){const s=worldToScreen(r.x,r.y);if(s.x<-60||s.y<-60||s.x>w+60||s.y>h+60)continue;if(r.type==='tree'||r.type==='rough_tree'){ctx.fillStyle=r.type==='rough_tree'?'#5d3f28':'#66452c';ctx.fillRect(s.x-6,s.y-2,12,24);ctx.fillStyle=r.type==='rough_tree'?'#4b5a30':'#2d6939';ctx.beginPath();ctx.arc(s.x,s.y-10,22,0,6.28);ctx.fill()}else if(r.type==='stone'){ctx.fillStyle='#9ca8ad';ctx.beginPath();ctx.ellipse(s.x,s.y,16,12,-.2,0,6.28);ctx.fill()}else if(r.type==='mushroom'){ctx.fillStyle='#d64c43';ctx.beginPath();ctx.arc(s.x,s.y-5,13,Math.PI,0);ctx.fill();ctx.fillStyle='#e7d3b0';ctx.fillRect(s.x-3,s.y-4,6,15)}else{ctx.strokeStyle='#79bd68';ctx.lineWidth=4;for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(s.x+i*6,s.y+8);ctx.lineTo(s.x+i*3,s.y-10);ctx.stroke()}}}for(const e of state.enemies){const s=worldToScreen(e.x,e.y);if(s.x<-60||s.y<-60||s.x>w+60||s.y>h+60)continue;ctx.fillStyle=e.color||({무해:'#8bbf68',중립:'#c3a34b',공격적:'#b34c4c'}[e.behavior]);ctx.beginPath();ctx.arc(s.x,s.y,e.r,0,6.28);ctx.fill();ctx.fillStyle='#fff';ctx.font='900 9px system-ui';ctx.textAlign='center';ctx.fillText(`${e.kind} · ${e.behavior}`,s.x,s.y-e.r-23);ctx.fillStyle='#000a';ctx.fillRect(s.x-28,s.y-e.r-17,56,5);ctx.fillStyle='#ef6b65';ctx.fillRect(s.x-28,s.y-e.r-17,56*Math.max(0,e.hp/e.maxHp))}for(const b of state.workbenches){const s=worldToScreen(b.x,b.y);if(s.x<-60||s.y<-60||s.x>w+60||s.y>h+60)continue;ctx.fillStyle='#6f4527';ctx.fillRect(s.x-26,s.y-10,52,22);ctx.fillStyle='#a96c36';ctx.fillRect(s.x-19,s.y-20,38,10);ctx.fillStyle='#fff';ctx.font='900 9px system-ui';ctx.textAlign='center';ctx.fillText('제작대',s.x,s.y+31)}const p=worldToScreen(state.player.x,state.player.y);ctx.fillStyle='#2a2f38';ctx.beginPath();ctx.arc(p.x,p.y+5,17,0,6.28);ctx.fill();ctx.fillStyle='#d7a77a';ctx.beginPath();ctx.arc(p.x,p.y-9,12,0,6.28);ctx.fill();ctx.fillStyle='#473021';ctx.fillRect(p.x-13,p.y-19,26,7);ctx.fillStyle='#fff';ctx.font='900 11px system-ui';ctx.textAlign='center';ctx.fillText('나',p.x,p.y+3);if(dark&&!state.torch){ctx.fillStyle='#061009aa';ctx.fillRect(0,0,w,h)}}
function updateClock(dt){state.time+=dt*1.6;if(state.time>=1440){state.time-=1440;state.day++;state.enemies=[];toast('새로운 하루가 시작됐어')}ui.phase.textContent=night()?'🌙 밤':'☀️ 낮';ui.clock.textContent=String(Math.floor(state.time/60)).padStart(2,'0')+':'+String(Math.floor(state.time%60)).padStart(2,'0');ui.day.textContent=state.day}
function tick(){ui.hp.textContent=Math.ceil(state.hp)+'/'+state.maxHp;ui.atk.textContent=weaponDamage();ui.weapon.textContent=state.weapon;ui.wood.textContent=state.wood;ui.stone.textContent=state.stone;ui.fiber.textContent=state.fiber;ui.mushroom.textContent=state.mushroom}
let last=performance.now();function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;state.player.x=clamp(state.player.x+joyX*120*dt,25,worldW-25);state.player.y=clamp(state.player.y+joyY*120*dt,25,worldH-25);updateClock(dt);attackCooldown=Math.max(0,attackCooldown-dt);resourceCooldown=Math.max(0,resourceCooldown-dt);enemySpawn-=dt;if(enemySpawn<=0){enemySpawn=3.2;spawnEnemy()}updateEnemies(dt);if(state.hp<=0)die();if(now-state.lastSave>5000){state.lastSave=now;save()}tick();draw();requestAnimationFrame(loop)}renderAll();renderBench();tick();requestAnimationFrame(loop);
</script></body></html>
