<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>나의 생존기</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#102118;color:#fff;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;touch-action:none}#app{position:relative;width:100%;height:100%;overflow:hidden}canvas{display:block;width:100%;height:100%;background:#4d8a4e}.hud{position:absolute;z-index:5;left:8px;right:8px;top:8px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.box{padding:7px 9px;border:1px solid #ffffff40;border-radius:12px;background:#0b1710d9;font-size:12px;font-weight:900;line-height:1.35}.small{font-size:10px;opacity:.9}.actions{position:absolute;z-index:8;right:10px;top:55px;display:grid;gap:7px}.btn{min-width:88px;border:1px solid #ffffff45;border-radius:11px;background:#0b1710dd;color:#fff;padding:9px 11px;font-size:11px;font-weight:900}.btn:active{transform:scale(.97)}.attack{background:#7d2222}.panel{position:absolute;z-index:20;left:10px;right:10px;top:55px;bottom:10px;padding:12px;border:1px solid #ffffff40;border-radius:16px;background:#071118f7;overflow:auto;display:none;touch-action:pan-y}.panel h2{margin:0 0 10px;font-size:18px}.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px;margin:6px 0;border-radius:12px;background:#12232b;border:1px solid #ffffff12}.item strong{font-size:12px}.item small{display:block;margin-top:3px;opacity:.75;font-size:10px;line-height:1.35}.item button{border:0;border-radius:9px;background:#2e9360;color:#fff;padding:8px 10px;font-weight:900}.close{float:right;border:0;border-radius:9px;background:#ffffff18;color:#fff;padding:7px 9px;font-weight:900}.joystick{position:absolute;z-index:9;left:18px;bottom:18px;width:126px;height:126px;border-radius:50%;border:2px solid #ffffff30;background:#ffffff14}.stick{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;border:2px solid #ffffff35;background:#ffffff55}.toast{position:absolute;z-index:40;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 14px;border-radius:12px;background:#000c;font-size:12px;font-weight:900;display:none;pointer-events:none}.help{position:absolute;z-index:4;left:50%;bottom:16px;transform:translateX(-50%);padding:6px 9px;border-radius:10px;background:#071118aa;font-size:10px;font-weight:800;white-space:nowrap}
</style>
</head>
<body>
<div id="app">
<canvas id="game"></canvas>
<div class="hud"><div class="box">❤️ <span id="hp">100/100</span> · ⚔️ <span id="atk">5</span><br><span class="small">무기: <span id="weapon">맨손</span></span></div><div class="box"><span id="phase">☀️ 낮</span> <span id="clock">08:00</span><br><span class="small">📅 <span id="day">1</span>일 · 🪵 <span id="wood">0</span> · 🪨 <span id="stone">0</span> · 🌿 <span id="fiber">0</span> · 🍎 <span id="food">0</span></span></div></div>
<div class="actions"><button class="btn" id="craftBtn">🛠 제작</button><button class="btn" id="invBtn">🎒 인벤</button><button class="btn attack" id="attackBtn">⚔️ 공격</button><button class="btn" id="eatBtn">🍎 먹기</button></div>
<div class="joystick" id="joystick"><div class="stick" id="stick"></div></div><div class="help">자원 가까이에서 공격 버튼 · 밤에는 몬스터 · 중립은 건드리면 공격</div>
<div class="panel" id="craft"><button class="close" data-close="craft">닫기</button><h2>🛠 제작</h2><div id="craftList"></div></div>
<div class="panel" id="bench"><button class="close" data-close="bench">닫기</button><h2>🔨 제작대</h2><div id="benchList"></div></div>
<div class="panel" id="inv"><button class="close" data-close="inv">닫기</button><h2>🎒 인벤토리</h2><div id="invList"></div></div>
<div class="toast" id="toast"></div>
</div>
<script>
// 파일명: web-games/survival/index.html
// 메인: 나의 생존기 · 안정화된 생존/제작/몬스터 루프
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const ui={hp:document.getElementById('hp'),atk:document.getElementById('atk'),weapon:document.getElementById('weapon'),phase:document.getElementById('phase'),clock:document.getElementById('clock'),day:document.getElementById('day'),wood:document.getElementById('wood'),stone:document.getElementById('stone'),fiber:document.getElementById('fiber'),food:document.getElementById('food'),toast:document.getElementById('toast')};
const saveKey='jaewoon-survival-v1',worldW=2400,worldH=2400;
const monsters=[
{name:'달팽이',type:'무해',hp:20,atk:0,speed:20,r:12,color:'#8bbf68'},
{name:'토끼',type:'무해',hp:18,atk:0,speed:58,r:14,color:'#a6c989'},
{name:'나비',type:'무해',hp:12,atk:0,speed:72,r:10,color:'#d6c56d'},
{name:'사슴',type:'중립',hp:50,atk:7,speed:30,r:18,color:'#c3a34b'},
{name:'멧돼지',type:'중립',hp:70,atk:10,speed:42,r:20,color:'#ad8a55'},
{name:'독도마뱀',type:'중립',hp:40,atk:9,speed:40,r:15,color:'#9e9d42'},
{name:'늑대',type:'공격적',hp:45,atk:8,speed:52,r:17,color:'#b34c4c'},
{name:'거미',type:'공격적',hp:35,atk:6,speed:62,r:14,color:'#a53b66'},
{name:'좀비',type:'공격적',hp:60,atk:12,speed:27,r:19,color:'#8f524a'},
{name:'들개',type:'공격적',hp:30,atk:6,speed:48,r:16,color:'#b85f45'}
];
const monsterMap=Object.fromEntries(monsters.map(m=>[m.name,m]));
const state={day:1,time:480,wood:0,stone:0,fiber:0,food:0,hp:100,maxHp:100,weapon:'맨손',spear:false,knife:false,shield:false,torch:0,bandage:0,workbenches:[],resources:[],enemies:[],player:{x:worldW/2,y:worldH/2},lastSave:0};
let w=innerWidth,h=innerHeight,dpr=1,joyX=0,joyY=0,joyDown=false,attackCooldown=0,resourceCooldown=0,spawnTimer=2,toastTimer=0;
function resize(){dpr=Math.min(2,devicePixelRatio||1);w=innerWidth;h=innerHeight;canvas.width=Math.floor(w*dpr);canvas.height=Math.floor(h*dpr);canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function rand(a,b){return a+Math.random()*(b-a)}function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function toast(t){ui.toast.textContent=t;ui.toast.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>ui.toast.style.display='none',1100)}
function isNight(){return state.time>=1260||state.time<360}function save(){try{localStorage.setItem(saveKey,JSON.stringify(state))}catch(e){}}
function seedWorld(){state.resources=[];state.enemies=[];state.workbenches=[];state.player.x=worldW/2;state.player.y=worldH/2;for(let i=0;i<90;i++){const type=['tree','stone','plant'][i%3];state.resources.push({id:i,type,x:rand(60,worldW-60),y:rand(60,worldH-60),amount:type==='tree'?3:type==='stone'?2:4})}}
function normalizeEnemy(e){const m=monsterMap[e.kind]||monsters[9];return Object.assign({kind:m.name,type:m.type,hp:m.hp,maxHp:m.hp,atk:m.atk,speed:m.speed,r:m.r,color:m.color,provoked:false,wander:Math.random()*6.28,wanderTime:rand(.5,2)},e)}
function load(){try{const raw=localStorage.getItem(saveKey);if(!raw){seedWorld();return}const s=JSON.parse(raw);Object.assign(state,s);state.resources=Array.isArray(state.resources)?state.resources:[];state.workbenches=Array.isArray(state.workbenches)?state.workbenches:[];state.enemies=Array.isArray(state.enemies)?state.enemies.map(normalizeEnemy):[];state.player=state.player&&Number.isFinite(state.player.x)&&Number.isFinite(state.player.y)?state.player:{x:worldW/2,y:worldH/2};if(!state.resources.length)seedWorld()}catch(e){localStorage.removeItem(saveKey);seedWorld()}}
load();
function weaponDamage(){return state.weapon==='돌창'?10:state.weapon==='돌칼'?7:state.weapon==='돌몽둥이'?8:state.weapon==='돌도끼'?8:5}
function closestResource(){let best=null,bd=Infinity;for(const r of state.resources){const d=distance(state.player,r);if(d<bd){bd=d;best=r}}return best&&bd<58?best:null}
function closestBench(){let best=null,bd=Infinity;for(const b of state.workbenches){const d=distance(state.player,b);if(d<bd){bd=d;best=b}}return best&&bd<95?best:null}
function gather(){if(resourceCooldown>0)return;const r=closestResource();if(!r){if(closestBench()){openPanel('bench');renderBench()}return}resourceCooldown=.25;if(r.type==='tree')state.wood++;else if(r.type==='stone')state.stone++;else state.fiber++;r.amount--;toast(r.type==='tree'?'나무 +1':r.type==='stone'?'돌 +1':'섬유 +1');if(r.amount<=0){state.resources.splice(state.resources.indexOf(r),1);setTimeout(()=>state.resources.push({id:Date.now()+Math.random(),type:r.type,x:rand(60,worldW-60),y:rand(60,worldH-60),amount:r.type==='tree'?3:r.type==='stone'?2:4}),5000)}}
function spawnMonster(){if(!isNight()||state.enemies.length>=10)return;const m=monsters[Math.floor(Math.random()*monsters.length)],side=Math.floor(Math.random()*4);let x,y;if(side===0){x=state.player.x+rand(-420,420);y=state.player.y-620}else if(side===1){x=state.player.x+620;y=state.player.y+rand(-420,420)}else if(side===2){x=state.player.x+rand(-420,420);y=state.player.y+620}else{x=state.player.x-620;y=state.player.y+rand(-420,420)}state.enemies.push({x:clamp(x,40,worldW-40),y:clamp(y,40,worldH-40),kind:m.name,type:m.type,hp:m.hp,maxHp:m.hp,atk:m.atk,speed:m.speed,r:m.r,color:m.color,provoked:false,wander:Math.random()*6.28,wanderTime:rand(.5,2)})}
function wander(e,dt,rate){e.wanderTime-=dt;if(e.wanderTime<=0){e.wander=Math.random()*6.28;e.wanderTime=rand(.5,2.2)}e.x+=Math.cos(e.wander)*e.speed*rate*dt;e.y+=Math.sin(e.wander)*e.speed*rate*dt;e.x=clamp(e.x,30,worldW-30);e.y=clamp(e.y,30,worldH-30)}
function updateMonster(e,dt){const d=distance(state.player,e);if(e.type==='무해'){if(d<210&&d>1){e.x+=(e.x-state.player.x)/d*e.speed*dt;e.y+=(e.y-state.player.y)/d*e.speed*dt}else wander(e,dt,.25);return}if(e.type==='중립'&&!e.provoked){wander(e,dt,.25);return}if(e.type==='공격적'&&!e.provoked&&d>500){wander(e,dt,.12);return}if(d>e.r+18){e.x+=(state.player.x-e.x)/Math.max(d,1)*e.speed*dt;e.y+=(state.player.y-e.y)/Math.max(d,1)*e.speed*dt}else if(e.atk>0){e.cool=(e.cool||0)-dt;if(e.cool<=0){e.cool=.9;state.hp=clamp(state.hp-e.atk,0,state.maxHp);toast(`${e.kind} 공격 -${e.atk}`)}}e.x=clamp(e.x,30,worldW-30);e.y=clamp(e.y,30,worldH-30)}
function updateEnemies(dt){for(const e of state.enemies)updateMonster(e,dt)}
function attack(){if(attackCooldown>0)return;attackCooldown=.5;let target=null,bd=72;for(const e of state.enemies){const d=distance(state.player,e);if(d<bd){bd=d;target=e}}if(!target){gather();return}if(target.type==='중립')target.provoked=true;target.hp-=weaponDamage();toast(`${target.kind} 피해 ${weaponDamage()}`);if(target.hp<=0){state.enemies.splice(state.enemies.indexOf(target),1);state.food++;toast(`${target.kind} 처치 · 생존식 +1`)}}
function eat(){if(!state.food){toast('생존식이 없어');return}if(state.hp>=state.maxHp){toast('체력이 가득 차 있어');return}state.food--;state.hp=Math.min(state.maxHp,state.hp+25);toast('체력 +25')}
const recipes=[{id:'workbench',name:'제작대',cost:'나무 5',can:s=>s.wood>=5,make:s=>{s.wood-=5;s.workbenches.push({x:clamp(s.player.x+55,35,worldW-35),y:s.player.y})}},{id:'axe',name:'돌도끼',cost:'나무 3 · 돌 2',can:s=>s.wood>=3&&s.stone>=2,make:s=>{s.wood-=3;s.stone-=2;s.weapon='돌도끼'}},{id:'club',name:'돌몽둥이',cost:'나무 4 · 돌 4',can:s=>s.wood>=4&&s.stone>=4,make:s=>{s.wood-=4;s.stone-=4;s.weapon='돌몽둥이'}},{id:'bandage',name:'붕대',cost:'섬유 3',can:s=>s.fiber>=3,make:s=>{s.fiber-=3;s.bandage++}},{id:'meal',name:'생존식',cost:'나무 1 · 섬유 2',can:s=>s.wood>=1&&s.fiber>=2,make:s=>{s.wood--;s.fiber-=2;s.food++}}];
const benchRecipes=[{id:'spear',name:'돌창',cost:'섬유 3 · 돌 1 · 나무 1',desc:'공격력 10',can:s=>s.fiber>=3&&s.stone>=1&&s.wood>=1,make:s=>{s.fiber-=3;s.stone--;s.wood--;s.spear=true;s.weapon='돌창'}},{id:'knife',name:'돌칼',cost:'섬유 1 · 돌 2 · 나무 1',desc:'공격력 7',can:s=>s.fiber>=1&&s.stone>=2&&s.wood>=1,make:s=>{s.fiber--;s.stone-=2;s.wood--;s.knife=true;s.weapon='돌칼'}},{id:'shield',name:'나무 방패',cost:'나무 6 · 돌 2',desc:'최대 체력 +20',can:s=>s.wood>=6&&s.stone>=2,make:s=>{s.wood-=6;s.stone-=2;if(!s.shield){s.shield=true;s.maxHp+=20;s.hp=Math.min(s.maxHp,s.hp+20)}}},{id:'torch',name:'횃불',cost:'나무 2 · 섬유 2',desc:'밤 시야 보조',can:s=>s.wood>=2&&s.fiber>=2,make:s=>{s.wood-=2;s.fiber-=2;s.torch++}}];
function craft(id){const r=recipes.find(v=>v.id===id);if(!r||!r.can(state)){toast('재료가 부족해');return}r.make(state);renderAll();save();toast(`${r.name} 제작 완료`)}function craftBench(id){if(!closestBench()){toast('제작대 근처에서만 가능해');return}const r=benchRecipes.find(v=>v.id===id);if(!r||!r.can(state)){toast('재료가 부족해');return}r.make(state);renderAll();renderBench();save();toast(`${r.name} 제작 완료`)}
function useBandage(){if(!state.bandage){toast('붕대가 없어');return}if(state.hp>=state.maxHp){toast('체력이 가득 차 있어');return}state.bandage--;state.hp=Math.min(state.maxHp,state.hp+30);renderAll();save();toast('붕대 사용 · +30')}
function equip(name){if(name==='돌창'&&!state.spear||name==='돌칼'&&!state.knife){toast('보유하지 않은 무기야');return}state.weapon=name;renderAll();save();toast(`${name} 장착`)}
function openPanel(id){for(const p of ['craft','bench','inv'])document.getElementById(p).style.display='none';document.getElementById(id).style.display='block'}
function renderAll(){document.getElementById('craftList').innerHTML=recipes.map(r=>`<div class="item"><div><strong>${r.name}</strong><small>${r.cost}</small></div><button data-craft="${r.id}">제작</button></div>`).join('');document.getElementById('invList').innerHTML=`<div class="item"><div><strong>무기</strong><small>${state.weapon} · 공격력 ${weaponDamage()}</small></div>${state.spear?'<button data-equip="돌창">돌창</button>':''}</div><div class="item"><div><strong>방패</strong><small>${state.shield?'최대 체력 +20':'없음'}</small></div></div><div class="item"><div><strong>소모품</strong><small>붕대 ${state.bandage} · 횃불 ${state.torch} · 생존식 ${state.food}</small></div><button id="useBandage">붕대</button></div><div class="item"><div><strong>몬스터</strong><small>10종 · 무해 3 · 중립 3 · 공격적 4</small></div></div>`}
function renderBench(){const list=document.getElementById('benchList');if(!closestBench()){list.innerHTML='<div class="item"><div><strong>제작대 없음</strong><small>기본 제작에서 나무 5개로 제작대를 만들고 가까이 이동해</small></div></div>';return}list.innerHTML=benchRecipes.map(r=>`<div class="item"><div><strong>${r.name}</strong><small>${r.cost}<br>${r.desc}</small></div><button data-bench="${r.id}">제작</button></div>`).join('')}
document.addEventListener('click',e=>{const c=e.target.closest('[data-craft]');if(c)return craft(c.dataset.craft);const b=e.target.closest('[data-bench]');if(b)return craftBench(b.dataset.bench);const q=e.target.closest('[data-equip]');if(q)return equip(q.dataset.equip);if(e.target.id==='useBandage')return useBandage();const close=e.target.closest('[data-close]');if(close)document.getElementById(close.dataset.close).style.display='none'});
document.getElementById('craftBtn').onclick=()=>{renderAll();openPanel('craft')};document.getElementById('invBtn').onclick=()=>{renderAll();openPanel('inv')};document.getElementById('attackBtn').onclick=attack;document.getElementById('eatBtn').onclick=eat;
function stickMove(x,y){const r=document.getElementById('joystick').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=x-cx,dy=y-cy,l=Math.hypot(dx,dy),m=43;if(l>m){dx=dx/l*m;dy=dy/l*m}joyX=dx/m;joyY=dy/m;document.getElementById('stick').style.transform=`translate(${dx}px,${dy}px)`}const joy=document.getElementById('joystick');joy.addEventListener('pointerdown',e=>{joyDown=true;joy.setPointerCapture(e.pointerId);stickMove(e.clientX,e.clientY)});joy.addEventListener('pointermove',e=>{if(joyDown)stickMove(e.clientX,e.clientY)});function stopJoy(){joyDown=false;joyX=joyY=0;document.getElementById('stick').style.transform='translate(0,0)'}joy.addEventListener('pointerup',stopJoy);joy.addEventListener('pointercancel',stopJoy);
function worldToScreen(x,y){return{x:x-state.player.x+w/2,y:y-state.player.y+h/2}}function visible(s,p=50){return s.x>-p&&s.y>-p&&s.x<w+p&&s.y<h+p}
function draw(){const dark=isNight();ctx.clearRect(0,0,w,h);ctx.fillStyle=dark?'#17271d':'#4d8a4e';ctx.fillRect(0,0,w,h);for(let gx=-40;gx<w+40;gx+=80)for(let gy=-40;gy<h+40;gy+=80){const wx=state.player.x-w/2+gx,wy=state.player.y-h/2+gy;ctx.fillStyle=((Math.floor(wx/80)+Math.floor(wy/80))&1)?(dark?'#1a2d22':'#548e53'):(dark?'#1c3125':'#4f874f');ctx.fillRect(gx,gy,80,80)}
for(const b of state.workbenches){const s=worldToScreen(b.x,b.y);if(!visible(s,60))continue;ctx.fillStyle='#674325';ctx.fillRect(s.x-25,s.y-11,50,22);ctx.fillStyle='#a56a35';ctx.fillRect(s.x-19,s.y-20,38,9);ctx.fillStyle='#fff';ctx.font='900 9px system-ui';ctx.textAlign='center';ctx.fillText('제작대',s.x,s.y+31)}
for(const r of state.resources){const s=worldToScreen(r.x,r.y);if(!visible(s,50))continue;if(r.type==='tree'){ctx.fillStyle='#67472b';ctx.fillRect(s.x-6,s.y-1,12,25);ctx.fillStyle='#2e6f3b';ctx.beginPath();ctx.arc(s.x,s.y-12,23,0,Math.PI*2);ctx.fill()}else if(r.type==='stone'){ctx.fillStyle='#a4afb3';ctx.beginPath();ctx.ellipse(s.x,s.y,17,12,-.2,0,Math.PI*2);ctx.fill()}else{ctx.strokeStyle='#76b866';ctx.lineWidth=4;for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(s.x+i*6,s.y+8);ctx.lineTo(s.x+i*3,s.y-9);ctx.stroke()}}}
for(const e of state.enemies){const s=worldToScreen(e.x,e.y);if(!visible(s,60))continue;ctx.fillStyle=e.color;ctx.beginPath();ctx.arc(s.x,s.y,e.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='900 9px system-ui';ctx.textAlign='center';ctx.fillText(`${e.kind} · ${e.type}`,s.x,s.y-e.r-23);ctx.fillStyle='#0009';ctx.fillRect(s.x-28,s.y-e.r-17,56,5);ctx.fillStyle='#ef6b65';ctx.fillRect(s.x-28,s.y-e.r-17,56*Math.max(0,e.hp/e.maxHp),5)}
const p=worldToScreen(state.player.x,state.player.y);ctx.fillStyle='#2b3038';ctx.beginPath();ctx.arc(p.x,p.y+7,18,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d7a77a';ctx.beginPath();ctx.arc(p.x,p.y-8,13,0,Math.PI*2);ctx.fill();ctx.fillStyle='#473021';ctx.fillRect(p.x-14,p.y-20,28,7);ctx.fillStyle='#fff';ctx.font='900 11px system-ui';ctx.textAlign='center';ctx.fillText('나',p.x,p.y+5);if(dark&&!state.torch){ctx.fillStyle='#06100999';ctx.fillRect(0,0,w,h)}}
function updateClock(dt){state.time+=dt*1.6;if(state.time>=1440){state.time-=1440;state.day++;state.enemies=[];toast('새로운 하루')}ui.phase.textContent=isNight()?'🌙 밤':'☀️ 낮';ui.clock.textContent=`${String(Math.floor(state.time/60)).padStart(2,'0')}:${String(Math.floor(state.time%60)).padStart(2,'0')}`;ui.day.textContent=state.day}
function tickUI(){ui.hp.textContent=`${Math.ceil(state.hp)}/${state.maxHp}`;ui.atk.textContent=weaponDamage();ui.weapon.textContent=state.weapon;ui.wood.textContent=state.wood;ui.stone.textContent=state.stone;ui.fiber.textContent=state.fiber;ui.food.textContent=state.food}
let last=performance.now();function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;state.player.x=clamp(state.player.x+joyX*120*dt,25,worldW-25);state.player.y=clamp(state.player.y+joyY*120*dt,25,worldH-25);updateClock(dt);attackCooldown=Math.max(0,attackCooldown-dt);resourceCooldown=Math.max(0,resourceCooldown-dt);spawnTimer-=dt;if(spawnTimer<=0){spawnTimer=3;spawnMonster()}updateEnemies(dt);if(state.hp<=0){state.hp=state.maxHp;state.player.x=worldW/2;state.player.y=worldH/2;state.enemies=[];state.food=Math.max(0,state.food-1);toast('쓰러졌어. 다시 시작 지점으로 돌아왔어.');save()}if(now-state.lastSave>5000){state.lastSave=now;save()}tickUI();draw();requestAnimationFrame(loop)}
renderAll();tickUI();requestAnimationFrame(loop);
