<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>나의 생존기</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0e1720;color:#fff;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;touch-action:none}#app{position:relative;width:100%;height:100%;overflow:hidden}canvas{display:block;width:100%;height:100%;background:#294d32}.hud{position:absolute;z-index:5;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.box{padding:7px 9px;border:1px solid #ffffff35;border-radius:12px;background:#0c1820c9;font-weight:900;font-size:12px}.small{font-size:10px;opacity:.88}.actions{position:absolute;z-index:6;right:10px;top:54px;display:grid;gap:7px}.btn{border:1px solid #ffffff35;border-radius:11px;background:#0c1820d9;color:#fff;padding:9px 11px;font-weight:900;font-size:11px}.btn:active{transform:scale(.97)}.panel{position:absolute;z-index:10;left:10px;right:10px;top:54px;bottom:10px;padding:12px;border:1px solid #ffffff35;border-radius:16px;background:#071118f5;overflow:auto;display:none;touch-action:pan-y}.panel h2{margin:0 0 9px;font-size:18px}.sectionTitle{margin:14px 0 6px;font-size:13px;color:#9fe3b5}.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px;margin:6px 0;border-radius:12px;background:#12232b;border:1px solid #ffffff12;color:#fff;text-align:left}.item strong{font-size:12px}.item small{display:block;opacity:.72;margin-top:3px;font-weight:700}.item button{border:0;border-radius:9px;background:#3d9b61;color:#fff;padding:8px 10px;font-weight:900}.close{position:sticky;top:-4px;float:right;border:0;border-radius:9px;background:#ffffff1a;color:#fff;padding:7px 9px;font-weight:900}.joystick{position:absolute;z-index:7;left:18px;bottom:20px;width:126px;height:126px;border-radius:50%;background:#ffffff13;border:2px solid #ffffff2b}.stick{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:#ffffff50;border:2px solid #fff6}.hint{position:absolute;z-index:4;left:50%;bottom:14px;transform:translateX(-50%);padding:7px 10px;border-radius:10px;background:#071118b8;font-size:10px;font-weight:800;white-space:nowrap}.toast{position:absolute;z-index:30;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 14px;border-radius:12px;background:#000c;color:#fff;font-weight:900;display:none}
</style>
</head>
<body>
<div id="app">
<canvas id="game"></canvas>
<div class="hud"><div class="box">❤️ <span id="hp">100/100</span> · ⚔️ <span id="atk">5</span></div><div class="box">☀️ <span id="clock">낮 08:00</span><br><span class="small">📅 <span id="day">1</span>일 · 🪵 <span id="wood">0</span> · 🪨 <span id="stone">0</span> · 🌿 <span id="fiber">0</span> · 🍎 <span id="food">0</span></span></div></div>
<div class="actions"><button class="btn" id="craftBtn">🛠 제작</button><button class="btn" id="invBtn">🎒 인벤토리</button><button class="btn" id="eatBtn">🍎 음식 먹기</button></div>
<div class="joystick" id="joystick"><div class="stick" id="stick"></div></div><div class="hint">자원 가까이에서 탭하면 채집 · 밤에는 몬스터 등장</div>
<div class="panel" id="craft"><button class="close" data-close="craft">닫기</button><h2>🛠 제작</h2><div id="craftList"></div></div>
<div class="panel" id="bench"><button class="close" data-close="bench">닫기</button><h2>🔨 제작대</h2><div id="benchList"></div></div>
<div class="panel" id="inv"><button class="close" data-close="inv">닫기</button><h2>🎒 인벤토리</h2><div id="invList"></div></div>
<div class="toast" id="toast"></div>
</div>
<script>
// 파일명: web-games/survival/index.html
// 메인: 나의 생존기
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const ui={hp:document.getElementById('hp'),atk:document.getElementById('atk'),clock:document.getElementById('clock'),day:document.getElementById('day'),wood:document.getElementById('wood'),stone:document.getElementById('stone'),fiber:document.getElementById('fiber'),food:document.getElementById('food'),toast:document.getElementById('toast')};
const saveKey='jaewoon-survival-v1';
const state={day:1,time:480,wood:0,stone:0,fiber:0,food:0,hp:100,maxHp:100,atk:5,weapon:'맨손',axe:false,club:false,spear:false,knife:false,shield:false,torch:0,bandage:0,workbenches:[],player:{x:0,y:0},resources:[],enemies:[],lastSave:0};
const monsterTypes=[
 {name:'달팽이',behavior:'무해',hp:20,atk:0,speed:22,r:12},
 {name:'토끼',behavior:'무해',hp:18,atk:0,speed:62,r:14},
 {name:'나비',behavior:'무해',hp:12,atk:0,speed:78,r:10},
 {name:'사슴',behavior:'중립',hp:50,atk:7,speed:30,r:18},
 {name:'멧돼지',behavior:'중립',hp:70,atk:10,speed:45,r:19},
 {name:'독도마뱀',behavior:'중립',hp:40,atk:9,speed:42,r:15},
 {name:'늑대',behavior:'공격적',hp:45,atk:8,speed:55,r:17},
 {name:'거미',behavior:'공격적',hp:35,atk:6,speed:65,r:14},
 {name:'좀비',behavior:'공격적',hp:60,atk:12,speed:28,r:19},
 {name:'들개',behavior:'공격적',hp:30,atk:6,speed:50,r:16}
];
const monsterMap=Object.fromEntries(monsterTypes.map(m=>[m.name,m]));
let dpr=1,w=0,h=0,dragging=false,joyX=0,joyY=0,attackCooldown=0,resourceCooldown=0,enemySpawn=0,toastTimer=0;
const recipes=[
 {id:'workbench',name:'제작대',cost:'나무 5',can:s=>s.wood>=5,make:s=>{s.wood-=5;s.workbenches.push({x:s.player.x+55,y:s.player.y,uses:0});}},
 {id:'axe',name:'돌도끼',cost:'나무 3 · 돌 2',can:s=>s.wood>=3&&s.stone>=2,make:s=>{s.wood-=3;s.stone-=2;s.axe=true;s.weapon='돌도끼'}},
 {id:'club',name:'돌몽둥이',cost:'나무 4 · 돌 4',can:s=>s.wood>=4&&s.stone>=4,make:s=>{s.wood-=4;s.stone-=4;s.club=true;s.weapon='돌몽둥이'}},
 {id:'bandage',name:'붕대 1개',cost:'섬유 3',can:s=>s.fiber>=3,make:s=>{s.fiber-=3;s.bandage++}},
 {id:'meal',name:'생존식 1개',cost:'나무 1 · 식물 2',can:s=>s.wood>=1&&s.fiber>=2,make:s=>{s.wood--;s.fiber-=2;s.food++}}
];
const benchRecipes=[
 {id:'spear',name:'돌창',cost:'섬유 3 · 돌 1 · 나무 1',desc:'공격력 10',can:s=>s.fiber>=3&&s.stone>=1&&s.wood>=1,make:s=>{s.fiber-=3;s.stone--;s.wood--;s.spear=true;s.weapon='돌창'}},
 {id:'knife',name:'돌칼',cost:'섬유 1 · 돌 2 · 나무 1',desc:'공격력 7',can:s=>s.fiber>=1&&s.stone>=2&&s.wood>=1,make:s=>{s.fiber--;s.stone-=2;s.wood--;s.knife=true;s.weapon='돌칼'}},
 {id:'shield',name:'나무 방패',cost:'나무 6 · 돌 2',desc:'최대 체력 +20',can:s=>s.wood>=6&&s.stone>=2,make:s=>{s.wood-=6;s.stone-=2;s.shield=true;s.maxHp+=20;s.hp=Math.min(s.maxHp,s.hp+20)}},
 {id:'torch',name:'횃불 1개',cost:'나무 2 · 섬유 2',desc:'밤 시야 보조',can:s=>s.wood>=2&&s.fiber>=2,make:s=>{s.wood-=2;s.fiber-=2;s.torch++}}
];
function resize(){dpr=Math.min(2,devicePixelRatio||1);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function rand(a,b){return a+Math.random()*(b-a)}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function toast(t){ui.toast.textContent=t;ui.toast.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>ui.toast.style.display='none',1300)}
function seedWorld(){state.resources=[];state.enemies=[];state.workbenches=[];for(let i=0;i<90;i++){const type=['tree','stone','plant'][i%3];state.resources.push({id:i,type,x:rand(60,worldW-60),y:rand(60,worldH-60),amount:type==='tree'?3:type==='stone'?2:4})}state.player.x=worldW/2;state.player.y=worldH/2}
function save(){try{localStorage.setItem(saveKey,JSON.stringify(state))}catch(e){}}
function normalizeEnemy(e){const m=monsterMap[e.kind]||monsterTypes[9];return Object.assign({kind:m.name,behavior:m.behavior,hp:m.hp,maxHp:m.hp,atk:m.atk,speed:m.speed,r:m.r,cool:0,provoked:false,wander:Math.random()*Math.PI*2,wanderTime:rand(.4,1.8)},e)}
function load(){try{const raw=localStorage.getItem(saveKey);if(!raw){seedWorld();return}const s=JSON.parse(raw);Object.assign(state,s);state.workbenches=Array.isArray(state.workbenches)?state.workbenches:[];state.resources=Array.isArray(state.resources)?state.resources:[];state.enemies=Array.isArray(state.enemies)?state.enemies.map(normalizeEnemy):[];state.spear=!!state.spear;state.knife=!!state.knife;state.shield=!!state.shield;state.torch=Number(state.torch)||0;if(!state.resources.length)seedWorld()}catch(e){seedWorld()}}
load();
function worldToScreen(x,y){return{x:x-state.player.x+w/2,y:y-state.player.y+h/2}}
function night(){return state.time>=1260||state.time<360}
function updateClock(dt){state.time+=dt*1.6;if(state.time>=1440){state.time-=1440;state.day++;state.enemies=[];toast('새로운 하루가 시작됐어')}ui.clock.textContent=`${night()?'🌙 밤':'☀️ 낮'} ${String(Math.floor(state.time/60)).padStart(2,'0')}:${String(Math.floor(state.time%60)).padStart(2,'0')}`;ui.day.textContent=state.day}
function attackDamage(){if(state.weapon==='돌창')return 10;if(state.weapon==='돌칼')return 7;if(state.weapon==='돌몽둥이')return 8;if(state.weapon==='돌도끼')return 8;return 5}
function nearestResource(){let best=null,bd=999;for(const r of state.resources){const dd=dist(state.player,r);if(dd<bd){bd=dd;best=r}}return best&&bd<58?best:null}
function nearestWorkbench(){let best=null,bd=999;for(const b of state.workbenches){const dd=dist(state.player,b);if(dd<bd){bd=dd;best=b}}return best&&bd<95?best:null}
function gather(){if(resourceCooldown>0)return;const r=nearestResource();if(!r){const b=nearestWorkbench();if(b){document.getElementById('bench').style.display='block';renderBench();return}return}resourceCooldown=.25;if(r.type==='tree')state.wood++;if(r.type==='stone')state.stone++;if(r.type==='plant')state.fiber++;r.amount--;toast(r.type==='tree'?'나무 +1':r.type==='stone'?'돌 +1':'식물 +1');if(r.amount<=0){state.resources.splice(state.resources.indexOf(r),1);setTimeout(()=>{state.resources.push({id:Date.now()+Math.random(),type:r.type,x:rand(50,worldW-50),y:rand(50,worldH-50),amount:r.type==='tree'?3:r.type==='stone'?2:4})},6000)}}
function spawnEnemy(){if(!night()||state.enemies.length>=10)return;const m=monsterTypes[Math.floor(Math.random()*monsterTypes.length)],side=Math.floor(Math.random()*4);let x,y;if(side===0){x=state.player.x+rand(-450,450);y=state.player.y-670}else if(side===1){x=state.player.x+670;y=state.player.y+rand(-450,450)}else if(side===2){x=state.player.x+rand(-450,450);y=state.player.y+670}else{x=state.player.x-670;y=state.player.y+rand(-450,450)}x=clamp(x,40,worldW-40);y=clamp(y,40,worldH-40);state.enemies.push({x,y,kind:m.name,behavior:m.behavior,hp:m.hp,maxHp:m.hp,atk:m.atk,speed:m.speed,r:m.r,cool:0,provoked:false,wander:Math.random()*Math.PI*2,wanderTime:rand(.4,1.8)})}
function attack(){if(attackCooldown>0)return;attackCooldown=.55;let target=null,bd=64;for(const e of state.enemies){const dd=dist(state.player,e);if(dd<bd){bd=dd;target=e}}if(!target){gather();return}if(target.behavior==='중립')target.provoked=true;target.hp-=attackDamage();if(target.hp<=0){state.food+=1;state.enemies.splice(state.enemies.indexOf(target),1);toast(`${target.kind} 처치 · 생존식 +1`)}else{toast(`${target.kind} 피해 ${attackDamage()}`)}}
function wander(e,dt,rate){if(e.wanderTime<=0){e.wander=Math.random()*Math.PI*2;e.wanderTime=rand(.5,2.2)}else e.wanderTime-=dt;e.x+=Math.cos(e.wander)*e.speed*rate*dt;e.y+=Math.sin(e.wander)*e.speed*rate*dt;e.x=clamp(e.x,40,worldW-40);e.y=clamp(e.y,40,worldH-40)}
function updateEnemies(dt){for(const e of state.enemies){const dx=state.player.x-e.x,dy=state.player.y-e.y,dd=Math.hypot(dx,dy)||1;
 if(e.behavior==='무해'){if(dd<220){e.x-=dx/dd*e.speed*dt;e.y-=dy/dd*e.speed*dt}else wander(e,dt,.22);continue}
 if(e.behavior==='중립'&&!e.provoked){wander(e,dt,.22);continue}
 if(e.behavior==='공격적'&&dd>330){wander(e,dt,.12);continue}
 if(dd>e.r+18){e.x+=dx/dd*e.speed*dt;e.y+=dy/dd*e.speed*dt}else{e.cool-=dt;if(e.cool<=0){e.cool=.9;state.hp=clamp(state.hp-e.atk,0,state.maxHp);if(e.atk>0)toast(`${e.kind} 공격 · -${e.atk}`);if(state.hp<=0)die()}}}}
function die(){state.hp=state.maxHp;state.player.x=worldW/2;state.player.y=worldH/2;state.enemies=[];state.food=Math.max(0,state.food-1);toast('쓰러졌어. 시작 지점으로 돌아왔어.');save()}
function eat(){if(!state.food){toast('생존식이 없어');return}if(state.hp>=state.maxHp){toast('체력이 가득 차 있어');return}state.food--;state.hp=clamp(state.hp+25,0,state.maxHp);toast('체력 +25')}
function craft(id){const r=recipes.find(x=>x.id===id);if(!r)return;if(!r.can(state)){toast('재료가 부족해');return}r.make(state);toast(`${r.name} 제작 완료`);renderPanels();save()}
function craftBench(id){if(!nearestWorkbench()){toast('제작대 근처에서만 만들 수 있어');return}const r=benchRecipes.find(x=>x.id===id);if(!r)return;if(!r.can(state)){toast('재료가 부족해');return}r.make(state);toast(`${r.name} 제작 완료`);renderPanels();renderBench();save()}
function equipWeapon(name){state.weapon=name;toast(`${name} 장착`);renderPanels();save()}
function useBandage(){if(!state.bandage){toast('붕대가 없어');return}if(state.hp>=state.maxHp){toast('체력이 가득 차 있어');return}state.bandage--;state.hp=clamp(state.hp+30,0,state.maxHp);toast('붕대 사용 · 체력 +30');renderPanels();save()}
function renderPanels(){
 document.getElementById('craftList').innerHTML='<div class="sectionTitle">기본 제작</div>'+recipes.map(r=>`<div class="item"><div><strong>${r.name}</strong><small>${r.cost}</small></div><button data-craft="${r.id}">제작</button></div>`).join('')+'<div class="sectionTitle">몬스터</div><div class="item"><div><strong>10종</strong><small>무해 3 · 중립 3 · 공격적 4</small></div></div>';
 const near=nearestWorkbench();document.getElementById('invList').innerHTML=`<div class="item"><div><strong>현재 무기</strong><small>${state.weapon} · 공격력 ${attackDamage()}</small></div>${state.spear?'<button data-equip="돌창">돌창 장착</button>':''}</div><div class="item"><div><strong>방패</strong><small>${state.shield?'최대 체력 +20':'없음'}</small></div></div><div class="item"><div><strong>소모품</strong><small>붕대 ${state.bandage} · 횃불 ${state.torch} · 생존식 ${state.food}</small></div><button id="useBandage">붕대</button></div><div class="item"><div><strong>제작대</strong><small>${state.workbenches.length}개 설치 · ${near?'근처':'근처로 이동해'}</small></div></div>`;
}
function renderBench(){const list=document.getElementById('benchList');if(!nearestWorkbench()){list.innerHTML='<div class="item"><div><strong>제작대가 없어</strong><small>기본 제작에서 제작대를 만들고 가까이 이동해</small></div></div>';return}list.innerHTML='<div class="sectionTitle">전용 제작</div>'+benchRecipes.map(r=>{const owned=r.id==='spear'?state.spear:r.id==='knife'?state.knife:r.id==='shield'?state.shield:state.torch;return `<div class="item"><div><strong>${r.name}${owned?' · 보유':''}</strong><small>${r.cost}<br>${r.desc}</small></div><button data-bench-craft="${r.id}">제작</button></div>`}).join('')}
document.addEventListener('click',e=>{const c=e.target.closest('[data-craft]');if(c)craft(c.dataset.craft);const b=e.target.closest('[data-bench-craft]');if(b)craftBench(b.dataset.benchCraft);const eq=e.target.closest('[data-equip]');if(eq)equipWeapon(eq.dataset.equip);if(e.target.id==='useBandage')useBandage();const close=e.target.closest('[data-close]');if(close)document.getElementById(close.dataset.close).style.display='none'});
document.getElementById('craftBtn').onclick=()=>{renderPanels();document.getElementById('craft').style.display='block'};document.getElementById('invBtn').onclick=()=>{renderPanels();document.getElementById('inv').style.display='block'};document.getElementById('eatBtn').onclick=eat;
function stickMove(x,y){const r=document.getElementById('joystick').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=x-cx,dy=y-cy,l=Math.hypot(dx,dy),m=43;if(l>m){dx=dx/l*m;dy=dy/l*m}joyX=dx/m;joyY=dy/m;document.getElementById('stick').style.transform=`translate(${dx}px,${dy}px)`}
const joy=document.getElementById('joystick');joy.addEventListener('pointerdown',e=>{dragging=true;joy.setPointerCapture(e.pointerId);stickMove(e.clientX,e.clientY)});joy.addEventListener('pointermove',e=>{if(dragging)stickMove(e.clientX,e.clientY)});const stopJoy=()=>{dragging=false;joyX=joyY=0;document.getElementById('stick').style.transform='translate(0,0)'};joy.addEventListener('pointerup',stopJoy);joy.addEventListener('pointercancel',stopJoy);
canvas.addEventListener('pointerdown',e=>{if(e.target===canvas)attack()});addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter')attack();if(e.key==='e')gather();if(e.key==='c')document.getElementById('craftBtn').click();if(e.key==='i')document.getElementById('invBtn').click();if(e.key==='h')eat()});
function draw(){ctx.clearRect(0,0,w,h);const dark=night();ctx.fillStyle=dark?'#16251d':'#4d8a4e';ctx.fillRect(0,0,w,h);for(let gx=-40;gx<w+40;gx+=80)for(let gy=-40;gy<h+40;gy+=80){const wx=state.player.x-w/2+gx,wy=state.player.y-h/2+gy;ctx.fillStyle=((Math.floor(wx/80)+Math.floor(wy/80))&1)?(dark?'#192c22':'#548e53'):(dark?'#1b3025':'#4f874f');ctx.fillRect(gx,gy,80,80)}
for(const b of state.workbenches){const s=worldToScreen(b.x,b.y);if(s.x<-60||s.y<-60||s.x>w+60||s.y>h+60)continue;ctx.fillStyle='#6f4527';ctx.fillRect(s.x-26,s.y-10,52,22);ctx.fillStyle='#a96c36';ctx.fillRect(s.x-19,s.y-20,38,10);ctx.fillStyle='#d0a05b';ctx.fillRect(s.x-13,s.y-17,26,4);ctx.fillStyle='#fff';ctx.font='900 9px system-ui';ctx.textAlign='center';ctx.fillText('제작대',s.x,s.y+31)}
for(const r of state.resources){const s=worldToScreen(r.x,r.y);if(s.x<-50||s.y<-50||s.x>w+50||s.y>h+50)continue;if(r.type==='tree'){ctx.fillStyle='#66452c';ctx.fillRect(s.x-6,s.y-2,12,24);ctx.fillStyle='#2d6939';ctx.beginPath();ctx.arc(s.x,s.y-10,22,0,7);ctx.fill();ctx.fillStyle='#3e8247';ctx.beginPath();ctx.arc(s.x-15,s.y-1,14,0,7);ctx.arc(s.x+15,s.y-1,14,0,7);ctx.fill()}else if(r.type==='stone'){ctx.fillStyle='#9ca8ad';ctx.beginPath();ctx.ellipse(s.x,s.y,16,12,-.2,0,7);ctx.fill()}else{ctx.strokeStyle='#79bd68';ctx.lineWidth=4;for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(s.x+i*6,s.y+8);ctx.lineTo(s.x+i*3,s.y-10);ctx.stroke()}}}
for(const e of state.enemies){const s=worldToScreen(e.x,e.y);ctx.save();const colors={무해:'#8bbf68',중립:'#c3a34b',공격적:'#b34c4c'};ctx.fillStyle=colors[e.behavior]||'#7e2730';if(e.kind==='달팽이'){ctx.beginPath();ctx.arc(s.x,s.y,15,0,7);ctx.fill();ctx.fillStyle='#d4bd91';ctx.beginPath();ctx.arc(s.x-4,s.y-2,8,0,7);ctx.fill()}else if(e.kind==='토끼'){ctx.beginPath();ctx.ellipse(s.x,s.y+4,15,12,0,0,7);ctx.fill();ctx.fillRect(s.x-9,s.y-19,5,13);ctx.fillRect(s.x+4,s.y-19,5,13)}else if(e.kind==='나비'){ctx.beginPath();ctx.ellipse(s.x-8,s.y-4,11,9,-.4,0,7);ctx.ellipse(s.x+8,s.y-4,11,9,.4,0,7);ctx.fill();ctx.fillStyle='#333';ctx.fillRect(s.x-2,s.y-8,4,16)}else if(e.kind==='사슴'){ctx.beginPath();ctx.ellipse(s.x,s.y,18,11,0,0,7);ctx.fill();ctx.strokeStyle='#7a5d2b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(s.x-8,s.y-6);ctx.lineTo(s.x-15,s.y-18);ctx.lineTo(s.x-20,s.y-12);ctx.moveTo(s.x-13,s.y-16);ctx.lineTo(s.x-10,s.y-22);ctx.stroke()}else{ctx.beginPath();ctx.arc(s.x,s.y,e.r,0,7);ctx.fill();if(e.behavior==='공격적'){ctx.fillStyle='#fff';ctx.fillRect(s.x-7,s.y-5,4,4);ctx.fillRect(s.x+3,s.y-5,4,4)}}ctx.fillStyle='#000a';ctx.fillRect(s.x-28,s.y-e.r-18,56,5);ctx.fillStyle='#ef6b65';ctx.fillRect(s.x-28,s.y-e.r-18,56*Math.max(0,e.hp/e.maxHp),5);ctx.fillStyle='#fff';ctx.font='900 9px system-ui';ctx.textAlign='center';ctx.fillText(`${e.kind} · ${e.behavior}`,s.x,s.y-e.r-23);ctx.restore()}
const p=worldToScreen(state.player.x,state.player.y);ctx.fillStyle='#2a2f38';ctx.beginPath();ctx.arc(p.x,p.y+5,17,0,7);ctx.fill();ctx.fillStyle='#d7a77a';ctx.beginPath();ctx.arc(p.x,p.y-9,12,0,7);ctx.fill();ctx.fillStyle='#473021';ctx.fillRect(p.x-13,p.y-19,26,7);ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(p.x+7,p.y);ctx.lineTo(p.x+25,p.y-7);ctx.stroke();ctx.fillStyle='#fff';ctx.font='900 11px system-ui';ctx.textAlign='center';ctx.fillText('나',p.x,p.y+3);if(dark&&!state.torch){ctx.fillStyle='#06100999';ctx.fillRect(0,0,w,h)}}
let last=performance.now();function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;const speed=120;state.player.x=clamp(state.player.x+joyX*speed*dt,25,worldW-25);state.player.y=clamp(state.player.y+joyY*speed*dt,25,worldH-25);updateClock(dt);attackCooldown=Math.max(0,attackCooldown-dt);resourceCooldown=Math.max(0,resourceCooldown-dt);enemySpawn-=dt;if(enemySpawn<=0){enemySpawn=3.2;spawnEnemy()}updateEnemies(dt);if(state.hp<=0)die();if(now-state.lastSave>4500){state.lastSave=now;save()}uiTick();draw();requestAnimationFrame(loop)}
function uiTick(){ui.hp.textContent=`${Math.ceil(state.hp)}/${state.maxHp}`;ui.atk.textContent=attackDamage();ui.wood.textContent=state.wood;ui.stone.textContent=state.stone;ui.fiber.textContent=state.fiber;ui.food.textContent=state.food}
setInterval(()=>{renderPanels();if(document.getElementById('bench').style.display==='block')renderBench()},1000);renderPanels();uiTick();requestAnimationFrame(loop);
</script>
