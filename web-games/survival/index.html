<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>나의 생존기</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#102118;color:#fff;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;touch-action:none}
#app{position:relative;width:100%;height:100%;overflow:hidden}
canvas{display:block;width:100%;height:100%;background:#4d8a4e}
.hud{position:absolute;z-index:5;left:8px;right:8px;top:8px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.box{padding:7px 9px;border:1px solid #ffffff35;border-radius:12px;background:#0b1710db;font-size:12px;font-weight:900;line-height:1.35}
.small{font-size:10px;opacity:.9}
.actions{position:absolute;z-index:8;right:10px;top:55px;display:grid;gap:7px}
.btn{min-width:88px;border:1px solid #ffffff45;border-radius:11px;background:#0b1710dd;color:#fff;padding:9px 11px;font-size:11px;font-weight:900}
.attack{position:absolute;right:12px;bottom:18px;min-width:96px;min-height:56px;background:#7d2222;z-index:9}
.btn:active{transform:scale(.97)}
.panel{position:absolute;z-index:20;left:10px;right:10px;top:55px;bottom:10px;padding:12px;border:1px solid #ffffff40;border-radius:16px;background:#071118f7;overflow:auto;display:none;touch-action:pan-y}
.panel h2{margin:0 0 10px;font-size:18px}.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px;margin:6px 0;border-radius:12px;background:#12232b;border:1px solid #ffffff12}.item small{display:block;margin-top:3px;opacity:.75;font-size:10px;line-height:1.4}.item button{border:0;border-radius:9px;background:#2e9360;color:#fff;padding:8px 10px;font-weight:900}.close{float:right;border:0;border-radius:9px;background:#ffffff18;color:#fff;padding:7px 9px;font-weight:900}.joystick{position:absolute;z-index:9;left:18px;bottom:18px;width:126px;height:126px;border-radius:50%;border:2px solid #ffffff30;background:#ffffff14}.stick{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;border:2px solid #ffffff35;background:#ffffff55}.toast{position:absolute;z-index:40;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 14px;border-radius:12px;background:#000c;font-size:12px;font-weight:900;display:none}.hint{position:absolute;z-index:4;left:50%;bottom:10px;transform:translateX(-50%);padding:6px 9px;border-radius:10px;background:#071118aa;font-size:10px;font-weight:800;white-space:nowrap}
</style>
</head>
<body><div id="app">
<canvas id="game"></canvas>
<div class="hud"><div class="box">❤️ <span id="hp">100/100</span> · ⚔️ <span id="atk">5</span><br><span class="small">무기: <span id="weapon">맨손</span></span></div><div class="box"><span id="phase">☀️ 낮</span> <span id="clock">08:00</span><br><span class="small">📅 <span id="day">1</span>일 · 🪵 <span id="wood">0</span> · 🪨 <span id="stone">0</span> · 🌿 <span id="fiber">0</span> · 🍄 <span id="mushroom">0</span></span></div></div>
<div class="actions"><button class="btn" id="craftBtn">🛠 제작</button><button class="btn" id="invBtn">🎒 인벤</button><button class="btn" id="eatBtn">🍎 먹기</button></div>
<button class="btn attack" id="attackBtn">⚔️ 공격</button>
<div class="joystick" id="joystick"><div class="stick" id="stick"></div></div><div class="hint">공격 버튼으로 전투 · 돌도끼로 까끌까끌 나무/버섯 채집</div>
<div class="panel" id="craft"><button class="close" data-close="craft">닫기</button><h2>🛠 제작</h2><div id="craftList"></div></div>
<div class="panel" id="bench"><button class="close" data-close="bench">닫기</button><h2>🔨 제작대</h2><div id="benchList"></div></div>
<div class="panel" id="inv"><button class="close" data-close="inv">닫기</button><h2>🎒 인벤토리</h2><div id="invList"></div></div>
<div class="toast" id="toast"></div></div>
<script>
// 파일명: web-games/survival/index.html
// 임포트: 로컬 에셋 / 기존 저장 키 유지
// 메인: 제작대 직접 제작·설치 / 입장 즉시 몬스터 / 실제 에셋 자원
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const ui={hp:document.getElementById('hp'),atk:document.getElementById('atk'),weapon:document.getElementById('weapon'),phase:document.getElementById('phase'),clock:document.getElementById('clock'),day:document.getElementById('day'),wood:document.getElementById('wood'),stone:document.getElementById('stone'),fiber:document.getElementById('fiber'),mushroom:document.getElementById('mushroom'),toast:document.getElementById('toast')};
const saveKey='jaewoon-survival-v1',worldVersion=2,worldW=3000,worldH=3000,spawn={x:1500,y:1500};
const assets={tree:new Image(),rock:new Image(),plant:new Image(),mushroom:new Image()};
assets.tree.src='./assets/tree.png';assets.rock.src='./assets/rock.png';assets.plant.src='./assets/plant.png';assets.mushroom.src='./assets/mushroom.png';
const monsters=[
{name:'달팽이',type:'무해',hp:20,atk:0,speed:22,r:12,min:120,max:240},
{name:'토끼',type:'무해',hp:18,atk:0,speed:62,r:14,min:120,max:240},
{name:'나비',type:'무해',hp:12,atk:0,speed:78,r:10,min:800,max:1050},
{name:'사슴',type:'중립',hp:50,atk:7,speed:30,r:18,min:380,max:650},
{name:'멧돼지',type:'중립',hp:70,atk:10,speed:45,r:19,min:380,max:650},
{name:'독도마뱀',type:'중립',hp:40,atk:9,speed:42,r:15,min:380,max:650},
{name:'늑대',type:'공격적',hp:45,atk:8,speed:55,r:17,min:380,max:650},
{name:'거미',type:'공격적',hp:35,atk:6,speed:65,r:14,min:380,max:650},
{name:'좀비',type:'공격적',hp:60,atk:12,speed:28,r:19,min:380,max:650},
{name:'들개',type:'공격적',hp:30,atk:6,speed:50,r:16,min:380,max:650}
];
const monsterMap=Object.fromEntries(monsters.map(m=>[m.name,m]));
const state={worldVersion,day:1,time:480,wood:0,stone:0,fiber:0,mushroom:0,food:0,hp:100,maxHp:100,weapon:'맨손',axe:false,spear:false,club:false,shield:false,torch:0,bandage:0,workbenches:[],resources:[],enemies:[],player:{x:spawn.x,y:spawn.y},lastSave:0};
let w=innerWidth,h=innerHeight,dpr=1,joyX=0,joyY=0,joyDown=false,attackCooldown=0,resourceCooldown=0,spawnTimer=0,toastTimer=0;
function resize(){dpr=Math.min(2,devicePixelRatio||1);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function rand(a,b){return a+Math.random()*(b-a)}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function toast(t){ui.toast.textContent=t;ui.toast.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>ui.toast.style.display='none',1100)}
function night(){return state.time>=1260||state.time<360}
function save(){try{state.worldVersion=worldVersion;localStorage.setItem(saveKey,JSON.stringify(state))}catch(e){}}
function addResource(type,distanceMin,distanceMax,id,amount){const a=Math.random()*Math.PI*2,d=rand(distanceMin,distanceMax);state.resources.push({id:id||Date.now()+Math.random(),type,x:clamp(spawn.x+Math.cos(a)*d,70,worldW-70),y:clamp(spawn.y+Math.sin(a)*d,70,worldH-70),amount:amount||2})}
function seedStarterResources(){state.resources=[];let id=0;for(let i=0;i<18;i++)addResource('tree',90,520,'tree'+id++,3);for(let i=0;i<18;i++)addResource('stone',90,520,'stone'+id++,2);for(let i=0;i<18;i++)addResource('plant',90,520,'plant'+id++,4);for(let i=0;i<12;i++)addResource('rough_tree',360,720,'rough'+id++,2);for(let i=0;i<12;i++)addResource('mushroom',360,720,'mush'+id++,2)}
function ensureStarterResources(){const counts={tree:0,stone:0,plant:0,rough_tree:0,mushroom:0};for(const r of state.resources)if(counts[r.type]!=null)counts[r.type]++;if(counts.tree<8)for(let i=counts.tree;i<8;i++)addResource('tree',90,520,'repairTree'+i,3);if(counts.stone<8)for(let i=counts.stone;i<8;i++)addResource('stone',90,520,'repairStone'+i,2);if(counts.plant<8)for(let i=counts.plant;i<8;i++)addResource('plant',90,520,'repairPlant'+i,4);if(counts.rough_tree<6)for(let i=counts.rough_tree;i<6;i++)addResource('rough_tree',360,720,'repairRough'+i,2);if(counts.mushroom<6)for(let i=counts.mushroom;i<6;i++)addResource('mushroom',360,720,'repairMush'+i,2)}
function normalizeEnemy(e){const m=monsterMap[e.kind]||monsters[9];return Object.assign({kind:m.name,type:m.type,hp:m.hp,maxHp:m.hp,atk:m.atk,speed:m.speed,r:m.r,cool:0,provoked:false,wander:Math.random()*6.28,wanderTime:rand(.5,2)},e)}
function load(){try{const raw=localStorage.getItem(saveKey);if(!raw){seedStarterResources();spawnInitialEnemies();return}const s=JSON.parse(raw);Object.assign(state,s);state.worldVersion=Number(s.worldVersion)||1;state.workbenches=Array.isArray(state.workbenches)?state.workbenches:[];state.resources=Array.isArray(state.resources)?state.resources:[];state.enemies=Array.isArray(state.enemies)?state.enemies.map(normalizeEnemy):[];state.food=Number(state.food)||0;state.mushroom=Number(state.mushroom)||0;state.axe=!!state.axe;state.spear=!!state.spear;state.club=!!state.club;state.shield=!!state.shield;if(state.weapon==='돌칼')state.weapon='맨손';if(state.worldVersion<2){state.workbenches=[];state.worldVersion=2}ensureStarterResources();if(!state.enemies.length)spawnInitialEnemies();save()}catch(e){Object.assign(state,{worldVersion,workbenches:[],resources:[],enemies:[]});seedStarterResources();spawnInitialEnemies();save()}}
function spawnEnemyByMonster(m){const a=Math.random()*Math.PI*2,d=rand(m.min,m.max);state.enemies.push({x:clamp(spawn.x+Math.cos(a)*d,40,worldW-40),y:clamp(spawn.y+Math.sin(a)*d,40,worldH-40),kind:m.name,type:m.type,hp:m.hp,maxHp:m.hp,atk:m.atk,speed:m.speed,r:m.r,cool:0,provoked:false,wander:Math.random()*6.28,wanderTime:rand(.5,2)})}
function spawnInitialEnemies(){state.enemies=[];for(const m of monsters)spawnEnemyByMonster(m)}
function weaponDamage(){return state.weapon==='돌창'?10:state.weapon==='돌몽둥이'?8:state.weapon==='돌도끼'?8:5}
function nearest(arr){let best=null,bd=1e9;for(const x of arr){const d=dist(state.player,x);if(d<bd){bd=d;best=x}}return best}
function nearestResource(){const r=nearest(state.resources);return r&&dist(state.player,r)<68?r:null}
function nearestWorkbench(){const b=nearest(state.workbenches);return b&&dist(state.player,b)<105?b:null}
function canGather(r){if((r.type==='rough_tree'||r.type==='mushroom')&&!state.axe){toast('돌도끼가 필요해');return false}return true}
function respawnResource(type){setTimeout(()=>addResource(type,type==='rough_tree'||type==='mushroom'?360:90,type==='rough_tree'||type==='mushroom'?720:1250,'respawn'+Date.now(),type==='stone'?2:type==='plant'?4:3),4500)}
function gather(){if(resourceCooldown>0)return;const r=nearestResource();if(!r){if(nearestWorkbench()){openPanel('bench');renderBench()}return}if(!canGather(r))return;resourceCooldown=.25;const gain={tree:'나무',rough_tree:'까끌까끌 나무',stone:'돌',plant:'섬유',mushroom:'버섯'};if(r.type==='tree'||r.type==='rough_tree')state.wood++;else if(r.type==='stone')state.stone++;else if(r.type==='plant')state.fiber++;else state.mushroom++;r.amount--;toast(`${gain[r.type]} +1`);if(r.amount<=0){state.resources.splice(state.resources.indexOf(r),1);respawnResource(r.type)}save()}
function wander(e,dt,rate){e.wanderTime-=dt;if(e.wanderTime<=0){e.wander=Math.random()*6.28;e.wanderTime=rand(.5,2.2)}e.x+=Math.cos(e.wander)*e.speed*rate*dt;e.y+=Math.sin(e.wander)*e.speed*rate*dt;e.x=clamp(e.x,35,worldW-35);e.y=clamp(e.y,35,worldH-35)}
function updateEnemies(dt){for(const e of state.enemies){const dx=state.player.x-e.x,dy=state.player.y-e.y,dd=Math.hypot(dx,dy)||1;if(e.type==='무해'){if(dd<220){e.x-=dx/dd*e.speed*dt;e.y-=dy/dd*e.speed*dt}else wander(e,dt,.24);continue}if(e.type==='중립'&&!e.provoked){wander(e,dt,.24);continue}if(e.type==='공격적'&&!e.provoked&&dd>500){wander(e,dt,.12);continue}if(dd>e.r+18){e.x+=dx/dd*e.speed*dt;e.y+=dy/dd*e.speed*dt}else{e.cool-=dt;if(e.cool<=0){e.cool=.9;state.hp=clamp(state.hp-e.atk,0,state.maxHp);if(e.atk>0)toast(`${e.kind} 공격 · -${e.atk}`)}}}}
function attack(){if(attackCooldown>0)return;attackCooldown=.55;let target=null,bd=72;for(const e of state.enemies){const d=dist(state.player,e);if(d<bd){bd=d;target=e}}if(!target){gather();return}if(target.type==='중립')target.provoked=true;target.hp-=weaponDamage();toast(`${target.kind} 피해 ${weaponDamage()}`);if(target.hp<=0){state.enemies.splice(state.enemies.indexOf(target),1);state.food++;toast(`${target.kind} 처치 · 생존식 +1`);}}
function die(){state.hp=state.maxHp;state.player.x=spawn.x;state.player.y=spawn.y;state.enemies=[];state.food=Math.max(0,state.food-1);spawnInitialEnemies();toast('쓰러졌어. 시작 지점으로 돌아왔어.');save()}
function eat(){if(!state.food){toast('생존식이 없어');return}if(state.hp>=state.maxHp){toast('체력이 가득 차 있어');return}state.food--;state.hp=Math.min(state.maxHp,state.hp+25);save()}
const recipes=[{id:'workbench',name:'제작대',cost:'나무 5',desc:'현재 위치에 직접 설치',can:s=>s.wood>=5,make:s=>{s.wood-=5;s.workbenches.push({x:clamp(s.player.x,45,worldW-45),y:clamp(s.player.y,45,worldH-45)})}},{id:'club',name:'돌몽둥이',cost:'나무 4 · 돌 4',desc:'공격력 8',can:s=>s.wood>=4&&s.stone>=4,make:s=>{s.wood-=4;s.stone-=4;s.club=true;s.weapon='돌몽둥이'}},{id:'bandage',name:'붕대',cost:'섬유 3',desc:'체력 30 회복',can:s=>s.fiber>=3,make:s=>{s.fiber-=3;s.bandage++}}];
const benchRecipes=[{id:'axe',name:'돌도끼',cost:'섬유 2 · 돌 3 · 나무 2',desc:'공격력 8 · 까끌까끌 나무/버섯 채집',can:s=>s.fiber>=2&&s.stone>=3&&s.wood>=2,make:s=>{s.fiber-=2;s.stone-=3;s.wood-=2;s.axe=true;s.weapon='돌도끼'}},{id:'spear',name:'돌창',cost:'섬유 3 · 돌 1 · 나무 1',desc:'공격력 10',can:s=>s.fiber>=3&&s.stone>=1&&s.wood>=1,make:s=>{s.fiber-=3;s.stone--;s.wood--;s.spear=true;s.weapon='돌창'}},{id:'shield',name:'나무 방패',cost:'나무 6 · 돌 2',desc:'최대 체력 +20',can:s=>s.wood>=6&&s.stone>=2,make:s=>{s.wood-=6;s.stone-=2;if(!s.shield){s.shield=true;s.maxHp+=20;s.hp=Math.min(s.maxHp,s.hp+20)}}}];
function craft(id){const r=recipes.find(x=>x.id===id);if(!r||!r.can(state)){toast('재료가 부족해');return}r.make(state);renderAll();save();toast(`${r.name} 제작 완료`)}function craftBench(id){if(!nearestWorkbench()){toast('제작대 근처에서만 가능해');return}const r=benchRecipes.find(x=>x.id===id);if(!r||!r.can(state)){toast('재료가 부족해');return}r.make(state);renderAll();renderBench();save();toast(`${r.name} 제작 완료`)}
function openPanel(id){['craft','bench','inv'].forEach(x=>document.getElementById(x).style.display='none');document.getElementById(id).style.display='block'}
function renderAll(){document.getElementById('craftList').innerHTML=recipes.map(r=>`<div class="item"><div><strong>${r.name}</strong><small>${r.cost}<br>${r.desc}</small></div><button data-craft="${r.id}">제작</button></div>`).join('');document.getElementById('invList').innerHTML=`<div class="item"><div><strong>무기</strong><small>${state.weapon} · 공격력 ${weaponDamage()}</small></div></div><div class="item"><div><strong>자원</strong><small>나무 ${state.wood} · 돌 ${state.stone} · 섬유 ${state.fiber} · 버섯 ${state.mushroom}</small></div></div><div class="item"><div><strong>제작대</strong><small>${state.workbenches.length}개 · 자동 생성 없음</small></div></div><div class="item"><div><strong>소모품</strong><small>붕대 ${state.bandage||0} · 생존식 ${state.food||0}</small></div></div>`}
function renderBench(){const list=document.getElementById('benchList');if(!nearestWorkbench()){list.innerHTML='<div class="item"><div><strong>제작대가 없어</strong><small>기본 제작에서 나무 5개로 만든 뒤 원하는 곳에 설치해</small></div></div>';return}list.innerHTML=benchRecipes.map(r=>`<div class="item"><div><strong>${r.name}</strong><small>${r.cost}<br>${r.desc}</small></div><button data-bench="${r.id}">제작</button></div>`).join('')}
document.addEventListener('click',e=>{const c=e.target.closest('[data-craft]');if(c)return craft(c.dataset.craft);const b=e.target.closest('[data-bench]');if(b)return craftBench(b.dataset.bench);const close=e.target.closest('[data-close]');if(close)document.getElementById(close.dataset.close).style.display='none'});
document.getElementById('craftBtn').onclick=()=>{renderAll();openPanel('craft')};document.getElementById('invBtn').onclick=()=>{renderAll();openPanel('inv')};document.getElementById('eatBtn').onclick=eat;document.getElementById('attackBtn').onclick=attack;
const joy=document.getElementById('joystick');function stickMove(x,y){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=x-cx,dy=y-cy,l=Math.hypot(dx,dy),m=43;if(l>m){dx=dx/l*m;dy=dy/l*m}joyX=dx/m;joyY=dy/m;document.getElementById('stick').style.transform=`translate(${dx}px,${dy}px)`}joy.addEventListener('pointerdown',e=>{joyDown=true;joy.setPointerCapture(e.pointerId);stickMove(e.clientX,e.clientY)});joy.addEventListener('pointermove',e=>{if(joyDown)stickMove(e.clientX,e.clientY)});function stopJoy(){joyDown=false;joyX=joyY=0;document.getElementById('stick').style.transform='translate(0,0)'}joy.addEventListener('pointerup',stopJoy);joy.addEventListener('pointercancel',stopJoy);
function screen(x,y){return{x:x-state.player.x+w/2,y:y-state.player.y+h/2}}function drawImg(img,x,y,size){if(img.complete&&img.naturalWidth){const ratio=img.naturalWidth/img.naturalHeight;let dw=size,dh=size/ratio;if(dh>size*1.6){dh=size;dw=size*ratio}ctx.drawImage(img,x-dw/2,y-dh/2,dw,dh)}}
function draw(){const dark=night();ctx.clearRect(0,0,w,h);ctx.fillStyle=dark?'#15271c':'#4d8a4e';ctx.fillRect(0,0,w,h);for(let gx=-40;gx<w+40;gx+=80)for(let gy=-40;gy<h+40;gy+=80){const wx=state.player.x-w/2+gx,wy=state.player.y-h/2+gy;ctx.fillStyle=((Math.floor(wx/80)+Math.floor(wy/80))&1)?(dark?'#182b20':'#548e53'):(dark?'#1b3024':'#4f874f');ctx.fillRect(gx,gy,80,80)}for(const r of state.resources){const s=screen(r.x,r.y);if(s.x<-90||s.y<-90||s.x>w+90||s.y>h+90)continue;const size=r.type==='tree'?58:r.type==='rough_tree'?66:r.type==='mushroom'?44:38;if(r.type==='tree'||r.type==='rough_tree')drawImg(assets.tree,s.x,s.y,size);else if(r.type==='stone')drawImg(assets.rock,s.x,s.y,size);else if(r.type==='plant')drawImg(assets.plant,s.x,s.y,size);else drawImg(assets.mushroom,s.x,s.y,size)}for(const b of state.workbenches){const s=screen(b.x,b.y);if(s.x<-80||s.y<-80||s.x>w+80||s.y>h+80)continue;ctx.fillStyle='#6f4527';ctx.fillRect(s.x-27,s.y-12,54,24);ctx.fillStyle='#b6773c';ctx.fillRect(s.x-19,s.y-22,38,10);ctx.fillStyle='#fff';ctx.font='900 9px system-ui';ctx.textAlign='center';ctx.fillText('제작대',s.x,s.y+33)}for(const e of state.enemies){const s=screen(e.x,e.y);if(s.x<-70||s.y<-70||s.x>w+70||s.y>h+70)continue;const c=e.type==='무해'?'#8bcf74':e.type==='중립'?'#d5ae50':'#c64949';ctx.fillStyle=c;ctx.beginPath();ctx.arc(s.x,s.y,e.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='900 9px system-ui';ctx.textAlign='center';ctx.fillText(`${e.kind} · ${e.type}`,s.x,s.y-e.r-22);ctx.fillStyle='#000a';ctx.fillRect(s.x-28,s.y-e.r-16,56,5);ctx.fillStyle='#f06161';ctx.fillRect(s.x-28,s.y-e.r-16,56*Math.max(0,e.hp/e.maxHp),5)}const p=screen(state.player.x,state.player.y);ctx.fillStyle='#2b3038';ctx.beginPath();ctx.arc(p.x,p.y+6,18,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d7a77a';ctx.beginPath();ctx.arc(p.x,p.y-8,13,0,Math.PI*2);ctx.fill();ctx.fillStyle='#473021';ctx.fillRect(p.x-14,p.y-20,28,7);ctx.fillStyle='#fff';ctx.font='900 11px system-ui';ctx.textAlign='center';ctx.fillText('나',p.x,p.y+4);if(dark&&!state.torch){ctx.fillStyle='#06100999';ctx.fillRect(0,0,w,h)}}
function uiTick(){ui.hp.textContent=`${Math.ceil(state.hp)}/${state.maxHp}`;ui.atk.textContent=weaponDamage();ui.weapon.textContent=state.weapon;ui.phase.textContent=night()?'🌙 밤':'☀️ 낮';ui.clock.textContent=`${String(Math.floor(state.time/60)).padStart(2,'0')}:${String(Math.floor(state.time%60)).padStart(2,'0')}`;ui.day.textContent=state.day;ui.wood.textContent=state.wood;ui.stone.textContent=state.stone;ui.fiber.textContent=state.fiber;ui.mushroom.textContent=state.mushroom}
load();
let last=performance.now();function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;state.player.x=clamp(state.player.x+joyX*120*dt,25,worldW-25);state.player.y=clamp(state.player.y+joyY*120*dt,25,worldH-25);state.time+=dt*1.6;if(state.time>=1440){state.time-=1440;state.day++;state.enemies=[];spawnInitialEnemies();toast('새로운 하루')}attackCooldown=Math.max(0,attackCooldown-dt);resourceCooldown=Math.max(0,resourceCooldown-dt);spawnTimer-=dt;if(spawnTimer<=0){spawnTimer=3.2;if(night())spawnEnemyByMonster(monsters[Math.floor(Math.random()*monsters.length)])}updateEnemies(dt);if(state.hp<=0)die();if(now-state.lastSave>5000){state.lastSave=now;save()}uiTick();draw();requestAnimationFrame(loop)}
renderAll();uiTick();requestAnimationFrame(loop);
</script></body></html>
