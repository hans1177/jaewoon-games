<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0d1720">
<title>대충 RPG 3D</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1720;color:#fff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:#07101c}
#boot b{display:block;color:#ffd26c;font-size:20px;margin-bottom:8px}
#boot a{color:#9fd8ff}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0c1016}
</style>
</head>
<body>
<div id="joy" hidden></div>
<div id="boot"><div><b>대충 RPG 3D 실행 중...</b><span>PlayCanvas 버전으로 전환합니다.</span><br><small>문제가 있으면 <a href="?legacy=1">구버전 실행</a></small></div></div>
<script>
(()=>{
 const q=new URLSearchParams(location.search);
 if(q.get('legacy')==='1'){
   const boot=document.getElementById('boot');
   boot.innerHTML='<b>대충 RPG 구버전 안전 모드</b><span>기존 Canvas 버전을 실행합니다.</span>';
   const fr=document.createElement('iframe');fr.id='game';fr.src='./rpg.html?v=19a';fr.allow='autoplay';document.body.appendChild(fr);
   const PATCHES=['patch-v15.js','patch-v16.js','patch-v17.js','patch-core18.js','patch-v18.js'];
   let booted=false;
   function addScript(win,doc,src){
     return new Promise(resolve=>{
       let runtimeError='';const onError=e=>{runtimeError=e?.message||'runtime error'};win.addEventListener('error',onError,true);
       const s=doc.createElement('script');s.src='./'+src+'?v=19a';
       s.onload=()=>setTimeout(()=>{win.removeEventListener('error',onError,true);resolve({ok:!runtimeError,error:runtimeError})},0);
       s.onerror=()=>{win.removeEventListener('error',onError,true);resolve({ok:false,error:'load failed'})};doc.body.appendChild(s);
     });
   }
   async function legacyBoot(){
     if(booted)return;let doc,win;try{doc=fr.contentDocument;win=fr.contentWindow}catch{return}
     if(!doc?.body||win.__RPG_BASE_READY!==true)return;booted=true;
     for(const src of PATCHES){const result=await addScript(win,doc,src);if(!result.ok)break}
     boot.remove();
   }
   fr.addEventListener('load',()=>setTimeout(legacyBoot,80),{once:true});setTimeout(legacyBoot,1800);return;
 }
 location.replace('./playcanvas/?v=3d-cutover-20260921');
})();
</script>
</body>
</html>
