<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0c1016">
<title>대충 용사 RPG</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0c1016}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0c1016}
#load{position:fixed;z-index:50;left:50%;top:50%;transform:translate(-50%,-50%);padding:11px 16px;border-radius:12px;background:#111e;color:#ffd26c;font:900 14px system-ui;pointer-events:none;text-align:center;max-width:88vw}
</style>
</head>
<body>
<div id="load">RPG 안전 모드 로딩 중...</div>
<iframe id="game" src="./rpg.html?v=19a" allow="autoplay"></iframe>
<script>
const fr=document.getElementById('game'),load=document.getElementById('load');
const PATCHES=['patch-v15.js','patch-v16.js','patch-v17.js','patch-core18.js','patch-v18.js'];
let booted=false;
function show(msg){if(load)load.textContent=msg}
function finish(msg=''){if(!load)return;if(msg){show(msg);setTimeout(()=>load.remove(),1400)}else load.remove()}
function addScript(win,doc,src){
 return new Promise(resolve=>{
  let runtimeError='';
  const onError=e=>{runtimeError=e?.message||'runtime error'};
  win.addEventListener('error',onError,true);
  const s=doc.createElement('script');
  s.src='./'+src+'?v=19a';
  s.onload=()=>setTimeout(()=>{win.removeEventListener('error',onError,true);resolve({ok:!runtimeError,error:runtimeError})},0);
  s.onerror=()=>{win.removeEventListener('error',onError,true);resolve({ok:false,error:'load failed'})};
  doc.body.appendChild(s);
 });
}
async function boot(){
 if(booted)return;
 let doc,win;
 try{doc=fr.contentDocument;win=fr.contentWindow}catch(e){show('RPG 문서 접근 오류');return}
 if(!doc||!doc.body||!doc.getElementById('game')){show('RPG 문서 초기화 실패');return}
 if(win.__RPG_BASE_READY!==true){show('RPG 본체 초기화 실패 · 새로고침 필요');return}
 booted=true;
 for(const src of PATCHES){
  show('추가 콘텐츠 적용 중 · '+src.replace('.js',''));
  const result=await addScript(win,doc,src);
  if(!result.ok){
   console.error('RPG patch failed',src,result.error);
   finish('추가 콘텐츠 일부 실패 · 기본 게임으로 계속');
   return;
  }
 }
 finish();
}
fr.addEventListener('load',()=>setTimeout(boot,80),{once:true});
setTimeout(()=>{if(!booted)boot()},1800);
</script>
</body>
</html>
