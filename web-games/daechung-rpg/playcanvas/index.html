<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0d1720">
<title>대충 RPG 3D · PlayCanvas 이전판</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1720;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;touch-action:none}
#app{display:block;width:100%;height:100%}
#hud{position:fixed;left:12px;top:12px;z-index:10;color:white;font-weight:800;text-shadow:0 2px 5px #000}
.pill{display:inline-block;margin:0 5px 5px 0;padding:7px 9px;border-radius:10px;background:#07101ccc;border:1px solid #ffffff44;font-size:12px}
#joy{position:fixed;left:18px;bottom:22px;width:128px;height:128px;border-radius:50%;background:#07101c88;border:2px solid #ffffff55;z-index:12}
#knob{position:absolute;left:34px;top:34px;width:56px;height:56px;border-radius:50%;background:#ffffff66;border:2px solid #fff9;pointer-events:none}
#attack{position:fixed;right:24px;bottom:30px;width:94px;height:94px;border:2px solid #fff9;border-radius:50%;background:#b73535e8;color:#fff;font-size:18px;font-weight:900;z-index:12}
.actionBtn{position:fixed;border:2px solid #fff9;color:#fff;font-weight:900;z-index:12}
#talk{right:124px;bottom:38px;width:76px;height:64px;border-radius:18px;background:#d28b22e8}
#bagBtn{right:22px;top:62px;width:64px;height:46px;border-radius:14px;background:#405d9de8}
#multiBtn{right:94px;top:62px;width:64px;height:46px;border-radius:14px;background:#345d8fe8}
#quest{position:fixed;left:12px;top:54px;z-index:10;max-width:min(72vw,430px);padding:8px 10px;border-radius:10px;background:#07101ccc;border:1px solid #ffffff44;color:#fff;font-size:12px;font-weight:800;text-shadow:0 2px 5px #000}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000b;z-index:40;padding:18px}
.panel{width:min(92vw,430px);max-height:82vh;overflow:auto;border:2px solid #dcb36e;border-radius:14px;background:#1a1817;color:#fff;padding:14px}
.panel h2{margin:0 0 10px}.slot{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #ffffff22;padding:10px 0}
.panel button{border:0;border-radius:9px;padding:9px 11px;background:#e8ad42;color:#201407;font-weight:900}.panel .close{width:100%;margin-top:12px;background:#394359;color:#fff}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#06101bea;z-index:20;color:#fff;padding:24px;text-align:center}
#start button{width:min(320px,84vw);padding:15px;border:0;border-radius:12px;background:#f0b64f;color:#211405;font-size:18px;font-weight:900}
#badge{position:fixed;right:12px;top:12px;z-index:10;background:#163c50dd;color:#bfefff;border:1px solid #71cfff66;border-radius:10px;padding:7px 9px;font-size:11px;font-weight:900}
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:30;background:#07101cee;color:#fff;border:1px solid #ffffff66;border-radius:10px;padding:9px 12px;font-weight:900;opacity:0;pointer-events:none;transition:opacity .15s;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
#partyHud{position:fixed;right:12px;top:116px;z-index:10;width:min(46vw,230px);padding:8px;border-radius:10px;background:#07101ccc;border:1px solid #7fcfff66;color:#fff;font-size:11px;font-weight:800;display:none}
#partyHud b{color:#8fe9ff}
</style>
<script type="importmap">
{"imports":{"playcanvas":"https://cdn.jsdelivr.net/npm/playcanvas@2.22.2/+esm"}}
</script>
</head>
<body>
<canvas id="app"></canvas>
<div id="hud"><span class="pill" id="area">마을</span><span class="pill" id="lv">Lv.1</span><span class="pill" id="hp">HP 100/100</span><span class="pill" id="atk">공격 10</span><span class="pill" id="gold">0 G</span><span class="pill" id="xp">EXP 0/100</span></div><div id="quest">퀘스트: 촌장에게 말을 걸어라.</div>
<div id="badge">PLAYCANVAS 3D · PHASE 5</div><div id="toast"></div><div id="partyHud"></div>
<div id="joy"><div id="knob"></div></div>
<button id="attack">공격</button><button id="talk" class="actionBtn">대화</button><button id="bagBtn" class="actionBtn">가방</button><button id="multiBtn" class="actionBtn">멀티</button>
<div id="start"><div><h1>대충 RPG 3D</h1><p>PlayCanvas 이전 5단계 · 멀티/던전/보스</p><button id="startBtn">3D 테스트 시작</button></div></div>
<div id="dialog" class="overlay"><div class="panel"><h2 id="dialogTitle">대화</h2><div id="dialogText"></div><button id="dialogClose" class="close">닫기</button></div></div>
<div id="shop" class="overlay"><div class="panel"><h2 id="shopTitle">상점</h2><div id="shopList"></div><button id="shopClose" class="close">닫기</button></div></div>
<div id="bag" class="overlay"><div class="panel"><h2>가방 / 장비</h2><div id="bagList"></div><button id="bagClose" class="close">닫기</button></div></div>
<div id="multi" class="overlay"><div class="panel"><h2>멀티플레이</h2><div id="multiStatus">오프라인</div><input id="multiRoom" type="number" min="1" max="10" inputmode="numeric" placeholder="방 번호 1~10" style="width:100%;height:44px;margin:10px 0;border-radius:9px;border:1px solid #ffffff33;background:#0d1420;color:#fff;padding:0 10px;font-weight:900"><div style="display:flex;gap:8px"><button id="multiCreate" style="flex:1">방 만들기</button><button id="multiJoin" style="flex:1">방 참가</button></div><button id="multiLeave" class="close">방 나가기</button><button id="multiClose" class="close">닫기</button><div style="font-size:11px;opacity:.7;margin-top:8px">방 코드는 1~10 중 숫자 하나</div></div></div>
<script type="module" src="./main.mjs"></script>
</body>
</html>
