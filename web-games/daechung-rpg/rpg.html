.btn{position:fixed;border:2px solid #ffffff99;border-radius:50%;color:#fff;font-weight:900;z-index:5;text-shadow:0 2px 3px #000;box-shadow:0 5px 15px #0008}
#attack{right:20px;bottom:28px;width:92px;height:92px;background:#c73434e8;font-size:18px}
#talk{right:112px;bottom:106px;width:67px;height:67px;background:#d28b22e8}
#bagBtn{right:18px;top:18px;width:58px;height:58px;background:#405d9de8}
#soundBtn{right:18px;top:84px;width:48px;height:48px;background:#2f6d64e8;font-size:20px}

.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:#000d;z-index:10}
.panel{width:min(92vw,430px);max-height:84vh;overflow:auto;background:#211c18;border:3px solid #e2b56d;border-radius:14px;padding:15px}
.main{width:100%;padding:13px;border:0;border-radius:10px;background:#e8ad42;color:#1d1205;font-size:17px;font-weight:900;margin-top:8px}.dark{background:#394359;color:#fff}
.slot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 2px;border-bottom:1px solid #fff2}.slot button{border:0;border-radius:8px;padding:8px 10px;font-weight:900;background:#e8ad42;color:#1d1205}.slot button:disabled{opacity:.45}.small{font-size:12px;opacity:.72}
#start{display:flex}#speech{position:fixed;left:50%;bottom:160px;transform:translateX(-50%);width:min(92vw,500px);background:#17120ef3;border:3px solid #e1b46c;border-radius:12px;z-index:9;padding:12px;display:none}
#speech b{color:#ffd26c}#toast{position:fixed;left:50%;top:25%;transform:translateX(-50%);background:#111f;border:1px solid #fff8;padding:9px 12px;border-radius:9px;z-index:20;font-weight:900;opacity:0;pointer-events:none;white-space:nowrap;max-width:92vw}
</style>

<div id="hud">
 <div class="row"><span class="pill" id="lv">Lv.1</span><span class="pill" id="gold">0 G</span><span class="pill" id="atk">공격 3</span><span class="pill" id="weaponText">맨손</span><span class="pill" id="armorText">방어구 없음</span><span class="pill" id="xpText">EXP 0/100</span></div>

<script>
// 파일명: rpg.html
// 그래픽/오디오는 외부 파일 0개. WebAudio + Canvas만 사용.
// RPG_PATCH_V7_JUNGLE

const c=document.getElementById('game'),ctx=c.getContext('2d');
let W=innerWidth,H=innerHeight,D=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0);ctx.imageSmoothingEnabled=false}
addEventListener('resize',resize);resize();

const WORLD={w:1800,h:1200},ANIM_FRAMES=34;
const BASE_SLIME={hp:30,atk:4,spd:40,r:15,xp:6,gold:3};
const F={
 f1:{n:'1번 사냥터',l:'Lv.1',bg:'#5ca44f',m:[['초록 슬라임',1,30,4,40,15,6,3,6,'slime']]},
 f2:{n:'2번 사냥터',l:'Lv.2~3',bg:'#4d9b54',m:[['파란 슬라임',2,56,6,44,16,9,5,4,'blue'],['들멧돼지',3,88,9,55,19,13,7,3,'boar']]},
 f3:{n:'3번 사냥터',l:'Lv.4',bg:'#6f9648',m:[['회색 늑대',4,136,12,68,18,18,10,6,'wolf']]},
 f4:{n:'4번 사냥터',l:'Lv.5~6',bg:'#8a6d40',m:[['오크',5,200,15,48,21,24,14,3,'orc'],['붉은 늑대',6,270,19,73,19,31,18,3,'redwolf']]},
 f5:{n:'5번 사냥터',l:'Lv.7 이상',bg:'#51475f',m:[['균열 기사',7,380,24,56,22,42,25,3,'knight'],['균열 악마',8,500,30,61,23,55,32,2,'demon']]},
 f6:{n:'6번 사냥터',l:'Lv.8~10',bg:'#483a3e',m:[['해골 전사',8,650,32,58,21,65,38,3,'skeleton'],['고블린 정예',9,850,38,65,22,80,48,2,'eliteGoblin'],['오우거',10,1100,45,50,28,100,60,1,'ogre']]},
 f7:{n:'7번 정글',l:'Lv.11~12',bg:'#243d2c',m:[['정글 호랑이',11,1250,48,76,24,125,72,3,'tiger'],['원시인 전사',11,1450,52,58,22,138,78,3,'primitive'],['정글 표범',12,1700,58,82,22,155,88,2,'panther']]}
};
const P=[['f1',700,390,'1번 포탈','Lv.1'],['f2',890,390,'2번 포탈','Lv.2~3'],['f3',1080,390,'3번 포탈','Lv.4'],['f4',1270,390,'4번 포탈','Lv.5~6'],['f5',760,610,'5번 포탈','Lv.7 이상'],['f6',1010,610,'6번 포탈','Lv.8~10'],['f7',1260,610,'7번 포탈','Lv.11~12']];
const WEAPONS={'낡은 돌검':{price:100,damage:5,cd:.35},'철 도끼':{price:500,damage:12,cd:.35},'철 쌍검':{price:700,damage:20,cd:.35},'철 망치':{price:500,damage:40,cd:1},'낡은 쌍절곤':{price:0,damage:30,cd:.35,hidden:true,desc:'이 무기는 외부는 낡았지만 내부와 무기의 주인은 절대로 낡지 않았습니다.'}};
const ARMORS={'나무 갑옷':{price:50,hp:50},'철 갑옷':{price:200,hp:200}};
const SELL_PRICE={'슬라임 젤리':5,'멧돼지 고기':12,'늑대 가죽':20,'오크 이빨':28,'균열 조각':45,'수상한 당근':25};
const CAVE={
 entrance:{x:1660,y:1040},chest:{x:1490,y:600},exit:{x:1690,y:600},
 caveSlime:{n:'동굴 슬라임',lv:4,hp:150,atk:8,spd:44,r:18,xp:25,g:14,type:'caveSlime'},
 archer:{n:'궁수 고블린',lv:4,hp:150,atk:10,spd:46,r:18,xp:30,g:18,type:'archer'},
 giant:{n:'거대 동굴슬라임',lv:5,hp:300,atk:16,spd:38,r:34,xp:80,g:45,type:'giantCaveSlime'}
};
const TOMB={x:930,y:610,enemyX:930,enemyY:760};

// ==============================
// 사운드: BGM 2종 + 효과음 50종
// ==============================
const SFX_NAMES=[
'uiClick','uiOpen','uiClose','talkOpen','questAccept','questComplete','questReward','coin','itemPickup','sell',
'buy','weaponEquip','weaponSwing','swordHit','axeHit','dualHit','playerHit','playerLowHp','playerDeath','respawn',
'levelUp','portalEnter','portalExit','caveEnter','caveExit','chestUnlock','chestOpen','arrowShoot','arrowFly','arrowHit',
'homingArrow','slimeAggro','beastAggro','humanoidAggro','bossAggro','slimeHit','beastHit','humanoidHit','bossHit','slimeDeath',
'beastDeath','humanoidDeath','bossDeath','smith','shopOpen','shopClose','bagOpen','bagClose','noGold','dungeonClear'
];
const SFX_INDEX=Object.fromEntries(SFX_NAMES.map((n,i)=>[n,i]));
const AUDIO={ctx:null,master:null,sfxBus:null,musicBus:null,aggroBus:null,muted:false,started:false,musicStep:0,timer:null,aggro:false,lastAggro:false};
function initAudio(){
 if(AUDIO.started)return;
 const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
 const ac=new AC();AUDIO.ctx=ac;
 AUDIO.master=ac.createGain();AUDIO.master.gain.value=.62;AUDIO.master.connect(ac.destination);
 AUDIO.sfxBus=ac.createGain();AUDIO.sfxBus.gain.value=.85;AUDIO.sfxBus.connect(AUDIO.master);
 AUDIO.musicBus=ac.createGain();AUDIO.musicBus.gain.value=.18;AUDIO.musicBus.connect(AUDIO.master);
 AUDIO.aggroBus=ac.createGain();AUDIO.aggroBus.gain.value=0;AUDIO.aggroBus.connect(AUDIO.master);
 AUDIO.started=true;startBgm();
}
function tone(freq,dur=.12,type='square',vol=.12,when=0,slide=1,bus=AUDIO.sfxBus){
 if(!AUDIO.ctx||AUDIO.muted)return;
 const ac=AUDIO.ctx,t=ac.currentTime+when,o=ac.createOscillator(),g=ac.createGain();
 o.type=type;o.frequency.setValueAtTime(Math.max(35,freq),t);o.frequency.exponentialRampToValueAtTime(Math.max(35,freq*slide),t+dur);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 o.connect(g);g.connect(bus);o.start(t);o.stop(t+dur+.02);
}
function noise(dur=.08,vol=.07,cut=1200,when=0,bus=AUDIO.sfxBus){
 if(!AUDIO.ctx||AUDIO.muted)return;
 const ac=AUDIO.ctx,rate=ac.sampleRate,len=Math.max(1,Math.floor(rate*dur)),buf=ac.createBuffer(1,len,rate),data=buf.getChannelData(0);
 for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*(1-i/len);
 const src=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain(),t=ac.currentTime+when;
 src.buffer=buf;f.type='lowpass';f.frequency.value=cut;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 src.connect(f);f.connect(g);g.connect(bus);src.start(t);
}
function sfx(name){
 if(!AUDIO.started)initAudio();if(!AUDIO.ctx||AUDIO.muted)return;
 const i=SFX_INDEX[name]??0,base=110+(i%10)*34,hi=base*(1.25+(i%4)*.12),wave=['square','triangle','sawtooth','sine'][i%4];
 const special={
  uiClick:()=>tone(640,.045,'square',.06,0,.82),
  questAccept:()=>{tone(440,.11,'triangle',.1);tone(660,.14,'triangle',.09,.10,1.05)},
  questComplete:()=>{tone(523,.12,'triangle',.11);tone(659,.12,'triangle',.1,.1);tone(784,.22,'triangle',.11,.2)},
  questReward:()=>{tone(659,.09,'sine',.1);tone(880,.16,'sine',.1,.09)},
  coin:()=>{tone(1000,.06,'square',.08);tone(1400,.08,'square',.06,.055)},
  itemPickup:()=>{tone(520,.07,'triangle',.07);tone(760,.1,'triangle',.07,.06)},
  sell:()=>{tone(720,.06,'square',.07);tone(920,.08,'square',.06,.05)},
  buy:()=>{tone(420,.08,'triangle',.08);tone(620,.1,'triangle',.08,.07)},
  weaponEquip:()=>{noise(.07,.08,1800);tone(230,.16,'sawtooth',.08,0,1.7)},
  weaponSwing:()=>noise(.10,.08,2500),
  swordHit:()=>{noise(.065,.1,3400);tone(180,.09,'square',.06,0,.7)},
  axeHit:()=>{noise(.1,.12,1100);tone(100,.12,'square',.09,0,.55)},
  dualHit:()=>{noise(.06,.08,3000);tone(240,.06,'square',.06);tone(310,.06,'square',.06,.045)},
  playerHit:()=>{noise(.11,.1,900);tone(120,.13,'sawtooth',.09,0,.5)},
  playerLowHp:()=>tone(80,.22,'sine',.12,0,.9),
  playerDeath:()=>{tone(180,.45,'sawtooth',.14,0,.28);noise(.3,.08,500)},
  respawn:()=>{tone(330,.16,'sine',.08);tone(494,.18,'sine',.08,.15);tone(660,.22,'sine',.08,.3)},
  levelUp:()=>{[0,1,2,3].forEach(k=>tone([440,554,659,880][k],.16,'triangle',.09,k*.09))},
  portalEnter:()=>{tone(220,.35,'sine',.1,0,2.2);tone(440,.32,'triangle',.06,.08,1.7)},
  portalExit:()=>{tone(520,.25,'sine',.09,0,.55);tone(320,.22,'triangle',.06,.08,.65)},
  caveEnter:()=>{tone(100,.5,'sine',.11,0,.5);noise(.35,.07,550)},
  caveExit:()=>{tone(160,.25,'sine',.08,0,1.8);tone(350,.18,'triangle',.06,.16)},
  chestUnlock:()=>{tone(300,.08,'square',.07);tone(470,.11,'square',.07,.07)},
  chestOpen:()=>{noise(.12,.08,900);[0,1,2].forEach(k=>tone([520,780,1040][k],.15,'sine',.08,k*.07))},
  arrowShoot:()=>noise(.07,.06,2500),
  arrowFly:()=>tone(760,.055,'sine',.025,0,.8),
  arrowHit:()=>{noise(.07,.08,1800);tone(260,.07,'square',.05)},
  homingArrow:()=>{tone(850,.12,'sine',.05,0,1.3);tone(980,.12,'sine',.04,.08,.85)},
  slimeAggro:()=>tone(190,.12,'square',.06,0,1.35),
  beastAggro:()=>{tone(95,.22,'sawtooth',.09,0,.7);noise(.12,.05,600)},
  humanoidAggro:()=>{tone(150,.16,'square',.07);tone(210,.12,'square',.06,.08)},
  bossAggro:()=>{tone(60,.55,'sawtooth',.14);noise(.24,.1,350)},
  slimeHit:()=>tone(240,.08,'sine',.06,0,.6),
  beastHit:()=>{noise(.07,.07,850);tone(115,.08,'square',.05)},
  humanoidHit:()=>{noise(.06,.08,1600);tone(170,.08,'square',.05)},
  bossHit:()=>{noise(.11,.1,700);tone(75,.13,'sawtooth',.08)},
  slimeDeath:()=>{tone(220,.18,'sine',.07,0,.35);noise(.08,.04,1200)},
  beastDeath:()=>{tone(120,.26,'sawtooth',.08,0,.45);noise(.12,.06,700)},
  humanoidDeath:()=>{tone(180,.28,'triangle',.07,0,.4);noise(.1,.05,900)},
  bossDeath:()=>{tone(110,.6,'sawtooth',.12,0,.22);noise(.4,.1,500);tone(440,.22,'sine',.06,.42,.55)},
  smith:()=>{noise(.045,.08,2800);tone(760,.05,'square',.06,.02)},
  noGold:()=>{tone(170,.09,'square',.06);tone(130,.14,'square',.06,.08)},
  dungeonClear:()=>{[0,1,2,3,4].forEach(k=>tone([330,440,550,660,880][k],.2,'triangle',.08,k*.1))}
 };
 if(special[name]){special[name]();return}
 tone(base,.07+(i%5)*.018,wave,.045+(i%3)*.012,0,.72+(i%6)*.1);
 tone(hi,.06+(i%4)*.015,wave,.035+(i%4)*.008,.045,1.05);
 if(i%3===0)noise(.045+(i%4)*.012,.03+(i%3)*.012,700+(i%8)*280,.015);
}
function startBgm(){
 if(AUDIO.timer)return;
 const normal=[220,277,330,440,330,277,247,330,294,370,440,494,440,370,330,277];
 const aggro=[110,110,147,110,165,147,196,147,110,220,147,196,165,147,110,98];
 AUDIO.timer=setInterval(()=>{
  if(!AUDIO.ctx||AUDIO.muted||!run)return;
  const i=AUDIO.musicStep++%normal.length,zoneShift=zone==='town'?1:zone==='cave'?.75:1+Math.max(0,Number((zone||'f1').slice(1))-1)*.025;
  tone(normal[i]*zoneShift,.28,'triangle',.045,0,1,AUDIO.musicBus);
  if(i%2===0)tone(normal[(i+5)%normal.length]*.5,.5,'sine',.028,0,1,AUDIO.musicBus);
  tone(aggro[i],.18,i%2?'square':'sawtooth',.052,0,.92,AUDIO.aggroBus);
  if(i%4===0)noise(.055,.025,420,0,AUDIO.aggroBus);
 },285);
}
function setAggro(v,boss=false){
 if(!AUDIO.ctx)return;
 const now=AUDIO.ctx.currentTime;
 AUDIO.musicBus.gain.setTargetAtTime(v?.035:.18,now,.18);
 AUDIO.aggroBus.gain.setTargetAtTime(v?.24:0,now,.12);
 if(v&&!AUDIO.lastAggro)sfx(boss?'bossAggro':'humanoidAggro');
 AUDIO.lastAggro=v;AUDIO.aggro=v;
}
function toggleSound(){
 if(!AUDIO.started)initAudio();
 AUDIO.muted=!AUDIO.muted;
 if(AUDIO.master)AUDIO.master.gain.setTargetAtTime(AUDIO.muted?0:.62,AUDIO.ctx.currentTime,.04);
 soundBtn.textContent=AUDIO.muted?'🔇':'🔊';sfx('uiClick');
}

let run=false,last=0,cam={x:0,y:0},keys={},j={x:0,y:0},ac=0,pc=0,flash=0,zone='town',combatTimer=0,portalMsgCd=0,townHeal=0;
let p,mons=[],drops=[],fx=[],arrows=[],q=0,hq=0,chestOpened=false,guardianDead=false;
const inv={'슬라임 젤리':0,'멧돼지 고기':0,'늑대 가죽':0,'오크 이빨':0,'균열 조각':0,'수상한 당근':0};
const ownedWeapons={'낡은 돌검':false,'철 도끼':false,'철 쌍검':false,'철 망치':false,'낡은 쌍절곤':false};
const ownedArmors={'나무 갑옷':false,'철 갑옷':false};
const npcs=[{x:520,y:610,n:'촌장',k:'chief'},{x:690,y:670,n:'대장장이',k:'smith'},{x:405,y:805,n:'무기상인',k:'weapon'},{x:610,y:830,n:'판매상인',k:'seller'},{x:820,y:830,n:'갑옷상인',k:'armor'}];
function armorBonus(){return p.armor&&ARMORS[p.armor]?ARMORS[p.armor].hp:0}
function maxHp(){return p.baseHp+armorBonus()}
function currentAtk(){return (WEAPONS[p.weapon]?.damage||3)+(p.bonusAtk||0)}
function reset(){
 p={x:560,y:730,r:17,hp:100,baseHp:100,lv:1,xp:0,nxp:100,g:0,bonusAtk:0,spd:185,dir:1,inv:0,weapon:'맨손',armor:null,animState:'idle',animFrame:0,animTick:0};
 zone='town';mons=[];drops=[];fx=[];arrows=[];q=0;hq=0;pc=0;chestOpened=false;guardianDead=false;combatTimer=0;window.sk=0;
 for(const k in inv)inv[k]=0;for(const k in ownedWeapons)ownedWeapons[k]=false;for(const k in ownedArmors)ownedArmors[k]=false;hud()
}
function hud(){
 const mh=maxHp();lv.textContent=`Lv.${p.lv}`;gold.textContent=`${p.g} G`;atk.textContent=`공격 ${Math.floor(currentAtk())}`;weaponText.textContent=p.weapon;armorText.textContent=p.armor||'방어구 없음';xpText.textContent=`EXP ${Math.floor(p.xp)}/${p.nxp}`;
 hp.style.width=`${Math.max(0,p.hp/mh*100)}%`;xp.style.width=`${Math.min(100,p.xp/p.nxp*100)}%`;
 if(q===0)quest.textContent='퀘스트: 촌장에게 말을 걸어라.';else if(q===1)quest.textContent=`퀘스트: 슬라임 5마리 처치 (${Math.min(5,window.sk||0)}/5)`;else if(q===2)quest.textContent='완료: 촌장에게 돌아가 보상 50G 받기';else if(q===3)quest.textContent='퀘스트: 슬라임 왕을 처치하라.';else if(q===4)quest.textContent='완료: 촌장에게 돌아가 보상 50G 받기';else if(q===5)quest.textContent='퀘스트: 2번 포탈로 들어가라.';else if(q===6)quest.textContent='완료: 촌장에게 돌아가 보상 50G 받기';else quest.textContent='현재 메인 퀘스트 완료';
 hiddenQuest.style.display=hq?'block':'none';hiddenQuest.textContent=hq===1?'히든 퀘스트: 기사의 마지막 원수를 처치하라.':hq>=2?'히든 퀘스트 완료 · 낡은 쌍절곤 획득':'';
 area.textContent=zone==='town'?'현재 지역: 마을':zone==='cave'?'현재 지역: 동굴 던전':`현재 지역: ${F[zone].n} · ${F[zone].l}`
}
function toastMsg(s){toast.textContent=s;toast.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>toast.style.opacity=0,1300)}
function say(n,s){sfx('talkOpen');speech.innerHTML=`<b>${n}</b><br>${s}<br><small>화면을 누르면 닫기</small>`;speech.style.display='block'}
speech.onpointerdown=()=>{sfx('uiClose');speech.style.display='none'};

function enter(z){
 const prev=zone;zone=z;mons=[];drops=[];fx=[];arrows=[];pc=1;combatTimer=0;setAggro(false);
 if(z==='town'){p.x=560;p.y=700;sfx(prev==='cave'?'caveExit':'portalExit');toastMsg('마을 · 촌장 옆으로 돌아왔다')}
 else if(z==='cave'){p.x=160;p.y=600;sfx('caveEnter');spawnCave();toastMsg('동굴 던전 입장')}
 else{p.x=185;p.y=600;sfx('portalEnter');spawnAll(z);if(z==='f5'&&hq===1)spawnHiddenEnemy();toastMsg(`${F[z].n} 입장`);if(z==='f2'&&q===5){q=6;sfx('questComplete');toastMsg('목표 완료! 촌장에게 가서 보상받기')}}
 hud()
}
function spawnAll(z){for(const s of F[z].m)for(let i=0;i<s[8];i++)spawn(s,480+Math.random()*1200,120+Math.random()*960,z)}
function spawn(s,px,py,z){
 let [name,lvv,hpv,av,spd,r,xpv,gv,,type]=s,baseType=type;
 if((type==='slime'||type==='blue')&&Math.random()<.10){name='슬라임 왕';hpv=600;av=10;spd=34;r=30;xpv=70;gv=45;type='slimeKing'}
 if(z==='f5'&&p.lv>=9){let e=p.lv-8;hpv=Math.floor(hpv*(1+e*.12));av=Math.floor(av*(1+e*.08));lvv+=Math.floor(e/2);xpv=Math.floor(xpv*(1+e*.1));gv=Math.floor(gv*(1+e*.08))}
 mons.push({n:name,lv:lvv,x:px,y:py,hp:hpv,mhp:hpv,a:av,spd,r,xp:xpv,g:gv,type,baseType,z,hit:0,dead:false,shootCd:1+Math.random()*1.5,animState:'walk',animFrame:0,animTick:Math.random()*34,deathAge:0,dir:1,aggroed:false})
}
function spawnCave(){
 for(let i=0;i<4;i++)spawnCaveMonster(CAVE.caveSlime,360+Math.random()*900,140+Math.random()*920);
 for(let i=0;i<2;i++)spawnCaveMonster(CAVE.archer,500+Math.random()*760,140+Math.random()*920);
 spawnCaveMonster(CAVE.giant,CAVE.chest.x-120,CAVE.chest.y)
}
function spawnCaveMonster(s,px,py){mons.push({n:s.n,lv:s.lv,x:px,y:py,hp:s.hp,mhp:s.hp,a:s.atk,spd:s.spd,r:s.r,xp:s.xp,g:s.g,type:s.type,baseType:s.type,z:'cave',hit:0,dead:false,shootCd:1+Math.random()*1.5,animState:'walk',animFrame:0,animTick:0,deathAge:0,dir:1,aggroed:false})}
function spawnHiddenEnemy(){if(mons.some(m=>m.type==='hiddenEnemy'&&!m.dead)||hq!==1)return;mons.push({n:'기사단의 마지막 원수',lv:8,x:TOMB.enemyX,y:TOMB.enemyY,hp:300,mhp:300,a:10,spd:58,r:23,xp:120,g:0,type:'hiddenEnemy',baseType:'hiddenEnemy',z:'f5',hit:0,dead:false,shootCd:0,animState:'walk',animFrame:0,animTick:0,deathAge:0,dir:1,aggroed:false})}
function nearest(){if(zone!=='town')return null;let b=null,d=80;for(const n of npcs){const v=Math.hypot(n.x-p.x,n.y-p.y);if(v<d){d=v;b=n}}return b}
function talkNow(){
 const n=nearest();if(!n){toastMsg(zone==='town'?'근처에 대화할 사람이 없다':'여기서는 대화할 사람이 없다');return}
 if(n.k==='chief'){
  if(q===0){q=1;window.sk=0;sfx('questAccept');say('촌장','1번 포탈에서 슬라임 5마리를 잡아라. 완료하면 내게 돌아와 보상을 받아라.')}
  else if(q===1)say('촌장',`슬라임 ${5-Math.min(5,window.sk||0)}마리 남았다.`);
  else if(q===2){p.g+=50;q=3;sfx('questReward');say('촌장','보상 <b>50골드</b>. 다음은 슬라임 왕 처치다.')}
  else if(q===3)say('촌장','슬라임 왕은 슬라임 스폰 때 10% 확률로 나타난다.');
  else if(q===4){p.g+=50;q=5;sfx('questReward');say('촌장','보상 <b>50골드</b>. 다음은 2번 포탈 입장이다.')}
  else if(q===5)say('촌장','2번 포탈로 들어가라.');
  else if(q===6){p.g+=50;q=7;sfx('questReward');say('촌장','보상 <b>50골드</b>. 이제 자유롭게 사냥해라.')}
  else say('촌장','7번 포탈은 어두운 정글이다. Lv.11~12 권장.')
 }else if(n.k==='smith'){
  if(p.weapon==='낡은 쌍절곤')say('대장장이','이건... <b>전설이 쓰는 무기는 강화 못한다.</b><br><br>“이 무기는 외부는 낡았지만 내부와 무기의 주인은 절대로 낡지 않았습니다.”');
  else if(p.g>=25){p.g-=25;p.bonusAtk+=2;sfx('smith');say('대장장이','25골드. 현재 공격력 +2.')}else say('대장장이','강화는 25골드다.')
 }else if(n.k==='weapon')openWeaponShop();else if(n.k==='seller')openSellShop();else if(n.k==='armor')openArmorShop();
 hud()
}
function openWeaponShop(){sfx('shopOpen');renderWeaponShop();weaponShop.style.display='flex'}
function renderWeaponShop(){weaponList.innerHTML=Object.entries(WEAPONS).filter(([,w])=>!w.hidden).map(([name,w])=>{const o=ownedWeapons[name],e=p.weapon===name,l=e?'장착중':o?'장착':`${w.price}G 구매`;return `<div class="slot"><span><b>${name}</b><br><span class="small">데미지 ${w.damage}${w.cd===1?' · 쿨타임 1초':''}</span></span><button data-weapon="${name}" ${e?'disabled':''}>${l}</button></div>`}).join('');weaponList.querySelectorAll('[data-weapon]').forEach(b=>b.onclick=()=>buyOrEquipWeapon(b.dataset.weapon))}
function equipWeapon(name){p.weapon=name;sfx('weaponEquip');toastMsg(`${name} 장착 · 공격 ${Math.floor(currentAtk())}`);hud()}
function buyOrEquipWeapon(name){const w=WEAPONS[name];if(!ownedWeapons[name]){if(p.g<w.price){sfx('noGold');toastMsg('골드가 부족하다');return}p.g-=w.price;ownedWeapons[name]=true;sfx('buy')}equipWeapon(name);renderWeaponShop()}
function openArmorShop(){sfx('shopOpen');renderArmorShop();armorShop.style.display='flex'}
function renderArmorShop(){armorList.innerHTML=Object.entries(ARMORS).map(([name,a])=>{const o=ownedArmors[name],e=p.armor===name,l=e?'착용중':o?'착용':`${a.price}G 구매`;return `<div class="slot"><span><b>${name}</b><br><span class="small">최대체력 +${a.hp}</span></span><button data-armor="${name}" ${e?'disabled':''}>${l}</button></div>`}).join('');armorList.querySelectorAll('[data-armor]').forEach(b=>b.onclick=()=>buyOrEquipArmor(b.dataset.armor))}
function buyOrEquipArmor(name){const a=ARMORS[name],old=maxHp();if(!ownedArmors[name]){if(p.g<a.price){sfx('noGold');toastMsg('골드가 부족하다');return}p.g-=a.price;ownedArmors[name]=true;sfx('buy')}p.armor=name;p.hp=Math.min(maxHp(),p.hp+Math.max(0,maxHp()-old));sfx('weaponEquip');renderArmorShop();hud()}
function openSellShop(){sfx('shopOpen');renderSellShop();sellShop.style.display='flex'}
function renderSellShop(){sellList.innerHTML=Object.entries(SELL_PRICE).map(([name,price])=>`<div class="slot"><span>${name}<br><span class="small">${price}G / 개</span></span><span>×${inv[name]||0} <button data-sell="${name}" ${(inv[name]||0)<=0?'disabled':''}>판매</button></span></div>`).join('');sellList.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>sellItem(b.dataset.sell))}
function sellItem(name){if((inv[name]||0)<=0)return;inv[name]--;p.g+=SELL_PRICE[name];sfx('sell');renderSellShop();hud()}
function sellEverything(){let t=0;for(const [n,pr] of Object.entries(SELL_PRICE)){t+=(inv[n]||0)*pr;inv[n]=0}if(!t){toastMsg('판매할 아이템이 없다');return}p.g+=t;sfx('sell');toastMsg(`전부 판매 +${t}G`);renderSellShop();hud()}

function getAction(){
 if(zone==='f2'&&Math.hypot(p.x-CAVE.entrance.x,p.y-CAVE.entrance.y)<85)return {label:'들어가기',kind:'enterCave'};
 if(zone==='f5'&&Math.hypot(p.x-TOMB.x,p.y-TOMB.y)<90&&hq===0)return {label:'비석 조사',kind:'tomb'};
 if(zone==='cave'&&!chestOpened&&Math.hypot(p.x-CAVE.chest.x,p.y-CAVE.chest.y)<85)return {label:guardianDead?'상자 열기':'상자 잠김',kind:'chest'};
 if(zone==='cave'&&Math.hypot(p.x-CAVE.exit.x,p.y-CAVE.exit.y)<85)return {label:'나가기',kind:'exitCave'};return null
}
function updateActionButton(){const a=getAction();actionBtn.style.display=a?'block':'none';if(a)actionBtn.textContent=a.label}
function useAction(){const a=getAction();if(!a)return;if(a.kind==='enterCave')enter('cave');else if(a.kind==='tomb')hiddenOffer.style.display='flex';else if(a.kind==='exitCave'){if(combatTimer>0){toastMsg('전투 중에는 마을로 갈 수 없다');return}enter('town')}else if(a.kind==='chest'){if(!guardianDead){toastMsg('거대 동굴슬라임을 먼저 잡아야 한다');return}chestOpened=true;p.g+=250;sfx('chestOpen');sfx('dungeonClear');toastMsg('보물상자 +250골드! 마을로 귀환');setTimeout(()=>enter('town'),600)}}

function hitSoundFor(m){
 if(['slime','blue','caveSlime'].includes(m.type))return 'slimeHit';
 if(['slimeKing','giantCaveSlime'].includes(m.type))return 'bossHit';
 if(['boar','wolf','redwolf','tiger','panther'].includes(m.type))return 'beastHit';
 return 'humanoidHit'
}
function deathSoundFor(m){
 if(['slime','blue','caveSlime'].includes(m.type))return 'slimeDeath';
 if(['slimeKing','giantCaveSlime','ogre'].includes(m.type))return 'bossDeath';
 if(['boar','wolf','redwolf'].includes(m.type))return 'beastDeath';
 return 'humanoidDeath'
}
function attackNow(){
 if(!run||ac>0)return;const w=WEAPONS[p.weapon];ac=w?w.cd:.35;combatTimer=4;p.animState='attack';p.animTick=0;p.animFrame=0;sfx('weaponSwing');
 const ax=p.x+p.dir*30;fx.push({x:ax,y:p.y,t:.18,d:p.dir});
 for(const m of mons){if(m.dead)continue;if(Math.hypot(m.x-ax,m.y-p.y)<62+m.r){m.hp-=currentAtk();m.hit=.12;m.x+=p.dir*13;sfx(p.weapon==='철 도끼'||p.weapon==='철 망치'?'axeHit':p.weapon==='철 쌍검'||p.weapon==='낡은 쌍절곤'?'dualHit':'swordHit');if(m.hp<=0)kill(m)}}
}
function kill(m){
 m.dead=true;m.animState='dead';m.animTick=0;m.animFrame=0;m.deathAge=0;sfx(deathSoundFor(m));p.xp+=m.xp;p.g+=m.g;
 let item=['slime','blue','slimeKing','caveSlime','giantCaveSlime'].includes(m.type)?'슬라임 젤리':m.type==='boar'?'멧돼지 고기':['wolf','redwolf','tiger','panther'].includes(m.type)?'늑대 가죽':m.type==='orc'?'오크 이빨':'균열 조각';if(m.type==='hiddenEnemy')item=null;if(item)drops.push({x:m.x,y:m.y,item,t:12});
 if(zone==='f1'&&q===1&&m.type==='slime'){window.sk=(window.sk||0)+1;if(window.sk>=5){q=2;sfx('questComplete');toastMsg('완료! 촌장에게 돌아가 보상받기')}}else if(zone==='f1'&&q===3&&m.type==='slimeKing'){q=4;sfx('questComplete');toastMsg('완료! 촌장에게 돌아가 보상받기')}
 if(m.type==='giantCaveSlime'){guardianDead=true;sfx('chestUnlock');toastMsg('거대 동굴슬라임 처치! 보물상자가 열렸다')}
 if(m.type==='hiddenEnemy'){hq=2;ownedWeapons['낡은 쌍절곤']=true;sfx('questComplete');toastMsg('히든 퀘스트 완료! 낡은 쌍절곤 획득')}
 while(p.xp>=p.nxp){p.xp-=p.nxp;p.lv++;p.nxp=p.lv*100;p.baseHp+=15;p.hp=maxHp();p.bonusAtk+=2;sfx('levelUp');toastMsg(`레벨 ${p.lv}! 다음 필요 EXP ${p.nxp}`)}
 const z=m.z,base=m.baseType;if(z!=='cave'&&base!=='hiddenEnemy')setTimeout(()=>{if(!run||zone!==z)return;const spec=F[z]?.m.find(v=>v[9]===base);if(spec)spawn(spec,480+Math.random()*1200,120+Math.random()*960,z)},2600);hud()
}
function fireArrow(m){const a=Math.atan2(p.y-m.y,p.x-m.x),speed=p.spd*.6,homing=Math.random()<.30;sfx(homing?'homingArrow':'arrowShoot');arrows.push({x:m.x,y:m.y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,r:6,life:8,homing:homing?5:0,damage:m.a,flyTick:0})}
function updateArrows(dt){for(let i=arrows.length-1;i>=0;i--){const a=arrows[i];a.life-=dt;a.flyTick+=dt;if(a.flyTick>.65){a.flyTick=0;sfx('arrowFly')}if(a.homing>0){a.homing-=dt;const speed=p.spd*.6,ang=Math.atan2(p.y-a.y,p.x-a.x),tx=Math.cos(ang)*speed,ty=Math.sin(ang)*speed;a.vx+=(tx-a.vx)*Math.min(1,dt*2.6);a.vy+=(ty-a.vy)*Math.min(1,dt*2.6)}a.x+=a.vx*dt;a.y+=a.vy*dt;if(Math.hypot(a.x-p.x,a.y-p.y)<a.r+p.r){sfx('arrowHit');damage(a.damage);arrows.splice(i,1);continue}if(a.life<=0||a.x<0||a.y<0||a.x>WORLD.w||a.y>WORLD.h)arrows.splice(i,1)}}
function damage(v){if(p.inv>0)return;p.hp-=v;p.inv=.65;flash=.15;combatTimer=4;sfx('playerHit');if(p.hp<=0){p.hp=0;run=false;setAggro(false);sfx('playerDeath');const cost=Math.min(p.g,Math.ceil(p.g*.2));p.g-=cost;deadCost.textContent=`치료비: ${cost}골드`;dead.style.display='flex'}hud()}

function portals(){if(pc>0||zone==='cave')return;if(zone==='town'){for(const a of P)if(Math.hypot(p.x-a[1],p.y-a[2])<42){enter(a[0]);return}}else if(Math.hypot(p.x-135,p.y-600)<42){if(combatTimer>0){if(portalMsgCd<=0){toastMsg('전투 중에는 마을 포탈을 사용할 수 없다');portalMsgCd=1}return}enter('town')}}
function stepAnim(e,dt,moving=false){e.animTick=(e.animTick||0)+dt*30;if(e.animState==='attack'){e.animFrame=Math.min(33,Math.floor(e.animTick));if(e.animFrame>=33){e.animState=moving?'walk':'idle';e.animTick=0;e.animFrame=0}}else if(e.animState==='dead'){e.animFrame=Math.min(33,Math.floor(e.animTick))}else{e.animState=moving?'walk':'idle';e.animFrame=Math.floor(e.animTick)%34}}
function aggroSoundFor(m){if(['slime','blue','caveSlime'].includes(m.type))return 'slimeAggro';if(['slimeKing','giantCaveSlime','ogre'].includes(m.type))return 'bossAggro';if(['boar','wolf','redwolf'].includes(m.type))return 'beastAggro';return 'humanoidAggro'}
function update(dt){
 ac-=dt;pc-=dt;flash-=dt;combatTimer=Math.max(0,combatTimer-dt);portalMsgCd-=dt;p.inv-=dt;
 let mx=j.x+(keys.a?-1:0)+(keys.d?1:0),my=j.y+(keys.w?-1:0)+(keys.s?1:0),l=Math.hypot(mx,my);if(l>1){mx/=l;my/=l}if(Math.abs(mx)>.05)p.dir=mx>0?1:-1;const moving=Math.hypot(mx,my)>.05;
 p.x=Math.max(55,Math.min(WORLD.w-55,p.x+mx*p.spd*dt));p.y=Math.max(55,Math.min(WORLD.h-55,p.y+my*p.spd*dt));stepAnim(p,dt,moving);
 if(zone==='town'){townHeal+=dt;if(townHeal>=1){townHeal-=1;p.hp=Math.min(maxHp(),p.hp+10000);hud()}}else townHeal=0;
 let anyAggro=false,bossAggro=false;if(zone!=='town')for(let i=mons.length-1;i>=0;i--){const m=mons[i];if(m.dead){m.deathAge+=dt;stepAnim(m,dt,false);if(m.deathAge>3)mons.splice(i,1);continue}m.hit-=dt;const d=Math.hypot(p.x-m.x,p.y-m.y);let mm=false;if(d<300){anyAggro=true;combatTimer=Math.max(combatTimer,.4);if(['slimeKing','giantCaveSlime','ogre','hiddenEnemy'].includes(m.type))bossAggro=true}
  if(m.type==='archer'){m.shootCd-=dt;if(d<500&&m.shootCd<=0){m.animState='attack';m.animTick=0;fireArrow(m);m.shootCd=2.2+Math.random()}if(d<180){const a=Math.atan2(m.y-p.y,m.x-p.x);m.x+=Math.cos(a)*m.spd*dt;m.y+=Math.sin(a)*m.spd*dt;mm=true}else if(d>340&&d<520){const a=Math.atan2(p.y-m.y,p.x-m.x);m.x+=Math.cos(a)*m.spd*.45*dt;m.y+=Math.sin(a)*m.spd*.45*dt;mm=true}}
  else{if(d<270){const a=Math.atan2(p.y-m.y,p.x-m.x);m.dir=Math.cos(a)>=0?1:-1;m.x+=Math.cos(a)*m.spd*dt;m.y+=Math.sin(a)*m.spd*dt;mm=true}if(d<p.r+m.r+2){m.animState='attack';m.animTick=0;damage(m.a)}}stepAnim(m,dt,mm)}
 setAggro(anyAggro,bossAggro);updateArrows(dt);for(let i=drops.length-1;i>=0;i--){const d=drops[i];d.t-=dt;if(Math.hypot(d.x-p.x,d.y-p.y)<35){inv[d.item]=(inv[d.item]||0)+1;sfx('itemPickup');drops.splice(i,1)}else if(d.t<=0)drops.splice(i,1)}for(let i=fx.length-1;i>=0;i--){fx[i].t-=dt;if(fx[i].t<=0)fx.splice(i,1)}portals();updateActionButton();cam.x=Math.max(0,Math.min(WORLD.w-W,p.x-W/2));cam.y=Math.max(0,Math.min(WORLD.h-H,p.y-H/2))

 ctx.save();ctx.translate(m.x,m.y+walk);ctx.scale(m.dir||1,1);ctx.rotate(dead*1.4);ctx.globalAlpha=1-dead*.82;shadow(0,0,18*sc);
 if(['slime','blue','slimeKing','caveSlime','giantCaveSlime'].includes(m.type)){ctx.scale(1+att*.16,1-att*.14);ctx.fillStyle=pal[0];ctx.beginPath();ctx.ellipse(0,0,22*sc,18*sc,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=pal[1];ctx.beginPath();ctx.ellipse(-5*sc,-7*sc,11*sc,6*sc,0,0,Math.PI*2);ctx.fill();pixelRect(-9*sc,-3*sc,4*sc,5*sc,pal[2]);pixelRect(6*sc,-3*sc,4*sc,5*sc,pal[2]);if(m.type==='slimeKing'){pixelRect(-15*sc,-25*sc,30*sc,7*sc,'#e7c84b');pixelRect(-12*sc,-31*sc,6*sc,8*sc,'#e7c84b');pixelRect(6*sc,-31*sc,6*sc,8*sc,'#e7c84b')}}

 else{pixelRect(-10*sc,0,8*sc,19*sc,pal[2]);pixelRect(3*sc,0,8*sc,19*sc,pal[2]);pixelRect(-15*sc,-26*sc,30*sc,29*sc,pal[0]);ctx.fillStyle=pal[1];ctx.beginPath();ctx.arc(0,-37*sc,13*sc,0,Math.PI*2);ctx.fill();pixelRect(-7*sc,-39*sc,4*sc,4*sc,'#171717');pixelRect(4*sc,-39*sc,4*sc,4*sc,'#171717');if(m.type==='skeleton'){pixelRect(-11*sc,-28*sc,22*sc,4*sc,'#eee9d5');pixelRect(-3*sc,-26*sc,6*sc,24*sc,'#eee9d5')}if(m.type==='knight')pixelRect(-14*sc,-47*sc,28*sc,9*sc,'#252936');if(m.type==='demon'){ctx.fillStyle='#d89be0';ctx.beginPath();ctx.moveTo(-10*sc,-47*sc);ctx.lineTo(-19*sc,-59*sc);ctx.lineTo(-3*sc,-49*sc);ctx.fill();ctx.beginPath();ctx.moveTo(10*sc,-47*sc);ctx.lineTo(19*sc,-59*sc);ctx.lineTo(3*sc,-49*sc);ctx.fill()}if(m.type==='archer'){ctx.strokeStyle='#d9ae64';ctx.lineWidth=3*sc;ctx.beginPath();ctx.arc(18*sc,-18*sc,12*sc,-1.2,1.2);ctx.stroke()}else{ctx.save();ctx.translate(15*sc,-9*sc);ctx.rotate(-.6+att*1.15);pixelRect(0,-2*sc,25*sc,4*sc,'#c9ced1');ctx.restore()}}
 ctx.restore()
}
