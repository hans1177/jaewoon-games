<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070b18">
<title>잃어버린 별의 메아리</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060914;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}.hud{position:fixed;z-index:5;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;pointer-events:none}.top{display:flex;justify-content:space-between;gap:8px}.pill{min-width:0;padding:7px 10px;border:1px solid #ffffff22;border-radius:14px;background:#071127cc;backdrop-filter:blur(8px);box-shadow:0 6px 20px #0007;font-size:12px;font-weight:800}.pill b{color:#8fdcff}.bars{display:grid;grid-template-columns:1fr;gap:6px;margin-top:8px}.bar{height:12px;border-radius:99px;background:#ffffff18;border:1px solid #ffffff1f;overflow:hidden}.bar>i{display:block;height:100%;width:100%;transition:width .15s}.hp>i{background:linear-gradient(90deg,#ff4d6d,#ff8d6b)}.xp>i{background:linear-gradient(90deg,#5be7ff,#7c7cff)}.label{display:flex;justify-content:space-between;font-size:10px;font-weight:900;color:#c7d8ff;margin:0 2px 2px}.joystick{position:fixed;z-index:7;left:18px;bottom:calc(env(safe-area-inset-bottom) + 24px);width:116px;height:116px;border-radius:50%;border:2px solid #8fdcff55;background:#10233d88;box-shadow:inset 0 0 28px #7adfff18;touch-action:none}.stick{position:absolute;left:31px;top:31px;width:54px;height:54px;border-radius:50%;background:#d8f6ffcc;border:3px solid #7adfff;box-shadow:0 0 22px #52d9ff99;transform:translate(0,0)}.actions{position:fixed;z-index:7;right:18px;bottom:calc(env(safe-area-inset-bottom) + 25px);display:flex;align-items:flex-end;gap:10px}.btn{border:1px solid #ffffff2b;color:#fff;font-weight:950;background:#142647dd;box-shadow:0 8px 22px #0008;touch-action:none}.dash{width:86px;height:86px;border-radius:50%;font-size:15px}.pause{position:fixed;z-index:8;right:12px;top:calc(env(safe-area-inset-top) + 63px);width:42px;height:42px;border-radius:13px;font-size:18px}.overlay{position:fixed;z-index:20;inset:0;display:none;align-items:center;justify-content:center;padding:22px;background:#030611d9;backdrop-filter:blur(7px)}.overlay.show{display:flex}.panel{width:min(100%,430px);border:1px solid #6686c044;border-radius:24px;background:linear-gradient(180deg,#111d38,#091127);box-shadow:0 20px 70px #000a;padding:20px}.panel h1,.panel h2{margin:0 0 8px}.panel p{margin:0 0 16px;color:#b9c8e6;font-size:13px;line-height:1.5}.choices{display:grid;gap:9px}.choice,.wide{width:100%;min-height:58px;border:1px solid #7fa7e544;border-radius:16px;background:#17284a;color:#fff;text-align:left;padding:11px 13px;font-weight:850}.choice small{display:block;color:#a8badb;margin-top:4px;font-weight:650}.wide{text-align:center;background:#2763b9;font-size:15px}.titlemark{font-size:11px;letter-spacing:.12em;color:#7ee7ff;font-weight:950}.tip{position:fixed;z-index:4;left:50%;bottom:8px;transform:translateX(-50%);font-size:10px;color:#91a4c8;pointer-events:none;white-space:nowrap}.boss{position:fixed;z-index:6;left:50%;top:calc(env(safe-area-inset-top) + 108px);transform:translateX(-50%);width:min(82vw,430px);display:none}.boss.show{display:block}.boss .label{color:#ffd6df}.boss .bar>i{background:linear-gradient(90deg,#ff4d8d,#ffb34d)}@media(max-width:360px){.joystick{width:102px;height:102px}.stick{left:27px;top:27px;width:48px;height:48px}.dash{width:76px;height:76px}.pill{font-size:11px;padding:6px 8px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">
  <div class="top">
    <div class="pill">웨이브 <b id="wave">1</b> · 레벨 <b id="level">1</b></div>
    <div class="pill">처치 <b id="kills">0</b> · 시간 <b id="time">0:00</b></div>
  </div>
  <div class="bars">
    <div><div class="label"><span>HP</span><span id="hpText">100 / 100</span></div><div class="bar hp"><i id="hpBar"></i></div></div>
    <div><div class="label"><span>EXP</span><span id="xpText">0 / 8</span></div><div class="bar xp"><i id="xpBar"></i></div></div>
  </div>
</div>
<button id="pauseBtn" class="btn pause" aria-label="일시정지">Ⅱ</button>
<div id="bossHud" class="boss"><div class="label"><span>별 포식자</span><span id="bossHpText"></span></div><div class="bar"><i id="bossHpBar"></i></div></div>
<div id="joystick" class="joystick" aria-label="이동 조이스틱"><div id="stick" class="stick"></div></div>
<div class="actions"><button id="dashBtn" class="btn dash">대시<br><small id="dashState">READY</small></button></div>
<div class="tip">왼쪽 조이스틱 이동 · 자동 공격 · 오른쪽 대시</div>

<div id="startOverlay" class="overlay show"><div class="panel"><div class="titlemark">ACTION SURVIVAL ROGUELITE</div><h1>잃어버린 별의 메아리</h1><p>몰려오는 별의 잔해를 피하며 자동 공격으로 처치하고, 경험치를 모아 매 레벨마다 빌드를 선택해 살아남아.</p><button id="startBtn" class="wide">게임 시작</button></div></div>
<div id="levelOverlay" class="overlay"><div class="panel"><div class="titlemark">LEVEL UP</div><h2>강화 하나 선택</h2><p>선택한 강화는 이번 런 동안 계속 적용돼.</p><div id="choices" class="choices"></div></div></div>
<div id="pauseOverlay" class="overlay"><div class="panel"><h2>일시정지</h2><p>현재 런은 그대로 유지돼.</p><button id="resumeBtn" class="wide">계속하기</button></div></div>
<div id="gameOverOverlay" class="overlay"><div class="panel"><div class="titlemark">RUN OVER</div><h2>별빛이 꺼졌다</h2><p id="result"></p><button id="restartBtn" class="wide">다시 시작</button></div></div>

<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const ui={wave:document.getElementById('wave'),level:document.getElementById('level'),kills:document.getElementById('kills'),time:document.getElementById('time'),hpText:document.getElementById('hpText'),hpBar:document.getElementById('hpBar'),xpText:document.getElementById('xpText'),xpBar:document.getElementById('xpBar'),bossHud:document.getElementById('bossHud'),bossHpText:document.getElementById('bossHpText'),bossHpBar:document.getElementById('bossHpBar'),dashState:document.getElementById('dashState')};
let W=innerWidth,H=innerHeight,DPR=1,last=performance.now(),running=false,paused=true,elapsed=0,spawnTimer=0,waveTimer=0,wave=1,kills=0,boss=null,audio=null;
const keys=new Set(),enemies=[],bullets=[],gems=[],particles=[],stars=[];
const joy={id:null,x:0,y:0,dx:0,dy:0};
const player={x:0,y:0,r:14,hp:100,maxHp:100,speed:210,level:1,xp:0,nextXp:8,damage:16,fireRate:.48,fireTimer:0,bulletSpeed:520,multi:1,pickup:76,armor:0,dashCd:0,dashMax:3,dashTime:0,inv:0};
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);if(!stars.length)for(let i=0;i<90;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.7+.4,a:Math.random()*.7+.2});}
addEventListener('resize',resize);resize();
function tone(freq=220,dur=.05,type='sine',vol=.035){try{audio ||= new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+dur);o.stop(audio.currentTime+dur)}catch{}}
function reset(){elapsed=0;spawnTimer=0;waveTimer=0;wave=1;kills=0;boss=null;enemies.length=bullets.length=gems.length=particles.length=0;Object.assign(player,{x:W/2,y:H/2,r:14,hp:100,maxHp:100,speed:210,level:1,xp:0,nextXp:8,damage:16,fireRate:.48,fireTimer:0,bulletSpeed:520,multi:1,pickup:76,armor:0,dashCd:0,dashMax:3,dashTime:0,inv:0});paused=false;running=true;document.getElementById('gameOverOverlay').classList.remove('show');document.getElementById('levelOverlay').classList.remove('show');document.getElementById('pauseOverlay').classList.remove('show');updateUi();}
function rnd(a,b){return a+Math.random()*(b-a)}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function dist2(a,b){const dx=a.x-b.x,dy=a.y-b.y;return dx*dx+dy*dy}
function spawnEnemy(type){const side=Math.floor(Math.random()*4),m=36;let x,y;if(side===0){x=rnd(0,W);y=-m}else if(side===1){x=W+m;y=rnd(0,H)}else if(side===2){x=rnd(0,W);y=H+m}else{x=-m;y=rnd(0,H)};const scale=1+(wave-1)*.11;let e={x,y,r:12,hp:30*scale,maxHp:30*scale,speed:70+wave*2,damage:10,color:'#ff5c7c',xp:1,boss:false,hit:0};if(type==='swift')Object.assign(e,{r:9,hp:19*scale,maxHp:19*scale,speed:115+wave*3,damage:8,color:'#ffb14a',xp:1});if(type==='brute')Object.assign(e,{r:19,hp:82*scale,maxHp:82*scale,speed:48+wave,damage:18,color:'#b678ff',xp:3});enemies.push(e)}
function spawnBoss(){if(boss)return;const hp=750*(1+(wave-1)*.12);boss={x:W/2,y:-60,r:38,hp,maxHp:hp,speed:42+wave,damage:28,color:'#ff4fa2',xp:18,boss:true,hit:0};enemies.push(boss);ui.bossHud.classList.add('show');tone(90,.4,'sawtooth',.05)}
function fire(){if(!enemies.length)return;let target=null,best=Infinity;for(const e of enemies){const d=dist2(player,e);if(d<best){best=d;target=e}}if(!target)return;const a=Math.atan2(target.y-player.y,target.x-player.x);const count=player.multi;for(let i=0;i<count;i++){const spread=(i-(count-1)/2)*.12;bullets.push({x:player.x,y:player.y,vx:Math.cos(a+spread)*player.bulletSpeed,vy:Math.sin(a+spread)*player.bulletSpeed,r:4,damage:player.damage,life:1.25})}tone(520,.035,'square',.018)}
function burst(x,y,color,n=7){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=rnd(35,150);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.25,.55),max:.55,r:rnd(1.5,4),color})}}
function hurt(amount){if(player.inv>0)return;const dmg=Math.max(1,Math.round(amount*(1-player.armor)));player.hp-=dmg;player.inv=.55;burst(player.x,player.y,'#ffffff',10);tone(120,.12,'sawtooth',.04);if(player.hp<=0)endGame()}
function endGame(){running=false;paused=true;ui.bossHud.classList.remove('show');document.getElementById('result').textContent=`${Math.floor(elapsed)}초 생존 · 웨이브 ${wave} · 레벨 ${player.level} · ${kills}마리 처치`;document.getElementById('gameOverOverlay').classList.add('show')}
const upgrades=[
 {n:'공격력 강화',d:'탄환 피해 +25%',a:()=>player.damage*=1.25},
 {n:'연사 강화',d:'공격 속도 +18%',a:()=>player.fireRate=Math.max(.16,player.fireRate*.82)},
 {n:'다중 탄환',d:'동시에 발사하는 탄환 +1',a:()=>player.multi=Math.min(5,player.multi+1)},
 {n:'최대 체력',d:'최대 HP +25, 즉시 25 회복',a:()=>{player.maxHp+=25;player.hp=Math.min(player.maxHp,player.hp+25)}},
 {n:'이동 가속',d:'이동 속도 +12%',a:()=>player.speed*=1.12},
 {n:'회수 범위',d:'경험치 흡수 범위 +35%',a:()=>player.pickup*=1.35},
 {n:'장갑',d:'받는 피해 10% 감소',a:()=>player.armor=Math.min(.5,player.armor+.1)},
 {n:'대시 충전',d:'대시 재사용 대기시간 18% 감소',a:()=>player.dashMax=Math.max(1.2,player.dashMax*.82)}
];
function levelUp(){player.level++;player.xp-=player.nextXp;player.nextXp=Math.ceil(player.nextXp*1.38+2);paused=true;tone(760,.18,'sine',.05);const pool=[...upgrades].sort(()=>Math.random()-.5).slice(0,3),wrap=document.getElementById('choices');wrap.innerHTML='';for(const u of pool){const b=document.createElement('button');b.className='choice';b.innerHTML=`${u.n}<small>${u.d}</small>`;b.onclick=()=>{u.a();document.getElementById('levelOverlay').classList.remove('show');paused=false;updateUi()};wrap.appendChild(b)}document.getElementById('levelOverlay').classList.add('show')}
function gainXp(v){player.xp+=v;if(player.xp>=player.nextXp&&!paused)levelUp()}
function dash(){if(paused||player.dashCd>0)return;let dx=joy.dx,dy=joy.dy;if(!dx&&!dy){dx=(keys.has('d')||keys.has('ArrowRight')?1:0)-(keys.has('a')||keys.has('ArrowLeft')?1:0);dy=(keys.has('s')||keys.has('ArrowDown')?1:0)-(keys.has('w')||keys.has('ArrowUp')?1:0)}const len=Math.hypot(dx,dy)||1;if(Math.abs(dx)+Math.abs(dy)<.1){dx=1;dy=0}else{dx/=len;dy/=len}player.x=clamp(player.x+dx*105,player.r,W-player.r);player.y=clamp(player.y+dy*105,player.r,H-player.r);player.dashCd=player.dashMax;player.inv=.45;burst(player.x,player.y,'#66e7ff',15);tone(260,.09,'triangle',.045)}
function update(dt){if(paused||!running)return;elapsed+=dt;waveTimer+=dt;player.fireTimer-=dt;player.inv=Math.max(0,player.inv-dt);player.dashCd=Math.max(0,player.dashCd-dt);
 if(waveTimer>=28){waveTimer-=28;wave++;tone(420,.16,'triangle',.04);if(wave%4===0)spawnBoss()}
 spawnTimer-=dt;if(spawnTimer<=0){spawnTimer=Math.max(.12,.62-wave*.035);const r=Math.random();spawnEnemy(r<.16?'brute':r<.38?'swift':'normal');if(wave>=4&&Math.random()<.16)spawnEnemy('normal')}
 let mx=joy.dx,my=joy.dy;mx+=(keys.has('d')||keys.has('ArrowRight')?1:0)-(keys.has('a')||keys.has('ArrowLeft')?1:0);my+=(keys.has('s')||keys.has('ArrowDown')?1:0)-(keys.has('w')||keys.has('ArrowUp')?1:0);const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml}player.x=clamp(player.x+mx*player.speed*dt,player.r,W-player.r);player.y=clamp(player.y+my*player.speed*dt,player.r+94,H-player.r-5);
 if(player.fireTimer<=0){player.fireTimer=player.fireRate;fire()}
 for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;let hit=false;for(let j=enemies.length-1;j>=0;j--){const e=enemies[j],rr=b.r+e.r;if((b.x-e.x)**2+(b.y-e.y)**2<=rr*rr){e.hp-=b.damage;e.hit=.08;burst(b.x,b.y,'#92f1ff',3);hit=true;if(e.hp<=0){kills++;const count=e.boss?14:e.xp;for(let k=0;k<count;k++)gems.push({x:e.x+rnd(-10,10),y:e.y+rnd(-10,10),r:4,v:e.boss?2:1});burst(e.x,e.y,e.color,e.boss?28:9);if(e===boss){boss=null;ui.bossHud.classList.remove('show');tone(880,.3,'triangle',.06)}enemies.splice(j,1)}break}}if(hit||b.life<=0||b.x<-20||b.x>W+20||b.y<-20||b.y>H+20)bullets.splice(i,1)}
 for(const e of enemies){e.hit=Math.max(0,e.hit-dt);const a=Math.atan2(player.y-e.y,player.x-e.x);e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt;const rr=e.r+player.r;if((e.x-player.x)**2+(e.y-player.y)**2<rr*rr)hurt(e.damage)}
 for(let i=gems.length-1;i>=0;i--){const g=gems[i];const d=Math.hypot(player.x-g.x,player.y-g.y);if(d<player.pickup){const sp=260+(player.pickup-d)*5;g.x+=(player.x-g.x)/Math.max(1,d)*sp*dt;g.y+=(player.y-g.y)/Math.max(1,d)*sp*dt}if(d<player.r+8){gainXp(g.v);gems.splice(i,1)}}
 for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;p.life-=dt;if(p.life<=0)particles.splice(i,1)}updateUi()}
function updateUi(){ui.wave.textContent=wave;ui.level.textContent=player.level;ui.kills.textContent=kills;ui.time.textContent=`${Math.floor(elapsed/60)}:${String(Math.floor(elapsed%60)).padStart(2,'0')}`;ui.hpText.textContent=`${Math.max(0,Math.ceil(player.hp))} / ${Math.ceil(player.maxHp)}`;ui.hpBar.style.width=(clamp(player.hp/player.maxHp,0,1)*100)+'%';ui.xpText.textContent=`${Math.floor(player.xp)} / ${player.nextXp}`;ui.xpBar.style.width=(clamp(player.xp/player.nextXp,0,1)*100)+'%';ui.dashState.textContent=player.dashCd<=0?'READY':player.dashCd.toFixed(1);if(boss){ui.bossHpText.textContent=`${Math.ceil(boss.hp)} / ${Math.ceil(boss.maxHp)}`;ui.bossHpBar.style.width=(clamp(boss.hp/boss.maxHp,0,1)*100)+'%'}}
function draw(){ctx.clearRect(0,0,W,H);const grd=ctx.createRadialGradient(player.x,player.y,0,player.x,player.y,Math.max(W,H)*.8);grd.addColorStop(0,'#111f42');grd.addColorStop(.55,'#090f23');grd.addColorStop(1,'#040711');ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);for(const s of stars){ctx.globalAlpha=s.a;ctx.fillStyle='#d8efff';ctx.fillRect(s.x,s.y,s.s,s.s)}ctx.globalAlpha=1;
 ctx.strokeStyle='#4a6da018';ctx.lineWidth=1;const grid=42,ox=(-player.x*.08)%grid,oy=(-player.y*.08)%grid;for(let x=ox;x<W;x+=grid){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=oy;y<H;y+=grid){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 for(const g of gems){ctx.save();ctx.translate(g.x,g.y);ctx.rotate(performance.now()*.002);ctx.fillStyle='#75edff';ctx.shadowColor='#62e6ff';ctx.shadowBlur=12;ctx.beginPath();ctx.moveTo(0,-6);ctx.lineTo(5,0);ctx.lineTo(0,6);ctx.lineTo(-5,0);ctx.closePath();ctx.fill();ctx.restore()}
 for(const b of bullets){ctx.fillStyle='#c9f7ff';ctx.shadowColor='#7feeff';ctx.shadowBlur=11;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill()}ctx.shadowBlur=0;
 for(const e of enemies){ctx.save();ctx.translate(e.x,e.y);ctx.fillStyle=e.hit?'#fff':e.color;ctx.shadowColor=e.color;ctx.shadowBlur=e.boss?24:12;ctx.beginPath();ctx.arc(0,0,e.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#ffffff55';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,e.r*.55,0,Math.PI*2);ctx.stroke();if(e.boss){ctx.strokeStyle='#ffd0df';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,e.r+8,performance.now()*.002,performance.now()*.002+4.4);ctx.stroke()}ctx.restore()}
 for(const p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
 ctx.save();ctx.translate(player.x,player.y);if(player.inv>0&&Math.floor(player.inv*20)%2===0)ctx.globalAlpha=.45;ctx.shadowColor='#71e5ff';ctx.shadowBlur=24;ctx.fillStyle='#dffaff';ctx.beginPath();ctx.arc(0,0,player.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#5bdcff';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,player.r+5,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#5bdcff';ctx.beginPath();ctx.moveTo(18,0);ctx.lineTo(7,-6);ctx.lineTo(7,6);ctx.closePath();ctx.fill();ctx.restore()}
function loop(now){const dt=Math.min(.033,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function joyPoint(e){const r=document.getElementById('joystick').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,m=Math.hypot(dx,dy),lim=r.width*.31,k=Math.min(1,lim/Math.max(1,m));joy.dx=(dx*k)/lim;joy.dy=(dy*k)/lim;document.getElementById('stick').style.transform=`translate(${dx*k}px,${dy*k}px)`}
const joyEl=document.getElementById('joystick');joyEl.addEventListener('pointerdown',e=>{joy.id=e.pointerId;joyEl.setPointerCapture(e.pointerId);joyPoint(e)});joyEl.addEventListener('pointermove',e=>{if(e.pointerId===joy.id)joyPoint(e)});function joyEnd(e){if(e.pointerId!==joy.id)return;joy.id=null;joy.dx=joy.dy=0;document.getElementById('stick').style.transform='translate(0,0)'}joyEl.addEventListener('pointerup',joyEnd);joyEl.addEventListener('pointercancel',joyEnd);
addEventListener('keydown',e=>{keys.add(e.key);if(e.code==='Space'){e.preventDefault();dash()}});addEventListener('keyup',e=>keys.delete(e.key));document.getElementById('dashBtn').addEventListener('pointerdown',e=>{e.preventDefault();dash()});
function setPause(v){if(!running)return;paused=v;document.getElementById('pauseOverlay').classList.toggle('show',v)}document.getElementById('pauseBtn').onclick=()=>setPause(true);document.getElementById('resumeBtn').onclick=()=>setPause(false);document.getElementById('startBtn').onclick=()=>{document.getElementById('startOverlay').classList.remove('show');tone(330,.08,'triangle',.03);reset()};document.getElementById('restartBtn').onclick=reset;document.addEventListener('visibilitychange',()=>{if(document.hidden&&running&&!paused)setPause(true)});
})();
</script>
</body>
