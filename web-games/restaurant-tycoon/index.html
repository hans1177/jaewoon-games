<div id="intro"><div class="card"><div style="font-size:56px">🍽️</div><h1>식당 타이쿤</h1><p>창고에서 재료를 가져와<br>해동하고 썰고 불판에서 구워!<br>접시에 담고 주문을 눌러 서빙해!<br>돈을 벌어 테이블과 요리사를 늘려봐.<br><strong>플레이 2분 뒤 메뉴 2종 추가!</strong></p><button id="start">영업 시작!</button><div class="tiny">진행 상황은 이 기기에 자동 저장돼.</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
(()=>{
'use strict';
// 메인: 메뉴와 저장
const dishes=[{name:'볶음밥',icon:'🍚',price:100,time:3},{name:'햄버거',icon:'🍔',price:150,time:4},{name:'스테이크',icon:'🥩',price:300,time:6},{name:'피자',icon:'🍕',price:400,time:7},{name:'초밥',icon:'🍣',price:500,time:8}];

// 요리: 원래 가격과 조리시간 보존, 재료·손질 단계는 직접 조작
const recipes=[
 {items:[['밥','🍚',0,0],['냉동고기','🥩',1,1],['냉동채소','🥬',1,1]],heat:'밥과 함께 볶기',motion:'젓기',moves:3,finish:'볶음밥 접시에 담기'},
 {items:[['빵','🍞',0,0],['냉동 패티','🥩',1,0],['채소','🥬',0,1]],heat:'패티 굽기',motion:'뒤집기',moves:2,finish:'햄버거 조립하기'},
 {items:[['냉동 스테이크','🥩',1,0],['허브','🌿',0,1]],heat:'스테이크 굽기',motion:'뒤집기',moves:2,finish:'스테이크 접시에 담기'},
 {items:[['도우','🫓',0,0],['치즈','🧀',0,0],['냉동 토마토','🍅',1,1]],heat:'피자 오븐에 굽기',motion:'',moves:0,finish:'피자 접시에 담기'},
 {items:[['밥','🍚',0,0],['냉동 생선','🐟',1,1],['김','🌱',0,0]],heat:'',motion:'',moves:0,finish:'밥과 생선으로 초밥 빚기'}
];
const key='jaewoon-restaurant-tycoon-v1';
let data={cash:100,tables:2,cooks:0,served:0,elapsed:0,started:false};
try{let old=JSON.parse(localStorage.getItem(key)||'null');if(old&&typeof old==='object')for(const k of Object.keys(data))if(typeof old[k]===typeof data[k])data[k]=old[k]}catch(e){}
data.tables=Math.min(8,Math.max(2,data.tables));data.cooks=Math.min(3,Math.max(0,data.cooks));data.elapsed=Math.max(0,data.elapsed);
let guests=[],spawnClock=2,autoClock=0,saveClock=0,idCounter=0,last=performance.now(),noticeClock=0,selectedId=null;
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem(key,JSON.stringify(data))}catch(e){}}
function say(t){$('notice').textContent=t;noticeClock=5}
function count(){return data.elapsed>=120?5:3}
function priceTable(){return 300+(data.tables-2)*240}
function priceCook(){return 500+data.cooks*450}
function hud(){
$('cash').textContent=data.cash.toLocaleString()+'원';$('served').textContent=data.served+'명';
$('unlock').textContent=data.elapsed>=120?'5종 해금!':String(Math.floor((120-data.elapsed)/60)).padStart(2,'0')+':'+String(Math.ceil(120-data.elapsed)%60).padStart(2,'0');
$('tablePrice').textContent=data.tables>=8?'최대 8개':priceTable().toLocaleString()+'원';$('cookPrice').textContent=data.cooks>=3?'최대 3명':priceCook().toLocaleString()+'원';
$('tableBtn').disabled=data.tables>=8||data.cash<priceTable();$('cookBtn').disabled=data.cooks>=3||data.cash<priceCook();$('menuCount').textContent=count()+'종 영업 중';
$('status').textContent='영업 '+Math.floor(data.elapsed/60)+'분 '+Math.floor(data.elapsed%60)+'초 · 좌석 '+guests.length+'/'+data.tables+' · 요리사 '+data.cooks+'명';
}
// 메인: 주문 한 건에 대해 창고·해동·칼질·가열·플레이팅 진행
function active(){return guests.find(g=>g.id===selectedId&&g.phase==='prep')}
function advance(g){
 const r=recipes[g.dish],items=r.items;
 if(g.step==='store'&&items.every((x,i)=>g.got[i]))g.step=items.some(x=>x[2])?'thaw':items.some(x=>x[3])?'cut':r.heat?'heat':'plate';
 if(g.step==='thaw'&&g.busy<0&&items.every((x,i)=>!x[2]||g.thawed[i]))g.step=items.some(x=>x[3])?'cut':r.heat?'heat':'plate';
 if(g.step==='cut'&&items.every((x,i)=>!x[3]||g.cut[i]>=2))g.step=r.heat?'heat':'plate';
}
function kitchenAction(station,index){
 const g=active();if(!g){say('먼저 손님 주문을 선택해!');return}
 const r=recipes[g.dish],items=r.items;
 if(station==='store'&&g.step==='store'){
  const i=index==null?items.findIndex((x,i)=>!g.got[i]):index;
  if(i<0||!items[i]||g.got[i])return;g.got[i]=1;say('📦 '+items[i][0]+' 창고에서 꺼냈어');advance(g);
 }else if(station==='thaw'&&g.step==='thaw'&&g.busy<0){
  const i=index==null?items.findIndex((x,i)=>x[2]&&!g.thawed[i]):index;
  if(i<0||!items[i]||!items[i][2]||g.thawed[i])return;g.busy=i;g.timer=2.2;say('💧 '+items[i][0]+' 해동 시작!');
 }else if(station==='cut'&&g.step==='cut'){
  const i=index==null?items.findIndex((x,i)=>x[3]&&(g.cut[i]||0)<2):index;
  if(i<0||!items[i]||!items[i][3]||(g.cut[i]||0)>=2)return;
  g.cut[i]=(g.cut[i]||0)+1;say('🔪 '+items[i][0]+' '+g.cut[i]+'/2 썰었어');advance(g);
 }else if(station==='heat'&&g.step==='heat'){
  if(!g.heatOn){g.heatOn=true;g.timer=dishes[g.dish].time;g.actions=0;say('🔥 '+r.heat+' 시작!')}
  else if(g.actions<r.moves){g.actions++;say('🍳 '+r.motion+' '+g.actions+'/'+r.moves)}
  if(g.timer<=0&&g.actions>=r.moves){g.step='plate';say('조리 완료! 접시에 담아!')}
 }else if(station==='plate'&&g.step==='plate'){
  g.phase='ready';g.step='ready';say('🍽️ '+r.finish+' 완료! 주문 카드를 눌러 서빙해!');
 }else{say('아직 이 단계가 아니야!');return}
 updateOrders();updateKitchen();
}
function updateKitchen(){
 const g=active();$('kitchen').classList.toggle('open',!!g);if(!g)return;
 const r=recipes[g.dish],root=$('actions');root.replaceChildren();
 $('workName').textContent=dishes[g.dish].icon+' '+dishes[g.dish].name+' 직접 요리';
 $('recipeText').textContent='재료: '+r.items.map((a,i)=>a[1]+a[0]+(g.got[i]?' ✓':'')).join(' · ');
 const stepLabel={store:'📦 ① 창고에서 재료를 하나씩 가져와',thaw:'💧 ② 냉동 재료를 해동해',cut:'🔪 ③ 도마에서 두 번씩 썰어',heat:'🔥 ④ '+r.heat,plate:'🍽️ ⑤ 접시에 담고 서빙해'};
 $('stepText').textContent=stepLabel[g.step]||'조리 중';
 const add=(label,station,i,hot=false,disabled=false)=>{
  const b=document.createElement('button');b.type='button';b.textContent=label;b.className=hot?'hot':'';b.disabled=disabled;b.addEventListener('click',()=>kitchenAction(station,i));root.append(b)
 };
 if(g.step==='store')r.items.forEach((a,i)=>{if(!g.got[i])add('📦 '+a[1]+a[0]+' 가져오기','store',i)});
 else if(g.step==='thaw'){
  if(g.busy>=0)add('💧 '+r.items[g.busy][0]+' '+Math.ceil(g.timer)+'초','thaw',null,false,true);
  else r.items.forEach((a,i)=>{if(a[2]&&!g.thawed[i])add('💧 '+a[0]+' 해동','thaw',i)});
 }else if(g.step==='cut')r.items.forEach((a,i)=>{if(a[3]&&(g.cut[i]||0)<2)add('🔪 '+a[0]+' '+(g.cut[i]||0)+'/2','cut',i)});
 else if(g.step==='heat'){
  if(!g.heatOn)add('🔥 '+r.heat+' 시작','heat',null,true);
  else if(g.actions<r.moves)add('🍳 '+r.motion+' '+g.actions+'/'+r.moves,'heat',null,true);
  else add('🔥 조리 완료까지 '+Math.ceil(g.timer)+'초','heat',null,true,true);
 }else if(g.step==='plate')add('🍽️ '+r.finish,'plate',null);
}
function updateOrders(){
 const root=$('orders');root.replaceChildren();
 for(const g of guests){
  const d=dishes[g.dish],btn=document.createElement('button');btn.className='order '+(g.phase==='cooking'?'cooking':g.phase==='ready'?'ready':'');
  if(g.id===selectedId)btn.style.borderColor='#d37637';
  const title=document.createElement('b');title.textContent=d.icon+' '+d.name+' · '+d.price+'원';
  const detail=document.createElement('small');
  const stepNames={store:'창고',thaw:'해동',cut:'칼질',heat:'불판',plate:'담기'};
  detail.textContent=g.phase==='order'?'👆 눌러 재료 준비':g.phase==='prep'?'👩‍🍳 '+stepNames[g.step]+' 진행 · 눌러 계속':g.phase==='cooking'?'🔥 요리사 조리 '+Math.ceil(g.timer)+'초':'✅ 눌러 서빙하기';
  const bar=document.createElement('div');bar.className='bar';const fill=document.createElement('div');fill.className='fill';
  const progress=g.phase==='order'?Math.max(0,g.patience/22)*100:g.phase==='cooking'?Math.max(0,1-g.timer/d.time)*100:g.phase==='prep'?Math.max(10,(['store','thaw','cut','heat','plate'].indexOf(g.step)+1)*18):100;
  fill.style.width=progress+'%';bar.append(fill);btn.append(title,detail,bar);btn.onclick=()=>interact(g.id);root.append(btn);
 }
 if(!guests.length){const p=document.createElement('div');p.className='chip';p.textContent='🍴 손님을 기다리는 중...';root.append(p)}
}
function interact(id){
 const g=guests.find(x=>x.id===id);if(!g)return;
 if(g.phase==='order'){g.phase='prep';g.step='store';g.got={};g.thawed={};g.cut={};g.busy=-1;g.timer=0;g.actions=0;g.heatOn=false;say('창고에서 '+dishes[g.dish].name+' 재료부터 꺼내!')}
 if(g.phase==='prep')selectedId=g.id;
 else if(g.phase==='ready')serve(g);
 else say('직원이 조리하고 있어!');
 updateOrders();updateKitchen();
}
function serve(g){
 data.cash+=dishes[g.dish].price;data.served++;const i=guests.indexOf(g);if(i>=0)guests.splice(i,1);
 if(selectedId===g.id)selectedId=null;
 if(g.person&&scene){scene.remove(g.person);const n=people.indexOf(g.person);if(n>=0)people.splice(n,1)}
 say('+'+dishes[g.dish].price+'원! 손님이 맛있게 먹었어!');save();updateTables();hud();updateOrders();updateKitchen();
}
function spawn(){
 if(guests.length>=data.tables)return;
 const seat=[...Array(data.tables).keys()].find(n=>!guests.some(g=>g.seat===n));if(seat===undefined)return;
 const dish=Math.floor(Math.random()*count()),g={id:++idCounter,seat,dish,phase:'order',timer:0,patience:22,person:null};
 guests.push(g);if(scene)g.person=createGuest(g);say(dishes[dish].icon+' '+dishes[dish].name+' 주문이 들어왔어!');
}
$('tableBtn').onclick=()=>{if(data.tables>=8||data.cash<priceTable())return;data.cash-=priceTable();data.tables++;updateTables();hud();save();say('테이블이 추가됐어!')};
$('cookBtn').onclick=()=>{if(data.cooks>=3||data.cash<priceCook())return;data.cash-=priceCook();data.cooks++;hud();save();say('요리사 고용! 주문을 자동으로 처리해!')};
$('menuBtn').onclick=()=>say(dishes.map((x,i)=>x.icon+x.name+' '+x.price+'원'+(i>=count()?' 🔒':'')).join(' · '));
$('start').onclick=()=>{data.started=true;$('intro').classList.add('hidden');save();say('영업 시작! 손님의 주문 카드를 눌러봐.')};
if(data.started)$('intro').classList.add('hidden');
// 그래픽: 기존 웹게임처럼 Three.js 실제 3D 메시 렌더링
let scene=null,camera=null,renderer=null,models=[],people=[],chefModels=[];let updateTables=()=>{};
const canvas=$('scene');
if(window.THREE){
scene=new THREE.Scene();scene.background=new THREE.Color(0xb9eada);scene.fog=new THREE.Fog(0xb9eada,25,45);
renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputEncoding=THREE.sRGBEncoding;
camera=new THREE.PerspectiveCamera(42,1,.1,90);camera.position.set(13,18,23);camera.lookAt(0,0,0);
scene.add(new THREE.HemisphereLight(0xffffff,0xa1a98b,2));
const sun=new THREE.DirectionalLight(0xffe6b5,2.4);sun.position.set(-8,17,8);scene.add(sun);
function box(x,y,z,w,h,d,color,parent=scene){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color}));m.position.set(x,y,z);parent.add(m);return m}
function ball(x,y,z,r,color,parent=scene){const m=new THREE.Mesh(new THREE.SphereGeometry(r,10,8),new THREE.MeshLambertMaterial({color}));m.position.set(x,y,z);parent.add(m);return m}
box(0,-.18,0,19,.35,15,0xf7ddb4);box(0,-.02,0,18,.06,14,0xf6eed8);
for(let i=-8;i<=8;i+=2)box(i,.017,0,.035,.02,14,0xe4d6bb);
for(let j=-6;j<=6;j+=2)box(0,.018,j,18,.02,.035,0xe4d6bb);
box(0,1.3,-7.2,19,2.6,.35,0xf4bc80);box(-9.4,1.2,0,.35,2.4,15,0xffd4a1);
for(let i=-6;i<=6;i+=5){box(i,1.5,-6.94,2.3,1.35,.1,0x6fbba4);box(i,1.5,-6.8,1.9,1,.11,0xc2e9cb)}
box(0,.56,-4.8,8,1.1,1.25,0x9d5b3f);box(0,1.15,-4.8,8,.2,1.35,0xf7d4a0);
box(-3,.97,-5.52,.85,.25,.12,0xffe19d);box(0,.97,-5.52,.85,.25,.12,0xffe19d);box(3,.97,-5.52,.85,.25,.12,0xffe19d);
for(let i=0;i<4;i++){box(-8.3,.4,-5+i*2.5,.7,.8,.7,0x7cb985);ball(-8.3,1.1,-5+i*2.5,.62,0x59a76e)}
function tablePos(n){return {x:-5+(n%4)*3.3,z:-1+Math.floor(n/4)*4.2}}
function addTable(n){const p=tablePos(n),group=new THREE.Group();scene.add(group);group.position.set(p.x,0,p.z);
box(0,.8,0,2.1,.2,1.5,0xba8054,group);box(-.8,.39,-.55,.14,.78,.14,0x694d3c,group);box(.8,.39,-.55,.14,.78,.14,0x694d3c,group);box(-.8,.39,.55,.14,.78,.14,0x694d3c,group);box(.8,.39,.55,.14,.78,.14,0x694d3c,group);
for(let side of [-1,1]){box(0,.46,side*1.1,1.15,.17,.65,0x77b4a3,group);box(0,.8,side*1.39,1.15,.75,.15,0x629c8c,group)}
ball(0,1.03,0,.22,0xfff6e0,group);models.push(group)}
updateTables=function(){while(models.length<data.tables)addTable(models.length)}
window.createGuest=function(g){const p=tablePos(g.seat);let a=new THREE.Group();scene.add(a);a.position.set(p.x,.1,p.z+1.1);const shirt=[0xffa7a4,0x83b9e9,0xeabd74,0xc2a5e3,0x82c5ad][g.id%5];box(0,.57,0,.55,.8,.38,shirt,a);ball(0,1.2,0,.32,0xeec3a1,a);const hair=ball(0,1.43,-.06,.32,0x5e4432,a);hair.scale.y=.42;box(-.17,.12,0,.17,.32,.16,0x535366,a);box(.17,.12,0,.17,.32,.16,0x535366,a);a.userData={t:Math.random()*6.3};people.push(a);return a};
for(let i=0;i<3;i++){const c=new THREE.Group();c.position.set(-2.5+i*2.5,0,-5.4);scene.add(c);box(0,.8,0,.7,1,.4,0xffffff,c);ball(0,1.55,0,.34,0xf0c59e,c);box(0,1.83,0,.72,.16,.3,0xffffff,c);chefModels.push(c)}
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;const wide=w>h;camera.position.set(wide?12:16,wide?17:22,wide?22:27);camera.lookAt(0,0,wide?0:0);camera.updateProjectionMatrix()}
window.addEventListener('resize',resize);resize();updateTables();
}else{canvas.style.background='linear-gradient(#b8ecdd,#ffe7b7)';say('3D 화면을 불러오지 못했어. 연결을 확인해줘.')}
function frame(now){const dt=Math.min(.06,Math.max(0,(now-last)/1000));last=now;if(data.started){
const prev=data.elapsed;data.elapsed+=dt;if(prev<120&&data.elapsed>=120){say('🎉 피자와 초밥 2종이 해금됐어!');save()}
spawnClock-=dt;if(spawnClock<=0){spawn();spawnClock=5.5+Math.random()*3.5}
for(const g of [...guests]){
 if(g.phase==='order'){
  g.patience-=dt;
  if(g.patience<=0){const i=guests.indexOf(g);if(i>=0)guests.splice(i,1);if(scene&&g.person){scene.remove(g.person);const n=people.indexOf(g.person);if(n>=0)people.splice(n,1)}say('손님이 오래 기다려서 나갔어!')}
 }else if(g.phase==='prep'){
  if(g.step==='thaw'&&g.busy>=0){g.timer=Math.max(0,g.timer-dt);if(g.timer<=0){g.thawed[g.busy]=1;g.busy=-1;advance(g);say('💧 재료 해동 완료!')}}
  else if(g.step==='heat'&&g.heatOn){g.timer=Math.max(0,g.timer-dt);if(g.timer<=0&&g.actions>=recipes[g.dish].moves){g.step='plate';say('🔥 불판 조리 완료! 접시에 담아!')}}
 }else if(g.phase==='cooking'){g.timer-=dt;if(g.timer<=0)g.phase='ready'}
}
autoClock-=dt;if(autoClock<=0){autoClock=1.0;if(data.cooks){const pending=guests.filter(g=>g.phase==='order'||g.phase==='ready');for(const g of pending.slice(0,data.cooks)){if(g.phase==='order'){g.phase='cooking';g.timer=dishes[g.dish].time}else serve(g)}}}
saveClock+=dt;if(saveClock>5){saveClock=0;save()}
}
if(scene){const t=now/1000;for(const a of people)if(a.parent){a.rotation.y=Math.sin(t*.8+a.userData.t)*.12;a.position.y=.1+Math.sin(t*2+a.userData.t)*.024}chefModels.forEach((c,i)=>c.rotation.y=Math.sin(t+i)*.15);renderer.render(scene,camera)}
if(noticeClock>0)noticeClock-=dt;
if(Math.floor(now/300)!==Math.floor((now-dt*1000)/300)){hud();updateOrders();updateKitchen()}
requestAnimationFrame(frame)}
window.addEventListener('pagehide',save);
window.addEventListener('visibilitychange',()=>{if(document.hidden)save();last=performance.now()});
hud();updateOrders();updateKitchen();requestAnimationFrame(frame);
})();
</script></body></html>
