<html lang="ko">

<title>좀비 생존기</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#0a0f0b;color:#eef4ed;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{display:flex;justify-content:center}button{font:inherit}.game{width:min(100%,620px);min-height:100vh;padding:calc(14px + env(safe-area-inset-top)) 13px calc(22px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#111912,#090e0a 58%,#060906)}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.title{font-size:24px;font-weight:900}.day{padding:7px 10px;border:1px solid #3c4f3d;border-radius:999px;background:#162018;font-size:12px;font-weight:850}.scene{position:relative;overflow:hidden;min-height:196px;border:1px solid #334534;border-radius:20px;background:linear-gradient(#26342a 0 42%,#121813 42%);box-shadow:0 12px 32px #0006}.moon{position:absolute;right:28px;top:23px;width:38px;height:38px;border-radius:50%;background:#d8dfc8;box-shadow:0 0 28px #d8dfc855}.city{position:absolute;left:0;right:0;bottom:58%;height:62px;display:flex;align-items:flex-end;gap:5px;padding:0 8px}.b{flex:1;min-width:22px;background:#18221b;border-top:2px solid #455748}.b:nth-child(2n){height:82%}.b:nth-child(3n){height:62%}.b:nth-child(4n){height:100%}.road{position:absolute;left:0;right:0;bottom:18px;height:44px;background:#202521;border-top:1px solid #3a403b}.road:after{content:'';position:absolute;left:8%;right:8%;top:20px;border-top:3px dashed #77715a}.zombie{position:absolute;bottom:52px;width:21px;height:38px}.zombie:before{content:'';position:absolute;left:4px;top:0;width:13px;height:13px;border-radius:50%;background:#7d966e}.zombie:after{content:'';position:absolute;left:2px;top:12px;width:17px;height:24px;border-radius:7px 7px 2px 2px;background:#52634a}.z1{left:18%}.z2{left:61%;transform:scale(.8)}.z3{right:11%;transform:scale(1.12)}.shelter{position:absolute;left:50%;bottom:36px;width:92px;height:72px;transform:translateX(-50%);background:#30372f;border:2px solid #566254;border-radius:5px}.shelter:before{content:'';position:absolute;left:-10px;right:-10px;top:-16px;height:20px;background:#252b25;clip-path:polygon(50% 0,100% 100%,0 100%)}.door{position:absolute;left:36px;bottom:0;width:22px;height:39px;background:#161b16;border:1px solid #626c60}.sceneText{position:absolute;left:10px;right:10px;bottom:10px;padding:8px 10px;border-radius:12px;background:#050806d9;border:1px solid #303a31;font-size:11px;line-height:1.45}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}.stat{min-width:0;padding:8px 4px;border:1px solid #2c3c2e;border-radius:12px;background:#131b14;text-align:center}.stat small{display:block;color:#90a392;font-size:9px}.stat b{display:block;margin-top:2px;font-size:15px}.card{padding:14px;border:1px solid #314232;border-radius:18px;background:#121a13}.eventTag{font-size:10px;font-weight:900;color:#9db29f}.card h1{margin:5px 0 7px;font-size:22px;line-height:1.25}.card p{margin:0;color:#c3d0c2;font-size:13px;line-height:1.55}.choices{display:grid;gap:8px;margin-top:13px}.choice{min-height:58px;padding:10px 12px;border:1px solid #465a47;border-radius:14px;background:#1a251b;color:#f2f6f0;text-align:left;font-weight:850;line-height:1.35}.choice small{display:block;margin-top:3px;color:#9fb09f;font-size:10px;font-weight:650}.choice:active{transform:scale(.99);background:#223024}.bottomRow{display:flex;justify-content:flex-end;gap:7px;margin-top:9px}.mini{min-height:42px;padding:0 12px;border:1px solid #3c4d3d;border-radius:12px;background:#101711;color:#d9e5d8;font-weight:800}.danger{color:#f3c7c7;border-color:#624040}.log{margin-top:10px;padding:10px;border:1px solid #29362a;border-radius:14px;background:#0e140f}.logHead{display:flex;justify-content:space-between;gap:8px}.logHead b{font-size:12px}.logHead span{font-size:9px;color:#7f9280}.logList{display:grid;gap:5px;margin-top:7px;max-height:122px;overflow:auto}.logItem{font-size:10px;line-height:1.45;color:#aebcaf;border-top:1px dashed #283329;padding-top:5px}.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:#020402dd;z-index:20}.overlay.show{display:flex}.modal{width:min(94vw,430px);padding:18px;border:1px solid #445545;border-radius:20px;background:#111812;text-align:center;box-shadow:0 24px 70px #0009}.modal h2{margin:0 0 7px;font-size:27px}.modal p{color:#b8c8b7;font-size:13px;line-height:1.55}.modal button{width:100%;min-height:48px;margin-top:9px;border:0;border-radius:13px;background:#dcebd9;color:#142015;font-weight:900}@media(max-width:390px){.stats{grid-template-columns:repeat(3,1fr)}.title{font-size:21px}.card h1{font-size:20px}}
</style>
</head>
<body>
<main class="game">
<div class="top"><div class="title">좀비 생존기</div><div id="dayBadge" class="day">1일차 · 밤</div></div>
<section class="scene"><div class="moon"></div><div class="city"><div class="b"></div><div class="b"></div><div class="b"></div><div class="b"></div><div class="b"></div><div class="b"></div></div><div class="road"></div><div class="zombie z1"></div><div class="zombie z2"></div><div class="zombie z3"></div><div class="shelter"><div class="door"></div></div><div id="sceneText" class="sceneText">도시는 무너졌고, 네가 가진 건 작은 은신처뿐이야.</div></section>
<section class="stats"><div class="stat"><small>체력</small><b id="hp">100</b></div><div class="stat"><small>식량</small><b id="food">6</b></div><div class="stat"><small>물자</small><b id="supply">4</b></div><div class="stat"><small>방어</small><b id="defense">1</b></div><div class="stat"><small>동료</small><b id="people">0</b></div></section>
<section class="card"><div id="eventTag" class="eventTag">1일차</div><h1 id="eventTitle">첫날 밤</h1><p id="eventText"></p><div id="choices" class="choices"></div></section>
<div class="bottomRow"><button id="saveBtn" class="mini" type="button">저장</button><button id="resetBtn" class="mini danger" type="button">처음부터</button></div>
<section class="log"><div class="logHead"><b>생존 기록</b><span>선택 결과가 다음 날에 이어져</span></div><div id="logList" class="logList"></div></section>
</main>
<div id="endOverlay" class="overlay"><div class="modal"><h2 id="endTitle"></h2><p id="endText"></p><button id="restartBtn" type="button">다시 시작</button></div></div>
<script>
// 파일명: web-games/zombie-survival/index.html
// 메인: 하루 단위 선택형 좀비 생존 게임
(() => {
'use strict';
const $=id=>document.getElementById(id);
const SAVE_KEY='jaewoon_zombie_survival_v1',MAX_DAY=30;
const state={day:1,hp:100,food:6,supply:4,defense:1,people:0,alive:true,won:false,history:[],eventId:'intro'};
const first={id:'intro',title:'1일차, 첫 선택',text:'도시가 무너진 첫날이야. 해가 완전히 지기 전에 무엇을 하겠어?',scene:'멀리서 사이렌이 멈추고 골목에는 좀비 몇 마리만 보여.',choices:[['물자를 탐색한다','위험을 감수하고 식량과 물자를 모아.','scavenge'],['가만히 숨어 있는다','안전하지만 하루치 식량을 소비해.','rest'],['은신처를 강화한다','물자를 써서 방어력을 올려.','barricade']]};
const events=[
{id:'store',title:'편의점 불빛',text:'두 블록 떨어진 편의점에 아직 불이 켜져 있어. 안에는 좀비 그림자가 움직여.',scene:'깨진 간판 불빛이 계속 깜빡여.',choices:[['몰래 물자를 챙긴다','성공하면 식량과 물자를 크게 얻어.','scavenge'],['오늘은 위험을 피한다','안전하게 체력을 회복해.','rest'],['주변을 먼저 정찰한다','작은 보상과 방어 정보를 얻어.','scout']]},
{id:'knock',title:'문을 두드리는 생존자',text:'늦은 밤 누군가 은신처 문을 세 번 두드려. 혼자인 것처럼 보이지만 확신할 수 없어.',scene:'문 밖에서 작은 목소리로 도와달라는 말이 들려.',choices:[['문을 열어준다','동료가 될 수도, 감염자일 수도 있어.','rescue'],['문을 열지 않는다','위험을 완전히 피한다.','ignore'],['물자만 조금 건넨다','물자 1을 쓰고 정보를 얻어.','share']]},
{id:'horde',title:'좀비 떼의 접근',text:'골목 끝에서 수십 마리의 발소리가 들려. 은신처가 발견될 수도 있어.',scene:'골목에 좀비 그림자가 하나둘 늘어나고 있어.',choices:[['입구를 강화한다','물자를 써서 방어를 올려.','barricade'],['조용히 숨는다','방어력이 높을수록 안전해.','hide'],['다른 골목으로 유인한다','성공하면 자원을 아낄 수 있어.','lure']]},
{id:'pharmacy',title:'약국 탐색',text:'근처 약국의 셔터가 반쯤 열려 있어. 안쪽은 어둡고 조용해.',scene:'약국 앞 피 묻은 발자국이 문 안에서 끊겨 있어.',choices:[['안으로 들어간다','체력을 회복할 약을 찾을 수 있어.','medicine'],['동료와 함께 간다','동료가 있으면 훨씬 안전해.','teamMedicine'],['그냥 지나친다','오늘은 체력을 아껴.','rest']]},
{id:'radio',title:'라디오 구조 신호',text:'낡은 라디오에서 생존자 캠프의 좌표가 반복해서 흘러나와.',scene:'잡음 사이로 “북쪽 학교… 안전…”이라는 말이 들려.',choices:[['좌표를 확인하러 간다','큰 보상 또는 큰 위험이 있어.','radioTrip'],['신호를 무시한다','은신처를 지켜.','ignore'],['답신을 시도한다','물자 1로 정보를 얻어.','reply']]},
{id:'rain',title:'폭우',text:'폭우 때문에 좀비 움직임은 느려졌지만 은신처 천장에서 물이 새기 시작해.',scene:'빗소리가 도시의 다른 소리를 전부 덮어버려.',choices:[['지붕을 수리한다','물자 2를 써서 방어를 올려.','repair'],['비를 이용해 탐색한다','좀비가 느릴 때 자원을 찾는다.','rainScavenge'],['그냥 버틴다','물자는 아끼지만 피해 가능성이 있어.','waitRain']]},
{id:'school',title:'학교 안의 신호',text:'학교 체육관 창문에서 손전등 신호가 보여. 사람일 수도 함정일 수도 있어.',scene:'체육관 2층에서 세 번씩 반복되는 불빛이 보여.',choices:[['학교로 간다','동료를 찾을 가능성이 있어.','schoolRescue'],['멀리서 지켜본다','위험 없이 정보를 얻어.','observe'],['신호를 무시한다','은신처에 남아.','rest']]},
{id:'generator',title:'발전기 발견',text:'폐공장 뒤에서 작은 발전기를 발견했어. 작동시키려면 부품이 필요해.',scene:'발전기 옆에는 아직 쓸 만한 공구가 남아 있어.',choices:[['물자 3으로 수리한다','은신처 방어가 크게 좋아져.','generator'],['부품만 뜯어온다','물자 2를 얻어.','parts'],['건드리지 않는다','소음을 만들지 않아.','ignore']]}
];
function addLog(t){state.history.unshift(state.day+'일차 · '+t);state.history=state.history.slice(0,18)}
function spend(k,n){if(state[k]<n)return false;state[k]-=n;return true}
function act(a){
let r=Math.random(),m='';
if(a==='scavenge'){if(r<.7){let f=2+Math.floor(Math.random()*3),s=1+Math.floor(Math.random()*3);state.food+=f;state.supply+=s;m='탐색 성공. 식량 +'+f+', 물자 +'+s}else{state.hp-=18;state.supply++;m='좀비에게 쫓기다 다쳤어. 체력 -18, 물자 +1'}}
else if(a==='rest'){state.hp=Math.min(100,state.hp+6);m='은신처에서 쉬었어. 체력 +6'}
else if(a==='scout'){state.supply++;if(r<.55){state.defense++;m='안전한 길을 찾았어. 물자 +1, 방어 +1'}else m='빈 골목뿐이었어. 물자 +1'}
else if(a==='rescue'){if(r<.72){state.people++;state.food++;m='생존자를 받아들였어. 동료 +1, 식량 +1'}else{state.hp-=12;state.supply=Math.max(0,state.supply-1);m='감염자였어. 체력 -12, 물자 -1'}}
else if(a==='ignore')m='위험을 피하고 은신처를 지켰어.'
else if(a==='share'){if(spend('supply',1)){state.defense++;m='물자를 건네고 정보를 얻었어. 물자 -1, 방어 +1'}else m='건넬 물자가 없어서 문을 열지 않았어.'}
else if(a==='barricade'){if(spend('supply',2)){state.defense+=2;m='입구를 강화했어. 물자 -2, 방어 +2'}else{state.defense++;m='남은 자재로 급히 막았어. 방어 +1'}}
else if(a==='hide'){let risk=Math.max(.08,.55-state.defense*.08);if(r<risk){state.hp-=16;m='좀비 몇 마리가 들어왔어. 체력 -16'}else m='숨을 죽이고 좀비 떼를 넘겼어.'}
else if(a==='lure'){if(r<.58){state.food++;m='좀비 떼를 다른 골목으로 빼냈어. 식량 +1'}else{state.hp-=22;m='유인 중 포위됐어. 체력 -22'}}
else if(a==='medicine'){if(r<.68){state.hp=Math.min(100,state.hp+28);state.supply++;m='약과 붕대를 찾았어. 체력 +28, 물자 +1'}else{state.hp-=15;m='약국 안에서 다쳤어. 체력 -15'}}
else if(a==='teamMedicine'){if(state.people>0){state.hp=Math.min(100,state.hp+24);state.supply+=2;m='동료와 약국을 털었어. 체력 +24, 물자 +2'}else{state.hp-=10;m='함께 갈 동료가 없어 혼자 갔다 다쳤어. 체력 -10'}}
else if(a==='radioTrip'){if(r<.55){state.food+=4;state.supply+=3;if(Math.random()<.5){state.people++;m='생존자 거점을 찾았어. 식량 +4, 물자 +3, 동료 +1'}else m='버려진 보급품을 찾았어. 식량 +4, 물자 +3'}else{state.hp-=25;m='구조 신호는 이미 무너진 곳이었어. 체력 -25'}}
else if(a==='reply'){if(spend('supply',1)){state.defense++;state.food++;m='답신에 성공했어. 물자 -1, 식량 +1, 방어 +1'}else m='라디오를 고칠 물자가 없었어.'}
else if(a==='repair'){if(spend('supply',2)){state.defense+=2;m='지붕을 고쳤어. 물자 -2, 방어 +2'}else{state.hp-=8;m='수리할 물자가 부족해 체력 -8'}}
else if(a==='rainScavenge'){state.food+=2;state.supply+=2;m='빗소리를 이용해 탐색했어. 식량 +2, 물자 +2'}
else if(a==='waitRain'){if(r<.5){state.hp-=10;m='밤새 젖어 체력 -10'}else m='비가 금방 그쳐 무사히 넘겼어.'}
else if(a==='schoolRescue'){if(r<.65){state.people++;state.food+=2;m='학교 생존자와 합류했어. 동료 +1, 식량 +2'}else{state.hp-=14;m='학교 안에서 좀비에게 쫓겼어. 체력 -14'}}
else if(a==='observe'){state.defense++;m='좀비 이동 경로를 파악했어. 방어 +1'}
else if(a==='generator'){if(spend('supply',3)){state.defense+=3;m='발전기를 살렸어. 물자 -3, 방어 +3'}else m='부품이 부족해 수리하지 못했어.'}
else if(a==='parts'){state.supply+=2;m='쓸 만한 부품을 뜯어왔어. 물자 +2'}
return m}
function daily(){
let need=1+Math.floor(state.people/2);state.food-=need;
if(state.food<0){let lack=-state.food;state.food=0;state.hp-=10+lack*6;addLog('식량 부족으로 체력 -'+(10+lack*6))}else addLog('하루 식량 '+need+' 사용');
if(state.people>0&&Math.random()<.24){state.supply++;addLog('동료가 물자 1을 찾아왔어')}}
function nextEvent(){return events[Math.floor(Math.random()*events.length)]}
function currentEvent(){if(state.day===1&&state.eventId==='intro')return first;return events.find(e=>e.id===state.eventId)||first}
function choose(a){
if(!state.alive||state.won)return;addLog(act(a));state.hp=Math.max(0,Math.min(100,state.hp));daily();
if(state.hp<=0){state.alive=false;save();render();end(false);return}
if(state.day>=MAX_DAY){state.won=true;save();render();end(true);return}
state.day++;let e=nextEvent();state.eventId=e.id;save();render(e)}
function render(e=currentEvent()){
$('dayBadge').textContent=state.day+'일차 · 밤';$('hp').textContent=state.hp;$('food').textContent=state.food;$('supply').textContent=state.supply;$('defense').textContent=state.defense;$('people').textContent=state.people;
$('eventTag').textContent=state.day+'일차 · 생존 '+Math.round((state.day-1)/MAX_DAY*100)+'%';$('eventTitle').textContent=e.title;$('eventText').textContent=e.text;$('sceneText').textContent=e.scene;
$('choices').innerHTML='';e.choices.forEach((c,i)=>{let b=document.createElement('button');b.type='button';b.className='choice';b.textContent=(i+1)+'. '+c[0];let s=document.createElement('small');s.textContent=c[1];b.appendChild(s);b.addEventListener('click',()=>choose(c[2]));$('choices').appendChild(b)});
$('logList').innerHTML='';let rows=state.history.length?state.history:['아직 기록이 없어. 첫 선택을 해봐.'];rows.forEach(x=>{let d=document.createElement('div');d.className='logItem';d.textContent=x;$('logList').appendChild(d)})}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(state));$('saveBtn').textContent='저장됨';setTimeout(()=>$('saveBtn').textContent='저장',700)}catch{}}
function load(){try{let d=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(d&&typeof d.day==='number')Object.assign(state,d)}catch{}}
function reset(){localStorage.removeItem(SAVE_KEY);Object.assign(state,{day:1,hp:100,food:6,supply:4,defense:1,people:0,alive:true,won:false,history:[],eventId:'intro'});$('endOverlay').classList.remove('show');save();render(first)}
function end(win){$('endTitle').textContent=win?'30일 생존 성공':'생존 실패';$('endText').textContent=win?'끝까지 버텼어. 체력 '+state.hp+', 식량 '+state.food+', 물자 '+state.supply+', 동료 '+state.people+'명으로 구조대와 합류했어.':state.day+'일차에 쓰러졌어. 다른 선택으로 다시 도전해봐.';$('endOverlay').classList.add('show')}
$('saveBtn').addEventListener('click',save);$('resetBtn').addEventListener('click',()=>{if(confirm('진행 기록을 지우고 처음부터 시작할까?'))reset()});$('restartBtn').addEventListener('click',reset);
load();render();if(!state.alive)end(false);else if(state.won)end(true);
})();
</script>
