<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111714">
<title>좀비 생존</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#0a0d0b;color:#f4f7f5;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;overflow:hidden;touch-action:none}
button{font:inherit}
#game{position:relative;width:100vw;height:100vh;overflow:hidden;background:#151a16}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;left:10px;right:10px;top:max(10px,env(safe-area-inset-top));z-index:4;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.card{background:rgba(10,14,11,.80);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:8px 10px;backdrop-filter:blur(8px);box-shadow:0 6px 20px rgba(0,0,0,.22)}
.stats{display:grid;grid-template-columns:auto auto;gap:2px 12px;font-size:12px;line-height:1.35;min-width:136px}
.stats b{font-size:13px}
.weapon{margin-left:auto;text-align:right;min-width:142px}
.weapon b{display:block;font-size:15px}.weapon span{font-size:11px;color:#c8d2ca}
.bar{height:6px;margin-top:5px;border-radius:9px;background:#343b36;overflow:hidden}.bar i{display:block;height:100%;background:#e34e49;width:100%}
.tip{position:absolute;left:50%;top:88px;transform:translateX(-50%);z-index:4;max-width:82%;padding:7px 11px;border-radius:10px;background:rgba(9,13,10,.76);font-size:12px;font-weight:800;text-align:center;pointer-events:none;transition:opacity .25s}
.controls{position:absolute;inset:0;z-index:5;pointer-events:none}
.joy{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));width:122px;height:122px;border-radius:50%;border:2px solid rgba(255,255,255,.16);background:rgba(8,12,9,.24);pointer-events:auto;touch-action:none}
.joy.left{left:18px}.joy.right{right:18px}
.knob{position:absolute;left:36px;top:36px;width:46px;height:46px;border-radius:50%;background:rgba(238,245,239,.42);border:2px solid rgba(255,255,255,.5);transform:translate(0,0)}
.actionStack{position:absolute;right:18px;bottom:152px;display:grid;gap:8px;pointer-events:auto}
.actionStack button,.reloadBtn{min-width:92px;min-height:46px;border:1px solid rgba(255,255,255,.18);border-radius:12px;background:rgba(16,22,18,.88);color:#fff;font-weight:900}
.actionStack button:active,.reloadBtn:active{transform:scale(.97)}
.reloadBtn{position:absolute;right:128px;bottom:max(42px,calc(env(safe-area-inset-bottom) + 42px));pointer-events:auto;min-width:74px}
.desktopHelp{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font-size:11px;color:#b9c2bb;background:rgba(9,12,10,.72);padding:6px 10px;border-radius:9px;pointer-events:none}
.panel{position:absolute;left:50%;top:50%;z-index:9;transform:translate(-50%,-50%);width:min(92vw,410px);padding:16px;border-radius:18px;background:#121814;border:1px solid #39463d;box-shadow:0 22px 70px rgba(0,0,0,.55);display:none}
.panel.open{display:block}
.panel h2{margin:0 0 6px;font-size:21px}.panel p{margin:0 0 12px;color:#b9c4bc;font-size:12px;line-height:1.45}
.upgrades{display:grid;gap:8px}.upgrades button{min-height:54px;border:1px solid #344139;border-radius:12px;background:#1b241e;color:#fff;text-align:left;padding:9px 11px}.upgrades b,.upgrades span{display:block}.upgrades span{margin-top:3px;font-size:11px;color:#b8c4bc}
.close{width:100%;min-height:44px;margin-top:10px;border:0;border-radius:11px;background:#e7eee9;color:#142018;font-weight:900}
.overlay{position:absolute;inset:0;z-index:12;display:none;place-items:center;background:rgba(3,5,4,.76);padding:22px;text-align:center}
.overlay.show{display:grid}.overlay .box{width:min(92vw,420px);padding:22px;border-radius:20px;background:#121814;border:1px solid #38463c}.overlay h1{margin:0 0 8px}.overlay p{color:#bac5bd;font-size:13px;line-height:1.5}.overlay button{width:100%;min-height:50px;border:0;border-radius:12px;background:#edf4ef;color:#102016;font-weight:1000}
.loot{position:absolute;left:50%;top:128px;z-index:8;transform:translateX(-50%) translateY(-8px);opacity:0;padding:8px 12px;border-radius:11px;background:#e9f2eb;color:#102016;font-size:12px;font-weight:1000;pointer-events:none;transition:.25s}
.loot.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:760px){.joy{opacity:.35}.desktopHelp{display:block}}
@media(max-width:759px){.desktopHelp{display:none}}
@media(max-width:390px){.joy{width:108px;height:108px}.knob{left:31px;top:31px}.actionStack{bottom:136px}.reloadBtn{right:112px}.weapon{min-width:122px}.card{padding:7px 8px}}
</style>
</head>
<body>
<div id="game">
<canvas id="c"></canvas>
<div class="hud">
  <div class="card stats">
    <span>체력</span><b id="hp">100/100</b>
    <span>웨이브</span><b id="wave">1</b>
    <span>처치</span><b id="kills">0</b>
    <span>부품</span><b id="parts">0</b>
    <div class="bar" style="grid-column:1/-1"><i id="hpBar"></i></div>
  </div>
  <div class="card weapon"><b id="weapon">권총 Lv.1</b><span id="ammo">12 / 48</span></div>
</div>
<div class="tip" id="tip">왼쪽 이동 · 오른쪽 조준/사격 · 건물 상자를 찾아봐</div>
<div class="loot" id="loot"></div>
<div class="controls">
  <div class="joy left" id="moveJoy"><div class="knob"></div></div>
  <div class="joy right" id="aimJoy"><div class="knob"></div></div>
  <div class="actionStack"><button id="interact" type="button">상자 열기</button><button id="upgrade" type="button">총 업글</button></div>
  <button class="reloadBtn" id="reload" type="button">재장전</button>
  <div class="desktopHelp">WASD 이동 · 마우스 조준 · 클릭 사격 · E 상호작용 · R 재장전</div>
</div>
<div class="panel" id="upgradePanel">
  <h2>총 업그레이드</h2>
  <p>좀비 처치로 부품을 모아 현재 총을 강화해.</p>
  <div class="upgrades">
    <button type="button" data-up="damage"><b>공격력 강화</b><span id="damageCost"></span></button>
    <button type="button" data-up="rate"><b>연사 강화</b><span id="rateCost"></span></button>
    <button type="button" data-up="mag"><b>탄창 강화</b><span id="magCost"></span></button>
  </div>
  <button class="close" id="closeUpgrade" type="button">닫기</button>
</div>
<div class="overlay" id="dead"><div class="box"><h1>감염됐다</h1><p id="result"></p><button id="restart" type="button">다시 생존</button></div></div>
</div>
<script>
(() => {
'use strict';

// 파일명: web-games/zombie-survival/index.html
// 메인: 실시간 좀비 생존 / 실제 직선 투사체 / 건물 상자 파밍 / 총 업그레이드

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d',{alpha:false});
const $=id=>document.getElementById(id);
let W=0,H=0,dpr=1,last=performance.now(),running=true;
const world={w:2200,h:1600},camera={x:0,y:0},keys=new Set(),pointer={x:0,y:0,down:false,active:false};
const moveInput={x:0,y:0},aimInput={x:0,y:0};
let lootTimer=0,tipTimer=0,waveClock=0,spawnClock=0;

const WEAPONS={
  pistol:{name:'권총',damage:24,rate:3.5,mag:12,reserve:48,speed:1000,spread:.025,pellets:1,reload:1.0,color:'#ffd45d'},
  smg:{name:'기관단총',damage:15,rate:10,mag:28,reserve:112,speed:1080,spread:.07,pellets:1,reload:1.25,color:'#f6de73'},
  rifle:{name:'소총',damage:35,rate:5.2,mag:20,reserve:80,speed:1250,spread:.018,pellets:1,reload:1.45,color:'#ffef9b'},
  shotgun:{name:'산탄총',damage:14,rate:1.45,mag:6,reserve:36,speed:900,spread:.22,pellets:7,reload:1.65,color:'#ffd07b'}
};
function makeGun(id){const b=WEAPONS[id];return{id,level:1,damageLv:0,rateLv:0,magLv:0,ammo:b.mag,reserve:b.reserve,lastShot:0,reloading:0}}
const player={x:1100,y:800,r:16,hp:100,maxHp:100,speed:230,gun:makeGun('pistol'),parts:0,kills:0,invuln:0};
const bullets=[],zombies=[],particles=[],buildings=[],chests=[];

function addBuilding(x,y,w,h,doorSide='bottom'){
  const b={x,y,w,h,doorSide};buildings.push(b);
  let cx=x+w/2,cy=y+h/2;
  if(doorSide==='bottom')cy=y+h-42;if(doorSide==='top')cy=y+42;if(doorSide==='left')cx=x+42;if(doorSide==='right')cx=x+w-42;
  chests.push({x:cx,y:cy,r:18,opened:false,building:b});
}
addBuilding(210,180,300,220,'right');addBuilding(760,140,340,240,'bottom');addBuilding(1440,190,330,230,'left');
addBuilding(260,690,330,250,'top');addBuilding(1460,680,360,260,'left');addBuilding(430,1190,320,220,'right');addBuilding(1120,1150,350,240,'top');

function resize(){dpr=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function dist2(a,b){const dx=a.x-b.x,dy=a.y-b.y;return dx*dx+dy*dy}
function len(x,y){return Math.hypot(x,y)||1}
function norm(x,y){const l=len(x,y);return{x:x/l,y:y/l}}
function rand(a,b){return a+Math.random()*(b-a)}

function gunStats(){
  const g=player.gun,b=WEAPONS[g.id];
  return{damage:b.damage*(1+g.damageLv*.22),rate:b.rate*(1+g.rateLv*.16),mag:b.mag+g.magLv*4,speed:b.speed,spread:b.spread,pellets:b.pellets,reload:Math.max(.55,b.reload*(1-g.rateLv*.035)),color:b.color};
}
function showLoot(text){const el=$('loot');el.textContent=text;el.classList.add('show');clearTimeout(lootTimer);lootTimer=setTimeout(()=>el.classList.remove('show'),1800)}
function showTip(text,ms=1800){const el=$('tip');el.textContent=text;el.style.opacity='1';clearTimeout(tipTimer);tipTimer=setTimeout(()=>el.style.opacity='.18',ms)}

function spawnZombie(){
  if(zombies.length>70)return;
  const side=Math.floor(Math.random()*4);let x,y;
  if(side===0){x=rand(20,world.w-20);y=20}else if(side===1){x=world.w-20;y=rand(20,world.h-20)}else if(side===2){x=rand(20,world.w-20);y=world.h-20}else{x=20;y=rand(20,world.h-20)}
  if(Math.hypot(x-player.x,y-player.y)<480)return;
  const wave=Math.max(1,Math.floor(waveClock/35)+1);
  const type=Math.random()<Math.min(.25,wave*.025)?'runner':(Math.random()<Math.min(.18,wave*.016)?'brute':'normal');
  const hp=(type==='brute'?150:type==='runner'?58:82)*(1+(wave-1)*.12);
  zombies.push({x,y,r:type==='brute'?23:17,hp,maxHp:hp,speed:type==='runner'?118:type==='brute'?54:73,damage:type==='brute'?24:12,hit:0,type});
}
function tryShoot(){
  const g=player.gun,s=gunStats(),now=performance.now()/1000;
  if(g.reloading>0||g.ammo<=0||now-g.lastShot<1/s.rate)return;
  let ax=aimInput.x,ay=aimInput.y;
  if(pointer.active){ax=pointer.x+camera.x-player.x;ay=pointer.y+camera.y-player.y}
  if(Math.hypot(ax,ay)<.1)return;
  const n=norm(ax,ay);g.lastShot=now;g.ammo--;
  for(let i=0;i<s.pellets;i++){
    const a=Math.atan2(n.y,n.x)+rand(-s.spread,s.spread);
    bullets.push({x:player.x+n.x*24,y:player.y+n.y*24,vx:Math.cos(a)*s.speed,vy:Math.sin(a)*s.speed,r:4,life:1.25,damage:s.damage,color:s.color});
  }
  for(let i=0;i<3;i++)particles.push({x:player.x+n.x*22,y:player.y+n.y*22,vx:n.x*rand(30,95)+rand(-35,35),vy:n.y*rand(30,95)+rand(-35,35),life:.18,size:rand(2,4),color:s.color});
  if(g.ammo===0&&g.reserve>0)setTimeout(startReload,150);
}
function startReload(){
  const g=player.gun,s=gunStats();
  if(g.reloading>0||g.reserve<=0||g.ammo>=s.mag)return;
  g.reloading=s.reload;showTip('재장전 중…',700);
}
function openNearestChest(){
  let best=null,bd=70*70;
  for(const c of chests){if(c.opened)continue;const d=dist2(player,c);if(d<bd){bd=d;best=c}}
  if(!best){showTip('상자 가까이 가야 해');return}
  best.opened=true;const roll=Math.random();
  if(roll<.58){
    const ids=['smg','rifle','shotgun'],id=ids[Math.floor(Math.random()*ids.length)];
    player.gun=makeGun(id);showLoot(WEAPONS[id].name+' 획득!');
  }else if(roll<.82){const gain=8+Math.floor(Math.random()*9);player.parts+=gain;showLoot('총기 부품 +'+gain)}
  else{const heal=35;player.hp=Math.min(player.maxHp,player.hp+heal);showLoot('응급치료 +'+heal)}
  updateHud();
}
function upgradeCost(kind){const g=player.gun,l=kind==='damage'?g.damageLv:kind==='rate'?g.rateLv:g.magLv;return 8+l*7}
function refreshUpgradePanel(){
  $('damageCost').textContent='부품 '+upgradeCost('damage')+' · 현재 +'+Math.round(player.gun.damageLv*22)+'%';
  $('rateCost').textContent='부품 '+upgradeCost('rate')+' · 현재 +'+Math.round(player.gun.rateLv*16)+'%';
  $('magCost').textContent='부품 '+upgradeCost('mag')+' · 현재 +'+(player.gun.magLv*4)+'발';
}
function buyUpgrade(kind){
  const cost=upgradeCost(kind);if(player.parts<cost){showLoot('부품이 부족해');return}
  player.parts-=cost;if(kind==='damage')player.gun.damageLv++;if(kind==='rate')player.gun.rateLv++;
  if(kind==='mag'){player.gun.magLv++;player.gun.ammo=Math.min(gunStats().mag,player.gun.ammo+4)}
  player.gun.level=1+player.gun.damageLv+player.gun.rateLv+player.gun.magLv;
  refreshUpgradePanel();updateHud();showLoot('업그레이드 완료');
}
function updateHud(){
  $('hp').textContent=Math.ceil(player.hp)+'/'+player.maxHp;$('hpBar').style.width=clamp(player.hp/player.maxHp*100,0,100)+'%';
  $('wave').textContent=Math.max(1,Math.floor(waveClock/35)+1);$('kills').textContent=player.kills;$('parts').textContent=player.parts;
  const s=gunStats(),g=player.gun;$('weapon').textContent=WEAPONS[g.id].name+' Lv.'+g.level;
  $('ammo').textContent=(g.reloading>0?'재장전 ':g.ammo+' / '+g.reserve)+' · 탄창 '+s.mag;
}
function update(dt){
  if(!running)return;
  waveClock+=dt;spawnClock-=dt;const wave=Math.max(1,Math.floor(waveClock/35)+1);
  if(spawnClock<=0){spawnZombie();spawnClock=Math.max(.32,1.35-wave*.055)}
  let mx=moveInput.x,my=moveInput.y;
  if(keys.has('KeyW')||keys.has('ArrowUp'))my-=1;if(keys.has('KeyS')||keys.has('ArrowDown'))my+=1;if(keys.has('KeyA')||keys.has('ArrowLeft'))mx-=1;if(keys.has('KeyD')||keys.has('ArrowRight'))mx+=1;
  if(mx||my){const n=norm(mx,my);player.x+=n.x*player.speed*dt;player.y+=n.y*player.speed*dt}
  player.x=clamp(player.x,player.r,world.w-player.r);player.y=clamp(player.y,player.r,world.h-player.r);player.invuln=Math.max(0,player.invuln-dt);
  if(Math.hypot(aimInput.x,aimInput.y)>.38||pointer.down)tryShoot();
  const g=player.gun;
  if(g.reloading>0){g.reloading-=dt;if(g.reloading<=0){const need=gunStats().mag-g.ammo,take=Math.min(need,g.reserve);g.ammo+=take;g.reserve-=take;g.reloading=0}}
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;let hit=b.x<0||b.x>world.w||b.y<0||b.y>world.h||b.life<=0;
    if(!hit){
      for(let j=zombies.length-1;j>=0;j--){
        const z=zombies[j],rr=z.r+b.r,dx=b.x-z.x,dy=b.y-z.y;
        if(dx*dx+dy*dy<=rr*rr){
          z.hp-=b.damage;z.hit=.09;hit=true;
          for(let p=0;p<4;p++)particles.push({x:b.x,y:b.y,vx:rand(-75,75),vy:rand(-75,75),life:.25,size:rand(2,5),color:'#a7d27e'});
          if(z.hp<=0){zombies.splice(j,1);player.kills++;player.parts+=Math.random()<.28?2:1}break;
        }
      }
    }
    if(hit)bullets.splice(i,1);
  }
  for(let i=zombies.length-1;i>=0;i--){
    const z=zombies[i];z.hit=Math.max(0,z.hit-dt);const dx=player.x-z.x,dy=player.y-z.y,d=Math.hypot(dx,dy)||1;
    z.x+=dx/d*z.speed*dt;z.y+=dy/d*z.speed*dt;
    const pd=Math.hypot(player.x-z.x,player.y-z.y);
    if(pd<player.r+z.r+3&&player.invuln<=0){
      player.hp-=z.damage;player.invuln=.55;const push=norm(player.x-z.x,player.y-z.y);player.x+=push.x*18;player.y+=push.y*18;
      if(player.hp<=0){player.hp=0;gameOver();break}
    }
  }
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}
  camera.x=clamp(player.x-W/2,0,Math.max(0,world.w-W));camera.y=clamp(player.y-H/2,0,Math.max(0,world.h-H));updateHud();
}
function drawGrid(){
  ctx.fillStyle='#202821';ctx.fillRect(0,0,W,H);const size=80,ox=-(camera.x%size),oy=-(camera.y%size);
  ctx.strokeStyle='rgba(255,255,255,.035)';ctx.lineWidth=1;
  for(let x=ox;x<W;x+=size){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=oy;y<H;y+=size){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
}
function draw(){
  drawGrid();ctx.save();ctx.translate(-camera.x,-camera.y);
  ctx.fillStyle='#29362d';ctx.fillRect(930,670,340,260);ctx.fillStyle='#39463c';ctx.fillRect(950,690,300,220);
  ctx.fillStyle='#d6b35a';ctx.fillRect(1080,735,40,110);ctx.fillStyle='#131916';ctx.font='bold 16px system-ui';ctx.fillText('안전 작업장',1040,720);
  for(const b of buildings){
    ctx.fillStyle='#303833';ctx.fillRect(b.x,b.y,b.w,b.h);ctx.fillStyle='#1a211d';ctx.fillRect(b.x+12,b.y+12,b.w-24,b.h-24);
    ctx.strokeStyle='#55625a';ctx.lineWidth=4;ctx.strokeRect(b.x+2,b.y+2,b.w-4,b.h-4);ctx.fillStyle='#b9c7bc';
    for(let wx=b.x+36;wx<b.x+b.w-30;wx+=72)ctx.fillRect(wx,b.y+24,32,20);
  }
  for(const c of chests){
    ctx.fillStyle=c.opened?'#4a4d47':'#b87932';ctx.fillRect(c.x-18,c.y-14,36,28);ctx.fillStyle=c.opened?'#242824':'#e2b65f';ctx.fillRect(c.x-18,c.y-4,36,5);
    if(!c.opened&&dist2(player,c)<85*85){ctx.strokeStyle='#f7e7a8';ctx.lineWidth=2;ctx.beginPath();ctx.arc(c.x,c.y,30,0,Math.PI*2);ctx.stroke()}
  }
  for(const p of particles){ctx.globalAlpha=clamp(p.life*5,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
  for(const b of bullets){
    const n=norm(b.vx,b.vy);ctx.strokeStyle=b.color;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(b.x-n.x*15,b.y-n.y*15);ctx.lineTo(b.x+n.x*4,b.y+n.y*4);ctx.stroke();
    ctx.fillStyle='#fff8cf';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
  }
  for(const z of zombies){
    ctx.fillStyle=z.hit>0?'#d6e9c6':z.type==='runner'?'#789f62':z.type==='brute'?'#557047':'#678858';ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#20261f';ctx.beginPath();ctx.arc(z.x-5,z.y-4,2.5,0,Math.PI*2);ctx.arc(z.x+5,z.y-4,2.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#141914';ctx.fillRect(z.x-z.r,z.y-z.r-9,z.r*2,4);ctx.fillStyle='#85c96b';ctx.fillRect(z.x-z.r,z.y-z.r-9,z.r*2*(z.hp/z.maxHp),4);
  }
  const face=pointer.active?norm(pointer.x+camera.x-player.x,pointer.y+camera.y-player.y):norm(aimInput.x||1,aimInput.y);
  ctx.save();ctx.translate(player.x,player.y);ctx.rotate(Math.atan2(face.y,face.x));ctx.fillStyle=player.invuln>0?'#f2e2d4':'#d9e2dd';ctx.beginPath();ctx.arc(0,0,player.r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#1b211d';ctx.fillRect(5,-4,25,8);ctx.fillStyle='#9da9a0';ctx.fillRect(18,-3,16,6);ctx.restore();ctx.restore();
  $('interact').style.opacity=chests.some(c=>!c.opened&&dist2(player,c)<70*70)?'1':'.55';
}
function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
function gameOver(){running=false;$('result').textContent='웨이브 '+Math.max(1,Math.floor(waveClock/35)+1)+' · 좀비 '+player.kills+'마리 처치';$('dead').classList.add('show')}
function restart(){
  player.x=1100;player.y=800;player.hp=100;player.parts=0;player.kills=0;player.gun=makeGun('pistol');player.invuln=0;
  bullets.length=0;zombies.length=0;particles.length=0;chests.forEach(c=>c.opened=false);waveClock=0;spawnClock=0;running=true;$('dead').classList.remove('show');showTip('새 생존 시작');
}
function setupJoy(el,target,onAim=false){
  const knob=el.querySelector('.knob');let pid=null;
  const reset=()=>{target.x=0;target.y=0;knob.style.transform='translate(0px,0px)';pid=null};
  el.addEventListener('pointerdown',e=>{pid=e.pointerId;el.setPointerCapture(pid);move(e)});
  el.addEventListener('pointermove',e=>{if(e.pointerId===pid)move(e)});
  el.addEventListener('pointerup',e=>{if(e.pointerId===pid)reset()});el.addEventListener('pointercancel',reset);
  function move(e){
    const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,l=Math.hypot(dx,dy),max=r.width*.34;
    if(l>max){dx=dx/l*max;dy=dy/l*max;l=max}target.x=dx/max;target.y=dy/max;knob.style.transform='translate('+dx+'px,'+dy+'px)';if(onAim&&l>max*.38)pointer.active=false;
  }
}
setupJoy($('moveJoy'),moveInput,false);setupJoy($('aimJoy'),aimInput,true);
canvas.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const r=canvas.getBoundingClientRect();pointer.x=e.clientX-r.left;pointer.y=e.clientY-r.top;pointer.active=true});
canvas.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;pointer.down=true;pointer.active=true;const r=canvas.getBoundingClientRect();pointer.x=e.clientX-r.left;pointer.y=e.clientY-r.top;tryShoot()});
addEventListener('pointerup',e=>{if(e.pointerType==='mouse')pointer.down=false});
addEventListener('keydown',e=>{keys.add(e.code);if(e.code==='KeyE')openNearestChest();if(e.code==='KeyR')startReload();if(e.code==='KeyU'){$('upgradePanel').classList.add('open');refreshUpgradePanel()}});
addEventListener('keyup',e=>keys.delete(e.code));
$('interact').addEventListener('click',openNearestChest);$('reload').addEventListener('click',startReload);
$('upgrade').addEventListener('click',()=>{$('upgradePanel').classList.add('open');refreshUpgradePanel()});
$('closeUpgrade').addEventListener('click',()=>$('upgradePanel').classList.remove('open'));
document.querySelectorAll('[data-up]').forEach(b=>b.addEventListener('click',()=>buyUpgrade(b.dataset.up)));$('restart').addEventListener('click',restart);
showTip('왼쪽 이동 · 오른쪽 조준/사격 · 건물 안 상자를 찾아봐',3500);updateHud();
})();
</script>
