<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#74c9ff">
<title>놀이공원 타이쿤</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#78c9f1;color:#fff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;touch-action:none}
button{font:inherit}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;background:#78c9f1}
.panel{background:#102437e8;border:1px solid #ffffff35;border-radius:13px;box-shadow:0 8px 22px #0005;backdrop-filter:blur(5px)}
#hud{position:fixed;left:7px;right:7px;top:max(7px,env(safe-area-inset-top));z-index:20;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;pointer-events:none}
#stats{padding:7px 8px;display:flex;gap:5px;align-items:center;flex-wrap:wrap;min-width:0}
.pill{padding:4px 7px;border-radius:999px;background:#ffffff18;border:1px solid #ffffff22;font-size:10px;font-weight:900;white-space:nowrap}
#parkState{padding:7px 8px;text-align:right;min-width:88px}
#parkState b{display:block;color:#ffe48c;font-size:11px}
#parkState span{display:block;color:#d8e7ef;font-size:8px;margin-top:2px}
#tools{position:fixed;right:7px;top:72px;z-index:25;display:flex;gap:5px}
.tool{width:42px;height:42px;border:1px solid #ffffff50;border-radius:12px;background:#133752e8;color:#fff;font-weight:1000;box-shadow:0 5px 14px #0004}
#hint{position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:24;max-width:72vw;padding:7px 10px;border-radius:999px;background:#0b1c29df;border:1px solid #ffffff32;font-size:9px;font-weight:900;text-align:center;pointer-events:none}
#buildBar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:7px 7px max(8px,env(safe-area-inset-bottom));background:#0b1a27ed;border-top:1px solid #ffffff2f;box-shadow:0 -8px 24px #0005}
#buildScroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
#buildScroll::-webkit-scrollbar{display:none}
.buildBtn{flex:0 0 auto;min-width:74px;min-height:58px;padding:5px 7px;border:1px solid #ffffff29;border-radius:12px;background:#17364de8;color:#fff}
.buildBtn b{display:block;font-size:10px}
.buildBtn small{display:block;margin-top:2px;color:#a9c9da;font-size:8px}
.buildBtn.on{background:#2d7db2;border-color:#9bdbff;outline:2px solid #ffffff55}
.buildBtn:disabled{opacity:.38}
#cancelBuild{background:#5a3640}
#info{position:fixed;left:7px;right:7px;bottom:82px;z-index:29;display:none;padding:8px 9px;align-items:center;justify-content:space-between;gap:8px}
#info.on{display:flex}
#infoText{min-width:0}
#infoText b{display:block;color:#ffe48c;font-size:11px}
#infoText span{display:block;margin-top:2px;color:#d8e7ef;font-size:8px;line-height:1.35}
#infoActions{display:flex;gap:6px;flex:0 0 auto}
.infoBtn{min-height:38px;padding:0 10px;border:0;border-radius:10px;background:#2c86bf;color:#fff;font-size:9px;font-weight:1000}
.infoBtn:disabled{opacity:.42}
#toast{position:fixed;left:50%;top:22%;transform:translate(-50%,-8px);z-index:100;max-width:84vw;padding:9px 12px;border-radius:12px;background:#07121bed;border:1px solid #ffffff3c;font-size:10px;font-weight:900;text-align:center;opacity:0;transition:.18s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
.overlay{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;padding:16px;background:#07131dda}
.card{width:min(94vw,470px);padding:20px 17px;border:1px solid #ffffff2f;border-radius:20px;background:#102637;box-shadow:0 20px 60px #0008;text-align:center}
.card h1{margin:0 0 8px;color:#ffe48c;font-size:27px}
.card p{margin:7px 0;color:#d5e4eb;font-size:11px;line-height:1.55}
#startBtn{width:100%;min-height:50px;margin-top:13px;border:0;border-radius:14px;background:#2f94cf;color:#fff;font-size:15px;font-weight:1000}
.note{margin-top:9px;padding:8px;border-radius:10px;background:#ffffff0b;color:#a9c2ce;font-size:9px;line-height:1.45}
@media(max-width:390px){
  .pill{font-size:9px;padding:4px 6px}
  #parkState{min-width:78px}
  #tools{top:69px}
  #hint{top:72px;font-size:8px}
  .buildBtn{min-width:68px;min-height:56px}
  #info{bottom:80px}
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="stats" class="panel">
    <span class="pill" id="moneyText">2,500G</span>
    <span class="pill" id="satText">만족도 75</span>
    <span class="pill" id="guestText">손님 0</span>
    <span class="pill" id="trashText">쓰레기 0</span>
    <span class="pill" id="cleanerText">청소부 0/3</span>
  </div>
  <div id="parkState" class="panel"><b id="stateTitle">카운터 필요</b><span id="stateSub">첫 건물은 카운터</span></div>
</div>

<div id="tools">
  <button class="tool" id="rotateBtn" type="button" aria-label="카메라 회전">↻</button>
  <button class="tool" id="soundBtn" type="button" aria-label="음악 켜기/끄기">♪</button>
</div>

<div id="hint">카운터를 원하는 자리에 먼저 설치해.</div>

<div id="info" class="panel">
  <div id="infoText"><b>시설</b><span>정보</span></div>
  <div id="infoActions"></div>
</div>

<div id="buildBar">
  <div id="buildScroll"></div>
</div>

<div id="toast"></div>

<div id="start" class="overlay">
  <div class="card">
    <h1>놀이공원 타이쿤</h1>
    <p>정해진 건설 자리는 없어. 카운터를 먼저 만들고 길을 이어서 놀이기구, 음식점, 화장실을 자유롭게 배치해.</p>
    <p>시설은 길과 붙어 있어야 손님이 이용할 수 있어. 줄이 길거나 쓰레기가 많으면 만족도가 내려가고 수입도 줄어.</p>
    <button id="startBtn" type="button">놀이공원 열기</button>
    <div class="note">모바일: 아래 건설 버튼 선택 → 땅 터치<br>시설을 직접 누르면 업그레이드·청소부 고용 가능</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(function(){
"use strict";

if(!window.THREE){
  document.querySelector(".card").innerHTML="<h1>로딩 실패</h1><p>3D 엔진을 불러오지 못했어. 인터넷 연결 후 다시 열어.</p>";
  return;
}

var SAVE_KEY="amusement-tycoon-v1";
var GRID=16,TILE=2,HALF=GRID/2;
var CLEANER_HIRE_COST=100;
var FOOD_UP_BASE=Math.round(CLEANER_HIRE_COST*1.5);
var BUILD_DEFS={
  counter:{name:"카운터",cost:0,kind:"counter",cap:0,time:0},
  path:{name:"길",cost:10,kind:"path",cap:0,time:0},
  bin:{name:"쓰레기통",cost:35,kind:"bin",cap:0,time:0},
  toilet:{name:"화장실",cost:180,kind:"toilet",cap:3,time:15,income:5},
  cleaner:{name:"청소부 고용소",cost:120,kind:"cleaner",cap:0,time:0},
  burger:{name:"햄버거 가게",cost:220,kind:"food",cap:4,time:45,income:30},
  icecream:{name:"아이스크림 가게",cost:220,kind:"food",cap:4,time:45,income:25},
  carousel:{name:"회전목마",cost:300,kind:"ride",cap:4,time:45,income:35,ride:"gentle"},
  pirate:{name:"바이킹",cost:420,kind:"ride",cap:6,time:45,income:45,ride:"thrill"},
  bumper:{name:"범퍼카",cost:500,kind:"ride",cap:6,time:45,income:50,ride:"family"},
  ferris:{name:"대관람차",cost:650,kind:"ride",cap:8,time:45,income:55,ride:"gentle"},
  coaster:{name:"롤러코스터",cost:900,kind:"ride",cap:8,time:45,income:70,ride:"thrill"}
};
var BUILD_ORDER=["counter","path","bin","toilet","cleaner","burger","icecream","carousel","pirate","bumper","ferris","coaster"];
var TRAITS=[
  {id:"coward",name:"겁쟁이",prefs:{carousel:5,ferris:5,bumper:3,pirate:1,coaster:.5,burger:2,icecream:2,toilet:2}},
  {id:"thrill",name:"스릴광",prefs:{carousel:1,ferris:2,bumper:4,pirate:5,coaster:6,burger:2,icecream:2,toilet:2}},
  {id:"family",name:"가족형",prefs:{carousel:5,ferris:4,bumper:5,pirate:2,coaster:2,burger:3,icecream:4,toilet:3}},
  {id:"foodie",name:"먹보형",prefs:{carousel:2,ferris:2,bumper:2,pirate:2,coaster:2,burger:6,icecream:6,toilet:2}},
  {id:"balanced",name:"골고루형",prefs:{carousel:3,ferris:3,bumper:3,pirate:3,coaster:3,burger:3,icecream:3,toilet:3}}
];

var state={
  money:2500,baseSat:75,cleaners:0,nextId:1,buildings:[]
};
function load(){
  try{
    var s=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");
    if(s&&Array.isArray(s.buildings)){
      state.money=Math.max(0,Number(s.money)||0);
      state.baseSat=Math.max(20,Math.min(100,Number(s.baseSat)||75));
      state.cleaners=Math.max(0,Math.min(3,Number(s.cleaners)||0));
      state.nextId=Math.max(1,Number(s.nextId)||1);
      state.buildings=s.buildings.filter(function(b){return BUILD_DEFS[b.type]&&Number.isFinite(b.gx)&&Number.isFinite(b.gz);});
    }
  }catch(e){}
}
function save(){
  try{
    localStorage.setItem(SAVE_KEY,JSON.stringify({
      money:Math.round(state.money),
      baseSat:state.baseSat,
      cleaners:state.cleaners,
      nextId:state.nextId,
      buildings:state.buildings.map(function(b){return{id:b.id,type:b.type,gx:b.gx,gz:b.gz,level:b.level||0};})
    }));
  }catch(e){}
}
load();

var renderer=new THREE.WebGLRenderer({canvas:document.getElementById("game"),antialias:false,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.4));
renderer.setSize(innerWidth,innerHeight,false);
renderer.outputColorSpace=THREE.SRGBColorSpace;

var scene=new THREE.Scene();
scene.background=new THREE.Color(0x87d5f4);
scene.fog=new THREE.Fog(0x87d5f4,34,60);

var camera=new THREE.PerspectiveCamera(46,innerWidth/innerHeight,.1,100);
var cameraAngle=Math.PI/4;
function updateCamera(){
  var dist=innerWidth<520?34:30;
  camera.position.set(Math.sin(cameraAngle)*dist,25,Math.cos(cameraAngle)*dist);
  camera.lookAt(0,0,0);
}
updateCamera();

scene.add(new THREE.HemisphereLight(0xe8f7ff,0x4a6d3e,2.1));
var sun=new THREE.DirectionalLight(0xfff2c8,2.2);
sun.position.set(-12,24,10);
scene.add(sun);

var world=new THREE.Group();
scene.add(world);
var ground=new THREE.Mesh(new THREE.PlaneGeometry(GRID*TILE,GRID*TILE),new THREE.MeshLambertMaterial({color:0x78b85b}));
ground.rotation.x=-Math.PI/2;
ground.position.y=-.05;
ground.userData.ground=true;
world.add(ground);
var gridHelper=new THREE.GridHelper(GRID*TILE,GRID,0x4e7b3d,0x6ca04f);
gridHelper.position.y=.01;
world.add(gridHelper);

function mat(c){return new THREE.MeshLambertMaterial({color:c});}
function box(w,h,d,c){
  var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));
  m.position.y=h/2;
  return m;
}
function cyl(r1,r2,h,c,seg){
  var m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,seg||12),mat(c));
  m.position.y=h/2;
  return m;
}
function sphere(r,c){return new THREE.Mesh(new THREE.SphereGeometry(r,10,8),mat(c));}
  return new THREE.Mesh(new THREE.SphereGeometry(r,10,8),mat(c));
}
  return new THREE.Mesh(new THREE.SphereGeometry(r,10,8),mat(c));
}
  return new THREE.Mesh(new THREE.SphereGeometry(r,10,8),mat(c));
}
function worldPos(gx,gz){return new THREE.Vector3((gx-HALF+.5)*TILE,0,(gz-HALF+.5)*TILE);}
function key(gx,gz){return gx+","+gz;}
function inside(gx,gz){return gx>=0&&gz>=0&&gx<GRID&&gz<GRID;}
function adjacentCells(gx,gz){
  return [[gx+1,gz],[gx-1,gz],[gx,gz+1],[gx,gz-1]].filter(function(p){return inside(p[0],p[1]);});
}

var visualById={},buildingByCell={},paths={},runtime={};
function burger(fr){var baseColor=0xe69b54;g.add(box(1.6,1.1,1.5,baseColor));var fr=box(1.75,0.2,1.6,0x3b7657);fr.position.y=1.22;g.add(fr);}
function registerObject(group,id){
  group.traverse(function(o){if(o.isMesh)o.userData.buildingId=id;});
}
function createBuildingVisual(b){
  var def=BUILD_DEFS[b.type],g=new THREE.Group(),p=worldPos(b.gx,b.gz);
  g.position.set(p.x,0,p.z);
  g.userData.buildingId=b.id;
  if(b.type==="path"){var q=seeds.slice();
    var pm=box(1.88,.08,1.88,0xd8c29d);pm.position.y=.04;g.add(pm);
  }else if(b.type==="counter"){
    g.add(box(1.5,.75,1.1,0xf2d36b));
    var roof=box(1.7,.18,1.3,0xe65353);roof.position.y=1;g.add(roof);
    var sign=box(.9,.35,.12,0xffffff);sign.position.set(0,1.38,-.55);g.add(sign);
  }else if(b.type==="bin"){
    var bm=cyl(.28,.34,.65,0x315c72,10);bm.position.y=.33;g.add(bm);
    var lid=cyl(.38,.38,.12,0x24485b,10);lid.position.y=.72;g.add(lid);
  }else if(b.type==="toilet"){
    g.add(box(1.5,1.4,1.45,0xa5d5e8));
    var tr=box(1.65,.2,1.6,0xffffff);tr.position.y=1.5;g.add(tr);
    var door=box(.48,.9,.08,0x4f7690);door.position.set(0,.52,-.76);g.add(door);
  }else if(b.type==="cleaner"){
    g.add(box(1.5,1.1,1.4,0x8dc7a5));
    var cr=box(1.7,.2,1.6,0x3b7657);cr.position.y=1.22;g.add(cr);
    var broom=box(.08,1.3,.08,0xb6844c);broom.position.set(.55,.7,-.77);broom.rotation.z=.25;g.add(broom);
  }else if(b.type==="burger"||b.type==="icecream"){
    var baseColor=b.type==="burger"?0xe69b54:0xf4b8d5;
    g.add(box(1.6,1.1,1.5,baseColor));
    var fr=box(1.75,.18,1.65,0xffffff);fr.position.y=1.25;g.add(fr);
    var aw=box(1.7,.24,.28,b.type==="burger"?0xd95448:0x7ec5ea);aw.position.set(0,1.02,-.83);g.add(aw);
    var icon=sphere(.28,b.type==="burger"?0x8c4a28:0xffe5f1);icon.position.set(0,1.58,0);g.add(icon);
  }else if(b.type==="carousel"){
    var base=cyl(.82,.82,.14,0xe9c75d,18);base.position.y=.07;g.add(base);
    var pole=cyl(.09,.09,1.5,0xf8f0c8,10);pole.position.y=.85;g.add(pole);
    var roof=new THREE.Mesh(new THREE.ConeGeometry(1.05,.55,12),mat(0xf06f6f));roof.position.y=1.72;g.add(roof);
    var spin=new THREE.Group();spin.name="anim";spin.position.y=.55;
    for(var i=0;i<4;i++){var a=i*Math.PI/2,seat=box(.25,.24,.36,0x74b8e8);seat.position.set(Math.sin(a)*.62,0,Math.cos(a)*.62);spin.add(seat);}
    g.add(spin);
  }else if(b.type==="pirate"){
    var stand=box(1.75,.12,1.25,0xd9c89f);stand.position.y=.06;g.add(stand);
    var frame=box(.1,1.45,.1,0x5e6772);frame.position.set(-.65,.75,0);g.add(frame);
    var frame2=frame.clone();frame2.position.x=.65;g.add(frame2);
    var swing=new THREE.Group();swing.name="anim";swing.position.y=.95;
    var boat=box(1.25,.35,.55,0x87532c);boat.position.y=-.25;swing.add(boat);g.add(swing);
  }else if(b.type==="bumper"){
    var arena=box(1.8,.14,1.8,0xb8cad1);arena.position.y=.07;g.add(arena);
    var rail=box(1.9,.3,.08,0x47687b);rail.position.set(0,.28,-.9);g.add(rail);
    var rail2=rail.clone();rail2.position.z=.9;g.add(rail2);
    var spin2=new THREE.Group();spin2.name="anim";
    for(var j=0;j<3;j++){var car=box(.42,.22,.32,[0xe95555,0x55a6e9,0xf2c84b][j]);car.position.set(-.55+j*.55,.22,(j%2?1:-1)*.3);spin2.add(car);}
    g.add(spin2);
  }else if(b.type==="ferris"){
    var baseF=box(1.6,.12,1.1,0xc9c7bd);baseF.position.y=.06;g.add(baseF);
    var support1=box(.12,1.55,.12,0x536d7b);support1.position.set(-.48,.75,0);support1.rotation.z=-.33;g.add(support1);
    var support2=support1.clone();support2.position.x=.48;support2.rotation.z=.33;g.add(support2);
    var wheel=new THREE.Group();wheel.name="anim";wheel.position.y=1.28;wheel.rotation.y=Math.PI/2;
    var ring=new THREE.Mesh(new THREE.TorusGeometry(.83,.07,6,18),mat(0xf4d35e));wheel.add(ring);
    for(var k=0;k<6;k++){var aa=k/6*Math.PI*2,seatF=box(.2,.18,.2,0xe96f6f);seatF.position.set(Math.cos(aa)*.83,Math.sin(aa)*.83,0);wheel.add(seatF);}
    g.add(wheel);
  }else if(b.type==="coaster"){
    var baseC=box(1.9,.1,1.9,0xd6c2a0);baseC.position.y=.05;g.add(baseC);
    var rail1=box(1.55,.08,.08,0xd84f4f);rail1.position.set(0,.65,-.58);g.add(rail1);
    var rail2=rail1.clone();rail2.position.z=.58;g.add(rail2);
    var turn1=box(.08,.08,1.24,0xd84f4f);turn1.position.set(-.75,.65,0);g.add(turn1);
    var turn2=turn1.clone();turn2.position.x=.75;g.add(turn2);
    var posts=[[-.75,-.58],[-.75,.58],[.75,-.58],[.75,.58]];
    posts.forEach(function(v){var pp=box(.07,.65,.07,0x596b74);pp.position.set(v[0],.32,v[1]);g.add(pp);});
    var carC=box(.35,.22,.28,0x55a5e8);carC.name="anim";carC.position.set(-.65,.82,-.58);g.add(carC);
  }
  registerObject(g,b.id);
  world.add(g);
  visualById[b.id]=g;
  return g;
}
function rebuildWorldFromState(){
  Object.keys(visualById).forEach(function(id){world.remove(visualById[id]);});
  visualById={};buildingByCell={};paths={};runtime={};
  state.buildings.forEach(function(b){
    buildingByCell[key(b.gx,b.gz)]=b;
    if(b.type==="path")paths[key(b.gx,b.gz)]=b;
    runtime[b.id]={queue:[],active:[]};
    createBuildingVisual(b);
  });
  syncCleanerVisuals();
}
rebuildWorldFromState();

function makePerson(color){
  var g=new THREE.Group();
  var body=cyl(.18,.22,.48,color,8);body.position.y=.28;g.add(body);
  var head=sphere(.17,0xffd6b5);head.position.y=.68;g.add(head);
  return g;
}
function syncCleanerVisuals(){
  cleanerMeshes.forEach(function(m){world.remove(m);});
  cleanerMeshes=[];
  var station=state.buildings.find(function(b){return b.type==="cleaner";});
  if(!station)return;
  for(var i=0;i<state.cleaners;i++){
    var m=makePerson(0x55b47a),p=worldPos(station.gx,station.gz);
    m.position.set(p.x+(i-1)*.35,.02,p.z+.65);world.add(m);cleanerMeshes.push(m);
  }
}

function isCounterBuilt(){return state.buildings.some(function(b){return b.type==="counter";});}
function counter(){return state.buildings.find(function(b){return b.type==="counter";});}
function hasAdjacentPath(gx,gz){
  return adjacentCells(gx,gz).some(function(p){return !!paths[key(p[0],p[1])];});
}
function canPlacePath(gx,gz){
  if(buildingByCell[key(gx,gz)])return false;
  var c=counter();
  if(!c)return false;
  return adjacentCells(gx,gz).some(function(p){
    return paths[key(p[0],p[1])]||(p[0]===c.gx&&p[1]===c.gz);
  });
}
function connectedPathKeys(){
  var c=counter(),seen={};
  if(!c)return seen;

  pointer.y=-((ev.clientY-rect.top)/rect.height)*2+1;

  var sat=currentSatisfaction();
  var interval=Math.max(2600,5200-sat*24);
  if(now-lastSpawn>interval&&guests.length<28)spawnGuest(now);
  updateGuests(dt,now);
  animateRides(now);
  hudAccum+=dt;saveAccum+=dt;
  if(hudAccum>.35){updateHud();if(selectedId)renderInfo();hudAccum=0;}
  if(saveAccum>5){save();saveAccum=0;}
  renderer.render(scene,camera);
}
requestAnimationFrame(loop);

})();
</script>
