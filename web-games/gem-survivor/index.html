<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1422">
<title>보석 생존전</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09111d;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;z-index:5;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 9px) 10px 0;pointer-events:none}
.top{display:flex;justify-content:space-between;gap:7px}
.pill{padding:7px 9px;border:1px solid #ffffff24;border-radius:13px;background:#071321d9;box-shadow:0 5px 18px #0007;font-size:12px;font-weight:900}
.pill b{color:#74f0c8}
.bars{display:grid;gap:5px;margin-top:7px}
.label{display:flex;justify-content:space-between;margin:0 2px 2px;font-size:10px;font-weight:900;color:#c8dcf3}
.bar{height:11px;border-radius:99px;overflow:hidden;border:1px solid #ffffff24;background:#ffffff16}
.bar>i{display:block;height:100%;transition:width .12s}
.hp>i{background:linear-gradient(90deg,#ff5470,#ff9c5b)}
.gem>i{background:linear-gradient(90deg,#40eeb7,#66baff)}
.bossHud{position:fixed;z-index:6;top:calc(env(safe-area-inset-top) + 100px);left:50%;transform:translateX(-50%);width:min(84vw,460px);display:none}
.bossHud.show{display:block}
.bossHud .label{color:#ffd0d0}.bossHud .bar>i{background:linear-gradient(90deg,#ff404f,#b357ff)}
.joystick{position:fixed;z-index:7;left:18px;bottom:calc(env(safe-area-inset-bottom) + 22px);width:116px;height:116px;border-radius:50%;border:2px solid #7ef5d05e;background:#112b3788;box-shadow:inset 0 0 25px #51ffd21a}
.stick{position:absolute;left:31px;top:31px;width:54px;height:54px;border-radius:50%;background:#dbfff4da;border:3px solid #65efc8;box-shadow:0 0 18px #54efc899;transform:translate(0,0)}
.pause{position:fixed;z-index:8;right:11px;top:calc(env(safe-area-inset-top) + 58px);width:42px;height:42px;border-radius:13px;border:1px solid #ffffff2b;background:#14253edb;color:#fff;font-size:18px;font-weight:950}
.tip{position:fixed;z-index:4;left:50%;bottom:8px;transform:translateX(-50%);font-size:10px;font-weight:800;color:#9db4cb;white-space:nowrap;pointer-events:none}
.phase{position:fixed;z-index:6;left:50%;top:calc(env(safe-area-inset-top) + 112px);transform:translateX(-50%);padding:6px 10px;border:1px solid #ffffff1f;border-radius:999px;background:#071321d6;font-size:11px;font-weight:900;color:#d9e8f8;pointer-events:none}
.overlay{position:fixed;z-index:20;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:#020811dc;backdrop-filter:blur(7px)}
.overlay.show{display:flex}
.panel{width:min(100%,440px);max-height:90vh;overflow:auto;border:1px solid #78c9bd44;border-radius:24px;background:linear-gradient(180deg,#13283b,#0b1728);box-shadow:0 24px 70px #000b;padding:20px}
.eyebrow{font-size:11px;letter-spacing:.12em;color:#6ef0c9;font-weight:950}
.panel h1,.panel h2{margin:4px 0 8px}
.panel p{margin:0 0 15px;color:#b8c9dc;font-size:13px;line-height:1.5}
.wide,.choice{width:100%;border:1px solid #8be4cd44;border-radius:16px;color:#fff;font-weight:900}
.wide{min-height:56px;background:#187d6c;font-size:15px}
.choices{display:grid;gap:9px}
.choice{min-height:68px;padding:11px 13px;text-align:left;background:#153247}
.choice b{display:block;font-size:15px}.choice small{display:block;margin-top:4px;color:#b8cadc;font-size:12px;line-height:1.35}
.abilityList{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}
.abilityBadge{padding:7px 9px;border-radius:12px;background:#ffffff0d;border:1px solid #ffffff17;color:#bcd0df;font-size:11px;font-weight:800}
.result{margin:9px 0 16px;padding:10px;border-radius:13px;background:#ffffff0d;color:#d8e9f5;font-size:12px;line-height:1.55}
@media(max-width:370px){.joystick{width:102px;height:102px}.stick{left:27px;top:27px;width:48px;height:48px}.pill{font-size:11px;padding:6px 7px}.phase{font-size:10px}.panel{padding:17px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">
 <div class="top">
  <div class="pill">보석 <b id="gemCount">0</b> / <b id="gemNeed">3</b></div>
  <div class="pill">처치 <b id="kills">0</b> · <b id="time">0:00</b> / 5:00</div>
 </div>
 <div class="bars">
  <div><div class="label"><span>HP</span><span id="hpText">100 / 100</span></div><div class="bar hp"><i id="hpBar"></i></div></div>
  <div><div class="label"><span>다음 능력</span><span id="gemText">0 / 3</span></div><div class="bar gem"><i id="gemBar"></i></div></div>
 </div>
</div>
<div id="phase" class="phase">기본 적 4종 등장 중</div>
<div id="bossHud" class="bossHud"><div class="label"><span>보석 포식자</span><span id="bossHpText"></span></div><div class="bar"><i id="bossHpBar"></i></div></div>
<button id="pauseBtn" class="pause" aria-label="일시정지">Ⅱ</button>
<div id="joystick" class="joystick" aria-label="이동 조이스틱"><div id="stick" class="stick"></div></div>
<div class="tip">이동만 하면 공격은 자동으로 나가</div>

<div id="startOverlay" class="overlay show"><div class="panel">
 <div class="eyebrow">5분 생존 액션</div><h1>보석 생존전</h1>
 <p>몬스터를 잡아 보석을 모으고 능력을 골라. 2분과 3분 30초에 새로운 적이 합류하고, 5분에 보스가 등장해. 보스를 잡으면 클리어야.</p>
 <button id="startBtn" class="wide">게임 시작</button>
</div></div>

<div id="choiceOverlay" class="overlay"><div class="panel">
 <div class="eyebrow">능력 선택</div><h2>3개 중 하나 선택</h2>
 <p>선택할 때마다 다음 능력에 필요한 보석 수가 1.65배로 올라가.</p>
 <div id="choices" class="choices"></div>
 <div id="abilityList" class="abilityList"></div>
</div></div>

<div id="pauseOverlay" class="overlay"><div class="panel"><h2>일시정지</h2><p>현재 진행 상태는 그대로 유지돼.</p><button id="resumeBtn" class="wide">계속하기</button></div></div>
<div id="endOverlay" class="overlay"><div class="panel"><div id="endEyebrow" class="eyebrow"></div><h2 id="endTitle"></h2><div id="result" class="result"></div><button id="restartBtn" class="wide">다시 시작</button></div></div>

<script>
(()=>{
'use strict';

// ==================== 기본 설정 ====================
const SURVIVE_SECONDS=300;
const PHASE_TWO_SECONDS=120;
const PHASE_THREE_SECONDS=210;
const INITIAL_GEM_NEED=3;
const GEM_NEED_MULTIPLIER=1.65;

const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const $=function(id){return document.getElementById(id)};
const ui={
 gemCount:$('gemCount'),gemNeed:$('gemNeed'),kills:$('kills'),time:$('time'),
 hpText:$('hpText'),hpBar:$('hpBar'),gemText:$('gemText'),gemBar:$('gemBar'),
 phase:$('phase'),bossHud:$('bossHud'),bossHpText:$('bossHpText'),bossHpBar:$('bossHpBar')
};

let W=innerWidth,H=innerHeight,DPR=1,last=performance.now();
let running=false,paused=true,elapsed=0,spawnTimer=0,kills=0,bossSpawned=false,boss=null,audio=null,screenShake=0;
const keys=new Set(),enemies=[],projectiles=[],gems=[],effects=[],poisonPools=[],particles=[];
const joy={id:null,dx:0,dy:0};

const player={
 x:0,y:0,r:15,hp:100,maxHp:100,speed:220,inv:0,
 gems:0,gemNeed:INITIAL_GEM_NEED,choices:0,
 basicDamage:16,basicRate:.55,basicTimer:0,basicSpeed:550,magnet:92
};

const abilityLv={arrow:0,poison:0,orbit:0,lightning:0,heal:0,speed:0};
const abilityTimers={arrow:0,poison:0,lightning:0};
let orbitAngle=0;

// 시작 4종, 2분에 2종, 3분 30초에 1종 추가.
// 강한 적일수록 gem 값이 커진다.
const ENEMY_TYPES={
 slime:{name:'젤리',unlock:0,hp:30,speed:72,damage:8,r:12,gems:1,color:'#62d995',weight:42},
 bat:{name:'박쥐',unlock:0,hp:22,speed:118,damage:7,r:9,gems:1,color:'#9d7cff',weight:24},
 beetle:{name:'갑충',unlock:0,hp:70,speed:54,damage:14,r:17,gems:2,color:'#e6a65e',weight:20},
 brute:{name:'돌괴물',unlock:0,hp:120,speed:40,damage:20,r:22,gems:3,color:'#73849a',weight:14},
 hound:{name:'사냥개',unlock:PHASE_TWO_SECONDS,hp:88,speed:128,damage:16,r:14,gems:3,color:'#ff7b68',weight:19},
 shaman:{name:'독 주술사',unlock:PHASE_TWO_SECONDS,hp:150,speed:58,damage:24,r:18,gems:4,color:'#70d65d',weight:12},
 knight:{name:'보석 기사',unlock:PHASE_THREE_SECONDS,hp:320,speed:66,damage:32,r:24,gems:6,color:'#4fa7ff',weight:10}
};

const ABILITIES=[
 {id:'arrow',name:'출혈 화살',desc:function(lv){return lv===0?'가까운 적에게 화살을 던져 3초 동안 지속 피해':'화살 수와 지속 피해 강화 · 현재 Lv.'+lv},apply:function(){abilityLv.arrow++}},
 {id:'poison',name:'독 포션',desc:function(lv){return lv===0?'적 무리에 포션을 던져 3초 동안 독 장판 생성':'독 장판 크기와 피해 강화 · 현재 Lv.'+lv},apply:function(){abilityLv.poison++}},
 {id:'orbit',name:'회전 칼날',desc:function(lv){return lv===0?'몸 주변을 도는 칼날이 닿는 적에게 피해':'칼날 수와 피해 강화 · 현재 Lv.'+lv},apply:function(){abilityLv.orbit++}},
 {id:'lightning',name:'연쇄 번개',desc:function(lv){return lv===0?'주기적으로 가까운 적 여러 마리를 번개로 공격':'번개 대상 수와 피해 강화 · 현재 Lv.'+lv},apply:function(){abilityLv.lightning++}},
 {id:'heal',name:'생명력 강화',desc:function(lv){return lv===0?'최대 HP +20, 즉시 20 회복':'최대 HP 추가 증가 · 현재 Lv.'+lv},apply:function(){abilityLv.heal++;player.maxHp+=20;player.hp=Math.min(player.maxHp,player.hp+20)}},
 {id:'speed',name:'기동 강화',desc:function(lv){return lv===0?'이동 속도 +12%, 보석 회수 범위 +10%':'이동과 회수 범위 추가 강화 · 현재 Lv.'+lv},apply:function(){abilityLv.speed++;player.speed*=1.12;player.magnet*=1.1}}
];

// ==================== 유틸 ====================
function rnd(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function dist2(a,b){const dx=a.x-b.x,dy=a.y-b.y;return dx*dx+dy*dy}
function fmtTime(v){const s=Math.floor(v);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function resize(){
 DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;
 canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);
 canvas.style.width=W+'px';canvas.style.height=H+'px';
 ctx.setTransform(DPR,0,0,DPR,0,0)
}
addEventListener('resize',resize);resize();

function tone(freq,dur,type,vol){
 try{
  audio=audio||new (window.AudioContext||window.webkitAudioContext)();
  if(audio.state==='suspended')audio.resume();
  const o=audio.createOscillator(),g=audio.createGain();
  o.type=type||'sine';o.frequency.value=freq||260;g.gain.value=vol||.025;
  o.connect(g);g.connect(audio.destination);o.start();
  g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+(dur||.05));
  o.stop(audio.currentTime+(dur||.05))
 }catch(e){}
}
function burst(x,y,color,n){
 for(let i=0;i<(n||7);i++){
  const a=Math.random()*Math.PI*2,s=rnd(35,150);
  particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.2,.5),max:.5,r:rnd(1.5,4),color:color})
 }
}

// ==================== 메인 ====================
function reset(){
 elapsed=0;spawnTimer=0;kills=0;bossSpawned=false;boss=null;screenShake=0;
 enemies.length=0;projectiles.length=0;gems.length=0;effects.length=0;poisonPools.length=0;particles.length=0;
 Object.assign(player,{x:W/2,y:H/2,r:15,hp:100,maxHp:100,speed:220,inv:0,gems:0,gemNeed:INITIAL_GEM_NEED,choices:0,basicDamage:16,basicRate:.55,basicTimer:0,basicSpeed:550,magnet:92});
 Object.keys(abilityLv).forEach(function(k){abilityLv[k]=0});
 Object.keys(abilityTimers).forEach(function(k){abilityTimers[k]=0});
 orbitAngle=0;running=true;paused=false;
 $('endOverlay').classList.remove('show');$('choiceOverlay').classList.remove('show');$('pauseOverlay').classList.remove('show');
 ui.bossHud.classList.remove('show');updateUi()
}

function endGame(clear){
 running=false;paused=true;
 $('endEyebrow').textContent=clear?'STAGE CLEAR':'RUN OVER';
 $('endTitle').textContent=clear?'보석 포식자 격파!':'쓰러졌다';
 $('result').textContent=fmtTime(elapsed)+' 생존 · '+kills+'마리 처치 · 능력 '+player.choices+'회 선택';
 $('endOverlay').classList.add('show')
}

function hurt(amount){
 if(player.inv>0||!running)return;
 player.hp-=amount;player.inv=.55;screenShake=Math.max(screenShake,8);
 burst(player.x,player.y,'#ffffff',10);tone(115,.11,'sawtooth',.035);
 if(player.hp<=0){player.hp=0;endGame(false)}
}

// ==================== 몬스터/보석 ====================
function availableTypes(){return Object.entries(ENEMY_TYPES).filter(function(pair){return elapsed>=pair[1].unlock})}
function weightedEnemyType(){
 const list=availableTypes();let total=0;
 list.forEach(function(pair){total+=pair[1].weight});
 let roll=Math.random()*total;
 for(let i=0;i<list.length;i++){roll-=list[i][1].weight;if(roll<=0)return list[i][0]}
 return list[0][0]
}
function edgeSpawn(m){
 m=m||45;const side=Math.floor(Math.random()*4);
 if(side===0)return{x:rnd(0,W),y:-m};
 if(side===1)return{x:W+m,y:rnd(0,H)};
 if(side===2)return{x:rnd(0,W),y:H+m};
 return{x:-m,y:rnd(0,H)}
}
function spawnEnemy(typeId){
 const t=ENEMY_TYPES[typeId],p=edgeSpawn(),late=1+Math.min(.55,elapsed/SURVIVE_SECONDS*.35);
 enemies.push({type:typeId,name:t.name,x:p.x,y:p.y,r:t.r,hp:t.hp*late,maxHp:t.hp*late,speed:t.speed,damage:t.damage,gems:t.gems,color:t.color,hit:0,dot:0,dotTick:0,dotDamage:0,orbitHit:0})
}
function spawnBoss(){
 if(bossSpawned)return;
 bossSpawned=true;const p=edgeSpawn(80);
 boss={type:'boss',name:'보석 포식자',x:p.x,y:p.y,r:42,hp:2600,maxHp:2600,speed:48,damage:38,gems:0,color:'#ef476f',hit:0,dot:0,dotTick:0,dotDamage:0,orbitHit:0,boss:true,charge:2.5};
 enemies.push(boss);ui.bossHud.classList.add('show');ui.phase.textContent='5:00 · 보스 등장! 잡으면 클리어';tone(85,.5,'sawtooth',.05)
}
function dropGems(e){
 for(let i=0;i<e.gems;i++){
  const a=Math.random()*Math.PI*2,d=rnd(3,20);
  gems.push({x:e.x+Math.cos(a)*d,y:e.y+Math.sin(a)*d,r:5,v:1})
 }
}
function killEnemy(e,index){
 if(e.boss){
  enemies.splice(index,1);boss=null;ui.bossHud.classList.remove('show');
  burst(e.x,e.y,'#ffd166',45);tone(880,.4,'triangle',.06);endGame(true);return
 }
 kills++;dropGems(e);burst(e.x,e.y,e.color,8);enemies.splice(index,1)
}
function damageEnemy(e,amount){e.hp-=amount;e.hit=.07;burst(e.x,e.y,'#dffcff',2)}

// ==================== 자동 기본 공격 ====================
function nearestEnemy(from,max){
 from=from||player;max=max||Infinity;let best=null,bd=max*max;
 enemies.forEach(function(e){const d=dist2(from,e);if(d<bd){bd=d;best=e}});
 return best
}
function fireBasic(){
 const t=nearestEnemy();if(!t)return;
 const a=Math.atan2(t.y-player.y,t.x-player.x);
 projectiles.push({kind:'basic',x:player.x,y:player.y,vx:Math.cos(a)*player.basicSpeed,vy:Math.sin(a)*player.basicSpeed,r:4,damage:player.basicDamage,life:1.5,color:'#eafcff'});
 tone(470,.025,'square',.012)
}

// ==================== 능력 ====================
function fireArrow(){
 const lv=abilityLv.arrow;if(!lv)return;
 const target=nearestEnemy();if(!target)return;
 const count=Math.min(4,1+Math.floor((lv-1)/2));
 for(let i=0;i<count;i++){
  const a=Math.atan2(target.y-player.y,target.x-player.x)+(i-(count-1)/2)*.13;
  projectiles.push({kind:'arrow',x:player.x,y:player.y,vx:Math.cos(a)*470,vy:Math.sin(a)*470,r:5,damage:18+lv*4,life:1.7,color:'#ffcc67',dotDamage:4+lv*2,dotDuration:3})
 }
}
function throwPoison(){
 const lv=abilityLv.poison;if(!lv)return;
 const target=nearestEnemy(player,430);if(!target)return;
 const a=Math.atan2(target.y-player.y,target.x-player.x);
 const d=Math.min(360,Math.hypot(target.x-player.x,target.y-player.y));
 projectiles.push({kind:'potion',x:player.x,y:player.y,vx:Math.cos(a)*d/.55,vy:Math.sin(a)*d/.55,r:7,damage:0,life:.55,color:'#82ef5f',poolRadius:52+lv*7,poolDamage:7+lv*3})
}
function castLightning(){
 const lv=abilityLv.lightning;if(!lv||!enemies.length)return;
 const count=Math.min(6,1+lv);
 const ordered=enemies.slice().sort(function(a,b){return dist2(player,a)-dist2(player,b)}).slice(0,count);
 ordered.forEach(function(e){
  const index=enemies.indexOf(e);if(index<0)return;
  damageEnemy(e,22+lv*9);
  effects.push({kind:'lightning',x1:player.x,y1:player.y,x2:e.x,y2:e.y,life:.12,max:.12});
  if(e.hp<=0)killEnemy(e,index)
 });
 tone(720,.06,'sawtooth',.02)
}
function updateAbilities(dt){
 if(abilityLv.arrow){abilityTimers.arrow-=dt;if(abilityTimers.arrow<=0){abilityTimers.arrow=Math.max(.5,1.35-abilityLv.arrow*.1);fireArrow()}}
 if(abilityLv.poison){abilityTimers.poison-=dt;if(abilityTimers.poison<=0){abilityTimers.poison=Math.max(1.4,3.5-abilityLv.poison*.22);throwPoison()}}
 if(abilityLv.lightning){abilityTimers.lightning-=dt;if(abilityTimers.lightning<=0){abilityTimers.lightning=Math.max(1.1,2.8-abilityLv.lightning*.18);castLightning()}}
 if(abilityLv.orbit)orbitAngle+=dt*(2.25+abilityLv.orbit*.12)
}
function orbitBlades(){
 const lv=abilityLv.orbit;if(!lv)return[];
 const n=Math.min(5,1+Math.floor(lv/2)),arr=[];
 for(let i=0;i<n;i++){
  const a=orbitAngle+i*Math.PI*2/n;
  arr.push({x:player.x+Math.cos(a)*(52+lv*2),y:player.y+Math.sin(a)*(52+lv*2),r:9,damage:11+lv*4})
 }
 return arr
}

function showAbilityChoice(){
 paused=true;tone(760,.18,'sine',.045);
 const pool=ABILITIES.slice().sort(function(){return Math.random()-.5}).slice(0,3);
 const wrap=$('choices');wrap.innerHTML='';
 pool.forEach(function(a){
  const lv=abilityLv[a.id],b=document.createElement('button');
  b.className='choice';
  b.innerHTML='<b>'+a.name+(lv?' · Lv.'+(lv+1):'')+'</b><small>'+a.desc(lv)+'</small>';
  b.onclick=function(){selectAbility(a)};
  wrap.appendChild(b)
 });
 renderAbilityList();$('choiceOverlay').classList.add('show')
}
function selectAbility(a){
 a.apply();player.choices++;
 player.gems-=player.gemNeed;
 player.gemNeed=Math.ceil(player.gemNeed*GEM_NEED_MULTIPLIER);
 $('choiceOverlay').classList.remove('show');paused=false;updateUi()
}
function renderAbilityList(){
 const el=$('abilityList');el.innerHTML='';
 ABILITIES.forEach(function(a){
  const lv=abilityLv[a.id];if(!lv)return;
  const d=document.createElement('div');d.className='abilityBadge';d.textContent=a.name+' Lv.'+lv;el.appendChild(d)
 })
}
function collectGem(g,index){
 player.gems+=g.v;gems.splice(index,1);tone(650,.025,'sine',.01);updateUi();
 if(player.gems>=player.gemNeed&&!paused)showAbilityChoice()
}

// ==================== 업데이트 ====================
function update(dt){
 if(paused||!running)return;
 elapsed+=dt;player.inv=Math.max(0,player.inv-dt);player.basicTimer-=dt;screenShake=Math.max(0,screenShake-dt*24);

 if(elapsed>=SURVIVE_SECONDS&&!bossSpawned)spawnBoss();

 if(!bossSpawned){
  spawnTimer-=dt;
  if(spawnTimer<=0){
   const pressure=clamp(elapsed/SURVIVE_SECONDS,0,1);
   spawnTimer=Math.max(.18,.72-pressure*.38);
   spawnEnemy(weightedEnemyType());
   if(elapsed>=PHASE_TWO_SECONDS&&Math.random()<.13)spawnEnemy(weightedEnemyType());
   if(elapsed>=PHASE_THREE_SECONDS&&Math.random()<.18)spawnEnemy(weightedEnemyType())
  }
 }

 let mx=joy.dx,my=joy.dy;
 mx+=(keys.has('d')||keys.has('ArrowRight')?1:0)-(keys.has('a')||keys.has('ArrowLeft')?1:0);
 my+=(keys.has('s')||keys.has('ArrowDown')?1:0)-(keys.has('w')||keys.has('ArrowUp')?1:0);
 const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml}
 player.x=clamp(player.x+mx*player.speed*dt,player.r,W-player.r);
 player.y=clamp(player.y+my*player.speed*dt,player.r+88,H-player.r-4);

 if(player.basicTimer<=0){player.basicTimer=player.basicRate;fireBasic()}
 updateAbilities(dt);

 for(let i=projectiles.length-1;i>=0;i--){
  const b=projectiles[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
  if(b.kind==='potion'&&b.life<=0){
   poisonPools.push({x:b.x,y:b.y,r:b.poolRadius,life:3,max:3,damage:b.poolDamage,tick:0});
   burst(b.x,b.y,'#7cef61',12);projectiles.splice(i,1);continue
  }

  let hit=false;
  if(b.kind!=='potion'){
   for(let j=enemies.length-1;j>=0;j--){
    const e=enemies[j],rr=b.r+e.r;
    if((b.x-e.x)*(b.x-e.x)+(b.y-e.y)*(b.y-e.y)<=rr*rr){
     damageEnemy(e,b.damage);
     if(b.kind==='arrow'){e.dot=Math.max(e.dot,b.dotDuration);e.dotTick=0;e.dotDamage=b.dotDamage}
     hit=true;if(e.hp<=0)killEnemy(e,j);break
    }
   }
  }
  if(hit||b.life<=0||b.x<-40||b.x>W+40||b.y<-40||b.y>H+40)projectiles.splice(i,1)
 }

 for(let i=poisonPools.length-1;i>=0;i--){
  const p=poisonPools[i];p.life-=dt;p.tick-=dt;
  if(p.tick<=0){
   p.tick=.35;
   for(let j=enemies.length-1;j>=0;j--){
    const e=enemies[j],rr=p.r+e.r;
    if((p.x-e.x)*(p.x-e.x)+(p.y-e.y)*(p.y-e.y)<=rr*rr){
     damageEnemy(e,p.damage);if(e.hp<=0)killEnemy(e,j)
    }
   }
  }
  if(p.life<=0)poisonPools.splice(i,1)
 }

 const blades=orbitBlades();
 for(let i=enemies.length-1;i>=0;i--){
  const e=enemies[i];e.hit=Math.max(0,e.hit-dt);e.orbitHit=Math.max(0,e.orbitHit-dt);

  if(e.dot>0){
   e.dot-=dt;e.dotTick-=dt;
   if(e.dotTick<=0){e.dotTick=.5;damageEnemy(e,e.dotDamage||4);if(e.hp<=0){killEnemy(e,i);continue}}
  }

  if(e.boss){
   e.charge-=dt;
   if(e.charge<=0){
    e.charge=2.7;
    const aa=Math.atan2(player.y-e.y,player.x-e.x);
    e.x+=Math.cos(aa)*70;e.y+=Math.sin(aa)*70;screenShake=10
   }
  }

  const a=Math.atan2(player.y-e.y,player.x-e.x);
  e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt;

  for(let k=0;k<blades.length;k++){
   const blade=blades[k],rr=e.r+blade.r;
   if(e.orbitHit<=0&&(e.x-blade.x)*(e.x-blade.x)+(e.y-blade.y)*(e.y-blade.y)<=rr*rr){
    e.orbitHit=.24;damageEnemy(e,blade.damage);if(e.hp<=0){killEnemy(e,i);break}
   }
  }
  if(enemies.indexOf(e)<0)continue;

  const rr=e.r+player.r;
  if((e.x-player.x)*(e.x-player.x)+(e.y-player.y)*(e.y-player.y)<=rr*rr)hurt(e.damage)
 }

 for(let i=gems.length-1;i>=0;i--){
  const g=gems[i],dx=player.x-g.x,dy=player.y-g.y,d=Math.hypot(dx,dy);
  if(d<player.magnet){
   const s=210+(player.magnet-d)*4.4;
   g.x+=dx/Math.max(1,d)*s*dt;g.y+=dy/Math.max(1,d)*s*dt
  }
  if(d<player.r+9){collectGem(g,i);if(paused)break}
 }

 for(let i=effects.length-1;i>=0;i--){effects[i].life-=dt;if(effects[i].life<=0)effects.splice(i,1)}
 for(let i=particles.length-1;i>=0;i--){
  const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;p.life-=dt;
  if(p.life<=0)particles.splice(i,1)
 }
 updateUi()
}

// ==================== UI ====================
function updateUi(){
 ui.gemCount.textContent=player.gems;ui.gemNeed.textContent=player.gemNeed;ui.kills.textContent=kills;
 ui.time.textContent=fmtTime(Math.min(elapsed,SURVIVE_SECONDS));
 ui.hpText.textContent=Math.ceil(Math.max(0,player.hp))+' / '+Math.ceil(player.maxHp);
 ui.hpBar.style.width=(clamp(player.hp/player.maxHp,0,1)*100)+'%';
 ui.gemText.textContent=player.gems+' / '+player.gemNeed;
 ui.gemBar.style.width=(clamp(player.gems/player.gemNeed,0,1)*100)+'%';

 if(!bossSpawned){
  if(elapsed<PHASE_TWO_SECONDS)ui.phase.textContent='기본 적 4종 등장 중';
  else if(elapsed<PHASE_THREE_SECONDS)ui.phase.textContent='2:00 · 새로운 적 2종 추가';
  else ui.phase.textContent='3:30 · 강한 적 1종 추가'
 }
 if(boss){
  ui.bossHpText.textContent=Math.ceil(Math.max(0,boss.hp))+' / '+boss.maxHp;
  ui.bossHpBar.style.width=(clamp(boss.hp/boss.maxHp,0,1)*100)+'%'
 }
}

// ==================== 그리기 ====================
function draw(){
 ctx.clearRect(0,0,W,H);ctx.save();
 if(screenShake>0)ctx.translate(rnd(-screenShake,screenShake),rnd(-screenShake,screenShake));

 const bg=ctx.createRadialGradient(player.x,player.y,10,player.x,player.y,Math.max(W,H)*.85);
 bg.addColorStop(0,'#173147');bg.addColorStop(.58,'#0c1b2b');bg.addColorStop(1,'#07101b');
 ctx.fillStyle=bg;ctx.fillRect(-20,-20,W+40,H+40);

 const grid=52;ctx.strokeStyle='#8bc6d90b';ctx.lineWidth=1;
 for(let x=0;x<W;x+=grid){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
 for(let y=0;y<H;y+=grid){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}

 poisonPools.forEach(function(p){
  ctx.globalAlpha=.18+.12*Math.sin(performance.now()*.006);ctx.fillStyle='#72ed56';
  ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  ctx.strokeStyle='#9aff72';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.stroke()
 });

 gems.forEach(function(g){
  ctx.save();ctx.translate(g.x,g.y);ctx.rotate(performance.now()*.0025);
  ctx.fillStyle='#52f0bf';ctx.shadowColor='#4cf1c0';ctx.shadowBlur=12;
  ctx.beginPath();ctx.moveTo(0,-7);ctx.lineTo(6,0);ctx.lineTo(0,7);ctx.lineTo(-6,0);ctx.closePath();ctx.fill();ctx.restore()
 });
 ctx.shadowBlur=0;

 projectiles.forEach(function(b){
  ctx.fillStyle=b.color;ctx.shadowColor=b.color;ctx.shadowBlur=9;
  if(b.kind==='arrow'){
   const a=Math.atan2(b.vy,b.vx);ctx.save();ctx.translate(b.x,b.y);ctx.rotate(a);
   ctx.fillRect(-9,-2,18,4);ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(4,-5);ctx.lineTo(4,5);ctx.closePath();ctx.fill();ctx.restore()
  }else{
   ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill()
  }
 });
 ctx.shadowBlur=0;

 enemies.forEach(function(e){
  ctx.save();ctx.translate(e.x,e.y);ctx.fillStyle=e.hit>0?'#ffffff':e.color;ctx.shadowColor=e.color;ctx.shadowBlur=e.boss?26:11;
  ctx.beginPath();ctx.arc(0,0,e.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  ctx.strokeStyle='#ffffff50';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,e.r*.62,0,Math.PI*2);ctx.stroke();
  if(e.dot>0){ctx.strokeStyle='#ffb255';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,e.r+4,0,Math.PI*2);ctx.stroke()}
  ctx.restore();

  if(e.boss||e.hp<e.maxHp){
   ctx.fillStyle='#08111b';ctx.fillRect(e.x-e.r,e.y-e.r-9,e.r*2,4);
   ctx.fillStyle=e.boss?'#ff5770':'#78e2b2';ctx.fillRect(e.x-e.r,e.y-e.r-9,e.r*2*clamp(e.hp/e.maxHp,0,1),4)
  }
 });

 orbitBlades().forEach(function(b){
  ctx.save();ctx.translate(b.x,b.y);ctx.rotate(orbitAngle*2);ctx.fillStyle='#dde9ff';ctx.shadowColor='#a8c6ff';ctx.shadowBlur=10;
  ctx.fillRect(-11,-3,22,6);ctx.restore()
 });

 effects.forEach(function(fx){
  if(fx.kind!=='lightning')return;
  ctx.globalAlpha=clamp(fx.life/fx.max,0,1);ctx.strokeStyle='#d9f7ff';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(fx.x1,fx.y1);
  const mx=(fx.x1+fx.x2)/2+rnd(-12,12),my=(fx.y1+fx.y2)/2+rnd(-12,12);
  ctx.lineTo(mx,my);ctx.lineTo(fx.x2,fx.y2);ctx.stroke();ctx.globalAlpha=1
 });

 particles.forEach(function(p){
  ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()
 });
 ctx.globalAlpha=1;

 ctx.save();ctx.translate(player.x,player.y);
 if(player.inv>0&&Math.floor(player.inv*18)%2===0)ctx.globalAlpha=.45;
 ctx.shadowColor='#66ffd0';ctx.shadowBlur=22;ctx.fillStyle='#eafff8';ctx.beginPath();ctx.arc(0,0,player.r,0,Math.PI*2);ctx.fill();
 ctx.shadowBlur=0;ctx.strokeStyle='#59e7bd';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,player.r+5,0,Math.PI*2);ctx.stroke();
 ctx.fillStyle='#59e7bd';ctx.beginPath();ctx.moveTo(19,0);ctx.lineTo(7,-6);ctx.lineTo(7,6);ctx.closePath();ctx.fill();ctx.restore();

 ctx.restore()
}

function loop(now){
 const dt=Math.min(.033,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(loop)
}
requestAnimationFrame(loop);

// ==================== 입력 ====================
function joyPoint(e){
 const r=$('joystick').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 const dx=e.clientX-cx,dy=e.clientY-cy,m=Math.hypot(dx,dy),lim=r.width*.31,k=Math.min(1,lim/Math.max(1,m));
 joy.dx=(dx*k)/lim;joy.dy=(dy*k)/lim;$('stick').style.transform='translate('+dx*k+'px,'+dy*k+'px)'
}
const joyEl=$('joystick');
joyEl.addEventListener('pointerdown',function(e){joy.id=e.pointerId;joyEl.setPointerCapture(e.pointerId);joyPoint(e)});
joyEl.addEventListener('pointermove',function(e){if(e.pointerId===joy.id)joyPoint(e)});
function joyEnd(e){if(e.pointerId!==joy.id)return;joy.id=null;joy.dx=joy.dy=0;$('stick').style.transform='translate(0,0)'}
joyEl.addEventListener('pointerup',joyEnd);joyEl.addEventListener('pointercancel',joyEnd);

addEventListener('keydown',function(e){keys.add(e.key)});
addEventListener('keyup',function(e){keys.delete(e.key)});

function setPause(v){if(!running)return;paused=v;$('pauseOverlay').classList.toggle('show',v)}
$('pauseBtn').onclick=function(){setPause(true)};
$('resumeBtn').onclick=function(){setPause(false)};
$('startBtn').onclick=function(){$('startOverlay').classList.remove('show');tone(330,.08,'triangle',.03);reset()};
$('restartBtn').onclick=function(){reset()};
document.addEventListener('visibilitychange',function(){if(document.hidden&&running&&!paused)setPause(true)});
})();
</script>
