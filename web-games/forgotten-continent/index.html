<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>잊혀진 대륙 | 2D 생존</title><style>*{box-sizing:border-box}body{margin:0;background:#101c1b;color:white;font:14px system-ui;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#hud{position:absolute;top:10px;left:10px;background:#101c1bdb;border:1px solid #ffffff30;padding:10px;border-radius:12px;pointer-events:none;line-height:1.7}#tip{position:absolute;top:10px;right:10px;background:#101c1bd9;padding:8px;border-radius:9px;max-width:45%;font-size:12px}#bar{position:absolute;bottom:14px;right:12px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:70%}button{border:1px solid #ffffff45;border-radius:12px;padding:12px 13px;color:white;background:#244c49e8;font-weight:700;touch-action:manipulation}button:active{background:#478d77}#stick{position:absolute;bottom:30px;left:24px;width:120px;height:120px;border-radius:50%;border:2px solid #ffffff55;background:#ffffff16;touch-action:none}#nub{position:absolute;left:40px;top:40px;width:40px;height:40px;background:#c7f6c8a8;border-radius:50%}#toast{position:absolute;top:37%;width:100%;text-align:center;font-size:19px;font-weight:bold;text-shadow:0 2px 8px black;pointer-events:none}#craft{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#142923;border:2px solid #8bbd8e;padding:18px;border-radius:16px;width:min(350px,90vw);display:none;z-index:5}#craft button{margin:4px;width:100%;text-align:left}#craft .close{background:#704343}</style></head><body><canvas id="game"></canvas><div id="hud"></div><div id="tip">이동: WASD / 조이스틱<br>공격·채집: 스페이스 / 공격 버튼<br>근처 자원을 채집하고 장비를 제작하세요.</div><div id="stick"><div id="nub"></div></div><div id="bar"><button id="hit">⚔ 공격/채집</button><button id="build">⌂ 건설</button><button id="craftBtn">⚒ 제작</button><button id="eat">🍖 먹기</button></div><div id="toast"></div><div id="craft"><h2>제작대</h2><div id="recipes"></div><button class="close" id="close">닫기</button></div><script>
const c=document.getElementById('game'),ctx=c.getContext('2d'),hud=document.getElementById('hud'),toast=document.getElementById('toast');let W,H,dpr;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const size=2400,player={x:300,y:300,hp:100,hunger:100,wood:0,stone:0,iron:0,gold:0,food:3,sword:0,axe:0,pick:0,walls:0,kills:0};let objects=[],enemies=[],particles=[],keys={},joy={x:0,y:0},last=performance.now(),cool=0,notice=0,autosave=0;const biome=(x,y)=>x<650?'초원':x<1250?'협곡':x<1800?'늪지':'산맥';const rand=(a,b)=>a+Math.random()*(b-a);const saved=localStorage.getItem('forgotten-continent-v1');if(saved){try{Object.assign(player,JSON.parse(saved).player);objects=JSON.parse(saved).objects||[];enemies=JSON.parse(saved).enemies||[]}catch(e){}}
if(!objects.length){for(let i=0;i<390;i++){let x=rand(80,size-80),y=rand(80,size-80),b=biome(x,y),type=b==='초원'?(Math.random()<.65?'tree':'rock'):b==='협곡'?(Math.random()<.7?'iron':'rock'):b==='늪지'?(Math.random()<.5?'tree':'food'):(Math.random()<.65?'gold':'iron');objects.push({x,y,type,hp:type==='tree'?3:4})}}if(!enemies.length){for(let i=0;i<44;i++){let x=rand(450,size-100),y=rand(80,size-80);enemies.push({x,y,hp:x>1800?70:35,speed:x>1800?65:48,atk:0})}}
function say(s){toast.textContent=s;notice=2.2}function save(){localStorage.setItem('forgotten-continent-v1',JSON.stringify({player,objects,enemies}))}function near(a,b,r){return Math.hypot(a.x-b.x,a.y-b.y)<r}function attack(){if(cool>0)return;cool=.35;let e=enemies.filter(o=>near(o,player,72)).sort((a,b)=>Math.hypot(a.x-player.x,a.y-player.y)-Math.hypot(b.x-player.x))[0];if(e){e.hp-=15+player.sword*17;particles.push({x:e.x,y:e.y,t:.35});if(e.hp<=0){enemies.splice(enemies.indexOf(e),1);player.kills++;player.food+=Math.random()<.65?1:0;say('몬스터 처치! 식량 획득 가능')}return}let o=objects.filter(o=>near(o,player,75)).sort((a,b)=>Math.hypot(a.x-player.x,a.y-player.y)-Math.hypot(b.x-player.x,a.y-player.y))[0];if(!o){say('가까운 자원이나 몬스터가 없어');return}o.hp-=1+(o.type==='tree'?player.axe:o.type==='food'?0:player.pick);particles.push({x:o.x,y:o.y,t:.3});if(o.hp<=0){let type=o.type==='tree'?'wood':o.type==='rock'?'stone':o.type;player[type]+=type==='wood'?3:type==='food'?2:2;objects.splice(objects.indexOf(o),1);say(({wood:'나무',stone:'돌',iron:'철',gold:'금',food:'식량'})[type]+' 획득!')}}
const recipes=[['돌 도끼','axe',{wood:3,stone:4}],['돌 곡괭이','pick',{wood:3,stone:5}],['철 검','sword',{wood:4,iron:6}],['모닥불 (+체력)','heal',{wood:6,stone:5}],['나무 벽 ×3','walls',{wood:9}]];function craft(i){let [name,id,cost]=recipes[i];if(Object.entries(cost).some(([k,v])=>player[k]<v)){say('재료가 부족해');return}for(let k in cost)player[k]-=cost[k];if(id==='heal')player.hp=Math.min(100,player.hp+45);else if(id==='walls')player.walls+=3;else player[id]++;say(name+' 제작 완료');renderRecipes();save()}function renderRecipes(){document.getElementById('recipes').innerHTML=recipes.map(([n,id,req],i)=>'<button data-i="'+i+'">'+n+' — '+Object.entries(req).map(([k,v])=>({wood:'나무',stone:'돌',iron:'철',gold:'금'})[k]+' '+v).join(', ')+'</button>').join('');document.querySelectorAll('#recipes button').forEach(b=>b.onclick=()=>craft(+b.dataset.i))}document.getElementById('craftBtn').onclick=()=>{renderRecipes();document.getElementById('craft').style.display='block'};document.getElementById('close').onclick=()=>document.getElementById('craft').style.display='none';document.getElementById('hit').onclick=attack;document.getElementById('eat').onclick=()=>{if(player.food<1)return say('식량이 없어');player.food--;player.hunger=Math.min(100,player.hunger+35);player.hp=Math.min(100,player.hp+8);say('식사 완료')};document.getElementById('build').onclick=()=>{if(player.walls<1)return say('제작에서 벽을 먼저 만들어');player.walls--;objects.push({x:player.x+55,y:player.y,type:'wall',hp:999});say('벽 설치 완료');save()};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){e.preventDefault();attack()}if(e.key==='e')document.getElementById('craftBtn').click()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const stick=document.getElementById('stick'),nub=document.getElementById('nub');function moveStick(e){let r=stick.getBoundingClientRect(),dx=e.clientX-r.left-60,dy=e.clientY-r.top-60,l=Math.hypot(dx,dy)||1,m=Math.min(l,42);joy.x=dx/l*m/42;joy.y=dy/l*m/42;nub.style.transform='translate('+joy.x*42+'px,'+joy.y*42+'px)'}stick.addEventListener('pointerdown',e=>{stick.setPointerCapture(e.pointerId);moveStick(e)});stick.addEventListener('pointermove',e=>{if(stick.hasPointerCapture(e.pointerId))moveStick(e)});function stop(){joy.x=joy.y=0;nub.style.transform=''}stick.addEventListener('pointerup',stop);stick.addEventListener('pointercancel',stop);
function circle(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}function draw(t){let dt=Math.min((t-last)/1000,.05);last=t;cool=Math.max(0,cool-dt);notice=Math.max(0,notice-dt);toast.style.opacity=notice>0?1:0;let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x,dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joy.y,len=Math.hypot(dx,dy)||1;player.x=Math.max(20,Math.min(size-20,player.x+dx/len*185*dt));player.y=Math.max(20,Math.min(size-20,player.y+dy/len*185*dt));player.hunger=Math.max(0,player.hunger-dt*.12);if(player.hunger===0)player.hp=Math.max(0,player.hp-dt*2);for(let e of enemies){let d=Math.hypot(e.x-player.x,e.y-player.y);if(d<270&&d>29){e.x+=(player.x-e.x)/d*e.speed*dt;e.y+=(player.y-e.y)/d*e.speed*dt}e.atk-=dt;if(d<38&&e.atk<=0){player.hp=Math.max(0,player.hp-8);e.atk=1.4}}if(player.hp<=0){say('쓰러졌다! 초원에서 다시 시작');player.x=300;player.y=300;player.hp=100;player.hunger=75;save()}let ox=W/2-player.x,oy=H/2-player.y;ctx.fillStyle='#4b8d54';ctx.fillRect(0,0,W,H);let regions=[['#4b8d54',0,650],['#9b8862',650,1250],['#527b65',1250,1800],['#79554b',1800,2400]];for(let [color,a,b]of regions){ctx.fillStyle=color;ctx.fillRect(ox+a,oy,b-a,size)}ctx.strokeStyle='#ffffff12';ctx.lineWidth=1;for(let x=0;x<=size;x+=80){ctx.beginPath();ctx.moveTo(ox+x,oy);ctx.lineTo(ox+x,oy+size);ctx.stroke()}for(let y=0;y<=size;y+=80){ctx.beginPath();ctx.moveTo(ox,oy+y);ctx.lineTo(ox+size,oy+y);ctx.stroke()}for(let o of objects){let x=o.x+ox,y=o.y+oy;if(x< -40||y< -40||x>W+40||y>H+40)continue;if(o.type==='tree'){circle(x,y+7,17,'#66462c');circle(x,y-5,23,'#206c3c');circle(x-9,y-12,13,'#398c45')}else if(o.type==='wall'){ctx.fillStyle='#765038';ctx.fillRect(x-20,y-13,40,26);ctx.strokeStyle='#c69a63';ctx.strokeRect(x-20,y-13,40,26)}else if(o.type==='food'){circle(x,y,13,'#c64e52');circle(x-5,y-4,4,'#f8b5b0')}else{circle(x,y,16,o.type==='gold'?'#d9b54b':o.type==='iron'?'#7c9fae':'#9b9b91');circle(x-5,y-5,6,'#ffffff44')}}for(let e of enemies){let x=e.x+ox,y=e.y+oy;if(x< -35||y< -35||x>W+35||y>H+35)continue;circle(x,y,18,e.x>1800?'#a53724':'#643e67');circle(x-6,y-4,3,'#fff');circle(x+6,y-4,3,'#fff');ctx.fillStyle='#ef5a5a';ctx.fillRect(x-18,y-27,36*Math.max(0,e.hp/(e.x>1800?70:35)),4)}for(let p of particles){p.t-=dt;circle(p.x+ox,p.y+oy,25*(.4-p.t)*3,'#fff8a5aa')}particles=particles.filter(p=>p.t>0);circle(W/2,H/2+6,17,'#173d55');circle(W/2,H/2-10,13,'#f2cb9b');circle(W/2-5,H/2-12,2,'#222');circle(W/2+5,H/2-12,2,'#222');ctx.strokeStyle='#e7e4d5';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(W/2+12,H/2+4);ctx.lineTo(W/2+28,H/2-13);ctx.stroke();hud.innerHTML='<b>🌍 '+biome(player.x,player.y)+'</b><br>❤️ 체력 '+Math.ceil(player.hp)+' / 100　🍗 허기 '+Math.ceil(player.hunger)+'<br>🪵 '+player.wood+'　🪨 '+player.stone+'　⛓ '+player.iron+'　✨ '+player.gold+'　🍖 '+player.food+'<br>⚔ 검 '+player.sword+'　🪓 도끼 '+player.axe+'　⛏ 곡괭이 '+player.pick+'　☠ 처치 '+player.kills;autosave+=dt;if(autosave>8){save();autosave=0}requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></body></html>
