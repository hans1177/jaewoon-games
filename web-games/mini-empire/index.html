function matMul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++){let v=0;for(let k=0;k<4;k++)v+=a[k*4+r]*b[c*4+k];o[c*4+r]=v}return o}
function perspective(fov,asp,near,far){const f=1/Math.tan(fov/2),out=new Float32Array(16);out[0]=f/asp;out[5]=f;out[10]=(far+near)/(near-far);out[11]=-1;out[14]=2*far*near/(near-far);return out}

function camera(){const rect=canvas.getBoundingClientRect(),w=Math.max(1,rect.width),h=Math.max(1,rect.height),pixel=Math.min(devicePixelRatio||1,1.75);if(canvas.width!==Math.floor(w*pixel)||canvas.height!==Math.floor(h*pixel)){canvas.width=Math.floor(w*pixel);canvas.height=Math.floor(h*pixel);gl.viewport(0,0,canvas.width,canvas.height)}
const r=zoom,eye=[Math.sin(camYaw)*Math.cos(camPitch)*r,Math.sin(camPitch)*r,Math.cos(camYaw)*Math.cos(camPitch)*r];

function project(x,z){const a=[x-8.5,0,z-6.5,1],p=[0,0,0,0];for(let row=0;row<4;row++)for(let i=0;i<4;i++)p[row]+=pv[i*4+row]*a[i];return {x:(p[0]/p[3]*.5+.5)*canvas.clientWidth,y:(1-(p[1]/p[3]*.5+.5))*canvas.clientHeight,w:p[3]}}

const points=new Map();let down=null,pinch=null;
function picked(px,py){let tile=null,best=1e6;for(let z=0;z<H;z++)for(let x=0;x<W;x++){const q=project(x,z),d=Math.hypot(q.x-px,q.y-py);if(q.w>0&&d<best){best=d;tile={x,z}}}return best<Math.max(30,canvas.clientWidth/22)?tile:null}

canvas.addEventListener("pointerdown",e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);points.set(e.pointerId,{x:e.clientX,y:e.clientY});if(points.size===1)down={x:e.clientX,y:e.clientY,moved:false};if(points.size===2){const pts=[...points.values()];pinch=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);down=null}});
