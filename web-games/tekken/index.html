<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>철권 — 바이브 3D 격투</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#fff;font:14px system-ui;overflow:hidden}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none}#top{display:flex;gap:12px;padding:16px;align-items:center;background:linear-gradient(#080c1dcc,transparent)}.health{height:22px;background:#371e2d;border:2px solid #ffffff88;flex:1;border-radius:5px;overflow:hidden}.health i{display:block;background:linear-gradient(90deg,#fa454e,#ffb34b);height:100%;width:100%;transition:width .12s}#enemyhp{transform:scaleX(-1)}#timer{font-size:32px;font-weight:900;text-shadow:0 3px 10px #000}#labels{display:flex;justify-content:space-between;padding:0 18px;font-weight:700;text-shadow:0 2px 5px #000}#message{position:fixed;top:27%;width:100%;text-align:center;font-size:32px;font-weight:900;text-shadow:0 4px 12px #000}#menu{position:fixed;inset:0;background:#080e1fe9;display:flex;align-items:center;justify-content:center;z-index:4;overflow:auto}#panel{background:#142039;border:1px solid #6c8cb5;border-radius:18px;padding:24px;width:min(95vw,750px);max-height:96vh;overflow:auto;box-shadow:0 20px 80px #000}h1{font-size:42px;margin:0;color:#ffb35e}h2{margin:10px 0}p{color:#b8c8dc}#roster{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}.fighter{border:1px solid #54667c;border-radius:10px;background:#1b304c;color:white;padding:10px;cursor:pointer;text-align:left}.fighter.selected{outline:3px solid #ffbf66}.fighter small{display:block;color:#b6c8db}button,select{font:inherit}#start{padding:14px 24px;background:#ed9140;color:#10131b;font-weight:900;border:0;border-radius:10px;cursor:pointer}#toolbar{position:fixed;right:12px;top:112px;z-index:2;display:flex;gap:6px;pointer-events:auto}#toolbar button,#toolbar select{padding:8px;border:1px solid #7890b5;border-radius:7px;background:#152843;color:#fff}#mobile{position:fixed;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:auto;touch-action:none}#mobile>div{display:flex;gap:7px}#mobile button{width:53px;height:53px;border:1px solid #ffffff77;border-radius:12px;background:#1d3557c9;color:#fff;font-weight:bold}#help{position:fixed;bottom:75px;width:100%;text-align:center;color:#dae3f3;text-shadow:0 2px 5px #000}@media(max-width:580px){#roster{grid-template-columns:repeat(2,1fr)}h1{font-size:30px}#help{font-size:11px}#toolbar{top:104px}#mobile button{width:46px;height:50px}#top{padding:8px}#timer{font-size:24px}}
</style></head><body><div id="hud"><div id="top"><div class="health"><i id="myhp"></i></div><div id="timer">75</div><div class="health"><i id="enemyhp"></i></div></div><div id="labels"><span id="myname">플레이어</span><span id="enemyname">상대</span></div><div id="message"></div></div><div id="toolbar"><select id="weapon" aria-label="무기 교체"></select><button id="restart">다시 시작</button></div><div id="help">A/D 이동 · J 빠른 공격 · K 강한 공격 · L 방어 · S 앉기 · Q/E 무기 교체</div><div id="mobile"><div><button data-key="KeyA">◀</button><button data-key="KeyD">▶</button><button data-key="KeyS">앉기</button></div><div><button data-key="KeyJ">공격</button><button data-key="KeyK">강공</button><button data-key="KeyL">방어</button></div></div><div id="menu"><div id="panel"><h1>철권</h1><p>바이브 엔진 기반 오리지널 3D 격투 게임 · 8명의 고유 체형·얼굴·복장 · 무기 교체 · 3판 2선승</p><h2>캐릭터 선택</h2><div id="roster"></div><button id="start">대전 시작</button><p>PC 키보드와 모바일 터치 지원 · 상대는 AI가 조작합니다.</p></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js"}}</script><script type="module">
import * as THREE from 'three';
import {fighters,weapons,createFightingMatch} from '../assets/vibe-fighting-engine.mjs';
const $=id=>document.getElementById(id),scene=new THREE.Scene();scene.background=new THREE.Color(0x0d1428);scene.fog=new THREE.Fog(0x0d1428,16,38);
const camera=new THREE.PerspectiveCamera(46,innerWidth/innerHeight,.1,100);camera.position.set(0,3.7,13);camera.lookAt(0,1.6,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x9ebfff,0x403020,2));const sun=new THREE.DirectionalLight(0xffe0b4,2.5);sun.position.set(-4,9,6);sun.castShadow=true;scene.add(sun);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(40,18),new THREE.MeshStandardMaterial({color:0x28394c,roughness:.75,metalness:.12}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const grid=new THREE.GridHelper(30,30,0x517394,0x344c65);grid.position.y=.015;scene.add(grid);
for(let i=0;i<16;i++){const pillar=new THREE.Mesh(new THREE.BoxGeometry(.45,2+(i%4),.45),new THREE.MeshStandardMaterial({color:i%2?0x24354e:0x1d2b43,emissive:0x101b33}));pillar.position.set(-12+i*1.6,1+(i%4)/2,-6);scene.add(pillar)}
const mat=(color,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness:.65,metalness});
function part(parent,geo,color,x,y,z){const m=new THREE.Mesh(geo,mat(color));m.position.set(x,y,z);m.castShadow=true;parent.add(m);return m}
function buildFighter(data){
 const root=new THREE.Group(),scale=data.height/1.8,bulk=.8+data.weight/180,skin=data.skin;
 const torso=part(root,new THREE.BoxGeometry(.68*bulk,.82,.38*bulk),data.outfit,0,1.28,0);
 const neck=part(root,new THREE.CylinderGeometry(.11,.12,.17,10),skin,0,1.79,0);
 const headGeo=data.face==='round'?new THREE.SphereGeometry(.27,16,12):data.face==='square'?new THREE.BoxGeometry(.49,.5,.42):new THREE.SphereGeometry(.25,16,12);
 const head=part(root,headGeo,skin,0,2.06,.02);head.scale.y=data.face==='long'?1.3:data.face==='heart'?1.07:1;
 part(root,new THREE.SphereGeometry(.27,12,8),data.hair,0,2.23,-.03).scale.set(1.02,.48,1);
 for(const side of [-1,1]){part(root,new THREE.SphereGeometry(.035,8,8),0x101827,side*.095,2.08,.245);part(root,new THREE.BoxGeometry(.17,.045,.07),data.accent,side*.14,1.66,.21)}
 const limbs={};for(const side of [-1,1]){
  const arm=new THREE.Group();arm.position.set(side*.44*bulk,1.65,0);root.add(arm);part(arm,new THREE.CapsuleGeometry(.11,.48,4,8),data.outfit,0,-.35,0);part(arm,new THREE.SphereGeometry(.11,8,8),skin,0,-.78,0);limbs[side<0?'leftArm':'rightArm']=arm;
  const leg=new THREE.Group();leg.position.set(side*.19, .98,0);root.add(leg);part(leg,new THREE.CapsuleGeometry(.15,.6,4,8),data.outfit,0,-.46,0);part(leg,new THREE.BoxGeometry(.25,.15,.4),0x151d29,0,-.97,.1);limbs[side<0?'leftLeg':'rightLeg']=leg;
 }
 const grip=new THREE.Group();grip.position.set(0,-.84,0);limbs.rightArm.add(grip);
 root.scale.setScalar(scale);root.userData={data,limbs,grip};scene.add(root);return root;
}
function drawWeapon(root,id){const grip=root.userData.grip;while(grip.children.length){const obj=grip.children[0];grip.remove(obj);obj.geometry?.dispose();obj.material?.dispose()}
 const colors={gauntlet:0xd8b071,staff:0x9f825b,hammer:0xadb8c5,blade:0xe1ebf9,axe:0xc7d5e5,dagger:0xbac9df,spear:0x9fa9bd,tonfa:0x8f7556};
 const length=weapons[id].reach*.6;part(grip,new THREE.BoxGeometry(id==='hammer'?.15:.085,length,.12),colors[id],0,-length/2,0);
 if(id==='hammer'||id==='axe')part(grip,new THREE.BoxGeometry(id==='hammer'?.55:.45,.24,.19),0xc5d3dc,0,-length+.05,0);
 if(id==='gauntlet')part(grip,new THREE.BoxGeometry(.3,.22,.3),0xc5a46b,0,-.08,0);
}
let selected=0,match=null,models=[],cpuCooldown=0,flash=0,lastRound=1;
for(const [i,f] of fighters.entries()){const button=document.createElement('button');button.className='fighter'+(i===selected?' selected':'');button.innerHTML='<strong>'+f.name+'</strong><small>'+Math.round(f.height*100)+'cm · '+f.weight+'kg</small><small>'+weapons[f.weapon].name+' · '+f.face+'</small>';button.onclick=()=>{selected=i;document.querySelectorAll('.fighter').forEach(x=>x.classList.remove('selected'));button.classList.add('selected')};$('roster').append(button)}
for(const [id,w] of Object.entries(weapons)){const option=document.createElement('option');option.value=id;option.textContent=w.name;$('weapon').append(option)}
function start(){models.forEach(x=>scene.remove(x));models=[buildFighter(fighters[selected]),buildFighter(fighters[(selected+3)%fighters.length])];match=createFightingMatch({player:fighters[selected].id,opponent:fighters[(selected+3)%fighters.length].id});models.forEach((m,i)=>drawWeapon(m,match.snapshot().actors[i].weapon));$('weapon').value=fighters[selected].weapon;$('menu').style.display='none';$('message').textContent='ROUND 1';lastRound=1;cpuCooldown=1}
$('start').onclick=start;$('restart').onclick=()=>{$('menu').style.display='flex';match=null};
$('weapon').onchange=()=>{if(match?.switchWeapon(0,$('weapon').value))drawWeapon(models[0],$('weapon').value);else if(match)$('weapon').value=match.snapshot().actors[0].weapon};
const keys=new Set();window.addEventListener('keydown',e=>{if(['KeyA','KeyD','KeyJ','KeyK','KeyL','KeyS','KeyQ','KeyE'].includes(e.code)){e.preventDefault();keys.add(e.code)}if((e.code==='KeyQ'||e.code==='KeyE')&&match){const ids=Object.keys(weapons),index=ids.indexOf(match.snapshot().actors[0].weapon),next=ids[(index+(e.code==='KeyQ'?-1:1)+ids.length)%ids.length];if(match.switchWeapon(0,next)){drawWeapon(models[0],next);$('weapon').value=next}}});window.addEventListener('keyup',e=>keys.delete(e.code));window.addEventListener('blur',()=>keys.clear());
document.querySelectorAll('[data-key]').forEach(b=>{const code=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(code);b.setPointerCapture(e.pointerId)});for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,()=>keys.delete(code))});
const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.04);if(match){const state=match.snapshot(),a=state.actors[0],b=state.actors[1],distance=Math.abs(a.x-b.x);cpuCooldown-=dt;
 const ai={move:distance>weapons[b.weapon].reach*.86?b.face:distance<1.1?-b.face:0,guard:distance<2&&!!a.attack&&a.attack.time>.08,crouch:false};
 if(cpuCooldown<=0){cpuCooldown=.28+Math.random()*.35;if(distance<weapons[b.weapon].reach+ .2&&b.stun<=0){ai[Math.random()<.72?'light':'heavy']=true}else if(distance>2.8&&Math.random()<.15){const choices=Object.keys(weapons);const choice=choices[Math.floor(Math.random()*choices.length)];if(match.switchWeapon(1,choice))drawWeapon(models[1],choice)}}
 const next=match.step(dt,[{move:Number(keys.has('KeyD'))-Number(keys.has('KeyA')),guard:keys.has('KeyL'),crouch:keys.has('KeyS'),light:keys.has('KeyJ'),heavy:keys.has('KeyK')},ai]);
 next.actors.forEach((actor,i)=>{const model=models[i],limbs=model.userData.limbs;model.position.x=actor.x;model.rotation.y=actor.face===1?Math.PI/2:-Math.PI/2;const attack=actor.attack,t=attack?attack.time/attack.duration:0;limbs.rightArm.rotation.z=attack?-1.4*Math.sin(Math.PI*Math.min(1,t)):actor.guard?-.65:0;limbs.leftArm.rotation.z=actor.guard?.7:.12;limbs.leftLeg.rotation.z=Math.sin(performance.now()/180)*.15;limbs.rightLeg.rotation.z=-limbs.leftLeg.rotation.z;model.position.y=actor.crouch?-.34:0});
 $('myhp').style.width=next.actors[0].hp+'%';$('enemyhp').style.width=next.actors[1].hp+'%';$('timer').textContent=Math.ceil(next.time);$('myname').textContent=fighters[selected].name+' · '+next.actors[0].wins+'승';$('enemyname').textContent=fighters[(selected+3)%fighters.length].name+' · '+next.actors[1].wins+'승';
 for(const ev of match.drainEvents()){if(ev.type==='hit'){$('message').textContent=ev.kind==='heavy'?'강타!':'HIT';flash=.24}else if(ev.type==='block'){$('message').textContent='BLOCK';flash=.16}else if(ev.type==='round'){$('message').textContent=ev.winner===0?'라운드 승리':ev.winner===1?'라운드 패배':'무승부'}else if(ev.type==='matchEnd'){$('message').textContent=ev.winner===0?'승리!':'패배!'}}
 if(next.round!==lastRound){lastRound=next.round;$('message').textContent='ROUND '+next.round}
 flash=Math.max(0,flash-dt);if(!flash&&!next.finished&&next.time<74)$('message').textContent='';
 }
 camera.aspect=innerWidth/innerHeight;renderer.render(scene,camera)}frame();window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
