<!doctype html>
<html lang="ko">
<head>

  <title>Vibe2 bootstrap</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f0f0f0;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 20px;
      background-color: #fff;
    }
    h1 {
      margin-bottom: 20px;
    }
    #game {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 600px;
    }
    .piece {
      width: 40px;
      height: 40px;
      background-color: #ccc;
      border: 2px solid #999;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 16px;
      color: #000;
      border-radius: 4px;
      box-shadow: 0 0 5px rgba(0,0,0,0.2);
    }
    .piece.selected {
      background-color: #007BFF;
      color: white;
    }
    .piece.empty {
      background-color: #eee;
    }
    .move-feedback {
      margin-top: 10px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
