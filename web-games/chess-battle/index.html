<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vibe2</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f0f0f0;
    }
    main {
      padding: 20px;
      background-color: #fff;
      margin: 0 auto;
      max-width: 600px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .game-board {
      display: grid;
      grid-template-columns: repeat(8, 60px);
      grid-template-rows: repeat(8, 60px);
      gap: 5px;
      margin: 20px 0;
    }
    .square {
      width: 60px;
      height: 60px;
      background-color: #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #333;
      border: 1px solid #aaa;
    }
    .square.selected {
      background-color: #007bff;
      color: white;
    }
    .square.occupied {
      background-color: #007bff;
      color: white;
    }
    .square.empty {
      background-color: #fff;
      color: #999;
    }
    .controls {
      text-align: center;
      margin: 20px 0;
    }
    .controls button {
      padding: 10px 20px;
      font-size: 18px;
      margin: 0 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background-color: #f0f0f0;
      cursor: pointer;
    }
    .controls button:hover {
      background-color: #e0e0e0;
    }
  </style>
</head>
<body>
  <main id="game">
    <h1>Vibe2</h1>
    <div class="game-board" id="board"></div>
    <div class="controls">
      <button id="newGame">새 게임</button>
      <button id="restart">재시작</button>
    </div>
  </main>

  <script>
    const board = document.getElementById('board');
    const newGameBtn = document.getElementById('newGame');
    const restartBtn = document.getElementById('restart');

    // Initialize board
    function initBoard() {
      for (let row = 0; row < 8; row++) {
        for (let col = 0; col < 8; col++) {
          const square = document.createElement('div');
          square.className = 'square';
          square.dataset.row = row;
          square.dataset.col = col;
          square.addEventListener('click', () => selectSquare(square));
          board.appendChild(square);
        }
      }
    }

    // Select a square
    function selectSquare(square) {
      if (square.classList.contains('selected')) return;
      square.classList.add('selected');
      square.style.backgroundColor = '#007bff';
      square.style.color = 'white';
    }

    // Unselect square
    function unselectSquare(square) {
      if (square.classList.contains('selected')) {
        square.classList.remove('selected');
        square.style.backgroundColor = '#ddd';
        square.style.color = '#333';
      }
    }

    // New game
    newGameBtn.addEventListener('click', () => {
      board.innerHTML = '';
      initBoard();
    });

    // Restart game
    restartBtn.addEventListener('click', () => {
      board.innerHTML = '';
      initBoard();
    });
  </script>
</body>
</html>
