 {id:"s1",type:"스토리",name:"잃어버린 아들",npc:"elder",description:"협곡에서 마일을 찾고 촌장에게 돌아오기",mode:"story",gold:180,xp:95},
 {id:"s2",type:"스토리",name:"도착하지 않은 편지",npc:"courier",description:"유적의 티아에게 편지를 전하고 아린에게 돌아오기",mode:"story",gold:230,xp:135},
 {id:"s3",type:"스토리",name:"봉인된 목소리",npc:"librarian",description:"늪의 제단을 조사하고 오렐에게 돌아오기",mode:"story",gold:290,xp:180},
 {id:"s4",type:"스토리",name:"검은 왕좌의 비밀",npc:"watcher",description:"5번째 사냥터 보스를 쓰러뜨리고 에드에게 돌아오기",mode:"story",gold:600,xp:300}
];

// 저장 / 능력치
function newGame(){return {version:1,level:1,xp:0,gold:80,hp:108,mp:29,area:0,owned:["w0","a0"],equip:{weapon:"w0",armor:"a0",accessory:null},potions:3,quest:{},progress:{},flags:{},kills:{},bossBeaten:false};}
function readGame(){
 try{
  const raw=JSON.parse(localStorage.getItem(SAVE_KEY));
  if(!raw||raw.version!==1||!Number.isInteger(raw.level)||raw.level<1||raw.level>99)return newGame();
  const s=Object.assign(newGame(),raw);
  s.owned=Array.isArray(raw.owned)?raw.owned.filter(id=>ALL_ITEMS.some(i=>i.id===id)):["w0","a0"];
  for(const id of ["w0","a0"])if(!s.owned.includes(id))s.owned.push(id);
  s.equip=Object.assign({weapon:"w0",armor:"a0",accessory:null},raw.equip||{});
  for(const [slot,base] of [["weapon","w0"],["armor","a0"],["accessory",null]])if(s.equip[slot]!==null&&!s.owned.includes(s.equip[slot]))s.equip[slot]=base;
  s.quest=raw.quest&&typeof raw.quest==="object"?raw.quest:{};
  s.progress=raw.progress&&typeof raw.progress==="object"?raw.progress:{};
  s.flags=raw.flags&&typeof raw.flags==="object"?raw.flags:{};
  s.kills=raw.kills&&typeof raw.kills==="object"?raw.kills:{};
  s.area=Number.isInteger(raw.area)&&raw.area>=0&&raw.area<5?raw.area:0;
  s.gold=Math.max(0,Number(raw.gold)||0);s.xp=Math.max(0,Number(raw.xp)||0);s.potions=Math.max(0,Math.min(99,Number(raw.potions)||0));
  return s;
 }catch(e){return newGame();}
}
let state=readGame(),battle=null,tab="npc",focusNpc=null,noticeTimer=0,floatTimer=0;
const item=id=>ALL_ITEMS.find(i=>i.id===id);
function ability(){
 const w=item(state.equip.weapon)||WEAPONS[0],a=item(state.equip.armor)||ARMORS[0],r=item(state.equip.accessory)||{};
 return {atk:12+state.level*3+w.atk+(r.atk||0),def:2+state.level+a.def+(r.def||0),maxHp:95+state.level*13,maxMp:25+state.level*4};
}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(state));}catch(e){notify("저장 공간이 부족해. 진행도가 저장되지 않았어.");}}
function notify(msg){$('notice').textContent=msg;$('notice').classList.add("on");clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('notice').classList.remove("on"),2400);}
function popNumber(value){$('floatText').textContent=value;$('floatText').classList.add("show");clearTimeout(floatTimer);floatTimer=setTimeout(()=>$('floatText').classList.remove("show"),650);}
function showModal(title,description){$('modalTitle').textContent=title;$('modalText').textContent=description;$('modal').classList.add("open");}
$('modalClose').addEventListener("click",()=>$('modal').classList.remove("open"));
function xpLimit(){return 36+state.level*26;}
function giveXp(amount){
 state.xp+=amount;
 let ups=0;
 while(state.level<99&&state.xp>=xpLimit()){
  state.xp-=xpLimit();state.level++;ups++;
  state.hp=ability().maxHp;state.mp=ability().maxMp;
 }
 if(ups)notify("레벨 상승! 현재 레벨 "+state.level+" · 체력과 마력 회복");
}
function questActive(id){return state.quest[id]==="active";}
function ready(q){
 if(!questActive(q.id))return false;
 if(q.mode==="story")return !!state.flags[q.id];
 return (Number(state.progress[q.id])||0)>=q.need;
}
function getProgress(q){
 if(q.mode==="story")return state.flags[q.id]?"목표 달성 · 보고 가능":"단서를 찾아야 해";
 return Math.min(q.need,Number(state.progress[q.id])||0)+"/"+q.need;
}
function questButton(q){
 const status=state.quest[q.id];
 if(status==="done")return '<button disabled>완료</button>';
 if(status==="active")return ready(q)?'<button class="ready" data-quest="'+q.id+'">보상받기</button>':'<button disabled>진행 중</button>';
 return '<button data-quest="'+q.id+'">퀘스트 받기</button>';
}
function questCard(q,actions){
 const status=state.quest[q.id],pct=q.mode==="story"?(state.flags[q.id]?100:0):Math.min(100,(Number(state.progress[q.id])||0)/q.need*100);
 return '<div class="row"><div class="rowtxt"><span class="tag">'+q.type+'</span><span class="tag gold">'+(status==="done"?"완료":status==="active"?"진행 중":"시작 가능")+'</span><br><b>'+q.name+'</b><small>'+q.description+'</small><small>'+getProgress(q)+' · 보상 '+q.gold+'G / 경험치 '+q.xp+'</small><div class="progress"><i style="width:'+pct+'%"></i></div></div>'+(actions?questButton(q):"")+'</div>';
}
function changeQuest(id){
 const q=QUESTS.find(v=>v.id===id),npc=NPCS.find(n=>n.id===q?.npc);
 if(!q||!npc||npc.zone!==state.area||battle)return;
 if(!state.quest[id]){state.quest[id]="active";notify("퀘스트 시작: "+q.name);}
 else if(ready(q)){state.quest[id]="done";state.gold+=q.gold;giveXp(q.xp);notify("퀘스트 완료: "+q.name+" · "+q.gold+"G");if(id==="s4")showModal("왕국에 다시 빛이", "왕좌의 수호자를 쓰러뜨리고 긴 저주를 끝냈어.\n남은 사냥터에서도 계속 모험할 수 있어.");}
 persist();render();
}
function explore(){
 if(battle||state.area===4){notify("이곳은 탐험 대신 보스 전투만 가능해.");return;}
 const area=state.area,found=[];
 for(const q of QUESTS)if(q.mode==="explore"&&q.zone===area&&questActive(q.id)){
  state.progress[q.id]=Math.min(q.need,(Number(state.progress[q.id])||0)+1);
  found.push(q.name+" "+getProgress(q));
 }
 if(area===1&&questActive("s1")&&!state.flags.s1){state.flags.s1=true;found.push("잃어버린 아들 마일을 찾았어! 촌장에게 돌아가.");}
 if(area===3&&questActive("s3")&&!state.flags.s3){state.flags.s3=true;found.push("봉인된 제단의 목소리를 확인했어! 오렐에게 보고해.");}
 notify(found.length?found[0]:"주변을 조사했어. 새로운 단서는 없었어.");
 if(found.length>1)showModal("탐험에서 찾은 단서",found.join("\n"));
 persist();render();
}
function talk(id){
 const n=NPCS.find(v=>v.id===id);
 if(!n||n.zone!==state.area||battle)return;
 if(n.id==="son"&&!state.flags.s1)return;
 focusNpc=id;
 if(n.id==="tia"&&questActive("s2")&&!state.flags.s2){state.flags.s2=true;showModal("편지를 전했어","기록관 티아가 편지를 받았어.\n이제 붉은 협곡의 전령 아린에게 돌아가.");persist();}
 render();
}
function npcCard(n){
 const nquests=QUESTS.filter(q=>n.quests.includes(q.id));
 const readyCount=nquests.filter(ready).length;
 return '<div class="row"><div class="rowtxt"><b>'+n.name+'</b><small>'+n.role+'</small><small>'+nquests.length?(nquests.map(q=>state.quest[q.id]==="done"?"완료":q.name).join(" · ")):"대화할 수 있어"+'</small></div><button class="'+(readyCount?"ready":"")+'" data-npc="'+n.id+'">대화</button></div>';
}
function renderNpc(){
 const visible=NPCS.filter(n=>n.zone===state.area&&(n.id!=="son"||state.flags.s1));
 if(state.area===4){return '<h3>검은 왕좌</h3><p class="note">이곳에는 사람이 없어. 사냥 버튼을 눌러 보스와 맞서.</p>';}
 const current=visible.find(n=>n.id===focusNpc);
 if(current){
  const qs=QUESTS.filter(q=>current.quests.includes(q.id));
  return '<button class="back" data-back="1">← 주민 목록</button><h3>'+current.name+'</h3><p class="note">'+current.text+'</p>'+
   (qs.length?qs.map(q=>questCard(q,true)).join(""):'<p class="note">현재 받을 퀘스트는 없어.</p>');
 }
 return '<h3>사냥터 주민</h3><p class="note">주민에게 말을 걸면 퀘스트를 받을 수 있어. 일부 주민은 이야기를 들려줘.</p>'+visible.map(n=>npcCardFixed(n)).join("");
}
function npcCardFixed(n){
 const qs=QUESTS.filter(q=>n.quests.includes(q.id));
 const active=qs.filter(q=>state.quest[q.id]!=="done");
 const badge=active.some(ready)?"보상 가능":active.length?"퀘스트 "+active.length+"개":"대화";
 return '<div class="row"><div class="rowtxt"><b>'+n.name+'</b><small>'+n.role+'</small><span class="tag gold">'+badge+'</span></div><button data-npc="'+n.id+'">대화</button></div>';
}
function renderQuests(){
 const done=QUESTS.filter(q=>state.quest[q.id]==="done").length;
 return '<h3>모험 일지</h3><p class="note">전투 3개 · 모험 4개 · 스토리 4개 · 완료 '+done+'/11<br>퀘스트는 해당 주민에게 수락하고 완료 보고해야 해.</p>'+
 ["전투","모험","스토리"].map(type=>'<h4>'+type+' 퀘스트</h4>'+QUESTS.filter(q=>q.type===type).map(q=>questCard(q,false)).join("")).join("");
}
function renderBag(){
 const a=ability();
 const slot=(kind,label,base)=>'<div class="equipment"><b>'+label+'</b><div class="note">'+(item(state.equip[kind])?.name||base)+'</div></div>';
 return '<h3>장비와 능력치</h3><p class="note">공격력 '+a.atk+' · 방어력 '+a.def+' · 경험치 '+state.xp+'/'+xpLimit()+'<br>물약 '+state.potions+'개 · 획득 장비 '+state.owned.length+'/19종</p>'+
 slot("weapon","무기","없음")+slot("armor","방어구","없음")+slot("accessory","악세서리","없음")+
 '<h4>보유 장비</h4>'+ALL_ITEMS.filter(it=>state.owned.includes(it.id)).map(it=>itemCard(it)).join("");
}
function itemSlot(it){return it.id[0]==="w"?"weapon":it.id[0]==="a"?"armor":"accessory";}
function itemCard(it){
 const slot=itemSlot(it),owned=state.owned.includes(it.id),wearing=state.equip[slot]===it.id;
 const bonus=(it.atk?"공격 +"+it.atk+" ":"")+(it.def?"방어 +"+it.def:"");
 const disabled=state.level<it.level;
 let btn=wearing?'<button disabled>장착 중</button>':owned?'<button data-equip="'+it.id+'">장착</button>':disabled?'<button disabled>레벨 부족</button>':state.gold<it.price?'<button disabled>골드 부족</button>':'<button data-buy="'+it.id+'">'+it.price+'G 구매</button>';
 return '<div class="row"><div class="rowtxt"><b>'+it.name+'</b><small>레벨 '+it.level+' · '+bonus+'</small></div>'+btn+'</div>';
}
function renderShop(){
 return '<h3>장비 상점</h3><p class="note">무기 7종 · 방어구 8종 · 악세서리 4종<br>구매한 장비는 영구 소유하고 언제든 바꿀 수 있어.</p>'+
 '<div class="row"><div class="rowtxt"><b>회복 물약</b><small>전투 중 체력 55 회복 · 25G</small></div><button data-potion="1" '+(state.gold<25?"disabled":"")+'>25G 구매</button></div>'+
 '<h4>무기 7종</h4>'+WEAPONS.map(itemCard).join("")+'<h4>방어구 8종</h4>'+ARMORS.map(itemCard).join("")+
 '<h4>악세서리 4종</h4>'+ACCESSORIES.map(itemCard).join("");
}
function renderPanel(){
 document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("sel",b.dataset.tab===tab));
 $('content').innerHTML=tab==="npc"?renderNpc():tab==="quest"?renderQuests():tab==="bag"?renderBag():renderShop();
}
function buy(id){
 const it=item(id);
 if(!it||battle||state.owned.includes(id)||state.level<it.level||state.gold<it.price)return;
 state.gold-=it.price;state.owned.push(id);
 state.equip[itemSlot(it)]=id;
 state.hp=Math.min(state.hp,ability().maxHp);
 persist();render();notify(it.name+" 구매 및 장착!");
}
function equip(id){
 const it=item(id);
 if(!it||battle||!state.owned.includes(id))return;
 state.equip[itemSlot(it)]=id;persist();render();notify(it.name+" 장착");
}
function rest(){
 if(battle)return;
 const a=ability(),fee=state.area===0?0:18;
 if(state.gold<fee){notify("야영 비용 "+fee+"G가 부족해.");return;}
 if(state.hp>=a.maxHp&&state.mp>=a.maxMp){notify("이미 충분히 회복했어.");return;}
 state.gold-=fee;state.hp=a.maxHp;state.mp=a.maxMp;persist();render();notify(fee?"야영 후 완전히 회복했어. -18G":"숲 야영지에서 무료로 회복했어.");
}

// 전투
function startBattle(){
 if(battle)return;
 const id=ZONES[state.area].enemy,e=ENEMIES[id];
 battle={id,hp:e.hp,maxHp:e.hp,turn:0,guard:false,busy:false,log:e.name+"이(가) 나타났어. 행동을 선택해."};
 $('battlePanel').hidden=false;$('outsideActions').hidden=true;
 focusNpc=null;render();rebuildStage();
}
function enemyTurn(b){
 if(battle!==b)return;
 const e=ENEMIES[b.id],a=ability();
 let dmg=Math.max(1,e.atk+Math.floor(Math.random()*7)-3-a.def);
 if(b.id==="boss"&&b.turn%3===0)dmg=Math.round(dmg*1.6);
 if(b.guard)dmg=Math.max(1,Math.floor(dmg*.42));
 state.hp=Math.max(0,state.hp-dmg);b.guard=false;
 b.log=e.name+"의 반격! 체력 -"+dmg+(b.id==="boss"&&b.turn%3===0?" · 파멸의 일격":"");
 popNumber("-"+dmg+" HP");
 if(state.hp===0){
  const lost=Math.floor(state.gold*.12);state.gold=Math.max(0,state.gold-lost);state.hp=Math.ceil(ability().maxHp*.55);state.mp=Math.ceil(ability().maxMp*.6);
  battle=null;showModal("전투 패배",e.name+"에게 패배했어.\n야영지에서 회복했어. 골드 "+lost+"G를 잃었지만 퀘스트와 장비는 유지돼.");
  rebuildStage();
 }else b.busy=false;
 persist();render();
}
function winBattle(b){
 const e=ENEMIES[b.id];
 battle=null;state.gold+=e.gold;state.kills[b.id]=(Number(state.kills[b.id])||0)+1;
 for(const q of QUESTS)if(q.mode==="kill"&&q.zone===state.area&&questActive(q.id))state.progress[q.id]=Math.min(q.need,(Number(state.progress[q.id])||0)+1);
 if(b.id==="boss"){state.bossBeaten=true;state.flags.s4=true;}
 giveXp(e.xp);state.mp=Math.min(ability().maxMp,state.mp+4);persist();render();rebuildStage();
 showModal(b.id==="boss"?"검은 왕좌 정복!":"몬스터 처치",e.name+"을(를) 쓰러뜨렸어.\n+"+e.xp+" 경험치 · +"+e.gold+"G"+(b.id==="boss"?"\n달그림자 늪의 감시자 에드에게 돌아가.":""));
}
function fight(action){
 const b=battle;if(!b||b.busy)return;
 const e=ENEMIES[b.id],a=ability();
 if(action==="flee"){
  if(b.id==="boss"){notify("보스 전투에서는 도망칠 수 없어.");return;}
  if(Math.random()<.8){battle=null;rebuildStage();render();notify("무사히 도망쳤어.");return;}
  b.log="도망치기에 실패했어!";
 }else if(action==="potion"){
  if(state.potions<=0){notify("물약이 없어. 상점에서 구매해.");return;}
  if(state.hp>=a.maxHp){notify("체력이 이미 최대야.");return;}
  state.potions--;let heal=Math.min(55,a.maxHp-state.hp);state.hp+=heal;b.log="회복 물약 사용! 체력 +"+heal;
 }else if(action==="guard"){
  b.guard=true;state.mp=Math.min(a.maxMp,state.mp+5);b.log="방어 태세! 다음 반격 피해를 크게 줄이고 마력 +5";
 }else{
  if(action==="skill"&&state.mp<9){notify("마력이 9 필요해.");return;}
  if(action==="skill")state.mp-=9;
  const crit=Math.random()<.13;
  const base=Math.max(1,a.atk-e.def+Math.floor(Math.random()*7)-3);
  const dealt=Math.max(1,Math.round(base*(action==="skill"?1.9:1)*(crit?1.55:1)));
  b.hp=Math.max(0,b.hp-dealt);
  b.log=(action==="skill"?"강타! ":"일반 공격! ")+dealt+" 피해"+(crit?" · 치명타!":"");
  popNumber("-"+dealt);
  if(heroAnchor)heroStrike=1;
  if(b.hp===0){winBattle(b);return;}
 }
 b.turn++;b.busy=true;persist();render();setTimeout(()=>enemyTurn(b),460);
}

// 메인 화면
function render(){
 const a=ability(),zone=ZONES[state.area];
 state.hp=Math.max(0,Math.min(a.maxHp,state.hp));state.mp=Math.max(0,Math.min(a.maxMp,state.mp));
 $('level').textContent=state.level;
 $('hp').textContent=state.hp+"/"+a.maxHp;
 $('mp').textContent=state.mp+"/"+a.maxMp;
 $('gold').textContent=Math.floor(state.gold).toLocaleString("ko-KR");
 $('zoneCount').textContent="사냥터 "+String(state.area+1).padStart(2,"0")+" / 05";
 $('zoneTitle').textContent=zone.name;
 $('zoneSub').textContent=zone.sub;
 $('map').innerHTML=ZONES.map((z,i)=>{
  const locked=state.level<z.level;
  return '<button class="zone '+(i===state.area?"active":"")+'" data-zone="'+i+'" '+(battle||locked?"disabled":"")+'><b>'+(i+1)+'. '+z.name+'</b><small>'+(locked?"레벨 "+z.level+" 필요":i===4&&state.bossBeaten?"보스 처치 완료":i===state.area?"탐험 중":"이동 가능")+'</small></button>';
 }).join("");
 $('battlePanel').hidden=!battle;$('outsideActions').hidden=!!battle;
 $('enemyBadge').textContent=battle?"전투 중 · "+ENEMIES[battle.id].name:state.area===4&&state.bossBeaten?"왕좌의 수호자 격파":"위험도: "+(state.area+1)+"/5";
 if(battle){
  $('battleName').textContent=ENEMIES[battle.id].name;
  $('battleHealth').textContent=battle.hp+" / "+battle.maxHp;
  $('enemyHealthBar').style.width=Math.max(0,100*battle.hp/battle.maxHp)+"%";
  $('battleLog').textContent=battle.log;
  document.querySelectorAll("[data-fight]").forEach(btn=>{btn.disabled=battle.busy||(btn.dataset.fight==="skill"&&state.mp<9)||(btn.dataset.fight==="potion"&&state.potions<1)||(btn.dataset.fight==="flee"&&battle.id==="boss");});
  document.querySelector('[data-fight="potion"]').textContent="물약 ("+state.potions+")";
 }
 renderPanel();
}
document.addEventListener("click",event=>{
 const b=event.target.closest("button");if(!b)return;
 if(b.dataset.zone!==undefined){const i=Number(b.dataset.zone);if(!battle&&ZONES[i]&&state.level>=ZONES[i].level){state.area=i;focusNpc=null;persist();render();rebuildStage();}return;}
 if(b.dataset.action){if(b.dataset.action==="hunt")startBattle();else if(b.dataset.action==="explore")explore();else rest();return;}
 if(b.dataset.fight){fight(b.dataset.fight);return;}
 if(b.dataset.tab){tab=b.dataset.tab;focusNpc=null;renderPanel();return;}
 if(b.dataset.npc){talk(b.dataset.npc);return;}
 if(b.dataset.back){focusNpc=null;renderPanel();return;}
 if(b.dataset.quest){changeQuest(b.dataset.quest);return;}
 if(b.dataset.buy){buy(b.dataset.buy);return;}
 if(b.dataset.equip){equip(b.dataset.equip);return;}
 if(b.dataset.potion){if(state.gold>=25&&!battle){state.gold-=25;state.potions++;persist();render();notify("물약을 구매했어.");}}
});

// 3D: 기존 CC0 GLB만 사용. 원형 파츠로 몬스터/NPC/장식을 대체하지 않음.
let renderer,scene3,camera3,stageGroup,heroAnchor,enemyAnchor,heroStrike=0,loaded=false;
const assets={},loader=new GLTFLoader();
const names=["warrior","cleric","slime","orc","golem","ghost","winged","tree","tree-high","tree-crooked","rock-small","rock-large","rock-wide","wall-broken","wall-arch","pillar-stone","lantern"];
const sceneCanvas=$("scene");
function init3D(){
 try{
  renderer=new THREE.WebGLRenderer({canvas:sceneCanvas,antialias:true,alpha:false,powerPreference:"low-power"});
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.8));
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.35;
  scene3=new THREE.Scene();
  camera3=new THREE.PerspectiveCamera(42,1,.1,100);
  camera3.position.set(0,7.2,13.6);camera3.lookAt(0,1,0);
  scene3.add(new THREE.HemisphereLight(0xc9e7ff,0x594e37,2.1));
  const sun=new THREE.DirectionalLight(0xffebc9,2.5);sun.position.set(-3,11,9);scene3.add(sun);
  stageGroup=new THREE.Group();scene3.add(stageGroup);
  resize3D();window.addEventListener("resize",resize3D);
  const ro=new ResizeObserver(resize3D);ro.observe($("world"));
  load3D();
  requestAnimationFrame(frame3D);
 }catch(err){$('modelStatus').textContent="3D 시작 실패: 브라우저 그래픽 지원 확인 필요";}
}
function resize3D(){
 if(!renderer||!camera3)return;
 const w=$("world").clientWidth,h=$("world").clientHeight;
 if(w<10||h<10)return;
 renderer.setSize(w,h,false);camera3.aspect=w/h;camera3.fov=w<430?47:42;camera3.updateProjectionMatrix();
}
async function load3D(){
 const results=await Promise.allSettled(names.map(name=>new Promise((resolve,reject)=>{
  loader.load("../../assets/shared/party/"+name+".glb",gltf=>{assets[name]=gltf.scene;resolve();},undefined,reject);
 })));
 loaded=true;
 const errors=results.filter(r=>r.status==="rejected").length;
 $('modelStatus').textContent=errors?errors+"개 3D 모델 로드 실패 · 네트워크 확인":"CC0 3D 원본 모델 적용";
 rebuildStage();
 if(!errors)setTimeout(()=>{$('modelStatus').style.display="none";},2800);
}
function placeModel(name,height,x,z,rotation){
 const template=assets[name];if(!template)return null;
 const sceneCopy=template.clone(true);
 const initialBox=new THREE.Box3().setFromObject(sceneCopy),size=new THREE.Vector3();initialBox.getSize(size);
 const scale=height/Math.max(.01,size.y);sceneCopy.scale.setScalar(scale);
 const finalBox=new THREE.Box3().setFromObject(sceneCopy);
 sceneCopy.position.set(-(finalBox.min.x+finalBox.max.x)/2,-finalBox.min.y,-(finalBox.min.z+finalBox.max.z)/2);
 const anchor=new THREE.Group();anchor.position.set(x,0,z);anchor.rotation.y=rotation||0;anchor.add(sceneCopy);stageGroup.add(anchor);
 return anchor;
}
function rebuildStage(){
 if(!loaded||!stageGroup)return;
 while(stageGroup.children.length)stageGroup.remove(stageGroup.children[0]);
 const area=ZONES[state.area];
 scene3.background=new THREE.Color(area.sky);scene3.fog=new THREE.Fog(area.sky,13,39);
 const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:area.ground,roughness:1}));
 ground.rotation.x=-Math.PI/2;ground.position.y=-.03;stageGroup.add(ground);
 const spots=[[-6,-2.9],[-4.5,-7.6],[5.3,-4.4],[6.2,1.9],[.2,-8.0]];
 area.decor.forEach((name,i)=>placeModel(name,name.includes("tree")?4.6:name.includes("wall")?2.9:name.includes("pillar")?3.6:name==="lantern"?2.6:2.0,spots[i][0],spots[i][1],i*.75));
 heroAnchor=placeModel("warrior",2.8,-2.3,.2,.6);
 enemyAnchor=placeModel(ENEMIES[area.enemy].model,ENEMIES[area.enemy].height,2.4,-.2,-.5);
 if(!battle&&state.area!==4)placeModel("cleric",2.5,-.1,-4.5,.2);
}
function frame3D(time){
 requestAnimationFrame(frame3D);
 if(!renderer||!scene3)return;
 const t=time*.001;
 if(heroAnchor){
  heroStrike=Math.max(0,heroStrike-.04);
  heroAnchor.position.y=.02*Math.sin(t*2.4);
  heroAnchor.position.x=-2.3+Math.sin(heroStrike*Math.PI)*.8;
 }
 if(enemyAnchor){enemyAnchor.position.y=.055*Math.sin(t*1.6);enemyAnchor.rotation.y=-.5+.13*Math.sin(t*.85);}
 renderer.render(scene3,camera3);
}
render();
persist();
init3D();
</script>
</body>
