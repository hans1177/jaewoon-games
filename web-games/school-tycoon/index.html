<!doctype html>
<!-- 파일명: web-games/school-tycoon/index.html -->
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#83c7f2"><title>학교 타이쿤</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#c5e8fc;color:#16334a;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}button{font:inherit;cursor:pointer}button:disabled{opacity:.45;cursor:default}.hud{position:sticky;top:0;z-index:3;background:#15344bed;color:white;padding:10px 12px;box-shadow:0 3px 10px #15344b33}.title{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:900;font-size:17px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:9px}.stat{padding:6px 4px;text-align:center;background:#ffffff1d;border-radius:9px;font-size:10px}.stat b{display:block;font-size:14px;color:#ffeb9f;margin-top:3px;white-space:nowrap}.game{max-width:960px;margin:auto;padding:10px 10px 95px}.stage{background:#9ed7b0;border:3px solid #ecfff2;border-radius:18px;overflow:hidden;box-shadow:0 6px 22px #36784d33;position:relative}.stage canvas{width:100%;height:auto;display:block;touch-action:manipulation}.hint{font-size:12px;font-weight:700;text-align:center;padding:7px;background:#e8f8eb}.toolbar{background:#fffdf0;border:1px solid #d6dfcf;border-radius:15px;padding:10px;margin-top:10px}.toolbar h3{font-size:15px;margin:0 0 8px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-height:65px;text-align:left;border:1px solid #cbd9d8;border-radius:11px;background:#f1fbff;color:#203c4a;padding:9px;font-size:13px;font-weight:850}.card small{font-size:11px;font-weight:650;color:#527080;margin-top:4px}.card.selected{border:2px solid #e9a22b;background:#fff1c3}.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}.action{min-height:57px;padding:8px 2px;border:0;border-radius:12px;background:#176d94;color:white;font-weight:900;font-size:12px}.action.alt{background:#2b8b56}.action.gold{background:#ba782a}.message{margin-top:10px;border-radius:11px;background:#fffbe7;padding:10px;font-size:12px;font-weight:700;min-height:38px}.progress{height:10px;background:#c7d9e1;border-radius:6px;overflow:hidden;margin-top:8px}.progress>div{background:#f1ba52;height:100%;width:0}.footer{display:flex;justify-content:space-between;gap:12px;margin-top:10px;font-size:11px;color:#4f7485}.footer button{border:1px solid #b5ced5;border-radius:8px;background:white;padding:10px;color:#23526b}@media(min-width:700px){.game{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(320px,1fr);gap:12px}.stage{align-self:start;position:sticky;top:85px}.aside{min-width:0}.hud{padding-left:max(16px,calc((100vw - 960px)/2));padding-right:max(16px,calc((100vw - 960px)/2))}}@media(max-width:355px){.stats{gap:3px}.stat b{font-size:12px}.card{font-size:12px}}
</style></head>
<body><header class="hud"><div class="title"><span>🏫 학교 타이쿤</span><span id="day">1일차 · 오전</span></div><div class="stats"><div class="stat">💰 자금<b id="money">1,500</b></div><div class="stat">👩‍🎓 학생<b id="students">0/0</b></div><div class="stat">📈 수입/초<b id="income">0</b></div><div class="stat">⭐ 평판<b id="reputation">0</b></div></div></header>
<main class="game"><section class="stage"><canvas id="campus" width="640" height="580" aria-label="학교 부지 지도. 빈 땅을 눌러 시설을 건설해"></canvas><div class="hint" id="hint">아래 시설을 선택하고 빈 부지를 눌러 건설해!</div></section><section class="aside"><div class="toolbar"><h3>🏗️ 학교 시설 건설</h3><div class="grid" id="catalog"></div></div><div class="toolbar"><h3>📋 학교 운영</h3><div class="actions"><button class="action" id="recruit">학생 모집<br>💰 100</button><button class="action alt" id="teach">수업 진행<br>💰 보너스</button><button class="action gold" id="upgrade">학교 홍보<br>💰 500</button></div><div class="message" id="message" role="status">먼저 교실을 건설해서 학생을 받아!</div><div style="display:flex;justify-content:space-between;margin-top:10px;font-size:12px"><b>학교 성장도</b><span id="level">레벨 1</span></div><div class="progress"><div id="progress"></div></div><div class="footer"><span>진행 상황은 자동 저장돼</span><button id="reset">새 게임</button></div></div></section></main>
<script>
// ── 메인: 학교 타이쿤 ──
(()=>{
const D=[{n:"교실",i:"🏫",c:300,cap:20,inc:3,col:"#f3e8bc"},{n:"급식실",i:"🍱",c:700,cap:10,inc:9,col:"#ffe1ad"},{n:"도서관",i:"📚",c:1400,cap:15,inc:17,col:"#cbbbe8"},{n:"체육관",i:"🏀",c:2800,cap:25,inc:31,col:"#a6d9e9"},{n:"과학실",i:"🔬",c:5000,cap:25,inc:55,col:"#d0e7a5"},{n:"강당",i:"🎭",c:9500,cap:40,inc:100,col:"#ffc5c5"},{n:"수영장",i:"🏊",c:17500,cap:40,inc:170,col:"#9fddf5"},{n:"신관",i:"🏢",c:32000,cap:65,inc:290,col:"#c3d1ef"}];
const $=x=>document.getElementById(x),cv=$("campus"),ctx=cv.getContext("2d"),KEY="jaewoon_school_tycoon_v1",slots=[{x:105,y:130},{x:270,y:130},{x:435,y:130},{x:105,y:270},{x:270,y:270},{x:435,y:270},{x:105,y:410},{x:270,y:410},{x:435,y:410}];
let state={money:1500,students:0,buildings:Array(9).fill(-1),seconds:0,promo:0},selected=0,actors=Array.from({length:15},(_,i)=>({x:50+(i*49)%540,y:85+(i*83)%430,phase:i*0.73}));try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&Number.isFinite(s.money)&&Array.isArray(s.buildings)&&s.buildings.length===9){state={money:Math.max(0,Math.min(1e12,s.money)),students:Math.max(0,s.students|0),buildings:s.buildings.map(i=>Number.isInteger(i)&&i>=-1&&i<D.length?i:-1),seconds:Math.max(0,s.seconds|0),promo:Math.max(0,Math.min(100,s.promo|0))}}}catch(e){}
const fmt=n=>Math.floor(n).toLocaleString("ko-KR"),built=()=>state.buildings.filter(i=>i>=0),cap=()=>built().reduce((a,i)=>a+D[i].cap,0),inc=()=>Math.floor(built().reduce((a,i)=>a+D[i].inc,0)*Math.min(1,state.students/Math.max(1,cap()))*(1+state.promo/100)),rep=()=>Math.min(100,Math.floor(state.students*.38+built().length*5+state.promo*.32)),price=i=>Math.floor(D[i].c*(1+state.buildings.filter(v=>v===i).length*.6));
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function say(t){$("message").textContent=t;$("hint").textContent=t}
function render(){
$("money").textContent=fmt(state.money);$("students").textContent=state.students+"/"+cap();$("income").textContent=fmt(inc());$("reputation").textContent=rep();$("day").textContent=(1+Math.floor(state.seconds/60))+"일차 · "+(Math.floor(state.seconds%60/30)?"오후":"오전");$("level").textContent="레벨 "+(1+Math.floor(rep()/20));$("progress").style.width=rep()+"%";
const catalog=$("catalog");catalog.replaceChildren();D.forEach((d,i)=>{let b=document.createElement("button");b.className="card"+(selected===i?" selected":"");b.innerHTML="<span>"+d.i+" "+d.n+"</span><small>"+fmt(price(i))+"원 · 정원 +"+d.cap+" · 수입 +"+d.inc+"</small>";b.disabled=!state.buildings.includes(-1);b.addEventListener("click",()=>{selected=i;say(d.n+" 선택! 지도에서 빈 부지를 눌러.");render()});catalog.append(b)});
$("recruit").disabled=state.money<100||cap()<=state.students;$("upgrade").disabled=state.money<500||state.promo>=100;$("teach").disabled=state.students<1;draw();
}
function rounded(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function label(text,x,y,size=16,color="#1c3b51"){ctx.fillStyle=color;ctx.font="900 "+size+"px system-ui";ctx.textAlign="center";ctx.fillText(text,x,y)}
function draw(){
ctx.clearRect(0,0,640,580);ctx.fillStyle="#a9d6a4";ctx.fillRect(0,0,640,580);
for(let y=0;y<580;y+=38)for(let x=(Math.floor(y/38)%2)*19;x<640;x+=38){ctx.fillStyle="#99cb98";ctx.beginPath();ctx.arc(x,y,2,0,Math.PI*2);ctx.fill()}
rounded(12,18,616,64,17,"#dcecff");rounded(20,26,600,48,12,"#f6f1d8");label("🏛️   재운 학교",320,58,26);
rounded(298,82,45,478,10,"#d4c4a6");rounded(24,332,592,39,7,"#d4c4a6");
for(let k=0;k<slots.length;k++){let s=slots[k],v=state.buildings[k];rounded(s.x-67,s.y-37,134,99,12,"#ffffff77");rounded(s.x-61,s.y-43,122,99,11,v<0?"#dcf2d8":D[v].col);if(v<0){ctx.strokeStyle="#6fad80";ctx.lineWidth=3;ctx.setLineDash([7,6]);ctx.strokeRect(s.x-57,s.y-39,114,91);ctx.setLineDash([]);label("＋",s.x,s.y+3,32,"#478653");label("빈 부지",s.x,s.y+33,14,"#478653")}else{rounded(s.x-48,s.y-26,96,48,7,"#ffffffa0");label(D[v].i,s.x,s.y+7,29);label(D[v].n,s.x,s.y+39,15)}}
let count=Math.min(actors.length,Math.floor(state.students/4));for(let i=0;i<count;i++){let a=actors[i],t=state.seconds*.7+a.phase,x=a.x+Math.sin(t*.8+i)*13,y=a.y+Math.cos(t*.9+i)*16;ctx.fillStyle="#315475";ctx.beginPath();ctx.arc(x,y,7,0,7);ctx.fill();ctx.fillStyle=i%3===0?"#f8b978":"#fbe0af";ctx.beginPath();ctx.arc(x,y-7,5,0,7);ctx.fill()}
label("🌳",48,110,26);label("🌲",599,110,29);label("🌳",49,548,28);label("🌲",596,542,28);
}
cv.addEventListener("click",e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*640/r.width,y=(e.clientY-r.top)*580/r.height;const k=slots.findIndex(s=>Math.abs(s.x-x)<=65&&Math.abs(s.y+7-y)<=52);if(k<0){say("빈 부지를 선택해!");return}if(state.buildings[k]!==-1){say(D[state.buildings[k]].n+" 시설이 운영 중이야.");return}const p=price(selected);if(state.money<p){say("돈이 부족해! "+fmt(p)+"원이 필요해.");return}state.money-=p;state.buildings[k]=selected;say(D[selected].n+" 건설 성공! 학생을 모집해.");save();render()});
$("recruit").addEventListener("click",()=>{let n=Math.min(5,cap()-state.students);if(n<=0||state.money<100){say("정원 또는 자금이 부족해.");return}state.money-=100;state.students+=n;say("학생 "+n+"명이 입학했어!");save();render()});
$("teach").addEventListener("click",()=>{if(!state.students)return;let gain=Math.max(30,Math.floor(state.students*4*(1+state.promo/100)));state.money+=gain;say("수업 완료! "+fmt(gain)+"원 보너스 획득");save();render()});
$("upgrade").addEventListener("click",()=>{if(state.money<500||state.promo>=100)return;state.money-=500;state.promo=Math.min(100,state.promo+10);say("학교 홍보 성공! 수업 수입 +10%");save();render()});
$("reset").addEventListener("click",()=>{if(!confirm("학교를 처음부터 다시 시작할까?"))return;state={money:1500,students:0,buildings:Array(9).fill(-1),seconds:0,promo:0};selected=0;save();say("새 학교를 시작했어.");render()});
setInterval(()=>{state.money=Math.min(1e12,state.money+inc());state.seconds++;if(state.seconds%5===0)save();render()},1000);render();
})();
</script></body></html>
