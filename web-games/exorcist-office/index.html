<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0d10">
<title>퇴마 사무소</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b0e;color:#f2f4f6;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;touch-action:none}button{font:inherit}
#game{position:fixed;inset:0;width:100%;height:100%;background:#0b1015}.hidden{display:none!important}
.hud{position:fixed;z-index:8;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 7px) 8px 0;pointer-events:none}.hudrow{display:flex;gap:7px;justify-content:space-between}
.pill{padding:7px 9px;border-radius:12px;background:#070b10e6;border:1px solid #ffffff20;font-size:10px;font-weight:900;backdrop-filter:blur(8px)}.pill.center{flex:1;text-align:center}.pill.right{text-align:right}
.hpbar,.ghostbar{height:7px;background:#ffffff16;border-radius:999px;overflow:hidden;margin-top:5px}.hpbar i{display:block;height:100%;background:#74d0d7;width:100%}.ghostbar i{display:block;height:100%;background:#d97896;width:100%}
.controls{position:fixed;z-index:10;left:max(9px,env(safe-area-inset-left));right:max(9px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));display:flex;align-items:end;justify-content:space-between;pointer-events:none}
.pad{width:138px;height:138px;display:grid;grid-template-columns:46px 46px 46px;grid-template-rows:46px 46px 46px;pointer-events:auto}.pad button,.actions button{border:1px solid #ffffff28;background:#15202ae8;color:#fff;font-weight:1000;box-shadow:0 5px 18px #0009}.pad button{border-radius:13px}.pad .up{grid-column:2}.pad .left{grid-row:2;grid-column:1}.pad .down{grid-row:2;grid-column:2}.pad .right{grid-row:2;grid-column:3}
.actions{display:grid;grid-template-columns:68px 68px;gap:8px;pointer-events:auto}.actions button{min-height:58px;border-radius:15px;padding:5px;font-size:11px}.actions .attack{grid-row:1/3;min-height:124px;background:#e8e0c6;color:#221c12;font-size:15px}.actions .seal{background:#a8d7d0;color:#10221f}.actions .ward{background:#b9a3da;color:#211431}.actions button.cool{filter:saturate(.35);opacity:.65}
.overlay{position:fixed;z-index:20;inset:0;background:#04070bea;overflow:auto;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 18px)}.panel{width:min(100%,720px);margin:0 auto}
.hero{padding:16px;border-radius:20px;background:#0d151d;border:1px solid #ffffff1f}.hero h1{margin:0;font-size:28px}.hero p{margin:6px 0 0;color:#aebbc5;font-size:12px;line-height:1.45}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.stat{padding:10px;border-radius:14px;background:#101923;border:1px solid #ffffff16}.stat b{display:block;font-size:17px}.stat span{font-size:9px;color:#9caebb}
.section{margin-top:12px}.section h2{font-size:15px;margin:0 0 8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card{padding:12px;border-radius:15px;background:#0e171f;border:1px solid #ffffff18;min-width:0}.card h3{margin:0;font-size:14px}.card p{margin:5px 0;color:#a9b8c2;font-size:10px;line-height:1.4}.card .meta{font-size:9px;color:#8095a4}.card button,.wide{width:100%;min-height:43px;border:0;border-radius:11px;margin-top:8px;background:#d9d2b6;color:#211b11;font-weight:1000}.card button:disabled{opacity:.38}.card.done{border-color:#4a9a8260}.rowbtn{display:flex;gap:8px}.rowbtn button{flex:1}
#toast{position:fixed;z-index:30;left:50%;top:82px;transform:translateX(-50%);max-width:84vw;padding:9px 12px;border-radius:12px;background:#080d13ec;border:1px solid #ffffff23;font-size:11px;font-weight:900;text-align:center;opacity:0;transition:.18s;pointer-events:none}#toast.on{opacity:1}
.modal{position:fixed;z-index:40;inset:0;display:grid;place-items:center;background:#020509ed;padding:15px;overflow:auto}.modalbox{width:min(94vw,560px);max-height:86vh;overflow:auto;padding:16px;border-radius:20px;background:#0d151d;border:1px solid #ffffff22}.modalbox h2{margin:0 0 8px}.ghostentry{padding:10px 0;border-bottom:1px solid #ffffff12}.ghostentry b{font-size:14px}.ghostentry p{margin:4px 0;color:#aebbc3;font-size:10px;line-height:1.45}.close{width:100%;min-height:45px;margin-top:12px;border:0;border-radius:12px;background:#d9d2b6;font-weight:1000}
.banner{position:fixed;z-index:9;left:50%;top:calc(env(safe-area-inset-top) + 65px);transform:translateX(-50%);padding:7px 11px;border-radius:11px;background:#080d13dc;border:1px solid #ffffff20;font-size:10px;font-weight:900;pointer-events:none;white-space:nowrap}
@media(max-width:420px){.grid{grid-template-columns:1fr}.hero h1{font-size:24px}.actions{grid-template-columns:62px 62px}.pad{width:132px;height:132px;grid-template-columns:44px 44px 44px;grid-template-rows:44px 44px 44px}}
</style>
</head>
<body data-web-artifact-type="REAL_PLAYABLE_GAME" data-playable-cycle-contract="OFFICE_CONTRACT_EXORCISM_REWARD_EXPANSION">
<canvas id="game"></canvas>
<div class="hud hidden" id="hud"><div class="hudrow"><div class="pill">체력 <b id="hpText">100/100</b><div class="hpbar"><i id="hpBar"></i></div></div><div class="pill center"><b id="siteText">현장</b><div id="objectiveText">귀신을 찾아라</div></div><div class="pill right">보상<br><b id="rewardText">0원</b></div></div><div class="ghostbar hidden" id="ghostHpWrap"><i id="ghostHpBar"></i></div></div>
<div class="banner hidden" id="missionBanner">현장 조사 중</div><div id="toast"></div>
<div class="controls hidden" id="controls"><div class="pad"><button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="down" data-dir="down">▼</button><button class="right" data-dir="right">▶</button></div><div class="actions"><button class="attack" id="attackBtn">퇴마봉<br>공격</button><button class="seal" id="sealBtn">부적<br><span id="sealCd">봉인</span></button><button class="ward" id="wardBtn">결계<br><span id="wardCd">방어</span></button></div></div>
<section class="overlay" id="office"><div class="panel"><div class="hero"><div style="font-size:9px;color:#8799a6">퇴마사 운영 · 현장 액션</div><h1>퇴마 사무소</h1><p>의뢰를 받고 현장으로 가서 귀신을 퇴마해. 돈을 모아 사무소를 확장하면 더 위험하고 보상이 큰 의뢰가 들어와.</p></div><div class="stats"><div class="stat"><b id="moneyText">0원</b><span>보유 자금</span></div><div class="stat"><b id="officeLevelText">1단계</b><span>사무소 규모</span></div><div class="stat"><b id="clearText">0건</b><span>퇴마 완료</span></div></div><div class="section"><h2>의뢰 게시판</h2><div class="grid" id="missionList"></div></div><div class="section"><h2>사무소 확장</h2><div class="grid" id="upgradeList"></div></div><div class="section rowbtn"><button class="wide" id="compendiumBtn">귀신 도감</button><button class="wide" id="resetBtn">새 기록으로 시작</button></div></div></section>
<section class="modal hidden" id="compendium"><div class="modalbox"><h2>귀신 도감</h2><div id="ghostList"></div><button class="close" id="closeCompendium">닫기</button></div></section>
<section class="modal hidden" id="result"><div class="modalbox"><div style="font-size:10px;color:#91a3af">현장 결과</div><h2 id="resultTitle">퇴마 성공</h2><p id="resultDesc" style="color:#b7c3ca;font-size:12px;line-height:1.5"></p><button class="close" id="resultBack">사무소로 돌아가기</button></div></section>
<script>
(()=>{
'use strict';
// 파일명: web-games/exorcist-office/index.html
// 메인
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id),TAU=Math.PI*2,WORLD={w:1700,h:1100},SAVE_KEY='exorcist-office-v1';
const GHOSTS={
wanderer:{name:'떠도는 혼령',danger:1,maxHp:110,damage:10,speed:86,reward:300,color:'#b9c9d8',pattern:'가까이 다가와 할퀸다.',weakness:'부적 봉인',special:'chase'},
shadow:{name:'그림자귀',danger:2,maxHp:155,damage:13,speed:104,reward:520,color:'#6f628c',pattern:'순간이동 후 기습한다.',weakness:'결계로 순간이동을 막은 뒤 공격',special:'blink'},
grudge:{name:'원한귀',danger:3,maxHp:210,damage:17,speed:88,reward:850,color:'#a95a63',pattern:'멀리서 원념탄을 날린다.',weakness:'원념탄을 피한 뒤 빠르게 약화',special:'orb'},
weeper:{name:'울음귀',danger:4,maxHp:270,damage:21,speed:92,reward:1350,color:'#7390a8',pattern:'울음 파동으로 느려지게 한다.',weakness:'결계 사용 중 울음 파동 무효',special:'fear'},
devourer:{name:'굶주린 악귀',danger:5,maxHp:360,damage:27,speed:118,reward:2200,color:'#8d4343',pattern:'체력이 낮을수록 빨라진다.',weakness:'거리 유지 후 빈틈에 공격',special:'rage'},
breaker:{name:'봉인 파괴자',danger:6,maxHp:500,damage:34,speed:100,reward:3800,color:'#8d6a3f',pattern:'저주탄과 돌진을 섞어 공격한다.',weakness:'결계로 큰 공격을 막고 봉인',special:'boss'}};
const MISSIONS=[
{id:'m1',level:1,name:'폐가의 발소리',site:'외곽 폐가',ghost:'wanderer',reward:300,bg:'#1d2729'},
{id:'m2',level:1,name:'원룸의 검은 그림자',site:'오래된 원룸',ghost:'shadow',reward:520,bg:'#22202c'},
{id:'m3',level:2,name:'야간 학교의 비명',site:'폐교',ghost:'grudge',reward:850,bg:'#282323'},
{id:'m4',level:2,name:'빈 병동의 울음',site:'폐병원',ghost:'weeper',reward:1350,bg:'#1f2928'},
{id:'m5',level:3,name:'터널 실종 사건',site:'산길 터널',ghost:'devourer',reward:2200,bg:'#1c1c20'},
{id:'m6',level:4,name:'무너진 봉인',site:'폐사찰',ghost:'breaker',reward:3800,bg:'#29231b'}];
const OFFICE_UPGRADES=[{level:1,next:2,cost:900,label:'사무소 2층 확장',desc:'위험도 3~4 의뢰가 열린다.'},{level:2,next:3,cost:2600,label:'별관 증축',desc:'위험도 5 의뢰가 열린다.'},{level:3,next:4,cost:6000,label:'대형 퇴마 본부',desc:'최상급 위험도 6 의뢰가 열린다.'}];
const ROOMS={talisman:{cost:650,name:'부적 제작실',desc:'봉인 재사용 대기시간 감소'},archive:{cost:1100,name:'영안 기록실',desc:'본 귀신의 공격 패턴 즉시 기록'},training:{cost:1500,name:'수련실',desc:'최대 체력 +20, 공격력 +4'}};
let W=innerWidth,H=innerHeight,dpr=1,running=false,last=0,activeMission=null,player=null,ghost=null,projectiles=[],effects=[],clues=[],cam={x:0,y:0},keys=new Set(),input={up:false,down:false,left:false,right:false},toastTimer=0,save=defaultSave();
function defaultSave(){return{money:0,officeLevel:1,clears:0,rooms:{talisman:false,archive:false,training:false},seen:{},exorcised:{}}}
try{save={...defaultSave(),...JSON.parse(localStorage.getItem(SAVE_KEY)||'{}')};save.rooms={...defaultSave().rooms,...save.rooms};save.seen=save.seen||{};save.exorcised=save.exorcised||{}}catch{}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save))}catch{}}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function norm(dx,dy){const l=Math.hypot(dx,dy)||1;return{x:dx/l,y:dy/l,d:l}}function money(n){return Math.floor(n).toLocaleString('ko-KR')+'원'}function danger(n){return '★'.repeat(n)+'☆'.repeat(6-n)}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('on'),1450)}
function resize(){dpr=Math.min(devicePixelRatio||1,1.7);W=innerWidth;H=innerHeight;canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function renderOffice(){running=false;$('office').classList.remove('hidden');$('hud').classList.add('hidden');$('controls').classList.add('hidden');$('missionBanner').classList.add('hidden');$('moneyText').textContent=money(save.money);$('officeLevelText').textContent=save.officeLevel+'단계';$('clearText').textContent=save.clears+'건';
const ml=$('missionList');ml.innerHTML='';for(const m of MISSIONS){const g=GHOSTS[m.ghost],open=m.level<=save.officeLevel,d=document.createElement('div');d.className='card';d.innerHTML='<div class="meta">위험도 '+danger(g.danger)+'</div><h3>'+m.name+'</h3><p>'+m.site+' · 예상 보상 '+money(m.reward)+'</p><button '+(open?'':'disabled')+'>'+(open?'의뢰 수락':'사무소 확장 필요')+'</button>';if(open)d.querySelector('button').onclick=()=>startMission(m);ml.appendChild(d)}
const ul=$('upgradeList');ul.innerHTML='';const next=OFFICE_UPGRADES.find(x=>x.level===save.officeLevel);if(next){const d=document.createElement('div');d.className='card';d.innerHTML='<h3>'+next.label+'</h3><p>'+next.desc+'</p><div class="meta">비용 '+money(next.cost)+'</div><button '+(save.money<next.cost?'disabled':'')+'>확장하기</button>';d.querySelector('button').onclick=()=>{if(save.money<next.cost)return;save.money-=next.cost;save.officeLevel=next.next;persist();toast('사무소 '+save.officeLevel+'단계 확장 완료');renderOffice()};ul.appendChild(d)}else{const d=document.createElement('div');d.className='card done';d.innerHTML='<h3>사무소 최대 확장</h3><p>최상급 의뢰까지 받을 수 있다.</p>';ul.appendChild(d)}
for(const [key,info] of Object.entries(ROOMS)){const built=save.rooms[key],d=document.createElement('div');d.className='card '+(built?'done':'');d.innerHTML='<h3>'+info.name+'</h3><p>'+info.desc+'</p><div class="meta">'+(built?'건설 완료':'비용 '+money(info.cost))+'</div><button '+(built||save.money<info.cost?'disabled':'')+'>'+(built?'완료':'건설하기')+'</button>';if(!built)d.querySelector('button').onclick=()=>{if(save.money<info.cost)return;save.money-=info.cost;save.rooms[key]=true;persist();toast(info.name+' 건설 완료');renderOffice()};ul.appendChild(d)}}
function showCompendium(){const box=$('ghostList');box.innerHTML='';let found=0;for(const [id,g] of Object.entries(GHOSTS)){const seen=!!save.seen[id],cleared=Number(save.exorcised[id]||0),d=document.createElement('div');d.className='ghostentry';if(!seen){d.innerHTML='<b>???</b><p>아직 직접 본 적 없는 귀신.</p>'}else{found++;let detail='<p>위험도 '+danger(g.danger)+'</p>';if(save.rooms.archive||cleared>0)detail+='<p>공격 패턴: '+g.pattern+'</p>';detail+=cleared>0?'<p>약점: '+g.weakness+'<br>퇴마 성공 '+cleared+'회</p>':'<p>퇴마에 성공하면 약점 정보가 기록된다.</p>';d.innerHTML='<b>'+g.name+'</b>'+detail}box.appendChild(d)}if(!found)box.innerHTML='<p style="color:#9eabb4;font-size:11px">아직 등록된 귀신이 없어. 현장에서 직접 보면 자동 등록돼.</p>';$('compendium').classList.remove('hidden')}
function startMission(m){activeMission=m;const trained=save.rooms.training;player={x:180,y:900,r:16,maxHp:trained?120:100,hp:trained?120:100,speed:180,attack:trained?22:18,attackCd:0,sealCd:0,wardCd:0,wardTime:0,slowTime:0,alive:true,flash:0};const g=GHOSTS[m.ghost];ghost={type:m.ghost,x:1420,y:210,r:20,maxHp:g.maxHp,hp:g.maxHp,damage:g.damage,speed:g.speed,attackCd:1.2,specialCd:3.5,weakened:false,weakenTimer:0,seen:false,flash:0,alive:true};clues=[{x:410,y:260,found:false},{x:930,y:780,found:false},{x:1320,y:520,found:false}];projectiles=[];effects=[];running=true;$('office').classList.add('hidden');$('hud').classList.remove('hidden');$('controls').classList.remove('hidden');$('missionBanner').classList.remove('hidden');$('siteText').textContent=m.site;$('rewardText').textContent=money(m.reward);$('missionBanner').textContent=m.name;last=performance.now();syncHud();toast('현장 도착 · 흔적을 찾고 귀신을 약화시켜');requestAnimationFrame(loop)}
function registerSeen(){if(ghost.seen)return;ghost.seen=true;if(!save.seen[ghost.type]){save.seen[ghost.type]=Date.now();persist();toast(GHOSTS[ghost.type].name+' · 도감 등록')}}
function clueCount(){return clues.filter(c=>c.found).length}function findClues(){for(const c of clues)if(!c.found&&dist(player,c)<42){c.found=true;effects.push({x:c.x,y:c.y,life:.7,max:.7,type:'clue'});toast('귀신 흔적 '+clueCount()+'/3')}}
function playerAttack(){if(!running||!player.alive||player.attackCd>0)return;player.attackCd=.48;effects.push({x:player.x,y:player.y,life:.18,max:.18,type:'slash'});if(ghost.alive&&dist(player,ghost)<105){const dmg=player.attack*(clueCount()<3?.52:1);ghost.hp-=dmg;ghost.flash=.14;effects.push({x:ghost.x,y:ghost.y,life:.22,max:.22,type:'hit'});if(ghost.hp<=0&&!ghost.weakened){ghost.hp=0;ghost.weakened=true;ghost.weakenTimer=6;toast('귀신 약화 · 가까이서 부적으로 봉인해')}}}
function trySeal(){if(!running||!player.alive)return;if(player.sealCd>0)return toast('부적 준비 '+player.sealCd.toFixed(1)+'초');player.sealCd=save.rooms.talisman?4.2:6.2;if(!ghost.weakened||dist(player,ghost)>95)return toast('귀신을 먼저 약화시키고 가까이 가야 해');completeMission()}
function useWard(){if(!running||!player.alive)return;if(player.wardCd>0)return toast('결계 준비 '+player.wardCd.toFixed(1)+'초');player.wardCd=8;player.wardTime=2.2;effects.push({x:player.x,y:player.y,life:2.2,max:2.2,type:'ward'});toast('결계 전개')}
function hurtPlayer(amount){if(!player.alive)return;if(player.wardTime>0){effects.push({x:player.x,y:player.y,life:.25,max:.25,type:'block'});return}player.hp-=amount;player.flash=.18;effects.push({x:player.x,y:player.y,life:.22,max:.22,type:'hurt'});if(player.hp<=0){player.hp=0;player.alive=false;failMission()}}
function completeMission(){running=false;const g=GHOSTS[ghost.type];save.money+=activeMission.reward;save.clears++;save.exorcised[ghost.type]=Number(save.exorcised[ghost.type]||0)+1;save.seen[ghost.type]=save.seen[ghost.type]||Date.now();persist();$('controls').classList.add('hidden');$('hud').classList.add('hidden');$('missionBanner').classList.add('hidden');$('resultTitle').textContent='퇴마 성공';$('resultDesc').textContent=g.name+' 봉인 완료. 보상 '+money(activeMission.reward)+'을 받았어. 사무소를 확장하면 더 어려운 의뢰가 열린다.';$('result').classList.remove('hidden')}
function failMission(){running=false;$('controls').classList.add('hidden');$('hud').classList.add('hidden');$('missionBanner').classList.add('hidden');$('resultTitle').textContent='의뢰 실패';$('resultDesc').textContent='귀신에게 쓰러졌어. 보상은 없지만 본 귀신은 도감에 남아.';$('result').classList.remove('hidden');persist()}
function spawnOrb(){const n=norm(player.x-ghost.x,player.y-ghost.y);projectiles.push({x:ghost.x,y:ghost.y,vx:n.x*250,vy:n.y*250,r:8,life:4,damage:ghost.damage+4})}
function ghostAi(dt){if(!ghost.alive||ghost.weakened)return;const g=GHOSTS[ghost.type],d=dist(player,ghost),n=norm(player.x-ghost.x,player.y-ghost.y);ghost.attackCd=Math.max(0,ghost.attackCd-dt);ghost.specialCd=Math.max(0,ghost.specialCd-dt);
if(g.special==='blink'&&ghost.specialCd<=0&&d>150&&d<520){ghost.x=clamp(player.x-n.x*85+Math.random()*50-25,40,WORLD.w-40);ghost.y=clamp(player.y-n.y*85+Math.random()*50-25,40,WORLD.h-40);ghost.specialCd=4.5;effects.push({x:ghost.x,y:ghost.y,life:.5,max:.5,type:'blink'})}
else if((g.special==='orb'||g.special==='boss')&&ghost.specialCd<=0&&d<600){spawnOrb();ghost.specialCd=g.special==='boss'?2.8:3.8}
else if(g.special==='fear'&&ghost.specialCd<=0&&d<230){if(player.wardTime<=0){player.slowTime=2.5;hurtPlayer(6)}ghost.specialCd=5;effects.push({x:ghost.x,y:ghost.y,life:.65,max:.65,type:'pulse'})}
let sp=ghost.speed;if(g.special==='rage'&&ghost.hp<ghost.maxHp*.45)sp*=1.35;if(d>54){ghost.x+=n.x*sp*dt;ghost.y+=n.y*sp*dt}if(d<62&&ghost.attackCd<=0){hurtPlayer(ghost.damage);ghost.attackCd=g.special==='rage'?.75:1.15}}
function updateProjectiles(dt){for(const p of projectiles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.life>0&&Math.hypot(p.x-player.x,p.y-player.y)<p.r+player.r){hurtPlayer(p.damage);p.life=0}}projectiles=projectiles.filter(p=>p.life>0)}
function movePlayer(dt){if(!player.alive)return;let dx=(input.right||keys.has('KeyD')||keys.has('ArrowRight')?1:0)-(input.left||keys.has('KeyA')||keys.has('ArrowLeft')?1:0),dy=(input.down||keys.has('KeyS')||keys.has('ArrowDown')?1:0)-(input.up||keys.has('KeyW')||keys.has('ArrowUp')?1:0);if(!dx&&!dy)return;const n=norm(dx,dy),sp=player.speed*(player.slowTime>0?.55:1);player.x=clamp(player.x+n.x*sp*dt,35,WORLD.w-35);player.y=clamp(player.y+n.y*sp*dt,35,WORLD.h-35)}
function update(dt){player.attackCd=Math.max(0,player.attackCd-dt);player.sealCd=Math.max(0,player.sealCd-dt);player.wardCd=Math.max(0,player.wardCd-dt);player.wardTime=Math.max(0,player.wardTime-dt);player.slowTime=Math.max(0,player.slowTime-dt);player.flash=Math.max(0,player.flash-dt);ghost.flash=Math.max(0,ghost.flash-dt);if(ghost.weakened){ghost.weakenTimer-=dt;if(ghost.weakenTimer<=0){ghost.weakened=false;ghost.hp=ghost.maxHp*.28;toast('봉인 실패 · 귀신이 다시 일어났다')}}movePlayer(dt);findClues();if(dist(player,ghost)<310)registerSeen();ghostAi(dt);updateProjectiles(dt);for(const e of effects)e.life-=dt;effects=effects.filter(e=>e.life>0);cam.x=clamp(player.x-W/2,0,Math.max(0,WORLD.w-W));cam.y=clamp(player.y-H/2,0,Math.max(0,WORLD.h-H));syncHud()}
function syncHud(){$('hpText').textContent=Math.ceil(player.hp)+'/'+player.maxHp;$('hpBar').style.width=(clamp(player.hp/player.maxHp,0,1)*100)+'%';$('objectiveText').textContent=ghost.weakened?'귀신을 부적으로 봉인해':clueCount()<3?'흔적 '+clueCount()+'/3 · 귀신이 단단함':'귀신을 약화시켜 봉인해';$('ghostHpWrap').classList.toggle('hidden',!ghost.seen);$('ghostHpBar').style.width=(clamp(ghost.hp/ghost.maxHp,0,1)*100)+'%';$('sealCd').textContent=player.sealCd>0?player.sealCd.toFixed(1)+'s':'봉인';$('wardCd').textContent=player.wardCd>0?player.wardCd.toFixed(1)+'s':'방어';$('sealBtn').classList.toggle('cool',player.sealCd>0);$('wardBtn').classList.toggle('cool',player.wardCd>0);$('attackBtn').classList.toggle('cool',player.attackCd>0)}
function ws(x,y){return{x:x-cam.x,y:y-cam.y}}function drawWorld(){ctx.fillStyle=activeMission.bg;ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(-cam.x,-cam.y);ctx.fillStyle='#ffffff06';for(let x=0;x<WORLD.w;x+=140)for(let y=0;y<WORLD.h;y+=140)if((x/140+y/140)%2===0)ctx.fillRect(x,y,140,140);ctx.fillStyle='#050708aa';ctx.fillRect(760,0,90,WORLD.h);ctx.fillRect(0,500,WORLD.w,75);ctx.strokeStyle='#ffffff10';ctx.lineWidth=12;for(let i=0;i<8;i++)ctx.strokeRect(120+i*175,100+(i%3)*250,110,82);ctx.restore()}
function drawClues(){for(const c of clues){if(c.found)continue;const s=ws(c.x,c.y);ctx.save();ctx.translate(s.x,s.y);ctx.strokeStyle='#e8d38b';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,13,0,TAU);ctx.stroke();ctx.beginPath();ctx.moveTo(-8,0);ctx.lineTo(8,0);ctx.moveTo(0,-8);ctx.lineTo(0,8);ctx.stroke();ctx.restore()}}
function drawPlayer(){const s=ws(player.x,player.y);ctx.save();ctx.translate(s.x,s.y);if(player.wardTime>0){ctx.strokeStyle='#bba9df';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,34,0,TAU);ctx.stroke()}ctx.fillStyle='#0008';ctx.beginPath();ctx.ellipse(7,14,18,8,0,0,TAU);ctx.fill();ctx.fillStyle=player.flash>0?'#fff':'#d4c8ac';ctx.fillRect(-9,-8,18,25);ctx.fillStyle='#d8e8e5';ctx.beginPath();ctx.arc(0,-13,9,0,TAU);ctx.fill();ctx.strokeStyle='#7d5f3d';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(10,-4);ctx.lineTo(25,-19);ctx.stroke();ctx.fillStyle='#fff';ctx.font='10px system-ui';ctx.textAlign='center';ctx.fillText('나',0,34);ctx.restore()}
function drawGhost(){const s=ws(ghost.x,ghost.y),g=GHOSTS[ghost.type];ctx.save();ctx.translate(s.x,s.y);ctx.globalAlpha=ghost.weakened?.6:.9;ctx.fillStyle=ghost.flash>0?'#fff':g.color;ctx.beginPath();ctx.arc(0,-8,20,Math.PI,0);ctx.lineTo(20,21);ctx.quadraticCurveTo(10,10,2,23);ctx.quadraticCurveTo(-8,10,-20,21);ctx.closePath();ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(-7,-10,3,0,TAU);ctx.arc(7,-10,3,0,TAU);ctx.fill();ctx.globalAlpha=1;if(ghost.weakened){ctx.strokeStyle='#e9d486';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,31,0,TAU);ctx.stroke()}ctx.fillStyle='#fff';ctx.font='10px system-ui';ctx.textAlign='center';ctx.fillText(ghost.seen?g.name:'???',0,38);ctx.restore()}
function drawProjectiles(){for(const p of projectiles){const s=ws(p.x,p.y);ctx.fillStyle='#b85f76';ctx.beginPath();ctx.arc(s.x,s.y,p.r,0,TAU);ctx.fill()}}function drawEffects(){for(const e of effects){const s=ws(e.x,e.y),t=e.life/e.max;ctx.save();ctx.globalAlpha=clamp(t,0,1);ctx.strokeStyle=e.type==='hurt'?'#ff7185':e.type==='ward'||e.type==='block'?'#c2a9e3':'#ead894';ctx.lineWidth=3;ctx.beginPath();ctx.arc(s.x,s.y,20+(1-t)*35,0,TAU);ctx.stroke();ctx.restore()}}
function draw(){ctx.clearRect(0,0,W,H);drawWorld();drawClues();drawGhost();drawPlayer();drawProjectiles();drawEffects()}function loop(now){if(!running)return;const dt=Math.min(.035,Math.max(.001,(now-last)/1000||.016));last=now;update(dt);draw();if(running)requestAnimationFrame(loop)}
// 입력
for(const b of document.querySelectorAll('[data-dir]')){const dir=b.dataset.dir,on=e=>{e.preventDefault();input[dir]=true},off=e=>{e.preventDefault();input[dir]=false};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)}
$('attackBtn').addEventListener('pointerdown',e=>{e.preventDefault();playerAttack()});$('sealBtn').addEventListener('pointerdown',e=>{e.preventDefault();trySeal()});$('wardBtn').addEventListener('pointerdown',e=>{e.preventDefault();useWard()});addEventListener('keydown',e=>{keys.add(e.code);if(e.code==='Space'){e.preventDefault();playerAttack()}if(e.code==='KeyQ'){e.preventDefault();trySeal()}if(e.code==='KeyE'){e.preventDefault();useWard()}});addEventListener('keyup',e=>keys.delete(e.code));$('compendiumBtn').onclick=showCompendium;$('closeCompendium').onclick=()=>$('compendium').classList.add('hidden');$('resultBack').onclick=()=>{$('result').classList.add('hidden');renderOffice()};$('resetBtn').onclick=()=>{if(confirm('현재 돈, 확장, 도감 기록을 전부 초기화할까?')){save=defaultSave();persist();renderOffice()}};document.addEventListener('contextmenu',e=>e.preventDefault());renderOffice();
})();
