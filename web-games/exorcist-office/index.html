function submitSchoolCode(){if(!schoolState||schoolState.doorOpen)return;const value=$('schoolCodeInput').value.replace(/\D/g,'').slice(0,4);if(value!==schoolState.code){toast('비밀번호가 틀렸어');return}schoolState.doorOpen=true;schoolState.codeModal=false;ghost.active=true;$('schoolCode').classList.add('hidden');$('controls').classList.remove('hidden');effects.push({x:schoolState.door.x,y:schoolState.door.y,life:.8,max:.8,type:'clue'});toast('교장실 문이 열렸다 · 안쪽에서 원한귀가 나타났다')}
function investigationTaskReady(t,tasks){if((t.requiresClues||[]).some(i=>!clues[i]?.found))return false;if((t.requiresTasks||[]).some(i=>!tasks[i]?.found))return false;return true}
function updateInvestigation(){if(!investigationState||investigationState.open)return;const tasks=investigationState.tasks;for(let i=0;i<tasks.length;i++){const t=tasks[i];if(t.found||dist(player,t)>=48)continue;if(!investigationTaskReady(t,tasks)){const now=performance.now();if(now>investigationState.blockToastUntil){investigationState.blockToastUntil=now+900;const needClue=(t.requiresClues||[]).some(n=>!clues[n]?.found);toast(needClue?'주변 단서를 더 찾아야 해':'앞 단계 조사부터 해결해야 해')}continue}t.found=true;effects.push({x:t.x,y:t.y,life:.7,max:.7,type:'clue'});toast(t.label+' 완료');maybeInvestigationAmbush(t.x,t.y,.42)}const done=tasks.filter(t=>t.found).length,ready=done===tasks.length&&clueCount()===clues.length;if(ready&&dist(player,investigationState.gate)<62){investigationState.open=true;ghost.active=true;if(GHOSTS[ghost.type].special==='pack')followers=[0,1,2].map(slot=>({slot,x:ghost.x+(slot-1)*38,y:ghost.y+46,hp:1,charge:0,hit:false,flash:0}));effects.push({x:investigationState.gate.x,y:investigationState.gate.y,life:.9,max:.9,type:'clue'});toast(investigationState.gate.label+' 개방 · '+GHOSTS[ghost.type].name+' 출현')}}
function playerAttack(){if(!running||!player.alive||player.attackCd>0||schoolState?.codeModal)return;player.attackCd=.48;effects.push({x:player.x,y:player.y,life:.18,max:.18,type:'slash'});let hit=false;for(const a of ambushGhosts){if(a.hp>0&&dist(player,a)<95){a.hp-=player.attack;a.flash=.14;hit=true;effects.push({x:a.x,y:a.y,life:.22,max:.22,type:'hit'});if(a.hp<=0)effects.push({x:a.x,y:a.y,life:.45,max:.45,type:'blink'})}}ambushGhosts=ambushGhosts.filter(a=>a.hp>0);if(ghost.active&&ghost.alive&&dist(player,ghost)<105){const dmg=player.attack*(clueCount()<3?.52:1);ghost.hp-=dmg;ghost.flash=.14;hit=true;effects.push({x:ghost.x,y:ghost.y,life:.22,max:.22,type:'hit'});if(ghost.hp<=0&&!ghost.weakened){ghost.hp=0;ghost.weakened=true;ghost.weakenTimer=6;if(GHOSTS[ghost.type].special==='pack'){followers=[];effects.push({x:ghost.x,y:ghost.y,life:.9,max:.9,type:'pulse'});toast('리더가 쓰러지자 추종귀 3마리도 소멸했다')}else toast('귀신 약화 · 가까이서 부적으로 봉인해')}}else if(GHOSTS[ghost.type].special==='pack'&&followers.some(f=>dist(player,f)<95)){hit=true;toast('추종귀는 리더가 살아 있는 동안 무적이야')}if(!hit&&schoolState&&!schoolState.doorOpen&&dist(player,schoolState.door)<80)toast('교장실 문이 잠겨 있어');if(!hit&&investigationState&&!investigationState.open&&dist(player,investigationState.gate)<80)toast(investigationState.gate.label+'이 잠겨 있어')}
function trySeal(){if(!running||!player.alive||schoolState?.codeModal)return;if(!ghost.active)return toast('아직 퇴마 대상이 나타나지 않았어');if(player.sealCd>0)return toast('부적 준비 '+player.sealCd.toFixed(1)+'초');player.sealCd=Math.max(2,(save.rooms.talisman?4.2:6.2)-player.sealCooldownBonus);if(!ghost.weakened||dist(player,ghost)>95)return toast('귀신을 먼저 약화시키고 가까이 가야 해');completeMission()}

function spawnOrb(angleOffset=0,speed=250,bonus=4){const n=norm(player.x-ghost.x,player.y-ghost.y),cs=Math.cos(angleOffset),sn=Math.sin(angleOffset),vx=n.x*cs-n.y*sn,vy=n.x*sn+n.y*cs;projectiles.push({x:ghost.x,y:ghost.y,vx:vx*speed,vy:vy*speed,r:8,life:4,damage:ghost.damage+bonus})}

function updateFollowers(dt){if(GHOSTS[ghost.type].special!=='pack'||!ghost.active||ghost.weakened||ghost.hp<=0){followers=[];return}for(const f of followers){f.flash=Math.max(0,f.flash-dt);if(f.charge>0){f.charge-=dt;const n=norm(player.x-f.x,player.y-f.y);f.x+=n.x*285*dt;f.y+=n.y*285*dt;if(!f.hit&&dist(player,f)<38){hurtPlayer(12);f.hit=true;f.flash=.15}}else{const angle=(f.slot-1)*1.15,tx=ghost.x+Math.cos(angle)*58,ty=ghost.y+48+Math.sin(angle)*34;f.x+=(tx-f.x)*Math.min(1,4.5*dt);f.y+=(ty-f.y)*Math.min(1,4.5*dt)}}}

function update(dt){player.attackCd=Math.max(0,player.attackCd-dt);player.sealCd=Math.max(0,player.sealCd-dt);player.wardCd=Math.max(0,player.wardCd-dt);player.wardTime=Math.max(0,player.wardTime-dt);player.slowTime=Math.max(0,player.slowTime-dt);player.flash=Math.max(0,player.flash-dt);ghost.flash=Math.max(0,ghost.flash-dt);if(ghost.weakened){ghost.weakenTimer-=dt;if(ghost.weakenTimer<=0){ghost.weakened=false;ghost.hp=ghost.maxHp*.28;if(GHOSTS[ghost.type].special==='pack')followers=[0,1,2].map(slot=>({slot,x:ghost.x+(slot-1)*38,y:ghost.y+46,hp:1,charge:0,hit:false,flash:0}));toast('봉인 실패 · 귀신이 다시 일어났다')}}if(schoolState?.codeModal){syncHud();return}movePlayer(dt);findClues();updateSchoolInvestigation();updateInvestigation();if(ghost.active&&dist(player,ghost)<310)registerSeen();ghostAi(dt);updateFollowers(dt);updateAmbushes(dt);updateProjectiles(dt);for(const e of effects)e.life-=dt;effects=effects.filter(e=>e.life>0);cam.x=clamp(player.x-W/2,0,Math.max(0,WORLD.w-W));cam.y=clamp(player.y-H/2,0,Math.max(0,WORLD.h-H));syncHud()}

function drawFollowers(){for(const f of followers){const s=ws(f.x,f.y);ctx.save();ctx.translate(s.x,s.y);ctx.globalAlpha=.88;ctx.fillStyle=f.flash>0?'#fff':'#aa91c2';ctx.beginPath();ctx.arc(0,-5,14,Math.PI,0);ctx.lineTo(14,15);ctx.quadraticCurveTo(3,8,-2,17);ctx.quadraticCurveTo(-7,8,-14,15);ctx.closePath();ctx.fill();ctx.fillStyle='#101016';ctx.beginPath();ctx.arc(-5,-6,2,0,TAU);ctx.arc(5,-6,2,0,TAU);ctx.fill();ctx.fillStyle='#e8d9f3';ctx.font='900 8px system-ui';ctx.textAlign='center';ctx.fillText('무적',0,29);ctx.restore()}}
function drawAmbushes(){for(const a of ambushGhosts){const s=ws(a.x,a.y);ctx.save();ctx.translate(s.x,s.y);ctx.fillStyle=a.flash>0?'#fff':'#8c99a6';ctx.beginPath();ctx.arc(0,-5,13,Math.PI,0);ctx.lineTo(13,14);ctx.quadraticCurveTo(2,8,-3,16);ctx.quadraticCurveTo(-8,8,-13,14);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.font='900 8px system-ui';ctx.textAlign='center';ctx.fillText('잡귀',0,27);ctx.restore()}}
function drawProjectiles(){for(const p of projectiles){const s=ws(p.x,p.y);ctx.fillStyle='#b85f76';ctx.beginPath();ctx.arc(s.x,s.y,p.r,0,TAU);ctx.fill()}}function drawEffects(){for(const e of effects){const s=ws(e.x,e.y),t=e.life/e.max;ctx.save();ctx.globalAlpha=clamp(t,0,1);ctx.strokeStyle=e.type==='hurt'?'#ff7185':e.type==='ward'||e.type==='block'?'#c2a9e3':'#ead894';ctx.lineWidth=3;ctx.beginPath();ctx.arc(s.x,s.y,20+(1-t)*35,0,TAU);ctx.stroke();ctx.restore()}}
function draw(){ctx.clearRect(0,0,W,H);drawWorld();drawClues();drawGhost();drawFollowers();drawAmbushes();drawPlayer();drawProjectiles();drawEffects()}function loop(now){if(!running)return;const dt=Math.min(.035,Math.max(.001,(now-last)/1000||.016));last=now;update(dt);draw();if(running)requestAnimationFrame(loop)}

for(const b of document.querySelectorAll('[data-dir]')){const dir=b.dataset.dir,on=e=>{e.preventDefault();input[dir]=true},off=e=>{e.preventDefault();input[dir]=false};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)}
$('attackBtn').addEventListener('pointerdown',e=>{e.preventDefault();playerAttack()});$('sealBtn').addEventListener('pointerdown',e=>{e.preventDefault();trySeal()});$('wardBtn').addEventListener('pointerdown',e=>{e.preventDefault();useWard()});addEventListener('keydown',e=>{keys.add(e.code);if(e.code==='Space'){e.preventDefault();playerAttack()}if(e.code==='KeyQ'){e.preventDefault();trySeal()}if(e.code==='KeyE'){e.preventDefault();useWard()}if(e.code==='Enter'&&schoolState?.codeModal){e.preventDefault();submitSchoolCode()}});addEventListener('keyup',e=>keys.delete(e.code));$('shopBtn').onclick=showShop;$('closeShop').onclick=()=>$('shop').classList.add('hidden');$('schoolCodeSubmit').onclick=submitSchoolCode;$('schoolCodeClose').onclick=()=>{if(!schoolState)return;schoolState.codeModal=false;$('schoolCode').classList.add('hidden');$('controls').classList.remove('hidden')};$('compendiumBtn').onclick=showCompendium;$('closeCompendium').onclick=()=>$('compendium').classList.add('hidden');$('resultBack').onclick=()=>{$('result').classList.add('hidden');renderOffice()};$('resetBtn').onclick=()=>{if(confirm('현재 돈, 확장, 도감 기록을 전부 초기화할까?')){save=defaultSave();persist();renderOffice()}};document.addEventListener('contextmenu',e=>e.preventDefault());renderOffice();
