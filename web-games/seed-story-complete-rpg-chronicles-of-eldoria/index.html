<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08111b">
  <title>엘도리아 연대기</title>
  <link rel="stylesheet" href="/web-games/_shared/styles.css">
</head>
<body>
  <script>
    window.GAME_CONFIG = {
      id: 'seed-story-complete-rpg-chronicles-of-eldoria',
      name: '엘도리아 연대기',
      mode: 'eldoria',
      hp: 100,
      desc: '회색 숲에서 엘도리아의 심장까지 5개 장을 탐험하고 전투·휴식·장비 강화를 선택하는 완결형 RPG.',
      story: '탐색과 전투로 골드를 모으고 장비를 강화해 다섯 장의 이야기를 끝내라.'
    };

    // 5장 완결 흐름 구현
    const story = document.createElement('div');
    story.id = 'story';
    story.className = 'story';
    story.innerHTML = `
      <h1>5장 완결</h1>
      <p>회색 숲의 마지막 장소에서, 당신은 마지막의 전투를 맞이합니다.</p>
      <div class="choices">
        <button class="choice" data-choice="fight">전투</button>
        <button class="choice" data-choice="rest">휴식</button>
        <button class="choice" data-choice="upgrade">장비 강화</button>
      </div>
    `;

    document.body.appendChild(story);

    // 흐름 관리
    const flow = {
      current: 'start',
      next: () => {
        if (flow.current === 'start') {
          flow.current = 'story';
        } else if (flow.current === 'story') {
          flow.current = 'choices';
        } else if (flow.current === 'choices') {
          flow.current = 'end';
        }
      }
    };

    // 흐름 실행
    setInterval(flow.next, 1000);
  </script>
  <script src="/web-games/_shared/vibe2-final.js"></script>
</body>
</html>
