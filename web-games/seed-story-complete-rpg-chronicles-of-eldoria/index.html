<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08111b">
  <title>엘도리아 연대기</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1e1e1e;
      color: #f0f0f0;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #08111b;
      color: #f0f0f0;
      padding: 1rem;
      text-align: center;
    }
    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #1e1e1e;
    }
    .game-content {
      width: 100%;
      max-width: 800px;
      padding: 2rem;
      background-color: #1a1a1a;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
    }
    .story {
      line-height: 1.6;
      font-size: 1.1rem;
      color: #f0f0f0;
    }
    .choices {
      margin-top: 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
    }
    .choice {
      background-color: #1a1a1a;
      padding: 1rem 1.5rem;
      border-radius: 5px;
      width: 250px;
      text-align: center;
      font-size: 1rem;
      color: #f0f0f0;
      transition: 0.3s;
    }
    .choice:hover {
      background-color: #2a2a2a;
    }
    .status {
      margin-top: 2rem;
      font-size: 1.2rem;
      color: #f0f0f0;
    }
    .progress {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #f0f0f0;
    }
    .save {
      margin-top: 2rem;
      font-size: 0.9rem;
      color: #f0f0f0;
    }
  </style>
</head>
<body>
  <header>
    <h1>엘도리아 연대기</h1>
    <p>5장 완결 RPG - 탐색·전투·휴식·강화·스토리 연출</p>
  </header>
  <div class="game-container">
    <div class="game-content">
      <div class="story">
        <p>회색 숲에서 엘도리아의 심장까지 5개 장을 탐험하고 전투·휴식·장비 강화를 선택하는 완결형 RPG.</p>
      </div>
      <div class="choices">
        <div class="choice" data-choice="탐색">탐색</div>
        <div class="choice" data-choice="전투">전투</div>
        <div class="choice" data-choice="휴식">휴식</div>
        <div class="choice" data-choice="강화">강화</div>
      </div>
      <div class="status">
        <p>현재 HP: <span id="currentHp">100</span></p>
      </div>
      <div class="progress">
        <p>5장 완결: <span id="progressStatus">0%</span></p>
      </div>
      <div class="save">
        <p>저장: <span id="saveStatus">off</span></p>
      </div>
    </div>
  </div>
  <script>
    // 게임 로직 및 상태 관리
    const choices = document.querySelectorAll('.choice');
    const currentHp = document.getElementById('currentHp');
    const progressStatus = document.getElementById('progressStatus');
    const saveStatus = document.getElementById('saveStatus');

    // 선택 처리
    choices.forEach(choice => {
      choice.addEventListener('click', () => {
        const choiceText = choice.textContent;
        const status = document.querySelector(`[data-choice="${choiceText}"]`);
        status.classList.add('active');
        status.textContent = '선택됨';
      });
    });

    // 상태 업데이트
    function updateStatus() {
      currentHp.textContent = Math.min(100, parseInt(currentHp.textContent) + 1);
      progressStatus.textContent = Math.min(100, parseInt(progressStatus.textContent) + 1);
      saveStatus.textContent = 'on';
    }

    // 초기 상태
    updateStatus();

    // 저장 및 재시도 처리
    document.addEventListener('DOMContentLoaded', () => {
      const saveButton = document.createElement('button');
      saveButton.textContent = '저장';
      saveButton.addEventListener('click', () => {
        saveStatus.textContent = 'on';
        updateStatus();
      });

      document.querySelector('.save').appendChild(saveButton);
    });
  </script>
</body>
</html>
