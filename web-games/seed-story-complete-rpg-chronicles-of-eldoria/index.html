<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08111b">
  <title>엘도리아 연대기</title>
  <link rel="stylesheet" href="/web-games/_shared/styles.css">
</head>
<body>
  <script>
    window.GAME_CONFIG = {
      id: 'seed-story-complete-rpg-chronicles-of-eldoria',
      name: '엘도리아 연대기',
      mode: 'eldoria',
      hp: 100,
      desc: '회색 숲에서 엘도리아의 심장까지 5개 장을 탐험하고 전투·휴식·장비 강화를 선택하는 완결형 RPG.',
      story: '탐색과 전투로 골드를 모으고 장비를 강화해 다섯 장의 이야기를 끝내라.'
    };

    // 게임 로딩 시 기본 설정
    window.onload = function() {
      // 테마 및 스토리 초기화
      document.title = '엘도리아 연대기 - 5장 완결';
      document.querySelector('head').innerHTML += `
        <style>
          body { font-family: 'Segoe UI', sans-serif; background-color: #1e1e1e; color: #f0f0f0; }
          .game-container { max-width: 800px; margin: 0 auto; padding: 20px; }
          .story { font-size: 1.2em; line-height: 1.6; }
          .action-button { padding: 10px 20px; font-size: 0.9em; }
        </style>
      `;
    };
  </script>
  <div class="game-container">
    <div class="story">
      <h1>엘도리아 연대기 - 5장 완결</h1>
      <p>회색 숲에서 엘도리아의 심장까지 5개 장을 탐험하고 전투·휴식·장비 강화를 선택하는 완결형 RPG.</p>
    </div>
    <div class="game-actions">
      <button class="action-button" onclick="startGame()">시작</button>
      <button class="action-button" onclick="restartGame()">재시도</button>
    </div>
  </div>
  <script src="/web-games/_shared/vibe2-final.js"></script>
</body>
</html>
