<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08111b">
  <title>엘도리아 연대기</title>
  <link rel="stylesheet" href="/web-games/_shared/styles.css">
</head>
<body>
  <script>
    window.GAME_CONFIG = {
      id: 'seed-story-complete-rpg-chronicles-of-eldoria',
      name: '엘도리아 연대기',
      mode: 'eldoria',
      hp: 100,
      desc: '회색 숲에서 엘도리아의 심장까지 5개 장을 탐험하고 전투·휴식·장비 강화를 선택하는 완결형 RPG.',
      story: '탐색과 전투로 골드를 모으고 장비를 강화해 다섯 장의 이야기를 끝내라.'
    };

    // 게임 로드 시 실행
    window.addEventListener('load', () => {
      vibe2.init({
        config: window.GAME_CONFIG,
        assets: {
          // 필요한 자산 로드
        },
        events: {
          // 이벤트 처리
        }
      });
    });
  </script>
  <script src="/web-games/_shared/vibe2-final.js"></script>
  <script src="/web-games/_shared/scripts.js"></script>
  <div id="game-container">
    <div id="story-container">
      <h1>엘도리아 연대기</h1>
      <p>회색 숲에서 엘도리아의 심장까지 5개 장을 탐험하고 전투·휴식·장비 강화를 선택하는 완결형 RPG.</p>
      <div id="story-progress">
        <div class="story-step" data-step="1">1. 첫 장 탐험</div>
        <div class="story-step" data-step="2">2. 두 번째 장 전투</div>
        <div class="story-step" data-step="3">3. 세 번째 장 휴식</div>
        <div class="story-step" data-step="4">4. 네 번째 장 강화</div>
        <div class="story-step" data-step="5">5. 다섯 번째 장 결말</div>
      </div>
      <div id="game-area">
        <div class="game-area">
          <div class="game-step active" data-step="1">첫 장 탐험</div>
          <div class="game-step" data-step="2">두 번째 장 전투</div>
          <div class="game-step" data-step="3">세 번째 장 휴식</div>
          <div class="game-step" data-step="4">네 번째 장 강화</div>
          <div class="game-step" data-step="5">다섯 번째 장 결말</div>
        </div>
        <div class="game-buttons">
          <button id="next-button">다음</button>
          <button id="restart-button">재시도</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
