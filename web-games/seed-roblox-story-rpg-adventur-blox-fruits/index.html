<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Shardbound Odyssey</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b1020;color:#f5f7fb;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{display:flex;justify-content:center;overflow-x:hidden}.game{width:min(100%,560px);min-height:100vh;padding:16px;background:linear-gradient(180deg,#15213a,#0a1120 66%,#070b14)}.hero,.panel{padding:15px;border:1px solid #2b3c5d;border-radius:18px;background:#17233a;margin-bottom:12px}.hero h1{margin:6px 0 8px;font-size:25px}.desc,.status{font-size:13px;line-height:1.5;color:#c8d4e8}.arena{position:relative;height:170px;border-radius:18px;border:1px solid #324667;background:radial-gradient(circle at 55% 35%,#28416a,#111a2e 58%,#0a0f1b);margin-bottom:12px;overflow:hidden}.player{position:absolute;width:52px;height:52px;border-radius:16px;left:calc(12% + (var(--pos,0) * 9%));top:72px;background:#60a5fa;border:4px solid #dbeafe;transition:left .18s}.enemy{position:absolute;width:48px;height:48px;border-radius:50%;right:34px;top:48px;background:#fb7185;border:4px solid #ffe4e6}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.stat{padding:8px 4px;border-radius:11px;background:#0d1729;text-align:center}.stat b{display:block;font-size:16px}.scope{display:grid;gap:8px}.scope-action,.audio button{min-height:54px;border:0;border-radius:13px;background:#eef4ff;color:#111827;font-weight:760;text-align:left;padding:9px 11px}.scope-action span{display:block;font-size:12px;line-height:1.35;margin:2px 0}.scope-action small{font-size:10px;opacity:.7}.scope-action[data-scope-covered="true"]{outline:3px solid #86efac}.audio{display:grid;grid-template-columns:116px 1fr;gap:10px;align-items:center}.audio input{width:100%}.meter{height:8px;border-radius:8px;background:#23314d;overflow:hidden;margin-top:10px}.meter span{display:block;height:100%;width:0;background:#a78bfa;transition:width .2s}@media(max-width:390px){.stats{grid-template-columns:repeat(2,1fr)}.audio{grid-template-columns:1fr}}</style></head><body data-audio-state="locked" data-approved-scope-count="5"><main class="game"><section class="hero"><small>DEVELOPMENT_CONFIRMED · FULL APPROVED WEB COMPANION · 스토리 RPG</small><h1>Shardbound Odyssey</h1><p class="desc">quest,explore,combat,boss</p></section><section class="arena"><div class="player" id="player"></div><div class="enemy" id="enemy"></div></section><section class="stats" id="state" data-state="ready" data-score="0" data-health="100" data-resource="3" data-progress="0"><div class="stat"><b id="score">0</b><small>SCORE</small></div><div class="stat"><b id="health">100</b><small>HP</small></div><div class="stat"><b id="wave">1</b><small>WAVE</small></div><div class="stat"><b id="resource">3</b><small>RESOURCE</small></div><div class="stat"><b id="level">1</b><small>LEVEL</small></div><div class="stat"><b id="enemyHp">100</b><small>ENEMY HP</small></div><div class="stat"><b id="position">0</b><small>POSITION</small></div><div class="stat"><b id="cooldown">0</b><small>COOLDOWN</small></div></section><section class="panel"><h2>승인 분량 전체 구현</h2><div class="scope"><button id="scope-control-1" class="scope-action" data-scope-id="scope-corefun-afb3aa364d" type="button"><b>1</b><span>quest,explore,combat,boss</span><small>COMBAT</small></button><button id="scope-control-2" class="scope-action" data-scope-id="scope-coreloop-0-512fbeed03" type="button"><b>2</b><span>Accept a quest or story objective, travel through a Roblox world area, and discover enemies, NPCs, resources, or events that advance the current adventure goal.</span><small>MOVEMENT</small></button><button id="scope-control-3" class="scope-action" data-scope-id="scope-coreloop-1-fee638072f" type="button"><b>3</b><span>Fight enemies or bosses using readable skills and equipment, gain experience and loot, and make a progression choice that changes the next combat approach.</span><small>COMBAT</small></button><button id="scope-control-4" class="scope-action" data-scope-id="scope-coreloop-2-d36d57e8a3" type="button"><b>4</b><span>Complete the quest or major encounter, unlock a new area or story beat, and continue toward a larger adventure milestone while preserving persistent character growth.</span><small>PROGRESSION</small></button><button id="scope-control-5" class="scope-action" data-scope-id="scope-mobileux-a6b8e71cfe" type="button"><b>5</b><span>asciicase</span><small>MOBILE</small></button></div><div class="meter"><span id="meter"></span></div></section><section class="panel audio"><button id="mute" data-audio-control="mute" type="button">음악 켜짐</button><label>볼륨 <input id="volume" data-audio-control="volume" type="range" min="0" max="1" step="0.05" value="0.28"></label></section><div class="panel status" id="status">STATUS: 준비 · 승인 scope 5개 실제 입력 검증 대기</div></main><script>const cfg={"genre":"STORY_RPG_ADVENTURE_RPG","initial":{"score":0,"hp":100,"wave":1,"resource":3,"progress":0},"notes":[174.6,220,261.6],"scopeCount":5};const state={...cfg.initial,turn:0,level:1,enemyHp:100,position:0,cooldown:0,combo:0,energy:100,objective:0};const $=id=>document.getElementById(id);let audioCtx=null,master=null,osc=null,muted=false;async function ensureAudio(){if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;audioCtx=new AC();master=audioCtx.createGain();master.gain.value=Number($('volume').value);master.connect(audioCtx.destination);osc=audioCtx.createOscillator();osc.type='sine';osc.frequency.value=cfg.notes[0];osc.connect(master);osc.start()}if(audioCtx.state==='suspended')await audioCtx.resume();document.body.dataset.audioState=muted?'muted':'running'}function advance(label){if(state.progress>=100){state.progress=state.progress%100;state.wave++;state.level++;state.resource+=2}const s=$('state');s.dataset.state='turn-'+state.turn;s.dataset.score=String(state.score);s.dataset.health=String(state.hp);s.dataset.resource=String(state.resource);s.dataset.progress=String(state.progress);$('score').textContent=state.score;$('health').textContent=state.hp;$('wave').textContent=state.wave;$('resource').textContent=state.resource;$('level').textContent=state.level;$('enemyHp').textContent=state.enemyHp;$('position').textContent=state.position;$('cooldown').textContent=state.cooldown;$('meter').style.width=Math.min(100,state.progress)+'%';$('player').style.setProperty('--pos',String(state.position));$('enemy').style.opacity=String(.35+.65*(state.enemyHp/100));if(osc)osc.frequency.setTargetAtTime(cfg.notes[state.turn%cfg.notes.length],audioCtx.currentTime,.03);$('status').textContent='STATUS: '+label+' · TURN '+state.turn+' · OBJECTIVE '+state.objective+' · ENERGY '+state.energy} async function scopeHandler1(){await ensureAudio();const button=document.getElementById("scope-control-1");button.dataset.scopeCovered='true';state.turn++;state.combo++;state.enemyHp=Math.max(0,state.enemyHp-11);state.score+=9;state.cooldown=(state.cooldown+1)%4;state.progress+=5;if(state.enemyHp===0){state.enemyHp=100;state.wave++;state.resource+=3;state.score+=20;}advance("scope-corefun-afb3aa364d");}
document.getElementById("scope-control-1").addEventListener('click',scopeHandler1);
async function scopeHandler2(){await ensureAudio();const button=document.getElementById("scope-control-2");button.dataset.scopeCovered='true';state.turn++;state.position=(state.position+2)%8;state.energy=Math.max(0,state.energy-1);state.score+=4;state.progress+=7;advance("scope-coreloop-0-512fbeed03");}
document.getElementById("scope-control-2").addEventListener('click',scopeHandler2);
async function scopeHandler3(){await ensureAudio();const button=document.getElementById("scope-control-3");button.dataset.scopeCovered='true';state.turn++;state.combo++;state.enemyHp=Math.max(0,state.enemyHp-13);state.score+=11;state.cooldown=(state.cooldown+1)%4;state.progress+=7;if(state.enemyHp===0){state.enemyHp=100;state.wave++;state.resource+=3;state.score+=20;}advance("scope-coreloop-1-fee638072f");}
document.getElementById("scope-control-3").addEventListener('click',scopeHandler3);
async function scopeHandler4(){await ensureAudio();const button=document.getElementById("scope-control-4");button.dataset.scopeCovered='true';state.turn++;state.resource+=8;state.level++;state.score+=9;state.progress+=11;advance("scope-coreloop-2-d36d57e8a3");}
document.getElementById("scope-control-4").addEventListener('click',scopeHandler4);
async function scopeHandler5(){await ensureAudio();const button=document.getElementById("scope-control-5");button.dataset.scopeCovered='true';state.turn++;state.position=(state.position+1)%8;state.energy=Math.min(100,state.energy+1);state.score+=7;state.progress+=8;advance("scope-mobileux-a6b8e71cfe");}
document.getElementById("scope-control-5").addEventListener('click',scopeHandler5); document.addEventListener('keydown',event=>{if(['ArrowRight','ArrowUp','Space'].includes(event.code)){const buttons=[...document.querySelectorAll('.scope-action')];const button=buttons[state.turn%buttons.length];if(button)button.click()}});$('mute').addEventListener('click',async()=>{await ensureAudio();muted=!muted;master.gain.value=muted?0:Number($('volume').value);$('mute').textContent=muted?'음악 꺼짐':'음악 켜짐';document.body.dataset.audioState=muted?'muted':'running'});$('volume').addEventListener('input',async()=>{await ensureAudio();if(!muted)master.gain.value=Number($('volume').value)});advance('ready');</script></body></html>
