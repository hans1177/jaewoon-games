<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#9bd6b3">
  <title>포근섬</title>
  <link rel="stylesheet" href="./style.css">
  <!-- 공용 원본 Three.js 로더가 같은 3D 모듈 사본을 참조하도록 연결 -->
  <script type="importmap">{"imports":{"three":"../../assets/roblox/world-ghosts/native/mesh/three/three.module.js"}}</script>
</head>
<body>
  <main id="app" aria-label="포근섬 게임">
    <canvas id="game" aria-label="포근섬 3D 화면 입력 영역"></canvas>
    <div id="webglStatus" class="webgl-status" role="alert" hidden></div>
    <!-- 기존 지역 조작 연결점, 화면에 표시하지 않는 호환 요소 -->
    <span id="actionButton" hidden aria-hidden="true"></span>

    <section class="hud" aria-live="polite">
      <div class="hud-main">
        <strong id="dayText">1일차</strong>
        <span id="timeText">오전 8:00</span>
        <span id="weatherText">☀️ 맑음</span>
      </div>
      <div class="hud-main right">
        <span>🪙 <b id="coinText">40</b></span>
        <button id="inventoryButton" class="small-button" type="button">가방</button>
      </div>
    </section>

    <div id="raidText" class="raid-status">⏱️ 습격 2:00</div>
    <div id="hint" class="hint">섬을 천천히 둘러봐</div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div class="camera-zoom" aria-label="전장 확대 축소">
      <button id="zoomIn" type="button" aria-label="카메라 확대">＋</button>
      <button id="zoomOut" type="button" aria-label="카메라 축소">－</button>
    </div>

    <section class="controls" aria-label="조작 버튼">
      <div id="joystick" class="joystick" aria-label="이동 조이스틱">
        <div class="joystick-ring"></div>
        <div id="joystickKnob" class="joystick-knob"></div>
      </div>
      <nav class="strategy-bar" aria-label="성채 전술 명령">
        <button id="castleCommand" class="strategy-button" type="button"><svg class="pixel-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="#f4d98f" d="M3 6h4v3h3V6h4v3h3V6h4v5h-2v11H5V11H3z"/><path fill="#6e6249" d="M7 12h10v2H7zM10 16h4v6h-4z"/><path fill="#fff5bf" d="M7 4h2v3H7zm8 0h2v3h-2z"/></svg><small>성채</small></button>
        <button id="barracksCommand" class="strategy-button" type="button"><svg class="pixel-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="#d3dadb" d="M3 3h4v4h3v3h3v3h3v3h3v5h-4v-3h-3v-3H9v-3H6V8H3z"/><path fill="#f6dd94" d="M18 3h3v4h-3v3h-3v3h-3v-3h3V7h3z"/><path fill="#6e513b" d="M3 16h7v3H7v3H4v-3H3z"/></svg><small>병영</small></button>
        <button id="workersCommand" class="strategy-button" type="button"><svg class="pixel-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="#d7aa68" d="M5 7h14v5H5zM8 4h8v3H8z"/><path fill="#ffddb7" d="M7 12h10v5H7z"/><path fill="#765c41" d="M4 20v-3h16v3h-4v2H8v-2z"/><path fill="#4a4438" d="M8 13h2v2H8zm6 0h2v2h-2z"/></svg><small>일꾼</small></button>
        <button id="fishingCommand" class="strategy-button" type="button"><svg class="pixel-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="#f3d28f" d="M4 4h4v2H6v2H4zm4 2h5v2H8zm5 2h3v3h-3zm3 3h2v5h-2z"/><path fill="#81b8bc" d="M3 16h4v-2h6v2h4v2h3v2h-3v2H7v-2H3z"/><path fill="#3c6d73" d="M9 16h2v2H9zm-6 5h3v2H3z"/></svg><small>낚시</small></button>
        <button id="tradeCommand" class="strategy-button" type="button" aria-label="상선 무역과 경제 관리"><svg class="pixel-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="#edd08d" d="M11 2h2v3h5v2H6V5h5zM11 7h2v12h5v3H6v-3h5z"/><path fill="#f8e1ab" d="M3 8h8v2H3zm10 0h8v2h-8zM3 13h7v2H4v-2zm11 0h7v2h-6v-2z"/><path fill="#8a9a83" d="M3 10h2v3H3zm5 0h2v3H8zm6 0h2v3h-2zm5 0h2v3h-2z"/></svg><small>무역</small></button>
        <button id="centerCommand" class="strategy-button" type="button"><svg class="pixel-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="#e6d7a6" d="M3 4h6v17H3zM9 3h6v17H9zM15 5h6v17h-6z"/><path fill="#648c72" d="M5 6h2v9H5zm6 4h2v6h-2zm6-2h2v9h-2z"/><path fill="#d19d57" d="M10 5h4v3h-4zM3 20h18v2H3z"/></svg><small>성채보기</small></button>
      </nav>
    </section>

    <dialog id="panel" class="panel">
      <div class="panel-head">
        <h2 id="panelTitle">가방</h2>
        <button id="panelClose" type="button" aria-label="닫기">×</button>
      </div>
      <div id="panelBody" class="panel-body"></div>
    </dialog>

    <dialog id="fishing" class="panel fishing-panel">
      <h2>낚시</h2>
      <p>물고기가 초록 구간에 들어왔을 때 잡아!</p>
      <div class="fish-track" aria-label="낚시 타이밍 바">
        <div class="fish-good"></div>
        <div id="fishMarker" class="fish-marker">🐟</div>
      </div>
      <button id="catchButton" class="wide-button" type="button">지금 잡기</button>
      <button id="cancelFishing" class="link-button" type="button">그만두기</button>
    </dialog>
  </main>

  <script src="./reset-bootstrap-v9.js"></script>
  <script src="./joystick.js"></script>
  <script src="./worker-shop-freeze-guard.js"></script>
  <script src="./performance-guard.js"></script>
  <script src="./fps32-v16.js"></script>
  <script type="module" src="./fresh-reset-guard-v9.js"></script>
  <script type="module" src="./balance-reset.js"></script>
  <script type="module" src="./combat-expansion.js"></script>
  <script type="module" src="./production-buildings.js"></script>
  <script type="module" src="./iron-worker-pre-v15.js"></script>
  <script type="module" src="./jungle-movement-fix.js"></script>
  <script type="module" src="./village-defense.js"></script>
  <script type="module" src="./townhall-cost-v7.js"></script>
  <script type="module" src="./world-upgrade-v3.js"></script>
  <script type="module" src="./farm-smithy.js"></script>
  <script type="module" src="./townhall-upgrade.js"></script>
  <script type="module" src="./region-discount-v10.js"></script>
  <script type="module" src="./north-region.js"></script>
  <script type="module" src="./cozy-balance-v5.js"></script>
  <script type="module" src="./economy-west-v2.js"></script>
  <script type="module" src="./bounty-tax-v6.js"></script>
  <script type="module" src="./rules-v7.js"></script>
  <script type="module" src="./jungle-west-camp.js"></script>
  <script type="module" src="./bounty-fix-v10.js"></script>
  <script type="module" src="./region-discount-ui-v10.js"></script>
  <script type="module" src="./render-performance.js"></script>
  <script type="module" src="./cannon-system.js"></script>
  <script type="module" src="./sixth-raid-v17.js"></script>
  <script type="module" src="./seventh-raid-v18.js"></script>
  <script type="module" src="./class-upgrades-pirate-v12.js"></script>
  <script type="module" src="./levelup-button-v13.js"></script>
  <script type="module" src="./iron-lv3-spearman-v14.js"></script>
  <script type="module" src="./iron-worker-v15.js"></script>
  <script type="module" src="./iron-layout-v16.js"></script>
  <script type="module" src="./soldier-animation-v16.js"></script>
  <script type="module" src="./darkness-flame-v19.js"></script>
  <script type="module" src="./balance-resume-v20.js"></script>
  <script type="module" src="./heavy-damage-v21.js"></script>
  <script type="module" src="./abyss-cave-v23.js"></script>
  <script type="module" src="./game-v3.js"></script>
  <script type="module" src="./fishing-limit-v9.js"></script>
</body>
</html>
