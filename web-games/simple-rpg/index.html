<!doctype html>
<html lang="ko" data-disable-universal-touch="true">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#203a28">
<title>작은 모험 RPG</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#142117;color:#fff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;touch-action:none}
button{font:inherit}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;background:#315b3a}
.hud{position:fixed;z-index:20;left:7px;right:7px;top:max(7px,env(safe-area-inset-top));display:flex;justify-content:space-between;gap:6px;pointer-events:none}
.panel{background:#0d1711e9;border:1px solid #53725b;border-radius:11px;padding:6px;box-shadow:0 3px 0 #07100a}
.stats{display:flex;gap:5px;flex-wrap:wrap}.pill{padding:4px 6px;border-radius:999px;background:#1d3424;border:1px solid #4d6d56;font-size:9px;font-weight:900}.hp{background:#5e292f}.gold{background:#66541d;color:#ffe998}
.area{font-size:10px;font-weight:900;text-align:right;min-width:78px}
.message{position:fixed;z-index:22;left:50%;top:62px;transform:translateX(-50%);max-width:88vw;padding:6px 9px;border-radius:999px;background:#0b140fdf;border:1px solid #405a47;font-size:9px;font-weight:900;text-align:center;pointer-events:none}
.controls{position:fixed;z-index:30;left:0;right:0;bottom:0;padding:6px 8px max(8px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
.pad{width:142px;height:142px;position:relative;pointer-events:auto}
.pad button{position:absolute;width:48px;height:48px;border:1px solid #587160;border-radius:12px;background:#14251adf;color:#fff;font-size:20px;font-weight:900}
.pad .up{left:47px;top:0}.pad .left{left:0;top:47px}.pad .right{right:0;top:47px}.pad .down{left:47px;bottom:0}
.actions{display:grid;grid-template-columns:repeat(2,68px);gap:7px;pointer-events:auto}.actions button{min-height:58px;border:1px solid #6a755e;border-radius:14px;background:#243c2b;color:#fff;font-size:11px;font-weight:1000}.actions .attack{background:#71352f}.actions .shop{background:#6c5b22;color:#fff3ae}
.overlay{position:fixed;z-index:100;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:#08100bdd}.overlay[hidden]{display:none}.card{width:min(94vw,470px);padding:17px 14px;border:2px solid #5a7862;border-radius:17px;background:#13241a;text-align:center;box-shadow:0 8px 0 #08100b}.card h1,.card h2{margin:0 0 7px}.card p{margin:6px 0;color:#bdd0c1;font-size:11px;line-height:1.5}.start,.wide{width:100%;min-height:44px;margin-top:9px;border:2px solid #5c5b2a;border-radius:11px;background:#e2c85c;color:#172016;font-size:12px;font-weight:1000}.wide{background:#1f3b29;color:#fff;border-color:#56715d}.shopList{display:grid;gap:7px;margin-top:9px}.shopItem{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:9px;border-radius:10px;background:#0d1a12;border:1px solid #38523f;text-align:left}.shopItem b,.shopItem small{display:block}.shopItem small{font-size:9px;color:#b7cab9}.shopItem button{min-width:92px;min-height:38px;border:1px solid #6f6838;border-radius:9px;background:#75621d;color:#fff7c0;font-size:10px;font-weight:900}
.toast{position:fixed;z-index:120;left:50%;top:18%;transform:translate(-50%,-8px);padding:8px 11px;border-radius:10px;background:#f0ffe9;color:#162018;font-size:10px;font-weight:900;opacity:0;transition:.18s;pointer-events:none}.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:380px){.pad{width:126px;height:126px}.pad button{width:44px;height:44px}.pad .up{left:41px}.pad .left{top:41px}.pad .right{top:41px}.pad .down{left:41px}.actions{grid-template-columns:repeat(2,62px)}.actions button{min-height:54px}}
</style>
</head>
<body>
<!-- 파일명: web-games/simple-rpg/index.html -->
<canvas id="game"></canvas>

<div class="hud">
  <div class="stats panel">
    <span class="pill hp" id="hp">HP 100 / 100</span>
    <span class="pill" id="level">Lv.1</span>
    <span class="pill" id="xp">XP 0 / 100</span>
    <span class="pill gold" id="gold">0G</span>
  </div>
  <div class="area panel" id="area">마을</div>
</div>
<div class="message" id="message">오른쪽 길로 나가서 슬라임을 잡아.</div>

<div class="controls">
  <div class="pad">
    <button class="up" data-dir="up">▲</button>
    <button class="left" data-dir="left">◀</button>
    <button class="right" data-dir="right">▶</button>
    <button class="down" data-dir="down">▼</button>
  </div>
  <div class="actions">
    <button class="attack" id="attack">공격</button>
    <button class="shop" id="shop">상점</button>
    <button id="heal">회복</button>
    <button id="saveBtn">저장</button>
  </div>
</div>

<div class="overlay" id="startOverlay">
  <div class="card">
    <h1>작은 모험 RPG</h1>
    <p>마을에서 출발해서 슬라임과 고블린을 잡고 성장해.<br>5레벨이 되면 오른쪽 끝에 보스가 등장해.</p>
    <button class="start" id="start">게임 시작</button>
  </div>
</div>

<div class="overlay" id="shopOverlay" hidden>
  <div class="card">
    <h2>마을 상점</h2>
    <p>마을 안에서만 이용 가능해.</p>
    <div class="shopList">
      <div class="shopItem"><div><b>낡은 검 강화</b><small>공격력 +5</small></div><button id="buySword">100G</button></div>
      <div class="shopItem"><div><b>가죽 갑옷 강화</b><small>최대 체력 +20</small></div><button id="buyArmor">120G</button></div>
      <div class="shopItem"><div><b>완전 회복</b><small>HP 전부 회복</small></div><button id="buyHeal">30G</button></div>
    </div>
    <button class="wide" id="closeShop">닫기</button>
  </div>
</div>

<div class="overlay" id="endOverlay" hidden>
  <div class="card">
    <h1 id="endTitle">모험 종료</h1>
    <p id="endText"></p>
    <button class="start" id="retry">다시 시작</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(()=>{'use strict';
// ===== 기본 =====
const C=document.getElementById('game'),X=C.getContext('2d'),q=id=>document.getElementById(id),KEY='jaewoon-simple-rpg-v1';
let W=innerWidth,H=innerHeight,D=Math.min(2,devicePixelRatio||1),last=0,raf=0,toastTimer=0;
const input={up:false,down:false,left:false,right:false};
const WORLD={w:1800,h:900,village:{x:80,y:120,w:430,h:500},bossX:1560};
let state=null;

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function resize(){W=innerWidth;H=innerHeight;D=Math.min(2,devicePixelRatio||1);C.width=W*D;C.height=H*D;C.style.width=W+'px';C.style.height=H+'px';X.setTransform(D,0,0,D,0,0)}
addEventListener('resize',resize,{passive:true});resize();
function toast(t){const e=q('toast');e.textContent=t;e.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('on'),1100)}
function xpNeed(lv){return lv*100}
function inVillage(){const p=state.player,v=WORLD.village;return p.x>=v.x&&p.x<=v.x+v.w&&p.y>=v.y&&p.y<=v.y+v.h}
function fresh(){
  return{player:{x:260,y:370,hp:100,maxHp:100,atk:15,level:1,xp:0,gold:0,dirX:1,dirY:0,attackCd:0,swordLv:0,armorLv:0},enemies:[],bossDefeated:false,spawnTimer:0,cameraX:0,running:true};
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify({player:state.player,bossDefeated:state.bossDefeated}))}catch(_){}
}
function load(){
  try{
    const raw=JSON.parse(localStorage.getItem(KEY)||'null');if(!raw)return false;
    const d=fresh();state=d;
    if(raw.player)Object.assign(state.player,raw.player);
    state.player.level=clamp(Number(state.player.level)||1,1,99);
    state.player.maxHp=Math.max(100,Number(state.player.maxHp)||100);
    state.player.hp=clamp(Number(state.player.hp)||state.player.maxHp,1,state.player.maxHp);
    state.player.atk=Math.max(15,Number(state.player.atk)||15);
    state.player.gold=Math.max(0,Number(state.player.gold)||0);
    state.player.xp=Math.max(0,Number(state.player.xp)||0);
    state.player.x=clamp(Number(state.player.x)||260,30,WORLD.w-30);
    state.player.y=clamp(Number(state.player.y)||370,80,WORLD.h-80);
    state.bossDefeated=!!raw.bossDefeated;
    return true;
  }catch(_){return false}
}
function resetGame(){localStorage.removeItem(KEY);state=fresh();spawnInitial();updateHud()}

// ===== 적 =====
function makeEnemy(type,x,y){
  const table={
    slime:{name:'슬라임',hp:45,atk:7,speed:28,xp:25,gold:18,r:18,color:'#69b95d'},
    goblin:{name:'고블린',hp:90,atk:12,speed:36,xp:45,gold:32,r:20,color:'#7c9e49'},
    boss:{name:'숲의 오우거',hp:650,atk:28,speed:24,xp:300,gold:300,r:34,color:'#785645',boss:true}
  };
  const b=table[type];return{type,name:b.name,x,y,hp:b.hp,maxHp:b.hp,atk:b.atk,speed:b.speed,xp:b.xp,gold:b.gold,r:b.r,color:b.color,boss:!!b.boss,hitCd:0,flash:0}
}
function spawnInitial(){
  state.enemies=[];
  const pts=[[680,250],[760,520],[900,360],[1030,620],[1160,270],[1280,480]];
  pts.forEach((p,i)=>state.enemies.push(makeEnemy(i<3?'slime':'goblin',p[0],p[1])));
  if(state.player.level>=5&&!state.bossDefeated)state.enemies.push(makeEnemy('boss',1570,410));
}
function maintainEnemies(){
  const normal=state.enemies.filter(e=>!e.boss).length;
  if(normal<6){
    const x=620+Math.random()*760,y=160+Math.random()*560;
    state.enemies.push(makeEnemy(Math.random()<.55?'slime':'goblin',x,y));
  }
  if(state.player.level>=5&&!state.bossDefeated&&!state.enemies.some(e=>e.boss))state.enemies.push(makeEnemy('boss',1570,410));
}

// ===== 성장 =====
function gainXp(amount){
  const p=state.player;p.xp+=amount;
  while(p.xp>=xpNeed(p.level)){p.xp-=xpNeed(p.level);p.level++;p.maxHp+=10;p.atk+=5;p.hp=p.maxHp;toast('레벨 업! Lv.'+p.level+' · HP/공격 증가')}
}
function killEnemy(e){
  const p=state.player;p.gold+=e.gold;gainXp(e.xp);
  if(e.boss){state.bossDefeated=true;save();q('endTitle').textContent='보스 처치!';q('endText').textContent='숲의 오우거를 쓰러뜨렸어. 계속 사냥해도 돼.';q('endOverlay').hidden=false}
}

// ===== 전투 =====
function attack(){
  const p=state.player;if(!state.running||p.attackCd>0)return;p.attackCd=.48;
  let target=null,best=72;
  for(const e of state.enemies){const d=Math.hypot(e.x-p.x,e.y-p.y);if(d<best){best=d;target=e}}
  if(!target){toast('공격 범위에 적이 없어');return}
  target.hp-=p.atk;target.flash=1;
  if(target.hp<=0){state.enemies.splice(state.enemies.indexOf(target),1);killEnemy(target)}
}
function updateEnemies(dt){
  const p=state.player;
  for(const e of state.enemies){
    e.hitCd=Math.max(0,e.hitCd-dt);e.flash=Math.max(0,e.flash-dt*5);
    const dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;
    if(d<230&&!inVillage()){
      if(d>e.r+24){e.x+=dx/d*e.speed*dt;e.y+=dy/d*e.speed*dt}
      else if(e.hitCd<=0){e.hitCd=1.1;p.hp-=e.atk;toast(e.name+' 공격 -'+e.atk);if(p.hp<=0){p.hp=0;defeat();return}}
    }
  }
}
function defeat(){
  state.running=false;save();q('endTitle').textContent='쓰러짐';q('endText').textContent='마을에서 다시 시작할 수 있어.';q('endOverlay').hidden=false;
}

// ===== 이동 =====
function movePlayer(dt){
  const p=state.player,s=150;let dx=(input.right?1:0)-(input.left?1:0),dy=(input.down?1:0)-(input.up?1:0);
  if(dx||dy){const d=Math.hypot(dx,dy);dx/=d;dy/=d;p.x=clamp(p.x+dx*s*dt,25,WORLD.w-25);p.y=clamp(p.y+dy*s*dt,90,WORLD.h-70);p.dirX=dx;p.dirY=dy}
  p.attackCd=Math.max(0,p.attackCd-dt);
  state.cameraX=clamp(p.x-W*.5,0,Math.max(0,WORLD.w-W));
}

// ===== UI =====
function updateHud(){
  const p=state.player;q('hp').textContent='HP '+Math.ceil(p.hp)+' / '+p.maxHp;q('level').textContent='Lv.'+p.level;q('xp').textContent='XP '+p.xp+' / '+xpNeed(p.level);q('gold').textContent=p.gold+'G';
  q('area').textContent=inVillage()?'마을':(p.x>1450?'보스 숲':'초원 사냥터');
  q('shop').disabled=!inVillage();q('heal').disabled=!inVillage()||p.hp>=p.maxHp;
  q('message').textContent=inVillage()?'마을: 상점과 무료 회복 가능':(p.level<5?'몬스터를 잡아서 5레벨을 만들어':'오른쪽 끝에 보스가 등장했어');
}
function openShop(){if(!inVillage()){toast('마을에서만 상점 이용 가능');return}q('shopOverlay').hidden=false}
function buy(kind){
  const p=state.player;
  if(kind==='sword'){const cost=100+p.swordLv*80;if(p.gold<cost){toast('골드 부족');return}p.gold-=cost;p.swordLv++;p.atk+=5;toast('공격력 +5')}
  if(kind==='armor'){const cost=120+p.armorLv*90;if(p.gold<cost){toast('골드 부족');return}p.gold-=cost;p.armorLv++;p.maxHp+=20;p.hp+=20;toast('최대 체력 +20')}
  if(kind==='heal'){if(p.gold<30){toast('골드 부족');return}p.gold-=30;p.hp=p.maxHp;toast('완전 회복')}
  save();updateHud();updateShopButtons()
}
function updateShopButtons(){
  const p=state.player;q('buySword').textContent=(100+p.swordLv*80)+'G';q('buyArmor').textContent=(120+p.armorLv*90)+'G';
}

// ===== 그리기 =====
function draw(){
  const cam=state.cameraX;X.clearRect(0,0,W,H);X.fillStyle='#3d7044';X.fillRect(0,0,W,H);
  // 초원
  for(let x=-cam%80;x<W;x+=80)for(let y=90;y<H-70;y+=70){X.fillStyle=((x+y)%160)?'#42794a':'#3d7445';X.fillRect(x,y,80,70)}
  // 마을
  const v=WORLD.village;X.fillStyle='#b9a26f';X.fillRect(v.x-cam,v.y,v.w,v.h);X.fillStyle='#7a5a3d';X.fillRect(130-cam,190,130,90);X.fillRect(315-cam,400,120,95);X.fillStyle='#d9c08b';X.fillRect(145-cam,205,100,60);X.fillRect(330-cam,415,90,65);
  X.fillStyle='#6b4b32';X.fillRect(190-cam,245,26,35);X.fillRect(365-cam,455,24,25);
  // 길
  X.strokeStyle='#9c885e';X.lineWidth=54;X.beginPath();X.moveTo(500-cam,370);X.lineTo(1750-cam,370);X.stroke();X.strokeStyle='#b6a076';X.lineWidth=34;X.stroke();
  // 보스 구역
  X.fillStyle='#24412d';X.fillRect(1450-cam,90,350,H-160);X.fillStyle='#1a2d20';for(let i=0;i<7;i++){const x=1490+i*48-cam;X.fillRect(x,130,12,72);X.beginPath();X.arc(x+6,125,28,0,Math.PI*2);X.fill()}
  // 적
  for(const e of state.enemies){const x=e.x-cam,y=e.y;X.fillStyle='#07100877';X.beginPath();X.ellipse(x+4,y+e.r*.7,e.r*.9,e.r*.42,0,0,Math.PI*2);X.fill();X.fillStyle=e.flash>0?'#fff':e.color;X.beginPath();X.arc(x,y,e.r,0,Math.PI*2);X.fill();X.fillStyle='#201215';X.fillRect(x-e.r,y-e.r-9,e.r*2,4);X.fillStyle='#e96961';X.fillRect(x-e.r,y-e.r-9,e.r*2*Math.max(0,e.hp/e.maxHp),4);X.fillStyle='#fff';X.font='800 9px system-ui';X.textAlign='center';X.fillText(e.name,x,y-e.r-14)}
  // 플레이어
  const px=state.player.x-cam,py=state.player.y;X.fillStyle='#07100877';X.beginPath();X.ellipse(px+4,py+15,17,7,0,0,Math.PI*2);X.fill();X.fillStyle='#4f78c8';X.beginPath();X.arc(px,py,18,0,Math.PI*2);X.fill();X.fillStyle='#e8eefc';X.fillRect(px-5,py-8,10,18);X.strokeStyle='#e5d08d';X.lineWidth=4;X.beginPath();X.moveTo(px+10,py);X.lineTo(px+26,py-10);X.stroke()
}
function loop(ts){if(!state)return;const dt=Math.min(.033,Math.max(0,(ts-last)/1000||0));last=ts;if(state.running){movePlayer(dt);updateEnemies(dt);state.spawnTimer-=dt;if(state.spawnTimer<=0){state.spawnTimer=2.5;maintainEnemies()}updateHud()}draw();raf=requestAnimationFrame(loop)}

// ===== 입력 =====
document.querySelectorAll('[data-dir]').forEach(b=>{const k=b.dataset.dir;const on=e=>{e.preventDefault();input[k]=true},off=e=>{e.preventDefault();input[k]=false};b.addEventListener('pointerdown',on,{passive:false});b.addEventListener('pointerup',off,{passive:false});b.addEventListener('pointercancel',off,{passive:false});b.addEventListener('pointerleave',off,{passive:false})});
addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='w')input.up=true;if(e.key==='ArrowDown'||e.key==='s')input.down=true;if(e.key==='ArrowLeft'||e.key==='a')input.left=true;if(e.key==='ArrowRight'||e.key==='d')input.right=true;if(e.key===' ')attack()});
addEventListener('keyup',e=>{if(e.key==='ArrowUp'||e.key==='w')input.up=false;if(e.key==='ArrowDown'||e.key==='s')input.down=false;if(e.key==='ArrowLeft'||e.key==='a')input.left=false;if(e.key==='ArrowRight'||e.key==='d')input.right=false});
q('attack').onclick=attack;q('shop').onclick=openShop;q('heal').onclick=()=>{if(inVillage()){state.player.hp=state.player.maxHp;toast('무료 회복');updateHud()}};
q('saveBtn').onclick=()=>{save();toast('저장했어')};q('buySword').onclick=()=>buy('sword');q('buyArmor').onclick=()=>buy('armor');q('buyHeal').onclick=()=>buy('heal');q('closeShop').onclick=()=>q('shopOverlay').hidden=true;
q('start').onclick=()=>{if(!load())state=fresh();spawnInitial();q('startOverlay').hidden=true;updateShopButtons();updateHud();last=performance.now();raf=requestAnimationFrame(loop)};
q('retry').onclick=()=>{q('endOverlay').hidden=true;state.player.x=260;state.player.y=370;state.player.hp=state.player.maxHp;state.running=true;spawnInitial();save();toast('마을에서 다시 시작')};
})();
</script>
</body>
</html>
