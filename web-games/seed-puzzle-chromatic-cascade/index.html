<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#11112a"><title>색채의 연쇄</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090918;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:manipulation}.wrap{height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 10px);background:radial-gradient(circle at 50% 15%,#29204e,#0d1024 58%,#070812)}.top{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.stat{padding:7px 5px;border:1px solid #ffffff1c;border-radius:13px;background:#11182edb;text-align:center;font-size:10px;color:#aebbd8}.stat b{display:block;margin-top:1px;font-size:16px;color:#fff}.goal{margin:8px 0 6px}.goalHead{display:flex;justify-content:space-between;font-size:11px;font-weight:900;color:#c7d2f2}.bar{height:9px;margin-top:4px;border-radius:99px;background:#ffffff13;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6fd9ff,#9b7bff,#ff79b7);transition:width .2s}.boardWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}.board{width:min(94vw,56vh,480px);aspect-ratio:1;display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:8px;border-radius:20px;background:#10172de8;border:1px solid #ffffff20;box-shadow:0 16px 45px #0008}.gem{position:relative;border:0;border-radius:13px;background:#171d32;box-shadow:inset 0 0 0 2px #ffffff12;transition:transform .12s,opacity .12s}.gem:before{content:'';position:absolute;inset:13%;border-radius:50%;background:var(--c);box-shadow:0 0 14px var(--c),inset 0 0 0 3px #ffffff42}.gem.sel{transform:scale(.88);outline:3px solid #fff}.gem.pop{transform:scale(.2);opacity:.15}.bottom{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.btn{min-height:48px;border:1px solid #ffffff20;border-radius:14px;background:#192b51;color:#fff;font-weight:900}.btn.primary{background:#6c4fc2}.status{height:20px;margin:5px 0 3px;text-align:center;color:#aebfe4;font-size:10px;font-weight:800}.overlay{position:fixed;z-index:20;inset:0;display:none;align-items:center;justify-content:center;padding:22px;background:#050612d8;backdrop-filter:blur(6px)}.overlay.show{display:flex}.card{width:min(100%,420px);padding:20px;border:1px solid #8c7ce944;border-radius:23px;background:#131932;box-shadow:0 20px 70px #000a}.eyebrow{font-size:10px;font-weight:950;letter-spacing:.13em;color:#99e8ff}.card h1,.card h2{margin:5px 0 8px}.card p{margin:0 0 15px;color:#bdc9e3;font-size:13px;line-height:1.55}.wide{width:100%;min-height:56px;border:0;border-radius:15px;background:#7659d4;color:#fff;font-size:15px;font-weight:950}.audio{display:flex;gap:8px;margin-top:8px}.audio button{min-height:38px;border:1px solid #ffffff20;border-radius:11px;background:#182744;color:#fff;font-weight:900;padding:0 11px}.audio input{flex:1}
</style></head><body data-audio-state="locked"><main class="wrap"><div class="top"><div class="stat">레벨<b id="level">1</b></div><div class="stat">점수<b id="score">0</b></div><div class="stat">남은 이동<b id="moves">25</b></div><div class="stat">최대 연쇄<b id="bestCombo">0</b></div></div><div class="goal"><div class="goalHead"><span>목표 점수</span><span id="goalText">0 / 900</span></div><div class="bar"><i id="goalBar"></i></div></div><div class="boardWrap"><div id="board" class="board"></div></div><div id="status" class="status">보석 하나를 누르고 옆 보석을 눌러 교환</div><div class="bottom"><button id="shuffle" class="btn">섞기 1회</button><button id="hint" class="btn">힌트</button><button id="restart" class="btn primary">다시 시작</button></div></main><div id="start" class="overlay show"><div class="card"><div class="eyebrow">MATCH PUZZLE</div><h1>색채의 연쇄</h1><p>서로 붙은 보석을 교환해 같은 색 3개 이상을 맞춰. 한 번의 교환으로 연속 폭발을 만들수록 점수가 크게 올라가.</p><button id="startBtn" class="wide">퍼즐 시작</button><div class="audio"><button id="mute" data-audio-control="mute">음악 켜짐</button><input id="volume" data-audio-control="volume" type="range" min="0" max="1" value="0.22" step="0.05"></div></div></div><div id="resultOverlay" class="overlay"><div class="card"><div class="eyebrow">CASCADE RESULT</div><h2 id="resultTitle"></h2><p id="resultText"></p><button id="nextBtn" class="wide"></button></div></div><script>
(()=>{'use strict';const N=7,COLORS=['#ff5d78','#ffbd4a','#57dca7','#55b9ff','#9b70ff','#f06ed1'];const $=id=>document.getElementById(id);const boardEl=$('board');let board=[],selected=-1,score=0,moves=25,level=1,target=900,bestCombo=0,locked=false,shuffleLeft=1,audio=null,master=null,osc=null,muted=false;const ui={score:$('score'),moves:$('moves'),level:$('level'),bestCombo:$('bestCombo'),goalText:$('goalText'),goalBar:$('goalBar'),status:$('status')};
function ensureAudio(){try{audio ||= new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();if(!master){master=audio.createGain();master.gain.value=Number($('volume').value);master.connect(audio.destination);osc=audio.createOscillator();osc.type='sine';osc.frequency.value=165;osc.connect(master);osc.start()}document.body.dataset.audioState=muted?'muted':'running'}catch{}}function tone(f,d=.06,v=.025){try{ensureAudio();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;o.type='triangle';g.gain.value=muted?0:v;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.stop(audio.currentTime+d)}catch{}}
function idx(r,c){return r*N+c}function rc(i){return[Math.floor(i/N),i%N]}function adjacent(a,b){const[ar,ac]=rc(a),[br,bc]=rc(b);return Math.abs(ar-br)+Math.abs(ac-bc)===1}function rand(){return Math.floor(Math.random()*COLORS.length)}
function makeBoard(){board=Array(N*N).fill(0).map(()=>rand());for(let r=0;r<N;r++)for(let c=0;c<N;c++){let guard=0;while(((c>=2&&board[idx(r,c)]===board[idx(r,c-1)]&&board[idx(r,c)]===board[idx(r,c-2)])||(r>=2&&board[idx(r,c)]===board[idx(r-1,c)]&&board[idx(r,c)]===board[idx(r-2,c)]))&&guard++<20)board[idx(r,c)]=rand()}render()}
function render(){boardEl.innerHTML='';board.forEach((color,i)=>{const b=document.createElement('button');b.className='gem'+(selected===i?' sel':'');b.style.setProperty('--c',COLORS[color]);b.dataset.i=i;b.setAttribute('aria-label',`보석 ${i+1}`);b.onclick=()=>tap(i);boardEl.appendChild(b)});updateUi()}
function updateUi(){ui.score.textContent=score;ui.moves.textContent=moves;ui.level.textContent=level;ui.bestCombo.textContent=bestCombo;ui.goalText.textContent=`${Math.min(score,target)} / ${target}`;ui.goalBar.style.width=(Math.min(1,score/target)*100)+'%';$('shuffle').textContent=`섞기 ${shuffleLeft}회`;$('shuffle').disabled=shuffleLeft<=0||locked}
function findMatches(){const set=new Set();for(let r=0;r<N;r++){let s=0;for(let c=1;c<=N;c++){if(c<N&&board[idx(r,c)]===board[idx(r,c-1)])continue;if(c-s>=3)for(let x=s;x<c;x++)set.add(idx(r,x));s=c}}for(let c=0;c<N;c++){let s=0;for(let r=1;r<=N;r++){if(r<N&&board[idx(r,c)]===board[idx(r-1,c)])continue;if(r-s>=3)for(let x=s;x<r;x++)set.add(idx(x,c));s=r}}return [...set]}
async function resolve(){locked=true;let chain=0,total=0;while(true){const matches=findMatches();if(!matches.length)break;chain++;bestCombo=Math.max(bestCombo,chain);total+=matches.length;score+=matches.length*40*chain;tone(330+chain*90,.08,.03);for(const i of matches){const el=boardEl.children[i];if(el)el.classList.add('pop')}await wait(130);for(const i of matches)board[i]=-1;for(let c=0;c<N;c++){const vals=[];for(let r=N-1;r>=0;r--){const v=board[idx(r,c)];if(v>=0)vals.push(v)}for(let r=N-1,k=0;r>=0;r--,k++)board[idx(r,c)]=k<vals.length?vals[k]:rand()}render();await wait(100)}if(chain)ui.status.textContent=chain>1?`${chain}연쇄! ${total}개 제거`:`${total}개 매치`;locked=false;updateUi();checkEnd()}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
async function tap(i){if(locked)return;ensureAudio();if(selected<0){selected=i;render();tone(240,.04,.015);return}if(selected===i){selected=-1;render();return}if(!adjacent(selected,i)){selected=i;render();return}const a=selected;selected=-1;[board[a],board[i]]=[board[i],board[a]];render();if(!findMatches().length){locked=true;await wait(120);[board[a],board[i]]=[board[i],board[a]];render();locked=false;ui.status.textContent='매치가 없는 교환은 되돌아가';tone(100,.09,.025);return}moves--;await resolve()}
function checkEnd(){if(score>=target){locked=true;setTimeout(()=>showResult(true),240);return}if(moves<=0){locked=true;setTimeout(()=>showResult(false),240)}}function showResult(win){$('resultTitle').textContent=win?'레벨 클리어':'이동 횟수 종료';$('resultText').textContent=win?`점수 ${score} · 최대 ${bestCombo}연쇄. 다음 보드는 목표가 더 높아져.`:`점수 ${score} / 목표 ${target}. 다시 조합해봐.`;$('nextBtn').textContent=win?'다음 레벨':'다시 도전';$('nextBtn').onclick=()=>{$('resultOverlay').classList.remove('show');if(win){level++;target=Math.round(target*1.32);moves=Math.max(18,25-Math.floor(level/3));score=0;bestCombo=0;shuffleLeft=1}else{score=0;moves=25;bestCombo=0;shuffleLeft=1}locked=false;makeBoard();ui.status.textContent='새 보드 시작'};$('resultOverlay').classList.add('show');tone(win?720:120,.18,.04)}
function hint(){if(locked)return;for(let a=0;a<board.length;a++){const[r,c]=rc(a);for(const [dr,dc] of [[0,1],[1,0]]){const nr=r+dr,nc=c+dc;if(nr>=N||nc>=N)continue;const b=idx(nr,nc);[board[a],board[b]]=[board[b],board[a]];const ok=findMatches().length>0;[board[a],board[b]]=[board[b],board[a]];if(ok){selected=a;render();ui.status.textContent='선택된 보석 옆을 확인해';tone(510,.08,.02);return}}}ui.status.textContent='가능한 조합이 없어. 섞기를 사용해'}
$('shuffle').onclick=()=>{if(locked||shuffleLeft<=0)return;ensureAudio();shuffleLeft--;selected=-1;makeBoard();ui.status.textContent='보드를 섞었어';tone(430,.1,.025)};$('hint').onclick=hint;$('restart').onclick=()=>{score=0;moves=25;bestCombo=0;shuffleLeft=1;selected=-1;locked=false;makeBoard();ui.status.textContent='레벨 다시 시작'};$('startBtn').onclick=()=>{$('start').classList.remove('show');ensureAudio();makeBoard()};$('mute').onclick=()=>{ensureAudio();muted=!muted;if(master)master.gain.value=muted?0:Number($('volume').value);$('mute').textContent=muted?'음악 꺼짐':'음악 켜짐';document.body.dataset.audioState=muted?'muted':'running'};$('volume').oninput=()=>{ensureAudio();if(master&&!muted)master.gain.value=Number($('volume').value)};})();
</script></body></html>
