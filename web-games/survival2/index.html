<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>숲의 생존자들</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09120f;color:#fff;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;touch-action:none}#app{position:relative;width:100%;height:100%;overflow:hidden}canvas{display:block;width:100%;height:100%}.hud{position:absolute;z-index:5;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.card{min-width:145px;padding:8px 10px;border:1px solid #fff3;border-radius:13px;background:#06110de0;box-shadow:0 5px 18px #0007;backdrop-filter:blur(5px);font-size:12px;font-weight:900;line-height:1.45}.small{font-size:10px;opacity:.84}.bar{height:7px;margin-top:4px;border-radius:8px;background:#ffffff24;overflow:hidden}.bar i{display:block;height:100%;background:#e94a4a;width:100%}.menu{position:absolute;z-index:8;right:8px;top:66px;display:grid;gap:6px}.btn{min-width:90px;border:1px solid #fff3;border-radius:11px;background:#09150fe8;color:#fff;padding:9px 10px;font-size:11px;font-weight:900;box-shadow:0 4px 12px #0004}.btn:active{transform:scale(.97)}.attack{position:absolute;z-index:9;right:11px;bottom:19px;min-width:112px;min-height:62px;background:#8b302b}.joystick{position:absolute;z-index:9;left:16px;bottom:18px;width:130px;height:130px;border:2px solid #ffffff22;border-radius:50%;background:#ffffff0d;box-shadow:inset 0 0 24px #0005}.stick{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border:2px solid #fff3;border-radius:50%;background:#d9ead950}.hint{position:absolute;z-index:4;left:50%;bottom:9px;transform:translateX(-50%);padding:6px 9px;border-radius:10px;background:#06100eb0;font-size:10px;font-weight:800;white-space:nowrap}.panel{position:absolute;z-index:30;left:8px;right:8px;top:60px;bottom:8px;display:none;padding:12px;border:1px solid #ffffff32;border-radius:17px;background:#071019f8;overflow:auto;touch-action:pan-y;box-shadow:0 12px 35px #0009}.panel h2{margin:0 0 10px;font-size:19px}.close{float:right;border:0;border-radius:9px;background:#ffffff15;color:#fff;padding:7px 9px;font-weight:900}.item{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:7px 0;padding:10px;border:1px solid #ffffff10;border-radius:12px;background:#11252b}.item small{display:block;margin-top:3px;opacity:.74;font-size:10px}.item button,.choice button{border:0;border-radius:9px;background:#2e9464;color:#fff;padding:8px 10px;font-weight:900}.story{padding:12px;border:1px solid #ffffff18;border-radius:14px;background:linear-gradient(145deg,#152c31,#0c1a22);margin-bottom:10px}.story h3{margin:6px 0}.story b{color:#ffd778}.badge{display:inline-block;padding:4px 7px;border-radius:999px;background:#183d48;color:#8fe6ff;font-size:9px;font-weight:900}.quest{padding:9px;border-radius:11px;background:#10262d;margin:7px 0}.heart{color:#ff83ac}.buildgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.buildgrid button{min-height:54px}.event{position:absolute;z-index:45;left:50%;top:50%;width:min(92%,380px);transform:translate(-50%,-50%);display:none;padding:16px;border:1px solid #fff3;border-radius:18px;background:#071019f7;box-shadow:0 18px 55px #000b}.event h3{margin:0 0 8px}.event p{margin:6px 0;line-height:1.55;font-size:13px}.event button{width:100%;margin-top:7px;border:0;border-radius:11px;padding:11px;background:#2d8f63;color:#fff;font-weight:900}.boss{color:#ffd66e;font-size:10px;font-weight:900}.dead{position:absolute;z-index:50;inset:0;display:none;place-items:center;background:#000b}.deadcard{width:min(90%,360px);padding:20px;border:1px solid #fff3;border-radius:18px;background:#08121af5;text-align:center}.deadcard button{border:0;border-radius:11px;background:#33865f;color:#fff;padding:10px 15px;font-weight:900}</style></head><body><div id="app"><canvas id="game"></canvas><div class="hud"><div class="card">❤️ <span id="hp"></span><div class="bar"><i id="hpbar"></i></div><span class="small">⚔️ <span id="atk"></span> · 👩 <span id="companion"></span></span></div><div class="card"><span id="phase"></span> · <span id="clock"></span><br><span class="small">📅 <span id="day"></span>일 · 🪵<span id="wood"></span> 🪨<span id="stone"></span> 🌿<span id="fiber"></span> 🍖<span id="meat"></span></span></div></div><div class="menu"><button class="btn" id="questBtn">📖 퀘스트</button><button class="btn" id="eventBtn">✨ 이벤트</button><button class="btn" id="compBtn">👩 동료</button><button class="btn" id="houseBtn">🏠 하우징</button><button class="btn" id="craftBtn">🛠 제작</button><button class="btn" id="invBtn">🎒 가방</button><button class="btn" id="gatherBtn">✋ 채집</button></div><button class="btn attack" id="attackBtn">⚔️ 공격</button><div class="joystick" id="joystick"><div class="stick" id="stick"></div></div><div class="hint">탐험 → 이벤트 → 동료 → 하우징 → 보스</div><div class="panel" id="quest"><button class="close" data-close="quest">닫기</button><h2>📖 스토리 · 퀘스트</h2><div id="questBody"></div></div><div class="panel" id="comp"><button class="close" data-close="comp">닫기</button><h2>👩 여성 동료</h2><div id="compBody"></div></div><div class="panel" id="house"><button class="close" data-close="house">닫기</button><h2>🏠 하우징</h2><p class="small">건물은 월드에 남고 날짜가 바뀌는 순간 저장돼.</p><div id="houseBody"></div></div><div class="panel" id="craft"><button class="close" data-close="craft">닫기</button><h2>🛠 제작</h2><div id="craftBody"></div></div><div class="panel" id="inv"><button class="close" data-close="inv">닫기</button><h2>🎒 가방</h2><div id="invBody"></div></div><div class="event" id="event"><h3 id="eventTitle"></h3><p id="eventText"></p><div id="eventChoices"></div></div><div id="toast" class="event" style="display:none;top:18%;width:auto;min-width:160px;padding:9px 13px;text-align:center"></div><div class="dead" id="dead"><div class="deadcard"><h2>생존 실패</h2><p id="deadText"></p><button id="restart">다시 시작</button></div></div></div><script>
// 파일명: web-games/survival2/index.html
// 임포트: 기존 SAVE 키 유지 / 외부 에셋 최소화

const C=document.getElementById('game'),ctx=C.getContext('2d');const E={hp:document.getElementById('hp'),hpbar:document.getElementById('hpbar'),atk:document.getElementById('atk'),companion:document.getElementById('companion'),phase:document.getElementById('phase'),clock:document.getElementById('clock'),day:document.getElementById('day'),wood:document.getElementById('wood'),stone:document.getElementById('stone'),fiber:document.getElementById('fiber'),meat:document.getElementById('meat'),quest:document.getElementById('questBody'),comp:document.getElementById('compBody'),house:document.getElementById('houseBody'),craft:document.getElementById('craftBody'),inv:document.getElementById('invBody'),event:document.getElementById('event'),eventTitle:document.getElementById('eventTitle'),eventText:document.getElementById('eventText'),eventChoices:document.getElementById('eventChoices'),toast:document.getElementById('toast'),dead:document.getElementById('dead'),deadText:document.getElementById('deadText')};
const SAVE='jaewoon-survival2-v2',W=4600,H=4600;let sw=innerWidth,sh=innerHeight,dpr=1,last=performance.now(),joy=false,jx=0,jy=0,attackCd=0,gatherCd=0,attackAnim=0,shake=0,eventLock=false,eventDay=0;
const defs={유나:{role:'전사',hp:120,atk:20,speed:88,r:18,shirt:'#b98572',hair:'#352127'},세라:{role:'궁수',hp:78,atk:15,speed:98,r:16,shirt:'#8fa7ca',hair:'#6b4028'},미라:{role:'의무병',hp:90,atk:6,speed:80,r:16,shirt:'#92b989',hair:'#59392b'},리아:{role:'탐험가',hp:95,atk:10,speed:94,r:17,shirt:'#c4a16b',hair:'#493324'}};
const state={day:1,time:480,hp:100,maxHp:100,wood:0,stone:0,fiber:0,meat:0,weapon:'맨손',weaponBonus:0,story:0,kills:0,boss:{alpha:false,guardian:false,core:false},flags:{유나:false,세라:false,미라:false,리아:false},companion:null,companionHp:0,romance:{유나:0,세라:0,미라:0,리아:0},housing:[],player:{x:2300,y:2300},resources:[],enemies:[],npcs:[],effects:[]};let companionObj={x:2240,y:2360,cd:0};
function resize(){dpr=Math.min(2,devicePixelRatio||1);sw=innerWidth;sh=innerHeight;C.width=sw*dpr;C.height=sh*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function R(a,b){return a+Math.random()*(b-a)}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function D(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function night(){return state.time>=1260||state.time<360}function toastMsg(t){E.toast.textContent=t;E.toast.style.display='block';clearTimeout(toastMsg.t);toastMsg.t=setTimeout(()=>E.toast.style.display='none',1100)}
// 저장은 날짜가 넘어가는 순간에만 수행
function saveAtDayChange(){try{localStorage.setItem(SAVE,JSON.stringify(state))}catch(e){}}
function spawnRes(type){const a=R(0,Math.PI*2),d=R(220,1850);state.resources.push({type,x:clamp(state.player.x+Math.cos(a)*d,80,W-80),y:clamp(state.player.y+Math.sin(a)*d,80,H-80),n:type==='tree'?4:type==='stone'?3:4})}function spawnEnemy(kind,boss=false){const a=R(0,Math.PI*2),d=R(boss?1100:700,boss?1800:1700),v={늑대:[60,10,65,18],멧돼지:[95,14,45,22],거미:[45,8,72,16],숲의알파:[450,30,50,38],연구소수호자:[800,40,38,46],숲의핵:[1400,58,30,52]}[kind];state.enemies.push({kind,boss,x:clamp(state.player.x+Math.cos(a)*d,60,W-60),y:clamp(state.player.y+Math.sin(a)*d,60,H-60),hp:v[0],maxHp:v[0],atk:v[1],speed:v[2],r:v[3],cd:R(.1,1.2),agg:boss,hurt:0})}
function seed(){state.resources=[];state.enemies=[];for(let i=0;i<100;i++)spawnRes(['tree','tree','tree','stone','stone','fiber','berry'][i%7]);for(let i=0;i<8;i++)spawnEnemy(['늑대','멧돼지','거미'][i%3]);state.npcs=[{type:'유나',x:2570,y:2170,met:false},{type:'세라',x:3480,y:2420,met:false},{type:'미라',x:1580,y:3100,met:false},{type:'리아',x:3080,y:3400,met:false}]}
function activateBosses(){if(state.day>=3&&!state.boss.alpha&&!state.enemies.some(e=>e.kind==='숲의알파')){spawnEnemy('숲의알파',true);toastMsg('⚠️ 숲의 알파 등장')}if(state.day>=5&&!state.boss.guardian&&!state.enemies.some(e=>e.kind==='연구소수호자')){spawnEnemy('연구소수호자',true);toastMsg('⚠️ 연구소 수호자 등장')}if(state.day>=7&&!state.boss.core&&!state.enemies.some(e=>e.kind==='숲의핵')){spawnEnemy('숲의핵',true);toastMsg('⚠️ 숲의 핵이 깨어났어')}}
const EVENTS=[['폭우','갑작스러운 폭우가 숲을 덮쳤어. 시야가 줄고 움직임이 둔해진다.',[['🏕️ 기지로 돌아간다',()=>{state.hp=Math.min(state.maxHp,state.hp+10);toastMsg('잠시 비를 피했어')}],['🌲 빗속을 뚫고 탐험한다',()=>{state.wood+=2;state.fiber+=2;toastMsg('젖은 자원 +4')}]]],['보급품 투하','하늘에서 오래된 비상 보급품이 떨어졌어. 주변에 포식자도 모인다.',[['📦 지금 연다',()=>{state.wood+=4;state.stone+=3;state.meat+=2;toastMsg('보급품 획득')}],['🚶 포기한다',()=>{state.hp=Math.max(1,state.hp-5);toastMsg('위험을 피했어')}]]],['폐허의 생존자','무너진 건물 안에서 여성 생존자의 무전이 잡혀.',[['👩 구조한다',()=>{state.romance.리아=clamp((state.romance.리아||0)+8,0,100);state.fiber+=3;toastMsg('리아 신뢰 +8')}],['🔦 혼자 수색한다',()=>{state.stone+=5;toastMsg('폐허에서 돌 +5')}]]],['야생 습격','밤의 괴물들이 기지 냄새를 맡았어.',[['🛡️ 막는다',()=>{for(let i=0;i<3;i++)spawnEnemy(['늑대','멧돼지','거미'][i]);state.hp=Math.max(1,state.hp-7);toastMsg('습격을 버텼어')}],['🔥 모닥불을 키운다',()=>{state.hp=Math.min(state.maxHp,state.hp+12);toastMsg('불빛에 적이 물러났어')}]]],['동료의 밤','오늘 밤은 유난히 조용하다. 활성 동료와 대화할 수 있다.',[['💬 진솔하게 대화한다',()=>{if(state.companion){state.romance[state.companion]=clamp((state.romance[state.companion]||0)+6,0,100);toastMsg(state.companion+' 호감도 +6')}else toastMsg('활성 동료가 없어')}],['🛏️ 함께 쉰다',()=>{state.hp=Math.min(state.maxHp,state.hp+8);toastMsg('휴식으로 체력 +8')}]]]];
function triggerEvent(force=false){if(eventLock)return;if(!force&&eventDay===state.day)return;if(!force&&Math.random()>.42)return;const ev=EVENTS[Math.floor(Math.random()*EVENTS.length)];eventDay=state.day;eventLock=true;E.event.style.display='block';E.eventTitle.textContent='✨ '+ev[0];E.eventText.textContent=ev[1];E.eventChoices.innerHTML='';ev[2].forEach(([label,fn])=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>{fn();eventLock=false;E.event.style.display='none'};E.eventChoices.appendChild(b)})}
function renderQuest(){const count=Object.values(state.flags).filter(Boolean).length;const q=[['제1장 · 추락','바이브2호가 미지의 숲으로 추락했다. 생존 거점을 만든다.','나무 6 · 돌 4 · 야영지 1'],['제2장 · 사람의 흔적','성인 여성 생존자 유나를 만나 함께 살아남는다.','유나 영입'],['제3장 · 검은 숲','밤의 포식자가 기지를 노린다. 숲의 알파를 쓰러뜨린다.','적 6 · 숲의 알파'],['제4장 · 생존자들','흩어진 생존자들을 찾고 동료 공간을 만든다.','동료 4명 · 동료방 2'],['제5장 · 연구소','숲 아래 연구소의 진실을 파헤친다.','연구소 수호자 토벌'],['최종장 · 숲의 핵','숲을 움직이는 핵을 파괴하고 구조 신호를 보낸다.','숲의 핵 토벌']][Math.min(state.story,5)];E.quest.innerHTML=`<div class="story"><span class="badge">${q[0]}</span><h3>${q[1]}</h3><p><b>목표:</b> ${q[2]}</p></div><div class="quest">처치 ${state.kills} · 동료 ${count}/4 · 건물 ${state.housing.length}</div>`}
function renderComp(){E.comp.innerHTML='<div class="item"><span><b>소환 슬롯 1칸</b><small>전투에는 한 번에 1명만 참여해.</small></span><button onclick="unsummon()">해제</button></div>'+Object.keys(defs).map(n=>{const m=defs[n],u=state.flags[n],r=state.romance[n]||0;return `<div class="item"><span><b>${n}</b><small>${m.role} · HP ${m.hp} · 공격 ${m.atk}<br><span class="heart">♥ 호감도 ${r}/100</span></small></span><div>${u?`<button onclick="summon('${n}')">${state.companion===n?'소환 중':'소환'}</button><button onclick="talk('${n}')">대화</button><button onclick="gift('${n}')">선물</button>`:'<small>스토리 영입</small>'}</div></div>`}).join('')}
function summon(n){if(!state.flags[n])return;state.companion=n;state.companionHp=defs[n].hp;companionObj={x:state.player.x-60,y:state.player.y+45,cd:0};toastMsg(n+' 소환 완료');renderComp()}function unsummon(){if(state.companion)toastMsg(state.companion+' 해제');state.companion=null;renderComp()}function talk(n){state.romance[n]=clamp((state.romance[n]||0)+4,0,100);toastMsg(n+' 호감도 +4');renderComp()}function gift(n){if(state.meat<2){toastMsg('선물용 먹이 2개가 필요해');return}state.meat-=2;state.romance[n]=clamp((state.romance[n]||0)+8,0,100);toastMsg(n+' 호감도 +8');renderComp()}function meet(n){if(state.flags[n])return;if(state.companion&&state.companion!==n){toastMsg('현재 동료를 먼저 해제해');return}state.flags[n]=true;state.companion=n;state.companionHp=defs[n].hp;state.romance[n]=Math.max(10,state.romance[n]||0);const q=state.npcs.find(v=>v.type===n);if(q)q.met=true;toastMsg(n+'가 동료가 됐어');if(n==='유나')state.story=Math.max(state.story,2);if(['세라','미라','리아'].filter(v=>state.flags[v]).length>=2)state.story=Math.max(state.story,4);renderQuest();renderComp()}
const structures=[['야영지',6,'나무','초기 거점'],['벽',5,'나무','기지 방어'],['침대',8,'나무','휴식'],['작업대',10,'나무','고급 제작'],['동료방',14,'나무','동료 개인 공간'],['돌벽',7,'돌','강화 방어']];function renderHouse(){E.house.innerHTML='<div class="buildgrid">'+structures.map(v=>`<button class="btn" onclick="build('${v[0]}',${v[1]},'${v[2]}')">🏠 ${v[0]}<br><span class="small">${v[1]} ${v[2]} · ${v[3]}</span></button>`).join('')+'</div><div class="quest">동료방 ${state.housing.filter(v=>v.type==='동료방').length}/2 · 전체 건물 ${state.housing.length}</div>'}function build(type,cost,res){const key=res==='나무'?'wood':'stone';if(state[key]<cost){toastMsg('자원이 부족해');return}state[key]-=cost;const a=R(0,Math.PI*2),d=R(55,125);state.housing.push({type,x:state.player.x+Math.cos(a)*d,y:state.player.y+Math.sin(a)*d});if(type==='야영지'&&state.story===0)state.story=1;if(state.story===3&&state.housing.filter(v=>v.type==='동료방').length>=2)state.story=4;toastMsg(type+' 건설 완료');renderQuest();renderHouse()}
const recipes=[['돌도끼',6,0,2,4],['돌창',7,3,2,9],['강화창',12,6,4,18],['붕대',2,0,1,0]];function renderCraft(){E.craft.innerHTML=recipes.map(v=>`<div class="item"><span><b>${v[0]}</b><small>🪵 ${v[1]} · 🪨 ${v[2]} · 🌿 ${v[3]}<br>${v[0]==='붕대'?'체력 +30':'공격 +'+v[4]}</small></span><button onclick="craft('${v[0]}')">제작</button></div>`).join('')}function craft(n){const v=recipes.find(a=>a[0]===n);if(!v||state.wood<v[1]||state.stone<v[2]||state.fiber<v[3]){toastMsg('재료가 부족해');return}state.wood-=v[1];state.stone-=v[2];state.fiber-=v[3];if(n==='붕대')state.hp=Math.min(state.maxHp,state.hp+30);else{state.weapon=n;state.weaponBonus=v[4]}toastMsg(n==='붕대'?'체력 +30':n+' 장착')}
function renderInv(){E.inv.innerHTML=`<div class="item"><span>🗡 무기<small>${state.weapon} · 공격 +${state.weaponBonus}</small></span></div><div class="item"><span>🍖 먹이<small>${state.meat}개</small></span><button onclick="eat()">먹기</button></div><div class="item"><span>🏠 건물<small>${state.housing.length}개</small></span></div>`}function eat(){if(!state.meat){toastMsg('먹이가 없어');return}state.meat--;state.hp=Math.min(state.maxHp,state.hp+18);toastMsg('체력 +18')}
function nearestResource(){let b=null,bd=88;for(const r of state.resources){const d=D(state.player,r);if(d<bd){bd=d;b=r}}return b}function gather(){if(gatherCd>0)return;const r=nearestResource();if(!r){toastMsg('자원에 더 가까이 가');return}gatherCd=.25;const k={tree:['wood','나무'],stone:['stone','돌'],fiber:['fiber','섬유'],berry:['meat','열매']}[r.type];state[k[0]]++;r.n--;if(r.n<=0){state.resources.splice(state.resources.indexOf(r),1);setTimeout(()=>spawnRes(r.type),1800)}state.story===0&&state.wood>=6&&state.stone>=4&&state.housing.some(v=>v.type==='야영지')&&(state.story=1,renderQuest());toastMsg(k[1]+' +1')}
function effect(x,y,type,text){state.effects.push({x,y,t:.8,type,text,vx:R(-50,50),vy:R(-65,-10)})}function defeatEnemy(e){const i=state.enemies.indexOf(e);if(i<0)return;state.enemies.splice(i,1);state.kills++;state.meat+=e.boss?5:1;effect(e.x,e.y,'burst',e.boss?'BOSS DOWN':'+'+(e.boss?5:1));if(e.kind==='숲의알파')state.boss.alpha=true;if(e.kind==='연구소수호자')state.boss.guardian=true;if(e.kind==='숲의핵'){state.boss.core=true;toastMsg('숲의 핵을 파괴했어')}if(state.story===2&&state.kills>=6&&state.boss.alpha)state.story=3;if(state.story===4&&state.boss.guardian)state.story=5;renderQuest()}
function playerAttack(){if(attackCd>0||eventLock)return;attackCd=.42;attackAnim=.24;shake=.12;let target=null,bd=160;for(const e of state.enemies){const d=D(state.player,e);if(d<bd){bd=d;if(!target||e.boss)target=e}}if(!target){toastMsg('공격할 적이 가까이 없어');return}const dmg=5+state.weaponBonus;target.hp-=dmg;target.agg=true;target.hurt=.16;target.x+=jx*20;target.y+=jy*20;effect(target.x,target.y,'slash');effect(target.x,target.y,'damage','-'+dmg);if(target.hp<=0)defeatEnemy(target)}
function updateCompanion(dt){if(!state.companion)return;const n=state.companion,m=defs[n],q=companionObj;let target=state.enemies.filter(e=>e.agg||e.boss).sort((a,b)=>D(q,a)-D(q,b))[0];if(target){const d=D(q,target);if(n==='세라'){if(d>240){q.x+=(target.x-q.x)/Math.max(1,d)*m.speed*dt;q.y+=(target.y-q.y)/Math.max(1,d)*m.speed*dt}else if(q.cd<=0){target.hp-=m.atk;q.cd=1.35;target.hurt=.12;effect(target.x,target.y,'arrow');effect(target.x,target.y,'damage','-'+m.atk)}}else if(n==='유나'){if(d>54){q.x+=(target.x-q.x)/Math.max(1,d)*m.speed*dt;q.y+=(target.y-q.y)/Math.max(1,d)*m.speed*dt}else if(q.cd<=0){target.hp-=m.atk;q.cd=1;target.hurt=.12;effect(target.x,target.y,'slash');effect(target.x,target.y,'damage','-'+m.atk)}}else{const d2=D(q,state.player);if(d2>78){q.x+=(state.player.x-q.x)/Math.max(1,d2)*m.speed*dt;q.y+=(state.player.y-q.y)/Math.max(1,d2)*m.speed*dt}}if(target.hp<=0)defeatEnemy(target)}else{const d=D(q,state.player);if(d>78){q.x+=(state.player.x-q.x)/Math.max(1,d)*m.speed*dt;q.y+=(state.player.y-q.y)/Math.max(1,d)*m.speed*dt}}if(n==='미라'&&q.cd<=0){state.hp=Math.min(state.maxHp,state.hp+3);q.cd=2.5}if(n==='리아'){const r=nearestResource();if(r&&D(q,r)<150&&Math.random()<dt*.7){state[{tree:'wood',stone:'stone',fiber:'fiber',berry:'meat'}[r.type]]++;r.n--;if(r.n<=0)state.resources.splice(state.resources.indexOf(r),1)}}q.cd=Math.max(0,(q.cd||0)-dt);q.x=clamp(q.x,50,W-50);q.y=clamp(q.y,50,H-50);state.companionHp=state.companionHp||m.hp}
function checkNPC(){if(eventLock)return;for(const n of state.npcs){if(!n.met&&D(n,state.player)<72){meet(n.type);break}}}
function updateEnemies(dt){for(const e of state.enemies){const d=D(e,state.player);if(!e.agg&&night()&&d<650)e.agg=true;if(e.agg){if(d>44){e.x+=(state.player.x-e.x)/Math.max(1,d)*e.speed*dt;e.y+=(state.player.y-e.y)/Math.max(1,d)*e.speed*dt}else if(e.cd<=0){state.hp-=e.atk;e.cd=e.boss?1.05:1.25;shake=.15;effect(state.player.x,state.player.y,'hurt')}}else{e.x+=Math.cos((e.x+e.y)*.003)*e.speed*.1*dt;e.y+=Math.sin(e.x*.002)*e.speed*.08*dt}e.cd=Math.max(0,e.cd-dt);e.hurt=Math.max(0,(e.hurt||0)-dt);e.x=clamp(e.x,40,W-40);e.y=clamp(e.y,40,H-40)}}
function update(dt){attackCd=Math.max(0,attackCd-dt);gatherCd=Math.max(0,gatherCd-dt);attackAnim=Math.max(0,attackAnim-dt);shake=Math.max(0,shake-dt);if(joy&&!eventLock){state.player.x=clamp(state.player.x+jx*185*dt,40,W-40);state.player.y=clamp(state.player.y+jy*185*dt,40,H-40)}state.time+=dt*38;if(state.time>=1440){state.time=0;state.day++;for(let i=0;i<4;i++)spawnEnemy(['늑대','멧돼지','거미'][i%3]);activateBosses();eventDay=0;saveAtDayChange();toastMsg(`${state.day}일차 시작 · 저장 완료`);triggerEvent(false)}checkNPC();updateCompanion(dt);updateEnemies(dt);for(const p of state.effects){p.t-=dt;p.x+=(p.vx||0)*dt;p.y+=(p.vy||0)*dt;p.vy=(p.vy||0)+80*dt}state.effects=state.effects.filter(v=>v.t>0);activateBosses();if(state.hp<=0&&!eventLock){state.hp=0;E.deadText.textContent=`${state.day}일차에서 생존이 끝났어.`;E.dead.style.display='grid'}}
function SP(o){return{x:o.x-state.player.x+sw/2,y:o.y-state.player.y+sh/2}}function drawHuman(px,py,o){const bob=o.moving?Math.sin(performance.now()/90)*2:0;x.save();x.translate(px,py+bob);x.fillStyle='#0006';x.beginPath();x.ellipse(0,22,22,8,0,0,7);x.fill();x.fillStyle=o.skin||'#dfb195';x.beginPath();x.arc(0,-18,13,0,7);x.fill();x.fillStyle=o.hair||'#302529';x.beginPath();x.arc(0,-23,14,Math.PI,Math.PI*2);x.fill();x.fillStyle=o.shirt||'#466b83';x.fillRect(-13,-5,26,29);x.fillStyle='#252525';x.fillRect(-10,24,7,13);x.fillRect(3,24,7,13);x.fillStyle='#fff';x.fillRect(-6,-20,3,3);x.fillRect(3,-20,3,3);if(o.weapon){x.save();x.rotate(o.swing||-.2);x.fillStyle='#7c522f';x.fillRect(22,-2,19,4);x.fillStyle='#d7dde2';x.fillRect(40,-5,8,10);x.restore()}x.restore()}
function drawEnemy(e,p){x.save();x.translate(p.x,p.y);x.fillStyle='#0005';x.beginPath();x.ellipse(0,e.r*.75,e.r*1.2,e.r*.42,0,0,7);x.fill();x.fillStyle=e.boss?(e.kind==='숲의핵'?'#a34687':e.kind==='연구소수호자'?'#6f514d':'#805437'):(e.kind==='늑대'?'#6b737d':e.kind==='멧돼지'?'#7b5c48':'#405548');x.beginPath();x.ellipse(0,0,e.r,e.r*.72,0,0,7);x.fill();x.fillStyle='#151515';x.beginPath();x.arc(e.r*.68,-4,2.5,0,7);x.arc(e.r*.88,-4,2.5,0,7);x.fill();if(e.hurt>0){x.strokeStyle='#fff';x.lineWidth=3;x.stroke()}x.restore()}
function draw(){ctx.save();if(shake)ctx.translate(R(-4,4),R(-3,3));const g=ctx.createLinearGradient(0,0,0,sh);g.addColorStop(0,night()?'#07131b':'#78c777');g.addColorStop(1,night()?'#0b1d18':'#376a3d');ctx.fillStyle=g;ctx.fillRect(0,0,sw,sh);for(let i=0;i<90;i++){const px=((i*271)-state.player.x*.18)%sw,py=((i*173)-state.player.y*.18)%sh;ctx.fillStyle=i%4?'#ffffff12':'#123a21';ctx.beginPath();ctx.arc(px,py,i%6?1.5:3,0,7);ctx.fill()}for(const b of state.housing){const p=SP(b);if(p.x<-80||p.x>sw+80||p.y<-80||p.y>sh+80)continue;ctx.fillStyle=b.type==='돌벽'?'#6d6861':b.type==='벽'?'#815a41':'#a17147';ctx.fillRect(p.x-25,p.y-19,50,36);if(['야영지','침대','작업대','동료방'].includes(b.type)){ctx.fillStyle='#bd8d57';ctx.fillRect(p.x-20,p.y-34,40,15)}ctx.fillStyle='#fff';ctx.font='9px system-ui';ctx.textAlign='center';ctx.fillText(b.type,p.x,p.y+8)}for(const r of state.resources){const p=SP(r);if(p.x<-70||p.x>sw+70||p.y<-70||p.y>sh+70)continue;if(r.type==='tree'){ctx.fillStyle='#60402a';ctx.fillRect(p.x-5,p.y-2,10,34);ctx.fillStyle='#286c42';ctx.beginPath();ctx.arc(p.x,p.y-10,28,0,7);ctx.fill();ctx.beginPath();ctx.arc(p.x-17,p.y-5,18,0,7);ctx.arc(p.x+17,p.y-7,18,0,7);ctx.fill()}else if(r.type==='stone'){ctx.fillStyle='#727a78';ctx.beginPath();ctx.moveTo(p.x-22,p.y+8);ctx.lineTo(p.x-10,p.y-14);ctx.lineTo(p.x+10,p.y-18);ctx.lineTo(p.x+24,p.y);ctx.lineTo(p.x+10,p.y+13);ctx.closePath();ctx.fill()}else{ctx.fillStyle=r.type==='berry'?'#7d2f51':'#83a55d';ctx.beginPath();ctx.arc(p.x,p.y,8,0,7);ctx.fill()}}for(const n of state.npcs){if(n.met)continue;const p=SP(n),m=defs[n.type];drawHuman(p.x,p.y,{hair:m.hair,shirt:m.shirt,skin:'#e4b79b'});ctx.fillStyle='#ffd76f';ctx.font='10px system-ui';ctx.textAlign='center';ctx.fillText(`${n.type} · 접근`,p.x,p.y-40)}for(const e of state.enemies){const p=SP(e);drawEnemy(e,p);ctx.fillStyle='#0008';ctx.fillRect(p.x-25,p.y-e.r-15,50,5);ctx.fillStyle='#e54b4b';ctx.fillRect(p.x-25,p.y-e.r-15,50*Math.max(0,e.hp/e.maxHp),5);if(e.boss){ctx.fillStyle='#ffd76d';ctx.font='10px system-ui';ctx.textAlign='center';ctx.fillText(e.kind,p.x,p.y-e.r-22)}}if(state.companion){const m=defs[state.companion],p=SP(companionObj);drawHuman(p.x,p.y,{hair:m.hair,shirt:m.shirt,skin:'#e4b79b',weapon:state.companion==='유나',swing:state.companion==='유나'?Math.sin(performance.now()/130)*.7:0,moving:true});ctx.fillStyle='#ffd2e2';ctx.font='10px system-ui';ctx.textAlign='center';ctx.fillText(`${state.companion} ♥${state.romance[state.companion]||0}`,p.x,p.y-43);ctx.fillStyle='#0008';ctx.fillRect(p.x-22,p.y-m.r-16,44,4);ctx.fillStyle='#61d585';ctx.fillRect(p.x-22,p.y-m.r-16,44*Math.max(0,state.companionHp/m.hp),4)}drawHuman(sw/2,sh/2,{shirt:'#476f88',skin:'#dcb095',hair:'#2d2627',weapon:state.weapon!=='맨손',swing:attackAnim?Math.sin((.24-attackAnim)*22)*1.4:0,moving:joy});if(attackAnim){ctx.globalAlpha=.85;ctx.strokeStyle='#ffe59b';ctx.lineWidth=5;ctx.beginPath();ctx.arc(sw/2,sh/2,50,Math.PI*.08,Math.PI*.9);ctx.stroke();ctx.globalAlpha=1}for(const e of state.effects){const p=SP(e);ctx.globalAlpha=Math.max(0,e.t);if(e.type==='damage'||e.type==='burst'){ctx.fillStyle='#fff';ctx.font=e.text==='BOSS DOWN'?'bold 14px system-ui':'bold 13px system-ui';ctx.textAlign='center';if(e.text)ctx.fillText(e.text,p.x,p.y-25-(.8-e.t)*35);ctx.beginPath();ctx.arc(p.x,p.y,4+10*(1-e.t),0,7);ctx.fill()}else{ctx.fillStyle=e.type==='hurt'?'#ff6874':e.type==='arrow'?'#b9e8ff':'#ffe19a';ctx.beginPath();ctx.arc(p.x,p.y,3+8*(1-e.t),0,7);ctx.fill()}}ctx.globalAlpha=1;if(night()){ctx.fillStyle='#020a1390';ctx.fillRect(0,0,sw,sh)}ctx.restore()}
function updateUI(){E.hp.textContent=`${Math.round(state.hp)}/${state.maxHp}`;E.hpbar.style.width=`${100*state.hp/state.maxHp}%`;E.atk.textContent=5+state.weaponBonus;E.companion.textContent=state.companion||'없음';E.phase.textContent=night()?'🌙 밤':'☀️ 낮';E.clock.textContent=`${String(Math.floor(state.time/60)%24).padStart(2,'0')}:${String(Math.floor(state.time%60)).padStart(2,'0')}`;E.day.textContent=state.day;E.wood.textContent=state.wood;E.stone.textContent=state.stone;E.fiber.textContent=state.fiber;E.meat.textContent=state.meat}
function openPanel(id){document.querySelectorAll('.panel').forEach(p=>p.style.display='none');document.getElementById(id).style.display='block';if(id==='quest')renderQuest();if(id==='comp')renderComp();if(id==='house')renderHouse();if(id==='craft')renderCraft();if(id==='inv')renderInv()}
document.getElementById('questBtn').onclick=()=>openPanel('quest');document.getElementById('eventBtn').onclick=()=>triggerEvent(true);document.getElementById('compBtn').onclick=()=>openPanel('comp');document.getElementById('houseBtn').onclick=()=>openPanel('house');document.getElementById('craftBtn').onclick=()=>openPanel('craft');document.getElementById('invBtn').onclick=()=>openPanel('inv');document.getElementById('gatherBtn').onclick=gather;document.getElementById('attackBtn').onclick=playerAttack;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.close).style.display='none');document.getElementById('restart').onclick=()=>location.reload();
function joySet(e){const r=document.getElementById('joystick').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,l=Math.hypot(dx,dy)||1,k=Math.min(1,l/(r.width*.32));jx=dx/l*k;jy=dy/l*k;document.getElementById('stick').style.transform=`translate(${jx*38}px,${jy*38}px)`}const J=document.getElementById('joystick'),ST=document.getElementById('stick');J.onpointerdown=e=>{joy=true;J.setPointerCapture(e.pointerId);joySet(e)};J.onpointermove=e=>joy&&joySet(e);function joyEnd(){joy=false;jx=jy=0;ST.style.transform=''}J.onpointerup=joyEnd;J.onpointercancel=joyEnd;
window.summon=summon;window.unsummon=unsummon;window.talk=talk;window.gift=gift;window.build=build;window.craft=craft;window.eat=eat;window.meet=meet;
try{const raw=localStorage.getItem(SAVE);if(raw){Object.assign(state,JSON.parse(raw));if(!state.flags)state.flags={유나:false,세라:false,미라:false,리아:false};if(!state.romance)state.romance={유나:0,세라:0,미라:0,리아:0};if(!Array.isArray(state.housing))state.housing=[];if(!Array.isArray(state.resources)||!state.resources.length)seed();if(!Array.isArray(state.enemies))state.enemies=[];if(!Array.isArray(state.npcs)||!state.npcs.length)seed();if(state.companion)companionObj={x:state.player.x-60,y:state.player.y+45,cd:0}}else seed()}catch(e){seed()}renderQuest();renderComp();updateUI();
function loop(t){const dt=Math.min(.035,(t-last)/1000);last=t;update(dt);draw();updateUI();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
