<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>숲의 생존자들</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08150f;color:#fff;font-family:system-ui,'Noto Sans KR',sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}.hidden{display:none!important}#ui{position:absolute;inset:0;pointer-events:none}.hud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:8px}.card{padding:8px 10px;border:1px solid #ffffff35;border-radius:13px;background:#07140ee8;box-shadow:0 4px 16px #0008;font-size:12px;font-weight:800}.bar{width:145px;height:7px;margin-top:4px;border-radius:8px;background:#ffffff25;overflow:hidden}.bar i{display:block;height:100%;background:#d94b4b}.menu{position:absolute;right:8px;top:70px;display:grid;gap:6px;pointer-events:auto}.btn{border:1px solid #ffffff35;border-radius:11px;background:#0b1b14e8;color:#fff;padding:9px 11px;font-weight:900}.attack{position:absolute;right:14px;bottom:18px;width:112px;height:64px;background:#8d302d;pointer-events:auto}.joy{position:absolute;left:16px;bottom:18px;width:128px;height:128px;border:2px solid #ffffff35;border-radius:50%;background:#ffffff10;pointer-events:auto}.stick{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:#d9ead955;border:2px solid #ffffff55}.panel{position:absolute;z-index:20;left:8px;right:8px;top:58px;bottom:8px;display:none;padding:13px;border:1px solid #ffffff35;border-radius:17px;background:#071019f8;overflow:auto;touch-action:pan-y;pointer-events:auto}.panel h2{margin:0 0 10px}.close{float:right}.item{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:7px 0;padding:10px;border-radius:12px;background:#11251c}.item small{display:block;opacity:.72}.screen{position:absolute;z-index:50;inset:0;display:grid;place-items:center;padding:18px;background:#07140f}.box{width:min(92%,500px);padding:22px;border:1px solid #ffffff30;border-radius:22px;background:#0a1913;text-align:center}.primary{border:0;border-radius:13px;padding:13px 18px;background:#397d58;color:#fff;font-weight:1000}.fx{position:absolute;z-index:40;left:50%;top:42%;font-size:24px;font-weight:1000;animation:f .7s forwards}@keyframes f{to{opacity:0;transform:translateY(-55px)}}.boss{color:#ffd66e}.assetIcon{display:inline-block;width:18px;height:18px;vertical-align:-4px;background-image:url('assets/survival-atlas.svg');background-size:144px 144px}</style></head><body><canvas id="game"></canvas><div id="ui" class="hidden"><div class="hud"><div class="card"><b id="name"></b> · 공격 <span id="atk"></span><div class="bar"><i id="hpbar"></i></div><span id="hp"></span> · 동료 <span id="companion">없음</span></div><div class="card"><span id="phase"></span> <span id="clock"></span><br><span id="day"></span>일 · 나무 <span id="wood"></span> · 돌 <span id="stone"></span> · 섬유 <span id="fiber"></span> · 고기 <span id="meat"></span></div></div><div class="menu"><button class="btn" data-open="quest">퀘스트</button><button class="btn" data-open="comp">동료</button><button class="btn" data-open="house">하우징</button><button class="btn" data-open="craft">제작</button><button class="btn" data-open="inv">가방</button><button class="btn" id="gather">채집</button></div><button class="btn attack" id="attack">공격</button><div class="joy" id="joy"><div class="stick" id="stick"></div></div></div><section class="screen" id="intro"><div class="box"><h1>숲의 생존자들</h1><p>폭풍이 몰아치던 밤, 바이브2호가 정체불명의 숲에 추락했다.<br>자원을 모으고 동료를 만나 신호탑을 완성해 탈출해.</p><button class="primary" id="start">생존 시작</button></div></section><div class="panel" id="quest"><button class="btn close">닫기</button><h2>스토리 · 퀘스트</h2><div id="questBody"></div></div><div class="panel" id="comp"><button class="btn close">닫기</button><h2>동료</h2><div id="compBody"></div></div><div class="panel" id="house"><button class="btn close">닫기</button><h2>하우징</h2><div id="houseBody"></div></div><div class="panel" id="craft"><button class="btn close">닫기</button><h2>제작</h2><div id="craftBody"></div></div><div class="panel" id="inv"><button class="btn close">닫기</button><h2>가방</h2><div id="invBody"></div></div><script>
const C=document.getElementById('game'),X=C.getContext('2d'),$=id=>document.getElementById(id),SAVE='jaewoon-survival2-v3',W=4600,H=4600;let sw=innerWidth,sh=innerHeight,dpr=1,last=performance.now(),jx=0,jy=0,joy=false,attackCd=0,gatherCd=0,shake=0;const fresh={version:3,started:false,name:'재운',hair:'#2a2020',shirt:'#466a83',day:1,time:480,hp:100,maxHp:100,wood:0,stone:0,fiber:0,meat:0,weapon:'맨손',weaponBonus:0,story:0,kills:0,boss:{alpha:false,guardian:false,core:false},flags:{유나:false,세라:false,미라:false,리아:false},companion:null,companionHp:0,romance:{유나:0,세라:0,미라:0,리아:0},housing:[],player:{x:2300,y:2300},resources:[],enemies:[],npcs:[],eventHistory:[]};let s=structuredClone(fresh);const atlas=new Image();atlas.src='assets/survival-atlas.svg';const A={player:[0,0],companion:[128,0],wolf:[256,0],boar:[384,0],guardian:[512,0],core:[640,0],hut:[768,0],campfire:[896,0],tree:[0,128],rock:[128,128],plant:[256,128],mushroom:[384,128],chest:[512,128],wall:[640,128],tower:[768,128],signal:[896,128],sword:[0,256],bow:[128,256],medkit:[256,256],meat:[384,256],wood:[512,256],stone:[640,256],fiber:[768,256],spark:[896,256]};const defs={유나:{role:'전사',atk:20},세라:{role:'궁수',atk:15},미라:{role:'의무병',atk:6},리아:{role:'탐험가',atk:10}};function sprite(k,x,y,z=90){let a=A[k]||A.spark;X.drawImage(atlas,a[0],a[1],128,128,x-z/2,y-z/2,z,z)}function resize(){dpr=Math.min(2,devicePixelRatio||1);sw=innerWidth;sh=innerHeight;C.width=sw*dpr;C.height=sh*dpr;X.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function R(a,b){return a+Math.random()*(b-a)}function D(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function night(){return s.time>=1260||s.time<360}function save(){localStorage.setItem(SAVE,JSON.stringify(s))}function load(){try{let v=localStorage.getItem(SAVE);if(v)s=Object.assign(structuredClone(fresh),JSON.parse(v))}catch(e){}}function fx(t){let e=document.createElement('div');e.className='fx';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),700)}function spawnWorld(){if(!s.resources.length){for(let i=0;i<90;i++)s.resources.push({x:R(120,W-120),y:R(120,H-120),type:['tree','rock','plant','mushroom'][i%4],alive:true});for(let i=0;i<20;i++)s.resources.push({x:R(200,W-200),y:R(200,H-200),type:'chest',alive:true})}if(!s.enemies.length){for(let i=0;i<18;i++)spawnEnemy(i%3?'wolf':'boar')}syncStory()}function spawnEnemy(type='wolf',boss=false){let hp=type==='boar'?90:60,atk=type==='boar'?14:10;if(type==='guardian'){hp=420;atk=28}if(type==='core'){hp=800;atk=38}s.enemies.push({x:clamp(s.player.x+R(-700,700),80,W-80),y:clamp(s.player.y+R(-700,700),80,H-80),type,hp,maxHp:hp,atk,cd:0,boss})}function syncStory(){if(s.day>=2&&!s.flags.유나){s.npcs.push({name:'유나',x:2450,y:2250});s.flags.유나=true}s.story=Math.max(s.story,s.day>=2?1:0);if(s.day>=3&&!s.flags.세라){s.npcs.push({name:'세라',x:1900,y:2600});s.flags.세라=true}if(s.day>=4&&!s.flags.미라){s.npcs.push({name:'미라',x:2850,y:2800});s.flags.미라=true}if(s.day>=5&&!s.flags.리아){s.npcs.push({name:'리아',x:3150,y:2100});s.flags.리아=true}if(s.day>=4&&!s.boss.alpha&&!s.enemies.some(e=>e.boss&&e.type==='guardian'))spawnEnemy('guardian',true);if(s.day>=7&&s.boss.alpha&&!s.boss.core&&!s.enemies.some(e=>e.boss&&e.type==='core'))spawnEnemy('core',true)}function nextDay(){s.day++;syncStory();save()}function update(dt){if(!s.started)return;let sp=180;s.player.x=clamp(s.player.x+jx*sp*dt,35,W-35);s.player.y=clamp(s.player.y+jy*sp*dt,35,H-35);s.time+=dt*18;if(s.time>=1440){s.time-=1440;nextDay()}attackCd=Math.max(0,attackCd-dt);gatherCd=Math.max(0,gatherCd-dt);for(const e of s.enemies){if(e.hp<=0)continue;let d=D(e,s.player),v=e.boss?52:68;if(d<600){e.x+=(s.player.x-e.x)/d*v*dt;e.y+=(s.player.y-e.y)/d*v*dt}e.cd=Math.max(0,e.cd-dt);if(d<54&&e.cd<=0){s.hp-=e.atk;e.cd=1.5;shake=8;if(s.hp<=0){s.hp=s.maxHp;s.player={x:2300,y:2300};s.meat=Math.max(0,s.meat-2);fx('쓰러짐 - 캠프로 귀환')}}}if(s.companion){let n=s.npcs.find(n=>n.name===s.companion);if(n){n.x+=(s.player.x-55-n.x)*dt*2;n.y+=(s.player.y+35-n.y)*dt*2;let target=s.enemies.filter(e=>e.hp>0).sort((a,b)=>D(a,n)-D(b,n))[0];n.cd=Math.max(0,(n.cd||0)-dt);if(target&&D(target,n)<260&&n.cd<=0){target.hp-=defs[n.name].atk;n.cd=1.2}}}s.enemies=s.enemies.filter(e=>e.hp>0||e.dead!==true);shake*=.86;hud()}function attack(){if(attackCd>0)return;attackCd=.65;let targets=s.enemies.filter(e=>e.hp>0&&D(e,s.player)<115).sort((a,b)=>D(a,s.player)-D(b,s.player));if(targets[0]){let e=targets[0],dmg=8+s.weaponBonus;e.hp-=dmg;fx('-'+dmg);if(e.hp<=0){e.dead=true;s.kills++;s.meat+=e.boss?5:1;if(e.type==='guardian'){s.boss.alpha=true;s.story=Math.max(s.story,4);fx('숲의 수호자 격파')}if(e.type==='core'){s.boss.core=true;s.story=8;fx('포식자 핵 파괴')}}}}function gather(){if(gatherCd>0)return;gatherCd=.5;let r=s.resources.filter(r=>r.alive).sort((a,b)=>D(a,s.player)-D(b,s.player))[0];if(!r||D(r,s.player)>105){fx('가까운 자원 없음');return}r.alive=false;if(r.type==='tree')s.wood+=3;if(r.type==='rock')s.stone+=2;if(r.type==='plant')s.fiber+=3;if(r.type==='mushroom'){s.meat+=1;s.hp=Math.min(s.maxHp,s.hp+8)}if(r.type==='chest'){s.wood+=4;s.stone+=3;s.fiber+=2}fx('채집 완료');setTimeout(()=>r.alive=true,20000)}function hud(){let h=Math.floor(s.time/60)%24,m=Math.floor(s.time%60);$('name').textContent=s.name;$('atk').textContent=8+s.weaponBonus;$('hp').textContent=`${Math.ceil(s.hp)}/${s.maxHp}`;$('hpbar').style.width=(s.hp/s.maxHp*100)+'%';$('companion').textContent=s.companion||'없음';$('phase').textContent=night()?'밤':'낮';$('clock').textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;$('day').textContent=s.day;$('wood').textContent=s.wood;$('stone').textContent=s.stone;$('fiber').textContent=s.fiber;$('meat').textContent=s.meat}function world(){let ox=sw/2-s.player.x+(Math.random()-.5)*shake,oy=sh/2-s.player.y+(Math.random()-.5)*shake;X.save();X.translate(ox,oy);let grd=X.createLinearGradient(0,0,0,H);grd.addColorStop(0,'#244f38');grd.addColorStop(1,'#102d25');X.fillStyle=grd;X.fillRect(0,0,W,H);for(let x=0;x<W;x+=220)for(let y=0;y<H;y+=220){X.globalAlpha=.13;sprite('plant',x+70,y+80,90)}X.globalAlpha=1;for(const r of s.resources)if(r.alive&&Math.abs(r.x-s.player.x)<sw&&Math.abs(r.y-s.player.y)<sh)sprite(r.type,r.x,r.y,r.type==='tree'?120:80);for(const b of s.housing){let k=b.type==='오두막'?'hut':b.type==='모닥불'?'campfire':b.type==='벽'?'wall':b.type==='감시탑'?'tower':'signal';sprite(k,b.x,b.y,120)}for(const n of s.npcs){sprite('companion',n.x,n.y,82);X.fillStyle='#fff';X.font='bold 12px sans-serif';X.textAlign='center';X.fillText(n.name,n.x,n.y-50)}for(const e of s.enemies)if(e.hp>0){sprite(e.type,e.x,e.y,e.boss?135:92);X.fillStyle='#241b1b';X.fillRect(e.x-35,e.y-58,70,6);X.fillStyle='#d74c4c';X.fillRect(e.x-35,e.y-58,70*e.hp/e.maxHp,6);if(e.boss){X.fillStyle='#ffd66e';X.font='bold 11px sans-serif';X.textAlign='center';X.fillText('BOSS',e.x,e.y-67)}}sprite('player',s.player.x,s.player.y,88);if(s.weapon!=='맨손')sprite(s.weapon.includes('활')?'bow':'sword',s.player.x+34,s.player.y+12,45);X.restore();if(night()){X.fillStyle='#03101a99';X.fillRect(0,0,sw,sh);let g=X.createRadialGradient(sw/2,sh/2,35,sw/2,sh/2,190);g.addColorStop(0,'#ffd98144');g.addColorStop(1,'#0000');X.fillStyle=g;X.fillRect(0,0,sw,sh)}}function loop(t){let dt=Math.min(.033,(t-last)/1000);last=t;update(dt);X.clearRect(0,0,sw,sh);world();requestAnimationFrame(loop)}function item(title,desc,fn,label='실행'){return `<div class="item"><div><b>${title}</b><small>${desc}</small></div><button class="btn" onclick="${fn}">${label}</button></div>`}function openPanel(id){document.querySelectorAll('.panel').forEach(p=>p.style.display='none');$(id).style.display='block';renderPanels()}function renderPanels(){$('questBody').innerHTML=`<div class="item"><div><b>현재 목표</b><small>${s.boss.core?'신호탑을 완성해 귀환 준비':'자원 수집 → 동료 구조 → 수호자 격파 → 포식자 핵 파괴'}</small></div></div><div class="item"><div><b>진행도</b><small>${s.story}/8 · 처치 ${s.kills}</small></div></div>`;$('compBody').innerHTML=s.npcs.map(n=>item(n.name,defs[n.name].role+` · 호감 ${s.romance[n.name]||0}`,`chooseComp('${n.name}')`,s.companion===n.name?'동행 중':'동행')).join('')||'아직 만난 동료가 없어.';$('houseBody').innerHTML=[['모닥불',5,2],['오두막',12,5],['벽',4,1],['감시탑',10,7],['신호탑',25,15]].map(v=>item(v[0],`나무 ${v[1]} · 돌 ${v[2]}`,`build('${v[0]}',${v[1]},${v[2]})`,'건설')).join('');$('craftBody').innerHTML=item('돌칼','돌 4 · 나무 2 / 공격 +8',"craft('돌칼',2,4,0,8)",'제작')+item('사냥활','나무 6 · 섬유 5 / 공격 +12',"craft('사냥활',6,0,5,12)",'제작')+item('응급 붕대','섬유 3 / 체력 35 회복',"heal()",'사용');$('invBody').innerHTML=`<div class="item"><div><b>${s.weapon}</b><small>무기 보너스 +${s.weaponBonus}</small></div></div><div class="item"><div><b>보유 자원</b><small>나무 ${s.wood}, 돌 ${s.stone}, 섬유 ${s.fiber}, 고기 ${s.meat}</small></div></div>`}window.chooseComp=n=>{s.companion=n;s.romance[n]=(s.romance[n]||0)+1;renderPanels();save()};window.build=(type,w,st)=>{if(s.wood<w||s.stone<st)return fx('재료 부족');if(type==='신호탑'&&!s.boss.core)return fx('포식자 핵을 먼저 파괴');s.wood-=w;s.stone-=st;s.housing.push({type,x:s.player.x+R(-120,120),y:s.player.y+R(-120,120)});if(type==='신호탑'){s.story=9;fx('신호 송출 성공')}renderPanels();save()};window.craft=(name,w,st,f,b)=>{if(s.wood<w||s.stone<st||s.fiber<f)return fx('재료 부족');s.wood-=w;s.stone-=st;s.fiber-=f;s.weapon=name;s.weaponBonus=b;renderPanels();save()};window.heal=()=>{if(s.fiber<3)return fx('섬유 부족');s.fiber-=3;s.hp=Math.min(s.maxHp,s.hp+35);renderPanels()};document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openPanel(b.dataset.open));document.querySelectorAll('.close').forEach(b=>b.onclick=()=>b.parentElement.style.display='none');$('attack').onclick=attack;$('gather').onclick=gather;const joyEl=$('joy'),stick=$('stick');function jp(e){joy=true;jm(e)}function jm(e){if(!joy)return;let p=e.touches?e.touches[0]:e,r=joyEl.getBoundingClientRect(),x=p.clientX-(r.left+r.width/2),y=p.clientY-(r.top+r.height/2),m=Math.hypot(x,y)||1,q=Math.min(42,m);jx=x/m;jy=y/m;stick.style.transform=`translate(${jx*q}px,${jy*q}px)`}function ju(){joy=false;jx=jy=0;stick.style.transform=''}joyEl.addEventListener('pointerdown',jp);addEventListener('pointermove',jm);addEventListener('pointerup',ju);joyEl.addEventListener('touchstart',jp,{passive:false});addEventListener('touchmove',jm,{passive:false});addEventListener('touchend',ju);$('start').onclick=()=>{load();s.started=true;spawnWorld();$('intro').classList.add('hidden');$('ui').classList.remove('hidden');hud();save()};load();if(s.started){spawnWorld();$('intro').classList.add('hidden');$('ui').classList.remove('hidden')}requestAnimationFrame(loop);
</script></body></html>
