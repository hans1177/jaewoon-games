<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>숲의 생존자들</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08120f;color:#fff;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;touch-action:none}button,input{font:inherit}#app{position:relative;width:100%;height:100%;overflow:hidden}canvas{display:block;width:100%;height:100%}.hidden{display:none!important}.screen{position:absolute;inset:0;z-index:100;background:radial-gradient(circle at 50% 35%,#224d44,#07120f 68%);display:grid;place-items:center;padding:18px}.box{width:min(92%,520px);max-height:92vh;overflow:auto;padding:22px;border:1px solid #ffffff2d;border-radius:24px;background:#071019ee;box-shadow:0 24px 70px #000b;text-align:center}.box h1{margin:0 0 8px;font-size:32px}.box p{line-height:1.65;color:#dcebe6}.storyline{min-height:180px;display:grid;place-items:center;padding:18px;border:1px solid #ffffff18;border-radius:18px;background:linear-gradient(160deg,#16352f,#0a1719)}.storyline .big{font-size:34px;font-weight:1000}.primary{border:0;border-radius:13px;padding:12px 16px;font-weight:1000;background:linear-gradient(135deg,#6f4bd7,#318fe6);color:#fff}.field{display:grid;gap:8px;text-align:left;margin:12px 0}.field label{font-size:12px;font-weight:900;color:#9bc8bd}.field input{width:100%;height:46px;padding:0 12px;border:1px solid #ffffff1f;border-radius:12px;background:#0b1518;color:#fff;outline:none}.swatches{display:flex;gap:8px;flex-wrap:wrap}.swatches button{width:46px;height:46px;border:2px solid #ffffff22;border-radius:50%}.swatches button.active{border-color:#ffe28b;box-shadow:0 0 0 3px #ffe28b33}.charPreview{height:160px;display:grid;place-items:center;margin:12px 0;border-radius:18px;background:linear-gradient(160deg,#18362d,#0e1d24)}.hud{position:absolute;z-index:5;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.card{min-width:148px;padding:8px 10px;border:1px solid #fff3;border-radius:13px;background:#06110de8;box-shadow:0 5px 18px #0007;backdrop-filter:blur(5px);font-size:12px;font-weight:900;line-height:1.45}.bar{height:7px;margin-top:4px;border-radius:8px;background:#ffffff24;overflow:hidden}.bar i{display:block;height:100%;background:#e64b4b;width:100%}.small{font-size:10px;opacity:.84}.menu{position:absolute;z-index:8;right:8px;top:66px;display:grid;gap:6px}.btn{min-width:92px;border:1px solid #fff3;border-radius:11px;background:#09150fe8;color:#fff;padding:9px 10px;font-size:11px;font-weight:900;box-shadow:0 4px 12px #0004}.attack{position:absolute;z-index:9;right:11px;bottom:19px;min-width:114px;min-height:64px;background:#8f302c}.joystick{position:absolute;z-index:9;left:16px;bottom:18px;width:130px;height:130px;border:2px solid #ffffff22;border-radius:50%;background:#ffffff0e}.stick{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border:2px solid #fff3;border-radius:50%;background:#d9ead950}.hint{position:absolute;z-index:4;left:50%;bottom:8px;transform:translateX(-50%);padding:6px 9px;border-radius:10px;background:#06100eb0;font-size:10px;font-weight:800;white-space:nowrap}.panel{position:absolute;z-index:30;left:8px;right:8px;top:60px;bottom:8px;display:none;padding:12px;border:1px solid #ffffff32;border-radius:17px;background:#071019f8;overflow:auto;touch-action:pan-y}.panel h2{margin:0 0 10px;font-size:19px}.close{float:right;border:0;border-radius:9px;background:#ffffff15;color:#fff;padding:7px 9px;font-weight:900}.item{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:7px 0;padding:10px;border:1px solid #ffffff10;border-radius:12px;background:#11252b}.item small{display:block;margin-top:3px;opacity:.74;font-size:10px}.item button{border:0;border-radius:9px;background:#2e9464;color:#fff;padding:8px 10px;font-weight:900}.story{padding:12px;border:1px solid #ffffff18;border-radius:14px;background:linear-gradient(145deg,#152c31,#0c1a22);margin-bottom:10px}.story h3{margin:6px 0}.story b{color:#ffd778}.quest{padding:9px;border-radius:11px;background:#10262d;margin:7px 0}.heart{color:#ff83ac}.buildgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.buildgrid button{min-height:54px}.event{position:absolute;z-index:45;left:50%;top:50%;width:min(92%,380px);transform:translate(-50%,-50%);padding:16px;border:1px solid #fff3;border-radius:18px;background:#071019f7;box-shadow:0 18px 55px #000b}.event h3{margin:0 0 8px}.event p{margin:6px 0;line-height:1.55;font-size:13px}.event button{width:100%;margin-top:7px;border:0;border-radius:11px;padding:11px;background:#2d8f63;color:#fff;font-weight:900}.boss{color:#ffd66e;font-size:10px;font-weight:900}.fx{position:absolute;z-index:20;left:50%;top:50%;pointer-events:none;white-space:nowrap;font-size:26px;font-weight:1000;text-shadow:0 3px 10px #000;animation:floatFx .7s ease-out forwards}@keyframes floatFx{from{opacity:1;transform:translate(-50%,0) scale(1)}to{opacity:0;transform:translate(-50%,-64px) scale(1.12)}}</style></head><body><div id="app"><canvas id="game"></canvas><section class="screen" id="intro"><div class="box"><div class="storyline"><div><div class="big" id="introTitle">바이브2호</div><p id="introText">폭풍이 몰아치던 밤, 바이브2호가 정체불명의 숲에 추락했다.</p></div></div><button class="primary" id="introNext">계속</button></div></section><section class="screen hidden" id="create"><div class="box"><h1>생존자 생성</h1><p>숲에서 살아남을 성인 생존자의 이름과 모습을 정해.</p><div class="charPreview"><canvas id="preview" width="160" height="160"></canvas></div><div class="field"><label>이름</label><input id="nameInput" maxlength="10" value="재운"></div><div class="field"><label>머리</label><div class="swatches" id="hairPick"></div></div><div class="field"><label>복장</label><div class="swatches" id="shirtPick"></div></div><button class="primary" id="startGame">이 캐릭터로 시작</button></div></section><div id="gameUI" class="hidden"><div class="hud"><div class="card">❤️ <span id="hp"></span><div class="bar"><i id="hpbar"></i></div><span class="small">⚔️ <span id="atk"></span> · 👤 <span id="playerName"></span> · 👩 <span id="companion"></span></span></div><div class="card"><span id="phase"></span> · <span id="clock"></span><br><span class="small">📅 <span id="day"></span>일 · 🪵<span id="wood"></span> 🪨<span id="stone"></span> 🌿<span id="fiber"></span> 🍖<span id="meat"></span></span></div></div><div class="menu"><button class="btn" id="questBtn">📖 퀘스트</button><button class="btn" id="eventBtn">✨ 이벤트</button><button class="btn" id="compBtn">👩 동료</button><button class="btn" id="houseBtn">🏠 하우징</button><button class="btn" id="craftBtn">🛠 제작</button><button class="btn" id="invBtn">🎒 가방</button><button class="btn" id="gatherBtn">✋ 채집</button></div><button class="btn attack" id="attackBtn">⚔️ 공격</button><div class="joystick" id="joystick"><div class="stick" id="stick"></div></div><div class="hint">탐험 → 이벤트 → 동료 → 하우징 → 보스</div></div><div class="panel" id="quest"><button class="close" data-close="quest">닫기</button><h2>📖 스토리 · 퀘스트</h2><div id="questBody"></div></div><div class="panel" id="comp"><button class="close" data-close="comp">닫기</button><h2>👩 여성 동료</h2><div id="compBody"></div></div><div class="panel" id="house"><button class="close" data-close="house">닫기</button><h2>🏠 하우징</h2><p class="small">건물은 즉시 월드에 보이지만 저장은 날짜 변경 때만 이루어져.</p><div id="houseBody"></div></div><div class="panel" id="craft"><button class="close" data-close="craft">닫기</button><h2>🛠 제작</h2><div id="craftBody"></div></div><div class="panel" id="inv"><button class="close" data-close="inv">닫기</button><h2>🎒 가방</h2><div id="invBody"></div></div><div class="event hidden" id="event"><h3 id="eventTitle"></h3><p id="eventText"></p><div id="eventChoices"></div></div><div class="dead hidden" id="dead"><div class="deadcard"><h2>생존 실패</h2><p id="deadText"></p><button id="restart" class="primary">새 게임</button></div></div></div><script>

// 메인: 인트로/캐릭터 생성/생존/하우징/성인 여성 동료/연애/이벤트/퀘스트/보스/전투 연출/날짜 변경 저장
const C=document.getElementById('game'),ctx=C.getContext('2d'),P=document.getElementById('preview'),pc=P.getContext('2d');const $=id=>document.getElementById(id);const E={hp:$('hp'),hpbar:$('hpbar'),atk:$('atk'),playerName:$('playerName'),companion:$('companion'),phase:$('phase'),clock:$('clock'),day:$('day'),wood:$('wood'),stone:$('stone'),fiber:$('fiber'),meat:$('meat'),quest:$('questBody'),comp:$('compBody'),house:$('houseBody'),craft:$('craftBody'),inv:$('invBody'),event:$('event'),eventTitle:$('eventTitle'),eventText:$('eventText'),eventChoices:$('eventChoices'),dead:$('dead'),deadText:$('deadText')};const SAVE='jaewoon-survival2-v3',W=4600,H=4600;let sw=innerWidth,sh=innerHeight,dpr=1,last=performance.now(),jx=0,jy=0,joy=false,attackCd=0,gatherCd=0,attackAnim=0,shake=0,eventDay=-1;const hair=['#2a2020','#59392b','#6b4028','#3e4a5b'],shirt=['#466a83','#8d574d','#6d8c61','#8b6c9b'];let createHair=0,createShirt=0;const defs={유나:{role:'전사',hp:120,atk:20,speed:88,r:18,shirt:'#b98572',hair:'#352127',line:'네 뒤는 내가 막을게.'},세라:{role:'궁수',hp:78,atk:15,speed:98,r:16,shirt:'#8fa7ca',hair:'#6b4028',line:'멀리서 길을 열어줄게.'},미라:{role:'의무병',hp:90,atk:6,speed:80,r:16,shirt:'#92b989',hair:'#59392b',line:'다치면 바로 말해.'},리아:{role:'탐험가',hp:95,atk:10,speed:94,r:17,shirt:'#c4a16b',hair:'#493324',line:'이 숲은 우리가 생각하는 것보다 커.'}};const fresh={version:3,started:false,name:'',hair:'#2a2020',shirt:'#466a83',day:1,time:480,hp:100,maxHp:100,wood:0,stone:0,fiber:0,meat:0,weapon:'맨손',weaponBonus:0,story:0,kills:0,boss:{alpha:false,guardian:false,core:false},flags:{유나:false,세라:false,미라:false,리아:false},companion:null,companionHp:0,romance:{유나:0,세라:0,미라:0,리아:0},housing:[],player:{x:2300,y:2300},resources:[],enemies:[],npcs:[],eventHistory:[]};let state=structuredClone(fresh),compObj={x:2240,y:2360,cd:0,hurt:0};function resize(){dpr=Math.min(2,devicePixelRatio||1);sw=innerWidth;sh=innerHeight;C.width=sw*dpr;C.height=sh*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);P.width=160*dpr;P.height=160*dpr;pc.setTransform(dpr,0,0,dpr,0,0);drawPreview()}addEventListener('resize',resize);resize();function R(a,b){return a+Math.random()*(b-a)}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function D(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function night(){return state.time>=1260||state.time<360}function showFx(text,col='#ffe17a'){const f=document.createElement('div');f.className='fx';f.textContent=text;f.style.color=col;document.body.appendChild(f);setTimeout(()=>f.remove(),700)}function saveAtDayChange(){try{localStorage.setItem(SAVE,JSON.stringify(state))}catch(e){}}function migrate(){try{const n=localStorage.getItem(SAVE);if(n){state=Object.assign(structuredClone(fresh),JSON.parse(n));return true}const o=localStorage.getItem('jaewoon-survival2-v2');if(o){const a=JSON.parse(o);state=Object.assign(structuredClone(fresh),{day:a.day||1,time:a.time||480,hp:a.hp||100,maxHp:a.maxHp||100,wood:a.wood||0,stone:a.stone||0,fiber:a.fiber||0,meat:a.meat||0,weapon:a.weapon||'맨손',weaponBonus:a.weaponBonus||0,story:a.story||0,player:a.player||fresh.player});return true}}catch(e){}return false}function seed(){state.resources=[];state.enemies=[];state.npcs=[{type:'유나',x:2570,y:2170,met:false},{type:'세라',x:3480,y:2420,met:false},{type:'미라',x:1580,y:3100,met:false},{type:'리아',x:3080,y:3400,met:false}];for(let i=0;i<100;i++)spawnRes(['tree','tree','tree','stone','stone','fiber','berry'][i%7]);for(let i=0;i<8;i++)spawnEnemy(['늑대','멧돼지','거미'][i%3])}function spawnRes(type){const a=R(0,Math.PI*2),d=R(220,1850);state.resources.push({type,x:clamp(state.player.x+Math.cos(a)*d,80,W-80),y:clamp(state.player.y+Math.sin(a)*d,80,H-80),n:type==='tree'?4:type==='stone'?3:4})}function spawnEnemy(kind,boss=false){const a=R(0,Math.PI*2),d=R(boss?1100:650,boss?1850:1700),v={늑대:[60,10,65,18],멧돼지:[95,14,45,22],거미:[45,8,72,16],숲의알파:[450,30,50,38],연구소수호자:[800,40,38,46],숲의핵:[1400,58,30,52]}[kind];state.enemies.push({kind,boss,x:clamp(state.player.x+Math.cos(a)*d,60,W-60),y:clamp(state.player.y+Math.sin(a)*d,60,H-60),hp:v[0],maxHp:v[0],atk:v[1],speed:v[2],r:v[3],cd:R(.2,1.2),agg:boss,hurt:0})}function activeCount(){return Object.values(state.flags).filter(Boolean).length}function npcMeet(){for(const n of state.npcs||[]){if(n.met)continue;if(D(state.player,n)<95){meet(n.type);return}}}function meet(type){if(state.companion&&state.companion!==type){toast(`${state.companion}를 먼저 해제해`);return}const n=state.npcs.find(v=>v.type===type);if(!n||n.met)return;n.met=true;state.flags[type]=true;state.companion=type;state.companionHp=defs[type].hp;state.romance[type]=10;compObj={x:n.x-45,y:n.y+55,cd:0,hurt:0};toast(`${type} 합류 · ${defs[type].line}`);if(type==='유나')state.story=Math.max(state.story,2);else if(activeCount()>=4)state.story=Math.max(state.story,4);renderQuest();renderComp()}function summon(type){if(!state.flags[type]){toast('아직 영입하지 않았어');return}state.companion=type;state.companionHp=Math.max(1,state.companionHp||defs[type].hp);compObj={x:state.player.x-55,y:state.player.y+55,cd:0,hurt:0};toast(`${type} 소환`);renderComp()}function unsummon(){if(!state.companion)return;toast(`${state.companion} 해제`);state.companion=null;renderComp()}function romance(type,kind){if(!state.flags[type])return;if(kind==='talk')state.romance[type]=clamp((state.romance[type]||0)+4,0,100);if(kind==='gift'){if(state.meat<2){toast('선물용 먹이 2개가 필요해');return}state.meat-=2;state.romance[type]=clamp((state.romance[type]||0)+8,0,100)}toast(`${type} 호감도 ${state.romance[type]||0}`);renderComp();updateUI()}function questText(){const f=activeCount();if(state.story===0)return `<div class="story"><span class="badge">제1장 · 추락</span><h3>바이브2호 생존기</h3><p>미지의 숲에 추락했어. 가장 먼저 작은 거점부터 만들어야 해.</p></div><div class="quest">나무 ${Math.min(6,state.wood)}/6 · 돌 ${Math.min(4,state.stone)}/4 · 야영지 ${state.housing.some(b=>b.type==='야영지')?'완료':'필요'}</div>`;if(state.story===1)return `<div class="story"><span class="badge">제2장 · 사람의 흔적</span><h3>첫 생존자</h3><p>숲에서 유나를 찾아 동료로 영입해.</p></div>`;if(state.story===2)return `<div class="story"><span class="badge">제3장 · 검은 숲</span><h3>숲의 알파</h3><p>적을 처치하고 숲의 알파를 쓰러뜨려.</p></div><div class="quest">일반 적 ${Math.min(6,state.kills)}/6 · 알파 ${state.boss.alpha?'토벌 완료':'대기'}</div>`;if(state.story===3)return `<div class="story"><span class="badge">제4장 · 생존자들</span><h3>흩어진 사람들</h3><p>다른 여성 생존자들을 찾아 영입해.</p></div><div class="quest">영입 ${f}/4 · 동료방 ${state.housing.filter(b=>b.type==='동료방').length}/2</div>`;if(state.story===4)return `<div class="story"><span class="badge">제5장 · 연구소</span><h3>숲 아래의 비밀</h3><p>연구소 수호자를 토벌해.</p></div>`;return `<div class="story"><span class="badge">최종장 · 귀환</span><h3>숲의 핵</h3><p>숲의 핵을 파괴하고 구조 신호를 보내.</p></div>`}function renderQuest(){E.quest.innerHTML=questText()}function renderComp(){const names=['유나','세라','미라','리아'];E.comp.innerHTML=names.map(t=>{const m=defs[t],v=state.romance[t]||0,ok=state.flags[t];return `<div class="item"><span><b>${t}</b><small>${ok?m.role+' · HP '+m.hp+' · 공격 '+m.atk:'미영입'}<br><span class="heart">♥ 호감도 ${v}/100</span></small></span><div>${ok?`<button onclick="summon('${t}')">${state.companion===t?'소환중':'소환'}</button><button onclick="romance('${t}','talk')">대화</button><button onclick="romance('${t}','gift')">선물</button>`:'스토리에서 만나기'}</div></div>`}).join('')+`<div class="item"><span><b>현재 소환</b><small>${state.companion||'없음'} · 한 번에 1명</small></span><button onclick="unsummon()">해제</button></div>`}const structures=[['야영지',6,'wood'],['벽',5,'wood'],['침대',8,'wood'],['작업대',10,'wood'],['동료방',14,'wood'],['창고',12,'wood']];function renderHouse(){E.house.innerHTML=`<div class="buildgrid">${structures.map(([n,c,k])=>`<button class="btn" onclick="build('${n}',${c},'${k}')">🏠 ${n}<br><span class="small">🪵 ${c}</span></button>`).join('')}</div><div class="quest">건물 ${state.housing.length}개 · 동료방 ${state.housing.filter(b=>b.type==='동료방').length}개</div>`}function build(type,cost,k){if(state[k]<cost){toast('자원이 부족해');return}state[k]-=cost;const a=R(0,Math.PI*2),d=R(55,105);state.housing.push({type,x:state.player.x+Math.cos(a)*d,y:state.player .y-42)}for(const e of state.enemies){const q=worldToScreen(e.x,e.y);enemy(e,q);ctx.fillStyle='#0009';ctx.fillRect(q.x-24,q.y-e.r-15,48,5);ctx.fillStyle='#e84c4c';ctx.fillRect(q.x-24,q.y-e.r-15,48*Math.max(0,e.hp/e.maxHp),5);if(e.boss){ctx.fillStyle='#ffd66e';ctx.font='10px system-ui';ctx.textAlign='center';ctx.fillText(e.kind,q.x,q.y-e.r-23)}}if(state.companion){const m=defs[state.companion],q=worldToScreen(compObj.x,compObj.y);human({...compObj,x:q.x,y:q.y},'#e4b79b',m.hair,m.shirt,false);ctx.fillStyle='#ffd1e3';ctx.font='10px system-ui';ctx.textAlign='center';ctx.fillText(`${state.companion} ♥${state.romance[state.companion]||0}`,q.x,q.y-44);ctx.fillStyle='#0009';ctx.fillRect(q.x-22,q.y-34,44,5);ctx.fillStyle='#65d383';ctx.fillRect(q.x-22,q.y-34,44*(state.companionHp/m.hp),5)}human({x:sw/2,y:sh/2},'#dcb095',state.hair,state.shirt,attackAnim>0);attackAnim=Math.max(0,attackAnim-.016);if(night()){ctx.fillStyle='#020b1399';ctx.fillRect(0,0,sw,sh)}}function updateUI(){E.hp.textContent=`${Math.round(state.hp)}/${state.maxHp}`;E.hpbar.style.width=`${state.hp/state.maxHp*100}%`;E.atk.textContent=5+state.weaponBonus;E.playerName.textContent=state.name;E.companion.textContent=state.companion||'없음';E.phase.textContent=night()?'🌙 밤':'☀️ 낮';const hh=Math.floor(state.time/60)%24,mm=Math.floor(state.time%60);E.clock.textContent=`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;E.day.textContent=state.day;E.wood.textContent=state.wood;E.stone.textContent=state.stone;E.fiber.textContent=state.fiber;E.meat.textContent=state.meat}function toast(t){showFx(t,'#fff')}function drawPreview(){pc.clearRect(0,0,160,160);pc.fillStyle='#15322b';pc.fillRect(0,0,160,160);pc.save();pc.translate(80,95);pc.fillStyle='#0005';pc.beginPath();pc.ellipse(0,26,30,10,0,0,7);pc.fill();pc.fillStyle='#dcb095';pc.beginPath();pc.arc(0,-20,20,0,7);pc.fill();pc.fillStyle=hair[createHair];pc.beginPath();pc.arc(0,-27,21,Math.PI,Math.PI*2);pc.fill();pc.fillStyle=shirt[createShirt];pc.fillRect(-20,-3,40,40);pc.fillStyle='#232323';pc.fillRect(-14,36,10,18);pc.fillRect(4,36,10,18);pc.fillStyle='#fff';pc.fillRect(-9,-21,4,4);pc.fillRect(5,-21,4,4);pc.restore()}const introPages=[['바이브2호','폭풍이 몰아치던 밤, 바이브2호가 정체불명의 숲에 추락했다.'],['낯선 숲','구조 신호는 끊겼고, 해가 지면 숲은 완전히 다른 곳이 된다.'],['살아남아야 한다','집을 짓고, 생존자들을 만나고, 숲의 비밀을 밝혀서 탈출하자.']];let ip=0;$('introNext').onclick=()=>{ip++;if(ip<introPages.length){$('introTitle').textContent=introPages[ip][0];$('introText').textContent=introPages[ip][1]}else{$('intro').classList.add('hidden');$('create').classList.remove('hidden');drawPreview()}};function swatchRender(){const hp=$('hairPick'),sp=$('shirtPick');hp.innerHTML=hair.map((c,i)=>`<button class="${i===createHair?'active':''}" style="background:${c}" data-h="${i}"></button>`).join('');sp.innerHTML=shirt.map((c,i)=>`<button class="${i===createShirt?'active':''}" style="background:${c}" data-s="${i}"></button>`).join('');hp.querySelectorAll('button').forEach(b=>b.onclick=()=>{createHair=+b.dataset.h;swatchRender();drawPreview()});sp.querySelectorAll('button').forEach(b=>b.onclick=()=>{createShirt=+b.dataset.s;swatchRender();drawPreview()})}swatchRender();$('startGame').onclick=()=>{const name=$('nameInput').value.trim();if(!name){$('nameInput').focus();return}state=structuredClone(fresh);state.started=true;state.name=name.slice(0,10);state.hair=hair[createHair];state.shirt=shirt[createShirt];seed();$('create').classList.add('hidden');$('gameUI').classList.remove('hidden');renderQuest();renderComp();renderHouse();renderCraft();renderInv();updateUI()};$('questBtn').onclick=()=>open('quest');$('eventBtn').onclick=()=>{if(state.day<2)toast('조금 더 생존하면 이벤트가 열려');else dailyEvents()};$('compBtn').onclick=()=>open('comp');$('houseBtn').onclick=()=>open('house');$('craftBtn').onclick=()=>open('craft');$('invBtn').onclick=()=>open('inv');$('gatherBtn').onclick=gather;$('attackBtn').onclick=attack;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).style.display='none');$('restart').onclick=()=>location.reload();function setJoy(e){const r=$('joystick').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,len=Math.hypot(dx,dy)||1,k=Math.min(1,len/(r.width*.34));jx=dx/len*k;jy=dy/len*k;$('stick').style.transform=`translate(${jx*38}px,${jy*38}px)`}const J=$('joystick');J.addEventListener('pointerdown',e=>{joy=true;J.setPointerCapture(e.pointerId);setJoy(e)});J.addEventListener('pointermove',e=>joy&&setJoy(e));function endJoy(){joy=false;jx=jy=0;$('stick').style.transform=''}J.addEventListener('pointerup',endJoy);J.addEventListener('pointercancel',endJoy);window.summon=summon;window.unsummon=unsummon;window.romance=romance;window.build=build;window.craft=craft;window.eat=eat;function init(){const loaded=migrate();if(loaded&&state.started){$('intro').classList.add('hidden');$('create').classList.add('hidden');$('gameUI').classList.remove('hidden');if(!state.resources.length)seed();renderQuest();renderComp();renderHouse();renderCraft();renderInv();updateUI()}else{state=structuredClone(fresh);seed()}requestAnimationFrame(loop)}function loop(t){const dt=Math.min(.035,(t-last)/1000);last=t;if(!$('gameUI').classList.contains('hidden')){update(dt);draw();updateUI()}else drawPreview();requestAnimationFrame(loop)}init();</script></body></html>
