<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>숲의 생존자들</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09120f;color:#fff;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;touch-action:none}#app{position:relative;width:100%;height:100%;overflow:hidden}canvas{display:block;width:100%;height:100%}
.hud{position:absolute;z-index:5;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.card{min-width:145px;padding:8px 10px;border:1px solid #fff3;border-radius:13px;background:#06110de0;box-shadow:0 5px 18px #0007;backdrop-filter:blur(5px);font-size:12px;font-weight:900;line-height:1.45}.small{font-size:10px;opacity:.84}.bar{height:7px;margin-top:4px;border-radius:8px;background:#ffffff24;overflow:hidden}.bar i{display:block;height:100%;background:#e94a4a;width:100%}.menu{position:absolute;z-index:8;right:8px;top:66px;display:grid;gap:6px}.btn{min-width:90px;border:1px solid #fff3;border-radius:11px;background:#09150fe8;color:#fff;padding:9px 10px;font-size:11px;font-weight:900;box-shadow:0 4px 12px #0004}.btn:active{transform:scale(.97)}.attack{position:absolute;z-index:9;right:11px;bottom:19px;min-width:112px;min-height:62px;background:#8b302b}.joystick{position:absolute;z-index:9;left:16px;bottom:18px;width:130px;height:130px;border:2px solid #ffffff22;border-radius:50%;background:#ffffff0d;box-shadow:inset 0 0 24px #0005}.stick{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border:2px solid #fff3;border-radius:50%;background:#d9ead950}.hint{position:absolute;z-index:4;left:50%;bottom:9px;transform:translateX(-50%);padding:6px 9px;border-radius:10px;background:#06100eb0;font-size:10px;font-weight:800;white-space:nowrap}.panel{position:absolute;z-index:30;left:8px;right:8px;top:60px;bottom:8px;display:none;padding:12px;border:1px solid #ffffff32;border-radius:17px;background:#071019f8;overflow:auto;touch-action:pan-y;box-shadow:0 12px 35px #0009}.panel h2{margin:0 0 10px;font-size:19px}.close{float:right;border:0;border-radius:9px;background:#ffffff15;color:#fff;padding:7px 9px;font-weight:900}.item{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:7px 0;padding:10px;border:1px solid #ffffff10;border-radius:12px;background:#11252b}.item small{display:block;margin-top:3px;opacity:.74;font-size:10px}.item button,.choice button{border:0;border-radius:9px;background:#2e9464;color:#fff;padding:8px 10px;font-weight:900}.story{padding:12px;border:1px solid #ffffff18;border-radius:14px;background:linear-gradient(145deg,#152c31,#0c1a22);margin-bottom:10px}.story h3{margin:6px 0}.story b{color:#ffd778}.badge{display:inline-block;padding:4px 7px;border-radius:999px;background:#183d48;color:#8fe6ff;font-size:9px;font-weight:900}.quest{padding:9px;border-radius:11px;background:#10262d;margin:7px 0}.choice{display:grid;gap:7px;margin-top:9px}.choice button{text-align:left;background:#245b6b}.heart{color:#ff83ac}.buildgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.buildgrid button{min-height:54px}.event{position:absolute;z-index:45;left:50%;top:50%;width:min(92%,380px);transform:translate(-50%,-50%);display:none;padding:16px;border:1px solid #fff3;border-radius:18px;background:#071019f7;box-shadow:0 18px 55px #000b}.event h3{margin:0 0 8px}.event p{margin:6px 0;line-height:1.55;font-size:13px}.event button{width:100%;margin-top:7px;border:0;border-radius:11px;padding:11px;background:#2d8f63;color:#fff;font-weight:900}.boss{font-size:11px;color:#ffd66e;font-weight:900}.dead{position:absolute;z-index:50;inset:0;display:none;place-items:center;background:#000b}.deadcard{width:min(90%,360px);padding:20px;border:1px solid #fff3;border-radius:18px;background:#08121af5;text-align:center}.deadcard button{border:0;border-radius:11px;background:#33865f;color:#fff;padding:10px 15px;font-weight:900}
</style>
</head>
<body><div id="app"><canvas id="game"></canvas>
<div class="hud"><div class="card">❤️ <span id="hp"></span><div class="bar"><i id="hpbar"></i></div><span class="small">⚔️ 공격 <span id="atk"></span> · 👩 동료 <span id="companion"></span></span></div><div class="card"><span id="phase"></span> · <span id="clock"></span><br><span class="small">📅 <span id="day"></span>일 · 🪵<span id="wood"></span> 🪨<span id="stone"></span> 🌿<span id="fiber"></span> 🍖<span id="meat"></span></span></div></div>
<div class="menu"><button class="btn" id="questBtn">📖 퀘스트</button><button class="btn" id="eventBtn">✨ 이벤트</button><button class="btn" id="compBtn">👩 동료</button><button class="btn" id="houseBtn">🏠 하우징</button><button class="btn" id="craftBtn">🛠 제작</button><button class="btn" id="invBtn">🎒 가방</button><button class="btn" id="gatherBtn">✋ 채집</button></div>
<button class="btn attack" id="attackBtn">⚔️ 공격</button><div class="joystick" id="joystick"><div class="stick" id="stick"></div></div><div class="hint">탐험 → 이벤트 → 동료 → 하우징 → 보스</div>
<div class="panel" id="quest"><button class="close" data-close="quest">닫기</button><h2>📖 스토리 · 퀘스트</h2><div id="questBody"></div></div>
<div class="panel" id="comp"><button class="close" data-close="comp">닫기</button><h2>👩 여성 동료</h2><div id="compBody"></div></div>
<div class="panel" id="house"><button class="close" data-close="house">닫기</button><h2>🏠 하우징</h2><p class="small">건물은 현재 위치 주변에 설치되고 월드에 남아. 저장은 날짜 변경 순간에만 실행돼.</p><div id="houseBody"></div></div>
<div class="panel" id="craft"><button class="close" data-close="craft">닫기</button><h2>🛠 제작</h2><div id="craftBody"></div></div>
<div class="panel" id="inv"><button class="close" data-close="inv">닫기</button><h2>🎒 가방</h2><div id="invBody"></div></div>
<div class="event" id="event"><h3 id="eventTitle"></h3><p id="eventText"></p><div id="eventChoices"></div></div><div id="toast" class="event" style="display:none;top:18%;width:auto;min-width:160px;padding:9px 13px;text-align:center"></div>
<div class="dead" id="dead"><div class="deadcard"><h2>생존 실패</h2><p id="deadText"></p><button id="restart">다시 시작</button></div></div>
<script>
// 파일명: web-games/survival2/index.html
// 임포트: 기존 저장 키 유지
// 메인: 숲의 생존자들 / 생존 / 하우징 / 성인 여성 동료 / 연애 / 퀘스트 / 이벤트 / 보스 / 전투 연출
const c=document.getElementById('game'),x=c.getContext('2d');
const E={hp:hp,hpbar:hpbar,atk:atk,companion:companion,phase:phase,clock:clock,day:day,wood:wood,stone:stone,fiber:fiber,meat:meat,quest:questBody,comp:compBody,house:houseBody,craft:craftBody,inv:invBody,event:event,eventTitle:eventTitle,eventText:eventText,eventChoices:eventChoices,toast:toast,dead:dead,deadText:deadText};
const SAVE='jaewoon-survival2-v2',W=4600,H=4600;
let sw=innerWidth,sh=innerHeight,dpr=1,last=performance.now(),joy=false,jx=0,jy=0,attackCd=0,gatherCd=0,anim=0,shake=0,eventLock=false,eventSerial=0;
const state={day:1,time:480,hp:100,maxHp:100,wood:0,stone:0,fiber:0,meat:0,weapon:'맨손',weaponBonus:0,story:0,kills:0,boss:{alpha:false,guardian:false,core:false},flags:{유나:false,세라:false,미라:false,리아:false},companion:null,companionHp:0,romance:{유나:0,세라:0,미라:0,리아:0},housing:[],player:{x:2300,y:2300},resources:[],enemies:[],npcs:[],effects:[],seenEvents:[]};
const defs={유나:{role:'전사',hp:120,atk:20,speed:88,color:'#b98572',hair:'#352127'},세라:{role:'궁수',hp:78,atk:15,speed:98,color:'#8fa7ca',hair:'#6b4028'},미라:{role:'의무병',hp:90,atk:6,speed:80,color:'#92b989',hair:'#59392b'},리아:{role:'탐험가',hp:95,atk:10,speed:94,color:'#c4a16b',hair:'#493324'}};
function resize(){dpr=Math.min(2,devicePixelRatio||1);sw=innerWidth;sh=innerHeight;c.width=sw*dpr;c.height=sh*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function R(a,b){return a+Math.random()*(b-a)}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function isNight(){return state.time>=1260||state.time<360}
function showToast(t){E.toast.textContent=t;E.toast.style.display='block';clearTimeout(showToast.t);showToast.t=setTimeout(()=>E.toast.style.display='none',1050)}
// 저장은 날짜 변경에서만 호출
function saveAtDayChange(){try{localStorage.setItem(SAVE,JSON.stringify(state))}catch(e){}}
function seed(){state.resources=[];state.enemies=[];for(let i=0;i<100;i++)spawnResource(['tree','tree','tree','stone','stone','fiber','berry'][i%7]);for(let i=0;i<8;i++)spawnEnemy(['늑대','멧돼지','거미'][i%3]);state.npcs=[{type:'유나',x:2570,y:2170,met:false},{type:'세라',x:3480,y:2420,met:false},{type:'미라',x:1580,y:3100,met:false},{type:'리아',x:3080,y:3400,met:false}]}
function spawnResource(type){const a=R(0,Math.PI*2),d=R(220,1850);state.resources.push({type,x:clamp(state.player.x+Math.cos(a)*d,80,W-80),y:clamp(state.player.y+Math.sin(a)*d,80,H-80),n:type==='tree'?4:type==='stone'?3:4})}
function spawnEnemy(kind,boss=false){const a=R(0,Math.PI*2),d=R(boss?1100:700,boss?1800:1700);const D={늑대:[60,10,65,18],멧돼지:[95,14,45,22],거미:[45,8,72,16],숲의알파:[450,30,50,38],연구소수호자:[800,40,38,46],숲의핵:[1400,58,30,52]}[kind];state.enemies.push({kind,boss,x:clamp(state.player.x+Math.cos(a)*d,60,W-60),y:clamp(state.player.y+Math.sin(a)*d,60,H-60),hp:D[0],maxHp:D[0],atk:D[1],speed:D[2],r:D[3],cd:R(.1,1.2),agg:boss})}
function activateBosses(){if(state.day>=3&&!state.boss.alpha&&!state.enemies.some(e=>e.kind==='숲의알파')){spawnEnemy('숲의알파',true);showToast('⚠️ 숲의 알파가 나타났어')}if(state.day>=5&&!state.boss.guardian&&!state.enemies.some(e=>e.kind==='연구소수호자')){spawnEnemy('연구소수호자',true);showToast('⚠️ 연구소 수호자 등장')}if(state.day>=7&&!state.boss.core&&!state.enemies.some(e=>e.kind==='숲의핵')){spawnEnemy('숲의핵',true);showToast('⚠️ 숲의 핵이 깨어났어')}}
function resetEvent(){E.event.style.display='none';eventLock=false}
const EVENTS=[
['폭우','갑작스러운 폭우가 숲을 덮쳤어. 시야가 줄고 이동이 불편해진다.',[['🏕️ 기지로 돌아간다',()=>{state.hp=Math.min(state.maxHp,state.hp+10);showToast('기지에서 잠시 쉰다')}],['🌲 빗속을 뚫고 탐험한다',()=>{state.wood+=2;state.fiber+=2;showToast('젖은 자원 +4')}]]],
['보급품 투하','하늘에서 오래된 비상 보급품이 떨어졌어. 하지만 주변의 포식자도 움직이기 시작했어.',[['📦 지금 연다',()=>{state.wood+=4;state.stone+=3;state.meat+=2;showToast('보급품 획득')}],['🚶 위험해서 포기한다',()=>{state.hp=Math.max(1,state.hp-5);showToast('멀리 물러났어')}]]],
['폐허의 생존자','무너진 건물에서 여성 생존자의 무전이 들린다. 구조를 도와야 할까?',[['👩 구조한다',()=>{state.romance.리아=Math.min(100,(state.romance.리아||0)+8);state.fiber+=3;showToast('리아의 신뢰 +8')}],['🔦 혼자 수색한다',()=>{state.stone+=5;showToast('폐허에서 돌 +5')}]]],
['야생 습격','밤의 괴물들이 기지 냄새를 맡았어. 다음 몇 분 동안 적이 몰려온다.',[['🛡️ 정면에서 막는다',()=>{for(let i=0;i<3;i++)spawnEnemy(['늑대','멧돼지','거미'][i%3]);state.hp=Math.max(1,state.hp-7);showToast('습격을 버텼어')}],['🔥 불을 크게 피운다',()=>{state.hp=Math.min(state.maxHp,state.hp+12);showToast('불빛에 적이 물러났어')}]]],
['동료의 밤','오늘 밤은 유독 조용하다. 활성 동료와 오래 이야기를 나눌 시간이야.',[['💬 진솔하게 대화한다',()=>{if(state.companion){state.romance[state.companion]=clamp((state.romance[state.companion]||0)+6,0,100);showToast(`${state.companion} 호감도 +6`)}else showToast('활성 동료가 없어')}],['🛏️ 조용히 쉰다',()=>{state.hp=Math.min(state.maxHp,state.hp+8);showToast('휴식으로 체력 +8')}]]]
];
function triggerEvent(force=false){if(eventLock)return;if(!force&&Math.random()>0.34)return;const available=EVENTS.filter((_,i)=>state.seenEvents.indexOf(i)<0||Math.random()<.55);const idx=(available.length?Math.floor(Math.random()*available.length):Math.floor(Math.random()*EVENTS.length));const ev=available[idx]||EVENTS[0];eventLock=true;E.event.style.display='block';E.eventTitle.textContent=`✨ ${ev[0]}`;E.eventText.textContent=ev[1];E.eventChoices.innerHTML='';ev[2].forEach(([label,fn])=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>{ev[0]&&state.seenEvents.push(EVENTS.indexOf(ev));fn();resetEvent()};E.eventChoices.appendChild(b)});}
function questHTML(){const count=Object.values(state.flags).filter(Boolean).length;const s=state.story;const chapters=[
['제1장 · 추락','바이브2호가 지도에 없는 숲으로 추락했다. 통신기는 깨졌고 생존에 필요한 자원을 직접 마련해야 한다.','나무 6 · 돌 4 · 야영지 1개'],
['제2장 · 사람의 흔적','숲 깊은 곳에서 성인 여성 생존자 유나를 만났다. 혼자가 아닌 생존을 선택할 수 있다.','유나 영입'],
['제3장 · 검은 숲','밤이 되면 포식자들이 기지 주변을 배회한다. 숲의 알파를 쓰러뜨려 길을 확보한다.','적 6 · 숲의 알파'],
['제4장 · 생존자들','세라, 미라, 리아를 찾아 생존자 거점을 완성한다.','여성 동료 4명 영입 · 동료방 2개'],
['제5장 · 연구소','폐허 아래 연구소가 숲의 변이를 만들었다. 연구소 수호자를 쓰러뜨린다.','연구소 수호자 토벌'],
['최종장 · 숲의 핵','숲의 중심에서 모든 괴물을 움직이는 핵을 발견했다. 핵을 파괴하면 구조 신호를 보낼 수 있다.','숲의 핵 토벌']];const a=chapters[Math.min(s,5)];return `<div class="story"><span class="badge">${a[0]}</span><h3>${a[1]}</h3><p><b>목표:</b> ${a[2]}</p></div><div class="quest">현재 진행 · 적 처치 ${state.kills} · 동료 ${count}/4 · 건물 ${state.housing.length}</div>`}
function renderQuest(){E.quest.innerHTML=questHTML()}
function renderComp(){const names=['유나','세라','미라','리아'];E.comp.innerHTML='<div class="item"><span><b>소환 슬롯</b><small>전투에 참여하는 동료는 한 번에 1명. 필요하면 해제할 수 있어.</small></span><button onclick="unsummon()">해제</button></div>'+names.map(n=>{const m=defs[n],u=state.flags[n],r=state.romance[n]||0;return `<div class="item"><span><b>${n}</b><small>${m.role} · HP ${m.hp} · 공격 ${m.atk}<br><span class="heart">♥ 호감도 ${r}/100</span></small></span><div>${u?`<button onclick="summon('${n}')">${state.companion===n?'소환 중':'소환'}</button><button onclick="talk('${n}')">대화</button><button onclick="gift('${n}')">선물</button>`:'<small>스토리 영입</small>'}</div></div>`}).join('')}
function summon(n){if(!state.flags[n])return;state.companion=n;state.companionHp=defs[n].hp;showToast(`${n} 소환 완료`);renderComp()}
function unsummon(){if(state.companion){showToast(`${state.companion} 해제`);state.companion=null}renderComp()}
function talk(n){state.romance[n]=clamp((state.romance[n]||0)+4,0,100);showToast(`${n} 호감도 +4`);renderComp()}
function gift(n){if(state.meat<2){showToast('선물용 먹이 2개가 필요해');return}state.meat-=2;state.romance[n]=clamp((state.romance[n]||0)+8,0,100);showToast(`${n} 호감도 +8`);renderComp()}
function meet(n){if(state.companion&&state.companion!==n){showToast('현재 동료를 먼저 해제해');return}state.flags[n]=true;state.companion=n;state.companionHp=defs[n].hp;state.romance[n]=Math.max(10,state.romance[n]||0);showToast(`${n}가 동료가 됐어`);if(n==='유나')state.story=Math.max(state.story,2);if(['세라','미라','리아'].filter(v=>state.flags[v]).length>=2)state.story=Math.max(state.story,4);renderQuest();renderComp()}
const structures=[['야영지',6,'나무','초기 거점'],['벽',5,'나무','기지 방어'],['침대',8,'나무','휴식'],['작업대',10,'나무','고급 제작'],['동료방',14,'나무','동료 개인 공간'],['돌벽',7,'돌','강화 방어']];
function renderHouse(){E.house.innerHTML='<div class="buildgrid">'+structures.map(a=>`<button class="btn" onclick="build('${a[0]}',${a[1]},'${a[2]}')">🏠 ${a[0]}<br><span class="small">${a[1]} ${a[2]} · ${a[3]}</span></button>`).join('')+'</div><div class="quest">현재 건물 ${state.housing.length}개 · 동료방 ${state.housing.filter(b=>b.type==='동료방').length}/2</div>'}
function build(type,cost,res){if(state[res==='나무'?'wood':'stone']<cost){showToast('자원이 부족해');return}if(res==='나무')state.wood-=cost;else state.stone-=cost;const a=R(0,Math.PI*2),d=R(55,125);state.housing.push({type,x:state.player.x+Math.cos(a)*d,y:state.player.y+Math.sin(a)*d});if(type==='야영지'&&state.story===0)state.story=1;if(state.story===3&&state.housing.filter(b=>b.type==='동료방').length>=2)state.story=4;showToast(`${type} 건설 완료`);renderQuest();renderHouse()}
const recipes=[['돌도끼',6,0,2,4],['돌창',7,3,2,9],['강화창',12,6,4,18],['붕대',2,0,1,0]];
function renderCraft(){E.craft.innerHTML=recipes.map(r=>`<div class="item"><span><b>${r[0]}</b><small>🪵 ${r[1]} · 🪨 ${r[2]} · 🌿 ${r[3]}<br>${r[0]==='붕대'?'체력 +30':'공격 +'+r[4]}</small></span><button onclick="craft('${r[0]}')">제작</button></div>`).join('')}
function craft(n){const r=recipes.find(v=>v[0]===n);if(!r)return;if(state.wood<r[1]||state.stone<r[2]||state.fiber<r[3]){showToast('재료가 부족해');return}state.wood-=r[1];state.stone-=r[2];state.fiber-=r[3];if(n==='붕대'){state.hp=Math.min(state.maxHp,state.hp+30);showToast('체력 +30')}else{state.weapon=n;state.weaponBonus=r[4];showToast(`${n} 장착`)} }
function renderInv(){E.inv.innerHTML=`<div class="item"><span>🗡 무기<small>${state.weapon} · 공격 +${state.weaponBonus}</small></span></div><div class="item"><span>🍖 먹이<small>${state.meat}개</small></span><button onclick="eat()">먹기</button></div><div class="item"><span>🏠 하우징<small>${state.housing.length}개 설치</small></span></div>`}
function eat(){if(!state.meat){showToast('먹이가 없어');return}state.meat--;state.hp=Math.min(state.maxHp,state.hp+18);showToast('체력 +18')}
function nearestResource(){let best=null,bd=90;for(const r of state.resources){const d=dist(state.player,r);if(d<bd){bd=d;best=r}}return best}
function gather(){if(gatherCd>0)return;const r=nearestResource();if(!r){showToast('자원에 더 가까이 가');return}gatherCd=.25;const k={tree:['wood','나무'],stone:['stone','돌'],fiber:['fiber','섬유'],berry:['meat','열매']}[r.type];state[k[0]]++;r.n--;state.effects.push({x:r.x,y:r.y,t:.5,type:'loot',text:'+1'});if(r.n<=0){state.resources.splice(state.resources.indexOf(r),1);setTimeout(()=>spawnResource(r.type),1800)}showToast(`${k[1]} +1`);if(state.story===0&&state.wood>=6&&state.stone>=4&&state.housing.some(b=>b.type==='야영지')){state.story=1;renderQuest()}}
function createHitFX(px,py,kind='hit'){for(let i=0;i<10;i++)state.effects.push({x:px+R(-12,12),y:py+R(-12,12),vx:R(-55,55),vy:R(-65,25),t:.5+R(0,.25),type:kind})}
function playerAttack(){if(attackCd>0||eventLock)return;attackCd=.42;anim=.24;shake=.12;let target=null,bd=160;for(const e of state.enemies){const d=dist(state.player,e);if(d<bd&&(e.boss||d<bd)){target=e;bd=d}}if(!target){showToast('공격할 적이 가까이 없어');return}const dmg=5+state.weaponBonus;target.hp-=dmg;target.agg=true;target.hurt=.16;target.x+=jx*18;target.y+=jy*18;createHitFX(target.x,target.y,'hit');state.effects.push({x:target.x,y:target.y,t:.7,type:'damage',text:`-${dmg}`});if(target.hp<=0){state.enemies.splice(state.enemies.indexOf(target),1);state.meat+=target.boss?5:1;state.kills++;createHitFX(target.x,target.y,'burst');state.effects.push({x:target.x,y:target.y,t:1,type:'damage',text:target.boss?'BOSS DOWN':'+'+ (target.boss?5:1)});if(target.kind==='숲의알파')state.boss.alpha=true;if(target.kind==='연구소수호자')state.boss.guardian=true;if(target.kind==='숲의핵'){state.boss.core=true;showToast('숲의 핵을 파괴했어')}if(state.story===2&&state.kills>=6&&state.boss.alpha)state.story=3;if(state.story===3&&Object.values(state.flags).filter(Boolean).length>=4)state.story=4;if(state.story===4&&state.boss.guardian)state.story=5;renderQuest();}}
function updateCompanion(dt){if(!state.companion)return;const n=state.companion,m=defs[n];let q=companionObj||{x:state.player.x-60,y:state.player.y+40,cd:0};let target=state.enemies.filter(e=>e.agg||e.boss).sort((a,b)=>dist(q,a)-dist(q,b))[0];if(n==='세라'&&target){const d=dist(q,target);if(d>240){q.x+=(target.x-q.x)/d*m.speed*dt;q.y+=(target.y-q.y)/d*m.speed*dt}else if(q.cd<=0){target.hp-=m.atk;q.cd=1.35;target.hurt=.12;createHitFX(target.x,target.y,'arrow')}}else if((n==='유나')&&target){const d=dist(q,target);if(d>54){q.x+=(target.x-q.x)/d*m.speed*dt;q.y+=(target.y-q.y)/d*m.speed*dt}else if(q.cd<=0){target.hp-=m.atk;q.cd=1;q.hurt=.12;createHitFX(target.x,target.y,'slash')}}else{const d=dist(q,state.player);if(d>78){q.x+=(state.player.x-q.x)/d*m.speed*dt;q.y+=(state.player.y-q.y)/d*m.speed*dt}}if(n==='미라'&&q.cd<=0){state.hp=Math.min(state.maxHp,state.hp+3);q.cd=2.5}if(n==='리아'){const r=nearestResource();if(r&&dist(q,r)<150&&Math.random()<dt*.7){const k={tree:'wood',stone:'stone',fiber:'fiber',berry:'meat'}[r.type];state[k]++;r.n--;if(r.n<=0)state.resources.splice(state.resources.indexOf(r),1)}}q.cd=Math.max(0,(q.cd||0)-dt);companionObj=q;state.companionHp=state.companionHp||m.hp}
let companionObj={x:2240,y:2360,cd:0};
function updateEnemies(dt){for(const e of state.enemies){const d=dist(e,state.player);if((isNight()&&d<650)||e.boss)e.agg=true;if(e.agg){if(d>44){e.x+=(state.player.x-e.x)/Math.max(d,1)*e.speed*dt;e.y+=(state.player.y-e.y)/Math.max(d,1)*e.speed*dt}else if(e.cd<=0){state.hp-=e.atk;e.cd=e.boss?1.05:1.25;shake=.15;createHitFX(state.player.x,state.player.y,'hurt')}}else{e.x+=Math.cos((e.x+e.y)*.003)*e.speed*.1*dt;e.y+=Math.sin(e.x*.002)*e.speed*.08*dt}e.cd=Math.max(0,e.cd-dt);e.hurt=Math.max(0,(e.hurt||0)-dt);e.x=clamp(e.x,40,W-40);e.y=clamp(e.y,40,H-40)}}
function update(dt){attackCd=Math.max(0,attackCd-dt);gatherCd=Math.max(0,gatherCd-dt);anim=Math.max(0,anim-dt);shake=Math.max(0,shake-dt);if(!eventLock){state.player.x=clamp(state.player.x+jx*185*dt,40,W-40);state.player.y=clamp(state.player.y+jy*185*dt,40,H-40)}state.time+=dt*38;if(state.time>=1440){state.time=0;state.day++;for(let i=0;i<4;i++)spawnEnemy(['늑대','멧돼지','거미'][i%3]);activateBosses();saveAtDayChange();showToast(`${state.day}일차 시작 · 저장 완료`);if(state.day%2===0)triggerEvent(true);else triggerEvent(false)}if(!eventLock)triggerEvent(false);updateCompanion(dt);updateEnemies(dt);for(const e of state.effects){e.t-=dt;e.x+=(e.vx||0)*dt;e.y+=(e.vy||0)*dt;e.vy=(e.vy||0)+65*dt}state.effects=state.effects.filter(e=>e.t>0);activateBosses();if(state.hp<=0&&!eventLock){state.hp=0;E.deadText.textContent=`${state.day}일차에서 생존이 끝났어.`;E.dead.style.display='grid'}}
function screenPos(o){return{x:o.x-state.player.x+sw/2,y:o.y-state.player.y+sh/2}}
function drawCharacter(px,py,opt){const bob=opt.moving?Math.sin(performance.now()/90)*2:0,hit=opt.hit||0;x.save();x.translate(px,py+bob);x.scale(1,1+hit);x.fillStyle='#0006';x.beginPath();x.ellipse(0,22,22,8,0,0,7);x.fill();x.fillStyle=opt.skin||'#dcb095';x.beginPath();x.arc(0,-18,13,0,7);x.fill();x.fillStyle=opt.hair||'#302529';x.beginPath();x.arc(0,-23,14,Math.PI,Math.PI*2);x.fill();x.fillStyle=opt.shirt||'#466b83';x.fillRect(-13,-5,26,29);x.fillStyle='#222';x.fillRect(-10,24,7,13);x.fillRect(3,24,7,13);x.fillStyle='#fff';x.fillRect(-6,-20,3,3);x.fillRect(3,-20,3,3);if(opt.weapon){x.save();x.rotate(opt.swing||-.2);x.fillStyle='#7d522f';x.fillRect(22,-2,20,4);x.fillStyle='#cfd6da';x.fillRect(40,-5,8,10);x.restore()}x.restore()}
function drawEnemy(e,p){x.save();x.translate(p.x,p.y);x.fillStyle='#0005';x.beginPath();x.ellipse(0,e.r*.75,e.r*1.2,e.r*.42,0,0,7);x.fill();x.fillStyle=e.boss?(e.kind==='숲의핵'?'#a34687':e.kind==='연구소수호자'?'#70504c':'#805338'):(e.kind==='늑대'?'#6b737d':e.kind==='멧돼지'?'#7b5c48':'#3f5648');x.beginPath();x.ellipse(0,0,e.r,e.r*.72,0,0,7);x.fill();x.fillStyle='#151515';x.beginPath();x.arc(e.r*.68,-4,2.5,0,7);x.arc(e.r*.88,-4,2.5,0,7);x.fill();if(e.hurt>0){x.strokeStyle='#fff';x.lineWidth=3;x.stroke()}x.restore()}
function draw(){x.save();if(shake)x.translate(R(-4,4),R(-3,3));const g=x.createLinearGradient(0,0,0,sh);g.addColorStop(0,isNight()?'#07131b':'#78c777');g.addColorStop(1,isNight()?'#0b1d18':'#376a3d');x.fillStyle=g;x.fillRect(0,0,sw,sh);for(let i=0;i<90;i++){const px=((i*271)-state.player.x*.18)%sw,py=((i*173)-state.player.y*.18)%sh;x.fillStyle=i%4?'#ffffff12':'#113a20';x.beginPath();x.arc(px,py,i%6?1.5:3,0,7);x.fill()}
for(const b of state.housing){const p=screenPos(b);if(p.x<-80||p.x>sw+80||p.y<-80||p.y>sh+80)continue;x.fillStyle=b.type==='돌벽'?'#6f6a64':b.type==='벽'?'#815b42':'#9f7249';x.fillRect(p.x-25,p.y-19,50,36);if(['야영지','침대','작업대','동료방'].includes(b.type)){x.fillStyle='#b88c58';x.fillRect(p.x-20,p.y-34,40,15)}x.fillStyle='#fff';x.font='9px system-ui';x.textAlign='center';x.fillText(b.type,p.x,p.y+8)}
for(const r of state.resources){const p=screenPos(r);if(p.x<-70||p.x>sw+70||p.y<-70||p.y>sh+70)continue;if(r.type==='tree'){x.fillStyle='#60402a';x.fillRect(p.x-5,p.y-2,10,34);x.fillStyle='#27683f';x.beginPath();x.arc(p.x,p.y-10,28,0,7);x.fill();x.beginPath();x.arc(p.x-17,p.y-5,18,0,7);x.arc(p.x+17,p.y-7,18,0,7);x.fill()}else if(r.type==='stone'){x.fillStyle='#727a78';x.beginPath();x.moveTo(p.x-22,p.y+8);x.lineTo(p.x-10,p.y-14);x.lineTo(p.x+10,p.y-18);x.lineTo(p.x+24,p.y);x.lineTo(p.x+10,p.y+13);x.closePath();x.fill()}else{x.fillStyle=r.type==='berry'?'#7d2f51':'#83a55d';x.beginPath();x.arc(p.x,p.y,8,0,7);x.fill()}}
for(const n of state.npcs){if(n.met)continue;const p=screenPos(n),m=defs[n.type];drawCharacter(p.x,p.y,{hair:m.hair,shirt:m.color,skin:'#e4b79b'});x.fillStyle='#ffd76f';x.font='10px system-ui';x.textAlign='center';x.fillText(`${n.type} · 접근`,p.x,p.y-40)}
for(const e of state.enemies){const p=screenPos(e);drawEnemy(e,p);x.fillStyle='#0008';x.fillRect(p.x-25,p.y-e.r-15,50,5);x.fillStyle='#e54c4c';x.fillRect(p.x-25,p.y-e.r-15,50*Math.max(0,e.hp/e.maxHp),5);if(e.boss){x.fillStyle='#ffd76d';x.font='10px system-ui';x.textAlign='center';x.fillText(e.kind,p.x,p.y-e.r-22)}}
if(state.companion){const m=defs[state.companion],p=screenPos(companionObj);drawCharacter(p.x,p.y,{hair:m.hair,shirt:m.color,skin:'#e4b79b',weapon:state.companion==='유나',swing:state.companion==='유나'?(Math.sin(performance.now()/130)*.7):0,moving:true});x.fillStyle='#ffd2e2';x.font='10px system-ui';x.textAlign='center';x.fillText(`${state.companion} ♥${state.romance[state.companion]||0}`,p.x,p.y-43);x.fillStyle='#0008';x.fillRect(p.x-22,p.y-m.r-16,44,4);x.fillStyle='#61d585';x.fillRect(p.x-22,p.y-m.r-16,44*Math.max(0,state.companionHp/m.hp),4)}
drawCharacter(sw/2,sh/2,{shirt:'#476f88',skin:'#dcb095',hair:'#2d2627',weapon:state.weapon!=='맨손',swing:anim?Math.sin((.24-anim)*22)*1.4:0,moving:joy});if(anim){x.globalAlpha=.85;x.strokeStyle='#ffe59b';x.lineWidth=5;x.beginPath();x.arc(sw/2,sh/2,50,Math.PI*.08,Math.PI*.9);x.stroke();x.globalAlpha=1}
for(const e of state.effects){const p=screenPos(e);x.globalAlpha=Math.max(0,e.t);if(e.type==='damage'){x.fillStyle=e.text==='BOSS DOWN'?'#ffd86e':'#fff';x.font=e.text==='BOSS DOWN'?'bold 14px system-ui':'bold 13px system-ui';x.textAlign='center';x.fillText(e.text,p.x,p.y-25-(.7-e.t)*35)}else{x.fillStyle=e.type==='hurt'?'#ff6c78':e.type==='arrow'?'#b8e8ff':e.type==='slash'?'#ffe18b':'#ffd66b';x.beginPath();x.arc(p.x,p.y,3+8*(1-e.t),0,7);x.fill()}}x.globalAlpha=1;if(isNight()){x.fillStyle='#020a1390';x.fillRect(0,0,sw,sh)}x.restore()}
function updateUI(){E.hp.textContent=`${Math.round(state.hp)}/${state.maxHp}`;E.hpbar.style.width=`${100*state.hp/state.maxHp}%`;E.atk.textContent=5+state.weaponBonus;E.companion.textContent=state.companion||'없음';E.phase.textContent=isNight()?'🌙 밤':'☀️ 낮';E.clock.textContent=`${String(Math.floor(state.time/60)%24).padStart(2,'0')}:${String(Math.floor(state.time%60)).padStart(2,'0')}`;E.day.textContent=state.day;E.wood.textContent=state.wood;E.stone.textContent=state.stone;E.fiber.textContent=state.fiber;E.meat.textContent=state.meat}
function openPanel(id){document.querySelectorAll('.panel').forEach(p=>p.style.display='none');document.getElementById(id).style.display='block';if(id==='quest')renderQuest();if(id==='comp')renderComp();if(id==='house')renderHouse();if(id==='craft')renderCraft();if(id==='inv')renderInv()}
questBtn.onclick=()=>openPanel('quest');eventBtn.onclick=()=>triggerEvent(true);compBtn.onclick=()=>openPanel('comp');houseBtn.onclick=()=>openPanel('house');craftBtn.onclick=()=>openPanel('craft');invBtn.onclick=()=>openPanel('inv');gatherBtn.onclick=gather;attackBtn.onclick=playerAttack;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.close).style.display='none');restart.onclick=()=>location.reload();
function joySet(e){const r=joystick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,l=Math.hypot(dx,dy)||1,k=Math.min(1,l/(r.width*.32));jx=dx/l*k;jy=dy/l*k;stick.style.transform=`translate(${jx*38}px,${jy*38}px)`}joystick.onpointerdown=e=>{joy=true;joystick.setPointerCapture(e.pointerId);joySet(e)};joystick.onpointermove=e=>joy&&joySet(e);function joyEnd(){joy=false;jx=jy=0;stick.style.transform=''}joystick.onpointerup=joyEnd;joystick.onpointercancel=joyEnd;
window.summon=summon;window.unsummon=unsummon;window.talk=talk;window.gift=gift;window.meet=meet;window.build=build;window.craft=craft;window.eat=eat;
try{const raw=localStorage.getItem(SAVE);if(raw){Object.assign(state,JSON.parse(raw));if(!state.flags)state.flags={};if(!state.romance)state.romance={유나:0,세라:0,미라:0,리아:0};if(!Array.isArray(state.housing))state.housing=[];if(!Array.isArray(state.resources)||!state.resources.length)seed();if(!Array.isArray(state.enemies))state.enemies=[];if(!Array.isArray(state.npcs)||!state.npcs.length)seed();companionObj={x:state.player.x-60,y:state.player.y+40,cd:0}}else seed()}catch(e){seed()}renderQuest();updateUI();
function loop(t){const dt=Math.min(.035,(t-last)/1000);last=t;anim+=dt*2;update(dt);draw();updateUI();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></div></body></html>
