<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>생존2 · 바이브2호</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08130e;color:#fff;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;touch-action:none}#app{position:relative;width:100%;height:100%;overflow:hidden}canvas{display:block;width:100%;height:100%}.top{position:absolute;z-index:5;left:8px;right:8px;top:8px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.card{min-width:132px;padding:7px 10px;border-radius:13px;border:1px solid #fff3;background:#06110ddd;box-shadow:0 5px 18px #0005;backdrop-filter:blur(4px);font-size:12px;font-weight:900;line-height:1.4}.bar{height:7px;margin-top:4px;border-radius:8px;background:#ffffff26;overflow:hidden}.bar i{display:block;height:100%;background:#e84b45;width:100%}.right{position:absolute;z-index:8;right:9px;top:67px;display:grid;gap:7px}.btn{min-width:86px;border:1px solid #fff3;border-radius:12px;background:#09150fe8;color:#fff;padding:9px 10px;font-size:11px;font-weight:900;box-shadow:0 4px 12px #0004}.btn:active{transform:scale(.97)}.attack{position:absolute;z-index:9;right:12px;bottom:20px;min-width:110px;min-height:61px;background:#873026}.joystick{position:absolute;z-index:9;left:17px;bottom:19px;width:128px;height:128px;border-radius:50%;border:2px solid #ffffff24;background:#ffffff10;box-shadow:inset 0 0 20px #0004}.stick{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;border:2px solid #fff4;background:#d9ead94d}.hint{position:absolute;z-index:4;left:50%;bottom:9px;transform:translateX(-50%);padding:6px 9px;border-radius:10px;background:#06100eaa;font-size:10px;font-weight:800;white-space:nowrap}.panel{position:absolute;z-index:30;left:9px;right:9px;top:62px;bottom:9px;display:none;padding:12px;border-radius:17px;border:1px solid #ffffff2f;background:#071019f7;overflow:auto;touch-action:pan-y;box-shadow:0 12px 35px #0009}.panel h2{margin:0 0 10px;font-size:19px}.close{float:right;border:0;border-radius:9px;background:#ffffff15;color:#fff;padding:7px 9px;font-weight:900}.item{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:7px 0;padding:10px;border-radius:12px;background:#11252b;border:1px solid #ffffff10}.item small{display:block;opacity:.72;font-size:10px;margin-top:3px}.item button{border:0;border-radius:9px;background:#2d9666;color:#fff;padding:8px 10px;font-weight:900}.story{border-radius:14px;padding:12px;background:linear-gradient(145deg,#142b30,#0c1a22);border:1px solid #ffffff18;margin-bottom:10px}.story b{color:#ffd67a}.choice{display:grid;gap:7px;margin-top:9px}.choice button{border:0;border-radius:10px;padding:10px;background:#245b6b;color:#fff;text-align:left;font-weight:850}.badge{display:inline-block;padding:4px 7px;border-radius:999px;background:#183d48;color:#8fe6ff;font-size:9px;font-weight:900}.dead{position:absolute;z-index:50;inset:0;display:none;place-items:center;background:#000b}.deadCard{width:min(90%,360px);padding:20px;border:1px solid #ffffff2b;border-radius:18px;background:#08121af5;text-align:center}.deadCard button{border:0;border-radius:11px;background:#33865f;color:#fff;padding:10px 15px;font-weight:900}
</style>
</head>
<body><div id="app">
<canvas id="game"></canvas>
<div class="top"><div class="card">❤️ <span id="hp">100/100</span><div class="bar"><i id="hpbar"></i></div><span class="small">⚔️ <span id="atk">5</span> · 🐾 <span id="companion">없음</span></span></div><div class="card"><span id="phase">☀️ 낮</span> · <span id="clock">08:00</span><br><span class="small">📅 <span id="day">1</span>일 · 🪵<span id="wood">0</span> 🪨<span id="stone">0</span> 🌿<span id="fiber">0</span> 🍖<span id="meat">0</span></span></div></div>
<div class="right"><button class="btn" id="storyBtn">📖 이야기</button><button class="btn" id="compBtn">🐾 동료</button><button class="btn" id="craftBtn">🛠 제작</button><button class="btn" id="invBtn">🎒 가방</button><button class="btn" id="gatherBtn">✋ 채집</button></div>
<button class="btn attack" id="attackBtn">⚔️ 공격</button>
<div class="joystick" id="joystick"><div class="stick" id="stick"></div></div><div class="hint">숲을 탐험하고 동료를 만나며 살아남아</div>
<div class="panel" id="story"><button class="close" data-close="story">닫기</button><h2>📖 바이브2호 생존기</h2><div id="storyBody"></div></div>
<div class="panel" id="comp"><button class="close" data-close="comp">닫기</button><h2>🐾 동물 동료</h2><div id="compList"></div></div>
<div class="panel" id="craft"><button class="close" data-close="craft">닫기</button><h2>🛠 제작</h2><div id="craftList"></div></div>
<div class="panel" id="inv"><button class="close" data-close="inv">닫기</button><h2>🎒 가방</h2><div id="invList"></div></div>
<div class="toast" id="toast"></div>
<div class="dead" id="dead"><div class="deadCard"><h2>생존 실패</h2><p id="deadText">숲이 너를 삼켰어.</p><button id="restart">다시 시작</button></div></div>
<script>
// 파일명: web-games/survival2/index.html
// 임포트: 기존 저장/자원 흐름을 깨지 않는 독립 웹게임
// 메인: 바이브2호 생존 / 스토리 / AI 동료 / 모바일 조작 / 저장
const c=document.getElementById('game'),x=c.getContext('2d');
const E={hp:document.getElementById('hp'),hpbar:document.getElementById('hpbar'),atk:document.getElementById('atk'),comp:document.getElementById('companion'),phase:document.getElementById('phase'),clock:document.getElementById('clock'),day:document.getElementById('day'),wood:document.getElementById('wood'),stone:document.getElementById('stone'),fiber:document.getElementById('fiber'),meat:document.getElementById('meat'),story:document.getElementById('story'),compPanel:document.getElementById('comp'),craft:document.getElementById('craft'),inv:document.getElementById('inv'),storyBody:document.getElementById('storyBody'),compList:document.getElementById('compList'),craftList:document.getElementById('craftList'),invList:document.getElementById('invList'),toast:document.getElementById('toast'),dead:document.getElementById('dead'),deadText:document.getElementById('deadText')};
const SAVE='jaewoon-survival2-v2',W=3600,H=3600,CYCLE=.75;
let sw=innerWidth,sh=innerHeight,dpr=1,joyX=0,joyY=0,joy=false,last=performance.now(),cool=0,gatherCool=0,toastTimer=0;
const s={day:1,time:480,hp:100,maxHp:100,wood:0,stone:0,fiber:0,meat:0,food:0,weapon:'맨손',weaponBonus:0,story:0,flags:{fox:false,wolf:false,deer:false,core:false},companion:null,player:{x:1800,y:1800},resources:[],enemies:[],companions:[],particles:[]};
function resize(){dpr=Math.min(2,devicePixelRatio||1);sw=innerWidth;sh=innerHeight;c.width=sw*dpr;c.height=sh*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function R(a,b){return a+Math.random()*(b-a)} function clamp(v,a,b){return Math.max(a,Math.min(b,v))} function D(a,b){return Math.hypot(a.x-b.x,a.y-b.y)} function night(){return s.time>=1260||s.time<360}
function toast(t){E.toast.textContent=t;E.toast.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>E.toast.style.display='none',1100)}
function save(){try{localStorage.setItem(SAVE,JSON.stringify(s))}catch(e){}}
function seed(){s.resources=[];s.enemies=[];for(let i=0;i<70;i++)spawnRes(['tree','tree','tree','stone','stone','fiber','berry'][i%7],150,1500);for(let i=0;i<12;i++)spawnEnemy(['늑대','멧돼지','거미'][i%3]);}
function spawnRes(type,min,max){let a=R(0,Math.PI*2),d=R(min,max);s.resources.push({id:Math.random(),type,x:clamp(s.player.x+Math.cos(a)*d,70,W-70),y:clamp(s.player.y+Math.sin(a)*d,70,H-70),n:type==='tree'?3:type==='stone'?2:type==='fiber'?4:3})}
function spawnEnemy(kind){const a=R(0,Math.PI*2),d=R(700,1500),data={늑대:[55,10,62,18],멧돼지:[85,13,45,21],거미:[40,8,70,15]}[kind];s.enemies.push({kind,x:clamp(s.player.x+Math.cos(a)*d,50,W-50),y:clamp(s.player.y+Math.sin(a)*d,50,H-50),hp:data[0],maxHp:data[0],atk:data[1],speed:data[2],r:data[3],cd:R(.2,1.5),agg:false});}
function makeComp(type){const m={여우:{hp:50,atk:8,speed:80,r:15,role:'채집 보조'},늑대:{hp:90,atk:15,speed:92,r:19,role:'전투 보조'},사슴:{hp:120,atk:4,speed:58,r:22,role:'회복 보조'}}[type];return {type,x:s.player.x-50,y:s.player.y+50,hp:m.hp,maxHp:m.hp,atk:m.atk,speed:m.speed,r:m.r,role:m.role,cd:0,wander:Math.random()*6.28,wanderT:R(.5,2)}}
function storyText(){const q=s.story;if(q===0)return `<div class="story"><span class="badge">제1장 · 숲에 떨어지다</span><h3>바이브2호, 추락</h3><p>폭풍 속에서 비행선이 추락했어. 눈을 뜬 곳은 지도에도 없는 거대한 숲. 통신기는 죽었고, 구조 신호는 밤에만 한 번씩 잡혀.</p><p><b>목표:</b> 나무 6개와 돌 4개를 모아 임시 야영지를 만들어.</p></div><div class="choice"><button onclick="advanceStory(1)">야영지를 만들고 밤을 준비한다</button></div>`;
if(q===1)return `<div class="story"><span class="badge">제2장 · 첫 번째 발자국</span><h3>숲의 친구</h3><p>먹이를 찾다 작은 여우가 나타났어. 도망치지 않고 멀리서 너를 지켜본다. 이 숲에는 사람 말고도 살아남으려는 존재가 있는 것 같아.</p><p><b>목표:</b> 여우에게 열매 2개를 건네 동료로 만들어.</p></div><div class="choice"><button onclick="tame('여우')">🍓 여우에게 열매 건네기</button></div>`;
if(q===2)return `<div class="story"><span class="badge">제3장 · 검은 숲</span><h3>밤의 포식자</h3><p>밤이 오자 숲의 분위기가 완전히 달라진다. 멀리서 늑대 울음이 들린다. 여우가 먼저 낮게 으르렁거린다.</p><p><b>목표:</b> 밤에 늑대 2마리를 물리치고 길을 연다.</p></div><div class="choice"><button onclick="advanceStory(3)">사냥을 시작한다</button></div>`;
if(q===3)return `<div class="story"><span class="badge">제4장 · 신호탑</span><h3>꺼져가는 불빛</h3><p>무너진 신호탑에서 구조 신호의 좌표를 찾았어. 하지만 핵심 부품이 사라졌고, 흔적은 오래된 계곡으로 이어져 있다.</p><p><b>목표:</b> 돌 8개, 나무 10개를 모아 신호탑을 복구한다.</p></div><div class="choice"><button onclick="advanceStory(4)">신호탑 복구를 진행한다</button></div>`;
return `<div class="story"><span class="badge">최종장 · 귀환 신호</span><h3>새벽을 향해</h3><p>신호탑이 켜졌어. 멀리서 구조선의 불빛이 보인다. 하지만 숲에서 네 동료들이 달려온다. 함께 돌아갈지, 이 숲의 비밀을 더 파고들지 선택해야 해.</p><p><b>현재:</b> 구조 신호 송출 완료.</p></div>`}
function advanceStory(n){s.story=n;save();renderStory()}
function tame(type){if(type==='여우'&&s.meat>=2){s.meat-=2;s.flags.fox=true;s.companions.push(makeComp('여우'));s.companion='여우';s.story=2;toast('여우가 동료가 됐어');save();renderStory();renderComp()}else toast('먹이 2개가 필요해')}
function renderStory(){E.storyBody.innerHTML=storyText()}
function renderComp(){const list=[];if(s.flags.fox)list.push('여우');if(s.flags.wolf)list.push('늑대');if(s.flags.deer)list.push('사슴');if(!list.length){E.compList.innerHTML='<div class="item"><span>아직 동료가 없어.<br><small>스토리를 진행하면 동물을 만날 수 있어.</small></span></div>';return}E.compList.innerHTML=list.map(t=>`<div class="item"><span><b>${t}</b><small>${({여우:'채집 보조 · 주변 열매를 알려줌',늑대:'전투 보조 · 적을 우선 공격',사슴:'회복 보조 · 일정 시간마다 회복'})[t]}</small></span><button onclick="selectComp('${t}')">${s.companion===t?'사용 중':'동행'}</button></div>`).join('')}
function selectComp(t){s.companion=t;while(s.companions.length<1)s.companions.push(makeComp(t));s.companions[0]=makeComp(t);toast(`${t}이(가) 함께 이동해`);save();renderComp()}
const recipes=[['돌도끼',6,0,2,0,'공격 +4 · 나무/돌 채집 강화'],['돌창',7,3,2,0,'공격 +9'],['붕대',2,0,1,2,'즉시 체력 +30']];
function renderCraft(){E.craftList.innerHTML=recipes.map(([n,w,st,f,heal,d])=>`<div class="item"><span><b>${n}</b><small>🪵 ${w} · 🪨 ${st} · 🌿 ${f}${heal?', 회복용':''}<br>${d}</small></span><button onclick="craft('${n}')">제작</button></div>`).join('')}
function craft(n){const r=recipes.find(a=>a[0]===n);if(!r)return;if(s.wood<r[1]||s.stone<r[2]||s.fiber<r[3]){toast('재료가 부족해');return}s.wood-=r[1];s.stone-=r[2];s.fiber-=r[3];if(n==='붕대'){s.hp=Math.min(s.maxHp,s.hp+30);toast('붕대로 체력을 회복했어')}else{s.weapon=n;s.weaponBonus=n==='돌도끼'?4:9;toast(`${n} 제작 완료`)}save();updateUI()}
function renderInv(){E.invList.innerHTML=`<div class="item"><span>🗡 무기<small>${s.weapon} · 공격 +${s.weaponBonus}</small></span></div><div class="item"><span>🍓 먹이<small>${s.meat}개 · 동료 길들이기와 회복에 사용</small></span><button onclick="eat()">먹기</button></div><div class="item"><span>❤️ 체력<small>${Math.round(s.hp)}/${s.maxHp}</small></span><button onclick="useFood()">회복</button></div>`}
function eat(){useFood()}
function useFood(){if(!s.meat){toast('먹이가 없어');return}s.meat--;s.hp=Math.min(s.maxHp,s.hp+18);toast('먹이로 체력 +18');save();updateUI()}
function closestResource(){let z=null,bd=82;for(const r of s.resources){const d=D(s.player,r);if(d<bd){bd=d;z=r}}return z}
function gather(){if(gatherCool>0)return;const r=closestResource();if(!r){toast('조금 더 가까이 가');return}gatherCool=.28;const gain={tree:['wood',1,'나무'],stone:['stone',1,'돌'],fiber:['fiber',1,'섬유'],berry:['meat',1,'열매']}[r.type];s[gain[0]]+=gain[1];r.n--;toast(`${gain[2]} +1`);if(r.n<=0){s.resources.splice(s.resources.indexOf(r),1);setTimeout(()=>spawnRes(r.type,500,1600),2500)}if(s.story===0&&s.wood>=6&&s.stone>=4)advanceStory(1);save();updateUI()}
function attack(){if(cool>0)return;cool=.38;let target=null,bd=145;for(const e of s.enemies){const d=D(s.player,e);if(d<bd){bd=d;target=e}}if(!target){toast('공격할 적이 가까이 없어');return}const dmg=5+s.weaponBonus;target.hp-=dmg;flash(target.x,target.y,'#ffb34d');target.agg=true;toast(`-${dmg}`);if(target.hp<=0){const i=s.enemies.indexOf(target);s.enemies.splice(i,1);s.meat+=1;s.particles.push({x:target.x,y:target.y,t:1,txt:'+먹이'});if(s.story===2&&s.enemies.filter(e=>e.kind==='늑대').length<10&&s.enemies.length<9&&night()){s.story=3;advanceStory(3)}}save();updateUI()}
function flash(px,py,col){for(let i=0;i<5;i++)s.particles.push({x:px+R(-8,8),y:py+R(-8,8),t:1,col})}
function updateComp(dt){if(!s.companion)return;const q=s.companions[0];if(!q)return;const target=s.enemies.reduce((a,e)=>e.agg&&(!a||D(q,e)<D(q,a)?e:a),null);if(s.companion==='늑대'&&target){const d=D(q,target);if(d>48){q.x+=(target.x-q.x)/d*q.speed*dt;q.y+=(target.y-q.y)/d*q.speed*dt}else if(q.cd<=0){target.hp-=q.atk;q.cd=1.1;flash(target.x,target.y,'#ccecff')}}else{const d=D(q,s.player);if(d>65){q.x+=(s.player.x-q.x)/d*q.speed*dt;q.y+=(s.player.y-q.y)/d*q.speed*dt}else{q.wanderT-=dt;if(q.wanderT<=0){q.wander=Math.random()*6.28;q.wanderT=R(.7,1.8)}q.x+=Math.cos(q.wander)*18*dt;q.y+=Math.sin(q.wander)*18*dt}}q.x=clamp(q.x,50,W-50);q.y=clamp(q.y,50,H-50);q.cd=Math.max(0,q.cd-dt);if(s.companion==='사슴'&&q.cd<=0){s.hp=Math.min(s.maxHp,s.hp+2);q.cd=2}}
function updateEnemies(dt){for(const e of s.enemies){const d=D(e,s.player);if(night()&&d<520)e.agg=true;if(e.agg){if(d>38){e.x+=(s.player.x-e.x)/Math.max(d,1)*e.speed*dt;e.y+=(s.player.y-e.y)/Math.max(d,1)*e.speed*dt}else if(e.cd<=0){s.hp-=e.atk;e.cd=1.2;flash(s.player.x,s.player.y,'#ff6670')}}else{e.x+=Math.cos(e.x*.005+e.y*.002)*e.speed*.15*dt;e.y+=Math.sin(e.y*.004)*e.speed*.15*dt}e.cd=Math.max(0,e.cd-dt);e.x=clamp(e.x,40,W-40);e.y=clamp(e.y,40,H-40)}}
function update(dt){cool=Math.max(0,cool-dt);gatherCool=Math.max(0,gatherCool-dt);const speed=170,fx=joyX,fy=joyY;let mx=fx,my=fy;if(!joy){mx=0;my=0}s.player.x=clamp(s.player.x+mx*speed*dt,35,W-35);s.player.y=clamp(s.player.y+my*speed*dt,35,H-35);s.time+=dt*38;if(s.time>=1440){s.time=0;s.day++;if(s.day%1===0)toast(`${s.day}일차 생존`);for(let i=0;i<4;i++)spawnEnemy(['늑대','멧돼지','거미'][Math.floor(Math.random()*3)]);save()}updateComp(dt);updateEnemies(dt);for(const p of s.particles)p.t-=dt;s.particles=s.particles.filter(p=>p.t>0);if(s.hp<=0){s.hp=0;E.deadText.textContent=`${s.day}일차에서 생존이 끝났어.`;E.dead.style.display='grid'}}
function worldToScreen(px,py){return {x:px-s.player.x+sw/2,y:py-s.player.y+sh/2}}
function drawTree(X,Y,scale){x.save();x.translate(X,Y);x.fillStyle='#0004';x.beginPath();x.ellipse(0,18*scale,30*scale,10*scale,0,0,Math.PI*2);x.fill();x.fillStyle='#5b3825';x.fillRect(-6*scale,3*scale,12*scale,31*scale);x.fillStyle='#286041';x.beginPath();x.arc(0,-4*scale,24*scale,0,7);x.fill();x.fillStyle='#39784c';x.beginPath();x.arc(-14*scale,-8*scale,16*scale,0,7);x.arc(14*scale,-5*scale,16*scale,0,7);x.fill();x.restore()}
function drawRock(X,Y,scale){x.save();x.translate(X,Y);x.fillStyle='#0004';x.beginPath();x.ellipse(0,9*scale,23*scale,8*scale,0,0,7);x.fill();x.fillStyle='#68736f';x.beginPath();x.moveTo(-22*scale,6*scale);x.lineTo(-10*scale,-13*scale);x.lineTo(9*scale,-16*scale);x.lineTo(23*scale,-1*scale);x.lineTo(15*scale,11*scale);x.lineTo(-14*scale,13*scale);x.closePath();x.fill();x.restore()}
function drawAnimal(q,col,ear){x.save();x.translate(q.x,q.y);x.fillStyle='#0005';x.beginPath();x.ellipse(0,q.r*.7,q.r*1.2,q.r*.45,0,0,7);x.fill();x.fillStyle=col;x.beginPath();x.ellipse(0,0,q.r*1.0,q.r*.72,0,0,7);x.fill();x.beginPath();x.arc(q.r*.9,-q.r*.2,q.r*.48,0,7);x.fill();x.fillStyle=ear||col;x.beginPath();x.moveTo(q.r*.6,-q.r*.45);x.lineTo(q.r*.75,-q.r*1.05);x.lineTo(q.r*.95,-q.r*.55);x.fill();x.fillStyle='#111';x.beginPath();x.arc(q.r*1.05,-q.r*.32,2.2,0,7);x.fill();x.restore()}
function drawPlayer(){const X=sw/2,Y=sh/2;x.save();x.translate(X,Y);x.fillStyle='#0005';x.beginPath();x.ellipse(0,17,22,8,0,0,7);x.fill();x.fillStyle='#d7b58a';x.beginPath();x.arc(0,-4,17,0,7);x.fill();x.fillStyle='#476a7c';x.fillRect(-13,8,26,21);x.fillStyle='#2b2f35';x.fillRect(-13,-25,26,9);x.fillStyle='#fff';x.fillRect(-9,-18,6,4);x.fillRect(3,-18,6,4);x.fillStyle='#f3a536';x.fillRect(24,-2,10,4);x.restore()}
function draw(){const sky=night()?'#07131a':'#87c979';const grd=x.createLinearGradient(0,0,0,sh);grd.addColorStop(0,sky);grd.addColorStop(1,night()?'#0d2119':'#467f49');x.fillStyle=grd;x.fillRect(0,0,sw,sh);x.globalAlpha=.18;for(let i=0;i<40;i++){const px=((i*313)-s.player.x*.12)%sw,py=((i*197)-s.player.y*.12)%sh;x.fillStyle= i%3?'#fff':'#173d24';x.beginPath();x.arc(px,py,1.5,0,7);x.fill()}x.globalAlpha=1;for(const r of s.resources){const q=worldToScreen(r.x,r.y);if(q.x<-60||q.x>sw+60||q.y<-60||q.y>sh+60)continue;if(r.type==='tree')drawTree(q.x,q.y,1);else if(r.type==='stone')drawRock(q.x,q.y,1);else{ x.fillStyle=r.type==='berry'?'#7c294a':'#7e9a4a';x.beginPath();x.arc(q.x,q.y,7,0,7);x.fill(); }}for(const e of s.enemies){const q=worldToScreen(e.x,e.y);drawAnimal({...e,x:q.x,y:q.y},e.kind==='늑대'?'#6d757e':e.kind==='멧돼지'?'#795b48':'#394d3e',e.kind==='거미'?'#25362b':undefined);x.fillStyle='#0008';x.fillRect(q.x-20,q.y-e.r-13,40,4);x.fillStyle='#e74b4b';x.fillRect(q.x-20,q.y-e.r-13,40*Math.max(0,e.hp/e.maxHp),4)}if(s.companion&&s.companions[0]){const q=worldToScreen(s.companions[0].x,s.companions[0].y);const col={여우:'#c76b38',늑대:'#737b83',사슴:'#a97d58'}[s.companion];drawAnimal({...s.companions[0],x:q.x,y:q.y},col);x.fillStyle='#ffe08a';x.font='10px system-ui';x.textAlign='center';x.fillText(s.companion,q.x,q.y-s.companions[0].r-9)}drawPlayer();for(const p of s.particles){const q=worldToScreen(p.x,p.y);x.fillStyle=p.col||'#ffd56a';x.globalAlpha=Math.max(0,p.t);x.beginPath();x.arc(q.x,q.y,4,0,7);x.fill();if(p.txt){x.font='11px system-ui';x.fillText(p.txt,q.x,q.y-15)}}x.globalAlpha=1;if(night()){x.fillStyle='#02101999';x.fillRect(0,0,sw,sh);x.fillStyle='#fff7';for(let i=0;i<30;i++){x.beginPath();x.arc((i*97)%sw,(i*43)%sh,1,0,7);x.fill()}}}
function updateUI(){E.hp.textContent=`${Math.round(s.hp)}/${s.maxHp}`;E.hpbar.style.width=`${s.hp/s.maxHp*100}%`;E.atk.textContent=5+s.weaponBonus;E.comp.textContent=s.companion||'없음';E.phase.textContent=night()?'🌙 밤':'☀️ 낮';const hh=Math.floor(s.time/60)%24,mm=Math.floor(s.time%60);E.clock.textContent=`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;E.day.textContent=s.day;E.wood.textContent=s.wood;E.stone.textContent=s.stone;E.fiber.textContent=s.fiber;E.meat.textContent=s.meat}
function open(id){document.querySelectorAll('.panel').forEach(p=>p.style.display='none');document.getElementById(id).style.display='block';if(id==='story')renderStory();if(id==='comp')renderComp();if(id==='craft')renderCraft();if(id==='inv')renderInv()}
document.getElementById('storyBtn').onclick=()=>open('story');document.getElementById('compBtn').onclick=()=>open('comp');document.getElementById('craftBtn').onclick=()=>open('craft');document.getElementById('invBtn').onclick=()=>open('inv');document.getElementById('gatherBtn').onclick=gather;document.getElementById('attackBtn').onclick=attack;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.close).style.display='none');document.getElementById('restart').onclick=()=>location.reload();
function setJoy(e){const r=document.getElementById('joystick').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,len=Math.hypot(dx,dy)||1;const k=Math.min(1,len/(r.width*.33));joyX=dx/len*k;joyY=dy/len*k;document.getElementById('stick').style.transform=`translate(${joyX*38}px,${joyY*38}px)`}
const J=document.getElementById('joystick');J.addEventListener('pointerdown',e=>{joy=true;J.setPointerCapture(e.pointerId);setJoy(e)});J.addEventListener('pointermove',e=>joy&&setJoy(e));J.addEventListener('pointerup',()=>{joy=false;joyX=joyY=0;document.getElementById('stick').style.transform=''});J.addEventListener('pointercancel',()=>{joy=false;joyX=joyY=0;document.getElementById('stick').style.transform=''});
window.advanceStory=advanceStory;window.tame=tame;window.selectComp=selectComp;window.craft=craft;
try{const raw=localStorage.getItem(SAVE);if(raw){Object.assign(s,JSON.parse(raw));s.resources=Array.isArray(s.resources)?s.resources:[];s.enemies=Array.isArray(s.enemies)?s.enemies:[];s.companions=Array.isArray(s.companions)?s.companions:[];if(!s.resources.length)seed();}else seed()}catch(e){seed()}updateUI();renderStory();
function loop(t){const dt=Math.min(.035,(t-last)/1000);last=t;update(dt);draw();updateUI();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></div></body></html>
