<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>숲의 생존자들</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08130e;color:#fff;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;touch-action:none}#app{position:relative;width:100%;height:100%;overflow:hidden}canvas{display:block;width:100%;height:100%}.top{position:absolute;z-index:5;left:8px;right:8px;top:8px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.card{min-width:145px;padding:8px 10px;border-radius:13px;border:1px solid #fff3;background:#06110ddd;box-shadow:0 5px 18px #0005;backdrop-filter:blur(4px);font-size:12px;font-weight:900;line-height:1.4}.bar{height:7px;margin-top:4px;border-radius:8px;background:#ffffff26;overflow:hidden}.bar i{display:block;height:100%;background:#e84b45;width:100%}.small{font-size:10px;opacity:.88}.right{position:absolute;z-index:8;right:9px;top:67px;display:grid;gap:6px}.btn{min-width:88px;border:1px solid #fff3;border-radius:11px;background:#09150fe8;color:#fff;padding:9px 10px;font-size:11px;font-weight:900;box-shadow:0 4px 12px #0004}.btn:active{transform:scale(.97)}.attack{position:absolute;z-index:9;right:12px;bottom:20px;min-width:110px;min-height:61px;background:#873026}.joystick{position:absolute;z-index:9;left:17px;bottom:19px;width:128px;height:128px;border-radius:50%;border:2px solid #ffffff24;background:#ffffff10;box-shadow:inset 0 0 20px #0004}.stick{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;border:2px solid #fff4;background:#d9ead94d}.hint{position:absolute;z-index:4;left:50%;bottom:9px;transform:translateX(-50%);padding:6px 9px;border-radius:10px;background:#06100eaa;font-size:10px;font-weight:800;white-space:nowrap}.panel{position:absolute;z-index:30;left:9px;right:9px;top:62px;bottom:9px;display:none;padding:12px;border-radius:17px;border:1px solid #ffffff2f;background:#071019f7;overflow:auto;touch-action:pan-y;box-shadow:0 12px 35px #0009}.panel h2{margin:0 0 10px;font-size:19px}.close{float:right;border:0;border-radius:9px;background:#ffffff15;color:#fff;padding:7px 9px;font-weight:900}.item{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:7px 0;padding:10px;border-radius:12px;background:#11252b;border:1px solid #ffffff10}.item small{display:block;opacity:.72;font-size:10px;margin-top:3px}.item button,.choice button{border:0;border-radius:9px;background:#2d9666;color:#fff;padding:8px 10px;font-weight:900}.story{border-radius:14px;padding:12px;background:linear-gradient(145deg,#142b30,#0c1a22);border:1px solid #ffffff18;margin-bottom:10px}.story h3{margin:6px 0}.story b{color:#ffd67a}.choice{display:grid;gap:7px;margin-top:9px}.choice button{text-align:left;background:#245b6b}.badge{display:inline-block;padding:4px 7px;border-radius:999px;background:#183d48;color:#8fe6ff;font-size:9px;font-weight:900}.quest{padding:9px;border-radius:11px;background:#10262d;margin:7px 0}.quest strong{display:block;margin-bottom:4px}.heart{color:#ff7ca7}.buildGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.buildGrid button{min-height:48px}.dead{position:absolute;z-index:50;inset:0;display:none;place-items:center;background:#000b}.deadCard{width:min(90%,360px);padding:20px;border:1px solid #ffffff2b;border-radius:18px;background:#08121af5;text-align:center}.deadCard button{border:0;border-radius:11px;background:#33865f;color:#fff;padding:10px 15px;font-weight:900}
</style>
</head>
<body><div id="app">
<canvas id="game"></canvas>
<div class="top"><div class="card">❤️ <span id="hp">100/100</span><div class="bar"><i id="hpbar"></i></div><span class="small">⚔️ <span id="atk">5</span> · 동료 <span id="companion">없음</span></span></div><div class="card"><span id="phase">☀️ 낮</span> · <span id="clock">08:00</span><br><span class="small">📅 <span id="day">1</span>일 · 🪵<span id="wood">0</span> 🪨<span id="stone">0</span> 🌿<span id="fiber">0</span> 🍖<span id="meat">0</span></span></div></div>
<div class="right"><button class="btn" id="storyBtn">📖 퀘스트</button><button class="btn" id="compBtn">👩 동료</button><button class="btn" id="houseBtn">🏠 하우징</button><button class="btn" id="craftBtn">🛠 제작</button><button class="btn" id="invBtn">🎒 가방</button><button class="btn" id="gatherBtn">✋ 채집</button></div>
<button class="btn attack" id="attackBtn">⚔️ 공격</button>
<div class="joystick" id="joystick"><div class="stick" id="stick"></div></div><div class="hint">탐험 → 퀘스트 → 동료 → 집 → 보스</div>
<div class="panel" id="story"><button class="close" data-close="story">닫기</button><h2>📖 메인 퀘스트</h2><div id="storyBody"></div></div>
<div class="panel" id="comp"><button class="close" data-close="comp">닫기</button><h2>👩 여성 동료</h2><div id="compList"></div></div>
<div class="panel" id="house"><button class="close" data-close="house">닫기</button><h2>🏠 하우징</h2><p class="small">건물은 현재 위치 주변에 설치돼. 월드에 남고 다음 날짜에 저장돼.</p><div id="houseList"></div></div>
<div class="panel" id="craft"><button class="close" data-close="craft">닫기</button><h2>🛠 제작</h2><div id="craftList"></div></div>
<div class="panel" id="inv"><button class="close" data-close="inv">닫기</button><h2>🎒 가방</h2><div id="invList"></div></div>
<div class="toast" id="toast"></div><div class="dead" id="dead"><div class="deadCard"><h2>생존 실패</h2><p id="deadText">숲이 너를 삼켰어.</p><button id="restart">다시 시작</button></div></div>
<script>
// 파일명: web-games/survival2/index.html
// 임포트: 기존 저장 키 유지 / 외부 에셋 최소화
// 메인: 숲의 생존자들 / 성인 여성 동료 소환 / 연애 / 하우징 / 퀘스트 / 스토리 보스
const c=document.getElementById('game'),x=c.getContext('2d');
const E={hp:document.getElementById('hp'),hpbar:document.getElementById('hpbar'),atk:document.getElementById('atk'),companion:document.getElementById('companion'),phase:document.getElementById('phase'),clock:document.getElementById('clock'),day:document.getElementById('day'),wood:document.getElementById('wood'),stone:document.getElementById('stone'),fiber:document.getElementById('fiber'),meat:document.getElementById('meat'),story:document.getElementById('storyBody'),comp:document.getElementById('compList'),house:document.getElementById('houseList'),craft:document.getElementById('craftList'),inv:document.getElementById('invList'),toast:document.getElementById('toast'),dead:document.getElementById('dead'),deadText:document.getElementById('deadText')};
const SAVE='jaewoon-survival2-v2',W=4200,H=4200;
let sw=innerWidth,sh=innerHeight,dpr=1,joyX=0,joyY=0,joy=false,last=performance.now(),cool=0,gatherCool=0,toastTimer=0,attackFlash=0;
const defaultState={day:1,time:480,hp:100,maxHp:100,wood:0,stone:0,fiber:0,meat:0,weapon:'맨손',weaponBonus:0,story:0,storyKills:0,bosses:{alpha:false,guardian:false,final:false},flags:{yuna:false,sera:false,mira:false,ria:false},companion:null,companionHp:0,romance:{유나:0,세라:0,미라:0,리아:0},housing:[],player:{x:2100,y:2100},resources:[],enemies:[],npcs:[],particles:[]};
const s=structuredClone(defaultState);
const companions={유나:{role:'전사',hp:115,atk:18,speed:88,r:18,color:'#b58c7b',hair:'#3b2630'},세라:{role:'궁수',hp:75,atk:13,speed:94,r:16,color:'#8fa8c8',hair:'#6a3d25'},미라:{role:'의무병',hp:85,atk:6,speed:78,r:16,color:'#93b88b',hair:'#58352a'},리아:{role:'탐험가',hp:90,atk:9,speed:92,r:17,color:'#c6a16c',hair:'#4a3323'}};
function resize(){dpr=Math.min(2,devicePixelRatio||1);sw=innerWidth;sh=innerHeight;c.width=sw*dpr;c.height=sh*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function R(a,b){return a+Math.random()*(b-a)}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function D(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function night(){return s.time>=1260||s.time<360}
function toast(t){E.toast.textContent=t;E.toast.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>E.toast.style.display='none',1200)}
// 저장은 날짜가 넘어가는 순간만 수행
function saveAtDayChange(){try{localStorage.setItem(SAVE,JSON.stringify(s))}catch(e){}}
function seed(){s.resources=[];s.enemies=[];for(let i=0;i<85;i++)spawnRes(['tree','tree','tree','stone','stone','fiber','berry'][i%7],180,1650);for(let i=0;i<10;i++)spawnEnemy(['늑대','거미','멧돼지'][i%3]);s.npcs=[{type:'유나',x:2380,y:2030,met:false},{type:'세라',x:3250,y:2320,met:false},{type:'미라',x:1550,y:3000,met:false},{type:'리아',x:2850,y:3320,met:false}]}
function spawnRes(type,min,max){const a=R(0,Math.PI*2),d=R(min,max);s.resources.push({type,x:clamp(s.player.x+Math.cos(a)*d,70,W-70),y:clamp(s.player.y+Math.sin(a)*d,70,H-70),n:type==='tree'?4:type==='stone'?3:type==='fiber'?4:3})}
function spawnEnemy(kind,boss=false){const a=R(0,Math.PI*2),d=R(800,1700);const data={늑대:[55,10,62,18],멧돼지:[90,14,45,21],거미:[45,8,70,15],숲의알파:[420,28,58,34],연구소수호자:[700,38,42,42],숲의핵:[1200,55,34,48]}[kind];s.enemies.push({kind,boss,x:clamp(s.player.x+Math.cos(a)*d,60,W-60),y:clamp(s.player.y+Math.sin(a)*d,60,H-60),hp:data[0],maxHp:data[0],atk:data[1],speed:data[2],r:data[3],cd:R(.2,1.5),agg:boss||kind==='숲의알파'||kind==='연구소수호자'||kind==='숲의핵'})}
function human(type,obj){const m=companions[type];return Object.assign({type,x:obj?.x??s.player.x-55,y:obj?.y??s.player.y+55,hp:m.hp,maxHp:m.hp,atk:m.atk,speed:m.speed,r:m.r,role:m.role,color:m.color,hair:m.hair,cd:0,attackT:0},obj||{})}
function maybeBosses(){if(s.day>=3&&!s.bosses.alpha&&!s.enemies.some(e=>e.kind==='숲의알파'))spawnEnemy('숲의알파',true);if(s.day>=5&&!s.bosses.guardian&&!s.enemies.some(e=>e.kind==='연구소수호자'))spawnEnemy('연구소수호자',true);if(s.day>=7&&!s.bosses.final&&!s.enemies.some(e=>e.kind==='숲의핵'))spawnEnemy('숲의핵',true)}
function storyText(){if(s.story===0)return `<div class="story"><span class="badge">제1장 · 추락</span><h3>바이브2호 생존기</h3><p>폭풍 속에서 바이브2호가 미지의 숲으로 추락했다. 통신기는 깨졌고, 주변엔 오래된 건물과 누군가의 흔적이 남아 있다.</p><p><b>목표</b> · 나무 6 · 돌 4 · 모닥불 역할의 야영지 건설</p></div><div class="quest">현재 진행도: 나무 ${Math.min(6,s.wood)}/6 · 돌 ${Math.min(4,s.stone)}/4</div><div class="choice"><button onclick="advanceStory(1)">준비를 마쳤다</button></div>`;
if(s.story===1)return `<div class="story"><span class="badge">제2장 · 사람의 흔적</span><h3>첫 생존자, 유나</h3><p>숲속에서 성인 여성 생존자를 발견했다. 그녀는 혼자서 멧돼지를 막아내고 있었다.</p><p><b>목표</b> · 유나와 대화하고 동료로 영입</p></div><div class="choice"><button onclick="meet('유나')">유나에게 다가간다</button></div>`;
if(s.story===2)return `<div class="story"><span class="badge">제3장 · 검은 숲</span><h3>밤의 포식자</h3><p>밤마다 숲의 괴물들이 가까워진다. 유나와 함께 안전지대를 확보해야 한다.</p><p><b>목표</b> · 적 6마리 처치 · 숲의 알파 토벌</p></div><div class="quest">처치 ${s.storyKills}/6 · 알파 ${s.bosses.alpha?'토벌 완료':'대기'}</div>`;
if(s.story===3)return `<div class="story"><span class="badge">제4장 · 생존자들</span><h3>흩어진 사람들</h3><p>숲에는 더 많은 생존자들이 있다. 세라, 미라, 리아와 합류하면 탈출 준비가 빨라진다.</p><p><b>목표</b> · 생존자 3명 추가 영입 · 동료방 2개 건설</p></div><div class="quest">영입 ${[s.flags.yuna,s.flags.sera,s.flags.mira,s.flags.ria].filter(Boolean).length}/4 · 동료방 ${s.housing.filter(b=>b.type==='동료방').length}/2</div>`;
if(s.story===4)return `<div class="story"><span class="badge">제5장 · 연구소</span><h3>숲 아래의 비밀</h3><p>폐허 아래 숨겨진 연구소에서 숲을 변형시킨 실험 기록이 발견됐다. 연구소 수호자를 쓰러뜨리고 탈출 좌표를 확보하자.</p><p><b>목표</b> · 연구소 수호자 토벌</p></div>`;
return `<div class="story"><span class="badge">최종장 · 귀환</span><h3>숲의 핵</h3><p>숲의 중심에는 모든 괴물을 움직이는 핵이 있었다. 핵을 파괴하면 구조 신호를 보낼 수 있다.</p><p><b>최종 목표</b> · 숲의 핵 토벌 · 7일차 이후 구조선 호출</p></div>`}
function advanceStory(n){if(n===1&&!(s.wood>=6&&s.stone>=4)){toast('재료가 부족해');return}s.story=n;renderStory()}
function meet(type){if(s.companion&&s.companion!==type){toast('현재 동료를 먼저 해제해');return}const npc=s.npcs.find(n=>n.type===type);if(npc&&!npc.met){npc.met=true;s.flags[{유나:'yuna',세라:'sera',미라:'mira',리아:'ria'}[type]]=true;s.companion=type;s.companionHp=companions[type].hp;s.romance[type]=10;toast(`${type}가 동료가 됐어`);if(type==='유나')s.story=2;else if([s.flags.sera,s.flags.mira,s.flags.ria].filter(Boolean).length>=2)s.story=4;renderStory();renderComp()}}
function summon(type){if(!s.flags[{유나:'yuna',세라:'sera',미라:'mira',리아:'ria'}[type]]){toast('아직 영입하지 않았어');return}s.companion=type;s.companionsActive=undefined;s.companionHp=Math.min(companions[type].hp,Math.max(1,s.companionHp||companions[type].hp));toast(`${type} 소환 완료`);renderComp()}
function unsummon(){if(!s.companion)return;toast(`${s.companion} 해제`);s.companion=null;renderComp()}
function romance(type,kind){if(!s.flags[{유나:'yuna',세라:'sera',미라:'mira',리아:'ria'}[type]])return;if(kind==='talk')s.romance[type]=clamp((s.romance[type]||0)+4,0,100);if(kind==='gift'){if(s.meat<2){toast('선물용 먹이 2개가 필요해');return}s.meat-=2;s.romance[type]=clamp((s.romance[type]||0)+8,0,100)}const v=s.romance[type];toast(`${type} 호감도 ${v}`);renderComp()}
function renderStory(){E.story.innerHTML=storyText()}
function renderComp(){const names=['유나','세라','미라','리아'];E.comp.innerHTML='<div class="item"><span><b>활성 소환칸</b><small>한 번에 성인 여성 동료 1명만 전투에 참여해.</small></span><button onclick="unsummon()">해제</button></div>'+names.map(t=>{const unlocked=s.flags[{유나:'yuna',세라:'sera',미라:'mira',리아:'ria'}[t]],v=s.romance[t]||0,m=companions[t];return `<div class="item"><span><b>${t}</b><small>${m.role} · HP ${m.hp} · 공격 ${m.atk}<br><span class="heart">♥ 호감도 ${v}/100</span></small></span><div><button onclick="summon('${t}')">${s.companion===t?'소환 중':'소환'}</button><button onclick="romance('${t}','talk')">대화</button><button onclick="romance('${t}','gift')">선물</button></div></div>`}).join('')}
const structures=[['야영지','wood',6,'초기 거점'],['벽','wood',5,'방어용 벽'],['침대','wood',8,'휴식 장소'],['작업대','wood',10,'제작 강화'],['동료방','wood',14,'동료 개인 공간']];
function renderHouse(){E.house.innerHTML=`<div class="buildGrid">${structures.map(a=>`<button class="btn" onclick="build('${a[0]}','${a[1]}',${a[2]})">🏠 ${a[0]}<br><span class="small">🪵 ${a[2]} · ${a[3]}</span></button>`).join('')}</div><div class="quest">건물 ${s.housing.length}개 · 동료방 ${s.housing.filter(b=>b.type==='동료방').length}개</div>`}
function build(type,res,cost){if(s[res]<cost){toast('자원이 부족해');return}s[res]-=cost;const a=R(0,Math.PI*2),d=R(55,105);s.housing.push({type,x:s.player.x+Math.cos(a)*d,y:s.player.y+Math.sin(a)*d});toast(`${type} 건설 완료`);if(s.story===0&&s.wood>=0&&s.stone>=0&&s.housing.some(b=>b.type==='야영지'))s.story=1;renderStory();renderHouse()}
const recipes=[['돌도끼',6,0,2,4],['돌창',7,3,2,9],['붕대',2,0,1,0],['강화창',12,6,4,17]];
function renderCraft(){E.craft.innerHTML=recipes.map(r=>`<div class="item"><span><b>${r[0]}</b><small>🪵 ${r[1]} · 🪨 ${r[2]} · 🌿 ${r[3]}<br>공격 +${r[4]}</small></span><button onclick="craft('${r[0]}')">제작</button></div>`).join('')}
function craft(n){const r=recipes.find(a=>a[0]===n);if(!r||s.wood<r[1]||s.stone<r[2]||s.fiber<r[3]){toast('재료가 부족해');return}s.wood-=r[1];s.stone-=r[2];s.fiber-=r[3];if(n==='붕대'){s.hp=Math.min(s.maxHp,s.hp+30);toast('체력 +30')}else{s.weapon=n;s.weaponBonus=r[4];toast(`${n} 장착`)} }
function renderInv(){E.inv.innerHTML=`<div class="item"><span>🗡 무기<small>${s.weapon} · 공격 +${s.weaponBonus}</small></span></div><div class="item"><span>🍖 먹이<small>${s.meat}개</small></span><button onclick="eat()">먹기</button></div><div class="item"><span>🏠 건물<small>${s.housing.length}개</small></span></div>`}
function eat(){if(!s.meat){toast('먹이가 없어');return}s.meat--;s.hp=Math.min(s.maxHp,s.hp+18);toast('체력 +18')}
function closestResource(){let z=null,bd=86;for(const r of s.resources){const d=D(s.player,r);if(d<bd){bd=d;z=r}}return z}
function gather(){if(gatherCool>0)return;const r=closestResource();if(!r){toast('자원에 더 가까이 가');return}gatherCool=.3;const key={tree:['wood','나무'],stone:['stone','돌'],fiber:['fiber','섬유'],berry:['meat','열매']}[r.type];s[key[0]]++;r.n--;toast(`${key[1]} +1`);if(r.n<=0){s.resources.splice(s.resources.indexOf(r),1);setTimeout(()=>spawnRes(r.type,500,1600),1800)}if(s.story===0&&s.wood>=6&&s.stone>=4&&s.housing.some(b=>b.type==='야영지')){s.story=1;renderStory()}}
function attack(){if(cool>0)return;cool=.42;attackFlash=.18;let target=null,bd=155;for(const e of s.enemies){const d=D(s.player,e);if(d<bd&&(!target||e.boss||d<bd)){target=e;bd=d}}if(!target){toast('적이 가까이 없어');return}const dmg=5+s.weaponBonus;target.hp-=dmg;target.agg=true;flash(target.x,target.y,'#ffd66b');if(target.hp<=0){const boss=target.boss;s.enemies.splice(s.enemies.indexOf(target),1);s.meat+=boss?5:1;toast(boss?`${target.kind} 토벌!`:`${target.kind} 처치`);if(s.story===2&&target.kind==='숲의알파'){s.bosses.alpha=true;s.story=3}if(s.story===4&&target.kind==='연구소수호자'){s.bosses.guardian=true;s.story=5}if(s.story===5&&target.kind==='숲의핵'){s.bosses.final=true;toast('숲의 핵을 파괴했어');}}}
function flash(px,py,col){for(let i=0;i<7;i++)s.particles.push({x:px+R(-10,10),y:py+R(-10,10),t:.8,col})}
function updateComp(dt){if(!s.companion)return;const m=companions[s.companion];let q={type:s.companion,...m,x:companionObj.x,y:companionObj.y,hp:s.companionHp,maxHp:m.hp,atk:m.atk,speed:m.speed,r:m.r,cd:companionObj.cd||0,attackT:companionObj.attackT||0};let target=null;if(s.companion==='유나')target=s.enemies.find(e=>e.agg&&D(q,e)<320);else if(s.companion==='세라')target=s.enemies.find(e=>e.agg&&D(q,e)<520);if(target){const d=D(q,target);if(d>(s.companion==='세라'?180:46)){q.x+=(target.x-q.x)/d*q.speed*dt;q.y+=(target.y-q.y)/d*q.speed*dt}else if(q.cd<=0){target.hp-=q.atk;q.cd=s.companion==='세라'?1.4:1;flash(target.x,target.y,'#bde5ff')}}else{const d=D(q,s.player);if(d>72){q.x+=(s.player.x-q.x)/Math.max(1,d)*q.speed*dt;q.y+=(s.player.y-q.y)/Math.max(1,d)*q.speed*dt}}q.cd=Math.max(0,q.cd-dt);if(s.companion==='미라'&&q.cd<=0){s.hp=Math.min(s.maxHp,s.hp+3);q.cd=2.5}if(s.companion==='리아'){const near=closestResource();if(near&&D(q,near)<120&&Math.random()<dt*.8){const key={tree:'wood',stone:'stone',fiber:'fiber',berry:'meat'}[near.type];s[key]++;near.n--;if(near.n<=0)s.resources.splice(s.resources.indexOf(near),1)}}companionObj=q;s.companionHp=Math.max(0,q.hp);if(s.companionHp<=0){toast(`${s.companion}가 쓰러졌어`);s.companion=null;s.companionHp=0}}
let companionObj={x:2040,y:2040,cd:0,attackT:0};
function updateEnemies(dt){for(const e of s.enemies){if(!e.agg&&night()&&D(e,s.player)<620)e.agg=true;const d=D(e,s.player);if(e.agg){if(d>42){e.x+=(s.player.x-e.x)/Math.max(1,d)*e.speed*dt;e.y+=(s.player.y-e.y)/Math.max(1,d)*e.speed*dt}else if(e.cd<=0){s.hp-=e.atk;e.cd=e.boss?1.05:1.25;flash(s.player.x,s.player.y,'#ff6670')}}else{e.x+=Math.cos(e.x*.004+e.y*.002)*e.speed*.12*dt;e.y+=Math.sin(e.y*.003)*e.speed*.12*dt}e.cd=Math.max(0,e.cd-dt);e.x=clamp(e.x,40,W-40);e.y=clamp(e.y,40,H-40)}}
function update(dt){cool=Math.max(0,cool-dt);gatherCool=Math.max(0,gatherCool-dt);if(joy){s.player.x=clamp(s.player.x+joyX*180*dt,35,W-35);s.player.y=clamp(s.player.y+joyY*180*dt,35,H-35)}s.time+=dt*38;if(s.time>=1440){s.time=0;s.day++;for(let i=0;i<5;i++)spawnEnemy(['늑대','거미','멧돼지'][Math.floor(Math.random()*3)]);maybeBosses();saveAtDayChange();toast(`${s.day}일차 시작 · 저장 완료`)}updateComp(dt);updateEnemies(dt);for(const p of s.particles)p.t-=dt;s.particles=s.particles.filter(p=>p.t>0);maybeBosses();if(s.hp<=0){s.hp=0;E.deadText.textContent=`${s.day}일차에서 생존이 끝났어.`;E.dead.style.display='grid'}}
function worldToScreen(px,py){return{x:px-s.player.x+sw/2,y:py-s.player.y+sh/2}}
function drawHuman(q,skin,hair,shirt){x.save();x.translate(q.x,q.y);x.fillStyle='#0005';x.beginPath();x.ellipse(0,22,23,8,0,0,7);x.fill();x.fillStyle=skin;x.beginPath();x.arc(0,-18,12,0,7);x.fill();x.fillStyle=hair;x.beginPath();x.arc(0,-22,13,Math.PI,Math.PI*2);x.fill();x.fillStyle=shirt;x.fillRect(-13,-5,26,30);x.fillStyle='#222';x.fillRect(-10,25,7,12);x.fillRect(3,25,7,12);x.fillStyle='#fff';x.fillRect(-6,-19,3,3);x.fillRect(3,-19,3,3);x.restore()}
function drawEnemy(e,q){x.save();x.translate(q.x,q.y);x.fillStyle='#0005';x.beginPath();x.ellipse(0,e.r*.7,e.r*1.2,e.r*.45,0,0,7);x.fill();x.fillStyle=e.boss?(e.kind==='숲의핵'?'#a43d7c':'#7a5145'):(e.kind==='늑대'?'#6d757e':e.kind==='멧돼지'?'#795b48':'#394d3e');x.beginPath();x.ellipse(0,0,e.r*1.0,e.r*.72,0,0,7);x.fill();x.fillStyle='#111';x.beginPath();x.arc(e.r*.75,-4,2.4,0,7);x.arc(e.r*.9,-4,2.4,0,7);x.fill();x.restore()}
function draw(){const grd=x.createLinearGradient(0,0,0,sh);grd.addColorStop(0,night()?'#07131b':'#75bf70');grd.addColorStop(1,night()?'#0b1d17':'#376b3d');x.fillStyle=grd;x.fillRect(0,0,sw,sh);for(let i=0;i<80;i++){const px=((i*277)-s.player.x*.18)%sw,py=((i*173)-s.player.y*.18)%sh;x.fillStyle=i%4?'#ffffff13':'#143d20';x.beginPath();x.arc(px,py,i%5===0?3:1.5,0,7);x.fill()}
for(const b of s.housing){const q=worldToScreen(b.x,b.y);if(q.x<-80||q.x>sw+80||q.y<-80||q.y>sh+80)continue;x.fillStyle=b.type==='벽'?'#78604a':'#9c6f47';x.fillRect(q.x-22,q.y-18,44,34);if(b.type==='동료방'||b.type==='작업대'||b.type==='야영지'){x.fillStyle='#b88b5a';x.fillRect(q.x-18,q.y-33,36,16)}x.fillStyle='#fff';x.font='10px system-ui';x.textAlign='center';x.fillText(b.type,q.x,q.y+8)}
for(const r of s.resources){const q=worldToScreen(r.x,r.y);if(q.x<-60||q.x>sw+60||q.y<-60||q.y>sh+60)continue;if(r.type==='tree'){x.fillStyle='#5d3825';x.fillRect(q.x-5,q.y-3,10,35);x.fillStyle='#2b6c42';x.beginPath();x.arc(q.x,q.y-10,28,0,7);x.fill();x.beginPath();x.arc(q.x-17,q.y-5,18,0,7);x.arc(q.x+17,q.y-7,18,0,7);x.fill()}else if(r.type==='stone'){x.fillStyle='#707975';x.beginPath();x.moveTo(q.x-22,q.y+7);x.lineTo(q.x-9,q.y-13);x.lineTo(q.x+10,q.y-17);x.lineTo(q.x+23,q.y);x.lineTo(q.x+12,q.y+12);x.closePath();x.fill()}else{x.fillStyle=r.type==='berry'?'#7b3155':'#83a65e';x.beginPath();x.arc(q.x,q.y,8,0,7);x.fill()}}
for(const n of s.npcs){if(n.met)continue;const q=worldToScreen(n.x,n.y);const m=companions[n.type];drawHuman({...n,x:q.x,y:q.y},'#e4b79b',m.hair,m.color);x.fillStyle='#ffe082';x.font='10px system-ui';x.textAlign='center';x.fillText(n.type,q.x,q.y-38)}
for(const e of s.enemies){const q=worldToScreen(e.x,e.y);drawEnemy(e,q);x.fillStyle='#0008';x.fillRect(q.x-24,q.y-e.r-15,48,5);x.fillStyle='#e74b4b';x.fillRect(q.x-24,q.y-e.r-15,48*Math.max(0,e.hp/e.maxHp),5);if(e.boss){x.fillStyle='#ffd36e';x.font='10px system-ui';x.textAlign='center';x.fillText(e.kind,q.x,q.y-e.r-22)}}
if(s.companion){const m=companions[s.companion];const q=worldToScreen(companionObj.x,companionObj.y);drawHuman({x:q.x,y:q.y},'#e4b79b',m.hair,m.color);x.fillStyle='#ffd6e6';x.font='10px system-ui';x.textAlign='center';x.fillText(`${s.companion} ♥${s.romance[s.companion]||0}`,q.x,q.y-42);x.fillStyle='#0008';x.fillRect(q.x-22,q.y-m.r-17,44,5);x.fillStyle='#65d383';x.fillRect(q.x-22,q.y-m.r-17,44*(s.companionHp/m.hp),5)}
drawHuman({x:sw/2,y:sh/2},'#dcb095','#2b2424','#466a83');if(attackFlash>0){x.globalAlpha=attackFlash/.18;x.strokeStyle='#fff1aa';x.lineWidth=5;x.beginPath();x.arc(sw/2,sh/2,48,Math.PI*.1,Math.PI*1.05);x.stroke();attackFlash-=.016}
for(const p of s.particles){const q=worldToScreen(p.x,p.y);x.globalAlpha=Math.max(0,p.t);x.fillStyle=p.col||'#ffd56a';x.beginPath();x.arc(q.x,q.y,4,0,7);x.fill()}x.globalAlpha=1;if(night()){x.fillStyle='#020b1399';x.fillRect(0,0,sw,sh)}}
function updateUI(){E.hp.textContent=`${Math.round(s.hp)}/${s.maxHp}`;E.hpbar.style.width=`${s.hp/s.maxHp*100}%`;E.atk.textContent=5+s.weaponBonus;E.companion.textContent=s.companion||'없음';E.phase.textContent=night()?'🌙 밤':'☀️ 낮';const hh=Math.floor(s.time/60)%24,mm=Math.floor(s.time%60);E.clock.textContent=`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;E.day.textContent=s.day;E.wood.textContent=s.wood;E.stone.textContent=s.stone;E.fiber.textContent=s.fiber;E.meat.textContent=s.meat}
function open(id){document.querySelectorAll('.panel').forEach(p=>p.style.display='none');document.getElementById(id).style.display='block';if(id==='story')renderStory();if(id==='comp')renderComp();if(id==='house')renderHouse();if(id==='craft')renderCraft();if(id==='inv')renderInv()}
document.getElementById('storyBtn').onclick=()=>open('story');document.getElementById('compBtn').onclick=()=>open('comp');document.getElementById('houseBtn').onclick=()=>open('house');document.getElementById('craftBtn').onclick=()=>open('craft');document.getElementById('invBtn').onclick=()=>open('inv');document.getElementById('gatherBtn').onclick=gather;document.getElementById('attackBtn').onclick=attack;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.close).style.display='none');document.getElementById('restart').onclick=()=>location.reload();
function setJoy(e){const r=document.getElementById('joystick').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,len=Math.hypot(dx,dy)||1,k=Math.min(1,len/(r.width*.33));joyX=dx/len*k;joyY=dy/len*k;document.getElementById('stick').style.transform=`translate(${joyX*38}px,${joyY*38}px)`}
const J=document.getElementById('joystick');J.addEventListener('pointerdown',e=>{joy=true;J.setPointerCapture(e.pointerId);setJoy(e)});J.addEventListener('pointermove',e=>joy&&setJoy(e));function joyEnd(){joy=false;joyX=joyY=0;document.getElementById('stick').style.transform=''}J.addEventListener('pointerup',joyEnd);J.addEventListener('pointercancel',joyEnd);
window.advanceStory=advanceStory;window.meet=meet;window.summon=summon;window.unsummon=unsummon;window.romance=romance;window.build=build;window.craft=craft;window.eat=eat;
try{const raw=localStorage.getItem(SAVE);if(raw){Object.assign(s,JSON.parse(raw));if(!s.flags)s.flags={};if(!s.romance)s.romance={};if(!Array.isArray(s.housing))s.housing=[];if(!Array.isArray(s.resources)||!s.resources.length)seed();if(!Array.isArray(s.enemies))s.enemies=[];if(!Array.isArray(s.npcs)||!s.npcs.length)seed();if(s.companion){const m=companions[s.companion];companionObj=human(s.companion,{x:s.player.x-55,y:s.player.y+55});s.companionHp=Math.min(m.hp,Math.max(0,s.companionHp||m.hp))}}else seed()}catch(e){Object.assign(s,structuredClone(defaultState));seed()}updateUI();renderStory();
function loop(t){const dt=Math.min(.035,(t-last)/1000);last=t;update(dt);draw();updateUI();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></div></body></html>
