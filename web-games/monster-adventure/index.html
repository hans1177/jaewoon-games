<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#9ad7ff"><title>몬스터 어드벤처 | 재운게임즈</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:#dff4ff;color:#20314b;overscroll-behavior:none}button{font:inherit;touch-action:manipulation}.app{width:min(100%,760px);min-height:100dvh;margin:auto;background:linear-gradient(#8ed9ff 0 32%,#dff8c7 32%);overflow:hidden}.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:rgba(255,255,255,.94);border-bottom:3px solid #4a8ccf}.top a{color:#245995;font-weight:900;text-decoration:none;background:#eef7ff;border:2px solid #91bce4;border-radius:12px;padding:7px 10px}.top strong{font-size:19px;color:#245995}.money{font-size:14px;font-weight:1000;color:#d88a17}.screen{padding:12px 12px 110px}.card{background:rgba(255,255,255,.96);border:3px solid #4378a5;border-radius:18px;box-shadow:0 6px 0 rgba(35,76,111,.18);padding:12px}.hidden{display:none!important}.title{text-align:center;margin:4px 0 8px;font-size:28px;color:#244b85}.sub{text-align:center;margin:0 0 14px;color:#55708a;font-weight:800}.starterGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.starter{border:3px solid #6d94b8;background:#f9fdff;border-radius:16px;padding:9px 5px;text-align:center;font-weight:900;color:#334c68}.starter img{display:block;width:72px;height:72px;margin:0 auto 4px}.starter small{display:block;font-size:11px;color:#718399}.world{display:grid;gap:10px}.playerPanel{display:flex;align-items:center;gap:10px}.avatar{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#fff3ae;border:3px solid #e8a936;font-size:31px}.playerInfo{flex:1}.playerInfo b{display:block;font-size:17px}.stats{display:flex;gap:10px;font-size:12px;font-weight:900;color:#5c6c7b;margin-top:4px}.map{height:250px;position:relative;overflow:hidden;background:linear-gradient(#83cfff 0 46%,#9cdb74 46%);border-radius:20px;border:3px solid #4d7eab}.cloud{position:absolute;background:#fff;border-radius:99px;opacity:.9}.c1{width:90px;height:28px;left:38px;top:28px}.c2{width:65px;height:22px;right:48px;top:55px}.hill{position:absolute;bottom:67px;width:210px;height:90px;background:#70bb62;border-radius:50% 50% 0 0}.h1{left:-55px}.h2{right:-50px;background:#5eaa58}.path{position:absolute;left:50%;bottom:-34px;width:170px;height:205px;background:#d7bd80;transform:translateX(-50%) perspective(200px) rotateX(15deg);clip-path:polygon(38% 0,62% 0,100% 100%,0 100%)}.spot{position:absolute;border:0;border-radius:17px;padding:9px 11px;font-weight:1000;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2)}.spot:disabled{filter:grayscale(1);opacity:.58}.spot1{left:14px;bottom:25px;background:#36a15d}.spot2{right:13px;bottom:86px;background:#8152c8}.spot3{left:50%;top:78px;transform:translateX(-50%);background:#e18335}.guide{text-align:center;background:#fff;border:2px dashed #6a97bb;border-radius:14px;padding:9px;font-size:13px;font-weight:900;color:#4d6580}.party{display:flex;gap:7px;overflow-x:auto;padding:5px 0}.chip{flex:0 0 auto;border:2px solid #91adc5;border-radius:13px;background:#f9fcff;padding:6px 8px;min-width:110px;color:#344e68;text-align:left}.chip img{width:30px;height:30px;vertical-align:middle}.chip b{font-size:12px}.chip small{display:block;font-size:10px}.chip.active{border-color:#287fd0;background:#dff1ff;box-shadow:inset 0 0 0 1px #287fd0}.chip.dead{opacity:.45;filter:grayscale(1)}.battleField{position:relative;height:305px;border:3px solid #4d7eab;border-radius:20px;overflow:hidden;background:linear-gradient(#8dd5ff 0 54%,#b5df74 54%);margin-bottom:10px}.platform{position:absolute;width:175px;height:46px;background:#7dbf65;border-radius:50%;box-shadow:inset 0 -9px 0 #5e9e4c}.enemyPlat{right:8px;top:123px}.myPlat{left:2px;bottom:24px}.monster{position:absolute;width:112px;height:112px;object-fit:contain;filter:drop-shadow(0 7px 3px rgba(0,0,0,.18));transition:transform .2s}.enemyMon{right:39px;top:38px}.myMon{left:38px;bottom:38px;transform:scaleX(-1)}.enemyBox,.myBox{position:absolute;width:185px;background:rgba(255,255,255,.94);border:2px solid #526b84;border-radius:13px;padding:7px}.enemyBox{left:8px;top:12px}.myBox{right:8px;bottom:8px}.boxTop{display:flex;justify-content:space-between;font-size:13px;font-weight:1000}.bar{height:10px;border-radius:99px;overflow:hidden;background:#d8e3eb;margin-top:5px}.bar>i{display:block;height:100%;background:#45b966;width:100%;transition:width .25s}.hpText{font-size:10px;text-align:right;color:#556778;margin-top:2px;font-weight:900}.battleText{min-height:61px;background:#fff;border:3px solid #4d6b88;border-radius:15px;padding:10px 12px;font-weight:900;line-height:1.45;margin-bottom:9px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.action{min-height:54px;border:3px solid #4d6b88;border-radius:14px;background:#fff;font-weight:1000;color:#29455f}.attack{background:#ffdd82;border-color:#c98521}.skill{background:#ff9c83;border-color:#c95b45}.capture{background:#a9ddff;border-color:#4c8fbe}.heal{background:#bff0b5;border-color:#65a95a}.action:disabled{filter:grayscale(.8);opacity:.55}.battlePartyBox{margin-top:9px;padding:8px 9px;background:rgba(255,255,255,.94);border:2px solid #7795af;border-radius:14px}.result{position:fixed;inset:0;display:grid;place-items:center;background:rgba(30,51,71,.72);z-index:20;padding:20px}.resultBox{width:min(100%,380px);background:#fff;border:4px solid #426b90;border-radius:22px;text-align:center;padding:18px}.resultBox h2{margin:0 0 8px}.resultBox p{line-height:1.5;font-weight:800}.resultActions{display:grid;gap:8px}.resultActions.two{grid-template-columns:1fr 1fr}.bigBtn{width:100%;min-height:52px;border:0;border-radius:14px;background:#3789d2;color:#fff;font-size:16px;font-weight:1000}.home{background:#e28b39;box-shadow:0 4px 0 #a85b1a}.field{background:#6e54c7;box-shadow:0 4px 0 #493592}.switchGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.switchBtn{min-height:58px;border:3px solid #4d6b88;border-radius:14px;background:#eef8ff;font-weight:1000;color:#29455f}.switchBtn:disabled{opacity:.45;filter:grayscale(1)}.dexGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.dexItem{display:flex;align-items:center;gap:8px;border:2px solid #9db2c5;border-radius:14px;padding:8px;background:#f9fcff}.dexItem img{width:44px;height:44px}.dexItem.locked{filter:grayscale(1);opacity:.45}.bottom{position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,760px);height:92px;padding:8px 10px max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:rgba(247,252,255,.97);border-top:3px solid #4f7ea9}.nav{border:2px solid #8ca9c3;border-radius:14px;background:#fff;color:#35546f;font-weight:1000}.nav.active{background:#408ed2;color:#fff;border-color:#246cae}@media(max-width:430px){.starter img{width:58px;height:58px}.starter{font-size:13px}.map{height:230px}.battleField{height:285px}.monster{width:94px;height:94px}.enemyMon{right:35px}.myMon{left:32px}.enemyBox,.myBox{width:160px}.title{font-size:24px}.switchGrid{grid-template-columns:1fr}.chip{min-width:96px}}
</style></head><body><div class="app">
<header class="top"><a href="/">← 대문</a><strong>몬스터 어드벤처</strong><span class="money" id="orbCount">포획볼 5</span></header>
<main class="screen">
<section id="startView" class="card"><h1 class="title">첫 몬스터를 골라!</h1><p class="sub">함께 모험할 파트너를 선택하세요.</p><div class="starterGrid"><button class="starter" data-starter="flamefox"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f98a.svg" alt="불꽃여우">불꽃여우<small>불꽃 타입</small></button><button class="starter" data-starter="leafturtle"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f422.svg" alt="새싹거북">새싹거북<small>풀 타입</small></button><button class="starter" data-starter="waterotter"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f9a6.svg" alt="물방울수달">물방울수달<small>물 타입</small></button></div></section>
<section id="worldView" class="world hidden"><div class="card playerPanel"><div class="avatar">🧢</div><div class="playerInfo"><b>몬스터 트레이너</b><div class="stats"><span id="dexStat">도감 1/9</span><span id="winStat">승리 0</span></div></div></div><div class="map"><div class="cloud c1"></div><div class="cloud c2"></div><div class="hill h1"></div><div class="hill h2"></div><div class="path"></div><button class="spot spot1" id="plainsBtn">🌿 평원 탐험</button><button class="spot spot2" id="fieldMapBtn" disabled>🌾 들판지역</button><button class="spot spot3" id="homeMapBtn">🏠 집가기</button></div><div class="guide" id="guide">먼저 평원에서 야생 몬스터를 만나보세요.</div><div class="card"><b>내 몬스터</b><div class="party" id="party"></div></div></section>
<section id="battleView" class="hidden"><div class="battleField"><div class="platform enemyPlat"></div><div class="platform myPlat"></div><div class="enemyBox"><div class="boxTop"><span id="enemyName">야생 몬스터</span><span id="enemyLv">Lv.1</span></div><div class="bar"><i id="enemyHpBar"></i></div><div class="hpText" id="enemyHpText"></div></div><img id="enemyImg" class="monster enemyMon" alt="야생 몬스터"><img id="myImg" class="monster myMon" alt="내 몬스터"><div class="myBox"><div class="boxTop"><span id="myName"></span><span id="myLv"></span></div><div class="bar"><i id="myHpBar"></i></div><div class="hpText" id="myHpText"></div></div></div><div class="battleText" id="battleText">야생 몬스터가 나타났다!</div><div class="actions"><button class="action attack" id="attackBtn">기본 공격</button><button class="action skill" id="skillBtn">특수 기술</button><button class="action capture" id="captureBtn">포획볼</button><button class="action heal" id="healBtn">회복약 ×3</button></div><div class="battlePartyBox"><strong>이번 전투 참가 4마리</strong><div class="party" id="battleParty"></div></div></section>
<section id="dexView" class="card hidden"><h1 class="title">몬스터 도감</h1><p class="sub" id="dexText"></p><div class="dexGrid" id="dexGrid"></div></section>
</main><nav class="bottom" id="bottomNav"><button class="nav active" data-view="world">🗺️ 모험</button><button class="nav" data-view="dex">📖 도감</button><button class="nav" id="resetBtn">↻ 새로 시작</button></nav>
<div id="result" class="result hidden"><div class="resultBox"><h2 id="resultTitle">결과</h2><p id="resultText"></p><div id="resultActions" class="resultActions"><button class="bigBtn" id="resultBtn">계속하기</button><button class="bigBtn home hidden" id="homeBtn">🏠 집가기</button><button class="bigBtn field hidden" id="fieldBtn">🌾 들판지역 가기</button></div></div></div></div>
<script>
const A='https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/';
const species={flamefox:{name:'불꽃여우',type:'불꽃',img:A+'1f98a.svg',baseHp:70,atk:16,skill:'불꽃꼬리'},leafturtle:{name:'새싹거북',type:'풀',img:A+'1f422.svg',baseHp:85,atk:12,skill:'덩굴박치기'},waterotter:{name:'물방울수달',type:'물',img:A+'1f9a6.svg',baseHp:76,atk:14,skill:'물결타'},boar:{name:'풀숲멧돼지',type:'땅',img:A+'1f417.svg',baseHp:68,atk:11,skill:'돌진'},bat:{name:'밤날개',type:'어둠',img:A+'1f987.svg',baseHp:60,atk:13,skill:'초음파'},bird:{name:'바람새',type:'바람',img:A+'1f426.svg',baseHp:58,atk:14,skill:'회오리'},hornbull:{name:'뿔바위소',type:'땅',img:A+'1f402.svg',baseHp:135,atk:24,skill:'바위돌진'},rockgator:{name:'철갑악어',type:'물',img:A+'1f40a.svg',baseHp:155,atk:27,skill:'철갑물기'},stormeagle:{name:'폭풍독수리',type:'바람',img:A+'1f985.svg',baseHp:142,atk:30,skill:'폭풍강하'}};
const zones={plains:{label:'평원',pool:['boar','bird','bat'],min:1,max:3},field:{label:'들판지역',pool:['hornbull','rockgator','stormeagle'],min:3,max:5}};
const key='jaewoon-monster-adventure-v1';let save={starter:null,party:[],dex:[],wins:0,balls:5,potions:3,activeIndex:0,fieldUnlocked:false};let battle=null,locked=false;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function statsFor(id,lv){const s=species[id];return{maxHp:s.baseHp+(lv-1)*30,atk:s.atk+(lv-1)*30}}
function xpNeed(level){return 100*Math.pow(2,Math.max(0,level-1))}
function syncMon(m,heal=false){if(!m||!species[m.id])return;m.lv=Math.max(1,Number(m.lv)||1);m.xp=Math.max(0,Number(m.xp)||0);const oldMax=Math.max(1,Number(m.maxHp)||species[m.id].baseHp);const ratio=Math.max(0,Math.min(1,(Number(m.hp)||oldMax)/oldMax));const st=statsFor(m.id,m.lv);m.maxHp=st.maxHp;m.atk=st.atk;m.hp=heal?m.maxHp:Math.max(0,Math.min(m.maxHp,Math.round(m.maxHp*ratio)))}
function gainXp(m,amount){let levels=0;m.xp=Math.max(0,Number(m.xp)||0)+amount;while(m.xp>=xpNeed(m.lv)){m.xp-=xpNeed(m.lv);m.lv++;m.maxHp+=30;m.atk+=30;m.hp=Math.min(m.maxHp,m.hp+30);levels++}return levels}
function load(){try{const v=JSON.parse(localStorage.getItem(key)||'null');if(v&&Array.isArray(v.party))save={...save,...v}}catch(e){}save.party=(save.party||[]).filter(m=>m&&species[m.id]);save.party.forEach(m=>syncMon(m,false));save.dex=[...new Set((save.dex||[]).filter(id=>species[id]))];save.activeIndex=Math.max(0,Math.min(Number(save.activeIndex)||0,Math.max(0,save.party.length-1)));if(save.party.some(m=>['hornbull','rockgator','stormeagle'].includes(m.id)))save.fieldUnlocked=true;if(save.starter&&save.party.length){$('#startView').classList.add('hidden');showWorld()}else $('#bottomNav').classList.add('hidden');persist();renderAll()}
function persist(){localStorage.setItem(key,JSON.stringify(save))}
function makeMon(id,lv=1){const st=statsFor(id,lv);return{id,lv,xp:0,maxHp:st.maxHp,hp:st.maxHp,atk:st.atk}}
function chooseStarter(id){save={starter:id,party:[makeMon(id)],dex:[id],wins:0,balls:5,potions:3,activeIndex:0,fieldUnlocked:false};persist();$('#startView').classList.add('hidden');$('#bottomNav').classList.remove('hidden');showWorld()}
$$('.starter').forEach(b=>b.onclick=()=>chooseStarter(b.dataset.starter));
function activeMon(){return save.party[save.activeIndex]||save.party[0]}
function renderAll(){renderParty();renderBattleParty();renderDex();$('#orbCount').textContent=`포획볼 ${save.balls}`;$('#dexStat').textContent=`도감 ${save.dex.length}/${Object.keys(species).length}`;$('#winStat').textContent=`승리 ${save.wins}`;$('#fieldMapBtn').disabled=!save.fieldUnlocked;$('#guide').textContent=save.fieldUnlocked?'평원과 들판지역을 탐험할 수 있어요.':'평원에서 몬스터를 포획하면 들판지역이 열립니다.'}
function monChip(m,i,canSelect=false){const s=species[m.id],active=i===save.activeIndex,dead=m.hp<=0;return `<button class="chip ${active?'active':''} ${dead?'dead':''}" data-index="${i}" ${!canSelect||dead?'disabled':''}><img src="${s.img}" alt=""><b>${s.name}</b><small>Lv.${m.lv} · HP ${Math.max(0,m.hp)}/${m.maxHp}</small><small>XP ${m.xp}/${xpNeed(m.lv)}</small>${active?'<small style="color:#287fd0;font-weight:1000">전투중</small>':''}</button>`}
function renderParty(){const el=$('#party');if(!el)return;el.innerHTML=save.party.map((m,i)=>monChip(m,i,false)).join('')}
function renderBattleParty(){const el=$('#battleParty');if(!el)return;el.innerHTML='';if(!battle)return;battle.team.forEach(i=>{el.insertAdjacentHTML('beforeend',monChip(save.party[i],i,false))})}
function renderDex(){const el=$('#dexGrid');if(!el)return;el.innerHTML=Object.entries(species).map(([id,s])=>{const got=save.dex.includes(id);return `<div class="dexItem ${got?'':'locked'}"><img src="${s.img}" alt=""><div><b>${got?s.name:'???'}</b><small>${got?s.type:'미발견'}</small></div></div>`}).join('');$('#dexText').textContent=`발견 ${save.dex.length} / ${Object.keys(species).length}`}
function showWorld(){closeResult();$('#worldView').classList.remove('hidden');$('#battleView').classList.add('hidden');$('#dexView').classList.add('hidden');$('#bottomNav').classList.remove('hidden');$$('.nav[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view==='world'));renderAll()}
function showDex(){if(!save.starter)return;$('#worldView').classList.add('hidden');$('#battleView').classList.add('hidden');$('#dexView').classList.remove('hidden');$$('.nav[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view==='dex'));renderDex()}
$$('.nav[data-view]').forEach(b=>b.onclick=()=>b.dataset.view==='dex'?showDex():showWorld());
$('#plainsBtn').onclick=()=>startBattle('plains');$('#fieldMapBtn').onclick=()=>save.fieldUnlocked&&startBattle('field');$('#homeMapBtn').onclick=()=>goHome(false);
function startBattle(zoneId){const z=zones[zoneId];if(!z||zoneId==='field'&&!save.fieldUnlocked)return;save.party.forEach(m=>syncMon(m,true));const team=[];team.push(save.activeIndex);save.party.forEach((_,i)=>{if(i!==save.activeIndex&&team.length<4)team.push(i)});const id=z.pool[Math.floor(Math.random()*z.pool.length)],lv=z.min+Math.floor(Math.random()*(z.max-z.min+1));battle={zoneId,enemy:makeMon(id,lv),team};locked=false;$('#worldView').classList.add('hidden');$('#dexView').classList.add('hidden');$('#battleView').classList.remove('hidden');$('#bottomNav').classList.add('hidden');$('#battleText').textContent=`${z.label}에서 야생 ${species[id].name}이 나타났다!`;renderBattle();renderBattleParty()}
function renderBattle(){if(!battle)return;const e=battle.enemy,m=activeMon(),es=species[e.id],ms=species[m.id];$('#enemyName').textContent=es.name;$('#enemyLv').textContent=`Lv.${e.lv}`;$('#enemyImg').src=es.img;$('#enemyHpBar').style.width=`${Math.max(0,e.hp/e.maxHp*100)}%`;$('#enemyHpText').textContent=`${Math.max(0,e.hp)} / ${e.maxHp}`;$('#myName').textContent=ms.name;$('#myLv').textContent=`Lv.${m.lv}`;$('#myImg').src=ms.img;$('#myHpBar').style.width=`${Math.max(0,m.hp/m.maxHp*100)}%`;$('#myHpText').textContent=`${Math.max(0,m.hp)} / ${m.maxHp}`;$('#orbCount').textContent=`포획볼 ${save.balls}`;$('#captureBtn').textContent=`포획볼 ×${save.balls}`;$('#healBtn').textContent=`회복약 ×${save.potions}`;$('#captureBtn').disabled=save.balls<=0||save.party.length>=6;$('#healBtn').disabled=save.potions<=0||m.hp>=m.maxHp;renderBattleParty()}
function damageFor(m,special=false){const st=statsFor(m.id,m.lv);return Math.max(4,Math.floor(st.atk+(special?8:0)+Math.random()*5))}
async function playerAttack(special){if(locked||!battle)return;locked=true;const m=activeMon(),e=battle.enemy,dmg=damageFor(m,special);e.hp-=dmg;$('#battleText').textContent=`${species[m.id].name}의 ${special?species[m.id].skill:'공격'}! ${dmg} 피해!`;renderBattle();await wait(500);if(e.hp<=0){winBattle();return}enemyTurn()}
function enemyTurn(){if(!battle)return;const e=battle.enemy,m=activeMon(),dmg=damageFor(e,Math.random()<.25);m.hp-=dmg;$('#battleText').textContent=`야생 ${species[e.id].name}의 반격! ${dmg} 피해!`;renderBattle();setTimeout(()=>{if(m.hp<=0)handleFaint();else locked=false},550)}
function handleFaint(){const options=battle.team.filter(i=>i!==save.activeIndex&&save.party[i]&&save.party[i].hp>0);if(!options.length){loseBattle();return}locked=true;showSwitchChoice(options)}
function showSwitchChoice(options){$('#resultTitle').textContent='몬스터 선택';$('#resultText').textContent='전투에 출전할 몬스터를 골라!';$('#resultActions').className='resultActions';$('#resultActions').innerHTML=options.map(i=>{const m=save.party[i],s=species[m.id];return `<button class="switchBtn" data-switch="${i}"><b>${s.name}</b><br>Lv.${m.lv} · HP ${m.hp}/${m.maxHp}</button>`}).join('');$('#result').classList.remove('hidden');$('#resultActions').querySelectorAll('[data-switch]').forEach(b=>b.onclick=()=>chooseReplacement(Number(b.dataset.switch)))}
function chooseReplacement(index){if(!battle||!battle.team.includes(index)||!save.party[index]||save.party[index].hp<=0)return;save.activeIndex=index;persist();closeResult();$('#battleText').textContent=`${species[save.party[index].id].name}이(가) 출전했다!`;renderBattle();locked=false}
function attemptCapture(){if(locked||!battle||save.balls<=0||save.party.length>=6)return;locked=true;save.balls--;const e=battle.enemy,hpRate=e.hp/e.maxHp,chance=Math.max(.12,Math.min(.85,.22+(1-hpRate)*.62+(battle.zoneId==='plains'&&e.lv<=3?.1:0)-(battle.zoneId==='field'?.08:0)));$('#battleText').textContent='포획볼을 던졌다...';renderBattle();setTimeout(()=>{if(Math.random()<chance){const capturer=activeMon();const levels=gainXp(capturer,200);if(!save.dex.includes(e.id))save.dex.push(e.id);save.party.push(makeMon(e.id,e.lv));save.wins++;if(battle.zoneId==='plains')save.fieldUnlocked=true;persist();showCaptureChoice(`${species[e.id].name}을(를) 동료로 만들었다! 경험치 +200${levels?` · ${species[capturer.id].name} ${levels}레벨 상승`:''}`)}else{$('#battleText').textContent='포획에 실패했다!';persist();renderBattle();setTimeout(enemyTurn,550)}},750)}
function heal(){if(locked||!battle||save.potions<=0)return;const m=activeMon();if(m.hp>=m.maxHp)return;locked=true;save.potions--;const amount=Math.floor(m.maxHp*.45);m.hp=Math.min(m.maxHp,m.hp+amount);persist();renderBattle();setTimeout(enemyTurn,550)}
function winBattle(){const m=activeMon(),e=battle.enemy;save.wins++;if(!save.dex.includes(e.id))save.dex.push(e.id);const levels=gainXp(m,50);persist();showResult('전투 승리!',`${species[e.id].name}을 쓰러뜨렸다! 경험치 +50${levels?` · ${species[m.id].name} ${levels}레벨 상승 (HP +${30*levels}, 공격력 +${30*levels})`:''}`)}
function loseBattle(){save.party.forEach(m=>syncMon(m,true));persist();showResult('전투 패배','몬스터들이 회복했습니다. 다시 도전해보세요.')}
function setResultNormal(){const a=$('#resultActions');a.className='resultActions';a.innerHTML='<button class="bigBtn" id="resultBtn">계속하기</button><button class="bigBtn home hidden" id="homeBtn">🏠 집가기</button><button class="bigBtn field hidden" id="fieldBtn">🌾 들판지역 가기</button>';$('#resultBtn').onclick=()=>{closeResult();showWorld()};$('#homeBtn').onclick=()=>goHome(true);$('#fieldBtn').onclick=goField}
function showResult(title,text){locked=true;setResultNormal();$('#resultTitle').textContent=title;$('#resultText').textContent=text;$('#result').classList.remove('hidden');$('#homeBtn').classList.add('hidden');$('#fieldBtn').classList.add('hidden')}
function showCaptureChoice(text){locked=true;setResultNormal();$('#resultTitle').textContent='포획 성공!';$('#resultText').textContent=text+' 다음 목적지를 골라!';$('#homeBtn').classList.remove('hidden');$('#fieldBtn').classList.remove('hidden');$('#result').classList.remove('hidden')}
function closeResult(){$('#result').classList.add('hidden')}
function goHome(fromChoice){closeResult();save.balls=5;save.party.forEach(m=>syncMon(m,true));persist();showWorld();$('#guide').textContent='집에서 포획볼을 5개로 충전했습니다.'}
function goField(){closeResult();save.fieldUnlocked=true;persist();startBattle('field')}
$('#attackBtn').onclick=()=>playerAttack(false);$('#skillBtn').onclick=()=>playerAttack(true);$('#captureBtn').onclick=attemptCapture;$('#healBtn').onclick=heal;$('#resetBtn').onclick=()=>{if(confirm('저장한 몬스터와 진행을 모두 지울까요?')){localStorage.removeItem(key);location.reload()}};
function wait(ms){return new Promise(r=>setTimeout(r,ms))}load();
</script></body></html>
