<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>생존</title><style>html,body{margin:0;overflow:hidden;background:#183b20;color:white;font-family:sans-serif;touch-action:none}canvas{display:block}#h{position:fixed;top:8px;left:8px;background:#0009;padding:8px;border-radius:9px}button{position:fixed;width:72px;height:58px;border:0;border-radius:16px;background:#172b18dd;color:#fff;font-weight:bold}#a{right:18px;bottom:28px}#g{right:98px;bottom:28px}#j{position:fixed;left:22px;bottom:25px;width:120px;height:120px;border:2px solid #fff7;border-radius:60px}#s{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#fffb}</style><canvas id="c"></canvas><div id="h">체력 <b id="hp">100</b>　나무 <b id="w">0</b>　돌 <b id="r">0</b></div><div id="j"><div id="s"></div></div><button id="g">채집</button><button id="a">공격</button><script>const c=document.querySelector('#c'),x=c.getContext('2d');let p={x:0,y:0,hp:100},m={x:0,y:0},wood=0,rock=0;let n=Array.from({length:100},(_,i)=>({x:Math.random()*2400-1200,y:Math.random()*2400-1200,t:i%2}));let b=Array.from({length:18},()=>({x:Math.random()*2400-1200,y:Math.random()*2400-1200,hp:30}));function R(){c.width=innerWidth;c.height=innerHeight}R();onresize=R;function near(q,d){return Math.hypot(p.x-q.x,p.y-q.y)<d}g.onclick=()=>{let q=n.find(q=>near(q,55));if(q){q.t?rock++:wood++;q.x=Math.random()*2400-1200;q.y=Math.random()*2400-1200;H()}};a.onclick=()=>{let q=b.find(q=>q.hp>0&&near(q,75));if(q)q.hp-=10};function H(){hp.textContent=Math.max(0,p.hp|0);w.textContent=wood;r.textContent=rock}let joy=document.querySelector('#j'),stick=document.querySelector('#s');function J(e){let t=e.touches?e.touches[0]:e,z=joy.getBoundingClientRect(),dx=t.clientX-z.left-60,dy=t.clientY-z.top-60,l=Math.hypot(dx,dy)||1,k=Math.min(40,l)/l;m.x=dx/l;m.y=dy/l;stick.style.transform=`translate(${dx*k-35*m.x}px,${dy*k-35*m.y}px)`}joy.onpointermove=e=>{if(e.buttons)J(e)};joy.onpointerdown=J;joy.onpointerup=joy.onpointercancel=()=>{m.x=m.y=0;stick.style.transform=''};function loop(){p.x+=m.x*3;p.y+=m.y*3;x.fillStyle='#214f28';x.fillRect(0,0,c.width,c.height);x.save();x.translate(c.width/2-p.x,c.height/2-p.y);for(let q of n){x.fillStyle=q.t?'#999':'#70431e';x.beginPath();x.arc(q.x,q.y,q.t?10:14,0,7);x.fill()}for(let q of b)if(q.hp>0){let d=Math.hypot(p.x-q.x,p.y-q.y);if(d<230){q.x+=(p.x-q.x)/d*.45;q.y+=(p.y-q.y)/d*.45;if(d<25)p.hp-=.035}x.fillStyle='#5b1717';x.beginPath();x.arc(q.x,q.y,13,0,7);x.fill()}x.fillStyle='#ffd45b';x.beginPath();x.arc(p.x,p.y,13,0,7);x.fill();x.restore();H();requestAnimationFrame(loop)}loop()</script>
