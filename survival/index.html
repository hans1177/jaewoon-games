<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>곤충 생존</title><style>html,body{margin:0;overflow:hidden;background:#183b20;color:#fff;font:13px sans-serif;touch-action:none}canvas{display:block}#h,#craft{position:fixed;background:#000c;padding:8px;border-radius:10px;z-index:3}#h{top:8px;left:8px}#craft{right:8px;top:75px;display:none;width:190px}button{height:52px;border:0;border-radius:14px;background:#19351ddd;color:#fff;font-weight:bold}#act{position:fixed;right:16px;bottom:24px;display:grid;grid-template-columns:68px 68px;gap:8px;z-index:3}#craft button{display:block;width:174px;height:44px;margin:5px 0}#j{position:fixed;left:20px;bottom:24px;width:120px;height:120px;border:2px solid #fff7;border-radius:60px;z-index:3}#s{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#fffb}</style><canvas id="c"></canvas><div id="h">HP <b id="hp">100</b> 허기 <b id="fd">100</b> 갈증 <b id="wt">100</b><br>나뭇가지 <b id="tw">0</b> 조약돌 <b id="pe">0</b> 나무 <b id="wo">0</b><br>장비 <b id="eq">맨손</b> 공격력 <b id="ap">10</b></div><div id="j"><div id="s"></div></div><div id="act"><button id="a">공격</button><button id="g">채집</button><button id="cb">제작</button><button id="eat">먹기</button></div><div id="craft"><b>제작</b></div><script>const Q=s=>document.querySelector(s),c=Q('#c'),x=c.getContext('2d'),WORLD=6000;let p={x:0,y:0,hp:100,fd:100,wt:100},m={x:0,y:0},I={twig:0,pebble:0,wood:0,food:2},baseAtk=10,bonusAtk=0,eq='맨손',hasAxe=false,t=0;const N=[],B=[];function rn(a,b){return a+Math.random()*(b-a)}function node(k,n){for(let i=0;i<n;i++)N.push({x:rn(-2900,2900),y:rn(-2900,2900),k})}node('twig',90);node('pebble',90);node('tree',55);function add(n,xp,yp,h,d,neu){B.push({n,x:xp,y:yp,h,max:h,d,neu,ang:Math.random()*7})}for(let i=0;i<12;i++)add('개미',rn(-500,500),rn(-500,500),45,6,1);for(let i=0;i<10;i++)add('딱정벌레',rn(2100,2800),rn(-900,900),90,12,1);for(let i=0;i<16;i++)add('진드기',rn(1900,2800),rn(-1100,1100),30,5,0);for(let i=0;i<12;i++)add('거미',rn(-700,700),rn(-2800,-2100),120,16,0);const recipes=[{n:'도끼',cost:'나뭇가지 2 · 조약돌 3',ok:()=>I.twig>=2&&I.pebble>=3,make:()=>{I.twig-=2;I.pebble-=3;hasAxe=true;eq='도끼';bonusAtk=4}},{n:'창',cost:'나뭇가지 3 · 조약돌 2',ok:()=>I.twig>=3&&I.pebble>=2,make:()=>{I.twig-=3;I.pebble-=2;eq='창';bonusAtk=10}},{n:'망치',cost:'나뭇가지 2 · 조약돌 5',ok:()=>I.twig>=2&&I.pebble>=5,make:()=>{I.twig-=2;I.pebble-=5;eq='망치';bonusAtk=7}}];recipes.forEach(r=>{let b=document.createElement('button');b.innerHTML=r.n+'<br><small>'+r.cost+'</small>';b.onclick=()=>{if(r.ok()){r.make();H()}};Q('#craft').append(b)});cb.onclick=()=>Q('#craft').style.display=Q('#craft').style.display?'':'block';function D(q){return Math.hypot(p.x-q.x,p.y-q.y)}g.onclick=()=>{let q=N.find(q=>D(q)<72);if(!q)return;if(q.k==='tree'&&!hasAxe)return;if(q.k==='twig')I.twig++;else if(q.k==='pebble')I.pebble++;else I.wood++;q.x=rn(-2900,2900);q.y=rn(-2900,2900);H()};a.onclick=()=>{let q=B.find(q=>q.h>0&&D(q)<90);if(q){q.h-=baseAtk+bonusAtk;q.neu=0}};eat.onclick=()=>{if(I.food){I.food--;p.fd=Math.min(100,p.fd+35);p.wt=Math.min(100,p.wt+25)}};function H(){hp.textContent=Math.max(0,p.hp|0);fd.textContent=Math.max(0,p.fd|0);wt.textContent=Math.max(0,p.wt|0);tw.textContent=I.twig;pe.textContent=I.pebble;wo.textContent=I.wood;eq.textContent=eq;ap.textContent=baseAtk+bonusAtk}function Z(){c.width=innerWidth;c.height=innerHeight}Z();onresize=Z;let j=Q('#j'),s=Q('#s');function J(e){let z=j.getBoundingClientRect(),dx=e.clientX-z.left-60,dy=e.clientY-z.top-60,l=Math.hypot(dx,dy)||1;m={x:dx/l,y:dy/l};s.style.transform=`translate(${m.x*35}px,${m.y*35}px)`}j.onpointerdown=e=>{j.setPointerCapture(e.pointerId);J(e)};j.onpointermove=e=>{if(e.buttons)J(e)};j.onpointerup=j.onpointercancel=()=>{m={x:0,y:0};s.style.transform=''};function resource(q){if(q.k==='tree'){x.fillStyle='#59391e';x.fillRect(q.x-9,q.y-24,18,48);x.fillStyle='#2d7a34';x.beginPath();x.arc(q.x,q.y-30,25,0,7);x.fill();x.fillStyle='#fff';x.font='11px sans-serif';x.textAlign='center';x.fillText('나무',q.x,q.y-62)}else if(q.k==='twig'){x.strokeStyle='#a97642';x.lineWidth=5;x.beginPath();x.moveTo(q.x-13,q.y+5);x.lineTo(q.x+13,q.y-5);x.stroke();x.fillStyle='#fff';x.font='10px sans-serif';x.textAlign='center';x.fillText('나뭇가지',q.x,q.y-13)}else{x.fillStyle='#aaa';x.beginPath();x.moveTo(q.x-12,q.y+7);x.lineTo(q.x-5,q.y-10);x.lineTo(q.x+11,q.y-6);x.lineTo(q.x+14,q.y+8);x.closePath();x.fill();x.fillStyle='#fff';x.font='10px sans-serif';x.textAlign='center';x.fillText('조약돌',q.x,q.y-15)}}function monster(q){let d=D(q);if(!q.neu&&d<320){q.x+=(p.x-q.x)/d*.55;q.y+=(p.y-q.y)/d*.55;if(d<28)p.hp-=q.d*.0015}else{q.ang+=.01;q.x+=Math.cos(q.ang)*.12;q.y+=Math.sin(q.ang)*.12}x.save();x.translate(q.x,q.y);x.fillStyle=q.n==='거미'?'#241421':q.n==='딱정벌레'?'#203d48':q.n==='개미'?'#493126':'#9b342e';x.beginPath();x.ellipse(0,0,q.n==='거미'?19:15,q.n==='거미'?13:9,0,0,7);x.fill();x.strokeStyle='#111';x.lineWidth=3;for(let i=-1;i<=1;i+=2){x.beginPath();x.moveTo(i*7,-5);x.lineTo(i*20,-14);x.moveTo(i*7,5);x.lineTo(i*20,14);x.stroke()}x.restore();x.textAlign='center';x.font='11px sans-serif';x.fillStyle='#fff';x.fillText(q.n,q.x,q.y-28);let bw=46;x.fillStyle='#330000';x.fillRect(q.x-bw/2,q.y-22,bw,5);x.fillStyle='#35d05b';x.fillRect(q.x-bw/2,q.y-22,bw*Math.max(0,q.h/q.max),5)}function loop(){t++;p.x=Math.max(-2950,Math.min(2950,p.x+m.x*3.4));p.y=Math.max(-2950,Math.min(2950,p.y+m.y*3.4));p.fd=Math.max(0,p.fd-.002);p.wt=Math.max(0,p.wt-.003);if(!p.fd||!p.wt)p.hp-=.015;x.fillStyle='#275d2e';x.fillRect(0,0,c.width,c.height);x.save();x.translate(c.width/2-p.x,c.height/2-p.y);for(const q of N)resource(q);for(const q of B)if(q.h>0)monster(q);x.fillStyle='#ffd65b';x.beginPath();x.arc(p.x,p.y,13,0,7);x.fill();x.restore();if(Math.sin(t/2500)<-.25){x.fillStyle='#00152b66';x.fillRect(0,0,c.width,c.height)}H();requestAnimationFrame(loop)}loop()</script></html>
