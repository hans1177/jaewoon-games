q.x+=Math.cos(q.ang)*.12;q.y+=Math.sin(q.ang)*.12}x.fillStyle=q.neu?'#3d7185':q.n=='거미'?'#251525':'#7c2727';x.beginPath();x.arc(q.x,q.y,q.n=='거미'?17:12,0,7);x.fill()}x.fillStyle='#ffd65b';x.beginPath();x.arc(p.x,p.y,13,0,7);x.fill();x.restore();let night=(Math.sin(t/2500)<-.25);if(night){x.fillStyle='#00152b66';x.fillRect(0,0,c.width,c.height)}H();requestAnimationFrame(loop)}loop()</script></html>
