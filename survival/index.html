<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>곤충 생존</title><style>html,body{margin:0;overflow:hidden;background:#183b20;color:#fff;font:13px sans-serif;touch-action:none}canvas{display:block}.panel{position:fixed;background:#000d;padding:9px;border-radius:10px;z-index:4;max-height:70vh;overflow:auto}#h{top:8px;left:8px;background:#000c}#craft,#inv,#bench{right:8px;top:70px;display:none;width:220px}button{height:48px;border:0;border-radius:12px;background:#19351ddd;color:#fff;font-weight:bold}#act{position:fixed;right:14px;bottom:20px;display:grid;grid-template-columns:64px 64px 64px;gap:7px;z-index:3}.panel button{display:block;width:100%;height:auto;min-height:42px;margin:5px 0;padding:6px}.item{border-top:1px solid #ffffff33;padding:6px 0}.small{font-size:11px;color:#ddd}#j{position:fixed;left:20px;bottom:24px;width:120px;height:120px;border:2px solid #fff7;border-radius:60px;z-index:3}#s{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#fffb}</style><canvas id="c"></canvas><div id="h" class="panel">HP <b id="hp">100</b> 허기 <b id="fd">100</b> 갈증 <b id="wt">100</b><br>나뭇가지 <b id="tw">0</b> 조약돌 <b id="pe">0</b> 나무 <b id="wo">0</b><br>무기 <b id="eq">맨손</b> 방어구 <b id="ar">없음</b><br>공격력 <b id="ap">10</b> 방어 <b id="df">0</b></div><div id="j"><div id="s"></div></div><div id="act"><button id="a">공격</button><button id="g">채집</button><button id="cb">제작</button><button id="ib">인벤</button><button id="bb">제작대</button><button id="eat">먹기</button></div><div id="craft" class="panel"><b>손 제작</b></div><div id="inv" class="panel"><b>인벤토리</b><div id="invbody"></div></div><div id="bench" class="panel"><b>제작대 전용 제작</b><div class="small">제작대를 만든 뒤 이용할 수 있습니다.</div></div><script>const Q=s=>document.querySelector(s),c=Q('#c'),x=c.getContext('2d'),RESPAWN=60000;let p={x:0,y:0,hp:100,fd:100,wt:100},m={x:0,y:0},I={twig:0,pebble:0,wood:0,food:2,shell:0,spider:0,ant:0,mite:0},items={},weapon=null,armor=null,benchBuilt=false,t=0;const N=[],B=[],weaponAtk={도끼:4,창:10,망치:7,'딱정벌레 검':22,'거미 창':28},armorDef={'개미 갑옷':3,'딱정벌레 갑옷':7,'거미 갑옷':10};function rn(a,b){return a+Math.random()*(b-a)}function node(k,n){for(let i=0;i<n;i++)N.push({x:rn(-2900,2900),y:rn(-2900,2900),k})}node('twig',100);node('pebble',100);node('tree',60);function spawnPos(n){if(n==='개미')return{x:rn(-600,600),y:rn(-600,600)};if(n==='병정개미')return{x:rn(1100,1750),y:rn(-700,700)};if(n==='딱정벌레')return{x:rn(700,1450),y:rn(-900,900)};if(n==='진드기')return{x:rn(650,1500),y:rn(-1000,1000)};return{x:rn(-1500,1500),y:rn(-2300,-1500)}}function add(n,h,d,neu){let s=spawnPos(n);B.push({n,x:s.x,y:s.y,h,max:h,d,neu,baseNeu:neu,ang:Math.random()*7,looted:false,deadAt:0})}for(let i=0;i<12;i++)add('개미',45,6,1);for(let i=0;i<4;i++)add('병정개미',90,12,0);for(let i=0;i<8;i++)add('딱정벌레',90,10,1);for(let i=0;i<10;i++)add('진드기',30,5,0);for(let i=0;i<3;i++)add('거미',120,16,0);function own(n){items[n]=(items[n]||0)+1}function spend(o){for(const k in o)I[k]-=o[k]}function can(o){return Object.keys(o).every(k=>I[k]>=o[k])}const materialNames={twig:'나뭇가지',pebble:'조약돌',shell:'단단한 껍질',spider:'질긴 부위',ant:'곤충 머리',mite:'날카로운 이빨'};function costText(o){return Object.entries(o).map(([k,v])=>materialNames[k]+' '+v).join(' · ')}const hand=[['도끼',{twig:2,pebble:3}],['창',{twig:3,pebble:2}],['망치',{twig:2,pebble:5}],['제작대',{twig:4}]],advanced=[['개미 갑옷',{ant:3,mite:1}],['딱정벌레 갑옷',{shell:3,ant:1}],['거미 갑옷',{spider:4,mite:2}],['딱정벌레 검',{shell:2,mite:2}],['거미 창',{spider:3,ant:1,mite:1}]];function addRecipe(box,n,cost,isBench){let b=document.createElement('button');b.innerHTML=n+'<br><small>'+costText(cost)+'</small>';b.onclick=()=>{if(isBench&&!benchBuilt)return;if(!can(cost))return;spend(cost);if(n==='제작대')benchBuilt=true;else own(n);H();renderInv()};box.append(b)}hand.forEach(r=>addRecipe(Q('#craft'),r[0],r[1],false));advanced.forEach(r=>addRecipe(Q('#bench'),r[0],r[1],true));function closePanels(ex){['#craft','#inv','#bench'].forEach(s=>{if(s!==ex)Q(s).style.display='none'})}Q('#cb').onclick=()=>{closePanels('#craft');Q('#craft').style.display=Q('#craft').style.display==='block'?'none':'block'};Q('#ib').onclick=()=>{closePanels('#inv');renderInv();Q('#inv').style.display=Q('#inv').style.display==='block'?'none':'block'};Q('#bb').onclick=()=>{if(!benchBuilt)return;closePanels('#bench');Q('#bench').style.display=Q('#bench').style.display==='block'?'none':'block'};function renderInv(){let z=Q('#invbody'),loot=Object.entries({shell:'단단한 껍질',spider:'질긴 부위',ant:'곤충 머리',mite:'날카로운 이빨'}).filter(([k])=>I[k]>0).map(([k,n])=>n+' '+I[k]).join(' / ');z.innerHTML='<div class="item">전리품: '+(loot||'없음')+'</div><div class="item">제작대: '+(benchBuilt?'보유':'없음')+'</div>';Object.keys(items).forEach(n=>{if(!items[n])return;let d=document.createElement('div');d.className='item';let equipped=weapon===n||armor===n;d.innerHTML='<b>'+n+'</b> x'+items[n]+' ';let b=document.createElement('button');b.textContent=equipped?'해제':'장착';b.onclick=()=>{if(equipped){if(weapon===n)weapon=null;if(armor===n)armor=null}else if(n in weaponAtk)weapon=n;else if(n in armorDef)armor=n;H();renderInv()};d.append(b);z.append(d)})}function D(q){return Math.hypot(p.x-q.x,p.y-q.y)}Q('#g').onclick=()=>{let q=N.find(q=>D(q)<72);if(!q)return;if(q.k==='tree'&&weapon!=='도끼')return;if(q.k==='twig')I.twig++;else if(q.k==='pebble')I.pebble++;else I.wood++;q.x=rn(-2900,2900);q.y=rn(-2900,2900);H()};function loot(q){if(q.looted)return;q.looted=true;if(q.n==='딱정벌레')I.shell++;else if(q.n==='거미')I.spider++;else if(q.n==='진드기')I.mite++;else if(q.n==='개미'||q.n==='병정개미')I.ant++;q.deadAt=Date.now();H();renderInv()}Q('#a').onclick=()=>{let q=B.find(q=>q.h>0&&D(q)<90);if(q){q.h-=10+(weapon?weaponAtk[weapon]||0:0);q.neu=0;if(q.h<=0)loot(q)}};Q('#eat').onclick=()=>{if(I.food){I.food--;p.fd=Math.min(100,p.fd+35);p.wt=Math.min(100,p.wt+25)}};function H(){Q('#hp').textContent=Math.max(0,p.hp|0);Q('#fd').textContent=Math.max(0,p.fd|0);Q('#wt').textContent=Math.max(0,p.wt|0);Q('#tw').textContent=I.twig;Q('#pe').textContent=I.pebble;Q('#wo').textContent=I.wood;Q('#eq').textContent=weapon||'맨손';Q('#ar').textContent=armor||'없음';Q('#ap').textContent=10+(weapon?weaponAtk[weapon]||0:0);Q('#df').textContent=armor?armorDef[armor]||0:0;Q('#bb').textContent=benchBuilt?'제작대':'제작대(없음)'}function Z(){c.width=innerWidth;c.height=innerHeight}Z();onresize=Z;let j=Q('#j'),s=Q('#s');function J(e){let z=j.getBoundingClientRect(),dx=e.clientX-z.left-60,dy=e.clientY-z.top-60,l=Math.hypot(dx,dy)||1;m={x:dx/l,y:dy/l};s.style.transform=`translate(${m.x*35}px,${m.y*35}px)`}j.onpointerdown=e=>{j.setPointerCapture(e.pointerId);J(e)};j.onpointermove=e=>{if(e.buttons)J(e)};j.onpointerup=j.onpointercancel=()=>{m={x:0,y:0};s.style.transform=''};function resource(q){if(q.k==='tree'){x.fillStyle='#59391e';x.fillRect(q.x-9,q.y-24,18,48);x.fillStyle='#2d7a34';x.beginPath();x.arc(q.x,q.y-30,25,0,7);x.fill();x.fillStyle='#fff';x.font='11px sans-serif';x.textAlign='center';x.fillText('나무',q.x,q.y-62)}else if(q.k==='twig'){x.strokeStyle='#a97642';x.lineWidth=5;x.beginPath();x.moveTo(q.x-13,q.y+5);x.lineTo(q.x+13,q.y-5);x.stroke();x.fillStyle='#fff';x.font='10px sans-serif';x.textAlign='center';x.fillText('나뭇가지',q.x,q.y-13)}else{x.fillStyle='#aaa';x.beginPath();x.moveTo(q.x-12,q.y+7);x.lineTo(q.x-5,q.y-10);x.lineTo(q.x+11,q.y-6);x.lineTo(q.x+14,q.y+8);x.closePath();x.fill();x.fillStyle='#fff';x.font='10px sans-serif';x.textAlign='center';x.fillText('조약돌',q.x,q.y-15)}}function respawn(q){if(q.h>0||!q.deadAt||Date.now()-q.deadAt<RESPAWN)return;let s=spawnPos(q.n);q.x=s.x;q.y=s.y;q.h=q.max;q.neu=q.baseNeu;q.looted=false;q.deadAt=0}function monster(q){let d=D(q);if(!q.neu&&d<320){q.x+=(p.x-q.x)/Math.max(d,1)*.55;q.y+=(p.y-q.y)/Math.max(d,1)*.55;if(d<28){let reduction=armor?armorDef[armor]||0:0;p.hp-=Math.max(1,q.d-reduction)*.0015}}else{q.ang+=.01;q.x+=Math.cos(q.ang)*.12;q.y+=Math.sin(q.ang)*.12}x.save();x.translate(q.x,q.y);x.fillStyle=q.n==='거미'?'#241421':q.n==='딱정벌레'?'#203d48':q.n==='병정개미'?'#6b1f16':q.n==='개미'?'#493126':'#9b342e';x.beginPath();x.ellipse(0,0,q.n==='거미'?19:q.n==='병정개미'?18:15,q.n==='거미'?13:q.n==='병정개미'?11:9,0,0,7);x.fill();x.strokeStyle='#111';x.lineWidth=3;for(let i=-1;i<=1;i+=2){x.beginPath();x.moveTo(i*7,-5);x.lineTo(i*20,-14);x.moveTo(i*7,5);x.lineTo(i*20,14);x.stroke()}x.restore();x.textAlign='center';x.font='11px sans-serif';x.fillStyle='#fff';x.fillText(q.n,q.x,q.y-28);let bw=46;x.fillStyle='#330000';x.fillRect(q.x-bw/2,q.y-22,bw,5);x.fillStyle='#35d05b';x.fillRect(q.x-bw/2,q.y-22,bw*Math.max(0,q.h/q.max),5)}function loop(){t++;p.x=Math.max(-2950,Math.min(2950,p.x+m.x*3.4));p.y=Math.max(-2950,Math.min(2950,p.y+m.y*3.4));p.fd=Math.max(0,p.fd-.002);p.wt=Math.max(0,p.wt-.003);if(!p.fd||!p.wt)p.hp-=.015;x.fillStyle='#275d2e';x.fillRect(0,0,c.width,c.height);x.save();x.translate(c.width/2-p.x,c.height/2-p.y);for(const q of N)resource(q);for(const q of B){respawn(q);if(q.h>0)monster(q)}x.fillStyle='#ffd65b';x.beginPath();x.arc(p.x,p.y,13,0,7);x.fill();x.restore();if(Math.sin(t/2500)<-.25){x.fillStyle='#00152b66';x.fillRect(0,0,c.width,c.height)}H();requestAnimationFrame(loop)}H();loop()</script></html>
