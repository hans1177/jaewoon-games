plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jaewoon.company'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jaewoon.company'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}
