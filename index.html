<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#69c9ff">
  <title>재운게임즈</title>
  <style>
    /* index.html · 기본 */
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    :root{--blue:#288cf4;--deep:#1559a4;--ink:#17375e;--glass:rgba(255,255,255,.94)}
    html{scroll-behavior:smooth}
    body{margin:0;min-width:320px;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--ink);background:#bdeaff;overflow-x:hidden}
    a{text-decoration:none;color:inherit}
    button{font:inherit}

    /* 배경 */
    .page{min-height:100vh;background:linear-gradient(180deg,rgba(140,218,255,.18),rgba(232,248,255,.72)),url("assets/page-bg.webp") center top/cover fixed no-repeat}
    .shell{width:min(100%,980px);margin:auto;padding:16px 14px 30px}

    /* 로고 */
    .brand{display:flex;justify-content:center;padding:0 0 14px}
    .brand img{display:block;width:min(100%,760px);height:auto;filter:drop-shadow(0 10px 18px rgba(35,96,141,.16))}

    /* 대표 게임 */
    .heroFrame{position:relative;padding:7px;border-radius:30px;background:linear-gradient(145deg,#fff,#e9f8ff);box-shadow:0 18px 38px rgba(31,101,151,.24)}
    .hero{position:relative;min-height:520px;overflow:hidden;border-radius:24px;background:#294e3a url("assets/insect-main.webp") center/cover no-repeat}
    .hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,48,38,.82) 0%,rgba(4,48,38,.48) 42%,transparent 72%)}
    .heroCopy{position:absolute;z-index:2;left:38px;top:34px;width:min(48%,430px);color:#fff}
    .badge{display:inline-block;padding:9px 14px;border-radius:999px;background:#13a777;font-size:14px;font-weight:1000;box-shadow:0 4px 0 #087354}
    .hero h1{margin:22px 0 6px;font-size:clamp(42px,7vw,62px);letter-spacing:-3px;line-height:1.05}
    .hero h2{margin:0 0 15px;font-size:23px}.hero p{font-size:15px;line-height:1.7;margin:0 0 16px}
    .chips{display:flex;flex-wrap:wrap;gap:8px}.chips span{padding:7px 11px;border:1px solid rgba(255,255,255,.75);border-radius:10px;background:rgba(8,47,39,.35);font-size:13px;font-weight:900}
    .play{display:inline-flex;align-items:center;justify-content:center;min-width:255px;min-height:68px;margin-top:24px;border-radius:23px;background:linear-gradient(#58c0ff,#247ff0);box-shadow:0 7px 0 #0d59b6;color:#fff;font-size:24px;font-weight:1000}
    .heroNum{position:absolute;z-index:3;right:18px;bottom:16px;padding:8px 13px;border-radius:999px;background:rgba(13,38,64,.82);color:#fff;font-size:14px;font-weight:900}

    /* 하단 */
    .footer{margin-top:18px;text-align:center;color:#487492;font-size:13px;font-weight:800}

    /* 모바일 */
    @media(max-width:640px){
      .shell{padding:0 9px 24px}.brand{margin:0 -9px;padding:0 0 10px}.brand img{width:100%}
      .heroFrame{padding:6px;border-radius:25px}.hero{min-height:500px;border-radius:20px;background-position:51% center}.hero:after{background:linear-gradient(90deg,rgba(4,48,38,.82) 0%,rgba(4,48,38,.43) 48%,transparent 82%)}
      .heroCopy{left:16px;right:16px;top:18px;width:auto}.badge{font-size:13px}.hero h1{margin-top:18px;font-size:39px}.hero h2{font-size:19px}.hero p{font-size:14px;line-height:1.6;max-width:330px}.chips{gap:6px}.chips span{padding:6px 9px;font-size:12px}.play{width:min(100%,300px);min-height:62px;margin-top:19px;font-size:22px}
      .footer{font-size:12px}
    }
  </style>
</head>
<body>
  <div class="page">
    <main class="shell">
      <header class="brand" aria-label="재운게임즈">
        <img src="assets/brand-header.webp" alt="재운게임즈 · 작은 상상이 큰 재미가 되는 곳">
      </header>

      <section class="heroFrame" aria-label="추천 게임">
        <div class="hero">
          <div class="heroCopy">
            <span class="badge">★ 추천 게임</span>
            <h1>곤충 생존기</h1>
            <h2>작은 세계, 큰 모험</h2>
            <p>거대한 자연 속에서 채집하고, 만들고, 탐험하며 살아남아보세요!</p>
            <div class="chips"><span>생존</span><span>제작</span><span>탐험</span><span>협동 플레이</span></div>
            <a class="play" href="/play_survival_v4.html">▶&nbsp; 게임 시작</a>
          </div>
          <div class="heroNum">1 / 5</div>
        </div>
      </section>

      <footer class="footer">© 2026 재운게임즈. All rights reserved.</footer>
    </main>
  </div>
</body>
</html>
