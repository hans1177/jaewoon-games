<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#102d42"/><stop offset="1" stop-color="#245f83"/></linearGradient></defs><rect width="1200" height="675" fill="url(#g)"/><rect x="54" y="54" width="1092" height="567" rx="32" fill="#07131d" fill-opacity=".42" stroke="#90dbff" stroke-opacity=".35"/><text x="78" y="110" font-size="22" font-weight="700" fill="#90dbff">나의 생존기 · QA 부서</text><text x="78" y="165" font-size="34" font-weight="800" fill="#fff">나의 생존기</text><text x="78" y="215" font-size="20" fill="#aac9da">READY</text><line x1="78" y1="255" x2="1120" y2="255" stroke="#90dbff" stroke-opacity=".32"/><foreignObject x="78" y="295" width="1030" height="210"><div xmlns="http://www.w3.org/1999/xhtml" style="font:24px sans-serif;color:#dcecff;line-height:1.5">나의 생존기와 utf-8의 관계를 한 장면에서 이해하는 순간을 강조합니다. B 방향은 Noto Sans KR를 중심으로 위험·압박과 돌파의 재미를 강조하며, app의 익숙함을과 모든 부서는 이 방향을 공통 기준으로 삼아 자기 전문 범위에서 구체화한다.</div></foreignObject><text x="78" y="590" font-size="17" fill="#89aabe">근거 전용 · 타 부서 미열람 · 제작 승인 아님</text></svg>