<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c273a"/><stop offset="1" stop-color="#183f61"/></linearGradient></defs><rect width="1200" height="675" fill="url(#g)"/><circle cx="1050" cy="70" r="210" fill="#75ddff" opacity=".08"/><text x="70" y="72" font-family="system-ui,-apple-system,'Noto Sans KR',sans-serif" font-size="18" font-weight="800" fill="#8adfff">VIBE2 FIRST DRAFT · PROPOSAL</text><text x="70" y="125" font-family="system-ui,-apple-system,'Noto Sans KR',sans-serif" font-size="36" font-weight="950" fill="#fff">나의 생존기 · 중반</text><text x="1115" y="70" text-anchor="end" font-family="system-ui" font-size="17" fill="#b9dceb">3/8</text><g><rect x="90" y="212" width="1020" height="82" rx="22" fill="#07131d" fill-opacity=".72" stroke="#71d4ff" stroke-opacity=".5"/><text x="122" y="260" font-family="system-ui,-apple-system,'Noto Sans KR',sans-serif" font-size="21" font-weight="750" fill="#eefaff">새 생존 규칙에 적응한다 — 후반 위협과 최종 세력의 존재가 드러난다</text></g><g><rect x="90" y="317" width="1020" height="82" rx="22" fill="#07131d" fill-opacity=".72" stroke="#71d4ff" stroke-opacity=".5"/><text x="122" y="365" font-family="system-ui,-apple-system,'Noto Sans KR',sans-serif" font-size="21" font-weight="750" fill="#eefaff">중간 생태권: 기존 방식으로 버티기 어려운 환경 변화 → 새 자원과 능력을 활용해 위협의 원인을 추적한…</text></g><g><rect x="90" y="422" width="1020" height="82" rx="22" fill="#07131d" fill-opacity=".72" stroke="#71d4ff" stroke-opacity=".5"/><text x="122" y="470" font-family="system-ui,-apple-system,'Noto Sans KR',sans-serif" font-size="21" font-weight="750" fill="#eefaff">기획 AI 검토 대상</text></g><text x="70" y="640" font-family="system-ui,-apple-system,'Noto Sans KR',sans-serif" font-size="16" fill="#9fc8da">게임 사실 자료팩 기반 Vibe2 1차 초안 · 기획부 검토 전 확정 설정 아님</text></svg>