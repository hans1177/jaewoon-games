<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#102d42"/><stop offset="1" stop-color="#245f83"/></linearGradient></defs><rect width="1200" height="675" fill="url(#g)"/><rect x="54" y="54" width="1092" height="567" rx="32" fill="#07131d" fill-opacity=".42" stroke="#90dbff" stroke-opacity=".35"/><text x="78" y="110" font-size="22" font-weight="700" fill="#90dbff">나의 생존기 · 기획 부서</text><text x="78" y="165" font-size="34" font-weight="800" fill="#fff">나의 생존기</text><text x="78" y="215" font-size="20" fill="#aac9da">READY</text><line x1="78" y1="255" x2="1120" y2="255" stroke="#90dbff" stroke-opacity=".32"/><foreignObject x="78" y="295" width="1030" height="210"><div xmlns="http://www.w3.org/1999/xhtml" style="font:24px sans-serif;color:#dcecff;line-height:1.5">초기 활동권에서 안정적인 자원 루프를 확보하고, 중간 생태권에서 새로운 규칙 적용을 통해 위험과 안전의 균형을 찾는다. · Noto Sans KR를 중심으로 위험과 압박의 재미를 강조하며, app의 익숙함을 통해 위기를 넘기게 한다.</div></foreignObject><text x="78" y="590" font-size="17" fill="#89aabe">근거 전용 · 타 부서 미열람 · 제작 승인 아님</text></svg>