<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>곤충 생존 디펜스</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}iframe{display:block;border:0;width:100%;height:100dvh}</style></head><body><iframe id="outer" src="/play_survival.html" allow="autoplay; fullscreen"></iframe><script>const outer=document.getElementById('outer');function patch(){try{const mid=outer.contentDocument&&outer.contentDocument.getElementById('game');if(!mid)return setTimeout(patch,120);const apply=()=>{try{const w=mid.contentWindow;if(!w||!w.eval)return;w.eval(`(()=>{if(window.__jwPatchV4)return;window.__jwPatchV4=1;const __spawn=spawnEnemy;spawnEnemy=function(type,...args){if(day>=4&&type!=='stagJunior'){const active=enemies.filter(e=>e.type!=='stagJunior').length;if(active>=12)return null;if((type==='bee'||type==='ladybug')&&enemies.filter(e=>e.type==='bee'||e.type==='ladybug').length>=5)return null}return __spawn.call(this,type,...args)};if(typeof spawnDayFlyer==='function'){const __fly=spawnDayFlyer;spawnDayFlyer=function(){if(day>=4){if(enemies.filter(e=>e.type==='bee'||e.type==='ladybug').length>=5)return null;if(Math.random()<.5)return null}return __fly()}}const __draw=drawEnemy;function hpbar(e,wid){ctx.fillStyle='rgba(0,0,0,.62)';ctx.fillRect(e.x-wid/2,e.y-e.r-24,wid,7);ctx.fillStyle='#ff625c';ctx.fillRect(e.x-wid/2,e.y-e.r-24,wid*Math.max(0,e.hp/e.max),7)}drawEnemy=function(e){if(e.type!=='ladybug'&&e.type!=='bombBeetle')return __draw(e);const now=performance.now()/1000,dir=p.x<e.x?-1:1,bob=Math.sin(now*7+(e.step||0))*1.4,atk=e.bite>0,l=atk?Math.sin(Math.max(0,Math.min(1,1-e.bite/.18))*Math.PI)*(e.type==='bombBeetle'?11:7):0,x=e.x+dir*l,y=e.y+bob;drawShadow(x,y+18,e.type==='bombBeetle'?27:23,8,.28);ctx.save();ctx.translate(x,y);ctx.scale(dir,1);if(e.flash>0)ctx.filter='brightness(1.8) saturate(1.2)';ctx.lineCap='round';if(e.type==='ladybug'){ctx.strokeStyle='#241512';ctx.lineWidth=4;for(const sy of[-10,0,10]){const wig=Math.sin(now*10+sy)*3;ctx.beginPath();ctx.moveTo(-8,sy*.7);ctx.lineTo(-22,sy+wig);ctx.stroke();ctx.beginPath();ctx.moveTo(8,sy*.7);ctx.lineTo(22,sy-wig);ctx.stroke()}ctx.fillStyle='#181414';ctx.beginPath();ctx.ellipse(-13,0,12,12,0,0,Math.PI*2);ctx.fill();const g=ctx.createRadialGradient(4,-7,3,4,0,24);g.addColorStop(0,'#ff6d58');g.addColorStop(.45,'#e93832');g.addColorStop(1,'#8d1618');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(5,0,22,18,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(35,8,8,.9)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(5,-17);ctx.lineTo(5,17);ctx.stroke();ctx.fillStyle='#1b1313';for(const s of[[-4,-8],[12,-9],[-3,8],[13,7],[18,0]]){ctx.beginPath();ctx.arc(s[0],s[1],3.1,0,Math.PI*2);ctx.fill()}ctx.fillStyle='rgba(255,255,255,.28)';ctx.beginPath();ctx.ellipse(-1,-9,8,3,-.25,0,Math.PI*2);ctx.fill()}else{ctx.strokeStyle='#21170e';ctx.lineWidth=5;for(const sy of[-11,0,11]){const wig=Math.sin(now*9+sy)*4;ctx.beginPath();ctx.moveTo(-10,sy*.65);ctx.lineTo(-27,sy+wig);ctx.stroke();ctx.beginPath();ctx.moveTo(10,sy*.65);ctx.lineTo(27,sy-wig);ctx.stroke()}const g=ctx.createLinearGradient(-24,-18,24,18);g.addColorStop(0,'#43331b');g.addColorStop(.45,'#927037');g.addColorStop(1,'#2d2417');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(2,0,25,19,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#2a2116';ctx.beginPath();ctx.ellipse(-19,0,13,13,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#b89a51';ctx.lineWidth=2;for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(-8,i*8);ctx.lineTo(19,i*7);ctx.stroke()}ctx.fillStyle='#d6c26f';ctx.beginPath();ctx.arc(13,-5,3,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(240,220,120,.24)';ctx.beginPath();ctx.ellipse(2,-8,13,4,-.15,0,Math.PI*2);ctx.fill()}ctx.restore();hpbar(e,e.type==='bombBeetle'?58:52);ctx.fillStyle='#fff';ctx.font='800 10px system-ui';ctx.textAlign='center';ctx.fillText(e.label|| (e.type==='ladybug'?'무당벌레':'폭탄먼지벌레'),e.x,e.y-e.r-29)};toast('4일차 이후 적 개체수 조정 · 벌레 그래픽 선명화');})();`)}catch(e){console.error('v4 inner patch',e)}};if(mid.contentDocument&&mid.contentDocument.readyState==='complete')apply();mid.addEventListener('load',apply,{once:true});setTimeout(apply,500)}catch(e){console.error('v4 patch',e)}}outer.addEventListener('load',patch);</script></body></html>
