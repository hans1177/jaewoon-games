<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0c1016"><title>대충 용사 RPG</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0c1016}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0c1016}</style></head><body><iframe id="gameFrame" src="/rpg-play.html?v=cave8fix1" allow="autoplay"></iframe><script>
const fr=document.getElementById('gameFrame');
let patched=false;
const timer=setInterval(()=>{
 if(patched)return;
 try{
  const w=fr.contentWindow,d=fr.contentDocument;
  if(!d||!d.getElementById('game')||typeof w.draw!=='function'||typeof w.getAction!=='function')return;
  const sc=d.createElement('script');
  sc.textContent=`(()=>{
   if(window.__CAVE8_PATCHED)return;window.__CAVE8_PATCHED=true;
   const CAVE8={entrance:{x:1690,y:1040},chest:{x:1490,y:600},exit:{x:1690,y:600}};
   let cave8ChestOpened=false,cave8BossDead=false;
   inv['보물상자 열쇠']=inv['보물상자 열쇠']||0;
   function spawnCave8Monster(n,lvv,hpv,av,spd,r,xpv,g,type,x,y){mons.push({n,lv:lvv,x,y,hp:hpv,mhp:hpv,a:av,spd,r,xp:xpv,g,type,baseType:type,z:'cave8',hit:0,dead:false,shootCd:1+Math.random()*1.5,animState:'walk',animFrame:0,animTick:0,deathAge:0,dir:1,aggroed:false})}
   function spawnCave8(){for(let i=0;i<3;i++)spawnCave8Monster('폐허 점액괴물',13,700,24,48,19,120,25,'caveSlime',380+Math.random()*760,160+Math.random()*840);for(let i=0;i<2;i++)spawnCave8Monster('잿불 사냥개',14,950,30,70,20,150,35,'redwolf',500+Math.random()*700,170+Math.random()*820);spawnCave8Monster('거대 슬라임',15,1800,38,38,34,300,80,'slimeKing',CAVE8.chest.x-150,CAVE8.chest.y)}
   function enterCave8(){zone='cave8';mons=[];drops=[];fx=[];arrows=[];pc=1;combatTimer=0;setAggro(false);p.x=160;p.y=600;sfx('caveEnter');spawnCave8();toastMsg('폐허 지하 던전 입장');hud()}
   const oldHud=hud;hud=function(){if(zone==='cave8'){const z=zone;zone='cave';oldHud();zone=z;area.textContent='현재 지역: 폐허 지하 던전 · Lv.13~15';return}oldHud()};
   const oldGetAction=getAction;getAction=function(){if(zone==='f8'&&Math.hypot(p.x-CAVE8.entrance.x,p.y-CAVE8.entrance.y)<95)return {label:'던전 입장',kind:'enterCave8'};if(zone==='cave8'&&!cave8ChestOpened&&Math.hypot(p.x-CAVE8.chest.x,p.y-CAVE8.chest.y)<90)return {label:(inv['보물상자 열쇠']||0)>0?'상자 열기':'열쇠 필요',kind:'cave8Chest'};if(zone==='cave8'&&Math.hypot(p.x-CAVE8.exit.x,p.y-CAVE8.exit.y)<90)return {label:'나가기',kind:'exitCave8'};return oldGetAction()};
   const oldUseAction=useAction;useAction=function(){const a=getAction();if(!a)return;if(a.kind==='enterCave8'){enterCave8();return}if(a.kind==='cave8Chest'){if((inv['보물상자 열쇠']||0)<=0){toastMsg('거대 슬라임이 떨어뜨린 열쇠가 필요하다');return}inv['보물상자 열쇠']--;cave8ChestOpened=true;p.g+=500;sfx('chestOpen');sfx('dungeonClear');hud();toastMsg('보물상자 +500골드!');setTimeout(()=>enter('town'),650);return}if(a.kind==='exitCave8'){if(combatTimer>0){toastMsg('전투 중에는 나갈 수 없다');return}enter('town');return}oldUseAction()};
   const oldKill=kill;kill=function(m){const keyDrop=(zone==='cave8'&&m.n==='거대 슬라임'&&!m.dead);if(keyDrop){cave8BossDead=true;drops.push({x:m.x,y:m.y,item:'보물상자 열쇠',t:30});toastMsg('거대 슬라임 처치! 보물상자 열쇠가 떨어졌다');sfx('chestUnlock')}oldKill(m)};
   const oldPortals=portals;portals=function(){if(zone==='cave8')return;oldPortals()};
   const oldDrawMonsterSprite=drawMonsterSprite;drawMonsterSprite=function(m){if(m.type==='tiger'||m.type==='panther'){const ot=m.type,op=MPALETTE.redwolf;MPALETTE.redwolf=MPALETTE[ot]||op;m.type='redwolf';oldDrawMonsterSprite(m);m.type=ot;MPALETTE.redwolf=op;return}oldDrawMonsterSprite(m)};
   function drawCave8Entrance(){ctx.fillStyle='#211b18';ctx.beginPath();ctx.arc(CAVE8.entrance.x,CAVE8.entrance.y,68,Math.PI,0);ctx.fill();ctx.fillRect(CAVE8.entrance.x-68,CAVE8.entrance.y,136,48);ctx.fillStyle='#030303';ctx.beginPath();ctx.arc(CAVE8.entrance.x,CAVE8.entrance.y+7,42,Math.PI,0);ctx.fill();ctx.fillRect(CAVE8.entrance.x-42,CAVE8.entrance.y+5,84,40);ctx.fillStyle='#ffcf83';ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.fillText('폐허 지하 던전',CAVE8.entrance.x,CAVE8.entrance.y-75);ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.fillText('거대 슬라임과 보물상자',CAVE8.entrance.x,CAVE8.entrance.y-58);ctx.textAlign='left'}
   const oldDraw=draw;draw=function(){if(zone==='cave8'){const z=zone,co=chestOpened;zone='cave';chestOpened=cave8ChestOpened;oldDraw();zone=z;chestOpened=co;ctx.save();ctx.fillStyle='#0008';ctx.fillRect(12,H-55,245,36);ctx.fillStyle='#fff';ctx.font='bold 13px sans-serif';ctx.fillText((inv['보물상자 열쇠']||0)>0?'보물상자 열쇠 보유':'거대 슬라임에게서 열쇠 획득',24,H-32);ctx.restore();return}oldDraw();if(zone==='f8'){ctx.save();ctx.translate(-cam.x,-cam.y);drawCave8Entrance();ctx.restore()}};
   toastMsg('8번 포탈 던전 업데이트 적용');
  })();`;
  d.body.appendChild(sc);patched=true;clearInterval(timer);
 }catch(e){}
},180);
</script></body></html>
