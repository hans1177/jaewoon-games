<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d314b">
<title>재운게임즈 · 게임 아트북</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#081722;color:#eaf6ff;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif}body{background:radial-gradient(circle at top,#17445f 0,#0a2232 42%,#06131d 100%)}a{color:inherit}.shell{width:min(100%,980px);margin:auto;padding:14px 12px 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.back{display:inline-flex;align-items:center;min-height:42px;padding:0 13px;border:1px solid #ffffff33;border-radius:12px;background:#ffffff0e;text-decoration:none;font-weight:900}.brand{font-size:12px;color:#9edcff;font-weight:900}.book{overflow:hidden;border:1px solid #ffffff24;border-radius:24px;background:#f8fbfd;color:#16384f;box-shadow:0 24px 70px #0008}.cover{position:relative;min-height:300px;padding:30px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;background:#12384f center/cover no-repeat;isolation:isolate}.cover:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#04121bea 0%,#08263899 48%,#09283b22);z-index:-1}.cover small{font-size:11px;font-weight:1000;letter-spacing:.08em;color:#9fe0ff}.cover h1{margin:7px 0 6px;font-size:34px;line-height:1.05}.cover p{max-width:680px;margin:0;font-size:13px;line-height:1.55;font-weight:800}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:13px}.meta span{padding:5px 8px;border:1px solid #ffffff55;border-radius:999px;background:#0005;font-size:9px;font-weight:1000}.intent{margin:14px;padding:12px 13px;border-radius:14px;background:#e9f6fd;color:#285d7d;font-size:12px;line-height:1.55;font-weight:850}.cuts{display:grid;gap:12px;padding:0 14px 16px}.cut{display:grid;grid-template-columns:minmax(0,44%) 1fr;min-height:210px;border:1px solid #d5e6f0;border-radius:18px;overflow:hidden;background:#fff}.cut img{width:100%;height:100%;object-fit:cover;background:#15374c}.cutBody{padding:18px}.cutNum{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:25px;padding:0 8px;border-radius:999px;background:#176fa8;color:#fff;font-size:9px;font-weight:1000}.cutKind{margin-left:5px;font-size:9px;color:#718b9a;font-weight:900}.cut h2{margin:10px 0 7px;font-size:22px;color:#174f74}.cut p{margin:0;color:#536f82;font-size:12px;line-height:1.65;font-weight:720}.progressBox{padding:14px}.progressLead{padding:13px;border-radius:14px;background:#e9f6fd;color:#285d7d;font-size:12px;line-height:1.55;font-weight:850}.deptGrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:12px}.dept{padding:11px 7px;border:1px solid #d5e6f0;border-radius:12px;background:#fff;text-align:center}.dept b{display:block;color:#17679b;font-size:11px}.dept span{display:block;margin-top:4px;color:#6d8799;font-size:10px}.meter{height:9px;margin-top:12px;border-radius:999px;background:#dceaf1;overflow:hidden}.meter>div{height:100%;background:#2387df}.pendingNote{margin-top:10px;padding:10px;border-radius:12px;background:#fff7db;color:#755b15;font-size:11px;line-height:1.5}.opinions{padding:0 14px 16px}.opinions>h2{margin:3px 0 10px;color:#174f74;font-size:23px}.opinionsLead{margin-bottom:10px;color:#607d90;font-size:11px;line-height:1.55}.avgBox{margin-bottom:10px;padding:10px 12px;border-radius:12px;background:#102d42;color:#dff3ff;font-size:11px;font-weight:900}.opinionGrid{display:grid;gap:10px}.opinion{border:1px solid #d5e6f0;border-radius:15px;background:#fff;overflow:hidden}.opinionHead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 12px;background:#102d42;color:#fff}.opinionHead b{font-size:13px}.stars{font-size:11px;color:#ffd76c;font-weight:1000}.opinionBody{padding:11px 12px}.headline{margin:0 0 9px;color:#174f74;font-size:13px;font-weight:1000}.improvement{padding:10px;border-radius:10px;background:#eef7fc;color:#245f83;font-size:11px;line-height:1.55;font-weight:850}.second{margin-top:8px;padding:8px 10px;border-radius:10px;background:#fff1d7;color:#8a5712;font-size:10px;font-weight:1000}.archive{margin-top:12px;padding:14px;border:1px solid #ffffff24;border-radius:18px;background:#ffffff0e}.archive h2{margin:0 0 8px;font-size:17px}.archiveGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.archive a,.archive div{padding:10px;border-radius:12px;background:#ffffff0d;text-decoration:none}.archive b{display:block;font-size:11px}.archive small{display:block;margin-top:3px;color:#9ab5c5;font-size:9px}.empty{padding:18px;text-align:center;color:#688698}.footer{text-align:center;color:#91abba;font-size:9px;margin-top:14px}@media(max-width:650px){.cover{min-height:250px;padding:22px 18px}.cover h1{font-size:28px}.deptGrid{grid-template-columns:1fr 1fr}.cut{grid-template-columns:1fr}.cut img{height:190px}.cutBody{padding:14px}.archiveGrid{grid-template-columns:1fr}}
</style>
</head>
<body><main class="shell">
<div class="top"><a class="back" href="/">← 홈으로</a><div class="brand">JAEWOON GAMES · GAME ARTBOOK</div></div>
<section id="book" class="book"><div class="cover"><small>GAME ARTBOOK</small><h1>아트북 불러오는 중</h1><p>게임 제작 기록을 확인하고 있어.</p></div></section>
<section class="archive"><h2>게임별 아트북</h2><div class="archiveGrid" id="archiveGrid"><div>목록 불러오는 중</div></div></section>
<div class="footer">부서 상호평가 = 타부서 결과물 보완점 1개 + 별점 5점 만점 · 평균 이하 부서는 다음날 2차 작업 · 본개발 승인과 별개</div>
</main>
<script type="module">
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const getJson=async url=>{const r=await fetch(`${url}?ts=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error(`${url}:${r.status}`);return r.json()};
const params=new URLSearchParams(location.search),requestedId=params.get('id'),requestedGame=params.get('game');
const bookEl=document.getElementById('book'),archiveGrid=document.getElementById('archiveGrid');
const roleNames={planning:'기획',graphics:'그래픽',development:'개발',qa:'QA',balance:'밸런스'};
const starText=value=>{const n=Math.max(0,Math.min(5,Math.round(Number(value)||0)));return`${'★'.repeat(n)}${'☆'.repeat(5-n)} ${Number(value||0).toFixed(1)}/5`;};
function opinionsHtml(item){const opinions=item.departmentOpinions||{},overall=Number(item.peerRatingSummary?.overallAverageStars);return `<section class="opinions"><h2>5개 부서 상호평가</h2><div class="opinionsLead">각 부서는 자기 결과를 평가하지 않고 다른 4개 부서 결과물에 보완점 1개와 별점만 남겨. 아래 점수는 각 결과물이 받은 4개 별점의 평균이야.</div>${Number.isFinite(overall)?`<div class="avgBox">전체 부서 평균 ${overall.toFixed(2)}/5 · 이 평균 이하 부서는 다음날 2차 작업</div>`:''}<div class="opinionGrid">${Object.entries(roleNames).map(([role,name])=>{const o=opinions[role]||{},avg=Number(o.averageStars),second=o.secondWorkNextDay===true;return `<article class="opinion"><div class="opinionHead"><b>${name} 결과물</b><span class="stars">${Number.isFinite(avg)?starText(avg):'평가 대기'}</span></div><div class="opinionBody"><p class="headline">${esc(o.headline||'부서 결과')}</p><div class="improvement"><b>보완점</b><br>${esc(o.priorityImprovement||'타부서 평가 대기')}</div>${second?`<div class="second">${esc(o.secondWorkDueDate||'다음날')} 2차 작업 대상 · 평균 이하</div>`:''}</div></article>`}).join('')}</div></section>`}
function renderFinal(item){const cover=item.cuts?.[0]?.image||'assets/mock.webp';bookEl.innerHTML=`<div class="cover" style="background-image:url('/${esc(cover)}')"><small>EDITION ${esc(item.edition||1)} · ${esc(item.workMode||'INITIAL')}</small><h1>${esc(item.title||item.gameName)}</h1><p>${esc(item.subtitle||'5개 부서 통합 아트북')}</p><div class="meta"><span>${esc(item.gameName)}</span><span>${esc(item.createdAt||'')}</span><span>부서 5/5</span><span>타부서 평가 5/5</span><span>본개발 승인 아님</span></div></div><div class="intent"><b>아트북 의도</b><br>${esc(item.intent||'각 부서 근거를 새 주장 없이 한 권으로 묶은 아트북')}</div><div class="cuts">${(item.cuts||[]).slice(0,10).map(c=>`<article class="cut"><img src="/${esc(c.image||'assets/mock.webp')}" alt="${esc(c.title||'')}" loading="lazy"><div class="cutBody"><span class="cutNum">CUT ${esc(c.no)}</span><span class="cutKind">${esc(c.kind||'note')}</span><h2>${esc(c.title||'')}</h2><p>${esc(c.body||'')}</p></div></article>`).join('')}</div>${opinionsHtml(item)}`}
function renderPending(game,meta){const sections=Array.isArray(game.sectionsReady)?game.sectionsReady:[],reviews=Array.isArray(game.reviewsReady)?game.reviewsReady:[];const sectionSet=new Set(sections),reviewSet=new Set(reviews),pct=Math.round(((sections.length+reviews.length)/10)*100);bookEl.innerHTML=`<div class="cover" style="background-image:url('/${esc(meta.image||'assets/mock.webp')}')"><small>IN-PROGRESS ARTBOOK</small><h1>${esc(meta.name||game.name||game.gameId)}</h1><p>${esc(game.styleProfile||'게임별 고유 아트북')} · 현재 제작 진행 상황</p><div class="meta"><span>부서 ${sections.length}/5</span><span>평가 ${reviews.length}/5</span><span>${esc(game.currentStage||game.status||'아트북 제작중')}</span><span>본개발 승인 아님</span></div></div><div class="progressBox"><div class="progressLead"><b>현재 아트북 제작중</b><br>5개 부서 결과가 모이면 각 부서는 자기 결과를 제외한 타부서 4개 결과에 보완점 1개와 별점 5점 만점 평가를 남겨. 결과물별 평균이 전체 평균 이하이면 해당 부서는 다음날 2차 작업을 해.</div><div class="meter"><div style="width:${pct}%"></div></div><div class="deptGrid">${Object.entries(roleNames).map(([r,n])=>`<div class="dept"><b>${n}</b><span>${sectionSet.has(r)?(reviewSet.has(r)?'평가 완료':'결과 완료'):'제작중/대기'}</span></div>`).join('')}</div><div class="pendingNote">장점 평가는 표시하지 않아. 보완점 1개와 별점만 핵심 기록으로 남아.</div></div>`}
try{const[registry,queue,catalog]=await Promise.all([getJson('/game-artbooks.json'),getJson('/artbook-submission-queue.json'),getJson('/game-catalog.json')]);const books=registry.artbooks||[],games=queue.games||[],catalogMap=new Map((catalog.games||[]).map(g=>[g.id,g]));const selectedBook=books.find(x=>x.id===requestedId)||(requestedGame?books.filter(x=>x.gameId===requestedGame).sort((a,b)=>(b.edition||0)-(a.edition||0))[0]:null);const selectedGame=requestedGame||selectedBook?.gameId||games[0]?.gameId,qGame=games.find(x=>x.gameId===selectedGame),meta=catalogMap.get(selectedGame)||{};archiveGrid.innerHTML=games.map(g=>{const b=books.filter(x=>x.gameId===g.gameId).sort((a,c)=>(c.edition||0)-(a.edition||0))[0];return `<a href="/artbook.html?game=${encodeURIComponent(g.gameId)}"><b>${esc(g.name||catalogMap.get(g.gameId)?.name||g.gameId)}</b><small>${b?'아트북 + 보완점/별점 보기':`진행 중 · 부서 ${(g.sectionsReady||[]).length}/5 · 평가 ${(g.reviewsReady||[]).length}/5`}</small></a>`}).join('');if(selectedBook)renderFinal(selectedBook);else if(qGame)renderPending(qGame,meta);else bookEl.innerHTML='<div class="empty">아트북 대상을 찾지 못했어.</div>';}catch(e){bookEl.innerHTML='<div class="empty">아트북 데이터를 불러오지 못했어.</div>';archiveGrid.innerHTML='<div>목록 연결 확인 필요</div>'}
</script></body></html>
