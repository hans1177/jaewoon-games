<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d314b">
<title>재운게임즈 · 게임 아트북</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#071722;color:#eaf6ff;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif}body{background:radial-gradient(circle at top,#17445f 0,#0a2232 45%,#06131d 100%)}body.modalOpen{overflow:hidden}a{color:inherit}.shell{width:min(100%,920px);margin:auto;padding:12px 10px 36px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.back{display:flex;align-items:center;min-height:42px;padding:0 13px;border:1px solid #ffffff33;border-radius:12px;background:#ffffff0d;text-decoration:none;font-weight:900}.brand{font-size:11px;color:#9edcff;font-weight:900}.book{overflow:hidden;border:1px solid #ffffff24;border-radius:22px;background:#f6fbfe;color:#15384f;box-shadow:0 22px 60px #0008}.bookHead{padding:18px;background:linear-gradient(135deg,#0e354f,#174c69);color:#fff}.bookHead small{font-size:10px;color:#9edcff;font-weight:1000;letter-spacing:.08em}.bookHead h1{margin:5px 0 3px;font-size:27px;line-height:1.1}.bookHead p{margin:0;color:#d4e9f4;font-size:11px;font-weight:750;line-height:1.45}.meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}.meta span{padding:5px 8px;border:1px solid #ffffff55;border-radius:999px;background:#06172577;font-size:9px;font-weight:900}.intent{margin:10px 12px;padding:10px 11px;border-radius:12px;background:#e9f6fd;color:#2a6281;font-size:10px;line-height:1.5;font-weight:800}.pages{display:grid;gap:12px;padding:0 12px 14px}.pageCard{overflow:hidden;border:1px solid #d4e6f0;border-radius:17px;background:#fff}.pageVisual{aspect-ratio:16/9;background:#12374e}.pageVisual img{width:100%;height:100%;display:block;object-fit:cover}.pageInfo{padding:10px 12px 11px}.pageTop{display:flex;align-items:center;justify-content:space-between;gap:8px}.pageNo{display:inline-flex;align-items:center;min-height:25px;padding:0 8px;border-radius:999px;background:#177caf;color:#fff;font-size:9px;font-weight:1000}.role{font-size:10px;font-weight:1000;color:#648498}.role.planning{color:#2e7695}.role.graphics{color:#8b4b95}.role.development{color:#416faf}.role.qa{color:#377962}.role.balance{color:#86468f}.role.director{color:#725a25}.pageInfo h2{margin:8px 0 3px;color:#174f74;font-size:18px;line-height:1.25}.pageInfo p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0;color:#5c7889;font-size:10px;line-height:1.5;font-weight:700}.reviewLaunch{padding:0 12px 14px}.reviewOpen{width:100%;min-height:44px;border:1px solid #8fc4df;border-radius:12px;background:#12384f;color:#fff;font-size:11px;font-weight:1000;cursor:pointer}.reviewOpen span{display:block;margin-top:2px;color:#bfe9ff;font-size:8px;font-weight:800}.reviewModal[hidden]{display:none}.reviewModal{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;background:#00101ccc;backdrop-filter:blur(6px)}.reviewDialog{width:min(100%,720px);max-height:min(86vh,760px);overflow:hidden;border:1px solid #ffffff35;border-radius:18px;background:#f6fbfe;color:#15384f;box-shadow:0 24px 80px #000b}.reviewModalHead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;background:#12384f;color:#fff}.reviewModalHead h2{margin:0;font-size:15px}.reviewClose{width:36px;height:36px;border:1px solid #ffffff55;border-radius:10px;background:#ffffff12;color:#fff;font-size:24px;line-height:1;cursor:pointer}.reviewScroll{max-height:calc(min(86vh,760px) - 62px);overflow:auto;padding:12px}.reviewLead,.avg{margin-bottom:8px;padding:9px 10px;border-radius:10px;background:#e8f5fc;color:#426d87;font-size:9px;line-height:1.45;font-weight:800}.avg{background:#102d42;color:#dff3ff}.reviewGrid{display:grid;gap:7px}.review{border:1px solid #d8e7ef;border-radius:12px;overflow:hidden;background:#fff}.reviewHead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;background:#12384f;color:#fff}.reviewHead b{font-size:10px}.stars{font-size:9px;color:#ffd76c;font-weight:1000}.reviewBody{padding:9px 10px}.reviewBody p{margin:0 0 6px;color:#2c6685;font-size:10px;font-weight:900}.improve{color:#557688;font-size:9px;line-height:1.45}.second{margin-top:6px;padding:6px 8px;border-radius:8px;background:#fff2d8;color:#86550d;font-size:8px;font-weight:900}.progressBox{padding:12px}.progressLead{padding:11px;border-radius:12px;background:#e9f6fd;color:#285d7d;font-size:10px;line-height:1.5;font-weight:850}.deptGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}.dept{padding:9px 5px;border:1px solid #d7e7ef;border-radius:10px;text-align:center;background:#fff}.dept b{display:block;color:#17679b;font-size:10px}.dept span{display:block;margin-top:3px;color:#6d8799;font-size:8px}.archive{margin-top:10px;padding:12px;border:1px solid #ffffff24;border-radius:16px;background:#ffffff0d}.archive h2{margin:0 0 8px;font-size:15px}.archiveGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.archive a,.archive div{padding:9px;border-radius:10px;background:#ffffff0d;text-decoration:none}.archive b{display:block;font-size:10px}.archive small{display:block;margin-top:2px;color:#9ab5c5;font-size:8px}.empty{padding:18px;text-align:center;color:#688698}.footer{text-align:center;color:#91abba;font-size:8px;margin-top:12px}@media(max-width:650px){.shell{padding-left:8px;padding-right:8px}.brand{font-size:9px}.bookHead{padding:15px}.bookHead h1{font-size:23px}.pages{padding:0 9px 11px;gap:10px}.pageInfo{padding:9px 10px}.pageInfo h2{font-size:16px}.intent{margin:9px}.reviewLaunch{padding:0 9px 11px}.reviewModal{padding:8px;align-items:flex-end}.reviewDialog{max-height:92dvh;border-radius:18px 18px 10px 10px}.reviewScroll{max-height:calc(92dvh - 62px)}.deptGrid{grid-template-columns:1fr 1fr}.archiveGrid{grid-template-columns:1fr}}
</style>
</head>
<body><main class="shell">
<div class="top"><a class="back" href="/">← 홈으로</a><div class="brand">JAEWOON GAMES · ARTBOOK</div></div>
<section id="book" class="book"><div class="bookHead"><small>GAME ARTBOOK</small><h1>아트북 불러오는 중</h1><p>10장 시각 아트북을 확인하고 있어.</p></div></section>
<section class="archive"><h2>게임별 아트북</h2><div class="archiveGrid" id="archiveGrid"><div>목록 불러오는 중</div></div></section>
<div class="footer">아트북 10장 · 부서별 독립 작업 · 평가는 팝업으로 확인</div>
</main>
<div class="reviewModal" id="reviewModal" hidden role="dialog" aria-modal="true" aria-labelledby="reviewModalTitle">
  <div class="reviewDialog">
    <div class="reviewModalHead"><h2 id="reviewModalTitle">부서 평가 · 보완점 보기</h2><button class="reviewClose" id="reviewModalClose" type="button" aria-label="평가 팝업 닫기">×</button></div>
    <div class="reviewScroll" id="reviewModalContent"></div>
  </div>
</div>
<script type="module">
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const getJson=async url=>{const r=await fetch(`${url}?ts=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error(`${url}:${r.status}`);return r.json()};
const params=new URLSearchParams(location.search),requestedId=params.get('id'),requestedGame=params.get('game');
const bookEl=document.getElementById('book'),archiveGrid=document.getElementById('archiveGrid');
const reviewModal=document.getElementById('reviewModal'),reviewModalContent=document.getElementById('reviewModalContent'),reviewModalClose=document.getElementById('reviewModalClose');
const roleNames={planning:'기획',graphics:'그래픽',development:'개발',qa:'QA',balance:'밸런스',director:'총괄'};
const starText=value=>{const n=Math.max(0,Math.min(5,Math.round(Number(value)||0)));return`${'★'.repeat(n)}${'☆'.repeat(5-n)} ${Number(value||0).toFixed(1)}/5`;};
function reviewContentHtml(item){const opinions=item.departmentOpinions||{},summary=item.ratingSummary||{},overall=Number(summary.overallAverageStars);return `<div class="reviewLead">타부서 4표 + 총괄 1표. 아트북 본문과 분리된 내부 평가 정보야.</div>${Number.isFinite(overall)?`<div class="avg">전체 부서 평균 ${overall.toFixed(2)}/5</div>`:''}<div class="reviewGrid">${Object.entries(roleNames).filter(([r])=>r!=='director').map(([role,name])=>{const o=opinions[role]||{},avg=Number(o.averageStars),second=o.secondWorkNextDay===true||o.secondWorkSameDay===true;return `<article class="review"><div class="reviewHead"><b>${name}</b><span class="stars">${Number.isFinite(avg)?starText(avg):'평가 대기'}</span></div><div class="reviewBody"><p>${esc(o.headline||`${name} 결과물`)}</p><div class="improve"><b>보완점</b> · ${esc(o.priorityImprovement||'평가 대기')}</div>${second?`<div class="second">${esc(o.secondWorkDueDate||'재수정 예정')} 2차 작업 대상</div>`:''}</div></article>`}).join('')}</div>`}
function reviewsHtml(){return `<div class="reviewLaunch"><button class="reviewOpen" id="openReviewModal" type="button">부서 평가 보기<span>별점 · 보완점 · 전체 평균 · 재수정 대상</span></button></div>`}
function openReviews(item){reviewModalContent.innerHTML=reviewContentHtml(item);reviewModal.hidden=false;document.body.classList.add('modalOpen');reviewModalClose.focus()}
function closeReviews(){reviewModal.hidden=true;document.body.classList.remove('modalOpen')}
reviewModalClose.onclick=closeReviews;
reviewModal.addEventListener('click',e=>{if(e.target===reviewModal)closeReviews()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!reviewModal.hidden)closeReviews()});
function renderFinal(item){const cuts=(item.cuts||[]).slice(0,10);bookEl.innerHTML=`<div class="bookHead"><small>완료 아트북 · ${cuts.length}/10장</small><h1>${esc(item.title||item.gameName)}</h1><p>${esc(item.subtitle||'부서별 시각 작업을 한 권으로 정리')}</p><div class="meta"><span>${esc(item.gameName)}</span><span>${esc(item.createdAt||'')}</span><span>10장</span><span>부서 AI 작업</span></div></div><div class="intent">이미지부터 보고 게임 컨셉·스토리·그래픽·시스템·테스트·밸런스를 빠르게 이해하는 구성.</div><div class="pages">${cuts.map((c,i)=>{const role=c.sourceDepartment||c.kind||'director';return `<article class="pageCard"><div class="pageVisual"><img src="/${esc(c.image||'assets/mock.webp')}" alt="${esc(c.title||'아트북 페이지')}" loading="lazy"></div><div class="pageInfo"><div class="pageTop"><span class="pageNo">${i+1} / 10</span><span class="role ${esc(role)}">${esc(roleNames[role]||role)}</span></div><h2>${esc(c.title||'')}</h2><p>${esc(c.body||'')}</p></div></article>`}).join('')}</div>${reviewsHtml()}`;const open=document.getElementById('openReviewModal');if(open)open.onclick=()=>openReviews(item)}
function renderPending(game,meta){const sections=Array.isArray(game.sectionsReady)?game.sectionsReady:[],reviews=Array.isArray(game.reviewsReady)?game.reviewsReady:[],s=new Set(sections),r=new Set(reviews);bookEl.innerHTML=`<div class="bookHead"><small>아트북 제작중</small><h1>${esc(meta.name||game.name||game.gameId)}</h1><p>부서 AI가 시각 페이지를 작업하고 있어.</p><div class="meta"><span>부서 ${sections.length}/5</span><span>평가 ${reviews.length}/5</span><span>최종 10장</span></div></div><div class="progressBox"><div class="progressLead">완료 기준: 표지 1 + 기획 2 + 그래픽 2 + 개발 2 + QA 1 + 밸런스 1 + 총괄 1 = 정확히 10장</div><div class="deptGrid">${Object.entries(roleNames).filter(([k])=>k!=='director').map(([k,n])=>`<div class="dept"><b>${n}</b><span>${s.has(k)?(r.has(k)?'작업+평가 완료':'작업 완료'):'작업중'}</span></div>`}).join('')}</div></div>`}
try{const[registry,queue,catalog]=await Promise.all([getJson('/game-artbooks.json'),getJson('/artbook-submission-queue.json'),getJson('/game-catalog.json')]);const books=registry.artbooks||[],games=queue.games||[],catalogMap=new Map((catalog.games||[]).map(g=>[g.id,g]));const selectedBook=books.find(x=>x.id===requestedId)||(requestedGame?books.filter(x=>x.gameId===requestedGame).sort((a,b)=>(b.edition||0)-(a.edition||0))[0]:null);const selectedGame=requestedGame||selectedBook?.gameId||games[0]?.gameId,qGame=games.find(x=>x.gameId===selectedGame),meta=catalogMap.get(selectedGame)||{};archiveGrid.innerHTML=games.map(g=>{const b=books.filter(x=>x.gameId===g.gameId).sort((a,c)=>(c.edition||0)-(a.edition||0))[0];return `<a href="/artbook.html?game=${encodeURIComponent(g.gameId)}"><b>${esc(g.name||catalogMap.get(g.gameId)?.name||g.gameId)}</b><small>${b?`${b.cutCount||b.cuts?.length||0}/10장 · ${b.status==='completed-artbook'?'완료':'작업중'}`:`진행 중 · 부서 ${(g.sectionsReady||[]).length}/5`}</small></a>`}).join('')||'<div>아트북 없음</div>';if(selectedBook)renderFinal(selectedBook);else if(qGame)renderPending(qGame,meta);else bookEl.innerHTML='<div class="empty">아트북 대상을 찾지 못했어.</div>';}catch(e){bookEl.innerHTML='<div class="empty">아트북 데이터를 불러오지 못했어.</div>';archiveGrid.innerHTML='<div>목록 연결 확인 필요</div>'}
</script>
</body>
</html>
