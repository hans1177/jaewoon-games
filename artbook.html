<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d314b">
<title>재운게임즈 · 게임 아트북</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#081722;color:#eaf6ff;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif}body{background:radial-gradient(circle at top,#17445f 0,#0a2232 42%,#06131d 100%)}a{color:inherit}.shell{width:min(100%,980px);margin:auto;padding:14px 12px 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.back{display:inline-flex;align-items:center;min-height:40px;padding:0 12px;border:1px solid #ffffff33;border-radius:12px;background:#ffffff0e;text-decoration:none;font-weight:900}.brand{font-size:12px;color:#9edcff;font-weight:900}.book{overflow:hidden;border:1px solid #ffffff24;border-radius:24px;background:#f8fbfd;color:#16384f;box-shadow:0 24px 70px #0008}.cover{position:relative;min-height:320px;padding:32px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;background:#12384f center/cover no-repeat;isolation:isolate}.cover:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#04121bea 0%,#08263899 48%,#09283b22);z-index:-1}.cover small{font-size:10px;font-weight:1000;letter-spacing:.1em;color:#9fe0ff}.cover h1{margin:7px 0 6px;font-size:34px;line-height:1.05}.cover p{max-width:680px;margin:0;font-size:13px;line-height:1.55;font-weight:800}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:13px}.meta span{padding:5px 8px;border:1px solid #ffffff55;border-radius:999px;background:#0005;font-size:8px;font-weight:1000}.intent{margin:14px;padding:12px 13px;border-radius:14px;background:#e9f6fd;color:#285d7d;font-size:11px;line-height:1.55;font-weight:850}.cuts{display:grid;gap:12px;padding:0 14px 16px}.cut{display:grid;grid-template-columns:minmax(0,44%) 1fr;min-height:210px;border:1px solid #d5e6f0;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 9px 23px #244f6912}.cut img{width:100%;height:100%;object-fit:cover;background:#15374c}.cutBody{padding:18px}.cutNum{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:25px;padding:0 8px;border-radius:999px;background:#176fa8;color:#fff;font-size:9px;font-weight:1000}.cutKind{margin-left:5px;font-size:8px;color:#718b9a;font-weight:900;text-transform:uppercase}.cut h2{margin:10px 0 7px;font-size:22px;color:#174f74}.cut p{margin:0;color:#536f82;font-size:12px;line-height:1.65;font-weight:720}.music,.feedback{margin:0 14px 16px;padding:14px;border:1px solid #d3e5ef;border-radius:18px;background:#fff}.music h2,.feedback h2{margin:0 0 8px;color:#175f91;font-size:18px}.music iframe{width:100%;height:145px;border:0;border-radius:12px;background:#06131d}.muted{color:#7892a1;font-size:10px;line-height:1.5}.feedbackTop{display:flex;justify-content:space-between;align-items:center;gap:8px}.commentBtn{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 12px;border-radius:11px;background:#176fa8;color:#fff;text-decoration:none;font-size:10px;font-weight:1000}.comments{display:grid;gap:7px;margin-top:10px}.comment{display:grid;grid-template-columns:34px 1fr;gap:8px;padding:9px;border-radius:12px;background:#eff7fb}.comment img{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#d5e8f2}.comment b{font-size:10px;color:#17648f}.comment p{margin:3px 0 0;white-space:pre-wrap;color:#526f82;font-size:10px;line-height:1.5}.empty{padding:14px;border:1px dashed #c5d9e4;border-radius:13px;color:#688698;text-align:center;font-size:10px}.archive{margin-top:12px;padding:14px;border:1px solid #ffffff24;border-radius:18px;background:#ffffff0e}.archive h2{margin:0 0 8px;font-size:17px}.archiveGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.archive a{padding:10px;border-radius:12px;background:#ffffff0d;text-decoration:none}.archive b{display:block;font-size:11px}.archive small{display:block;margin-top:3px;color:#9ab5c5;font-size:8px}.footer{text-align:center;color:#91abba;font-size:9px;margin-top:14px}
@media(max-width:650px){.cover{min-height:275px;padding:24px 20px}.cover h1{font-size:29px}.cut{grid-template-columns:1fr}.cut img{height:190px}.cutBody{padding:14px}.archiveGrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="shell">
<div class="top"><a class="back" href="/">← 홈으로</a><div class="brand">JAEWOON GAMES · GAME ARTBOOK</div></div>
<section id="book" class="book"><div class="cover"><small>GAME ARTBOOK</small><h1>아트북 불러오는 중</h1><p>게임 제작 기록을 불러오고 있어.</p></div></section>
<section class="archive"><h2>보존된 에디션</h2><div class="archiveGrid" id="archiveGrid"><div class="muted">목록 불러오는 중</div></div></section>
<div class="footer">초안도 회사의 자산으로 보존 · 한 에디션 최대 10컷 · 댓글은 다음 제작 검토 입력으로 사용</div>
</main>
<script type="module">
import {loadPublishedArtbooks,loadIssueComments} from '/assets/artbook-runtime.js';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params=new URLSearchParams(location.search);const requested=params.get('id');
const book=document.getElementById('book'),archiveGrid=document.getElementById('archiveGrid');
function musicHtml(music){if(!music?.youtubeId)return`<section class="music"><h2>음악 노트</h2><div class="muted">이 에디션은 음악을 고정하지 않았어. 게임 분위기에 맞는 곡이 확정되면 다음 에디션에 제작 의도와 함께 남겨.</div></section>`;return`<section class="music"><h2>${esc(music.title||'아트북 음악')}</h2><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(music.youtubeId)}?playsinline=1&rel=0" title="아트북 음악" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe></section>`}
function feedbackHtml(item){const issue=item.feedback?.issueNumber,url=item.feedback?.issueUrl;return`<section class="feedback"><div class="feedbackTop"><div><h2>제작 댓글</h2><div class="muted">아트북을 보며 남긴 의견은 다음 기획·QA·그래픽·밸런스 검토에 참고해.</div></div>${url?`<a class="commentBtn" href="${esc(url)}" target="_blank" rel="noopener">댓글 작성</a>`:''}</div><div class="comments" id="comments">${issue?'댓글 불러오는 중':'피드백 스레드 준비 중'}</div></section>`}
function render(item){const cover=item.cuts?.[0]?.image||'assets/mock.webp';book.innerHTML=`<div class="cover" style="background-image:url('${esc(cover)}')"><small>EDITION ${esc(item.edition)} · ${esc(item.status||'draft')}</small><h1>${esc(item.title)}</h1><p>${esc(item.subtitle||'')}</p><div class="meta"><span>${esc(item.gameName)}</span><span>${esc(item.createdAt)}</span><span>최대 ${Math.min(10,item.cuts?.length||0)}컷</span><span>초안 자산 보존</span></div></div><div class="intent"><b>계획 의도</b><br>${esc(item.intent||'')}</div><div class="cuts">${(item.cuts||[]).slice(0,10).map(c=>`<article class="cut"><img src="/${esc(c.image||'assets/mock.webp')}" alt="${esc(c.title||'')}" loading="lazy"><div class="cutBody"><span class="cutNum">CUT ${esc(c.no)}</span><span class="cutKind">${esc(c.kind||'note')}</span><h2>${esc(c.title)}</h2><p>${esc(c.body)}</p></div></article>`).join('')}</div>${musicHtml(item.music)}${feedbackHtml(item)}`;if(item.feedback?.issueNumber)loadComments(item.feedback.issueNumber)}
async function loadComments(issue){const el=document.getElementById('comments');if(!el)return;const comments=await loadIssueComments(issue,{limit:12});if(!comments.length){el.innerHTML='<div class="empty">아직 댓글이 없어. 첫 제작 의견을 남길 수 있어.</div>';return}el.innerHTML=comments.map(c=>`<a class="comment" href="${esc(c.url)}" target="_blank" rel="noopener"><img src="${esc(c.avatar)}" alt=""><div><b>${esc(c.author)}</b><p>${esc(c.body)}</p></div></a>`).join('')}
try{const items=await loadPublishedArtbooks();const selected=items.find(x=>x.id===requested)||items[0];archiveGrid.innerHTML=items.length?items.map(x=>`<a href="/artbook.html?id=${encodeURIComponent(x.id)}"><b>${esc(x.gameName)} · Edition ${esc(x.edition)}</b><small>${esc(x.title)}</small></a>`).join(''):'<div class="muted">공개된 아트북이 없어.</div>';if(selected)render(selected);else book.innerHTML='<div class="empty">공개된 게임 아트북이 아직 없어.</div>'}catch(error){book.innerHTML='<div class="empty">아트북을 불러오지 못했어. 잠시 뒤 다시 확인해.</div>';archiveGrid.innerHTML='<div class="muted">아트북 목록 연결 확인 필요</div>'}
</script>
</body>
</html>
