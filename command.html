<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#242424">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/assets/pwa-icon.svg" type="image/svg+xml">
<title>재운컴퍼니 · AI 개발 채팅</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{color-scheme:dark;--bg:#242424;--panel:#30302f;--panel2:#343433;--text:#deddd8;--muted:#aaa9a4;--line:#484846;--danger:#f2beb8;--ok:#b8e8c8;--warn:#e6c889}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",system-ui,sans-serif;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
body{min-height:100dvh}button,select,textarea,input{font:inherit}a{color:inherit}
.app{width:min(100%,820px);height:100dvh;margin:auto;display:grid;grid-template-rows:auto auto minmax(0,1fr);background:var(--bg)}
.top{z-index:10;padding:max(10px,env(safe-area-inset-top)) 14px 8px;background:rgba(36,36,36,.97);backdrop-filter:blur(14px)}
.topRow{height:48px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brandLink{display:inline-flex;align-items:center;min-height:38px;text-decoration:none;color:var(--text);font-size:18px;font-weight:650;letter-spacing:-.01em}.nav{display:flex;gap:7px;align-items:center}.nav a,.topBtn{height:38px;padding:0 13px;border:0;border-radius:19px;display:flex;align-items:center;justify-content:center;background:#30302f;color:var(--text);text-decoration:none;font-size:14px;font-weight:600}.topBtn{cursor:pointer}.topBtn.connected{color:var(--ok)}.topBtn.attention{color:var(--warn)}
.controls{display:flex;gap:8px;padding:0 14px 10px;overflow-x:auto;scrollbar-width:none}.controls::-webkit-scrollbar{display:none}.controls select{flex:1;min-width:0;height:42px;padding:0 34px 0 13px;border:1px solid var(--line);border-radius:21px;background:#2d2d2c;color:var(--text);font-size:14px;font-weight:560;outline:none}
.chat{min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:8px 14px 116px;scrollbar-width:none}.chat::-webkit-scrollbar{display:none}.intro{max-width:680px;margin:28px auto 30px;padding:0 18px;text-align:center;color:var(--muted);font-size:16px;line-height:1.65}.intro b{display:block;margin-bottom:5px;color:var(--text);font-size:21px;font-weight:650}.intro[hidden]{display:none}
.group{width:min(100%,720px);margin:0 auto 24px}.groupTitle{margin:0 2px 7px;color:#96958f;font-size:12px;font-weight:600}.bubble{white-space:pre-wrap;word-break:break-word;font-size:17px;line-height:1.68;letter-spacing:-.01em;font-weight:400}.owner{width:fit-content;max-width:85%;margin-left:auto;padding:10px 14px;border-radius:20px;background:#343433;color:var(--text)}.company{max-width:100%;padding:8px 2px;color:var(--text)}.company.system{margin-top:6px;padding:10px 13px;border-radius:16px;background:#2c2c2b;color:#cfcec9;font-size:17px;line-height:1.68}.statusLine{display:flex;justify-content:flex-end;margin:7px 3px 0}.status{display:inline-flex;align-items:center;min-height:25px;padding:0 9px;border-radius:999px;background:#2d2d2c;color:#aaa9a4;font-size:12px;font-weight:650}.status.done{color:var(--ok)}.status.warn{color:var(--warn)}.status.fail{color:var(--danger)}.empty{padding:44px 12px;text-align:center;color:#96958f;font-size:16px;line-height:1.6}.localError{width:min(100%,720px);margin:0 auto 16px;padding:11px 13px;border-radius:14px;background:#352927;color:var(--danger);font-size:16px;line-height:1.6}
.claimWrap{padding:14px}.claim{width:min(100%,620px);margin:auto;padding:18px;border:1px solid var(--line);border-radius:18px;background:#2d2d2c}.claim h2{margin:0 0 6px;font-size:20px}.claim p{margin:0 0 12px;color:var(--muted);font-size:15px;line-height:1.6}.claimGrid{display:grid;grid-template-columns:1fr auto;gap:8px}.claim input{height:50px;padding:0 13px;border:1px solid #555;border-radius:14px;background:#242424;color:var(--text);font-size:17px;outline:none}.btn{min-height:50px;padding:0 16px;border:0;border-radius:14px;background:#e4e3df;color:#171717;font-size:15px;font-weight:700}.state{margin-top:10px;color:var(--muted);font-size:14px}
.composer{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:18px 10px max(10px,env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(36,36,36,0),#242424 28%,#242424)}.composerInner{width:min(calc(100% - 8px),760px);margin:auto;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:6px;padding:7px 7px 7px 12px;border:1px solid var(--line);border-radius:27px;background:var(--panel)}.composer textarea{width:100%;min-height:44px;max-height:160px;padding:9px 4px 8px;border:0;background:transparent;color:var(--text);font-size:17px;line-height:1.58;resize:none;outline:none;overflow-y:auto}.composer textarea::placeholder{color:#9b9a95}.send{width:40px;height:40px;min-width:40px;border:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#e4e3df;color:#171717;font-size:26px;line-height:1;font-weight:500;padding:0 0 3px}.send:disabled{background:#565654;color:#9a9994}.send:active:not(:disabled){transform:scale(.97)}.pendingAi{display:inline-flex;gap:5px;align-items:center;min-height:34px;padding:9px 2px;color:#aaa9a4}.pendingAi i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.45}
.sheetWrap[hidden]{display:none}.sheetWrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}.sheetShade{position:absolute;inset:0;background:#0008}.sheet{position:relative;width:min(100%,620px);padding:18px 16px max(18px,env(safe-area-inset-bottom));border-radius:24px 24px 0 0;background:#2d2d2c;box-shadow:0 -12px 40px #0006}.sheetTop{display:flex;align-items:center;justify-content:space-between;gap:12px}.sheet h2{margin:0;font-size:20px}.closeBtn{width:38px;height:38px;border:0;border-radius:50%;background:#3a3a38;color:var(--text);font-size:22px}.sheet p{margin:10px 0 14px;color:var(--muted);font-size:15px;line-height:1.6}.keyInput{width:100%;height:52px;padding:0 14px;border:1px solid #555;border-radius:15px;background:#242424;color:var(--text);font-size:17px;outline:none}.keyActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.keyActions a,.keyActions button{height:48px;border:0;border-radius:14px;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:15px;font-weight:700}.keyActions a{background:#3a3a38;color:var(--text)}.keyActions button{background:#e4e3df;color:#171717}.keyActions button:disabled{opacity:.5}.setupState{min-height:22px;margin-top:10px;color:#bdbcb6;font-size:14px}.setupState.ok{color:var(--ok)}.setupState.bad{color:var(--danger)}.privacy{margin-top:4px!important;font-size:13px!important;color:#96958f!important}
@media(max-width:520px){.top,.controls{padding-left:10px;padding-right:10px}.chat{padding-left:12px;padding-right:12px}.owner{max-width:88%}.claimGrid{grid-template-columns:1fr}.composer{padding-left:7px;padding-right:7px}.composerInner{width:100%}.nav a{display:none}.topBtn{padding:0 12px}.keyActions{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div class="topRow"><a class="brandLink" href="/" aria-label="재운컴퍼니 메인 홈페이지">재운컴퍼니</a><nav class="nav"><button class="topBtn attention" id="providerBtn" type="button">Gemini 연결</button><a href="/">게임 홈</a></nav></div></header>
<section class="controls" id="controls"><select id="game" aria-label="게임"><option value="">회사 공통 / 자동 인식</option></select><select id="priority" aria-label="우선순위"><option value="normal">일반</option><option value="priority">우선</option><option value="urgent">긴급</option></select></section>
<section class="claimWrap" id="claimWrap" hidden><div class="claim"><h2>이 휴대폰 등록</h2><p>처음 한 번만 등록해. 기기 토큰은 이 브라우저에만 저장돼.</p><div class="claimGrid"><input id="claimCode" type="password" autocomplete="one-time-code" placeholder="기기 등록 코드"><button class="btn" id="claimBtn" type="button">등록</button></div><div class="state" id="claimState">등록 코드가 필요해.</div></div></section>
<section class="chat" id="chat"><div class="intro" id="intro"><b>무엇을 개발할까?</b>현재 재운컴퍼니 개발 상태를 알고 있어. 게임 이름을 말하거나 그냥 “우리 개발 중인 게임”이라고 물어봐도 돼.</div><div id="runtimeError" class="localError" hidden></div><div id="messages"><div class="empty">대화 기록 불러오는 중</div></div></section>
</main>
<div class="composer" id="composer"><div class="composerInner"><textarea id="body" maxlength="3000" rows="1" enterkeyhint="send" placeholder="메시지 보내기"></textarea><button class="send" id="sendBtn" type="button" aria-label="전송">↑</button></div></div>
<div class="sheetWrap" id="aiSetup" hidden><div class="sheetShade" id="sheetShade"></div><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="setupTitle"><div class="sheetTop"><h2 id="setupTitle">Gemini 연결</h2><button class="closeBtn" id="closeSetup" type="button" aria-label="닫기">×</button></div><p>Google AI Studio에서 무료 API 키를 만든 뒤 아래에 한 번만 입력하면 돼.</p><input class="keyInput" id="geminiKey" type="password" autocomplete="off" spellcheck="false" placeholder="Gemini API 키"><div class="keyActions"><a href="https://ai.google.dev/aistudio" target="_blank" rel="noopener noreferrer">AI Studio 열기</a><button id="saveGemini" type="button">연결</button></div><div class="setupState" id="setupState">아직 Gemini가 연결되지 않았어.</div><p class="privacy">키는 브라우저에 저장하지 않고 서버의 Supabase Vault에 암호화 저장해.</p></section></div>
<script>
const API='https://njpexgqvituaxrjpnqsi.supabase.co/functions/v1/company-command';
const CHAT_API='https://njpexgqvituaxrjpnqsi.supabase.co/functions/v1/company-ai-chat';
const API_KEY='sb_publishable_ybAF71npJQz6PJVpnwsQ4g_rsyzlkFQ';
const TOKEN_KEY='jaewoon_command_device_v1';
const ACTIVE_KEY='jaewoon_ai_chat_task_v1';
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const labels={received:'지시 접수',working:'작업중',testing:'QA·배포검증',needs_input:'확인필요',done:'완료',failed:'실패',cancelled:'취소'};
const errorLabels={GEMINI_NOT_CONFIGURED:'Gemini 연결이 필요해.',GEMINI_KEY_REJECTED:'Gemini API 키를 확인해줘.',GEMINI_LIMIT:'Gemini 무료 사용 한도에 걸렸어. 잠시 뒤 다시 보내줘.',GEMINI_ERROR:'Gemini 연결이 잠깐 실패했어. 다시 보내줘.',SERVER_ERROR:'서버 연결을 확인해줘.'};
const gameNames=new Map();
let companyContext={updatedAt:'',focused:[],releaseConfirmed:[],developmentConfirmed:[],projects:[],games:[]};
let token=localStorage.getItem(TOKEN_KEY)||'';
let activeTaskId=localStorage.getItem(ACTIVE_KEY)||'';
let refreshTimer=null,loading=false,sending=false,providerConfigured=false,pendingNode=null;
async function request(endpoint,payload,needsToken=true){const headers={'Content-Type':'application/json','apikey':API_KEY};if(needsToken&&token)headers['x-jaewoon-device']=token;const response=await fetch(endpoint,{method:'POST',headers,body:JSON.stringify(payload),cache:'no-store'});const data=await response.json().catch(()=>({ok:false,error:'INVALID_RESPONSE'}));if(!response.ok){const error=new Error(data.error||`HTTP_${response.status}`);error.data=data;throw error;}return data;}
const api=(payload,needsToken=true)=>request(API,payload,needsToken);
const chatApi=payload=>request(CHAT_API,payload,true);
function statusClass(status){if(status==='done')return'done';if(status==='failed')return'fail';if(status==='needs_input')return'warn';return'';}
function showRuntimeError(message=''){$('runtimeError').textContent=message;$('runtimeError').hidden=!message;}
function setRegistered(ok){$('claimWrap').hidden=ok;$('composer').style.display=ok?'block':'none';$('controls').style.opacity=ok?'1':'.45';$('game').disabled=!ok;$('priority').disabled=!ok;$('providerBtn').disabled=!ok;}
function syncProviderUi(){const btn=$('providerBtn');btn.textContent=providerConfigured?'Gemini ✓':'Gemini 연결';btn.classList.toggle('connected',providerConfigured);btn.classList.toggle('attention',!providerConfigured);}
function syncSendState(){$('sendBtn').disabled=sending||!$('body').value.trim();}
function resizeComposer(){const box=$('body');box.style.height='auto';box.style.height=`${Math.min(box.scrollHeight,160)}px`;syncSendState();}
function scrollBottom(){requestAnimationFrame(()=>{$('chat').scrollTop=$('chat').scrollHeight;});}
function openSetup(message=''){$('aiSetup').hidden=false;$('setupState').textContent=message||(providerConfigured?'Gemini가 연결돼 있어.':'아직 Gemini가 연결되지 않았어.');$('setupState').className='setupState';setTimeout(()=>$('geminiKey').focus(),80);}
function closeSetup(){$('aiSetup').hidden=true;$('geminiKey').value='';}
async function checkProvider(){if(!token){providerConfigured=false;syncProviderUi();return;}try{const data=await chatApi({action:'status'});providerConfigured=Boolean(data.configured);}catch{providerConfigured=false;}syncProviderUi();}
async function saveGeminiKey(){const key=$('geminiKey').value.trim();if(!key){$('setupState').textContent='API 키를 입력해줘.';$('setupState').className='setupState bad';return;}const btn=$('saveGemini');btn.disabled=true;$('setupState').textContent='키 확인 중…';$('setupState').className='setupState';try{const data=await chatApi({action:'set_key',key});providerConfigured=Boolean(data.configured);syncProviderUi();$('setupState').textContent='Gemini 연결 완료. 이제 바로 대화할 수 있어.';$('setupState').className='setupState ok';$('geminiKey').value='';setTimeout(closeSetup,500);}catch(error){providerConfigured=false;syncProviderUi();$('setupState').textContent=errorLabels[error.message]||`연결 실패: ${error.message}`;$('setupState').className='setupState bad';}finally{btn.disabled=false;}}
function compactGame(game){return{id:String(game?.id||''),name:String(game?.name||''),category:String(game?.homepageCategory||''),stage:String(game?.homepageStage||''),target:String(game?.productionTarget||''),recent:String(game?.homepageRecentWork||'')};}
async function loadCompanyContext(){try{const [catalogResponse,statusResponse]=await Promise.all([fetch(`/game-catalog.json?ts=${Date.now()}`,{cache:'no-store'}),fetch(`/company-status.json?ts=${Date.now()}`,{cache:'no-store'})]);const [catalog,status]=await Promise.all([catalogResponse.json(),statusResponse.json()]);const games=Array.isArray(catalog.games)?catalog.games:[];for(const game of games){gameNames.set(game.id,game.name||game.id);const option=document.createElement('option');option.value=game.id;option.textContent=`${game.name||game.id} · ${game.homepageStage||''}`;$('game').appendChild(option);}const compact=games.map(compactGame);const focus=Array.isArray(status?.operations?.autonomousFocus?.games)?status.operations.autonomousFocus.games.map(game=>({id:String(game.slug||game.gameId||''),name:String(game.name||''),stage:String(game.lane||''),role:String(game.slotRole||'')})):[];companyContext={updatedAt:String(status?.updatedAt||catalog?.updatedAt||''),focused:focus,releaseConfirmed:compact.filter(game=>game.category==='release-confirmed'),developmentConfirmed:compact.filter(game=>game.category==='development-confirmed'),projects:Array.isArray(status?.projects)?status.projects.slice(0,8).map(project=>({id:String(project.gameId||''),name:String(project.name||''),stage:String(project.stageLabel||project.stage||''),progress:Number(project.progress||0),target:String(project.target||'')})):[],games:compact};}catch(error){console.warn('company context',error);try{const response=await fetch(`/game-catalog.json?ts=${Date.now()}`,{cache:'no-store'});const catalog=await response.json();const games=Array.isArray(catalog.games)?catalog.games:[];for(const game of games){gameNames.set(game.id,game.name||game.id);const option=document.createElement('option');option.value=game.id;option.textContent=`${game.name||game.id} · ${game.homepageStage||''}`;$('game').appendChild(option);}companyContext.games=games.map(compactGame);companyContext.releaseConfirmed=companyContext.games.filter(game=>game.category==='release-confirmed');companyContext.developmentConfirmed=companyContext.games.filter(game=>game.category==='development-confirmed');}catch{}}}
function normalizeMessages(rows){return rows.filter(row=>{if(row.sender!=='system')return true;const body=String(row.body??'');return !/Gemini (API 키|연결 키|대화 연결)/.test(body);});}
function bubble(sender,body){const owner=sender==='owner';const cls=owner?'bubble owner':`bubble company ${sender==='ai'?'ai':'system'}`;return `<div class="${cls}">${esc(body)}</div>`;}
function render(tasks){$('intro').hidden=tasks.length>0;if(!tasks.length){$('messages').innerHTML='<div class="empty">아직 대화가 없어. 바로 말해.</div>';return;}const ordered=[...tasks].reverse();$('messages').innerHTML=ordered.map(task=>{const name=gameNames.get(task.game_id)||task.game_id||'회사 공통';const rows=normalizeMessages(task.messages||[]);const hasOwner=rows.some(message=>message.sender==='owner');const content=hasOwner?rows.map(message=>bubble(message.sender,message.body)).join(''):bubble('owner',task.body)+rows.map(message=>bubble(message.sender,message.body)).join('');const status=task.status==='chatting'?'':`<div class="statusLine"><span class="status ${statusClass(task.status)}">${esc(labels[task.status]||task.status)}</span></div>`;return `<div class="group"><div class="groupTitle">${esc(name)}</div>${content}${status}</div>`;}).join('');scrollBottom();const active=tasks.find(task=>task.status==='chatting');if(active){activeTaskId=active.id;localStorage.setItem(ACTIVE_KEY,activeTaskId);if(active.game_id)$('game').value=active.game_id;}else if(activeTaskId){activeTaskId='';localStorage.removeItem(ACTIVE_KEY);}}
async function refresh(){if(!token||loading)return;loading=true;try{const data=await api({action:'list'});render(data.tasks||[]);}catch(error){$('messages').innerHTML=`<div class="empty">대화 기록을 못 불러왔어. ${esc(error.message)}</div>`;}finally{loading=false;}}
function showPending(text){if(pendingNode)pendingNode.remove();pendingNode=document.createElement('div');pendingNode.className='group';pendingNode.innerHTML=`<div class="groupTitle">${esc(gameNames.get($('game').value)||'회사 공통')}</div>${bubble('owner',text)}<div class="pendingAi" aria-label="AI 답변 생성 중"><i></i><i></i><i></i></div>`;$('messages').appendChild(pendingNode);scrollBottom();}
function clearPending(){if(pendingNode){pendingNode.remove();pendingNode=null;}}
async function send(){const text=$('body').value.trim();if(!text||!token||sending)return;if(!providerConfigured){openSetup('Gemini를 먼저 연결하면 바로 답할 수 있어.');return;}sending=true;syncSendState();showRuntimeError('');$('body').value='';resizeComposer();showPending(text);try{const data=await chatApi({action:'chat',taskId:activeTaskId||null,gameId:$('game').value||null,priority:$('priority').value,body:text,companyContext});if(data.taskId&&data.status==='chatting'){activeTaskId=data.taskId;localStorage.setItem(ACTIVE_KEY,activeTaskId);}else{activeTaskId='';localStorage.removeItem(ACTIVE_KEY);}clearPending();await refresh();}catch(error){clearPending();const message=errorLabels[error.message]||`전송 실패: ${error.message}`;showRuntimeError(message);if(error.message==='GEMINI_NOT_CONFIGURED'||error.message==='GEMINI_KEY_REJECTED'){providerConfigured=false;syncProviderUi();openSetup(message);}if(error.data?.taskId){activeTaskId=error.data.taskId;localStorage.setItem(ACTIVE_KEY,activeTaskId);}await refresh();}finally{sending=false;syncSendState();$('body').focus();scrollBottom();}}
async function claim(){const code=$('claimCode').value.trim();if(!code)return;$('claimBtn').disabled=true;try{const data=await api({action:'claim',code,label:navigator.userAgent.slice(0,60)},false);token=data.token||'';localStorage.setItem(TOKEN_KEY,token);setRegistered(true);await checkProvider();await refresh();}catch(error){$('claimState').textContent=`등록 실패: ${error.message}`;}finally{$('claimBtn').disabled=false;}}
function registerPwa(){if('serviceWorker'in navigator){navigator.serviceWorker.register('/sw.js').then(registration=>registration.update().catch(()=>{})).catch(()=>{});}}
$('sendBtn').addEventListener('click',send);$('claimBtn').addEventListener('click',claim);$('providerBtn').addEventListener('click',()=>openSetup());$('closeSetup').addEventListener('click',closeSetup);$('sheetShade').addEventListener('click',closeSetup);$('saveGemini').addEventListener('click',saveGeminiKey);$('geminiKey').addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();saveGeminiKey();}});$('body').addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send();}});$('body').addEventListener('input',resizeComposer);$('body').addEventListener('focus',()=>setTimeout(scrollBottom,100));if(window.visualViewport){window.visualViewport.addEventListener('resize',()=>setTimeout(scrollBottom,50));window.visualViewport.addEventListener('scroll',()=>setTimeout(scrollBottom,50));}
(async()=>{await loadCompanyContext();setRegistered(Boolean(token));registerPwa();resizeComposer();if(token){await checkProvider();await refresh();}else{syncProviderUi();}clearInterval(refreshTimer);refreshTimer=setInterval(()=>{if(!document.hidden)refresh();},7000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){registerPwa();loadCompanyContext();refresh();}});})();
</script>
</body>
</html>
