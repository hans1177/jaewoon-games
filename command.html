<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111c">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/assets/pwa-icon.svg" type="image/svg+xml">
<title>재운컴퍼니 · Vibe 채팅</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}:root{--bg:#07111c;--line:#27475f;--text:#eef7ff;--muted:#89a9bf;--blue:#2387df;--green:#82eab0}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}body{min-height:100dvh}.app{width:min(100%,760px);min-height:100dvh;margin:auto;background:linear-gradient(180deg,#0a1825,#07111c)}.top{position:sticky;top:0;z-index:10;padding:max(10px,env(safe-area-inset-top)) 12px 9px;background:#07111cf2;border-bottom:1px solid #163047;backdrop-filter:blur(14px)}.topRow{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand small{display:block;font-size:8px;font-weight:900;letter-spacing:.13em;color:#76c9f4}.brand h1{margin:2px 0 0;font-size:20px}.nav{display:flex;gap:6px}.nav a{display:flex;align-items:center;justify-content:center;min-height:34px;padding:0 9px;border:1px solid #315672;border-radius:9px;color:#dff2ff;background:#112b40;text-decoration:none;font-size:9px;font-weight:900}.controls{display:grid;grid-template-columns:1.5fr .8fr .8fr;gap:6px;padding:8px 12px;background:#091622;border-bottom:1px solid #163047}.controls select{min-width:0;height:38px;padding:0 8px;border:1px solid #315672;border-radius:9px;background:#0e2537;color:var(--text);font:inherit;font-size:10px;font-weight:800}.chat{padding:14px 11px 112px}.intro{margin:0 auto 14px;max-width:540px;padding:10px 12px;border:1px solid #24465f;border-radius:13px;background:#0d2233;color:#a9c4d7;font-size:10px;line-height:1.55}.intro b{color:#e9f8ff}.group{margin-bottom:14px}.bubble{max-width:90%;padding:10px 11px;border-radius:15px;font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-word}.owner{margin-left:auto;background:#1f70ae;border-bottom-right-radius:5px}.company{margin-right:auto;background:#10283a;border:1px solid #23465f;border-bottom-left-radius:5px;color:#dbeaf4}.company.ai{border-left:3px solid var(--green)}.bubbleHead{display:flex;gap:7px;align-items:center;margin-bottom:5px;font-size:8px;color:#c6e8ff;font-weight:900}.company .bubbleHead{color:#85d4ff}.time{opacity:.7}.statusLine{display:flex;justify-content:flex-end;margin:4px 2px 0}.status{padding:4px 7px;border-radius:999px;background:#143653;color:#9edbff;font-size:8px;font-weight:900}.status.done{background:#123a2a;color:#8ff0ba}.status.warn{background:#493416;color:#ffd77c}.status.fail{background:#482120;color:#ffaaa3}.claimWrap{padding:12px}.claim{padding:14px;border:1px solid #355870;border-radius:15px;background:#102638}.claim h2{margin:0 0 5px;font-size:15px}.claim p{margin:0 0 9px;color:#9db8ca;font-size:10px;line-height:1.5}.claimGrid{display:grid;grid-template-columns:1fr auto;gap:7px}.claim input{height:42px;padding:0 10px;border:1px solid #315672;border-radius:10px;background:#081b29;color:#fff;font:inherit}.btn{min-height:42px;padding:0 13px;border:1px solid #35617f;border-radius:10px;background:#227fc4;color:#fff;font:inherit;font-size:10px;font-weight:900}.state{margin-top:8px;color:#91b2c8;font-size:9px}.composer{position:fixed;left:0;right:0;bottom:0;z-index:12;background:linear-gradient(180deg,transparent,#07111c 24%);padding:18px 10px max(10px,env(safe-area-inset-bottom))}.composerInner{width:min(calc(100% - 20px),740px);margin:auto;display:grid;grid-template-columns:1fr auto;gap:7px;padding:7px;border:1px solid #315672;border-radius:16px;background:#0d2233}.composer textarea{min-height:46px;max-height:132px;padding:10px 9px;border:0;background:transparent;color:#fff;font:inherit;font-size:12px;line-height:1.45;resize:none;outline:none}.composerActions{display:flex;gap:6px}.send,.voice{min-height:46px;border:0;border-radius:11px;color:#fff;font-size:11px;font-weight:900}.send{width:52px;background:var(--blue)}.voice{width:42px;background:#143149;border:1px solid #315672}.send:disabled{opacity:.4}.empty{padding:30px 10px;text-align:center;color:#7597ad;font-size:10px}@media(max-width:520px){.controls{grid-template-columns:1fr 1fr}.controls select:first-child{grid-column:1/-1}.nav a:last-child{display:none}.claimGrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div class="topRow"><div class="brand"><small>JAEWOON COMPANY · VIBE2</small><h1>게임 개발 채팅</h1></div><nav class="nav"><a href="/">게임 홈</a><a href="/company.html">개발연구소</a></nav></div></header>
<section class="controls" id="controls"><select id="game" aria-label="게임"><option value="">게임 선택</option></select><select id="kind" aria-label="종류"><option value="directive">개발 지시</option><option value="feedback">플레이 피드백</option></select><select id="priority" aria-label="우선순위"><option value="normal">일반</option><option value="priority">우선</option><option value="urgent">긴급</option></select></section>
<section class="claimWrap" id="claimWrap" hidden><div class="claim"><h2>이 휴대폰 등록</h2><p>처음 한 번만 등록해. 기기 토큰은 이 브라우저에만 저장돼.</p><div class="claimGrid"><input id="claimCode" type="password" autocomplete="one-time-code" placeholder="기기 등록 코드"><button class="btn" id="claimBtn" type="button">등록</button></div><div class="state" id="claimState">등록 코드가 필요해.</div></div></section>
<section class="chat"><div class="intro"><b>여기서 말하듯 게임 개발을 지시하면 돼.</b><br>최신 코드 확인 → Vibe2/재운컴퍼니 작업 → QA → 검증된 결과만 main 자동반영 → Cloudflare 자동배포 순서로 처리해.</div><div id="messages"><div class="empty">작업 기록 불러오는 중</div></div></section>
</main>
<div class="composer" id="composer"><div class="composerInner"><textarea id="body" maxlength="3000" rows="1" placeholder="예: 곤충 생존기 거미 공격 모션 끊기는 거 확인해서 수정해"></textarea><div class="composerActions"><button class="voice" id="voiceBtn" type="button" hidden>음성</button><button class="send" id="sendBtn" type="button">전송</button></div></div></div>
<script>
const API='https://njpexgqvituaxrjpnqsi.supabase.co/functions/v1/company-command',API_KEY='sb_publishable_ybAF71npJQz6PJVpnwsQ4g_rsyzlkFQ',TOKEN_KEY='jaewoon_command_device_v1',$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={received:'접수',working:'작업중',testing:'QA·배포검증',needs_input:'확인필요',done:'완료',failed:'실패',cancelled:'취소'},gameNames=new Map();let token=localStorage.getItem(TOKEN_KEY)||'',loading=false;
async function api(payload,auth=true){const headers={'Content-Type':'application/json','apikey':API_KEY};if(auth&&token)headers['x-jaewoon-device']=token;const r=await fetch(API,{method:'POST',headers,body:JSON.stringify(payload),cache:'no-store'}),d=await r.json().catch(()=>({error:'INVALID_RESPONSE'}));if(!r.ok)throw new Error(d.error||`HTTP_${r.status}`);return d;}
function fmt(v){try{return new Intl.DateTimeFormat('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(v));}catch{return'';}}function statusClass(s){return s==='done'?'done':s==='failed'?'fail':s==='needs_input'?'warn':'';}
function setRegistered(ok){$('claimWrap').hidden=ok;$('composer').style.display=ok?'block':'none';$('controls').style.opacity=ok?'1':'.45';for(const id of['game','kind','priority'])$(id).disabled=!ok;}
async function loadGames(){try{const c=await fetch(`/game-catalog.json?ts=${Date.now()}`,{cache:'no-store'}).then(r=>r.json());for(const g of c.games||[]){gameNames.set(g.id,g.name||g.id);const o=document.createElement('option');o.value=g.id;o.textContent=`${g.name||g.id} · ${g.homepageStage||''}`;$('game').appendChild(o);}}catch{}}
function companyBubble(m){const ai=m.sender==='ai';return `<div class="bubble company ${ai?'ai':''}"><div class="bubbleHead">${ai?'재운컴퍼니':'시스템'}<span class="time">${fmt(m.created_at)}</span></div>${esc(m.body)}</div>`;}
function render(tasks){if(!tasks.length){$('messages').innerHTML='<div class="empty">아직 지시가 없어. 게임을 고르고 바로 말해.</div>';return;}$('messages').innerHTML=tasks.map(t=>`<div class="group"><div class="bubble owner"><div class="bubbleHead">나 · ${esc(gameNames.get(t.game_id)||t.game_id||'게임')}<span class="time">${fmt(t.created_at)}</span></div>${esc(t.body)}</div><div class="statusLine"><span class="status ${statusClass(t.status)}">${esc(labels[t.status]||t.status)}</span></div>${(t.messages||[]).filter(m=>m.sender!=='owner').map(companyBubble).join('')}</div>`).join('');}
async function refresh(){if(!token||loading)return;loading=true;try{render((await api({action:'list'})).tasks||[]);}catch(e){$('messages').innerHTML=`<div class="empty">작업 기록을 못 불러왔어. ${esc(e.message)}</div>`;}finally{loading=false;}}
async function claim(){const code=$('claimCode').value.trim();if(!code)return;$('claimBtn').disabled=true;$('claimState').textContent='등록 확인 중';try{const d=await api({action:'claim',code,label:'Jaewoon PWA'},false);token=d.token;localStorage.setItem(TOKEN_KEY,token);setRegistered(true);await refresh();}catch(e){$('claimState').textContent=`등록 실패: ${e.message}`;}finally{$('claimBtn').disabled=false;}}
async function send(){const body=$('body').value.trim(),gameId=$('game').value;if(!token||!body)return;if(!gameId){$('game').focus();return;}$('sendBtn').disabled=true;try{await api({action:'create',gameId,kind:$('kind').value,priority:$('priority').value,body});$('body').value='';$('body').style.height='46px';await refresh();window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});}catch(e){alert(`전송 실패: ${e.message}`);}finally{$('sendBtn').disabled=false;}}
function voice(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return;$('voiceBtn').hidden=false;const r=new R();r.lang='ko-KR';r.onresult=e=>$('body').value=[$('body').value,e.results?.[0]?.[0]?.transcript||''].filter(Boolean).join(' ');$('voiceBtn').onclick=()=>r.start();}
$('claimBtn').onclick=claim;$('sendBtn').onclick=send;$('body').oninput=()=>{$('body').style.height='46px';$('body').style.height=`${Math.min(132,$('body').scrollHeight)}px`;};
(async()=>{await loadGames();setRegistered(Boolean(token));voice();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js',{scope:'/'}).then(r=>r.update().catch(()=>{})).catch(()=>{});if(token)await refresh();setInterval(()=>{if(!document.hidden)refresh();},7000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});})();
</script>
</body>
</html>
