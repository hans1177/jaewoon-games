<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111c">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/assets/pwa-icon.svg" type="image/svg+xml">
<title>재운컴퍼니 · AI 개발 채팅</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#07111c;--panel:#0d1f2f;--line:#27475f;--text:#eef7ff;--muted:#89a9bf;--blue:#2387df;--green:#82eab0;--warn:#ffd47b;--danger:#ff9d98}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}body{min-height:100dvh}
.app{width:min(100%,760px);min-height:100dvh;margin:auto;display:grid;grid-template-rows:auto auto 1fr;background:linear-gradient(180deg,#0a1825,#07111c)}
.top{position:sticky;top:0;z-index:10;padding:max(12px,env(safe-area-inset-top)) 14px 12px;background:#07111cf2;border-bottom:1px solid #163047;backdrop-filter:blur(14px)}
.topRow{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand small{display:block;font-size:11px;font-weight:900;letter-spacing:.1em;color:#76c9f4}.brand h1{margin:4px 0 0;font-size:26px;line-height:1.15}.nav{display:flex;gap:6px}.nav a{display:flex;align-items:center;justify-content:center;min-height:42px;padding:0 12px;border:1px solid #315672;border-radius:11px;color:#dff2ff;background:#112b40;text-decoration:none;font-size:13px;font-weight:900}
.controls{display:grid;grid-template-columns:1.6fr .8fr;gap:8px;padding:12px 14px;background:#091622;border-bottom:1px solid #163047}.controls select{min-width:0;height:50px;padding:0 12px;border:1px solid #315672;border-radius:12px;background:#0e2537;color:var(--text);font:inherit;font-size:16px;font-weight:800;outline:none}
.chat{min-height:0;padding:18px 14px 128px;overflow:auto;scroll-behavior:smooth}.intro{margin:0 auto 20px;max-width:620px;padding:15px 16px;border:1px solid #24465f;border-radius:16px;background:#0d2233;color:#a9c4d7;font-size:15px;line-height:1.6}.intro b{color:#e9f8ff;font-size:16px}
.group{margin:0 0 20px}.bubble{max-width:88%;padding:13px 14px;border-radius:17px;font-size:17px;line-height:1.55;white-space:pre-wrap;word-break:break-word}.owner{margin-left:auto;background:#1f70ae;border-bottom-right-radius:6px;color:#fff}.company{margin-right:auto;background:#10283a;border:1px solid #23465f;border-bottom-left-radius:6px;color:#dbeaf4}.company.ai{border-left:4px solid var(--green)}.company.system{color:#c5d8e5}.bubbleHead{display:flex;gap:8px;align-items:center;margin-bottom:7px;font-size:12px;color:#c6e8ff;font-weight:900}.company .bubbleHead{color:#85d4ff}.time{opacity:.72;font-weight:700}.statusLine{display:flex;justify-content:flex-end;margin:6px 2px 0}.status{display:inline-flex;align-items:center;min-height:29px;padding:0 10px;border-radius:999px;background:#143653;color:#9edbff;font-size:12px;font-weight:900}.status.done{background:#123a2a;color:#8ff0ba}.status.warn{background:#493416;color:#ffd77c}.status.fail{background:#482120;color:#ffaaa3}.status.chat{background:#15392f;color:#8ff0ba}
.claimWrap{padding:14px}.claim{padding:17px;border:1px solid #355870;border-radius:17px;background:#102638}.claim h2{margin:0 0 7px;font-size:20px}.claim p{margin:0 0 12px;color:#9db8ca;font-size:15px;line-height:1.55}.claimGrid{display:grid;grid-template-columns:1fr auto;gap:8px}.claim input{height:52px;padding:0 12px;border:1px solid #315672;border-radius:11px;background:#081b29;color:#fff;font:inherit;font-size:16px}.btn{min-height:52px;padding:0 16px;border:1px solid #35617f;border-radius:11px;background:#17405e;color:#fff;font:inherit;font-size:15px;font-weight:900}.btn.primary{background:#227fc4}.state{margin-top:10px;color:#91b2c8;font-size:14px}
.composer{position:fixed;left:0;right:0;bottom:0;z-index:12;background:linear-gradient(180deg,transparent,#07111c 20%);padding:22px 10px max(12px,env(safe-area-inset-bottom))}.composerInner{width:min(calc(100% - 14px),740px);margin:auto;display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px;border:1px solid #315672;border-radius:18px;background:#0d2233;box-shadow:0 -6px 24px #0005}.composer textarea{min-height:58px;max-height:168px;padding:13px 11px;border:0;background:transparent;color:#fff;font:inherit;font-size:17px;line-height:1.5;resize:none;outline:none}.composer textarea::placeholder{color:#7c96a8}.send{width:76px;min-height:58px;border:0;border-radius:13px;background:var(--blue);color:#fff;font-size:16px;font-weight:1000}.send:disabled{opacity:.4}.composerActions{display:flex;gap:6px;align-items:stretch}.empty{padding:38px 12px;text-align:center;color:#83a5ba;font-size:15px;line-height:1.55}.localError{margin:0 auto 14px;max-width:620px;padding:12px 14px;border:1px solid #6f3e3c;border-radius:14px;background:#321d1c;color:#ffc1bc;font-size:15px;line-height:1.5}
@media(max-width:520px){.controls{grid-template-columns:1fr}.bubble{max-width:94%}.nav a:last-child{display:none}.claimGrid{grid-template-columns:1fr}.claimGrid .btn{width:100%}.brand h1{font-size:25px}.nav a{font-size:14px}.chat{padding-left:12px;padding-right:12px}}
</style>
</head>
<body>
<main class="app">
  <header class="top"><div class="topRow"><div class="brand"><small>JAEWOON COMPANY · GEMINI + VIBE2</small><h1>AI 게임 개발 채팅</h1></div><nav class="nav"><a href="/">게임 홈</a><a href="/company.html">개발연구소</a></nav></div></header>
  <section class="controls" id="controls"><select id="game" aria-label="게임"><option value="">회사 공통 / 게임 미선택</option></select><select id="priority" aria-label="우선순위"><option value="normal">일반</option><option value="priority">우선</option><option value="urgent">긴급</option></select></section>
  <section class="claimWrap" id="claimWrap" hidden><div class="claim"><h2>이 휴대폰 등록</h2><p>처음 한 번만 등록해. 기기 토큰은 이 브라우저에만 저장돼.</p><div class="claimGrid"><input id="claimCode" type="password" autocomplete="one-time-code" placeholder="기기 등록 코드"><button class="btn primary" id="claimBtn" type="button">등록</button></div><div class="state" id="claimState">등록 코드가 필요해.</div></div></section>
  <section class="chat" id="chat"><div class="intro"><b>여기서 AI와 그냥 대화하면 돼.</b><br>질문·아이디어·피드백은 Gemini가 답하고, “진행”, “수정해”, “적용해”처럼 실제 작업을 지시하면 Vibe2 개발 큐로 넘겨 QA 후 자동배포해.</div><div id="runtimeError" class="localError" hidden></div><div id="messages"><div class="empty">대화 기록 불러오는 중</div></div></section>
</main>
<div class="composer" id="composer"><div class="composerInner"><textarea id="body" maxlength="3000" rows="1" placeholder="예: 곤충 생존기 거미 움직임 어때? / 좋아 그 방향으로 수정해"></textarea><div class="composerActions"><button class="send" id="sendBtn" type="button">전송</button></div></div></div>
<script>
const API='https://njpexgqvituaxrjpnqsi.supabase.co/functions/v1/company-command';
const API_KEY='sb_publishable_ybAF71npJQz6PJVpnwsQ4g_rsyzlkFQ';
const TOKEN_KEY='jaewoon_command_device_v1';
const ACTIVE_KEY='jaewoon_ai_chat_task_v1';
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const labels={chatting:'AI 대화중',received:'지시 접수',working:'작업중',testing:'QA·배포검증',needs_input:'확인필요',done:'완료',failed:'실패',cancelled:'취소'};
const errorLabels={GEMINI_NOT_CONFIGURED:'Gemini 서버 연결 설정이 아직 없어. 실제 작업 지시는 Vibe2로 보낼 수 있게 서버를 수정 중이야.',GEMINI_LIMIT:'Gemini 무료 사용 한도에 걸렸어. 잠시 뒤 다시 보내줘.',GEMINI_ERROR:'Gemini 연결이 잠깐 실패했어. 다시 보내줘.'};
const gameNames=new Map();let token=localStorage.getItem(TOKEN_KEY)||'';let activeTaskId=localStorage.getItem(ACTIVE_KEY)||'';let refreshTimer=null;let loading=false;
async function api(payload,needsToken=true){const headers={'Content-Type':'application/json','apikey':API_KEY};if(needsToken&&token)headers['x-jaewoon-device']=token;const response=await fetch(API,{method:'POST',headers,body:JSON.stringify(payload),cache:'no-store'});const data=await response.json().catch(()=>({ok:false,error:'INVALID_RESPONSE'}));if(!response.ok){const error=new Error(data.error||`HTTP_${response.status}`);error.data=data;throw error;}return data;}
function fmt(value){try{return new Intl.DateTimeFormat('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(value));}catch{return'';}}
function statusClass(status){if(status==='chatting')return'chat';if(status==='done')return'done';if(status==='failed')return'fail';if(status==='needs_input')return'warn';return'';}
function showRuntimeError(message=''){$('runtimeError').textContent=message;$('runtimeError').hidden=!message;}
function setRegistered(ok){$('claimWrap').hidden=ok;$('composer').style.display=ok?'block':'none';$('controls').style.opacity=ok?'1':'.45';$('game').disabled=!ok;$('priority').disabled=!ok;}
async function loadGames(){try{const response=await fetch(`/game-catalog.json?ts=${Date.now()}`,{cache:'no-store'});const catalog=await response.json();for(const game of(catalog.games||[])){gameNames.set(game.id,game.name||game.id);const option=document.createElement('option');option.value=game.id;option.textContent=`${game.name||game.id} · ${game.homepageStage||''}`;$('game').appendChild(option);}}catch{}}
function bubble(sender,body,created){const owner=sender==='owner';const cls=owner?'bubble owner':`bubble company ${sender==='ai'?'ai':'system'}`;const who=owner?'나':sender==='ai'?'재운컴퍼니 AI':'시스템';return `<div class="${cls}"><div class="bubbleHead">${who}<span class="time">${fmt(created)}</span></div>${esc(body)}</div>`;}
function render(tasks){if(!tasks.length){$('messages').innerHTML='<div class="empty">아직 대화가 없어. 바로 말해.</div>';return;}const ordered=[...tasks].reverse();$('messages').innerHTML=ordered.map(task=>{const name=gameNames.get(task.game_id)||task.game_id||'회사 공통';const rows=task.messages||[];const hasOwner=rows.some(m=>m.sender==='owner');const content=hasOwner?rows.map(m=>bubble(m.sender,m.body,m.created_at)).join(''):bubble('owner',task.body,task.created_at)+rows.map(m=>bubble(m.sender,m.body,m.created_at)).join('');return `<div class="group"><div class="bubbleHead" style="margin:0 2px 7px;color:#7296ad">${esc(name)}</div>${content}<div class="statusLine"><span class="status ${statusClass(task.status)}">${esc(labels[task.status]||task.status)}</span></div></div>`;}).join('');requestAnimationFrame(()=>{$('chat').scrollTop=$('chat').scrollHeight;});const active=tasks.find(t=>t.status==='chatting');if(active){activeTaskId=active.id;localStorage.setItem(ACTIVE_KEY,activeTaskId);if(active.game_id)$('game').value=active.game_id;}else if(activeTaskId){activeTaskId='';localStorage.removeItem(ACTIVE_KEY);}}
async function refresh(){if(!token||loading)return;loading=true;try{const data=await api({action:'list'});render(data.tasks||[]);}catch(error){$('messages').innerHTML=`<div class="empty">대화 기록을 못 불러왔어. ${esc(error.message)}</div>`;}finally{loading=false;}}
async function send(){const text=$('body').value.trim();if(!text||!token)return;$('sendBtn').disabled=true;showRuntimeError('');try{const data=await api({action:'chat',taskId:activeTaskId||null,gameId:$('game').value||null,priority:$('priority').value,body:text});$('body').value='';$('body').style.height='auto';if(data.taskId&&data.status==='chatting'){activeTaskId=data.taskId;localStorage.setItem(ACTIVE_KEY,activeTaskId);}else{activeTaskId='';localStorage.removeItem(ACTIVE_KEY);}await refresh();}catch(error){const code=error.message;showRuntimeError(errorLabels[code]||`전송 실패: ${code}`);if(error.data?.taskId){activeTaskId=error.data.taskId;localStorage.setItem(ACTIVE_KEY,activeTaskId);}await refresh();}finally{$('sendBtn').disabled=false;$('body').focus();}}
async function claim(){const code=$('claimCode').value.trim();if(!code)return;$('claimBtn').disabled=true;try{const data=await api({action:'claim',code,label:navigator.userAgent.slice(0,60)},false);token=data.token||'';localStorage.setItem(TOKEN_KEY,token);setRegistered(true);await refresh();}catch(error){$('claimState').textContent=`등록 실패: ${error.message}`;}finally{$('claimBtn').disabled=false;}}
function registerPwa(){if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').then(reg=>reg.update().catch(()=>{})).catch(()=>{});}
$('sendBtn').addEventListener('click',send);$('claimBtn').addEventListener('click',claim);$('body').addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send();}});$('body').addEventListener('input',event=>{event.target.style.height='auto';event.target.style.height=`${Math.min(event.target.scrollHeight,168)}px`;});
(async()=>{await loadGames();setRegistered(Boolean(token));registerPwa();if(token)await refresh();clearInterval(refreshTimer);refreshTimer=setInterval(()=>{if(!document.hidden)refresh();},7000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){registerPwa();refresh();}});})();
</script>
</body>
</html>
