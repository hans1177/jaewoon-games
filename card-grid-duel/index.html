<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d1422">
<title>카드 워즈</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#0d1422;color:#eef3ff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input{font:inherit}
button{touch-action:manipulation}
.wrap{width:min(760px,100%);margin:auto;padding:10px 10px 90px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
h1{font-size:22px;margin:0}
.badge{font-size:12px;padding:6px 9px;border-radius:999px;background:#1f2b43;color:#b9c9ec}
.panel{background:#151f31;border:1px solid #283653;border-radius:14px;padding:10px}
#notice{min-height:34px;display:flex;align-items:center;justify-content:center;text-align:center;color:#ffd978;font-weight:800;font-size:13px;margin-bottom:8px}
.login{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.login input{width:100%;min-height:46px;border:1px solid #334563;background:#0e1727;color:#fff;border-radius:10px;padding:0 12px;font-size:16px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.actions button,.primary{min-height:46px;border:0;border-radius:10px;padding:0 14px;font-weight:900;color:#fff;background:#31496d}
.actions .primary{background:#4169e1}
.actions .danger{background:#8b3a44}
.boardWrap{display:flex;justify-content:center}
.board{width:min(94vw,560px);aspect-ratio:1;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:6px;background:#26324a;border-radius:14px}
.cell{position:relative;border:0;border-radius:10px;background:#34415d;color:#fff;overflow:hidden;min-width:0}
.cell.homeBlue{background:#2c4b62}.cell.homeRed{background:#5c343e}
.cell.sel{outline:3px solid #ffd86b}
.unit{position:absolute;inset:4px;border-radius:9px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:3px}
.unit.blue{background:linear-gradient(#3568b7,#264b88)}
.unit.red{background:linear-gradient(#a74851,#753038)}
.portrait{display:block;width:44px;height:44px;border-radius:7px;overflow:hidden;background:#24324a;box-shadow:0 1px 4px #0008}
.portrait img,.card .art img{display:block;width:400%;height:200%;max-width:none;pointer-events:none}
.unit b{font-size:11px}.unit small{font-size:9px;color:#e7eeff}
.hp{position:absolute;left:5px;right:5px;bottom:4px;height:5px;background:#311;border-radius:99px;overflow:hidden}
.hp i{display:block;height:100%;background:#4bdd72}
.statusRow{display:flex;justify-content:space-between;gap:8px;margin:9px 0;font-size:12px;color:#b7c6e4}
.hand{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;padding:4px 0 8px}
.card{min-width:0;min-height:154px;border:2px solid #334563;border-radius:12px;background:#202d45;color:#fff;padding:7px;text-align:left}
.card.sel{border-color:#ffd86b;background:#3a382e}
.card:disabled{opacity:.42}
.card .art{width:100%;aspect-ratio:1/1;border-radius:8px;background:#1a2438;overflow:hidden;margin-bottom:6px;border:1px solid #425574}
.card b{font-size:13px}.card p{font-size:10px;line-height:1.35;margin:4px 0 0;color:#c5d1e9}.cost{color:#ffd978;font-weight:1000}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#0d1422e8;backdrop-filter:blur(8px);border-top:1px solid #283653;padding:8px max(10px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));display:flex;gap:8px;justify-content:center}
.bottom button{width:min(46%,260px);min-height:52px;border:0;border-radius:12px;font-weight:1000}
#endTurn{background:#4169e1;color:#fff}#cancel{background:#2b3549;color:#fff}
#authBox{margin-bottom:10px}
.hidden{display:none!important}
#restScreen{text-align:center;padding:18px}
#restScreen h2{margin:0 0 8px;font-size:24px}
#restScreen .keys{font-size:18px;color:#ffd978;font-weight:1000;margin:10px 0}
#restScreen .restActions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
#restScreen .restActions button{min-height:48px;border:0;border-radius:11px;padding:0 16px;font-weight:1000;color:#fff;background:#4169e1}
#restScreen .restActions .draw{background:#8b691e}
#drawResult{min-height:42px;margin:10px 0;color:#d8e4ff;font-weight:800}
#unlockedList{font-size:12px;color:#b7c6e4;line-height:1.5}
#diamondLine{font-size:15px;color:#78d7ff;font-weight:1000;margin:7px 0}
#upgradeBox{margin-top:12px;padding:10px;border:1px solid #344563;border-radius:12px;background:#101a2b}
#upgradeBox select{width:100%;min-height:44px;border:1px solid #3a4b69;border-radius:9px;background:#0d1626;color:#fff;padding:0 10px;font-size:16px}
#upgradeBox button{width:100%;margin-top:7px;min-height:46px;border:0;border-radius:9px;background:#6f56c9;color:#fff;font-weight:1000}
#upgradeInfo{margin-top:7px;font-size:11px;color:#c7d3e9;line-height:1.5}
#dailyPanel{margin:0 0 8px}
#dailyHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
#dailyHead b{font-size:14px}#walletDiamonds{color:#78d7ff;font-weight:1000;font-size:13px}
#dailyList{display:grid;gap:7px}
.dailyMission{padding:8px 10px;border:1px solid #334563;border-radius:10px;background:#101a2b}
.dailyMission.done{border-color:#4b8f66;background:#14291f}
.dailyMission .row{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:900}
.dailyMission .reward{color:#78d7ff}
.dailyMission small{display:block;color:#afbdd7;margin-top:4px}
.dailyBar{height:5px;background:#26334b;border-radius:99px;overflow:hidden;margin-top:6px}
.dailyBar i{display:block;height:100%;background:#5abf82}
@media(max-width:520px){
  .wrap{padding-left:7px;padding-right:7px}.board{gap:3px;padding:4px}.unit{inset:2px}.portrait{width:38px;height:38px}.unit b{font-size:9px}.unit small{font-size:8px}.login{grid-template-columns:1fr}
  .hand{grid-template-columns:repeat(2,minmax(0,1fr))}.card{min-height:136px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>카드 워즈</h1><span class="badge">5×5 · 턴제 · 1대1</span></div>
  <div id="notice" class="panel">연습전 또는 온라인 1대1을 선택해.</div>

  <div id="dailyPanel" class="panel">
    <div id="dailyHead"><b>오늘의 일일임무 · 15개 중 랜덤 3개</b><span id="walletDiamonds">다이아 0</span></div>
    <div id="dailyList"></div>
  </div>

  <div id="authBox" class="panel">
    <div class="login">
      <input id="email" type="email" autocomplete="email" placeholder="이메일">
      <input id="password" type="password" autocomplete="current-password" placeholder="비밀번호">
    </div>
    <div class="actions">
      <button id="loginBtn" class="primary">로그인</button>
      <button id="signupBtn">가입</button>
      <button id="practiceBtn">연습전 바로 시작</button>
      <button id="matchBtn" class="primary hidden">온라인 빠른 매칭</button>
      <button id="logoutBtn" class="danger hidden">로그아웃</button>
    </div>
  </div>

  <div id="restScreen" class="panel hidden">
    <h2>스테이지 클리어</h2>
    <div id="restText">잠시 쉬어가.</div>
    <div class="keys">열쇠 <span id="keyCount">0</span>개</div>
    <div id="diamondLine">다이아 <span id="diamondCount">0</span>개</div>
    <div id="drawResult"></div>
    <div id="unlockedList">추가 아군: 없음</div>
    <div id="upgradeBox" class="hidden">
      <select id="upgradeSelect"></select>
      <button id="upgradeAlly">아군 업그레이드</button>
      <div id="upgradeInfo"></div>
    </div>
    <div class="restActions">
      <button id="drawAlly" class="draw">열쇠 1개로 아군 뽑기</button>
      <button id="nextStage">2스테이지 시작</button>
    </div>
  </div>

  <div id="battlePanel" class="panel">
    <div class="statusRow">
      <span id="players">파랑 VS 빨강</span>
      <b id="turn">대기</b>
    </div>
    <div class="boardWrap"><div id="board" class="board"></div></div>
    <div class="statusRow">
      <span id="deckInfo">골드 -</span>
      <span id="modeInfo">대기</span>
    </div>
    <div id="hand" class="hand"></div>
  </div>
</div>

<div class="bottom">
  <button id="cancel">선택 취소</button>
  <button id="endTurn">턴 종료</button>
</div>

<script type="module">
import { JaewoonMultiplayerClient } from '/multiplayer/multiplayer-client.js';

const GAME_ID='card-grid-duel', SIZE=5, START_GOLD=200;
const STAGES={
  1:{blueMax:10,redMax:6,redPool:['GOBLIN','SKELETON_ARCHER','SKELETON_MAGE','ORC']},
  2:{blueMax:12,redMax:8,redPool:['SKELETON_SOLDIER','SKELETON_ARCHER','SKELETON_MAGE','ORC','SLIME']},
  3:{blueMax:12,redMax:8,redPool:['ENHANCED_GOBLIN','GOLEM','BOAR','SKELETON_SOLDIER','ORC','SLIME']}
};
const GACHA_POOL=['LANCER','CROSSBOW','HAMMER'];
const DAILY_KEY='card-grid-duel-daily-v1',DIAMOND_KEY='card-grid-duel-diamonds-v1';
const DAILY_MISSIONS=[
  {id:'summon5',type:'summon',goal:5,reward:25,name:'아군 5회 소환'},
  {id:'summon10',type:'summon',goal:10,reward:45,name:'아군 10회 소환'},
  {id:'kill5',type:'kill',goal:5,reward:30,name:'적 5마리 처치'},
  {id:'kill10',type:'kill',goal:10,reward:55,name:'적 10마리 처치'},
  {id:'attack10',type:'attack',goal:10,reward:30,name:'아군으로 10회 공격'},
  {id:'move12',type:'move',goal:12,reward:25,name:'아군 12회 이동'},
  {id:'spend150',type:'spendGold',goal:150,reward:35,name:'골드 150 사용'},
  {id:'spend300',type:'spendGold',goal:300,reward:60,name:'골드 300 사용'},
  {id:'clear1',type:'stageClear',goal:1,reward:40,name:'스테이지 1회 클리어'},
  {id:'clear2',type:'stageClear',goal:2,reward:75,name:'스테이지 2회 클리어'},
  {id:'nodamage',type:'noDamage',goal:1,reward:70,name:'무피해로 스테이지 1회 클리어'},
  {id:'upgrade1',type:'upgrade',goal:1,reward:35,name:'아군 1회 업그레이드'},
  {id:'draw1',type:'draw',goal:1,reward:30,name:'열쇠로 아군 1회 뽑기'},
  {id:'special2',type:'specialKill',goal:2,reward:60,name:'3스테이지 특수 적 2마리 처치'},
  {id:'clear3',type:'stage3Clear',goal:1,reward:100,name:'3스테이지 1회 클리어'}
];
function todayKey(){return new Date().toLocaleDateString('en-CA')}
function diamondWallet(){return Math.max(0,Number(localStorage.getItem(DIAMOND_KEY)||0))}
function setDiamondWallet(v){localStorage.setItem(DIAMOND_KEY,String(Math.max(0,Math.floor(v))))}
function awardDiamonds(n){
  const next=diamondWallet()+Math.max(0,Math.floor(n));
  setDiamondWallet(next);
  if(state)state.diamonds=next;
  renderDaily();
  return next
}
function loadDaily(){
  let d=null;
  try{d=JSON.parse(localStorage.getItem(DAILY_KEY)||'null')}catch{}
  const date=todayKey();
  if(!d||d.date!==date||!Array.isArray(d.ids)||d.ids.length!==3){
    const ids=DAILY_MISSIONS.map(x=>x.id);
    for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}
    d={date,ids:ids.slice(0,3),progress:{},claimed:{}};
    localStorage.setItem(DAILY_KEY,JSON.stringify(d))
  }
  return d
}
function saveDaily(d){localStorage.setItem(DAILY_KEY,JSON.stringify(d))}
function dailyEvent(type,amount=1){
  const d=loadDaily();
  let changed=false;
  for(const id of d.ids){
    const m=DAILY_MISSIONS.find(x=>x.id===id);
    if(!m||m.type!==type||d.claimed[id])continue;
    d.progress[id]=Math.min(m.goal,Number(d.progress[id]||0)+amount);
    changed=true;
    if(d.progress[id]>=m.goal){
      d.claimed[id]=true;
      awardDiamonds(m.reward);
      msg('일일임무 완료 · '+m.name+' · 다이아 '+m.reward+'개')
    }
  }
  if(changed)saveDaily(d);
  renderDaily()
}
function renderDaily(){
  const list=document.querySelector('#dailyList'),wallet=document.querySelector('#walletDiamonds');
  if(!list||!wallet)return;
  wallet.textContent='다이아 '+diamondWallet();
  const d=loadDaily();
  list.innerHTML='';
  for(const id of d.ids){
    const m=DAILY_MISSIONS.find(x=>x.id===id);
    if(!m)continue;
    const p=Math.min(m.goal,Number(d.progress[id]||0)),done=!!d.claimed[id];
    const el=document.createElement('div');
    el.className='dailyMission'+(done?' done':'');
    el.innerHTML='<div class="row"><span>'+m.name+'</span><span class="reward">'+(done?'완료':'+'+m.reward+'💎')+'</span></div><small>'+p+' / '+m.goal+'</small><div class="dailyBar"><i style="width:'+Math.round(p/m.goal*100)+'%"></i></div>';
    list.appendChild(el)
  }

const BASE_BLUE_IDS=['SWORDSMAN','ARCHER','MAGE','GUARDIAN'];
const IDS={BLUE:Object.keys(CARDS.BLUE),RED:Object.keys(CARDS.RED)};
const $=s=>document.querySelector(s), notice=$('#notice'),board=$('#board'),hand=$('#hand'),turnEl=$('#turn'),playersEl=$('#players'),deckInfo=$('#deckInfo'),modeInfo=$('#modeInfo');
const client=new JaewoonMultiplayerClient();
let state=null,side='BLUE',selectedUnit=null,selectedCard='',mode='idle',aiThinking=false,networkIds=new Set(),myNetworkId='',leaderId='',initializedRoom=false;

function msg(t){notice.textContent=t}
function other(s){return s==='BLUE'?'RED':'BLUE'}
function homeRow(s){return s==='BLUE'?5:1}
function moveDist(a,b){return Math.abs(a.r-b.r)+Math.abs(a.c-b.c)}
function attackDist(a,b){return Math.abs(a.r-b.r)+Math.abs(a.c-b.c)}
function newState(){
  state={
    version:3,
    stage:1,
    phase:'BATTLE',
    turn:1,
    current:'BLUE',
    summonUsed:false,
    winner:'',
    keys:0,
    diamonds:diamondWallet(),
    stageTookDamage:false,
    unlocked:[],
    upgrades:{},
    gold:{BLUE:START_GOLD,RED:0},
    summons:{BLUE:0,RED:0},
    units:[]
  };
  return state
}
function card(s,id){return CARDS[s][id]}
function upgradeLevel(id){return Math.max(0,Math.min(3,Number(state?.upgrades?.[id]||0)))}
function upgradeCost(id){return Math.round(50*Math.pow(1.3,upgradeLevel(id)))}
function scaledStat(id,key){
  const base=card('BLUE',id)?.[key]||0;
  return Math.round(base*Math.pow(1.25,upgradeLevel(id)))
}
function unitMaxHp(u){return u.side==='BLUE'?scaledStat(u.card,'hp'):card(u.side,u.card).hp}
function unitAtk(u){return u.side==='BLUE'?scaledStat(u.card,'atk'):card(u.side,u.card).atk}
function at(r,c){return state?.units.find(u=>u.r===r&&u.c===c)}
function byId(id){return state?.units.find(u=>u.id===id)}
function canAct(){return state&&!state.winner&&state.phase==='BATTLE'&&state.current===side}
function snapshot(){return JSON.parse(JSON.stringify(state))}
function setState(next){state=JSON.parse(JSON.stringify(next));selectedUnit=null;selectedCard='';render()}
function livingCount(s){return state.units.filter(u=>u.side===s).length}
function stageConfig(){return STAGES[state?.stage||1]||STAGES[1]}
function maxSummons(s){const cfg=stageConfig();return s==='BLUE'?cfg.blueMax:cfg.redMax}
function bluePool(){return [...BASE_BLUE_IDS,...(state?.unlocked||[])]}
function redPool(){return stageConfig().redPool}
function minCost(s){
  if(s==='RED')return 0;
  const pool=bluePool();
  return Math.min(...pool.map(id=>card('BLUE',id).cost))
}
function canSummonMore(s){
  if(state.summons[s]>=maxSummons(s))return false;
  if(s==='RED')return true;
  return state.gold.BLUE>=minCost('BLUE')
}
function applyDamage(target,amount,attackerSide){
  if(target.hp<=0)return false;
  const d=card(target.side,target.card);
  const hit=Math.max(1,Math.round(amount*(1-(d.reduce||0))));
  const before=target.hp;
  target.hp-=hit;
  if(target.side==='BLUE'&&hit>0)state.stageTookDamage=true;
  if(before>0&&target.hp<=0){
    if(attackerSide==='BLUE'){
      state.gold.BLUE+=d.reward||30;
      dailyEvent('kill',1);
      if(['ENHANCED_GOBLIN','GOLEM','BOAR'].includes(target.card))dailyEvent('specialKill',1)
    }
    if(d.split)target.splitPending=true;
    return true
  }
  return false
}
function isInside(r,c){return r>=1&&r<=SIZE&&c>=1&&c<=SIZE}
function splitSecondSpot(dead){
  const dirs=[
    {r:dead.r,c:dead.c-1},
    {r:dead.r+1,c:dead.c},
    {r:dead.r-1,c:dead.c},
    {r:dead.r,c:dead.c+1},
    {r:dead.r+1,c:dead.c-1},
    {r:dead.r+1,c:dead.c+1},
    {r:dead.r-1,c:dead.c-1},
    {r:dead.r-1,c:dead.c+1}
  ];
  for(const p of dirs)if(isInside(p.r,p.c)&&!at(p.r,p.c))return p;

  for(const p of dirs){
    if(!isInside(p.r,p.c))continue;
    const blocker=at(p.r,p.c);
    if(blocker&&blocker.side==='BLUE'){
      const dr=Math.sign(blocker.r-dead.r),dc=Math.sign(blocker.c-dead.c);
      const behind={r:blocker.r+dr,c:blocker.c+dc};
      if(isInside(behind.r,behind.c)&&!at(behind.r,behind.c))return behind
    }
  }

  for(let r=1;r<=SIZE;r++)for(let c=1;c<=SIZE;c++)if(!at(r,c))return {r,c};
  return null
}
function spawnSmallSlime(r,c){
  if(!isInside(r,c)||at(r,c))return false;
  const d=card('RED','SMALL_SLIME');
  state.units.push({id:crypto.randomUUID(),side:'RED',card:'SMALL_SLIME',hp:d.hp,r,c,moved:false,attacked:false,freeze:0,frozenNow:false,hammerReady:false});
  return true
}
function removeDeadAndSplit(){
  const deadSlimes=state.units.filter(u=>u.hp<=0&&u.splitPending);
  state.units=state.units.filter(u=>u.hp>0);
  for(const dead of deadSlimes){
    spawnSmallSlime(dead.r,dead.c);
    const second=splitSecondSpot(dead);
    if(second)spawnSmallSlime(second.r,second.c)
  }
}
function exhausted(s){
  if(livingCount(s)!==0)return false;
  if(s==='RED')return state.summons.RED>=maxSummons('RED');
  return state.summons.BLUE>=maxSummons('BLUE')||!canSummonMore('BLUE');
}
function enterRest(rewardText){
  state.phase='REST';
  state.current='BLUE';
  selectedUnit=null;
  selectedCard='';
  msg(rewardText)
}
function stageClearRewards(stageNo){
  const base={1:50,2:200,3:300}[stageNo]||0;
  if(base)awardDiamonds(base);
  dailyEvent('stageClear',1);
  if(stageNo===3)dailyEvent('stage3Clear',1);
  let bonus=0;
  if(!state.stageTookDamage){
    bonus=100;
    awardDiamonds(bonus);
    dailyEvent('noDamage',1)
  }
  return {base,bonus}
}
function clearStageOne(){
  state.keys+=2;
  const r=stageClearRewards(1);
  enterRest('1스테이지 클리어 · 열쇠 2개 + 다이아 '+r.base+'개'+(r.bonus?' + 무피해 '+r.bonus+'개':''))
}
function clearStageTwo(){
  state.keys+=1;
  const r=stageClearRewards(2);
  enterRest('2스테이지 클리어 · 열쇠 1개 + 다이아 '+r.base+'개'+(r.bonus?' + 무피해 '+r.bonus+'개':''))
}
function clearStageThree(){
  const r=stageClearRewards(3);
  state.winner='BLUE';
  msg('3스테이지 클리어 · 다이아 '+r.base+'개'+(r.bonus?' + 무피해 '+r.bonus+'개':''))
}
function checkWin(){
  if(!state||state.phase!=='BATTLE'||state.winner)return;
  if(exhausted('BLUE')){state.winner='RED';return}
  if(exhausted('RED')){
    if(state.stage===1){clearStageOne();return}
    if(state.stage===2){clearStageTwo();return}
    if(state.stage===3){clearStageThree();return}
    state.winner='BLUE'
  }
}
function resolveHammerHits(s){
  const hammers=[...state.units].filter(u=>u.side===s&&u.card==='HAMMER'&&u.hammerTarget);
  for(const hammer of hammers){
    const target=byId(hammer.hammerTarget);
    hammer.hammerTarget='';
    if(!target||target.hp<=0)continue;
    applyDamage(target,scaledStat('HAMMER','atk'),s);
    removeDeadAndSplit();
    checkWin();
    if(state.winner||state.phase!=='BATTLE')break
  }
}
function startTurn(s){
  state.current=s;
  state.turn++;
  state.summonUsed=false;
  resolveHammerHits(s);
  if(state.winner||state.phase!=='BATTLE')return;
  for(const u of state.units.filter(x=>x.side===s)){
    u.moved=false;
    u.attacked=false;
    u.frozenNow=(u.freeze||0)>0;
    if(u.frozenNow)u.freeze--
  }
}
function processAction(actor,p){
  if(!state||state.winner||actor!==state.current)return false;

  if(p.type==='summon'){
    if(state.summonUsed)return false;
    if(state.summons[actor]>=maxSummons(actor))return false;
    const id=String(p.card||'');
    const d=card(actor,id);
    if(!d||p.r!==homeRow(actor)||at(p.r,p.c))return false;
    if(actor==='BLUE'){
      if(!bluePool().includes(id)||state.gold.BLUE<d.cost)return false;
      state.gold.BLUE-=d.cost;
      dailyEvent('spendGold',d.cost);
      dailyEvent('summon',1);
    }else{
      if(!redPool().includes(id))return false;
    }
    state.summons[actor]++;
    state.units.push({
      id:crypto.randomUUID(),
      side:actor,
      card:id,
      hp:actor==='BLUE'?scaledStat(id,'hp'):d.hp,
      r:p.r,
      c:p.c,
      moved:false,
      attacked:false,
      freeze:0,
      frozenNow:false,
      hammerTarget:''
    });
    state.summonUsed=true;
  }else if(p.type==='move'){
    const u=byId(p.unit);
    if(!u||u.side!==actor||u.moved||u.frozenNow||at(p.r,p.c)||moveDist(u,{r:p.r,c:p.c})!==1)return false;
    u.r=p.r;u.c=p.c;u.moved=true;
    if(actor==='BLUE')dailyEvent('move',1);
  }else if(p.type==='attack'){
    const a=byId(p.unit),t=byId(p.target);
    if(!a||!t||a.side!==actor||t.side===actor||a.attacked||a.frozenNow)return false;

    const d=card(actor,a.card);
    if(attackDist(a,t)>d.range)return false;
    if(actor==='BLUE')dailyEvent('attack',1);

    if(d.charge){
      a.hammerTarget=t.id;
      a.attacked=true;
      msg('망치병이 '+card(t.side,t.card).name+'을 목표로 지정했어. 다음 자기 턴에 '+scaledStat('HAMMER','atk')+' 피해');
      state.version++;
      return true
    }

    if(actor==='RED'&&d.chargeAttack&&Math.random()<0.65){
      const targets=state.units.filter(u=>u.side==='BLUE'&&u.hp>0).sort((a,b)=>b.hp-a.hp);
      const victim=targets[0];
      if(victim){
        const oldR=victim.r,oldC=victim.c;
        const dr=Math.sign(victim.r-a.r),dc=Math.sign(victim.c-a.c);
        const push={r:victim.r+dr,c:victim.c+dc};
        applyDamage(victim,d.atk,'RED');
        if(victim.hp>0){
          if(!isInside(push.r,push.c)){
            victim.hp=0;
          }else if(!at(push.r,push.c)){
            victim.r=push.r;victim.c=push.c;
          }
        }
        removeDeadAndSplit();
        if(!at(oldR,oldC)){a.r=oldR;a.c=oldC}
        a.attacked=true;
        checkWin();
        state.version++;
        return true
      }
    }

    const tr=t.r,tc=t.c,tid=t.id;
    applyDamage(t,actor==='BLUE'?scaledStat(a.card,'atk'):d.atk,actor);

    if(actor==='RED'&&d.rockThrow&&Math.random()<0.40){
      const low=state.units.filter(u=>u.side==='BLUE'&&u.hp>0).sort((a,b)=>a.hp-b.hp)[0];
      if(low)applyDamage(low,50,'RED')
    }

    if(d.splash){
      for(const u of [...state.units]){
        if(u.side!==actor&&u.id!==tid&&Math.abs(u.r-tr)+Math.abs(u.c-tc)<=1){
          applyDamage(u,d.splash,actor)
        }
      }
    }

    const alive=byId(tid);
    if(alive&&alive.hp>0&&d.freeze&&Math.random()<d.freeze)alive.freeze=Math.max(alive.freeze||0,1);
    a.attacked=true;
    removeDeadAndSplit();
    checkWin();
  }else if(p.type==='end'){
    startTurn(other(actor));
    checkWin();
  }else return false;

  state.version++;
  return true
}
function broadcast(){if(mode==='online'&&client.isRoomConnected()&&state)client.sendState({gameId:GAME_ID,canonical:true,state:snapshot()})}
function act(payload){
  if(!canAct()){msg('지금은 상대 턴이야.');return}
  if(mode==='online'&&myNetworkId!==leaderId){client.sendEvent({gameId:GAME_ID,kind:'action',actor:side,payload});return}
  if(processAction(side,payload)){
    broadcast();
    render();
    if(mode==='practice'&&state.current==='RED')setTimeout(aiTurn,420)
  }else{
    msg('그 행동은 지금 할 수 없어.')
  }
}
function portraitHtml(id,d){
  return SPRITE_POS[id]
    ? '<span class="portrait"><img src="'+UNIT_SPRITE+'" alt="'+d.name+'" style="'+spriteImgStyle(id)+'"></span>'
    : '<span class="portrait" style="display:flex;align-items:center;justify-content:center;font-size:24px">'+d.icon+'</span>'
}
function artHtml(id,d){
  return SPRITE_POS[id]
    ? '<div class="art"><img src="'+UNIT_SPRITE+'" alt="'+d.name+'" style="'+spriteImgStyle(id)+'"></div>'
    : '<div class="art" style="display:flex;align-items:center;justify-content:center;font-size:38px">'+d.icon+'</div>'
}
function unitText(u){
  const d=card(u.side,u.card);
  const charge=u.card==='HAMMER'?(u.hammerTarget?' · 공격예약':' · 대상지정 필요'):'';
  const maxHp=unitMaxHp(u),atk=unitAtk(u);
  return '<div class="unit '+(u.side==='BLUE'?'blue':'red')+'">'+portraitHtml(u.card,d)+'<b>'+d.name+'</b><small>'+u.hp+'/'+maxHp+' · 공'+atk+' 사'+d.range+charge+(u.frozenNow?' · 봉인':'')+'</small><span class="hp"><i style="width:'+Math.max(0,u.hp/maxHp*100)+'%"></i></span></div>'
}
function render(){
  board.innerHTML='';
  for(let r=1;r<=SIZE;r++)for(let c=1;c<=SIZE;c++){
    const b=document.createElement('button');
    b.className='cell '+(r===1?'homeRed ':'')+(r===5?'homeBlue ':'');
    const u=state?at(r,c):null;
    if(u){b.innerHTML=unitText(u);if(u.id===selectedUnit)b.classList.add('sel')}
    b.addEventListener('click',()=>cellTap(r,c,u));
    board.appendChild(b)
  }

  hand.innerHTML='';
  if(state){
    const pool=side==='BLUE'?bluePool():redPool();
    for(const id of pool){
      const d=card(side,id),b=document.createElement('button');
      const blocked=state.phase!=='BATTLE'||state.summonUsed||state.summons[side]>=maxSummons(side)||(side==='BLUE'&&state.gold.BLUE<d.cost);
      b.className='card'+(id===selectedCard?' sel':'');
      b.disabled=blocked;
      const shownHp=side==='BLUE'?scaledStat(id,'hp'):d.hp;
      const shownAtk=side==='BLUE'?scaledStat(id,'atk'):d.atk;
      const lv=side==='BLUE'?upgradeLevel(id):0;
      b.innerHTML=artHtml(id,d)+'<b>'+d.name+(lv?' +'+lv:'')+'</b><p>HP '+shownHp+' · 공격 '+shownAtk+' · 사거리 '+d.range+'<br><span class="cost">'+(side==='BLUE'?d.cost+'골드':'적 유닛')+'</span> · '+d.desc+'</p>';
      b.onclick=()=>{
        if(!canAct())return msg('지금은 상대 턴이야.');
        if(state.phase!=='BATTLE')return msg('지금은 쉬는 시간야.');
        if(state.summonUsed)return msg('이번 턴에는 이미 소환했어.');
        if(state.summons[side]>=maxSummons(side))return msg('소환 가능 수를 모두 사용했어.');
        if(side==='BLUE'&&state.gold.BLUE<d.cost)return msg('골드가 부족해.');
        selectedCard=id;selectedUnit=null;
        msg(d.name+' 선택 · 자기 진영 첫 줄 빈칸을 눌러');
        render()
      };
      hand.appendChild(b)
    }
  }

  if(!state){
    turnEl.textContent='대기';
    deckInfo.textContent='골드 -';
    $('#restScreen').classList.add('hidden');
    $('#battlePanel').classList.remove('hidden');
    return
  }

  const resting=state.phase==='REST';
  $('#restScreen').classList.toggle('hidden',!resting);
  $('#battlePanel').classList.toggle('hidden',resting);
  $('.bottom').classList.toggle('hidden',resting);

  if(resting){
    $('#keyCount').textContent=state.keys||0;
    $('#diamondCount').textContent=state.diamonds||0;
    $('#restText').textContent=state.stage+'스테이지 완료 · 다음 전투 전에 정비할 수 있어.';
    $('#unlockedList').textContent='추가 아군: '+((state.unlocked||[]).map(id=>card('BLUE',id).name).join(', ')||'없음');
    $('#drawAlly').disabled=(state.keys||0)<=0;
    const upgradeOpen=state.stage>=2;
    $('#upgradeBox').classList.toggle('hidden',!upgradeOpen);
    if(upgradeOpen){
      const select=$('#upgradeSelect');
      const prev=select.value;
      select.innerHTML='';
      for(const id of bluePool()){
        const opt=document.createElement('option');
        opt.value=id;
        opt.textContent=card('BLUE',id).name+' +'+upgradeLevel(id);
        select.appendChild(opt)
      }
      if([...select.options].some(o=>o.value===prev))select.value=prev;
      updateUpgradeInfo()
    }
    $('#nextStage').textContent=(state.stage+1)+'스테이지 시작';
    return
  }

  turnEl.textContent=state.winner?(state.winner===side?'승리':'패배'):'스테이지 '+state.stage+' · '+(state.current===side?'내 턴':'상대 턴')+' · '+state.turn;
  deckInfo.textContent='골드 '+state.gold.BLUE+' · 내 소환 '+state.summons[side]+'/'+maxSummons(side)+' · 상대 소환 '+state.summons[other(side)]+'/'+maxSummons(other(side));
  modeInfo.textContent=mode==='practice'?'연습전':mode==='online'?'온라인 1대1':'대기';

  if(state.winner)msg(state.winner===side?'승리!':'패배')
}
function cellTap(r,c,u){
  if(!canAct())return msg('지금은 상대 턴이야.');

  if(selectedCard){
    if(r!==homeRow(side)||u)return msg('자기 진영 첫 줄의 빈칸을 눌러.');
    const id=selectedCard;
    selectedCard='';
    act({type:'summon',card:id,r,c});
    return
  }

  if(u&&u.side===side){
    selectedUnit=u.id;
    msg(card(side,u.card).name+' 선택');
    return render()
  }

  if(!selectedUnit)return msg('먼저 내 유닛이나 소환할 종류를 선택해.');
  if(u)act({type:'attack',unit:selectedUnit,target:u.id});
  else act({type:'move',unit:selectedUnit,r,c})
}
function affordableCards(s){
  if(state.summons[s]>=maxSummons(s))return [];
  if(s==='RED')return redPool();
  return bluePool().filter(id=>card('BLUE',id).cost<=state.gold.BLUE)
}
function aiTurn(){
  if(mode!=='practice'||!state||state.current!=='RED'||state.winner||aiThinking)return;
  aiThinking=true;

  const free=[];
  for(let c=1;c<=5;c++)if(!at(1,c))free.push(c);
  const options=affordableCards('RED');

  if(!state.summonUsed&&free.length&&options.length){
    const id=options[Math.floor(Math.random()*options.length)];
    processAction('RED',{type:'summon',card:id,r:1,c:free[Math.floor(Math.random()*free.length)]})
  }

  for(const u of [...state.units.filter(x=>x.side==='RED')]){
    if(u.frozenNow)continue;

    const d=card('RED',u.card);
    const targets=state.units.filter(x=>x.side==='BLUE').sort((a,b)=>attackDist(u,a)-attackDist(u,b));

    if(targets[0]&&attackDist(u,targets[0])<=d.range){
      processAction('RED',{type:'attack',unit:u.id,target:targets[0].id})
    }else if(targets[0]&&!u.moved){
      const t=targets[0];
      const moves=[[u.r+1,u.c],[u.r-1,u.c],[u.r,u.c+1],[u.r,u.c-1]]
        .map(([r,c])=>({r,c}))
        .filter(p=>p.r>=1&&p.r<=5&&p.c>=1&&p.c<=5&&!at(p.r,p.c))
        .sort((a,b)=>moveDist(a,t)-moveDist(b,t));
      if(moves[0])processAction('RED',{type:'move',unit:u.id,...moves[0]})
    }
  }

  if(!state.winner&&state.phase==='BATTLE')processAction('RED',{type:'end'});
  aiThinking=false;
  render();
  broadcast()
}

$('#practiceBtn').onclick=()=>{
  mode='practice';side='BLUE';newState();
  playersEl.textContent='나 VS 연습 AI';
  msg('연습전 시작 · 200골드 · 파랑 선공');
  render()
};
$('#endTurn').onclick=()=>act({type:'end'});
$('#cancel').onclick=()=>{selectedUnit=null;selectedCard='';msg('선택 취소');render()};

function updateUpgradeInfo(){
  if(!state||state.phase!=='REST'||state.stage<2)return;
  const id=$('#upgradeSelect').value;
  const lv=upgradeLevel(id);
  const cost=upgradeCost(id);
  $('#upgradeInfo').textContent=lv>=3
    ? card('BLUE',id).name+' · 최대 3강 완료'
    : card('BLUE',id).name+' · '+lv+'강 → '+(lv+1)+'강 · 비용 '+cost+'골드 · 체력/공격 1.25배';
  $('#upgradeAlly').disabled=lv>=3||state.gold.BLUE<cost
}
$('#upgradeSelect').onchange=updateUpgradeInfo;
$('#upgradeAlly').onclick=()=>{
  if(!state||state.phase!=='REST'||state.stage<2||side!=='BLUE')return;
  const id=$('#upgradeSelect').value;
  const lv=upgradeLevel(id);
  if(lv>=3)return msg('이미 최대 3강이야.');
  const cost=upgradeCost(id);
  if(state.gold.BLUE<cost)return msg('골드가 부족해.');
  state.gold.BLUE-=cost;
  dailyEvent('spendGold',cost);
  dailyEvent('upgrade',1);
  state.upgrades[id]=lv+1;
  msg(card('BLUE',id).name+' '+(lv+1)+'강 완료');
  state.version++;
  broadcast();
  render()
};

$('#drawAlly').onclick=()=>{
  if(!state||state.phase!=='REST'||state.keys<=0)return;
  if(side!=='BLUE')return msg('파랑 팀의 휴식 선택을 기다리는 중');
  const id=GACHA_POOL[Math.floor(Math.random()*GACHA_POOL.length)];
  state.keys--;
  dailyEvent('draw',1);
  const duplicate=state.unlocked.includes(id);
  if(!duplicate)state.unlocked.push(id);
  $('#drawResult').textContent=(duplicate?'중복! ':'새 아군! ')+card('BLUE',id).name;
  state.version++;
  broadcast();
  render()
};
$('#nextStage').onclick=()=>{
  if(!state||state.phase!=='REST')return;
  if(side!=='BLUE')return msg('파랑 팀의 다음 스테이지 시작을 기다리는 중');
  const next=state.stage+1;
  state.stage=next;
  state.phase='BATTLE';
  state.turn=1;
  state.current='BLUE';
  state.summonUsed=false;
  state.winner='';
  state.stageTookDamage=false;
  if(next===2||next===3)state.gold.BLUE=250;
  state.gold.RED=0;
  state.summons={BLUE:0,RED:0};
  state.units=[];
  selectedUnit=null;
  selectedCard='';
  $('#drawResult').textContent='';
  if(next===2)msg('2스테이지 시작 · 기본 골드 250 · 적 8마리 / 아군 12마리');
  else msg('3스테이지 시작 · 해골궁수/해골법사 제외 · 강화 고블린/골렘/멧돼지 등장');
  state.version++;
  broadcast();
  render()
};

function setAuth(on){
  $('#matchBtn').classList.toggle('hidden',!on);
  $('#logoutBtn').classList.toggle('hidden',!on);
  $('#loginBtn').classList.toggle('hidden',on);
  $('#signupBtn').classList.toggle('hidden',on)
}
$('#loginBtn').onclick=async()=>{
  msg('로그인 중...');
  const r=await client.login($('#email').value,$('#password').value);
  if(r.ok){setAuth(true);msg('로그인 완료 · 온라인 매칭 가능')}
  else msg('로그인 실패')
};
$('#signupBtn').onclick=async()=>{
  const email=$('#email').value,pw=$('#password').value,nick=(email.split('@')[0]||'player').slice(0,18);
  msg('가입 중...');
  const r=await client.signup(email,pw,nick);
  if(r.ok){setAuth(true);msg('가입 완료 · 온라인 매칭 가능')}
  else msg('가입 실패')
};
$('#logoutBtn').onclick=()=>{client.logout();setAuth(false);mode='idle';state=null;render();msg('로그아웃됨')};
$('#matchBtn').onclick=async()=>{msg('상대 찾는 중...');const r=await client.matchPvpForGame(GAME_ID,true);if(!r.ok)msg('매칭 요청 실패')};

function rememberId(id){
  if(id)networkIds.add(String(id));
  const all=[...networkIds].sort();
  leaderId=all[0]||'';

  if(myNetworkId&&all.length>=2){
    side=myNetworkId===leaderId?'BLUE':'RED';
    playersEl.textContent=(side==='BLUE'?'파랑':'빨강')+' 팀 · 온라인 1대1';

    if(myNetworkId===leaderId&&!initializedRoom){
      initializedRoom=true;
      state=newState();
      broadcast();
      render();
      msg('온라인 대전 시작 · 각 진영 200골드')
    }
  }
}
client.on('authenticated',e=>{myNetworkId=String(e.detail?.id||e.detail?.user_id||e.detail?.sub||client.currentUser?.id||'');rememberId(myNetworkId)});
client.on('websocket_connected',()=>{mode='online';initializedRoom=false;networkIds.clear();rememberId(myNetworkId);client.sendEvent({gameId:GAME_ID,kind:'hello',userId:myNetworkId,nickname:client.currentUser?.nickname||'player'});msg('방 연결됨 · 상대 대기 중')});
client.on('player_joined',e=>{for(const p of e.detail?.players||[])rememberId(p.userId||p.id);rememberId(e.detail?.userId);client.sendEvent({gameId:GAME_ID,kind:'hello',userId:myNetworkId})});
client.on('message_received',e=>{
  const m=e.detail||{};
  if(m.type==='event'&&m.gameId===GAME_ID&&m.kind==='hello'){rememberId(m.userId);return}
  if(m.type==='event'&&m.gameId===GAME_ID&&m.kind==='action'&&myNetworkId===leaderId&&state){
    if(processAction(m.actor,m.payload)){broadcast();render()}
    return
  }
  const incoming=m.type==='state'?m.state:null;
  if(incoming?.gameId===GAME_ID&&incoming.canonical&&incoming.state)setState(incoming.state)
});
renderDaily();
render();
</script>
