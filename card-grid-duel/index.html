<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">

<title>카드 워즈</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#0d1422;color:#eef3ff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input{font:inherit}
button{touch-action:manipulation}
.wrap{width:min(760px,100%);margin:auto;padding:10px 10px 90px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
h1{font-size:22px;margin:0}
.badge{font-size:12px;padding:6px 9px;border-radius:999px;background:#1f2b43;color:#b9c9ec}
.panel{background:#151f31;border:1px solid #283653;border-radius:14px;padding:10px}
#notice{min-height:34px;display:flex;align-items:center;justify-content:center;text-align:center;color:#ffd978;font-weight:800;font-size:13px;margin-bottom:8px}
#playBox{margin-bottom:10px}
.actions button{width:100%;min-height:50px;border:0;border-radius:10px;padding:0 14px;font-weight:900;color:#fff;background:#4169e1}
.boardWrap{display:flex;justify-content:center;overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.boardWrap.wide{justify-content:flex-start;justify-content:safe center}
.board.wide{width:900px;min-width:900px;flex-shrink:0}
/* 6스테이지: 칸 크기 80px 유지한 10×10. 모바일에서는 가로·세로 스크롤. */
.boardWrap.giant{max-height:min(70svh,800px);justify-content:flex-start;overflow:auto;touch-action:pan-x pan-y}
.board.giant{width:800px;min-width:800px;flex-shrink:0}
.mapControls{display:flex;gap:8px;justify-content:center;margin:8px auto}
.mapControls button{min-height:44px;border:1px solid #3b7251;background:#1e4436;color:#e0ffe5;border-radius:10px;padding:4px 14px;font-size:13px;font-weight:900}
.cell.jungle{background:radial-gradient(ellipse at 20% 18%,#356d3d 0%,transparent 48%),radial-gradient(ellipse at 83% 75%,#275236 0%,transparent 55%),linear-gradient(140deg,#112a20,#1b442c 55%,#142a1c);border:1px solid #366742}
.cell.jungle.bush{background:radial-gradient(ellipse at 30% 30%,#4a9050 0%,transparent 50%),radial-gradient(ellipse at 85% 62%,#234d30 0%,transparent 52%),linear-gradient(155deg,#12351e,#2a5c36)}
.cell.jungle.borderJungle{box-shadow:inset 5px 0 0 #719d3e}
.cell.jungleHeal{outline:2px solid #75f898;z-index:0}

/* 7스테이지 우르수스: 유튜브 공식 영상 플레이어를 화면에 표시한다. */
#bossMusicPanel{margin:8px 0 10px;padding:9px 11px;border:1px solid #965960;border-radius:12px;background:#251722;color:#ffe6db;font-size:12px;text-align:center}
#bossMusicToggle{min-height:44px;border:1px solid #bb827b;border-radius:9px;background:#633139;color:#fff4df;padding:0 14px;font-weight:900}
#bossMusicPlayer{width:100%;max-width:520px;min-height:200px;margin:9px auto 0}
#bossMusicPlayer iframe{display:block;width:100%;height:auto;min-height:200px;aspect-ratio:16/9;border:0;border-radius:8px}
#bossMusicPanel small{display:block;margin-top:8px;line-height:1.5;opacity:.88}
#bossMusicPanel a{color:#f9d6aa}
.portrait.ursusArt,.card .art.ursusArt{box-shadow:0 0 0 2px #b13935,0 0 14px #e34237;background-color:#4b1820}
.cell.bossCell{border:2px solid #d26037;background:#3e2027}


.board{width:min(94vw,560px);aspect-ratio:1;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:6px;background:#26324a;border-radius:14px}
.cell{position:relative;border:0;border-radius:10px;background:#34415d;color:#fff;overflow:hidden;min-width:0}
.cell.homeBlue{background:#2c4b62}.cell.homeRed{background:#5c343e}
.cell.sel{outline:3px solid #ffd86b}
.cell.goldChestCell{background:#594728;border:2px solid #bc9a4c}
.goldChest{position:absolute;inset:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;pointer-events:none;color:#ffe6a0;font-weight:1000}
.goldChest span{font-size:clamp(22px,6vw,36px);line-height:1}
/* 2×2 정사각형 원화 시트: 카드·유닛·상자 모두 같은 비율로 자른다. */

.unit{position:absolute;inset:4px;border-radius:9px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:3px}
.unit.blue{background:linear-gradient(#3568b7,#264b88)}
.unit.red{background:linear-gradient(#a74851,#753038)}
.portrait{display:block;width:44px;height:44px;border-radius:7px;overflow:hidden;background:#24324a;box-shadow:0 1px 4px #0008}
.portrait img,.card .art img{display:block;width:400%;height:200%;max-width:none;pointer-events:none}
/* 망치병: 기존 4×4 원화를 정사각형 배경으로 잘라 이미지 비율 변형 방지 */
.portrait.hammerArt,.card .art.hammerArt{background-size:400% 400%;background-position:66.6667% 66.6667%;background-repeat:no-repeat}
.portrait img.newArt,.card .art img.newArt,.tileArt img{width:400%;height:400%;max-width:none}
.portrait img.newAllyArt,.card .art img.newAllyArt{width:200%;height:200%;max-width:none}

.tileArt{position:absolute;inset:7%;z-index:0;border-radius:8px;overflow:hidden;pointer-events:none;opacity:.92}.unit{z-index:1}
.unit b{font-size:11px}.unit small{font-size:9px;color:#e7eeff}
.hp{position:absolute;left:5px;right:5px;bottom:4px;height:5px;background:#311;border-radius:99px;overflow:hidden}
.hp i{display:block;height:100%;background:#4bdd72}
.statusRow{display:flex;justify-content:space-between;gap:8px;margin:9px 0;font-size:12px;color:#b7c6e4}
.hand{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;padding:4px 0 8px}
.card{min-width:0;min-height:154px;border:2px solid #334563;border-radius:12px;background:#202d45;color:#fff;padding:7px;text-align:left}
.card.sel{border-color:#ffd86b;background:#3a382e}
.card:disabled{opacity:.42}
.card .art{width:100%;aspect-ratio:1/1;border-radius:8px;background:#1a2438;overflow:hidden;margin-bottom:6px;border:1px solid #425574}
.card b{font-size:13px}.card p{font-size:10px;line-height:1.35;margin:4px 0 0;color:#c5d1e9}.cost{color:#ffd978;font-weight:1000}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#0d1422e8;backdrop-filter:blur(8px);border-top:1px solid #283653;padding:8px max(10px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));display:flex;gap:8px;justify-content:center}
.bottom button{width:min(46%,260px);min-height:52px;border:0;border-radius:12px;font-weight:1000}
#endTurn{background:#4169e1;color:#fff}#cancel{background:#2b3549;color:#fff}
.hidden{display:none!important}
#restScreen{text-align:center;padding:18px}
#restScreen h2{margin:0 0 8px;font-size:24px}
#restScreen .keys{font-size:18px;color:#ffd978;font-weight:1000;margin:10px 0}
#restScreen .restActions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
#restScreen .restActions button{min-height:48px;border:0;border-radius:11px;padding:0 16px;font-weight:1000;color:#fff;background:#4169e1}
#restScreen .restActions .draw{background:#8b691e}
#restScreen .restActions .diamondDraw{background:#4d5cc4}
#drawResult{min-height:42px;margin:10px 0;color:#d8e4ff;font-weight:800}
#unlockedList{font-size:12px;color:#b7c6e4;line-height:1.5}
#diamondLine{font-size:15px;color:#78d7ff;font-weight:1000;margin:7px 0}
#upgradeBox{margin-top:12px;padding:10px;border:1px solid #344563;border-radius:12px;background:#101a2b}
#upgradeBox select{width:100%;min-height:44px;border:1px solid #3a4b69;border-radius:9px;background:#0d1626;color:#fff;padding:0 10px;font-size:16px}
#upgradeBox button{width:100%;margin-top:7px;min-height:46px;border:0;border-radius:9px;background:#6f56c9;color:#fff;font-weight:1000}
#upgradeInfo{margin-top:7px;font-size:11px;color:#c7d3e9;line-height:1.5}
#walletBar{margin:0 0 8px;display:flex;align-items:center;flex-wrap:wrap;gap:5px;font-size:13px;font-weight:850;color:#c7d3e9}
#resetDiamonds{margin-left:auto;min-height:44px;border:1px solid #805963;border-radius:9px;padding:0 12px;background:#482932;color:#ffe1e8;font-size:12px;font-weight:900;cursor:pointer}
#walletDiamonds{color:#78d7ff;font-size:16px;font-weight:1000}
@media(max-width:520px){
  .wrap{padding-left:7px;padding-right:7px}.board{gap:3px;padding:4px}.unit{inset:2px}.portrait{width:38px;height:38px}.unit b{font-size:9px}.unit small{font-size:8px}
  .hand{grid-template-columns:repeat(2,minmax(0,1fr))}.card{min-height:136px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>카드 워즈</h1><span class="badge">턴제 · 스테이지 전투</span></div>
  <div id="notice" class="panel">플레이를 눌러 시작해.</div>

  <div id="walletBar" class="panel">보유 다이아 <span id="walletDiamonds">0</span>개 <button type="button" id="resetDiamonds">다이아 초기화</button></div>

  <div id="playBox" class="panel">
    <div class="actions">
      <button id="playBtn" type="button">플레이</button>
    </div>
  </div>

  <div id="restScreen" class="panel hidden">
    <h2>스테이지 클리어</h2>
    <div id="restText">잠시 쉬어가.</div>
    <div class="keys">열쇠 <span id="keyCount">0</span>개</div>
    <div id="diamondLine">다이아 <span id="diamondCount">0</span>개</div>
    <div id="drawResult"></div>
    <div id="unlockedList">추가 아군: 없음</div>
    <div id="upgradeBox" class="hidden">
      <select id="upgradeSelect"></select>
      <button id="upgradeAlly">아군 업그레이드</button>
      <div id="upgradeInfo"></div>
    </div>
    <div class="restActions">
      <button id="drawAlly" class="draw">열쇠 1개로 아군 뽑기</button>
      <button id="drawDiamond" class="diamondDraw">다이아 120개로 아군 뽑기</button>
      <button id="nextStage">2스테이지 시작</button>
    </div>
  </div>

  <div id="battlePanel" class="panel">
    <div class="statusRow">
      <span id="players">파랑 VS 빨강</span>
      <b id="turn">대기</b>
    </div>
    <div id="mapControls" class="mapControls hidden">
      <button id="viewEnemy" type="button">적 진영 보기</button>
      <button id="viewAlly" type="button">내 진영 보기</button>
    </div>
    <div id="bossMusicPanel" class="hidden">

// 저장: 현재 턴·스테이지·유닛·뽑기·업그레이드 진행을 같은 기기에서 유지한다.
const PROGRESS_KEY='card-grid-duel-progress-v1';
function diamondWallet(){return Math.max(0,Number(localStorage.getItem(DIAMOND_KEY)||0))}
function setDiamondWallet(v){localStorage.setItem(DIAMOND_KEY,String(Math.max(0,Math.floor(v))))}
function renderWallet(){
  const wallet=document.querySelector('#walletDiamonds');
  if(wallet)wallet.textContent=String(diamondWallet());
}
function awardDiamonds(n){
  const next=diamondWallet()+Math.max(0,Math.floor(n));
  setDiamondWallet(next);
  if(state)state.diamonds=next;
  renderWallet();
  return next;
}

function resetDiamonds(){
  if(diamondWallet()===0)return msg('다이아가 이미 0개야.');

  setDiamondWallet(0);
  if(state)state.diamonds=0;
  saveProgress();
  render();
  msg('다이아를 0개로 초기화했어.');
}

function canAttackTarget(attacker,target){

function loadProgress(){
  try{
    const raw=localStorage.getItem(PROGRESS_KEY);

    const saved=JSON.parse(raw);
    // 기존 6스테이지 20×20 저장 위치를 10×10으로 보존·이전한다.
    let resizedStageSix=false;
    if(saved?.stage===6&&saved.mapSize!==10&&Array.isArray(saved.units)){
      const occupied=new Set();
      for(const u of saved.units){
        const row=Math.max(1,Math.min(10,Math.ceil(Number(u.r)/2)));
        const col=Math.max(1,Math.min(10,Math.ceil(Number(u.c)/2)));
        let found=null;
        for(let radius=0;radius<10&&!found;radius++){
          for(let r=Math.max(1,row-radius);r<=Math.min(10,row+radius)&&!found;r++){
            for(let c=Math.max(1,col-radius);c<=Math.min(10,col+radius);c++){
              if(Math.max(Math.abs(row-r),Math.abs(col-c))!==radius)continue;
              if(!occupied.has(r+','+c)){found={r,c};break}
            }
          }
        }
        if(!found)return null;
        u.r=found.r;u.c=found.c;
        occupied.add(found.r+','+found.c)
      }
      const healed=new Set();
      for(const tile of saved.specialTiles||[]){
        if(tile.type!=='HEAL')continue;
        const row=Math.max(2,Math.min(9,Math.ceil(Number(tile.r)/2)));
        const col=Math.max(8,Math.min(10,Math.ceil(Number(tile.c)/2)));
        const preferred=row+','+col;
        if(!healed.has(preferred)){tile.r=row;tile.c=col;healed.add(preferred);continue}
        let placed=false;
        for(let r=2;r<=9&&!placed;r++)for(let c=8;c<=10;c++){
          if(!healed.has(r+','+c)){tile.r=r;tile.c=c;healed.add(r+','+c);placed=true;break}
        }
        if(!placed)return null
      }
      saved.mapSize=10;
      resizedStageSix=true
    }
    // 과거 세로 10×가로 5 스테이지 5 저장본을 가로 10×세로 5로 변환한다.
    // 유닛·상자 위치와 재화·턴·증원 기록은 유지한다.
    if(saved?.stage===5&&saved.mapOrientation!=='wide'&&Array.isArray(saved.units)
      &&(saved.chests===undefined||Array.isArray(saved.chests))){
      const rotate=p=>({ ...p,r:p.c,c:p.r });
      saved.units=saved.units.map(rotate);
      if(saved.chests)saved.chests=saved.chests.map(rotate);
      saved.mapOrientation='wide'
    }
    if(!saved||!Number.isInteger(saved.stage)||saved.stage<1||saved.stage>7
      ||!Number.isInteger(saved.turn)||saved.turn<1||!['BATTLE','REST'].includes(saved.phase)
      ||!['BLUE','RED'].includes(saved.current)||!['','BLUE','RED'].includes(saved.winner)
      ||!Number.isInteger(saved.keys)||saved.keys<0
      ||!Array.isArray(saved.units)||!Array.isArray(saved.unlocked)
      ||!saved.upgrades||typeof saved.upgrades!=='object'||Array.isArray(saved.upgrades)
      ||!saved.gold||!Number.isFinite(saved.gold.BLUE)||!Number.isFinite(saved.gold.RED)
      ||!saved.summons||!Number.isInteger(saved.summons.BLUE)||!Number.isInteger(saved.summons.RED)
      ||saved.units.some(u=>!u||!CARDS[u.side]?.[u.card]||!Number.isFinite(u.hp)
        ||!Number.isInteger(u.r)||!Number.isInteger(u.c)
        ||u.r<1||u.r>(saved.stage===6||saved.stage===7?10:saved.stage===4?7:BASE_ROWS)
        ||u.c<1||u.c>(saved.stage===6||saved.stage===7?10:saved.stage===5?BASE_COLS*2:BASE_COLS))
      ||saved.unlocked.some(id=>!CARDS.BLUE[id])
      ||(saved.chests!==undefined&&(!Array.isArray(saved.chests)
        ||saved.chests.some(x=>!x||!Number.isInteger(x.r)||!Number.isInteger(x.c)
          ||x.r<1||x.r>BASE_ROWS||x.c<1||x.c>(saved.stage===5?BASE_COLS*2:BASE_COLS))))
      ||(saved.specialTiles!==undefined&&!Array.isArray(saved.specialTiles)))return null;
    // 예전 5스테이지 최종 승리 저장을 새 6스테이지 입장 전 휴식 화면으로 이전한다.
    if(saved.stage===5&&saved.winner==='BLUE'&&saved.phase==='BATTLE'){
      if(!saved.stageFiveRewarded){
        setDiamondWallet(diamondWallet()+30);
        saved.stageFiveRewarded=true
      }
      saved.winner='';
      saved.phase='REST';
      saved.current='BLUE';
      localStorage.setItem(PROGRESS_KEY,JSON.stringify(saved))
    }
    // 기존 6스테이지 최종 승리 저장은 보상 없이 7스테이지 진입 휴식으로 전환한다.
    if(saved.stage===6&&saved.winner==='BLUE'&&saved.phase==='BATTLE'){
      saved.winner='';
      saved.phase='REST';
      saved.current='BLUE';
      localStorage.setItem(PROGRESS_KEY,JSON.stringify(saved))
    }
    saved.diamonds=diamondWallet();
    if(resizedStageSix)localStorage.setItem(PROGRESS_KEY,JSON.stringify(saved));
    return saved
  }catch(error){
    console.warn('카드워즈 진행 저장 불러오기 실패',error);
    return null
  }
}
function card(s,id){return CARDS[s][id]}

}
function canSummonMore(s){

}
function applyDamage(target,amount,attackerSide){
  if(target.hp<=0)return false;
  const d=card(target.side,target.card);
  const hit=Math.max(1,Math.round(amount*(1-(d.reduce||0))));
  const before=target.hp;
  target.hp-=hit;
  if(target.side==='BLUE'&&hit>0)state.stageTookDamage=true;
  if(before>0&&target.hp<=0){
    if(attackerSide==='BLUE'){
      state.gold.BLUE+=d.reward||30;
    }
    if(d.split)target.splitPending=true;
    return true
  }
  return false
}
function isInside(r,c){return r>=1&&r<=boardRows()&&c>=1&&c<=boardCols()}
function splitSecondSpot(dead){
  const dirs=[
    {r:dead.r,c:dead.c-1},
    {r:dead.r+1,c:dead.c},
    {r:dead.r-1,c:dead.c},
    {r:dead.r,c:dead.c+1},
    {r:dead.r+1,c:dead.c-1},
    {r:dead.r+1,c:dead.c+1},
    {r:dead.r-1,c:dead.c-1},
    {r:dead.r-1,c:dead.c+1}
  ];
  for(const p of dirs)if(isInside(p.r,p.c)&&!at(p.r,p.c))return p;

  for(const p of dirs){
    if(!isInside(p.r,p.c))continue;
    const blocker=at(p.r,p.c);
    if(blocker&&blocker.side==='BLUE'){
      const dr=Math.sign(blocker.r-dead.r),dc=Math.sign(blocker.c-dead.c);
      const behind={r:blocker.r+dr,c:blocker.c+dc};
      if(isInside(behind.r,behind.c)&&!at(behind.r,behind.c))return behind
    }
  }

  for(let r=1;r<=boardRows();r++)for(let c=1;c<=boardCols();c++)if(!at(r,c))return {r,c};
  return null
}
function spawnSmallSlime(r,c){
  if(!isInside(r,c)||at(r,c))return false;
  const d=card('RED','SMALL_SLIME');
  state.units.push({id:crypto.randomUUID(),side:'RED',card:'SMALL_SLIME',hp:enemyStat('SMALL_SLIME','hp'),r,c,moved:false,attacked:false,freeze:0,frozenNow:false,hammerReady:false});
  return true
}
function removeDeadAndSplit(){
  const deadSlimes=state.units.filter(u=>u.hp<=0&&u.splitPending);
  state.units=state.units.filter(u=>u.hp>0);
  for(const dead of deadSlimes){
    spawnSmallSlime(dead.r,dead.c);
    const second=splitSecondSpot(dead);
    if(second)spawnSmallSlime(second.r,second.c)
  }
}
function exhausted(s){
  if(livingCount(s)!==0)return false;
  if(s==='RED'){
    // 6스테이지의 마지막 8턴 증원을 모두 처리했다면 저장된 소환 수가
    // 과거 저장본에서 어긋나더라도 적 전멸을 정상 클리어로 판정한다.
    if(state.stage===6&&state.lastWaveRound>=8)return true;
    return state.summons.RED>=maxSummons('RED')
  }
  return state.summons.BLUE>=maxSummons('BLUE')||!canSummonMore('BLUE');

function checkWin(){
  if(!state||state.phase!=='BATTLE'||state.winner)return;
  if(exhausted('BLUE')){state.winner='RED';return}
  if(exhausted('RED')){
    if(state.stage===1){clearStageOne();return}
    if(state.stage===2){clearStageTwo();return}
    if(state.stage===3){clearStageThree();return}
    if(state.stage===4){clearStageFour();return}
    if(state.stage===5){clearStageFive();return}
    if(state.stage===6){enterRest('6스테이지 클리어 · 7스테이지 준비');return}
    if(state.stage===7){state.winner='BLUE';msg('7스테이지 클리어!');return}
    state.winner='BLUE'
  }
}
function resolveHammerHits(s){
  const hammers=[...state.units].filter(u=>u.side===s&&u.card==='HAMMER'&&u.hammerTarget);
  for(const hammer of hammers){
    const target=byId(hammer.hammerTarget);
    hammer.hammerTarget='';
    if(!target||target.hp<=0)continue;
    applyDamage(target,scaledStat('HAMMER','atk'),s);
    removeDeadAndSplit();
    checkWin();
    if(state.winner||state.phase!=='BATTLE')break
  }
}
function resolveStageFourEnemyTurn(){
  if(state.stage!==4)return;
  state.enemyTurns=(state.enemyTurns||0)+1;
  for(const orc of [...state.units].filter(u=>u.side==='RED'&&u.card==='CHARGE_ORC'&&u.hp>0)){
    if(Math.random()>=0.40)continue;
    let r=orc.r;
    while(r<boardRows()){
      const nextR=r+1,target=at(nextR,orc.c);
      if(target){
        if(target.side==='BLUE'){
          applyDamage(target,55,'RED');
          target.attackLock=Math.max(target.attackLock||0,1);
        }
        break
      }
      r=nextR;
    }
    orc.r=r;
    removeDeadAndSplit();
    checkWin();
    if(state.winner||state.phase!=='BATTLE')return
  }
  if(state.enemyTurns%3===0){
    for(const guard of [...state.units].filter(u=>u.side==='RED'&&u.card==='RUIN_GUARDIAN'&&u.hp>0)){
      for(const target of [...state.units].filter(u=>u.side==='BLUE'&&u.hp>0&&Math.abs(u.r-guard.r)+Math.abs(u.c-guard.c)<=1))applyDamage(target,25,'RED');
      removeDeadAndSplit();
      checkWin();
      if(state.winner||state.phase!=='BATTLE')return
    }
  }
}
// 스테이지 5: 골드 상자는 중간 지역 6곳에 각 1개씩 놓는다.
function createStageFiveChests(){
  const spots=[];
  for(let r=2;r<=4;r++)for(let c=2;c<boardCols();c++)spots.push({r,c});
  for(let i=spots.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [spots[i],spots[j]]=[spots[j],spots[i]]
  }
  return spots.slice(0,6)
}
// 스테이지 5·6·7 증원은 같은 책임 함수에서 정해진 아군 라운드에만 실행한다.

  }:state.stage===6?{
    3:['ORC_MAGE','ORC_MAGE','ORC_MAGE','POISON_SCORPION','POISON_SCORPION'],
    5:['BEAR','BEAR','CHARGE_ORC','CHARGE_ORC','CHARGE_ORC'],
    8:['MOUNTED_ORC','ORC_MAGE','ORC_MAGE','CHARGE_ORC','CHARGE_ORC','CHARGE_ORC','ORC']
  }:{
    4:['CHARGE_ORC','CHARGE_ORC','BEAR'],
    7:['URSUS']
  };
  const enemies=waves[round];
  if(!enemies)return;
  const free=[];
  // 정글 치유 칸은 비워두고, 6스테이지 적은 맵 북쪽에서 증원한다.
  const lastRow=state.stage===7?5:boardRows();
  for(let r=1;r<=lastRow;r++){
    const row=[];
    for(let c=1;c<=boardCols();c++){
      if(!at(r,c)&&!chestAt(r,c)&&!(state.stage===6&&tileAt(r,c)))row.push({r,c})
    }
    for(let i=row.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [row[i],row[j]]=[row[j],row[i]]
    }
    free.push(...row)
  }
  if(free.length<enemies.length)return msg('증원 공간이 부족해.');
  for(const id of enemies){
    const pos=free.shift();
    state.units.push({
      id:crypto.randomUUID(),side:'RED',card:id,hp:enemyStat(id,'hp'),
      r:pos.r,c:pos.c,moved:false,attacked:false,freeze:0,
      frozenNow:false,attackLockedNow:false,hammerTarget:''
    });
    state.summons.RED++
  }
  state.lastWaveRound=round;
  msg(state.stage+'스테이지 '+round+'턴 · 적 '+enemies.length+'마리 출현!'+(enemies.includes('URSUS')?' 우르수스 등장!':''))
  if(enemies.includes('URSUS'))syncBossMusic()

}
// 오크 마법사: 적 턴마다 60% 확률로 주변 8칸에 공격력 50을 적용.
// 맞고 살아남은 아군은 다음 자기 턴에 이동 가능, 공격만 불가.
function resolveOrcMageEnemyTurn(){
  if(state.stage!==5&&state.stage!==6)return;
  for(const mage of [...state.units].filter(u=>u.side==='RED'&&u.card==='ORC_MAGE'&&u.hp>0)){
    if(mage.frozenNow||Math.random()>=0.6)continue;
    const nearby=state.units.filter(u=>u.side==='BLUE'&&u.hp>0&&
      Math.max(Math.abs(u.r-mage.r),Math.abs(u.c-mage.c))===1);
    if(!nearby.length)continue;
    for(const ally of nearby){
      applyDamage(ally,unitAtk(mage),'RED');
      if(ally.hp>0)ally.attackLock=Math.max(ally.attackLock||0,1)
    }
    mage.attacked=true;
    removeDeadAndSplit();
    checkWin();
    if(state.winner||state.phase!=='BATTLE')return
  }
}
// 우르수스는 첫 적 턴에 포효해 3번의 적 턴 동안 공격력을 2배로 높인다.
function resolveUrsusRoar(){
  if(state.stage!==7)return;
  for(const boss of state.units.filter(u=>u.side==='RED'&&u.card==='URSUS'&&u.hp>0)){
    if(boss.roarUsed||boss.frozenNow)continue;
    boss.roarUsed=true;
    boss.roarTurns=3;
    const allies=state.units.filter(u=>u.side==='BLUE'&&u.hp>0);
    for(let i=allies.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [allies[i],allies[j]]=[allies[j],allies[i]]
    }
    for(const ally of allies.slice(0,2))ally.attackLock=Math.max(ally.attackLock||0,1);
    msg('우르수스 포효! 3턴 공격력 2배 · 아군 최대 2명 다음 턴 공격 불가')
  }
}
function startTurn(s){
  state.current=s;
  state.turn++;
  state.summonUsed=false;
  resolveHammerHits(s);
  if(state.winner||state.phase!=='BATTLE')return;
  if(s==='RED')resolveStageFourEnemyTurn();
  if(state.winner||state.phase!=='BATTLE')return;
  for(const u of state.units.filter(x=>x.side===s)){
    u.moved=false;
    u.attacked=false;
    u.frozenNow=(u.freeze||0)>0;
    if(u.frozenNow)u.freeze--;
    u.attackLockedNow=(u.attackLock||0)>0;
    if(u.attackLockedNow)u.attackLock--
  }
  if(s==='BLUE')spawnScriptedWave();
  if(s==='RED'){
    resolveOrcMageEnemyTurn();
    resolveUrsusRoar()
  }
}
function processAction(actor,p){
  if(!state||state.winner||actor!==state.current)return false;

  if(p.type==='summon'){
    if(state.summonUsed)return false;
    if(state.summons[actor]>=maxSummons(actor))return false;
    const id=String(p.card||'');
    const d=card(actor,id);
    if(!d||p.r!==homeRow(actor)||at(p.r,p.c)||chestAt(p.r,p.c))return false;
    if(actor==='BLUE'){
      if(!bluePool().includes(id)||state.gold.BLUE<d.cost)return false;
      state.gold.BLUE-=d.cost;
    }else{
      if(!redPool().includes(id))return false;
    }
    state.summons[actor]++;
    state.units.push({
      id:crypto.randomUUID(),
      side:actor,
      card:id,
      hp:actor==='BLUE'?scaledStat(id,'hp'):enemyStat(id,'hp'),
      r:p.r,
      c:p.c,
      moved:false,
      attacked:false,
      freeze:0,
      frozenNow:false,
      hammerTarget:''
    });
    applyTile(state.units[state.units.length-1]);
    state.summonUsed=true;
  }else if(p.type==='move'){
    const u=byId(p.unit);
    if(!u||u.side!==actor||u.moved||u.frozenNow||!isInside(p.r,p.c)||at(p.r,p.c)||chestAt(p.r,p.c))return false;
    const distance=moveDist(u,{r:p.r,c:p.c});
    const cavalry=state.stage===6&&u.side==='RED'&&u.card==='MOUNTED_ORC';
    if(distance!==1&&!(cavalry&&distance===2
      &&(u.r===p.r||u.c===p.c)
      &&!at(u.r+Math.sign(p.r-u.r),u.c+Math.sign(p.c-u.c))))return false;
    u.r=p.r;u.c=p.c;u.moved=true;
    applyTile(u);
  }else if(p.type==='attackChest'){
    const a=byId(p.unit),chest=chestAt(p.r,p.c);
    if(actor!=='BLUE'||!a||a.side!==actor||!chest||a.attacked||a.frozenNow||a.attackLockedNow||!canAttackTarget(a,chest))return false;
    const gold=10+Math.floor(Math.random()*61);
    state.gold.BLUE+=gold;
    state.chests=state.chests.filter(x=>x!==chest);
    a.attacked=true;
    msg('골드 상자 파괴 · '+gold+'골드 획득!');
  }else if(p.type==='attack'){
    const a=byId(p.unit),t=byId(p.target);
    if(!a||!t||a.side!==actor||t.side===actor||a.attacked||a.frozenNow||a.attackLockedNow)return false;

    const d=card(actor,a.card);
    if(!canAttackTarget(a,t))return false;
    if(d.charge){
      a.hammerTarget=t.id;
      a.attacked=true;
      msg('망치병이 '+card(t.side,t.card).name+'을 목표로 지정했어. 다음 자기 턴에 '+scaledStat('HAMMER','atk')+' 피해');
      state.version++;
      return true
    }

    if(actor==='RED'&&d.chargeAttack&&Math.random()<0.65){
      const targets=state.units.filter(u=>u.side==='BLUE'&&u.hp>0).sort((a,b)=>b.hp-a.hp);
      const victim=targets[0];
      if(victim){
        const oldR=victim.r,oldC=victim.c;
        const dr=Math.sign(victim.r-a.r),dc=Math.sign(victim.c-a.c);
        const push={r:victim.r+dr,c:victim.c+dc};
        applyDamage(victim,unitAtk(a),'RED');
        if(victim.hp>0){
          if(!isInside(push.r,push.c)){
            victim.hp=0;
          }else if(!at(push.r,push.c)){
            victim.r=push.r;victim.c=push.c;
          }
        }
        removeDeadAndSplit();
        if(!at(oldR,oldC)){a.r=oldR;a.c=oldC}
        a.attacked=true;
        checkWin();
        state.version++;
        return true
      }
    }

    const tr=t.r,tc=t.c,tid=t.id;
    applyDamage(t,actor==='BLUE'?scaledStat(a.card,'atk'):unitAtk(a),actor);

    if(actor==='RED'&&d.rockThrow&&Math.random()<0.40){
      const low=state.units.filter(u=>u.side==='BLUE'&&u.hp>0).sort((a,b)=>a.hp-b.hp)[0];
      if(low)applyDamage(low,50,'RED')
    }

    if(d.splash){
      for(const u of [...state.units]){
        if(u.side!==actor&&u.id!==tid&&Math.abs(u.r-tr)+Math.abs(u.c-tc)<=1){
          applyDamage(u,d.splash,actor)
        }
      }
    }

    const alive=byId(tid);
    if(alive&&alive.hp>0&&d.freeze&&Math.random()<d.freeze)alive.freeze=Math.max(alive.freeze||0,1);
    a.attacked=true;
    removeDeadAndSplit();
    checkWin();
  }else if(p.type==='end'){
    // 우르수스 포효 버프는 적의 행동을 마친 후 감소시켜 정확히 3번 적용한다.
    if(actor==='RED'&&state.stage===7){
      for(const boss of state.units.filter(u=>u.side==='RED'&&u.card==='URSUS'&&u.roarTurns>0))boss.roarTurns--
    }
    startTurn(other(actor));
    checkWin();
  }else return false;

  state.version++;
  return true
}
function act(payload){
  if(!canAct()){msg('지금은 상대 턴이야.');return}
  if(processAction(side,payload)){
    saveProgress();
    render();
    if(mode==='play'&&state.current==='RED')setTimeout(aiTurn,420)
  }else{
    msg('그 행동은 지금 할 수 없어.')
  }
}
// 사용자 제작 2×2 원화를 기존 원화와 동일하게 HTML에 포함하여 모바일 이미지 404를 방지한다.
const GAME_ART_POS={GOLD_CHEST:[0,0],ORC_MAGE:[1,0],RIFLEMAN:[0,1],HEAVY_INFANTRY:[1,1]};
function gameArtStyle(id){
  const p=GAME_ART_POS[id];
  if(!p)return '';
  return 'background-position:'+(p[0]*100)+'% '+(p[1]*100)+'%;'
}
function portraitHtml(id,d){
  if(id==='URSUS')return '<span class="portrait warArt ursusArt" role="img" aria-label="'+d.name+'" style="background-position:0% 50%"></span>';
  if(id==='BEAR'||id==='MOUNTED_ORC')return '<span class="portrait warArt" role="img" aria-label="'+d.name+'" style="background-position:'+(id==='BEAR'?'0%':'100%')+' 50%"></span>';
  if(GAME_ART_POS[id])return '<span class="portrait gameArt" role="img" aria-label="'+d.name+'" style="'+gameArtStyle(id)+'"></span>';
  if(id==='HAMMER')return '<span class="portrait hammerArt" role="img" aria-label="'+d.name+'" style="background-image:url('+NEW_ART_SPRITE+')"></span>';
  if(NEW_ALLY_POS[id])return '<span class="portrait"><img class="newAllyArt" src="'+NEW_ALLY_SPRITE+'" alt="'+d.name+'" style="'+newAllyArtStyle(id)+'"></span>';
  if(NEW_ART_POS[id])return '<span class="portrait"><img class="newArt" src="'+NEW_ART_SPRITE+'" alt="'+d.name+'" style="'+newArtStyle(id)+'"></span>';
  const fallbackId=id==='CROSSBOW'?'ARCHER':id;
  return SPRITE_POS[fallbackId]
    ? '<span class="portrait"><img src="'+UNIT_SPRITE+'" alt="'+d.name+'" style="'+spriteImgStyle(fallbackId)+'"></span>'
    : '<span class="portrait" style="display:flex;align-items:center;justify-content:center;font-size:24px">'+d.icon+'</span>'
}
function artHtml(id,d){
  if(id==='URSUS')return '<div class="art warArt ursusArt" role="img" aria-label="'+d.name+'" style="background-position:0% 50%"></div>';
  if(id==='BEAR'||id==='MOUNTED_ORC')return '<div class="art warArt" role="img" aria-label="'+d.name+'" style="background-position:'+(id==='BEAR'?'0%':'100%')+' 50%"></div>';
  if(GAME_ART_POS[id])return '<div class="art gameArt" role="img" aria-label="'+d.name+'" style="'+gameArtStyle(id)+'"></div>';
  if(id==='HAMMER')return '<div class="art hammerArt" role="img" aria-label="'+d.name+'" style="background-image:url('+NEW_ART_SPRITE+')"></div>';
  if(NEW_ALLY_POS[id])return '<div class="art"><img class="newAllyArt" src="'+NEW_ALLY_SPRITE+'" alt="'+d.name+'" style="'+newAllyArtStyle(id)+'"></div>';
  if(NEW_ART_POS[id])return '<div class="art"><img class="newArt" src="'+NEW_ART_SPRITE+'" alt="'+d.name+'" style="'+newArtStyle(id)+'"></div>';
  const fallbackId=id==='CROSSBOW'?'ARCHER':id;
  return SPRITE_POS[fallbackId]
    ? '<div class="art"><img src="'+UNIT_SPRITE+'" alt="'+d.name+'" style="'+spriteImgStyle(fallbackId)+'"></div>'
    : '<div class="art" style="display:flex;align-items:center;justify-content:center;font-size:38px">'+d.icon+'</div>'
}
function tileHtml(type){
  return NEW_ART_POS[type]?'<span class="tileArt"><img src="'+NEW_ART_SPRITE+'" alt="" style="'+newArtStyle(type)+'"></span>':''
}
function unitText(u){
  const d=card(u.side,u.card);
  const charge=u.card==='HAMMER'?(u.hammerTarget?' · 공격예약':' · 대상지정 필요'):'';
  const lock=u.attackLockedNow?' · 공격불가':'';
  const rage=u.card==='URSUS'&&u.roarTurns>0?' · 포효 '+u.roarTurns+'턴':'';
  const maxHp=unitMaxHp(u),atk=unitAtk(u);
  return '<div class="unit '+(u.side==='BLUE'?'blue':'red')+'">'+portraitHtml(u.card,d)+'<b>'+d.name+'</b><small>'+u.hp+'/'+maxHp+' · 공'+atk+' 사'+d.range+charge+(u.frozenNow?' · 봉인':'')+lock+rage+'</small><span class="hp"><i style="width:'+Math.max(0,u.hp/maxHp*100)+'%"></i></span></div>'
}
function createStageFourTiles(){
  const cells=[];
  for(let r=1;r<=7;r++)for(let c=1;c<=5;c++)cells.push({r,c});
  for(let i=cells.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cells[i],cells[j]]=[cells[j],cells[i]]}
  const types=['SPIKE','HEAL','JUMP','CRACK'];
  return cells.slice(0,5).map((p,i)=>({...p,type:types[i%types.length]}))
}
function tileAt(r,c){return state&&(state.stage===4||state.stage===6)?(state.specialTiles||[]).find(t=>t.r===r&&t.c===c):null}
function createStageSixJungle(){
  // 오른쪽 정글 5열에 1~2개 치유 발판. 적 운에는 1개만 출현한다.
  const candidates=[];
  for(let r=2;r<=9;r++)for(let c=8;c<=10;c++)candidates.push({r,c,type:'HEAL'});
  for(let i=candidates.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [candidates[i],candidates[j]]=[candidates[j],candidates[i]]
  }
  return candidates.slice(0,Math.random()<0.3?1:2)
}
function applyTile(u){
  const t=tileAt(u.r,u.c);if(!t)return;
  if(t.type==='SPIKE'){applyDamage(u,20,u.side==='BLUE'?'RED':'BLUE');removeDeadAndSplit();checkWin()}
  else if(t.type==='HEAL'&&u.side==='BLUE')u.hp=Math.min(unitMaxHp(u),u.hp+30);
  else if(t.type==='JUMP'){
    const dir=u.side==='BLUE'?-1:1,dest={r:u.r+dir*2,c:u.c};
    if(isInside(dest.r,dest.c)&&!at(dest.r,dest.c)){u.r=dest.r;u.c=dest.c}
  }else if(t.type==='CRACK')state.specialTiles=state.specialTiles.filter(x=>x!==t)
}
function render(){

  if(state?.phase==='BATTLE'&&state.winner==='BLUE'){
    if(state.stage===5){state.winner='';clearStageFive()}
    else if(state.stage===6){state.winner='';enterRest('6스테이지 클리어 · 7스테이지 준비')}
  }

  board.innerHTML='';
  const rows=boardRows(),cols=boardCols();

  board.parentElement.classList.toggle('wide',state?.stage===5);

    if(state?.stage===6&&c>=8){
      b.classList.add('jungle');
      if((r+c)%3===0)b.classList.add('bush');
      if(c===8)b.classList.add('borderJungle')
    }
    if(tile?.type==='HEAL'&&state?.stage===6)b.classList.add('jungleHeal');
    if(tile){b.dataset.tile=tile.type;b.title=({SPIKE:'가시 발판',HEAL:'회복 발판',JUMP:'점프 발판',CRACK:'균열 발판'})[tile.type]||'특수 발판';b.style.boxShadow='inset 0 0 0 3px '+({SPIKE:'#d9534f',HEAL:'#47b96b',JUMP:'#5b8cff',CRACK:'#b57cff'})[tile.type];b.insertAdjacentHTML('beforeend',tileHtml(tile.type))}
    if(chest&&!u){

      b.title='골드 상자 · 공격하면 10~70골드';

    }

    }

  }

  hand.innerHTML='';
  if(state){

    for(const id of pool){
      const d=card(side,id),b=document.createElement('button');
      const blocked=state.phase!=='BATTLE'||state.summonUsed||state.summons[side]>=maxSummons(side)||(side==='BLUE'&&state.gold.BLUE<d.cost);
      b.className='card'+(id===selectedCard?' sel':'');
      b.disabled=blocked;
      const shownHp=side==='BLUE'?scaledStat(id,'hp'):enemyStat(id,'hp');
      const shownAtk=side==='BLUE'?scaledStat(id,'atk'):enemyStat(id,'atk');
      const lv=side==='BLUE'?upgradeLevel(id):0;
      b.innerHTML=artHtml(id,d)+'<b>'+d.name+(lv?' +'+lv:'')+'</b><p>HP '+shownHp+' · 공격 '+shownAtk+' · 사거리 '+d.range+'<br><span class="cost">'+(side==='BLUE'?d.cost+'골드':'적 유닛')+'</span> · '+d.desc+'</p>';
      b.onclick=()=>{
        if(!canAct())return msg('지금은 상대 턴이야.');
        if(state.phase!=='BATTLE')return msg('지금은 쉬는 시간야.');
        if(state.summonUsed)return msg('이번 턴에는 이미 소환했어.');
        if(state.summons[side]>=maxSummons(side))return msg('소환 가능 수를 모두 사용했어.');
        if(side==='BLUE'&&state.gold.BLUE<d.cost)return msg('골드가 부족해.');
        selectedCard=id;selectedUnit=null;
        msg(d.name+' 선택 · 자기 진영 첫 줄 빈칸을 눌러');

  if(!state){
    $('#playBtn').textContent='플레이';
    $('#playBtn').disabled=false;

    deckInfo.textContent='골드 -';
    $('#restScreen').classList.add('hidden');
    $('#battlePanel').classList.remove('hidden');
    return
  }

  const resting=state.phase==='REST';
  const won=state.winner==='BLUE',lost=state.winner==='RED';
  // 휴식 중에도 상단 플레이 버튼으로 다음 스테이지에 진입할 수 있게 한다.
  // 모바일에서 하단 정비/뽑기 버튼까지 스크롤하지 않아도 진행 가능하다.
  const hasNextStage=resting&&!!STAGES[state.stage+1];

  $('#playBtn').disabled=!hasNextStage&&!lost&&!won;
  const restPanel=$('#restScreen');
  const restJustOpened=resting&&restPanel.classList.contains('hidden');
  restPanel.classList.toggle('hidden',!resting);
  $('#battlePanel').classList.toggle('hidden',resting);
  $('.bottom').classList.toggle('hidden',resting);

  if(resting){
    $('#keyCount').textContent=state.keys||0;
    $('#diamondCount').textContent=diamondWallet();
    $('#restText').textContent=state.stage+'스테이지 완료 · 다음 전투 전에 정비할 수 있어.';
    $('#unlockedList').textContent='추가 아군: '+((state.unlocked||[]).map(id=>card('BLUE',id).name).join(', ')||'없음');
    $('#drawAlly').disabled=(state.keys||0)<=0;
    $('#drawDiamond').disabled=diamondWallet()<120;
    const upgradeOpen=state.stage>=2;
    $('#upgradeBox').classList.toggle('hidden',!upgradeOpen);
    if(upgradeOpen){
      const select=$('#upgradeSelect');
      const prev=select.value;
      select.innerHTML='';
      for(const id of bluePool()){
        const opt=document.createElement('option');
        opt.value=id;
        opt.textContent=card('BLUE',id).name+' +'+upgradeLevel(id);
        select.appendChild(opt)
      }
      if([...select.options].some(o=>o.value===prev))select.value=prev;
      updateUpgradeInfo()
    }
    $('#nextStage').textContent=(state.stage+1)+'스테이지 시작';
    $('#nextStage').disabled=!hasNextStage;
    // 전투 맵 아래로 내려가 있었어도 클리어 시 뽑기·강화 화면을 바로 보여준다.
    if(restJustOpened)restPanel.scrollIntoView({block:'start',behavior:'auto'});
    return
  }

  const shownTurn=state.stage>=5?Math.ceil(state.turn/2):state.turn;
  turnEl.textContent=state.winner?(state.winner===side?'승리':'패배'):'스테이지 '+state.stage+' · '+(state.current===side?'내 턴':'상대 턴')+' · '+shownTurn;
  deckInfo.textContent='골드 '+state.gold.BLUE+' · 내 소환 '+state.summons[side]+'/'+maxSummons(side)+' · 상대 소환 '+state.summons[other(side)]+'/'+maxSummons(other(side));
  modeInfo.textContent=mode==='play'?'플레이':'대기';

  if(state.winner)msg(state.winner===side?state.stage+'스테이지 클리어!':state.stage+'스테이지 패배 · 재도전을 눌러 같은 스테이지에서 다시 시작해.');
  syncBossMusic()
}
function cellTap(r,c,u){
  if(!canAct())return msg('지금은 상대 턴이야.');

  if(selectedCard){
    if(r!==homeRow(side)||u)return msg('자기 진영 첫 줄의 빈칸을 눌러.');
    const id=selectedCard;
    selectedCard='';
    act({type:'summon',card:id,r,c});
    return
  }

  if(u&&u.side===side){
    selectedUnit=u.id;
    msg(card(side,u.card).name+' 선택');
    return render()
  }
  if(chestAt(r,c)){
    if(!selectedUnit)return msg('골드 상자를 공격할 아군을 먼저 선택해.');
    act({type:'attackChest',unit:selectedUnit,r,c});
    return
  }

  if(!selectedUnit)return msg('먼저 내 유닛이나 소환할 종류를 선택해.');
  if(u)act({type:'attack',unit:selectedUnit,target:u.id});
  else act({type:'move',unit:selectedUnit,r,c})
}
function affordableCards(s){
  if(state.summons[s]>=maxSummons(s))return [];
  if(s==='RED')return redPool();
  return bluePool().filter(id=>card('BLUE',id).cost<=state.gold.BLUE)
}
function aiTurn(){
  if(mode!=='play'||!state||state.current!=='RED'||state.winner||aiThinking)return;
  aiThinking=true;

  const free=[];
  for(let c=1;c<=boardCols();c++)if(!at(1,c))free.push(c);
  const options=affordableCards('RED');

  if(state.stage!==5&&state.stage!==6&&state.stage!==7&&!state.summonUsed&&free.length&&options.length){
    const id=options[Math.floor(Math.random()*options.length)];
    processAction('RED',{type:'summon',card:id,r:1,c:free[Math.floor(Math.random()*free.length)]})
  }

  for(const u of [...state.units.filter(x=>x.side==='RED')]){
    if(u.frozenNow)continue;

    const d=card('RED',u.card);
    const targets=state.units.filter(x=>x.side==='BLUE').sort((a,b)=>attackDist(u,a)-attackDist(u,b));

    const inRange=targets.find(t=>canAttackTarget(u,t));
    if(inRange){
      processAction('RED',{type:'attack',unit:u.id,target:inRange.id})
    }else if(targets[0]&&!u.moved){
      const t=targets[0],cavalry=state.stage===6&&u.card==='MOUNTED_ORC';
      const moves=[];
      for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const near={r:u.r+dr,c:u.c+dc};
        if(!isInside(near.r,near.c)||at(near.r,near.c)||chestAt(near.r,near.c))continue;
        moves.push(near);
        if(cavalry){
          const far={r:u.r+2*dr,c:u.c+2*dc};
          if(isInside(far.r,far.c)&&!at(far.r,far.c)&&!chestAt(far.r,far.c))moves.push(far)
        }
      }
      // 1칸 이동만으로 다음 공격 사거리에 들어오면 2칸으로 넘어가지 않는다.
      moves.sort((a,b)=>{
        const aa=canAttackTarget({...u,...a},t),bb=canAttackTarget({...u,...b},t);
        return Number(bb)-Number(aa)||moveDist(a,t)-moveDist(b,t)
      });
      if(moves[0])processAction('RED',{type:'move',unit:u.id,...moves[0]})
    }
  }

  if(!state.winner&&state.phase==='BATTLE')processAction('RED',{type:'end'});
  aiThinking=false;
  saveProgress();
  render()
}

// 7스테이지 보스 음악: 임의 합성음·위키미디어 연주를 완전히 제거한다.
// 유튜브 원본 리믹스를 공식 임베드로 재생한다. 오디오 추출·복제·비공개 우회는 하지 않는다.
// 영상 플레이어는 유튜브 정책에 맞게 표시하고 원본 재생 컨트롤을 유지한다.
const BOSS_REMIX_VIDEO='2BbinQxbyI8';
const bossPlayer=$('#bossMusicPlayer');
let bossMusicRequested=false;
function playBossMusic(){
  if(!state||state.stage!==7||state.phase!=='BATTLE'||state.winner
    ||!state.units.some(u=>u.side==='RED'&&u.card==='URSUS'&&u.hp>0))return;
  if(bossPlayer.querySelector('iframe'))return;
  const frame=document.createElement('iframe');
  frame.title='우르수스 보스 음악 · 크루티코프 뮤직 라크리모사 웅장한 편곡 (4분 46초)';
  frame.setAttribute('allow','autoplay; encrypted-media; picture-in-picture; web-share');
  frame.setAttribute('allowfullscreen','');
  frame.setAttribute('referrerpolicy','strict-origin-when-cross-origin');
  // 소리를 임의 제작하지 않고 제작자의 실제 유튜브 영상 그대로 연결한다.
  frame.src='https://www.youtube-nocookie.com/embed/'+BOSS_REMIX_VIDEO
    +'?autoplay=1&controls=1&playsinline=1&loop=1&playlist='+BOSS_REMIX_VIDEO
    +'&enablejsapi=1';
  bossPlayer.appendChild(frame);
  $('#bossMusicToggle').textContent='영상에서 ▶ 눌러 재생'
}
function syncBossMusic(){
  const active=!!(state?.stage===7&&state.phase==='BATTLE'&&!state.winner
    &&state.units.some(u=>u.side==='RED'&&u.card==='URSUS'&&u.hp>0));
  $('#bossMusicPanel').classList.toggle('hidden',!active);
  if(active){
    if(!bossMusicRequested){
      bossMusicRequested=true;
      playBossMusic()
    }
  }else{
    if(bossMusicRequested){
      bossMusicRequested=false;
      // 보스가 죽거나 전투가 끝나면 영상 자체를 내려 소리가 남지 않는다.
      bossPlayer.replaceChildren()
    }
  }
}
$('#bossMusicToggle').onclick=()=>{
  if(!state||state.stage!==7||state.winner
    ||!state.units.some(u=>u.side==='RED'&&u.card==='URSUS'&&u.hp>0))return;
  const frame=bossPlayer.querySelector('iframe');
  if(!frame){playBossMusic();return}
  frame.scrollIntoView({behavior:'smooth',block:'center'});
  // 직접 터치가 필요한 모바일에서는 유튜브 영상 자체의 ▶ 버튼으로 재생할 수 있다.
  frame.contentWindow?.postMessage(JSON.stringify({event:'command',func:'playVideo',args:[]}),
    'https://www.youtube-nocookie.com')
};
$('#resetDiamonds').onclick=resetDiamonds;
$('#playBtn').onclick=()=>{
  mode='play';side='BLUE';
  // 6스테이지 승리 후 상단 버튼도 7스테이지 시작 버튼으로 작동한다.
  // 기존 휴식 화면의 뽑기/강화와 아래쪽 다음 스테이지 버튼은 유지한다.
  if(state?.phase==='REST'&&STAGES[state.stage+1]){
    startStage(state.stage+1);
    return
  }
  // 패배한 스테이지만 초기화하고 이전 보상·뽑기·강화는 유지한다.
  if(state?.winner==='RED'){
    startStage(state.stage);
    return
  }
  if(state?.winner==='BLUE'){
    newState();
    msg('1스테이지 시작 · 200골드 · 파랑 선공');
  }else if(!state){
    state=loadProgress();
    if(!state){
      newState();
      msg('1스테이지 시작 · 200골드 · 파랑 선공');
    }else{
      msg(state.stage+'스테이지 이어하기')
    }
  }
  playersEl.textContent='나 VS 적';
  saveProgress();
  render();
  if(state.phase==='BATTLE'&&state.current==='RED')setTimeout(aiTurn,420)
};
$('#endTurn').onclick=()=>act({type:'end'});
$('#cancel').onclick=()=>{selectedUnit=null;selectedCard='';msg('선택 취소');render()};

function updateUpgradeInfo(){
  if(!state||state.phase!=='REST'||state.stage<2)return;
  const id=$('#upgradeSelect').value;
  const lv=upgradeLevel(id);
  const cost=upgradeCost(id);
  $('#upgradeInfo').textContent=lv>=3
    ? card('BLUE',id).name+' · 최대 3강 완료'
    : card('BLUE',id).name+' · '+lv+'강 → '+(lv+1)+'강 · 비용 '+cost+'다이아 · 체력/공격 1.25배';
  $('#upgradeAlly').disabled=lv>=3||diamondWallet()<cost
}
$('#upgradeSelect').onchange=updateUpgradeInfo;
$('#upgradeAlly').onclick=()=>{
  if(!state||state.phase!=='REST'||state.stage<2||side!=='BLUE')return;
  const id=$('#upgradeSelect').value;
  const lv=upgradeLevel(id);
  if(lv>=3)return msg('이미 최대 3강이야.');
  const cost=upgradeCost(id);
  const diamonds=diamondWallet();
  if(diamonds<cost)return msg('다이아가 부족해.');
  const nextDiamonds=diamonds-cost;
  setDiamondWallet(nextDiamonds);
  state.diamonds=nextDiamonds;
  state.upgrades[id]=lv+1;
  msg(card('BLUE',id).name+' '+(lv+1)+'강 완료');
  state.version++;
  saveProgress();
  render()
};

// 기존 뽑기 흐름을 그대로 사용하고 결제 수단만 열쇠·다이아로 구분한다.
function drawAlly(useDiamonds){
  if(!state||state.phase!=='REST'||side!=='BLUE')return;
  if(useDiamonds){
    if(diamondWallet()<120)return msg('다이아 120개가 필요해.');
    setDiamondWallet(diamondWallet()-120);
    state.diamonds=diamondWallet();
  }else{
    if(state.keys<=0)return msg('열쇠가 부족해.');
    state.keys--;
  }
  const id=GACHA_POOL[Math.floor(Math.random()*GACHA_POOL.length)];
  const duplicate=state.unlocked.includes(id);
  if(!duplicate)state.unlocked.push(id);
  $('#drawResult').textContent=(duplicate?'중복! ':'새 아군! ')+card('BLUE',id).name;
  state.version++;
  saveProgress();
  render()
}
$('#drawAlly').onclick=()=>drawAlly(false);
$('#drawDiamond').onclick=()=>drawAlly(true);
// 다음 스테이지 및 패배 재도전은 같은 시작 함수를 이용한다.
function startStage(next){
  if(!state||!STAGES[next])return;
  state.stage=next;
  state.phase='BATTLE';
  state.turn=1;
  state.current='BLUE';
  state.summonUsed=false;
  state.winner='';
  state.stageTookDamage=false;
  state.gold.BLUE=next===1?START_GOLD:250;
  state.gold.RED=0;
  state.summons={BLUE:0,RED:0};
  state.units=[];
  state.enemyTurns=0;
  state.lastWaveRound=0;
  state.specialTiles=[];
  state.chests=next===5?createStageFiveChests():[];
  state.mapOrientation=next===5?'wide':'';
  state.specialTiles=next===6?createStageSixJungle():state.specialTiles;
  state.mapSize=next===6?10:0;
  if(next!==5)state.stageFiveRewarded=false;
  selectedUnit=null;
  selectedCard='';
  $('#drawResult').textContent='';
  if(next===1)msg('1스테이지 시작 · 200골드 · 파랑 선공');
  else if(next===2)msg('2스테이지 시작 · 기본 골드 250 · 적 8마리 / 아군 12마리');
  else if(next===3)msg('3스테이지 시작 · 해골궁수/해골법사 제외 · 강화 고블린/골렘/멧돼지 등장');
  else if(next===4){state.specialTiles=createStageFourTiles();msg('4스테이지 시작 · 7×5 맵 · 특수 발판 5개 · 방패 고블린/돌격 오크/독전갈/유적 수호자')}
  else if(next===5)msg('5스테이지 시작 · 가로 10×세로 5 · 좌우로 밀어 이동 · 2/4/5/7/8턴 적 증원');
  else if(next===6)msg('6스테이지 시작 · 10×10 맵 · 정글은 오른쪽 · 3/5/8턴 적 증원');
  else if(next===7)msg('7스테이지 시작 · 10×10 · 4턴 돌격 오크/곰 · 7턴 우르수스');
  state.version++;
  saveProgress();
  render();
  if(next===6||next===7)board.parentElement.scrollTop=board.parentElement.scrollHeight
}
$('#nextStage').onclick=()=>{
  if(!state||state.phase!=='REST'||side!=='BLUE')return;
  startStage(state.stage+1)
};
$('#viewEnemy').onclick=()=>{board.parentElement.scrollTop=0};
$('#viewAlly').onclick=()=>{board.parentElement.scrollTop=board.parentElement.scrollHeight};

// 재접속하면 저장된 턴 그대로 복구한다. 적 턴 복구 시 AI도 이어서 진행한다.
state=loadProgress();
if(state){
  mode='play';
  side='BLUE';
  playersEl.textContent='나 VS 적';
  render();
  if(state.stage===6||state.stage===7)board.parentElement.scrollTop=board.parentElement.scrollHeight;
  if(state.winner==='RED')msg(state.stage+'스테이지 패배 · 재도전 버튼으로 다시 시작해.');
  else if(state.winner==='BLUE')msg(state.stage+'스테이지 클리어! 다시 플레이할 수 있어.');
  else msg(state.stage+'스테이지 저장된 지점에서 이어서 진행해.');
  if(state.phase==='BATTLE'&&state.current==='RED'&&!state.winner)setTimeout(aiTurn,420)
}else render();
</script>
