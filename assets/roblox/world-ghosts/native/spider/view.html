<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>고디테일 거미 · 모델 보기</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1015;color:#eef3f5;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}header{position:absolute;top:18px;left:18px;z-index:2;pointer-events:none}h1{margin:0 0 5px;font-size:22px}p{margin:0;color:#9eabb4;font-size:11px;line-height:1.5}.panel{position:absolute;z-index:3;left:50%;bottom:14px;transform:translateX(-50%);width:min(95%,620px);padding:10px;border:1px solid #34414b;border-radius:15px;background:#101820e8;backdrop-filter:blur(12px)}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}button,a{min-height:38px;border:1px solid #3a4955;border-radius:8px;background:#1e2a34;color:#edf3f5;font-size:11px;font-weight:700}button[aria-pressed=true]{background:#6d352c;border-color:#ad6252}.tools{display:flex;gap:7px;margin-top:8px}.tools>*{flex:1;display:flex;align-items:center;justify-content:center;text-decoration:none}.note{text-align:center;margin-top:8px}@media(max-width:620px){.actions{grid-template-columns:repeat(3,1fr)}header{top:10px;left:12px}h1{font-size:18px}.panel{bottom:8px}}
</style>
<script type="importmap">{"imports":{"three":"../mesh/three/three.module.js","three/addons/":"../mesh/three/examples/jsm/"}}</script>
</head><body>
<header><h1>고디테일 거미</h1><p>원본 GLB · 8다리 독립 리그 · 12개 동작<br>한 손가락 회전 · 두 손가락 확대</p></header>
<div class="panel"><div class="actions" id="actions"></div><div class="tools"><button id="pause">멈춤</button><button id="reset">처음 시점</button><a href="spider.glb" download>GLB 받기</a></div><p class="note">Unity/Roblox 공용 원본 · 플랫폼별 최적화 및 런타임 검증 전</p></div>
<script type="module">
const clips=['idle','walk','run','strafe','climb','threat','bite','pounce','web_cast','hit','stagger','death'];
const labels={idle:'대기',walk:'걷기',run:'달리기',strafe:'횡이동',climb:'등반',threat:'위협',bite:'물기',pounce:'도약공격',web_cast:'거미줄',hit:'피격',stagger:'휘청임',death:'사망'};
const THREE=await import('three');const [{GLTFLoader},{OrbitControls},{RoomEnvironment}]=await Promise.all([import('three/addons/loaders/GLTFLoader.js'),import('three/addons/controls/OrbitControls.js'),import('three/addons/environments/RoomEnvironment.js')]);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0b1015);scene.fog=new THREE.Fog(0x0b1015,8,20);const pm=new THREE.PMREMGenerator(renderer),env=pm.fromScene(new RoomEnvironment(),.04);scene.environment=env.texture;pm.dispose();
const camera=new THREE.PerspectiveCamera(34,1,.1,50),controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.enablePan=false;controls.minDistance=3;controls.maxDistance=13;function reset(){camera.position.set(5,-8,3.3);controls.target.set(0,0,.75);controls.update()}reset();
scene.add(new THREE.HemisphereLight(0xbfdcff,0x24150f,1.1));for(const [c,i,x,y,z] of [[0xffc49e,2.4,-4,-5,6],[0x6f9cff,2.1,4,-2,3],[0x7896cc,1.7,0,4,4]]){const l=new THREE.DirectionalLight(c,i);l.position.set(x,y,z);scene.add(l)}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(50,50),new THREE.MeshStandardMaterial({color:0x151a1f,roughness:.9}));ground.rotation.x=-Math.PI/2;scene.add(ground);
const gltf=await new GLTFLoader().loadAsync('./spider.glb');scene.add(gltf.scene);const mixer=new THREE.AnimationMixer(gltf.scene),actions=new Map(gltf.animations.map(c=>[c.name,mixer.clipAction(c)]));let current=null,paused=false;
const host=document.getElementById('actions');for(const n of clips){const b=document.createElement('button');b.textContent=labels[n];b.dataset.clip=n;b.setAttribute('aria-pressed',n==='idle');b.onclick=()=>play(n);host.appendChild(b)}function play(n){const a=actions.get(n);if(!a)return;if(current&&current!==a)current.fadeOut(.15);a.reset().setEffectiveWeight(1).fadeIn(.15).setLoop(['bite','pounce','web_cast','hit','stagger','death'].includes(n)?THREE.LoopOnce:THREE.LoopRepeat,Infinity);a.clampWhenFinished=true;a.play();current=a;document.querySelectorAll('[data-clip]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.clip===n)))}play('idle');
document.getElementById('pause').onclick=e=>{paused=!paused;e.currentTarget.textContent=paused?'재생':'멈춤'};document.getElementById('reset').onclick=reset;function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();let last=performance.now();renderer.setAnimationLoop(now=>{const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused)mixer.update(dt);controls.update();renderer.render(scene,camera)});
</script></body></html>
