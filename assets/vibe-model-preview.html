html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#182238;color:#f4f8ff;font:14px system-ui,sans-serif}
canvas{display:block;width:100%;height:100%}

.studio-panel>button,.studio-panel>select,.studio-panel>label{display:inline-flex;align-items:center;justify-content:center;vertical-align:top;box-sizing:border-box;width:calc(50% - 8px);min-height:44px;margin:4px;padding:8px 7px;border:1px solid #7196b4;border-radius:9px;background:#213b53;color:#f4f8ff;font:600 12px system-ui,sans-serif;touch-action:manipulation}

.studio-panel>button:active{background:#315c7c}
.studio-panel>label{gap:5px;cursor:pointer}
.studio-panel>select{cursor:pointer}
@media(max-width:560px){#message{font-size:12px;max-width:calc(100vw - 120px)}.studio-panel{max-height:60vh}}
/* [모바일 이동] 원본 입력 집합에 접속하는 44px 이상 방향 패드. 3D 공간에는 새 모델을 만들지 않는다. */

.vibe-touch-controls button[aria-pressed=true]{background:#477ea3;border-color:white}
.vibe-touch-controls button:focus-visible{outline:3px solid #f0c780;outline-offset:2px}
.vibe-touch-controls [data-code=ArrowUp]{grid-column:2;grid-row:1}
.vibe-touch-controls [data-code=ArrowLeft]{grid-column:1;grid-row:2}
.vibe-touch-controls [data-code=ArrowDown]{grid-column:2;grid-row:2}

}

 const activate=name=>{mixer.stopAllAction();const clip=gltf.animations.find(c=>c.name===name)||gltf.animations[0];mixer.clipAction(clip).reset().fadeIn(.15).play()};
 animationPicker.addEventListener('change',()=>activate(animationPicker.value));activate(gltf.animations[0].name);
 connectVibeCharacter({character:model,clips:gltf.animations,genre:picker.value,THREE}).then(adapter=>{characterMotion=adapter;connectMotionPresentation(adapter.engine,presentation.engine,{map:{'state-change':{sound:'state',cooldown:.12}}});picker.addEventListener('change',()=>adapter.engine.setGenre(picker.value));adapter.action('idle')}).catch(()=>{});
}status.textContent='원본 3D · '+(gltf.animations?.length||0)+'개 애니메이션';
},undefined,()=>{loadStudioHero();status.textContent='외부 모델 로딩 실패 · 오리지널 캐릭터로 대체'});else loadStudioHero();
// [성능] 실제 렌더 프레임으로 모바일 해상도를 점진 조정한다. 게임 이동·판정·세이브와 무관하다.
const clock=new THREE.Clock();let last=0,sampleStarted=0,sampleFrames=0;
const maxPixelRatio=Math.min(devicePixelRatio,mobileView?1.5:2);
let currentPixelRatio=maxPixelRatio;
function draw(now){
 requestAnimationFrame(draw);
 if(document.hidden){sampleStarted=0;sampleFrames=0;clock.getDelta();return}
 if(now-last<33)return;
 last=now;
 const delta=Math.min(clock.getDelta(),.1);if(characterMotion)characterMotion.update(delta);else mixer?.update(delta);const input={x:Number(heldKeys.has('KeyD')||heldKeys.has('ArrowRight')||touchKeys.has('ArrowRight'))-Number(heldKeys.has('KeyA')||heldKeys.has('ArrowLeft')||touchKeys.has('ArrowLeft')),z:Number(heldKeys.has('KeyS')||heldKeys.has('ArrowDown')||touchKeys.has('ArrowDown'))-Number(heldKeys.has('KeyW')||heldKeys.has('ArrowUp')||touchKeys.has('ArrowUp'))};const actionState=premiumActions.update(delta);const motionState=locomotion.update(delta,{input,speed:resolveVibeGenre(genrePicker.value).movement.speed,locked:actionState.movementLocked});if(activeModel&&handAnimation&&!climbMotion?.busy()&&playerHealth.alive){activeModel.position.x+=motionState.velocity.x*delta;activeModel.position.z+=motionState.velocity.z*delta;if(motionState.speed>.15&&handAnimation.action!=='walk')handAnimation.play('walk');if(motionState.speed<=.15&&handAnimation.action==='walk')handAnimation.play('idle');}if(climbMotion?.busy())climbMotion.update(delta);playerHealth.tick(delta);trainingEnemy.update(delta);storybookWorld.update(delta);if(survivalVisible){const vitals=survivalDisplay.tick(delta,{sprinting:heldKeys.has('ShiftLeft')});survivalEffects.update(vitals,{reducedMotion:gameUi.ui.settings.reducedMotion})}if(heldKeys.has('KeyE')&&activeModel){const p=activeModel.position;const ledge=ledgeController.find({x:p.x,y:p.y,z:p.z});if(ledge.canGrab){climbMotion=createClimbMotion(activeModel);climbMotion.begin(ledge);climbLedge=ledge.landing;const rig=discoverClimbSkeleton(activeModel);climbRig=createAdaptiveClimbIK(THREE,{avatar:activeModel,rig});status.textContent='난간 잡기 · 매달리기 · 올라가기';heldKeys.delete('KeyE')}}const built=worldBridge.sync(gameUi.gameplay.snapshot());if(built>previousBuildings)worldVfx.burst({x:1,y:1,z:1});previousBuildings=built;worldVfx.update(delta);genreMusic.update();genreMotion?.update(delta);fxOverlay.render(screenFx.update(delta));handAnimation?.update(delta,{emotion:emotionPicker.value});keyframePlayer?.update(delta);lightingDirector.update(delta);if(expressionDirector){expressionDirector.set(emotionPicker.value==='neutral'?'neutral':emotionPicker.value==='joy'?'joy':emotionPicker.value==='fear'?'fear':'pain');expressionDirector.update(delta,{reducedMotion:gameUi.ui.settings.reducedMotion})}if(facialRig&& !handAnimation){facialRig.pose({mouthSmileLeft:emotionPicker.value==='joy'?.7:0,mouthSmileRight:emotionPicker.value==='joy'?.7:0,browInnerUp:emotionPicker.value==='fear'?.6:0,jawOpen:emotionPicker.value==='pain'?.4:0})}if(climbMotion?.busy())climbRig?.update(climbLedge,{phase:climbMotion.phase,weight:.65});if(showcaseActive)cinematic.update(delta);
 // [메인: 구도] 장르별 카메라 화각과 추적 관성을 적용하되 쇼케이스 트랙은 덮어쓰지 않는다.
 else if(activeModel){
  const view=resolveVibeGenre(genrePicker.value).camera;
  cameraFocus.copy(activeModel.position).add(cameraFocusOffset);
  shotComposer.update(delta,{

  });
 }

 // [성능: 적응형 픽셀 비율] 3초 간격의 실제 렌더 프레임으로만 변경해 해상도 진동을 억제한다.
 if(mobileView){
  if(!sampleStarted)sampleStarted=now;
  sampleFrames++;
  const elapsed=now-sampleStarted;
  if(elapsed>=3000){
   const fps=sampleFrames*1000/elapsed;
   const ratio=fps<22?Math.max(.85,currentPixelRatio-.25):fps>28?Math.min(maxPixelRatio,currentPixelRatio+.125):currentPixelRatio;
   if(Math.abs(ratio-currentPixelRatio)>.01){
    currentPixelRatio=ratio;renderer.setPixelRatio(ratio);
   }
   sampleStarted=now;sampleFrames=0;
  }
 }
}
requestAnimationFrame(draw);
