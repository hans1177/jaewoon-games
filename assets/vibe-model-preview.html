<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D 에셋 미리보기</title><style>html,body{margin:0;height:100%;background:#182238;color:#fff;font:14px system-ui}#message{position:absolute;left:12px;top:8px;z-index:2}canvas{display:block;width:100%;height:100%}</style><div id="message">모델 로딩 중</div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script type="module">

const audioButton=document.createElement('button');audioButton.textContent='효과음 켜기';audioButton.style.cssText='position:absolute;top:245px;left:12px;z-index:5';audioButton.addEventListener('click',async()=>{const effects=await atmosphericSound.unlock();const music=await genreMusic.start(genrePicker.value);audioButton.textContent=effects&&music?'효과음·음악 활성화':'오디오 사용 불가'});document.body.append(audioButton);

const genrePicker=document.createElement('select');genrePicker.setAttribute('aria-label','게임 장르');for(const [id,profile] of Object.entries(vibeGenreCatalog)){const option=document.createElement('option');option.value=id;option.textContent=profile.label;genrePicker.append(option)}genrePicker.addEventListener('change',()=>{const genre=resolveVibeGenre(genrePicker.value);gameUi.setGenre(genrePicker.value);if(activeModel){costume?.dispose();genreMotion?.dispose();costume=createVibeGenreCharacter(THREE,activeModel,genrePicker.value);genreMotion=createVibeGenreAnimation(activeModel,genrePicker.value)}genreMusic.setGenre(genrePicker.value);lightingDirector.transition(genre.lighting,1);storybookWorld.dispose();storybookWorld=createVibeStorybookWorld(THREE,scene,{preset:genre.world});if(typeof worldPicker!=='undefined')worldPicker.value=genre.world;if(typeof lightingPicker!=='undefined')lightingPicker.value=genre.lighting;camera.fov=genre.camera.fov;camera.updateProjectionMatrix();});studioControls.append(genrePicker);
const genrePlanPicker=document.createElement('select');genrePlanPicker.setAttribute('aria-label','확장 게임 시스템');for(const [id,entry] of Object.entries(vibeGenreSystems)){const option=document.createElement('option');option.value=id;option.textContent=entry.label;genrePlanPicker.append(option)}genrePlanPicker.addEventListener('change',()=>{const plan=planVibeGame({primary:genrePlanPicker.value});survivalVisible=plan.systems.includes('hunger');status.textContent=plan.primary+' · 시스템 '+plan.systems.join(', ')+' · UI '+plan.ui.join(', ')});studioControls.append(genrePlanPicker);
const worldPicker=document.createElement('select');worldPicker.setAttribute('aria-label','동화풍 배경');for(const name of ['enchantedForest','sunsetVillage','moonlitRuins','emberVolcano']){const option=document.createElement('option');option.value=name;option.textContent=name;worldPicker.append(option)}worldPicker.addEventListener('change',()=>{storybookWorld.dispose();storybookWorld=createVibeStorybookWorld(THREE,scene,{preset:worldPicker.value})});studioControls.append(worldPicker);
const shotPicker=document.createElement('select');shotPicker.setAttribute('aria-label','장면 연출');for(const name of Object.keys(vibeSceneShots)){const option=document.createElement('option');option.value=name;option.textContent=name;shotPicker.append(option)}studioControls.append(shotPicker);const shotButton=document.createElement('button');shotButton.textContent='장면 실행';shotButton.addEventListener('click',()=>{cinematic.addTrack('showcase',vibeSceneShots[shotPicker.value],{onComplete:()=>{showcaseActive=false}});showcaseActive=true});studioControls.append(shotButton);
function loadStudioHero(){const hero=createVibeHero(THREE);activeModel=hero.root;scene.add(hero.root);handAnimation=createVibeHandAnimation(hero);handAnimation.play('idle');costume?.dispose();genreMotion?.dispose();costume=createVibeGenreCharacter(THREE,hero,genrePicker.value);genreMotion=createVibeGenreAnimation(hero,genrePicker.value);facialRig=createVibeFacialRig(hero.root);handRig=createVibeHandRig(hero.root);expressionDirector=createVibeExpressionDirector(facialRig);camera.position.set(3,2.4,5.5);camera.lookAt(0,1.2,0);status.textContent='바이브 오리지널 3D 캐릭터 · 얼굴 리깅 · 동작 · 조명';}
function restyle(){const [metal,rough,exposure]=styles[picker.value];renderer.toneMappingExposure=exposure;if(!activeModel)return;activeModel.traverse(obj=>{if(!obj.isMesh)return;for(const material of (Array.isArray(obj.material)?obj.material:[obj.material])){if(!material||typeof material.roughness!=='number')continue;if(!originals.has(material))originals.set(material,[material.metalness,material.roughness]);const [m,r]=originals.get(material);material.metalness=Math.min(1,m*.5+metal*.5);material.roughness=Math.min(1,Math.max(.05,r*.5+rough*.5));material.needsUpdate=true}})}
picker.addEventListener('change',restyle);
const resize=()=>{const w=innerWidth,h=innerHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)};addEventListener('resize',resize);resize();
let mixer=null, characterMotion=null;
const showcaseButton=document.createElement('button');showcaseButton.textContent='부드러운 카메라 연출';showcaseButton.style.cssText='position:absolute;top:218px;left:12px;z-index:3;padding:8px;background:#294b72;color:white;border:1px solid #89b7f5;border-radius:8px';document.body.append(showcaseButton);showcaseButton.addEventListener('click',()=>{const p=camera.position.clone();cinematic.addTrack('showcase',[{at:0,position:p,lookAt:{x:0,y:0,z:0},fov:camera.fov},{at:1.6,position:{x:p.z*.8,y:p.y*1.15,z:-p.x*.8},lookAt:{x:0,y:0,z:0},fov:38},{at:3.2,position:p,lookAt:{x:0,y:0,z:0},fov:45}],{onComplete:()=>{showcaseActive=false}});showcaseActive=true});
const impactButton=document.createElement('button');impactButton.textContent='타격 연출 테스트';impactButton.style.cssText='position:absolute;top:128px;left:12px;z-index:3;padding:8px;background:#294b72;color:white;border:1px solid #89b7f5;border-radius:8px';document.body.append(impactButton);
impactButton.addEventListener('click',()=>presentation.cue('impact',{shake:.3,hitStop:.045,flash:.12,sound:'impact',label:'타격'}));
const motionToggle=document.createElement('label');motionToggle.style.cssText='position:absolute;top:174px;left:12px;z-index:3;background:#101b2e;padding:6px';motionToggle.innerHTML='<input type="checkbox"> 움직임 감소';document.body.append(motionToggle);motionToggle.querySelector('input').addEventListener('change',e=>presentation.engine.setAccessibility({reducedMotion:e.target.checked}));const clipNames=[];
const animationPicker=document.createElement('select');animationPicker.setAttribute('aria-label','애니메이션 동작');animationPicker.style.cssText='position:absolute;top:84px;left:12px;z-index:3;padding:8px;border-radius:8px;background:#101b2e;color:white';document.body.append(animationPicker);
const designPromise=fetch('./vibe-visual-design-system.json').then(r=>{if(!r.ok)throw Error('design unavailable');return r.json()});
const ground=new THREE.GridHelper(20,20,0x486a91,0x273a54);ground.position.y=-1;scene.add(ground);if(url)new GLTFLoader().load(url.href,gltf=>{
const model=gltf.scene;scene.add(model);activeModel=model;facialRig=createVibeFacialRig(model);handRig=createVibeHandRig(model);expressionDirector=createVibeExpressionDirector(facialRig);restyle();const box=new THREE.Box3().setFromObject(model),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());model.position.sub(center);
const radius=Math.max(size.x,size.y,size.z,0.1);ground.scale.setScalar(Math.max(radius/5,.05));ground.position.y=-size.y/2;camera.position.set(radius*1.5,radius*.9,radius*2.2);camera.lookAt(0,0,0);
if(gltf.animations?.length){

}status.textContent='원본 3D · '+(gltf.animations?.length||0)+'개 애니메이션';
},undefined,()=>{loadStudioHero();status.textContent='외부 모델 로딩 실패 · 오리지널 캐릭터로 대체'});else loadStudioHero();
const clock=new THREE.Clock();let last=0;function draw(now){requestAnimationFrame(draw);if(document.hidden||now-last<33)return;last=now;const delta=Math.min(clock.getDelta(),.1);if(characterMotion)characterMotion.update(delta);else mixer?.update(delta);const input={x:Number(heldKeys.has('KeyD')||heldKeys.has('ArrowRight'))-Number(heldKeys.has('KeyA')||heldKeys.has('ArrowLeft')),z:Number(heldKeys.has('KeyS')||heldKeys.has('ArrowDown'))-Number(heldKeys.has('KeyW')||heldKeys.has('ArrowUp'))};const actionState=premiumActions.update(delta);const motionState=locomotion.update(delta,{input,speed:resolveVibeGenre(genrePicker.value).movement.speed,locked:actionState.movementLocked});if(activeModel&&handAnimation&&!climbMotion?.busy()&&playerHealth.alive){activeModel.position.x+=motionState.velocity.x*delta;activeModel.position.z+=motionState.velocity.z*delta;if(motionState.speed>.15&&handAnimation.action!=='walk')handAnimation.play('walk');if(motionState.speed<=.15&&handAnimation.action==='walk')handAnimation.play('idle');}if(climbMotion?.busy())climbMotion.update(delta);playerHealth.tick(delta);trainingEnemy.update(delta);storybookWorld.update(delta);if(survivalVisible){const vitals=survivalDisplay.tick(delta,{sprinting:heldKeys.has('ShiftLeft')});survivalEffects.update(vitals,{reducedMotion:gameUi.ui.settings.reducedMotion})}if(heldKeys.has('KeyE')&&activeModel){const p=activeModel.position;const ledge=ledgeController.find({x:p.x,y:p.y,z:p.z});if(ledge.canGrab){climbMotion=createClimbMotion(activeModel);climbMotion.begin(ledge);climbLedge=ledge.landing;const rig=discoverClimbSkeleton(activeModel);climbRig=createAdaptiveClimbIK(THREE,{avatar:activeModel,rig});status.textContent='난간 잡기 · 매달리기 · 올라가기';heldKeys.delete('KeyE')}}const built=worldBridge.sync(gameUi.gameplay.snapshot());if(built>previousBuildings)worldVfx.burst({x:1,y:1,z:1});previousBuildings=built;worldVfx.update(delta);genreMusic.update();genreMotion?.update(delta);fxOverlay.render(screenFx.update(delta));handAnimation?.update(delta,{emotion:emotionPicker.value});keyframePlayer?.update(delta);lightingDirector.update(delta);if(expressionDirector){expressionDirector.set(emotionPicker.value==='neutral'?'neutral':emotionPicker.value==='joy'?'joy':emotionPicker.value==='fear'?'fear':'pain');expressionDirector.update(delta)}if(facialRig&& !handAnimation){facialRig.pose({mouthSmileLeft:emotionPicker.value==='joy'?.7:0,mouthSmileRight:emotionPicker.value==='joy'?.7:0,browInnerUp:emotionPicker.value==='fear'?.6:0,jawOpen:emotionPicker.value==='pain'?.4:0})}if(climbMotion?.busy())climbRig?.update(climbLedge,{phase:climbMotion.phase,weight:.65});if(showcaseActive)cinematic.update(delta);if(activeModel){const acting=characterPerformance.update(delta);activeModel.rotation.z=acting.secondarySway*.12;}presentation.update(delta);renderer.render(scene,camera)}requestAnimationFrame(draw);
