<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>알 도둑 대작전 | 재운게임즈</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1220;color:#fff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;user-select:none}canvas{position:fixed;inset:0;width:100%;height:100%}.hud{position:fixed;z-index:10;left:0;right:0;top:0;display:flex;gap:7px;align-items:center;padding:calc(7px + env(safe-area-inset-top)) 8px 6px;background:linear-gradient(#09101df2,#09101db8,transparent);pointer-events:none}.back{pointer-events:auto;color:#fff;text-decoration:none;background:#18243a;border:1px solid #47566d;border-radius:10px;padding:7px 9px;font-weight:900;font-size:11px}.title{font-size:12px;font-weight:1000}.money{margin-left:auto;padding:6px 9px;border-radius:10px;background:#162238dd;border:1px solid #52637d;font-size:11px;font-weight:1000}.panel{position:fixed;z-index:10;left:8px;top:calc(48px + env(safe-area-inset-top));min-width:160px;padding:8px 9px;border:1px solid #46556a;border-radius:12px;background:#0a1220df;font-size:10px;font-weight:850;line-height:1.5;pointer-events:none}.notice{position:fixed;z-index:30;left:50%;top:22%;transform:translate(-50%,-50%);padding:9px 14px;border:1px solid #7688a5;border-radius:13px;background:#0c1423e8;font-size:12px;font-weight:1000;opacity:0;transition:.18s;pointer-events:none}.joy{position:fixed;z-index:15;left:18px;bottom:calc(20px + env(safe-area-inset-bottom));width:112px;height:112px;border:2px solid #ffffff4a;border-radius:50%;background:#ffffff12}.stick{position:absolute;left:32px;top:32px;width:48px;height:48px;border:2px solid #ffffff80;border-radius:50%;background:#ffffff55}.actions{position:fixed;z-index:15;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));display:grid;grid-template-columns:62px 78px;grid-template-rows:60px 74px;gap:8px;align-items:end}.btn{border:2px solid #ffffff88;border-radius:50%;color:#fff;font-weight:1000;text-shadow:0 2px 4px #000;box-shadow:0 6px 14px #0006}.btn:active{transform:scale(.94)}#grab{grid-row:1/3;grid-column:2;width:78px;height:78px;background:linear-gradient(#f4a62f,#b85e20);font-size:12px}#dash{width:62px;height:62px;background:linear-gradient(#4e8ec9,#2b4f77);font-size:10px}#drop{width:62px;height:62px;background:linear-gradient(#8a5fc2,#51376f);font-size:10px}.shop{position:fixed;z-index:20;right:10px;top:calc(52px + env(safe-area-inset-top));display:grid;gap:6px}.shop button{min-width:108px;padding:8px 9px;border:1px solid #5b6d8b;border-radius:10px;background:#111d31ed;color:#fff;font-size:9px;font-weight:900}.shop button:active{transform:scale(.97)}.result{position:fixed;z-index:40;inset:0;display:none;align-items:center;justify-content:center;background:#060b14e8}.box{width:min(430px,90vw);padding:24px;border:1px solid #61718b;border-radius:20px;background:#10192a;text-align:center}.box h1{margin:0 0 8px;font-size:34px}.box p{margin:0;color:#cbd6e5;font-size:12px;line-height:1.6}.box button{margin-top:14px;padding:11px 18px;border:0;border-radius:10px;background:#2e78c6;color:#fff;font-weight:1000}@media(max-width:560px){.title{font-size:10px}.panel{top:calc(44px + env(safe-area-inset-top));font-size:9px;min-width:146px}.shop{right:7px;top:calc(47px + env(safe-area-inset-top))}.shop button{min-width:94px;padding:7px 7px;font-size:8px}.joy{left:12px;width:104px;height:104px}.stick{left:29px;top:29px;width:46px;height:46px}.actions{right:10px}}
</style></head>
<body><canvas id="c"></canvas>
<div class="hud"><a class="back" href="/">← 대문</a><div class="title">알 도둑 대작전</div><div class="money">💰 <span id="money">0</span></div></div>
<div class="panel" id="panel"></div><div class="notice" id="notice"></div>
<div class="shop"><button id="speedUp">신발 강화<br>💰 120</button><button id="bagUp">가방 강화<br>💰 180</button><button id="zoneUp">다음 구역 해금<br>💰 500</button></div>
<div class="joy" id="joy"><div class="stick" id="stick"></div></div><div class="actions"><button class="btn" id="dash">대시</button><button class="btn" id="drop">버리기</button><button class="btn" id="grab">훔치기</button></div>
<div class="result" id="result"><div class="box"><h1>최고의 알 도둑!</h1><p>전설 알을 훔쳐 부화시키고 최종 구역을 정복했습니다.</p><button onclick="location.reload()">다시 하기</button></div></div>
<script>
const c=document.querySelector('#c'),ctx=c.getContext('2d'),panel=document.querySelector('#panel'),moneyEl=document.querySelector('#money'),notice=document.querySelector('#notice'),result=document.querySelector('#result');let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);function resize(){W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const world={w:1800,h:1100};const base={x:170,y:850,r:120};const zones=[{name:'초원 둥지',x:520,y:760,color:'#78c35a',rarity:0,unlock:0},{name:'사막 둥지',x:970,y:520,color:'#d9ae55',rarity:1,unlock:1},{name:'얼음 둥지',x:1350,y:800,color:'#6ec6dd',rarity:2,unlock:2},{name:'용암 둥지',x:1500,y:260,color:'#d65c42',rarity:3,unlock:3}];const eggDefs=[{name:'점박이 알',value:35,inc:1,color:'#f7e5a3'},{name:'황금 알',value:90,inc:3,color:'#ffd54d'},{name:'얼음 알',value:220,inc:7,color:'#9cecff'},{name:'전설 알',value:600,inc:18,color:'#ff766d'}];let player={x:170,y:850,r:17,speed:190,maxCarry:1,carry:[],dash:0};let money=100,zoneLevel=0,pets=[],eggs=[],guards=[],time=0,cam={x:0,y:0};for(let i=0;i<zones.length;i++){for(let j=0;j<4;j++)spawnEgg(i,j)}function spawnEgg(z,j){const q=zones[z],a=(j/4)*Math.PI*2+Math.random()*.4;eggs.push({zone:z,x:q.x+Math.cos(a)*(55+Math.random()*35),y:q.y+Math.sin(a)*(55+Math.random()*35),r:14+z*2,taken:false,respawn:0})}for(let i=0;i<zones.length;i++){const q=zones[i];for(let j=0;j<2+i;j++){guards.push({zone:i,x:q.x+(Math.random()-.5)*160,y:q.y+(Math.random()-.5)*160,r:16+i*2,speed:72+i*16,alert:0,hit:0})}}
function msg(t){notice.textContent=t;notice.style.opacity=1;clearTimeout(msg.t);msg.t=setTimeout(()=>notice.style.opacity=0,1200)}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function grab(){if(player.carry.length>=player.maxCarry){msg('가방이 가득 찼어!');return}let best=null,bd=65;for(const e of eggs){if(e.taken||e.zone>zoneLevel)continue;const d=dist(player,e);if(d<bd){best=e;bd=d}}if(!best){if(dist(player,base)<base.r+30&&player.carry.length){hatch();return}msg('가까운 알이 없어');return}best.taken=true;player.carry.push(best.zone);guards.filter(g=>g.zone===best.zone).forEach(g=>g.alert=7);msg(eggDefs[best.zone].name+' 훔쳤다! 도망쳐!')}
function hatch(){if(!player.carry.length)return;let total=0;for(const z of player.carry){const d=eggDefs[z];pets.push({zone:z,x:base.x+(Math.random()-.5)*110,y:base.y+(Math.random()-.5)*80,a:Math.random()*6.28});total+=d.value;if(z===3){result.style.display='flex'}}player.carry=[];money+=total;msg('부화 성공! +'+total+'원')}function dropEgg(){if(!player.carry.length){msg('들고 있는 알이 없어');return}const z=player.carry.pop();eggs.push({zone:z,x:player.x+25,y:player.y,r:14+z*2,taken:false,respawn:0});msg('알을 내려놨어')}
let joy={id:null,x:0,y:0};const joyEl=document.querySelector('#joy'),stick=document.querySelector('#stick');function joyMove(e){const r=joyEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,m=Math.hypot(dx,dy)||1,k=Math.min(1,45/m);joy.x=dx/m*k;joy.y=dy/m*k;stick.style.transform=`translate(${joy.x*30}px,${joy.y*30}px)`}joyEl.addEventListener('pointerdown',e=>{joy.id=e.pointerId;joyEl.setPointerCapture(e.pointerId);joyMove(e)});joyEl.addEventListener('pointermove',e=>{if(e.pointerId===joy.id)joyMove(e)});function joyEnd(e){if(e.pointerId!==joy.id)return;joy.id=null;joy.x=joy.y=0;stick.style.transform=''}joyEl.addEventListener('pointerup',joyEnd);joyEl.addEventListener('pointercancel',joyEnd);document.querySelector('#grab').onclick=grab;document.querySelector('#drop').onclick=dropEgg;document.querySelector('#dash').onclick=()=>{if(player.dash<=0){player.dash=.35;msg('대시!')}};
function buy(type){if(type==='speed'){const cost=120+Math.round((player.speed-190)*1.5);if(money<cost)return msg('돈이 부족해');money-=cost;player.speed+=25;msg('이동속도 증가!')}if(type==='bag'){const cost=180+(player.maxCarry-1)*160;if(money<cost)return msg('돈이 부족해');money-=cost;player.maxCarry++;msg('가방 +1칸!')}if(type==='zone'){if(zoneLevel>=3)return msg('모든 구역 해금 완료');const cost=[500,1200,2600][zoneLevel];if(money<cost)return msg('돈이 부족해');money-=cost;zoneLevel++;msg(zones[zoneLevel].name+' 해금!')}}document.querySelector('#speedUp').onclick=()=>buy('speed');document.querySelector('#bagUp').onclick=()=>buy('bag');document.querySelector('#zoneUp').onclick=()=>buy('zone');
let keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key===' ')grab()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function update(dt){time+=dt;let x=joy.x+(keys['d']?1:0)-(keys['a']?1:0),y=joy.y+(keys['s']?1:0)-(keys['w']?1:0),m=Math.hypot(x,y);if(m>1){x/=m;y/=m}let sp=player.speed*(player.dash>0?2.1:1);player.x=Math.max(25,Math.min(world.w-25,player.x+x*sp*dt));player.y=Math.max(25,Math.min(world.h-25,player.y+y*sp*dt));player.dash=Math.max(0,player.dash-dt);if(dist(player,base)<base.r-15&&player.carry.length)hatch();for(const g of guards){g.hit=Math.max(0,g.hit-dt);if(g.zone>zoneLevel)continue;let q=zones[g.zone],target=q;if(g.alert>0){g.alert-=dt;target=player}else{const a=time*.3+g.zone+g.x*.001;target={x:q.x+Math.cos(a)*100,y:q.y+Math.sin(a)*80}}let dx=target.x-g.x,dy=target.y-g.y,d=Math.hypot(dx,dy)||1;g.x+=dx/d*g.speed*dt;g.y+=dy/d*g.speed*dt;if(g.alert>0&&dist(g,player)<g.r+player.r+8&&g.hit<=0){g.hit=1.1;if(player.carry.length){const z=player.carry.pop();eggs.push({zone:z,x:player.x+20,y:player.y+10,r:14+z*2,taken:false,respawn:0});msg('경비가 알을 떨어뜨렸어!')}player.x-=dx/d*40;player.y-=dy/d*40}}for(const e of eggs){if(e.taken){e.respawn+=dt;if(e.respawn>18){e.taken=false;e.respawn=0;const q=zones[e.zone];e.x=q.x+(Math.random()-.5)*150;e.y=q.y+(Math.random()-.5)*150}}}let income=pets.reduce((s,p)=>s+eggDefs[p.zone].inc,0);money+=income*dt;for(const p of pets){p.a+=dt*(1+p.zone*.15);p.x=base.x+Math.cos(p.a)*75;p.y=base.y+Math.sin(p.a*1.3)*48}cam.x+=(Math.max(0,Math.min(world.w-W,player.x-W*.5))-cam.x)*Math.min(1,dt*6);cam.y+=(Math.max(0,Math.min(world.h-H,player.y-H*.5))-cam.y)*Math.min(1,dt*6);panel.innerHTML=`🥚 보유 ${player.carry.length}/${player.maxCarry}<br>🐾 펫 ${pets.length}마리 · +${income.toFixed(0)}/초<br>🏃 속도 ${player.speed}<br>🗺️ 구역 ${zoneLevel+1}/4`;moneyEl.textContent=Math.floor(money);document.querySelector('#speedUp').innerHTML=`신발 강화<br>💰 ${120+Math.round((player.speed-190)*1.5)}`;document.querySelector('#bagUp').innerHTML=`가방 강화<br>💰 ${180+(player.maxCarry-1)*160}`;document.querySelector('#zoneUp').innerHTML=zoneLevel>=3?'모든 구역 해금':'다음 구역 해금<br>💰 '+[500,1200,2600][zoneLevel]}
function circle(x,y,r,fill,stroke){ctx.beginPath();ctx.arc(x-cam.x,y-cam.y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#182638';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(-cam.x,-cam.y);ctx.fillStyle='#24384a';ctx.fillRect(0,0,world.w,world.h);for(let x=0;x<world.w;x+=90){for(let y=0;y<world.h;y+=90){ctx.fillStyle=((x+y)/90)%2?'#263d4e':'#294152';ctx.fillRect(x,y,90,90)}}ctx.restore();for(let i=0;i<zones.length;i++){const z=zones[i];circle(z.x,z.y,118,i<=zoneLevel?z.color:'#38414b','#ffffff55');ctx.fillStyle='#fff';ctx.font='900 13px system-ui';ctx.textAlign='center';ctx.fillText(i<=zoneLevel?z.name:'잠김',z.x-cam.x,z.y-cam.y-126)}circle(base.x,base.y,base.r,'#294f82','#8dc5ff');ctx.fillStyle='#fff';ctx.font='900 15px system-ui';ctx.textAlign='center';ctx.fillText('내 부화장',base.x-cam.x,base.y-cam.y-base.r-10);for(const e of eggs){if(e.taken||e.zone>zoneLevel)continue;const d=eggDefs[e.zone];circle(e.x,e.y,e.r,d.color,'#fff');ctx.fillStyle='#ffffff88';ctx.beginPath();ctx.ellipse(e.x-cam.x-4,e.y-cam.y-5,e.r*.28,e.r*.45,-.6,0,Math.PI*2);ctx.fill()}for(const g of guards){if(g.zone>zoneLevel)continue;circle(g.x,g.y,g.r,g.alert>0?'#e44d4d':'#314056','#dce8ff');ctx.fillStyle='#fff';ctx.font='900 10px system-ui';ctx.textAlign='center';ctx.fillText('경비',g.x-cam.x,g.y-cam.y+4)}for(const p of pets){const d=eggDefs[p.zone];circle(p.x,p.y,10+p.zone*2,d.color,'#fff');ctx.fillStyle='#111';ctx.fillRect(p.x-cam.x-4,p.y-cam.y-2,2,2);ctx.fillRect(p.x-cam.x+2,p.y-cam.y-2,2,2)}circle(player.x,player.y,player.r,'#49a7ff','#fff');ctx.fillStyle='#fff';ctx.font='900 10px system-ui';ctx.textAlign='center';ctx.fillText('나',player.x-cam.x,player.y-cam.y+4);if(player.carry.length){for(let i=0;i<player.carry.length;i++){const z=player.carry[i],d=eggDefs[z];circle(player.x+10+i*7,player.y-28-i*3,9,d.color,'#fff')}}}
let last=performance.now();function loop(n){const dt=Math.min(.033,(n-last)/1000);last=n;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);msg('알을 훔쳐 내 부화장으로 가져와!');
</script></body></html>
