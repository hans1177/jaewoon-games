<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>곤충 생존 디펜스</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}iframe{display:block;border:0;width:100%;height:100dvh}</style></head><body><iframe id="game" src="/insect_survival-28.html" allow="autoplay; fullscreen"></iframe><script>const f=document.getElementById('game');f.addEventListener('load',()=>{const w=f.contentWindow;try{w.eval(`(()=>{if(window.__jwPatch)return;window.__jwPatch=1;while(sticks.length<36)sticks.push(newStick());const __src=update.toString();update=eval('('+__src.replace("beeSpawnClock>=4&&enemies.filter(e=>e.type==='bee'||e.type==='ladybug').length<3","beeSpawnClock>=4/3&&enemies.filter(e=>e.type==='bee'||e.type==='ladybug').length<9")+')');const __sharp=()=>{W=game.clientWidth;H=game.clientHeight;const d=Math.min(3,Math.max(1,devicePixelRatio||1));cv.width=Math.round(W*d);cv.height=Math.round(H*d);cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(d,0,0,d,0,0);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';updateCamera()};addEventListener('resize',()=>requestAnimationFrame(__sharp));requestAnimationFrame(__sharp);})();`)}catch(e){console.error('survival patch',e)}});</script></body></html>
