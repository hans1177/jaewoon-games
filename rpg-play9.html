 function pondShape(P){ctx.beginPath();const pts=[[0,-1], [.55,-.88],[.95,-.45],[1,.15],[.72,.78],[.18,1],[-.5,.86],[-.96,.38],[-.9,-.36],[-.48,-.9]];pts.forEach((q,i)=>{const x=P.x+q[0]*P.rx,y=P.y+q[1]*P.ry;if(i===0)ctx.moveTo(x,y);else ctx.quadraticCurveTo(P.x+q[0]*P.rx*1.08,P.y+q[1]*P.ry*1.08,x,y)});ctx.closePath()}
 function drawPond(P){ctx.save();pondShape(P);ctx.fillStyle='#20362c';ctx.fill();ctx.strokeStyle='#314d3a';ctx.lineWidth=24;ctx.stroke();ctx.save();ctx.translate(P.x,P.y);ctx.scale(.9,.9);ctx.translate(-P.x,-P.y);pondShape(P);ctx.fillStyle='#0f2a24';ctx.fill();ctx.restore();ctx.fillStyle='#5b7048';for(let i=0;i<22;i++){const a=i*.87,rr=.35+(i%5)*.11;ctx.beginPath();ctx.ellipse(P.x+Math.cos(a)*P.rx*rr,P.y+Math.sin(a)*P.ry*rr,9,5,a,0,Math.PI*2);ctx.fill()}ctx.restore()}

 function plant9(x,y,s=1){ctx.save();ctx.translate(x,y);shadow(0,8,26*s);for(let i=0;i<8;i++){const a=-1.7+i*.49;ctx.save();ctx.rotate(a);ctx.fillStyle=i%2?'#255f3b':'#184d31';ctx.beginPath();ctx.moveTo(0,5*s);ctx.bezierCurveTo(22*s,-20*s,24*s,-62*s,7*s,-88*s);ctx.bezierCurveTo(-6*s,-62*s,-10*s,-24*s,0,5*s);ctx.fill();ctx.restore()}ctx.fillStyle='#8d456b';ctx.beginPath();ctx.arc(0,-15*s,13*s,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d69368';ctx.beginPath();ctx.arc(0,-17*s,5*s,0,Math.PI*2);ctx.fill();ctx.restore()}
 function fern9(x,y,s=1){ctx.save();ctx.translate(x,y);ctx.strokeStyle='#2f6940';ctx.lineWidth=3*s;for(let i=0;i<7;i++){const a=-2.7+i*.9;ctx.save();ctx.rotate(a);ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(20*s,-18*s,48*s,-32*s);ctx.stroke();for(let k=1;k<7;k++){ctx.fillStyle='#3c7d49';ctx.beginPath();ctx.ellipse(k*7*s,-k*4*s-5*s,7*s,3*s,-.4,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(k*7*s,-k*4*s+5*s,7*s,3*s,.4,0,Math.PI*2);ctx.fill()}ctx.restore()}ctx.restore()}
 function nearPond(x,y,pad=0){return ponds.some(P=>{const dx=(x-P.x)/(P.rx+pad),dy=(y-P.y)/(P.ry+pad);return dx*dx+dy*dy<1})}
 const prev=drawDecor;drawDecor=function(z){if(z!=='amazon'){prev(z);return}ctx.fillStyle='#0b1a13';ctx.fillRect(0,0,WORLD.w,WORLD.h);for(const P of ponds)drawPond(P);for(let i=0;i<115;i++){const x=160+((i*401+137)%2860),y=140+((i*557+229)%1920);if(nearPond(x,y,100))continue;if(i%4===0)palm9(x,y,1+(i%3)*.12);else if(i%4===1)plant9(x,y,1+(i%4)*.08);else if(i%4===2)fern9(x,y,1.1);else tropical(x,y,1.0)}for(let i=0;i<40;i++){const x=220+((i*467)%2700),y=180+((i*331)%1800);if(!nearPond(x,y,40))rock(x,y,.65)}};

})();`;
