<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>마력숲 적 티어 정하기</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07100b;color:#eef7ef;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{background:radial-gradient(circle at 20% 0,#173423 0,#0b1b12 38%,#07100b 100%);padding-bottom:86px}button,input{font:inherit}header{position:sticky;top:0;z-index:20;background:rgba(8,18,13,.94);backdrop-filter:blur(10px);border-bottom:1px solid #294633;padding:11px 12px}.top{max-width:1080px;margin:auto;display:flex;gap:10px;align-items:center;justify-content:space-between}h1{font-size:20px;margin:0}.sub{font-size:11px;color:#a8c5af;margin-top:3px}.back{border:1px solid #395b43;background:#153120;color:#f2fff5;border-radius:10px;padding:8px 10px;text-decoration:none}main{max-width:1080px;margin:auto;padding:10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:9px}.stat{background:#10251a;border:1px solid #284a34;border-radius:11px;padding:8px;text-align:center}.stat b{display:block;font-size:19px}.stat span{font-size:10px;color:#a9c5b1}.help{font-size:12px;color:#aac5b2;background:#0f2117;border:1px solid #294331;border-radius:10px;padding:8px 9px;margin-bottom:9px}.controls{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0 11px}.controls button{border:1px solid #395b43;background:#153120;color:#f2fff5;border-radius:9px;padding:8px 10px}.tier{display:grid;grid-template-columns:52px 1fr;min-height:91px;border:1px solid #334b3a;border-radius:12px;overflow:hidden;margin:7px 0;background:#0d1d14}.tier-label{display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:900;color:#111}.tier[data-tier="S"] .tier-label{background:#ff6b6b}.tier[data-tier="A"] .tier-label{background:#ffa94d}.tier[data-tier="B"] .tier-label{background:#ffe066}.tier[data-tier="C"] .tier-label{background:#8ce99a}.tier[data-tier="D"] .tier-label{background:#74c0fc}.tier[data-tier="F"] .tier-label{background:#b197fc}.tier-drop{display:flex;gap:6px;flex-wrap:wrap;align-content:flex-start;padding:7px;min-height:89px}.tier.empty .tier-drop:after{content:"선택한 적을 여기 눌러 배치";color:#6f8d78;font-size:11px;padding:8px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 2px 7px}.section-title h2{font-size:16px;margin:0}.section-title input{width:158px;max-width:48vw;background:#0d1c14;border:1px solid #355440;color:#eef7ef;border-radius:9px;padding:7px}.pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}.card{position:relative;text-align:left;border:1px solid #31513b;background:linear-gradient(180deg,#173524,#10271b);color:#f4fff6;border-radius:10px;padding:8px;min-height:76px;touch-action:manipulation}.tier-drop .card{width:138px;flex:0 0 138px}.card.selected{outline:3px solid #fff2a8;transform:translateY(-1px)}.card strong{display:block;font-size:12px;line-height:1.25;margin-bottom:4px}.meta{display:flex;gap:4px;flex-wrap:wrap}.chip{font-size:9px;padding:2px 5px;border-radius:999px;background:#244932;color:#d8f5df}.chip.aggressive{background:#5b2528;color:#ffd7da}.chip.boss{background:#60375f;color:#ffe0ff}.chip.neutral{background:#45522a;color:#f2ffd2}.numbers{font-size:9px;color:#a9c6b0;margin-top:4px}.picker{position:fixed;z-index:30;left:0;right:0;bottom:0;background:rgba(5,13,9,.97);border-top:1px solid #385341;padding:7px 9px calc(7px + env(safe-area-inset-bottom));display:none}.picker.show{display:block}.picker-inner{max-width:900px;margin:auto;display:flex;gap:4px;align-items:center}.picked-name{font-size:10px;min-width:72px;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.picker button{flex:1;min-width:36px;border:0;border-radius:8px;padding:10px 4px;font-weight:900}.pS{background:#ff6b6b}.pA{background:#ffa94d}.pB{background:#ffe066}.pC{background:#8ce99a}.pD{background:#74c0fc}.pF{background:#b197fc}.pU{background:#5c6c62;color:#fff}.notice{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#e9fff0;color:#0d2115;padding:8px 12px;border-radius:9px;font-size:11px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:50}.notice.show{opacity:1}@media(max-width:520px){main{padding:8px}.pool{grid-template-columns:repeat(2,minmax(0,1fr))}.tier{grid-template-columns:46px 1fr}.tier-drop .card{width:127px;flex-basis:127px}.picked-name{max-width:78px}}
</style></head><body>
<header><div class="top"><div><h1>마력숲 적 티어 정하기</h1><div class="sub">현재 마력숲 적 64종 · 무해 7종 제외</div></div><a class="back" href="./">본편</a></div></header>
<main><div class="stats"><div class="stat"><b>64</b><span>대상 적</span></div><div class="stat"><b id="rankedCount">0</b><span>분류 완료</span></div><div class="stat"><b id="leftCount">64</b><span>미분류</span></div></div><div class="help">적 카드를 누른 뒤 아래 S/A/B/C/D/F를 눌러. 배치된 적도 다시 눌러 옮길 수 있어. 자동 저장돼.</div><div class="controls"><button id="shuffleBtn">미분류 섞기</button><button id="copyBtn">결과 복사</button><button id="resetBtn">초기화</button></div><section id="tiers"></section><div class="section-title"><h2>미분류</h2><input id="search" type="search" placeholder="적 이름 검색"></div><div id="pool" class="pool"></div></main>
<div id="picker" class="picker"><div class="picker-inner"><div id="pickedName" class="picked-name"></div><button class="pS" data-move="S">S</button><button class="pA" data-move="A">A</button><button class="pB" data-move="B">B</button><button class="pC" data-move="C">C</button><button class="pD" data-move="D">D</button><button class="pF" data-move="F">F</button><button class="pU" data-move="U">미분류</button></div></div><div id="notice" class="notice"></div>
<script>
const ENEMIES=[{"id":"mossboar","name":"이끼멧돼지","mood":"neutral","hp":72,"dmg":9,"speed":62},{"id":"golem","name":"돌정령","mood":"neutral","hp":150,"dmg":18,"speed":42},{"id":"goblin","name":"숲 고블린","mood":"aggressive","hp":42,"dmg":7,"speed":72},{"id":"shadowwolf","name":"그림자늑대","mood":"aggressive","hp":95,"dmg":14,"speed":90},{"id":"foreststag","name":"이끼뿔사슴","mood":"neutral","hp":105,"dmg":12,"speed":68},{"id":"thornhound","name":"가시숲 사냥개","mood":"aggressive","hp":128,"dmg":18,"speed":86},{"id":"ironspirit","name":"철 정령","mood":"aggressive","hp":66.5,"dmg":9.8,"speed":135},{"id":"worldtreebear","name":"세계수 곰","mood":"aggressive","hp":380,"dmg":28,"speed":70},{"id":"sporegiant","name":"독포자 거대버섯","mood":"aggressive","hp":340,"dmg":24,"speed":54},{"id":"rootsovereign","name":"근원포식자 녹스바르","mood":"boss","hp":4500,"dmg":150,"speed":186},{"id":"firewolf","name":"화염 늑대","mood":"aggressive","hp":150,"dmg":10,"speed":96},{"id":"giantburrower","name":"초거대 잠복벌레","mood":"aggressive","hp":300,"dmg":20,"speed":68},{"id":"sandwalker","name":"오아시스 샌드 워커","mood":"neutral","hp":500,"dmg":44,"speed":58},{"id":"firegolemneutral","name":"중립 화염 골렘","mood":"neutral","hp":555,"dmg":30,"speed":38},{"id":"firegolemaggressive","name":"공격적 화염 골렘","mood":"aggressive","hp":555,"dmg":30,"speed":42},{"id":"firesnake","name":"화염 뱀","mood":"aggressive","hp":300,"dmg":25,"speed":105},{"id":"ironibex","name":"철갑 산양","mood":"neutral","hp":180,"dmg":18,"speed":64},{"id":"crystalboar","name":"수정 멧돼지","mood":"aggressive","hp":350,"dmg":40,"speed":82},{"id":"crystalboarjunior","name":"수정 멧돼지 주니어","mood":"aggressive","hp":140,"dmg":16,"speed":82},{"id":"crystalguardian","name":"수정 수호자","mood":"aggressive","hp":500,"dmg":50,"speed":76},{"id":"crystalgoblin","name":"수정 고블린","mood":"aggressive","hp":120,"dmg":22,"speed":82},{"id":"crystalironspirit","name":"수정 철 정령","mood":"aggressive","hp":210,"dmg":31,"speed":138},{"id":"crystalbear","name":"수정 곰","mood":"aggressive","hp":650,"dmg":46,"speed":76},{"id":"crystalfiresnake","name":"수정 화염 뱀","mood":"aggressive","hp":430,"dmg":38,"speed":112},{"id":"crystalibex","name":"수정 산양","mood":"aggressive","hp":360,"dmg":36,"speed":80},{"id":"shadowwolfleader","name":"그림자 늑대 우두머리","mood":"aggressive","hp":250,"dmg":30,"speed":96},{"id":"crystalfiregolem","name":"수정 화염골렘","mood":"aggressive","hp":560,"dmg":30,"speed":54},{"id":"vampirebat","name":"거대 흡혈 박쥐","mood":"aggressive","hp":190,"dmg":35,"speed":118},{"id":"ironhidehound","name":"철가죽 들개","mood":"aggressive","hp":150,"dmg":17,"speed":88},{"id":"crystalgoat","name":"수정염소","mood":"neutral","hp":135,"dmg":16,"speed":70},{"id":"lakecroc","name":"거대 호수 악어","mood":"aggressive","hp":777,"dmg":58,"speed":88},{"id":"lakebuffalo","name":"호수 물소","mood":"neutral","hp":560,"dmg":42,"speed":58},{"id":"crystaldeer","name":"수정 사슴","mood":"neutral","hp":360,"dmg":28,"speed":82},{"id":"shark","name":"거대 호수 상어","mood":"neutral","hp":800,"dmg":50,"speed":104},{"id":"giantSquid","name":"대왕오징어","mood":"aggressive","hp":1111,"dmg":66,"speed":86},{"id":"deepAngler","name":"심해 아귀","mood":"aggressive","hp":900,"dmg":60,"speed":72},{"id":"giantleech","name":"초거대 거머리","mood":"aggressive","hp":400,"dmg":44,"speed":74},{"id":"gorilla","name":"밀림 고릴라","mood":"neutral","hp":1000,"dmg":50,"speed":70},{"id":"anaconda","name":"아나콘다","mood":"aggressive","hp":800,"dmg":65,"speed":86},{"id":"mudwalker","name":"머드 워커","mood":"aggressive","hp":750,"dmg":40,"speed":66},{"id":"yetileader","name":"예티 우두머리","mood":"aggressive","hp":2599,"dmg":72,"speed":68},{"id":"yeticub","name":"예티 새끼","mood":"aggressive","hp":400,"dmg":30,"speed":82},{"id":"polarbear","name":"북극곰","mood":"aggressive","hp":1000,"dmg":50,"speed":72},{"id":"polarwolf","name":"북극늑대","mood":"neutral","hp":650,"dmg":35,"speed":92},{"id":"froststalker","name":"서리 추적자","mood":"aggressive","hp":220,"dmg":24,"speed":95},{"id":"icegolem","name":"빙결 골렘","mood":"aggressive","hp":420,"dmg":36,"speed":50},{"id":"jungletiger","name":"밀림 호랑이","mood":"aggressive","hp":850,"dmg":55,"speed":110},{"id":"jungletigerleader","name":"밀림 호랑이 우두머리","mood":"aggressive","hp":4500,"dmg":70,"speed":90},{"id":"primitiveSpearman","name":"창병 원시인","mood":"aggressive","hp":600,"dmg":30,"speed":68},{"id":"primitiveArcher","name":"원거리 원시인","mood":"aggressive","hp":400,"dmg":50,"speed":64},{"id":"jungleGuardian","name":"밀림 수호자","mood":"aggressive","hp":1300,"dmg":70,"speed":76},{"id":"flowergoblin","name":"꽃 고블린","mood":"neutral","hp":222,"dmg":30,"speed":72},{"id":"giantbee","name":"거대 꿀벌","mood":"neutral","hp":350,"dmg":40,"speed":110},{"id":"thornmantis","name":"가시 사마귀","mood":"aggressive","hp":600,"dmg":40,"speed":88},{"id":"giantspider","name":"거대 거미","mood":"aggressive","hp":555,"dmg":50,"speed":76},{"id":"giantspiderling","name":"새끼 거대거미","mood":"aggressive","hp":100,"dmg":15,"speed":92},{"id":"toxicmycelium","name":"맹독 균사체 버섯","mood":"aggressive","hp":1800,"dmg":60,"speed":54},{"id":"toxicsporeorb","name":"맹독 포자 구슬","mood":"aggressive","hp":100,"dmg":0,"speed":0},{"id":"swampgolem","name":"늪 골렘","mood":"neutral","hp":1888,"dmg":70,"speed":52},{"id":"fearbear","name":"공포 곰","mood":"aggressive","hp":1800,"dmg":60,"speed":82},{"id":"swampPrimitiveSpearman","name":"늪 원시인 창병","mood":"aggressive","hp":886,"dmg":70,"speed":68},{"id":"swampPrimitiveArcher","name":"늪 원시인 궁수","mood":"aggressive","hp":700,"dmg":80,"speed":64},{"id":"swampPrimitiveGuard","name":"늪 원시인 보초","mood":"aggressive","hp":886,"dmg":50,"speed":0},{"id":"swampArrowTower","name":"원시 화살탑","mood":"aggressive","hp":1200,"dmg":60,"speed":0}],TIERS=["S","A","B","C","D","F"],KEY="magicForestEnemyTierV1",enemyById=new Map(ENEMIES.map(e=>[e.id,e]));let selectedId=null,order=ENEMIES.map(e=>e.id),ranking={S:[],A:[],B:[],C:[],D:[],F:[]};
function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function mood(m){return m==="aggressive"?"공격적":m==="boss"?"보스":"중립"}function ping(t){const n=document.getElementById("notice");n.textContent=t;n.classList.add("show");clearTimeout(ping.t);ping.t=setTimeout(()=>n.classList.remove("show"),1000)}function save(){localStorage.setItem(KEY,JSON.stringify({ranking,order}))}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||"null");if(!x)return;const seen=new Set(),r={S:[],A:[],B:[],C:[],D:[],F:[]};for(const t of TIERS)for(const id of Array.isArray(x.ranking?.[t])?x.ranking[t]:[])if(enemyById.has(id)&&!seen.has(id)){seen.add(id);r[t].push(id)}const o=[];for(const id of Array.isArray(x.order)?x.order:[])if(enemyById.has(id)&&!seen.has(id)&&!o.includes(id))o.push(id);for(const e of ENEMIES)if(!seen.has(e.id)&&!o.includes(e.id))o.push(e.id);ranking=r;order=o}catch(_){}}
function card(id){const e=enemyById.get(id),b=document.createElement("button");b.type="button";b.className="card"+(selectedId===id?" selected":"");b.innerHTML="<strong>"+esc(e.name)+"</strong><div class='meta'><span class='chip "+e.mood+"'>"+mood(e.mood)+"</span></div><div class='numbers'>체력 "+e.hp+" · 공격 "+e.dmg+" · 속도 "+e.speed+"</div>";b.onclick=()=>{selectedId=selectedId===id?null:id;render()};return b}
function move(t){if(!selectedId)return;const id=selectedId;for(const x of TIERS)ranking[x]=ranking[x].filter(v=>v!==id);order=order.filter(v=>v!==id);if(t==="U")order.push(id);else ranking[t].push(id);selectedId=null;save();render();ping(t==="U"?"미분류로 이동":t+" 티어로 이동")}
function render(){const ts=document.getElementById("tiers");ts.innerHTML="";for(const t of TIERS){const row=document.createElement("div");row.className="tier"+(ranking[t].length?"":" empty");row.dataset.tier=t;const l=document.createElement("div");l.className="tier-label";l.textContent=t;const d=document.createElement("div");d.className="tier-drop";for(const id of ranking[t])d.appendChild(card(id));row.append(l,d);row.onclick=e=>{if(!e.target.closest(".card")&&selectedId)move(t)};ts.appendChild(row)}const q=document.getElementById("search").value.trim().toLowerCase(),p=document.getElementById("pool");p.innerHTML="";for(const id of order){const e=enemyById.get(id);if(!q||e.name.toLowerCase().includes(q))p.appendChild(card(id))}const n=TIERS.reduce((a,t)=>a+ranking[t].length,0);document.getElementById("rankedCount").textContent=n;document.getElementById("leftCount").textContent=ENEMIES.length-n;document.getElementById("picker").classList.toggle("show",!!selectedId);document.getElementById("pickedName").textContent=selectedId?(enemyById.get(selectedId)?.name||""):""}
document.querySelectorAll("[data-move]").forEach(b=>b.onclick=()=>move(b.dataset.move));document.getElementById("search").oninput=render;document.getElementById("shuffleBtn").onclick=()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}save();render();ping("섞었어")};document.getElementById("resetBtn").onclick=()=>{if(!confirm("전부 초기화할까?"))return;ranking={S:[],A:[],B:[],C:[],D:[],F:[]};order=ENEMIES.map(e=>e.id);selectedId=null;save();render();ping("초기화했어")};document.getElementById("copyBtn").onclick=async()=>{const a=["마력숲 적 티어표"];for(const t of TIERS)a.push(t+": "+(ranking[t].map(id=>enemyById.get(id).name).join(", ")||"-"));a.push("미분류: "+(order.map(id=>enemyById.get(id).name).join(", ")||"-"));const x=a.join("\n");try{await navigator.clipboard.writeText(x);ping("복사했어")}catch(_){prompt("복사해",x)}};load();render();
</script></body></html>
