<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#9ad7ff">
<title>몬스터 어드벤처 | 재운게임즈</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;min-height:100%;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:#dff4ff;color:#20314b;overscroll-behavior:none}button{font:inherit;touch-action:manipulation}.app{width:min(100%,760px);min-height:100dvh;margin:auto;background:linear-gradient(#8ed9ff 0 32%,#dff8c7 32% 100%);position:relative;overflow:hidden}.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:rgba(255,255,255,.9);border-bottom:3px solid #4a8ccf;position:relative;z-index:5}.top strong{font-size:19px;color:#245995}.top a{text-decoration:none;color:#245995;font-weight:900;background:#eef7ff;border:2px solid #91bce4;border-radius:12px;padding:7px 10px}.money{font-size:14px;font-weight:1000;color:#d88a17}.screen{padding:12px 12px 110px;min-height:calc(100dvh - 58px)}.card{background:rgba(255,255,255,.95);border:3px solid #4378a5;border-radius:18px;box-shadow:0 6px 0 rgba(35,76,111,.18);padding:12px}.hidden{display:none!important}.title{text-align:center;margin:4px 0 8px;font-size:28px;color:#244b85}.sub{text-align:center;margin:0 0 14px;color:#55708a;font-weight:800}.starterGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.starter{border:3px solid #6d94b8;background:#f9fdff;border-radius:16px;padding:9px 5px;text-align:center;font-weight:900;color:#334c68}.starter img{display:block;width:72px;height:72px;margin:0 auto 4px}.starter small{display:block;font-size:11px;color:#718399;margin-top:2px}.starter:active{transform:translateY(2px)}.world{display:grid;gap:10px}.playerPanel{display:flex;align-items:center;gap:10px}.avatar{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#fff3ae;border:3px solid #e8a936;font-size:31px}.playerInfo{flex:1}.playerInfo b{display:block;font-size:17px}.bar{height:10px;border-radius:99px;overflow:hidden;background:#d8e3eb;margin-top:5px}.bar>i{display:block;height:100%;background:#45b966;width:100%;transition:width .25s}.xpbar>i{background:#4b8de4}.stats{display:flex;gap:10px;font-size:12px;font-weight:900;color:#5c6c7b;margin-top:4px}.map{height:250px;position:relative;overflow:hidden;background:linear-gradient(#83cfff 0 46%,#9cdb74 46%);border-radius:20px;border:3px solid #4d7eab}.cloud{position:absolute;background:#fff;border-radius:99px;opacity:.9}.c1{width:90px;height:28px;left:38px;top:28px}.c2{width:65px;height:22px;right:48px;top:55px}.hill{position:absolute;bottom:67px;width:210px;height:90px;background:#70bb62;border-radius:50% 50% 0 0}.h1{left:-55px}.h2{right:-50px;background:#5eaa58}.path{position:absolute;left:50%;bottom:-34px;width:170px;height:205px;background:#d7bd80;transform:translateX(-50%) perspective(200px) rotateX(15deg);clip-path:polygon(38% 0,62% 0,100% 100%,0 100%)}.spot{position:absolute;border:0;border-radius:17px;padding:9px 11px;font-weight:1000;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2)}.spot:active{transform:translateY(2px)}.spot1{left:16px;bottom:24px;background:#36a15d}.spot2{right:13px;bottom:87px;background:#7156c7}.spot3{left:50%;top:82px;transform:translateX(-50%);background:#d9594f}.spot3:active{transform:translateX(-50%) translateY(2px)}.guide{text-align:center;background:#fff;border:2px dashed #6a97bb;border-radius:14px;padding:9px;font-size:13px;font-weight:900;color:#4d6580}.party{display:flex;gap:7px;overflow-x:auto;padding:3px 0}.chip{flex:0 0 auto;border:2px solid #91adc5;border-radius:13px;background:#f9fcff;padding:6px 8px;min-width:94px}.chip img{width:28px;height:28px;vertical-align:middle}.chip b{font-size:12px}.battleField{position:relative;height:305px;border:3px solid #4d7eab;border-radius:20px;overflow:hidden;background:linear-gradient(#8dd5ff 0 54%,#b5df74 54%);margin-bottom:10px}.platform{position:absolute;width:175px;height:46px;background:#7dbf65;border-radius:50%;box-shadow:inset 0 -9px 0 #5e9e4c}.enemyPlat{right:8px;top:123px}.myPlat{left:2px;bottom:24px}.monster{position:absolute;width:112px;height:112px;object-fit:contain;filter:drop-shadow(0 7px 3px rgba(0,0,0,.18));transition:transform .2s,opacity .2s}.enemyMon{right:39px;top:38px}.myMon{left:38px;bottom:38px;transform:scaleX(-1)}.enemyBox,.myBox{position:absolute;width:185px;background:rgba(255,255,255,.94);border:2px solid #526b84;border-radius:13px;padding:7px}.enemyBox{left:8px;top:12px}.myBox{right:8px;bottom:8px}.boxTop{display:flex;justify-content:space-between;font-size:13px;font-weight:1000}.hpText{font-size:10px;text-align:right;color:#556778;margin-top:2px;font-weight:900}.battleText{min-height:61px;background:#fff;border:3px solid #4d6b88;border-radius:15px;padding:10px 12px;font-weight:900;line-height:1.45;margin-bottom:9px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.action{min-height:54px;border:3px solid #4d6b88;border-radius:14px;background:#fff;font-weight:1000;color:#29455f}.action.attack{background:#ffdd82;border-color:#c98521}.action.skill{background:#ff9c83;border-color:#c95b45}.action.capture{background:#a9ddff;border-color:#4c8fbe}.action.heal{background:#bff0b5;border-color:#65a95a}.action:disabled{filter:grayscale(.8);opacity:.55}.result{position:absolute;inset:0;display:grid;place-items:center;background:rgba(30,51,71,.72);z-index:7;padding:20px}.resultBox{width:min(100%,360px);background:#fff;border:4px solid #426b90;border-radius:22px;text-align:center;padding:18px}.resultBox h2{margin:0 0 8px}.bigBtn{width:100%;min-height:52px;border:0;border-radius:14px;background:#3789d2;color:#fff;font-size:17px;font-weight:1000;box-shadow:0 4px 0 #1b5d99}.dexGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.dexItem{display:flex;align-items:center;gap:8px;border:2px solid #9db2c5;border-radius:14px;padding:8px;background:#f9fcff}.dexItem img{width:44px;height:44px}.dexItem.locked{filter:grayscale(1);opacity:.45}.dexItem b{font-size:13px}.dexItem small{display:block;color:#708090}.bottom{position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,760px);height:92px;padding:8px 10px max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:rgba(247,252,255,.97);border-top:3px solid #4f7ea9}.nav{border:2px solid #8ca9c3;border-radius:14px;background:#fff;color:#35546f;font-weight:1000}.nav.active{background:#408ed2;color:#fff;border-color:#246cae}@media(max-width:430px){.starter img{width:58px;height:58px}.starter{font-size:13px}.map{height:230px}.battleField{height:285px}.monster{width:94px;height:94px}.enemyMon{right:35px}.myMon{left:32px}.enemyBox,.myBox{width:160px}.title{font-size:24px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><a href="/">← 대문</a><strong>몬스터 어드벤처</strong><span class="money" id="orbCount">포획볼 5</span></header>
<main class="screen">
<section id="startView" class="card">
<h1 class="title">첫 몬스터를 골라!</h1><p class="sub">함께 모험할 파트너를 선택하세요.</p>
<div class="starterGrid">
<button class="starter" data-starter="flamefox"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f98a.svg" alt="불꽃여우">불꽃여우<small>불꽃 타입 · 공격형</small></button>
<button class="starter" data-starter="leafturtle"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f422.svg" alt="새싹거북">새싹거북<small>풀 타입 · 체력형</small></button>
<button class="starter" data-starter="waterotter"><img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f9a6.svg" alt="물방울수달">물방울수달<small>물 타입 · 균형형</small></button>
</div></section>
<section id="worldView" class="world hidden">
<div class="card playerPanel"><div class="avatar">🧢</div><div class="playerInfo"><b>신입 트레이너</b><div class="stats"><span id="dexStat">도감 1/8</span><span id="winStat">승리 0</span></div><div class="bar xpbar"><i id="trainerXp" style="width:0%"></i></div></div></div>
<div class="map"><div class="cloud c1"></div><div class="cloud c2"></div><div class="hill h1"></div><div class="hill h2"></div><div class="path"></div><button class="spot spot1" data-zone="meadow">🌿 초록들판</button><button class="spot spot2" data-zone="cave">🌙 달빛동굴</button><button class="spot spot3" data-zone="peak">🔥 붉은산</button></div>
<div class="guide" id="guide">지역을 누르면 야생 몬스터와 전투합니다.</div>
<div class="card"><b>내 몬스터</b><div class="party" id="party"></div></div>
</section>
<section id="battleView" class="hidden">
<div class="battleField">
<div class="platform enemyPlat"></div><div class="platform myPlat"></div>
<div class="enemyBox"><div class="boxTop"><span id="enemyName">야생 몬스터</span><span id="enemyLv">Lv.1</span></div><div class="bar"><i id="enemyHpBar"></i></div><div class="hpText" id="enemyHpText"></div></div>
<img id="enemyImg" class="monster enemyMon" alt="야생 몬스터">
<img id="myImg" class="monster myMon" alt="내 몬스터">
<div class="myBox"><div class="boxTop"><span id="myName"></span><span id="myLv"></span></div><div class="bar"><i id="myHpBar"></i></div><div class="hpText" id="myHpText"></div></div>
</div>
<div class="battleText" id="battleText">야생 몬스터가 나타났다!</div>
<div class="actions"><button class="action attack" id="attackBtn">기본 공격</button><button class="action skill" id="skillBtn">특수 기술</button><button class="action capture" id="captureBtn">포획볼</button><button class="action heal" id="healBtn">회복약 ×3</button></div>
</section>
<section id="dexView" class="card hidden"><h1 class="title">몬스터 도감</h1><p class="sub" id="dexText">발견한 몬스터가 기록됩니다.</p><div class="dexGrid" id="dexGrid"></div></section>
</main>
<nav class="bottom" id="bottomNav"><button class="nav active" data-view="world">🗺️ 모험</button><button class="nav" data-view="dex">📖 도감</button><button class="nav" id="resetBtn">↻ 새로 시작</button></nav>
<div id="result" class="result hidden"><div class="resultBox"><h2 id="resultTitle">승리!</h2><p id="resultText"></p><button class="bigBtn" id="resultBtn">계속하기</button></div></div>
</div>
<script>
const A='https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/';
const species={
 flamefox:{name:'불꽃여우',type:'불꽃',img:A+'1f98a.svg',baseHp:52,atk:15,skill:'불꽃꼬리'},
 leafturtle:{name:'새싹거북',type:'풀',img:A+'1f422.svg',baseHp:66,atk:11,skill:'덩굴박치기'},
 waterotter:{name:'물방울수달',type:'물',img:A+'1f9a6.svg',baseHp:58,atk:13,skill:'물결타'},
 boar:{name:'풀숲멧돼지',type:'땅',img:A+'1f417.svg',baseHp:48,atk:10,skill:'돌진'},
 bat:{name:'밤날개',type:'어둠',img:A+'1f987.svg',baseHp:42,atk:12,skill:'초음파'},
 bird:{name:'바람새',type:'바람',img:A+'1f426.svg',baseHp:40,atk:13,skill:'회오리'},
 wolf:{name:'서리늑대',type:'얼음',img:A+'1f43a.svg',baseHp:62,atk:16,skill:'서리이빨'},
 dragon:{name:'화산용',type:'불꽃',img:A+'1f409.svg',baseHp:88,atk:20,skill:'용암숨결'}
};
const zones={meadow:{label:'초록들판',pool:['boar','bird','bat'],min:1,max:3},cave:{label:'달빛동굴',pool:['bat','wolf','boar'],min:3,max:5},peak:{label:'붉은산',pool:['wolf','dragon','bird'],min:5,max:8}};
const key='jaewoon-monster-adventure-v1';let save={starter:null,party:[],dex:[],wins:0,balls:5,potions:3};let battle=null;let locked=false;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function load(){try{const v=JSON.parse(localStorage.getItem(key)||'null');if(v&&v.party)save={...save,...v}}catch(e){} if(save.starter){$('#startView').classList.add('hidden');showWorld()}else{$('#bottomNav').classList.add('hidden')}renderAll()}
function persist(){localStorage.setItem(key,JSON.stringify(save))}
function makeMon(id,lv=1){const s=species[id];const maxHp=s.baseHp+(lv-1)*8;return{id,lv,xp:0,maxHp,hp:maxHp}}
function chooseStarter(id){save.starter=id;save.party=[makeMon(id,1)];save.dex=[id];save.balls=5;save.potions=3;persist();$('#startView').classList.add('hidden');$('#bottomNav').classList.remove('hidden');showWorld();renderAll()}
$$('.starter').forEach(b=>b.onclick=()=>chooseStarter(b.dataset.starter));
function activeMon(){return save.party[0]}
function renderAll(){renderParty();renderDex();$('#orbCount').textContent=`포획볼 ${save.balls}`;$('#dexStat').textContent=`도감 ${save.dex.length}/${Object.keys(species).length}`;$('#winStat').textContent=`승리 ${save.wins}`;$('#trainerXp').style.width=`${Math.min(100,(save.wins%5)*20)}%`;$('#healBtn').textContent=`회복약 ×${save.potions}`}
function renderParty(){const el=$('#party');if(!el)return;el.innerHTML=save.party.map((m,i)=>`<div class="chip"><img src="${species[m.id].img}" alt=""><b>${species[m.id].name}</b><small> Lv.${m.lv}</small>${i===0?'<div style="font-size:10px;color:#2a78bd;font-weight:900">전투중</div>':''}</div>`).join('')}
function renderDex(){const el=$('#dexGrid');if(!el)return;el.innerHTML=Object.entries(species).map(([id,s])=>{const got=save.dex.includes(id);return `<div class="dexItem ${got?'':'locked'}"><img src="${s.img}" alt=""><div><b>${got?s.name:'???'}</b><small>${got?s.type+' 타입':'미발견'}</small></div></div>`}).join('');$('#dexText').textContent=`발견 ${save.dex.length} / ${Object.keys(species).length}`}
function showWorld(){$('#worldView').classList.remove('hidden');$('#battleView').classList.add('hidden');$('#dexView').classList.add('hidden');$('#bottomNav').classList.remove('hidden');$$('.nav[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view==='world'))}
function showDex(){if(!save.starter)return;$('#worldView').classList.add('hidden');$('#battleView').classList.add('hidden');$('#dexView').classList.remove('hidden');$$('.nav[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view==='dex'));renderDex()}
$$('.nav[data-view]').forEach(b=>b.onclick=()=>b.dataset.view==='dex'?showDex():showWorld());
$$('.spot').forEach(b=>b.onclick=()=>startBattle(b.dataset.zone));
function startBattle(zoneId){const z=zones[zoneId],id=z.pool[Math.floor(Math.random()*z.pool.length)],lv=z.min+Math.floor(Math.random()*(z.max-z.min+1));const enemy=makeMon(id,lv),mine=activeMon();mine.hp=mine.maxHp;battle={zoneId,enemy};locked=false;$('#worldView').classList.add('hidden');$('#dexView').classList.add('hidden');$('#battleView').classList.remove('hidden');$('#bottomNav').classList.add('hidden');$('#battleText').textContent=`${z.label}에서 야생 ${species[id].name}이 나타났다!`;renderBattle()}
function renderBattle(){if(!battle)return;const e=battle.enemy,m=activeMon(),es=species[e.id],ms=species[m.id];$('#enemyName').textContent=es.name;$('#enemyLv').textContent=`Lv.${e.lv}`;$('#enemyImg').src=es.img;$('#enemyHpBar').style.width=`${Math.max(0,e.hp/e.maxHp*100)}%`;$('#enemyHpText').textContent=`${Math.max(0,e.hp)} / ${e.maxHp}`;$('#myName').textContent=ms.name;$('#myLv').textContent=`Lv.${m.lv}`;$('#myImg').src=ms.img;$('#myHpBar').style.width=`${Math.max(0,m.hp/m.maxHp*100)}%`;$('#myHpText').textContent=`${Math.max(0,m.hp)} / ${m.maxHp}`;$('#orbCount').textContent=`포획볼 ${save.balls}`;$('#captureBtn').textContent=`포획볼 ×${save.balls}`;$('#healBtn').textContent=`회복약 ×${save.potions}`;$('#captureBtn').disabled=save.balls<=0;$('#healBtn').disabled=save.potions<=0||m.hp>=m.maxHp}
function damageFor(m,special=false){const s=species[m.id];return Math.max(4,Math.floor(s.atk+m.lv*1.6+(special?7:0)+Math.random()*5))}
async function playerAttack(special){if(locked||!battle)return;locked=true;const m=activeMon(),e=battle.enemy;const dmg=damageFor(m,special);$('#battleText').textContent=`${species[m.id].name}의 ${special?species[m.id].skill:'공격'}! ${dmg} 피해!`;e.hp-=dmg;$('#myImg').style.transform='scaleX(-1) translateX(-14px)';setTimeout(()=>$('#myImg').style.transform='scaleX(-1)',150);renderBattle();await wait(650);if(e.hp<=0){winBattle();return}enemyTurn()}
function enemyTurn(){const e=battle.enemy,m=activeMon(),dmg=damageFor(e,Math.random()<.28);m.hp-=dmg;$('#battleText').textContent=`야생 ${species[e.id].name}의 반격! ${dmg} 피해!`;$('#enemyImg').style.transform='translateX(-14px)';setTimeout(()=>$('#enemyImg').style.transform='',150);renderBattle();setTimeout(()=>{if(m.hp<=0)loseBattle();else locked=false},650)}
function attemptCapture(){if(locked||!battle||save.balls<=0)return;locked=true;save.balls--;const e=battle.enemy;const hpRate=e.hp/e.maxHp;const chance=Math.min(.85,.2+(1-hpRate)*.62+(e.lv<=3?.12:0));$('#battleText').textContent='포획볼을 던졌다...';renderBattle();setTimeout(()=>{if(Math.random()<chance){if(!save.dex.includes(e.id))save.dex.push(e.id);if(save.party.length<6&&!save.party.some(m=>m.id===e.id))save.party.push({...e,hp:e.maxHp});save.wins++;persist();showResult('포획 성공!',`${species[e.id].name}을(를) 동료로 만들었다!`)}else{$('#battleText').textContent='아깝다! 몬스터가 포획볼에서 빠져나왔다!';persist();renderBattle();setTimeout(enemyTurn,600)}},850)}
function heal(){if(locked||!battle||save.potions<=0)return;const m=activeMon();if(m.hp>=m.maxHp)return;locked=true;save.potions--;const amount=Math.floor(m.maxHp*.45);m.hp=Math.min(m.maxHp,m.hp+amount);$('#battleText').textContent=`회복약 사용! 체력을 ${amount} 회복했다.`;persist();renderBattle();setTimeout(enemyTurn,650)}
function winBattle(){const m=activeMon(),e=battle.enemy;save.wins++;if(!save.dex.includes(e.id))save.dex.push(e.id);m.xp+=10+e.lv*4;let leveled=false;const need=m.lv*22;if(m.xp>=need){m.xp-=need;m.lv++;m.maxHp=species[m.id].baseHp+(m.lv-1)*8;m.hp=m.maxHp;leveled=true}if(save.wins%3===0)save.balls++;if(save.wins%4===0)save.potions++;persist();showResult('전투 승리!',`${species[e.id].name}을 쓰러뜨렸다!${leveled?` ${species[m.id].name} Lv.${m.lv} 달성!`:''}`)}
function loseBattle(){const m=activeMon();m.hp=m.maxHp;persist();showResult('전투 패배',`마을에서 ${species[m.id].name}의 체력을 회복했다.`)}
function showResult(title,text){locked=true;$('#resultTitle').textContent=title;$('#resultText').textContent=text;$('#result').classList.remove('hidden');renderAll()}
$('#resultBtn').onclick=()=>{$('#result').classList.add('hidden');battle=null;showWorld();renderAll()};
$('#attackBtn').onclick=()=>playerAttack(false);$('#skillBtn').onclick=()=>playerAttack(true);$('#captureBtn').onclick=attemptCapture;$('#healBtn').onclick=heal;
$('#resetBtn').onclick=()=>{if(confirm('저장한 몬스터와 진행을 모두 지울까요?')){localStorage.removeItem(key);location.reload()}};
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
load();
</script>
</body>
</html>
