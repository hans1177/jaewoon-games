<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>대충 용사 RPG</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0c1016;color:#fff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;touch-action:none}
canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;left:10px;top:10px;z-index:4;font-weight:900;text-shadow:0 2px 4px #000;pointer-events:none}
.row{display:flex;gap:6px;flex-wrap:wrap}.pill,#quest,#area{background:#0a0e16dd;border:1px solid #ffffff55;border-radius:9px;padding:6px 8px;font-size:12px}
#hpBox{width:190px;height:15px;background:#2b0a0d;border:2px solid #ffffff88;border-radius:7px;overflow:hidden;margin-top:6px}#hp{height:100%;background:linear-gradient(90deg,#e8364f,#ff725f)}
#xpBox{width:190px;height:9px;background:#071b2b;border:1px solid #ffffff66;border-radius:5px;overflow:hidden;margin-top:3px}#xp{height:100%;background:linear-gradient(90deg,#2ca9ff,#68dcff)}
#quest,#area{margin-top:5px;max-width:340px}
#joy{position:fixed;left:18px;bottom:20px;width:126px;height:126px;border-radius:50%;border:2px solid #ffffff55;background:#0006;z-index:5}
#knob{position:absolute;left:34px;top:34px;width:56px;height:56px;border-radius:50%;background:#ffffff66;border:2px solid #ffffff99}
.btn{position:fixed;border:2px solid #ffffff99;border-radius:50%;color:#fff;font-weight:900;z-index:5;text-shadow:0 2px 3px #000;box-shadow:0 5px 15px #0008}
#attack{right:20px;bottom:28px;width:92px;height:92px;background:#c73434e8;font-size:18px}
#talk{right:112px;bottom:106px;width:67px;height:67px;background:#d28b22e8}
#bagBtn{right:18px;top:18px;width:58px;height:58px;background:#405d9de8}
#actionBtn{right:112px;bottom:28px;width:90px;height:60px;border-radius:18px;background:#5d7bd9e8;display:none}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:#000d;z-index:10}
.panel{width:min(92vw,430px);max-height:84vh;overflow:auto;background:#211c18;border:3px solid #e2b56d;border-radius:14px;padding:15px}
.main{width:100%;padding:13px;border:0;border-radius:10px;background:#e8ad42;color:#1d1205;font-size:17px;font-weight:900;margin-top:8px}.dark{background:#394359;color:#fff}
.slot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 2px;border-bottom:1px solid #fff2}.slot button{border:0;border-radius:8px;padding:8px 10px;font-weight:900;background:#e8ad42;color:#1d1205}.slot button:disabled{opacity:.45}.small{font-size:12px;opacity:.72}
#start{display:flex}#speech{position:fixed;left:50%;bottom:160px;transform:translateX(-50%);width:min(92vw,500px);background:#17120ef3;border:3px solid #e1b46c;border-radius:12px;z-index:9;padding:12px;display:none}
#speech b{color:#ffd26c}#toast{position:fixed;left:50%;top:25%;transform:translateX(-50%);background:#111f;border:1px solid #fff8;padding:9px 12px;border-radius:9px;z-index:20;font-weight:900;opacity:0;pointer-events:none;white-space:nowrap;max-width:92vw}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
 <div class="row"><span class="pill" id="lv">Lv.1</span><span class="pill" id="gold">0 G</span><span class="pill" id="atk">공격 3</span><span class="pill" id="weaponText">맨손</span><span class="pill" id="xpText">EXP 0/100</span></div>
 <div id="hpBox"><div id="hp"></div></div><div id="xpBox"><div id="xp"></div></div>
 <div id="quest">퀘스트: 촌장에게 말을 걸어라.</div><div id="area">현재 지역: 마을</div>
</div>
<div id="joy"><div id="knob"></div></div>
<button id="attack" class="btn">공격</button><button id="talk" class="btn">대화</button><button id="bagBtn" class="btn">가방</button><button id="actionBtn" class="btn"></button>
<div id="speech"></div><div id="toast"></div>
<div id="start" class="overlay"><div class="panel" style="text-align:center"><h1>⚔️ 대충 용사 RPG</h1><p>6개의 포탈과 동굴 던전을 탐험해라.</p><button id="startBtn" class="main">게임 시작</button></div></div>
<div id="bag" class="overlay"><div class="panel"><h2>가방</h2><div id="bagList"></div><button id="closeBag" class="main dark">닫기</button></div></div>
<div id="weaponShop" class="overlay"><div class="panel"><h2>무기상인</h2><div id="weaponList"></div><button id="closeWeapon" class="main dark">닫기</button></div></div>
<div id="sellShop" class="overlay"><div class="panel"><h2>판매상인</h2><div id="sellList"></div><button id="sellAll" class="main">전부 판매</button><button id="closeSell" class="main dark">닫기</button></div></div>
<div id="dead" class="overlay"><div class="panel" style="text-align:center"><h2>쓰러졌다</h2><p id="deadCost"></p><button id="respawn" class="main">마을에서 부활</button></div></div>
<script>
// 파일명: rpg.html
// 외부 이미지 0개. 모든 그래픽은 게임 내부 로컬 스프라이트 렌더러로 생성.

const c=document.getElementById('game'),ctx=c.getContext('2d');
let W=innerWidth,H=innerHeight,D=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0);ctx.imageSmoothingEnabled=false}
addEventListener('resize',resize);resize();

const WORLD={w:1800,h:1200},ANIM_FRAMES=34;
const BASE_SLIME={hp:30,atk:4,spd:40,r:15,xp:6,gold:3};
const F={
 f1:{n:'1번 사냥터',l:'Lv.1',bg:'#5ca44f',m:[['초록 슬라임',1,30,4,40,15,6,3,13,'slime']]},
 f2:{n:'2번 사냥터',l:'Lv.2~3',bg:'#4d9b54',m:[['파란 슬라임',2,56,6,44,16,9,5,8,'blue'],['들멧돼지',3,88,9,55,19,13,7,6,'boar']]},
 f3:{n:'3번 사냥터',l:'Lv.4',bg:'#6f9648',m:[['회색 늑대',4,136,12,68,18,18,10,13,'wolf']]},
 f4:{n:'4번 사냥터',l:'Lv.5~6',bg:'#8a6d40',m:[['오크',5,200,15,48,21,24,14,8,'orc'],['붉은 늑대',6,270,19,73,19,31,18,6,'redwolf']]},
 f5:{n:'5번 사냥터',l:'Lv.7 이상',bg:'#51475f',m:[['균열 기사',7,380,24,56,22,42,25,7,'knight'],['균열 악마',8,500,30,61,23,55,32,5,'demon']]},
 f6:{n:'6번 사냥터',l:'Lv.8~10',bg:'#483a3e',m:[['해골 전사',8,650,32,58,21,65,38,5,'skeleton'],['고블린 정예',9,850,38,65,22,80,48,5,'eliteGoblin'],['오우거',10,1100,45,50,28,100,60,4,'ogre']]}
};
const P=[['f1',760,410,'1번 포탈','Lv.1'],['f2',950,410,'2번 포탈','Lv.2~3'],['f3',1140,410,'3번 포탈','Lv.4'],['f4',760,610,'4번 포탈','Lv.5~6'],['f5',950,610,'5번 포탈','Lv.7 이상'],['f6',1140,610,'6번 포탈','Lv.8~10']];
const WEAPONS={'낡은 돌검':{price:100,damage:5},'철 도끼':{price:500,damage:12},'철 쌍검':{price:700,damage:20}};
const SELL_PRICE={'슬라임 젤리':5,'멧돼지 고기':12,'늑대 가죽':20,'오크 이빨':28,'균열 조각':45,'수상한 당근':25};
const CAVE={
 entrance:{x:1660,y:1040},chest:{x:1490,y:600},exit:{x:1690,y:600},
 caveSlime:{n:'동굴 슬라임',lv:4,hp:150,atk:8,spd:44,r:18,xp:25,g:14,type:'caveSlime'},
 archer:{n:'궁수 고블린',lv:4,hp:150,atk:10,spd:46,r:18,xp:30,g:18,type:'archer'},
 giant:{n:'거대 동굴슬라임',lv:5,hp:300,atk:16,spd:38,r:34,xp:80,g:45,type:'giantCaveSlime'}
};

let run=false,last=0,cam={x:0,y:0},keys={},j={x:0,y:0},ac=0,pc=0,flash=0,zone='town';
let p,mons=[],drops=[],fx=[],arrows=[],q=0,chestOpened=false,guardianDead=false;
const inv={'슬라임 젤리':0,'멧돼지 고기':0,'늑대 가죽':0,'오크 이빨':0,'균열 조각':0,'수상한 당근':0};
const ownedWeapons={'낡은 돌검':false,'철 도끼':false,'철 쌍검':false};
const npcs=[{x:520,y:610,n:'촌장',k:'chief'},{x:690,y:670,n:'대장장이',k:'smith'},{x:405,y:805,n:'무기상인',k:'weapon'},{x:610,y:830,n:'판매상인',k:'seller'}];

function reset(){
 p={x:560,y:730,r:17,hp:100,mhp:100,lv:1,xp:0,nxp:100,g:0,atk:3,spd:185,dir:1,inv:0,weapon:'맨손',animState:'idle',animFrame:0,animTick:0};
 zone='town';mons=[];drops=[];fx=[];arrows=[];q=0;pc=0;chestOpened=false;guardianDead=false;window.sk=0;
 for(const k in inv)inv[k]=0;for(const k in ownedWeapons)ownedWeapons[k]=false;hud()
}
function hud(){
 lv.textContent=`Lv.${p.lv}`;gold.textContent=`${p.g} G`;atk.textContent=`공격 ${Math.floor(p.atk)}`;weaponText.textContent=p.weapon;xpText.textContent=`EXP ${Math.floor(p.xp)}/${p.nxp}`;
 hp.style.width=`${Math.max(0,p.hp/p.mhp*100)}%`;xp.style.width=`${Math.min(100,p.xp/p.nxp*100)}%`;
 if(q===0)quest.textContent='퀘스트: 촌장에게 말을 걸어라.';
 else if(q===1)quest.textContent=`퀘스트: 슬라임 5마리 처치 (${Math.min(5,window.sk||0)}/5)`;
 else if(q===2)quest.textContent='완료: 촌장에게 돌아가 보상 50G 받기';
 else if(q===3)quest.textContent='퀘스트: 슬라임 왕을 처치하라.';
 else if(q===4)quest.textContent='완료: 촌장에게 돌아가 보상 50G 받기';
 else if(q===5)quest.textContent='퀘스트: 2번 포탈로 들어가라.';
 else if(q===6)quest.textContent='완료: 촌장에게 돌아가 보상 50G 받기';
 else quest.textContent='현재 메인 퀘스트 완료';
 area.textContent=zone==='town'?'현재 지역: 마을':zone==='cave'?'현재 지역: 동굴 던전':`현재 지역: ${F[zone].n} · ${F[zone].l}`
}
function toastMsg(s){toast.textContent=s;toast.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>toast.style.opacity=0,1300)}
function say(n,s){speech.innerHTML=`<b>${n}</b><br>${s}<br><small>화면을 누르면 닫기</small>`;speech.style.display='block'}
speech.onpointerdown=()=>speech.style.display='none';

function enter(z){
 zone=z;mons=[];drops=[];fx=[];arrows=[];pc=1;
 if(z==='town'){p.x=560;p.y=700;toastMsg('마을 · 촌장 옆으로 돌아왔다')}
 else if(z==='cave'){p.x=160;p.y=600;spawnCave();toastMsg('동굴 던전 입장')}
 else{p.x=185;p.y=600;spawnAll(z);toastMsg(`${F[z].n} 입장`);if(z==='f2'&&q===5){q=6;toastMsg('목표 완료! 촌장에게 가서 보상받기')}}
 hud()
}
function spawnAll(z){for(const s of F[z].m)for(let i=0;i<s[8];i++)spawn(s,480+Math.random()*1200,120+Math.random()*960,z)}
function spawn(s,px,py,z){
 let [name,lvv,hpv,av,spd,r,xpv,gv,,type]=s,baseType=type;
 if((type==='slime'||type==='blue')&&Math.random()<.10){name='슬라임 왕';hpv=600;av=10;spd=34;r=30;xpv=70;gv=45;type='slimeKing'}
 if(z==='f5'&&p.lv>=9){let e=p.lv-8;hpv=Math.floor(hpv*(1+e*.12));av=Math.floor(av*(1+e*.08));lvv+=Math.floor(e/2);xpv=Math.floor(xpv*(1+e*.1));gv=Math.floor(gv*(1+e*.08))}
 mons.push({n:name,lv:lvv,x:px,y:py,hp:hpv,mhp:hpv,a:av,spd,r,xp:xpv,g:gv,type,baseType,z,hit:0,dead:false,shootCd:1+Math.random()*1.5,animState:'walk',animFrame:0,animTick:Math.random()*34,deathAge:0,dir:1})
}
function spawnCave(){
 for(let i=0;i<9;i++)spawnCaveMonster(CAVE.caveSlime,360+Math.random()*900,140+Math.random()*920);
 for(let i=0;i<5;i++)spawnCaveMonster(CAVE.archer,500+Math.random()*760,140+Math.random()*920);
 spawnCaveMonster(CAVE.giant,CAVE.chest.x-120,CAVE.chest.y)
}
function spawnCaveMonster(s,px,py){mons.push({n:s.n,lv:s.lv,x:px,y:py,hp:s.hp,mhp:s.hp,a:s.atk,spd:s.spd,r:s.r,xp:s.xp,g:s.g,type:s.type,baseType:s.type,z:'cave',hit:0,dead:false,shootCd:1+Math.random()*1.5,animState:'walk',animFrame:0,animTick:Math.random()*34,deathAge:0,dir:1})}

function nearest(){if(zone!=='town')return null;let b=null,d=80;for(const n of npcs){const v=Math.hypot(n.x-p.x,n.y-p.y);if(v<d){d=v;b=n}}return b}
function talkNow(){
 const n=nearest();if(!n){toastMsg(zone==='town'?'근처에 대화할 사람이 없다':'여기서는 대화할 사람이 없다');return}
 if(n.k==='chief'){
  if(q===0){q=1;window.sk=0;say('촌장','1번 포탈에서 슬라임 5마리를 잡아라. 완료하면 내게 돌아와 보상을 받아라.')}
  else if(q===1)say('촌장',`슬라임 ${5-Math.min(5,window.sk||0)}마리 남았다.`);
  else if(q===2){p.g+=50;q=3;say('촌장','보상 <b>50골드</b>. 다음 퀘스트는 <b>슬라임 왕 처치</b>.')}
  else if(q===3)say('촌장','슬라임 왕은 슬라임 스폰 때 10% 확률로 나타난다.');
  else if(q===4){p.g+=50;q=5;say('촌장','보상 <b>50골드</b>. 다음 퀘스트는 <b>2번 포탈 입장</b>.')}
  else if(q===5)say('촌장','2번 포탈로 들어가라.');
  else if(q===6){p.g+=50;q=7;say('촌장','보상 <b>50골드</b>. 2번 사냥터 구석의 동굴도 찾아봐라.')}
  else say('촌장','6번 포탈은 Lv.8~10 권장이다.')
 }else if(n.k==='smith'){
  if(p.g>=25){p.g-=25;p.atk+=2;say('대장장이','25골드. 현재 공격력 +2.')}else say('대장장이','강화는 25골드다.')
 }else if(n.k==='weapon')openWeaponShop();else if(n.k==='seller')openSellShop();
 hud()
}
function openWeaponShop(){speech.style.display='none';renderWeaponShop();weaponShop.style.display='flex'}
function renderWeaponShop(){weaponList.innerHTML=Object.entries(WEAPONS).map(([name,w])=>{const owned=ownedWeapons[name],equipped=p.weapon===name,label=equipped?'장착중':owned?'장착':`${w.price}G 구매`;return `<div class="slot"><span><b>${name}</b><br><span class="small">데미지 ${w.damage}</span></span><button data-weapon="${name}" ${equipped?'disabled':''}>${label}</button></div>`}).join('');weaponList.querySelectorAll('button[data-weapon]').forEach(b=>b.onclick=()=>buyOrEquipWeapon(b.dataset.weapon))}
function buyOrEquipWeapon(name){const w=WEAPONS[name];if(!ownedWeapons[name]){if(p.g<w.price){toastMsg('골드가 부족하다');return}p.g-=w.price;ownedWeapons[name]=true}p.weapon=name;p.atk=Math.max(p.atk,w.damage);toastMsg(`${name} 장착 · 공격 ${Math.floor(p.atk)}`);renderWeaponShop();hud()}
function openSellShop(){speech.style.display='none';renderSellShop();sellShop.style.display='flex'}
function renderSellShop(){sellList.innerHTML=Object.entries(SELL_PRICE).map(([name,price])=>`<div class="slot"><span>${name}<br><span class="small">${price}G / 개</span></span><span>×${inv[name]||0} <button data-sell="${name}" ${(inv[name]||0)<=0?'disabled':''}>판매</button></span></div>`).join('');sellList.querySelectorAll('button[data-sell]').forEach(b=>b.onclick=()=>sellItem(b.dataset.sell))}
function sellItem(name){if((inv[name]||0)<=0)return;inv[name]--;p.g+=SELL_PRICE[name];toastMsg(`${name} 판매 +${SELL_PRICE[name]}G`);renderSellShop();hud()}
function sellEverything(){let total=0;for(const [name,price] of Object.entries(SELL_PRICE)){const count=inv[name]||0;total+=count*price;inv[name]=0}if(total<=0){toastMsg('판매할 아이템이 없다');return}p.g+=total;toastMsg(`전부 판매 +${total}G`);renderSellShop();hud()}

function getAction(){
 if(zone==='f2'&&Math.hypot(p.x-CAVE.entrance.x,p.y-CAVE.entrance.y)<85)return {label:'들어가기',kind:'enterCave'};
 if(zone==='cave'&&!chestOpened&&Math.hypot(p.x-CAVE.chest.x,p.y-CAVE.chest.y)<85)return {label:guardianDead?'상자 열기':'상자 잠김',kind:'chest'};
 if(zone==='cave'&&Math.hypot(p.x-CAVE.exit.x,p.y-CAVE.exit.y)<85)return {label:'나가기',kind:'exitCave'};
 return null
}
function updateActionButton(){const a=getAction();actionBtn.style.display=a?'block':'none';if(a)actionBtn.textContent=a.label}
function useAction(){const a=getAction();if(!a)return;if(a.kind==='enterCave')enter('cave');else if(a.kind==='exitCave')enter('town');else if(a.kind==='chest'){if(!guardianDead){toastMsg('거대 동굴슬라임을 먼저 잡아야 한다');return}chestOpened=true;p.g+=250;hud();toastMsg('보물상자 +250골드!');}}

function attackNow(){
 if(!run||ac>0)return;ac=.35;p.animState='attack';p.animTick=0;p.animFrame=0;
 const ax=p.x+p.dir*30;fx.push({x:ax,y:p.y,t:.18,d:p.dir});
 for(const m of mons){if(m.dead)continue;if(Math.hypot(m.x-ax,m.y-p.y)<62+m.r){m.hp-=p.atk;m.hit=.12;m.x+=p.dir*13;if(m.hp<=0)kill(m)}}
}
function kill(m){
 m.dead=true;m.animState='dead';m.animTick=0;m.animFrame=0;m.deathAge=0;
 p.xp+=m.xp;p.g+=m.g;
 let item=null;if(['slime','blue','slimeKing','caveSlime','giantCaveSlime'].includes(m.type))item='슬라임 젤리';else if(m.type==='boar')item='멧돼지 고기';else if(['wolf','redwolf'].includes(m.type))item='늑대 가죽';else if(m.type==='orc')item='오크 이빨';else item='균열 조각';
 if(item)drops.push({x:m.x,y:m.y,item,t:12});
 if(zone==='f1'&&q===1&&m.type==='slime'){window.sk=(window.sk||0)+1;if(window.sk>=5){q=2;toastMsg('완료! 촌장에게 돌아가 보상받기')}}
 else if(zone==='f1'&&q===3&&m.type==='slimeKing'){q=4;toastMsg('완료! 촌장에게 돌아가 보상받기')}
 if(m.type==='giantCaveSlime'){guardianDead=true;toastMsg('거대 동굴슬라임 처치! 보물상자가 열렸다')}

startBtn.onclick=()=>{start.style.display='none';reset();run=true;last=performance.now()};respawn.onclick=()=>{dead.style.display='none';p.hp=p.mhp;p.inv=1;run=true;enter('town');last=performance.now()};
reset();requestAnimationFrame(loop);
</script>
