<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#07141d"><title>코어 워즈 | 재운게임즈</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07141d;color:#fff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}body{user-select:none}.game{position:fixed;inset:0;background:radial-gradient(circle at 50% 28%,#163544 0,#08151d 48%,#040a0f 100%)}canvas{position:absolute;inset:0;width:100%;height:100%}.top{position:absolute;z-index:5;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:calc(7px + env(safe-area-inset-top)) 9px 7px;background:linear-gradient(#061019f2,#07141dc0 72%,transparent);pointer-events:none}.back{pointer-events:auto;text-decoration:none;color:#fff;background:#112b3b;border:1px solid #31546a;border-radius:10px;padding:7px 10px;font-weight:900;font-size:12px}.brand{font-weight:1000}.resource{margin-left:auto;display:flex;gap:7px}.pill{min-width:72px;padding:6px 9px;border-radius:10px;background:#0c2130dd;border:1px solid #315166;font-weight:900;font-size:12px;text-align:center}.status{position:absolute;z-index:5;left:10px;top:calc(53px + env(safe-area-inset-top));padding:6px 9px;border-radius:10px;background:#07141dd9;border:1px solid #2b4859;font-size:11px;font-weight:800;pointer-events:none}.bottom{position:absolute;z-index:6;left:0;right:0;bottom:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#061018e8 24%,#061018f7);display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.unitBtn{min-height:58px;border:1px solid #35566a;border-radius:12px;background:linear-gradient(#17384b,#0c2534);color:#fff;font-weight:1000;font-size:12px}.unitBtn small{display:block;margin-top:3px;color:#8ddfff;font-size:10px}.unitBtn:active{transform:scale(.96)}.unitBtn.locked{opacity:.5}.hint{position:absolute;z-index:5;left:50%;bottom:82px;transform:translateX(-50%);padding:7px 10px;border-radius:999px;background:#06131ddc;border:1px solid #2a4b5e;font-size:10px;font-weight:800;white-space:nowrap;pointer-events:none}.select{position:absolute;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(circle at 50% 15%,#1a5268 0,#0a1c28 45%,#040b10 100%)}.panel{width:min(760px,100%);padding:22px;border:1px solid #3c6379;border-radius:24px;background:#081923e8;box-shadow:0 22px 80px #0008}.logo{font-size:clamp(33px,8vw,64px);font-weight:1000;letter-spacing:-3px;text-align:center}.sub{text-align:center;color:#8fdcf4;margin:4px 0 18px;font-size:13px;font-weight:800}.factions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.faction{position:relative;min-height:180px;padding:14px;border:1px solid #45677b;border-radius:18px;background:linear-gradient(160deg,#173443,#0b1e29);color:#fff;text-align:left;overflow:hidden}.faction b{display:block;font-size:20px}.faction span{display:block;margin-top:7px;color:#c2d7e2;font-size:11px;line-height:1.55}.faction em{position:absolute;right:10px;bottom:4px;font-style:normal;font-size:60px;opacity:.2}.human{box-shadow:inset 0 -4px 0 #39a7ff}.swarm{box-shadow:inset 0 -4px 0 #67db64}.machine{box-shadow:inset 0 -4px 0 #d46dff}.license{margin-top:13px;text-align:center;color:#7195a7;font-size:9px}.result{position:absolute;z-index:30;inset:0;display:none;align-items:center;justify-content:center;background:#02080dcf}.resultBox{min-width:min(88vw,380px);padding:28px;border:1px solid #476b7f;border-radius:22px;background:#081822;text-align:center}.resultBox h2{font-size:38px;margin:0 0 8px}.restart{margin-top:15px;padding:13px 22px;border:0;border-radius:12px;background:#2b9ee8;color:#fff;font-weight:1000;font-size:16px}@media(max-width:600px){.panel{padding:16px 12px}.factions{grid-template-columns:1fr}.faction{min-height:105px}.faction em{font-size:48px}.logo{font-size:38px}.bottom{gap:5px;padding-left:5px;padding-right:5px}.unitBtn{min-height:54px;padding:5px 2px;font-size:11px}.pill{min-width:62px;font-size:11px;padding:5px}.status{top:calc(48px + env(safe-area-inset-top))}}
</style></head><body>
<div class="game"><canvas id="c"></canvas>
<div class="top"><a class="back" href="/">← 대문</a><div class="brand">CORE WARS · 1 VS 1 VS 1</div><div class="resource"><div class="pill">광석 <span id="ore">0</span></div><div class="pill">병력 <span id="pop">0</span>/40</div></div></div>
<div class="status" id="status">종족 선택 대기</div><div class="hint">내 유닛 선택 → 땅 터치 이동 · 적 터치 공격</div>
<div class="bottom" id="bottom" style="display:none"><button class="unitBtn" data-unit="worker">일꾼<small>50 광석</small></button><button class="unitBtn" data-unit="soldier">전투병<small>90 광석</small></button><button class="unitBtn" data-unit="heavy">중장갑<small>160 광석</small></button><button class="unitBtn" data-unit="tank">돌격병기<small>260 광석</small></button></div>
<div class="select" id="select"><div class="panel"><div class="logo">CORE WARS</div><div class="sub">3종족 개인전 · 하나를 고르면 나머지 둘은 적</div><div class="factions"><button class="faction human" data-team="0"><b>인류 연합</b><span>균형형 · 안정적인 화력과 사거리<br>보병과 중장갑 조합</span><em>◆</em></button><button class="faction swarm" data-team="1"><b>곤충 군단</b><span>물량형 · 저렴하고 빠른 생산<br>수적 우세로 압박</span><em>✹</em></button><button class="faction machine" data-team="2"><b>기계 문명</b><span>정예형 · 높은 체력과 공격력<br>소수 정예 전투</span><em>⬢</em></button></div><div class="license">유닛 그래픽: Kenney RTS Pack: Sci-Fi · CC0 무료 에셋</div></div></div>
<div class="result" id="result"><div class="resultBox"><h2 id="resultTitle">승리</h2><div id="resultText"></div><button class="restart" onclick="location.reload()">다시 하기</button></div></div></div>
<script>
// rts.html · 게임 데이터
const canvas=document.querySelector('#c'),ctx=canvas.getContext('2d'),oreEl=document.querySelector('#ore'),popEl=document.querySelector('#pop'),statusEl=document.querySelector('#status'),selectEl=document.querySelector('#select'),bottomEl=document.querySelector('#bottom'),resultEl=document.querySelector('#result'),resultTitle=document.querySelector('#resultTitle'),resultText=document.querySelector('#resultText');
const W=1200,H=760,names=['인류 연합','곤충 군단','기계 문명'],colors=['#3db6ff','#5fe15d','#ce6cff'];
const urls=['https://raw.githubusercontent.com/ETdoFresh/kenney.nl/master/kenney_rtssci-fi/PNG/Default%20size/Unit/scifiUnit_01.png','https://raw.githubusercontent.com/ETdoFresh/kenney.nl/master/kenney_rtssci-fi/PNG/Default%20size/Unit/scifiUnit_05.png','https://raw.githubusercontent.com/ETdoFresh/kenney.nl/master/kenney_rtssci-fi/PNG/Default%20size/Unit/scifiUnit_09.png','https://raw.githubusercontent.com/ETdoFresh/kenney.nl/master/kenney_rtssci-fi/PNG/Default%20size/Unit/scifiUnit_13.png'];
const sprites=urls.map(src=>{const i=new Image();i.crossOrigin='anonymous';i.src=src;return i});
const baseType={worker:{name:'일꾼',cost:50,hp:80,dmg:4,range:42,speed:55,rate:1.15,size:17},soldier:{name:'전투병',cost:90,hp:125,dmg:14,range:82,speed:64,rate:.72,size:20},heavy:{name:'중장갑',cost:160,hp:235,dmg:28,range:96,speed:45,rate:1.05,size:25},tank:{name:'돌격병기',cost:260,hp:430,dmg:52,range:118,speed:34,rate:1.45,size:31}};
const mods=[{cost:1,hp:1,dmg:1,speed:1},{cost:.83,hp:.9,dmg:.95,speed:1.12},{cost:1.16,hp:1.22,dmg:1.18,speed:.92}];
let dpr=1,scale=1,ox=0,oy=0,started=false,player=0,last=performance.now(),selected=[],shots=[],particles=[],gameOver=false;
const bases=[{x:170,y:570},{x:1030,y:570},{x:600,y:150}].map((p,t)=>({team:t,x:p.x,y:p.y,hp:2400,maxHp:2400,r:62,alive:true}));
const teams=[0,1,2].map(t=>({team:t,ore:420,units:[],income:0,ai:1.2+Math.random()}));
const nodes=[{x:350,y:570},{x:850,y:570},{x:600,y:340},{x:410,y:300},{x:790,y:300},{x:600,y:600}];
function resize(){dpr=Math.min(2,devicePixelRatio||1);canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;const top=52,bottom=78,aw=innerWidth,ah=innerHeight-top-bottom;scale=Math.min(aw/W,ah/H);ox=(aw-W*scale)/2;oy=top+(ah-H*scale)/2}addEventListener('resize',resize);resize();
function world(x,y){return{x:(x-ox)/scale,y:(y-oy)/scale}}
function data(t,type){const b=baseType[type],m=mods[t];return{...b,cost:Math.round(b.cost*m.cost),hp:b.hp*m.hp,dmg:b.dmg*m.dmg,speed:b.speed*m.speed}}
function spawn(t,type,free=false){const tm=teams[t],b=bases[t],d=data(t,type);if(!b.alive||tm.units.filter(u=>!u.dead).length>=40||(!free&&tm.ore<d.cost))return false;if(!free)tm.ore-=d.cost;const a=Math.random()*Math.PI*2,r=78+Math.random()*25;tm.units.push({team:t,type,x:b.x+Math.cos(a)*r,y:b.y+Math.sin(a)*r,hp:d.hp,maxHp:d.hp,dmg:d.dmg,range:d.range,speed:d.speed,rate:d.rate,size:d.size,cool:Math.random(),tx:null,ty:null,target:null,selected:false,dead:false,flash:0});return true}
function start(t){player=t;started=true;selectEl.style.display='none';bottomEl.style.display='grid';teams.forEach((tm,i)=>{tm.ore=i===t?480:460;spawn(i,'worker',true);spawn(i,'worker',true);spawn(i,'worker',true);spawn(i,'soldier',true);spawn(i,'soldier',true)});statusEl.textContent='내 종족: '+names[t]+' · AI 둘도 서로 공격';hud()}
document.querySelectorAll('.faction').forEach(b=>b.onclick=()=>start(+b.dataset.team));document.querySelectorAll('.unitBtn').forEach(b=>b.onclick=()=>{if(gameOver)return;if(!spawn(player,b.dataset.unit))statusEl.textContent='광석 부족 또는 병력 한도';hud()});
function hud(){if(!started)return;oreEl.textContent=Math.floor(teams[player].ore);popEl.textContent=teams[player].units.filter(u=>!u.dead).length;document.querySelectorAll('.unitBtn').forEach(b=>{const d=data(player,b.dataset.unit);b.querySelector('small').textContent=d.cost+' 광석';b.classList.toggle('locked',teams[player].ore<d.cost)})}
function enemy(u,max=1e9){let best=null,bd=max;for(const tm of teams)if(tm.team!==u.team)for(const e of tm.units)if(!e.dead){const d=Math.hypot(e.x-u.x,e.y-u.y);if(d<bd){bd=d;best=e}}for(const b of bases)if(b.team!==u.team&&b.alive){const d=Math.hypot(b.x-u.x,b.y-u.y);if(d<bd){bd=d;best=b}}return best}
function shoot(u,t){u.cool=u.rate;const a=Math.atan2(t.y-u.y,t.x-u.x);shots.push({x:u.x,y:u.y,vx:Math.cos(a)*420,vy:Math.sin(a)*420,team:u.team,target:t,dmg:u.dmg,life:1.2});for(let i=0;i<3;i++)particles.push({x:u.x,y:u.y,vx:(Math.random()-.5)*60,vy:(Math.random()-.5)*60,life:.18,r:2+Math.random()*2,c:colors[u.team]})}
function boom(x,y,r=18){for(let i=0;i<18;i++){const a=Math.random()*6.283,s=30+Math.random()*140;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.3+Math.random()*.5,r:2+Math.random()*5,c:i%3?'#ff9b45':'#fff0a8'})}}
function hit(t,d){if(!t||t.dead||t.alive===false)return;t.hp-=d;t.flash=.09;if(t.hp<=0){t.hp=0;if(Object.prototype.hasOwnProperty.call(t,'alive')){t.alive=false;boom(t.x,t.y,35)}else{t.dead=true;boom(t.x,t.y)}}}
function aiStep(dt,t){const tm=teams[t],b=bases[t];if(!b.alive)return;tm.ai-=dt;if(tm.ai>0)return;tm.ai=1.05+Math.random()*1.2;const live=tm.units.filter(u=>!u.dead).length;if(live<8)spawn(t,Math.random()<.55?'soldier':'worker');else{const r=Math.random();spawn(t,r<.35?'soldier':r<.7?'heavy':'tank')}const army=tm.units.filter(u=>!u.dead&&u.type!=='worker');if(army.length>=4){const es=bases.filter(x=>x.team!==t&&x.alive).sort((a,b)=>a.hp-b.hp);if(es.length){const target=Math.random()<.72?es[0]:es[Math.floor(Math.random()*es.length)];army.forEach(u=>{if(!u.target&&Math.random()<.55){u.tx=target.x+(Math.random()-.5)*90;u.ty=target.y+(Math.random()-.5)*90}})}}}
function update(dt){if(!started||gameOver)return;for(const tm of teams){tm.income+=dt;if(tm.income>=1){tm.income-=1;tm.ore+=9+tm.units.filter(u=>!u.dead&&u.type==='worker').length*5}}aiStep(dt,(player+1)%3);aiStep(dt,(player+2)%3);for(const tm of teams)for(const u of tm.units){if(u.dead)continue;u.cool=Math.max(0,u.cool-dt);u.flash=Math.max(0,u.flash-dt);if(u.target&&(u.target.dead||u.target.alive===false||u.target.team===u.team))u.target=null;if(!u.target){const e=enemy(u,u.type==='worker'?80:145);if(e)u.target=e}if(u.target){const t=u.target,dist=Math.hypot(t.x-u.x,t.y-u.y),need=u.range+(t.r||t.size||15)*.35;if(dist<=need){if(u.cool<=0)shoot(u,t)}else{const a=Math.atan2(t.y-u.y,t.x-u.x);u.x+=Math.cos(a)*u.speed*dt;u.y+=Math.sin(a)*u.speed*dt}}else if(u.tx!==null){const dist=Math.hypot(u.tx-u.x,u.ty-u.y);if(dist<7){u.tx=u.ty=null}else{const a=Math.atan2(u.ty-u.y,u.tx-u.x);u.x+=Math.cos(a)*u.speed*dt;u.y+=Math.sin(a)*u.speed*dt}}u.x=Math.max(28,Math.min(W-28,u.x));u.y=Math.max(28,Math.min(H-28,u.y))}for(const s of shots){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;if(s.target&&!s.target.dead&&s.target.alive!==false&&Math.hypot(s.target.x-s.x,s.target.y-s.y)<22+(s.target.r||s.target.size||0)*.35){hit(s.target,s.dmg);s.life=0}}shots=shots.filter(s=>s.life>0);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy*=.97;p.life-=dt}particles=particles.filter(p=>p.life>0);teams.forEach(tm=>tm.units=tm.units.filter(u=>!u.dead));const alive=bases.filter(b=>b.alive);if(alive.length<=1){gameOver=true;resultEl.style.display='flex';const win=alive[0]&&alive[0].team===player;resultTitle.textContent=win?'승리!':'패배';resultText.textContent=alive[0]?names[alive[0].team]+'이 최후의 생존 종족입니다.':'모든 본부가 파괴됐습니다.'}hud()}
function hp(o,w,dy){if(o.hp>=o.maxHp||o.hp<=0)return;ctx.fillStyle='#02070aaa';ctx.fillRect(o.x-w/2,o.y-dy,w,5);ctx.fillStyle=o.hp/o.maxHp>.45?'#69e66c':'#ff6a5c';ctx.fillRect(o.x-w/2,o.y-dy,w*o.hp/o.maxHp,5)}
function background(){ctx.fillStyle='#0b2224';ctx.fillRect(0,0,W,H);const g=ctx.createRadialGradient(600,380,80,600,380,650);g.addColorStop(0,'#183d37');g.addColorStop(.5,'#102c2c');g.addColorStop(1,'#081b20');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#83d2c40b';for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.strokeStyle='#6edec522';ctx.lineWidth=2;[145,260].forEach(r=>{ctx.beginPath();ctx.arc(600,380,r,0,6.283);ctx.stroke()});for(const n of nodes){ctx.save();ctx.translate(n.x,n.y);ctx.shadowBlur=22;ctx.shadowColor='#50e6ff';ctx.fillStyle='#59d8ff';for(let i=0;i<5;i++){ctx.rotate(1.1);ctx.beginPath();ctx.moveTo(0,-13);ctx.lineTo(8,8);ctx.lineTo(-8,8);ctx.closePath();ctx.fill()}ctx.restore()}}
function baseDraw(b){ctx.save();ctx.translate(b.x,b.y);ctx.globalAlpha=b.alive?1:.2;ctx.shadowBlur=b.alive?20:0;ctx.shadowColor=colors[b.team];ctx.fillStyle='#07141a';ctx.strokeStyle=colors[b.team];ctx.lineWidth=5;ctx.beginPath();for(let i=0;i<6;i++){const a=1.047*i-.524,x=Math.cos(a)*b.r,y=Math.sin(a)*b.r;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle=colors[b.team]+'44';ctx.beginPath();ctx.arc(0,0,35,0,6.283);ctx.fill();ctx.strokeStyle='#dffaff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,19+Math.sin(performance.now()/300)*3,0,6.283);ctx.stroke();ctx.restore();hp(b,b.r,45)}
function unitDraw(u){const idx={worker:0,soldier:1,heavy:2,tank:3}[u.type],im=sprites[idx];ctx.save();ctx.translate(u.x,u.y);if(u.selected){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,7,u.size+8,u.size*.65+5,0,0,6.283);ctx.stroke()}ctx.shadowBlur=12;ctx.shadowColor=colors[u.team];if(im.complete&&im.naturalWidth)ctx.drawImage(im,-u.size,-u.size,u.size*2,u.size*2);else{ctx.fillStyle=colors[u.team];ctx.beginPath();ctx.arc(0,0,u.size*.65,0,6.283);ctx.fill()}ctx.globalCompositeOperation='source-atop';ctx.fillStyle=colors[u.team]+'55';ctx.fillRect(-u.size,-u.size,u.size*2,u.size*2);ctx.globalCompositeOperation='source-over';if(u.flash){ctx.fillStyle='#fff9';ctx.beginPath();ctx.arc(0,0,u.size*.75,0,6.283);ctx.fill()}ctx.restore();hp(u,u.size*1.8,u.size+8)}
function draw(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,innerWidth,innerHeight);ctx.save();ctx.translate(ox,oy);ctx.scale(scale,scale);background();bases.forEach(baseDraw);teams.forEach(tm=>tm.units.forEach(unitDraw));for(const s of shots){ctx.fillStyle=colors[s.team];ctx.shadowBlur=11;ctx.shadowColor=colors[s.team];ctx.beginPath();ctx.arc(s.x,s.y,4,0,6.283);ctx.fill()}ctx.shadowBlur=0;for(const p of particles){ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill()}ctx.globalAlpha=1;ctx.restore()}
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function ownAt(p){let best=null,bd=1e9;for(const u of teams[player].units)if(!u.dead){const d=Math.hypot(u.x-p.x,u.y-p.y);if(d<u.size+14&&d<bd){bd=d;best=u}}return best}function foeAt(p){let best=null,bd=1e9;for(const tm of teams)if(tm.team!==player)for(const u of tm.units)if(!u.dead){const d=Math.hypot(u.x-p.x,u.y-p.y);if(d<u.size+16&&d<bd){bd=d;best=u}}for(const b of bases)if(b.team!==player&&b.alive){const d=Math.hypot(b.x-p.x,b.y-p.y);if(d<b.r+15&&d<bd){bd=d;best=b}}return best}
canvas.addEventListener('pointerdown',e=>{if(!started||gameOver)return;const p=world(e.clientX,e.clientY),own=ownAt(p);if(own){selected.forEach(u=>u.selected=false);selected=[own];own.selected=true;statusEl.textContent=baseType[own.type].name+' 선택';return}const foe=foeAt(p);selected=selected.filter(u=>!u.dead);if(selected.length){selected.forEach((u,i)=>{if(foe){u.target=foe;u.tx=u.ty=null}else{u.target=null;const a=i/selected.length*6.283,r=Math.min(36,selected.length*3);u.tx=p.x+Math.cos(a)*r;u.ty=p.y+Math.sin(a)*r}});statusEl.textContent=foe?'공격 명령':'이동 명령'}else statusEl.textContent='먼저 내 유닛을 선택하세요'});
</script></body></html>
