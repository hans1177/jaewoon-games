<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0c1016"><title>대충 용사 RPG</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0c1016}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0c1016}</style></head><body><iframe id="outerGame" src="/rpg-play2.html?v=job5fix1" allow="autoplay"></iframe><script>
const outer=document.getElementById('outerGame');let done=false;
const jobTimer=setInterval(()=>{if(done)return;try{
 const mid=outer.contentWindow,innerFrame=mid.document&&mid.document.getElementById('gameFrame');if(!innerFrame)return;
 const w=innerFrame.contentWindow,d=innerFrame.contentDocument;if(!d||!d.getElementById('game')||!w.__CAVE8_PATCHED||typeof w.draw!=='function'||typeof w.update!=='function')return;
 const sc=d.createElement('script');sc.textContent=`(()=>{
 if(window.__JOB5_PATCHED)return;window.__JOB5_PATCHED=true;
 // 강철 대검 쿨타임 1초
 if(WEAPONS['강철 대검'])WEAPONS['강철 대검'].cd=1;
 // 전직 상태
 const baseResetJob=reset;reset=function(){baseResetJob();p.job='미전직';p.skillCd=0;p.steelDualReady=false;p.dualFirst=false};
 p.job=p.job||'미전직';p.skillCd=p.skillCd||0;p.steelDualReady=!!p.steelDualReady;p.dualFirst=false;
 // 궁수 패시브: 최대체력 -30%, 공격 +50%
 const rawMaxHpJob=maxHp;maxHp=function(){const v=rawMaxHpJob();return p.job==='궁수'?Math.max(1,Math.floor(v*.7)):v};
 const rawAtkJob=currentAtk;currentAtk=function(){const v=rawAtkJob();return p.job==='궁수'?v*1.5:v};
 // 직업 HUD
 const hudRow=document.querySelector('#hud .row');const jobText=document.createElement('span');jobText.id='jobText';jobText.className='pill';jobText.textContent='미전직';hudRow.appendChild(jobText);
 const baseHudJob=hud;hud=function(){baseHudJob();jobText.textContent=p.job||'미전직'};
 // 강철 쌍검: 장착 후 첫 실제 타격 1회만 3배
 const baseEquipJob=equipWeapon;equipWeapon=function(name){baseEquipJob(name);p.dualFirst=false;p.steelDualReady=(name==='강철 쌍검')};
 attackNow=function(){
  if(!run||ac>0)return;const wpn=WEAPONS[p.weapon];ac=wpn?wpn.cd:.35;combatTimer=4;p.animState='attack';p.animTick=0;p.animFrame=0;sfx('weaponSwing');
  const ax=p.x+p.dir*30;fx.push({x:ax,y:p.y,t:.18,d:p.dir});let triple=(p.weapon==='강철 쌍검'&&p.steelDualReady);
  for(const m of mons){if(m.dead)continue;if(Math.hypot(m.x-ax,m.y-p.y)<62+m.r){let dmg=currentAtk();if(triple){dmg*=3;triple=false;p.steelDualReady=false;toastMsg('강철 쌍검 첫 타격 3배!')}m.hp-=dmg;m.hit=.12;m.x+=p.dir*13;sfx(p.weapon==='철 도끼'||p.weapon==='철 망치'?'axeHit':p.weapon==='철 쌍검'||p.weapon==='강철 쌍검'||p.weapon==='낡은 쌍절곤'?'dualHit':'swordHit');if(m.hp<=0)kill(m)}}
 };
 // 전직관 위치
 const TRAINERS={warrior:{zone:'town',x:610,y:530,name:'전사 전직관',job:'전사'},archer:{zone:'cave8',x:1360,y:600,name:'궁수 전직관',job:'궁수'},mage:{zone:'f5',x:1630,y:170,name:'마법사 전직관',job:'마법사'}};
 function nearTrainer(){let best=null,bd=78;for(const k in TRAINERS){const t=TRAINERS[k];if(t.zone!==zone)continue;const dd=Math.hypot(p.x-t.x,p.y-t.y);if(dd<bd){bd=dd;best=t}}return best}
 function become(job){if(p.lv<5){say('전직관','Lv.5부터 전직할 수 있다.');return}if(p.job&&p.job!=='미전직'){say('전직관','이미 '+p.job+'로 전직했다. 전직은 한 번만 가능하다.');return}p.job=job;p.skillCd=0;if(job==='궁수')p.hp=Math.min(p.hp,maxHp());sfx('levelUp');hud();if(job==='전사')say('전사 전직관','전사 전직 완료. 스킬 슬래시: 공격력 3배로 2번 공격, 쿨타임 10초.');else if(job==='궁수')say('궁수 전직관','궁수 전직 완료. 패시브 극과극: 최대체력 -30%, 공격력 +50%.');else say('마법사 전직관','마법사 전직 완료. 스킬 자가회복: 체력 100 회복, 쿨타임 30초.')}
 const oldTalkJob=talkNow;talkNow=function(){const t=nearTrainer();if(t){become(t.job);return}oldTalkJob()};
 // 스킬 버튼
 const skill=document.createElement('button');skill.id='jobSkillBtn';skill.className='btn';skill.style.cssText='right:210px;bottom:30px;width:88px;height:72px;border-radius:18px;background:#7048b7e8;font-size:12px;display:none;white-space:pre-line';document.body.appendChild(skill);
 function skillLabel(){if(p.job==='전사')return p.skillCd>0?'슬래시\\n'+Math.ceil(p.skillCd)+'초':'슬래시\\n3배×2';if(p.job==='마법사')return p.skillCd>0?'자가회복\\n'+Math.ceil(p.skillCd)+'초':'자가회복\\n+100';if(p.job==='궁수')return '극과극\\n패시브';return ''}
 function slashHit(){const ax=p.x+p.dir*40;fx.push({x:ax,y:p.y,t:.25,d:p.dir});for(const m of mons){if(m.dead)continue;if(Math.hypot(m.x-ax,m.y-p.y)<88+m.r){m.hp-=currentAtk()*3;m.hit=.15;m.x+=p.dir*18;sfx('swordHit');if(m.hp<=0)kill(m)}}}
 function useJobSkill(){if(!run||p.skillCd>0)return;if(p.job==='전사'){p.skillCd=10;p.animState='attack';p.animTick=0;slashHit();setTimeout(()=>{if(run){p.animState='attack';p.animTick=0;slashHit()}},180);toastMsg('슬래시! 3배 공격 ×2')}else if(p.job==='마법사'){p.skillCd=30;p.hp=Math.min(maxHp(),p.hp+100);sfx('respawn');hud();toastMsg('자가회복 +100')} }
 skill.onpointerdown=e=>{e.preventDefault();useJobSkill()};
 // 거대오크 강타 완전 비활성화 + 쿨다운 갱신
 const oldUpdateJob=update;update=function(dt){p.skillCd=Math.max(0,(p.skillCd||0)-dt);for(const m of mons)if(m.type==='giantOrc')m.bossSkillCd=999999;oldUpdateJob(dt);for(const m of mons)if(m.type==='giantOrc')m.bossSkillCd=999999;skill.style.display=(p.job&&p.job!=='미전직')?'block':'none';skill.disabled=(p.job==='궁수'||p.skillCd>0);skill.style.opacity=skill.disabled?'.65':'1';skill.textContent=skillLabel()};
 // 전직관 그리기
 function drawTrainer(t,role){drawHuman(t.x,t.y,role,Math.floor(performance.now()/45)%34,'idle',false);ctx.fillStyle='#17120e';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText(t.name,t.x,t.y-62);ctx.fillStyle='#ffe26e';ctx.font='bold 10px sans-serif';ctx.fillText('Lv.5 전직',t.x,t.y-48);ctx.textAlign='left'}
 const oldDrawJob=draw;draw=function(){oldDrawJob();ctx.save();ctx.translate(-cam.x,-cam.y);if(zone==='town')drawTrainer(TRAINERS.warrior,'smith');else if(zone==='cave8')drawTrainer(TRAINERS.archer,'weapon');else if(zone==='f5')drawTrainer(TRAINERS.mage,'chief');ctx.restore()};
 hud();toastMsg('Lv.5 전직 시스템 업데이트 적용');
})();`;
 d.body.appendChild(sc);done=true;clearInterval(jobTimer);
}catch(e){}},180);
</script></body></html>
