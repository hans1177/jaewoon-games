<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#07111c">
<title>오프라인 · 재운게임즈</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07111c;color:#eef7ff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
body{min-height:100dvh;display:grid;place-items:center;padding:22px}.card{width:min(100%,460px);padding:24px;border:1px solid #284963;border-radius:18px;background:#0e2132;text-align:center}
h1{margin:0 0 8px;font-size:24px}p{margin:0;color:#9cb9cd;line-height:1.6;font-size:13px}.btn{display:flex;align-items:center;justify-content:center;min-height:46px;margin-top:18px;border-radius:12px;background:#216da8;color:#fff;text-decoration:none;font-weight:900}
</style>
</head>
<body>
<main class="card">
  <h1>인터넷 연결이 필요해</h1>
  <p>기존 게임과 개발 상태는 오래된 캐시를 보여주지 않고 최신 서버 자료를 우선해.</p>
  <a class="btn" href="/">다시 연결</a>
</main>
</body>
</html>
