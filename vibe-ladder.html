<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>비주얼 래더 현황</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#07111c;color:#eef7ff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
body{padding:max(12px,env(safe-area-inset-top)) 14px max(20px,env(safe-area-inset-bottom));background:radial-gradient(circle at 10% -10%,#153c5e 0,transparent 36%),#07111c}
.app{width:min(100%,920px);margin:auto}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:6px 2px 14px}
h1{margin:0;font-size:26px;letter-spacing:-.03em}
header p{margin:3px 0 0;color:#8fb3ce;font-size:11px;font-weight:700}
a.home{color:#eaf6ff;text-decoration:none;border:1px solid #31587a;background:#16334c;border-radius:11px;padding:9px 12px;font-size:11px;font-weight:800}
.game{border:1px solid #203c54;background:linear-gradient(180deg,#0e2132,#0a1a29);border-radius:16px;padding:14px;margin-bottom:14px}
.game h2{margin:0 0 4px;font-size:18px}
.meta{color:#8fb3ce;font-size:11px;margin-bottom:10px}
.cat{margin:10px 0}
.cat .row{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:800}
.bar{display:flex;gap:4px;margin:6px 0 4px}
.bar i{flex:1;height:8px;border-radius:4px;background:#1c3349}
.bar i.on{background:#5fd0a0}
.bar i.next{background:#e9b949}
.bar i.block{background:#c8575f}
.sub{color:#9bbbd3;font-size:11px;line-height:1.5}
.tag{display:inline-block;border:1px solid #31587a;border-radius:8px;padding:1px 6px;margin:2px 3px 2px 0;font-size:10px;color:#cfe6f7}
h3{margin:14px 0 6px;font-size:12px;color:#72c8f5;letter-spacing:.06em}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.thumbs img{width:100%;border-radius:8px;border:1px solid #203c54;display:block}
.cap{font-size:10px;color:#8fb3ce;margin:8px 0 4px;font-weight:800}
ul{margin:4px 0;padding-left:18px;font-size:12px;color:#cfe3f3;line-height:1.55}
.err{color:#ffb4b4;font-size:13px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div><h1>비주얼 래더 현황</h1><p>자동개발 루프가 한 바퀴 돌 때마다 NPC·배경·몹 디테일이 한 단계씩 오른다</p></div>
    <a class="home" href="company.html">연구소</a>
  </header>
  <div id="root">불러오는 중…</div>
</div>
<script>
(function(){
  var root=document.getElementById('root');
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
  function render(data){
    root.textContent='';
    var ids=Object.keys(data.games||{});
    if(!ids.length){root.appendChild(el('div','sub','아직 기록된 게임이 없다.'));return}
    ids.forEach(function(id){
      var g=data.games[id],box=el('section','game');
      box.appendChild(el('h2',null,id));
      box.appendChild(el('div','meta','루프 '+g.floor+'회차 · 갱신 '+g.updated+(g.perf?' · 평균 '+(g.perf.fpsAvg||'?')+'FPS(접속 '+g.perf.sessions+')':'')+(g.frames?' · 화면 검사 '+g.frames.checked+'장 중 깨진 '+g.frames.bad+'장':'')));
      (g.categories||[]).forEach(function(c){
        var cat=el('div','cat'),row=el('div','row');
        row.appendChild(el('span',null,c.label));row.appendChild(el('span',null,c.tier+' / '+c.max+' 단계'));
        cat.appendChild(row);
        var bar=el('div','bar');
        for(var i=1;i<=c.max;i++){
          var cls=i<=c.tier?'on':(i===c.tier+1?(c.next&&c.next.blocked?'block':'next'):'');
          bar.appendChild(el('i',cls));
        }
        cat.appendChild(bar);
        var sub='지금: '+c.name;
        if(c.next)sub+='  →  다음: '+c.next.name+(c.next.blocked?'  (승인 필요)':'  (다음 회차에 승급)');
        else sub+='  (최고 단계)';
        cat.appendChild(el('div','sub',sub));
        box.appendChild(cat);
      });
      if((g.gaps||[]).length){
        box.appendChild(el('h3',null,'부족 자산'));
        var ul=el('ul');
        g.gaps.forEach(function(x){
          var li=el('li',null,x.key+' — '+x.tierName+' 단계를 막고 있음. ');
          if(x.candidates&&x.candidates.length){
            li.appendChild(el('span',null,'등록 후보: '));
            x.candidates.forEach(function(n){li.appendChild(el('span','tag',n))});
          }else li.appendChild(el('span',null,'등록된 후보 없음(새 에셋 필요)'));
          ul.appendChild(li);
        });
        box.appendChild(ul);
      }
      if((g.thumbs||[]).length){
        box.appendChild(el('h3',null,'승급 전후 화면'));
        g.thumbs.forEach(function(t){
          box.appendChild(el('div','cap',t.floor));
          var grid=el('div','thumbs');
          t.files.forEach(function(f){var im=el('img');im.loading='lazy';im.src=f;im.alt=t.floor;grid.appendChild(im)});
          box.appendChild(grid);
        });
      }
      if((g.history||[]).length){
        box.appendChild(el('h3',null,'최근 기록'));
        var hl=el('ul');
        g.history.forEach(function(h){hl.appendChild(el('li',null,h.at+' · '+h.floor+'회차 · '+h.category+' → '+h.tier+'단계 '+h.name+' ('+h.why+')'))});
        box.appendChild(hl);
      }
      root.appendChild(box);
    });
  }
  fetch('vibe-ladder-status.json?'+Date.now()).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(render).catch(function(e){root.textContent='';root.appendChild(el('div','err','현황을 불러오지 못했다: '+e.message))});
})();
</script>
</body>
</html>
