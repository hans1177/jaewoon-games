<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#17140f"><title>좀비 편의점 | 재운게임즈</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#12100d;color:#fff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}button,a{font:inherit}.game{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,#2d2b22 0,#17140f 55%,#0d0b09 100%)}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.top{position:absolute;z-index:6;top:0;left:0;right:0;display:flex;align-items:center;gap:7px;padding:calc(7px + env(safe-area-inset-top)) 8px 7px;background:linear-gradient(#0b0a08f7,#11100dd8 78%,transparent);pointer-events:none}.back{pointer-events:auto;padding:7px 10px;border:1px solid #665f4b;border-radius:10px;background:#262219;color:#fff;text-decoration:none;font-size:12px;font-weight:900}.title{font-weight:1000;letter-spacing:-.5px}.stats{margin-left:auto;display:flex;gap:5px}.pill{min-width:70px;padding:6px 8px;border:1px solid #5b5546;border-radius:10px;background:#211e17e8;text-align:center;font-size:11px;font-weight:900}.phase{position:absolute;z-index:6;left:50%;top:calc(50px + env(safe-area-inset-top));transform:translateX(-50%);padding:7px 12px;border:1px solid #756c55;border-radius:999px;background:#17140fe6;font-size:11px;font-weight:1000;white-space:nowrap}.panel{position:absolute;z-index:7;left:7px;right:7px;bottom:calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.action{min-height:58px;padding:6px 3px;border:1px solid #69614d;border-radius:12px;background:linear-gradient(#302b20,#1d1913);color:#fff;font-size:11px;font-weight:1000}.action small{display:block;margin-top:3px;color:#f3d782;font-size:9px}.action:active{transform:scale(.96)}.action.lock{opacity:.45}.tip{position:absolute;z-index:5;left:50%;bottom:78px;transform:translateX(-50%);padding:6px 9px;border-radius:999px;background:#0d0b09d9;border:1px solid #4d4739;font-size:9px;font-weight:800;white-space:nowrap;pointer-events:none}.start,.result{position:absolute;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(circle at 50% 20%,#403b2c 0,#191610 48%,#0a0907 100%)}.card{width:min(560px,100%);padding:22px;border:1px solid #736a54;border-radius:22px;background:#15120de8;box-shadow:0 24px 80px #0009;text-align:center}.logo{font-size:clamp(38px,10vw,68px);font-weight:1000;letter-spacing:-3px;color:#ffe67d;text-shadow:0 4px 0 #57451b,0 8px 24px #000}.sub{margin:6px 0 17px;color:#d6c9a6;font-size:13px;font-weight:800;line-height:1.6}.rules{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0;text-align:left}.rule{padding:12px;border:1px solid #514a39;border-radius:14px;background:#201c15}.rule b{display:block;margin-bottom:4px;color:#ffe08a}.rule span{font-size:11px;line-height:1.5;color:#cfc5aa}.startBtn,.again{width:100%;min-height:52px;border:0;border-radius:14px;background:#e24d3d;color:#fff;font-weight:1000;font-size:17px}.result{display:none;background:#080705e8}.result h2{margin:0 0 8px;font-size:40px}.summary{color:#d5c9a9;font-size:13px;line-height:1.7}.again{margin-top:15px;background:#d69d34}@media(max-width:620px){.title{display:none}.pill{min-width:61px;padding:5px 6px}.phase{top:calc(46px + env(safe-area-inset-top));font-size:10px}.panel{gap:4px;left:4px;right:4px}.action{min-height:54px;font-size:10px}.tip{bottom:71px;font-size:8px}.card{padding:17px 13px}.rules{grid-template-columns:1fr}.rule{padding:9px}.logo{font-size:43px}}
</style></head>
<body><div class="game"><canvas id="c"></canvas>
<div class="top"><a class="back" href="/">← 대문</a><div class="title">좀비 편의점</div><div class="stats"><div class="pill">돈 <span id="money">0</span></div><div class="pill">재고 <span id="stock">0</span></div><div class="pill">방어 <span id="door">100</span>%</div></div></div>
<div class="phase" id="phase">DAY 1 · 낮 영업</div><div class="tip" id="tip">낮에는 진열·판매 · 밤에는 셔터와 바리케이드를 강화</div>
<div class="panel" id="panel"><button class="action" data-act="restock">📦 물건 들이기<small>20원 → 재고 +6</small></button><button class="action" data-act="display">🛒 진열 강화<small>35원 · 판매 속도↑</small></button><button class="action" data-act="shutter">🚪 셔터 수리<small>25원 · 방어 +25</small></button><button class="action" data-act="barricade">🪵 바리케이드<small>45원 · 밤 피해↓</small></button></div>
<div class="start" id="start"><div class="card"><div class="logo">좀비 편의점</div><div class="sub">낮에는 평범한 편의점 사장.<br>밤이 되면 손님 대신 좀비가 몰려온다.</div><div class="rules"><div class="rule"><b>☀️ 낮</b><span>재고를 채우고 손님에게 판매해 돈을 번다. 진열을 강화하면 손님이 더 빨리 계산한다.</span></div><div class="rule"><b>🌙 밤</b><span>셔터와 바리케이드를 준비한다. 방어가 0이 되면 편의점이 뚫린다.</span></div></div><button class="startBtn" id="startBtn">DAY 1 영업 시작</button></div></div>
<div class="result" id="result"><div class="card"><h2 id="resultTitle">폐점...</h2><div class="summary" id="summary"></div><button class="again" onclick="location.reload()">다시 도전</button></div></div>
</div>
<script>
const canvas=document.querySelector('#c'),ctx=canvas.getContext('2d'),moneyEl=document.querySelector('#money'),stockEl=document.querySelector('#stock'),doorEl=document.querySelector('#door'),phaseEl=document.querySelector('#phase'),tipEl=document.querySelector('#tip'),startEl=document.querySelector('#start'),resultEl=document.querySelector('#result'),resultTitle=document.querySelector('#resultTitle'),summaryEl=document.querySelector('#summary');
let dpr=1,W=innerWidth,H=innerHeight,last=performance.now(),running=false,day=1,mode='day',timer=24,money=90,stock=12,door=100,displayLv=0,barricade=0,sold=0,zombies=[],customers=[],effects=[],spawnClock=0,customerClock=0,nightKills=0;
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(2,devicePixelRatio||1);canvas.width=W*dpr;canvas.height=H*dpr}addEventListener('resize',resize);resize();
function rand(a,b){return a+Math.random()*(b-a)}
function hud(){moneyEl.textContent=Math.floor(money);stockEl.textContent=stock;doorEl.textContent=Math.max(0,Math.round(door));phaseEl.textContent=`DAY ${day} · ${mode==='day'?'낮 영업':'밤 방어'} · ${Math.ceil(timer)}초`;document.querySelectorAll('.action').forEach(b=>{const a=b.dataset.act,cost=a==='restock'?20:a==='display'?35:a==='shutter'?25:45;b.classList.toggle('lock',money<cost||(a==='shutter'&&door>=100))})}
function store(){const ground=H*.72;ctx.fillStyle=mode==='day'?'#8fc7d1':'#1e2930';ctx.fillRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,mode==='day'?'#bfe7ef':'#17232a');g.addColorStop(.7,mode==='day'?'#86bdc7':'#202a2d');g.addColorStop(1,'#2b2923');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle=mode==='day'?'#efd8a2':'#615643';ctx.fillRect(0,ground,W,H-ground);const sx=W*.12,sw=W*.76,sy=H*.18,sh=H*.53;ctx.fillStyle='#ece5d2';ctx.fillRect(sx,sy,sw,sh);ctx.fillStyle='#d6cfbd';ctx.fillRect(sx,sy,sw,18);ctx.fillStyle='#e55245';ctx.fillRect(sx,sy,sw,25);ctx.fillStyle='#fff';ctx.font=`900 ${Math.max(18,W*.032)}px system-ui`;ctx.textAlign='center';ctx.fillText('24H JAeWOON MART',W/2,sy+20);ctx.fillStyle='#9ed4e2';ctx.fillRect(sx+sw*.12,sy+sh*.18,sw*.28,sh*.55);ctx.fillStyle='#c9e8ef';ctx.fillRect(sx+sw*.44,sy+sh*.18,sw*.27,sh*.55);ctx.fillStyle='#444';ctx.fillRect(sx+sw*.76,sy+sh*.18,sw*.16,sh*.55);for(let i=0;i<4;i++){ctx.fillStyle=['#f9c74f','#90be6d','#f9844a','#577590'][i];ctx.fillRect(sx+sw*(.46+i*.055),sy+sh*.25,sw*.04,sh*.13)}ctx.fillStyle='#4b4234';ctx.fillRect(sx+sw*.18,sy+sh*.61,sw*.53,12);ctx.fillStyle='#88775e';ctx.fillRect(sx+sw*.18,sy+sh*.64,sw*.53,sh*.07);if(mode==='night'){const closed=Math.max(0,door)/100;ctx.fillStyle=`rgba(73,79,82,${.28+.66*closed})`;ctx.fillRect(sx+sw*.08,sy+sh*.12,sw*.84,sh*.66);ctx.strokeStyle='#9ca4a7';ctx.lineWidth=3;for(let y=sy+sh*.14;y<sy+sh*.77;y+=14){ctx.beginPath();ctx.moveTo(sx+sw*.08,y);ctx.lineTo(sx+sw*.92,y);ctx.stroke()}for(let i=0;i<barricade;i++){ctx.save();ctx.translate(W*.5,H*.66-i*9);ctx.rotate((i%2?.05:-.05));ctx.fillStyle='#6f4a2d';ctx.fillRect(-W*.22,-5,W*.44,10);ctx.restore()}}ctx.fillStyle='#222';ctx.fillRect(0,ground-4,W,8)}
function drawPerson(p,z=false){ctx.save();ctx.translate(p.x,p.y);const s=p.s||1;ctx.scale(s,s);ctx.fillStyle=z?'#6d8f56':'#e7c7a6';ctx.beginPath();ctx.arc(0,-22,10,0,6.28);ctx.fill();ctx.fillStyle=z?'#4f5d39':p.c;ctx.fillRect(-9,-12,18,27);ctx.fillStyle='#222';ctx.fillRect(-8,15,6,18);ctx.fillRect(2,15,6,18);if(z){ctx.strokeStyle='#9dc477';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-8,-3);ctx.lineTo(-20,8);ctx.moveTo(8,-3);ctx.lineTo(20,8);ctx.stroke()}ctx.restore()}
function update(dt){if(!running)return;timer-=dt;if(mode==='day'){customerClock-=dt;if(customerClock<=0){customerClock=rand(1.3,2.4)/(1+displayLv*.16);customers.push({x:-25,y:H*.73-30,s:rand(.85,1.1),c:['#3e78a8','#d16f4c','#7c5aa6','#3f9b6f'][Math.floor(Math.random()*4)],state:'in',wait:rand(1.5,3)});}for(const c of customers){if(c.state==='in'){c.x+=70*dt;if(c.x>W*.45)c.state='buy'}else if(c.state==='buy'){c.wait-=dt;if(c.wait<=0){if(stock>0){stock--;const earn=10+displayLv*2;money+=earn;sold++;effects.push({x:c.x,y:c.y-45,t:1,text:`+${earn}원`})}c.state='out'}}else{c.x+=95*dt}}customers=customers.filter(c=>c.x<W+40)}else{spawnClock-=dt;if(spawnClock<=0){spawnClock=Math.max(.35,1.5-day*.08);const lane=Math.random()<.5?0:1;zombies.push({x:lane?W+30:-30,y:H*.73-28,hp:2+Math.floor(day/2),s:rand(.85,1.18),speed:28+day*3+rand(0,12),hit:0})}for(const z of zombies){const tx=W*.5,dist=Math.abs(tx-z.x);z.x+=Math.sign(tx-z.x)*z.speed*dt;if(dist<110){z.hit-=dt;if(z.hit<=0){z.hit=.75;const dmg=Math.max(2,7+day*1.6-barricade*1.4);door-=dmg;effects.push({x:W*.5+rand(-60,60),y:H*.61,t:.55,text:`-${Math.ceil(dmg)}`});z.hp--;if(z.hp<=0){z.dead=true;nightKills++}}}}zombies=zombies.filter(z=>!z.dead&&z.x>-60&&z.x<W+60);if(door<=0){end(false);return}}if(timer<=0){if(mode==='day'){mode='night';timer=20+day*2;customers=[];tipEl.textContent='밤 시작! 셔터 수리와 바리케이드로 버텨라';}else{day++;mode='day';timer=24;zombies=[];door=Math.min(100,door+18);money+=30+day*5;tipEl.textContent='아침 보너스 지급 · 재고를 채우고 다시 영업';if(day>7){end(true);return}}}for(const e of effects)e.t-=dt;effects=effects.filter(e=>e.t>0);hud()}
function draw(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);store();for(const c of customers)drawPerson(c,false);for(const z of zombies)drawPerson(z,true);for(const e of effects){ctx.globalAlpha=Math.min(1,e.t*2);ctx.fillStyle=e.text.includes('+')?'#ffe66d':'#ff6b5e';ctx.font='900 15px system-ui';ctx.textAlign='center';ctx.fillText(e.text,e.x,e.y-e.t*16)}ctx.globalAlpha=1;if(mode==='night'){const g=ctx.createRadialGradient(W*.5,H*.53,20,W*.5,H*.53,Math.max(W,H)*.58);g.addColorStop(0,'rgba(255,231,163,.08)');g.addColorStop(.45,'rgba(0,0,0,.18)');g.addColorStop(1,'rgba(0,0,0,.58)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}}
function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function act(a){if(!running)return;const cost=a==='restock'?20:a==='display'?35:a==='shutter'?25:45;if(money<cost)return;money-=cost;if(a==='restock'){stock+=6;tipEl.textContent='재고 +6'}if(a==='display'){displayLv++;tipEl.textContent=`진열 레벨 ${displayLv} · 판매 속도 상승`}if(a==='shutter'){door=Math.min(100,door+25);tipEl.textContent='셔터 방어 +25'}if(a==='barricade'){barricade=Math.min(8,barricade+1);tipEl.textContent=`바리케이드 ${barricade}단계 · 밤 피해 감소`}hud()}
document.querySelectorAll('.action').forEach(b=>b.onclick=()=>act(b.dataset.act));document.querySelector('#startBtn').onclick=()=>{startEl.style.display='none';running=true;hud()};
function end(win){running=false;resultEl.style.display='flex';resultTitle.textContent=win?'7일 생존 성공!':'편의점이 뚫렸다';summaryEl.innerHTML=`최종 DAY ${day}<br>판매한 상품 ${sold}개 · 막은 좀비 ${nightKills}마리<br>남은 돈 ${Math.floor(money)}원`;}
hud();
</script></body></html>
