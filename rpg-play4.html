  }oldKillAmazon(m)};

 function drawAmazonSign(){pixelRect(AMAZON_SIGN.x-5,AMAZON_SIGN.y-5,10,58,'#6c492a');pixelRect(AMAZON_SIGN.x-66,AMAZON_SIGN.y-62,132,48,'#bd8a4f');ctx.strokeStyle='#6d4524';ctx.lineWidth=4;ctx.strokeRect(AMAZON_SIGN.x-66,AMAZON_SIGN.y-62,132,48);ctx.fillStyle='#25180d';ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.fillText('아마존으로 가는곳',AMAZON_SIGN.x,AMAZON_SIGN.y-33);ctx.textAlign='left'}

 // 물약 상점
