<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#63cbe8">
  <title>무인도 마을 · 재운게임즈</title>
  <style>
    /* island.html · 기본 */
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
    :root{--ink:#17394a;--glass:rgba(255,255,255,.9);--line:rgba(255,255,255,.82);--blue:#28a8d5;--green:#46a95d;--sand:#f2d18d}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#4ab7dd;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--ink)}
    button{font:inherit;color:inherit}
    .app{position:relative;width:100%;height:100dvh;overflow:hidden;background:linear-gradient(#55c3e8,#2d9ac8)}
    .topbar{position:absolute;z-index:20;left:0;right:0;top:0;padding:max(8px,env(safe-area-inset-top)) 8px 0;pointer-events:none}
    .toprow{display:flex;align-items:center;gap:7px;max-width:980px;margin:auto}
    .home,.pill,.clock{pointer-events:auto;border:1px solid var(--line);background:var(--glass);box-shadow:0 6px 18px rgba(27,75,95,.14);backdrop-filter:blur(7px)}
    .home{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;text-decoration:none;font-size:19px;font-weight:1000}
    .resources{display:flex;gap:5px;min-width:0;flex:1;overflow-x:auto;scrollbar-width:none}.resources::-webkit-scrollbar{display:none}
    .pill{flex:0 0 auto;min-width:61px;padding:7px 9px;border-radius:13px;text-align:center;font-size:11px;font-weight:950;line-height:1.15}.pill b{display:block;margin-top:2px;font-size:14px}
    .clock{flex:0 0 auto;padding:7px 10px;border-radius:13px;font-size:11px;font-weight:900;text-align:center}.clock b{display:block;font-size:14px}
    .objective{pointer-events:auto;max-width:560px;margin:6px auto 0;padding:7px 12px;border:1px solid rgba(255,255,255,.78);border-radius:999px;background:rgba(19,75,70,.75);color:#fff;box-shadow:0 5px 16px rgba(12,50,62,.16);text-align:center;font-size:11px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    /* 게임 화면 */
    .world{position:absolute;inset:0;display:grid;place-items:center;padding:80px 0 84px}
    canvas{display:block;width:100%;height:100%;max-width:1180px;max-height:780px;outline:0;touch-action:none}
    .kenney-credit{position:absolute;right:8px;bottom:78px;z-index:9;padding:4px 7px;border-radius:8px;background:rgba(10,62,72,.45);color:rgba(255,255,255,.82);font-size:8px;font-weight:700;pointer-events:none}

    /* 하단 메뉴 */
    .bottom{position:absolute;z-index:20;left:0;right:0;bottom:0;padding:0 8px max(9px,env(safe-area-inset-bottom));pointer-events:none}
    .dock{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;max-width:560px;margin:auto;padding:7px;border:1px solid var(--line);border-radius:21px;background:rgba(255,255,255,.9);box-shadow:0 -8px 30px rgba(21,75,96,.16);backdrop-filter:blur(9px);pointer-events:auto}
    .dock button{min-height:54px;border:0;border-radius:15px;background:#eef9fb;font-size:11px;font-weight:1000}.dock button span{display:block;font-size:22px;line-height:1.05;margin-bottom:2px}.dock button.active{background:#d9f3df;color:#16713b}.dock button:disabled{opacity:.42}

    /* 패널 */
    .shade{position:absolute;z-index:29;inset:0;background:rgba(10,42,50,.28);opacity:0;pointer-events:none;transition:.18s}.shade.open{opacity:1;pointer-events:auto}
    .panel{position:absolute;z-index:30;left:50%;bottom:78px;width:min(94%,560px);max-height:min(66dvh,580px);overflow:auto;transform:translate(-50%,calc(100% + 110px));transition:.22s ease;border:1px solid var(--line);border-radius:24px;background:rgba(248,253,250,.97);box-shadow:0 18px 50px rgba(16,57,70,.28);padding:14px}.panel.open{transform:translate(-50%,0)}
    .panelHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}.panelHead h2{margin:0;font-size:18px}.close{width:36px;height:36px;border:0;border-radius:12px;background:#e5f2f2;font-size:20px;font-weight:1000}
    .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card{position:relative;border:1px solid #d8e9df;border-radius:17px;background:#fff;padding:11px;text-align:left;box-shadow:0 5px 12px rgba(30,75,66,.06)}.card strong{display:block;font-size:14px}.card small{display:block;margin-top:4px;color:#67807c;font-size:10px;line-height:1.4}.card .icon{font-size:26px;float:right;margin-left:5px}.cost{margin-top:7px;font-size:10px;font-weight:900;color:#376955}.card.locked{opacity:.48}.card.selected{outline:3px solid #54b76e;background:#effbf1}
    .resident{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:9px;padding:9px 3px;border-bottom:1px solid #e4ece9}.resident:last-child{border-bottom:0}.avatar{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:#f4cf79;font-size:21px}.resident b{font-size:13px}.resident small{display:block;margin-top:2px;color:#6e817d;font-size:10px}.job{min-width:104px;height:38px;border:1px solid #cfe1dc;border-radius:12px;background:#fff;font-size:11px;font-weight:900}
    .storageGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.storageItem{padding:13px 8px;border-radius:15px;background:#fff;text-align:center;border:1px solid #e0ece9;font-size:22px}.storageItem b{display:block;margin-top:4px;font-size:15px}.storageItem small{display:block;color:#718783;font-size:9px}
    .exploreBox{padding:14px;border-radius:18px;background:linear-gradient(135deg,#e2f8ff,#f6fdff);border:1px solid #cce9ef}.exploreBox h3{margin:0 0 7px}.exploreBox p{margin:0;color:#5d777d;font-size:11px;line-height:1.55}.exploreBtn{width:100%;height:48px;margin-top:12px;border:0;border-radius:15px;background:#28a8d5;color:#fff;font-weight:1000}.exploreBtn:disabled{opacity:.45}
    .danger{width:100%;height:42px;margin-top:12px;border:0;border-radius:13px;background:#fff0ef;color:#bb4239;font-size:12px;font-weight:1000}

    /* 알림/시작 */
    .toast{position:absolute;z-index:40;left:50%;top:112px;max-width:88%;transform:translate(-50%,-16px);opacity:0;pointer-events:none;padding:9px 14px;border-radius:999px;background:rgba(17,57,58,.88);color:#fff;font-size:11px;font-weight:900;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
    .splash{position:absolute;z-index:50;inset:0;display:grid;place-items:center;padding:18px;background:linear-gradient(rgba(26,114,139,.74),rgba(21,81,82,.78));transition:.25s}.splash.hide{opacity:0;pointer-events:none}
    .splashCard{width:min(92%,470px);overflow:hidden;border:2px solid rgba(255,255,255,.88);border-radius:28px;background:#fff;box-shadow:0 26px 70px rgba(8,48,62,.28)}
    .splashArt{height:190px;background:#7bcdd8 url("https://raw.githubusercontent.com/GeorgeQLe/assets-2d-city/main/assets/kenney/tiny-town/Sample.png") center/cover no-repeat;image-rendering:pixelated;position:relative}.splashArt:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 42%,rgba(8,60,67,.62))}
    .splashTitle{position:absolute;z-index:2;left:18px;bottom:14px;color:#fff;text-shadow:0 2px 5px rgba(0,0,0,.35)}.splashTitle h1{margin:0;font-size:31px;letter-spacing:-2px}.splashTitle p{margin:2px 0 0;font-size:11px;font-weight:800}
    .splashBody{padding:16px}.splashBody p{margin:0 0 12px;color:#5b7470;font-size:12px;line-height:1.6}.start{width:100%;height:52px;border:0;border-radius:16px;background:#42ab62;color:#fff;font-size:16px;font-weight:1000;box-shadow:0 6px 0 #2d8247}.start:active{transform:translateY(4px);box-shadow:0 2px 0 #2d8247}.assetNote{display:block;margin-top:10px;text-align:center;color:#849391;font-size:8px}

    @media(max-width:640px){
      .world{padding:76px 0 76px}.toprow{gap:4px}.home{width:38px;height:38px;border-radius:12px}.pill{min-width:54px;padding:6px 7px;font-size:9px}.pill b{font-size:12px}.clock{padding:6px 7px;font-size:9px}.clock b{font-size:12px}.objective{margin-top:4px;max-width:92%;padding:6px 10px;font-size:9px}
      .dock{gap:5px;padding:5px;border-radius:18px}.dock button{min-height:48px;border-radius:13px;font-size:9px}.dock button span{font-size:19px}.panel{bottom:71px;padding:12px;border-radius:20px}.cards{gap:6px}.card{padding:9px}.card strong{font-size:12px}.card .icon{font-size:22px}.splashArt{height:165px}.kenney-credit{bottom:70px}
    }
    @media(max-height:600px) and (orientation:landscape){.world{padding:64px 0 62px}.objective{display:none}.dock button{min-height:44px}.panel{bottom:61px;max-height:70dvh}.topbar{padding-top:4px}.kenney-credit{bottom:60px}}
  </style>
</head>
<body>
  <div class="app">
    <!-- island.html · 상단 HUD -->
    <div class="topbar">
      <div class="toprow">
        <a class="home" href="/" aria-label="재운게임즈로 돌아가기">⌂</a>
        <div class="resources">
          <div class="pill">🪵 나무<b id="wood">0</b></div>
          <div class="pill">🪨 돌<b id="stone">0</b></div>
          <div class="pill">🍎 식량<b id="food">0</b></div>
          <div class="pill">🐟 물고기<b id="fish">0</b></div>
          <div class="pill">🪙 골드<b id="gold">0</b></div>
        </div>
        <div class="clock"><span id="phase">아침</span><b><span id="day">1</span>일</b></div>
      </div>
      <div class="objective" id="objective">섬의 자원을 눌러 모으고 오두막을 지어보세요.</div>
    </div>

    <!-- island.html · 게임 월드 -->
    <main class="world"><canvas id="game" width="1000" height="700" aria-label="무인도 마을 게임 화면"></canvas></main>
    <div class="kenney-credit">무료 에셋: Kenney Tiny Town · CC0</div>

    <!-- island.html · 하단 메뉴 -->
    <div class="bottom"><nav class="dock">
      <button data-panel="build"><span>🔨</span>건설</button>
      <button data-panel="residents"><span>🧑‍🌾</span>주민</button>
      <button data-panel="storage"><span>📦</span>창고</button>
      <button id="exploreDock" data-panel="explore" disabled><span>⛵</span>탐험</button>
    </nav></div>

    <div class="shade" id="shade"></div>
    <section class="panel" id="panel" aria-live="polite"></section>
    <div class="toast" id="toast"></div>

    <!-- island.html · 첫 화면 -->
    <div class="splash" id="splash">
      <div class="splashCard">
        <div class="splashArt"><div class="splashTitle"><h1>무인도 마을</h1><p>작은 섬을 살아있는 마을로 키워보세요</p></div></div>
        <div class="splashBody">
          <p>자원을 직접 채집하고 주민에게 직업을 맡기세요. 농장과 낚시터를 만들고 마지막에는 항구를 열어 주변 섬까지 탐험할 수 있습니다.</p>
          <button class="start" id="startBtn">게임 시작</button>
          <small class="assetNote">게임 시각 자료 일부는 CC0 무료 에셋 Kenney Tiny Town을 사용합니다.</small>
        </div>
      </div>
    </div>
  </div>

  <script>
    // island.html · 게임 데이터
    const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
    const SAVE_KEY='jaewoon-island-v1';
    const BUILDINGS={
      hut:{name:'오두막',icon:'🏠',cost:{wood:20,stone:5},desc:'주민 최대 수 +1',needs:null},
      storage:{name:'창고',icon:'📦',cost:{wood:25,stone:15},desc:'자원 보관량 +100',needs:null},
      farm:{name:'농장',icon:'🌾',cost:{wood:20,stone:10},desc:'농부가 식량을 생산',needs:null},
      fishery:{name:'낚시터',icon:'🎣',cost:{wood:15,stone:5},desc:'어부가 물고기를 생산',needs:null},
      shop:{name:'상점',icon:'🏪',cost:{wood:30,stone:20,gold:20},desc:'상인이 골드를 생산',needs:'storage'},
      port:{name:'항구',icon:'⚓',cost:{wood:50,stone:35,gold:60},desc:'주변 섬 탐험 해금',needs:'shop'}
    };
    const JOBS=['한가함','나무꾼','광부','농부','어부','상인'];
    const JOB_ICONS={'한가함':'🙂','나무꾼':'🪓','광부':'⛏️','농부':'🌾','어부':'🎣','상인':'🪙'};
    const plots=[{x:380,y:310},{x:525,y:280},{x:645,y:360},{x:530,y:455},{x:365,y:460},{x:715,y:475}];
    const resourceSeed=[
      ['tree',290,270],['tree',250,380],['tree',330,510],['tree',690,260],['tree',760,330],['tree',720,545],
      ['rock',410,235],['rock',620,225],['rock',780,430],['rock',305,455],
      ['berry',470,525],['berry',610,520],['berry',220,455]
    ];
    const names=['하람','보라','마루','도담','라온','세나','유리','태오','하늘','모아'];
    let state;
    let buildMode=null,panelName=null,last=performance.now(),autosave=0,toastTimer=0;
    const villagers=[];
    const resources=resourceSeed.map((r,i)=>({id:i,type:r[0],x:r[1],y:r[2],ready:0,pulse:Math.random()*6.28}));

    function freshState(){return {wood:25,stone:12,food:20,fish:0,gold:40,day:1,time:.16,happiness:86,buildings:[],residents:[{name:'마루',job:'한가함'}],exploreCooldown:0,started:false,lastSave:Date.now()}}
    function load(){
      try{const raw=localStorage.getItem(SAVE_KEY);state=raw?Object.assign(freshState(),JSON.parse(raw)):freshState()}catch(e){state=freshState()}
      if(!Array.isArray(state.buildings))state.buildings=[];
      if(!Array.isArray(state.residents)||!state.residents.length)state.residents=freshState().residents;
      state.residents=state.residents.slice(0,8).map((r,i)=>({name:r.name||names[i%names.length],job:JOBS.includes(r.job)?r.job:'한가함'}));
      syncVillagers();
      if(state.started)document.querySelector('#splash').classList.add('hide');
      renderHud();
    }
    function save(){state.lastSave=Date.now();localStorage.setItem(SAVE_KEY,JSON.stringify(state))}

    // island.html · 주민/생산
    function syncVillagers(){
      while(villagers.length<state.residents.length){const i=villagers.length;villagers.push({x:470+Math.random()*90,y:360+Math.random()*80,tx:450+Math.random()*120,ty:330+Math.random()*120,speed:15+Math.random()*7,phase:Math.random()*6.28,index:i})}
      villagers.length=state.residents.length;
      villagers.forEach((v,i)=>v.index=i);
    }
    function hasBuilding(type){return state.buildings.some(b=>b.type===type)}
    function buildingCount(type){return state.buildings.filter(b=>b.type===type).length}
    function capacity(){return 100+buildingCount('storage')*100}
    function housing(){return 1+buildingCount('hut')}
    function addResource(key,amount){state[key]=Math.min(capacity(),Math.max(0,(state[key]||0)+amount))}
    function productionTick(){
      state.residents.forEach(r=>{
        if(r.job==='나무꾼')addResource('wood',.55);
        if(r.job==='광부')addResource('stone',.32);
        if(r.job==='농부'&&hasBuilding('farm'))addResource('food',.72);
        if(r.job==='어부'&&hasBuilding('fishery'))addResource('fish',.5);
        if(r.job==='상인'&&hasBuilding('shop')){
          if(state.fish>=.35){state.fish-=.35;addResource('gold',.7)}
          else if(state.food>=.45){state.food-=.45;addResource('gold',.45)}
        }
      });
      const need=state.residents.length*.11;
      if(state.food>=need){state.food-=need;state.happiness=Math.min(100,state.happiness+.06)}else{state.happiness=Math.max(10,state.happiness-.65)}
      if(state.exploreCooldown>0)state.exploreCooldown=Math.max(0,state.exploreCooldown-1);
      renderHud();
    }

    // island.html · 건설
    function canPay(cost){return Object.entries(cost).every(([k,v])=>(state[k]||0)>=v)}
    function pay(cost){Object.entries(cost).forEach(([k,v])=>state[k]-=v)}
    function build(type,plotIndex){
      const def=BUILDINGS[type];
      if(state.buildings.some(b=>b.plot===plotIndex))return showToast('이미 건물이 있는 자리예요.');
      if(def.needs&&!hasBuilding(def.needs))return showToast(`${BUILDINGS[def.needs].name}을 먼저 지어야 해요.`);
      if(!canPay(def.cost))return showToast('건설 자원이 부족해요.');
      pay(def.cost);state.buildings.push({type,plot:plotIndex,level:1});buildMode=null;
      if(type==='hut')setTimeout(()=>attractResident(),1500);
      if(type==='port')showToast('항구 완성! 주변 섬 탐험이 열렸어요.');else showToast(`${def.name} 완성!`);
      save();renderHud();closePanel();
    }
    function attractResident(){
      if(state.residents.length>=Math.min(8,housing()))return;
      const used=new Set(state.residents.map(r=>r.name));const name=names.find(n=>!used.has(n))||`주민 ${state.residents.length+1}`;
      state.residents.push({name,job:'한가함'});syncVillagers();showToast(`${name} 주민이 섬에 도착했어요!`);save();renderHud();
    }

    // island.html · 패널
    const panel=document.querySelector('#panel'),shade=document.querySelector('#shade');
    function openPanel(name){panelName=name;buildMode=null;document.querySelectorAll('.dock button').forEach(b=>b.classList.toggle('active',b.dataset.panel===name));shade.classList.add('open');panel.classList.add('open');renderPanel()}
    function closePanel(){panelName=null;panel.classList.remove('open');shade.classList.remove('open');document.querySelectorAll('.dock button').forEach(b=>b.classList.remove('active'))}
    function panelHeader(title){return `<div class="panelHead"><h2>${title}</h2><button class="close" id="closePanel">×</button></div>`}
    function renderPanel(){
      if(!panelName)return;
      if(panelName==='build'){
        panel.innerHTML=panelHeader('건설')+`<div class="cards">${Object.entries(BUILDINGS).map(([key,b])=>{
          const locked=b.needs&&!hasBuilding(b.needs);const costs=Object.entries(b.cost).map(([k,v])=>`${{wood:'🪵',stone:'🪨',food:'🍎',fish:'🐟',gold:'🪙'}[k]} ${v}`).join(' · ');
          return `<button class="card ${locked?'locked':''} ${buildMode===key?'selected':''}" data-build="${key}"><span class="icon">${b.icon}</span><strong>${b.name}</strong><small>${b.desc}${locked?`<br>${BUILDINGS[b.needs].name} 필요`:''}</small><div class="cost">${costs}</div></button>`}).join('')}</div><p style="margin:10px 3px 0;color:#6f8580;font-size:10px">건물을 고른 뒤 섬의 점선 건설 부지를 누르세요.</p>`;
      }else if(panelName==='residents'){
        panel.innerHTML=panelHeader(`주민 ${state.residents.length} / ${Math.min(8,housing())}`)+state.residents.map((r,i)=>`<div class="resident"><div class="avatar">${JOB_ICONS[r.job]}</div><div><b>${r.name}</b><small>행복도 ${Math.round(state.happiness)}%</small></div><button class="job" data-job="${i}">${r.job} ▾</button></div>`).join('')+`<p style="font-size:10px;color:#6f8580">농부·어부·상인은 해당 건물이 있어야 실제 생산을 시작합니다.</p>`;
      }else if(panelName==='storage'){
        panel.innerHTML=panelHeader(`창고 · 보관 한도 ${capacity()}`)+`<div class="storageGrid">${[['🪵','나무','wood'],['🪨','돌','stone'],['🍎','식량','food'],['🐟','물고기','fish'],['🪙','골드','gold'],['😊','행복도','happiness']].map(([icon,n,k])=>`<div class="storageItem">${icon}<b>${Math.floor(state[k])}</b><small>${n}</small></div>`).join('')}</div><button class="danger" id="resetGame">저장 데이터 초기화</button>`;
      }else if(panelName==='explore'){
        const unlocked=hasBuilding('port');
        panel.innerHTML=panelHeader('주변 섬 탐험')+`<div class="exploreBox"><h3>⛵ 작은 보급섬</h3><p>${unlocked?'배를 보내 10초 뒤 새로운 자원과 골드를 가져옵니다. 탐험마다 결과가 달라집니다.':'항구를 완성하면 탐험할 수 있습니다.'}</p><button class="exploreBtn" id="exploreBtn" ${!unlocked||state.exploreCooldown>0?'disabled':''}>${state.exploreCooldown>0?`귀항까지 ${state.exploreCooldown}초`:'탐험 출발'}</button></div>`;
      }
      panel.querySelector('#closePanel')?.addEventListener('click',closePanel);
      panel.querySelectorAll('[data-build]').forEach(btn=>btn.addEventListener('click',()=>{const key=btn.dataset.build;if(btn.classList.contains('locked'))return;buildMode=key;closePanel();showToast(`${BUILDINGS[key].name}: 점선 부지를 누르세요.`)}));
      panel.querySelectorAll('[data-job]').forEach(btn=>btn.addEventListener('click',()=>cycleJob(Number(btn.dataset.job))));
      panel.querySelector('#resetGame')?.addEventListener('click',()=>{if(confirm('무인도 마을 저장 데이터를 처음부터 다시 시작할까요?')){localStorage.removeItem(SAVE_KEY);location.reload()}});
      panel.querySelector('#exploreBtn')?.addEventListener('click',startExplore);
    }
    function cycleJob(index){
      const r=state.residents[index],next=JOBS[(JOBS.indexOf(r.job)+1)%JOBS.length];r.job=next;save();renderPanel();showToast(`${r.name}: ${next}`)
    }
    function startExplore(){
      if(!hasBuilding('port')||state.exploreCooldown>0)return;
      state.exploreCooldown=10;renderPanel();showToast('배가 보급섬으로 출발했어요.');
      setTimeout(()=>{const rewards=[['wood',18,'나무'],['stone',12,'돌'],['food',16,'식량'],['fish',14,'물고기'],['gold',22,'골드']];const reward=rewards[Math.floor(Math.random()*rewards.length)];addResource(reward[0],reward[1]);state.exploreCooldown=0;showToast(`탐험 성공! ${reward[2]} +${reward[1]}`);save();renderHud();if(panelName==='explore')renderPanel()},10000);
    }
    document.querySelectorAll('.dock button[data-panel]').forEach(btn=>btn.addEventListener('click',()=>{if(btn.disabled)return;openPanel(btn.dataset.panel)}));shade.addEventListener('click',closePanel);

    // island.html · 터치 채집
    function worldPoint(evt){const rect=canvas.getBoundingClientRect();const touch=evt.touches?.[0]||evt.changedTouches?.[0]||evt;return {x:(touch.clientX-rect.left)*canvas.width/rect.width,y:(touch.clientY-rect.top)*canvas.height/rect.height}}
    function handleWorldTap(evt){
      evt.preventDefault();const p=worldPoint(evt);const now=performance.now()/1000;
      if(buildMode){const plotIndex=plots.findIndex((q,i)=>!state.buildings.some(b=>b.plot===i)&&Math.hypot(q.x-p.x,q.y-p.y)<48);if(plotIndex>=0)build(buildMode,plotIndex);else showToast('점선 건설 부지를 눌러주세요.');return}
      const node=resources.find(r=>r.ready<=now&&Math.hypot(r.x-p.x,r.y-p.y)<40);
      if(node){
        if(node.type==='tree'){addResource('wood',3);showToast('나무 +3')}
        if(node.type==='rock'){addResource('stone',2);showToast('돌 +2')}
        if(node.type==='berry'){addResource('food',3);showToast('식량 +3')}
        node.ready=now+12+Math.random()*8;renderHud();save();return;
      }
    }
    canvas.addEventListener('pointerdown',handleWorldTap,{passive:false});

    // island.html · HUD/목표
    function renderHud(){
      ['wood','stone','food','fish','gold'].forEach(k=>document.querySelector('#'+k).textContent=Math.floor(state[k]||0));document.querySelector('#day').textContent=state.day;
      const t=state.time,phase=t<.25?'아침':t<.58?'낮':t<.75?'노을':'밤';document.querySelector('#phase').textContent=phase;
      document.querySelector('#exploreDock').disabled=!hasBuilding('port');
      const obj=document.querySelector('#objective');
      if(!hasBuilding('hut'))obj.textContent='섬의 자원을 눌러 모으고 오두막을 지어보세요.';
      else if(state.residents.length<2)obj.textContent='새 주민이 오는 중입니다. 주민 메뉴에서 직업을 정해보세요.';
      else if(!hasBuilding('farm'))obj.textContent='농장을 지어 식량 자동 생산을 시작하세요.';
      else if(!hasBuilding('fishery'))obj.textContent='낚시터를 만들고 어부를 배치하세요.';
      else if(!hasBuilding('shop'))obj.textContent='창고와 상점을 건설해 골드를 벌어보세요.';
      else if(!hasBuilding('port'))obj.textContent='항구를 완성하면 주변 섬 탐험이 열립니다.';
      else obj.textContent='마을이 성장 중입니다. 주민과 건물을 더 늘려보세요!';
    }
    function showToast(text){const el=document.querySelector('#toast');el.textContent=text;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1500)}

    // island.html · 그래픽
    function roundedRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
    function drawWater(time){
      const g=ctx.createLinearGradient(0,0,0,700);g.addColorStop(0,'#5bc9ea');g.addColorStop(1,'#2398ca');ctx.fillStyle=g;ctx.fillRect(0,0,1000,700);
      ctx.lineWidth=2;for(let y=80;y<680;y+=58){ctx.beginPath();for(let x=-80;x<1080;x+=18){const yy=y+Math.sin(x*.025+time*1.7+y*.01)*4;ctx.lineTo(x,yy)}ctx.strokeStyle='rgba(255,255,255,.16)';ctx.stroke()}
      for(let i=0;i<9;i++){const x=(i*137+time*13)%1100-50,y=90+(i*71)%520;ctx.beginPath();ctx.ellipse(x,y,20,4,0,0,Math.PI*2);ctx.strokeStyle='rgba(255,255,255,.28)';ctx.stroke()}
    }
    function islandPath(){ctx.beginPath();ctx.moveTo(173,402);ctx.bezierCurveTo(160,292,248,184,382,151);ctx.bezierCurveTo(533,111,701,150,814,255);ctx.bezierCurveTo(898,334,884,470,792,563);ctx.bezierCurveTo(694,658,503,666,346,618);ctx.bezierCurveTo(230,584,181,507,173,402);ctx.closePath()}
    function drawIsland(){
      ctx.save();ctx.translate(0,13);islandPath();ctx.fillStyle='#e8c679';ctx.shadowColor='rgba(18,80,92,.25)';ctx.shadowBlur=20;ctx.shadowOffsetY=10;ctx.fill();ctx.restore();
      islandPath();ctx.fillStyle='#78b955';ctx.fill();ctx.lineWidth=8;ctx.strokeStyle='#f2d490';ctx.stroke();
      ctx.save();islandPath();ctx.clip();
      const g=ctx.createRadialGradient(500,365,60,500,365,360);g.addColorStop(0,'rgba(203,227,114,.34)');g.addColorStop(1,'rgba(54,127,55,.12)');ctx.fillStyle=g;ctx.fillRect(140,120,750,560);
      for(let i=0;i<120;i++){const x=190+(i*97)%650,y=165+(i*59)%440;ctx.fillStyle=i%3?'rgba(255,255,180,.16)':'rgba(25,104,47,.12)';ctx.fillRect(x,y,2,2)}ctx.restore();
    }
    function drawTree(r,time){const sway=Math.sin(time*1.6+r.pulse)*2;ctx.save();ctx.translate(r.x,r.y);ctx.rotate(sway*.004);ctx.fillStyle='#785037';roundedRect(-5,2,10,34,4);ctx.fill();ctx.fillStyle='#2f8f4d';for(const [x,y,s] of [[0,-13,18],[-14,-5,15],[15,-4,15],[0,3,17]]){ctx.beginPath();ctx.arc(x,y,s,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#63b85a';ctx.beginPath();ctx.arc(-5,-20,10,0,Math.PI*2);ctx.fill();ctx.restore()}
    function drawRock(r){ctx.save();ctx.translate(r.x,r.y);ctx.fillStyle='#6e7d7b';ctx.beginPath();ctx.moveTo(-18,12);ctx.lineTo(-12,-12);ctx.lineTo(5,-18);ctx.lineTo(18,-6);ctx.lineTo(14,14);ctx.closePath();ctx.fill();ctx.fillStyle='#9aa9a3';ctx.beginPath();ctx.moveTo(-11,-10);ctx.lineTo(5,-15);ctx.lineTo(12,-5);ctx.lineTo(-2,-2);ctx.closePath();ctx.fill();ctx.restore()}
    function drawBerry(r){ctx.save();ctx.translate(r.x,r.y);ctx.fillStyle='#348b48';ctx.beginPath();ctx.arc(0,4,18,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d84e56';for(const [x,y] of [[-8,-2],[5,-6],[9,7],[-3,9]]){ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill()}ctx.restore()}
    function drawResource(r,time){if(r.ready>performance.now()/1000)return;ctx.save();ctx.shadowColor='rgba(0,0,0,.16)';ctx.shadowBlur=8;ctx.shadowOffsetY=4;if(r.type==='tree')drawTree(r,time);if(r.type==='rock')drawRock(r);if(r.type==='berry')drawBerry(r);ctx.restore()}
    function drawPlot(p,i){if(state.buildings.some(b=>b.plot===i))return;ctx.save();ctx.setLineDash([8,7]);ctx.lineWidth=2;ctx.strokeStyle=buildMode?'rgba(255,255,255,.95)':'rgba(32,89,48,.23)';ctx.fillStyle=buildMode?'rgba(255,255,255,.12)':'rgba(255,255,255,.035)';ctx.beginPath();ctx.ellipse(p.x,p.y,43,28,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.setLineDash([]);if(buildMode){ctx.fillStyle='#fff';ctx.font='900 12px system-ui';ctx.textAlign='center';ctx.fillText('건설',p.x,p.y+4)}ctx.restore()}
    function drawBuilding(b){const p=plots[b.plot],def=BUILDINGS[b.type];ctx.save();ctx.translate(p.x,p.y);ctx.shadowColor='rgba(23,61,43,.25)';ctx.shadowBlur=10;ctx.shadowOffsetY=6;
      if(b.type==='hut'){ctx.fillStyle='#ad7146';ctx.fillRect(-27,-10,54,38);ctx.fillStyle='#e9c574';ctx.beginPath();ctx.moveTo(-35,-9);ctx.lineTo(0,-38);ctx.lineTo(35,-9);ctx.closePath();ctx.fill();ctx.fillStyle='#6b4934';ctx.fillRect(-7,8,14,20)}
      if(b.type==='storage'){ctx.fillStyle='#b58450';ctx.fillRect(-30,-18,60,44);ctx.fillStyle='#6d4d35';ctx.fillRect(-34,-25,68,11);ctx.fillStyle='#efc46b';ctx.fillRect(-3,-18,6,44)}
      if(b.type==='farm'){ctx.fillStyle='#9c6a42';ctx.fillRect(-40,-24,80,52);for(let x=-29;x<=29;x+=14){ctx.strokeStyle='#4c9c50';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x,-16);ctx.lineTo(x,19);ctx.stroke();ctx.fillStyle='#ebcf55';for(let y=-10;y<17;y+=12){ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill()}}}
      if(b.type==='fishery'){ctx.fillStyle='#85573b';ctx.fillRect(-42,6,84,11);for(let x=-34;x<=34;x+=17)ctx.fillRect(x,6,5,25);ctx.strokeStyle='#f2e2bc';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(15,3);ctx.quadraticCurveTo(33,-28,45,-2);ctx.stroke();}
      if(b.type==='shop'){ctx.fillStyle='#e8e0c4';ctx.fillRect(-31,-16,62,43);ctx.fillStyle='#e65a4d';ctx.fillRect(-35,-24,70,13);for(let x=-25;x<30;x+=20){ctx.fillStyle=x%40?'#fff4da':'#e65a4d';ctx.fillRect(x,-24,10,13)}ctx.fillStyle='#77b9ca';ctx.fillRect(-18,-5,16,15);ctx.fillStyle='#724a36';ctx.fillRect(9,1,13,26)}
      if(b.type==='port'){ctx.fillStyle='#8a5a3b';ctx.fillRect(-45,4,90,12);for(let x=-38;x<45;x+=20)ctx.fillRect(x,4,6,28);ctx.fillStyle='#f1f0dc';ctx.beginPath();ctx.moveTo(5,-37);ctx.lineTo(5,3);ctx.lineTo(34,-3);ctx.closePath();ctx.fill();ctx.strokeStyle='#6e4b35';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(3,-39);ctx.lineTo(3,5);ctx.stroke()}
      ctx.restore();ctx.save();ctx.fillStyle='rgba(18,63,49,.72)';roundedRect(p.x-32,p.y+34,64,19,9);ctx.fill();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='800 10px system-ui';ctx.fillText(def.name,p.x,p.y+47);ctx.restore()}
    function drawVillager(v,time){const r=state.residents[v.index];ctx.save();ctx.translate(v.x,v.y+Math.sin(time*4+v.phase)*1.5);ctx.shadowColor='rgba(0,0,0,.18)';ctx.shadowBlur=5;ctx.shadowOffsetY=3;ctx.fillStyle='#f2c58c';ctx.beginPath();ctx.arc(0,-13,8,0,Math.PI*2);ctx.fill();ctx.fillStyle=['#e95e58','#4f9fd9','#7b70c5','#e39a42','#58a86b'][v.index%5];roundedRect(-8,-5,16,21,6);ctx.fill();ctx.fillStyle='#44392f';ctx.fillRect(-7,14,5,8);ctx.fillRect(2,14,5,8);ctx.restore();ctx.fillStyle='rgba(22,65,51,.78)';ctx.font='800 9px system-ui';ctx.textAlign='center';ctx.fillText(`${JOB_ICONS[r.job]} ${r.name}`,v.x,v.y-28)}
    function drawDayOverlay(){
      let a=0,color='0,0,0';if(state.time>.75){a=.32+Math.sin((state.time-.75)/.25*Math.PI)*.15;color='9,25,60'}else if(state.time>.62){a=(state.time-.62)/.13*.16;color='255,119,55'}else if(state.time<.08){a=(.08-state.time)/.08*.22;color='14,35,72'}
      if(a>0){ctx.fillStyle=`rgba(${color},${a})`;ctx.fillRect(0,0,1000,700)}
      if(state.time>.75){ctx.fillStyle='rgba(255,255,220,.8)';for(let i=0;i<18;i++){const x=(i*157)%970+15,y=(i*89)%260+18;ctx.fillRect(x,y,1.5,1.5)}}
    }
    function updateVillagers(dt){villagers.forEach(v=>{const d=Math.hypot(v.tx-v.x,v.ty-v.y);if(d<8){v.tx=300+Math.random()*450;v.ty=255+Math.random()*290}else{v.x+=(v.tx-v.x)/d*v.speed*dt;v.y+=(v.ty-v.y)/d*v.speed*dt}})}
    function frame(now){
      const dt=Math.min(.05,(now-last)/1000);last=now;const gameTime=now/1000;state.time+=dt/150;if(state.time>=1){state.time-=1;state.day++;showToast(`${state.day}일차 아침이 밝았어요.`)}updateVillagers(dt);
      ctx.clearRect(0,0,1000,700);drawWater(gameTime);drawIsland();plots.forEach(drawPlot);resources.forEach(r=>drawResource(r,gameTime));state.buildings.forEach(drawBuilding);villagers.forEach(v=>drawVillager(v,gameTime));drawDayOverlay();
      autosave+=dt;if(autosave>5){autosave=0;save()}requestAnimationFrame(frame)
    }

    // island.html · 시작/주기
    document.querySelector('#startBtn').addEventListener('click',()=>{state.started=true;document.querySelector('#splash').classList.add('hide');save();showToast('섬의 나무나 돌을 눌러 채집해보세요!')});
    setInterval(()=>{productionTick();if(panelName==='explore'&&state.exploreCooldown>0)renderPanel()},1000);
    window.addEventListener('beforeunload',save);
    load();requestAnimationFrame(frame);
  </script>
</body>
</html>
