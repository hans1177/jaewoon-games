name = "jaewoon-multiplayer"
main = "worker.js"
# Free-tier workers.dev endpoint; no paid custom domain or route is required.
workers_dev = true
compatibility_date = "2026-09-05"

[vars]
ALLOWED_ORIGIN = "https://jaewoon-games.pages.dev"
SUPABASE_URL = "https://njpexgqvituaxrjpnqsi.supabase.co"

[[durable_objects.bindings]]
name = "MATCHMAKER"
class_name = "Matchmaker"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Matchmaker", "GameRoom"]
