<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0d1510"><title>거대 곤충 사냥꾼 | 재운게임즈</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08100b;color:#fff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;user-select:none}canvas{position:fixed;inset:0;width:100%;height:100%}.hud{position:fixed;z-index:5;left:0;right:0;top:0;padding:calc(7px + env(safe-area-inset-top)) 9px 6px;display:flex;gap:7px;align-items:center;background:linear-gradient(#071009ee,#071009bb,transparent);pointer-events:none}.back{pointer-events:auto;color:#fff;text-decoration:none;background:#15251a;border:1px solid #436148;border-radius:10px;padding:7px 10px;font-weight:900;font-size:12px}.title{font-weight:1000;font-size:13px}.pill{margin-left:auto;padding:6px 9px;border-radius:10px;background:#102019dd;border:1px solid #38573f;font-size:11px;font-weight:900}.boss{position:fixed;z-index:5;left:50%;top:calc(47px + env(safe-area-inset-top));transform:translateX(-50%);width:min(70vw,520px);display:none}.bossName{text-align:center;font-size:11px;font-weight:1000;text-shadow:0 2px 4px #000}.bar{height:9px;border:1px solid #6c7b68;border-radius:99px;background:#111b13;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff4438,#ff9b3e)}.stats{position:fixed;z-index:5;left:9px;top:calc(48px + env(safe-area-inset-top));min-width:150px;padding:8px 9px;border:1px solid #415c45;border-radius:12px;background:#09150edc;font-size:11px;font-weight:800;line-height:1.45;pointer-events:none}.notice{position:fixed;z-index:7;left:50%;top:23%;transform:translate(-50%,-50%);padding:9px 14px;border-radius:14px;background:#08120dd9;border:1px solid #67846a;font-size:13px;font-weight:1000;opacity:0;transition:.2s;pointer-events:none}.joy{position:fixed;z-index:6;left:22px;bottom:calc(24px + env(safe-area-inset-bottom));width:118px;height:118px;border-radius:50%;border:2px solid #ffffff55;background:#ffffff14}.stick{position:absolute;left:34px;top:34px;width:50px;height:50px;border-radius:50%;background:#ffffff77;border:2px solid #fff8;box-shadow:0 4px 14px #0008}.actions{position:fixed;z-index:6;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));display:grid;grid-template-columns:64px 78px;grid-template-rows:62px 72px;gap:8px;align-items:end}.btn{border:2px solid #ffffff99;border-radius:50%;color:#fff;font-weight:1000;text-shadow:0 2px 4px #000;background:linear-gradient(#72522b,#422f1a);box-shadow:0 7px 15px #0006;font-size:12px}.btn:active{transform:scale(.94)}#attack{grid-row:1/3;grid-column:2;align-self:end;width:78px;height:78px;background:linear-gradient(#c95b36,#72301f)}#dodge{width:62px;height:62px;background:linear-gradient(#3c7f86,#244750)}#skill{width:64px;height:64px;background:linear-gradient(#70408c,#3b234b)}.upgrade{position:fixed;z-index:20;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:#020703d9}.panel{width:min(420px,94vw);padding:20px;border:1px solid #69836a;border-radius:20px;background:#0c1910;box-shadow:0 20px 70px #000a}.panel h2{margin:0 0 4px;font-size:25px}.panel p{margin:0 0 15px;color:#aac0ae;font-size:12px}.choices{display:grid;gap:8px}.choice{padding:13px;border:1px solid #49664e;border-radius:13px;background:linear-gradient(#17301d,#102116);color:#fff;text-align:left;font-weight:900}.choice small{display:block;margin-top:3px;color:#b7caba}.result{position:fixed;z-index:30;inset:0;display:none;align-items:center;justify-content:center;background:#030704dc}.resultBox{padding:28px;border:1px solid #68836c;border-radius:20px;background:#0c1810;text-align:center}.resultBox h1{margin:0 0 8px;font-size:38px}.resultBox button{padding:12px 20px;border:0;border-radius:11px;background:#4a8c54;color:#fff;font-weight:1000}.tip{position:fixed;z-index:4;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:9px;color:#c9d8ccaa;pointer-events:none}@media(max-width:580px){.title{font-size:11px}.pill{font-size:10px}.stats{top:calc(44px + env(safe-area-inset-top));font-size:10px}.joy{width:108px;height:108px;left:16px}.stick{left:31px;top:31px;width:46px;height:46px}.actions{right:12px}.tip{display:none}}</style></head><body>
<canvas id="c"></canvas><div class="hud"><a class="back" href="/">← 대문</a><div class="title">GIANT INSECT HUNTER</div><div class="pill">구역 <span id="zone">1</span>/4 · 부품 <span id="parts">0</span></div></div><div class="stats" id="stats"></div><div class="boss" id="boss"><div class="bossName" id="bossName"></div><div class="bar"><i id="bossHp"></i></div></div><div class="notice" id="notice"></div>
<div class="joy" id="joy"><div class="stick" id="stick"></div></div><div class="actions"><button class="btn" id="dodge">회피</button><button class="btn" id="skill">회전베기</button><button class="btn" id="attack">공격</button></div><div class="tip">왼쪽 조이스틱 이동 · 공격/회피/회전베기</div>
<div class="upgrade" id="upgrade"><div class="panel"><h2>사냥 준비</h2><p id="upgradeText">곤충 부품으로 다음 사냥을 준비하세요.</p><div class="choices"><button class="choice" data-up="dmg">칼날 강화 <small>공격력 +8</small></button><button class="choice" data-up="hp">갑옷 보강 <small>최대 체력 +30 · 즉시 회복</small></button><button class="choice" data-up="speed">신발 강화 <small>이동속도 +12%</small></button></div></div></div><div class="result" id="result"><div class="resultBox"><h1 id="resultTitle">승리!</h1><div id="resultText"></div><button onclick="location.reload()">다시 사냥</button></div></div>
<script>
const c=document.querySelector('#c'),x=c.getContext('2d'),zoneEl=document.querySelector('#zone'),partsEl=document.querySelector('#parts'),statsEl=document.querySelector('#stats'),boss=document.querySelector('#boss'),bossName=document.querySelector('#bossName'),bossHp=document.querySelector('#bossHp'),notice=document.querySelector('#notice'),upgrade=document.querySelector('#upgrade'),result=document.querySelector('#result'),resultTitle=document.querySelector('#resultTitle'),resultText=document.querySelector('#resultText');
let W=innerWidth,H=innerHeight,dpr=1,last=performance.now(),gameOver=false,paused=false,zone=1,parts=0,kills=0,shake=0;function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(2,devicePixelRatio||1);c.width=W*dpr;c.height=H*dpr}addEventListener('resize',resize);resize();
const p={x:W*.5,y:H*.66,r:16,hp:120,maxHp:120,dmg:22,speed:190,dir:-1.57,atk:0,dodge:0,inv:0,skill:0};let enemies=[],slashes=[],particles=[],rings=[];
const zones=[null,{name:'거대 개미 군락',type:'ant',count:7,hp:60,dmg:9,speed:55},{name:'독거미 둥지',type:'spider',count:6,hp:92,dmg:13,speed:68},{name:'황제 전갈 협곡',type:'scorpion',count:5,hp:145,dmg:18,speed:48},{name:'사마귀 왕의 정원',type:'mantis',count:1,hp:650,dmg:27,speed:72,boss:true}];
function enemyData(type){return{ant:{r:17,c:'#8a5b2f',accent:'#c28a4b'},spider:{r:20,c:'#49384d',accent:'#9a6ba2'},scorpion:{r:25,c:'#6e4b2c',accent:'#d08942'},mantis:{r:36,c:'#496e38',accent:'#9bc96a'}}[type]}
function spawnZone(){enemies=[];kills=0;const z=zones[zone];zoneEl.textContent=zone;show(`${zone}구역 · ${z.name}`);for(let i=0;i<z.count;i++){const e=enemyData(z.type),a=Math.random()*Math.PI*2,r=Math.max(W,H)*.35+Math.random()*120;enemies.push({type:z.type,x:W*.5+Math.cos(a)*r,y:H*.48+Math.sin(a)*r*.6,r:e.r,hp:z.hp,maxHp:z.hp,dmg:z.dmg,speed:z.speed,atk:Math.random(),flash:0,dead:false,phase:Math.random()*6.28})}boss.style.display=z.boss?'block':'none';bossName.textContent=z.boss?'사마귀 왕':'';hud()}
function show(t){notice.textContent=t;notice.style.opacity=1;clearTimeout(show.t);show.t=setTimeout(()=>notice.style.opacity=0,1200)}
function hud(){partsEl.textContent=parts;statsEl.innerHTML=`체력 ${Math.max(0,Math.ceil(p.hp))} / ${p.maxHp}<br>공격력 ${p.dmg} · 처치 ${kills}/${zones[zone].count}`;if(zones[zone].boss&&enemies[0])bossHp.style.width=Math.max(0,enemies[0].hp/enemies[0].maxHp*100)+'%'}
function burst(px,py,col,n=9){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=40+Math.random()*150;particles.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.25+Math.random()*.35,r:2+Math.random()*4,c:col})}}
function attack(){if(paused||gameOver||p.atk>0)return;p.atk=.32;slashes.push({x:p.x,y:p.y,a:p.dir,life:.14,r:54});for(const e of enemies)if(!e.dead){const d=Math.hypot(e.x-p.x,e.y-p.y),a=Math.atan2(e.y-p.y,e.x-p.x),diff=Math.abs(Math.atan2(Math.sin(a-p.dir),Math.cos(a-p.dir)));if(d<75&&diff<1.05){e.hp-=p.dmg;e.flash=.1;shake=5;burst(e.x,e.y,'#e8c47e',6);if(e.hp<=0)kill(e)}}hud()}
function spin(){if(paused||gameOver||p.skill>0)return;p.skill=5;rings.push({x:p.x,y:p.y,life:.32,r:15});for(const e of enemies)if(!e.dead&&Math.hypot(e.x-p.x,e.y-p.y)<105){e.hp-=p.dmg*1.7;e.flash=.12;burst(e.x,e.y,'#c184ff',10);if(e.hp<=0)kill(e)}show('회전베기!');hud()}
function dodge(){if(paused||gameOver||p.dodge>0)return;p.dodge=1.1;p.inv=.42;p.x+=Math.cos(p.dir)*65;p.y+=Math.sin(p.dir)*65;burst(p.x,p.y,'#8de8e3',12)}
function kill(e){if(e.dead)return;e.dead=true;kills++;parts+=e.type==='mantis'?8:e.type==='scorpion'?3:e.type==='spider'?2:1;burst(e.x,e.y,e.type==='mantis'?'#b7ff7b':'#ffb35f',20);if(kills>=zones[zone].count)setTimeout(clearZone,550)}
function clearZone(){if(gameOver)return;if(zone===4){gameOver=true;result.style.display='flex';resultTitle.textContent='사냥 완료!';resultText.textContent=`사마귀 왕까지 처치했습니다. 총 곤충 부품 ${parts}개 획득.`;return}paused=true;upgrade.style.display='flex';document.querySelector('#upgradeText').textContent=`${zones[zone].name} 정리 완료 · 부품 ${parts}개`;}
document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(b.dataset.up==='dmg')p.dmg+=8;if(b.dataset.up==='hp'){p.maxHp+=30;p.hp=p.maxHp}if(b.dataset.up==='speed')p.speed*=1.12;parts+=2;zone++;upgrade.style.display='none';paused=false;spawnZone()});
document.querySelector('#attack').addEventListener('pointerdown',attack);document.querySelector('#skill').addEventListener('pointerdown',spin);document.querySelector('#dodge').addEventListener('pointerdown',dodge);
let joyId=null,jx=0,jy=0;const joy=document.querySelector('#joy'),stick=document.querySelector('#stick');function joyMove(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,m=Math.hypot(dx,dy),lim=r.width*.34,k=Math.min(1,lim/(m||1));jx=dx/lim*k;jy=dy/lim*k;stick.style.transform=`translate(${jx*lim}px,${jy*lim}px)`;if(Math.hypot(jx,jy)>.15)p.dir=Math.atan2(jy,jx)}joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(e.pointerId);joyMove(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)joyMove(e)});function joyEnd(e){if(e.pointerId!==joyId)return;joyId=null;jx=jy=0;stick.style.transform=''}joy.addEventListener('pointerup',joyEnd);joy.addEventListener('pointercancel',joyEnd);
function update(dt){if(paused||gameOver)return;p.atk=Math.max(0,p.atk-dt);p.dodge=Math.max(0,p.dodge-dt);p.inv=Math.max(0,p.inv-dt);p.skill=Math.max(0,p.skill-dt);const m=Math.hypot(jx,jy);if(m>.08){p.x+=jx*p.speed*dt;p.y+=jy*p.speed*dt}p.x=Math.max(22,Math.min(W-22,p.x));p.y=Math.max(75,Math.min(H-22,p.y));for(const e of enemies){if(e.dead)continue;e.flash=Math.max(0,e.flash-dt);e.atk-=dt;const dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1,a=Math.atan2(dy,dx);if(d>e.r+p.r+5){e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt}else if(e.atk<=0){e.atk=e.type==='mantis'?.72:e.type==='spider'?.9:1.05;if(p.inv<=0){p.hp-=e.dmg;p.inv=.34;shake=8;burst(p.x,p.y,'#ff6356',12);if(p.hp<=0){p.hp=0;gameOver=true;result.style.display='flex';resultTitle.textContent='사냥 실패';resultText.textContent=`${zone}구역에서 쓰러졌습니다.`}}}if(e.type==='spider'){e.x+=Math.cos(performance.now()/500+e.phase)*12*dt;e.y+=Math.sin(performance.now()/500+e.phase)*12*dt}if(e.type==='mantis'&&Math.random()<dt*.7){e.x+=Math.cos(a)*75*dt;e.y+=Math.sin(a)*75*dt}}slashes.forEach(s=>s.life-=dt);slashes=slashes.filter(s=>s.life>0);rings.forEach(r=>{r.life-=dt;r.r+=260*dt});rings=rings.filter(r=>r.life>0);particles.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.96;q.vy*=.96;q.life-=dt});particles=particles.filter(q=>q.life>0);shake*=.86;hud()}
function bg(){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#15251a');g.addColorStop(1,'#08100b');x.fillStyle=g;x.fillRect(0,0,W,H);x.strokeStyle='#6b8b6814';x.lineWidth=1;for(let i=0;i<32;i++){const yy=(i*57+performance.now()/80)%H;x.beginPath();x.moveTo(0,yy);x.quadraticCurveTo(W*.5,yy+18*Math.sin(i),W,yy);x.stroke()}for(let i=0;i<20;i++){const px=(i*131)%W,py=(i*83)%H;x.fillStyle=i%2?'#2c462d55':'#42593644';x.beginPath();x.arc(px,py,8+(i%5)*3,0,6.28);x.fill()}}
function drawEnemy(e){const d=enemyData(e.type);x.save();x.translate(e.x,e.y);const ang=Math.atan2(p.y-e.y,p.x-e.x);x.rotate(ang);x.shadowBlur=12;x.shadowColor=d.accent;x.fillStyle=e.flash?'#fff':d.c;x.strokeStyle=d.accent;x.lineWidth=3;if(e.type==='ant'){for(const sy of[-12,0,12])for(const s of[-1,1]){x.beginPath();x.moveTo(s*5,sy);x.lineTo(s*25,sy+s*7);x.stroke()}[[-13,0,10],[5,0,12],[22,0,9]].forEach(v=>{x.beginPath();x.ellipse(v[0],v[1],v[2],v[2]*.72,0,0,6.28);x.fill()})}else if(e.type==='spider'){for(let i=0;i<8;i++){const a=(i/8)*6.28;x.beginPath();x.moveTo(Math.cos(a)*8,Math.sin(a)*8);x.lineTo(Math.cos(a)*31,Math.sin(a)*23);x.stroke()}x.beginPath();x.arc(0,0,18,0,6.28);x.fill();x.fillStyle='#e46c61';x.fillRect(10,-8,4,4);x.fillRect(10,4,4,4)}else if(e.type==='scorpion'){for(let i=0;i<6;i++){x.beginPath();x.moveTo(-8,(i-2.5)*7);x.lineTo(-27,(i-2.5)*10);x.stroke()}x.beginPath();x.ellipse(0,0,22,16,0,0,6.28);x.fill();x.lineWidth=6;x.beginPath();x.moveTo(-18,0);x.quadraticCurveTo(-42,-25,-25,-43);x.stroke();x.fillStyle=d.accent;x.beginPath();x.arc(-23,-45,6,0,6.28);x.fill()}else{x.lineWidth=5;for(const s of[-1,1]){x.beginPath();x.moveTo(-6,s*8);x.lineTo(-30,s*26);x.stroke();x.beginPath();x.moveTo(6,s*8);x.lineTo(34,s*28);x.stroke()}x.beginPath();x.ellipse(0,0,17,35,0,0,6.28);x.fill();x.lineWidth=8;x.beginPath();x.moveTo(16,-10);x.lineTo(44,-27);x.moveTo(16,10);x.lineTo(44,27);x.stroke()}x.restore();if(e.hp<e.maxHp){x.fillStyle='#111b12';x.fillRect(e.x-e.r,e.y-e.r-12,e.r*2,5);x.fillStyle='#ef6556';x.fillRect(e.x-e.r,e.y-e.r-12,e.r*2*(e.hp/e.maxHp),5)}}
function draw(){x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);x.save();x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);bg();for(const e of enemies)if(!e.dead)drawEnemy(e);for(const s of slashes){x.strokeStyle=`rgba(255,238,180,${s.life/.14})`;x.lineWidth=9;x.beginPath();x.arc(s.x,s.y,s.r,s.a-.85,s.a+.85);x.stroke()}for(const r of rings){x.strokeStyle=`rgba(194,119,255,${r.life/.32})`;x.lineWidth=7;x.beginPath();x.arc(r.x,r.y,r.r,0,6.28);x.stroke()}for(const q of particles){x.globalAlpha=Math.min(1,q.life*3);x.fillStyle=q.c;x.beginPath();x.arc(q.x,q.y,q.r,0,6.28);x.fill()}x.globalAlpha=1;x.save();x.translate(p.x,p.y);x.rotate(p.dir);x.shadowBlur=14;x.shadowColor=p.inv?'#8ff4ff':'#f1ca7a';x.fillStyle=p.inv?'#b9f8ff':'#e9d4a5';x.beginPath();x.arc(0,0,p.r,0,6.28);x.fill();x.fillStyle='#5d3f2c';x.fillRect(-8,-5,16,15);x.strokeStyle='#e8edf0';x.lineWidth=5;x.beginPath();x.moveTo(8,0);x.lineTo(34,0);x.stroke();x.strokeStyle='#754a25';x.lineWidth=6;x.beginPath();x.moveTo(5,0);x.lineTo(13,0);x.stroke();x.restore();x.fillStyle='#07100acc';x.fillRect(p.x-28,p.y-31,56,6);x.fillStyle=p.hp/p.maxHp>.4?'#5edd72':'#ff6255';x.fillRect(p.x-28,p.y-31,56*Math.max(0,p.hp/p.maxHp),6);x.restore()}
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}p.x=W*.5;p.y=H*.66;spawnZone();requestAnimationFrame(loop);
</script></body></html>
