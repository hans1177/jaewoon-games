<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0b130d"><title>99일 숲 생존 | 재운게임즈</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071008;color:#fff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;user-select:none}canvas{position:fixed;inset:0;width:100%;height:100%}.hud{position:fixed;z-index:6;left:0;right:0;top:0;display:flex;align-items:center;gap:7px;padding:calc(7px + env(safe-area-inset-top)) 8px 7px;background:linear-gradient(#061008f2,#061008b8,transparent);pointer-events:none}.back{pointer-events:auto;text-decoration:none;color:#fff;background:#162319;border:1px solid #435847;border-radius:10px;padding:7px 9px;font-weight:900;font-size:11px}.title{font-size:12px;font-weight:1000}.day{margin-left:auto;padding:6px 9px;border-radius:10px;background:#122019dd;border:1px solid #42584a;font-size:11px;font-weight:1000}.panel{position:fixed;z-index:6;left:8px;top:calc(48px + env(safe-area-inset-top));min-width:154px;padding:8px 9px;border-radius:12px;background:#07120bdc;border:1px solid #3d5142;font-size:10px;font-weight:850;line-height:1.48;pointer-events:none}.fireBox{position:fixed;z-index:6;left:50%;top:calc(48px + env(safe-area-inset-top));transform:translateX(-50%);width:min(280px,50vw);pointer-events:none}.fireName{text-align:center;font-size:10px;font-weight:1000;text-shadow:0 2px 4px #000}.bar{height:8px;border-radius:99px;overflow:hidden;border:1px solid #546353;background:#101711}.bar i{display:block;width:100%;height:100%;background:linear-gradient(90deg,#ff6a35,#ffd058)}.notice{position:fixed;z-index:20;left:50%;top:22%;transform:translate(-50%,-50%);padding:9px 14px;border:1px solid #6c806d;border-radius:12px;background:#08130bdd;font-size:12px;font-weight:1000;opacity:0;transition:.18s;pointer-events:none}.joy{position:fixed;z-index:8;left:18px;bottom:calc(20px + env(safe-area-inset-bottom));width:112px;height:112px;border:2px solid #ffffff45;border-radius:50%;background:#ffffff12}.stick{position:absolute;left:32px;top:32px;width:48px;height:48px;border:2px solid #ffffff77;border-radius:50%;background:#ffffff55}.actions{position:fixed;z-index:8;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));display:grid;grid-template-columns:60px 76px;grid-template-rows:60px 72px;gap:7px;align-items:end}.btn{border:2px solid #ffffff8a;border-radius:50%;color:#fff;font-weight:1000;text-shadow:0 2px 4px #000;box-shadow:0 6px 14px #0006}.btn:active{transform:scale(.94)}#attack{grid-row:1/3;grid-column:2;width:76px;height:76px;background:linear-gradient(#b34f2e,#662d1c)}#interact{width:60px;height:60px;background:linear-gradient(#4f7d43,#294726);font-size:10px}#dodge{width:60px;height:60px;background:linear-gradient(#355f7a,#1c3949);font-size:10px}.craft{position:fixed;z-index:9;right:14px;top:calc(56px + env(safe-area-inset-top));display:grid;gap:6px}.small{min-width:98px;padding:8px 10px;border:1px solid #526454;border-radius:10px;background:#101d14e8;color:#fff;font-size:10px;font-weight:900}.small:active{transform:scale(.97)}.tip{position:fixed;z-index:4;left:50%;bottom:8px;transform:translateX(-50%);font-size:9px;color:#d2dfd4a8;pointer-events:none}.result{position:fixed;z-index:40;inset:0;display:none;align-items:center;justify-content:center;background:#020703e6}.resultBox{width:min(420px,88vw);padding:24px;border:1px solid #667568;border-radius:20px;background:#0b160e;text-align:center}.resultBox h1{margin:0 0 8px;font-size:34px}.resultBox p{margin:0;color:#c8d6ca;font-size:12px;line-height:1.6}.resultBox button{margin-top:15px;padding:11px 18px;border:0;border-radius:10px;background:#4f8058;color:#fff;font-weight:1000}@media(max-width:560px){.title{font-size:10px}.panel{top:calc(44px + env(safe-area-inset-top));font-size:9px;min-width:138px}.fireBox{top:calc(44px + env(safe-area-inset-top));width:42vw}.craft{top:calc(48px + env(safe-area-inset-top));right:7px}.small{min-width:88px;font-size:9px;padding:7px 8px}.joy{left:12px;width:104px;height:104px}.stick{left:29px;top:29px;width:46px;height:46px}.actions{right:10px}.tip{display:none}}</style></head><body>
<canvas id="c"></canvas><div class="hud"><a class="back" href="/">← 대문</a><div class="title">FOREST · 99 DAYS</div><div class="day"><span id="phase">낮</span> · DAY <span id="day">1</span>/99</div></div><div class="panel" id="stats"></div><div class="fireBox"><div class="fireName">🔥 캠프파이어 Lv.<span id="fireLv">1</span></div><div class="bar"><i id="fireBar"></i></div></div><div class="notice" id="notice"></div><div class="craft"><button class="small" id="feed">🔥 장작 넣기</button><button class="small" id="craftSpear">🗡 창 제작</button><button class="small" id="cook">🍖 고기 굽기</button></div><div class="joy" id="joy"><div class="stick" id="stick"></div></div><div class="actions"><button class="btn" id="dodge">회피</button><button class="btn" id="attack">공격</button><button class="btn" id="interact">채집/구조</button></div><div class="tip">낮에는 탐험 · 밤에는 캠프파이어 근처로 복귀</div><div class="result" id="result"><div class="resultBox"><h1 id="resultTitle"></h1><p id="resultText"></p><button onclick="location.reload()">다시 하기</button></div></div>
<script>
const c=document.querySelector('#c'),ctx=c.getContext('2d'),stats=document.querySelector('#stats'),phaseEl=document.querySelector('#phase'),dayEl=document.querySelector('#day'),fireLvEl=document.querySelector('#fireLv'),fireBar=document.querySelector('#fireBar'),notice=document.querySelector('#notice'),result=document.querySelector('#result'),resultTitle=document.querySelector('#resultTitle'),resultText=document.querySelector('#resultText');
const W=1800,H=1200,camp={x:900,y:600,r:110};let dpr=1,scale=1,camX=0,camY=0,last=performance.now(),day=1,time=0,phase='day',phaseLen=42,gameOver=false,flash=0,shake=0;
const p={x:900,y:690,r:18,hp:100,maxHp:100,hunger:100,wood:0,meat:0,scrap:0,spear:false,dmg:12,speed:180,inv:0,ifr:0,attackCd:0,dodgeCd:0,children:0};
let fire={fuel:72,max:100,level:1},trees=[],animals=[],monsters=[],kids=[],drops=[],particles=[];const rand=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){dpr=Math.min(2,devicePixelRatio||1);c.width=innerWidth*dpr;c.height=innerHeight*dpr;scale=Math.min(innerWidth/900,innerHeight/600)}addEventListener('resize',resize);resize();
function makeWorld(){trees=[];for(let i=0;i<125;i++){const a=rand(0,6.283),r=rand(180,850);trees.push({x:camp.x+Math.cos(a)*r,y:camp.y+Math.sin(a)*r,hp:30,cut:false})}kids=[{x:250,y:230,rescued:false},{x:1540,y:260,rescued:false},{x:320,y:1010,rescued:false},{x:1510,y:980,rescued:false}];spawnDayAnimals()}makeWorld();
function spawnDayAnimals(){animals=[];const count=4+Math.min(6,Math.floor(day/12));for(let i=0;i<count;i++){const bear=day>18&&Math.random()<.28;animals.push({type:bear?'bear':'wolf',x:rand(120,W-120),y:rand(120,H-120),hp:bear?95:42,maxHp:bear?95:42,dmg:bear?18:9,r:bear?27:19,speed:bear?52:72,cd:rand(0,.8),dead:false})}}
function spawnNight(){monsters=[];const n=1+Math.min(7,Math.floor(day/8));for(let i=0;i<n;i++){const a=rand(0,6.283),r=rand(700,850);monsters.push({x:camp.x+Math.cos(a)*r,y:camp.y+Math.sin(a)*r,hp:80+day*2,maxHp:80+day*2,dmg:12+day*.25,r:24,speed:58+Math.min(35,day*.4),cd:0,dead:false})}}
function say(t){notice.textContent=t;notice.style.opacity=1;clearTimeout(say.t);say.t=setTimeout(()=>notice.style.opacity=0,1200)}
function phaseChange(){if(phase==='day'){phase='night';phaseLen=30;phaseEl.textContent='밤';spawnNight();say('🌙 밤이 시작됐다! 캠프파이어를 지켜!')}else{phase='day';day++;dayEl.textContent=day;phaseLen=42;spawnDayAnimals();say('☀️ 아침이 밝았다');if(day>99)return end(true)}}
function end(win){gameOver=true;result.style.display='flex';resultTitle.textContent=win?'99일 생존 성공!':'생존 실패';resultText.textContent=win?'숲에서 99일을 버티고 구조된 아이들과 함께 살아남았다.':'DAY '+day+'에서 쓰러졌다.'}
function attack(){if(gameOver||p.attackCd>0)return;p.attackCd=p.spear?.42:.6;const range=p.spear?82:58,targets=[...animals,...monsters].filter(e=>!e.dead&&dist(p,e)<range);targets.forEach(e=>{e.hp-=p.dmg+(p.spear?10:0);for(let i=0;i<5;i++)particles.push({x:e.x,y:e.y,vx:rand(-90,90),vy:rand(-90,90),life:.22,r:rand(2,5),c:'#ffd27a'});if(e.hp<=0){e.dead=true;p.meat+=e.type==='bear'?3:1;p.scrap+=Math.random()<.25?1:0;say((e.type==='bear'?'곰':'늑대/괴물')+' 처치!')}});shake=5}
function interact(){if(gameOver)return;let near=trees.find(t=>!t.cut&&dist(p,t)<62);if(near){near.hp-=15;if(near.hp<=0){near.cut=true;p.wood+=3;say('🪵 나무 +3')}else say('도끼질...');return}let k=kids.find(k=>!k.rescued&&dist(p,k)<70);if(k){k.rescued=true;p.children++;fire.max+=15;p.maxHp+=10;p.hp=p.maxHp;say('🧒 아이 구조! 생존력이 증가했다');return}if(dist(p,camp)<125&&p.hunger<95&&p.meat>0){p.meat--;p.hunger=clamp(p.hunger+38,0,100);p.hp=clamp(p.hp+16,0,p.maxHp);say('🍖 식사 완료')}}
document.querySelector('#attack').onclick=attack;document.querySelector('#interact').onclick=interact;document.querySelector('#dodge').onclick=()=>{if(p.dodgeCd>0)return;p.dodgeCd=2.2;p.ifr=.45;p.speed=320;setTimeout(()=>p.speed=180,260);say('회피!')};document.querySelector('#feed').onclick=()=>{if(p.wood<=0)return say('장작이 없다');p.wood--;fire.fuel=clamp(fire.fuel+24,0,fire.max);if(fire.fuel>=fire.max*.96&&fire.level<8){fire.level++;fire.max+=20;fire.fuel=fire.max;camp.r+=8;say('🔥 캠프파이어 레벨 '+fire.level)}else say('🔥 장작 투입')};document.querySelector('#craftSpear').onclick=()=>{if(p.spear)return say('이미 창이 있다');if(p.wood<6||p.scrap<1)return say('필요: 나무6 + 고철1');p.wood-=6;p.scrap--;p.spear=true;say('🗡 사냥창 제작 완료')};document.querySelector('#cook').onclick=()=>{if(p.meat<=0)return say('고기가 없다');if(dist(p,camp)>150)return say('캠프파이어 근처에서 가능');p.meat--;p.hunger=clamp(p.hunger+45,0,100);p.hp=clamp(p.hp+22,0,p.maxHp);say('🍖 구운 고기 먹음')};
let joy={id:null,dx:0,dy:0};const joyEl=document.querySelector('#joy'),stick=document.querySelector('#stick');function joyMove(x,y){const r=joyEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=x-cx,dy=y-cy,m=Math.hypot(dx,dy),lim=r.width*.34;if(m>lim){dx=dx/m*lim;dy=dy/m*lim}joy.dx=dx/lim;joy.dy=dy/lim;stick.style.transform=`translate(${dx}px,${dy}px)`}joyEl.onpointerdown=e=>{joy.id=e.pointerId;joyEl.setPointerCapture(e.pointerId);joyMove(e.clientX,e.clientY)};joyEl.onpointermove=e=>{if(e.pointerId===joy.id)joyMove(e.clientX,e.clientY)};function joyEnd(e){if(e.pointerId!==joy.id)return;joy.id=null;joy.dx=joy.dy=0;stick.style.transform=''}joyEl.onpointerup=joyEnd;joyEl.onpointercancel=joyEnd;
function damagePlayer(d){if(p.ifr>0)return;p.hp-=d;p.ifr=.5;flash=.13;shake=9;if(p.hp<=0)end(false)}
function update(dt){if(gameOver)return;time+=dt;if(time>=phaseLen){time=0;phaseChange()}p.attackCd=Math.max(0,p.attackCd-dt);p.dodgeCd=Math.max(0,p.dodgeCd-dt);p.ifr=Math.max(0,p.ifr-dt);p.hunger=Math.max(0,p.hunger-dt*(phase==='night'?.7:.42));if(p.hunger<=0)p.hp-=dt*3;const m=Math.hypot(joy.dx,joy.dy);if(m>.08){p.x+=joy.dx*p.speed*dt;p.y+=joy.dy*p.speed*dt}p.x=clamp(p.x,30,W-30);p.y=clamp(p.y,30,H-30);fire.fuel-=dt*(phase==='night'?1.15:.32);fire.fuel=Math.max(0,fire.fuel);if(fire.fuel<=0&&phase==='night'&&dist(p,camp)<camp.r+70)p.hp-=dt*2.5;
for(const e of animals){if(e.dead)continue;e.cd=Math.max(0,e.cd-dt);const d=dist(e,p);if(d<220){const a=Math.atan2(p.y-e.y,p.x-e.x);if(d>e.r+p.r+6){e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt}else if(e.cd<=0){e.cd=e.type==='bear'?1.3:.9;damagePlayer(e.dmg)}}}
for(const e of monsters){if(e.dead)continue;e.cd=Math.max(0,e.cd-dt);let target=p;if(fire.fuel>0&&dist(e,camp)<camp.r+65&&dist(p,camp)>camp.r+85)target=camp;const d=Math.hypot(target.x-e.x,target.y-e.y),a=Math.atan2(target.y-e.y,target.x-e.x);if(d>42){e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt}else if(target===p&&e.cd<=0){e.cd=1;damagePlayer(e.dmg)}}animals=animals.filter(e=>!e.dead);monsters=monsters.filter(e=>!e.dead);for(const q of particles){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.95;q.vy*=.95;q.life-=dt}particles=particles.filter(q=>q.life>0);flash=Math.max(0,flash-dt);shake=Math.max(0,shake-dt*20);if(p.hp<=0)end(false);hud()}
function hud(){stats.innerHTML=`❤️ ${Math.ceil(p.hp)}/${p.maxHp}<br>🍗 배고픔 ${Math.ceil(p.hunger)}<br>🪵 나무 ${p.wood} · 🥩 고기 ${p.meat}<br>🔩 고철 ${p.scrap} · 🧒 구조 ${p.children}/4<br>무기 ${p.spear?'사냥창':'맨손'}`;fireLvEl.textContent=fire.level;fireBar.style.width=(fire.fuel/fire.max*100)+'%';phaseEl.textContent=phase==='day'?'낮':'밤'}
function drawTree(t){if(t.cut)return;ctx.save();ctx.translate(t.x,t.y);ctx.fillStyle='#60452d';ctx.fillRect(-7,5,14,34);ctx.fillStyle='#1d572b';ctx.beginPath();ctx.arc(0,-9,29,0,6.283);ctx.arc(-17,4,22,0,6.283);ctx.arc(18,3,23,0,6.283);ctx.fill();ctx.restore()}
function draw(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,innerWidth,innerHeight);camX=clamp(p.x-innerWidth/(2*scale),0,W-innerWidth/scale);camY=clamp(p.y-innerHeight/(2*scale),0,H-innerHeight/scale);const sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;ctx.save();ctx.translate(sx,sy);ctx.scale(scale,scale);ctx.translate(-camX,-camY);ctx.fillStyle=phase==='day'?'#15381f':'#07120b';ctx.fillRect(0,0,W,H);ctx.fillStyle=phase==='day'?'#244d2d':'#0c2111';for(let i=0;i<70;i++){const x=(i*257)%W,y=(i*149)%H;ctx.beginPath();ctx.arc(x,y,rand(12,28),0,6.283);ctx.fill()}trees.forEach(drawTree);
ctx.save();ctx.translate(camp.x,camp.y);ctx.fillStyle=fire.fuel>0?'#342417':'#181713';ctx.beginPath();ctx.arc(0,0,camp.r,0,6.283);ctx.fill();ctx.strokeStyle=fire.fuel>0?'#f3a64b55':'#7775';ctx.lineWidth=4;ctx.stroke();ctx.fillStyle='#5c4531';ctx.fillRect(-32,9,64,10);ctx.save();ctx.rotate(.8);ctx.fillRect(-32,9,64,10);ctx.restore();if(fire.fuel>0){ctx.shadowBlur=35;ctx.shadowColor='#ff7a32';ctx.fillStyle='#ff9b3d';ctx.beginPath();ctx.moveTo(0,-38);ctx.quadraticCurveTo(29,-4,0,25);ctx.quadraticCurveTo(-28,-4,0,-38);ctx.fill();ctx.fillStyle='#ffe36b';ctx.beginPath();ctx.moveTo(0,-24);ctx.quadraticCurveTo(14,-2,0,16);ctx.quadraticCurveTo(-12,-2,0,-24);ctx.fill()}ctx.restore();
kids.forEach(k=>{if(k.rescued)return;ctx.fillStyle='#f2c88c';ctx.beginPath();ctx.arc(k.x,k.y-9,11,0,6.283);ctx.fill();ctx.fillStyle='#6ca7e8';ctx.fillRect(k.x-10,k.y+1,20,24);ctx.fillStyle='#fff';ctx.font='bold 12px sans-serif';ctx.fillText('구조',k.x-13,k.y-24)});
for(const e of animals){ctx.save();ctx.translate(e.x,e.y);ctx.fillStyle=e.type==='bear'?'#6f4b35':'#6a6d72';ctx.beginPath();ctx.arc(0,0,e.r,0,6.283);ctx.fill();ctx.fillStyle='#e9dbc4';ctx.beginPath();ctx.arc(e.r*.35,-e.r*.2,e.r*.25,0,6.283);ctx.fill();ctx.restore()}for(const e of monsters){ctx.save();ctx.translate(e.x,e.y);ctx.shadowBlur=18;ctx.shadowColor='#96d66c';ctx.fillStyle='#162017';ctx.beginPath();ctx.arc(0,0,e.r,0,6.283);ctx.fill();ctx.fillStyle='#d6ff7a';ctx.beginPath();ctx.arc(-8,-4,4,0,6.283);ctx.arc(8,-4,4,0,6.283);ctx.fill();ctx.restore()}
ctx.save();ctx.translate(p.x,p.y);ctx.fillStyle=p.ifr>0?'#ffffffaa':'#d7b783';ctx.beginPath();ctx.arc(0,-8,12,0,6.283);ctx.fill();ctx.fillStyle='#3d6a45';ctx.fillRect(-12,4,24,28);if(p.spear){ctx.strokeStyle='#d8c18a';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(8,10);ctx.lineTo(42,-12);ctx.stroke();ctx.fillStyle='#b8c7cf';ctx.beginPath();ctx.moveTo(42,-12);ctx.lineTo(31,-10);ctx.lineTo(38,-2);ctx.fill()}ctx.restore();for(const q of particles){ctx.globalAlpha=Math.max(0,q.life*4);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,6.283);ctx.fill()}ctx.globalAlpha=1;if(phase==='night'){const g=ctx.createRadialGradient(p.x,p.y,60,p.x,p.y,290);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.65,'rgba(0,0,0,.25)');g.addColorStop(1,'rgba(0,0,0,.78)');ctx.fillStyle=g;ctx.fillRect(camX,camY,innerWidth/scale,innerHeight/scale)}ctx.restore();if(flash){ctx.fillStyle=`rgba(255,35,20,${flash*2.5})`;ctx.fillRect(0,0,innerWidth,innerHeight)}}
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}hud();requestAnimationFrame(loop);
</script></body></html>
