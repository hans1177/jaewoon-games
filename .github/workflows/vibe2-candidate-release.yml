  roblox-package:
    needs: inspect
    if: needs.inspect.outputs.decision == 'roblox'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GAME_ID: ${{ needs.inspect.outputs.game_id }}
      SOURCE_ROOT: ${{ needs.inspect.outputs.source_root }}
      CANDIDATE_SHA: ${{ needs.inspect.outputs.candidate_sha }}
      PRODUCTION_CLASS: ${{ needs.inspect.outputs.production_class }}
      BASE_SHA: ${{ needs.inspect.outputs.base_sha }}
      BUILD_UP_ASSET_FINGERPRINT: ${{ needs.inspect.outputs.asset_source_usage_fingerprint }}
      BUILD_UP_ASSET_LIBRARY_VERSION: ${{ needs.inspect.outputs.asset_source_usage_library_version }}
      BUILD_UP_SELECTION_FINGERPRINT: ${{ needs.inspect.outputs.asset_selection_fingerprint }}
      BUILD_UP_SELECTION_LIBRARY_VERSION: ${{ needs.inspect.outputs.asset_selection_library_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.inspect.outputs.control_sha }}
          fetch-depth: 1
          fetch-tags: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated candidate build inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GAME_ID" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_ROOT" = "roblox-games/$GAME_ID"
          git fetch --no-tags --depth=1 origin "$CANDIDATE_SHA" "$BASE_SHA" +refs/heads/company-runtime:refs/remotes/origin/company-runtime --quiet
          mkdir -p /tmp/roblox-candidate/context /tmp/roblox-candidate/package/packages /tmp/roblox-candidate/package/results
          git show origin/company-runtime:development-queue.json > /tmp/roblox-candidate/runtime.json
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const q=JSON.parse(fs.readFileSync('/tmp/roblox-candidate/runtime.json','utf8'));
          const old=q.items.find(x=>x.gameId===process.env.GAME_ID);
          if(!old)throw Error('candidate game missing from canonical queue');
          const baselinePath=String(old.designBaselineSource||'');
          if(!baselinePath||baselinePath.includes('..'))throw Error('canonical design baseline missing');
          const baseline=JSON.parse(cp.execFileSync('git',['show','origin/company-runtime:'+baselinePath],{encoding:'utf8'}));
          fs.writeFileSync('/tmp/roblox-candidate/baseline.json',JSON.stringify(baseline));
          const item={gameId:old.gameId,status:'ACTIVE',productionClass:process.env.PRODUCTION_CLASS,selectedPlatform:old.selectedPlatform,targetPlatform:old.targetPlatform,platformExecutionMode:old.platformExecutionMode,concurrentTargetPlatforms:old.concurrentTargetPlatforms,designBaselineSource:baselinePath,robloxSourceCommit:process.env.CANDIDATE_SHA,robloxProjectPath:process.env.SOURCE_ROOT,robloxInternalVibePlayEvidence:old.robloxInternalVibePlayEvidence||null,robloxBuildUpAssetSourceUsageFingerprint:process.env.BUILD_UP_ASSET_FINGERPRINT,robloxBuildUpAssetSourceUsageLibraryVersion:Number(process.env.BUILD_UP_ASSET_LIBRARY_VERSION||0)};
          fs.writeFileSync('/tmp/roblox-candidate/context/development-queue.json',JSON.stringify({items:[item]}));
          let launch;
          try{launch=JSON.parse(cp.execFileSync('git',['show',process.env.CANDIDATE_SHA+':'+process.env.SOURCE_ROOT+'/launch-mvp.json'],{encoding:'utf8',stdio:['ignore','pipe','ignore']}));}
          catch{launch={launchCore:[JSON.stringify(baseline)]};}
          launch.launchCore=[...(Array.isArray(launch.launchCore)?launch.launchCore:[]),'mobile UI, loading, lobby, tutorial, objective, retry, multiplayer sync, late join'];
          fs.writeFileSync('/tmp/roblox-candidate/context/launch-mvp.json',JSON.stringify(launch));
          NODE
      - name: Install pinned build and source validation tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rojo-bin /tmp/luau-bin
          curl -fsSL --retry 3 -o /tmp/rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip
          echo '22503e5839864f9d7c2171c48b536fc229f2cc4d8774c9cc149f60941d864073  /tmp/rojo.zip' | sha256sum -c -
          unzip -q /tmp/rojo.zip -d /tmp/rojo-bin
          curl -fsSL --retry 3 -o /tmp/luau.zip https://github.com/luau-lang/luau/releases/download/0.739/luau-ubuntu.zip
          echo '8a9b4b381021722c82d6e6cda0964b5c9e7f354ec1035fcd8b657acc22e49247  /tmp/luau.zip' | sha256sum -c -
          unzip -q /tmp/luau.zip -d /tmp/luau-bin
          chmod +x /tmp/rojo-bin/rojo /tmp/luau-bin/luau-compile /tmp/luau-bin/luau-ast
          VIBE2_LUAU_COMPILER=/tmp/luau-bin/luau-compile node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          import {validateCandidateSyntax} from './tools/vibe2-source-worker.mjs';
          const {BASE_SHA:base,CANDIDATE_SHA:head,SOURCE_ROOT:root}=process.env;
          const files=execFileSync('git',['diff','--name-only','--no-renames','-z',base,head,'--',root],{encoding:'utf8'}).split('\0').filter(file=>/\.(?:lua|luau)$/i.test(file));
          const baseline=fs.mkdtempSync(path.join(os.tmpdir(),'vibe2-release-source-'));
          try{
            const candidate={edits:[],newFiles:[],replaceFiles:[]};
            for(const file of files){
              if(!file.startsWith(root+'/'))throw Error('candidate-source-boundary-invalid');
              const relative=file.slice(root.length+1);
              const before=execFileSync('git',['ls-tree','--name-only',base,'--',file],{encoding:'utf8'}).trim();
              if(before){
                const original=path.join(baseline,relative);
                fs.mkdirSync(path.dirname(original),{recursive:true});
                fs.writeFileSync(original,execFileSync('git',['show',base+':'+file]));
              }
              const after=execFileSync('git',['ls-tree','--name-only',head,'--',file],{encoding:'utf8'}).trim();
              candidate.replaceFiles.push({path:relative,content:after?execFileSync('git',['show',head+':'+file],{encoding:'utf8'}):''});
            }
            const result=validateCandidateSyntax({candidate,sourceRoot:baseline,target:'roblox',luauCompiler:process.env.VIBE2_LUAU_COMPILER});
            console.log('VIBE2_CANDIDATE_SOURCE_CHANGE='+JSON.stringify({baseSha:base,candidateSha:head,...result}));
          }finally{fs.rmSync(baseline,{recursive:true,force:true});}
          NODE
      - name: Build candidate package before runtime verification
        shell: bash
        run: |
          set -euo pipefail
          node tools/company-development-roblox-package.mjs --repo-root=. --game-id="$GAME_ID" --source-path="$SOURCE_ROOT" --source-revision="$CANDIDATE_SHA" --baseline=/tmp/roblox-candidate/baseline.json --rojo=/tmp/rojo-bin/rojo --output-dir=/tmp/roblox-candidate/package/packages --evidence=/tmp/roblox-candidate/package/results/build.json --build-up-asset-fingerprint="$BUILD_UP_ASSET_FINGERPRINT" --build-up-asset-library-version="$BUILD_UP_ASSET_LIBRARY_VERSION" --expected-asset-selection-fingerprint="$BUILD_UP_SELECTION_FINGERPRINT" --expected-asset-library-version="$BUILD_UP_SELECTION_LIBRARY_VERSION"
          mapfile -d '' place_files < <(find /tmp/roblox-candidate/package/packages -type f \( -name '*.rbxl' -o -name '*.rbxlx' \) -print0)
          [ "${#place_files[@]}" -eq 1 ] || { echo 'roblox-place-package-count-invalid' >&2; exit 1; }
          node <<'NODE'
          const fs=require('fs');const file='/tmp/roblox-candidate/context/development-queue.json';
          const q=JSON.parse(fs.readFileSync(file)),build=JSON.parse(fs.readFileSync('/tmp/roblox-candidate/package/results/build.json'));
          if(build.buildOrPackagePassed!==true||build.sourceRevision!==process.env.CANDIDATE_SHA)throw Error('candidate package invalid');
          if(build.buildUpAssetSourceUsageFingerprint!==process.env.BUILD_UP_ASSET_FINGERPRINT)throw Error('candidate package BUILD_UP asset fingerprint mismatch');
          if(Number(build.buildUpAssetSourceUsageLibraryVersion||0)!==Number(process.env.BUILD_UP_ASSET_LIBRARY_VERSION||0))throw Error('candidate package BUILD_UP asset library mismatch');
          if(build.assetSelectionFingerprint!==process.env.BUILD_UP_SELECTION_FINGERPRINT)throw Error('candidate package BUILD_UP selection fingerprint mismatch');
          if(Number(build.assetLibraryVersion||0)!==Number(process.env.BUILD_UP_SELECTION_LIBRARY_VERSION||0))throw Error('candidate package BUILD_UP selection library mismatch');
          const selectedFamilies=build.assetThreshold?.selectedFamilies||{};
          const expectedAtomIds=[...new Set(Object.values(selectedFamilies).flat().map(String).filter(Boolean))].sort();
          const familyResults=Array.isArray(build.assetThreshold?.familyResults)?build.assetThreshold.familyResults:[];
          Object.assign(q.items[0],{
            robloxBuildOrPackagePassed:true,
            robloxBuildSourceRevision:build.sourceRevision,
            robloxBuildArtifactIdentity:build.artifactIdentity,
            robloxBuildUpAssetSourceUsageFingerprint:build.buildUpAssetSourceUsageFingerprint,
            robloxBuildUpAssetSourceUsageLibraryVersion:Number(build.buildUpAssetSourceUsageLibraryVersion||0),
            robloxBuildAssetSelectionFingerprint:build.assetSelectionFingerprint,
            robloxBuildAssetLibraryVersion:Number(build.assetLibraryVersion||0),
            robloxStudioAssetBinding:{
              required:true,bindingVersion:2,libraryVersion:Number(build.assetLibraryVersion||0),
              selectionFingerprint:build.assetSelectionFingerprint,expectedAtomIds,
              familyResults:familyResults.map(row=>({family:String(row.family||''),status:String(row.status||''),actualBinding:row.actualBinding===true,systemPresent:row.systemPresent===true})),
              buildUpAssetSourceUsageFingerprint:build.buildUpAssetSourceUsageFingerprint,
              authority:'roblox-package-exact-build-up-selection'
            }
          });
          fs.writeFileSync(file,JSON.stringify(q));
          NODE
      - uses: ./.github/actions/prepare-ollama
        with:
          model: 'llama3.2:1b'
          version: '0.33.3'
          pull-model: 'true'
          department-role: development
          cache-model: 'true'
      - name: Verify candidate package with existing preflight and full Luau compilation
        shell: bash
        run: |
          set -euo pipefail
          model="$(node -e "const d=require('./company-directive.json');console.log(d.ai.robloxPreflightModel||d.ai.departmentLeadModels?.development||'llama3.2:1b')")"
          ollama pull "$model"
          node tools/company-development-roblox-build-preflight.mjs --game-id="$GAME_ID" --queue=/tmp/roblox-candidate/context/development-queue.json --directive=company-directive.json --output=/tmp/roblox-candidate/package/results/preflight.json
          mkdir -p /tmp/roblox-candidate/source
          git archive "$CANDIDATE_SHA" "$SOURCE_ROOT" | tar -x -C /tmp/roblox-candidate/source
          mapfile -d '' scripts < <(find "/tmp/roblox-candidate/source/$SOURCE_ROOT" -type f \( -name '*.luau' -o -name '*.lua' \) -print0)
          [ "${#scripts[@]}" -gt 0 ]
          for file in "${scripts[@]}"; do /tmp/luau-bin/luau-compile "$file" >/dev/null; done
          identity="$(node -e "console.log(require('/tmp/roblox-candidate/package/results/build.json').artifactIdentity)")"
          asset_selection_fingerprint="$(node -e "console.log(require('/tmp/roblox-candidate/package/results/build.json').assetSelectionFingerprint)")"
          asset_library_version="$(node -e "console.log(require('/tmp/roblox-candidate/package/results/build.json').assetLibraryVersion)")"
          node tools/company-development-roblox-headless-fast-mvp.mjs --repo-root=. --game-id="$GAME_ID" --source-path="$SOURCE_ROOT" --source-revision="$CANDIDATE_SHA" --artifact-identity="$identity" --rebuilt-artifact-identity="$identity" --artifact-run-id="$GITHUB_RUN_ID" --native-language-compile-passed=true --native-compiler-version=0.739 --build-up-asset-fingerprint="$BUILD_UP_ASSET_FINGERPRINT" --asset-selection-fingerprint="$asset_selection_fingerprint" --asset-library-version="$asset_library_version" --output=/tmp/roblox-candidate/package/results/f0.json
          node <<'NODE'
          const fs=require('fs');const file='/tmp/roblox-candidate/context/development-queue.json';
          const q=JSON.parse(fs.readFileSync(file)),i=q.items[0],read=name=>JSON.parse(fs.readFileSync('/tmp/roblox-candidate/package/results/'+name+'.json'));
          const pre=read('preflight'),f0=read('f0');
          for(const e of [pre,f0])if(e.pass!==true||e.sourceRevision!==i.robloxSourceCommit||e.artifactIdentity!==i.robloxBuildArtifactIdentity)throw Error('candidate preflight identity mismatch');
          if(f0.buildUpAssetSourceUsageFingerprint!==i.robloxBuildUpAssetSourceUsageFingerprint)throw Error('candidate F0 BUILD_UP asset fingerprint mismatch');
          if(f0.assetSelectionFingerprint!==i.robloxBuildAssetSelectionFingerprint||f0.observedAssetSelectionFingerprint!==i.robloxBuildAssetSelectionFingerprint)throw Error('candidate F0 asset selection fingerprint mismatch');
          if(Number(f0.assetLibraryVersion||0)!==Number(i.robloxBuildAssetLibraryVersion||0)||Number(f0.observedAssetLibraryVersion||0)!==Number(i.robloxBuildAssetLibraryVersion||0))throw Error('candidate F0 asset library version mismatch');
          Object.assign(i,{currentStep:'CANDIDATE_STATIC_REVIEW',robloxBuildPreflightPassed:true,robloxBuildPreflightEvidence:pre,robloxFoundationF0Passed:true,robloxFoundationF0Evidence:f0});
          const launchFile='/tmp/roblox-candidate/context/launch-mvp.json',launch=JSON.parse(fs.readFileSync(launchFile));
          if(f0.saveExists===true)launch.launchCore.push('save and rejoin persistence');
          fs.writeFileSync(launchFile,JSON.stringify(launch));fs.writeFileSync(file,JSON.stringify(q));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: development-roblox-package-${{ needs.inspect.outputs.game_id }}
          path: /tmp/roblox-candidate/package
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: roblox-candidate-context-${{ needs.inspect.outputs.game_id }}
          path: /tmp/roblox-candidate/context
          if-no-files-found: error
          retention-days: 7

  roblox-studio:
    needs: [inspect, roblox-package]
    if: needs.inspect.outputs.decision == 'roblox'
    uses: ./.github/workflows/company-development-roblox-post-runtime-qa.yml
    with:
      run_studio: true
      game_id: ${{ needs.inspect.outputs.game_id }}
      candidate_revision: ${{ needs.inspect.outputs.candidate_sha }}
      control_revision: ${{ needs.inspect.outputs.control_sha }}
      candidate_context: roblox-candidate-context-${{ needs.inspect.outputs.game_id }}

  roblox-release:
    needs: [inspect, roblox-package]
    if: always() && needs.inspect.outputs.decision == 'roblox'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.inspect.outputs.candidate_sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Checkout trusted V3 control plane
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.inspect.outputs.control_sha }}
          path: .vibe3-control
          fetch-depth: 1

      - name: Download exact candidate static result
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: roblox-candidate-context-${{ needs.inspect.outputs.game_id }}
          path: /tmp/roblox-candidate-review

      - name: Validate exact Roblox release evidence
        id: validate
        continue-on-error: true
        env:
          GAME_ID: ${{ needs.inspect.outputs.game_id }}
          CANDIDATE_SHA: ${{ needs.inspect.outputs.candidate_sha }}
          PACKAGE_RESULT: ${{ needs.roblox-package.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PACKAGE_RESULT" = success
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {validateRobloxReleaseEvidence} from './.vibe3-control/tools/vibe3-roblox-platform.mjs';
          const q=JSON.parse(fs.readFileSync('/tmp/roblox-candidate-review/development-queue.json','utf8'));
          const item=q.items?.[0];
          if(q.items?.length!==1||item.gameId!==process.env.GAME_ID)throw Error('candidate result game mismatch');
          if(Number(item.robloxFoundationF0Evidence?.artifactRunId)!==Number(process.env.GITHUB_RUN_ID))throw Error('candidate static run mismatch');
          const gate=validateRobloxReleaseEvidence(item,process.env.CANDIDATE_SHA,{stage:'SOURCE_PROMOTION',validationMode:'STATIC'});
          fs.writeFileSync('/tmp/roblox-candidate-review/release-evidence-review.json',JSON.stringify(gate));
          if(!gate.pass)throw Error(gate.blockedReasons.join('|'));
          console.log('ROBLOX_EXACT_CANDIDATE_STATIC_EVIDENCE=PASS');
          console.log('ROBLOX_FINAL_PUBLICATION_CLAIM=NO');
          NODE

      - name: Promote verified Roblox source and declared generated assets through reviewed PR
        id: promote
        if: steps.validate.outcome == 'success' && needs.inspect.outputs.evidence_only != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ROOT: ${{ needs.inspect.outputs.source_root }}
          BASE_SHA: ${{ needs.inspect.outputs.base_sha }}
          TASK_ID: ${{ needs.inspect.outputs.task_id }}
          CANDIDATE_SHA: ${{ needs.inspect.outputs.candidate_sha }}
          GENERATED_ASSET_FILES: ${{ needs.inspect.outputs.generated_asset_files }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t generated_asset_files < <(node -e "for(const file of JSON.parse(process.env.GENERATED_ASSET_FILES||'[]'))console.log(file)")
          promotion_paths=("$SOURCE_ROOT" "${generated_asset_files[@]}")
          git fetch --no-tags --depth=1 origin "$BASE_SHA" --quiet
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main --quiet
          [ -z "$(git diff --name-only "$BASE_SHA" origin/main -- "${promotion_paths[@]}")" ] || { echo 'main source or generated asset changed; replan required' >&2; exit 1; }
          rm -rf /tmp/vibe2-roblox-promote
          git worktree prune
          safe_task="$(printf '%s' "$TASK_ID" | tr -cs 'A-Za-z0-9._-' '-' | sed 's/^-*//;s/-*$//' | cut -c1-60)"
          release_branch="automation/vibe2-roblox-release-${safe_task}-${GITHUB_RUN_ID}"
          git worktree add -b "$release_branch" /tmp/vibe2-roblox-promote origin/main >/dev/null
          cd /tmp/vibe2-roblox-promote
          git config user.name 'jaewoon-vibe2-release'
          git config user.email 'vibe2-release@users.noreply.github.com'
          git checkout "$CANDIDATE_SHA" -- "${promotion_paths[@]}"
          git -c core.whitespace=-blank-at-eol,-blank-at-eof,-space-before-tab diff --check
          git add -- "${promotion_paths[@]}"
          git diff --cached --quiet && { echo 'nothing to promote' >&2; exit 1; }
          git commit -m "vibe2: promote Roblox ${TASK_ID}"
          release_commit="$(git rev-parse HEAD)"
          git push origin "HEAD:$release_branch"
          pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$release_branch" --title "vibe2: promote Roblox ${TASK_ID}" --body "Verified Roblox candidate. Direct main write: NO. Open Cloud publish runs only after this PR CI passes and source-root merge is verified.")"
          sleep 5
          gh pr checks "$pr_url" --watch --fail-fast --interval 10
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main --quiet
          [ -z "$(git diff --name-only "$BASE_SHA" origin/main -- "${promotion_paths[@]}")" ] || { echo 'main source or generated asset changed before merge; replan required' >&2; exit 1; }
          gh pr merge "$pr_url" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main --quiet
          git diff --quiet "$release_commit" origin/main -- "${promotion_paths[@]}"
          promoted_main_sha="$(git rev-parse origin/main)"
          promoted_source_tree_sha="$(git rev-parse "origin/main:$SOURCE_ROOT")"
          [[ "$promoted_source_tree_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "main_sha=$promoted_main_sha" >> "$GITHUB_OUTPUT"
          echo "source_tree_sha=$promoted_source_tree_sha" >> "$GITHUB_OUTPUT"
          echo "ROBLOX_MAIN_PROMOTION_SHA=$promoted_main_sha"
          echo "ROBLOX_MAIN_PROMOTION_SOURCE_TREE_SHA=$promoted_source_tree_sha"
          echo "ROBLOX_RELEASE_PR=$pr_url"
          echo 'DIRECT_MAIN_WRITE=NO'

      - name: Persist exact runtime asset binding and promotion plan
        if: steps.promote.outcome == 'success' && needs.inspect.outputs.evidence_only != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_ID: ${{ needs.inspect.outputs.game_id }}
          CANDIDATE_SHA: ${{ needs.inspect.outputs.candidate_sha }}
          PROMOTED_MAIN_SHA: ${{ steps.promote.outputs.main_sha }}
          PROMOTED_SOURCE_TREE_SHA: ${{ steps.promote.outputs.source_tree_sha }}
          ASSET_PROMOTION_CANDIDATES: ${{ needs.inspect.outputs.asset_promotion_candidates }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/vibe2-asset-runtime
          gh auth setup-git --hostname github.com
          gh repo clone "$GITHUB_REPOSITORY" /tmp/vibe2-asset-runtime -- --branch company-runtime --single-branch --depth=1 --no-tags >/dev/null 2>&1
          cd /tmp/vibe2-asset-runtime
          git config user.name 'jaewoon-vibe2-asset-runtime'
          git config user.email 'vibe2-worker@users.noreply.github.com'
          persisted=0
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin company-runtime
            git reset --hard origin/company-runtime
            node <<'NODE'
          const fs=require('fs');
          const file='development-queue.json';
          const queue=JSON.parse(fs.readFileSync(file,'utf8'));
          const gameId=String(process.env.GAME_ID||'').trim();
          const candidateRevision=String(process.env.CANDIDATE_SHA||'').trim();
          const promotedMainSha=String(process.env.PROMOTED_MAIN_SHA||'').trim();
          const sourceTreeSha=String(process.env.PROMOTED_SOURCE_TREE_SHA||'').trim();
          const candidates=JSON.parse(process.env.ASSET_PROMOTION_CANDIDATES||'[]');
          if(!gameId||!/^[0-9a-f]{40}$/.test(candidateRevision)||!/^[0-9a-f]{40}$/.test(promotedMainSha)||!/^[0-9a-f]{40}$/.test(sourceTreeSha))throw Error('asset runtime identity invalid');
          if(!Array.isArray(candidates))throw Error('asset promotion candidates invalid');
          const candidateContext=JSON.parse(fs.readFileSync('/tmp/roblox-candidate-review/development-queue.json','utf8'));
          const candidateItem=(candidateContext.items||[]).find(row=>String(row?.gameId||'')===gameId);
          const binding=candidateItem?.robloxStudioAssetBinding;
          if(binding?.required!==true||Number(binding.bindingVersion||0)!==2
            ||!/^[0-9a-f]{64}$/i.test(String(binding.selectionFingerprint||''))
            ||Number(binding.libraryVersion||0)<=0
            ||!/^[0-9a-f]{64}$/i.test(String(binding.buildUpAssetSourceUsageFingerprint||''))
            ||!Array.isArray(binding.expectedAtomIds)||binding.expectedAtomIds.length===0){
            throw Error('exact Roblox asset binding missing from candidate context');
          }
          const item=(queue.items||[]).find(row=>String(row?.gameId||'')===gameId);
          if(!item)throw Error('asset runtime binding game missing');
          const persistedBinding={
            ...binding,
            version:2,
            required:true,
            sourceRevision:promotedMainSha,
            candidateRevision,
            promotedSourceTreeSha:sourceTreeSha,
            exactSourceBinding:true,
            runtimeVerificationRequired:true,
            actualRuntimeVerified:false,
            persistedAt:new Date().toISOString()
          };
          const priorBinding=item.robloxStudioAssetBinding||null;
          const comparable=value=>JSON.stringify(value,(key,row)=>['persistedAt','requestedAt'].includes(key)?undefined:row);
          let changed=comparable(priorBinding)!==comparable(persistedBinding);
          item.robloxStudioAssetBinding=persistedBinding;
          item.robloxStudioAssetBindingApplied=true;
          item.robloxBuildUpAssetSourceUsageFingerprint=String(binding.buildUpAssetSourceUsageFingerprint);
          item.robloxBuildUpAssetSourceUsageLibraryVersion=Number(binding.buildUpAssetSourceUsageLibraryVersion||binding.libraryVersion||0);
          item.robloxBuildAssetSelectionFingerprint=String(binding.selectionFingerprint);
          item.robloxBuildAssetLibraryVersion=Number(binding.libraryVersion);
          if(candidates.length){
            const plan={
              version:1,gameId,candidateRevision,promotedMainSha,promotedSourceTreeSha:sourceTreeSha,candidates,
              status:'PENDING_EXACT_NATIVE_RUNTIME',exactSourceBindingRequired:true,studioRuntimeRequired:false,mobilePerformanceRequired:true,
              independentQaRequired:true,regressionRequired:true,verifiedCompanyPromotionAuthority:'assets/vibe-studio-asset-universe.js',requestedAt:new Date().toISOString()
            };
            const prior=item.robloxAssetRuntimePromotionPlan;
            if(comparable(prior)!==comparable(plan)){
              item.robloxAssetRuntimePromotionPlan=plan;
              changed=true;
            }
          }
          if(!changed)process.exit(0);
          item.updatedAt=new Date().toISOString();
          queue.updatedAt=item.updatedAt;
          fs.writeFileSync(file,JSON.stringify(queue,null,2)+'\n');
          console.log('ROBLOX_ASSET_RUNTIME_BINDING='+gameId+':selection='+binding.selectionFingerprint+':atoms='+binding.expectedAtomIds.length);
          if(candidates.length)console.log('ROBLOX_ASSET_RUNTIME_PROMOTION_PLAN='+gameId+':'+candidates.map(row=>row.assetId).join(','));
          NODE
            git add development-queue.json
            if git diff --cached --quiet; then
              persisted=1
              echo 'ROBLOX_ASSET_RUNTIME_BINDING_STATE=NO_CHANGE'
              break
            fi
            git commit -m "runtime: bind exact Roblox asset identity for $GAME_ID [skip ci]"
            if git push origin HEAD:company-runtime; then
              persisted=1
              echo "ROBLOX_ASSET_RUNTIME_BINDING_STATE=PUSHED:$attempt"
              break
            fi
            sleep $((attempt*2))
          done
          test "$persisted" = 1
      - name: Hand exact promoted Roblox source to F0-F9 runtime without pre-F9 canonical publish
        id: publish
        if: steps.validate.outcome == 'success' && steps.promote.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          echo 'ROBLOX_PRE_F9_CANONICAL_PUBLISH=FORBIDDEN'
          echo 'ROBLOX_F0_F9_RUNTIME_HANDOFF=PASS'
          echo 'ROBLOX_OPEN_CLOUD_PUBLISH_BEFORE_F9=NO'

      - name: Settle Roblox result and continue canonical queue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_ID: ${{ needs.inspect.outputs.task_id }}
          GAME_ID: ${{ needs.inspect.outputs.game_id }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          PROMOTE_OUTCOME: ${{ steps.promote.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          EVIDENCE_ONLY: ${{ needs.inspect.outputs.evidence_only }}
          CANDIDATE_SHA: ${{ needs.inspect.outputs.candidate_sha }}
          CANDIDATE_BRANCH: ${{ needs.inspect.outputs.candidate_branch }}
          CANDIDATE_ORIGIN: ${{ needs.inspect.outputs.origin }}
          PROMOTED_MAIN_SHA: ${{ steps.promote.outputs.main_sha }}
          PROMOTED_SOURCE_TREE_SHA: ${{ steps.promote.outputs.source_tree_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$VALIDATE_OUTCOME" = success ] && [ "$PROMOTE_OUTCOME" = success ] && [ "$PUBLISH_OUTCOME" = success ]; then result=PASS; else result=FAIL; fi
          if [ "$result" = PASS ] && [[ ! "$PROMOTED_SOURCE_TREE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'ROBLOX_PROMOTED_SOURCE_TREE_IDENTITY=INVALID' >&2
            result=FAIL
          fi
          if [ "$CANDIDATE_ORIGIN" = 'AUTONOMOUS_DEV_VERIFIED_HANDOFF' ]; then
            if [ "$result" = PASS ]; then
              gh workflow run public-game-health.yml --repo "$GITHUB_REPOSITORY" --ref main
            else
              gh workflow run autonomous-continuous-development.yml --repo "$GITHUB_REPOSITORY" --ref main
            fi
            echo "AUTONOMOUS_ROBLOX_RELEASE_RESULT=$result"
            [ "$result" = PASS ]
            exit
          fi
          rm -rf /tmp/vibe2-control
          gh auth setup-git --hostname github.com
          gh repo clone "$GITHUB_REPOSITORY" /tmp/vibe2-control -- --branch vibe2-unreal-core --single-branch --depth=1 --no-tags >/dev/null 2>&1
          git -C /tmp/vibe2-control fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main --quiet
          rm -rf /tmp/vibe2-main-contract
          git -C /tmp/vibe2-control worktree add --detach /tmp/vibe2-main-contract origin/main >/dev/null
          cd /tmp/vibe2-control
          git config user.name 'jaewoon-vibe2-release'
          git config user.email 'vibe2-release@users.noreply.github.com'
          settled=0
          attempt=0
          while true; do
            attempt=$((attempt+1))
            echo "VIBE2_CANDIDATE_QUEUE_WRITE_ATTEMPT=$attempt"
            git fetch --no-tags --depth=1 origin +refs/heads/vibe2-unreal-core:refs/remotes/origin/vibe2-unreal-core --quiet
            git reset --hard origin/vibe2-unreal-core
            if [ "$EVIDENCE_ONLY" = true ]; then
              node <<'NODE'
          const fs=require('fs');const file='.vibe2/queue.json';
          const queue=JSON.parse(fs.readFileSync(file,'utf8'));
          const task=(queue.tasks||[]).find(row=>row.id===process.env.TASK_ID);
          const pending=task?.runtimeEvidenceCandidate;
          if(task?.status!=='running'||task?.blocker!=='candidate-awaiting-runtime-evidence'
            ||pending?.evidenceOnly!==true||pending?.candidateSha!==process.env.CANDIDATE_SHA||pending?.candidateBranch!==process.env.CANDIDATE_BRANCH)throw Error('stale runtime evidence candidate');
          const reportFile='/tmp/roblox-candidate-review/release-evidence-review.json';
          const report=fs.existsSync(reportFile)?JSON.parse(fs.readFileSync(reportFile,'utf8')):null;
          const reportMatches=report?.pass===true&&report.sourceRevision===process.env.CANDIDATE_SHA
            &&report.authority==='roblox-candidate-static-source-promotion-gate'&&report.validationMode==='STATIC'
            &&report.runtimeVerified===false&&report.releaseClaim===false
            &&Array.isArray(report.blockedReasons)&&report.blockedReasons.length===0;
          const pass=process.env.VALIDATE_OUTCOME==='success'&&reportMatches;
          const reasons=Array.isArray(report?.blockedReasons)?report.blockedReasons.map(String).slice(0,30):[];
          if(!reportMatches)reasons.push('static-review-report-missing-or-invalid');
          task.evidence=[...new Set([...(task.evidence||[]),
            'candidate-static-probe:'+process.env.CANDIDATE_SHA+':'+(pass?'PASS':'FAIL'),
            'candidate-static-probe-run:'+process.env.GITHUB_RUN_ID,
            'candidate-static-probe-artifact:roblox-candidate-context-'+process.env.GAME_ID,
            'candidate-static-probe-source-promotion:FORBIDDEN',
            ...reasons.map(reason=>'candidate-static-probe-failure:'+reason)])];
          task.runtimeEvidenceCandidate={...pending,runId:process.env.GITHUB_RUN_ID,verified:false,staticVerified:pass,validationMode:'STATIC',blockedReasons:reasons,reviewStillRequired:true};
          Object.assign(task,{status:'queued',blocker:null,reservationId:null,reservationRunId:null,reservationRunAttempt:0,reservedAt:null,neuronExpectedVariants:0,neuronResults:[],lastOutcome:'STATIC_EVIDENCE_COLLECTED_REVIEW_REQUIRED'});
          fs.writeFileSync(file,JSON.stringify(queue,null,2)+'\n');
          NODE
            elif [ "$result" = PASS ]; then
              node /tmp/vibe2-main-contract/tools/vibe2-queue-control.mjs await \
                --id="$TASK_ID" \
                --blocker=candidate-awaiting-roblox-runtime-qa \
                --evidence="roblox-exact-evidence-pass,main-pr-merged,roblox-f0-f9-runtime-handoff,roblox-pre-f9-canonical-publish-forbidden,roblox-runtime-await-game:${GAME_ID},roblox-runtime-await-source-tree:${PROMOTED_SOURCE_TREE_SHA},roblox-runtime-await-main-sha:${PROMOTED_MAIN_SHA},roblox-runtime-verification-required,roblox-studio-asset-runtime-proof-required,actions-run-${GITHUB_RUN_ID}"
            else
              node /tmp/vibe2-main-contract/tools/vibe2-queue-control.mjs fail --id="$TASK_ID" --blocker=roblox-release-or-evidence-failed --evidence="roblox-validate-${VALIDATE_OUTCOME},promotion-${PROMOTE_OUTCOME},publish-${PUBLISH_OUTCOME},actions-run-${GITHUB_RUN_ID}"
            fi
            git add .vibe2/queue.json
            if git diff --cached --quiet; then
              settled=1
              break
            fi
            if [ "$EVIDENCE_ONLY" = true ]; then
              git commit -m "vibe2: collect Roblox candidate runtime evidence for ${TASK_ID} [skip ci]"
            elif [ "$result" = PASS ]; then
              git commit -m "vibe2: await Roblox runtime QA for ${TASK_ID} [skip ci]"
            else
              git commit -m "vibe2: settle Roblox task ${TASK_ID} ${result} [skip ci]"
            fi
            if git push origin HEAD:vibe2-unreal-core; then
              settled=1
              break
            fi
            sleep_for=$((attempt<5?attempt:5))
            echo "VIBE2_CANDIDATE_QUEUE_WRITE_RACE=RETRY:$attempt:$sleep_for"
            sleep "$sleep_for"
          done
          test "$settled" = 1
          if [ "$EVIDENCE_ONLY" = true ]; then
            echo 'VIBE2_RUNTIME_EVIDENCE_COLLECTED=YES'
            echo 'VIBE2_SOURCE_PROMOTION=FORBIDDEN_REVIEW_REQUIRED'
            exit 0
          fi
          if [ "$result" = PASS ]; then
            gh workflow run company-development-roblox-runtime.yml --repo "$GITHUB_REPOSITORY" --ref main -f game_id="$GAME_ID"
            echo "VIBE2_ROBLOX_RUNTIME_QA_DISPATCHED=$GAME_ID"
          fi
          payload="$(jq -nc \
            --arg run "${GITHUB_RUN_ID:-}" \
            --arg attempt "${GITHUB_RUN_ATTEMPT:-}" \
            --arg task "${TASK_ID:-}" \
            --arg outcome "${result:-QUEUE_UPDATED}" \
            '{event_type:"vibe2-fanin-refill",client_payload:{source_run:$run,source_attempt:$attempt,source_task:$task,source_outcome:$outcome,reason:"dependency-or-retry-ready"}}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
            --data "$payload"
          echo "VIBE2_EVENT_DRIVEN_DEPENDENCY_REFILL=${TASK_ID:-NONE}:${result:-QUEUE_UPDATED}"
          echo "VIBE2_ROBLOX_F0_F9_HANDOFF=$result"
          echo 'ROBLOX_CANONICAL_SERVER_PUBLISH_OWNER=F9_FINAL_REVIEW_ONLY'
          if [ "$result" = PASS ]; then echo 'VIBE2_ROBLOX_TASK_FINAL_PASS=NO_RUNTIME_QA_PENDING'; fi
          [ "$result" = PASS ]

  reject:
    needs: inspect
    if: needs.inspect.outputs.decision == 'reject' && needs.inspect.outputs.task_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Return rejected candidate to canonical queue without global serialization
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_ID: ${{ needs.inspect.outputs.task_id }}
          REASON: ${{ needs.inspect.outputs.reason }}
          CANDIDATE_ORIGIN: ${{ needs.inspect.outputs.origin }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CANDIDATE_ORIGIN" = 'AUTONOMOUS_DEV_VERIFIED_HANDOFF' ]; then
            gh workflow run autonomous-continuous-development.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo "AUTONOMOUS_RELEASE_REJECTED=$REASON"
            exit 1
          fi
          rm -rf /tmp/vibe2-control
          gh auth setup-git --hostname github.com
          gh repo clone "$GITHUB_REPOSITORY" /tmp/vibe2-control -- --branch vibe2-unreal-core --single-branch --depth=1 --no-tags >/dev/null 2>&1
          git -C /tmp/vibe2-control fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main --quiet
          rm -rf /tmp/vibe2-main-contract
          git -C /tmp/vibe2-control worktree add --detach /tmp/vibe2-main-contract origin/main >/dev/null
          cd /tmp/vibe2-control
          git config user.name 'jaewoon-vibe2-release'
          git config user.email 'vibe2-release@users.noreply.github.com'
          settled=0
          attempt=0
          while true; do
            attempt=$((attempt+1))
            echo "VIBE2_CANDIDATE_QUEUE_WRITE_ATTEMPT=$attempt"
            git fetch --no-tags --depth=1 origin +refs/heads/vibe2-unreal-core:refs/remotes/origin/vibe2-unreal-core --quiet
            git reset --hard origin/vibe2-unreal-core
            node /tmp/vibe2-main-contract/tools/vibe2-queue-control.mjs fail --id="$TASK_ID" --blocker="$REASON" --evidence="candidate-release-rejected,actions-run-${GITHUB_RUN_ID}"
            git add .vibe2/queue.json
            if git diff --cached --quiet; then
              settled=1
              break
            fi
            git commit -m "vibe2: reject candidate ${TASK_ID} [skip ci]"
            if git push origin HEAD:vibe2-unreal-core; then
              settled=1
              break
            fi
            sleep_for=$((attempt<5?attempt:5))
            echo "VIBE2_CANDIDATE_QUEUE_WRITE_RACE=RETRY:$attempt:$sleep_for"
            sleep "$sleep_for"
          done
          test "$settled" = 1
          payload="$(jq -nc \
            --arg run "${GITHUB_RUN_ID:-}" \
            --arg attempt "${GITHUB_RUN_ATTEMPT:-}" \
            --arg task "${TASK_ID:-}" \
            --arg outcome "${result:-QUEUE_UPDATED}" \
            '{event_type:"vibe2-fanin-refill",client_payload:{source_run:$run,source_attempt:$attempt,source_task:$task,source_outcome:$outcome,reason:"dependency-or-retry-ready"}}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
            --data "$payload"
          echo "VIBE2_EVENT_DRIVEN_DEPENDENCY_REFILL=${TASK_ID:-NONE}:${result:-QUEUE_UPDATED}"
