name: Vibe2 Candidate Release Gate

on:
  push:
    branches:
      - 'vibe2/candidate/**'
  workflow_dispatch:
    inputs:
      candidate_branch:
        description: 'Exact vibe2/candidate/** branch to inspect when another GitHub Actions workflow created it'
        required: true
        type: string

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: vibe2-release-serial
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      decision: ${{ steps.gate.outputs.decision }}
      reason: ${{ steps.gate.outputs.reason }}
      task_id: ${{ steps.gate.outputs.task_id }}
      game_id: ${{ steps.gate.outputs.game_id }}
      target: ${{ steps.gate.outputs.target }}
      source_root: ${{ steps.gate.outputs.source_root }}
      base_sha: ${{ steps.gate.outputs.base_sha }}
      release_state: ${{ steps.gate.outputs.release_state }}
      production_class: ${{ steps.gate.outputs.production_class }}
      request_file: ${{ steps.gate.outputs.request_file }}
      candidate_sha: ${{ steps.gate.outputs.candidate_sha }}
      candidate_branch: ${{ steps.gate.outputs.candidate_branch }}
      origin: ${{ steps.gate.outputs.origin }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.candidate_branch || github.ref_name }}
          fetch-depth: 0

      - name: Resolve candidate, central production authority and boundary
        id: gate
        env:
          SUBMITTED_CANDIDATE_BRANCH: ${{ github.event.inputs.candidate_branch || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          candidate_sha="$(git rev-parse HEAD)"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "candidate_branch=$SUBMITTED_CANDIDATE_BRANCH" >> "$GITHUB_OUTPUT"
          mapfile -t manifests < <(find .vibe2/candidates -type f -name manifest.json 2>/dev/null | sort)
          if [ "${#manifests[@]}" -ne 1 ]; then
            echo 'decision=reject' >> "$GITHUB_OUTPUT"
            echo 'reason=manifest-count-invalid' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          manifest="${manifests[0]}"
          git show origin/main:game-catalog.json > /tmp/main-game-catalog.json
          MANIFEST="$manifest" node <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync(process.env.MANIFEST,'utf8'));
          const catalog=JSON.parse(fs.readFileSync('/tmp/main-game-catalog.json','utf8'));
          const out=process.env.GITHUB_OUTPUT;
          const put=(k,v)=>fs.appendFileSync(out,`${k}=${String(v??'').replaceAll('\n',' ')}\n`);
          const task=String(m.taskId||'').trim();
          const game=String(m.gameId||'').trim();
          const target=String(m.target||'').trim().toLowerCase();
          const root=String(m.sourceRoot||'').replaceAll('\\','/').replace(/^\.\//,'').replace(/\/$/,'');
          const base=String(m.baseMainSha||'').trim();
          const origin=String(m.origin||'VIBE2_NATIVE').trim().toUpperCase();
          const row=(catalog.games||[]).find(g=>String(g.id||'')===game);
          const productionClass=String(row?.productionClass||'').trim().toUpperCase();
          const legacyState=String(row?.homepageCategory||'other').toLowerCase();
          const state=productionClass==='RELEASE_CONFIRMED'?'release-confirmed':productionClass==='DEVELOPMENT_CONFIRMED'?'development-confirmed':legacyState;
          let decision='reject', reason='unknown';
          if(!task||!game||!base) reason='manifest-required-field-missing';
          else if(!['roblox','web','unity'].includes(target)) reason='target-auto-release-not-configured';
          else if(target==='roblox' && root!==`roblox-games/${game}`) reason='roblox-source-root-mismatch';
          else if(target==='web' && root!==`web-games/${game}`) reason='web-source-root-mismatch';
          else if(target==='unity' && root!==`unity-games/${game}`) reason='unity-source-root-mismatch';
          else if(!['RELEASE_CONFIRMED','DEVELOPMENT_CONFIRMED'].includes(productionClass)) reason='current-production-class-not-auto-deployable';
          else { decision=target; reason='candidate-authorized'; }
          put('decision',decision); put('reason',reason); put('task_id',task); put('game_id',game);
          put('target',target); put('source_root',root); put('base_sha',base); put('release_state',state); put('production_class',productionClass); put('origin',origin);
          put('request_file',target==='unity'?`.build-requests/unity/${game}.json`:'');
          NODE

          decision="$(sed -n 's/^decision=//p' "$GITHUB_OUTPUT" | tail -n1)"
          [ "$decision" = 'reject' ] && exit 0
          source_root="$(sed -n 's/^source_root=//p' "$GITHUB_OUTPUT" | tail -n1)"
          base_sha="$(sed -n 's/^base_sha=//p' "$GITHUB_OUTPUT" | tail -n1)"
          game_id="$(sed -n 's/^game_id=//p' "$GITHUB_OUTPUT" | tail -n1)"
          production_class="$(sed -n 's/^production_class=//p' "$GITHUB_OUTPUT" | tail -n1)"
          reject() { echo 'decision=reject' >> "$GITHUB_OUTPUT"; echo "reason=$1" >> "$GITHUB_OUTPUT"; exit 0; }
          git cat-file -e "${base_sha}^{commit}" 2>/dev/null || reject base-main-sha-missing
          [ -z "$(git diff --name-only "$base_sha" origin/main -- "$source_root")" ] || reject source-root-changed-on-main
          mapfile -t source_changed < <(git diff --name-only "$base_sha" "$candidate_sha" -- "$source_root")
          [ "${#source_changed[@]}" -gt 0 ] || reject no-source-change
          git diff --check "$base_sha" "$candidate_sha" || reject candidate-diff-check-failed
          mapfile -t changed < <(git diff --name-only "$base_sha" "$candidate_sha")
          for file in "${changed[@]}"; do
            case "$file" in "$source_root"/*|.vibe2/candidates/*) ;; *) reject candidate-path-outside-boundary ;; esac
          done

          if [ "$decision" = 'roblox' ]; then
            test -f "$source_root/roblox-technical-validation.json" || reject roblox-technical-validation-missing
            mapfile -t place_files < <(find "$source_root" -type f \( -name '*.rbxl' -o -name '*.rbxlx' \) | sort)
            [ "${#place_files[@]}" -eq 1 ] || reject roblox-place-package-count-invalid
          fi

          if [ "$decision" = 'unity' ] && [ "$production_class" = 'RELEASE_CONFIRMED' ]; then
            GAME_ID="$game_id" node <<'NODE' || reject development-baseline-required
          const {execFileSync}=require('node:child_process');
          const game=String(process.env.GAME_ID||'').trim();
          const prefix=`design/${game}/`;
          let files=[];
          try{files=execFileSync('git',['ls-tree','-r','--name-only','origin/main','--',`design/${game}`],{encoding:'utf8'}).split(/\r?\n/).filter(x=>x.startsWith(prefix)&&x.endsWith('/cycle-status.json')).sort().reverse();}catch{}
          let ready=false;
          for(const file of files){
            try{
              const status=JSON.parse(execFileSync('git',['show',`origin/main:${file}`],{encoding:'utf8'}));
              const gate=status?.baselineGate;
              const e=gate?.evidence||{};
              if(gate?.policyDocument==='COMPANY_FLOW.md'&&gate?.state==='DEVELOPMENT_BASELINE_READY'&&gate?.ready===true&&e.webGameplay?.pass===true&&e.unityProject?.present===true&&e.unityTechnical?.pass===true){ready=true;break;}
            }catch{}
          }
          if(!ready){console.error(`RELEASE_GATE_BLOCKED=${game}:DEVELOPMENT_BASELINE_REQUIRED`);process.exit(1);}
          console.log(`RELEASE_DEVELOPMENT_BASELINE_GATE=${game}:PASS`);
          NODE
          fi

  web-release:
    needs: inspect
    if: needs.inspect.outputs.decision == 'web'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.inspect.outputs.candidate_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Web syntax QA
        id: webqa
        continue-on-error: true
        env:
          SOURCE_ROOT: ${{ needs.inspect.outputs.source_root }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            case "$file" in *.js|*.mjs|*.cjs) node --check "$file" ;; esac
          done < <(find "$SOURCE_ROOT" -type f -print0)
          echo 'VIBE2_WEB_STATIC_QA=PASS'

      - name: Promote approved web source root through reviewed PR
        id: promote
        if: steps.webqa.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ROOT: ${{ needs.inspect.outputs.source_root }}
          BASE_SHA: ${{ needs.inspect.outputs.base_sha }}
          TASK_ID: ${{ needs.inspect.outputs.task_id }}
          CANDIDATE_SHA: ${{ needs.inspect.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          [ -z "$(git diff --name-only "$BASE_SHA" origin/main -- "$SOURCE_ROOT")" ] || { echo 'main source changed; replan required' >&2; exit 1; }
          rm -rf /tmp/vibe2-promote
          git worktree prune
          safe_task="$(printf '%s' "$TASK_ID" | tr -cs 'A-Za-z0-9._-' '-' | sed 's/^-*//;s/-*$//' | cut -c1-60)"
          release_branch="automation/vibe2-web-release-${safe_task}-${GITHUB_RUN_ID}"
          git worktree add -b "$release_branch" /tmp/vibe2-promote origin/main >/dev/null
          cd /tmp/vibe2-promote
          git config user.name 'jaewoon-vibe2-release'
          git config user.email 'vibe2-release@users.noreply.github.com'
          git checkout "$CANDIDATE_SHA" -- "$SOURCE_ROOT"
          git diff --check
          git add "$SOURCE_ROOT"
          git diff --cached --quiet && { echo 'nothing to promote' >&2; exit 1; }
          git commit -m "vibe2: deploy ${TASK_ID}"
          release_commit="$(git rev-parse HEAD)"
          git push origin "HEAD:$release_branch"
          pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$release_branch" --title "vibe2: deploy ${TASK_ID}" --body "Verified Web release candidate. Direct main write: NO. Release PASS requires this PR's CI and merge.")"
          sleep 5
          gh pr checks "$pr_url" --watch --fail-fast --interval 10
          git fetch origin main --quiet
          [ -z "$(git diff --name-only "$BASE_SHA" origin/main -- "$SOURCE_ROOT")" ] || { echo 'main source changed before merge; replan required' >&2; exit 1; }
          gh pr merge "$pr_url" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
          git fetch origin main --quiet
          git diff --quiet "$release_commit" origin/main -- "$SOURCE_ROOT"
          echo "VIBE2_MAIN_PROMOTION_SHA=$(git rev-parse origin/main)"
          echo "VIBE2_RELEASE_PR=$pr_url"
          echo 'DIRECT_MAIN_WRITE=NO'

      - name: Settle web result and continue correct source queue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_ID: ${{ needs.inspect.outputs.task_id }}
          GAME_ID: ${{ needs.inspect.outputs.game_id }}
          QA_OUTCOME: ${{ steps.webqa.outcome }}
          PROMOTE_OUTCOME: ${{ steps.promote.outcome }}
          CANDIDATE_ORIGIN: ${{ needs.inspect.outputs.origin }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$QA_OUTCOME" = success ] && [ "$PROMOTE_OUTCOME" = success ]; then result=PASS; else result=FAIL; fi
          if [ "$CANDIDATE_ORIGIN" = 'AUTONOMOUS_DEV_VERIFIED_HANDOFF' ]; then
            if [ "$result" = PASS ]; then
              gh workflow run public-game-health.yml --repo "$GITHUB_REPOSITORY" --ref main -f released_game_id="$GAME_ID" -f release_task_id="$TASK_ID" -f release_origin="$CANDIDATE_ORIGIN"
              echo 'AUTONOMOUS_POST_RELEASE_HEALTH=DISPATCHED'
              echo 'AUTONOMOUS_NEXT_FLOOR=WAITING_FOR_PUBLIC_HEALTH'
            else
              gh workflow run autonomous-continuous-development.yml --repo "$GITHUB_REPOSITORY" --ref main
              echo 'AUTONOMOUS_NEXT_FLOOR=RECOVERY_DISPATCHED'
            fi
            echo "AUTONOMOUS_RELEASE_RESULT=$result"
            [ "$result" = PASS ]
            exit
          fi
          rm -rf /tmp/vibe2-control
          git clone --branch vibe2-unreal-core --single-branch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/vibe2-control >/dev/null 2>&1
          cd /tmp/vibe2-control
          git config user.name 'jaewoon-vibe2-release'
          git config user.email 'vibe2-release@users.noreply.github.com'
          if [ "$result" = PASS ]; then
            node tools/vibe2-queue-control.mjs pass --id="$TASK_ID" --evidence="web-static-qa-pass,main-pr-merged,actions-run-${GITHUB_RUN_ID}"
          else
            node tools/vibe2-queue-control.mjs fail --id="$TASK_ID" --blocker=web-qa-or-promotion-failed --evidence="web-qa-${QA_OUTCOME},promotion-${PROMOTE_OUTCOME},actions-run-${GITHUB_RUN_ID}"
          fi
          git add .vibe2/queue.json
          git commit -m "vibe2: settle web task ${TASK_ID} ${result} [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin vibe2-unreal-core
            git push origin HEAD:vibe2-unreal-core && break
            test "$attempt" -lt 3
            sleep $((attempt * 2))
          done
          if [ "$result" = PASS ]; then gh workflow run public-game-health.yml --repo "$GITHUB_REPOSITORY" --ref main; fi
          gh workflow run vibe2-24h-runner.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "VIBE2_WEB_AUTO_DEPLOY=$result"
          [ "$result" = PASS ]

  unity-build:
    needs: inspect
    if: needs.inspect.outputs.decision == 'unity'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.inspect.outputs.candidate_branch }}
      - name: Dispatch candidate APK QA
        id: dispatch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_FILE: ${{ needs.inspect.outputs.request_file }}
          CANDIDATE_BRANCH: ${{ needs.inspect.outputs.candidate_branch }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "$REQUEST_FILE"
          gh workflow run unity-hybrid-android-build.yml --repo "$GITHUB_REPOSITORY" --ref "$CANDIDATE_BRANCH" -f request_file="$REQUEST_FILE"
          echo 'VIBE2_UNITY_CANDIDATE_BUILD_DISPATCHED=YES'

      - name: Recover queue if build dispatch failed
        if: steps.dispatch.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_ID: ${{ needs.inspect.outputs.task_id }}
          CANDIDATE_ORIGIN: ${{ needs.inspect.outputs.origin }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CANDIDATE_ORIGIN" = 'AUTONOMOUS_DEV_VERIFIED_HANDOFF' ]; then
            gh workflow run autonomous-continuous-development.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo 'AUTONOMOUS_UNITY_BUILD_DISPATCH=FAIL'
            exit 1
          fi
          rm -rf /tmp/vibe2-control
          git clone --branch vibe2-unreal-core --single-branch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/vibe2-control >/dev/null 2>&1
          cd /tmp/vibe2-control
          git config user.name 'jaewoon-vibe2-release'
          git config user.email 'vibe2-release@users.noreply.github.com'
          node tools/vibe2-queue-control.mjs fail --id="$TASK_ID" --blocker=unity-build-dispatch-failed --evidence="actions-run-${GITHUB_RUN_ID}"
          git add .vibe2/queue.json
          git commit -m "vibe2: recover Unity dispatch failure ${TASK_ID} [skip ci]"
          git pull --rebase origin vibe2-unreal-core
          git push origin HEAD:vibe2-unreal-core
          gh workflow run vibe2-24h-runner.yml --repo "$GITHUB_REPOSITORY" --ref main
          exit 1

  roblox-release:
    needs: inspect
    if: needs.inspect.outputs.decision == 'roblox'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.inspect.outputs.candidate_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Checkout trusted V3 control plane
        uses: actions/checkout@v4
        with:
          ref: main
          path: .vibe3-control
          fetch-depth: 1

      - name: Validate exact Roblox release evidence
        id: validate
        continue-on-error: true
        env:
          SOURCE_ROOT: ${{ needs.inspect.outputs.source_root }}
          CANDIDATE_SHA: ${{ needs.inspect.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$SOURCE_ROOT/roblox-technical-validation.json"
          test -f "$evidence"
          mapfile -t place_files < <(find "$SOURCE_ROOT" -type f \( -name '*.rbxl' -o -name '*.rbxlx' \) | sort)
          [ "${#place_files[@]}" -eq 1 ]
          place_file="${place_files[0]}"
          node .vibe3-control/tools/vibe3-roblox-platform.mjs --place-file "$place_file" --evidence "$evidence" --source-revision "$CANDIDATE_SHA" | tee /tmp/roblox-release-plan.log
          grep -q '^ROBLOX_V3_STATE=READY$' /tmp/roblox-release-plan.log
          echo "place_file=$place_file" >> "$GITHUB_OUTPUT"
          echo "evidence_file=$evidence" >> "$GITHUB_OUTPUT"
          echo 'ROBLOX_EXACT_RELEASE_EVIDENCE=PASS'

      - name: Promote verified Roblox source root through reviewed PR
        id: promote
        if: steps.validate.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ROOT: ${{ needs.inspect.outputs.source_root }}
          BASE_SHA: ${{ needs.inspect.outputs.base_sha }}
          TASK_ID: ${{ needs.inspect.outputs.task_id }}
          CANDIDATE_SHA: ${{ needs.inspect.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          [ -z "$(git diff --name-only "$BASE_SHA" origin/main -- "$SOURCE_ROOT")" ] || { echo 'main source changed; replan required' >&2; exit 1; }
          rm -rf /tmp/vibe2-roblox-promote
          git worktree prune
          safe_task="$(printf '%s' "$TASK_ID" | tr -cs 'A-Za-z0-9._-' '-' | sed 's/^-*//;s/-*$//' | cut -c1-60)"
          release_branch="automation/vibe2-roblox-release-${safe_task}-${GITHUB_RUN_ID}"
          git worktree add -b "$release_branch" /tmp/vibe2-roblox-promote origin/main >/dev/null
          cd /tmp/vibe2-roblox-promote
          git config user.name 'jaewoon-vibe2-release'
          git config user.email 'vibe2-release@users.noreply.github.com'
          git checkout "$CANDIDATE_SHA" -- "$SOURCE_ROOT"
          git diff --check
          git add "$SOURCE_ROOT"
          git diff --cached --quiet && { echo 'nothing to promote' >&2; exit 1; }
          git commit -m "vibe2: promote Roblox ${TASK_ID}"
          release_commit="$(git rev-parse HEAD)"
          git push origin "HEAD:$release_branch"
          pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$release_branch" --title "vibe2: promote Roblox ${TASK_ID}" --body "Verified Roblox candidate. Direct main write: NO. Open Cloud publish runs only after this PR CI passes and source-root merge is verified.")"
          sleep 5
          gh pr checks "$pr_url" --watch --fail-fast --interval 10
          git fetch origin main --quiet
          [ -z "$(git diff --name-only "$BASE_SHA" origin/main -- "$SOURCE_ROOT")" ] || { echo 'main source changed before merge; replan required' >&2; exit 1; }
          gh pr merge "$pr_url" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
          git fetch origin main --quiet
          git diff --quiet "$release_commit" origin/main -- "$SOURCE_ROOT"
          echo "ROBLOX_MAIN_PROMOTION_SHA=$(git rev-parse origin/main)"
          echo "ROBLOX_RELEASE_PR=$pr_url"
          echo 'DIRECT_MAIN_WRITE=NO'

      - name: Publish exact verified package through Roblox Open Cloud
        id: publish
        if: steps.validate.outcome == 'success' && steps.promote.outcome == 'success'
        continue-on-error: true
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ secrets.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ secrets.ROBLOX_PLACE_ID }}
          CANDIDATE_SHA: ${{ needs.inspect.outputs.candidate_sha }}
          PLACE_FILE: ${{ steps.validate.outputs.place_file }}
          EVIDENCE_FILE: ${{ steps.validate.outputs.evidence_file }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ROBLOX_OPEN_CLOUD_API_KEY"
          test -n "$ROBLOX_UNIVERSE_ID"
          test -n "$ROBLOX_PLACE_ID"
          node .vibe3-control/tools/vibe3-roblox-platform.mjs --place-file "$PLACE_FILE" --evidence "$EVIDENCE_FILE" --source-revision "$CANDIDATE_SHA" --execute | tee /tmp/roblox-publish.log
          grep -q '^ROBLOX_V3_STATE=PUBLISHED$' /tmp/roblox-publish.log
          echo 'ROBLOX_OPEN_CLOUD_PUBLISH=PASS'

      - name: Settle Roblox result and continue canonical queue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_ID: ${{ needs.inspect.outputs.task_id }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          PROMOTE_OUTCOME: ${{ steps.promote.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          CANDIDATE_ORIGIN: ${{ needs.inspect.outputs.origin }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$VALIDATE_OUTCOME" = success ] && [ "$PROMOTE_OUTCOME" = success ] && [ "$PUBLISH_OUTCOME" = success ]; then result=PASS; else result=FAIL; fi
          if [ "$CANDIDATE_ORIGIN" = 'AUTONOMOUS_DEV_VERIFIED_HANDOFF' ]; then
            if [ "$result" = PASS ]; then
              gh workflow run public-game-health.yml --repo "$GITHUB_REPOSITORY" --ref main
            else
              gh workflow run autonomous-continuous-development.yml --repo "$GITHUB_REPOSITORY" --ref main
            fi
            echo "AUTONOMOUS_ROBLOX_RELEASE_RESULT=$result"
            [ "$result" = PASS ]
            exit
          fi
          rm -rf /tmp/vibe2-control
          git clone --branch vibe2-unreal-core --single-branch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/vibe2-control >/dev/null 2>&1
          cd /tmp/vibe2-control
          git config user.name 'jaewoon-vibe2-release'
          git config user.email 'vibe2-release@users.noreply.github.com'
          if [ "$result" = PASS ]; then
            node tools/vibe2-queue-control.mjs pass --id="$TASK_ID" --evidence="roblox-exact-evidence-pass,main-pr-merged,roblox-open-cloud-published,actions-run-${GITHUB_RUN_ID}"
          else
            node tools/vibe2-queue-control.mjs fail --id="$TASK_ID" --blocker=roblox-release-or-evidence-failed --evidence="roblox-validate-${VALIDATE_OUTCOME},promotion-${PROMOTE_OUTCOME},publish-${PUBLISH_OUTCOME},actions-run-${GITHUB_RUN_ID}"
          fi
          git add .vibe2/queue.json
          git commit -m "vibe2: settle Roblox task ${TASK_ID} ${result} [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin vibe2-unreal-core
            git push origin HEAD:vibe2-unreal-core && break
            test "$attempt" -lt 3
            sleep $((attempt * 2))
          done
          if [ "$result" = PASS ]; then gh workflow run public-game-health.yml --repo "$GITHUB_REPOSITORY" --ref main; fi
          gh workflow run vibe2-24h-runner.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "VIBE2_ROBLOX_AUTO_DEPLOY=$result"
          [ "$result" = PASS ]

  reject:
    needs: inspect
    if: needs.inspect.outputs.decision == 'reject' && needs.inspect.outputs.task_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Return rejected candidate to correct serial queue
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_ID: ${{ needs.inspect.outputs.task_id }}
          REASON: ${{ needs.inspect.outputs.reason }}
          CANDIDATE_ORIGIN: ${{ needs.inspect.outputs.origin }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CANDIDATE_ORIGIN" = 'AUTONOMOUS_DEV_VERIFIED_HANDOFF' ]; then
            gh workflow run autonomous-continuous-development.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo "AUTONOMOUS_RELEASE_REJECTED=$REASON"
            exit 1
          fi
          rm -rf /tmp/vibe2-control
          git clone --branch vibe2-unreal-core --single-branch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/vibe2-control >/dev/null 2>&1
          cd /tmp/vibe2-control
          git config user.name 'jaewoon-vibe2-release'
          git config user.email 'vibe2-release@users.noreply.github.com'
          node tools/vibe2-queue-control.mjs fail --id="$TASK_ID" --blocker="$REASON" --evidence="candidate-release-rejected,actions-run-${GITHUB_RUN_ID}"
          git add .vibe2/queue.json
          git commit -m "vibe2: reject candidate ${TASK_ID} [skip ci]"
          git pull --rebase origin vibe2-unreal-core
          git push origin HEAD:vibe2-unreal-core
          gh workflow run vibe2-24h-runner.yml --repo "$GITHUB_REPOSITORY" --ref main
