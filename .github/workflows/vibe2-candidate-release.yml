# 파일명: .github/workflows/vibe2-candidate-release.yml
name: Vibe2 Candidate Release Gate

on:
  push:
    branches:
      - 'vibe2/candidate/**'
  workflow_dispatch:
    inputs:
      candidate_branch:
        description: 'Exact vibe2/candidate/** branch to inspect when another GitHub Actions workflow created it'
        required: true
        type: string

      evidence_only:
        description: 'Collect exact candidate runtime evidence without source promotion or publication'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  # Serialize only duplicate runs for the same candidate. Different candidates must not
  # share one pending slot, otherwise GitHub concurrency cancels older pending runs.
  group: vibe2-release-${{ github.event.inputs.candidate_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      evidence_only: ${{ steps.gate.outputs.evidence_only }}
      decision: ${{ steps.gate.outputs.decision }}
      control_sha: ${{ steps.gate.outputs.control_sha }}
      reason: ${{ steps.gate.outputs.reason }}
      task_id: ${{ steps.gate.outputs.task_id }}
      game_id: ${{ steps.gate.outputs.game_id }}
      target: ${{ steps.gate.outputs.target }}
      execution_surface: ${{ steps.gate.outputs.execution_surface }}
      source_root: ${{ steps.gate.outputs.source_root }}
      base_sha: ${{ steps.gate.outputs.base_sha }}
      transport_base_sha: ${{ steps.gate.outputs.transport_base_sha }}
      release_state: ${{ steps.gate.outputs.release_state }}
      production_class: ${{ steps.gate.outputs.production_class }}
      request_file: ${{ steps.gate.outputs.request_file }}
      candidate_sha: ${{ steps.gate.outputs.candidate_sha }}
      candidate_branch: ${{ steps.gate.outputs.candidate_branch }}
      origin: ${{ steps.gate.outputs.origin }}
      already_promoted: ${{ steps.gate.outputs.already_promoted }}
      asset_promotion_candidates: ${{ steps.gate.outputs.asset_promotion_candidates }}
      generated_asset_files: ${{ steps.gate.outputs.generated_asset_files }}
      asset_source_usage_fingerprint: ${{ steps.gate.outputs.asset_source_usage_fingerprint }}
      asset_source_usage_library_version: ${{ steps.gate.outputs.asset_source_usage_library_version }}
      asset_selection_fingerprint: ${{ steps.gate.outputs.asset_selection_fingerprint }}
      asset_selection_library_version: ${{ steps.gate.outputs.asset_selection_library_version }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.candidate_branch || github.ref_name }}
          fetch-depth: 1
          fetch-tags: false

      - name: Resolve candidate, central production authority and boundary
        id: gate
        env:
          EVIDENCE_ONLY: ${{ github.event.inputs.evidence_only || 'false' }}
          SUBMITTED_CANDIDATE_BRANCH: ${{ github.event.inputs.candidate_branch || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main --quiet
          echo "control_sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          candidate_sha="$(git rev-parse HEAD)"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "evidence_only=$EVIDENCE_ONLY" >> "$GITHUB_OUTPUT"
          echo "candidate_branch=$SUBMITTED_CANDIDATE_BRANCH" >> "$GITHUB_OUTPUT"
          mapfile -t manifests < <(find .vibe2/candidates -type f -name manifest.json 2>/dev/null | sort)
          matching_manifests=()
          for candidate_manifest in "${manifests[@]}"; do
            manifest_branch="$(MANIFEST="$candidate_manifest" node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync(process.env.MANIFEST,'utf8'));process.stdout.write(String(m.branch||''))")"
            if [ "$manifest_branch" = "$SUBMITTED_CANDIDATE_BRANCH" ]; then
              matching_manifests+=("$candidate_manifest")
            fi
          done
          if [ "${#matching_manifests[@]}" -eq 1 ]; then
            manifest="${matching_manifests[0]}"
            echo "VIBE2_CANDIDATE_MANIFEST_MATCH=$manifest"
          elif [ "${#manifests[@]}" -eq 1 ]; then
            manifest="${manifests[0]}"
            echo "VIBE2_CANDIDATE_MANIFEST_LEGACY_SINGLE=$manifest"
          else
            echo 'decision=reject' >> "$GITHUB_OUTPUT"
            echo 'reason=candidate-manifest-not-unique-for-branch' >> "$GITHUB_OUTPUT"
            echo "VIBE2_CANDIDATE_MANIFEST_MATCH_COUNT=${#matching_manifests[@]}"
            exit 0
          fi
          git show origin/main:game-catalog.json > /tmp/main-game-catalog.json
          MANIFEST="$manifest" node <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync(process.env.MANIFEST,'utf8'));
          const catalog=JSON.parse(fs.readFileSync('/tmp/main-game-catalog.json','utf8'));
          const out=process.env.GITHUB_OUTPUT;
          const put=(k,v)=>fs.appendFileSync(out,`${k}=${String(v??'').replaceAll('\n',' ')}\n`);
          const task=String(m.taskId||'').trim();
          const game=String(m.gameId||'').trim();
          const target=String(m.target||'').trim().toLowerCase();
          const executionSurface=String(m.executionSurface||'').trim().toUpperCase();
          const root=String(m.sourceRoot||'').replaceAll('\\','/').replace(/^\.\//,'').replace(/\/$/,'');
          const base=String(m.baseMainSha||'').trim();
          const transportBase=String(m.transportBaseSha||base).trim();
          const origin=String(m.origin||'VIBE2_NATIVE').trim().toUpperCase();
          const assetSourceUsageFingerprint=String(m?.codingMethod?.internalAssetSourceUsageFingerprint||'').trim();
          const assetSourceUsageLibraryVersion=Math.max(0,Math.floor(Number(m?.codingMethod?.internalAssetSourceUsageLibraryVersion)||0));
          const assetSelectionFingerprint=String(m?.assetProduction?.baseMaterialLoadout?.robloxSelectionFingerprint||'').trim();
          const assetSelectionLibraryVersion=Math.max(0,Math.floor(Number(m?.assetProduction?.baseMaterialLoadout?.robloxSelectionLibraryVersion)||0));
          const row=(catalog.games||[]).find(g=>String(g.id||'')===game);
          const productionClass=String(row?.productionClass||'').trim().toUpperCase();
          const legacyState=String(row?.homepageCategory||'other').toLowerCase();
          const state=productionClass==='RELEASE_CONFIRMED'?'release-confirmed':productionClass==='DEVELOPMENT_CONFIRMED'?'development-confirmed':legacyState;
          let decision='reject', reason='unknown';
          if(!task||!game||!base||!transportBase) reason='manifest-required-field-missing';
          else if(!['roblox','web','unity'].includes(target)) reason='target-auto-release-not-configured';
          else if(target==='unity' && !['UNITY_WEB','UNITY_NATIVE'].includes(executionSurface)) reason='unity-execution-surface-missing-or-invalid';
          else if(target==='roblox' && root!==`roblox-games/${game}`) reason='roblox-source-root-mismatch';
          else if(target==='roblox' && !/^[0-9a-f]{64}$/i.test(assetSourceUsageFingerprint)) reason='roblox-build-up-asset-fingerprint-missing';
          else if(target==='roblox' && assetSourceUsageLibraryVersion<=0) reason='roblox-build-up-asset-library-version-missing';
          else if(target==='roblox' && !/^[0-9a-f]{64}$/i.test(assetSelectionFingerprint)) reason='roblox-build-up-selection-fingerprint-missing';
          else if(target==='roblox' && assetSelectionLibraryVersion<=0) reason='roblox-build-up-selection-library-version-missing';
          else if(target==='web' && root!==`web-games/${game}`) reason='web-source-root-mismatch';
          else if(target==='unity' && root!==`unity-games/${game}`) reason='unity-source-root-mismatch';
          else if(!['RELEASE_CONFIRMED','DEVELOPMENT_CONFIRMED'].includes(productionClass)) reason='current-production-class-not-auto-deployable';
          else {
            decision=target==='unity'&&executionSurface==='UNITY_WEB'?'unity-web':target;
            reason='candidate-authorized';
          }
          put('candidate_decision',decision); put('candidate_reason',reason); put('task_id',task); put('game_id',game);
          put('target',target); put('execution_surface',executionSurface); put('source_root',root); put('base_sha',base); put('transport_base_sha',transportBase); put('release_state',state); put('production_class',productionClass); put('origin',origin);
          put('asset_source_usage_fingerprint',assetSourceUsageFingerprint); put('asset_source_usage_library_version',assetSourceUsageLibraryVersion);
          put('asset_selection_fingerprint',assetSelectionFingerprint); put('asset_selection_library_version',assetSelectionLibraryVersion);
          const promotionCandidates=(Array.isArray(m.runtimePromotionCandidates)?m.runtimePromotionCandidates:[]).slice(0,64).map(row=>({
            assetId:String(row?.assetId||'').trim(),
            family:String(row?.family||'').trim(),
            license:String(row?.license||'').trim(),
            path:String(row?.path||'').trim()||null,
            robloxAssetId:String(row?.robloxAssetId||'').trim()||null,
            sourceHash:String(row?.sourceHash||'').trim(),
            artifactHash:String(row?.artifactHash||'').trim()||null,
            bindingEvidence:Array.isArray(row?.bindingEvidence)?row.bindingEvidence.map(String).slice(0,8):[],
            candidateSourceBindingVerified:row?.candidateSourceBindingVerified===true,
            generatedByDeclaredRecipe:row?.generatedByDeclaredRecipe===true,
            persistedForCandidate:row?.persistedForCandidate===true
          })).filter(row=>row.assetId&&row.family&&row.license&&row.sourceHash&&row.candidateSourceBindingVerified);
          put('asset_promotion_candidates',JSON.stringify(promotionCandidates));
          const lockFiles=new Set(Array.isArray(m?.compiledWorkContract?.workLock?.files)?m.compiledWorkContract.workLock.files.map(String):[]);
          const generatedAssetFiles=[...new Set((Array.isArray(m.generatedAssetFiles)?m.generatedAssetFiles:[]).map(value=>String(value||'').replaceAll('\\','/').replace(/^\.\//,'')).filter(Boolean))];
          for(const file of generatedAssetFiles){
            if(!file.startsWith('assets/')||file.startsWith('/')||file.split('/').includes('..'))throw new Error('generated asset path invalid:'+file);
            if(!lockFiles.has(file))throw new Error('generated asset missing from work lock:'+file);
          }
          put('generated_asset_files',JSON.stringify(generatedAssetFiles));
          put('request_file',decision==='unity'?`.build-requests/unity/${game}.json`:'');
          NODE

          decision="$(sed -n 's/^candidate_decision=//p' "$GITHUB_OUTPUT" | tail -n1)"
          reason="$(sed -n 's/^candidate_reason=//p' "$GITHUB_OUTPUT" | tail -n1)"
          if [ "$decision" = 'reject' ]; then
            echo 'decision=reject' >> "$GITHUB_OUTPUT"
            echo "reason=$reason" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          task_id="$(sed -n 's/^task_id=//p' "$GITHUB_OUTPUT" | tail -n1)"
          source_root="$(sed -n 's/^source_root=//p' "$GITHUB_OUTPUT" | tail -n1)"
          base_sha="$(sed -n 's/^base_sha=//p' "$GITHUB_OUTPUT" | tail -n1)"
          transport_base_sha="$(sed -n 's/^transport_base_sha=//p' "$GITHUB_OUTPUT" | tail -n1)"
          game_id="$(sed -n 's/^game_id=//p' "$GITHUB_OUTPUT" | tail -n1)"
          production_class="$(sed -n 's/^production_class=//p' "$GITHUB_OUTPUT" | tail -n1)"
          candidate_origin="$(sed -n 's/^origin=//p' "$GITHUB_OUTPUT" | tail -n1)"
          generated_asset_files_json="$(sed -n 's/^generated_asset_files=//p' "$GITHUB_OUTPUT" | tail -n1)"
          mapfile -t generated_asset_files < <(GENERATED_ASSET_FILES="$generated_asset_files_json" node -e "for(const file of JSON.parse(process.env.GENERATED_ASSET_FILES||'[]'))console.log(file)")

          if [ "$candidate_origin" = 'VIBE2_NATIVE' ]; then
            git fetch --no-tags --depth=1 origin +refs/heads/vibe2-unreal-core:refs/remotes/origin/vibe2-unreal-core --quiet
            git show origin/vibe2-unreal-core:.vibe2/queue.json > /tmp/vibe2-current-control-queue.json
            control_state="$(TASK_ID="$task_id" CANDIDATE_BRANCH="$SUBMITTED_CANDIDATE_BRANCH" TARGET="$decision" CANDIDATE_SHA="$candidate_sha" node <<'NODE'
          const fs=require('fs');
          const queue=JSON.parse(fs.readFileSync('/tmp/vibe2-current-control-queue.json','utf8'));
          const task=(queue.tasks||[]).find(row=>String(row?.id||'').trim()===String(process.env.TASK_ID||'').trim());
          const evidence=(task?.evidence||[]).map(value=>String(value||'').trim());
          const blocker=String(task?.blocker||'').trim();
          const target=String(process.env.TARGET||'').trim().toLowerCase();
          const branch=String(process.env.CANDIDATE_BRANCH||'').trim();
          const f9Verified=target!=='web'||(
            evidence.includes('web-f0-f9-verified')
            &&evidence.includes('web-f9-verified')
          );
          const activeCandidate=task
            &&task.status==='running'
            &&/candidate-awaiting-qa-and-deployment|awaiting.*qa/i.test(blocker)
            &&evidence.includes(branch)
            &&evidence.includes('package-review:all-required-roles-pass')
            &&f9Verified;
          const publicationPending=task
            &&target==='web'
            &&task.status==='verified'
            &&evidence.includes(branch)
            &&evidence.includes('package-review:all-required-roles-pass')
            &&f9Verified
            &&evidence.includes('web-publish-after-f9-required')
            &&!evidence.includes('web-publication-retry-resolved');
          const publicationRetry=publicationPending
            &&evidence.includes('web-publication-retry-required');
          const pending=task?.runtimeEvidenceCandidate;
          const evidenceOnly=process.env.EVIDENCE_ONLY==='true';
          const exactProbe=evidenceOnly&&target==='roblox'&&task?.status==='running'
            &&blocker==='candidate-awaiting-runtime-evidence'
            &&pending?.evidenceOnly===true&&pending?.candidateBranch===branch
            &&pending?.candidateSha===process.env.CANDIDATE_SHA;
          process.stdout.write((evidenceOnly?exactProbe:activeCandidate||publicationPending||publicationRetry)?'CURRENT':'STALE');
          NODE
            )"
            if [ "$control_state" != 'CURRENT' ]; then
              echo 'decision=stale' >> "$GITHUB_OUTPUT"
              echo 'reason=stale-candidate-not-current-control-winner' >> "$GITHUB_OUTPUT"
              echo "VIBE2_CANDIDATE_RELEASE_STALE=$SUBMITTED_CANDIDATE_BRANCH"
              exit 0
            fi
            echo "VIBE2_CANDIDATE_CURRENT_WINNER=$SUBMITTED_CANDIDATE_BRANCH"
          fi

          if [ "$EVIDENCE_ONLY" = true ] && { [ "$decision" != roblox ] || [ "$candidate_origin" != VIBE2_NATIVE ]; }; then
            echo 'decision=reject' >> "$GITHUB_OUTPUT"
            echo 'reason=evidence-only-origin-or-target-invalid' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          reject() { echo 'decision=reject' >> "$GITHUB_OUTPUT"; echo "reason=$1" >> "$GITHUB_OUTPUT"; exit 0; }
          [[ "$base_sha" =~ ^[0-9a-fA-F]{40}$ ]] || reject base-main-sha-invalid
          [[ "$transport_base_sha" =~ ^[0-9a-fA-F]{40}$ ]] || reject transport-base-sha-invalid
          # Tree comparisons need the exact contract and transport snapshots.
          if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$base_sha" --quiet || reject base-main-sha-missing
          fi
          git cat-file -e "${base_sha}^{commit}" 2>/dev/null || reject base-main-sha-missing
          if ! git cat-file -e "${transport_base_sha}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$transport_base_sha" --quiet || reject transport-base-sha-missing
          fi
          git cat-file -e "${transport_base_sha}^{commit}" 2>/dev/null || reject transport-base-sha-missing
          candidate_paths=("$source_root" "${generated_asset_files[@]}")
          already_promoted=false
          if [ -n "$(git diff --name-only "$base_sha" origin/main -- "${candidate_paths[@]}")" ]; then
            if git diff --quiet "$candidate_sha" origin/main -- "${candidate_paths[@]}"; then
              already_promoted=true
              echo "VIBE2_CANDIDATE_ALREADY_PROMOTED=$SUBMITTED_CANDIDATE_BRANCH"
            else
              reject source-or-generated-asset-changed-on-main
            fi
          fi
          echo "already_promoted=$already_promoted" >> "$GITHUB_OUTPUT"
          mapfile -t source_changed < <(git diff --name-only "$transport_base_sha" "$candidate_sha" -- "$source_root")
          [ "${#source_changed[@]}" -gt 0 ] || reject no-source-change
          git -c core.whitespace=-blank-at-eol,-blank-at-eof,-space-before-tab diff --check "$transport_base_sha" "$candidate_sha" || reject candidate-diff-check-failed
          mapfile -t changed < <(git diff --name-only "$transport_base_sha" "$candidate_sha")
          for file in "${changed[@]}"; do
            case "$file" in
              "$source_root"/*|.vibe2/candidates/*) ;;
              *)
                printf '%s\n' "${generated_asset_files[@]}" | grep -Fxq "$file" || reject candidate-path-outside-boundary
                ;;
            esac
          done
          echo "VIBE2_CANDIDATE_GENERATED_ASSET_FILES=${generated_asset_files[*]:-NONE}"

          if [ "$decision" = 'roblox' ]; then
            # Source admission precedes packaging; generated evidence belongs to roblox-package.
            test -f "$source_root/default.project.json" || reject roblox-project-missing
            mapfile -d '' source_scripts < <(find "$source_root" -type f \( -name '*.luau' -o -name '*.lua' \) -print0)
            [ "${#source_scripts[@]}" -gt 0 ] || reject roblox-source-scripts-missing
          fi

          if [ "$decision" = 'unity' ] && [ "$production_class" = 'RELEASE_CONFIRMED' ]; then
            GAME_ID="$game_id" node <<'NODE' || reject development-baseline-required
          const {execFileSync}=require('node:child_process');
          const game=String(process.env.GAME_ID||'').trim();
          const prefix=`design/${game}/`;
          let files=[];
          try{files=execFileSync('git',['ls-tree','-r','--name-only','origin/main','--',`design/${game}`],{encoding:'utf8'}).split(/\r?\n/).filter(x=>x.startsWith(prefix)&&x.endsWith('/cycle-status.json')).sort().reverse();}catch{}
          let ready=false;
          for(const file of files){
            try{
              const status=JSON.parse(execFileSync('git',['show',`origin/main:${file}`],{encoding:'utf8'}));
              const gate=status?.baselineGate;
              const e=gate?.evidence||{};
              const minimumDesignPass=e.minimumDesign?.pass===true;
              const unityProjectPass=e.unityProject?.present===true||(
                e.targetPlatformProject?.platform==='UNITY'&&e.targetPlatformProject?.present===true
              );
              const unityTechnicalPass=e.unityTechnical?.pass===true||(
                e.targetPlatformTechnical?.platform==='UNITY'&&e.targetPlatformTechnical?.pass===true
              );
              const webIsNonBlocking=e.webGameplay?.required!==true;
              if(
                gate?.policyDocument==='company-learning/platform-release-roadmap.json'
                &&gate?.state==='DEVELOPMENT_BASELINE_READY'
                &&gate?.ready===true
                &&minimumDesignPass
                &&unityProjectPass
                &&unityTechnicalPass
                &&webIsNonBlocking
              ){ready=true;break;}
            }catch{}
          }
          if(!ready){console.error(`RELEASE_GATE_BLOCKED=${game}:DEVELOPMENT_BASELINE_REQUIRED`);process.exit(1);}
          console.log(`RELEASE_DEVELOPMENT_BASELINE_GATE=${game}:PASS`);
          console.log('RELEASE_DEVELOPMENT_ADMISSION=MINIMUM_DESIGN_PLUS_UNITY_NATIVE_EVIDENCE');
          console.log('UNITY_WEB_RELEASE_GATE_AUTHORITY=NONE');
          NODE
          fi

          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

  web-release:
    needs: inspect
    if: needs.inspect.outputs.decision == 'web'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.inspect.outputs.candidate_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirm Web F9 fan-in handoff before deployment
        run: |
          echo 'WEB_F9_VERIFIED=YES'
          echo 'PLATFORM_F9_VERIFIED=WEB'

      - name: Web syntax QA
        id: webqa
        continue-on-error: true
        env:
          SOURCE_ROOT: ${{ needs.inspect.outputs.source_root }}
          BASE_SHA: ${{ needs.inspect.outputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            case "$file" in *.js|*.mjs|*.cjs) node --check "$file" ;; esac
          done < <(find "$SOURCE_ROOT" -type f -print0)

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { execFileSync } from 'node:child_process';

          const root=String(process.env.SOURCE_ROOT||'').trim();
          const baseSha=String(process.env.BASE_SHA||'').trim();
          const htmlFiles=[];
          const walk=dir=>{
            for(const entry of fs.readdirSync(dir,{withFileTypes:true})){
              const full=path.join(dir,entry.name);
              if(entry.isDirectory())walk(full);
              else if(entry.isFile()&&entry.name.toLowerCase().endsWith('.html'))htmlFiles.push(full);
            }
          };
          walk(root);
          for(const file of htmlFiles){
            const source=fs.readFileSync(file,'utf8');
            const rel=file.replaceAll('\\','/');
            const scripts=[...source.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)]
              .filter(match=>!/\bsrc\s*=\s*/i.test(match[1]||''));
            for(let i=0;i<scripts.length;i++){
              const tmp=path.join(os.tmpdir(),`vibe2-inline-${process.pid}-${i}.mjs`);
              fs.writeFileSync(tmp,scripts[i][2]||'','utf8');
              execFileSync(process.execPath,['--check',tmp],{stdio:'inherit'});
              fs.rmSync(tmp,{force:true});
            }
            let base='';
            try{base=execFileSync('git',['show',`${baseSha}:${rel}`],{encoding:'utf8',maxBuffer:4*1024*1024});}catch{}
            const storageContract=raw=>{
              const text=String(raw||'');
              const literalKeys=[...text.matchAll(/(?:localStorage|sessionStorage)\.(?:getItem|setItem|removeItem)\s*\(\s*['"]([^'"]+)['"]/g)].map(match=>match[1]);
              const variableNames=[...text.matchAll(/(?:localStorage|sessionStorage)\.(?:getItem|setItem|removeItem)\s*\(\s*([A-Za-z_$][\w$]*)\b/g)].map(match=>match[1]);
              const variableBindings={};
              for(const name of [...new Set(variableNames)]){
                const escaped=String(name).replace(/[-/\\^$*+?.()|[\]{}]/g,'\\$&');
                const match=new RegExp('\\b(?:const|let|var)\\s+'+escaped+'\\s*=\\s*([^;\\n]{1,420})\\s*;').exec(text);
                if(match)variableBindings[name]=String(match[1]||'').trim();
              }
              return{literalKeys:[...new Set(literalKeys)],variableBindings};
            };
            const beforeStorage=storageContract(base),afterStorage=storageContract(source);
            for(const key of beforeStorage.literalKeys){
              if(!afterStorage.literalKeys.includes(key))throw new Error('VIBE2_WEB_SAVE_CONTRACT_MUTATION:'+rel+':literal:'+key);
            }
            for(const [name,expression] of Object.entries(beforeStorage.variableBindings)){
              if(afterStorage.variableBindings[name]!==expression)throw new Error('VIBE2_WEB_SAVE_CONTRACT_MUTATION:'+rel+':binding:'+name);
            }
          }
          NODE
          echo 'VIBE2_WEB_INLINE_SCRIPT_QA=PASS'
          echo 'VIBE2_WEB_SAVE_KEY_COMPATIBILITY=PASS'
          echo 'VIBE2_WEB_STATIC_QA=PASS'

      - name: Confirm playable Web deployment authority
        id: release_gate
        if: steps.webqa.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          echo 'eligible=true' >> "$GITHUB_OUTPUT"
          echo 'WEB_DEPLOYMENT_ELIGIBILITY=PLAYABLE_F0_F9_PLUS_STATIC_SAVE_QA'
          echo 'WEB_NATIVE_HOMEPAGE_READINESS_REQUIRED=NO'
          echo 'WEB_PLAYABLE_VERIFIED_MUST_DEPLOY=YES'

      - name: Promote approved web source root through reviewed PR
        id: promote
        if: steps.webqa.outcome == 'success' && steps.release_gate.outputs.eligible == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ROOT: ${{ needs.inspect.outputs.source_root }}
          BASE_SHA: ${{ needs.inspect.outputs.base_sha }}
          TASK_ID: ${{ needs.inspect.outputs.task_id }}
          CANDIDATE_SHA: ${{ needs.inspect.outputs.candidate_sha }}
          ALREADY_PROMOTED: ${{ needs.inspect.outputs.already_promoted }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          if [ "$ALREADY_PROMOTED" = 'true' ]; then
            git diff --quiet "$CANDIDATE_SHA" origin/main -- "$SOURCE_ROOT" || { echo 'already-promoted source no longer matches candidate' >&2; exit 1; }
            promotion_sha="$(git rev-parse origin/main)"
            source_tree_sha="$(git rev-parse "origin/main:$SOURCE_ROOT")"
            [[ "$source_tree_sha" =~ ^[0-9a-f]{40}$ ]]
            for attempt in $(seq 1 60); do
              pages_state="$(gh api -H 'Accept: application/vnd.github+json'                 "repos/$GITHUB_REPOSITORY/commits/$promotion_sha/check-runs?per_page=100"                 --jq '[.check_runs[] | select(.name=="Cloudflare Pages")] | sort_by(.started_at) | last | if . == null then "missing:" else (.status + ":" + (.conclusion // "")) end')"
              echo "VIBE2_WEB_CURRENT_DEPLOYMENT_CHECK=$pages_state"
              case "$pages_state" in
                completed:success) break ;;
                completed:*) echo "Cloudflare Pages current deployment check failed: $pages_state" >&2; exit 1 ;;
              esac
              if [ "$attempt" -ge 60 ]; then echo "Cloudflare Pages current deployment check did not complete successfully" >&2; exit 1; fi
              sleep 10
            done
            echo "promotion_sha=$promotion_sha" >> "$GITHUB_OUTPUT"
            echo "source_tree_sha=$source_tree_sha" >> "$GITHUB_OUTPUT"
            echo "VIBE2_WEB_MAIN_PROMOTION_SOURCE_TREE_SHA=$source_tree_sha"
            echo 'VIBE2_WEB_ALREADY_PROMOTED=YES'
            exit 0
          fi
          [ -z "$(git diff --name-only "$BASE_SHA" origin/main -- "$SOURCE_ROOT")" ] || { echo 'main source changed; replan required' >&2; exit 1; }
          rm -rf /tmp/vibe2-promote
          git worktree prune
          safe_task="$(printf '%s' "$TASK_ID" | tr -cs 'A-Za-z0-9._-' '-' | sed 's/^-*//;s/-*$//' | cut -c1-60)"
          release_branch="automation/vibe2-web-release-${safe_task}-${GITHUB_RUN_ID}"
          git worktree add -b "$release_branch" /tmp/vibe2-promote origin/main >/dev/null
          cd /tmp/vibe2-promote
          git config user.name 'jaewoon-vibe2-release'
          git config user.email 'vibe2-release@users.noreply.github.com'
          git checkout "$CANDIDATE_SHA" -- "$SOURCE_ROOT"
          git -c core.whitespace=-blank-at-eol,-blank-at-eof,-space-before-tab diff --check
          git add "$SOURCE_ROOT"
          git diff --cached --quiet && { echo 'nothing to promote' >&2; exit 1; }
          git commit -m "vibe2: deploy ${TASK_ID}"
          release_commit="$(git rev-parse HEAD)"
          git push origin "HEAD:$release_branch"
          pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$release_branch" --title "vibe2: deploy ${TASK_ID}" --body "Verified Web release candidate. Direct main write: NO. Release PASS requires this PR's CI and merge.")"
          sleep 5
          # The candidate boundary above guarantees this PR only changes SOURCE_ROOT.
          # Require the actual Web deployment target check, not unrelated external services
          # (for example the jaewoon-multiplayer Worker check triggered repository-wide).
          for attempt in $(seq 1 60); do
            pages_state="$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/commits/$release_commit/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name=="Cloudflare Pages")] | sort_by(.started_at) | last | if . == null then "missing:" else (.status + ":" + (.conclusion // "")) end')"
            echo "VIBE2_RELEASE_PAGES_CHECK=$pages_state"
            case "$pages_state" in
              completed:success) break ;;
              completed:*)
                echo "Cloudflare Pages preview check failed: $pages_state" >&2
                exit 1
                ;;
            esac
            if [ "$attempt" -ge 60 ]; then
              echo "Cloudflare Pages preview check did not complete successfully" >&2
              exit 1
            fi
            sleep 10
          done
          git fetch origin main --quiet
          [ -z "$(git diff --name-only "$BASE_SHA" origin/main -- "$SOURCE_ROOT")" ] || { echo 'main source changed before merge; replan required' >&2; exit 1; }
          gh pr merge "$pr_url" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
          git fetch origin main --quiet
          git diff --quiet "$release_commit" origin/main -- "$SOURCE_ROOT"
          promotion_sha="$(git rev-parse origin/main)"
          source_tree_sha="$(git rev-parse "origin/main:$SOURCE_ROOT")"
          [[ "$source_tree_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "promotion_sha=$promotion_sha" >> "$GITHUB_OUTPUT"
          echo "source_tree_sha=$source_tree_sha" >> "$GITHUB_OUTPUT"
          echo "VIBE2_MAIN_PROMOTION_SHA=$promotion_sha"
          echo "VIBE2_WEB_MAIN_PROMOTION_SOURCE_TREE_SHA=$source_tree_sha"
          echo "VIBE2_RELEASE_PR=$pr_url"
          echo 'DIRECT_MAIN_WRITE=NO'

      - name: Settle web result and continue correct source queue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_ID: ${{ needs.inspect.outputs.task_id }}
          GAME_ID: ${{ needs.inspect.outputs.game_id }}
          QA_OUTCOME: ${{ steps.webqa.outcome }}
          PROMOTE_OUTCOME: ${{ steps.promote.outcome }}
          PROMOTED_MAIN_SHA: ${{ steps.promote.outputs.promotion_sha }}
          PROMOTED_SOURCE_TREE_SHA: ${{ steps.promote.outputs.source_tree_sha }}
          CANDIDATE_ORIGIN: ${{ needs.inspect.outputs.origin }}
          CANDIDATE_BRANCH: ${{ needs.inspect.outputs.candidate_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$QA_OUTCOME" = success ] && [ "$PROMOTE_OUTCOME" = success ]; then
            result=PASS
          elif [ "$QA_OUTCOME" != success ]; then
            result=QA_REPAIR_REQUIRED
          else
            result=DEPLOY_RETRY_REQUIRED
          fi
          if [ "$result" = PASS ] && [[ ! "$PROMOTED_SOURCE_TREE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'WEB_PROMOTED_SOURCE_TREE_IDENTITY=INVALID' >&2
            result=DEPLOY_RETRY_REQUIRED
          fi

          if [ "$CANDIDATE_ORIGIN" = 'AUTONOMOUS_DEV_VERIFIED_HANDOFF' ]; then
            if [ "$result" = PASS ]; then
              gh workflow run public-game-health.yml --repo "$GITHUB_REPOSITORY" --ref main -f released_game_id="$GAME_ID" -f release_task_id="$TASK_ID" -f release_origin="$CANDIDATE_ORIGIN" || true
              gh workflow run autonomous-continuous-development.yml --repo "$GITHUB_REPOSITORY" --ref main || true
              echo 'AUTONOMOUS_POST_RELEASE_HEALTH=DISPATCHED'
              echo 'AUTONOMOUS_NEXT_EVOLUTION_CYCLE=DISPATCHED_AFTER_WEB_DEPLOY'
            elif [ "$result" = DEPLOY_RETRY_REQUIRED ]; then
              echo 'AUTONOMOUS_WEB_PUBLICATION_RETRY_REQUIRED=YES'
              gh workflow run vibe2-candidate-release.yml --repo "$GITHUB_REPOSITORY" --ref main -f candidate_branch="$CANDIDATE_BRANCH" || true
            else
              echo 'AUTONOMOUS_WEB_QA_REPAIR_REQUIRED=YES'
              gh workflow run autonomous-continuous-development.yml --repo "$GITHUB_REPOSITORY" --ref main || true
            fi
            echo "AUTONOMOUS_RELEASE_RESULT=$result"
            exit 0
          fi

          if [ "$result" = DEPLOY_RETRY_REQUIRED ]; then
            echo "WEB_PUBLICATION_RETRY_REQUIRED=${TASK_ID:-NONE}:${CANDIDATE_BRANCH:-NONE}"
            echo 'WEB_PUBLICATION_OUTCOME_BLOCKS_EVOLUTION=YES'
            echo 'WEB_SAME_VERIFIED_CANDIDATE_RETRY=YES'
            gh workflow run vibe2-candidate-release.yml --repo "$GITHUB_REPOSITORY" --ref main -f candidate_branch="$CANDIDATE_BRANCH" || true
            exit 0
          fi

          rm -rf /tmp/vibe2-control
          gh auth setup-git --hostname github.com
          gh repo clone "$GITHUB_REPOSITORY" /tmp/vibe2-control -- --branch vibe2-unreal-core --single-branch --depth=1 --no-tags >/dev/null 2>&1
          git -C /tmp/vibe2-control fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main --quiet
          rm -rf /tmp/vibe2-main-contract
          git -C /tmp/vibe2-control worktree add --detach /tmp/vibe2-main-contract origin/main >/dev/null
          cd /tmp/vibe2-control
          git config user.name 'jaewoon-vibe2-release'
          git config user.email 'vibe2-release@users.noreply.github.com'
          settled=0
          attempt=0
          while true; do
            attempt=$((attempt+1))
            echo "VIBE2_CANDIDATE_QUEUE_WRITE_ATTEMPT=$attempt"
            git fetch --no-tags --depth=1 origin +refs/heads/vibe2-unreal-core:refs/remotes/origin/vibe2-unreal-core --quiet
            git reset --hard origin/vibe2-unreal-core
            if [ "$result" = PASS ]; then
              node /tmp/vibe2-main-contract/tools/vibe2-queue-control.mjs pass --id="$TASK_ID" --evidence="web-f0-f9-verified,web-f9-verified,web-playable-deployment-required,web-deploy-attempted,web-static-qa-pass,web-cloudflare-deployment-pass,main-pr-merged,web-runtime-source-tree:${PROMOTED_SOURCE_TREE_SHA},web-main-sha:${PROMOTED_MAIN_SHA},web-publication-retry-resolved,actions-run-${GITHUB_RUN_ID}"
            else
              node /tmp/vibe2-main-contract/tools/vibe2-queue-control.mjs fail --id="$TASK_ID" --blocker=web-release-qa-failed --evidence="web-f0-f9-verified,web-f9-verified,web-playable-deployment-required,web-qa-${QA_OUTCOME},actions-run-${GITHUB_RUN_ID}"
            fi
            git add .vibe2/queue.json
            if git diff --cached --quiet; then
              settled=1
              break
            fi
            git commit -m "vibe2: settle web task ${TASK_ID} ${result} [skip ci]"
            if git push origin HEAD:vibe2-unreal-core; then
              settled=1
              break
            fi
            sleep_for=$((attempt<5?attempt:5))
            echo "VIBE2_CANDIDATE_QUEUE_WRITE_RACE=RETRY:$attempt:$sleep_for"
            sleep "$sleep_for"
          done
          test "$settled" = 1

          payload_outcome=QUEUE_UPDATED
          payload_reason=web-release-qa-repair-required
          if [ "$result" = PASS ]; then
            payload_outcome=VERIFIED
            payload_reason=web-playable-deployed-next-cycle
          fi
          payload="$(jq -nc \
            --arg run "${GITHUB_RUN_ID:-}" \
            --arg attempt "${GITHUB_RUN_ATTEMPT:-}" \
            --arg task "${TASK_ID:-}" \
            --arg outcome "$payload_outcome" \
            --arg reason "$payload_reason" \
            '{event_type:"vibe2-fanin-refill",client_payload:{source_run:$run,source_attempt:$attempt,source_task:$task,source_outcome:$outcome,reason:$reason}}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
            --data "$payload"

          echo "VIBE2_EVENT_DRIVEN_DEPENDENCY_REFILL=${TASK_ID:-NONE}:$payload_outcome"
          echo "WEB_DEPLOY_ATTEMPTED=$GAME_ID:$result"
          if [ "$result" = PASS ]; then
            echo "WEB_NEXT_EVOLUTION_CYCLE_DISPATCHED=$GAME_ID"
            echo "PLATFORM_NEXT_EVOLUTION_CYCLE_DISPATCHED=WEB:$GAME_ID"
            echo 'WEB_PUBLICATION_OUTCOME_BLOCKS_EVOLUTION=YES_UNTIL_DEPLOYED'
            echo 'VIBE2_WEB_AUTO_DEPLOY=PASS'
            echo "VIBE2_WEB_TASK_FINAL_PASS=EXACT_SOURCE_RUNTIME_AND_DEPLOYMENT:${PROMOTED_SOURCE_TREE_SHA}"
          else
            echo 'WEB_QA_REPAIR_REQUIRED=YES'
          fi
          exit 0

  unity-web-build:
    needs: inspect
    if: needs.inspect.outputs.decision == 'unity-web'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Dispatch candidate Unity Web QA and reviewed promotion
        id: dispatch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_ID: ${{ needs.inspect.outputs.game_id }}
          SOURCE_ROOT: ${{ needs.inspect.outputs.source_root }}
          CANDIDATE_SHA: ${{ needs.inspect.outputs.candidate_sha }}
          BASE_SHA: ${{ needs.inspect.outputs.base_sha }}
          TASK_ID: ${{ needs.inspect.outputs.task_id }}
          CANDIDATE_BRANCH: ${{ needs.inspect.outputs.candidate_branch }}
          GENERATED_ASSET_FILES: ${{ needs.inspect.outputs.generated_asset_files }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run unity-web-first-stage-build.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f game_id="$GAME_ID" \
            -f project_path="$SOURCE_ROOT" \
            -f source_commit="$CANDIDATE_SHA" \
            -f base_main_sha="$BASE_SHA" \
            -f publish_to_main=true \
            -f vibe2_task_id="$TASK_ID" \
            -f vibe2_candidate_branch="$CANDIDATE_BRANCH" \
            -f generated_asset_files="$GENERATED_ASSET_FILES"
          echo 'VIBE2_UNITY_WEB_RELEASE_DISPATCHED=YES'
          echo "VIBE2_CANDIDATE_EXECUTION_SURFACE=UNITY_WEB"

      - name: Recover queue if Unity Web dispatch failed
        if: steps.dispatch.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_ID: ${{ needs.inspect.outputs.task_id }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/vibe2-control
          gh auth setup-git --hostname github.com
          gh repo clone "$GITHUB_REPOSITORY" /tmp/vibe2-control -- --branch vibe2-unreal-core --single-branch --depth=1 --no-tags >/dev/null 2>&1
          git -C /tmp/vibe2-control fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main --quiet
          rm -rf /tmp/vibe2-main-contract
          git -C /tmp/vibe2-control worktree add --detach /tmp/vibe2-main-contract origin/main >/dev/null
          cd /tmp/vibe2-control
          git config user.name 'jaewoon-vibe2-release'
          git config user.email 'vibe2-release@users.noreply.github.com'
          settled=0
          attempt=0
          while true; do
            attempt=$((attempt+1))
            echo "VIBE2_CANDIDATE_QUEUE_WRITE_ATTEMPT=$attempt"
            git fetch --no-tags --depth=1 origin +refs/heads/vibe2-unreal-core:refs/remotes/origin/vibe2-unreal-core --quiet
            git reset --hard origin/vibe2-unreal-core
            node /tmp/vibe2-main-contract/tools/vibe2-queue-control.mjs fail --id="$TASK_ID" --blocker=unity-web-build-dispatch-failed --evidence="actions-run-${GITHUB_RUN_ID}"
            git add .vibe2/queue.json
            if git diff --cached --quiet; then
              settled=1
              break
            fi
            git commit -m "vibe2: recover Unity Web dispatch failure ${TASK_ID} [skip ci]"
            if git push origin HEAD:vibe2-unreal-core; then
              settled=1
              break
            fi
            sleep_for=$((attempt<5?attempt:5))
            echo "VIBE2_CANDIDATE_QUEUE_WRITE_RACE=RETRY:$attempt:$sleep_for"
            sleep "$sleep_for"
          done
          test "$settled" = 1
          payload="$(jq -nc \
            --arg run "${GITHUB_RUN_ID:-}" \
            --arg attempt "${GITHUB_RUN_ATTEMPT:-}" \
            --arg task "${TASK_ID:-}" \
            --arg outcome "QUEUE_UPDATED" \
            '{event_type:"vibe2-fanin-refill",client_payload:{source_run:$run,source_attempt:$attempt,source_task:$task,source_outcome:$outcome,reason:"dependency-or-retry-ready"}}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
            --data "$payload"
          echo "VIBE2_EVENT_DRIVEN_DEPENDENCY_REFILL=${TASK_ID:-NONE}:QUEUE_UPDATED"
          exit 1

