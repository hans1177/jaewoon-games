name: Company GAME_SEED Bootstrap

on:
  workflow_dispatch:
  schedule:
    - cron: '30 15 * * *' # 00:30 KST; without a score-approved expansion request no seed is created
  push:
    branches: [main]
    paths:
      - 'COMPANY_FLOW.md'
      - 'company-directive.json'
      - 'game-seed-market-evidence.json'
      - 'tools/game-seed-state.mjs'
      - 'tools/company-game-seed-contract.mjs'
      - 'tools/company-game-seed-bootstrap.mjs'
      - 'tools/company-game-seed-semantic-normalize.mjs'
      - 'tools/company-game-seed-quality-gate.mjs'
      - 'tools/company-design-cycle.mjs'
      - 'tools/artbook-production-pipeline.mjs'
      - 'tools/company-baseline-gate.mjs'
      - 'tools/company-design-artbook.mjs'
      - 'qa/company-game-seed-flow.test.mjs'
      - 'qa/company-game-seed-state-file.test.mjs'
      - 'qa/company-seed-design-runtime-stall.test.mjs'
      - '.github/workflows/company-game-seed-bootstrap.yml'
      - '.github/workflows/company-seed-design-runtime.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: company-game-seed-bootstrap
  cancel-in-progress: false

env:
  GAME_SEED_LOCAL_MODEL: gemma3:1b
  OLLAMA_VERSION: '0.33.3'
  COMPANY_RUNTIME_BRANCH: company-runtime

jobs:
  seed-bootstrap-or-portfolio-expansion:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare isolated company runtime branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if git ls-remote --exit-code --heads origin "$COMPANY_RUNTIME_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$COMPANY_RUNTIME_BRANCH"
            if git cat-file -e "origin/$COMPANY_RUNTIME_BRANCH:game-seed-state.json" 2>/dev/null; then
              git checkout "origin/$COMPANY_RUNTIME_BRANCH" -- game-seed-state.json
              git reset -- game-seed-state.json >/dev/null 2>&1 || true
            fi
          fi
          test -f game-seed-state.json
          cp game-seed-state.json /tmp/company-runtime-seed-state-before.json
          echo "COMPANY_ENGINE_BASE=$(git rev-parse HEAD)"
          echo 'COMPANY_RUNTIME_STATE_OVERLAY=GAME_SEED_ONLY'
          echo 'COMPANY_ENGINE_SOURCE=main'
          echo 'PUBLIC_MAIN_WRITE=NO'

      - name: Static GAME_SEED contract QA
        run: |
          node --check tools/game-seed-state.mjs
          node --check tools/company-game-seed-contract.mjs
          node --check tools/company-game-seed-bootstrap.mjs
          node --check tools/company-game-seed-semantic-normalize.mjs
          node --check tools/company-game-seed-quality-gate.mjs
          node --test qa/company-game-seed-flow.test.mjs
          node --test qa/autonomous-portfolio-continuation.test.mjs

      - name: Decide whether a model call is needed
        id: need
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import {loadSeedState,pendingPortfolioSeedRequests} from './tools/game-seed-state.mjs';
          const state=loadSeedState();
          const initial=!state.bootstrapCompletedAt;
          const pending=initial?[]:pendingPortfolioSeedRequests(state);
          const need=initial||pending.length>0;
          console.log(`model=${need?'true':'false'}`);
          console.log(`request_count=${initial?6:pending.length}`);
          console.log(`reason=${initial?'HISTORICAL_INITIAL_SIX_SEED_BOOTSTRAP':need?'DEPARTMENT_SCORE_GUIDED_PORTFOLIO_EXPANSION':'NO_PORTFOLIO_EXPANSION_DECISION'}`);
          NODE

      - name: Verified free budget preflight
        if: steps.need.outputs.model == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node tools/free-budget-telemetry.mjs \
            --verify-public-repo=true \
            --runner=ubuntu-latest \
            --model-calls=1 \
            --runner-minutes=20 \
            --output=.autonomous/free-budget-telemetry.json
          node -e "const r=require('./.autonomous/free-budget-telemetry.json');if(r.allowed!==true)process.exit(1)"
          echo 'GAME_SEED_FREE_BUDGET_PREFLIGHT=PASS'
          echo 'GAME_SEED_MODEL_CALLS_MAX_THIS_RUN=1'

      - name: Prepare free local GAME_SEED model
        if: steps.need.outputs.model == 'true'
        uses: ./.github/actions/prepare-ollama
        with:
          model: ${{ env.GAME_SEED_LOCAL_MODEL }}
          version: ${{ env.OLLAMA_VERSION }}
          pull-model: 'true'

      - name: Generate historical bootstrap seeds or score-approved portfolio expansions
        if: steps.need.outputs.model == 'true'
        env:
          GAME_SEED_MARKET_EVIDENCE_FILE: game-seed-market-evidence.json
        run: |
          node tools/company-game-seed-bootstrap.mjs | tee /tmp/game-seed-result.txt
          grep -q 'GAME_SEED_PAID_API=NO' /tmp/game-seed-result.txt
          grep -q 'GAME_SEED_MODEL_CALLS=1' /tmp/game-seed-result.txt
          grep -q 'GAME_SEED_MARKET_SCOPE=GLOBAL' /tmp/game-seed-result.txt

      - name: Normalize active GAME_SEED semantics to current central policy
        env:
          GAME_SEED_MARKET_EVIDENCE_FILE: game-seed-market-evidence.json
        run: |
          set -euo pipefail
          node tools/company-game-seed-semantic-normalize.mjs

      - name: Enforce central GAME_SEED contract and semantic quality
        env:
          GAME_SEED_MARKET_EVIDENCE_FILE: game-seed-market-evidence.json
        run: |
          set -euo pipefail
          node tools/company-game-seed-quality-gate.mjs

      - name: Record no-expansion decision when there is no score-approved request
        if: steps.need.outputs.model != 'true'
        run: |
          echo 'GAME_SEED_ACTION=NO_PORTFOLIO_EXPANSION_DECISION'
          echo 'GAME_SEED_CREATED_COUNT=0'
          echo 'PORTFOLIO_EXPANSION_DECISION=NONE'

      - name: Validate GAME_SEED state
        run: |
          node --test qa/company-game-seed-state-file.test.mjs
          git diff --check

      - name: Persist validated GAME_SEED state to company runtime branch
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-game-seed'
          git config user.email 'game-seed@users.noreply.github.com'
          if cmp -s game-seed-state.json /tmp/company-runtime-seed-state-before.json; then
            echo 'persisted=false' >> "$GITHUB_OUTPUT"
            echo 'GAME_SEED_STATE_CHANGE=NO'
            exit 0
          fi
          git add -- game-seed-state.json
          git commit -m "runtime: apply central GAME_SEED portfolio state"
          generated_commit="$(git rev-parse HEAD)"
          pushed=0
          persisted=false
          for attempt in 1 2 3 4; do
            git fetch origin "$COMPANY_RUNTIME_BRANCH" main
            if git show-ref --verify --quiet "refs/remotes/origin/$COMPANY_RUNTIME_BRANCH"; then
              git checkout -B game-seed-persist "origin/$COMPANY_RUNTIME_BRANCH"
            else
              git checkout -B game-seed-persist origin/main
            fi
            git checkout "$generated_commit" -- game-seed-state.json
            git add -- game-seed-state.json
            if git diff --cached --quiet; then
              pushed=1
              echo 'GAME_SEED_STATE_CHANGE=ALREADY_PERSISTED'
              break
            fi
            git commit -m "runtime: apply central GAME_SEED portfolio state"
            if git push origin "HEAD:refs/heads/$COMPANY_RUNTIME_BRANCH"; then
              pushed=1
              persisted=true
              break
            fi
            git reset --hard "$generated_commit"
            sleep $((attempt * 2))
          done
          test "$pushed" = 1
          echo "persisted=$persisted" >> "$GITHUB_OUTPUT"
          echo "GAME_SEED_RUNTIME_BRANCH=$COMPANY_RUNTIME_BRANCH"
          echo 'PUBLIC_MAIN_WRITE=NO'
          echo 'PAID_API=NO'

      - name: Continue validated seeds into DESIGN_ONLY work
        if: steps.persist.outputs.persisted == 'true' || github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run company-seed-design-runtime.yml --ref main
          echo 'GAME_SEED_DESIGN_CONTINUATION_DISPATCHED=YES'
          echo "GAME_SEED_DESIGN_DISPATCH_SOURCE=${GITHUB_EVENT_NAME}"

      - name: Summary
        if: always()
        run: |
          echo '### Company GAME_SEED Bootstrap' >> "$GITHUB_STEP_SUMMARY"
          echo '- policy source: COMPANY_FLOW.md' >> "$GITHUB_STEP_SUMMARY"
          echo '- historical initial generation: one six-category batch only; it is not a portfolio quota' >> "$GITHUB_STEP_SUMMARY"
          echo '- ongoing creation: only score-approved five-department portfolio EXPAND requests or owner override' >> "$GITHUB_STEP_SUMMARY"
          echo '- portfolio size: dynamic; no fixed slots, hard minimum, or hard maximum' >> "$GITHUB_STEP_SUMMARY"
          echo '- market evidence: directional reference only; missing market metrics do not reject a seed by themselves' >> "$GITHUB_STEP_SUMMARY"
          echo '- target platform: Roblox default, not a lock; Roblox/Unity/Fortnite UEFN may be selected per project' >> "$GITHUB_STEP_SUMMARY"
          echo '- runtime persistence: company-runtime branch; main stays unchanged' >> "$GITHUB_STEP_SUMMARY"
          echo '- source code: own implementation only' >> "$GITHUB_STEP_SUMMARY"
          echo '- public game source write: NO' >> "$GITHUB_STEP_SUMMARY"
