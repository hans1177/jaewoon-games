name: Company GAME_SEED Bootstrap

on:
  workflow_dispatch:
  schedule:
    - cron: '30 15 * * *' # 00:30 KST; no vacancy means no seed creation
  push:
    branches: [main]
    paths:
      - 'COMPANY_FLOW.md'
      - 'company-directive.json'
      - 'game-seed-market-evidence.json'
      - 'tools/game-seed-state.mjs'
      - 'tools/company-game-seed-contract.mjs'
      - 'tools/company-game-seed-bootstrap.mjs'
      - 'tools/company-game-seed-semantic-normalize.mjs'
      - 'tools/company-game-seed-quality-gate.mjs'
      - 'qa/company-game-seed-flow.test.mjs'
      - '.github/workflows/company-game-seed-bootstrap.yml'
      - '.github/workflows/company-seed-design-runtime.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: company-game-seed-bootstrap
  cancel-in-progress: false

env:
  GAME_SEED_LOCAL_MODEL: gemma3:1b
  OLLAMA_VERSION: '0.33.3'
  COMPANY_RUNTIME_BRANCH: company-runtime

jobs:
  seed-bootstrap-or-replenish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare isolated company runtime branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-company-runtime'
          git config user.email 'company-runtime@users.noreply.github.com'
          git fetch origin main
          if git ls-remote --exit-code --heads origin "$COMPANY_RUNTIME_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$COMPANY_RUNTIME_BRANCH"
            git checkout -B "$COMPANY_RUNTIME_BRANCH" "origin/$COMPANY_RUNTIME_BRANCH"
            git merge --no-edit origin/main
          else
            git checkout -B "$COMPANY_RUNTIME_BRANCH" origin/main
          fi
          echo "COMPANY_RUNTIME_BASE=$(git rev-parse HEAD)"
          echo 'PUBLIC_MAIN_WRITE=NO'

      - name: Static GAME_SEED contract QA
        run: |
          node --check tools/game-seed-state.mjs
          node --check tools/company-game-seed-contract.mjs
          node --check tools/company-game-seed-bootstrap.mjs
          node --check tools/company-game-seed-semantic-normalize.mjs
          node --check tools/company-game-seed-quality-gate.mjs
          node --test qa/company-game-seed-flow.test.mjs
          node --test qa/autonomous-portfolio-continuation.test.mjs

      - name: Decide whether a model call is needed
        id: need
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import {loadSeedState,unfilledVacancies} from './tools/game-seed-state.mjs';
          const s=loadSeedState();
          const need=!s.bootstrapCompletedAt||unfilledVacancies(s).length>0;
          console.log(`model=${need?'true':'false'}`);
          console.log(`reason=${!s.bootstrapCompletedAt?'INITIAL_SIX_SEED_BOOTSTRAP':need?'ONE_FOR_ONE_VACANCY':'NO_VACANCY'}`);
          NODE

      - name: Verified free budget preflight
        if: steps.need.outputs.model == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node tools/free-budget-telemetry.mjs \
            --verify-public-repo=true \
            --runner=ubuntu-latest \
            --model-calls=1 \
            --runner-minutes=20 \
            --output=.autonomous/free-budget-telemetry.json
          node -e "const r=require('./.autonomous/free-budget-telemetry.json');if(r.allowed!==true)process.exit(1)"
          echo 'GAME_SEED_FREE_BUDGET_PREFLIGHT=PASS'
          echo 'GAME_SEED_MODEL_CALLS_MAX_THIS_RUN=1'

      - name: Prepare free local GAME_SEED model
        if: steps.need.outputs.model == 'true'
        uses: ./.github/actions/prepare-ollama
        with:
          model: ${{ env.GAME_SEED_LOCAL_MODEL }}
          version: ${{ env.OLLAMA_VERSION }}
          pull-model: 'true'

      - name: Generate initial six seeds or exact vacancy replacements
        if: steps.need.outputs.model == 'true'
        env:
          GAME_SEED_MARKET_EVIDENCE_FILE: game-seed-market-evidence.json
        run: |
          node tools/company-game-seed-bootstrap.mjs | tee /tmp/game-seed-result.txt
          grep -q 'GAME_SEED_PAID_API=NO' /tmp/game-seed-result.txt
          grep -q 'GAME_SEED_MODEL_CALLS=1' /tmp/game-seed-result.txt
          grep -q 'GAME_SEED_MARKET_SCOPE=GLOBAL' /tmp/game-seed-result.txt

      - name: Normalize category semantics and global target evidence
        if: steps.need.outputs.model == 'true'
        env:
          GAME_SEED_MARKET_EVIDENCE_FILE: game-seed-market-evidence.json
        run: |
          set -euo pipefail
          node tools/company-game-seed-semantic-normalize.mjs

      - name: Reject category-mismatched generic or country-scoped GAME_SEED output
        if: steps.need.outputs.model == 'true'
        env:
          GAME_SEED_MARKET_EVIDENCE_FILE: game-seed-market-evidence.json
        run: |
          set -euo pipefail
          node tools/company-game-seed-quality-gate.mjs

      - name: Stop with no growth when there is no vacancy
        if: steps.need.outputs.model != 'true'
        run: |
          echo 'GAME_SEED_ACTION=NO_VACANCY'
          echo 'GAME_SEED_CREATED_COUNT=0'
          echo 'AUTOMATIC_SEED_GROWTH=NO'

      - name: Validate generated state
        if: steps.need.outputs.model == 'true'
        run: |
          node --test qa/company-game-seed-state-file.test.mjs
          git diff --check

      - name: Persist validated GAME_SEED state to company runtime branch
        id: persist
        if: steps.need.outputs.model == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-game-seed'
          git config user.email 'game-seed@users.noreply.github.com'
          git add game-seed-state.json
          if git diff --cached --quiet; then
            echo 'persisted=false' >> "$GITHUB_OUTPUT"
            echo 'GAME_SEED_STATE_CHANGE=NO'
            exit 0
          fi
          git commit -m "runtime: bootstrap or replenish GAME_SEED state"
          git push origin "HEAD:refs/heads/$COMPANY_RUNTIME_BRANCH"
          echo 'persisted=true' >> "$GITHUB_OUTPUT"
          echo "GAME_SEED_RUNTIME_BRANCH=$COMPANY_RUNTIME_BRANCH"
          echo 'PUBLIC_MAIN_WRITE=NO'
          echo 'PAID_API=NO'

      - name: Continue persisted seeds into DESIGN_ONLY work
        if: steps.persist.outputs.persisted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run company-seed-design-runtime.yml --ref main
          echo 'GAME_SEED_DESIGN_CONTINUATION_DISPATCHED=YES'

      - name: Summary
        if: always()
        run: |
          echo '### Company GAME_SEED Bootstrap' >> "$GITHUB_STEP_SUMMARY"
          echo '- target market: GLOBAL; country-specific evidence is secondary context only' >> "$GITHUB_STEP_SUMMARY"
          echo '- initial generation: one atomic six-category batch' >> "$GITHUB_STEP_SUMMARY"
          echo '- local model calls: one batch call per generation run' >> "$GITHUB_STEP_SUMMARY"
          echo '- semantic quality: category concept groups + concrete core loop + sourced global age/revenue/playtime evidence required before persistence' >> "$GITHUB_STEP_SUMMARY"
          echo '- recurring schedule: vacancy check only; no vacancy = no new seed' >> "$GITHUB_STEP_SUMMARY"
          echo '- replenishment: one-for-one same category unless owner changes category' >> "$GITHUB_STEP_SUMMARY"
          echo '- runtime persistence: company-runtime branch; main stays unchanged' >> "$GITHUB_STEP_SUMMARY"
          echo '- numeric market claims: source + observedAt required' >> "$GITHUB_STEP_SUMMARY"
          echo '- source code: own implementation only' >> "$GITHUB_STEP_SUMMARY"
          echo '- public game source write: NO' >> "$GITHUB_STEP_SUMMARY"
