name: Company GAME_SEED Bootstrap

on:
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *' # hourly watchdog; event chain remains primary progression
  push:
    branches: [main]
    paths:
      - 'COMPANY_FLOW.md'
      - 'company-directive.json'
      - 'game-seed-market-evidence.json'
      - 'game-seed-platform-profiles.json'
      - 'tools/game-seed-state.mjs'
      - 'tools/company-game-seed-contract.mjs'
      - 'tools/company-game-seed-bootstrap.mjs'
      - 'tools/company-game-seed-semantic-normalize.mjs'
      - 'tools/company-game-seed-quality-gate.mjs'
      - 'tools/company-strict-production-review.mjs'
      - '.github/workflows/company-game-seed-bootstrap.yml'
      - '.github/workflows/company-seed-design-runtime.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: company-game-seed-bootstrap
  cancel-in-progress: false

env:
  GAME_SEED_LOCAL_MODEL: gemma3:1b
  OLLAMA_VERSION: '0.33.3'
  COMPANY_RUNTIME_BRANCH: company-runtime

jobs:
  seed-bootstrap-or-idle-expansion:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare isolated company runtime branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if git ls-remote --exit-code --heads origin "$COMPANY_RUNTIME_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$COMPANY_RUNTIME_BRANCH"
            for runtime_path in game-seed-state.json development-queue.json; do
              if git cat-file -e "origin/$COMPANY_RUNTIME_BRANCH:$runtime_path" 2>/dev/null; then
                git show "origin/$COMPANY_RUNTIME_BRANCH:$runtime_path" > "/tmp/$runtime_path"
              fi
            done
            if [ -f /tmp/game-seed-state.json ]; then cp /tmp/game-seed-state.json game-seed-state.json; fi
          fi
          test -f game-seed-state.json
          cp game-seed-state.json /tmp/company-runtime-seed-state-before.json
          echo 'PUBLIC_MAIN_WRITE=NO'

      - name: Static GAME_SEED contract QA
        run: |
          node --check tools/game-seed-state.mjs
          node --check tools/company-game-seed-contract.mjs
          node --check tools/company-game-seed-bootstrap.mjs
          node --check tools/company-game-seed-semantic-normalize.mjs
          node --check tools/company-strict-production-review.mjs

      - name: Decide creation mode
        id: need
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import fs from 'node:fs';
          import {loadSeedState,pendingPortfolioSeedRequests} from './tools/game-seed-state.mjs';
          const state=loadSeedState();
          const initial=!state.bootstrapCompletedAt;
          const pending=initial?[]:pendingPortfolioSeedRequests(state);
          let otherWork=false;
          try{
            const q=JSON.parse(fs.readFileSync('/tmp/development-queue.json','utf8'));
            otherWork=(q.items||[]).some(item=>{
              const s=String(item.canonicalState||item.status||'').toUpperCase();
              return !['DEVELOPMENT_BASELINE_READY','RELEASE_READY','DISCARDED','DEVELOPMENT_BLOCKED','COMPLETE','DONE'].includes(s);
            });
          }catch{}
          const lastMain=Number(process.env.LAST_MAIN_COMMIT_EPOCH||0);
          const now=Math.floor(Date.now()/1000);
          const mainIdle24h=lastMain>0&&(now-lastMain)>=86400;
          const idleEligible=!initial&&!pending.length&&!otherWork&&mainIdle24h;
          const need=initial||pending.length>0||idleEligible;
          const reason=initial?'HISTORICAL_BOOTSTRAP':pending.length?'PORTFOLIO_REQUEST':'IDLE_24H_AUTONOMOUS_PRODUCTION';
          const count=initial?6:pending.length?Math.min(3,pending.length):idleEligible?3:0;
          console.log(`model=${need?'true':'false'}`);
          console.log(`reason=${need?reason:'NO_CREATION_REQUIRED'}`);
          console.log(`request_count=${count}`);
          console.log(`idle=${idleEligible?'true':'false'}`);
          console.log(`other_work=${otherWork?'true':'false'}`);
          NODE
        env:
          LAST_MAIN_COMMIT_EPOCH: ${{ github.event.repository.pushed_at || 0 }}

      - name: Resolve reliable main idle age
        id: age
        shell: bash
        run: |
          echo "last_main_epoch=$(git log -1 --format=%ct origin/main)" >> "$GITHUB_OUTPUT"

      - name: Re-evaluate idle with git commit age
        id: finalneed
        shell: bash
        env:
          PRE_MODEL: ${{ steps.need.outputs.model }}
          PRE_REASON: ${{ steps.need.outputs.reason }}
          PRE_COUNT: ${{ steps.need.outputs.request_count }}
          LAST_MAIN_EPOCH: ${{ steps.age.outputs.last_main_epoch }}
        run: |
          set -euo pipefail
          model="$PRE_MODEL"; reason="$PRE_REASON"; count="$PRE_COUNT"
          if [ "$model" != true ] && [ -n "$LAST_MAIN_EPOCH" ]; then
            now="$(date +%s)"; age=$((now - LAST_MAIN_EPOCH))
            if [ "$age" -ge 86400 ]; then
              busy=false
              if [ -f /tmp/development-queue.json ]; then
                busy="$(node -e "const q=require('/tmp/development-queue.json');console.log((q.items||[]).some(x=>!['DEVELOPMENT_BASELINE_READY','RELEASE_READY','DISCARDED','DEVELOPMENT_BLOCKED','COMPLETE','DONE'].includes(String(x.canonicalState||x.status||'').toUpperCase())))")"
              fi
              if [ "$busy" != true ]; then model=true;reason=IDLE_24H_AUTONOMOUS_PRODUCTION;count=3;fi
            fi
          fi
          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "request_count=$count" >> "$GITHUB_OUTPUT"
          if [ "$reason" = IDLE_24H_AUTONOMOUS_PRODUCTION ]; then echo 'idle_target_count=3' >> "$GITHUB_OUTPUT"; else echo 'idle_target_count=0' >> "$GITHUB_OUTPUT"; fi

      - name: Verified free budget preflight
        if: steps.finalneed.outputs.model == 'true'
        run: |
          node tools/free-budget-telemetry.mjs --verify-public-repo=true --runner=ubuntu-latest --model-calls=1 --runner-minutes=20 --output=.autonomous/free-budget-telemetry.json
          node -e "const r=require('./.autonomous/free-budget-telemetry.json');if(r.allowed!==true)process.exit(1)"
          echo 'GAME_SEED_MODEL_CALLS_MAX_THIS_RUN=1'

      - name: Prepare free local GAME_SEED model
        if: steps.finalneed.outputs.model == 'true'
        uses: ./.github/actions/prepare-ollama
        with:
          model: ${{ env.GAME_SEED_LOCAL_MODEL }}
          version: ${{ env.OLLAMA_VERSION }}
          pull-model: 'true'

      - name: Compose GAME_SEED from mixed materials
        if: steps.finalneed.outputs.model == 'true'
        env:
          GAME_SEED_MARKET_EVIDENCE_FILE: game-seed-market-evidence.json
          GAME_SEED_IDLE_TARGET_COUNT: ${{ steps.finalneed.outputs.idle_target_count }}
        run: |
          node tools/company-game-seed-bootstrap.mjs | tee /tmp/game-seed-result.txt
          grep -q 'GAME_SEED_PAID_API=NO' /tmp/game-seed-result.txt
          grep -q 'SEED_MATERIAL_POOL_TARGET=100' /tmp/game-seed-result.txt
          grep -q 'TARGET_SESSION_MINUTES=30' /tmp/game-seed-result.txt

      - name: Normalize active GAME_SEED semantics
        env:
          GAME_SEED_MARKET_EVIDENCE_FILE: game-seed-market-evidence.json
        run: node tools/company-game-seed-semantic-normalize.mjs

      - name: Enforce GAME_SEED quality contract
        env:
          GAME_SEED_MARKET_EVIDENCE_FILE: game-seed-market-evidence.json
        run: node tools/company-game-seed-quality-gate.mjs

      - name: Persist GAME_SEED state to company runtime branch
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-game-seed';git config user.email 'game-seed@users.noreply.github.com'
          if cmp -s game-seed-state.json /tmp/company-runtime-seed-state-before.json; then echo 'persisted=false' >> "$GITHUB_OUTPUT";exit 0;fi
          git add game-seed-state.json;git commit -m 'runtime: update seed material pool and composed seeds';generated="$(git rev-parse HEAD)";pushed=0
          for attempt in 1 2 3 4; do
            git fetch origin "$COMPANY_RUNTIME_BRANCH" main
            if git show-ref --verify --quiet "refs/remotes/origin/$COMPANY_RUNTIME_BRANCH"; then git checkout -B game-seed-persist "origin/$COMPANY_RUNTIME_BRANCH"; else git checkout -B game-seed-persist origin/main; fi
            git checkout "$generated" -- game-seed-state.json;git add game-seed-state.json
            if git diff --cached --quiet; then pushed=1;break;fi
            git commit -m 'runtime: update seed material pool and composed seeds'
            if git push origin "HEAD:refs/heads/$COMPANY_RUNTIME_BRANCH"; then pushed=1;break;fi
            git reset --hard "$generated";sleep $((attempt*2))
          done
          test "$pushed" = 1
          echo 'persisted=true' >> "$GITHUB_OUTPUT"
          echo 'PUBLIC_MAIN_WRITE=NO'

      - name: Continue composed seeds into DESIGN_ONLY without cancelling active batch
        if: steps.persist.outputs.persisted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          active=0
          for attempt in $(seq 1 12); do
            active="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=main&per_page=100" --jq '[.workflow_runs[] | select(.path==".github/workflows/company-seed-design-runtime.yml") | select(.status=="queued" or .status=="in_progress" or .status=="pending" or .status=="requested" or .status=="waiting")] | length')"
            echo "ACTIVE_DESIGN_ONLY_RUNS=$active"
            if [ "$active" -eq 0 ]; then
              gh workflow run company-seed-design-runtime.yml --repo "$GITHUB_REPOSITORY" --ref main
              echo 'GAME_SEED_DESIGN_CONTINUATION_DISPATCHED=YES'
              echo 'GAME_SEED_DESIGN_CONTINUATION_SCOPE=ONE_AFTER_NO_ACTIVE_BATCH'
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then sleep 5; fi
          done
          echo 'GAME_SEED_DESIGN_CONTINUATION_DISPATCHED=NO'
          echo 'GAME_SEED_DESIGN_CONTINUATION=SKIP_ACTIVE_BATCH'

      - name: Summary
        if: always()
        run: |
          echo '### GAME_SEED Material Production' >> "$GITHUB_STEP_SUMMARY"
          echo '- seed material pool: fixed 100 available/reserved slots; material is not a game' >> "$GITHUB_STEP_SUMMARY"
          echo '- composition: 2-4 mixed materials per GAME_SEED' >> "$GITHUB_STEP_SUMMARY"
          echo '- actual game count: no total cap' >> "$GITHUB_STEP_SUMMARY"
          echo '- autonomous idle activation: after 24h with no higher-priority development work' >> "$GITHUB_STEP_SUMMARY"
          echo '- design WIP: max 6 concurrent games' >> "$GITHUB_STEP_SUMMARY"
          echo '- initial implementation: one complete playable gameplay cycle; 30 minutes is final content-depth validation only' >> "$GITHUB_STEP_SUMMARY"
          echo '- multiplayer mode: decided during design' >> "$GITHUB_STEP_SUMMARY"
          echo '- public main game source write: NO' >> "$GITHUB_STEP_SUMMARY"
