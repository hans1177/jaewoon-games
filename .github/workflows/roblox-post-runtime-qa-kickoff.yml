# kickoff-marker: skyline-rush-publication-target-recovery-20260917-r2
name: One-shot Skyline Roblox Publication Target Recovery Kickoff

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/roblox-post-runtime-qa-kickoff.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch canonical Skyline multiplayer QA target recovery
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run company-development-roblox-multiplayer-qa.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f game_id='seed-roblox-obby-party-minigam-tower-of-hell'
          echo 'ROBLOX_MULTIPLAYER_QA_DISPATCH=YES'
          echo 'ROBLOX_MULTIPLAYER_QA_TARGET=seed-roblox-obby-party-minigam-tower-of-hell'
          echo 'ROBLOX_RELEASE_CLAIM=NO'
