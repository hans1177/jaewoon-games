# 개발 루프의 "눈": 게임이 모아 둔 오류·FPS(DataStore MeadowDevLog)를 읽어 docs/devloop/TELEMETRY.md 로 남긴다.
name: Devloop Report (마력숲)
on:
  schedule:
    - cron: '17 */1 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: devloop-report-meadow
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read telemetry from Open Cloud
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          UNIVERSE_ID: '10773436325'
        run: python3 roblox-games/fantasy-survival/tools/devloop/telemetry_report.py > /tmp/telemetry.md
      - name: Analyze broken screen assets and request re-registration when models are the cause
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOFIX: ${{ vars.FANTASY_ASSET_AUTOFIX }}
        run: |
          # 게임의 "마력숲 자산점검" 경고를 읽어 broken-assets.json 으로 정리한다. 이상이 없으면 파일을 지운다.
          if node tools/fantasy-asset-health.mjs /tmp/telemetry.md --write; then
            rm -f roblox-games/fantasy-survival/broken-assets.json
          fi
          # 모델 재업로드가 원인이고, 최근 6시간 안에 재등록을 돌린 적이 없을 때만 한 번 요청한다(끄기: 변수 FANTASY_ASSET_AUTOFIX=off).
          if [ "${AUTOFIX:-on}" != "off" ] && [ -f roblox-games/fantasy-survival/broken-assets.json ] && grep -q '"REUPLOAD_MODEL"' roblox-games/fantasy-survival/broken-assets.json; then
            recent=$(gh run list --workflow owner-fantasy-assets.yml -L 1 --json createdAt --jq '.[0].createdAt // empty')
            if [ -z "$recent" ] || [ $(( $(date -u +%s) - $(date -u -d "$recent" +%s) )) -gt 21600 ]; then
              gh api -X POST "repos/${{ github.repository }}/actions/workflows/owner-fantasy-assets.yml/dispatches" -f ref=main || true
            fi
          fi
      - name: Commit report
        run: |
          cp /tmp/telemetry.md roblox-games/fantasy-survival/docs/devloop/TELEMETRY.md
          git config user.name "devloop-bot"
          git config user.email "devloop-bot@users.noreply.github.com"
          git add roblox-games/fantasy-survival/docs/devloop/TELEMETRY.md
          git add -A roblox-games/fantasy-survival/broken-assets.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "devloop: telemetry report" && git pull -q --rebase --autostash && git push)
