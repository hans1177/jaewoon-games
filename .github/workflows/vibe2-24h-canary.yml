# 파일명: .github/workflows/vibe2-24h-canary.yml
# 실행 코드는 최신 main에서, 상태는 기존 제어 브랜치에서 읽는다.
name: Vibe2 24H Canary

on:
  pull_request:
    paths:
      - '.github/workflows/vibe2-24h-canary.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/vibe2-24h-canary.yml'
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vibe2-24h-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Vibe2 control branch
        uses: actions/checkout@v4
        with:
          ref: vibe2-unreal-core
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Checkout tested executable contract
        uses: actions/checkout@v4
        with:
          # PR에서는 정확한 후보 소스를, 정기·main 실행에서는 최신 main을 검사.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          path: vibe2-main-contract
          fetch-depth: 1

      - name: Restore complete queue for read-only canary
        run: node vibe2-main-contract/tools/vibe2-queue-control.mjs storage-unpack

      - name: Verify Vibe2 runtime and shared Work Lock contracts
        working-directory: vibe2-main-contract
        env:
          COMPANY_VERIFIED_POLICY_PATH: company-learning/platform-release-roadmap.json
        shell: bash
        run: |
          set -euo pipefail
          test -f vibe2-runtime.json
          test -f assets/vibe-work-lock.js
          test -f tools/vibe-work-lock-control.mjs
          test -f tools/vibe2-remote-work-lock.mjs
          test -f tools/vibe2-continuous-runner.mjs
          test -f tools/vibe2-queue-control.mjs
          node --check assets/vibe-work-lock.js
          node --check tools/vibe-work-lock-control.mjs
          node --check tools/vibe2-remote-work-lock.mjs
          node --check tools/vibe2-continuous-runner.mjs
          node --check tools/vibe2-queue-control.mjs
          node --test qa/vibe-work-lock.test.mjs
          node --test qa/vibe2-core-engine-motion.test.mjs
          node --test qa/vibe2-queue-control.test.mjs
          node --test qa/vibe2-adaptive-backpressure.test.mjs
          node --test qa/vibe2-handoff.test.mjs
          node --test qa/vibe2-controller-contract.test.mjs

      - name: Exercise continuous planner safely
        working-directory: vibe2-main-contract
        env:
          COMPANY_VERIFIED_POLICY_PATH: company-learning/platform-release-roadmap.json
        shell: bash
        run: |
          set -euo pipefail
          # 최신 main 실행 코드 + 기존 제어 브랜치의 복원된 읽기 전용 상태.
          rm -f ../.vibe2/work-order.json
          node tools/vibe2-continuous-runner.mjs --queue=../.vibe2/queue.json --control=../.vibe2/parallelism-control.json --experience=../.vibe2/experience.json --project-lifecycle=../.vibe2/web-roblox-handoffs.json --output=../.vibe2/work-order.json
          test -s ../.vibe2/work-order.json
          node <<'NODE'
          const fs = require('fs');
          const order = JSON.parse(fs.readFileSync('../.vibe2/work-order.json', 'utf8'));
          if (order.run) {
            if (!order.taskId) throw new Error('Runnable canary plan requires taskId.');
            if (order.safety?.directMainWrite !== false) throw new Error('Runnable canary plan must forbid direct main write.');
            const responsible = Array.isArray(order.source?.responsibleFiles) ? order.source.responsibleFiles.filter(Boolean) : [];
            const lockFiles = responsible.length ? responsible : order.source?.root ? [`${order.source.root}/**`] : [];
            if (!lockFiles.length) throw new Error('Runnable canary plan must expose a Work Lock scope.');
            console.log(`VIBE2_24H_CANARY=PASS runnable=${order.taskId} lockScope=${lockFiles.join(',')}`);
          } else {
            console.log(`VIBE2_24H_CANARY=PASS reason=${order.reason}`);
          }
          console.log('VIBE2_CANARY_EXECUTES_GAME_WORK=NO');
          console.log('VIBE2_GAME_SOURCE_WRITE=NO');
          console.log('VIBE2_COMPANY_WRITE=NO');
          console.log('VIBE2_SHARED_WORK_LOCK_CONTRACT=PASS');
          NODE
