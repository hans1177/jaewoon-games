# [마력숲] 24컷 오프닝 원화 72장을 로블록스 이미지로 등록한다. 같은 해시는 다시 올리지 않는다.
name: Fantasy Opening 24 Assets
on:
  push:
    branches: [main]
    paths:
      - 'roblox-games/fantasy-survival/opening24/*.png'
      - 'roblox-games/fantasy-survival/opening24/*.jpg'
      - 'roblox-games/fantasy-survival/opening24/files.json'
      - 'tools/fantasy-opening-assets.mjs'
      - '.github/workflows/fantasy-opening-assets.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fantasy-opening-assets
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Upload opening images and grant Universe use
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_ROBLOSECURITY: ${{ secrets.ROBLOX_ROBLOSECURITY }}
          ROBLOX_SECURITY_COOKIE: ${{ secrets.ROBLOX_SECURITY_COOKIE }}
        run: node tools/fantasy-opening-assets.mjs
      - name: Open asset binding PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'fantasy-opening-assets'
          git config user.email 'actions@users.noreply.github.com'
          for binding_path in roblox-games/fantasy-survival/opening24/uploaded.json roblox-games/fantasy-survival/shared/OpeningAssetIds24.luau; do
            if test -e "$binding_path"; then git add -- "$binding_path"; fi
          done
          if git diff --cached --quiet; then
            echo 'OPENING24_BINDING_ALREADY_CURRENT=YES'
            exit 0
          fi
          git commit -m 'assets: bind 24-scene opening image ids'
          branch="automation/fantasy-opening-24-${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/$branch"
          pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title '마력숲 24컷 오프닝 이미지 ID 연결' --body '오너 요청으로 제작한 24컷 오프닝 원화 72장의 로블록스 이미지 ID와 Universe 사용 권한 승인 결과를 기록한다. 72장이 모두 등록되고 권한이 승인된 경우에만 OpeningAssetIds24.luau 가 채워지며, 그렇지 않으면 기존 12장면 오프닝이 그대로 유지된다. 등록 성공은 게임 내 화면 검증 완료를 뜻하지 않는다.')"
          echo "OPENING24_BINDING_PR=$pr_url"
