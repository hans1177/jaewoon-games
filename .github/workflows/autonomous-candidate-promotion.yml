name: Autonomous Candidate Promotion

on:
  push:
    branches:
      - 'autonomous/candidate-*'
  workflow_dispatch:
    inputs:
      candidate_branch:
        description: 'Exact autonomous/candidate-* branch produced by Autonomous Continuous Development'
        required: true
        type: string

permissions:
  contents: write
  actions: write
  pull-requests: write

# Shared autonomous-dev promotion remains serialized with reservation/state writers.
concurrency:
  group: autonomous-dev-writer
  cancel-in-progress: false

jobs:
  independent-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout submitted candidate branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.candidate_branch || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve exact candidate evidence and source-root revision
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin autonomous-dev main
          candidate_commit="$(git rev-parse HEAD)"
          echo "PROMOTE_CANDIDATE_COMMIT=$candidate_commit" >> "$GITHUB_ENV"
          dev_sha="$(git rev-parse origin/autonomous-dev)"
          mapfile -t evidence_files < <(git diff --name-only "origin/autonomous-dev...HEAD" | grep '^\.autonomous/evidence/.*\.json$' || true)
          if [ "${#evidence_files[@]}" -ne 1 ]; then
            echo "expected exactly one candidate evidence file" >&2
            exit 1
          fi
          evidence="${evidence_files[0]}"
          source_commit="$(node -e "const fs=require('fs');const e=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(String(e.sourceCommit||''));" "$evidence")"
          source_path="$(node -e "const fs=require('fs');const e=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(String(e.sourcePath||''));" "$evidence")"
          test -n "$source_commit" && test -n "$source_path"
          node tools/autonomous-candidate-review.mjs --evidence="$evidence" --expected-source-commit="$source_commit"
          if [ -n "$(git diff --name-only "$source_commit" origin/autonomous-dev -- "$source_path")" ]; then
            echo "SOURCE_ROOT_REVISION_MISMATCH path=$source_path base=$source_commit current=$dev_sha" >&2
            exit 1
          fi
          node <<'NODE' >> "$GITHUB_ENV"
          const fs=require('fs');
          const files=require('child_process').execFileSync('git',['diff','--name-only','origin/autonomous-dev...HEAD'],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean);
          const evidence=files.find(x=>/^\.autonomous\/evidence\/.*\.json$/.test(x));
          const e=JSON.parse(fs.readFileSync(evidence,'utf8'));
          const line=(k,v)=>process.stdout.write(`${k}=${String(v??'').replaceAll('\n',' ')}\n`);
          line('PROMOTE_EVIDENCE',evidence);
          line('PROMOTE_GAME_ID',e.gameId);
          line('PROMOTE_SOURCE_PATH',e.sourcePath);
          line('PROMOTE_CANDIDATE_PATH',e.candidatePath);
          line('PROMOTE_CANDIDATE_ID',e.candidateId);
          line('PROMOTE_SOURCE_COMMIT',e.sourceCommit);
          line('PROMOTE_INCUBATOR_ID',e.incubatorCandidateId||'');
          line('PROMOTE_NEW_PROJECT',e.newProject===true?'true':'false');
          NODE
          echo "dev_sha=$dev_sha" >> "$GITHUB_OUTPUT"
          echo 'SOURCE_FRESHNESS_SCOPE=GAME_ROOT_ONLY'

      - name: Enforce candidate-branch change scope
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if [[ "$file" == "$PROMOTE_EVIDENCE" || "$file" == "$PROMOTE_CANDIDATE_PATH"/* ]]; then
              continue
            fi
            echo "candidate branch changed unauthorized path: $file" >&2
            exit 1
          done < <(git diff --name-only "origin/autonomous-dev...HEAD")
          echo "CANDIDATE_SCOPE=PASS"

      - name: Independent candidate syntax QA
        shell: bash
        run: |
          set -euo pipefail
          test -d "$PROMOTE_CANDIDATE_PATH"
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find "$PROMOTE_CANDIDATE_PATH" -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -print0)
          git diff --check "origin/autonomous-dev...HEAD"
          echo "INDEPENDENT_CANDIDATE_QA=PASS"

      - name: Install candidate mobile browser runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Baseline mobile browser observation
        id: baseline_browser
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts/autonomous-candidate-browser
          node tools/autonomous-candidate-browser-qa.mjs \
            --source="$PROMOTE_SOURCE_PATH" \
            --port=4174 \
            --output=qa-artifacts/autonomous-candidate-browser/baseline.json \
            --screenshot=qa-artifacts/autonomous-candidate-browser/baseline-failure.png

      - name: Candidate mobile browser QA before dev/main
        id: browser_qa
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts/autonomous-candidate-browser
          node tools/autonomous-candidate-browser-qa.mjs \
            --source="$PROMOTE_CANDIDATE_PATH" \
            --port=4175 \
            --output=qa-artifacts/autonomous-candidate-browser/report.json \
            --screenshot=qa-artifacts/autonomous-candidate-browser/failure.png

      - name: Compare baseline and candidate player impact
        id: play_impact
        if: steps.browser_qa.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node tools/autonomous-play-impact.mjs \
            --baseline=qa-artifacts/autonomous-candidate-browser/baseline.json \
            --candidate=qa-artifacts/autonomous-candidate-browser/report.json \
            --evidence="$PROMOTE_EVIDENCE" \
            --output=/tmp/jaewoon-play-impact.json
          cp /tmp/jaewoon-play-impact.json qa-artifacts/autonomous-candidate-browser/impact.json
          node -e "const r=require('/tmp/jaewoon-play-impact.json');console.log('PLAY_IMPACT='+r.totalScore+'/10:'+r.impactStatus);"

      - name: Upload candidate browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-candidate-browser-${{ github.run_id }}
          path: qa-artifacts/autonomous-candidate-browser/
          retention-days: 7
          if-no-files-found: warn

      - name: Persist browser failure feedback, release lease and retry same game
        if: steps.browser_qa.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp qa-artifacts/autonomous-candidate-browser/report.json /tmp/autonomous-browser-qa.json
          git checkout -B autonomous-dev origin/autonomous-dev
          if [ -n "$(git diff --name-only "$PROMOTE_SOURCE_COMMIT" HEAD -- "$PROMOTE_SOURCE_PATH")" ]; then
            echo "SOURCE_ROOT_REVISION_MISMATCH path=$PROMOTE_SOURCE_PATH" >&2
            exit 1
          fi
          mkdir -p .autonomous/browser-failures
          cp /tmp/autonomous-browser-qa.json ".autonomous/browser-failures/$PROMOTE_GAME_ID.json"
          original_run_id="${PROMOTE_CANDIDATE_ID##*-}"
          node tools/autonomous-queue-state.mjs --state=.autonomous/queue-state.json --settle-run-id="$original_run_id" --status=FAILED
          git config user.name 'jaewoon-browser-qa-feedback'
          git config user.email 'browser-qa-feedback@users.noreply.github.com'
          git add ".autonomous/browser-failures/$PROMOTE_GAME_ID.json" .autonomous/queue-state.json
          if ! git diff --cached --quiet; then
            git commit -m "qa: retain browser failure $PROMOTE_GAME_ID [skip ci]"
            git push origin HEAD:autonomous-dev
          fi
          for attempt in 1 2 3; do
            if gh workflow run autonomous-continuous-development.yml --repo "$GITHUB_REPOSITORY" --ref main -f priority_game_id="$PROMOTE_GAME_ID"; then
              echo 'BROWSER_QA_FEEDBACK_REQUEUED=YES'
              exit 1
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Preserve reviewed candidate outside worktree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/jaewoon-reviewed-candidate
          mkdir -p /tmp/jaewoon-reviewed-candidate
          cp -R "$PROMOTE_CANDIDATE_PATH" /tmp/jaewoon-reviewed-candidate/game
          cp "$PROMOTE_EVIDENCE" /tmp/jaewoon-reviewed-candidate/evidence.json
          if [ -s /tmp/jaewoon-play-impact.json ]; then cp /tmp/jaewoon-play-impact.json /tmp/jaewoon-reviewed-candidate/impact.json; fi

      - name: Apply only to continuous development branch
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B autonomous-dev origin/autonomous-dev
          if [ -n "$(git diff --name-only "$PROMOTE_SOURCE_COMMIT" HEAD -- "$PROMOTE_SOURCE_PATH")" ]; then
            echo "SOURCE_ROOT_REVISION_MISMATCH path=$PROMOTE_SOURCE_PATH base=$PROMOTE_SOURCE_COMMIT current=$(git rev-parse HEAD)" >&2
            exit 1
          fi
          rm -rf "$PROMOTE_SOURCE_PATH"
          mkdir -p "$(dirname "$PROMOTE_SOURCE_PATH")"
          cp -R /tmp/jaewoon-reviewed-candidate/game "$PROMOTE_SOURCE_PATH"
          echo "PUBLIC_MAIN_WRITE=NO"
          echo "UNRELATED_AUTONOMOUS_DEV_ADVANCE=ALLOWED"

      - name: Full dev regression after applying candidate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find "$PROMOTE_SOURCE_PATH" -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -print0)
          if [ -f qa/vibe-regression.mjs ]; then node qa/vibe-regression.mjs; fi
          node --test qa/autonomous-development-worker.test.mjs
          node --test qa/autonomous-candidate-browser-qa.test.mjs
          node --test qa/autonomous-candidate-review.test.mjs
          node --test qa/autonomous-play-impact.test.mjs
          node --test qa/autonomous-impact-priority.test.mjs
          node --test qa/evolution-evidence-recorder.test.mjs
          node --test qa/incubator-promotion-state.test.mjs
          node --test qa/autonomous-vibe-release-handoff.test.mjs
          echo "DEV_REGRESSION=PASS"

      - name: Build verified learning evidence
        shell: bash
        run: |
          set -euo pipefail
          node tools/evolution-evidence-recorder.mjs \
            --output=/tmp/jaewoon-learning-evidence.json \
            --id="vibe2-${PROMOTE_CANDIDATE_ID}" \
            --type=VIBE2 \
            --pattern-id=autonomous-candidate-safe-promotion \
            --title="Autonomous candidate scope + regression safe promotion" \
            --game-id="$PROMOTE_GAME_ID" \
            --condition=AUTONOMOUS_DEV \
            --outcome=SUCCESS \
            --delta=0 \
            --source-revision="$PROMOTE_CANDIDATE_COMMIT" \
            --independent-qa=PASS \
            --evidence="$PROMOTE_EVIDENCE,independent-candidate-browser-qa,vibe-regression"
          echo "LEARNING_EVIDENCE_VERIFIED=YES"

      - name: Record JAY dev verdict and push autonomous-dev only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .autonomous/dev-history
          rm -f ".autonomous/browser-failures/$PROMOTE_GAME_ID.json"
          node <<'NODE'
          const fs=require('fs');
          const evidence=JSON.parse(fs.readFileSync('/tmp/jaewoon-reviewed-candidate/evidence.json','utf8'));
          const performance=fs.existsSync('/tmp/jaewoon-reviewed-candidate/impact.json')?JSON.parse(fs.readFileSync('/tmp/jaewoon-reviewed-candidate/impact.json','utf8')):null;
          const record={version:2,candidateId:evidence.candidateId,incubatorCandidateId:evidence.incubatorCandidateId||null,newProject:evidence.newProject===true,gameId:evidence.gameId,sourceCommit:evidence.sourceCommit,candidateCommit:process.env.PROMOTE_CANDIDATE_COMMIT,verdict:'ADVANCE_TO_AUTONOMOUS_DEV',publicRelease:false,selfPromoteMain:false,independentQa:'PASS',browserQa:'PASS',performance,jayAuthority:'L4_DEV_ONLY',recordedAt:new Date().toISOString()};
          fs.writeFileSync(`.autonomous/dev-history/${evidence.candidateId}.json`,JSON.stringify(record,null,2)+'\n');
          NODE
          git config user.name "jaewoon-jay-dev-gate"
          git config user.email "jay-dev-gate@users.noreply.github.com"
          git add "$PROMOTE_SOURCE_PATH" ".autonomous/dev-history/${PROMOTE_CANDIDATE_ID}.json"
          git add -A ".autonomous/browser-failures/$PROMOTE_GAME_ID.json" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "candidate produced no dev difference" >&2
            exit 1
          fi
          git commit -m "dev: promote verified ${PROMOTE_GAME_ID} candidate ${PROMOTE_CANDIDATE_ID}"
          promoted_dev_revision="$(git rev-parse HEAD)"
          echo "PROMOTED_DEV_REVISION=$promoted_dev_revision" >> "$GITHUB_ENV"
          git push origin HEAD:autonomous-dev
          echo "JAY_DEV_VERDICT=ADVANCE_TO_AUTONOMOUS_DEV"
          echo "PROMOTED_DEV_REVISION=$promoted_dev_revision"
          echo "PUBLIC_RELEASE=NO"
          echo "MAIN_GAME_CODE_WRITE=NO"

      - name: Persist verified evidence, play impact and incubator completion through merged main-memory PR
        id: main_memory
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main-memory origin/main
          mkdir -p company-learning/evidence
          cp /tmp/jaewoon-learning-evidence.json "company-learning/evidence/${PROMOTE_CANDIDATE_ID}.json"
          if [ -s /tmp/jaewoon-play-impact.json ]; then
            node tools/autonomous-play-impact.mjs \
              --append-history=company-learning/autonomous-impact-history.json \
              --impact=/tmp/jaewoon-play-impact.json
          fi
          if [ "$PROMOTE_NEW_PROJECT" = "true" ]; then
            node tools/incubator-promotion-state.mjs \
              --state-file=autonomous-incubator.json \
              --portfolio-file=autonomous-portfolio.json \
              --evidence-file=/tmp/jaewoon-reviewed-candidate/evidence.json \
              --dev-revision="$PROMOTED_DEV_REVISION"
          fi
          git config user.name "jaewoon-company-learning"
          git config user.email "actions@users.noreply.github.com"
          git add "company-learning/evidence/${PROMOTE_CANDIDATE_ID}.json"
          if [ -f company-learning/autonomous-impact-history.json ]; then git add company-learning/autonomous-impact-history.json; fi
          if [ "$PROMOTE_NEW_PROJECT" = "true" ]; then git add autonomous-incubator.json autonomous-portfolio.json; fi
          if git diff --cached --quiet; then
            echo 'LEARNING_MEMORY_CHANGE=NO'
            echo 'merged=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "learning: record verified ${PROMOTE_GAME_ID} candidate [skip ci]"
          safe_id="$(printf '%s' "$PROMOTE_CANDIDATE_ID" | tr -cs 'A-Za-z0-9._-' '-' | sed 's/^-*//;s/-*$//' | cut -c1-60)"
          memory_branch="automation/candidate-memory-${safe_id}-${GITHUB_RUN_ID}"
          git push origin "HEAD:$memory_branch"
          pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$memory_branch" --title "learning: persist verified ${PROMOTE_GAME_ID} candidate" --body "Verified candidate learning/incubator memory only. No game source promotion. Generated by autonomous candidate promotion run ${GITHUB_RUN_ID}.")"
          pr_number="${pr_url##*/}"
          sleep 5
          gh pr checks "$pr_number" --repo "$GITHUB_REPOSITORY" --watch --fail-fast
          git fetch origin main
          gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
          git fetch origin main
          git show "origin/main:company-learning/evidence/${PROMOTE_CANDIDATE_ID}.json" >/dev/null
          echo 'merged=true' >> "$GITHUB_OUTPUT"
          echo "MAIN_GAME_CODE_WRITE=NO"
          echo "MAIN_MEMORY_WRITE=PR_MERGED"
          if [ "$PROMOTE_NEW_PROJECT" = "true" ]; then echo "INCUBATOR_PROTOTYPE_VERIFIED=YES"; fi

      - name: Prepare verified Vibe2 release handoff
        id: release_handoff
        if: steps.main_memory.outputs.merged == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main autonomous-dev
          if [ -n "$(git diff --name-only "$PROMOTE_SOURCE_COMMIT" origin/main -- "$PROMOTE_SOURCE_PATH")" ]; then
            echo "RELEASE_HANDOFF=BLOCKED_MAIN_SOURCE_FRESHNESS"
            exit 1
          fi
          base_main_sha="$(git rev-parse origin/main)"
          safe_id="$(printf '%s' "$PROMOTE_CANDIDATE_ID" | tr -cs 'A-Za-z0-9._-' '-' | sed 's/^-*//;s/-*$//' | cut -c1-60)"
          release_branch="vibe2/candidate/autonomous-${safe_id}-${GITHUB_RUN_ID}"
          release_dir="/tmp/jaewoon-vibe2-release-${GITHUB_RUN_ID}"
          rm -rf "$release_dir"
          git worktree prune
          git worktree add -b "$release_branch" "$release_dir" origin/main >/dev/null
          cd "$release_dir"
          rm -rf "$PROMOTE_SOURCE_PATH"
          mkdir -p "$(dirname "$PROMOTE_SOURCE_PATH")"
          cp -R /tmp/jaewoon-reviewed-candidate/game "$PROMOTE_SOURCE_PATH"
          manifest=".vibe2/candidates/${PROMOTE_CANDIDATE_ID}/manifest.json"
          node "$GITHUB_WORKSPACE/tools/autonomous-vibe-release-handoff.mjs" \
            --evidence=/tmp/jaewoon-reviewed-candidate/evidence.json \
            --catalog=game-catalog.json \
            --base-main-sha="$base_main_sha" \
            --promoted-dev-revision="$PROMOTED_DEV_REVISION" \
            --independent-qa=PASS \
            --output="$manifest"
          git diff --check
          git config user.name "jaewoon-autonomous-release-handoff"
          git config user.email "actions@users.noreply.github.com"
          git add "$PROMOTE_SOURCE_PATH" "$manifest"
          test -n "$(git diff --cached --name-only)"
          git commit -m "vibe2: release handoff ${PROMOTE_CANDIDATE_ID}"
          git push origin "HEAD:$release_branch"
          echo "release_branch=$release_branch" >> "$GITHUB_OUTPUT"
          echo "RELEASE_HANDOFF=READY"
          echo "VIBE2_RELEASE_BRANCH=$release_branch"

      - name: Dispatch existing Vibe2 release gate explicitly
        id: release_dispatch
        if: steps.release_handoff.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gh workflow run vibe2-candidate-release.yml --ref main -f candidate_branch="${{ steps.release_handoff.outputs.release_branch }}"; then
              echo "VIBE2_RELEASE_GATE_DISPATCHED=YES"
              echo "RELEASE_GATE_DISPATCH_MODE=workflow_dispatch"
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Dispatch next development floor when no release is pending
        if: always() && (steps.release_handoff.outcome != 'success' || steps.release_dispatch.outcome != 'success')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gh workflow run autonomous-continuous-development.yml --repo "$GITHUB_REPOSITORY" --ref main; then
              echo "CONTINUOUS_QUEUE_NEXT=DISPATCHED"
              echo "QUEUE_DISPATCH_SOURCE=workflow_dispatch"
              echo "PUBLIC_MAIN_RELEASE=NO"
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "### Autonomous Candidate Promotion" >> "$GITHUB_STEP_SUMMARY"
          echo "- independent QA: required" >> "$GITHUB_STEP_SUMMARY"
          echo "- baseline vs candidate mobile observation: staff performance evidence" >> "$GITHUB_STEP_SUMMARY"
          if [ -s /tmp/jaewoon-play-impact.json ]; then node -e "const r=require('/tmp/jaewoon-play-impact.json');console.log('- play impact: '+r.totalScore+'/10 ('+r.impactStatus+', '+r.confidence+')')" >> "$GITHUB_STEP_SUMMARY"; fi
          echo "- candidate mobile browser QA: required before autonomous-dev/main" >> "$GITHUB_STEP_SUMMARY"
          echo "- source freshness: exact game source root only; unrelated queue/game commits do not block" >> "$GITHUB_STEP_SUMMARY"
          echo "- browser failure feedback: persists evidence, releases the failed lease, and requeues same game" >> "$GITHUB_STEP_SUMMARY"
          echo "- promotion target: autonomous-dev first" >> "$GITHUB_STEP_SUMMARY"
          echo "- shared autonomous-dev writes: serialized" >> "$GITHUB_STEP_SUMMARY"
          echo "- public game main direct promotion: NO" >> "$GITHUB_STEP_SUMMARY"
          echo "- verified main-memory persistence: merged PR required before release handoff" >> "$GITHUB_STEP_SUMMARY"
          echo "- verified release handoff: existing Vibe2 Candidate Release Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "- verified learning evidence: existing company-learning + Company DNA workflow" >> "$GITHUB_STEP_SUMMARY"
          echo "- low-impact priority penalty: only after 2 consecutive unobserved outcomes" >> "$GITHUB_STEP_SUMMARY"
          echo "- next development floor waits while a release gate is pending" >> "$GITHUB_STEP_SUMMARY"
          echo "- new prototype completion: tested metadata gate only" >> "$GITHUB_STEP_SUMMARY"
          echo "- paid API: NO" >> "$GITHUB_STEP_SUMMARY"
