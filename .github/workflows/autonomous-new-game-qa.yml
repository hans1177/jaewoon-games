name: Autonomous Candidate QA

on:
  push:
    branches: [main]
    paths:
      - 'autonomous-portfolio.json'
      - 'tools/autonomous-prototype-worker.mjs'
      - 'tools/autonomous-candidate-review.mjs'
      - 'tools/incubator-promotion-state.mjs'
      - 'qa/autonomous-prototype-worker.test.mjs'
      - 'qa/autonomous-candidate-review.test.mjs'
      - 'qa/incubator-promotion-state.test.mjs'
      - '.github/workflows/autonomous-prototype-worker.yml'
      - '.github/workflows/autonomous-continuous-development.yml'
      - '.github/workflows/autonomous-candidate-promotion.yml'
      - '.github/workflows/company-dna-learning.yml'
      - '.github/workflows/autonomous-new-game-qa.yml'
  pull_request:
    paths:
      - 'tools/autonomous-prototype-worker.mjs'
      - 'tools/autonomous-candidate-review.mjs'
      - 'tools/incubator-promotion-state.mjs'
      - 'qa/autonomous-prototype-worker.test.mjs'
      - 'qa/autonomous-candidate-review.test.mjs'
      - 'qa/incubator-promotion-state.test.mjs'
      - '.github/workflows/autonomous-prototype-worker.yml'
      - '.github/workflows/autonomous-continuous-development.yml'
      - '.github/workflows/autonomous-candidate-promotion.yml'
      - '.github/workflows/company-dna-learning.yml'
      - '.github/workflows/autonomous-new-game-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deterministic candidate tests
        run: |
          node --check tools/autonomous-prototype-worker.mjs
          node --check tools/autonomous-candidate-review.mjs
          node --check tools/incubator-promotion-state.mjs
          node --test qa/autonomous-prototype-worker.test.mjs
          node --test qa/autonomous-candidate-review.test.mjs
          node --test qa/incubator-promotion-state.test.mjs
      - name: Validate isolated candidate contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "'.autonomous/prototype-request.json'" .github/workflows/autonomous-prototype-worker.yml
          grep -Fq 'git fetch origin main autonomous-dev' .github/workflows/autonomous-prototype-worker.yml
          grep -Fq 'git merge --no-edit origin/main' .github/workflows/autonomous-prototype-worker.yml
          grep -Fq 'git push origin HEAD:autonomous-dev' .github/workflows/autonomous-prototype-worker.yml
          grep -Fq 'PUBLIC_MAIN_WRITE=NO' .github/workflows/autonomous-prototype-worker.yml
          grep -Fq 'PUBLIC_MAIN_BASE=NO' .github/workflows/autonomous-prototype-worker.yml
          grep -Fq 'SELF_PROMOTE=NO' .github/workflows/autonomous-prototype-worker.yml
          grep -Fq 'tools/incubator-promotion-state.mjs' .github/workflows/autonomous-candidate-promotion.yml
          grep -Fq 'PROMOTED_DEV_REVISION' .github/workflows/autonomous-candidate-promotion.yml
          grep -Fq 'MAIN_GAME_CODE_WRITE=NO' .github/workflows/autonomous-candidate-promotion.yml

          if grep -Eq '^concurrency:$' .github/workflows/autonomous-continuous-development.yml; then
            echo 'continuous workflow is globally serialized; cross-game parallelism blocked' >&2
            exit 1
          fi
          continuous_locks="$(grep -c '^      group: autonomous-dev-writer$' .github/workflows/autonomous-continuous-development.yml)"
          test "$continuous_locks" -eq 1
          grep -Eq '^      group: autonomous-dev-recovery-.*github\.run_id.*$' .github/workflows/autonomous-continuous-development.yml
          grep -Fq 'for attempt in 1 2 3 4 5; do' .github/workflows/autonomous-continuous-development.yml
          grep -Fq 'git reset --hard origin/autonomous-dev' .github/workflows/autonomous-continuous-development.yml
          grep -Fq 'if git push origin HEAD:autonomous-dev; then' .github/workflows/autonomous-continuous-development.yml
          grep -Fq 'PARALLEL_FANOUT_NEXT=DISPATCHED' .github/workflows/autonomous-continuous-development.yml
          grep -Fq 'SAME_SOURCE_ROOT_DUPLICATION=LEASE_BLOCKED' .github/workflows/autonomous-continuous-development.yml

          for writer in .github/workflows/autonomous-prototype-worker.yml .github/workflows/autonomous-candidate-promotion.yml; do
            count="$(grep -c '^  group: autonomous-dev-writer$' "$writer")"
            test "$count" -eq 1
            grep -Fq 'cancel-in-progress: false' "$writer"
          done
          grep -Fq "workflows: ['Autonomous Candidate Promotion']" .github/workflows/company-dna-learning.yml
          grep -Fq 'jayApproved===true' tools/company-dna-learning.mjs
          grep -Fq 'selfPromote:false' tools/company-dna-learning.mjs
          if grep -Eq 'secrets\.(OPENAI|ANTHROPIC|GROQ|MISTRAL)|process\.env\.(OPENAI|ANTHROPIC|GROQ|MISTRAL)' tools/autonomous-prototype-worker.mjs .github/workflows/autonomous-prototype-worker.yml; then
            echo 'real paid/external credential usage found' >&2
            exit 1
          fi
          echo 'AUTONOMOUS_CANDIDATE_CONTRACT=PASS'
          echo 'PUBLIC_MAIN_GAME_CODE_AUTO_PROMOTION=NO'
          echo 'PAID_API=NO'
