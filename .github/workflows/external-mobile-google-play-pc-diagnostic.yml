name: Vibe2 Google Play Games PC Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64, jaewoon-unity]
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Diagnose official Google Play Games PC runtime
        id: diagnose
        continue-on-error: true
        run: |
          $out = Join-Path $env:RUNNER_TEMP "google-play-games-pc-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          "GPG_PC_DIAGNOSTIC_OUT=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & .\tools\diagnose-google-play-games-pc.ps1 -OutDir $out
          if ($LASTEXITCODE -ne 0) { throw "Google Play Games PC diagnostic blocker code=$LASTEXITCODE" }

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-play-games-pc-diagnostic
          path: ${{ env.GPG_PC_DIAGNOSTIC_OUT }}
          retention-days: 1
          if-no-files-found: error

      - name: Enforce diagnostic result
        if: always()
        run: |
          $path = Join-Path $env:GPG_PC_DIAGNOSTIC_OUT 'google-play-games-pc-diagnostic.json'
          if (-not (Test-Path $path)) { throw 'Google Play Games PC diagnostic evidence missing' }
          $d = Get-Content -Raw -Encoding UTF8 $path | ConvertFrom-Json
          Write-Host "GPG_PC_STATUS=$($d.status)"
          Write-Host "GPG_PC_INSTALLED=$($d.googlePlayGamesPcInstalled)"
          Write-Host "GPG_PC_INTERACTIVE_DESKTOP=$($d.interactiveDesktopPresent)"
          Write-Host "GPG_PC_RUNNER_SERVICE_ACCOUNT=$($d.runnerIsServiceAccount)"
          if ($d.status -notmatch '^READY_') { throw "GPG_PC_DIAGNOSTIC=$($d.status)" }
