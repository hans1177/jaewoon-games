name: Vibe2 Roblox Studio Live Smoke

on:
  pull_request:
    branches:
      - vibe2-unreal-core
    paths:
      - 'tools/vibe2-roblox-studio-cli-runner.mjs'
      - 'tools/vibe2-roblox-multiplayer-regression.mjs'
      - 'tools/runtime/roblox/**'
      - 'tools/vibe2-roblox-auto-player.mjs'
      - 'tools/vibe2-roblox-game-study.mjs'
      - '.vibe2/game-study-targets.json'
      - '.vibe2/game-study-scenarios/external-roblox-*.json'
      - 'qa/vibe2-roblox-studio-cli-runner.test.mjs'
      - 'qa/fixtures/vibe2-roblox-studio-smoke-scenario.json'
      - '.github/workflows/vibe2-roblox-studio-live-smoke.yml'
      - '.github/workflows/vibe2-game-study-continuous.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vibe2-roblox-studio-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Studio CLI and dedicated runner contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/vibe2-roblox-studio-cli-runner.mjs
          node --check tools/vibe2-roblox-multiplayer-regression.mjs
          node --check qa/vibe2-roblox-studio-cli-runner.test.mjs
          node --test qa/vibe2-roblox-studio-cli-runner.test.mjs
          node <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('.vibe2/game-study-targets.json','utf8'));
          const target=cfg.targets.find(x=>x.id==='external-roblox-potion-shop-flow-a');
          if(!target) throw new Error('Potion Shop Roblox target missing');
          if(target.enabled!==false) throw new Error('External Potion Shop Studio automation must remain disabled');
          if(target.engine!=='roblox'||target.runnerReady!==false) throw new Error('Potion Shop target must remain non-runnable');
          if((target.commandArgs||[]).length!==0) throw new Error('Potion Shop online Studio launch args must remain empty');
          if(target.onlinePublishedPlaceStudioAutomationForbidden!==true) throw new Error('published-place Studio automation must remain forbidden');
          if(target.localPlaceFileRequiredForAnyFutureStudioReactivation!==true) throw new Error('future Studio reactivation must require a local Place file');
          if(cfg.policy?.externalRobloxActiveAutomation!==false) throw new Error('generic external Roblox automation must remain disabled');
          if(cfg.policy?.externalCopyEnabledRobloxAutomation!==false) throw new Error('copy-enabled external Studio automation must remain disabled');
          if(Number(cfg.policy?.robloxStudioConcurrency?.defaultMultiplayerClients||0)!==2) throw new Error('default Roblox multiplayer regression must be 2 clients');
          if(Number(cfg.policy?.robloxStudioConcurrency?.maxStudioTestClients||0)!==8) throw new Error('Roblox Studio client cap contract changed');
          if(cfg.policy?.robloxStudioConcurrency?.sameWindowsSessionConcurrent!==false) throw new Error('same-session production and study must stay disabled');
          if(cfg.policy?.robloxStudioConcurrency?.isolatedRunnerOrSessionConcurrent!==true) throw new Error('isolated Roblox study concurrency must stay enabled');
          const scenario=JSON.parse(fs.readFileSync(target.scenarioFile,'utf8'));
          if(scenario.actions.some(x=>x.type==='key'||x.type==='click')) throw new Error('automated user input must remain disabled');
          for(const expression of ['game-loaded','player-present','player-gui-nonempty']) {
            if(!scenario.actions.some(x=>x.type==='expect'&&x.expression===expression)) throw new Error(`Potion Shop runtime checkpoint missing: ${expression}`);
          }
          if(scenario.actions.some(x=>String(x.expression||'').startsWith('instance-path:'))) throw new Error('Studio edit objects must not be asserted from the play client');
          console.log('VIBE2_ROBLOX_STUDIO_CONTRACT=PASS');
          console.log('VIBE2_ROBLOX_DEDICATED_RUNNER_REQUIRED=YES');
          console.log('VIBE2_ROBLOX_POTION_SHOP_TARGET_ACTIVE=NO');
          console.log('VIBE2_ROBLOX_MULTIPLAYER_CONTRACT=2_OF_8');
          NODE

  live-studio:
    needs: contract
    runs-on: [self-hosted, Windows, vibe2-roblox]
    timeout-minutes: 16
    env:
      VIBE2_ROBLOX_STUDY_ISOLATED_SESSION: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify dedicated interactive runner identity and locate real Roblox Studio
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "VIBE2_ROBLOX_RUNNER_NAME=$env:RUNNER_NAME"
          Write-Host "VIBE2_ROBLOX_RUNNER_OS=$env:RUNNER_OS"
          if ($env:RUNNER_OS -ne 'Windows') { throw 'Roblox Studio runner must be Windows' }
          if ($env:VIBE2_ROBLOX_STUDY_ISOLATED_SESSION -ne 'true') { throw 'Dedicated Roblox study session flag missing' }
          $runnerRoot = 'C:\actions-runner'
          $runnerMetadata = Get-Content (Join-Path $runnerRoot '.runner') -Raw | ConvertFrom-Json
          if ([string]$runnerMetadata.agentName -eq 'roblox-studio-local') {
            throw 'Production Roblox Studio runner must not execute dedicated GAME STUDY smoke'
          }
          Write-Host 'VIBE2_ROBLOX_DEDICATED_RUNNER_IDENTITY=PASS'
          Write-Host 'VIBE2_PRODUCTION_RUNNER_TOUCHED=NO'
          node -e "import('./tools/vibe2-roblox-studio-cli-runner.mjs').then(m=>{const p=m.findRobloxStudioBinary({});if(!p)throw new Error('RobloxStudioBeta.exe not found');console.log('VIBE2_ROBLOX_STUDIO_PATH='+p);require('fs').appendFileSync(process.env.GITHUB_ENV,'VIBE2_ROBLOX_STUDIO_PATH='+p+'\n')})"

      - name: Verify official Studio CLI assertion-only play
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:VIBE2_ROBLOX_AUTO_PLAYER_ARGS = ConvertTo-Json -InputObject @('tools/vibe2-roblox-studio-cli-runner.mjs') -Compress
          node tools/vibe2-roblox-auto-player.mjs `
            --scenario=qa/fixtures/vibe2-roblox-studio-smoke-scenario.json `
            --command=node `
            --output="$env:RUNNER_TEMP/vibe2-roblox-studio-baseplate.json" `
            --timeout=120000

      - name: Verify real two-client Studio multiplayer assertion regression
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          node tools/vibe2-roblox-multiplayer-regression.mjs `
            --clients=2 `
            --output="$env:RUNNER_TEMP/vibe2-roblox-multiplayer.json" `
            --timeout=150000
          node -e "const fs=require('fs');const p=process.env.RUNNER_TEMP+'/vibe2-roblox-multiplayer.json';const r=JSON.parse(fs.readFileSync(p,'utf8'));if(r.runtimeVerified!==true)throw new Error('multiplayer runtime not verified');if(Number(r.multiplayer?.expectedClients||0)!==2)throw new Error('expected clients mismatch');if(Number(r.multiplayer?.resultCount||0)<2)throw new Error('not all clients reported');if(Number(r.multiplayer?.verifiedClients||0)<2)throw new Error('not all clients reported ready');if(r.capabilities?.virtualInput!==false)throw new Error('automated user input unexpectedly enabled');if(r.capabilities?.assertionOnly!==true)throw new Error('assertion-only multiplayer mode missing');if(r.authorityExpanded===true)throw new Error('authority expanded');console.log('VIBE2_ROBLOX_MULTIPLAYER_2_CLIENT=PASS')"

      - name: Upload real Roblox Studio evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibe2-roblox-studio-live-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/vibe2-roblox-studio-baseplate.json
            ${{ runner.temp }}/vibe2-roblox-multiplayer.json
          if-no-files-found: warn
          retention-days: 3
