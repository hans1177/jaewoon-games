name: Company DESIGN_ONLY Promotion Sync

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Company Seed DESIGN_ONLY Runtime
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/company-design-promotion-sync.yml'
      - 'tools/design-only-promotion-sync.mjs'
      - 'tools/company-design-artbook.mjs'
      - 'qa/design-only-promotion-sync.test.mjs'

permissions:
  contents: write
  actions: write

concurrency:
  group: company-design-promotion-runtime
  cancel-in-progress: false

env:
  COMPANY_RUNTIME_BRANCH: company-runtime
  OLLAMA_HOST: 127.0.0.1:11434
  OLLAMA_VERSION: '0.33.3'
  ARTBOOK_MODEL_CALL_TIMEOUT_MS: '60000'

jobs:
  promote:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout current engine source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Overlay latest company runtime design evidence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$COMPANY_RUNTIME_BRANCH"
          for runtime_path in game-seed-state.json design artbook-submissions autonomous-portfolio.json game-catalog.json development-queue.json; do
            if git cat-file -e "origin/$COMPANY_RUNTIME_BRANCH:$runtime_path" 2>/dev/null; then
              git checkout "origin/$COMPANY_RUNTIME_BRANCH" -- "$runtime_path"
            fi
          done
          git reset -- game-seed-state.json design artbook-submissions autonomous-portfolio.json game-catalog.json development-queue.json >/dev/null 2>&1 || true
          test -f game-seed-state.json
          echo 'STRICT_DESIGN_EVIDENCE_OVERLAY=YES'
          echo 'DESIGN_PROMOTION_RUNTIME_OVERLAY=YES'
          echo 'PREPROMOTION_ARTBOOK_REQUIRED=NO'
          echo 'PUBLIC_MAIN_WRITE=NO'

      - name: Validate promotion contract
        run: |
          node --check tools/design-only-promotion-sync.mjs
          node --check tools/company-design-artbook.mjs
          node --test qa/design-only-promotion-sync.test.mjs

      - name: Promote 80-point strict-ready design baselines into DEVELOPMENT_CONFIRMED
        run: node tools/design-only-promotion-sync.mjs

      - name: Resolve post-promotion artbook targets
        id: artbooks
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const q=JSON.parse(fs.readFileSync('development-queue.json','utf8'));
          const rows=(q.items||[]).filter(item=>item.productionClass==='DEVELOPMENT_CONFIRMED'&&item.postPromotionArtbookRequired===true&&item.canonicalState==='WAITING_POST_PROMOTION_ARTBOOK');
          fs.writeFileSync('/tmp/post-promotion-artbook-targets.tsv',rows.map(x=>`${x.gameId}\t${x.designDate||''}`).join('\n')+(rows.length?'\n':''));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`count=${rows.length}\n`);
          console.log(`POST_PROMOTION_ARTBOOK_TARGET_COUNT=${rows.length}`);
          NODE

      - name: Resolve one lightweight Artbook Editor model
        if: steps.artbooks.outputs.count != '0'
        id: editor
        shell: bash
        run: |
          set -euo pipefail
          model="$(node --input-type=module <<'NODE'
          import fs from 'node:fs';const d=JSON.parse(fs.readFileSync('company-directive.json','utf8'));const banned=new Set((d.ai?.bannedModels||[]).map(String));const model=(d.ai?.modelPool||[]).map(String).find(x=>x&&!banned.has(x));if(!model)process.exit(2);process.stdout.write(model);
          NODE
          )"
          test -n "$model"
          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "POST_PROMOTION_ARTBOOK_EDITOR_MODEL=$model"

      - name: Restore Artbook Editor model cache
        if: steps.artbooks.outputs.count != '0'
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-post-promotion-artbook-${{ runner.os }}-${{ hashFiles('company-directive.json') }}
          restore-keys: |
            ollama-post-promotion-artbook-${{ runner.os }}-

      - name: Prepare lightweight local Artbook Editor
        if: steps.artbooks.outputs.count != '0'
        uses: ./.github/actions/prepare-ollama
        with:
          model: ${{ steps.editor.outputs.model }}
          version: ${{ env.OLLAMA_VERSION }}
          pull-model: 'true'

      - name: Generate Artbook only after promotion
        if: steps.artbooks.outputs.count != '0'
        env:
          ARTBOOK_EDITOR_MODEL: ${{ steps.editor.outputs.model }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r game_id design_date; do
            [ -z "$game_id" ] && continue
            test -n "$design_date"
            echo "POST_PROMOTION_ARTBOOK_START=$game_id:$design_date"
            ARTBOOK_GAME_ID="$game_id" ARTBOOK_DATE="$design_date" timeout 150s node tools/company-design-artbook.mjs
            test -f "artbook-submissions/$game_id/current.json"
            echo "POST_PROMOTION_ARTBOOK_PASS=$game_id"
          done < /tmp/post-promotion-artbook-targets.tsv

      - name: Advance Artbook-complete promotions to Web gate
        if: steps.artbooks.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';
          const q=JSON.parse(fs.readFileSync('development-queue.json','utf8'));
          const state=JSON.parse(fs.readFileSync('game-seed-state.json','utf8'));
          const catalog=JSON.parse(fs.readFileSync('game-catalog.json','utf8'));
          const stamp=new Date().toISOString();
          for(const item of q.items||[]){
            if(item.productionClass!=='DEVELOPMENT_CONFIRMED'||item.postPromotionArtbookRequired!==true||item.canonicalState!=='WAITING_POST_PROMOTION_ARTBOOK')continue;
            const artbook=`artbook-submissions/${item.gameId}/current.json`;
            if(!fs.existsSync(artbook))throw new Error(`POST_PROMOTION_ARTBOOK_MISSING:${item.gameId}`);
            item.artbookSource=artbook;item.postPromotionArtbookGeneratedAt=stamp;item.currentStep='WEB_PLAYABLE_BOOTSTRAP';item.canonicalState='WAITING_WEB_GAMEPLAY_VALIDATION';item.homepageTestVerdict='WAITING_WEB_STRICT_REVIEW';item.updatedAt=stamp;
            const seed=(state.seeds||[]).find(x=>x.gameId===item.gameId&&String(x.status||'').toUpperCase()==='ACTIVE');
            if(seed?.promotion){seed.promotion.artbookSource=artbook;seed.promotion.artbookGeneratedAt=stamp;seed.promotion.postPromotionArtbookRequired=true;}
            const game=(catalog.games||[]).find(x=>x.id===item.gameId);
            if(game){game.homepageArtbookPath=`/artbook-viewer.html?game=${encodeURIComponent(item.gameId)}`;game.homepageReviewState='WAITING_WEB_STRICT_REVIEW';game.homepageStage='개발확정 · Web 강심사 준비';game.homepageRecentWork=`Strict Design ${Number(item.strictDesignScore||0)}점 PASS · 승격 후 아트북 완료 · Web 제작 대기`;}
          }
          q.updatedAt=stamp;state.updatedAt=stamp;
          fs.writeFileSync('development-queue.json',JSON.stringify(q,null,2)+'\n');fs.writeFileSync('game-seed-state.json',JSON.stringify(state,null,2)+'\n');fs.writeFileSync('game-catalog.json',JSON.stringify(catalog,null,2)+'\n');
          console.log('POST_PROMOTION_ARTBOOK_WEB_HANDOFF=PASS');
          NODE

      - name: Verify strict-ready-only promotion and ordered development handoff
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';
          const state=JSON.parse(fs.readFileSync('game-seed-state.json','utf8'));
          const queue=JSON.parse(fs.readFileSync('development-queue.json','utf8'));
          const portfolio=JSON.parse(fs.readFileSync('autonomous-portfolio.json','utf8'));
          const latestStrict=(gameId)=>{
            const root=path.join('design',gameId);if(!fs.existsSync(root))return {pass:false,review:null,file:null};
            const dates=fs.readdirSync(root,{withFileTypes:true}).filter(x=>x.isDirectory()).map(x=>x.name).sort().reverse();
            for(const date of dates){const file=path.join(root,date,'strict-design-review.json');const statusFile=path.join(root,date,'cycle-status.json');if(!fs.existsSync(file)||!fs.existsSync(statusFile))continue;const review=JSON.parse(fs.readFileSync(file,'utf8'));const status=JSON.parse(fs.readFileSync(statusFile,'utf8'));const ready=status?.baselineGate?.state==='DESIGN_BASELINE_READY'&&status?.baselineGate?.ready===true;return {pass:ready&&review.verdict==='PASS'&&Number(review.totalScore)>=80&&Array.isArray(review.hardFailures)&&review.hardFailures.length===0,review,file};}return {pass:false,review:null,file:null};
          };
          const queueByGame=new Map((queue.items||[]).map(item=>[item.gameId,item]));let strictReadyCount=0;
          for(const seed of state.seeds||[]){
            if(String(seed.status||'').toUpperCase()!=='ACTIVE')continue;
            const strict=latestStrict(seed.gameId);const item=queueByGame.get(seed.gameId);
            if(seed.productionClassSource==='DESIGN_BASELINE_READY_STRICT_PASS'){
              if(!strict.pass)throw new Error(`non-strict design promoted: ${seed.gameId}`);
              strictReadyCount++;
              if(Number(seed.strictDesignReview?.totalScore||0)<80||seed.strictDesignReview?.verdict!=='PASS')throw new Error(`strict evidence not bound to seed: ${seed.gameId}`);
              if(!item||item.productionClass!=='DEVELOPMENT_CONFIRMED')throw new Error(`strict-ready queue handoff missing: ${seed.gameId}`);
              if(!fs.existsSync(`artbook-submissions/${seed.gameId}/current.json`))throw new Error(`post-promotion artbook missing: ${seed.gameId}`);
              if(item.canonicalState==='WAITING_POST_PROMOTION_ARTBOOK')throw new Error(`post-promotion artbook did not advance: ${seed.gameId}`);
              const project=(portfolio.projects||[]).find(x=>x.slug===seed.gameId);if(project?.productionClass!=='DEVELOPMENT_CONFIRMED')throw new Error(`portfolio promotion missing: ${seed.gameId}`);
            }
          }
          for(const item of queue.items||[]){
            if(item.productionClass!=='DEVELOPMENT_CONFIRMED')throw new Error(`queue class mismatch: ${item.gameId}`);
            const seed=(state.seeds||[]).find(x=>x.gameId===item.gameId);
            if(!seed||seed.status!=='ACTIVE')throw new Error(`normal promotion created seed vacancy: ${item.gameId}`);
            if(seed.productionClassSource==='DESIGN_BASELINE_READY_STRICT_PASS'&&Number(item.strictDesignScore||0)<80)throw new Error(`non-strict queue promotion: ${item.gameId}`);
          }
          console.log(`STRICT_DESIGN_READY_COUNT=${strictReadyCount}`);
          console.log(`DEVELOPMENT_HANDOFF_COUNT=${(queue.items||[]).length}`);
          console.log('DESIGN_PASS_THRESHOLD=80');
          console.log('WEB_IMPLEMENTATION_PASS_THRESHOLD=90');
          console.log('DESIGN_ONLY_PROMOTION_CONTRACT=PASS');
          NODE

      - name: Preserve promoted runtime files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/design-promotion-runtime
          cp game-seed-state.json autonomous-portfolio.json game-catalog.json development-queue.json /tmp/design-promotion-runtime/
          cp /tmp/post-promotion-artbook-targets.tsv /tmp/design-promotion-runtime/post-promotion-artbook-targets.tsv 2>/dev/null || :
          while IFS=$'\t' read -r game_id design_date; do
            [ -z "$game_id" ] && continue
            mkdir -p "/tmp/design-promotion-runtime/artbook-submissions" "/tmp/design-promotion-runtime/design/$game_id"
            cp -R "artbook-submissions/$game_id" "/tmp/design-promotion-runtime/artbook-submissions/"
            cp -R "design/$game_id/$design_date" "/tmp/design-promotion-runtime/design/$game_id/"
          done < /tmp/post-promotion-artbook-targets.tsv 2>/dev/null || true

      - name: Persist promoted state to company runtime branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-design-promotion'
          git config user.email 'design-promotion@users.noreply.github.com'
          git fetch origin main "$COMPANY_RUNTIME_BRANCH"
          git reset --hard origin/main
          git clean -fd
          git checkout -B design-promotion-persist "origin/$COMPANY_RUNTIME_BRANCH"
          cp /tmp/design-promotion-runtime/game-seed-state.json game-seed-state.json
          cp /tmp/design-promotion-runtime/autonomous-portfolio.json autonomous-portfolio.json
          cp /tmp/design-promotion-runtime/game-catalog.json game-catalog.json
          cp /tmp/design-promotion-runtime/development-queue.json development-queue.json
          git add -- game-seed-state.json autonomous-portfolio.json game-catalog.json development-queue.json
          targets=/tmp/design-promotion-runtime/post-promotion-artbook-targets.tsv
          if [ -f "$targets" ]; then
            while IFS=$'\t' read -r game_id design_date; do
              [ -z "$game_id" ] && continue
              rm -rf "artbook-submissions/$game_id" "design/$game_id/$design_date"
              mkdir -p artbook-submissions/$game_id design/$game_id
              cp -R "/tmp/design-promotion-runtime/artbook-submissions/$game_id/." "artbook-submissions/$game_id/"
              cp -R "/tmp/design-promotion-runtime/design/$game_id/$design_date" "design/$game_id/"
              git add -- "artbook-submissions/$game_id" "design/$game_id/$design_date"
            done < "$targets"
          fi
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'DESIGN_PROMOTION_RUNTIME_CHANGE=NO'
          else
            git commit -m 'runtime: promote 80-point designs and generate post-promotion artbooks [skip ci]'
            git push origin "HEAD:refs/heads/$COMPANY_RUNTIME_BRANCH"
            echo 'DESIGN_PROMOTION_RUNTIME_CHANGE=PERSISTED'
          fi
          echo 'PUBLIC_MAIN_WRITE=NO'

      - name: Dispatch DEVELOPMENT_CONFIRMED runtime when available
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh workflow view company-development-confirmed-runtime.yml --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh workflow run company-development-confirmed-runtime.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo 'DEVELOPMENT_RUNTIME_DISPATCHED=YES'
          else
            echo 'DEVELOPMENT_RUNTIME_DISPATCHED=NO_WORKFLOW_YET'
          fi
