name: Company DESIGN_ONLY Promotion Sync

on:
  workflow_dispatch:
  # 설계가 PASS로 저장됐어도 이벤트 전달·후속 실행이 실패하면 기존 승격기를
  # 정기 재진입시킨다. 점수·허가를 새로 생성하지 않으며 검증된 증거만 읽는다.
  schedule:
    - cron: '53 * * * *'
  workflow_run:
    workflows:
      - Company Seed DESIGN_ONLY Runtime
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/company-design-promotion-sync.yml'
      - 'tools/design-only-promotion-sync.mjs'
      - 'tools/company-minimum-design-contract.mjs'
      - 'tools/company-direct-native-design-migration.mjs'
      - 'tools/company-homepage-platform-exposure-sync.mjs'
      - 'company-learning/platform-release-roadmap.json'
      - 'qa/design-only-promotion-sync.test.mjs'
      - 'qa/design-promotion-workflow-contract.test.mjs'
      - 'company-directive.json'

permissions:
  contents: write
  actions: write

concurrency:
  group: company-design-promotion-runtime
  cancel-in-progress: false

env:
  COMPANY_RUNTIME_BRANCH: company-runtime
  COMPANY_VERIFIED_POLICY_PATH: ${{ github.workspace }}/company-learning/platform-release-roadmap.json
  COMPANY_VERIFIED_DESIGN_POLICY_PATH: ${{ github.workspace }}/company-learning/platform-release-roadmap.json

jobs:
  promote:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_run' && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'))
    runs-on: ubuntu-slim
    timeout-minutes: 12
    steps:
      - name: Checkout current engine source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Overlay latest company runtime design evidence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "+refs/heads/$COMPANY_RUNTIME_BRANCH:refs/remotes/origin/$COMPANY_RUNTIME_BRANCH" --depth=2 --no-tags --quiet
          for runtime_path in game-seed-state.json design autonomous-portfolio.json game-catalog.json development-queue.json roblox-dedicated-targets.json; do
            if git cat-file -e "origin/$COMPANY_RUNTIME_BRANCH:$runtime_path" 2>/dev/null; then
              git checkout "origin/$COMPANY_RUNTIME_BRANCH" -- "$runtime_path"
            fi
          done
          git reset -- game-seed-state.json design autonomous-portfolio.json game-catalog.json development-queue.json roblox-dedicated-targets.json >/dev/null 2>&1 || true
          test -f game-seed-state.json
          test -s "$COMPANY_VERIFIED_POLICY_PATH"
          echo "DESIGN_PROMOTION_VERIFIED_POLICY_PATH=$COMPANY_VERIFIED_POLICY_PATH"
          echo 'DESIGN_PROMOTION_RUNTIME_OVERLAY=YES'
          echo 'DEVELOPMENT_ADMISSION_GATE=MINIMUM_ROBLOX_DESIGN_READY'
          echo 'STRICT_DESIGN_REVIEW=PARALLEL_NON_ADMISSION_GATE'
          echo 'HUMAN_POLICY_DOCUMENT_REQUIRED=NO'
          echo 'PUBLIC_MAIN_WRITE=NO'

      - name: Validate promotion contract
        run: |
          node --check tools/design-only-promotion-sync.mjs
          node --check tools/company-minimum-design-contract.mjs
          node --check tools/company-direct-native-design-migration.mjs
          node --check tools/company-homepage-platform-exposure-sync.mjs
          node --check tools/company-direct-native-design-migration.mjs
          node --test qa/company-minimum-design-contract.test.mjs
          node --test qa/design-only-promotion-sync.test.mjs qa/design-promotion-workflow-contract.test.mjs
          node --check tools/vibe2-verified-design-handoff.mjs
          node --test qa/vibe2-verified-design-handoff.test.mjs

      - name: Migrate legacy DEVELOPMENT_CONFIRMED designs to direct native profiles
        run: node tools/company-direct-native-design-migration.mjs

      - name: Promote verified Roblox minimum design to native development
        run: node tools/design-only-promotion-sync.mjs

      - name: Verify confirmed-seed dual-native queue invariant
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const state=JSON.parse(fs.readFileSync('game-seed-state.json','utf8'));
          const queue=JSON.parse(fs.readFileSync('development-queue.json','utf8'));
          const portfolio=JSON.parse(fs.readFileSync('autonomous-portfolio.json','utf8'));
          const catalog=JSON.parse(fs.readFileSync('game-catalog.json','utf8'));
          const catalogById=new Map((catalog.games||[]).map(game=>[game.id,game]));
          const ownerStopped=new Set(catalog.ownerStoppedGameIds||[]);
          const byGame=new Map((queue.items||[]).map(item=>[item.gameId,item]));
          let confirmed=0;
          for(const seed of state.seeds||[]){
            if(String(seed.status||'').toUpperCase()!=='ACTIVE')continue;
            if(String(seed.productionClass||'').toUpperCase()!=='DEVELOPMENT_CONFIRMED')continue;
            const game=catalogById.get(seed.gameId);
            if(ownerStopped.has(seed.gameId)||game?.ownerDevelopmentStopped===true
              ||['OWNER_STOPPED','STOPPED'].includes(String(game?.lifecycleState||'').toUpperCase()))continue;
            confirmed++;
            const item=byGame.get(seed.gameId);
            if(!item)throw new Error(`development queue missing: ${seed.gameId}`);
            if(item.minimumDesignContract?.pass!==true)throw new Error(`minimum design contract missing: ${seed.gameId}`);
            const targets=new Set(item.concurrentTargetPlatforms||[]);
            const isWeb=String(item.selectedPlatform||'').toUpperCase()==='WEB';
            if(isWeb){
              if(item.ownerWebIntakeEngine!=='HTML_CSS_JAVASCRIPT'||item.web3dRedevelopmentRequired!==true
                ||targets.size!==1||!targets.has('WEB')||item.platformDesignProfiles?.WEB?.jsonPointer!=='/content/webCanonicalDesign'
                ||item.targetSourcePath!==`web-games/${seed.gameId}`)
                throw new Error(`Web-only F0-F9 source invariant failed: ${seed.gameId}`);
            }else{
              if(!targets.has('ROBLOX')||targets.has('UNITY'))throw new Error(`Roblox-only target invariant failed: ${seed.gameId}`);
              if(item.platformDesignProfiles?.ROBLOX?.jsonPointer!=='/content/platformProfiles/ROBLOX')throw new Error(`Roblox platform profile missing: ${seed.gameId}`);
            }
            if(Object.hasOwn(item,'webValidationRequired')||Object.hasOwn(item,'musicValidationRequired'))throw new Error(`legacy Web gate key still present: ${seed.gameId}`);
            const currentStep=String(item.currentStep||'').trim().toUpperCase();
            if(!currentStep||(!isWeb&&/^WEB_|^WAITING_WEB/.test(currentStep)))throw new Error(`direct-native progress invalid: ${seed.gameId}:${currentStep||'MISSING'}`);
            const project=(portfolio.projects||[]).find(row=>row.slug===seed.gameId);
            const mode=isWeb?'GENERAL_WEB_3D_AUTONOMOUS':'ROBLOX_ONLY_OWNER_ACTIVE';
            if(project?.mode!==mode)throw new Error(`platform production mode mismatch: ${seed.gameId}`);
          }
          console.log(`ACTIVE_DEVELOPMENT_CONFIRMED_SEED_COUNT=${confirmed}`);
          console.log('DEVELOPMENT_ADMISSION_GATE=MINIMUM_ROBLOX_DESIGN_READY');
          console.log('STRICT_DESIGN_REVIEW=PARALLEL_NON_ADMISSION_GATE');
          console.log('UNITY_WEB_GATE=DISABLED');
          console.log('ROBLOX_ONLY_QUEUE_INVARIANT=PASS');
          NODE

      - name: Persist promoted state to company runtime branch
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-design-promotion'
          git config user.email 'design-promotion@users.noreply.github.com'
          persisted=0
          attempt=0
          refill_required=false
          # 메인: 실제 상태 충돌만 최신 상태로 다시 계산한다. 실행 시간은 기존 12분 제한을 따른다.
          while true; do
            attempt=$((attempt+1))
            echo "DESIGN_PROMOTION_RUNTIME_PERSIST_ATTEMPT=$attempt"
            git fetch origin "+refs/heads/main:refs/remotes/origin/main" "+refs/heads/$COMPANY_RUNTIME_BRANCH:refs/remotes/origin/$COMPANY_RUNTIME_BRANCH" --depth=2 --no-tags --quiet

            runtime_base="$(git rev-parse "origin/$COMPANY_RUNTIME_BRANCH")"

            # The earlier evidence overlay and promotion calculation intentionally dirty the main worktree.
            # Discard only this ephemeral checkout state before switching to the canonical runtime branch;
            # promotion is recalculated from the newest runtime state below.
            git reset --hard HEAD
            git clean -fd
            # A checkout of the ephemeral runner can leave tracked LFS art files dirty.
            # This worktree is intentionally discarded before recalculating on the runtime branch.
            git checkout -f -B design-promotion-persist "origin/$COMPANY_RUNTIME_BRANCH"
            git reset --hard "origin/$COMPANY_RUNTIME_BRANCH"
            git clean -fd

            # Re-run the canonical promotion calculation against the newest runtime state.
            # Overlay only machine policy and the responsible runtime tools from main.
            # Runtime JSON remains branch-owned; policy/tool files are never persisted to company-runtime.
            git checkout origin/main -- company-directive.json company-learning/platform-release-roadmap.json company-learning/company-log-map.json company-learning/company-architecture-map.json company-learning/security-immune-system.json tools/design-only-promotion-sync.mjs tools/game-seed-state.mjs tools/game-seed-platform-profile.mjs tools/production-classification.mjs tools/company-selected-platform-router.mjs tools/company-minimum-design-contract.mjs tools/company-web-validation-evidence-contract.mjs tools/owner-design-reset.mjs tools/company-homepage-platform-exposure-sync.mjs tools/company-platform-exposure-control.mjs tools/company-shared-context.mjs tools/company-direct-native-design-migration.mjs tools/company-game-seed-contract.mjs tools/company-design-gate-scoring-v2.mjs tools/vibe2-verified-design-handoff.mjs
            git reset -- company-directive.json company-learning/platform-release-roadmap.json company-learning/company-log-map.json company-learning/company-architecture-map.json company-learning/security-immune-system.json tools/design-only-promotion-sync.mjs tools/game-seed-state.mjs tools/game-seed-platform-profile.mjs tools/production-classification.mjs tools/company-selected-platform-router.mjs tools/company-minimum-design-contract.mjs tools/company-web-validation-evidence-contract.mjs tools/owner-design-reset.mjs tools/company-homepage-platform-exposure-sync.mjs tools/company-platform-exposure-control.mjs tools/company-shared-context.mjs tools/company-direct-native-design-migration.mjs tools/company-game-seed-contract.mjs tools/company-design-gate-scoring-v2.mjs tools/vibe2-verified-design-handoff.mjs >/dev/null 2>&1 || true
            test -s "$COMPANY_VERIFIED_POLICY_PATH"
            node tools/company-direct-native-design-migration.mjs
            node tools/design-only-promotion-sync.mjs
            node tools/company-homepage-platform-exposure-sync.mjs development-queue.json game-catalog.json homepage-platform-exposure.json "$COMPANY_VERIFIED_POLICY_PATH"

            git add -- game-seed-state.json design autonomous-portfolio.json game-catalog.json development-queue.json homepage-platform-exposure.json
            git diff --cached --check
            # 타임스탬프만 바뀐 동기화는 24H 계획기와 네이티브 개발을 중복 깨우지 않는다.
            # 실제 개발 대기열 내용 또는 검증 설계가 바뀌면 기존 즉시 재진입 경로를 유지한다.
            refill_required=false
            queue_diff="$(git diff --cached --unified=0 -- development-queue.json)"
            queue_semantic_diff="$(printf '%s\n' "$queue_diff" | grep -E '^[+-][^+-]' | grep -Ev '^[+-][[:space:]]*"updatedAt":' || true)"
            design_changes="$(git diff --cached --name-only -- design)"
            if [ -n "$queue_semantic_diff" ] || [ -n "$design_changes" ]; then
              refill_required=true
            fi
            if git diff --cached --quiet; then
              echo 'DESIGN_PROMOTION_RUNTIME_CHANGE=NO'
              persisted=1
              break
            fi
            git commit -m 'runtime: reconcile confirmed seeds into development queue [skip ci]'
            if git push origin "HEAD:refs/heads/$COMPANY_RUNTIME_BRANCH"; then
              echo 'DESIGN_PROMOTION_RUNTIME_CHANGE=PERSISTED'
              persisted=1
              break
            fi
            git fetch origin "+refs/heads/$COMPANY_RUNTIME_BRANCH:refs/remotes/origin/$COMPANY_RUNTIME_BRANCH" --depth=2 --no-tags --quiet
            runtime_latest="$(git rev-parse "origin/$COMPANY_RUNTIME_BRANCH")"
            if [ "$runtime_latest" = "$runtime_base" ]; then
              echo 'DESIGN_PROMOTION_RUNTIME_PERSIST=FAILED_WITHOUT_STATE_CONFLICT' >&2
              exit 1
            fi
            retry_delay=$((1 + (attempt < 6 ? attempt : 6) + RANDOM % 5))
            echo "DESIGN_PROMOTION_RUNTIME_PERSIST_CONFLICT=RETRY_LATEST_RUNTIME:$runtime_base:$runtime_latest"
            echo "DESIGN_PROMOTION_RUNTIME_RETRY_DELAY_SECONDS=$retry_delay"
            sleep "$retry_delay"
          done
          if [ "$persisted" -ne 1 ]; then
            echo 'DESIGN_PROMOTION_RUNTIME_PERSIST=UNVERIFIED' >&2
            exit 1
          fi
          echo 'PUBLIC_MAIN_WRITE=NO'
          echo "refill_required=$refill_required" >> "${GITHUB_OUTPUT:-/dev/null}"
          echo "DESIGN_PROMOTION_SEMANTIC_REFILL=$refill_required"

      - name: Verify exact promoted runtime design handoff for Vibe
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "+refs/heads/$COMPANY_RUNTIME_BRANCH:refs/remotes/origin/$COMPANY_RUNTIME_BRANCH" --depth=2 --no-tags --quiet
          runtime_sha="$(git rev-parse "origin/$COMPANY_RUNTIME_BRANCH")"
          node tools/vibe2-verified-design-handoff.mjs --runtime-sha="$runtime_sha" | tee /tmp/vibe2-verified-design-handoff.log
          grep -q '^VIBE2_VERIFIED_DESIGN_INTAKE=PASS$' /tmp/vibe2-verified-design-handoff.log
          echo "VIBE2_VERIFIED_DESIGN_DISPATCH_SOURCE=company-runtime:$runtime_sha"

      - name: Dispatch native development and immediate Vibe planner refill
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.persist.outputs.refill_required }}" != 'true' ]; then
            echo 'VIBE2_PROMOTION_REFILL=SKIPPED_NO_SEMANTIC_DESIGN_OR_QUEUE_CHANGE'
            echo 'NATIVE_DEVELOPMENT_DISPATCH=SKIPPED_NO_SEMANTIC_PROMOTION'
            exit 0
          fi
          gh workflow run company-development-confirmed-runtime.yml --repo "$GITHUB_REPOSITORY" --ref main -f trigger_source=DESIGN_PROMOTION
          gh workflow run vibe2-24h-runner.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'ROBLOX_ONLY_DISPATCH=CENTRAL_EXACT_FANOUT'
          echo 'DIRECT_NATIVE_BATCH_DISPATCH=FORBIDDEN'
          echo 'VERIFIED_DESIGN_VIBE_REFILL_DISPATCH=YES'
          echo 'VERIFIED_DESIGN_VIBE_REFILL_SCHEDULER=vibe2-24h-runner.yml'
          echo 'VERIFIED_DESIGN_VIBE_REFILL_AFTER_RUNTIME_PERSIST=YES'
          echo 'UNITY_WEB_PROMOTION_GATE=NO'
          echo 'OWNER_HELD_UNITY_DISPATCH=NO'
