name: Company DESIGN_ONLY Promotion Sync

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Company Seed DESIGN_ONLY Runtime
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/company-design-promotion-sync.yml'
      - 'tools/design-only-promotion-sync.mjs'
      - 'qa/design-only-promotion-sync.test.mjs'
      - 'qa/design-promotion-workflow-contract.test.mjs'
      - 'COMPANY_FLOW.md'
      - 'company-directive.json'

permissions:
  contents: write
  actions: write

concurrency:
  group: company-design-promotion-runtime
  cancel-in-progress: false

env:
  COMPANY_RUNTIME_BRANCH: company-runtime

jobs:
  promote:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'workflow_run' && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current engine source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Overlay latest company runtime design evidence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$COMPANY_RUNTIME_BRANCH"
          for runtime_path in game-seed-state.json design autonomous-portfolio.json game-catalog.json development-queue.json; do
            if git cat-file -e "origin/$COMPANY_RUNTIME_BRANCH:$runtime_path" 2>/dev/null; then
              git checkout "origin/$COMPANY_RUNTIME_BRANCH" -- "$runtime_path"
            fi
          done
          git reset -- game-seed-state.json design autonomous-portfolio.json game-catalog.json development-queue.json >/dev/null 2>&1 || true
          test -f game-seed-state.json
          echo 'STRICT_DESIGN_EVIDENCE_OVERLAY=YES'
          echo 'DESIGN_PROMOTION_RUNTIME_OVERLAY=YES'
          echo 'PRE_WEB_ARTBOOK_REQUIRED=NO'
          echo 'PUBLIC_MAIN_WRITE=NO'

      - name: Validate promotion contract
        run: |
          node --check tools/design-only-promotion-sync.mjs
          node --test qa/design-only-promotion-sync.test.mjs qa/design-promotion-workflow-contract.test.mjs

      - name: Promote 80-point strict-ready design baselines directly to Web gate
        run: node tools/design-only-promotion-sync.mjs

      - name: Verify confirmed-seed queue invariant and strict promotion evidence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';
          const state=JSON.parse(fs.readFileSync('game-seed-state.json','utf8'));
          const queue=JSON.parse(fs.readFileSync('development-queue.json','utf8'));
          const portfolio=JSON.parse(fs.readFileSync('autonomous-portfolio.json','utf8'));
          const latestStrict=(gameId)=>{
            const root=path.join('design',gameId);if(!fs.existsSync(root))return {pass:false,review:null,file:null};
            const dates=fs.readdirSync(root,{withFileTypes:true}).filter(x=>x.isDirectory()).map(x=>x.name).sort().reverse();
            for(const date of dates){
              const file=path.join(root,date,'strict-design-review.json'),statusFile=path.join(root,date,'cycle-status.json');
              if(!fs.existsSync(file)||!fs.existsSync(statusFile))continue;
              const review=JSON.parse(fs.readFileSync(file,'utf8')),status=JSON.parse(fs.readFileSync(statusFile,'utf8'));
              const blockers=Array.isArray(status?.baselineGate?.blockers)?status.baselineGate.blockers:[];
              const currentReady=status?.baselineGate?.state==='DESIGN_BASELINE_READY'&&status?.baselineGate?.ready===true;
              const legacyDirectLeadReady=status?.status==='COMPLETE'&&status?.productionClass==='DESIGN_ONLY'&&blockers.length===1&&blockers[0]==='post-revision-five-department-review-required'&&status?.disposition?.fiveDepartmentLeadReviewCompleted===true&&status?.meeting?.required===false&&Number(status?.baselineGate?.meeting?.conflictCount||0)===0&&Number(status?.baselineGate?.meeting?.holdCount||0)===0;
              const ready=currentReady||legacyDirectLeadReady;
              return {pass:ready&&review.verdict==='PASS'&&Number(review.totalScore)>=80&&Array.isArray(review.hardFailures)&&review.hardFailures.length===0,review,file};
            }
            return {pass:false,review:null,file:null};
          };
          const queueByGame=new Map((queue.items||[]).map(item=>[item.gameId,item]));let strictReadyCount=0;let confirmedSeedCount=0;
          for(const seed of state.seeds||[]){
            if(String(seed.status||'').toUpperCase()!=='ACTIVE')continue;
            const productionClass=String(seed.productionClass||'').toUpperCase();
            const item=queueByGame.get(seed.gameId);
            if(productionClass==='DEVELOPMENT_CONFIRMED'){
              confirmedSeedCount++;
              if(!item||item.productionClass!=='DEVELOPMENT_CONFIRMED')throw new Error(`development-confirmed seed queue missing: ${seed.gameId}`);
              if(item.webValidationRequired!==true||item.musicValidationRequired!==true)throw new Error(`development-confirmed Web validation contract missing: ${seed.gameId}`);
              if(String(item.canonicalState||'')==='WAITING_POST_PROMOTION_ARTBOOK')throw new Error(`legacy pre-Web artbook wait remains: ${seed.gameId}`);
            }
            if(seed.productionClassSource!=='DESIGN_BASELINE_READY_STRICT_PASS')continue;
            const strict=latestStrict(seed.gameId);
            if(!strict.pass)throw new Error(`non-strict design promoted: ${seed.gameId}`);
            strictReadyCount++;
            if(Number(seed.strictDesignReview?.totalScore||0)<80||seed.strictDesignReview?.verdict!=='PASS')throw new Error(`strict evidence not bound to seed: ${seed.gameId}`);
            if(!item||item.productionClass!=='DEVELOPMENT_CONFIRMED')throw new Error(`strict-ready queue handoff missing: ${seed.gameId}`);
            if(item.postPromotionArtbookRequired===true)throw new Error(`pre-Web artbook still required: ${seed.gameId}`);
            if(item.postWebArtbookRequired!==true)throw new Error(`post-Web artbook contract missing: ${seed.gameId}`);
            const project=(portfolio.projects||[]).find(x=>x.slug===seed.gameId);if(project?.productionClass!=='DEVELOPMENT_CONFIRMED')throw new Error(`portfolio promotion missing: ${seed.gameId}`);
          }
          console.log(`ACTIVE_DEVELOPMENT_CONFIRMED_SEED_COUNT=${confirmedSeedCount}`);
          console.log(`STRICT_DESIGN_READY_COUNT=${strictReadyCount}`);
          console.log(`DEVELOPMENT_HANDOFF_COUNT=${(queue.items||[]).length}`);
          console.log('DESIGN_PASS_THRESHOLD=80');
          console.log('HOMEPAGE_WEB_THRESHOLD=80');
          console.log('FORMAL_IMPLEMENTATION_THRESHOLD=90');
          console.log('PRE_WEB_ARTBOOK_REQUIRED=NO');
          console.log('DEVELOPMENT_CONFIRMED_QUEUE_INVARIANT=PASS');
          console.log('DESIGN_ONLY_PROMOTION_CONTRACT=PASS');
          NODE

      - name: Persist promoted state to company runtime branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-design-promotion'
          git config user.email 'design-promotion@users.noreply.github.com'
          persisted=0
          for attempt in 1 2 3; do
            echo "DESIGN_PROMOTION_RUNTIME_PERSIST_ATTEMPT=${attempt}/3"
            git fetch origin main "$COMPANY_RUNTIME_BRANCH"

            # The earlier evidence overlay and promotion calculation intentionally dirty the main worktree.
            # Discard only this ephemeral checkout state before switching to the canonical runtime branch;
            # promotion is recalculated from the newest runtime state below.
            git reset --hard HEAD
            git clean -fd
            git checkout -B design-promotion-persist "origin/$COMPANY_RUNTIME_BRANCH"
            git reset --hard "origin/$COMPANY_RUNTIME_BRANCH"
            git clean -fd

            # Re-run the canonical promotion calculation against the newest runtime state.
            # Only runtime JSON files are staged; engine files remain main-owned and are never persisted here.
            git checkout origin/main -- tools/design-only-promotion-sync.mjs tools/company-selected-platform-router.mjs tools/company-web-validation-evidence-contract.mjs tools/owner-design-reset.mjs
            git reset -- tools/design-only-promotion-sync.mjs tools/company-selected-platform-router.mjs tools/owner-design-reset.mjs >/dev/null 2>&1 || true
            node tools/design-only-promotion-sync.mjs

            git add -- game-seed-state.json autonomous-portfolio.json game-catalog.json development-queue.json
            git diff --cached --check
            if git diff --cached --quiet; then
              echo 'DESIGN_PROMOTION_RUNTIME_CHANGE=NO'
              persisted=1
              break
            fi
            git commit -m 'runtime: reconcile confirmed seeds into development queue [skip ci]'
            if git push origin "HEAD:refs/heads/$COMPANY_RUNTIME_BRANCH"; then
              echo 'DESIGN_PROMOTION_RUNTIME_CHANGE=PERSISTED'
              persisted=1
              break
            fi
            echo 'DESIGN_PROMOTION_RUNTIME_PERSIST_CONFLICT=RETRY_LATEST_RUNTIME'
          done
          if [ "$persisted" -ne 1 ]; then
            echo 'DESIGN_PROMOTION_RUNTIME_PERSIST=FAILED_AFTER_3_ATTEMPTS' >&2
            exit 1
          fi
          echo 'PUBLIC_MAIN_WRITE=NO'

      - name: Stop after DEVELOPMENT_CONFIRMED queue while Web development is owner-paused
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pause="$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const d=JSON.parse(fs.readFileSync('company-directive.json','utf8'));
          const p=d?.executionPause||{};
          const paused=p.webDevelopmentPaused===true&&p.developmentRuntimeDispatchAllowed===false;
          process.stdout.write(paused?'YES':'NO');
          NODE
          )"
          if [ "$pause" = "YES" ]; then
            echo 'DEVELOPMENT_CONFIRMED_QUEUE=ALLOWED'
            echo 'DEVELOPMENT_RUNTIME_DISPATCHED=NO'
            echo 'OWNER_WEB_DEVELOPMENT_PAUSED=true'
            echo 'STOP_AFTER_STAGE=DEVELOPMENT_CONFIRMED_QUEUE'
            exit 0
          fi
          if gh workflow view company-development-confirmed-runtime.yml --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh workflow run company-development-confirmed-runtime.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo 'DEVELOPMENT_RUNTIME_DISPATCHED=YES'
          else
            echo 'DEVELOPMENT_RUNTIME_DISPATCHED=NO_WORKFLOW_YET'
          fi
