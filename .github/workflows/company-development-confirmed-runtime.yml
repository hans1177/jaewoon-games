name: Company DEVELOPMENT_CONFIRMED Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/company-development-confirmed-runtime.yml'
      - '.github/workflows/company-development-roblox-runtime.yml'
      - '.github/workflows/company-development-roblox-runtime-continuation.yml'
      - '.github/workflows/company-development-unity-runtime.yml'
      - '.github/workflows/unity-android-regression.yml'
      - '.github/actions/prepare-ollama/action.yml'
      - 'roblox-games/**'
      - 'tools/company-selected-platform-router.mjs'
      - 'tools/company-development-web-bootstrap.mjs'
      - 'tools/company-web-contract-adapter.mjs'
      - 'tools/company-vibe2-gameplay-intelligence.mjs'
      - 'tools/company-vibe2-coding-architecture.mjs'
      - 'tools/company-development-web-gameplay-validation.mjs'
      - 'tools/company-web-validation-evidence-contract.mjs'
      - 'tools/company-design-artbook.mjs'
      - 'tools/company-development-roblox-bootstrap.mjs'
      - 'tools/company-development-roblox-build-preflight.mjs'
      - 'tools/company-development-roblox-runtime-smoke.luau'
      - 'tools/company-development-unity-platform.mjs'
      - 'tools/company-development-unity-bootstrap.mjs'
      - 'tools/company-development-unity-evidence.mjs'
      - 'tools/company-development-validation-cycle.mjs'
      - 'tools/design-only-promotion-sync.mjs'
      - 'qa/company-selected-platform-router.test.mjs'
      - 'qa/company-development-web-runtime.test.mjs'
      - 'qa/company-web-contract-adapter.test.mjs'
      - 'qa/company-web-vibe-handoff-e2e.test.mjs'
      - 'qa/company-vibe2-gameplay-intelligence.test.mjs'
      - 'qa/company-vibe2-coding-architecture.test.mjs'
      - 'qa/company-web-validation-evidence-contract.test.mjs'
      - 'qa/company-web-real-game-regression.test.mjs'
      - 'qa/company-development-validation-selected-platform.test.mjs'
      - 'qa/company-development-roblox-runtime.test.mjs'
      - 'qa/company-development-roblox-runtime-continuation.test.mjs'
      - 'qa/company-development-unity-runtime.test.mjs'
      - 'qa/design-only-promotion-sync.test.mjs'
      - 'qa/company-speed-sequence-workflow.test.mjs'
      - 'company-learning/platform-release-roadmap.json'
      - 'qa/company-shared-context.test.mjs'
      - 'tools/company-shared-context.mjs'
      - 'company-learning/company-architecture-map.json'
      - 'company-learning/company-log-map.json'
      - 'company-directive.json'
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'

permissions:
  contents: write
  actions: write

env:
  COMPANY_RUNTIME_BRANCH: company-runtime
  OWNER_WEB_DEVELOPMENT_PAUSED: 'false'

jobs:
  web-plan:
    name: resolve required Web gameplay and music work
    concurrency:
      group: company-development-web-plan
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      target_count: ${{ steps.targets.outputs.target_count }}
      matrix: ${{ steps.targets.outputs.matrix }}
      targets_json: ${{ steps.targets.outputs.targets_json }}
      runtime_sha: ${{ steps.targets.outputs.runtime_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Web and promotion contracts
        run: |
          node --check tools/company-shared-context.mjs
          node --test qa/company-shared-context.test.mjs
          node tools/company-shared-context.mjs --output=/tmp/company-shared-context-web-plan.json
          node --check tools/company-development-web-bootstrap.mjs
          node --check tools/company-web-contract-adapter.mjs
          node --check tools/company-vibe2-gameplay-intelligence.mjs
          node --check tools/company-vibe2-coding-architecture.mjs
          node --check tools/company-development-web-gameplay-validation.mjs
          node --check tools/company-web-validation-evidence-contract.mjs
          node --check tools/company-design-artbook.mjs
          node --check tools/design-only-promotion-sync.mjs
          node --test qa/company-development-web-runtime.test.mjs qa/company-web-contract-adapter.test.mjs qa/company-web-vibe-handoff-e2e.test.mjs qa/company-vibe2-gameplay-intelligence.test.mjs qa/company-vibe2-coding-architecture.test.mjs qa/company-web-validation-evidence-contract.test.mjs qa/company-web-real-game-regression.test.mjs qa/company-development-validation-selected-platform.test.mjs qa/design-only-promotion-sync.test.mjs

      - name: Fetch current company runtime
        run: git fetch --no-tags --depth=1 origin "$COMPANY_RUNTIME_BRANCH"

      - name: Resolve DEVELOPMENT_CONFIRMED games missing fresh current-schema Web 80-point evidence
        id: targets
        env:
          PUSH_HEAD_MESSAGE: ${{ github.event.head_commit.message || '' }}
        shell: bash
        run: |
          set -euo pipefail
          runtime_sha="$(git rev-parse "origin/$COMPANY_RUNTIME_BRANCH")"
          printf 'runtime_sha=%s\n' "$runtime_sha" >> "$GITHUB_OUTPUT"
          policy_pause="$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const d=JSON.parse(fs.readFileSync('company-directive.json','utf8'));
          const p=d?.executionPause||{};
          process.stdout.write(p.webDevelopmentPaused===true||p.developmentRuntimeDispatchAllowed!==true?'true':'false');
          NODE
          )"
          if [ "$policy_pause" = 'true' ]; then
            printf 'target_count=0\n' >> "$GITHUB_OUTPUT"
            printf 'matrix=%s\n' '{"include":[]}' >> "$GITHUB_OUTPUT"
            printf 'targets_json=[]\n' >> "$GITHUB_OUTPUT"
            echo 'OWNER_WEB_DEVELOPMENT_PAUSED=YES'
            echo 'WEB_DEVELOPMENT_TARGET_COUNT=0'
            exit 0
          fi
          echo 'OWNER_WEB_DEVELOPMENT_PAUSED=NO'
          echo 'DEVELOPMENT_RUNTIME_DISPATCH_ALLOWED=YES'
          git show "origin/$COMPANY_RUNTIME_BRANCH:development-queue.json" > /tmp/development-queue.json
          git show "origin/$COMPANY_RUNTIME_BRANCH:game-catalog.json" > /tmp/game-catalog.json
          git show "origin/$COMPANY_RUNTIME_BRANCH:game-seed-state.json" > /tmp/game-seed-state.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {evaluateWebValidationEvidence,sha256Text,WEB_HOMEPAGE_MINIMUM,WEB_VALIDATION_SCHEMA_VERSION} from './tools/company-web-validation-evidence-contract.mjs';
          const q=JSON.parse(fs.readFileSync('/tmp/development-queue.json','utf8'));
          const catalog=JSON.parse(fs.readFileSync('/tmp/game-catalog.json','utf8'));
          const seedState=JSON.parse(fs.readFileSync('/tmp/game-seed-state.json','utf8'));
          const roadmap=JSON.parse(fs.readFileSync('company-learning/platform-release-roadmap.json','utf8'));
          const ownerResetIds=new Set(Array.isArray(seedState?.ownerAllGamesDesignReset?.gameIds)?seedState.ownerAllGamesDesignReset.gameIds.map(String):[]);
          const ownerResetAt=Date.parse(seedState?.ownerAllGamesDesignReset?.updatedAt||'')||0;
          const resetPassIds=new Set((seedState.seeds||[]).filter(seed=>{
            const gameId=String(seed?.gameId||'').trim();
            if(!ownerResetIds.has(gameId))return false;
            const review=seed?.strictDesignReview||{};
            const updatedAt=Date.parse(seed?.strictDesignReviewUpdatedAt||'')||0;
            return updatedAt>=ownerResetAt&&String(review.verdict||'').toUpperCase()==='PASS'&&Number(review.totalScore)>=80&&Array.isArray(review.hardFailures)&&review.hardFailures.length===0;
          }).map(seed=>String(seed.gameId||'').trim()));
          const canonicalGameIds=new Set((catalog.games||[]).filter(game=>{
            const gameId=String(game.id||'').trim();
            return ['ACTIVE','REBUILD'].includes(String(game.lifecycleState||'ACTIVE').toUpperCase())&&String(game.productionClass||'').toUpperCase()==='DEVELOPMENT_CONFIRMED'&&(!ownerResetIds.has(gameId)||resetPassIds.has(gameId));
          }).map(game=>String(game.id||'').trim()).filter(Boolean));
          const runtimeRef=`origin/${process.env.COMPANY_RUNTIME_BRANCH}`;
          const showText=file=>execFileSync('git',['show',`${runtimeRef}:${file}`],{encoding:'utf8',maxBuffer:32*1024*1024});
          const showJson=file=>JSON.parse(showText(file));
          const freshWeb80=item=>{
            if(!item.webValidationPassedAt||item.musicValidationPassed!==true)return false;
            const evidencePath=String(item.webValidationEvidencePath||'').trim();
            const webSourcePath=String(item.webSourcePath||item.optionalWebSourcePath||`web-games/${item.gameId}`).replace(/^\/+|\/+$/g,'');
            const baselinePath=String(item.designBaselineSource||'').trim();
            if(!evidencePath||!webSourcePath||!baselinePath)return false;
            try{
              const evidence=showJson(evidencePath);
              const currentSourceSha256=sha256Text(showText(`${webSourcePath}/index.html`));
              const currentBaselineSha256=sha256Text(showText(baselinePath));
              return evaluateWebValidationEvidence(evidence,{minimumScore:WEB_HOMEPAGE_MINIMUM,currentSourceSha256,currentBaselineSha256}).pass;
            }catch{return false;}
          };
          const pilotMatch=String(process.env.PUSH_HEAD_MESSAGE||'').match(/\[web-pilot:([a-zA-Z0-9._-]+)\]/);
          const requestedGameId=String(pilotMatch?.[1]||'').trim();
          const platformPriority=item=>String(item.selectedPlatform||item.targetPlatform||'').toUpperCase()==='ROBLOX'?0:String(item.selectedPlatform||item.targetPlatform||'').toUpperCase()==='UNITY'?1:2;
          const stale=(q.items||[]).filter(item=>{
            if(!canonicalGameIds.has(String(item.gameId||'').trim()))return false;
            if(String(item.productionClass||'').toUpperCase()!=='DEVELOPMENT_CONFIRMED')return false;
            const state=String(item.canonicalState||'').toUpperCase();
            if(state==='DEVELOPMENT_BLOCKED')return false;
            if(state.endsWith('_REPAIR_REQUIRED'))return true;
            return !freshWeb80(item);
          }).sort((a,b)=>{
            const ap=platformPriority(a),bp=platformPriority(b);
            if(ap!==bp)return ap-bp;
            const at=Date.parse(a.enqueuedAt||'')||0,bt=Date.parse(b.enqueuedAt||'')||0;
            if(at!==bt)return at-bt;
            return String(a.gameId||'').localeCompare(String(b.gameId||''));
          });
          const requestedItem=requestedGameId?(q.items||[]).find(item=>item.gameId===requestedGameId&&canonicalGameIds.has(String(item.gameId||'').trim())):null;
          const selected=requestedGameId?stale.filter(item=>item.gameId===requestedGameId):stale;
          if(requestedGameId&&!requestedItem)throw new Error(`WEB_PILOT_TARGET_NOT_FOUND:${requestedGameId}`);
          if(requestedGameId&&selected.length===0&&!freshWeb80(requestedItem))throw new Error(`WEB_PILOT_TARGET_NOT_ELIGIBLE:${requestedGameId}`);
          const rows=selected.map(item=>{
            const canonicalState=String(item.canonicalState||'').toUpperCase();
            const runtimeStage=canonicalState==='WAITING_WEB_FINAL_CONTENT_DEPTH'?'final-content-depth':'initial-cycle';
            const forceWebRepair=canonicalState.endsWith('_REPAIR_REQUIRED');
            return {
              gameId:item.gameId,
              gameName:item.gameName||item.gameId,
              designBaselineSource:item.designBaselineSource,
              designDate:item.designDate||'',
              selectedPlatform:item.selectedPlatform||item.targetPlatform||'ROBLOX',
              targetSourcePath:item.targetSourcePath||item.sourcePath||'',
              webSourcePath:item.webSourcePath||item.optionalWebSourcePath||`web-games/${item.gameId}`,
              runtimeStage,
              existingWebValidated:Boolean(item.webValidationPassedAt)&&!forceWebRepair,
              webInitialCyclePassed:item.webInitialCyclePassed===true,
              webInitialCyclePassedAt:item.webInitialCyclePassedAt||'',
              webInitialCycleEvidencePath:item.webInitialCycleEvidencePath||'',
              webInitialCycleSourcePath:item.webInitialCycleSourcePath||'',
              webInitialCycleSourceIndexSha256:item.webInitialCycleSourceIndexSha256||'',
              webInitialCycleDesignBaselineSha256:item.webInitialCycleDesignBaselineSha256||'',
              webInitialCycleValidationSchemaVersion:Number(item.webInitialCycleValidationSchemaVersion||0)||0,
              webInitialCycleStrictScore:Number(item.webInitialCycleStrictScore||0)||0,
              webInitialCycleStrictReviewPath:item.webInitialCycleStrictReviewPath||'',
              webInitialCycleSourceRevision:item.webInitialCycleSourceRevision||'',
              webInitialCycleMusicValidationPassed:item.webInitialCycleMusicValidationPassed===true,
              webFinalContentDepthEvidencePath:item.webFinalContentDepthEvidencePath||'',
            };
          });
          const matrix={include:rows};
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`target_count=${rows.length}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`matrix=${JSON.stringify(matrix)}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`targets_json=${JSON.stringify(rows)}\n`);
          console.log(`WEB_REQUIRED_QUEUE_COUNT=${rows.length}`);
          console.log(`WEB_REQUIRED_GAME_IDS=${rows.map(x=>x.gameId).join(',')}`);
          console.log(`WEB_INITIAL_TARGET_COUNT=${rows.filter(x=>x.runtimeStage==='initial-cycle').length}`);
          console.log(`WEB_FINAL_CONTENT_DEPTH_TARGET_COUNT=${rows.filter(x=>x.runtimeStage==='final-content-depth').length}`);
          console.log(`WEB_EXISTING_REVALIDATION_TARGET_COUNT=${rows.filter(x=>x.existingWebValidated).length}`);
          console.log(`WEB_REPAIR_TARGET_COUNT=${rows.filter(x=>!x.existingWebValidated&&x.webInitialCyclePassed).length}`);
          console.log(`WEB_PILOT_TARGET=${requestedGameId||'NONE'}`);
          console.log('WEB_HOMEPAGE_THRESHOLD=80');
          console.log(`WEB_VALIDATION_SCHEMA_MINIMUM=${WEB_VALIDATION_SCHEMA_VERSION}`);
          console.log('WEB_STALE_SOURCE_OR_BASELINE_REQUEUED=YES');
          console.log('WEB_FORMAL_IMPLEMENTATION_THRESHOLD=90');
          console.log('WEB_VALIDATION_TIERS=MICRO_FAST_INITIAL_FULL_FINAL');
          console.log('WEB_PARALLEL_TARGET=20');
          console.log('WEB_PARALLEL_MAX=20');
          console.log('WEB_GATE_PLATFORM_PRIORITY=ROBLOX>UNITY>FORTNITE_UEFN');
          console.log('UNITY_DEVELOPMENT_DISABLED=NO');
          NODE

  web-worker:
    name: Web gate ${{ matrix.gameId }}
    needs: web-plan
    if: needs.web-plan.outputs.target_count != '0'
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.web-plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch current company runtime
        run: git fetch --no-tags --depth=1 origin "$COMPANY_RUNTIME_BRANCH"

      - name: Confirm Web implementation ownership contract
        run: |
          set -euo pipefail
          grep -q "GAME_DEVELOPMENT_OWNER=VIBE2_VIBE3" tools/company-development-web-bootstrap.mjs
          grep -q "NON_VIBE_GAME_SOURCE_WRITE=NO" tools/company-development-web-bootstrap.mjs
          grep -q "VIBE_WEB_IMPLEMENTATION_REQUIRED" tools/company-development-web-bootstrap.mjs
          echo 'WEB_IMPLEMENTATION_OWNER=VIBE2_VIBE3'
          echo 'COMPANY_WEB_ROLE=VALIDATE_ROUTE_FAN_IN'
          echo 'NON_VIBE_GAME_SOURCE_WRITE=NO'
          echo 'PRE_WEB_ARTBOOK_REQUIRED=NO'
          echo 'WEB_PAID_AI=NO'
          echo 'WEB_PAID_RUNNER=NO'

      - name: Install isolated browser runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Validate one Vibe-built Web companion
        env:
          GAME_ID: ${{ matrix.gameId }}
          GAME_NAME: ${{ matrix.gameName }}
          DESIGN_BASELINE_SOURCE: ${{ matrix.designBaselineSource }}
          DESIGN_DATE: ${{ matrix.designDate }}
          TARGET_SOURCE_PATH: ${{ matrix.targetSourcePath }}
          WEB_SOURCE_PATH: ${{ matrix.webSourcePath }}
          WEB_RUNTIME_STAGE: ${{ matrix.runtimeStage }}
          WEB_EXISTING_VALIDATED: ${{ matrix.existingWebValidated }}
          WEB_INITIAL_CYCLE_PASSED: ${{ matrix.webInitialCyclePassed }}
          WEB_INITIAL_CYCLE_PASSED_AT: ${{ matrix.webInitialCyclePassedAt }}
          WEB_INITIAL_CYCLE_EVIDENCE_PATH: ${{ matrix.webInitialCycleEvidencePath }}
          WEB_INITIAL_CYCLE_SOURCE_PATH: ${{ matrix.webInitialCycleSourcePath }}
          WEB_INITIAL_CYCLE_SOURCE_INDEX_SHA256: ${{ matrix.webInitialCycleSourceIndexSha256 }}
          WEB_INITIAL_CYCLE_DESIGN_BASELINE_SHA256: ${{ matrix.webInitialCycleDesignBaselineSha256 }}
          WEB_INITIAL_CYCLE_SCHEMA_VERSION: ${{ matrix.webInitialCycleValidationSchemaVersion }}
          WEB_INITIAL_CYCLE_STRICT_SCORE: ${{ matrix.webInitialCycleStrictScore }}
          WEB_INITIAL_CYCLE_STRICT_REVIEW_PATH: ${{ matrix.webInitialCycleStrictReviewPath }}
          WEB_INITIAL_CYCLE_SOURCE_REVISION: ${{ matrix.webInitialCycleSourceRevision }}
          WEB_INITIAL_CYCLE_MUSIC_PASSED: ${{ matrix.webInitialCycleMusicValidationPassed }}
          WEB_FINAL_CONTENT_DEPTH_EVIDENCE_PATH: ${{ matrix.webFinalContentDepthEvidencePath }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import {WEB_VALIDATION_SCHEMA_VERSION} from './tools/company-web-validation-evidence-contract.mjs';
          const item={
            gameId:process.env.GAME_ID,
            gameName:process.env.GAME_NAME,
            designBaselineSource:process.env.DESIGN_BASELINE_SOURCE,
            designDate:process.env.DESIGN_DATE,
            targetSourcePath:process.env.TARGET_SOURCE_PATH,
            webSourcePath:process.env.WEB_SOURCE_PATH,
            runtimeStage:process.env.WEB_RUNTIME_STAGE||'initial-cycle',
            existingWebValidated:String(process.env.WEB_EXISTING_VALIDATED||'').toLowerCase()==='true',
            webInitialCyclePassed:String(process.env.WEB_INITIAL_CYCLE_PASSED||'').toLowerCase()==='true',
            webInitialCyclePassedAt:process.env.WEB_INITIAL_CYCLE_PASSED_AT||'',
            webInitialCycleEvidencePath:process.env.WEB_INITIAL_CYCLE_EVIDENCE_PATH||'',
            webInitialCycleSourcePath:process.env.WEB_INITIAL_CYCLE_SOURCE_PATH||'',
            webInitialCycleSourceIndexSha256:process.env.WEB_INITIAL_CYCLE_SOURCE_INDEX_SHA256||'',
            webInitialCycleDesignBaselineSha256:process.env.WEB_INITIAL_CYCLE_DESIGN_BASELINE_SHA256||'',
            webInitialCycleValidationSchemaVersion:Number(process.env.WEB_INITIAL_CYCLE_SCHEMA_VERSION||0)||0,
            webInitialCycleStrictScore:Number(process.env.WEB_INITIAL_CYCLE_STRICT_SCORE||0)||0,
            webInitialCycleStrictReviewPath:process.env.WEB_INITIAL_CYCLE_STRICT_REVIEW_PATH||'',
            webInitialCycleSourceRevision:process.env.WEB_INITIAL_CYCLE_SOURCE_REVISION||'',
            webInitialCycleMusicValidationPassed:String(process.env.WEB_INITIAL_CYCLE_MUSIC_PASSED||'').toLowerCase()==='true',
            webFinalContentDepthEvidencePath:process.env.WEB_FINAL_CONTENT_DEPTH_EVIDENCE_PATH||'',
          };
          const safe=String(item.gameId).replace(/[^a-zA-Z0-9._-]+/g,'-');
          const root='/tmp/web-worker';
          const persistRoot=path.join(root,'persist');
          const resultsRoot=path.join(root,'results');
          fs.rmSync(root,{recursive:true,force:true});
          fs.mkdirSync(persistRoot,{recursive:true});
          fs.mkdirSync(resultsRoot,{recursive:true});
          const show=file=>execFileSync('git',['show',`origin/${process.env.COMPANY_RUNTIME_BRANCH}:${file}`],{maxBuffer:32*1024*1024});
          const materialize=file=>{const out=path.resolve(file);fs.mkdirSync(path.dirname(out),{recursive:true});fs.writeFileSync(out,show(file));};
          const sha256File=file=>crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const stamp=new Date().toISOString();
          const finalStage=item.runtimeStage==='final-content-depth';
          const stableSource=`web-games/${item.gameId}`;
          const initialEvidenceRelative=item.designBaselineSource.replace(/[^/]+$/,'web-initial-cycle-validation.json');
          const finalEvidenceRelative=item.designBaselineSource.replace(/[^/]+$/,'web-gameplay-validation.json');
          const initialStrictRelative=item.designBaselineSource.replace(/[^/]+$/,'strict-initial-implementation-review.json');
          const finalStrictRelative=item.designBaselineSource.replace(/[^/]+$/,'strict-implementation-review.json');
          const workDir=path.join('/tmp/web-work',safe);
          const bootstrapEvidence=path.join(workDir,'web-bootstrap-evidence.json');
          const gameplayEvidence=path.join(workDir,'web-gameplay-validation.json');
          const screenshot=path.join(workDir,'web-gameplay.png');
          fs.mkdirSync(workDir,{recursive:true});
          let finalEvidencePersisted=false;
          let result;
          try{
            if(!item.designBaselineSource)throw new Error('DESIGN_BASELINE_SOURCE_MISSING');
            materialize(item.designBaselineSource);
            const statusSource=item.designBaselineSource.replace(/design-revised\.json$/,'cycle-status.json');
            try{materialize(statusSource);}catch{}
            if(!finalStage){
              let candidatePath=stableSource;
              if(item.existingWebValidated===true){
                materialize(`${stableSource}/index.html`);
                console.log(`WEB_EXISTING_GAME_FRESH_REVALIDATION=${item.gameId}:${stableSource}`);
              }else{
                const candidateId=`development-web-${item.gameId}-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`;
                candidatePath=`web-games/.autonomous-candidates/${candidateId}`;
                const bootstrapArgs=['tools/company-development-web-bootstrap.mjs',
                  `--game-id=${item.gameId}`,`--game-name=${item.gameName}`,
                  `--baseline=${item.designBaselineSource}`,
                  `--source-path=${item.webSourcePath}`,`--candidate-id=${candidateId}`,
                  `--candidate-path=${candidatePath}`,`--source-commit=${process.env.GITHUB_SHA}`,
                  `--evidence=${bootstrapEvidence}`];
                if(item.webInitialCyclePassed===true)bootstrapArgs.push('--force-repair=true','--repair-reason=FINAL_CONTENT_DEPTH_REWORK_REQUIRED');
                execFileSync(process.execPath,bootstrapArgs,{stdio:'inherit',timeout:9*60*1000});
              }
              execFileSync(process.execPath,['tools/company-development-web-gameplay-validation.mjs',
                `--game-id=${item.gameId}`,`--source=${candidatePath}`,`--port=4181`,
                `--output=${gameplayEvidence}`,`--screenshot=${screenshot}`,'--validation-stage=initial-cycle'],{stdio:'inherit',timeout:8*60*1000});
              const initialReport=JSON.parse(fs.readFileSync(gameplayEvidence,'utf8'));
              const initialScore=Number(initialReport.webStrictScore??initialReport.strictReview?.totalScore);
              const initialHardFailures=Array.isArray(initialReport.strictReview?.hardFailures)?initialReport.strictReview.hardFailures:[];
              if(Number(initialReport.validationSchemaVersion||initialReport.version)!==WEB_VALIDATION_SCHEMA_VERSION||initialReport.pass!==true||initialReport.initialPlayableCycle?.pass!==true||initialReport.musicRuntime?.pass!==true||!Number.isFinite(initialScore)||initialScore<80||initialHardFailures.length)throw new Error('WEB_INITIAL_CYCLE_OR_80_POINT_GATE_NOT_PASS');
              if(initialReport.contentDepthValidation?.pass===true||initialReport.homepageTestEligible===true)throw new Error('WEB_INITIAL_STAGE_MUST_NOT_CLAIM_FINAL_30MIN_PASS');
              initialReport.candidateSourcePath=candidatePath;
              initialReport.sourcePath=stableSource;
              initialReport.policyDocument='company-learning/platform-release-roadmap.json';
              initialReport.requiredBeforeFinalContentDepth=true;
              fs.writeFileSync(gameplayEvidence,JSON.stringify(initialReport,null,2)+'\n');
              const webOut=path.join(persistRoot,stableSource);
              fs.mkdirSync(webOut,{recursive:true});
              fs.copyFileSync(path.join(candidatePath,'index.html'),path.join(webOut,'index.html'));
              const initialEvidenceOut=path.join(persistRoot,initialEvidenceRelative);
              fs.mkdirSync(path.dirname(initialEvidenceOut),{recursive:true});
              fs.copyFileSync(gameplayEvidence,initialEvidenceOut);
