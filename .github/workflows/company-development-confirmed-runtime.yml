name: Company DEVELOPMENT_CONFIRMED Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/company-development-confirmed-runtime.yml'
      - 'tools/company-selected-platform-router.mjs'
      - 'tools/company-development-validation-cycle.mjs'
      - 'tools/design-only-promotion-sync.mjs'
      - 'qa/company-selected-platform-router.test.mjs'
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: company-development-confirmed-runtime
  cancel-in-progress: false

jobs:
  route:
    name: route DEVELOPMENT_CONFIRMED selected platforms
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      dispatch_unity: ${{ steps.route.outputs.dispatch_unity }}
      dispatch_roblox: ${{ steps.route.outputs.dispatch_roblox }}
      dispatch_uefn: ${{ steps.route.outputs.dispatch_uefn }}
      routed_count: ${{ steps.route.outputs.routed_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify selected-platform router contract
        run: |
          node --check tools/company-selected-platform-router.mjs
          node --check tools/company-development-validation-cycle.mjs
          node --check tools/company-development-unity-platform.mjs
          node --check tools/company-development-uefn-platform.mjs
          node --check tools/vibe3-roblox-platform.mjs
          node --test qa/company-selected-platform-router.test.mjs

      - name: Fetch current company runtime
        run: git fetch origin company-runtime

      - name: Change detection, cheap precheck and one routing decision point
        id: route
        shell: bash
        run: |
          set -euo pipefail
          git show origin/company-runtime:development-queue.json > /tmp/development-queue.json
          git show origin/company-runtime:game-catalog.json > /tmp/game-catalog.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {resolveSelectedPlatform,adapterForPlatform,cheapPrecheck,canonicalTargetStep,canonicalTargetWaitingState} from './tools/company-selected-platform-router.mjs';
          const q=JSON.parse(fs.readFileSync('/tmp/development-queue.json','utf8'));
          const catalog=JSON.parse(fs.readFileSync('/tmp/game-catalog.json','utf8'));
          const updates=[];
          const platforms=new Set();
          for(const item of q.items||[]){
            if(String(item.productionClass||'').toUpperCase()!=='DEVELOPMENT_CONFIRMED')continue;
            const status=String(item.status||'').toUpperCase();
            const step=String(item.currentStep||'').toUpperCase();
            const state=String(item.canonicalState||'').toUpperCase();
            if(state==='WAITING_REVALIDATION'||step==='TARGETED_REVALIDATION')continue;
            const legacyActive=status==='ACTIVE'&&step==='UNITY_ANDROID_TECHNICAL_VALIDATION';
            const pending=status==='PENDING';
            const waiting=status==='ACTIVE'&&step==='TARGET_PLATFORM_TECHNICAL_VALIDATION';
            if(!pending&&!legacyActive&&!waiting)continue;
            const game=(catalog.games||[]).find(x=>x.id===item.gameId)||{};
            const platform=resolveSelectedPlatform(item,game);
            const adapter=adapterForPlatform(platform);
            const sourcePath=item.targetSourcePath||item.sourcePath||(adapter?`${adapter.sourceRoot}${item.gameId}`:'');
            const baseline=String(item.designBaselineSource||'');
            const baselineRevision=baseline?crypto.createHash('sha256').update(baseline).digest('hex'):'';
            const precheck=cheapPrecheck({selectedPlatform:platform,sourceRevision:baselineRevision,sourcePath});
            const blockers=[...precheck.errors];
            if(adapter&&adapter.existingExecutionPath==null)blockers.push('platform-runtime-executor-not-configured');
            if(blockers.length){
              updates.push({gameId:item.gameId,status:'ACTIVE',selectedPlatform:platform,targetPlatform:platform,currentStep:'TARGET_PLATFORM_SOURCE_BIND',canonicalState:'WAITING_TARGET_PLATFORM_VALIDATION',platformAdapter:adapter?.adapterPath||null,sourcePath,targetSourcePath:sourcePath,routingBlockers:blockers,updatedAt:new Date().toISOString()});
              continue;
            }
            platforms.add(platform);
            updates.push({gameId:item.gameId,status:'ACTIVE',selectedPlatform:platform,targetPlatform:platform,currentStep:canonicalTargetStep(),canonicalState:canonicalTargetWaitingState(),platformAdapter:adapter.adapterPath,sourcePath,targetSourcePath:sourcePath,routingBlockers:[],routeRevision:baselineRevision,updatedAt:new Date().toISOString()});
          }
          fs.mkdirSync('/tmp/development-route',{recursive:true});
          fs.writeFileSync('/tmp/development-route/updates.json',JSON.stringify(updates,null,2)+'\n');
          const output=process.env.GITHUB_OUTPUT;
          fs.appendFileSync(output,`routed_count=${updates.length}\n`);
          fs.appendFileSync(output,`dispatch_unity=${platforms.has('UNITY')?'true':'false'}\n`);
          fs.appendFileSync(output,`dispatch_roblox=${platforms.has('ROBLOX')?'true':'false'}\n`);
          fs.appendFileSync(output,`dispatch_uefn=${platforms.has('FORTNITE_UEFN')?'true':'false'}\n`);
          console.log(`DEVELOPMENT_ROUTE_COUNT=${updates.length}`);
          console.log(`DEVELOPMENT_ROUTE_PLATFORMS=${[...platforms].join(',')}`);
          console.log('CHANGE_DETECTION=PASS');
          console.log('CHEAP_PRECHECK=PASS_OR_BLOCK_RECORDED');
          NODE

      - name: Persist canonical routed queue state
        if: steps.route.outputs.routed_count != '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-development-router'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -B development-router-persist origin/company-runtime
          node <<'NODE'
          const fs=require('fs');
          const queue=JSON.parse(fs.readFileSync('development-queue.json','utf8'));
          const updates=JSON.parse(fs.readFileSync('/tmp/development-route/updates.json','utf8'));
          for(const update of updates){
            const item=(queue.items||[]).find(x=>x.gameId===update.gameId);
            if(!item)throw new Error(`queue item missing: ${update.gameId}`);
            Object.assign(item,update);
          }
          queue.routerContractVersion=1;
          queue.routerPolicy='COMPANY_FLOW.md';
          queue.cronRole='WATCHDOG_AND_RECOVERY_ONLY';
          queue.updatedAt=new Date().toISOString();
          fs.writeFileSync('development-queue.json',JSON.stringify(queue,null,2)+'\n');
          NODE
          git add development-queue.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'runtime: route DEVELOPMENT_CONFIRMED by selected platform [skip ci]'
            for attempt in 1 2 3; do
              if git push origin HEAD:company-runtime; then break; fi
              git fetch origin company-runtime
              git rebase origin/company-runtime || { git rebase --abort || true; exit 1; }
              sleep $((attempt * 2))
            done
          fi
          echo 'DEVELOPMENT_ROUTER_PERSIST=PASS'

      - name: Router summary
        if: always()
        run: |
          echo 'DEVELOPMENT_PIPELINE=ONE_CANONICAL_PIPELINE'
          echo 'PLATFORM_ROUTER=tools/company-selected-platform-router.mjs'
          echo 'WEB_GAMEPLAY_TESTBED=OPTIONAL'
          echo 'CRON_ROLE=WATCHDOG_AND_RECOVERY_ONLY'
          echo 'QUALITY_GATE_WEAKENING=NO'
          echo 'PUBLIC_MAIN_WRITE=NO'

  dispatch:
    name: immediate selected-platform handoff
    needs: route
    if: always() && needs.route.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch selected-platform executors immediately
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_UNITY: ${{ needs.route.outputs.dispatch_unity }}
          DISPATCH_ROBLOX: ${{ needs.route.outputs.dispatch_roblox }}
          DISPATCH_UEFN: ${{ needs.route.outputs.dispatch_uefn }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DISPATCH_UNITY" == 'true' ]]; then
            gh workflow run company-development-unity-runtime.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo 'IMMEDIATE_NEXT_STAGE_DISPATCH=UNITY'
          fi
          if [[ "$DISPATCH_ROBLOX" == 'true' ]]; then
            gh workflow run vibe2-24h-runner.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo 'IMMEDIATE_NEXT_STAGE_DISPATCH=ROBLOX_V3_PUMP'
          fi
          if [[ "$DISPATCH_UEFN" == 'true' ]]; then
            echo 'UNEXPECTED_UEFN_DISPATCH_WITHOUT_CONFIGURED_EXECUTOR' >&2
            exit 2
          fi
          echo 'ROUTER_DISPATCH_COMPLETE=YES'
