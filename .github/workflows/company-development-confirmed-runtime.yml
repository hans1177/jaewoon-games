          const seedState=JSON.parse(fs.readFileSync('/tmp/game-seed-state.json','utf8'));
          const ownerResetIds=new Set(Array.isArray(seedState?.ownerAllGamesDesignReset?.gameIds)?seedState.ownerAllGamesDesignReset.gameIds.map(String):[]);
          const ownerResetAt=Date.parse(seedState?.ownerAllGamesDesignReset?.updatedAt||'')||0;
          const resetPassIds=new Set((seedState.seeds||[]).filter(seed=>{
            const gameId=String(seed?.gameId||'').trim();
            if(!ownerResetIds.has(gameId))return false;
            const review=seed?.strictDesignReview||{};
            const updatedAt=Date.parse(seed?.strictDesignReviewUpdatedAt||'')||0;
            return updatedAt>=ownerResetAt&&String(review.verdict||'').toUpperCase()==='PASS'&&Number(review.totalScore)>=80&&Array.isArray(review.hardFailures)&&review.hardFailures.length===0;
          }).map(seed=>String(seed.gameId||'').trim()));
          const canonicalGameIds=new Set((catalog.games||[]).filter(game=>{
            const gameId=String(game.id||'').trim();
            return ['ACTIVE','REBUILD'].includes(String(game.lifecycleState||'ACTIVE').toUpperCase())&&String(game.productionClass||'').toUpperCase()==='DEVELOPMENT_CONFIRMED'&&(!ownerResetIds.has(gameId)||resetPassIds.has(gameId));
          }).map(game=>String(game.id||'').trim()).filter(Boolean));
          const runtimeRef=`origin/${process.env.COMPANY_RUNTIME_BRANCH}`;
          const showText=file=>execFileSync('git',['show',`${runtimeRef}:${file}`],{encoding:'utf8',maxBuffer:32*1024*1024});
          const promotionEvidence=item=>{
            const evidencePath=String(item.webValidationEvidencePath||'').trim();
            const webSourcePath=String(item.webSourcePath||`web-games/${item.gameId}`).replace(/^\/+|\/+$/g,'');
            const baselinePath=String(item.designBaselineSource||'').trim();
            if(!evidencePath||!webSourcePath||!baselinePath)return{pass:false,blockers:['WEB_PROMOTION_EVIDENCE_PATH_MISSING']};
            try{
              const evidence=JSON.parse(showText(evidencePath));
              return evaluateWebValidationEvidence(evidence,{minimumScore:WEB_PLATFORM_PROMOTION_MINIMUM,requirePromotionRevalidation:true,currentSourceSha256:sha256Text(showText(`${webSourcePath}/index.html`)),currentBaselineSha256:sha256Text(showText(baselinePath))});
            }catch(error){return{pass:false,blockers:[`WEB_PROMOTION_EVIDENCE_READ_FAILED:${String(error?.message||error).replace(/\s+/g,' ').slice(0,120)}`]};}
          };
          const updates=[];
          const platforms=new Set();
          let promotionRejected=0;
          for(const item of q.items||[]){
            if(!canonicalGameIds.has(String(item.gameId||'').trim()))continue;
            if(String(item.productionClass||'').toUpperCase()!=='DEVELOPMENT_CONFIRMED')continue;
            const hard=Array.isArray(item.strictImplementationHardFailures)?item.strictImplementationHardFailures:[];
            const evidenceGate=promotionEvidence(item);
            const formalPass=item.formalImplementationPassed===true&&String(item.formalImplementationVerdict||'').toUpperCase()==='PASS'&&Number(item.webStrictScore??item.strictImplementationScore)>=90&&hard.length===0&&Number(item.webValidationSchemaVersion)===WEB_VALIDATION_SCHEMA_VERSION&&evidenceGate.pass===true;
            if(!formalPass||!(Boolean(item.webValidationPassedAt)&&item.musicValidationPassed===true)){
              if(item.formalImplementationPassed===true&&!evidenceGate.pass){promotionRejected++;console.log(`WEB_PROMOTION_EVIDENCE_REJECTED=${item.gameId}:${(evidenceGate.blockers||[]).join('|')}`);}
              continue;
            }
            const status=String(item.status||'').toUpperCase();
            const step=String(item.currentStep||'').toUpperCase();
            const state=String(item.canonicalState||'').toUpperCase();
            if(state==='DEVELOPMENT_REVALIDATION_REPAIR_REQUIRED'||step==='TARGETED_REVALIDATION')continue;
            const legacyActive=status==='ACTIVE'&&step==='UNITY_ANDROID_TECHNICAL_VALIDATION';
            const pending=status==='PENDING';
            const waiting=status==='ACTIVE'&&step==='TARGET_PLATFORM_TECHNICAL_VALIDATION';
            const retrySourceBind=status==='ACTIVE'&&step==='TARGET_PLATFORM_SOURCE_BIND'&&state==='TARGET_PLATFORM_REPAIR_REQUIRED';
            if(!pending&&!legacyActive&&!waiting&&!retrySourceBind)continue;
            const game=(catalog.games||[]).find(x=>x.id===item.gameId)||{};
            const platform=resolveSelectedPlatform(item,game);
            const access=String(roadmap?.developmentAccess?.[platform]||'ALWAYS_ALLOWED').toUpperCase();
            if(access==='OWNER_HOLD'){
              console.log(`DEVELOPMENT_ROUTE_OWNER_HOLD=${item.gameId}:${platform}`);
              continue;
            }
            const adapter=adapterForPlatform(platform);
            const oldTarget=String(item.targetSourcePath||'').replaceAll('\\','/');
            const canonicalTarget=adapter?`${adapter.sourceRoot}${item.gameId}`:'';
            const targetSourcePath=adapter&&oldTarget.startsWith(adapter.sourceRoot)?oldTarget:canonicalTarget;
            const baseline=String(item.designBaselineSource||'');
            const baselineRevision=baseline?crypto.createHash('sha256').update(baseline).digest('hex'):'';
            const webPlatformHandoff={
              version:1,
              stage:'WEB_DEVELOPMENT_BASELINE_READY',
              producer:'.github/workflows/company-development-confirmed-runtime.yml',
              gameId:item.gameId,
              sourcePath:String(item.webSourcePath||`web-games/${item.gameId}`).replace(/^\/+|\/+$/g,''),
              evidencePath:String(item.webValidationEvidencePath||''),
              baselineSource:baseline,
              sourceIndexSha256:String(item.webSourceIndexSha256||''),
              designBaselineSha256:String(item.webDesignBaselineSha256||''),
              validationSchemaVersion:Number(item.webValidationSchemaVersion||0),
              strictScore:Number(item.webStrictScore??item.strictImplementationScore),
              promotionRevalidationPassed:item.webPromotionRevalidationPassed===true,
              validationPassedAt:item.webValidationPassedAt||null,
              carryForward:['core-loop','gameplay-state-model','progression-model','input-intent','ui-flow','save-meaning','content-structure','balance-intent','verified-learning-context'],
              nativeRuntimePassTransferred:false,
              authority:'MACHINE_EXECUTION_CONTRACT'
            };
            const precheck=cheapPrecheck({selectedPlatform:platform,sourceRevision:baselineRevision,sourcePath:targetSourcePath});
            if(adapter&&adapter.existingExecutionPath==null){
              updates.push({gameId:item.gameId,status:'BLOCKED',selectedPlatform:platform,targetPlatform:platform,currentStep:'TARGET_PLATFORM_SOURCE_BIND',canonicalState:'DEVELOPMENT_BLOCKED',platformAdapter:adapter.adapterPath,sourcePath:targetSourcePath,targetSourcePath,webPlatformHandoff,routingBlockers:['platform-runtime-executor-not-configured'],updatedAt:new Date().toISOString()});
              console.log(`DEVELOPMENT_ROUTE_EXTERNAL_BLOCKED=${item.gameId}:${platform}:platform-runtime-executor-not-configured`);
              continue;
            }
            const blockers=[...precheck.errors];
            if(blockers.length){
              updates.push({gameId:item.gameId,status:'ACTIVE',selectedPlatform:platform,targetPlatform:platform,currentStep:'TARGET_PLATFORM_SOURCE_BIND',canonicalState:canonicalTargetWaitingState(),platformAdapter:adapter?.adapterPath||null,sourcePath:targetSourcePath,targetSourcePath,webPlatformHandoff,routingBlockers:blockers,updatedAt:new Date().toISOString()});
              continue;
            }
            platforms.add(platform);
            if(retrySourceBind){
              console.log(`DEVELOPMENT_ROUTE_RESUME_SOURCE_BIND=${item.gameId}:${platform}`);
              continue;
            }
            const focus=roadmap?.assetProductionParallelContract?.firstAdoption||{};
            const focusMode=String(focus.mode||'').toUpperCase();
            if(roadmap?.assetProductionParallelContract?.enabled===true&&String(focus.gameId||'')===String(item.gameId||'')&&focusMode.includes('CONCURRENT')){
              for(const requested of Array.isArray(focus.targetPlatforms)?focus.targetPlatforms:[]){
                const concurrentPlatform=normalizeSelectedPlatform(requested);
                if(concurrentPlatform&&adapterForPlatform(concurrentPlatform)?.existingExecutionPath){
                  platforms.add(concurrentPlatform);
                  if(concurrentPlatform!==platform)console.log(`OWNER_FOCUS_CONCURRENT_PLATFORM_DISPATCH=${item.gameId}:${concurrentPlatform}`);
                }
              }
            }
            updates.push({gameId:item.gameId,status:'ACTIVE',selectedPlatform:platform,targetPlatform:platform,currentStep:canonicalTargetStep(),canonicalState:canonicalTargetWaitingState(),platformAdapter:adapter.adapterPath,sourcePath:targetSourcePath,targetSourcePath,webPlatformHandoff,routingBlockers:[],routeRevision:baselineRevision,webPromotionEvidenceFresh:true,updatedAt:new Date().toISOString()});
          }
          fs.mkdirSync('/tmp/development-route',{recursive:true});
          fs.writeFileSync('/tmp/development-route/updates.json',JSON.stringify(updates,null,2)+'\n');
          const output=process.env.GITHUB_OUTPUT;
          fs.appendFileSync(output,`routed_count=${updates.length}\n`);
          fs.appendFileSync(output,`dispatch_unity=${platforms.has('UNITY')?'true':'false'}\n`);
          fs.appendFileSync(output,`dispatch_roblox=${platforms.has('ROBLOX')?'true':'false'}\n`);
          fs.appendFileSync(output,`dispatch_uefn=${platforms.has('FORTNITE_UEFN')?'true':'false'}\n`);
          console.log(`DEVELOPMENT_ROUTE_COUNT=${updates.length}`);
          console.log(`DEVELOPMENT_ROUTE_PLATFORMS=${[...platforms].join(',')}`);
          console.log(`WEB_PROMOTION_EVIDENCE_REJECTED_COUNT=${promotionRejected}`);
          console.log('WEB_GAMEPLAY_MUSIC_GATE=ENFORCED');
          console.log(`WEB_VALIDATION_SCHEMA_MINIMUM=${WEB_VALIDATION_SCHEMA_VERSION}`);
          console.log('WEB_INDEPENDENT_PROMOTION_REVALIDATION=REQUIRED');
          console.log('FORMAL_IMPLEMENTATION_GATE=90');
          console.log('CHANGE_DETECTION=PASS');
          console.log('CHEAP_PRECHECK=PASS_OR_BLOCK_RECORDED');
          NODE

      - name: Persist canonical routed queue state
        if: steps.route.outputs.routed_count != '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-development-router'
          git config user.email 'actions@users.noreply.github.com'
          WEB_VALIDATION_SCHEMA_VERSION="$(node --input-type=module -e 'import {WEB_VALIDATION_SCHEMA_VERSION as v} from "./tools/company-web-validation-evidence-contract.mjs"; process.stdout.write(String(v));')"
          export WEB_VALIDATION_SCHEMA_VERSION
          git checkout -B development-router-persist "origin/$COMPANY_RUNTIME_BRANCH"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const WEB_VALIDATION_SCHEMA_VERSION=Number(process.env.WEB_VALIDATION_SCHEMA_VERSION||0);
          if(!Number.isInteger(WEB_VALIDATION_SCHEMA_VERSION)||WEB_VALIDATION_SCHEMA_VERSION<=0)throw new Error('WEB_VALIDATION_SCHEMA_VERSION_MISSING');
          const queue=JSON.parse(fs.readFileSync('development-queue.json','utf8'));
          const updates=JSON.parse(fs.readFileSync('/tmp/development-route/updates.json','utf8'));
          for(const update of updates){const item=(queue.items||[]).find(x=>x.gameId===update.gameId);if(!item)throw new Error(`queue item missing: ${update.gameId}`);Object.assign(item,update);}
          queue.routerContractVersion=4;
          queue.routerPolicy='COMPANY_FLOW.md';
          queue.webGateRequired=true;
          queue.homepageTestMinimum=80;
          queue.formalImplementationMinimum=90;
          queue.webValidationEvidenceSchemaMinimum=WEB_VALIDATION_SCHEMA_VERSION;
          queue.webPromotionRevalidationRequired=true;
          queue.cronRole='WATCHDOG_AND_RECOVERY_ONLY';
          queue.updatedAt=new Date().toISOString();
          fs.writeFileSync('development-queue.json',JSON.stringify(queue,null,2)+'\n');
          NODE
          git add development-queue.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'runtime: route fresh independently revalidated Web 90 passes [skip ci]'
            git push origin HEAD:"$COMPANY_RUNTIME_BRANCH"
          fi
          echo 'DEVELOPMENT_ROUTER_PERSIST=PASS'

      - name: Router summary
        if: always()
        run: |
          echo 'DEVELOPMENT_PIPELINE=ONE_CANONICAL_PIPELINE'
          echo 'WEB_GAMEPLAY_MUSIC_GATE=REQUIRED'
          echo 'WEB_VALIDATION_SCHEMA_SOURCE=tools/company-web-validation-evidence-contract.mjs'
          echo 'WEB_STALE_EVIDENCE_REJECTED=YES'
          echo 'WEB_INDEPENDENT_PROMOTION_REVALIDATION=REQUIRED'
          echo 'HOMEPAGE_TEST_GATE=80'
          echo 'FORMAL_IMPLEMENTATION_GATE=90'
          echo 'POST_WEB_ARTBOOK=YES'
          echo 'WEB_VALIDATION_TIERS=MICRO_FAST_INITIAL_FULL_FINAL'
          echo 'WEB_PARALLEL_ACTIVE_MAX=20'
          echo 'PLATFORM_ROUTER=tools/company-selected-platform-router.mjs'
          echo 'CRON_ROLE=WATCHDOG_AND_RECOVERY_ONLY'
          echo 'QUALITY_GATE_WEAKENING=NO'
          echo 'PUBLIC_MAIN_WRITE=NO'

  dispatch:
    name: immediate selected-platform handoff
    needs: route
    if: always() && needs.route.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch selected-platform executors immediately
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_UNITY: ${{ needs.route.outputs.dispatch_unity }}
          DISPATCH_ROBLOX: ${{ needs.route.outputs.dispatch_roblox }}
          DISPATCH_UEFN: ${{ needs.route.outputs.dispatch_uefn }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DISPATCH_UNITY" == 'true' ]]; then
            existing=''
            for attempt in 1 2 3; do
              existing="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/company-development-unity-runtime.yml/runs?per_page=30" | jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha==$sha and (.status=="queued" or .status=="pending" or .status=="in_progress" or .status=="waiting" or .status=="requested")) | .id] | max // empty')"
              [[ "$existing" =~ ^[0-9]+$ ]] && break
              [[ '${{ github.event_name }}' != 'push' ]] && break
              sleep 2
            done
            if [[ "$existing" =~ ^[0-9]+$ ]]; then
              echo "UNITY_EXECUTOR_DISPATCH=DEDUPED_EXISTING_RUN:$existing"
            else
              gh workflow run company-development-unity-runtime.yml --repo "$GITHUB_REPOSITORY" --ref main
              echo 'IMMEDIATE_NEXT_STAGE_DISPATCH=UNITY'
            fi
          fi
          if [[ "$DISPATCH_ROBLOX" == 'true' ]]; then
            existing=''
            for attempt in 1 2 3; do
              existing="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/company-development-roblox-runtime.yml/runs?per_page=30" | jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha==$sha and (.status=="queued" or .status=="pending" or .status=="in_progress" or .status=="waiting" or .status=="requested")) | .id] | max // empty')"
              [[ "$existing" =~ ^[0-9]+$ ]] && break
              [[ '${{ github.event_name }}' != 'push' ]] && break
              sleep 2
            done
            if [[ "$existing" =~ ^[0-9]+$ ]]; then
              echo "ROBLOX_EXECUTOR_DISPATCH=DEDUPED_EXISTING_RUN:$existing"
            else
              gh workflow run company-development-roblox-runtime.yml --repo "$GITHUB_REPOSITORY" --ref main
              echo 'IMMEDIATE_NEXT_STAGE_DISPATCH=ROBLOX_DEVELOPMENT_RUNTIME'
            fi
          fi
          if [[ "$DISPATCH_UEFN" == 'true' ]]; then
            echo 'UNEXPECTED_UEFN_DISPATCH_WITHOUT_CONFIGURED_EXECUTOR' >&2
            exit 2
          fi
          echo 'ROUTER_DISPATCH_COMPLETE=YES'
