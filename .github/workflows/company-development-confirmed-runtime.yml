# Unity reusable workflow syntax verified for automatic canonical dispatch.
name: Company DEVELOPMENT_CONFIRMED Runtime
run-name: DEVELOPMENT cycle | ${{ inputs.game_id || 'batch' }} | ${{ inputs.trigger_source || github.event_name }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/company-development-confirmed-runtime.yml'
      - 'tools/company-selected-platform-router.mjs'
      - 'tools/company-minimum-design-contract.mjs'
      - 'tools/company-upper-platform-admission.mjs'
      - 'tools/design-only-promotion-sync.mjs'
      - 'company-learning/platform-release-roadmap.json'
      - '.github/workflows/unity-web-first-stage-build.yml'
      - '.github/workflows/unity-web-floor-source-bootstrap.yml'
      - 'tools/company-unity-web-floor-bootstrap.mjs'
      - 'tools/company-unity-web-gameplay-validation.mjs'
      - 'web-games/**/upper-platform-development-readiness.json'
      - 'company-asset-library.json'
      - 'tools/company-shared-context.mjs'
  workflow_dispatch:
    inputs:
      game_id:
        description: Optional exact game id. When set, dispatch only this game's Roblox and Unity lanes.
        required: false
        type: string
      trigger_source:
        description: Optional orchestration source for diagnostics; native admission is decided only by durable readiness evidence or grandfathered native progress.
        required: false
        default: MANUAL_OR_NATIVE
        type: string

concurrency:
  # Exact-game development runs must not hold a whole-game workflow lock.
  # Only main push coordinators share a control-plane group; manual/exact-game runs are run-scoped.
  group: company-development-confirmed-${{ (github.event_name == 'push' && 'main-push') || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

env:
  COMPANY_RUNTIME_BRANCH: company-runtime

jobs:
  coordinator-gate:
    name: Admit one unscoped development coordinator
    runs-on: ubuntu-slim
    timeout-minutes: 5
    concurrency:
      # Coalesce only unscoped same-revision batch gate jobs. Exact-game gate jobs remain independent.
      # This is job-scoped: native per-game execution is never serialized by a coordinator wake.
      group: company-development-confirmed-coordinator-gate-${{ (github.event_name == 'workflow_dispatch' && !inputs.game_id && format('batch-{0}', github.sha)) || github.run_id }}
      cancel-in-progress: false
    outputs:
      proceed: ${{ steps.admit.outputs.proceed }}
    steps:
      - name: Coalesce duplicate whole-portfolio dispatches without serializing game lanes
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_GAME_ID: ${{ inputs.game_id || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_GAME_ID" || "$GITHUB_EVENT_NAME" == 'push' ]]; then
            echo 'proceed=true' >> "$GITHUB_OUTPUT"
            echo 'DEVELOPMENT_COORDINATOR_ADMISSION=EXACT_GAME_OR_SOURCE_CHANGE'
            exit 0
          fi

          pids=()
          for page in 1 2 3; do
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/company-development-confirmed-runtime.yml/runs?per_page=100&page=$page" > "/tmp/development-coordinator-runs-$page.json" &
            pids+=("$!")
          done
          scan_failed=0
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then scan_failed=1; fi
          done
          if (( scan_failed != 0 )); then
            echo 'DEVELOPMENT_COORDINATOR_ACTIVE_SCAN=FAIL' >&2
            exit 15
          fi
          jq -s '{workflow_runs:(map(.workflow_runs // [])|add)}' /tmp/development-coordinator-runs-{1,2,3}.json > /tmp/development-coordinator-runs.json
          oldest_active_id="$(jq -r --argjson current "$GITHUB_RUN_ID" --arg control_sha "$GITHUB_SHA" '
            [
              .workflow_runs[]
              | select(.status == "queued" or .status == "pending" or .status == "in_progress" or .status == "requested")
              | select(.head_sha == $control_sha)
              | select(
                  .display_title == "Company DEVELOPMENT_CONFIRMED Runtime"
                  or (.display_title | startswith("DEVELOPMENT cycle | batch | "))
                )
              | .id
            ]
            | min // $current
          ' /tmp/development-coordinator-runs.json)"
          echo "DEVELOPMENT_COORDINATOR_SCAN_INCLUDES_PUSH_AND_DISPATCH=YES"
          echo "DEVELOPMENT_COORDINATOR_EXACT_CONTROL_REVISION=$GITHUB_SHA"
          echo "DEVELOPMENT_COORDINATOR_OLDER_MAIN_RUNS_MAY_NOT_BLOCK_NEW_REVISION=YES"
          echo "DEVELOPMENT_COORDINATOR_OLDEST_ACTIVE_RUN=$oldest_active_id"
          if [[ "$oldest_active_id" != "$GITHUB_RUN_ID" ]]; then
            echo 'proceed=false' >> "$GITHUB_OUTPUT"
            echo 'DEVELOPMENT_COORDINATOR_ADMISSION=DEDUPED_ACTIVE_BATCH'
            exit 0
          fi
          echo 'proceed=true' >> "$GITHUB_OUTPUT"
          echo 'DEVELOPMENT_COORDINATOR_ADMISSION=OLDEST_ACTIVE_BATCH'

  native-plan:
    name: Resolve direct native development
    needs: coordinator-gate
    if: needs.coordinator-gate.outputs.proceed == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 8
    outputs:
      eligible_count: ${{ steps.plan.outputs.eligible_count }}
      eligible_ids: ${{ steps.plan.outputs.eligible_ids }}
      eligible_json: ${{ steps.plan.outputs.eligible_json }}
      roblox_count: ${{ steps.plan.outputs.roblox_count }}
      roblox_json: ${{ steps.plan.outputs.roblox_json }}
      unity_count: ${{ steps.plan.outputs.unity_count }}
      unity_json: ${{ steps.plan.outputs.unity_json }}
      unity_web_ids: ${{ steps.plan.outputs.unity_web_ids }}
      unity_web_json: ${{ steps.plan.outputs.unity_web_json }}
      unity_web_bootstrap_ids: ${{ steps.plan.outputs.unity_web_bootstrap_ids }}
      unity_web_bootstrap_json: ${{ steps.plan.outputs.unity_web_bootstrap_json }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Synchronize shared worker context
        run: node tools/company-shared-context.mjs --output=/tmp/company-shared-context-native.json

      - name: Validate direct-native admission contract
        run: |
          set -euo pipefail
          node --check tools/company-selected-platform-router.mjs
          node --check tools/company-minimum-design-contract.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('company-learning/platform-release-roadmap.json','utf8'));
          const d=r.directNativeDualPlatformDevelopment||{};
          if(d.status!=='OWNER_DIRECT_LOCKED'||d.mode!=='ROBLOX_UNITY_APP_BIDIRECTIONAL_AUTO_PAIR')throw new Error('UPPER_PLATFORM_OWNER_LOCK_REQUIRED');
          if(d.unityWebEnabled!==true||d.unityWebRequired!==true||d.unityWebGateRequired!==false||d.unityWebMode!=='UPPER_PLATFORM_PREDEVELOPMENT_FULL_DEVELOPMENT_QA_FLOOR')throw new Error('UNITY_WEB_DEVELOPMENT_FLOOR_CONTRACT_REQUIRED');
          const gate=d.upperPlatformDevelopmentReadinessGate||{};
          if(gate.gateId!=='UPPER_PLATFORM_DEVELOPMENT_READY'||gate.allCriteriaRequired!==true||JSON.stringify(gate.targets)!==JSON.stringify(['ROBLOX','UNITY']))throw new Error('UPPER_PLATFORM_READINESS_GATE_REQUIRED');
          const fan=d.unityWebNativeFanOut||{};
          if(fan.enabled!==false||fan.trigger!=='UPPER_PLATFORM_DEVELOPMENT_READY_ON_MAIN'||JSON.stringify(fan.targets)!==JSON.stringify(['ROBLOX','UNITY'])||fan.developmentAdmissionAuthority!==false||fan.directDispatchFromUnityWebBuildForbidden!==true||fan.sourceTreeExactMatchRequired!==true)throw new Error('UPPER_PLATFORM_MAIN_HANDOFF_CONTRACT_REQUIRED');
          if(JSON.stringify(d.supportedDevelopmentPlatforms)!==JSON.stringify(['ROBLOX','UNITY']))throw new Error('ROBLOX_UNITY_PAIR_REQUIRED');
          if(d.automaticPairing?.ROBLOX?.join(',')!=='ROBLOX,UNITY_WEB_FLOOR'||d.automaticPairing?.UNITY?.join(',')!=='UNITY_WEB_FLOOR')throw new Error('UNITY_WEB_THEN_BIDIRECTIONAL_PAIR_REQUIRED');
          if(d.development?.noArtificialGlobalGameCountCap!==true||d.development?.globalGameDevelopmentWindow!==null)throw new Error('GLOBAL_GAME_COUNT_CAP_FORBIDDEN');
          if(d.canonicalDevelopmentAdmissionAuthority!==true)throw new Error('DIRECT_NATIVE_ADMISSION_AUTHORITY_REQUIRED');
          if(d.strictDesignScoreRequiredForDevelopmentAdmission!==false)throw new Error('STRICT_DESIGN_ADMISSION_FORBIDDEN');
          console.log('UPPER_PLATFORM_MACHINE_CONTRACT=PASS');
          NODE

      - name: Fetch queue authority and active native lane identities in parallel
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$COMPANY_RUNTIME_BRANCH" &
          queue_fetch_pid=$!
          pids=()
          labels=()
          for page in 1 2 3; do
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/company-development-roblox-runtime.yml/runs?per_page=100&page=$page" > "/tmp/active-roblox-native-runs-$page.json" &
            pids+=("$!")
            labels+=("ROBLOX:$page")
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/company-development-unity-runtime.yml/runs?per_page=100&page=$page" > "/tmp/active-unity-native-runs-$page.json" &
            pids+=("$!")
            labels+=("UNITY:$page")
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/unity-web-first-stage-build.yml/runs?per_page=100&page=$page" > "/tmp/active-unity-web-floor-runs-$page.json" &
            pids+=("$!")
            labels+=("UNITY_WEB_FLOOR:$page")
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/unity-web-floor-source-bootstrap.yml/runs?per_page=100&page=$page" > "/tmp/active-unity-web-bootstrap-runs-$page.json" &
            pids+=("$!")
            labels+=("UNITY_WEB_BOOTSTRAP:$page")
          done
          queue_fetch_status=0
          wait "$queue_fetch_pid" || queue_fetch_status=$?
          if (( queue_fetch_status != 0 )); then
            echo "NATIVE_QUEUE_AUTHORITY_FETCH=FAIL:$queue_fetch_status" >&2
            exit 13
          fi
          git show "origin/$COMPANY_RUNTIME_BRANCH:development-queue.json" > /tmp/development-queue.json
          echo 'NATIVE_QUEUE_AUTHORITY_FETCH=PASS'
          scan_failed=0
          for i in "${!pids[@]}"; do
            if ! wait "${pids[$i]}"; then
              echo "NATIVE_ACTIVE_RUN_SCAN_PAGE_FAIL=${labels[$i]}" >&2
              scan_failed=1
            fi
          done
          if (( scan_failed != 0 )); then
            echo 'NATIVE_ACTIVE_RUN_SCAN=FAIL' >&2
            exit 14
          fi
          jq -s '{workflow_runs:(map(.workflow_runs // [])|add)}' /tmp/active-roblox-native-runs-{1,2,3}.json > /tmp/active-roblox-native-runs.json
          jq -s '{workflow_runs:(map(.workflow_runs // [])|add)}' /tmp/active-unity-native-runs-{1,2,3}.json > /tmp/active-unity-native-runs.json
          jq -s '{workflow_runs:(map(.workflow_runs // [])|add)}' /tmp/active-unity-web-floor-runs-{1,2,3}.json > /tmp/active-unity-web-floor-runs.json
          jq -s '{workflow_runs:(map(.workflow_runs // [])|add)}' /tmp/active-unity-web-bootstrap-runs-{1,2,3}.json > /tmp/active-unity-web-bootstrap-runs.json
          echo "NATIVE_ACTIVE_RUN_SCAN_ROBLOX_ROWS=$(jq '.workflow_runs|length' /tmp/active-roblox-native-runs.json)"
          echo "NATIVE_ACTIVE_RUN_SCAN_UNITY_ROWS=$(jq '.workflow_runs|length' /tmp/active-unity-native-runs.json)"
          echo "UNITY_WEB_ACTIVE_RUN_SCAN_FLOOR_ROWS=$(jq '.workflow_runs|length' /tmp/active-unity-web-floor-runs.json)"
          echo "UNITY_WEB_ACTIVE_RUN_SCAN_BOOTSTRAP_ROWS=$(jq '.workflow_runs|length' /tmp/active-unity-web-bootstrap-runs.json)"
          echo 'NATIVE_ACTIVE_RUN_SCAN_PAGES=3'
          echo 'UNITY_WEB_ACTIVE_RUN_SCAN_PAGES=3'
          echo 'NATIVE_ACTIVE_RUN_SCAN=PASS'

      - name: Resolve Unity Web floor and upper-platform eligibility
        id: plan
        env:
          REQUESTED_GAME_ID: ${{ inputs.game_id || '' }}
          CURRENT_CONTROL_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {platformDevelopmentEligible} from './tools/company-selected-platform-router.mjs';
          import {classifyUpperPlatformAdmission} from './tools/company-upper-platform-admission.mjs';
          const q=JSON.parse(fs.readFileSync('/tmp/development-queue.json','utf8'));
          const roadmap=JSON.parse(fs.readFileSync('company-learning/platform-release-roadmap.json','utf8'));
          const grandfatherGameIds=roadmap?.directNativeDualPlatformDevelopment?.upperPlatformAdmissionMigration?.grandfatherGameIds||[];
          const ownerExcludedGameIds=new Set(roadmap?.developmentSpeedExecution?.perGameFailureIsolation?.ownerExcludedGameIds||[]);
          const requested=String(process.env.REQUESTED_GAME_ID||'').trim();
          if(requested&&!/^[a-z0-9][a-z0-9-]{1,80}$/.test(requested))throw new Error('UPPER_PLATFORM_REQUESTED_GAME_ID_INVALID:'+requested);
          const rows=(q.items||[]).filter(item=>
            !ownerExcludedGameIds.has(item.gameId)&&
            (!requested||item.gameId===requested)&&
            String(item.productionClass||'').toUpperCase()==='DEVELOPMENT_CONFIRMED'&&
            String(item.status||'').toUpperCase()!=='DISABLED'&&
            (platformDevelopmentEligible(item,'ROBLOX')||platformDevelopmentEligible(item,'UNITY'))
          );
          const activeStates=new Set(['queued','pending','in_progress','requested']);
          const activeIds=(file,prefix,exactHead='')=>{
            let payload={workflow_runs:[]};
            try{payload=JSON.parse(fs.readFileSync(file,'utf8'));}catch{}
            const ids=new Set();
            for(const run of payload.workflow_runs||[]){
              if(!activeStates.has(String(run.status||'').toLowerCase()))continue;
              if(exactHead&&String(run.head_sha||'')!==exactHead)continue;
              const title=String(run.display_title||'');
              if(!title.startsWith(prefix))continue;
              const id=title.slice(prefix.length).trim();
              if(/^[a-z0-9][a-z0-9-]{1,80}$/.test(id)&&id!=='batch')ids.add(id);
            }
            return ids;
          };
          const currentControlSha=String(process.env.CURRENT_CONTROL_SHA||'').trim();
          if(!/^[a-f0-9]{40}$/i.test(currentControlSha))throw new Error('ROBLOX_CURRENT_CONTROL_SHA_REQUIRED');
          const activeRoblox=activeIds('/tmp/active-roblox-native-runs.json','Roblox runtime · ',currentControlSha);
          const activeUnity=activeIds('/tmp/active-unity-native-runs.json','Unity runtime · ');
          const activeUnityWebFloor=activeIds('/tmp/active-unity-web-floor-runs.json','Unity Web Floor ');
          const activeUnityWebBootstrap=activeIds('/tmp/active-unity-web-bootstrap-runs.json','Unity Web Floor Bootstrap ');
          const nativeIds=[],robloxIds=[],unityIds=[],webIds=[],bootstrapIds=[],blockedIds=[],grandfatheredIds=[];
          for(const item of rows){
            const decision=classifyUpperPlatformAdmission(item,{repoRoot:process.cwd(),grandfatherGameIds});
            if(decision.state!=='UPPER_PLATFORM'){
              blockedIds.push(item.gameId);
              console.log('GAME_MINIMUM_DESIGN_REPAIR_REQUIRED='+item.gameId+':'+decision.reason);
              continue;
            }
            nativeIds.push(item.gameId);
            if(activeRoblox.has(item.gameId))console.log('ROBLOX_NATIVE_DISPATCH_DEDUPED_CURRENT_MAIN='+item.gameId+':'+currentControlSha);
            else{
              robloxIds.push(item.gameId);
              console.log('ROBLOX_NATIVE_DISPATCH_CURRENT_MAIN_REQUIRED='+item.gameId+':'+currentControlSha);
            }
            if(decision.grandfathered===true)grandfatheredIds.push(item.gameId);
            const web=decision.web||{};
            if(web.state==='UNITY_WEB_FLOOR'){
              if(activeUnityWebFloor.has(item.gameId))console.log('UNITY_WEB_FLOOR_DISPATCH_DEDUPED_ACTIVE='+item.gameId);
              else{
                webIds.push(item.gameId);
                console.log('UNITY_WEB_FLOOR_REQUIRED='+item.gameId+':'+web.reason+':'+web.buildMethod);
              }
            }else if(web.state==='UNITY_WEB_BOOTSTRAP'){
              if(activeUnityWebBootstrap.has(item.gameId))console.log('UNITY_WEB_BOOTSTRAP_DISPATCH_DEDUPED_ACTIVE='+item.gameId);
              else{
                bootstrapIds.push(item.gameId);
                console.log('UNITY_WEB_FLOOR_BOOTSTRAP_REQUIRED='+item.gameId+':'+web.reason);
              }
            }else if(web.state==='UNITY_WEB_SOURCE_REPAIR'){
              console.log('UNITY_WEB_FLOOR_REPAIR_REQUIRED='+item.gameId+':'+web.reason);
            }else if(web.state==='UNITY_WEB_VERIFIED'){
              console.log('UNITY_WEB_VERIFIED_INDEPENDENT='+item.gameId);
            }
          }
          console.log('DEVELOPMENT_OWNER_EXCLUDED_GAME_IDS='+(Array.from(ownerExcludedGameIds).join(',')||'NONE'));
          console.log('UNITY_ANDROID_DEVELOPMENT_HOLD=OWNER_DIRECTIVE_2026_10_09');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'eligible_count='+nativeIds.length+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'eligible_ids='+nativeIds.join(',')+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'eligible_json='+JSON.stringify(nativeIds)+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'roblox_count='+robloxIds.length+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'roblox_json='+JSON.stringify(robloxIds)+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'unity_count='+unityIds.length+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'unity_json='+JSON.stringify(unityIds)+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'unity_web_ids='+webIds.join(',')+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'unity_web_json='+JSON.stringify(webIds)+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'unity_web_bootstrap_ids='+bootstrapIds.join(',')+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'unity_web_bootstrap_json='+JSON.stringify(bootstrapIds)+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'blocked_ids='+blockedIds.join(',')+'\n');
          console.log('UPPER_PLATFORM_ELIGIBLE_COUNT='+nativeIds.length);
          console.log('UPPER_PLATFORM_ELIGIBLE_IDS='+(nativeIds.join(',')||'NONE'));
          console.log('ROBLOX_NATIVE_DISPATCH_IDS='+(robloxIds.join(',')||'NONE'));
          console.log('UNITY_NATIVE_DISPATCH_IDS='+(unityIds.join(',')||'NONE'));
          console.log('UNITY_WEB_FLOOR_IDS='+(webIds.join(',')||'NONE'));
          console.log('UNITY_WEB_FLOOR_BOOTSTRAP_IDS='+(bootstrapIds.join(',')||'NONE'));
          console.log('UPPER_PLATFORM_GRANDFATHERED_IDS='+(grandfatheredIds.join(',')||'NONE'));
          console.log('UPPER_PLATFORM_BLOCKED_IDS='+(blockedIds.join(',')||'NONE'));
          console.log('DEVELOPMENT_GAME_ELIGIBILITY_CAP=NONE');
          NODE



  dispatch-roblox:
    name: Run ready Roblox upper-platform lanes
    needs: native-plan
    if: needs.native-plan.result == 'success' && needs.native-plan.outputs.roblox_count != '0'
    strategy:
      fail-fast: false
      matrix:
        game_id: ${{ fromJSON(needs.native-plan.outputs.roblox_json) }}
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: ./.github/workflows/company-development-roblox-runtime.yml
    with:
      game_id: ${{ matrix.game_id }}
    secrets: inherit

  dispatch-unity:
    name: Unity Android development (owner hold)
    needs: native-plan
    if: needs.native-plan.result == 'success' && needs.native-plan.outputs.unity_count != '0'
    strategy:
      fail-fast: false
      matrix:
        game_id: ${{ fromJSON(needs.native-plan.outputs.unity_json) }}
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/company-development-unity-runtime.yml
    with:
      game_id: ${{ matrix.game_id }}
    secrets: inherit

  dispatch-unity-web-floor:
    name: Run Unity Web development floor
    needs: native-plan
    if: needs.native-plan.result == 'success' && needs.native-plan.outputs.unity_web_ids != ''
    strategy:
      fail-fast: false
      matrix:
        game_id: ${{ fromJSON(needs.native-plan.outputs.unity_web_json) }}
    concurrency:
      group: unity-web-floor-call-${{ matrix.game_id }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: ./.github/workflows/unity-web-first-stage-build.yml
    with:
      game_id: ${{ matrix.game_id }}
      project_path: unity-games/${{ matrix.game_id }}
      source_commit: ${{ github.sha }}
      publish_to_main: true
    secrets: inherit

  dispatch-unity-web-bootstrap:
    name: Bootstrap Unity Web source ${{ matrix.game_id }}
    needs: native-plan
    if: needs.native-plan.result == 'success' && needs.native-plan.outputs.unity_web_bootstrap_ids != ''
    strategy:
      fail-fast: false
      matrix:
        game_id: ${{ fromJSON(needs.native-plan.outputs.unity_web_bootstrap_json) }}
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/unity-web-floor-source-bootstrap.yml
    with:
      game_id: ${{ matrix.game_id }}
    secrets: inherit

  continue-cycle:
    name: Continue DEVELOPMENT_CONFIRMED cycle after isolated game outcomes
    needs: [native-plan, dispatch-roblox, dispatch-unity, dispatch-unity-web-floor, dispatch-unity-web-bootstrap]
    if: ${{ always() && needs.native-plan.result == 'success' && (needs.native-plan.outputs.roblox_count != '0' || needs.native-plan.outputs.unity_count != '0' || needs.native-plan.outputs.unity_web_ids != '' || needs.native-plan.outputs.unity_web_bootstrap_ids != '') }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Re-open the next development wave regardless of individual game failure
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run company-development-confirmed-runtime.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f trigger_source=CONTINUOUS_PER_GAME_ISOLATED_CYCLE
          echo 'DEVELOPMENT_CONTINUOUS_CYCLE_REOPENED=YES'
          echo 'SINGLE_GAME_FAILURE_BLOCKS_GLOBAL_CYCLE=NO'
