name: Company DEVELOPMENT_CONFIRMED Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/company-development-confirmed-runtime.yml'
      - '.github/workflows/company-development-roblox-runtime-continuation.yml'
      - '.github/workflows/company-development-roblox-headless-fast-mvp.yml'
      - 'tools/company-development-roblox-build-preflight.mjs'
      - 'tools/company-development-roblox-runtime-smoke.luau'
      - 'qa/company-development-roblox-runtime-continuation.test.mjs'
      - '.github/workflows/company-development-roblox-runtime.yml'
      - '.github/workflows/company-development-unity-runtime.yml'
      - 'tools/company-selected-platform-router.mjs'
      - 'tools/company-minimum-design-contract.mjs'
      - 'tools/company-upper-platform-admission.mjs'
      - 'qa/company-upper-platform-admission.test.mjs'
      - 'tools/design-only-promotion-sync.mjs'
      - 'company-learning/platform-release-roadmap.json'
      - 'company-learning/company-architecture-map.json'
      - 'qa/company-selected-platform-router.test.mjs'
      - 'qa/company-minimum-design-contract.test.mjs'
      - '.github/workflows/unity-web-first-stage-build.yml'
      - '.github/workflows/unity-web-floor-source-bootstrap.yml'
      - 'tools/company-unity-web-floor-bootstrap.mjs'
      - 'tools/company-unity-web-gameplay-validation.mjs'
      - 'unity-games/**'
      - 'web-games/**/upper-platform-development-readiness.json'
  workflow_dispatch:
    inputs:
      game_id:
        description: Optional exact game id. When set, dispatch only this game's Roblox and Unity lanes.
        required: false
        type: string
      trigger_source:
        description: Optional orchestration source for diagnostics; native admission is decided only by durable readiness evidence or grandfathered native progress.
        required: false
        default: MANUAL_OR_NATIVE
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: company-development-confirmed-runtime
  cancel-in-progress: false

env:
  COMPANY_RUNTIME_BRANCH: company-runtime

jobs:
  native-plan:
    name: Resolve direct native development
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      eligible_count: ${{ steps.plan.outputs.eligible_count }}
      eligible_ids: ${{ steps.plan.outputs.eligible_ids }}
      unity_web_ids: ${{ steps.plan.outputs.unity_web_ids }}
      unity_web_bootstrap_ids: ${{ steps.plan.outputs.unity_web_bootstrap_ids }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Synchronize shared worker context
        run: node tools/company-shared-context.mjs --output=/tmp/company-shared-context-native.json

      - name: Validate direct-native machine contracts
        run: |
          set -euo pipefail
          node --check tools/company-selected-platform-router.mjs
          node --check tools/company-minimum-design-contract.mjs
          node --test qa/company-selected-platform-router.test.mjs
          node --test qa/company-minimum-design-contract.test.mjs
          node --test qa/company-upper-platform-admission.test.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('company-learning/platform-release-roadmap.json','utf8'));
          const d=r.directNativeDualPlatformDevelopment||{};
          if(d.status!=='OWNER_DIRECT_LOCKED'||d.mode!=='ROBLOX_UNITY_APP_BIDIRECTIONAL_AUTO_PAIR')throw new Error('UPPER_PLATFORM_OWNER_LOCK_REQUIRED');
          if(d.unityWebEnabled!==true||d.unityWebRequired!==true||d.unityWebGateRequired!==true||d.unityWebMode!=='UPPER_PLATFORM_PREDEVELOPMENT_FULL_DEVELOPMENT_QA_FLOOR')throw new Error('UNITY_WEB_DEVELOPMENT_FLOOR_CONTRACT_REQUIRED');
          const gate=d.upperPlatformDevelopmentReadinessGate||{};
          if(gate.gateId!=='UPPER_PLATFORM_DEVELOPMENT_READY'||gate.allCriteriaRequired!==true||JSON.stringify(gate.targets)!==JSON.stringify(['ROBLOX','UNITY']))throw new Error('UPPER_PLATFORM_READINESS_GATE_REQUIRED');
          const fan=d.unityWebNativeFanOut||{};
          if(fan.enabled!==true||fan.trigger!=='UPPER_PLATFORM_DEVELOPMENT_READY_ON_MAIN'||JSON.stringify(fan.targets)!==JSON.stringify(['ROBLOX','UNITY'])||fan.developmentAdmissionAuthority!==true||fan.directDispatchFromUnityWebBuildForbidden!==true||fan.sourceTreeExactMatchRequired!==true)throw new Error('UPPER_PLATFORM_MAIN_HANDOFF_CONTRACT_REQUIRED');
          if(JSON.stringify(d.supportedDevelopmentPlatforms)!==JSON.stringify(['ROBLOX','UNITY']))throw new Error('ROBLOX_UNITY_PAIR_REQUIRED');
          if(d.automaticPairing?.ROBLOX?.join(',')!=='UNITY_WEB_FLOOR,ROBLOX,UNITY'||d.automaticPairing?.UNITY?.join(',')!=='UNITY_WEB_FLOOR,UNITY,ROBLOX')throw new Error('UNITY_WEB_THEN_BIDIRECTIONAL_PAIR_REQUIRED');
          if(d.development?.noArtificialGlobalGameCountCap!==true||d.development?.globalGameDevelopmentWindow!==null)throw new Error('GLOBAL_GAME_COUNT_CAP_FORBIDDEN');
          if(d.canonicalDevelopmentAdmissionAuthority!==true)throw new Error('DIRECT_NATIVE_ADMISSION_AUTHORITY_REQUIRED');
          if(d.strictDesignScoreRequiredForDevelopmentAdmission!==false)throw new Error('STRICT_DESIGN_ADMISSION_FORBIDDEN');
          console.log('UPPER_PLATFORM_MACHINE_CONTRACT=PASS');
          NODE

      - name: Fetch queue authority
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$COMPANY_RUNTIME_BRANCH"
          git show "origin/$COMPANY_RUNTIME_BRANCH:development-queue.json" > /tmp/development-queue.json

      - name: Resolve Unity Web floor and upper-platform eligibility
        id: plan
        env:
          REQUESTED_GAME_ID: ${{ inputs.game_id || '' }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {platformDevelopmentEligible} from './tools/company-selected-platform-router.mjs';
          import {classifyUpperPlatformAdmission} from './tools/company-upper-platform-admission.mjs';
          const q=JSON.parse(fs.readFileSync('/tmp/development-queue.json','utf8'));
          const roadmap=JSON.parse(fs.readFileSync('company-learning/platform-release-roadmap.json','utf8'));
          const grandfatherGameIds=roadmap?.directNativeDualPlatformDevelopment?.upperPlatformAdmissionMigration?.grandfatherGameIds||[];
          const requested=String(process.env.REQUESTED_GAME_ID||'').trim();
          if(requested&&!/^[a-z0-9][a-z0-9-]{1,80}$/.test(requested))throw new Error('UPPER_PLATFORM_REQUESTED_GAME_ID_INVALID:'+requested);
          const rows=(q.items||[]).filter(item=>
            (!requested||item.gameId===requested)&&
            String(item.productionClass||'').toUpperCase()==='DEVELOPMENT_CONFIRMED'&&
            String(item.status||'').toUpperCase()!=='DISABLED'&&
            (platformDevelopmentEligible(item,'ROBLOX')||platformDevelopmentEligible(item,'UNITY'))
          );
          const nativeIds=[],webIds=[],bootstrapIds=[],blockedIds=[],grandfatheredIds=[];
          for(const item of rows){
            const decision=classifyUpperPlatformAdmission(item,{repoRoot:process.cwd(),grandfatherGameIds});
            if(decision.state==='UPPER_PLATFORM'){
              nativeIds.push(item.gameId);
              if(decision.grandfathered===true)grandfatheredIds.push(item.gameId);
              continue;
            }
            if(decision.state==='UNITY_WEB_FLOOR'){
              webIds.push(item.gameId);
              console.log('UNITY_WEB_FLOOR_REQUIRED='+item.gameId+':'+decision.reason+':'+decision.buildMethod);
              continue;
            }
            if(decision.state==='UNITY_WEB_BOOTSTRAP'){
              bootstrapIds.push(item.gameId);
              console.log('UNITY_WEB_FLOOR_BOOTSTRAP_REQUIRED='+item.gameId+':'+decision.reason);
              continue;
            }
            blockedIds.push(item.gameId);
            console.log('UNITY_WEB_FLOOR_REPAIR_REQUIRED='+item.gameId+':'+decision.reason);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'eligible_count='+nativeIds.length+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'eligible_ids='+nativeIds.join(',')+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'unity_web_ids='+webIds.join(',')+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'unity_web_bootstrap_ids='+bootstrapIds.join(',')+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'blocked_ids='+blockedIds.join(',')+'\n');
          console.log('UPPER_PLATFORM_ELIGIBLE_COUNT='+nativeIds.length);
          console.log('UPPER_PLATFORM_ELIGIBLE_IDS='+(nativeIds.join(',')||'NONE'));
          console.log('UNITY_WEB_FLOOR_IDS='+(webIds.join(',')||'NONE'));
          console.log('UNITY_WEB_FLOOR_BOOTSTRAP_IDS='+(bootstrapIds.join(',')||'NONE'));
          console.log('UPPER_PLATFORM_GRANDFATHERED_IDS='+(grandfatheredIds.join(',')||'NONE'));
          console.log('UPPER_PLATFORM_BLOCKED_IDS='+(blockedIds.join(',')||'NONE'));
          console.log('DEVELOPMENT_GAME_ELIGIBILITY_CAP=NONE');
          NODE


  dispatch-native:
    name: Dispatch ready Roblox and Unity app lanes
    needs: native-plan
    if: needs.native-plan.outputs.eligible_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Dispatch upper-platform runtimes
        env:
          GH_TOKEN: ${{ github.token }}
          ELIGIBLE_IDS: ${{ needs.native-plan.outputs.eligible_ids }}
        shell: bash
        run: |
          set -euo pipefail
          retry_workflow_dispatch() {
            local workflow="$1"
            shift
            local attempt=1
            local max_attempts=8
            local delay_seconds=15
            while true; do
              set +e
              output="$(gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main "$@" 2>&1)"
              status=$?
              set -e
              if [ "$status" -eq 0 ]; then
                [ -z "$output" ] || echo "$output"
                return 0
              fi
              echo "$output" >&2
              if [[ "$output" != *"API rate limit exceeded"* && "$output" != *"secondary rate limit"* && "$output" != *"Secondary rate limit"* ]]; then
                return "$status"
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "GITHUB_ACTIONS_DISPATCH_RATE_LIMIT_EXHAUSTED=$workflow" >&2
                return "$status"
              fi
              echo "GITHUB_ACTIONS_DISPATCH_RATE_LIMIT_RETRY=$workflow:$attempt/$max_attempts"
              sleep "$delay_seconds"
              attempt=$((attempt+1))
            done
          }
          IFS=',' read -ra ids <<< "$ELIGIBLE_IDS"
          count=0
          for id in "${ids[@]}"; do
            [ -n "$id" ] || continue
            retry_workflow_dispatch company-development-roblox-runtime.yml -f game_id="$id"
            sleep 2
            retry_workflow_dispatch company-development-unity-runtime.yml -f game_id="$id"
            sleep 2
            count=$((count+1))
          done
          echo "UPPER_PLATFORM_DISPATCH_COUNT=$count"
          echo "UPPER_PLATFORM_IDS=$ELIGIBLE_IDS"
          echo 'ROBLOX_RUNTIME_DISPATCH=YES'
          echo 'UNITY_APP_RUNTIME_DISPATCH=YES'
          echo 'UPPER_PLATFORM_READINESS_GATE=PASS_OR_GRANDFATHERED'
          echo 'INTERNAL_RELEASE_FIRST=YES'

  dispatch-unity-web-floor:
    name: Dispatch Unity Web development floor
    needs: native-plan
    if: needs.native-plan.outputs.unity_web_ids != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Dispatch WebGL development-floor builds
        env:
          GH_TOKEN: ${{ github.token }}
          UNITY_WEB_IDS: ${{ needs.native-plan.outputs.unity_web_ids }}
        shell: bash
        run: |
          set -euo pipefail
          retry_workflow_dispatch() {
            local workflow="$1"
            shift
            local attempt=1
            local max_attempts=8
            local delay_seconds=15
            while true; do
              set +e
              output="$(gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main "$@" 2>&1)"
              status=$?
              set -e
              if [ "$status" -eq 0 ]; then
                [ -z "$output" ] || echo "$output"
                return 0
              fi
              echo "$output" >&2
              if [[ "$output" != *"API rate limit exceeded"* && "$output" != *"secondary rate limit"* && "$output" != *"Secondary rate limit"* ]]; then
                return "$status"
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "GITHUB_ACTIONS_DISPATCH_RATE_LIMIT_EXHAUSTED=$workflow" >&2
                return "$status"
              fi
              echo "GITHUB_ACTIONS_DISPATCH_RATE_LIMIT_RETRY=$workflow:$attempt/$max_attempts"
              sleep "$delay_seconds"
              attempt=$((attempt+1))
            done
          }
          IFS=',' read -ra ids <<< "$UNITY_WEB_IDS"
          count=0
          for id in "${ids[@]}"; do
            [ -n "$id" ] || continue
            retry_workflow_dispatch unity-web-first-stage-build.yml \
              -f game_id="$id" \
              -f project_path="unity-games/$id" \
              -f source_commit="$GITHUB_SHA" \
              -f publish_to_main=true
            sleep 2
            count=$((count+1))
          done
          echo "UNITY_WEB_FLOOR_DISPATCH_COUNT=$count"
          echo "UNITY_WEB_FLOOR_IDS=$UNITY_WEB_IDS"
          echo 'UNITY_WEB_FLOOR_ROLE=UPPER_PLATFORM_PREDEVELOPMENT'



  dispatch-unity-web-bootstrap:
    name: Bootstrap Unity Web development-floor sources
    needs: native-plan
    if: needs.native-plan.outputs.unity_web_bootstrap_ids != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Dispatch canonical Unity Web floor source bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
          UNITY_WEB_BOOTSTRAP_IDS: ${{ needs.native-plan.outputs.unity_web_bootstrap_ids }}
        shell: bash
        run: |
          set -euo pipefail
          retry_workflow_dispatch() {
            local workflow="$1"
            shift
            local attempt=1
            local max_attempts=8
            local delay_seconds=15
            while true; do
              set +e
              output="$(gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main "$@" 2>&1)"
              status=$?
              set -e
              if [ "$status" -eq 0 ]; then
                [ -z "$output" ] || echo "$output"
                return 0
              fi
              echo "$output" >&2
              if [[ "$output" != *"API rate limit exceeded"* && "$output" != *"secondary rate limit"* && "$output" != *"Secondary rate limit"* ]]; then
                return "$status"
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "GITHUB_ACTIONS_DISPATCH_RATE_LIMIT_EXHAUSTED=$workflow" >&2
                return "$status"
              fi
              echo "GITHUB_ACTIONS_DISPATCH_RATE_LIMIT_RETRY=$workflow:$attempt/$max_attempts"
              sleep "$delay_seconds"
              attempt=$((attempt+1))
            done
          }
          retry_workflow_dispatch unity-web-floor-source-bootstrap.yml \
            -f game_ids="$UNITY_WEB_BOOTSTRAP_IDS"
          echo "UNITY_WEB_FLOOR_BOOTSTRAP_IDS=$UNITY_WEB_BOOTSTRAP_IDS"
          echo 'UNITY_WEB_FLOOR_BOOTSTRAP_DISPATCH=YES'
