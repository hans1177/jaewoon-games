            if(r.success){item.postWebArtbookGeneratedAt=stamp;item.artbookFailure=null;}else item.artbookFailure=r.error||'ARTBOOK_GENERATION_DEFERRED';
            if(game){game.homepageOfficialCard=false;game.homepageTestCandidate=r.success;game.homepageTestScore=r.score;game.homepageReviewState=r.success?'TEST':'WAITING_POST_WEB_ARTBOOK';game.homepageWebPlayable=true;game.webPath=`/${String(item.webSourcePath||`web-games/${r.gameId}`).replace(/^\/+|\/+$/g,'')}/`;if(r.success)game.homepageArtbookPath=`/artbook-viewer.html?game=${encodeURIComponent(r.gameId)}`;game.homepageStage=Number(item.webStrictScore??item.strictImplementationScore)>=90?'Web 90+ PASS · 플랫폼 개발 진행':'Web 80+ 테스트 · 90점 개선 대기';game.homepageRecentWork=`Web 강심사 ${r.score}점 · ${r.success?'아트북 완료':'아트북 대기'}`;}
            item.updatedAt=stamp;
