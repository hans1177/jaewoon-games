name: Company DEVELOPMENT_CONFIRMED Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/company-development-confirmed-runtime.yml'
      - '.github/workflows/company-development-roblox-runtime.yml'
      - '.github/workflows/company-development-roblox-runtime-continuation.yml'
      - '.github/workflows/company-development-unity-runtime.yml'
      - '.github/workflows/unity-android-regression.yml'
      - '.github/actions/prepare-ollama/action.yml'
      - 'roblox-games/**'
      - 'tools/company-selected-platform-router.mjs'
      - 'tools/company-development-web-bootstrap.mjs'
      - 'tools/company-development-web-gameplay-validation.mjs'
      - 'tools/company-web-validation-evidence-contract.mjs'
      - 'tools/company-design-artbook.mjs'
      - 'tools/company-development-roblox-bootstrap.mjs'
      - 'tools/company-development-roblox-build-preflight.mjs'
      - 'tools/company-development-roblox-runtime-smoke.luau'
      - 'tools/company-development-unity-platform.mjs'
      - 'tools/company-development-unity-bootstrap.mjs'
      - 'tools/company-development-unity-evidence.mjs'
      - 'tools/company-development-validation-cycle.mjs'
      - 'tools/design-only-promotion-sync.mjs'
      - 'qa/company-selected-platform-router.test.mjs'
      - 'qa/company-development-web-runtime.test.mjs'
      - 'qa/company-web-validation-evidence-contract.test.mjs'
      - 'qa/company-development-validation-selected-platform.test.mjs'
      - 'qa/company-development-roblox-runtime.test.mjs'
      - 'qa/company-development-roblox-runtime-continuation.test.mjs'
      - 'qa/company-development-unity-runtime.test.mjs'
      - 'qa/design-only-promotion-sync.test.mjs'
      - 'qa/company-speed-sequence-workflow.test.mjs'
      - 'COMPANY_FLOW.md'
      - 'company-directive.json'
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: company-development-confirmed-runtime
  cancel-in-progress: true

env:
  COMPANY_RUNTIME_BRANCH: company-runtime

jobs:
  web-plan:
    name: resolve required Web initial gameplay work
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      target_count: ${{ steps.targets.outputs.target_count }}
      matrix: ${{ steps.targets.outputs.matrix }}
      targets_json: ${{ steps.targets.outputs.targets_json }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Web and promotion contracts
        run: |
          node --check tools/company-development-web-bootstrap.mjs
          node --check tools/company-development-web-gameplay-validation.mjs
          node --check tools/company-web-validation-evidence-contract.mjs
          node --check tools/company-development-validation-cycle.mjs
          node --check tools/company-design-artbook.mjs
          node --check tools/design-only-promotion-sync.mjs
          node --test qa/company-development-web-runtime.test.mjs qa/company-web-validation-evidence-contract.test.mjs qa/company-development-validation-selected-platform.test.mjs qa/design-only-promotion-sync.test.mjs

      - name: Fetch current company runtime
        run: git fetch --no-tags --depth=1 origin "$COMPANY_RUNTIME_BRANCH"

      - name: Resolve every DEVELOPMENT_CONFIRMED game missing fresh schema12 initial real-game evidence
        id: targets
        shell: bash
        run: |
          set -euo pipefail
          git show "origin/$COMPANY_RUNTIME_BRANCH:development-queue.json" > /tmp/development-queue.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {evaluateWebValidationEvidence,sha256Text,WEB_HOMEPAGE_MINIMUM,WEB_VALIDATION_SCHEMA_VERSION} from './tools/company-web-validation-evidence-contract.mjs';
          const q=JSON.parse(fs.readFileSync('/tmp/development-queue.json','utf8'));
          const runtimeRef=`origin/${process.env.COMPANY_RUNTIME_BRANCH}`;
          const showText=file=>execFileSync('git',['show',`${runtimeRef}:${file}`],{encoding:'utf8',maxBuffer:32*1024*1024});
          const showJson=file=>JSON.parse(showText(file));
          const freshInitialWeb80=item=>{
            if(!item.webValidationPassedAt||item.musicValidationPassed!==true)return false;
            const evidencePath=String(item.webValidationEvidencePath||'').trim();
            const webSourcePath=String(item.webSourcePath||item.optionalWebSourcePath||`web-games/${item.gameId}`).replace(/^\/+|\/+$/g,'');
            const baselinePath=String(item.designBaselineSource||'').trim();
            if(!evidencePath||!webSourcePath||!baselinePath)return false;
            try{
              const evidence=showJson(evidencePath);
              const currentSourceSha256=sha256Text(showText(`${webSourcePath}/index.html`));
              const currentBaselineSha256=sha256Text(showText(baselinePath));
              return evaluateWebValidationEvidence(evidence,{minimumScore:WEB_HOMEPAGE_MINIMUM,requireFinalContentDepth:false,currentSourceSha256,currentBaselineSha256}).pass;
            }catch{return false;}
          };
          const rows=(q.items||[]).filter(item=>{
            if(String(item.productionClass||'').toUpperCase()!=='DEVELOPMENT_CONFIRMED')return false;
            const state=String(item.canonicalState||'').toUpperCase();
            if(state==='DEVELOPMENT_BLOCKED')return false;
            return !freshInitialWeb80(item);
          }).map(item=>({
            gameId:item.gameId,
            gameName:item.gameName||item.gameId,
            designBaselineSource:item.designBaselineSource,
            designDate:item.designDate||'',
            selectedPlatform:item.selectedPlatform||item.targetPlatform||'ROBLOX',
            targetSourcePath:item.targetSourcePath||item.sourcePath||'',
            webSourcePath:item.webSourcePath||item.optionalWebSourcePath||`web-games/${item.gameId}`,
          }));
          const matrix={include:rows};
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`target_count=${rows.length}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`matrix=${JSON.stringify(matrix)}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`targets_json=${JSON.stringify(rows)}\n`);
          console.log(`WEB_REQUIRED_QUEUE_COUNT=${rows.length}`);
          console.log(`WEB_REQUIRED_GAME_IDS=${rows.map(x=>x.gameId).join(',')}`);
          console.log('WEB_INITIAL_STRICT_THRESHOLD=80');
          console.log(`WEB_VALIDATION_SCHEMA_MINIMUM=${WEB_VALIDATION_SCHEMA_VERSION}`);
          console.log('WEB_INITIAL_IMPLEMENTATION_UNIT=ONE_COMPLETE_PLAYABLE_GAMEPLAY_CYCLE');
          console.log('WEB_INITIAL_30MIN_HARD_GATE=NO');
          console.log('WEB_STALE_SOURCE_OR_BASELINE_REQUEUED=YES');
          console.log('WEB_FORMAL_IMPLEMENTATION_THRESHOLD=90');
          console.log('WEB_PARALLEL_TARGET=2');
          console.log('WEB_PARALLEL_MAX=2');
          NODE

  web-worker:
    name: Web initial gate ${{ matrix.gameId }}
    needs: web-plan
    if: needs.web-plan.outputs.target_count != '0'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.web-plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch current company runtime
        run: git fetch --no-tags --depth=1 origin "$COMPANY_RUNTIME_BRANCH"

      - name: Confirm canonical Web Production path
        run: |
          set -euo pipefail
          grep -q "SOURCE_PRESERVED=" tools/company-development-web-bootstrap.mjs
          grep -q "VIBE2_PRIMARY_DEVELOPER=YES" tools/company-development-web-bootstrap.mjs
          grep -q "INITIAL_30MIN_HARD_GATE=NO" tools/company-development-web-bootstrap.mjs
          grep -q "PRE_WEB_ARTBOOK_REQUIRED=NO" tools/company-development-web-bootstrap.mjs
          echo 'WEB_EXISTING_REAL_GAME_PRESERVE_FIRST=YES'
          echo 'WEB_VIBE2_PRODUCTION_WHEN_REAL_SOURCE_MISSING=YES'
          echo 'WEB_INITIAL_30MIN_HARD_GATE=NO'
          echo 'PRE_WEB_ARTBOOK_REQUIRED=NO'
          echo 'WEB_PAID_API=NO'
          echo 'WEB_PAID_RUNNER=NO'

      - name: Install isolated browser runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Preserve or rebuild and validate one required Web companion
        env:
          GAME_ID: ${{ matrix.gameId }}
          GAME_NAME: ${{ matrix.gameName }}
          DESIGN_BASELINE_SOURCE: ${{ matrix.designBaselineSource }}
          DESIGN_DATE: ${{ matrix.designDate }}
          TARGET_SOURCE_PATH: ${{ matrix.targetSourcePath }}
          WEB_SOURCE_PATH: ${{ matrix.webSourcePath }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          const item={
            gameId:process.env.GAME_ID,
            gameName:process.env.GAME_NAME,
            designBaselineSource:process.env.DESIGN_BASELINE_SOURCE,
            designDate:process.env.DESIGN_DATE,
            targetSourcePath:process.env.TARGET_SOURCE_PATH,
            webSourcePath:process.env.WEB_SOURCE_PATH,
          };
          const safe=String(item.gameId).replace(/[^a-zA-Z0-9._-]+/g,'-');
          const root='/tmp/web-worker';
          const persistRoot=path.join(root,'persist');
          const resultsRoot=path.join(root,'results');
          fs.rmSync(root,{recursive:true,force:true});
          fs.mkdirSync(persistRoot,{recursive:true});
          fs.mkdirSync(resultsRoot,{recursive:true});
          const show=file=>execFileSync('git',['show',`origin/${process.env.COMPANY_RUNTIME_BRANCH}:${file}`],{maxBuffer:32*1024*1024});
          const materialize=file=>{const out=path.resolve(file);fs.mkdirSync(path.dirname(out),{recursive:true});fs.writeFileSync(out,show(file));};
          const stamp=new Date().toISOString();
          let result;
          const workDir=path.join('/tmp/web-work',safe);
          const bootstrapEvidence=path.join(workDir,'web-bootstrap-evidence.json');
          const gameplayEvidence=path.join(workDir,'web-gameplay-validation.json');
          try{
            if(!item.designBaselineSource)throw new Error('DESIGN_BASELINE_SOURCE_MISSING');
            materialize(item.designBaselineSource);
            const statusSource=item.designBaselineSource.replace(/design-revised\.json$/,'cycle-status.json');
            try{materialize(statusSource);}catch{}
            try{materialize(`${String(item.webSourcePath).replace(/^\/+|\/+$/g,'')}/index.html`);}catch{}
            const candidateId=`development-web-${item.gameId}-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`;
            const candidatePath=`web-games/.autonomous-candidates/${candidateId}`;
            const screenshot=path.join(workDir,'web-gameplay.png');
            fs.mkdirSync(workDir,{recursive:true});
            execFileSync(process.execPath,['tools/company-development-web-bootstrap.mjs',
              `--game-id=${item.gameId}`,`--game-name=${item.gameName}`,
              `--baseline=${item.designBaselineSource}`,
              `--source-path=${item.webSourcePath}`,`--candidate-id=${candidateId}`,
              `--candidate-path=${candidatePath}`,`--source-commit=${process.env.GITHUB_SHA}`,
              `--evidence=${bootstrapEvidence}`],{stdio:'inherit',timeout:9*60*1000});
            execFileSync(process.execPath,['tools/company-development-web-gameplay-validation.mjs',
              `--game-id=${item.gameId}`,`--source=${candidatePath}`,`--port=4181`,
              `--output=${gameplayEvidence}`,`--screenshot=${screenshot}`],{stdio:'inherit',timeout:8*60*1000});
            const report=JSON.parse(fs.readFileSync(gameplayEvidence,'utf8'));
            const strictScore=Number(report.webStrictScore??report.strictReview?.totalScore);
            const hardFailures=Array.isArray(report.strictReview?.hardFailures)?report.strictReview.hardFailures:[];
            if(report.pass!==true||report.validated!==true||report.musicRuntime?.pass!==true||report.initialRealGamePassed!==true||!Number.isFinite(strictScore)||strictScore<80||hardFailures.length)throw new Error('WEB_INITIAL_REAL_GAME_OR_80_POINT_GATE_NOT_PASS');
            const finalDepthPass=report.finalContentDepthPassed===true&&report.contentDepthValidation?.pass===true;
            const top30Eligible=finalDepthPass&&report.top30Eligible===true;
            const formalPass=top30Eligible&&report.formalImplementationPassed===true&&report.promotionRevalidation?.pass===true&&strictScore>=90&&hardFailures.length===0;
            const stableSource=`web-games/${item.gameId}`;
            report.candidateSourcePath=candidatePath;
            report.sourcePath=stableSource;
            report.policyDocument='COMPANY_FLOW.md';
            report.requiredBeforeTargetPlatform=true;
            fs.writeFileSync(gameplayEvidence,JSON.stringify(report,null,2)+'\n');
            const webOut=path.join(persistRoot,stableSource);
            fs.mkdirSync(webOut,{recursive:true});
            fs.copyFileSync(path.join(candidatePath,'index.html'),path.join(webOut,'index.html'));
            const evidenceRelative=item.designBaselineSource.replace(/[^/]+$/,'web-gameplay-validation.json');
            const evidenceOut=path.join(persistRoot,evidenceRelative);
            fs.mkdirSync(path.dirname(evidenceOut),{recursive:true});
            fs.copyFileSync(gameplayEvidence,evidenceOut);
            const strictRelative=item.designBaselineSource.replace(/[^/]+$/,'strict-implementation-review.json');
            const strictLocal=path.join(workDir,'strict-implementation-review.json');
            if(fs.existsSync(strictLocal)){
              const strictOut=path.join(persistRoot,strictRelative);
              fs.mkdirSync(path.dirname(strictOut),{recursive:true});
              fs.copyFileSync(strictLocal,strictOut);
            }
            const currentStep=formalPass?'TARGET_PLATFORM_SOURCE_BIND':top30Eligible?'WEB_STRICT_IMPROVEMENT':'WEB_CONTENT_DEPTH_EXPANSION';
            const canonicalState=formalPass?'PENDING_SELECTED_PLATFORM_BIND':top30Eligible?'WAITING_WEB_STRICT_IMPROVEMENT':'WAITING_WEB_FINAL_CONTENT_DEPTH';
            const routingBlockers=formalPass?[]:top30Eligible?[strictScore>=90?'web-90-independent-promotion-revalidation-required':'web-strict-score-below-formal-90']:['web-final-content-depth-required'];
            result={gameId:item.gameId,pass:true,update:{
              status:formalPass?'PENDING':'ACTIVE',currentStep,canonicalState,
              sourcePath:formalPass?item.targetSourcePath:stableSource,
              webSourcePath:stableSource,webValidationRequired:true,musicValidationRequired:true,
              webValidationPassedAt:stamp,musicValidationPassed:true,webValidationEvidencePath:evidenceRelative,
              strictImplementationReviewPath:strictRelative,strictImplementationScore:strictScore,webStrictScore:strictScore,
              strictImplementationVerdict:String(report.strictReview?.verdict||''),strictImplementationHardFailures:hardFailures,
              webValidationSchemaVersion:Number(report.validationSchemaVersion||report.version||0)||null,
              webSourceIndexSha256:report.sourceIndexSha256||null,webDesignBaselineSha256:report.designBaselineSha256||null,
              initialRealGamePassed:true,initialPlayableCyclePassed:report.initialPlayableCyclePassed===true,
              finalContentDepthPassed:finalDepthPass,top30Eligible,
              webPromotionRevalidationPassed:report.promotionRevalidation?.pass===true,
              homepageTestEligible:top30Eligible,homepageTestCandidate:false,homepageTestScore:strictScore,homepageTestVerdict:top30Eligible?'WAITING_ARTBOOK':'WAITING_FINAL_CONTENT_DEPTH',
              formalImplementationPassed:formalPass,formalImplementationVerdict:formalPass?'PASS':'REVISE',
              postPromotionArtbookRequired:false,postWebArtbookRequired:top30Eligible,artbookTiming:top30Eligible?'AFTER_WEB_STRICT_REVIEW_AT_80_OR_HIGHER':'AFTER_FINAL_CONTENT_DEPTH_PASS',
              webValidationSourceRevision:process.env.GITHUB_SHA,
              productionReturnRequired:false,routingBlockers,updatedAt:stamp,
            }};
            console.log(`WEB_INITIAL_REAL_GAME_PASS=${item.gameId}:${strictScore}`);
            console.log(`WEB_VALIDATION_SCHEMA=${report.validationSchemaVersion||report.version||0}`);
            console.log(`FINAL_CONTENT_DEPTH_PASS=${finalDepthPass?'YES':'NO'}`);
            console.log(`TOP30_ELIGIBLE=${top30Eligible?'YES':'NO'}`);
            console.log(`WEB_PROMOTION_REVALIDATION=${report.promotionRevalidation?.pass===true?'PASS':'NO'}`);
            console.log(`FORMAL_IMPLEMENTATION_PASS=${formalPass?'YES':'NO'}`);
          }catch(error){
            const signature=String(error?.message||error).replace(/\s+/g,' ').slice(0,240);
            let evidence=null;try{evidence=JSON.parse(fs.readFileSync(gameplayEvidence,'utf8'));}catch{}
            const productionFailure=evidence?.productionReturnRequired===true||evidence?.artifactQualification?.classification==='PRODUCTION_ARTIFACT_FAILURE'||/PRODUCTION_ARTIFACT_FAILURE|VIBE2_PRIMARY_IMPLEMENTATION_FAILED|REAL_PLAYABLE_WEB_GAME_BUILD_FAILED/.test(signature);
            result={gameId:item.gameId,pass:false,update:{
              status:'ACTIVE',currentStep:productionFailure?'WEB_PRODUCTION_REBUILD':'WEB_GAMEPLAY_AND_MUSIC_VALIDATION',canonicalState:productionFailure?'PRODUCTION_ARTIFACT_FAILURE':'WAITING_WEB_GAMEPLAY_REVALIDATION',
              sourcePath:item.webSourcePath,webSourcePath:item.webSourcePath,webValidationRequired:true,musicValidationRequired:true,
              webValidationPassedAt:null,musicValidationPassed:false,initialRealGamePassed:false,finalContentDepthPassed:false,top30Eligible:false,homepageTestEligible:false,homepageTestCandidate:false,
              formalImplementationPassed:false,formalImplementationVerdict:'REVISE',webPromotionRevalidationPassed:false,productionReturnRequired:productionFailure,
              productionReturnReason:productionFailure?'PRODUCTION_ARTIFACT_FAILURE':null,
              routingBlockers:[productionFailure?`PRODUCTION_ARTIFACT_FAILURE:${signature}`:`web-gameplay-music:${signature}`],webValidationLastAttemptAt:stamp,updatedAt:stamp,
            }};
            console.log(`${productionFailure?'WEB_PRODUCTION_ARTIFACT_FAILURE':'WEB_GAMEPLAY_MUSIC_FAIL'}=${item.gameId}:${signature}`);
          }
          fs.writeFileSync(path.join(resultsRoot,`${safe}.json`),JSON.stringify(result,null,2)+'\n');
          NODE

      - name: Upload isolated Web worker result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-web-result-${{ matrix.gameId }}
          path: /tmp/web-worker
          if-no-files-found: error
          retention-days: 1

  web-gate:
    name: required Web initial gameplay and score gate
    needs: [web-plan, web-worker]
    if: always() && needs.web-plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false

      - name: Download parallel Web worker results
        if: needs.web-plan.outputs.target_count != '0'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: development-web-result-*
          path: /tmp/web-batch
          merge-multiple: true

      - name: Fetch current company runtime
        run: git fetch --no-tags --depth=1 origin "$COMPANY_RUNTIME_BRANCH"

      - name: Persist parallel Web evidence and queue state
        if: needs.web-plan.outputs.target_count != '0'
        env:
          EXPECTED_TARGETS_JSON: ${{ needs.web-plan.outputs.targets_json }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-development-web-runtime'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -B development-web-persist "origin/$COMPANY_RUNTIME_BRANCH"
          while IFS= read -r -d '' persist_dir; do
            cp -R "$persist_dir"/. .
          done < <(find /tmp/web-batch -type d -name persist -print0)
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const queue=JSON.parse(fs.readFileSync('development-queue.json','utf8'));
          const expected=JSON.parse(process.env.EXPECTED_TARGETS_JSON||'[]');
          const root='/tmp/web-batch';
          const resultFiles=[];
          const walk=dir=>{
            for(const entry of fs.readdirSync(dir,{withFileTypes:true})){
              const full=path.join(dir,entry.name);
              if(entry.isDirectory()){walk(full);continue;}
              if(!entry.isFile()||!entry.name.endsWith('.json'))continue;
              try{
                const parsed=JSON.parse(fs.readFileSync(full,'utf8').replace(/^\uFEFF/,''));
                if(typeof parsed?.gameId==='string'&&typeof parsed?.pass==='boolean'&&parsed?.update&&typeof parsed.update==='object')resultFiles.push({file:full,result:parsed});
              }catch{}
            }
          };
          if(fs.existsSync(root))walk(root);
          const byId=new Map();
          for(const {result} of resultFiles)byId.set(result.gameId,result);
          const results=[...byId.values()];
          console.log(`WEB_WORKER_RESULT_FILES=${resultFiles.length}`);
          console.log(`WEB_WORKER_RESULT_GAMES=${results.length}`);
          for(const target of expected){
            if(byId.has(target.gameId))continue;
            const stamp=new Date().toISOString();
            const missing={gameId:target.gameId,pass:false,update:{status:'ACTIVE',currentStep:'WEB_GAMEPLAY_AND_MUSIC_VALIDATION',canonicalState:'WAITING_WEB_GAMEPLAY_REVALIDATION',sourcePath:target.webSourcePath,webSourcePath:target.webSourcePath,webValidationRequired:true,musicValidationRequired:true,webValidationPassedAt:null,musicValidationPassed:false,initialRealGamePassed:false,finalContentDepthPassed:false,top30Eligible:false,homepageTestEligible:false,homepageTestCandidate:false,formalImplementationPassed:false,formalImplementationVerdict:'REVISE',webPromotionRevalidationPassed:false,productionReturnRequired:false,routingBlockers:['web-gameplay-music:web-worker-result-missing'],webValidationLastAttemptAt:stamp,updatedAt:stamp}};
            results.push(missing);
            byId.set(target.gameId,missing);
          }
          let passCount=0,failCount=0,productionReturnCount=0,depthWaitingCount=0;
          for(const result of results){const item=(queue.items||[]).find(x=>x.gameId===result.gameId);if(!item)throw new Error(`queue item missing: ${result.gameId}`);Object.assign(item,result.update);if(result.pass===true)passCount++;else failCount++;if(result.update?.productionReturnRequired===true)productionReturnCount++;if(result.update?.canonicalState==='WAITING_WEB_FINAL_CONTENT_DEPTH')depthWaitingCount++;}
          queue.webValidationPolicy='SCHEMA12_INITIAL_REAL_GAME_THEN_FINAL_CONTENT_DEPTH_THEN_TOP30_AND_90_PROMOTION';
          queue.webValidationContractVersion=5;
          queue.webValidationEvidenceSchemaMinimum=12;
          queue.initialImplementationUnit='ONE_COMPLETE_PLAYABLE_GAMEPLAY_CYCLE';
          queue.initialThirtyMinuteHardGate=false;
          queue.finalContentDepthMinutes=30;
          queue.finalContentDepthRequiredForTop30=true;
          queue.webPromotionRevalidationRequired=true;
          queue.webValidationParallelism=2;
          queue.updatedAt=new Date().toISOString();
          fs.writeFileSync('development-queue.json',JSON.stringify(queue,null,2)+'\n');
          console.log(`WEB_INITIAL_REAL_GAME_PASS_COUNT=${passCount}`);
          console.log(`WEB_INITIAL_REAL_GAME_FAIL_COUNT=${failCount}`);
          console.log(`WEB_PRODUCTION_RETURN_COUNT=${productionReturnCount}`);
          console.log(`WEB_FINAL_DEPTH_WAITING_COUNT=${depthWaitingCount}`);
          console.log('WEB_PARALLEL_ACTIVE_MAX=2');
          NODE
          git add development-queue.json web-games/ design/ game-seed-state.json 2>/dev/null || git add development-queue.json web-games/ design/
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'runtime: persist schema12 Web production evidence [skip ci]'
            git push origin HEAD:"$COMPANY_RUNTIME_BRANCH"
          fi
          echo 'WEB_RUNTIME_PERSIST=PASS'
          echo 'PUBLIC_MAIN_WRITE=NO'

      - name: Empty Web queue summary
        if: needs.web-plan.outputs.target_count == '0'
        run: |
          echo 'WEB_REQUIRED_QUEUE=EMPTY'
          echo 'WEB_PARALLEL_ACTIVE_MAX=2'

  post-web-artbook:
    name: post-Web artbook and homepage eligibility
    needs: web-gate
    if: always() && needs.web-gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch current company runtime and resolve post-Web artbook targets
        id: artbook-targets
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$COMPANY_RUNTIME_BRANCH"
          git show "origin/$COMPANY_RUNTIME_BRANCH:development-queue.json" > /tmp/development-queue.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const q=JSON.parse(fs.readFileSync('/tmp/development-queue.json','utf8'));
          const exists=file=>{try{execFileSync('git',['cat-file','-e',`origin/${process.env.COMPANY_RUNTIME_BRANCH}:${file}`],{stdio:'ignore'});return true;}catch{return false;}};
          const showJson=file=>{try{return JSON.parse(execFileSync('git',['show',`origin/${process.env.COMPANY_RUNTIME_BRANCH}:${file}`],{encoding:'utf8'}));}catch{return null;}};
          const targets=[];
          for(const item of q.items||[]){
            const score=Number(item.webStrictScore??item.strictImplementationScore);
            const hard=Array.isArray(item.strictImplementationHardFailures)?item.strictImplementationHardFailures:[];
            if(String(item.productionClass||'').toUpperCase()!=='DEVELOPMENT_CONFIRMED'||!item.webValidationPassedAt||item.musicValidationPassed!==true||item.homepageTestEligible!==true||item.finalContentDepthPassed!==true||item.top30Eligible!==true||!Number.isFinite(score)||score<80||hard.length)continue;
            const artbookSource=item.artbookSource||`artbook-submissions/${item.gameId}/current.json`;
            const artbook=exists(artbookSource)?showJson(artbookSource):null;
            const fresh=artbook?.postWebStrictReview===true&&Number(artbook.webStrictScore)===score&&String(artbook.webValidationEvidencePath||'')===String(item.webValidationEvidencePath||'');
            if(!fresh)targets.push({gameId:item.gameId,gameName:item.gameName||item.gameId,designDate:item.designDate||'',designBaselineSource:item.designBaselineSource,webValidationEvidencePath:item.webValidationEvidencePath,score,artbookSource});
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`target_count=${targets.length}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`targets=${JSON.stringify(targets)}\n`);
          console.log(`POST_WEB_ARTBOOK_TARGET_COUNT=${targets.length}`);
          NODE

      - name: Prepare small local artbook model
        if: steps.artbook-targets.outputs.target_count != '0'
        continue-on-error: true
        uses: ./.github/actions/prepare-ollama
        with:
          model: qwen3:0.6b
          pull-model: 'true'

      - name: Generate post-Web artbooks with bounded time
        if: steps.artbook-targets.outputs.target_count != '0'
        continue-on-error: true
        env:
          TARGETS_JSON: ${{ steps.artbook-targets.outputs.targets }}
          ARTBOOK_EDITOR_MODEL: qwen3:0.6b
          ARTBOOK_MODEL_CALL_TIMEOUT_MS: '60000'
        shell: bash
        run: |
          set -euo pipefail
          git checkout "origin/$COMPANY_RUNTIME_BRANCH" -- game-seed-state.json game-catalog.json development-queue.json design || true
          mkdir -p /tmp/postweb-artbook
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import {execFileSync} from 'node:child_process';
          const targets=JSON.parse(process.env.TARGETS_JSON||'[]');const results=[];
          const materialize=file=>{if(!file)return;try{const raw=execFileSync('git',['show',`origin/${process.env.COMPANY_RUNTIME_BRANCH}:${file}`]);const out=path.resolve(file);fs.mkdirSync(path.dirname(out),{recursive:true});fs.writeFileSync(out,raw);}catch{}};
          for(const t of targets){
            materialize(t.designBaselineSource);materialize(t.webValidationEvidencePath);materialize(t.designBaselineSource?.replace(/design-revised\.json$/,'cycle-status.json'));
            let success=false,error='';
            try{execFileSync('timeout',['150s',process.execPath,'tools/company-design-artbook.mjs',`--game=${t.gameId}`],{stdio:'inherit',env:{...process.env,ARTBOOK_GAME_ID:t.gameId,ARTBOOK_DATE:t.designDate||'',WEB_VALIDATION_EVIDENCE_PATH:t.webValidationEvidencePath,ARTBOOK_EDITOR_MODEL:process.env.ARTBOOK_EDITOR_MODEL,ARTBOOK_MODEL_CALL_TIMEOUT_MS:process.env.ARTBOOK_MODEL_CALL_TIMEOUT_MS}});success=true;}catch(e){error=String(e?.message||e).replace(/\s+/g,' ').slice(0,300);console.log(`POST_WEB_ARTBOOK_DEFERRED=${t.gameId}:${error}`);}
            results.push({...t,success,error});
          }
          fs.writeFileSync('/tmp/postweb-artbook/results.json',JSON.stringify(results,null,2)+'\n');
          const queue=JSON.parse(fs.readFileSync('development-queue.json','utf8'));const catalog=JSON.parse(fs.readFileSync('game-catalog.json','utf8'));const stamp=new Date().toISOString();
          for(const r of results){
            const item=(queue.items||[]).find(x=>x.gameId===r.gameId);const game=(catalog.games||[]).find(x=>x.id===r.gameId);if(!item)continue;
            item.artbookTiming='AFTER_WEB_STRICT_REVIEW_AT_80_OR_HIGHER';item.postPromotionArtbookRequired=false;item.postWebArtbookRequired=true;item.homepageTestCandidate=r.success;item.homepageTestScore=r.score;item.homepageTestVerdict=r.success?'PASS':'WAITING_ARTBOOK';item.postWebArtbookPassed=r.success;item.artbookLastAttemptAt=stamp;
            if(r.success){item.postWebArtbookGeneratedAt=stamp;item.artbookFailure=null;}else item.artbookFailure=r.error||'ARTBOOK_GENERATION_DEFERRED';
            if(game){game.homepageOfficialCard=false;game.homepageTestCandidate=r.success;game.homepageTestScore=r.score;game.homepageReviewState=r.success?'TEST':'WAITING_POST_WEB_ARTBOOK';game.homepageWebPlayable=true;game.webPath=`/${String(item.webSourcePath||`web-games/${r.gameId}`).replace(/^\/+|\/+$/g,'')}/`;if(r.success)game.homepageArtbookPath=`/artbook-viewer.html?game=${encodeURIComponent(r.gameId)}`;game.homepageStage=Number(item.webStrictScore??item.strictImplementationScore)>=90?'Web 90+ PASS · 플랫폼 개발 진행':'Web 80+ 테스트 · 90점 개선 대기';game.homepageRecentWork=`Web 강심사 ${r.score}점 · ${r.success?'아트북 완료':'아트북 대기'}`;}
            item.updatedAt=stamp;
          }
          queue.updatedAt=stamp;fs.writeFileSync('development-queue.json',JSON.stringify(queue,null,2)+'\n');fs.writeFileSync('game-catalog.json',JSON.stringify(catalog,null,2)+'\n');
          NODE
          mkdir -p /tmp/postweb-output
          cp development-queue.json game-catalog.json /tmp/postweb-output/
          cp -R design /tmp/postweb-output/design
          if [[ -d artbook-submissions ]]; then cp -R artbook-submissions /tmp/postweb-output/artbook-submissions; fi

      - name: Persist post-Web artbook state when generated
        if: steps.artbook-targets.outputs.target_count != '0'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          [[ -d /tmp/postweb-output ]] || { echo 'POST_WEB_ARTBOOK_OUTPUT=DEFERRED'; exit 0; }
          git config user.name 'jaewoon-post-web-artbook';git config user.email 'post-web-artbook@users.noreply.github.com'
          git reset --hard;git clean -fd;git checkout -B post-web-artbook-persist "origin/$COMPANY_RUNTIME_BRANCH"
          cp /tmp/postweb-output/development-queue.json development-queue.json;cp /tmp/postweb-output/game-catalog.json game-catalog.json;cp -R /tmp/postweb-output/design/. design/
          if [[ -d /tmp/postweb-output/artbook-submissions ]]; then mkdir -p artbook-submissions;cp -R /tmp/postweb-output/artbook-submissions/. artbook-submissions/;fi
          git add development-queue.json game-catalog.json design artbook-submissions 2>/dev/null || git add development-queue.json game-catalog.json design
          git diff --cached --check
          if ! git diff --cached --quiet;then git commit -m 'runtime: bind post-Web artbooks and homepage test eligibility [skip ci]';git push origin HEAD:"$COMPANY_RUNTIME_BRANCH";fi
          echo 'POST_WEB_ARTBOOK_RUNTIME_PERSIST=PASS'
          echo 'ARTBOOK_FAILURE_ONLY_BLOCKS_HOMEPAGE=YES'

      - name: Post-Web artbook summary
        if: always()
        run: |
          echo 'POST_WEB_ARTBOOK_MINIMUM_SCORE=80'
          echo 'POST_WEB_ARTBOOK_REQUIRES_FINAL_CONTENT_DEPTH=YES'
          echo 'POST_WEB_ARTBOOK_FAILURE_NATIVE_BLOCK=NO'

  route:
    name: route fresh formal 90-point DEVELOPMENT_CONFIRMED selected platforms
    needs: [web-gate, post-web-artbook]
    if: always() && needs.web-gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      dispatch_unity: ${{ steps.route.outputs.dispatch_unity }}
      dispatch_roblox: ${{ steps.route.outputs.dispatch_roblox }}
      dispatch_uefn: ${{ steps.route.outputs.dispatch_uefn }}
      routed_count: ${{ steps.route.outputs.routed_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify selected-platform router contract
        run: |
          node --check tools/company-selected-platform-router.mjs
          node --check tools/company-development-validation-cycle.mjs
          node --check tools/company-web-validation-evidence-contract.mjs
          node --check tools/company-development-unity-platform.mjs
          node --check tools/company-development-uefn-platform.mjs
          node --check tools/vibe3-roblox-platform.mjs
          node --test qa/company-selected-platform-router.test.mjs qa/company-web-validation-evidence-contract.test.mjs qa/company-development-validation-selected-platform.test.mjs

      - name: Fetch current company runtime
        run: git fetch --no-tags --depth=1 origin "$COMPANY_RUNTIME_BRANCH"

      - name: Change detection, fresh formal 90 gate enforcement and one routing decision point
        id: route
        shell: bash
        run: |
          set -euo pipefail
          git show "origin/$COMPANY_RUNTIME_BRANCH:development-queue.json" > /tmp/development-queue.json
          git show "origin/$COMPANY_RUNTIME_BRANCH:game-catalog.json" > /tmp/game-catalog.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import {resolveSelectedPlatform,adapterForPlatform,cheapPrecheck,canonicalTargetStep,canonicalTargetWaitingState} from './tools/company-selected-platform-router.mjs';
          import {evaluateWebValidationEvidence,sha256Text,WEB_PLATFORM_PROMOTION_MINIMUM,WEB_VALIDATION_SCHEMA_VERSION} from './tools/company-web-validation-evidence-contract.mjs';
          const q=JSON.parse(fs.readFileSync('/tmp/development-queue.json','utf8'));
          const catalog=JSON.parse(fs.readFileSync('/tmp/game-catalog.json','utf8'));
          const runtimeRef=`origin/${process.env.COMPANY_RUNTIME_BRANCH}`;
          const showText=file=>execFileSync('git',['show',`${runtimeRef}:${file}`],{encoding:'utf8',maxBuffer:32*1024*1024});
          const promotionEvidence=item=>{
            const evidencePath=String(item.webValidationEvidencePath||'').trim();
            const webSourcePath=String(item.webSourcePath||`web-games/${item.gameId}`).replace(/^\/+|\/+$/g,'');
            const baselinePath=String(item.designBaselineSource||'').trim();
            if(!evidencePath||!webSourcePath||!baselinePath)return{pass:false,blockers:['WEB_PROMOTION_EVIDENCE_PATH_MISSING']};
            try{
              const evidence=JSON.parse(showText(evidencePath));
              return evaluateWebValidationEvidence(evidence,{minimumScore:WEB_PLATFORM_PROMOTION_MINIMUM,requireFinalContentDepth:true,requirePromotionRevalidation:true,currentSourceSha256:sha256Text(showText(`${webSourcePath}/index.html`)),currentBaselineSha256:sha256Text(showText(baselinePath))});
            }catch(error){return{pass:false,blockers:[`WEB_PROMOTION_EVIDENCE_READ_FAILED:${String(error?.message||error).replace(/\s+/g,' ').slice(0,120)}`]};}
          };
          const updates=[];
          const platforms=new Set();
          let promotionRejected=0;
          for(const item of q.items||[]){
            if(String(item.productionClass||'').toUpperCase()!=='DEVELOPMENT_CONFIRMED')continue;
            const hard=Array.isArray(item.strictImplementationHardFailures)?item.strictImplementationHardFailures:[];
            const evidenceGate=promotionEvidence(item);
            const formalPass=item.formalImplementationPassed===true&&item.finalContentDepthPassed===true&&item.top30Eligible===true&&String(item.formalImplementationVerdict||'').toUpperCase()==='PASS'&&Number(item.webStrictScore??item.strictImplementationScore)>=90&&hard.length===0&&evidenceGate.pass===true;
            if(!formalPass||!(Boolean(item.webValidationPassedAt)&&item.musicValidationPassed===true)){
              if(item.formalImplementationPassed===true&&!evidenceGate.pass){promotionRejected++;console.log(`WEB_PROMOTION_EVIDENCE_REJECTED=${item.gameId}:${(evidenceGate.blockers||[]).join('|')}`);}
              continue;
            }
            const status=String(item.status||'').toUpperCase();
            const step=String(item.currentStep||'').toUpperCase();
            const state=String(item.canonicalState||'').toUpperCase();
            if(state==='WAITING_REVALIDATION'||step==='TARGETED_REVALIDATION')continue;
            const legacyActive=status==='ACTIVE'&&step==='UNITY_ANDROID_TECHNICAL_VALIDATION';
            const pending=status==='PENDING';
            const waiting=status==='ACTIVE'&&step==='TARGET_PLATFORM_TECHNICAL_VALIDATION';
            const retrySourceBind=status==='ACTIVE'&&step==='TARGET_PLATFORM_SOURCE_BIND'&&state==='WAITING_TARGET_PLATFORM_REVALIDATION';
            if(!pending&&!legacyActive&&!waiting&&!retrySourceBind)continue;
            const game=(catalog.games||[]).find(x=>x.id===item.gameId)||{};
            const platform=resolveSelectedPlatform(item,game);
            const adapter=adapterForPlatform(platform);
            const oldTarget=String(item.targetSourcePath||'').replaceAll('\\','/');
            const canonicalTarget=adapter?`${adapter.sourceRoot}${item.gameId}`:'';
            const targetSourcePath=adapter&&oldTarget.startsWith(adapter.sourceRoot)?oldTarget:canonicalTarget;
            const baseline=String(item.designBaselineSource||'');
            const baselineRevision=baseline?crypto.createHash('sha256').update(baseline).digest('hex'):'';
            const precheck=cheapPrecheck({selectedPlatform:platform,sourceRevision:baselineRevision,sourcePath:targetSourcePath});
            const blockers=[...precheck.errors];
            if(adapter&&adapter.existingExecutionPath==null)blockers.push('platform-runtime-executor-not-configured');
            if(blockers.length){
              updates.push({gameId:item.gameId,status:'ACTIVE',selectedPlatform:platform,targetPlatform:platform,currentStep:'TARGET_PLATFORM_SOURCE_BIND',canonicalState:'WAITING_TARGET_PLATFORM_VALIDATION',platformAdapter:adapter?.adapterPath||null,sourcePath:targetSourcePath,targetSourcePath,routingBlockers:blockers,updatedAt:new Date().toISOString()});
              continue;
            }
            platforms.add(platform);
            if(retrySourceBind){
              console.log(`DEVELOPMENT_ROUTE_RESUME_SOURCE_BIND=${item.gameId}:${platform}`);
              continue;
            }
            updates.push({gameId:item.gameId,status:'ACTIVE',selectedPlatform:platform,targetPlatform:platform,currentStep:canonicalTargetStep(),canonicalState:canonicalTargetWaitingState(),platformAdapter:adapter.adapterPath,sourcePath:targetSourcePath,targetSourcePath,routingBlockers:[],routeRevision:baselineRevision,webPromotionEvidenceFresh:true,updatedAt:new Date().toISOString()});
          }
          fs.mkdirSync('/tmp/development-route',{recursive:true});
          fs.writeFileSync('/tmp/development-route/updates.json',JSON.stringify(updates,null,2)+'\n');
          const output=process.env.GITHUB_OUTPUT;
          fs.appendFileSync(output,`routed_count=${updates.length}\n`);
          fs.appendFileSync(output,`dispatch_unity=${platforms.has('UNITY')?'true':'false'}\n`);
          fs.appendFileSync(output,`dispatch_roblox=${platforms.has('ROBLOX')?'true':'false'}\n`);
          fs.appendFileSync(output,`dispatch_uefn=${platforms.has('FORTNITE_UEFN')?'true':'false'}\n`);
          console.log(`DEVELOPMENT_ROUTE_COUNT=${updates.length}`);
          console.log(`DEVELOPMENT_ROUTE_PLATFORMS=${[...platforms].join(',')}`);
          console.log(`WEB_PROMOTION_EVIDENCE_REJECTED_COUNT=${promotionRejected}`);
          console.log('WEB_GAMEPLAY_MUSIC_GATE=ENFORCED');
          console.log(`WEB_VALIDATION_SCHEMA_MINIMUM=${WEB_VALIDATION_SCHEMA_VERSION}`);
          console.log('WEB_FINAL_CONTENT_DEPTH_REQUIRED=YES');
          console.log('WEB_INDEPENDENT_PROMOTION_REVALIDATION=REQUIRED');
          console.log('FORMAL_IMPLEMENTATION_GATE=90');
          console.log('CHANGE_DETECTION=PASS');
          console.log('CHEAP_PRECHECK=PASS_OR_BLOCK_RECORDED');
          NODE

      - name: Persist canonical routed queue state
        if: steps.route.outputs.routed_count != '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-development-router'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -B development-router-persist "origin/$COMPANY_RUNTIME_BRANCH"
          node <<'NODE'
          const fs=require('fs');
          const queue=JSON.parse(fs.readFileSync('development-queue.json','utf8'));
          const updates=JSON.parse(fs.readFileSync('/tmp/development-route/updates.json','utf8'));
          for(const update of updates){const item=(queue.items||[]).find(x=>x.gameId===update.gameId);if(!item)throw new Error(`queue item missing: ${update.gameId}`);Object.assign(item,update);}
          queue.routerContractVersion=5;
          queue.routerPolicy='COMPANY_FLOW.md';
          queue.webGateRequired=true;
          queue.homepageTestMinimum=80;
          queue.formalImplementationMinimum=90;
          queue.webValidationEvidenceSchemaMinimum=12;
          queue.finalContentDepthRequiredForTop30=true;
          queue.webPromotionRevalidationRequired=true;
          queue.cronRole='WATCHDOG_AND_RECOVERY_ONLY';
          queue.updatedAt=new Date().toISOString();
          fs.writeFileSync('development-queue.json',JSON.stringify(queue,null,2)+'\n');
          NODE
          git add development-queue.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'runtime: route fresh independently revalidated Web 90 passes [skip ci]'
            git push origin HEAD:"$COMPANY_RUNTIME_BRANCH"
          fi
          echo 'DEVELOPMENT_ROUTER_PERSIST=PASS'

      - name: Router summary
        if: always()
        run: |
          echo 'DEVELOPMENT_PIPELINE=ONE_CANONICAL_PIPELINE'
          echo 'WEB_INITIAL_REAL_GAME_GATE=REQUIRED'
          echo 'WEB_INITIAL_IMPLEMENTATION_UNIT=ONE_COMPLETE_PLAYABLE_GAMEPLAY_CYCLE'
          echo 'WEB_INITIAL_30MIN_HARD_GATE=NO'
          echo 'WEB_VALIDATION_SCHEMA_MINIMUM=12'
          echo 'WEB_FINAL_CONTENT_DEPTH_30MIN=REQUIRED_FOR_TOP30'
          echo 'WEB_STALE_EVIDENCE_REJECTED=YES'
          echo 'WEB_INDEPENDENT_PROMOTION_REVALIDATION=REQUIRED'
          echo 'HOMEPAGE_TEST_GATE=80_PLUS_FINAL_DEPTH'
          echo 'FORMAL_IMPLEMENTATION_GATE=90'
          echo 'POST_WEB_ARTBOOK=YES'
          echo 'WEB_PARALLEL_ACTIVE_MAX=2'
          echo 'PLATFORM_ROUTER=tools/company-selected-platform-router.mjs'
          echo 'CRON_ROLE=WATCHDOG_AND_RECOVERY_ONLY'
          echo 'QUALITY_GATE_WEAKENING=NO'
          echo 'PUBLIC_MAIN_WRITE=NO'

  dispatch:
    name: immediate selected-platform handoff
    needs: route
    if: always() && needs.route.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch selected-platform executors immediately
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_UNITY: ${{ needs.route.outputs.dispatch_unity }}
          DISPATCH_ROBLOX: ${{ needs.route.outputs.dispatch_roblox }}
          DISPATCH_UEFN: ${{ needs.route.outputs.dispatch_uefn }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DISPATCH_UNITY" == 'true' ]]; then
            existing=''
            for attempt in 1 2 3; do
              existing="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/company-development-unity-runtime.yml/runs?per_page=30" | jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha==$sha and (.status=="queued" or .status=="pending" or .status=="in_progress" or .status=="waiting" or .status=="requested")) | .id] | max // empty')"
              [[ "$existing" =~ ^[0-9]+$ ]] && break
              [[ '${{ github.event_name }}' != 'push' ]] && break
              sleep 2
            done
            if [[ "$existing" =~ ^[0-9]+$ ]]; then
              echo "UNITY_EXECUTOR_DISPATCH=DEDUPED_EXISTING_RUN:$existing"
            else
              gh workflow run company-development-unity-runtime.yml --repo "$GITHUB_REPOSITORY" --ref main
              echo 'IMMEDIATE_NEXT_STAGE_DISPATCH=UNITY'
            fi
          fi
          if [[ "$DISPATCH_ROBLOX" == 'true' ]]; then
            existing=''
            for attempt in 1 2 3; do
              existing="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/company-development-roblox-runtime.yml/runs?per_page=30" | jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha==$sha and (.status=="queued" or .status=="pending" or .status=="in_progress" or .status=="waiting" or .status=="requested")) | .id] | max // empty')"
              [[ "$existing" =~ ^[0-9]+$ ]] && break
              [[ '${{ github.event_name }}' != 'push' ]] && break
              sleep 2
            done
            if [[ "$existing" =~ ^[0-9]+$ ]]; then
              echo "ROBLOX_EXECUTOR_DISPATCH=DEDUPED_EXISTING_RUN:$existing"
            else
              gh workflow run company-development-roblox-runtime.yml --repo "$GITHUB_REPOSITORY" --ref main
              echo 'IMMEDIATE_NEXT_STAGE_DISPATCH=ROBLOX_DEVELOPMENT_RUNTIME'
            fi
          fi
          if [[ "$DISPATCH_UEFN" == 'true' ]]; then
            echo 'UNEXPECTED_UEFN_DISPATCH_WITHOUT_CONFIGURED_EXECUTOR' >&2
            exit 2
          fi
          echo 'ROUTER_DISPATCH_COMPLETE=YES'