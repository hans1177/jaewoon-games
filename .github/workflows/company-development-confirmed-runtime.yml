          import crypto from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import {normalizeSelectedPlatform,resolveSelectedPlatform,adapterForPlatform,cheapPrecheck,canonicalTargetStep,canonicalTargetWaitingState} from './tools/company-selected-platform-router.mjs';
          import {evaluateWebValidationEvidence,sha256Text,WEB_PLATFORM_PROMOTION_MINIMUM,WEB_VALIDATION_SCHEMA_VERSION} from './tools/company-web-validation-evidence-contract.mjs';
          const q=JSON.parse(fs.readFileSync('/tmp/development-queue.json','utf8'));
