name: Vibe Variation Practice
# CC0 변형 연습장을 스스로 계속 돌린다(5분 간격 및 관련 코드 수정 직후). 겹치지 않게 한 번에 하나만 돈다. 학습 상태는 main이 아니라 전용 브랜치(vibe-gym-data)에만 쌓는다.
# practice-cloud: GitHub 러너에서 레지스트리의 승인된 CC0만으로 연습.
# practice-local: (저장소 변수 VIBE_GYM_LOCAL=true 일 때) 자체 러너의 E 드라이브 라이브러리를 정리·부족분 확보 계획까지 하고 연습.
#   - 자동 다운로드는 오너 규칙대로 "부족한 분야가 선택됐을 때, 레지스트리에 CC0로 검증된 출처만" 받는다. 받은 팩은 후보이며 승인은 사람이 한다.
on:
  push:
    branches: [main]
    paths:
      - 'tools/vibe-variation-gym.mjs'
      - 'tools/vibe-practice-session.mjs'
      - 'assets/vibe-presentation-director.js'
      - 'qa/vibe-crossplatform-visual-components.test.mjs'
      - 'tools/vibe-gym-publish.mjs'
      - 'tools/vibe_object_score.py'
      - 'tools/vibe-normal-bake.mjs'
      - 'tools/vibe_normal_bake.py'
      - 'tools/vibe_mesh_audit.py'
      - 'tools/vibe-mesh-audit.mjs'
      - 'qa/vibe-variation-gym.test.mjs'
      - 'qa/vibe-practice-session.test.mjs'
      - 'qa/vibe-light-bake.test.mjs'
      - 'qa/vibe-mesh-audit.test.mjs'
      - 'qa/vibe-cc0-library.test.mjs'
      - '.github/workflows/vibe-variation-practice.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/vibe_mesh_audit.py'
      - 'tools/vibe-mesh-audit.mjs'
      - 'qa/vibe-mesh-audit.test.mjs'
      - 'qa/vibe-practice-session.test.mjs'
      - '.github/workflows/vibe-variation-practice.yml'
  schedule:
    # 5분마다(GitHub cron 최소 단위). 진짜 매분은 로컬 PC에서 tools/vibe-practice-loop.mjs 가 한다(60초 루프).
    # 비용을 줄이려면 저장소 변수 VIBE_GYM_CLOUD=off 로 클라우드 연습만 끌 수 있다(로컬 루프는 영향 없음).
    # cron 은 GitHub 가 늦게 등록하거나 건너뛸 수 있어서, 매 회차가 끝날 때 스스로 다음 회차를 예약한다(체인). cron 은 체인이 끊겼을 때의 안전망이다.
    # 체인만 끄려면 VIBE_GYM_CHAIN=off. 겹치지 않는다: concurrency 그룹이 한 번에 하나만 돌리고 대기 하나만 남긴다.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      parents:
        description: 부모 수
        default: '3'
      variants:
        description: 부모당 변형 수
        default: '4'
permissions:
  contents: write
  actions: write
concurrency:
  # PR의 리그 실제 QA는 기존 main 연습 실행과 서로 대기열을 막지 않는다.
  group: ${{ github.event_name == 'pull_request' && format('vibe-variation-practice-pr-{0}', github.event.pull_request.number) || 'vibe-variation-practice' }}
  cancel-in-progress: false
jobs:
  # [실제 리그 수리 계약] 기존 블렌더 연습 워크플로 내 PR 전용 읽기 전용 QA.
  rig-native-qa:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify existing practice scheduling contract
        run: node --test qa/vibe-practice-session.test.mjs
      - name: Install Blender for actual CC0 model regression
        run: |
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
            if [ -f "$source" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 update
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 install -y --no-install-recommends blender python3-numpy libegl1 libgl1 libgl1-mesa-dri
      - name: Verify real mesh removal ground and unchanged animations
        env:
          VIBE2_BLENDER_BINARY: blender
        run: |
          python3 -m py_compile tools/vibe_mesh_audit.py
          node --test qa/vibe-mesh-audit.test.mjs
  practice-cloud:
    if: ${{ github.event_name != 'pull_request' && vars.VIBE_GYM_CLOUD != 'off' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate visual practice and mobile UI contracts
        run: |
          node --check tools/vibe-variation-gym.mjs
          node --check tools/vibe-practice-session.mjs
          node --check assets/vibe-presentation-director.js
          python3 -m py_compile tools/vibe_object_score.py
          python3 -m py_compile tools/vibe_mesh_audit.py
          node --test qa/vibe-variation-gym.test.mjs qa/vibe-practice-session.test.mjs qa/vibe-crossplatform-visual-components.test.mjs qa/vibe-mesh-audit.test.mjs qa/vibe-light-bake.test.mjs qa/vibe-cc0-library.test.mjs
      - name: Install Blender and imaging libs
        run: |
          # Ubuntu hosted runner의 불안정한 Azure HTTP 미러를 공식 HTTPS 미러로 통일한다.
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
            if [ -f "$source" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 update
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 install -y --no-install-recommends blender python3-numpy libegl1 libgl1 libgl1-mesa-dri
          python3 -m pip install --quiet pillow numpy
      - name: Validate actual CC0 rig repair and motion preservation
        env:
          VIBE2_BLENDER_BINARY: blender
        run: node --test qa/vibe-mesh-audit.test.mjs
      - name: Pull learned stats and learned lights
        run: |
          node tools/vibe-gym-publish.mjs pull --stats build/gym-stats.json
          node tools/vibe-gym-publish.mjs pull --stats build/learned-lights.json --file learned-lights.json
          node tools/vibe-gym-publish.mjs pull --stats build/bake-history.json --file practice-domains.json
      - name: Practice (variation gym + light search + normal bake)
        env:
          VIBE2_BLENDER_BINARY: blender
        run: |
          node tools/vibe-practice-session.mjs --parents "${{ inputs.parents || '3' }}" --variants "${{ inputs.variants || '4' }}" --seed "$(date +%s)" --out build/practice --stats build/gym-stats.json --lights build/learned-lights.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish stats to vibe-gym-data (never main)
        run: node tools/vibe-gym-publish.mjs publish --stats build/gym-stats.json --ledger build/practice/gym/ledger.json --lights build/learned-lights.json
      - name: Chain the next run (about every 5 minutes) and nudge the hourly promotion
        if: ${{ always() && vars.VIBE_GYM_CLOUD != 'off' && vars.VIBE_GYM_CHAIN != 'off' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 회차가 약 3분 걸리므로 2분 쉬고 다음을 예약하면 대략 5분 간격이 된다.
          sleep 120
          # 이미 대기 중인 새 main 검증을 자동 체인이 취소하지 않도록 중복 예약을 막는다.
          queued=$(gh api "repos/${{ github.repository }}/actions/workflows/vibe-variation-practice.yml/runs?branch=main&per_page=100" \
            --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID} and (.status == \"queued\" or .status == \"pending\" or .status == \"waiting\"))] | length") || queued=1
          if [ "$queued" = "0" ]; then
            gh api -X POST "repos/${{ github.repository }}/actions/workflows/vibe-variation-practice.yml/dispatches" -f ref=main || echo "다음 회차 예약 실패(안전망 cron 이 이어 간다)"
          else
            echo "기존 대기 회차 ${queued}개 보존: 중복 예약 생략"
          fi
          # 매시 정각 5분 안에 걸린 회차는 룩 승급도 한 번 깨운다(워크플로 쪽에서 열린 PR 이 있으면 알아서 건너뛴다).
          if [ "$(date -u +%M)" -lt 5 ]; then
            gh api -X POST "repos/${{ github.repository }}/actions/workflows/vibe-look-promotion.yml/dispatches" -f ref=main || true
          fi
      - name: Delete practice-only render artifacts after scoring
        if: always()
        run: |
          # [중앙정책 제5규칙] 연습 자산은 보존/게임 적용 금지. 재현 가능한 숫자형 기록만 남긴다.
          find build/practice -type f \( -iname '*.png' -o -iname '*.glb' -o -iname '*.gltf' -o -iname '*.blend' -o -iname '*.jpg' \) -delete || true
      - name: Upload numeric practice evidence only
        uses: actions/upload-artifact@v4
        with:
          name: variation-gym-${{ github.run_id }}
          path: |
            build/practice/session.json
            build/practice/gym/ledger.json
          retention-days: 1
          if-no-files-found: warn

  practice-local:
    if: ${{ github.event_name != 'pull_request' && vars.VIBE_GYM_LOCAL == 'true' }}
    runs-on: [self-hosted, Windows, X64, roblox-studio-authenticated]
    timeout-minutes: 40
    env:
      VIBE_CC0_LIBRARY_DIR: ${{ vars.VIBE_CC0_LIBRARY_DIR || 'E:\jaewoon-cc0-library' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Find Blender and imaging libs (report only, no system changes except pip --user)
        shell: pwsh
        run: |
          $bl = $null
          if ($env:VIBE2_BLENDER_BINARY) { $bl = $env:VIBE2_BLENDER_BINARY }
          else {
            $dir = Get-ChildItem 'C:\Program Files\Blender Foundation' -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
            if ($dir) { $bl = Join-Path $dir.FullName 'blender.exe' }
          }
          if (-not $bl -or -not (Test-Path $bl)) { throw 'Blender를 찾지 못했다. 설치하거나 저장소 변수/환경변수 VIBE2_BLENDER_BINARY 에 blender.exe 경로를 지정하라.' }
          "VIBE2_BLENDER_BINARY=$bl" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $ver = (& $bl --version | Select-Object -First 1)
          "Blender: $ver ($bl)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          node --version
          python -c "import PIL, numpy; print('imaging OK')"
          if ($LASTEXITCODE -ne 0) { python -m pip install --user --quiet pillow numpy; python -c "import PIL, numpy; print('imaging OK')" }
      - name: Ingest inbox, scan library, plan shortage fill
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:VIBE_CC0_LIBRARY_DIR\_inbox" | Out-Null
          node tools/vibe-cc0-library.mjs ingest
          node tools/vibe-cc0-library.mjs scan
          # 부족한 분야가 있을 때만, 레지스트리에 CC0로 검증된 출처에서만 받는다(받은 팩은 승인 전 후보).
          node tools/vibe-cc0-fetch.mjs --execute --max 1
          node tools/vibe-cc0-library.mjs scan
      - name: Pull learned stats and learned lights
        shell: pwsh
        run: |
          node tools/vibe-gym-publish.mjs pull --stats build/gym-stats.json
          node tools/vibe-gym-publish.mjs pull --stats build/learned-lights.json --file learned-lights.json
      - name: Practice (variation gym + light search + normal bake)
        shell: pwsh
        run: node tools/vibe-practice-session.mjs --parents 3 --variants 4 --seed ([int](Get-Date -UFormat %s)) --out build/practice --stats build/gym-stats.json --lights build/learned-lights.json
      - name: Publish stats to vibe-gym-data (never main)
        shell: pwsh
        run: node tools/vibe-gym-publish.mjs publish --stats build/gym-stats.json --ledger build/practice/gym/ledger.json --lights build/learned-lights.json
      - name: Delete local practice-only render artifacts after scoring
        if: always()
        shell: pwsh
        run: |
          # [중앙정책 제5규칙] 로컬 원본 CC0 라이브러리는 유지하고 build/practice 연습 파생만 제거한다.
          if (Test-Path 'build/practice') {
            Get-ChildItem 'build/practice' -Recurse -File |
              Where-Object { $_.Extension.ToLowerInvariant() -in @('.png','.glb','.gltf','.blend','.jpg') } |
              Remove-Item -Force
          }
