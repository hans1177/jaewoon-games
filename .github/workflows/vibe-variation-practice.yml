name: Vibe Variation Practice
# CC0 변형 연습장을 스스로 계속 돌린다(매시간). 겹치지 않게 한 번에 하나만 돈다. 학습 상태는 main이 아니라 전용 브랜치(vibe-gym-data)에만 쌓는다.
# practice-cloud: GitHub 러너에서 레지스트리의 승인된 CC0만으로 연습.
# practice-local: (저장소 변수 VIBE_GYM_LOCAL=true 일 때) 자체 러너의 E 드라이브 라이브러리를 정리·부족분 확보 계획까지 하고 연습.
#   - 자동 다운로드는 오너 규칙대로 "부족한 분야가 선택됐을 때, 레지스트리에 CC0로 검증된 출처만" 받는다. 받은 팩은 후보이며 승인은 사람이 한다.
on:
  schedule:
    # 5분마다(GitHub cron 최소 단위). 진짜 매분은 로컬 PC에서 tools/vibe-practice-loop.mjs 가 한다(60초 루프).
    # 비용을 줄이려면 저장소 변수 VIBE_GYM_CLOUD=off 로 클라우드 연습만 끌 수 있다(로컬 루프는 영향 없음).
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      parents:
        description: 부모 수
        default: '3'
      variants:
        description: 부모당 변형 수
        default: '4'
permissions:
  contents: write
concurrency:
  group: vibe-variation-practice
  cancel-in-progress: false
jobs:
  practice-cloud:
    if: ${{ vars.VIBE_GYM_CLOUD != 'off' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Blender and imaging libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends blender python3-numpy libegl1 libgl1 libgl1-mesa-dri
          python3 -m pip install --quiet pillow numpy
      - name: Pull learned stats and learned lights
        run: |
          node tools/vibe-gym-publish.mjs pull --stats build/gym-stats.json
          node tools/vibe-gym-publish.mjs pull --stats build/learned-lights.json --file learned-lights.json
      - name: Practice (variation gym + light search + normal bake)
        env:
          VIBE2_BLENDER_BINARY: blender
        run: |
          node tools/vibe-practice-session.mjs --parents "${{ inputs.parents || '3' }}" --variants "${{ inputs.variants || '4' }}" --seed "$(date +%s)" --out build/practice --stats build/gym-stats.json --lights build/learned-lights.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish stats to vibe-gym-data (never main)
        run: node tools/vibe-gym-publish.mjs publish --stats build/gym-stats.json --ledger build/practice/gym/ledger.json --lights build/learned-lights.json
      - name: Upload kept children and previews
        uses: actions/upload-artifact@v4
        with:
          name: variation-gym-${{ github.run_id }}
          path: |
            build/practice/session.json
            build/practice/gym/ledger.json
            build/practice/gym/*.png
            build/practice/light/round*/*.png
          retention-days: 14
          if-no-files-found: warn

  practice-local:
    if: ${{ vars.VIBE_GYM_LOCAL == 'true' }}
    runs-on: [self-hosted, Windows, X64, roblox-studio-authenticated]
    timeout-minutes: 40
    env:
      VIBE_CC0_LIBRARY_DIR: ${{ vars.VIBE_CC0_LIBRARY_DIR || 'E:\jaewoon-cc0-library' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Find Blender and imaging libs (report only, no system changes except pip --user)
        shell: pwsh
        run: |
          $bl = $null
          if ($env:VIBE2_BLENDER_BINARY) { $bl = $env:VIBE2_BLENDER_BINARY }
          else {
            $dir = Get-ChildItem 'C:\Program Files\Blender Foundation' -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
            if ($dir) { $bl = Join-Path $dir.FullName 'blender.exe' }
          }
          if (-not $bl -or -not (Test-Path $bl)) { throw 'Blender를 찾지 못했다. 설치하거나 저장소 변수/환경변수 VIBE2_BLENDER_BINARY 에 blender.exe 경로를 지정하라.' }
          "VIBE2_BLENDER_BINARY=$bl" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $ver = (& $bl --version | Select-Object -First 1)
          "Blender: $ver ($bl)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          node --version
          python -c "import PIL, numpy; print('imaging OK')"
          if ($LASTEXITCODE -ne 0) { python -m pip install --user --quiet pillow numpy; python -c "import PIL, numpy; print('imaging OK')" }
      - name: Ingest inbox, scan library, plan shortage fill
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:VIBE_CC0_LIBRARY_DIR\_inbox" | Out-Null
          node tools/vibe-cc0-library.mjs ingest
          node tools/vibe-cc0-library.mjs scan
          # 부족한 분야가 있을 때만, 레지스트리에 CC0로 검증된 출처에서만 받는다(받은 팩은 승인 전 후보).
          node tools/vibe-cc0-fetch.mjs --execute --max 1
          node tools/vibe-cc0-library.mjs scan
      - name: Pull learned stats and learned lights
        shell: pwsh
        run: |
          node tools/vibe-gym-publish.mjs pull --stats build/gym-stats.json
          node tools/vibe-gym-publish.mjs pull --stats build/learned-lights.json --file learned-lights.json
      - name: Practice (variation gym + light search + normal bake)
        shell: pwsh
        run: node tools/vibe-practice-session.mjs --parents 3 --variants 4 --seed ([int](Get-Date -UFormat %s)) --out build/practice --stats build/gym-stats.json --lights build/learned-lights.json
      - name: Publish stats to vibe-gym-data (never main)
        shell: pwsh
        run: node tools/vibe-gym-publish.mjs publish --stats build/gym-stats.json --ledger build/practice/gym/ledger.json --lights build/learned-lights.json
