name: Free Artbook Department Bots

on:
  workflow_dispatch:
    inputs:
      game_id:
        description: 'Optional game id. Empty = automatically select the game most in need of a design cycle.'
        required: false
        type: string
  schedule:
    - cron: '5 23 * * *' # 08:05 KST
  push:
    branches: [main]
    paths:
      - 'COMPANY_FLOW.md'
      - 'company-directive.json'
      - 'game-catalog.json'
      - 'artbook-work-orders/**'
      - 'tools/company-design-cycle.mjs'
      - 'tools/artbook-production-pipeline.mjs'
      - 'tools/artbook-fact-pack.mjs'
      - 'tools/artbook-learning-context.mjs'
      - '.github/workflows/artbook-free-department-bots.yml'

permissions:
  contents: write

concurrency:
  group: free-artbook-departments-main
  cancel-in-progress: true

env:
  OLLAMA_HOST: 127.0.0.1:11434

jobs:
  multimodel-design-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Resolve design-cycle target
        id: target
        shell: bash
        env:
          REQUESTED_GAME_ID: ${{ inputs.game_id || '' }}
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs=require('fs');
          const path=require('path');
          const catalog=JSON.parse(fs.readFileSync('game-catalog.json','utf8'));
          const requested=String(process.env.REQUESTED_GAME_ID||'').trim();
          const games=(catalog.games||[]).filter(g=>[1,2,3].includes(Number(g.productionTier)));
          function latestStatus(gameId){
            const root=path.join('design',gameId);
            if(!fs.existsSync(root))return null;
            const dates=fs.readdirSync(root).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x)).sort().reverse();
            for(const date of dates){
              const file=path.join(root,date,'cycle-status.json');
              if(!fs.existsSync(file))continue;
              try{return JSON.parse(fs.readFileSync(file,'utf8'));}catch{}
            }
            return null;
          }
          let target=null;
          if(requested){
            target=games.find(g=>g.id===requested)||null;
            if(!target)throw new Error(`Unknown game_id: ${requested}`);
          }else{
            const ranked=games.map((g,index)=>{
              const latest=latestStatus(g.id);
              const tierMismatch=!latest||Number(latest.tier)!==Number(g.productionTier);
              const date=String(latest?.date||'0000-00-00');
              const regularPriority=Number(g.productionTier)===2?0:Number(g.productionTier)===3?1:2;
              return {g,index,latest,tierMismatch,date,regularPriority};
            }).sort((a,b)=>Number(b.tierMismatch)-Number(a.tierMismatch)||a.regularPriority-b.regularPriority||a.date.localeCompare(b.date)||a.index-b.index);
            target=ranked[0]?.g||null;
          }
          if(!target){
            console.log('run=false');
            process.exit(0);
          }
          const now=new Date();
          const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(now);
          const get=t=>parts.find(x=>x.type===t)?.value||'';
          const date=`${get('year')}-${get('month')}-${get('day')}`;
          console.log('run=true');
          console.log(`game_id=${target.id}`);
          console.log(`tier=${target.productionTier}`);
          console.log(`date=${date}`);
          NODE

      - name: Install local Ollama
        if: steps.target.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          installed=0
          for attempt in 1 2 3; do
            echo "OLLAMA_INSTALL_ATTEMPT=$attempt/3"
            if curl -fsSL --retry 3 --retry-all-errors --connect-timeout 15 https://ollama.com/install.sh | sh; then
              installed=1
              break
            fi
            sleep $((attempt * 4))
          done
          test "$installed" = 1
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && exit 0
            sleep 2
          done
          cat /tmp/ollama.log || true
          exit 1

      - name: Pull all configured free department models
        if: steps.target.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node -e "const d=require('./company-directive.json'); const p=[...new Set(d.ai.modelPool||[])]; if(p.length<(d.ai.minDistinctModelsPerDepartment||3)) process.exit(2); for(const m of p) console.log(m)" > /tmp/models.txt
          while IFS= read -r model; do
            [ -n "$model" ] || continue
            echo "PULL_MODEL=$model"
            ollama pull "$model"
          done < /tmp/models.txt
          echo 'PAID_API=NO'
          echo 'API_KEY_REQUIRED=NO'

      - name: Run centralized design, meeting and artbook cycle
        if: steps.target.outputs.run == 'true'
        env:
          ARTBOOK_GAME_ID: ${{ steps.target.outputs.game_id }}
          ARTBOOK_DATE: ${{ steps.target.outputs.date }}
        run: node tools/artbook-production-pipeline.mjs

      - name: Verify multimodel and authorship gates
        if: steps.target.outputs.run == 'true'
        env:
          ARTBOOK_GAME_ID: ${{ steps.target.outputs.game_id }}
          ARTBOOK_DATE: ${{ steps.target.outputs.date }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const d=require('./company-directive.json');
          const file=path.join('design',process.env.ARTBOOK_GAME_ID,process.env.ARTBOOK_DATE,'cycle-status.json');
          const s=JSON.parse(fs.readFileSync(file,'utf8'));
          if(s.status!=='COMPLETE')throw new Error('cycle incomplete');
          if(Number(s.tier)!==Number('${{ steps.target.outputs.tier }}'))throw new Error('tier mismatch');
          if(Number(s.tier)===1){
            if(s.vibe2PrimaryDeveloper!==true||s.designChanged!==false)throw new Error('tier1 role contract failed');
          }else{
            if(s.designer?.singleAuthor!==true||s.designer?.sameModelRevised!==true)throw new Error('designer contract failed');
            if(s.departments?.count!==5||s.departments?.rebuttalRounds!==1)throw new Error('meeting contract failed');
            for(const [role,audit] of Object.entries(s.departments.modelAudit||{})){
              if(audit.pass!==true||audit.count<(d.ai.minDistinctModelsPerDepartment||3))throw new Error(`${role} distinct model gate failed`);
            }
            if(s.artbook?.singleEditor!==true||s.artbook?.departmentPageAuthorship!==false||s.artbook?.newClaimsAdded!==false)throw new Error('artbook editor contract failed');
          }
          console.log('CENTRAL_POLICY=COMPANY_FLOW.md');
          console.log('MULTIMODEL_GATE=PASS');
          console.log('AUTHORSHIP_GATE=PASS');
          NODE

      - name: Commit design-cycle evidence
        if: steps.target.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-design-bots'
          git config user.email 'actions@users.noreply.github.com'
          git add -- design artbook-submissions
          if git diff --cached --quiet; then
            echo 'DESIGN_CYCLE_COMMIT=NO_CHANGES'
            exit 0
          fi
          git commit -m "design: multimodel cycle ${{ steps.target.outputs.game_id }} ${{ steps.target.outputs.date }} [skip ci]"
          git pull --rebase origin main
          git push origin main
          echo 'DESIGN_CYCLE_COMMIT=SUCCESS'
