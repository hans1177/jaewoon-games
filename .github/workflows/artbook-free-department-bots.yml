name: Free Artbook Department Bots

on:
  workflow_dispatch:
  schedule:
    - cron: '5 23 * * *' # 08:05 KST
  push:
    branches: [main]
    paths:
      - 'artbook-work-orders/**'
      - 'tools/artbook-prepare-daily.mjs'
      - 'tools/artbook-department-runner.mjs'
      - 'tools/artbook-collaboration-runner.mjs'
      - 'tools/artbook-assemble.mjs'
      - '.github/workflows/artbook-free-department-bots.yml'

permissions:
  contents: write

concurrency:
  group: free-artbook-departments-main
  cancel-in-progress: true

env:
  ARTBOOK_LOCAL_MODEL: qwen3:0.6b
  OLLAMA_HOST: 127.0.0.1:11434

jobs:
  context:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.target.outputs.run }}
      date: ${{ steps.target.outputs.date }}
      game_id: ${{ steps.target.outputs.game_id }}
      work_order: ${{ steps.target.outputs.work_order }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepare next unfinished game
        run: node tools/artbook-prepare-daily.mjs
      - name: Resolve prepared target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('artbook-daily-context.json','utf8'));
          console.log(`run=${c.run?'true':'false'}`);
          console.log(`date=${c.date||''}`);
          console.log(`game_id=${c.gameId||''}`);
          console.log(`work_order=${c.workOrderPath||''}`);
          NODE
      - name: Upload prepared work order
        if: steps.target.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-work-order
          path: |
            artbook-daily-context.json
            artbook-work-orders/${{ steps.target.outputs.date }}-${{ steps.target.outputs.game_id }}.json
          retention-days: 1
          if-no-files-found: error

  round1:
    needs: context
    if: needs.context.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        role: [planning, graphics, development, qa, balance]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore today's work order
        uses: actions/download-artifact@v4
        with:
          name: daily-work-order
          path: .
      - name: Install local Ollama
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && exit 0
            sleep 2
          done
          cat /tmp/ollama.log || true
          exit 1
      - name: Pull free open model
        run: |
          ollama pull "$ARTBOOK_LOCAL_MODEL"
          echo "LOCAL_MODEL=$ARTBOOK_LOCAL_MODEL"
          echo 'PAID_API=NO'
          echo 'API_KEY_REQUIRED=NO'
      - name: Independent department review
        env:
          ARTBOOK_ROLE: ${{ matrix.role }}
          ARTBOOK_DATE: ${{ needs.context.outputs.date }}
          ARTBOOK_GAME_ID: ${{ needs.context.outputs.game_id }}
        run: node tools/artbook-department-runner.mjs
      - name: Upload department-owned section
        uses: actions/upload-artifact@v4
        with:
          name: round1-${{ matrix.role }}
          path: |
            artbook-submissions/${{ needs.context.outputs.game_id }}/${{ needs.context.outputs.date }}/${{ matrix.role }}.json
            artbook-submissions/${{ needs.context.outputs.game_id }}/${{ needs.context.outputs.date }}/visuals/${{ matrix.role }}.svg
          retention-days: 1
          if-no-files-found: error

  collect-round1:
    needs: [context, round1]
    if: needs.context.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all independent sections
        uses: actions/download-artifact@v4
        with:
          pattern: round1-*
          path: .artbook-round1
          merge-multiple: true
      - name: Verify all five independent sections exist
        shell: bash
        run: |
          set -euo pipefail
          for ROLE in planning graphics development qa balance; do
            test -s ".artbook-round1/$ROLE.json"
            test -s ".artbook-round1/visuals/$ROLE.svg"
          done
          echo 'INDEPENDENT_ROUND=5/5'
      - name: Bundle independent round for collaboration
        uses: actions/upload-artifact@v4
        with:
          name: round1-bundle
          path: .artbook-round1/
          retention-days: 1
          if-no-files-found: error

  round2:
    needs: [context, collect-round1]
    if: needs.context.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        role: [planning, graphics, development, qa, balance]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore first-round submissions only after 5-of-5 exists
        uses: actions/download-artifact@v4
        with:
          name: round1-bundle
          path: artbook-submissions/${{ needs.context.outputs.game_id }}/${{ needs.context.outputs.date }}
      - name: Install local Ollama
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && exit 0
            sleep 2
          done
          cat /tmp/ollama.log || true
          exit 1
      - name: Pull free open model
        run: ollama pull "$ARTBOOK_LOCAL_MODEL"
      - name: Cross-department review
        env:
          ARTBOOK_ROLE: ${{ matrix.role }}
          ARTBOOK_DATE: ${{ needs.context.outputs.date }}
          ARTBOOK_GAME_ID: ${{ needs.context.outputs.game_id }}
        run: node tools/artbook-collaboration-runner.mjs
      - name: Upload department collaboration review
        uses: actions/upload-artifact@v4
        with:
          name: round2-${{ matrix.role }}
          path: artbook-submissions/${{ needs.context.outputs.game_id }}/${{ needs.context.outputs.date }}/reviews/${{ matrix.role }}.json
          retention-days: 1
          if-no-files-found: error

  finalize:
    needs: [context, collect-round1, round2]
    if: needs.context.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore today's work order
        uses: actions/download-artifact@v4
        with:
          name: daily-work-order
          path: .
      - name: Restore five independent sections
        uses: actions/download-artifact@v4
        with:
          name: round1-bundle
          path: artbook-submissions/${{ needs.context.outputs.game_id }}/${{ needs.context.outputs.date }}
      - name: Restore five collaboration reviews
        uses: actions/download-artifact@v4
        with:
          pattern: round2-*
          path: artbook-submissions/${{ needs.context.outputs.game_id }}/${{ needs.context.outputs.date }}/reviews
          merge-multiple: true
      - name: Validate 5 sections and 5 reviews
        env:
          ARTBOOK_DATE: ${{ needs.context.outputs.date }}
          ARTBOOK_GAME_ID: ${{ needs.context.outputs.game_id }}
        run: |
          node tools/artbook-gate.mjs
          node - <<'NODE'
          const fs=require('fs');const g=JSON.parse(fs.readFileSync('artbook-gate-status.json','utf8'));
          if(g.readyCount!==5||g.reviewReadyCount!==5||g.readyForDirectorAssembly!==true)throw new Error(`artbook not ready: ${g.readyCount}/5 + ${g.reviewReadyCount}/5`);
          console.log('FREE_DEPARTMENT_SUBMISSIONS=5/5');console.log('FREE_DEPARTMENT_REVIEWS=5/5');
          NODE
      - name: Assemble verified initial artbook with department opinions
        env:
          ARTBOOK_DATE: ${{ needs.context.outputs.date }}
          ARTBOOK_GAME_ID: ${{ needs.context.outputs.game_id }}
        run: node tools/artbook-assemble.mjs
      - name: Synchronize queue state
        env:
          ARTBOOK_DATE: ${{ needs.context.outputs.date }}
          ARTBOOK_GAME_ID: ${{ needs.context.outputs.game_id }}
        run: |
          node - <<'NODE'
          const fs=require('fs');const q=JSON.parse(fs.readFileSync('artbook-submission-queue.json','utf8'));const roles=['planning','graphics','development','qa','balance'];
          q.updatedAt=process.env.ARTBOOK_DATE;q.currentDailyTarget=process.env.ARTBOOK_GAME_ID;
          q.currentTargetExecution={...(q.currentTargetExecution||{}),date:process.env.ARTBOOK_DATE,readySections:5,requiredSections:5,readyReviews:5,requiredReviews:5,directorAssemblyReady:true,runnerDispatch:'FREE_LOCAL_OPEN_MODEL_COMPLETE',runnerModel:'qwen3:0.6b',runnerPaidApi:false,runnerApiKeyRequired:false,firstRoundIndependent:true,secondRoundProtocol:'AGREE_COUNTER_TEST_RESULT_DECISION',departmentOpinionsPublished:true,assemblyGrantsProductionApproval:false};
          const g=(q.games||[]).find(x=>x.gameId===process.env.ARTBOOK_GAME_ID);if(g){g.status='INITIAL_ARTBOOK_ASSEMBLED_AWAITING_OWNER_DECISION';g.sectionsReady=[...roles];g.reviewsReady=[...roles];g.directorAssemblyReady=true;g.currentStage='initial-artbook-assembled-awaiting-owner-decision';}
          fs.writeFileSync('artbook-submission-queue.json',JSON.stringify(q,null,2)+'\n');
          NODE
      - name: Commit verified department work and integrated draft
        shell: bash
        run: |
          set -euo pipefail
          GAME_ID='${{ needs.context.outputs.game_id }}';DATE_KST='${{ needs.context.outputs.date }}'
          git config user.name 'jaewoon-company-department-bots';git config user.email 'actions@users.noreply.github.com'
          git add "artbook-work-orders/${DATE_KST}-${GAME_ID}.json" "artbook-submissions/${GAME_ID}/${DATE_KST}/" artbook-gate-status.json game-artbooks.json artbook-submission-queue.json
          if git diff --cached --quiet; then echo 'ARTBOOK_FINAL_COMMIT=NO_CHANGES';exit 0;fi
          git commit -m "artbook: assemble ${GAME_ID} verified five-department draft"
          git pull --rebase origin main
git push origin main
          echo 'ARTBOOK_FINAL_COMMIT=SUCCESS';echo 'PRODUCTION_APPROVAL=NO'
