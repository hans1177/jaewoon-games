name: Free Artbook Department Bots

on:
  workflow_dispatch:
    inputs:
      game_id:
        description: 'Optional game id. DESIGN_ONLY runs GAME_SEED -> design review -> Design Baseline -> Artbook; later classes resume gated pipelines.'
        required: false
        type: string
  schedule:
    - cron: '5 23 * * *' # 08:05 KST
  push:
    branches: [main]
    paths:
      - 'COMPANY_FLOW.md'
      - 'company-directive.json'
      - 'game-catalog.json'
      - 'game-seed-registry.json'
      - 'artbook-work-orders/**'
      - 'design/**/game-seed.json'
      - 'design/**/web-gameplay-validation.json'
      - 'design/**/unity-technical-validation.json'
      - 'design/**/development-revalidation.json'
      - 'design/**/vibe2-release-implementation.json'
      - 'design/**/unity-android-build.json'
      - 'design/**/android-runtime-validation.json'
      - 'design/**/independent-release-qa.json'
      - 'unity-games/**'
      - 'tools/production-classification.mjs'
      - 'tools/company-design-cycle.mjs'
      - 'tools/company-design-baseline-gate.mjs'
      - 'tools/company-design-artbook.mjs'
      - 'tools/company-development-validation-cycle.mjs'
      - 'tools/company-release-production-cycle.mjs'
      - 'tools/company-baseline-gate.mjs'
      - 'tools/artbook-production-pipeline.mjs'
      - 'tools/artbook-fact-pack.mjs'
      - '.github/workflows/artbook-free-department-bots.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: free-artbook-departments-main
  cancel-in-progress: true

env:
  OLLAMA_HOST: 127.0.0.1:11434

jobs:
  resolve-production-targets:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.targets.outputs.run }}
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Resolve direct and resumable targets
        id: targets
        shell: bash
        env:
          REQUESTED_GAME_ID: ${{ inputs.game_id || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {PRODUCTION_CLASSES,productionClassOf,tierAliasForProductionClass} from './tools/production-classification.mjs';

          const catalog=JSON.parse(fs.readFileSync('game-catalog.json','utf8'));
          const directive=JSON.parse(fs.readFileSync('company-directive.json','utf8'));
          const numericLabels=directive.production?.numericLabels||{};
          const canonical=new Set(directive.production?.canonicalClasses||[]);
          const requested=String(process.env.REQUESTED_GAME_ID||'').trim();
          const eventName=String(process.env.EVENT_NAME||'').trim();
          const games=(catalog.games||[]).map(game=>({game,productionClass:productionClassOf({},game,{numericLabels})})).filter(row=>canonical.has(row.productionClass));

          let selected=[];
          if(requested){
            const target=games.find(row=>row.game.id===requested);
            if(!target)throw new Error(`Unknown or unclassified game_id: ${requested}`);
            selected=[target];
          }else if(eventName==='push'){
            let changed=[];
            try{changed=execFileSync('git',['diff','--name-only','HEAD^','HEAD'],{encoding:'utf8'}).split(/\r?\n/).filter(Boolean);}catch{}
            const designIds=new Set();
            const developmentIds=new Set();
            const releaseIds=new Set();
            for(const file of changed){
              let m=file.match(/^design\/([^/]+)\/[^/]+\/game-seed\.json$/);
              if(m){designIds.add(m[1]);continue;}
              m=file.match(/^design\/([^/]+)\/[^/]+\/(web-gameplay-validation|unity-technical-validation|development-revalidation)\.json$/);
              if(m){developmentIds.add(m[1]);continue;}
              m=file.match(/^design\/([^/]+)\/[^/]+\/(vibe2-release-implementation|unity-android-build|android-runtime-validation|independent-release-qa)\.json$/);
              if(m)releaseIds.add(m[1]);
            }
            for(const row of games.filter(x=>x.productionClass===PRODUCTION_CLASSES.RELEASE_CONFIRMED)){
              const project=String(row.game.unityProjectPath||'').replace(/^\/+|\/+$/g,'');
              if(project&&changed.some(file=>file===project||file.startsWith(`${project}/`)))releaseIds.add(row.game.id);
            }
            if(designIds.size||developmentIds.size||releaseIds.size){
              selected=games.filter(row=>(
                designIds.has(row.game.id)&&row.productionClass===PRODUCTION_CLASSES.DESIGN_ONLY
              )||(
                developmentIds.has(row.game.id)&&row.productionClass===PRODUCTION_CLASSES.DEVELOPMENT_CONFIRMED
              )||(
                releaseIds.has(row.game.id)&&row.productionClass===PRODUCTION_CLASSES.RELEASE_CONFIRMED
              ));
            }else{
              selected=games.filter(row=>row.productionClass===PRODUCTION_CLASSES.DESIGN_ONLY);
            }
          }else{
            selected=games.filter(row=>row.productionClass===PRODUCTION_CLASSES.DESIGN_ONLY);
          }

          const now=new Date();
          const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(now);
          const get=t=>parts.find(x=>x.type===t)?.value||'';
          const date=`${get('year')}-${get('month')}-${get('day')}`;
          const targets=selected.map(row=>({game_id:row.game.id,game_name:row.game.name,production_class:row.productionClass,tier_alias:tierAliasForProductionClass(row.productionClass,{numericLabels})??'',date}));
          console.log(`run=${targets.length>0?'true':'false'}`);
          console.log(`targets=${JSON.stringify(targets)}`);
          console.error(`PRODUCTION_TARGET_COUNT=${targets.length}`);
          console.error(`PRODUCTION_TARGETS=${targets.map(x=>`${x.game_id}:${x.productionClass}`).join(',')}`);
          NODE

  production-cycle:
    needs: resolve-production-targets
    if: needs.resolve-production-targets.outputs.run == 'true'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        target: ${{ fromJSON(needs.resolve-production-targets.outputs.targets) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Install local Ollama
        shell: bash
        run: |
          set -euo pipefail
          installed=0
          for attempt in 1 2 3; do
            echo "OLLAMA_INSTALL_ATTEMPT=$attempt/3"
            if curl -fsSL --retry 3 --retry-all-errors --connect-timeout 15 https://ollama.com/install.sh | sh; then installed=1; break; fi
            sleep $((attempt * 4))
          done
          test "$installed" = 1
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && exit 0
            sleep 2
          done
          cat /tmp/ollama.log || true
          exit 1

      - name: Pull configured free department models
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' > /tmp/models.txt
          import fs from 'node:fs';
          const d=JSON.parse(fs.readFileSync('company-directive.json','utf8'));
          const roles=['planning','graphics','development','qa','balance'];
          const pool=[...new Set((d.ai?.modelPool||[]).map(String).map(x=>x.trim()).filter(Boolean))];
          const reviewCount=Math.max(Number(d.ai?.minDistinctModelsPerDepartment||3),Number(d.ai?.departmentReviewModelCount||3));
          const leads=roles.map(role=>String(d.ai?.departmentLeadModels?.[role]||'').trim());
          if(pool.length<reviewCount)throw new Error(`model pool too small: ${pool.length}/${reviewCount}`);
          if(leads.some(x=>!x))throw new Error('department lead model missing');
          if(new Set(leads).size<Number(d.ai?.minDistinctLeadModelsAcrossDepartments||roles.length))throw new Error('five distinct department lead gate failed');
          for(const lead of leads)if(!pool.includes(lead))throw new Error(`lead model not in pool: ${lead}`);
          for(const model of pool)console.log(model);
          NODE
          while IFS= read -r model; do
            [ -n "$model" ] || continue
            echo "PULL_MODEL=$model"
            ollama pull "$model"
          done < /tmp/models.txt
          echo 'DEPARTMENT_LEAD_PREFLIGHT=PASS'
          echo 'PAID_API=NO'

      - name: Run production class pipeline
        env:
          ARTBOOK_GAME_ID: ${{ matrix.target.game_id }}
          ARTBOOK_DATE: ${{ matrix.target.date }}
        run: node tools/artbook-production-pipeline.mjs

      - name: Verify direct or gated result
        env:
          ARTBOOK_GAME_ID: ${{ matrix.target.game_id }}
          ARTBOOK_DATE: ${{ matrix.target.date }}
          EXPECTED_PRODUCTION_CLASS: ${{ matrix.target.production_class }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {PRODUCTION_CLASSES,normalizeProductionClass,productionClassFromLegacyTier} from './tools/production-classification.mjs';
          const d=JSON.parse(fs.readFileSync('company-directive.json','utf8'));
          const roles=['planning','graphics','development','qa','balance'];
          const leads=roles.map(role=>String(d.ai?.departmentLeadModels?.[role]||'').trim());
          if(new Set(leads).size<roles.length)throw new Error('configured lead models are not distinct');
          const gameId=process.env.ARTBOOK_GAME_ID;
          const date=process.env.ARTBOOK_DATE;
          const base=path.join('design',gameId,date);
          const statusFile=path.join(base,'cycle-status.json');
          if(!fs.existsSync(statusFile))throw new Error('cycle-status.json missing');
          const s=JSON.parse(fs.readFileSync(statusFile,'utf8'));
          const actualClass=normalizeProductionClass(s.productionClass)||productionClassFromLegacyTier(s.tierAlias??s.tier,{numericLabels:d.production?.numericLabels||{}});
          const expectedClass=normalizeProductionClass(process.env.EXPECTED_PRODUCTION_CLASS);
          if(actualClass!==expectedClass)throw new Error(`productionClass mismatch: ${actualClass} != ${expectedClass}`);

          if(actualClass===PRODUCTION_CLASSES.DEVELOPMENT_CONFIRMED){
            if(!s.baselineGate||s.baselineGate.policyDocument!=='COMPANY_FLOW.md')throw new Error('development baseline gate missing');
            const waiting=new Set(d.classes?.DEVELOPMENT_CONFIRMED?.waitingStates||[]);
            const terminal=new Set(d.classes?.DEVELOPMENT_CONFIRMED?.terminalStates||[]);
            if(!waiting.has(s.baselineGate.state)&&!terminal.has(s.baselineGate.state))throw new Error(`invalid development direct state: ${s.baselineGate.state}`);
            if(s.contracts?.gatedDirect!==true||s.contracts?.aiMayInventValidationPass!==false)throw new Error('gated direct contract missing');
            if(s.baselineGate.state==='DEVELOPMENT_BASELINE_READY'){
              const e=s.baselineGate.evidence||{};
              if(e.webGameplay?.pass!==true||e.unityProject?.present!==true||e.unityTechnical?.pass!==true)throw new Error('development baseline falsely approved');
              const artbookFile=path.join(base,'core-artbook.json');
              if(!fs.existsSync(artbookFile))throw new Error('ready development baseline missing artbook revision');
              const artbook=JSON.parse(fs.readFileSync(artbookFile,'utf8'));
              if(artbook.developmentBaseline!==true||artbook.verification?.supported!==true)throw new Error('development artbook provenance failed');
              console.log('DIRECT_RESULT=DEVELOPMENT_BASELINE_AND_ARTBOOK_COMPLETE');
            }else{
              if(s.baselineGate.ready===true)throw new Error('waiting development state incorrectly ready');
              console.log(`DIRECT_RESULT=${s.baselineGate.state}`);
            }
          }else if(actualClass===PRODUCTION_CLASSES.DESIGN_ONLY){
            if(!s.baselineGate||s.baselineGate.policyDocument!=='COMPANY_FLOW.md')throw new Error('design baseline gate missing');
            if(s.gameSeed?.complete!==true)throw new Error('GAME_SEED was not completed before design');
            if(s.departments?.leadModelsDistinct!==true||s.departments?.count!==5)throw new Error('design lead contract failed');
            for(const role of roles){const a=s.departments?.modelAudit?.[role];if(!a?.pass||a.representativeAuthoredByLead!==true||a.rebuttalAuthoredByLead!==true)throw new Error(`${role} lead review contract failed`);}
            if(s.baselineGate.contracts?.designOnlyVibe2Used!==false)throw new Error('DESIGN_ONLY Vibe2 contract invalid');
            const artbookFile=path.join(base,'core-artbook.json');
            if(s.baselineGate.state==='DESIGN_BASELINE_READY'){
              if(s.baselineGate.ready!==true)throw new Error('ready design baseline marked not ready');
              if(!fs.existsSync(artbookFile))throw new Error('ready design baseline missing artbook');
              if(s.artbook?.created!==true||s.artbook?.afterBaseline!==true||s.artbook?.vibe2Used!==false)throw new Error('design artbook order/Vibe2 contract failed');
              if(s.artbookPublication?.published!==true)throw new Error('design baseline artbook not published');
              console.log('DIRECT_RESULT=DESIGN_BASELINE_AND_ARTBOOK_COMPLETE');
            }else{
              if(s.baselineGate.ready===true)throw new Error('non-ready design state incorrectly ready');
              if(fs.existsSync(artbookFile)||s.artbook?.created===true)throw new Error('DESIGN_ONLY artbook created before baseline ready');
              console.log(`DIRECT_RESULT=${s.baselineGate.state}`);
            }
          }else if(actualClass===PRODUCTION_CLASSES.RELEASE_CONFIRMED){
            const allowed=new Set([...(d.classes?.RELEASE_CONFIRMED?.waitingStates||[]),...(d.classes?.RELEASE_CONFIRMED?.releaseStates||[])]);
            if(!allowed.has(s.state))throw new Error(`invalid release direct state: ${s.state}`);
            if(s.flow!=='RELEASE_CONFIRMED_GATED_DIRECT_RELEASE_PRODUCTION'||s.executionMode!=='GATED_DIRECT_RELEASE_PRODUCTION')throw new Error('release gated direct flow missing');
            if(s.vibe2PrimaryDeveloper!==true||s.coreDesignLock!==true)throw new Error('release role/core lock contract failed');
            if(s.contracts?.currentSourceTreeBindingRequired!==true||s.contracts?.currentBuildEvidenceBindingRequired!==true||s.contracts?.aiMayInventBuildPass!==false||s.contracts?.aiMayInventDeviceValidationPass!==false||s.contracts?.aiMayInventIndependentQaPass!==false)throw new Error('release evidence safety contract missing');
            if(s.evidence?.implementation&&s.evidence.implementation.boundToCurrentSource!==true)throw new Error('release implementation is not bound to current Unity source tree');
            if(s.evidence?.build?.state==='PASS'&&(s.evidence.build.boundToCurrentSource!==true||s.evidence.build.boundToImplementation!==true))throw new Error('release build is not bound to current source/implementation');
            if(s.state==='RELEASE_READY'){
              if(s.status!=='COMPLETE')throw new Error('release ready status not complete');
              const baselineFile=path.join(base,'release-baseline.json');
              const artbookFile=path.join(base,'core-artbook.json');
              if(!fs.existsSync(baselineFile)||!fs.existsSync(artbookFile))throw new Error('release ready missing baseline or final artbook');
              const baseline=JSON.parse(fs.readFileSync(baselineFile,'utf8'));
              const artbook=JSON.parse(fs.readFileSync(artbookFile,'utf8'));
              if(baseline.status!=='RELEASE_READY'||baseline.coreDesignLockPreserved!==true)throw new Error('release baseline invalid');
              if(!s.currentSourceTreeSha||baseline.currentSourceTreeSha!==s.currentSourceTreeSha||baseline.currentBuild?.sourceTreeSha!==s.currentSourceTreeSha)throw new Error('release baseline not bound to current source tree');
              if(artbook.releaseBaseline!==true||artbook.verification?.supported!==true||artbook.sourceTreeSha!==s.currentSourceTreeSha)throw new Error('release final artbook provenance/source binding failed');
              if(s.evidence?.runtime?.state!=='PASS'||s.evidence?.runtime?.bound!==true||s.evidence?.independentQa?.state!=='PASS'||s.evidence?.independentQa?.bound!==true)throw new Error('release ready without current-build runtime+QA evidence');
              if(Number(s.departments?.releaseBlockerCount||0)!==0)throw new Error('release ready with department blocker');
              console.log('DIRECT_RESULT=RELEASE_BASELINE_AND_FINAL_ARTBOOK_COMPLETE');
            }else{
              if(s.releaseBaseline||s.artbook)throw new Error('non-ready release state must not expose final release baseline/artbook');
              console.log(`DIRECT_RESULT=${s.state}`);
            }
          }
          console.log('CENTRAL_POLICY=COMPANY_FLOW.md');
          console.log(`PRODUCTION_CLASS=${actualClass}`);
          console.log('NUMERIC_TIER_POLICY=ALIAS_ONLY');
          NODE

      - name: Propose production-cycle evidence through PR
        env:
          GH_TOKEN: ${{ github.token }}
          ARTBOOK_GAME_ID: ${{ matrix.target.game_id }}
          ARTBOOK_DATE: ${{ matrix.target.date }}
          PRODUCTION_CLASS: ${{ matrix.target.production_class }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-design-bots'
          git config user.email 'actions@users.noreply.github.com'
          git add -- "design/$ARTBOOK_GAME_ID" "artbook-submissions/$ARTBOOK_GAME_ID"
          if [ -f game-seed-registry.json ]; then git add game-seed-registry.json; fi
          if git diff --cached --quiet; then echo 'PRODUCTION_CYCLE_COMMIT=NO_CHANGES'; exit 0; fi
          branch="automation/production-cycle-${ARTBOOK_GAME_ID}-${ARTBOOK_DATE}-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git commit -m "production: ${PRODUCTION_CLASS} cycle ${ARTBOOK_GAME_ID} ${ARTBOOK_DATE}"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title "production: ${PRODUCTION_CLASS} cycle ${ARTBOOK_GAME_ID} ${ARTBOOK_DATE}" --body "Central production flow from COMPANY_FLOW.md. DESIGN_ONLY uses GAME_SEED -> detailed design -> five-department review -> Design Baseline -> Artbook, with no Vibe2 stage. DEVELOPMENT_CONFIRMED resumes from real Web/Unity evidence. RELEASE_CONFIRMED uses Vibe2 primary development and binds the current Unity source tree to the Android build, runtime and independent-QA evidence before Release Baseline. Direct main write: NO. Run: ${GITHUB_RUN_ID}"
          echo 'PRODUCTION_CYCLE_COMMIT=PR_OPENED'
          echo 'PUBLIC_MAIN_WRITE=NO'
