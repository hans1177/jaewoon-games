name: Free Artbook Department Bots

on:
  workflow_dispatch:
    inputs:
      game_id:
        description: 'Optional game id. Empty = automatically select the game most in need of a design cycle.'
        required: false
        type: string
  schedule:
    - cron: '5 23 * * *' # 08:05 KST
  push:
    branches: [main]
    paths:
      - 'COMPANY_FLOW.md'
      - 'company-directive.json'
      - 'game-catalog.json'
      - 'artbook-work-orders/**'
      - 'tools/production-classification.mjs'
      - 'tools/company-design-cycle.mjs'
      - 'tools/company-baseline-gate.mjs'
      - 'tools/artbook-production-pipeline.mjs'
      - 'tools/artbook-fact-pack.mjs'
      - '.github/workflows/artbook-free-department-bots.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: free-artbook-departments-main
  cancel-in-progress: true

env:
  OLLAMA_HOST: 127.0.0.1:11434

jobs:
  multimodel-design-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Resolve design-cycle target by productionClass
        id: target
        shell: bash
        env:
          REQUESTED_GAME_ID: ${{ inputs.game_id || '' }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import fs from 'node:fs';
          import path from 'node:path';
          import {
            normalizeProductionClass,
            productionClassOf,
            productionClassFromLegacyTier,
            tierAliasForProductionClass,
          } from './tools/production-classification.mjs';

          const catalog=JSON.parse(fs.readFileSync('game-catalog.json','utf8'));
          const directive=JSON.parse(fs.readFileSync('company-directive.json','utf8'));
          const numericLabels=directive.production?.numericLabels||{};
          const canonical=new Set(directive.production?.canonicalClasses||[]);
          const requested=String(process.env.REQUESTED_GAME_ID||'').trim();
          const games=(catalog.games||[]).map((game,index)=>({
            game,
            index,
            productionClass:productionClassOf({},game,{numericLabels}),
          })).filter(row=>canonical.has(row.productionClass));

          function latestStatus(gameId){
            const root=path.join('design',gameId);
            if(!fs.existsSync(root))return null;
            const dates=fs.readdirSync(root).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x)).sort().reverse();
            for(const date of dates){
              const file=path.join(root,date,'cycle-status.json');
              if(!fs.existsSync(file))continue;
              try{return JSON.parse(fs.readFileSync(file,'utf8'));}catch{}
            }
            return null;
          }

          function statusProductionClass(status){
            if(!status)return null;
            return normalizeProductionClass(status.productionClass)
              ||productionClassFromLegacyTier(status.tierAlias??status.tier,{numericLabels});
          }

          let target=null;
          if(requested){
            target=games.find(row=>row.game.id===requested)||null;
            if(!target)throw new Error(`Unknown or unclassified game_id: ${requested}`);
          }else{
            const classPriority={DEVELOPMENT_CONFIRMED:0,DESIGN_ONLY:1,RELEASE_CONFIRMED:2};
            const ranked=games.map(row=>{
              const latest=latestStatus(row.game.id);
              const latestClass=statusProductionClass(latest);
              const classMismatch=!latest||latestClass!==row.productionClass;
              const date=String(latest?.date||'0000-00-00');
              const regularPriority=classPriority[row.productionClass]??99;
              return {...row,latest,classMismatch,date,regularPriority};
            }).sort((a,b)=>Number(b.classMismatch)-Number(a.classMismatch)||a.regularPriority-b.regularPriority||a.date.localeCompare(b.date)||a.index-b.index);
            target=ranked[0]||null;
          }

          if(!target){
            console.log('run=false');
            process.exit(0);
          }

          const now=new Date();
          const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(now);
          const get=t=>parts.find(x=>x.type===t)?.value||'';
          const date=`${get('year')}-${get('month')}-${get('day')}`;
          const tierAlias=tierAliasForProductionClass(target.productionClass,{numericLabels});
          console.log('run=true');
          console.log(`game_id=${target.game.id}`);
          console.log(`production_class=${target.productionClass}`);
          console.log(`tier_alias=${tierAlias??''}`);
          console.log(`date=${date}`);
          NODE

      - name: Install local Ollama
        if: steps.target.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          installed=0
          for attempt in 1 2 3; do
            echo "OLLAMA_INSTALL_ATTEMPT=$attempt/3"
            if curl -fsSL --retry 3 --retry-all-errors --connect-timeout 15 https://ollama.com/install.sh | sh; then
              installed=1
              break
            fi
            sleep $((attempt * 4))
          done
          test "$installed" = 1
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && exit 0
            sleep 2
          done
          cat /tmp/ollama.log || true
          exit 1

      - name: Pull all configured free department models
        if: steps.target.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node -e "const d=require('./company-directive.json'); const p=[...new Set(d.ai.modelPool||[])]; if(p.length<(d.ai.minDistinctModelsPerDepartment||3)) process.exit(2); for(const m of p) console.log(m)" > /tmp/models.txt
          while IFS= read -r model; do
            [ -n "$model" ] || continue
            echo "PULL_MODEL=$model"
            ollama pull "$model"
          done < /tmp/models.txt
          echo 'PAID_API=NO'
          echo 'API_KEY_REQUIRED=NO'

      - name: Run centralized design, meeting and artbook cycle
        if: steps.target.outputs.run == 'true'
        env:
          ARTBOOK_GAME_ID: ${{ steps.target.outputs.game_id }}
          ARTBOOK_DATE: ${{ steps.target.outputs.date }}
        run: node tools/artbook-production-pipeline.mjs

      - name: Verify multimodel, authorship and baseline gates by productionClass
        if: steps.target.outputs.run == 'true'
        env:
          ARTBOOK_GAME_ID: ${{ steps.target.outputs.game_id }}
          ARTBOOK_DATE: ${{ steps.target.outputs.date }}
          EXPECTED_PRODUCTION_CLASS: ${{ steps.target.outputs.production_class }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {normalizeProductionClass,productionClassFromLegacyTier} from './tools/production-classification.mjs';
          const d=JSON.parse(fs.readFileSync('./company-directive.json','utf8'));
          const numericLabels=d.production?.numericLabels||{};
          const file=path.join('design',process.env.ARTBOOK_GAME_ID,process.env.ARTBOOK_DATE,'cycle-status.json');
          const s=JSON.parse(fs.readFileSync(file,'utf8'));
          const actualClass=normalizeProductionClass(s.productionClass)||productionClassFromLegacyTier(s.tierAlias??s.tier,{numericLabels});
          const expectedClass=normalizeProductionClass(process.env.EXPECTED_PRODUCTION_CLASS);
          if(s.status!=='COMPLETE')throw new Error('cycle incomplete');
          if(!actualClass||actualClass!==expectedClass)throw new Error(`productionClass mismatch: ${actualClass} != ${expectedClass}`);
          if(!s.baselineGate||s.baselineGate.policyDocument!=='COMPANY_FLOW.md')throw new Error('baseline gate missing');
          if(actualClass==='RELEASE_CONFIRMED'){
            if(s.vibe2PrimaryDeveloper!==true||s.designChanged!==false)throw new Error('release role contract failed');
            if(s.baselineGate.state!=='RELEASE_BASELINE_MANAGED_BY_RELEASE_PIPELINE')throw new Error('release baseline ownership failed');
          }else{
            if(s.designer?.singleAuthor!==true||s.designer?.sameModelRevised!==true)throw new Error('designer contract failed');
            if(s.departments?.count!==5||s.departments?.rebuttalRounds!==1)throw new Error('meeting contract failed');
            for(const role of ['planning','graphics','development','qa','balance']){
              const audit=s.departments.modelAudit?.[role];
              if(!audit||audit.pass!==true||audit.count<(d.ai.minDistinctModelsPerDepartment||3))throw new Error(`${role} distinct model gate failed`);
            }
            if(s.artbook?.singleEditor!==true||s.artbook?.departmentPageAuthorship!==false||s.artbook?.newClaimsAdded!==false||s.artbook?.provenanceVerified!==true)throw new Error('artbook editor contract failed');
            if(actualClass==='DEVELOPMENT_CONFIRMED'&&s.baselineGate.state==='DEVELOPMENT_BASELINE_READY'){
              const e=s.baselineGate.evidence||{};
              if(e.webGameplay?.pass!==true||e.unityProject?.present!==true||e.unityTechnical?.pass!==true)throw new Error('development baseline falsely approved without Web+Unity validation');
            }
          }
          console.log('CENTRAL_POLICY=COMPANY_FLOW.md');
          console.log(`PRODUCTION_CLASS=${actualClass}`);
          console.log('NUMERIC_TIER_POLICY=ALIAS_ONLY');
          console.log('MULTIMODEL_GATE=PASS');
          console.log('AUTHORSHIP_GATE=PASS');
          console.log(`BASELINE_GATE=${s.baselineGate.state}`);
          NODE

      - name: Propose design-cycle evidence through PR
        if: steps.target.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-design-bots'
          git config user.email 'actions@users.noreply.github.com'
          git add -- design artbook-submissions
          if git diff --cached --quiet; then
            echo 'DESIGN_CYCLE_COMMIT=NO_CHANGES'
            exit 0
          fi
          branch="automation/design-cycle-${{ steps.target.outputs.game_id }}-${{ steps.target.outputs.date }}-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git commit -m "design: multimodel cycle ${{ steps.target.outputs.game_id }} ${{ steps.target.outputs.date }} [skip ci]"
          git push origin "HEAD:refs/heads/$branch"
          pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title "design: multimodel cycle ${{ steps.target.outputs.game_id }} ${{ steps.target.outputs.date }}" --body "Central policy evidence update from Free Artbook Department Bots.\n\n- policy: COMPANY_FLOW.md\n- game: ${{ steps.target.outputs.game_id }}\n- productionClass: ${{ steps.target.outputs.production_class }}\n- tier alias: ${{ steps.target.outputs.tier_alias }}\n- date: ${{ steps.target.outputs.date }}\n- run: $GITHUB_RUN_ID\n- direct main write: NO")"
          echo "DESIGN_CYCLE_PR=$pr_url"
          echo 'DESIGN_CYCLE_COMMIT=PR_OPENED'
          echo 'PUBLIC_MAIN_WRITE=NO'
