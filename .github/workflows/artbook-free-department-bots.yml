name: Free Artbook Department Bots

on:
  workflow_dispatch:
  schedule:
    - cron: '5 23 * * *' # 08:05 KST
  push:
    branches: [main]
    paths:
      - 'artbook-work-orders/**'
      - 'artbook-second-work-queue.json'
      - 'tools/artbook-prepare-daily.mjs'
      - 'tools/artbook-department-runner.mjs'
      - 'tools/artbook-second-work-runner.mjs'
      - 'tools/artbook-visual-plan-runner.mjs'
      - 'tools/artbook-collaboration-runner.mjs'
      - 'tools/artbook-director-review.mjs'
      - 'tools/artbook-director-presentation.mjs'
      - 'tools/artbook-gate.mjs'
      - 'tools/artbook-assemble.mjs'
      - 'tools/artbook-postprocess.mjs'
      - '.github/workflows/artbook-free-department-bots.yml'

permissions:
  contents: write

concurrency:
  group: free-artbook-departments-main
  cancel-in-progress: true

env:
  ARTBOOK_LOCAL_MODEL: qwen3:0.6b
  OLLAMA_HOST: 127.0.0.1:11434

jobs:
  context:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.target.outputs.run }}
      date: ${{ steps.target.outputs.date }}
      mode: ${{ steps.target.outputs.mode }}
      game_id: ${{ steps.target.outputs.game_id }}
      work_order: ${{ steps.target.outputs.work_order }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepare daily initial or same-day second work
        run: node tools/artbook-prepare-daily.mjs
      - name: Resolve prepared target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('artbook-daily-context.json','utf8'));
          console.log(`run=${c.run?'true':'false'}`);
          console.log(`date=${c.date||''}`);
          console.log(`mode=${c.mode||''}`);
          console.log(`game_id=${c.gameId||''}`);
          console.log(`work_order=${c.workOrderPath||''}`);
          NODE
      - name: Upload prepared work order
        if: steps.target.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-work-order
          path: |
            artbook-daily-context.json
            artbook-work-orders/${{ steps.target.outputs.date }}-${{ steps.target.outputs.game_id }}.json
          retention-days: 1
          if-no-files-found: error

  round1:
    needs: context
    if: needs.context.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        role: [planning, graphics, development, qa, balance]
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore today's work order
        uses: actions/download-artifact@v4
        with:
          name: daily-work-order
          path: .
      - name: Install local Ollama
        shell: bash
        run: |
          set -euo pipefail
          installed=0
          for attempt in 1 2 3; do
            echo "OLLAMA_INSTALL_ATTEMPT=$attempt/3"
            if curl -fsSL --retry 3 --retry-all-errors --connect-timeout 15 https://ollama.com/install.sh | sh; then
              installed=1
              break
            fi
            sleep $((attempt * 4))
          done
          test "$installed" = 1
          command -v ollama >/dev/null
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && exit 0
            sleep 2
          done
          cat /tmp/ollama.log || true
          exit 1
      - name: Pull free open model
        run: |
          ollama pull "$ARTBOOK_LOCAL_MODEL"
          echo "LOCAL_MODEL=$ARTBOOK_LOCAL_MODEL"
          echo 'PAID_API=NO'
          echo 'API_KEY_REQUIRED=NO'
      - name: Department initial or second work
        env:
          ARTBOOK_ROLE: ${{ matrix.role }}
          ARTBOOK_DATE: ${{ needs.context.outputs.date }}
          ARTBOOK_GAME_ID: ${{ needs.context.outputs.game_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ needs.context.outputs.mode }}' = 'SECOND_WORK' ]; then
            node tools/artbook-second-work-runner.mjs
          else
            node tools/artbook-department-runner.mjs
          fi
      - name: Department AI authors visual-first pages
        env:
          ARTBOOK_ROLE: ${{ matrix.role }}
          ARTBOOK_DATE: ${{ needs.context.outputs.date }}
          ARTBOOK_GAME_ID: ${{ needs.context.outputs.game_id }}
        run: node tools/artbook-visual-plan-runner.mjs
      - name: Upload department-owned section and visuals
        uses: actions/upload-artifact@v4
        with:
          name: round1-${{ matrix.role }}
          path: |
            artbook-submissions/${{ needs.context.outputs.game_id }}/${{ needs.context.outputs.date }}/${{ matrix.role }}.json
            artbook-submissions/${{ needs.context.outputs.game_id }}/${{ needs.context.outputs.date }}/visuals/${{ matrix.role }}.svg
            artbook-submissions/${{ needs.context.outputs.game_id }}/${{ needs.context.outputs.date }}/visuals/${{ matrix.role }}-*.svg
          retention-days: 1
          if-no-files-found: error

  collect-round1:
    needs: [context, round1]
    if: needs.context.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all department sections
        uses: actions/download-artifact@v4
        with:
          pattern: round1-*
          path: .artbook-round1
          merge-multiple: true
      - name: Verify five employee visual assignments
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const expected={planning:2,graphics:2,development:2,qa:1,balance:1};
          for(const [role,count] of Object.entries(expected)){
            const file=`.artbook-round1/${role}.json`;
            if(!fs.existsSync(file))throw new Error(`${role} json missing`);
            const d=JSON.parse(fs.readFileSync(file,'utf8')),p=d.presentation;
            if(p?.mode!=='VISUAL_FIRST_EMPLOYEE_AUTHORED'||p?.generatedBy?.assistantAuthored!==false||p?.pages?.length!==count)throw new Error(`${role} visual assignment incomplete`);
            for(let i=1;i<=count;i++)if(!fs.existsSync(`.artbook-round1/visuals/${role}-${i}.svg`))throw new Error(`${role}-${i}.svg missing`);
          }
          console.log('DEPARTMENT_ROUND=5/5');
          console.log('DEPARTMENT_VISUAL_PAGES=8/8');
          console.log('ASSISTANT_AUTHORED_PAGES=0');
          NODE
      - name: Bundle department round for peer review
        uses: actions/upload-artifact@v4
        with:
          name: round1-bundle
          path: .artbook-round1/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  round2:
    needs: [context, collect-round1]
    if: needs.context.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        role: [planning, graphics, development, qa, balance]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore all five department results
        uses: actions/download-artifact@v4
        with:
          name: round1-bundle
          path: artbook-submissions/${{ needs.context.outputs.game_id }}/${{ needs.context.outputs.date }}
      - name: Install local Ollama
        shell: bash
        run: |
          set -euo pipefail
          installed=0
          for attempt in 1 2 3; do
            echo "OLLAMA_INSTALL_ATTEMPT=$attempt/3"
            if curl -fsSL --retry 3 --retry-all-errors --connect-timeout 15 https://ollama.com/install.sh | sh; then
              installed=1
              break
            fi
            sleep $((attempt * 4))
          done
          test "$installed" = 1
          command -v ollama >/dev/null
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && exit 0
            sleep 2
          done
          cat /tmp/ollama.log || true
          exit 1
      - name: Pull free open model
        run: ollama pull "$ARTBOOK_LOCAL_MODEL"
      - name: Rate other departments with one improvement and five-star scale
        env:
          ARTBOOK_ROLE: ${{ matrix.role }}
          ARTBOOK_DATE: ${{ needs.context.outputs.date }}
          ARTBOOK_GAME_ID: ${{ needs.context.outputs.game_id }}
        run: node tools/artbook-collaboration-runner.mjs
      - name: Upload peer rating review
        uses: actions/upload-artifact@v4
        with:
          name: round2-${{ matrix.role }}
          path: artbook-submissions/${{ needs.context.outputs.game_id }}/${{ needs.context.outputs.date }}/reviews/${{ matrix.role }}.json
          retention-days: 1
          if-no-files-found: error

  director:
    needs: [context, collect-round1, round2]
    if: needs.context.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore department results
        uses: actions/download-artifact@v4
        with:
          name: round1-bundle
          path: artbook-submissions/${{ needs.context.outputs.game_id }}/${{ needs.context.outputs.date }}
      - name: Restore peer reviews
        uses: actions/download-artifact@v4
        with:
          pattern: round2-*
          path: artbook-submissions/${{ needs.context.outputs.game_id }}/${{ needs.context.outputs.date }}/reviews
          merge-multiple: true
      - name: Install local Ollama
        shell: bash
        run: |
          set -euo pipefail
          installed=0
          for attempt in 1 2 3; do
            echo "OLLAMA_INSTALL_ATTEMPT=$attempt/3"
            if curl -fsSL --retry 3 --retry-all-errors --connect-timeout 15 https://ollama.com/install.sh | sh; then
              installed=1
              break
            fi
            sleep $((attempt * 4))
          done
          test "$installed" = 1
          command -v ollama >/dev/null
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && exit 0
            sleep 2
          done
          cat /tmp/ollama.log || true
          exit 1
      - name: Pull free open model
        run: ollama pull "$ARTBOOK_LOCAL_MODEL"
      - name: Director fifth vote
        env:
          ARTBOOK_DATE: ${{ needs.context.outputs.date }}
          ARTBOOK_GAME_ID: ${{ needs.context.outputs.game_id }}
        run: node tools/artbook-director-review.mjs
      - name: Director visual cover and summary
        env:
          ARTBOOK_DATE: ${{ needs.context.outputs.date }}
          ARTBOOK_GAME_ID: ${{ needs.context.outputs.game_id }}
        run: node tools/artbook-director-presentation.mjs
      - name: Upload director outputs
        uses: actions/upload-artifact@v4
        with:
          name: director-round
          path: |
            artbook-submissions/${{ needs.context.outputs.game_id }}/${{ needs.context.outputs.date }}/reviews/director.json
            artbook-submissions/${{ needs.context.outputs.game_id }}/${{ needs.context.outputs.date }}/presentation/director-presentation.json
            artbook-submissions/${{ needs.context.outputs.game_id }}/${{ needs.context.outputs.date }}/visuals/director-*.svg
          retention-days: 1
          if-no-files-found: error

  finalize:
    needs: [context, collect-round1, round2, director]
    if: needs.context.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore department results
        uses: actions/download-artifact@v4
        with:
          name: round1-bundle
          path: artbook-submissions/${{ needs.context.outputs.game_id }}/${{ needs.context.outputs.date }}
      - name: Restore peer reviews
        uses: actions/download-artifact@v4
        with:
          pattern: round2-*
          path: artbook-submissions/${{ needs.context.outputs.game_id }}/${{ needs.context.outputs.date }}/reviews
          merge-multiple: true
      - name: Restore director outputs
        uses: actions/download-artifact@v4
        with:
          name: director-round
          path: artbook-submissions/${{ needs.context.outputs.game_id }}/${{ needs.context.outputs.date }}
      - name: Restore prepared work order
        uses: actions/download-artifact@v4
        with:
          name: daily-work-order
          path: .
      - name: Run gate, assemble, and postprocess
        env:
          ARTBOOK_DATE: ${{ needs.context.outputs.date }}
          ARTBOOK_GAME_ID: ${{ needs.context.outputs.game_id }}
        run: |
          node tools/artbook-gate.mjs
          node tools/artbook-assemble.mjs
          node tools/artbook-postprocess.mjs
      - name: Commit completed artbook state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-artbook-bots'
          git config user.email 'actions@users.noreply.github.com'
          git add artbook-submissions artbook-gate-status.json artbook-submission-queue.json artbook-second-work-queue.json game-artbooks.json artbook-work-orders
          if git diff --cached --quiet; then
            echo 'ARTBOOK_COMMIT=NO_CHANGES'
            exit 0
          fi
          git commit -m "artbook: complete ${ARTBOOK_DATE:-today} ${ARTBOOK_GAME_ID:-target} ${ARTBOOK_MODE:-round} [skip ci]"
          git pull --rebase origin main
          git push origin main
          echo 'ARTBOOK_COMMIT=SUCCESS'