name: Artbook Section Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'artbook-submissions/**'
      - 'artbook-submission-queue.json'
      - 'artbook-second-work-queue.json'
      - 'artbook-work-orders/**'
      - 'tools/artbook-gate.mjs'
      - 'tools/artbook-assemble.mjs'
      - 'tools/artbook-postprocess.mjs'
      - '.github/workflows/artbook-section-gate.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: artbook-section-gate-main
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate real department submissions and peer ratings
        run: node tools/artbook-gate.mjs

      - name: Read assembly readiness
        id: gate
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs=require('fs');
          const gate=JSON.parse(fs.readFileSync('artbook-gate-status.json','utf8'));
          console.log(`ready=${gate.readyForDirectorAssembly===true?'true':'false'}`);
          NODE

      - name: Assemble verified five-section artbook
        if: steps.gate.outputs.ready == 'true'
        run: node tools/artbook-assemble.mjs

      - name: Postprocess assembled artbook to exact 10 cuts
        if: steps.gate.outputs.ready == 'true'
        run: node tools/artbook-postprocess.mjs

      - name: Validate completed 10-cut result
        if: steps.gate.outputs.ready == 'true'
        run: |
          node <<'NODE'
          const fs=require('fs');
          const gate=JSON.parse(fs.readFileSync('artbook-gate-status.json','utf8'));
          const artbook=JSON.parse(fs.readFileSync(gate.assembledFile,'utf8'));
          if(artbook.status!=='COMPLETED')throw new Error('artbook must finish as COMPLETED');
          if(!Array.isArray(artbook.cuts)||artbook.cuts.length!==10)throw new Error(`artbook must have exactly 10 cuts: ${artbook.cuts?.length||0}`);
          if(artbook.postprocess?.complete!==true)throw new Error('artbook postprocess must be complete');
          if(gate.completedArtbook!==true||gate.cutCount!==10||gate.postprocessComplete!==true)throw new Error('gate completion state mismatch');
          console.log('ARTBOOK_SECTION_GATE_FINAL=COMPLETED_10/10');
          NODE

      - name: Open completed gate artbook persistence pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "jaewoon-company-ai"
          git config user.email "actions@users.noreply.github.com"
          git add artbook-gate-status.json
          git add artbook-submissions 2>/dev/null || true
          git add game-artbooks.json 2>/dev/null || true
          git add artbook-second-work-queue.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No artbook gate/assembly changes."
            exit 0
          fi
          BRANCH="automation/artbook-section-gate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$BRANCH"
          git commit -m "artbook-gate: persist completed 10-cut artbook [skip ci]"
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title 'artbook-gate: persist completed 10-cut artbook' \
            --body "Automated Artbook Section Gate persistence from run ${GITHUB_RUN_ID}. Direct main write: NO."
          echo 'ARTBOOK_SECTION_GATE_PR=OPEN'
