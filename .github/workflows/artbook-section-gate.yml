name: Artbook Section Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'artbook-submissions/**'
      - 'artbook-submission-queue.json'
      - 'tools/artbook-gate.mjs'
      - 'tools/artbook-assemble.mjs'

permissions:
  contents: write

concurrency:
  group: artbook-section-gate-main
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate real department submissions
        run: node tools/artbook-gate.mjs

      - name: Read assembly readiness
        id: gate
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs=require('fs');
          const gate=JSON.parse(fs.readFileSync('artbook-gate-status.json','utf8'));
          console.log(`ready=${gate.readyForDirectorAssembly===true?'true':'false'}`);
          NODE

      - name: Assemble verified five-section artbook
        if: steps.gate.outputs.ready == 'true'
        run: node tools/artbook-assemble.mjs

      - name: Persist gate and assembled artbook
        run: |
          git config user.name "jaewoon-company-ai"
          git config user.email "actions@users.noreply.github.com"
          git add artbook-gate-status.json
          git add artbook-submissions 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No artbook gate/assembly changes."
            exit 0
          fi
          git commit -m "artbook-gate: record readiness and verified assembly [skip ci]"
          git pull --rebase origin main
          git push origin main
