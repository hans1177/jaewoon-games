name: Artbook Section Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'artbook-submissions/**'
      - 'artbook-submission-queue.json'
      - 'tools/artbook-gate.mjs'

permissions:
  contents: write

concurrency:
  group: artbook-section-gate-main
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate real department submissions
        run: node tools/artbook-gate.mjs

      - name: Persist gate status
        run: |
          git config user.name "jaewoon-company-ai"
          git config user.email "actions@users.noreply.github.com"
          git add artbook-gate-status.json
          if git diff --cached --quiet; then
            echo "No artbook gate-state changes."
            exit 0
          fi
          git commit -m "artbook-gate: record section readiness [skip ci]"
          git pull --rebase origin main
          git push origin main
