name: Input Actions Test

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test input actions and session integration
        run: |
          rm -rf /tmp/jaewoon-input
          mkdir -p /tmp/jaewoon-input
          cp assets/input-actions.js assets/game-session.js assets/game-loop.js assets/vibe-runtime.js assets/game-blueprint.js assets/game-presets.js assets/game-kit.js assets/d20-rules.js assets/turn-combat.js assets/character-progression.js assets/inventory-equipment.js assets/quest-dialogue.js assets/skill-effects.js assets/economy-loot-shop.js assets/save-versioning.js /tmp/jaewoon-input/
          printf '{"type":"module"}\n' > /tmp/jaewoon-input/package.json
          cd /tmp/jaewoon-input
          node --check input-actions.js
          node --check game-session.js
          node --input-type=module <<'NODE'
          import { JaewoonInputActions } from './input-actions.js';
          import { createGameSession } from './game-session.js';
          import { buildGamePreset } from './game-presets.js';

          const input = new JaewoonInputActions({ actions: {
            attack: { keys: ['Space'] },
            left: { keys: ['ArrowLeft', 'KeyA'] },
          }});
          input.handleKey('Space', true);
          if (!input.isDown('attack') || !input.wasPressed('attack')) throw new Error('keyboard press failed');
          input.endFrame();
          if (input.wasPressed('attack')) throw new Error('pressed state did not clear');
          input.press('attack', 'touch:attack');
          input.handleKey('Space', false);
          if (!input.isDown('attack')) throw new Error('multi-source input failed');
          input.release('attack', 'touch:attack');
          if (input.isDown('attack') || !input.wasReleased('attack')) throw new Error('release failed');
          const axis = input.setAxis('move', 2, -2);
          if (axis.x !== 1 || axis.y !== -1) throw new Error('axis clamp failed');
          input.releaseAll();
          if (input.axis('move').x !== 0) throw new Error('axis clear failed');

          const storage = new Map();
          globalThis.localStorage = {
            getItem: (key) => storage.has(key) ? storage.get(key) : null,
            setItem: (key, value) => storage.set(key, String(value)),
            removeItem: (key) => storage.delete(key),
          };
          const session = createGameSession({
            gameId: 'input-session', genre: 'action', autoRestore: false,
            inputOptions: { actions: { jump: { keys: ['Space'] } } },
          });
          session.start({ bootRuntime: false, attachInput: false });
          session.input.press('jump', 'qa');
          if (!session.input.isDown('jump')) throw new Error('session input missing');
          session.pause('qa');
          if (session.input.isDown('jump')) throw new Error('pause did not release input');
          session.destroy();

          const preset = buildGamePreset({ genre: 'action' });
          if (!preset.systems.includes('input-actions')) throw new Error('input-actions missing from preset');
          if (!preset.qa.includes('input-actions')) throw new Error('input-actions QA missing');
          console.log('PASS input actions');
          NODE
