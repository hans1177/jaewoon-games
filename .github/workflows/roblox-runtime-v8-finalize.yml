name: Finalize Roblox Runtime Harness V8

on:
  workflow_dispatch:
  push:
    branches:
      - fix/roblox-runtime-v8-finalize-20260914
    paths:
      - '.github/workflows/roblox-runtime-v8-finalize.yml'

permissions:
  contents: write

concurrency:
  group: roblox-runtime-v8-finalize
  cancel-in-progress: false

env:
  TARGET_BRANCH: fix/roblox-runtime-v8-finalize-20260914

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Refuse main execution
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$TARGET_BRANCH"
          test "$TARGET_BRANCH" != 'main'
          echo "ROBLOX_V8_TARGET_BRANCH=$TARGET_BRANCH"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1
          fetch-tags: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply canonical v8 runtime semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          parent_path=Path('.github/workflows/company-development-roblox-runtime.yml')
          cont_path=Path('.github/workflows/company-development-roblox-runtime-continuation.yml')
          parent_test_path=Path('qa/company-development-roblox-runtime.test.mjs')
          cont_test_path=Path('qa/company-development-roblox-runtime-continuation.test.mjs')
          helper_path=Path('tools/company-development-roblox-runtime-persist.mjs')
          parent=parent_path.read_text(); cont=cont_path.read_text(); parent_test=parent_test_path.read_text(); cont_test=cont_test_path.read_text()

          def one(text,old,new,label):
              n=text.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1 match, got {n}')
              return text.replace(old,new,1)

          parent=one(parent,"ROBLOX_RUNTIME_HARNESS_VERSION: '7'","ROBLOX_RUNTIME_HARNESS_VERSION: '8'",'parent harness')
          cont=one(cont,"ROBLOX_RUNTIME_HARNESS_VERSION: '7'","ROBLOX_RUNTIME_HARNESS_VERSION: '8'",'continuation harness')
          parent_test=one(parent_test,"ROBLOX_RUNTIME_HARNESS_VERSION: '7'","ROBLOX_RUNTIME_HARNESS_VERSION: '8'",'parent test harness')
          cont_test=one(cont_test,"ROBLOX_RUNTIME_HARNESS_VERSION: '7'","ROBLOX_RUNTIME_HARNESS_VERSION: '8'",'continuation test harness')
          parent_test=parent_test.replace('wakes harness v7 continuation','wakes harness v8 continuation')

          parent=one(parent,"}else if(item.robloxBuildPreflightPassed===true&&item.robloxRuntimePassed!==true){","}else if(item.robloxBuildPreflightPassed===true&&(item.robloxRuntimePassed!==true||String(item.robloxRuntimeHarnessVersion||'')!==harnessVersion)){",'parent stale harness readiness')
          cont=one(cont,"if(item.robloxBuildPreflightPassed!==true||item.robloxRuntimePassed===true||(item.robloxRuntimeFailedAt&&!retryableInstallFailure&&!retryableRuntimeFailure&&!retryableMissingEvidence&&!retryableAuthMigration))continue;","if(item.robloxBuildPreflightPassed!==true||(item.robloxRuntimePassed===true&&sameHarness)||(item.robloxRuntimeFailedAt&&!retryableInstallFailure&&!retryableRuntimeFailure&&!retryableMissingEvidence&&!retryableAuthMigration))continue;",'continuation stale pass selection')
          cont=one(cont,"const runtimePending=exact&&item.robloxBuildPreflightPassed===true&&item.robloxRuntimePassed!==true&&(!item.robloxRuntimeFailedAt||retryableInstallFailure||retryableRuntimeFailure||retryableMissingEvidence||retryableAuthMigration);","const runtimePending=exact&&item.robloxBuildPreflightPassed===true&&(item.robloxRuntimePassed!==true||!sameHarness)&&(!item.robloxRuntimeFailedAt||retryableInstallFailure||retryableRuntimeFailure||retryableMissingEvidence||retryableAuthMigration);",'continuation remaining stale pass')
          cont=one(cont,"          if ($combined -notmatch 'ROBLOX_RUNTIME_SMOKE=PASS') { throw 'Runtime PASS sentinel missing' }\n          if ($combined -notmatch 'ROBLOX_SERVER_CLIENT_BOUNDARY_PASS=YES') { throw 'Server/client boundary sentinel missing' }","          if ($combined -notmatch '(?m)^ROBLOX_RUNTIME_RESULT=PASS:PLAYER_CHARACTER_CLIENT_SERVER_ROUNDTRIP\\r?$') { throw 'Runtime roundtrip PASS result missing' }\n          if ($combined -notmatch '(?m)^ROBLOX_RUNTIME_SMOKE=PASS\\r?$') { throw 'Runtime PASS sentinel missing' }\n          if ($combined -notmatch '(?m)^ROBLOX_SERVER_CLIENT_BOUNDARY_PASS=YES\\r?$') { throw 'Server/client boundary sentinel missing' }",'anchored runtime evidence')

          persist_name="      - name: Persist exact actual-runtime state\n"
          dispatch="      - name: Dispatch next continuation slice when eligible work remains\n"
          start=cont.find(persist_name); end=cont.find(dispatch,start)
          if start<0 or end<0: raise SystemExit('runtime persist block not found')
          run_at=cont.find("        run: |\n",start,end)
          if run_at<0: raise SystemExit('runtime persist run marker not found')
          prefix=cont[start:run_at+len("        run: |\n")]
          safe=prefix+"""          set -euo pipefail
          git config user.name 'jaewoon-roblox-runtime'
          git config user.email 'actions@users.noreply.github.com'
          persisted=0
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin \"$COMPANY_RUNTIME_BRANCH\"
            git reset --hard \"origin/$COMPANY_RUNTIME_BRANCH\"
            node tools/company-development-roblox-runtime-persist.mjs development-queue.json /tmp/roblox-runtime-batch
            git add development-queue.json
            git diff --cached --check
            if git diff --cached --quiet; then persisted=1; break; fi
            git commit -m 'runtime: persist actual Roblox Studio checkpoint [skip ci]'
            if git push origin HEAD:\"$COMPANY_RUNTIME_BRANCH\"; then persisted=1; break; fi
            echo \"ROBLOX_RUNTIME_PERSIST_RETRY=$attempt\"
            sleep $((attempt*2))
          done
          if [[ \"$persisted\" != '1' ]]; then echo 'ROBLOX_RUNTIME_PERSIST=FAIL'; exit 1; fi
          echo 'ROBLOX_RUNTIME_PERSIST=PASS'
"""
          cont=cont[:start]+safe+cont[end:]
          cont=one(cont,"          node --check tools/vibe3-roblox-platform.mjs\n","          node --check tools/vibe3-roblox-platform.mjs\n          node --check tools/company-development-roblox-runtime-persist.mjs\n",'helper contract check')

          parent_test=one(parent_test,"  assert.ok(workflow.includes('retryableMissingEvidence||retryableAuthMigration'));","  assert.ok(workflow.includes('retryableMissingEvidence||retryableAuthMigration'));\n  assert.ok(workflow.includes(\"item.robloxRuntimePassed!==true||String(item.robloxRuntimeHarnessVersion||'')!==harnessVersion\"));",'parent stale assertion')
          cont_test=one(cont_test,"  assert.ok(smoke.includes('ROBLOX_SERVER_CLIENT_BOUNDARY_PASS=YES'));","  assert.ok(smoke.includes('ROBLOX_SERVER_CLIENT_BOUNDARY_PASS\" .. \"=YES'));\n  assert.ok(smoke.includes('PASS:PLAYER_CHARACTER_CLIENT_SERVER_ROUNDTRIP'));\n  assert.ok(!smoke.includes('print(\"ROBLOX_RUNTIME_SMOKE=PASS\")'));\n  assert.ok(workflow.includes(\"(item.robloxRuntimePassed===true&&sameHarness)\"));\n  assert.ok(workflow.includes(\"(item.robloxRuntimePassed!==true||!sameHarness)\"));\n  assert.ok(workflow.includes('Runtime roundtrip PASS result missing'));\n  assert.ok(workflow.includes('company-development-roblox-runtime-persist.mjs'));",'smoke assertions')
          cont_test=one(cont_test,"  assert.ok(workflow.includes(\"robloxLastSuccessfulStage:'TARGET_PLATFORM_RUNTIME'\"));","  assert.ok(workflow.includes(\"robloxLastSuccessfulStage:'TARGET_PLATFORM_RUNTIME'\"));\n  assert.ok(workflow.includes('robloxIndependentQaPassed:false'));\n  assert.ok(workflow.includes('robloxRegressionPassed:false'));\n  assert.ok(workflow.includes('robloxFinalReviewPassed:false'));\n  assert.ok(workflow.includes('robloxPostRuntimeQaEvidence:null'));",'downstream invalidation assertions')

          helper_path.write_text(r'''import fs from 'node:fs';
import path from 'node:path';
const queuePath=process.argv[2]||'development-queue.json';
const root=process.argv[3]||'/tmp/roblox-runtime-batch';
const expected=JSON.parse(process.env.EXPECTED_TARGETS_JSON||'[]');
const queue=JSON.parse(fs.readFileSync(queuePath,'utf8').replace(/^\uFEFF/,''));
const resultFiles=[];
const walk=dir=>{for(const entry of fs.readdirSync(dir,{withFileTypes:true})){const full=path.join(dir,entry.name);if(entry.isDirectory())walk(full);else if(entry.isFile()&&entry.name.endsWith('.runtime.json'))resultFiles.push(full);}};
if(fs.existsSync(root))walk(root);
const results=resultFiles.sort().map(file=>JSON.parse(fs.readFileSync(file,'utf8').replace(/^\uFEFF/,'')));
console.log(`ROBLOX_RUNTIME_CHECKPOINT_FILES=${resultFiles.length}`);
const byId=new Map(results.map(x=>[x.gameId,x])); const stamp=new Date().toISOString(); let pass=0,fail=0;
for(const target of expected){
  const item=(queue.items||[]).find(x=>x.gameId===target.gameId); if(!item)throw new Error(`queue item missing: ${target.gameId}`);
  const r=byId.get(target.gameId); const exact=r?.sourceRevision===item.robloxSourceCommit&&r?.artifactIdentity===item.robloxBuildArtifactIdentity;
  const expectedHarness=String(target.runtimeHarnessVersion||''); const resultHarness=String(r?.runtimeHarnessVersion||''); const harnessExact=Boolean(expectedHarness)&&resultHarness===expectedHarness;
  if(r?.runtimePassed===true&&r?.actualStudioRuntime===true&&r?.serverClientBoundaryPassed===true&&exact&&harnessExact){
    Object.assign(item,{robloxRuntimePassed:true,robloxRuntimePassedAt:stamp,robloxRuntimeFailedAt:null,robloxRuntimeEvidence:r,robloxRuntimeRetryCount:0,robloxRuntimeHarnessVersion:resultHarness,robloxServerClientBoundaryPassed:true,robloxDatastoreRejoinPassed:r.datastoreRejoinPassed===true,robloxMobileControlUiPassed:r.mobileControlUiPassed===true,robloxIndependentQaPassed:false,robloxIndependentQaPassedAt:null,robloxRegressionPassed:false,robloxRegressionPassedAt:null,robloxFinalReviewPassed:false,robloxFinalReviewPassedAt:null,robloxPostRuntimeQaEvidence:null,robloxLastSuccessfulStage:'TARGET_PLATFORM_RUNTIME',robloxFailureStage:'INDEPENDENT_QA',robloxFailureSignature:'ROBLOX_INDEPENDENT_QA_PENDING',routingBlockers:['roblox-independent-qa-pending'],updatedAt:stamp}); pass++;
  }else{
    const failure=r?.failure||(!harnessExact?'ROBLOX_RUNTIME_HARNESS_MISMATCH':'ROBLOX_RUNTIME_RESULT_MISSING');
    const retryableFailure=['roblox-studio-install-failed','roblox-studio-runtime-failed','roblox-studio-runtime-timeout','ROBLOX_RUNTIME_RESULT_MISSING'].includes(failure);
    const sameHarness=String(item.robloxRuntimeHarnessVersion||'')===resultHarness; const retryCount=retryableFailure?(sameHarness?Number(item.robloxRuntimeRetryCount||0):0)+1:0;
    Object.assign(item,{robloxRuntimePassed:false,robloxRuntimeFailedAt:stamp,robloxRuntimeEvidence:r||null,robloxRuntimeRetryCount:retryCount,robloxRuntimeHarnessVersion:resultHarness||expectedHarness,robloxServerClientBoundaryPassed:false,robloxIndependentQaPassed:false,robloxIndependentQaPassedAt:null,robloxRegressionPassed:false,robloxRegressionPassedAt:null,robloxFinalReviewPassed:false,robloxFinalReviewPassedAt:null,robloxPostRuntimeQaEvidence:null,robloxFailureStage:'TARGET_PLATFORM_RUNTIME',robloxFailureSignature:failure,routingBlockers:[`roblox-runtime:${failure}`],updatedAt:stamp}); fail++;
  }
}
queue.updatedAt=stamp; fs.writeFileSync(queuePath,JSON.stringify(queue,null,2)+'\n');
console.log(`ROBLOX_ACTUAL_RUNTIME_PASS_COUNT=${pass}`); console.log(`ROBLOX_ACTUAL_RUNTIME_FAIL_COUNT=${fail}`); console.log('ROBLOX_OTHER_GAME_PROMOTION_BLOCKED=NO'); console.log('ROBLOX_INDEPENDENT_QA_PASS=NO'); console.log('ROBLOX_RELEASE_CLAIM=NO');
''')
          parent_path.write_text(parent); cont_path.write_text(cont); parent_test_path.write_text(parent_test); cont_test_path.write_text(cont_test)
          PY
          node --check tools/company-development-roblox-runtime-persist.mjs
          node --test qa/company-development-roblox-runtime-continuation.test.mjs qa/company-development-roblox-runtime.test.mjs
          git diff --check
          echo 'ROBLOX_RUNTIME_V8_FINALIZE_TEST=PASS'
      - name: Commit only to feature branch and remove migration workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-roblox-runtime'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/workflows/roblox-runtime-v8-finalize.yml
          git rm -f .github/workflows/roblox-runtime-v8-pr-apply.yml || true
          git add .github/workflows/company-development-roblox-runtime.yml .github/workflows/company-development-roblox-runtime-continuation.yml qa/company-development-roblox-runtime.test.mjs qa/company-development-roblox-runtime-continuation.test.mjs tools/company-development-roblox-runtime-persist.mjs
          git diff --cached --check
          git commit -m 'fix: finalize Roblox runtime harness v8'
          git push origin "HEAD:$TARGET_BRANCH"
          echo "ROBLOX_RUNTIME_V8_FEATURE_BRANCH_PUSH=$TARGET_BRANCH"
