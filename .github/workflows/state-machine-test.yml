name: State Machine Test

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test state machine and session integration
        run: |
          rm -rf /tmp/jaewoon-state
          mkdir -p /tmp/jaewoon-state
          cp assets/state-machine.js assets/game-session.js assets/scene-flow.js assets/input-actions.js assets/game-loop.js assets/vibe-runtime.js assets/game-blueprint.js assets/game-presets.js assets/game-kit.js assets/d20-rules.js assets/turn-combat.js assets/character-progression.js assets/inventory-equipment.js assets/quest-dialogue.js assets/skill-effects.js assets/economy-loot-shop.js assets/save-versioning.js /tmp/jaewoon-state/
          printf '{"type":"module"}\n' > /tmp/jaewoon-state/package.json
          cd /tmp/jaewoon-state
          node --check state-machine.js
          node --check game-session.js
          node --input-type=module <<'NODE'
          import { JaewoonStateMachine } from './state-machine.js';
          import { createGameSession } from './game-session.js';
          import { buildGamePreset } from './game-presets.js';

          let updates = 0;
          const machine = new JaewoonStateMachine({
            states: {
              idle: { transitions: ['move'] },
              move: { transitions: ['idle','attack'], update: ({ delta }) => { updates += delta; } },
              attack: { transitions: ['idle'], canEnter: ({ context }) => context.canAttack === true },
            },
            initial: 'idle',
            context: { canAttack: false },
          });
          machine.transition('move');
          machine.update(0.5);
          if (!machine.is('move') || updates !== 0.5) throw new Error('state update failed');
          let blocked = false;
          try { machine.transition('attack'); } catch { blocked = true; }
          if (!blocked) throw new Error('state guard failed');
          machine.setContext('canAttack', true);
          machine.transition('attack');
          if (machine.previous !== 'move') throw new Error('previous state failed');
          const snap = machine.snapshot();
          const restoredMachine = new JaewoonStateMachine({ states: { idle:{}, move:{}, attack:{} } });
          restoredMachine.restore(snap);
          if (!restoredMachine.is('attack') || restoredMachine.context.canAttack !== true) throw new Error('state restore failed');

          const storage = new Map();
          globalThis.localStorage = {
            getItem: (key) => storage.has(key) ? storage.get(key) : null,
            setItem: (key, value) => storage.set(key, String(value)),
            removeItem: (key) => storage.delete(key),
          };
          const session = createGameSession({
            gameId: 'state-session', genre: 'action', autoRestore: false,
            stateMachines: {
              player: { states: { idle: { transitions:['run'] }, run: { transitions:['idle'] } }, initial: 'idle', context: { stamina: 9 } },
            },
          });
          session.getStateMachine('player').transition('run');
          session.save();
          const restored = createGameSession({
            gameId: 'state-session', genre: 'action',
            stateMachines: {
              player: { states: { idle: { transitions:['run'] }, run: { transitions:['idle'] } }, initial: 'idle' },
            },
          });
          if (!restored.getStateMachine('player').is('run')) throw new Error('session state restore failed');
          if (restored.getStateMachine('player').context.stamina !== 9) throw new Error('session state context restore failed');
          restored.destroy();

          const preset = buildGamePreset({ genre: 'action' });
          if (!preset.systems.includes('state-machine')) throw new Error('state-machine missing from preset');
          if (!preset.qa.includes('state-transitions') || !preset.qa.includes('state-restore')) throw new Error('state QA missing');
          console.log('PASS state machine');
          NODE
