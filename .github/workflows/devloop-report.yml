# 파일명: .github/workflows/devloop-report.yml
# 대항해시대: 기존 MareDevLog 오류·FPS를 현재 전용 체험에서 읽어 보고한다.
name: Devloop Report (Mare Essentia)
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/devloop-report.yml'
      - 'roblox-games/mare-essentia/tools/devloop/telemetry_report.py'
permissions:
  contents: write
concurrency:
  group: devloop-report
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read telemetry from Open Cloud
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          UNIVERSE_ID: '10775310508'
        run: python3 roblox-games/mare-essentia/tools/devloop/telemetry_report.py > /tmp/telemetry.md
      - name: Commit report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # [로그 보고] LFS 체크아웃 경합을 피하고 기존 Contents API로 결과만 반영한다.
          set -euo pipefail
          dest=roblox-games/mare-essentia/docs/devloop/TELEMETRY.md
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${dest}?ref=main" --jq .sha 2>/dev/null || true)"
          payload="$(mktemp)"
          python3 - /tmp/telemetry.md "$sha" "$payload" <<'PYJSON'
          import base64,json,pathlib,sys
          source,sha,output=sys.argv[1:]
          body={"message":"devloop: Mare Essentia telemetry report","branch":"main","content":base64.b64encode(pathlib.Path(source).read_bytes()).decode("ascii")}
          if sha: body["sha"]=sha
          pathlib.Path(output).write_text(json.dumps(body),encoding="utf-8")
          PYJSON
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/${dest}" --input "$payload" --silent
          rm -f "$payload"
          echo "MARE_TELEMETRY_REPORT_COMMITTED"
