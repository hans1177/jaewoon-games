name: ChatGPT Vibe2 Capability Fix

on:
  push:
    branches: [chatgpt/vibe2-capability-review-20260909]
    paths:
      - '.github/workflows/chatgpt-vibe2-capability-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/vibe2-capability-review-20260909
          fetch-depth: 0
      - name: Repair YAML heredoc indentation only
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/autonomous-continuous-development.yml')
          text=p.read_text()
          old1='''            ROLE="$ROLE" OWNED_SCOPE="$OWNED_SCOPE" node <<'NODE'\nconst fs=require('fs');\nconst root=`department-implementations/${process.env.ROLE}`;\nconst e=JSON.parse(fs.readFileSync(`${root}/evidence.json`,'utf8'));\nconst scope=String(process.env.OWNED_SCOPE||'').split(',').filter(Boolean);\nif(scope.length&&e.changedFiles.some(x=>!scope.includes(x)))throw new Error('department changed outside owned scope');\nfs.writeFileSync(`${root}/status.json`,JSON.stringify({role:process.env.ROLE,status:'PASS',scope,candidateId:e.candidateId,changedFiles:e.changedFiles},null,2)+'\\n');\nNODE\n'''
          new1='''            ROLE="$ROLE" OWNED_SCOPE="$OWNED_SCOPE" node <<'NODE'\n            const fs=require('fs');\n            const root=`department-implementations/${process.env.ROLE}`;\n            const e=JSON.parse(fs.readFileSync(`${root}/evidence.json`,'utf8'));\n            const scope=String(process.env.OWNED_SCOPE||'').split(',').filter(Boolean);\n            if(scope.length&&e.changedFiles.some(x=>!scope.includes(x)))throw new Error('department changed outside owned scope');\n            fs.writeFileSync(`${root}/status.json`,JSON.stringify({role:process.env.ROLE,status:'PASS',scope,candidateId:e.candidateId,changedFiles:e.changedFiles},null,2)+'\\n');\n            NODE\n'''
          old2='''            ROLE="$ROLE" node <<'NODE'\nconst fs=require('fs');const root=`department-implementations/${process.env.ROLE}`;\nfs.writeFileSync(`${root}/status.json`,JSON.stringify({role:process.env.ROLE,status:'NO_SCOPE',reason:'NO_FUNCTIONAL_RESPONSIBILITY_FOR_THIS_FLOOR',scope:[]},null,2)+'\\n');\nNODE\n'''
          new2='''            ROLE="$ROLE" node <<'NODE'\n            const fs=require('fs');const root=`department-implementations/${process.env.ROLE}`;\n            fs.writeFileSync(`${root}/status.json`,JSON.stringify({role:process.env.ROLE,status:'NO_SCOPE',reason:'NO_FUNCTIONAL_RESPONSIBILITY_FOR_THIS_FLOOR',scope:[]},null,2)+'\\n');\n            NODE\n'''
          if old1 not in text or old2 not in text:
              raise SystemExit('expected heredoc targets not found')
          p.write_text(text.replace(old1,new1,1).replace(old2,new2,1))
          PY
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/autonomous-continuous-development.yml')"
          git diff --check
      - name: Commit isolated workflow repair
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/chatgpt-vibe2-capability-fix.yml
          git config user.name 'chatgpt-vibe2-review'
          git config user.email 'chatgpt-vibe2-review@users.noreply.github.com'
          git add .github/workflows/autonomous-continuous-development.yml
          git commit -m 'fix: restore autonomous workflow heredoc YAML'
          git push origin HEAD:chatgpt/vibe2-capability-review-20260909
