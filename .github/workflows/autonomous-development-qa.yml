name: Autonomous Development QA

on:
  push:
    branches: [main]
    paths:
      - "autonomous-portfolio.json"
      - "assets/vibe-company-orchestration-bridge.js"
      - "company-learning/**"
      - "tools/company-dna-learning.mjs"
      - "tools/autonomous-development-worker.mjs"
      - "tools/autonomous-work-planner.mjs"
      - "tools/autonomous-24h-work-planner.mjs"
      - "tools/autonomous-department-cycle.mjs"
      - "tools/autonomous-department-integrator.mjs"
      - "tools/autonomous-candidate-review.mjs"
      - "tools/autonomous-queue-state.mjs"
      - "tools/autonomous-vibe-release-handoff.mjs"
      - "tools/director-supervisor.mjs"
      - "qa/autonomous-development-worker.test.mjs"
      - "qa/autonomous-department-integrator.test.mjs"
      - "qa/autonomous-work-planner.test.mjs"
      - "qa/autonomous-24h-work-planner.test.mjs"
      - "qa/autonomous-queue-state.test.mjs"
      - "qa/autonomous-candidate-review.test.mjs"
      - "qa/autonomous-vibe-release-handoff.test.mjs"
      - ".github/actions/prepare-ollama/action.yml"
      - ".github/workflows/autonomous-continuous-development.yml"
      - ".github/workflows/autonomous-candidate-promotion.yml"
      - ".github/workflows/vibe2-candidate-release.yml"
      - ".github/workflows/vibe2-unity-release-result.yml"
      - ".github/workflows/public-game-health.yml"
      - ".github/workflows/company-dna-learning.yml"
      - ".github/workflows/director-supervisor.yml"
      - ".github/workflows/autonomous-development-qa.yml"
  pull_request:
    paths:
      - "autonomous-portfolio.json"
      - "tools/autonomous-development-worker.mjs"
      - "tools/autonomous-work-planner.mjs"
      - "tools/autonomous-24h-work-planner.mjs"
      - "tools/autonomous-department-cycle.mjs"
      - "tools/autonomous-department-integrator.mjs"
      - "tools/autonomous-candidate-review.mjs"
      - "tools/autonomous-vibe-release-handoff.mjs"
      - "qa/autonomous-development-worker.test.mjs"
      - "qa/autonomous-department-integrator.test.mjs"
      - "qa/autonomous-work-planner.test.mjs"
      - "qa/autonomous-24h-work-planner.test.mjs"
      - "qa/autonomous-candidate-review.test.mjs"
      - "qa/autonomous-vibe-release-handoff.test.mjs"
      - ".github/actions/prepare-ollama/action.yml"
      - ".github/workflows/autonomous-continuous-development.yml"
      - ".github/workflows/autonomous-candidate-promotion.yml"
      - ".github/workflows/vibe2-candidate-release.yml"
      - ".github/workflows/vibe2-unity-release-result.yml"
      - ".github/workflows/public-game-health.yml"
      - ".github/workflows/company-dna-learning.yml"
      - ".github/workflows/autonomous-development-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax and deterministic unit tests
        run: |
          set -euo pipefail
          node --check tools/autonomous-development-worker.mjs
          node --check tools/autonomous-work-planner.mjs
          node --check tools/autonomous-24h-work-planner.mjs
          node --check tools/autonomous-department-cycle.mjs
          node --check tools/autonomous-department-integrator.mjs
          node --check tools/autonomous-candidate-review.mjs
          node --check tools/autonomous-vibe-release-handoff.mjs
          node --test qa/autonomous-development-worker.test.mjs
          node --test qa/autonomous-department-integrator.test.mjs
          node --test qa/autonomous-work-planner.test.mjs
          node --test qa/autonomous-24h-work-planner.test.mjs
          node --test qa/autonomous-candidate-review.test.mjs
          node --test qa/autonomous-vibe-release-handoff.test.mjs
      - name: Validate parallel code, runtime cache, final QA, release and learning contracts
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const p=require('./autonomous-portfolio.json');
          const continuous=fs.readFileSync('.github/workflows/autonomous-continuous-development.yml','utf8');
          const runtime=fs.readFileSync('.github/actions/prepare-ollama/action.yml','utf8');
          const promotion=fs.readFileSync('.github/workflows/autonomous-candidate-promotion.yml','utf8');
          const release=fs.readFileSync('.github/workflows/vibe2-candidate-release.yml','utf8');
          const unity=fs.readFileSync('.github/workflows/vibe2-unity-release-result.yml','utf8');
          const health=fs.readFileSync('.github/workflows/public-game-health.yml','utf8');
          const department=fs.readFileSync('tools/autonomous-department-cycle.mjs','utf8');
          const integrator=fs.readFileSync('tools/autonomous-department-integrator.mjs','utf8');
          const handoff=fs.readFileSync('tools/autonomous-vibe-release-handoff.mjs','utf8');
          const must=(ok,msg)=>{if(!ok)throw new Error(msg)};
          must(p.paidApi===false,'paidApi must remain false');
          must(p.continuous24hDevelopment===true,'24h development disabled');
          must(p.departmentReviewMode==='PARALLEL_INDEPENDENT','department review mode mismatch');
          must(p.departmentCodeWorkspaces==='PARALLEL_ISOLATED','parallel code workspaces missing');
          must(Array.isArray(p.departmentCodeRoles)&&p.departmentCodeRoles.join(',')==='development,graphics,qa,balance','department code role contract mismatch');
          must(p.planningCodeAuthority==='INTEGRATE_AND_ASSIGN_NOT_DIRECT_WRITE','planning code authority mismatch');
          must(p.finalIntegrationConcurrency==='SERIAL','final integration must remain serial');
          must(p.finalVerificationGate==='AUTONOMOUS_CANDIDATE_PROMOTION_INDEPENDENT_QA','final QA authority mismatch');
          must(Array.isArray(p.postReleaseFlow)&&p.postReleaseFlow.join(',')==='PUBLIC_HEALTH,COMPANY_DNA_LEARNING,ARTBOOK_MILESTONE_OR_REVISION,NEXT_DEVELOPMENT_FLOOR','post-release flow mismatch');
          must(continuous.includes('role: [planning, development, graphics, qa, balance]'),'five parallel review jobs missing');
          must(continuous.includes('role: [development, graphics, qa, balance]'),'parallel code implementation matrix missing');
          must(continuous.includes('name: code workspace (')&&continuous.includes('matrix.role'),'code workspaces not visible');
          must(continuous.includes('shared branch write: NO'),'department workspace isolation evidence missing');
          must(continuous.includes('tools/autonomous-department-integrator.mjs'),'department integrator not connected');
          must(continuous.includes('Three-way integrate isolated department code'),'three-way integration step missing');
          must(continuous.includes('AI adjusts true same-file conflict only'),'same-file conflict adjustment missing');
          must(continuous.includes('FINAL_QA_GATE=AUTONOMOUS_CANDIDATE_PROMOTION'),'single strong final QA gate missing');
          must(continuous.includes('gh workflow run autonomous-candidate-promotion.yml --ref main -f candidate_branch='),'promotion dispatch missing');
          must(continuous.includes('name: warm shared Ollama runtime cache'),'shared runtime warmup job missing');
          must(continuous.includes('uses: ./.github/actions/prepare-ollama'),'cached runtime action not connected');
          must(!continuous.includes('https://ollama.com/install.sh'),'per-job Ollama install.sh regression found');
          must(runtime.includes('actions/cache@v4'),'Ollama runtime archive cache missing');
          must(runtime.includes('ollama-linux-amd64.tar.zst'),'pinned manual runtime archive missing');
          must(runtime.includes('OLLAMA_SYSTEM_SERVICE_SETUP=SKIPPED'),'system service setup bypass evidence missing');
          must(department.includes("const CORE_ROLES=['planning','development','graphics','qa','balance']"),'department review core missing');
          must(department.includes('vibeMaySelfApprove:false')&&department.includes('vibeMayOverrideDepartments:false'),'Vibe early-stage authority guard missing');
          must(integrator.includes("mergeMode:'COMMON_BASE_THREE_WAY'")||integrator.includes("mode:'COMMON_BASE_THREE_WAY'"),'common-base merge evidence missing');
          must(integrator.includes('sameFilePolicy')&&integrator.includes('AI_RESOLVE_TRUE_CONFLICT'),'true conflict policy missing');
          must(promotion.includes('INDEPENDENT_CANDIDATE_QA=PASS')&&promotion.includes('DEV_REGRESSION=PASS'),'independent final candidate QA missing');
          must(handoff.includes('AUTONOMOUS_DEV_VERIFIED_HANDOFF'),'verified release handoff missing');
          must(release.includes('AUTONOMOUS_NEXT_FLOOR=WAITING_FOR_PUBLIC_HEALTH'),'Web release must wait for public health');
          must(release.includes('-f released_game_id=')&&release.includes('-f release_origin='),'Web post-release health context missing');
          must(health.includes('Record verified post-release Vibe learning evidence'),'post-release learning evidence missing');
          must(health.includes('gh workflow run company-dna-learning.yml'),'post-release DNA learning dispatch missing');
          must(health.includes('gh workflow run autonomous-continuous-development.yml'),'next floor must start after health result');
          must(health.includes('artbook-revision-queue.json')&&health.includes('IMPLEMENTATION_DRIFT'),'critical post-release Artbook revision path missing');
          must(unity.includes('post-release-unity')&&unity.includes('company-dna-learning.yml'),'Unity post-release learning path missing');
          const text=[continuous,runtime,promotion,release,unity,health,department,integrator,handoff].join('\n');
          must(!/OPENAI_API_KEY|ANTHROPIC_API_KEY|GROQ_API_KEY|MISTRAL_API_KEY/.test(text),'paid/external key path found');
          console.log('PARALLEL_DEPARTMENT_CODE_CONTRACT=PASS');
          console.log('CACHED_OLLAMA_RUNTIME_CONTRACT=PASS');
          console.log('SERIAL_FINAL_INTEGRATION_CONTRACT=PASS');
          console.log('FINAL_INDEPENDENT_QA_CONTRACT=PASS');
          console.log('POST_RELEASE_HEALTH_LEARNING_ARTBOOK_CONTRACT=PASS');
          NODE
