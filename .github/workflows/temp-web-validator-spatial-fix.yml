name: Temporary Web Validator Spatial Fix

on:
  push:
    branches:
      - fix/web-validator-spatial-detection
    paths:
      - '.github/workflows/temp-web-validator-spatial-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/web-validator-spatial-detection
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply spatial validator fix
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/temp-web-validator-spatial-fix.py
          node --check tools/company-development-web-gameplay-validation.mjs
          node --test qa/company-development-web-runtime.test.mjs
          git diff --check
          git diff --stat
      - name: Commit canonical fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-runtime-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tools/company-development-web-gameplay-validation.mjs qa/company-development-web-runtime.test.mjs
          git diff --cached --quiet && { echo 'no canonical diff' >&2; exit 1; }
          git commit -m 'fix(web): correct 2D spatial runtime detection'
          git push origin HEAD:fix/web-validator-spatial-detection
