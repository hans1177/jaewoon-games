name: Kick Skyline Rush Normalized Publish

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch normalized Skyline publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run 'roblox-skyline-emergency-final-publish.yml' --repo "$GITHUB_REPOSITORY" --ref main
          echo 'SKYLINE_NORMALIZED_PUBLISH_DISPATCHED=YES'
