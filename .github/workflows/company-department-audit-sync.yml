name: Company Department Audit Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '37 1 * * *'
  workflow_run:
    workflows:
      - Company Department Standards QA
      - Unity Hybrid Android Build
      - Unity Android Runtime Smoke
      - Public Game Health
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'assets/company-department-standards.js'
      - 'tools/company-department-audit-sync.mjs'
      - 'company-department-audit.json'
      - '.github/workflows/company-department-audit-sync.yml'

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: company-department-audit-sync-pr
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync main
        run: git pull --ff-only origin main

      - name: Read complete non-Vibe workflow evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/department-standards-qa.yml/runs?per_page=30" > /tmp/standards-runs.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/unity-hybrid-android-build.yml/runs?per_page=30" > /tmp/unity-build-runs.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/unity-android-runtime-smoke.yml/runs?per_page=30" > /tmp/unity-runtime-runs.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/public-game-health.yml/runs?per_page=30" > /tmp/public-health-runs.json
          node - <<'NODE'
          const fs=require('fs');
          const files=['/tmp/standards-runs.json','/tmp/unity-build-runs.json','/tmp/unity-runtime-runs.json','/tmp/public-health-runs.json'];
          const workflow_runs=[];
          for(const file of files){
            const p=JSON.parse(fs.readFileSync(file,'utf8'));
            workflow_runs.push(...(Array.isArray(p.workflow_runs)?p.workflow_runs:[]));
          }
          fs.writeFileSync('/tmp/company-actions-runs.json',JSON.stringify({workflow_runs}));
          NODE
          test -s /tmp/company-actions-runs.json

      - name: Synchronize department audit
        run: node tools/company-department-audit-sync.mjs /tmp/company-actions-runs.json

      - name: Validate seven reviews with five blocking departments
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import {
            COMPANY_DEPARTMENT_ROLES,
            COMPANY_BLOCKING_DEPARTMENT_ROLES,
            COMPANY_ADVISORY_DEPARTMENT_ROLES
          } from './assets/company-department-standards.js';
          const a=JSON.parse(fs.readFileSync('company-department-audit.json','utf8'));
          const roles=[...COMPANY_DEPARTMENT_ROLES];
          const blocking=[...COMPANY_BLOCKING_DEPARTMENT_ROLES];
          const advisory=[...COMPANY_ADVISORY_DEPARTMENT_ROLES];
          if(roles.length!==7||blocking.length!==5||advisory.length!==2)throw new Error(`department split invalid: ${roles.length}/${blocking.length}/${advisory.length}`);
          if(a.policy?.canonicalDepartmentCount!==roles.length||JSON.stringify(a.policy?.canonicalDepartments)!==JSON.stringify(roles))throw new Error('audit canonical department policy mismatch');
          if(JSON.stringify(a.policy?.blockingDepartments)!==JSON.stringify(blocking)||JSON.stringify(a.policy?.advisoryDepartments)!==JSON.stringify(advisory))throw new Error('audit blocking/advisory policy mismatch');
          if(a.policy?.advisoryDepartmentFailureBlocksProgression!==false)throw new Error('advisory departments must be non-blocking');
          for(const role of roles){
            if(!a.departments?.[role])throw new Error(`canonical audit department missing: ${role}`);
            if(Boolean(a.departments[role].blockingForProgression)!==blocking.includes(role))throw new Error(`department blocking flag mismatch: ${role}`);
          }
          const canonical=a.verification?.canonicalDepartments;
          if(canonical?.count!==roles.length||JSON.stringify(canonical?.roles)!==JSON.stringify(roles))throw new Error('audit verification canonical department mismatch');
          if(JSON.stringify(canonical?.blockingRoles)!==JSON.stringify(blocking)||JSON.stringify(canonical?.advisoryRoles)!==JSON.stringify(advisory))throw new Error('audit verification department split mismatch');
          if(a.departments?.director?.canonicalDepartmentCount!==roles.length||JSON.stringify(a.departments?.director?.canonicalDepartments)!==JSON.stringify(roles))throw new Error('director canonical department gate mismatch');
          if(JSON.stringify(a.departments?.director?.blockingDepartments)!==JSON.stringify(blocking)||JSON.stringify(a.departments?.director?.advisoryDepartments)!==JSON.stringify(advisory))throw new Error('director blocking/advisory gate mismatch');
          if(!String(a.departments?.director?.passGate||'').includes(`all ${blocking.length} blocking departments`))throw new Error('director blocking count gate is stale');
          for(const role of canonical?.missingEvidence||[]){
            const status=String(a.departments?.[role]?.status||'').toUpperCase();
            if(!status.startsWith('PENDING_')&&!status.startsWith('VERIFYING_'))throw new Error(`missing evidence was not represented as pending: ${role}`);
          }
          if((canonical?.missingAdvisoryEvidence||[]).length>0&&canonical?.blockingComplete!==true&&!(canonical?.missingBlockingEvidence||[]).length)throw new Error('advisory evidence incorrectly blocked canonical progression');
          const u=a.verification?.unityRuntimeSmoke;
          const standards=a.verification?.departmentStandardsWorkflow;
          if(standards?.latestSuccessfulRun?.runId===34305065242&&standards?.unitySmokeContractVerified!==true)throw new Error('known successful Unity smoke contract run was not recognized');
          if(a.departments?.qa?.status==='VERIFIED_UNITY_RUNTIME'){
            if(u?.successfulRuntimeEvidenceObserved!==true||!u?.latestSuccessfulRun?.runId)throw new Error('Unity QA verified without successful runtime evidence');
          }
          if(u?.successfulRuntimeEvidenceObserved!==true&&a.departments?.qa?.status==='VERIFIED_UNITY_RUNTIME')throw new Error('build-only QA verification forbidden');
          if(JSON.stringify(a.verification||{}).toLowerCase().includes('vibe'))throw new Error('Vibe evidence must not be part of non-Vibe company audit sync');
          console.log(`CANONICAL_DEPARTMENT_AUDIT_QA=${roles.length}/${roles.length}`);
          console.log(`BLOCKING_DEPARTMENT_EVIDENCE_PENDING=${(canonical?.missingBlockingEvidence||[]).join(',')||'none'}`);
          console.log(`ADVISORY_DEPARTMENT_EVIDENCE_PENDING=${(canonical?.missingAdvisoryEvidence||[]).join(',')||'none'}`);
          console.log('COMPANY_DEPARTMENT_AUDIT_SYNC_QA=PASS');
          NODE

      - name: Propose audit update through PR when changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-company-audit-sync'
          git config user.email 'actions@users.noreply.github.com'
          git add company-department-audit.json
          if git diff --cached --quiet; then
            echo 'COMPANY_DEPARTMENT_AUDIT_PR=NO_CHANGES'
            exit 0
          fi

          branch="automation/company-department-audit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$branch"
          git commit -m 'company: sync department audit evidence [skip ci]'
          git push origin "HEAD:refs/heads/$branch"

          pr_url="$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$branch" \
            --title 'company: sync department audit evidence' \
            --body "Automated seven-department audit evidence refresh. Five core departments block progression; music and intro remain advisory and never receive synthetic PASS.\n\n- workflow run: ${GITHUB_RUN_ID}\n- direct main write: NO")"
          echo "COMPANY_DEPARTMENT_AUDIT_PR=$pr_url"
          echo 'PUBLIC_MAIN_WRITE=NO'
