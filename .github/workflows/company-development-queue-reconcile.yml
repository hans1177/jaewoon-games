name: Company Development Queue Reconcile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/company-development-queue-reconcile.mjs'
      - 'tools/company-minimum-design-contract.mjs'
      - 'qa/company-development-queue-reconcile.test.mjs'
      - 'tools/design-only-promotion-sync.mjs'
      - '.github/workflows/company-design-promotion-sync.yml'
      - '.github/workflows/company-status-sync.yml'
      - '.github/workflows/company-development-queue-reconcile.yml'
      - 'game-catalog.json'
  workflow_run:
    workflows:
      - Company DESIGN_ONLY Promotion Sync
      - Company Status Sync
      - Company Seed DESIGN_ONLY Runtime
    types: [completed]

permissions:
  contents: write
  actions: write

concurrency:
  group: company-development-queue-reconcile-runtime
  cancel-in-progress: true

env:
  COMPANY_RUNTIME_BRANCH: company-runtime

jobs:
  game-primary-gate:
    runs-on: ubuntu-latest
    outputs:
      defer: ${{ steps.gate.outputs.defer }}
    steps:
      - name: Defer queue reconcile while Vibe2 game primary is active
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! queue_response="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.vibe2/queue.json?ref=vibe2-unreal-core" 2>/dev/null)"; then
            echo 'defer=true' >> "$GITHUB_OUTPUT"
            echo 'GAME_PRIMARY_GATE=DEFER_QUEUE_UNAVAILABLE'
            exit 0
          fi
          queue_json="$(jq -r '.content // empty' <<<"$queue_response" | tr -d '\n' | base64 -d 2>/dev/null || true)"
          if [ -z "$queue_json" ] || ! jq -e . >/dev/null 2>&1 <<<"$queue_json"; then
            echo 'defer=true' >> "$GITHUB_OUTPUT"
            echo 'GAME_PRIMARY_GATE=DEFER_QUEUE_INVALID'
            exit 0
          fi
          active_game_work="$(jq '[.tasks[]? | select(
            ((((.status // "") | ascii_downcase) == "queued") or (((.status // "") | ascii_downcase) == "running"))
            and (((.department // "") | ascii_downcase) == "development")
            and (((.type // "") | ascii_downcase) == "implementation"))
          ] | length' <<<"$queue_json")"
          if [ "$active_game_work" -gt 0 ]; then
            echo 'defer=true' >> "$GITHUB_OUTPUT"
            echo "GAME_PRIMARY_GATE=DEFER_ACTIVE_GAME_WORK:$active_game_work"
          else
            echo 'defer=false' >> "$GITHUB_OUTPUT"
            echo 'GAME_PRIMARY_GATE=RUN'
          fi

  reconcile:
    needs: game-primary-gate
    if: needs.game-primary-gate.outputs.defer != 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main engine
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate reconciler
        run: |
          node --check tools/company-development-queue-reconcile.mjs
          node --test qa/company-development-queue-reconcile.test.mjs

      - name: Reconcile and persist company runtime queue
        id: queue_state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-development-queue-reconcile'
          git config user.email 'development-queue@users.noreply.github.com'
          persisted=0
          changed=0
          for attempt in 1 2 3 4; do
            echo "DEVELOPMENT_QUEUE_RECONCILE_ATTEMPT=${attempt}/4"
            git fetch origin main "$COMPANY_RUNTIME_BRANCH"
            git checkout -B development-queue-reconcile-runtime "origin/$COMPANY_RUNTIME_BRANCH"
            git reset --hard "origin/$COMPANY_RUNTIME_BRANCH"
            git clean -fd
            git checkout origin/main -- tools/company-development-queue-reconcile.mjs tools/company-minimum-design-contract.mjs tools/company-selected-platform-router.mjs company-learning/platform-release-roadmap.json
            git reset -- tools/company-development-queue-reconcile.mjs tools/company-minimum-design-contract.mjs tools/company-selected-platform-router.mjs company-learning/platform-release-roadmap.json >/dev/null 2>&1 || true

            node tools/company-development-queue-reconcile.mjs

            node --input-type=module <<'NODE'
            import fs from 'node:fs';
            import {latestMinimumDesign} from './tools/company-minimum-design-contract.mjs';
            const catalog=JSON.parse(fs.readFileSync('game-catalog.json','utf8'));
            const queue=JSON.parse(fs.readFileSync('development-queue.json','utf8'));
            const active=new Set(['ACTIVE','REBUILD']);
            const candidates=(catalog.games||[]).filter(game=>String(game.productionClass||'').toUpperCase()==='DEVELOPMENT_CONFIRMED'&&active.has(String(game.lifecycleState||'ACTIVE').toUpperCase()));
            const expected=[],missingMinimum=[];
            for(const game of candidates){
              const id=String(game.id||'').trim();
              if(!id)continue;
              if(latestMinimumDesign('.',id))expected.push(id);else missingMinimum.push(id);
            }
            expected.sort();
            const actual=(queue.items||[]).map(item=>String(item.gameId||'').trim()).filter(Boolean).sort();
            if(new Set(actual).size!==actual.length)throw new Error('duplicate development queue gameId');
            if(JSON.stringify(actual)!==JSON.stringify(expected))throw new Error(`direct-native queue invariant mismatch expected=${expected.join(',')} actual=${actual.join(',')}`);
            const legacyKeys=['webPurpose','webCompanionRequired','webValidationRequired','webGameplayValidationRequired','musicValidationRequired','webSourcePath','postWebArtbookRequired','webFirstGatePassed','webSecondGateRequired'];
            for(const item of queue.items||[]){
              if(item.productionClass!=='DEVELOPMENT_CONFIRMED')throw new Error(`non-development item remains: ${item.gameId}`);
              if(item.minimumDesignContract?.pass!==true)throw new Error(`minimum design missing: ${item.gameId}`);
              const targets=new Set(item.concurrentTargetPlatforms||[]);
              if(!targets.has('ROBLOX')||!targets.has('UNITY'))throw new Error(`dual native targets missing: ${item.gameId}`);
              if(!item.platformDesignProfiles?.ROBLOX?.source||!item.platformDesignProfiles?.UNITY?.source)throw new Error(`platform profiles missing: ${item.gameId}`);
              if(String(item.currentStep||'').match(/^(WEB_|WAITING_WEB|FULL_APPROVED_SCOPE_WEB|RETURN_TO_WEB)/))throw new Error(`legacy Web step remains: ${item.gameId}`);
              for(const key of legacyKeys)if(Object.hasOwn(item,key))throw new Error(`legacy Web admission key remains: ${item.gameId}:${key}`);
              if(item.artbookTiming!=='PARALLEL_NATIVE_PRESENTATION_SUPPORT')throw new Error(`native presentation timing missing: ${item.gameId}`);
            }
            if(queue.developmentGameWipMax!==null)throw new Error('artificial global development WIP cap restored');
            console.log(`DEVELOPMENT_QUEUE_INVARIANT_COUNT=${actual.length}`);
            console.log(`DEVELOPMENT_QUEUE_MINIMUM_DESIGN_MISSING=${missingMinimum.join(',')||'NONE'}`);
            console.log('DEVELOPMENT_QUEUE_MODE=DIRECT_NATIVE_ROBLOX_UNITY');
            console.log('UNITY_WEB_QUEUE_ADMISSION_AUTHORITY=NONE');
          NODE

            git add -- development-queue.json
            git diff --cached --check
            if git diff --cached --quiet; then
              echo 'DEVELOPMENT_QUEUE_RUNTIME_CHANGE=NO'
              persisted=1
              break
            fi
            changed=1
            git commit -m 'runtime: reconcile canonical development queue [skip ci]'
            if git push origin "HEAD:refs/heads/$COMPANY_RUNTIME_BRANCH"; then
              echo 'DEVELOPMENT_QUEUE_RUNTIME_CHANGE=PERSISTED'
              persisted=1
              break
            fi
            echo 'DEVELOPMENT_QUEUE_RUNTIME_CONFLICT=RETRY'
            sleep $((attempt * 2))
          done
          test "$persisted" = 1
          queue_count="$(node -e 'const q=require("./development-queue.json");process.stdout.write(String((q.items||[]).length))')"
          echo "queue_count=$queue_count" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "DEVELOPMENT_QUEUE_RUNTIME_CHANGED=$changed"
          echo "DEVELOPMENT_QUEUE_RUNTIME_COUNT=$queue_count"

      - name: Dispatch development runtime
        if: ${{ success() && steps.queue_state.outputs.queue_count != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run company-development-confirmed-runtime.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'DEVELOPMENT_RUNTIME_DISPATCHED=YES'
