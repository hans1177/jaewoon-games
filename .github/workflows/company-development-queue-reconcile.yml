name: Company Development Queue Reconcile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/company-development-queue-reconcile.mjs'
      - 'qa/company-development-queue-reconcile.test.mjs'
      - 'tools/design-only-promotion-sync.mjs'
      - '.github/workflows/company-design-promotion-sync.yml'
      - '.github/workflows/company-status-sync.yml'
      - '.github/workflows/company-development-queue-reconcile.yml'
      - 'game-catalog.json'
  workflow_run:
    workflows:
      - Company DESIGN_ONLY Promotion Sync
      - Company Seed DESIGN_ONLY Runtime
    types: [completed]

permissions:
  contents: write
  actions: write

concurrency:
  group: company-development-queue-reconcile-runtime
  cancel-in-progress: true

env:
  COMPANY_RUNTIME_BRANCH: company-runtime

jobs:
  game-primary-gate:
    runs-on: ubuntu-latest
    outputs:
      dispatch_allowed: ${{ steps.gate.outputs.dispatch_allowed }}
    steps:
      - name: Resolve development runtime dispatch safety without blocking reconciliation
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! queue_response="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.vibe2/queue.json?ref=vibe2-unreal-core" 2>/dev/null)"; then
            echo 'dispatch_allowed=false' >> "$GITHUB_OUTPUT"
            echo 'GAME_PRIMARY_GATE=RECONCILE_ALLOWED_DISPATCH_SUPPRESSED_QUEUE_UNAVAILABLE'
            exit 0
          fi
          queue_json="$(jq -r '.content // empty' <<<"$queue_response" | tr -d '\n' | base64 -d 2>/dev/null || true)"
          if [ -z "$queue_json" ] || ! jq -e . >/dev/null 2>&1 <<<"$queue_json"; then
            echo 'dispatch_allowed=false' >> "$GITHUB_OUTPUT"
            echo 'GAME_PRIMARY_GATE=RECONCILE_ALLOWED_DISPATCH_SUPPRESSED_QUEUE_INVALID'
            exit 0
          fi
          active_game_work="$(jq '[.tasks[]? | select(
            ((((.status // "") | ascii_downcase) == "queued") or (((.status // "") | ascii_downcase) == "running"))
            and (((.department // "") | ascii_downcase) == "development")
            and (((.type // "") | ascii_downcase) == "implementation"))
          ] | length' <<<"$queue_json")"
          if [ "$active_game_work" -gt 0 ]; then
            echo 'dispatch_allowed=false' >> "$GITHUB_OUTPUT"
            echo "GAME_PRIMARY_GATE=RECONCILE_ALLOWED_DISPATCH_SUPPRESSED_ACTIVE_GAME_WORK:$active_game_work"
          else
            echo 'dispatch_allowed=true' >> "$GITHUB_OUTPUT"
            echo 'GAME_PRIMARY_GATE=RECONCILE_AND_DISPATCH_ALLOWED'
          fi

  reconcile:
    needs: game-primary-gate
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main engine
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate reconciler
        run: |
          node --check tools/company-development-queue-reconcile.mjs
          node --test qa/company-development-queue-reconcile.test.mjs

      - name: Reconcile and persist company runtime queue
        id: queue_state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-development-queue-reconcile'
          git config user.email 'development-queue@users.noreply.github.com'
          persisted=0
          changed=0
          for attempt in 1 2 3 4; do
            echo "DEVELOPMENT_QUEUE_RECONCILE_ATTEMPT=${attempt}/4"
            git fetch origin main "$COMPANY_RUNTIME_BRANCH"
            git checkout -B development-queue-reconcile-runtime "origin/$COMPANY_RUNTIME_BRANCH"
            git reset --hard "origin/$COMPANY_RUNTIME_BRANCH"
            git clean -fd
            git checkout origin/main -- tools/company-development-queue-reconcile.mjs tools/company-minimum-design-contract.mjs tools/company-selected-platform-router.mjs company-learning/platform-release-roadmap.json
            git reset -- tools/company-development-queue-reconcile.mjs tools/company-minimum-design-contract.mjs tools/company-selected-platform-router.mjs company-learning/platform-release-roadmap.json >/dev/null 2>&1 || true

            node tools/company-development-queue-reconcile.mjs

            node --input-type=module <<'NODE'
            import fs from 'node:fs';
            const queue=JSON.parse(fs.readFileSync('development-queue.json','utf8'));
            const ids=(queue.items||[]).map(item=>String(item.gameId||'').trim()).filter(Boolean);
            if(new Set(ids).size!==ids.length)throw new Error('duplicate development queue gameId');
            if(queue.routerPolicy!=='company-learning/platform-release-roadmap.json')throw new Error('machine router policy required');
            if(queue.nativeDevelopmentPolicy!=='MINIMUM_DESIGN_READY_THEN_ROBLOX_UNITY_CONCURRENT')throw new Error('direct-native queue policy required');
            if(queue.developmentGameWipMax!==null)throw new Error('internal game WIP cap forbidden');
            for(const item of queue.items||[]){
              if(item.productionClass!=='DEVELOPMENT_CONFIRMED')throw new Error(`non-development item remains: ${item.gameId}`);
              if(item.minimumDesignContract?.pass!==true)throw new Error(`minimum design missing: ${item.gameId}`);
              if(item.platformExecutionMode!=='ROBLOX_UNITY_CONCURRENT_SAME_GAME')throw new Error(`dual-native execution missing: ${item.gameId}`);
              const targets=new Set(item.concurrentTargetPlatforms||[]);
              if(!targets.has('ROBLOX')||!targets.has('UNITY'))throw new Error(`dual-native targets missing: ${item.gameId}`);
              if(!item.platformDesignProfiles?.ROBLOX?.source||!item.platformDesignProfiles?.UNITY?.source)throw new Error(`platform design profiles missing: ${item.gameId}`);
              for(const legacy of ['webValidationRequired','musicValidationRequired','webSourcePath','webPurpose','webFirstGatePassed']){
                if(Object.hasOwn(item,legacy))throw new Error(`legacy Web admission field remains: ${item.gameId}:${legacy}`);
              }
            }
            console.log(`DEVELOPMENT_QUEUE_INVARIANT_COUNT=${ids.length}`);
            console.log('DEVELOPMENT_QUEUE_DIRECT_NATIVE_INVARIANT=PASS');
            console.log('UNITY_WEB_ADMISSION_AUTHORITY=NONE');
          NODE

            git add -- development-queue.json
            git diff --cached --check
            if git diff --cached --quiet; then
              echo 'DEVELOPMENT_QUEUE_RUNTIME_CHANGE=NO'
              persisted=1
              break
            fi
            changed=1
            git commit -m 'runtime: reconcile canonical development queue [skip ci]'
            if git push origin "HEAD:refs/heads/$COMPANY_RUNTIME_BRANCH"; then
              echo 'DEVELOPMENT_QUEUE_RUNTIME_CHANGE=PERSISTED'
              persisted=1
              break
            fi
            echo 'DEVELOPMENT_QUEUE_RUNTIME_CONFLICT=RETRY'
            sleep $((attempt * 2))
          done
          test "$persisted" = 1
          queue_count="$(node -e 'const q=require("./development-queue.json");process.stdout.write(String((q.items||[]).length))')"
          echo "queue_count=$queue_count" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "DEVELOPMENT_QUEUE_RUNTIME_CHANGED=$changed"
          echo "DEVELOPMENT_QUEUE_RUNTIME_COUNT=$queue_count"

      - name: Dispatch development runtime
        if: ${{ success() && steps.queue_state.outputs.queue_count != '0' && needs.game-primary-gate.outputs.dispatch_allowed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run company-development-confirmed-runtime.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'DEVELOPMENT_RUNTIME_DISPATCHED=YES'

      - name: Record suppressed runtime dispatch
        if: ${{ success() && steps.queue_state.outputs.queue_count != '0' && needs.game-primary-gate.outputs.dispatch_allowed != 'true' }}
        run: |
          echo 'DEVELOPMENT_RUNTIME_DISPATCHED=NO'
          echo 'DEVELOPMENT_RUNTIME_DISPATCH_REASON=VIBE_GAME_PRIMARY_SAFETY'
          echo 'DEVELOPMENT_QUEUE_RECONCILIATION_PERSISTED=YES'
