name: Build Jaewoon Company APK

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-jaewoon-company-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jaewoon-company-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: jaewoon-company-debug-keystore-v1

      - name: Create signing key if missing
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Jaewoon Company,O=Jaewoon Games,C=KR" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        working-directory: android-app
        run: gradle :app:assembleRelease --stacktrace

      - name: Publish APK into website downloads
        shell: bash
        run: |
          mkdir -p downloads
          cp android-app/app/build/outputs/apk/release/app-release.apk downloads/jaewoon-company.apk
          sha256sum downloads/jaewoon-company.apk > downloads/jaewoon-company.apk.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: jaewoon-company-release-apk
          path: downloads/jaewoon-company.apk
          if-no-files-found: error

      - name: Commit published APK
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f downloads/jaewoon-company.apk downloads/jaewoon-company.apk.sha256
          if git diff --cached --quiet; then
            echo "APK unchanged"
            exit 0
          fi
          git commit -m "publish: 재운컴퍼니 release APK"
          git pull --rebase origin main
          git push origin HEAD:main
