name: Homepage Touch Controls QA
on:
  pull_request:
    branches: [main]
    paths: ['assets/homepage-enhancements.js','_worker.js','web-games/_shared/touch-controls.js','qa/homepage-touch-controls.test.mjs','.github/workflows/homepage-touch-controls-qa.yml']
  push:
    branches: [main]
    paths: ['assets/homepage-enhancements.js','_worker.js','web-games/_shared/touch-controls.js','qa/homepage-touch-controls.test.mjs','.github/workflows/homepage-touch-controls-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  touch-first-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate touch-first homepage and Web controls
        run: |
          set -euo pipefail
          node --check assets/homepage-enhancements.js
          node --check web-games/_shared/touch-controls.js
          node --check _worker.js
          node --test qa/homepage-touch-controls.test.mjs
          echo 'HOMEPAGE_TOUCH_DIRECT_LAUNCH=PASS'
          echo 'WEB_GAME_UNIVERSAL_TOUCH_STICK=PASS'
          echo 'NATIVE_JOYSTICK_DUPLICATE_GUARD=PASS'
