name: Company DEVELOPMENT_CONFIRMED Roblox Release Promotion

on:
  workflow_dispatch:
    inputs:
      game_id:
        description: Exact DEVELOPMENT_CONFIRMED Roblox gameId to publish after canonical final review
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: company-development-roblox-release-promotion-${{ inputs.game_id }}
  cancel-in-progress: false

env:
  COMPANY_RUNTIME_BRANCH: company-runtime

jobs:
  release:
    name: publish exact final-reviewed Roblox artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current canonical implementation
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
          fetch-depth: 0
          fetch-tags: false

      - name: Checkout canonical runtime state
        uses: actions/checkout@v4
        with:
          ref: company-runtime
          path: runtime
          fetch-depth: 1
          fetch-tags: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify final release promotion contract
        working-directory: main
        run: |
          set -euo pipefail
          node --test qa/company-development-roblox-release-promotion.test.mjs qa/vibe3-roblox-platform.test.mjs

      - name: Resolve exact canonical release target
        id: target
        working-directory: main
        env:
          REQUESTED_GAME_ID: ${{ inputs.game_id }}
        shell: bash
        run: |
          set -euo pipefail
          git -C ../runtime fetch --no-tags origin "$COMPANY_RUNTIME_BRANCH"
          git -C ../runtime reset --hard "origin/$COMPANY_RUNTIME_BRANCH"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const q=JSON.parse(fs.readFileSync('../runtime/development-queue.json','utf8'));
          const gameId=String(process.env.REQUESTED_GAME_ID||'').trim();
          const item=(q.items||[]).find(row=>row.gameId===gameId);
          if(!item)throw new Error(`ROBLOX_RELEASE_TARGET_NOT_FOUND:${gameId}`);
          const put=(key,value)=>fs.appendFileSync(process.env.GITHUB_OUTPUT,`${key}=${String(value??'')}\n`);
          const revision=String(item.robloxSourceCommit||'').trim();
          const artifact=String(item.robloxBuildArtifactIdentity||'').trim();
          const sourceRoot=String(item.robloxProjectPath||item.targetSourcePath||'').replace(/^\/+|\/+$/g,'');
          const artifactRunId=Number(item.robloxRuntimeEvidence?.artifactRunId||0);
          const currentRelease=item.robloxReleaseClaim===true
            &&item.robloxReleaseEvidence?.published===true
            &&item.robloxReleaseEvidence?.sourceRevision===revision
            &&item.robloxReleaseEvidence?.artifactIdentity===artifact
            &&Number(item.robloxReleaseEvidence?.versionNumber)>0;
          if(currentRelease){
            put('skip','true');put('skip_reason','already-published');
            console.log(`ROBLOX_RELEASE_ALREADY_PUBLISHED=${gameId}`);
            process.exit(0);
          }
          const multiplayerApplicable=item.robloxMultiplayerApplicable===true;
          const canonical=
            String(item.productionClass||'').toUpperCase()==='DEVELOPMENT_CONFIRMED'
            &&String(item.selectedPlatform||item.targetPlatform||'').toUpperCase()==='ROBLOX'
            &&item.robloxFinalReviewPassed===true
            &&item.robloxFailureStage==='RELEASE_PROMOTION'
            &&item.robloxFailureSignature==='ROBLOX_RELEASE_PROMOTION_PENDING'
            &&item.robloxReleaseClaim!==true
            &&item.robloxBuildOrPackagePassed===true
            &&item.robloxBuildSourceRevision===revision
            &&item.robloxBuildPreflightPassed===true
            &&item.robloxRuntimePassed===true
            &&item.robloxServerClientBoundaryPassed===true
            &&item.robloxMobileControlUiPassed===true
            &&item.robloxIndependentQaPassed===true
            &&item.robloxRegressionPassed===true
            &&item.robloxExactRevisionPassed===true
            &&(!multiplayerApplicable||item.robloxMultiplayerQaPassed===true)
            &&/^[0-9a-f]{40}$/i.test(revision)
            &&/^sha256:[0-9a-f]{64}$/i.test(artifact)
            &&sourceRoot===`roblox-games/${gameId}`
            &&Number.isInteger(artifactRunId)&&artifactRunId>0;
          if(!canonical)throw new Error(`ROBLOX_RELEASE_CANONICAL_GATE_BLOCKED:${gameId}`);
          put('skip','false');
          put('game_id',gameId);
          put('source_revision',revision);
          put('artifact_identity',artifact);
          put('artifact_run_id',artifactRunId);
          put('source_root',sourceRoot);
          console.log(`ROBLOX_RELEASE_CANONICAL_TARGET=${gameId}`);
          console.log(`ROBLOX_RELEASE_SOURCE_REVISION=${revision}`);
          console.log(`ROBLOX_RELEASE_ARTIFACT_IDENTITY=${artifact}`);
          console.log(`ROBLOX_RELEASE_ARTIFACT_RUN_ID=${artifactRunId}`);
          NODE

      - name: Verify unchanged source and assemble canonical release evidence
        if: steps.target.outputs.skip != 'true'
        working-directory: main
        env:
          GAME_ID: ${{ steps.target.outputs.game_id }}
          SOURCE_ROOT: ${{ steps.target.outputs.source_root }}
          SOURCE_REVISION: ${{ steps.target.outputs.source_revision }}
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${SOURCE_REVISION}^{commit}"
          git merge-base --is-ancestor "$SOURCE_REVISION" HEAD
          git diff --quiet "$SOURCE_REVISION" HEAD -- "$SOURCE_ROOT"
          node tools/vibe3-roblox-platform.mjs \
            --assemble-development-release-evidence \
            --queue ../runtime/development-queue.json \
            --game-id "$GAME_ID" \
            --output /tmp/roblox-development-release-evidence.json
          grep -q '"state": "PASS"' /tmp/roblox-development-release-evidence.json
          echo 'ROBLOX_RELEASE_SOURCE_UNCHANGED_FROM_FINAL_REVIEW=YES'
          echo 'ROBLOX_RELEASE_CANONICAL_EVIDENCE=PASS'
          echo 'ROBLOX_RUNTIME_RERUN=NO'
          echo 'ROBLOX_MOBILE_INDEPENDENT_QA_RERUN=NO'
          echo 'ROBLOX_REGRESSION_RERUN=NO'
          echo 'ROBLOX_MULTIPLAYER_QA_RERUN=NO'

      - name: Resolve retained immutable package by exact SHA256
        id: package
        if: steps.target.outputs.skip != 'true'
        working-directory: main
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_ID: ${{ steps.target.outputs.game_id }}
          ARTIFACT_RUN_ID: ${{ steps.target.outputs.artifact_run_id }}
          EXPECTED_ARTIFACT: ${{ steps.target.outputs.artifact_identity }}
          SOURCE_ROOT: ${{ steps.target.outputs.source_root }}
        shell: bash
        run: |
          set -euo pipefail
          name="development-roblox-package-$GAME_ID"
          root="/tmp/roblox-final-release-package"
          rm -rf "$root" "$SOURCE_ROOT/.canonical-release"
          mkdir -p "$root" "$SOURCE_ROOT/.canonical-release"
          gh run download "$ARTIFACT_RUN_ID" --repo "$GITHUB_REPOSITORY" -n "$name" -D "$root"
          mapfile -t place_files < <(find "$root" -type f \( -name '*.rbxl' -o -name '*.rbxlx' \) | sort)
          [ "${#place_files[@]}" -eq 1 ]
          place="${place_files[0]}"
          hash="$(sha256sum "$place" | awk '{print tolower($1)}')"
          expected="$(printf '%s' "$EXPECTED_ARTIFACT" | tr '[:upper:]' '[:lower:]')"
          [ "sha256:$hash" = "$expected" ]
          ext="${place##*.}"
          release_file="$SOURCE_ROOT/.canonical-release/place.$ext"
          cp "$place" "$release_file"
          copied_hash="$(sha256sum "$release_file" | awk '{print tolower($1)}')"
          [ "$copied_hash" = "$hash" ]
          printf 'place_file=%s\n' "$release_file" >> "$GITHUB_OUTPUT"
          printf 'package_sha256=%s\n' "$hash" >> "$GITHUB_OUTPUT"
          echo 'ROBLOX_RELEASE_IMMUTABLE_ARTIFACT_BIND=PASS'
          echo "ROBLOX_RELEASE_PACKAGE_SHA256=$hash"

      - name: Validate Open Cloud publish plan fail-closed
        if: steps.target.outputs.skip != 'true'
        working-directory: main
        env:
          ROBLOX_UNIVERSE_ID: ${{ secrets.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ secrets.ROBLOX_PLACE_ID }}
          SOURCE_REVISION: ${{ steps.target.outputs.source_revision }}
          PLACE_FILE: ${{ steps.package.outputs.place_file }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/vibe3-roblox-platform.mjs \
            --place-file "$PLACE_FILE" \
            --evidence /tmp/roblox-development-release-evidence.json \
            --source-revision "$SOURCE_REVISION" | tee /tmp/roblox-final-release-plan.log
          grep -q '^ROBLOX_V3_STATE=READY$' /tmp/roblox-final-release-plan.log
          echo 'ROBLOX_RELEASE_OPEN_CLOUD_PLAN=READY'

      - name: Publish exact final-reviewed package through Roblox Open Cloud
        id: publish
        if: steps.target.outputs.skip != 'true'
        working-directory: main
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ secrets.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ secrets.ROBLOX_PLACE_ID }}
          SOURCE_REVISION: ${{ steps.target.outputs.source_revision }}
          PLACE_FILE: ${{ steps.package.outputs.place_file }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/vibe3-roblox-platform.mjs \
            --place-file "$PLACE_FILE" \
            --evidence /tmp/roblox-development-release-evidence.json \
            --source-revision "$SOURCE_REVISION" \
            --execute | tee /tmp/roblox-final-release-publish.log
          grep -q '^ROBLOX_V3_STATE=PUBLISHED$' /tmp/roblox-final-release-publish.log
          version="$(sed -n 's/^ROBLOX_PUBLISHED_VERSION_NUMBER=//p' /tmp/roblox-final-release-publish.log | tail -n1)"
          [[ "$version" =~ ^[1-9][0-9]*$ ]]
          printf 'version_number=%s\n' "$version" >> "$GITHUB_OUTPUT"
          echo 'ROBLOX_RELEASE_OPEN_CLOUD_PUBLISH=PASS'

      - name: Persist proven release promotion state only
        if: steps.target.outputs.skip != 'true' && steps.publish.outcome == 'success'
        working-directory: runtime
        env:
          GAME_ID: ${{ steps.target.outputs.game_id }}
          SOURCE_REVISION: ${{ steps.target.outputs.source_revision }}
          ARTIFACT_IDENTITY: ${{ steps.target.outputs.artifact_identity }}
          ARTIFACT_RUN_ID: ${{ steps.target.outputs.artifact_run_id }}
          VERSION_NUMBER: ${{ steps.publish.outputs.version_number }}
          RELEASE_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$COMPANY_RUNTIME_BRANCH"
          git reset --hard "origin/$COMPANY_RUNTIME_BRANCH"
          node <<'NODE'
          const fs=require('fs');
          const q=JSON.parse(fs.readFileSync('development-queue.json','utf8'));
          const item=(q.items||[]).find(row=>row.gameId===process.env.GAME_ID);
          if(!item)throw new Error(`queue item missing: ${process.env.GAME_ID}`);
          const version=Number(process.env.VERSION_NUMBER);
          const artifactRunId=Number(process.env.ARTIFACT_RUN_ID);
          const releaseRunId=Number(process.env.RELEASE_RUN_ID);
          if(item.robloxSourceCommit!==process.env.SOURCE_REVISION)throw new Error('release source revision changed before persist');
          if(item.robloxBuildArtifactIdentity!==process.env.ARTIFACT_IDENTITY)throw new Error('release artifact identity changed before persist');
          if(item.robloxFinalReviewPassed!==true)throw new Error('final review no longer passed before release persist');
          if(!Number.isInteger(version)||version<=0)throw new Error('published Roblox version missing');
          const stamp=new Date().toISOString();
          item.robloxReleaseEvidence={
            version:1,
            gameId:item.gameId,
            platform:'ROBLOX',
            sourceRevision:process.env.SOURCE_REVISION,
            artifactIdentity:process.env.ARTIFACT_IDENTITY,
            artifactRunId,
            finalReviewPassed:true,
            published:true,
            versionNumber:version,
            workflowRunId:releaseRunId,
            publishedAt:stamp,
            authority:'roblox-open-cloud-final-review-release-promotion',
          };
          item.robloxReleaseClaim=true;
          item.robloxReleasePublishedAt=stamp;
          item.robloxReleaseVersionNumber=version;
          item.robloxLastSuccessfulStage='RELEASE_PROMOTION';
          item.robloxFailureStage=null;
          item.robloxFailureSignature=null;
          item.routingBlockers=(item.routingBlockers||[]).filter(value=>value!=='roblox-release-promotion-pending');
          if(item.executionEvidence){
            item.executionEvidence.lastSuccessfulStage='RELEASE_PROMOTION';
            item.executionEvidence.failureStage=null;
            item.executionEvidence.failureSignature=null;
          }
          item.updatedAt=stamp;
          q.updatedAt=stamp;
          fs.writeFileSync('development-queue.json',JSON.stringify(q,null,2)+'\n');
          console.log(`ROBLOX_RELEASE_CLAIM=${item.robloxReleaseClaim?'YES':'NO'}`);
          console.log(`ROBLOX_RELEASE_VERSION_NUMBER=${version}`);
          NODE
          git config user.name 'jaewoon-roblox-runtime'
          git config user.email 'actions@users.noreply.github.com'
          git add development-queue.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'runtime: persist proven Roblox Open Cloud release [skip ci]'
            pushed=0
            for attempt in 1 2 3; do
              if git push origin HEAD:"$COMPANY_RUNTIME_BRANCH"; then pushed=1; break; fi
              git fetch --no-tags origin "$COMPANY_RUNTIME_BRANCH"
              git rebase "origin/$COMPANY_RUNTIME_BRANCH" || { git rebase --abort || true; exit 1; }
              sleep $((attempt*2))
            done
            test "$pushed" = '1'
          fi
          echo 'ROBLOX_RELEASE_RUNTIME_PERSIST=PASS'

      - name: Release promotion summary
        if: always()
        env:
          SKIP: ${{ steps.target.outputs.skip }}
          SKIP_REASON: ${{ steps.target.outputs.skip_reason }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$SKIP" = 'true' ]; then
            echo "ROBLOX_RELEASE_PROMOTION=SKIPPED:$SKIP_REASON"
            exit 0
          fi
          [ "$PUBLISH_OUTCOME" = 'success' ]
          echo 'ROBLOX_RELEASE_PROMOTION=PASS'
          echo 'ROBLOX_RELEASE_EXACT_ARTIFACT=YES'
          echo 'ROBLOX_RELEASE_FINAL_REVIEW_REQUIRED=YES'
          echo 'ROBLOX_RUNTIME_RERUN=NO'
          echo 'ROBLOX_MOBILE_INDEPENDENT_QA_RERUN=NO'
          echo 'ROBLOX_REGRESSION_RERUN=NO'
          echo 'ROBLOX_MULTIPLAYER_QA_RERUN=NO'
