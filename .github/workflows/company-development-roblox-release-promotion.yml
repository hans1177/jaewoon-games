# FAST_MVP_INTERNAL_GATE_V2: exact package -> shared preflight -> core headless QA -> private/restricted publish
# MANUAL_RELEASE_TRIGGER: final primary-three design-art-title sync
name: Company DEVELOPMENT_CONFIRMED Roblox Private Runtime Candidate Deployment
run-name: Roblox publish · ${{ inputs.game_id || 'push' }} · ${{ github.event_name == 'workflow_dispatch' && (inputs.publish_stage || 'final') || 'sync-only' }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/company-development-roblox-release-promotion.yml'
  workflow_dispatch:
    inputs:
      game_id:
        description: Exact DEVELOPMENT_CONFIRMED Roblox gameId to publish as private/restricted internal release after canonical final review
        required: true
        type: string
      publish_stage:
        description: Final-only publish of the exact F9-passed artifact; pre-F9 validation stays local in Studio
        required: false
        default: final
        type: choice
        options:
          - final
      publish_cycle_id:
        description: Immutable F9 publish queue cycle id. Required when publish_stage=final.
        required: false
        type: string
      thumbnail_only:
        description: Sync canonical Roblox/homepage thumbnail only; do not republish the place
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

env:
  COMPANY_RUNTIME_BRANCH: company-runtime

jobs:
  release-dedupe:
    name: select one active private runtime deployment per game
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.thumbnail_only != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      run: ${{ steps.guard.outputs.run }}
    steps:
      - name: Keep only the oldest active run for this game
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_ID: ${{ inputs.game_id }}
          PUBLISH_STAGE: ${{ inputs.publish_stage || 'final' }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/company-development-roblox-release-promotion.yml/runs?per_page=100")"
          winner="$(printf '%s' "$payload" | GAME_ID="$GAME_ID" node -e "
            let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{
              const j=JSON.parse(s);
              const states=new Set(['queued','pending','in_progress','requested']);
              const title='Roblox publish · '+String(process.env.GAME_ID||'')+' · '+String(process.env.PUBLISH_STAGE||'final');
              const ids=(j.workflow_runs||[])
                .filter(r=>states.has(String(r.status||'').toLowerCase())&&String(r.display_title||'')===title)
                .map(r=>Number(r.id))
                .filter(Number.isFinite)
                .sort((a,b)=>a-b);
              process.stdout.write(ids.length?String(ids[0]):'');
            });
          ")"
          echo "ROBLOX_PRIVATE_RUNTIME_DEDUPE_WINNER=${winner:-NONE}"
          echo "ROBLOX_PRIVATE_RUNTIME_DEDUPE_CURRENT=$GITHUB_RUN_ID"
          if [ -n "$winner" ] && [ "$winner" != "$GITHUB_RUN_ID" ]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo "ROBLOX_PRIVATE_RUNTIME_DUPLICATE_SKIPPED=$GAME_ID:$GITHUB_RUN_ID:$winner"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo "ROBLOX_PRIVATE_RUNTIME_DEDUPE_PASS=$GAME_ID:$GITHUB_RUN_ID"
          fi

  release:
    name: deploy exact F0-passed Roblox artifact as private runtime candidate
    needs: release-dedupe
    if: ${{ needs.release-dedupe.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout current canonical implementation
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
          fetch-depth: 1
          fetch-tags: false
          filter: blob:none

      - name: Checkout canonical runtime state
        uses: actions/checkout@v4
        with:
          ref: company-runtime
          path: runtime
          fetch-depth: 1
          fetch-tags: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify runtime candidate deployment contract
        working-directory: main
        run: |
          set -euo pipefail
          node --test qa/company-development-roblox-release-promotion.test.mjs qa/vibe3-roblox-platform.test.mjs

      - name: Ensure game-specific private Roblox target for current publish stage
        id: dedicated_target
        continue-on-error: true
        working-directory: main
        env:
          REQUESTED_GAME_ID: ${{ inputs.game_id || '' }}
          PUBLISH_STAGE: ${{ inputs.publish_stage || 'final' }}
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_ROBLOSECURITY: ${{ secrets.ROBLOX_ROBLOSECURITY }}
          ROBLOX_SECURITY_COOKIE: ${{ secrets.ROBLOX_SECURITY_COOKIE }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ROBLOX_OPEN_CLOUD_API_KEY"
          git -C ../runtime fetch --no-tags origin "$COMPANY_RUNTIME_BRANCH"
          git -C ../runtime reset --hard "origin/$COMPANY_RUNTIME_BRANCH"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {
            createRobloxDedicatedExperience,
            configureRobloxExperience,
            ensureRobloxExperiencePrivate,
          } from './tools/company-roblox-dedicated-experience.mjs';

          const q=JSON.parse(fs.readFileSync('../runtime/development-queue.json','utf8'));
          const requested=String(process.env.REQUESTED_GAME_ID||'').trim();
          const publishStage=String(process.env.PUBLISH_STAGE||'final').trim().toLowerCase();
          if(publishStage!=='final')throw new Error('ROBLOX_PUBLISH_STAGE_FINAL_ONLY:'+publishStage);
          const pending=(q.items||[]).find(row=>
            row.robloxFoundationF0Passed===true
            &&row.robloxFailureStage==='PRIVATE_RUNTIME_CANDIDATE_DEPLOY'
            &&row.robloxFailureSignature==='ROBLOX_RUNTIME_CANDIDATE_DEPLOY_PENDING'
          );
          const gameId=requested||String(pending?.gameId||'').trim();
          const item=(q.items||[]).find(row=>row.gameId===gameId);
          if(!item){
            console.log('ROBLOX_DEDICATED_TARGET=NO_PENDING_GAME');
            process.exit(0);
          }
          const valid=v=>/^[1-9][0-9]*$/.test(String(v||'').trim());
          const current=publishStage==='final'?(item.robloxPublicationTarget||{}):(item.robloxValidationTarget||{});
          const canonicalTarget=item.robloxPublicationTarget||{};
          const validationCollision=publishStage==='validation'
            &&valid(current.universeId)&&valid(current.placeId)
            &&valid(canonicalTarget.universeId)&&valid(canonicalTarget.placeId)
            &&String(current.universeId)===String(canonicalTarget.universeId)
            &&String(current.placeId)===String(canonicalTarget.placeId);
          const dedicated=current.dedicated===true
            &&current.shared!==true
            &&valid(current.universeId)
            &&valid(current.placeId)
            &&validationCollision!==true;
          if(dedicated){
            console.log('ROBLOX_DEDICATED_TARGET_REUSE='+gameId);
            process.exit(0);
          }
          if(validationCollision)console.log('ROBLOX_VALIDATION_TARGET_COLLISION_REPAIR='+gameId);
          const cookie=String(process.env.ROBLOX_ROBLOSECURITY||process.env.ROBLOX_SECURITY_COOKIE||'').trim();
          const created=await createRobloxDedicatedExperience({
            apiKey:process.env.ROBLOX_OPEN_CLOUD_API_KEY,
            cookie,
          });
          await configureRobloxExperience({
            universeId:created.universeId,
            name:String(item.gameName||gameId),
            description:publishStage==='final'
              ?'Canonical private game build for '+String(item.gameName||gameId)+'. Content may be replaced only by exact F9-verified artifacts.'
              :'Private pre-F9 validation build for '+String(item.gameName||gameId)+'. Never used as the canonical game server target.',
            apiKey:process.env.ROBLOX_OPEN_CLOUD_API_KEY,
            cookie,
          });
          await ensureRobloxExperiencePrivate({
            universeId:created.universeId,
            apiKey:process.env.ROBLOX_OPEN_CLOUD_API_KEY,
            cookie,
          });
          const result={
            version:1,
            gameId,
            publishStage,
            universeId:String(created.universeId),
            placeId:String(created.placeId),
            dedicated:true,
            shared:false,
            private:true,
            source:'canonical-dedicated-open-cloud-bootstrap',
            createdAt:new Date().toISOString(),
          };
          fs.writeFileSync('/tmp/roblox-dedicated-target.json',JSON.stringify(result,null,2)+'\n');
          console.log('ROBLOX_DEDICATED_TARGET_CREATED='+gameId+':'+result.universeId+'/'+result.placeId);
          NODE

      - name: Persist dedicated private target reservation for current publish stage
        if: steps.dedicated_target.outcome == 'success'
        working-directory: runtime
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/roblox-dedicated-target.json || { echo 'ROBLOX_DEDICATED_TARGET_RESERVATION=REUSE_OR_NONE'; exit 0; }
          git fetch --no-tags origin "$COMPANY_RUNTIME_BRANCH"
          git reset --hard "origin/$COMPANY_RUNTIME_BRANCH"
          node <<'NODE'
          const fs=require('fs');
          const q=JSON.parse(fs.readFileSync('development-queue.json','utf8'));
          const r=JSON.parse(fs.readFileSync('/tmp/roblox-dedicated-target.json','utf8'));
          const item=(q.items||[]).find(row=>row.gameId===r.gameId);
          if(!item)throw new Error('dedicated target queue item missing: '+r.gameId);
          const stamp=new Date().toISOString();
          const targetField=r.publishStage==='final'?'robloxPublicationTarget':'robloxValidationTarget';
          const authority=r.publishStage==='final'?'roblox-canonical-publication-target':'roblox-pre-f9-validation-target';
          item[targetField]={
            version:r.publishStage==='final'?3:1,
            gameId:r.gameId,
            universeId:String(r.universeId),
            placeId:String(r.placeId),
            verified:false,
            verifiedAt:null,
            lastVerifiedAt:null,
            source:'canonical-dedicated-open-cloud-bootstrap',
            authority,
            dedicated:true,
            shared:false,
            visibilityIntent:'PRIVATE_OR_RESTRICTED_TEST_EXPERIENCE',
            internalOnly:true,
            publicDiscoveryAllowed:false,
            bootstrapState:'CREATED_PRIVATE_UNPUBLISHED',
            reservedAt:stamp,
          };
          item.robloxSharedTargetCurrent=false;
          item.robloxFastMvpSupersededBy=null;
          item.updatedAt=stamp;
          q.updatedAt=stamp;
          fs.writeFileSync('development-queue.json',JSON.stringify(q,null,2)+'\n');
          NODE
          git config user.name 'jaewoon-roblox-runtime'
          git config user.email 'actions@users.noreply.github.com'
          git add development-queue.json
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'runtime: reserve dedicated private Roblox target [skip ci]'
          pushed=0
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:"$COMPANY_RUNTIME_BRANCH"; then pushed=1; break; fi
            git fetch --no-tags origin "$COMPANY_RUNTIME_BRANCH"
            git rebase "origin/$COMPANY_RUNTIME_BRANCH" || { git rebase --abort || true; exit 1; }
            sleep $((attempt*2))
          done
          test "$pushed" = '1'
          echo 'ROBLOX_PUBLISH_STAGE_TARGET_RESERVATION=PERSISTED'

      - name: Resolve exact canonical release target
        id: target
        working-directory: main
        env:
          REQUESTED_GAME_ID: ${{ inputs.game_id || '' }}
          PUBLISH_STAGE: ${{ inputs.publish_stage || 'final' }}
          PUBLISH_CYCLE_ID: ${{ inputs.publish_cycle_id || '' }}
          OWNER_SECRET_UNIVERSE_ID: ${{ secrets.ROBLOX_UNIVERSE_ID }}
          OWNER_SECRET_PLACE_ID: ${{ secrets.ROBLOX_PLACE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          git -C ../runtime fetch --no-tags origin "$COMPANY_RUNTIME_BRANCH"
          git -C ../runtime reset --hard "origin/$COMPANY_RUNTIME_BRANCH"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const q=JSON.parse(fs.readFileSync('../runtime/development-queue.json','utf8'));
          const requestedGameId=String(process.env.REQUESTED_GAME_ID||'').trim();
          const publishStage=String(process.env.PUBLISH_STAGE||'final').trim().toLowerCase();
          if(publishStage!=='final')throw new Error('ROBLOX_PUBLISH_STAGE_FINAL_ONLY:'+publishStage);
          const pending=(q.items||[]).find(row=>
            String(row.productionClass||'').toUpperCase()==='DEVELOPMENT_CONFIRMED'
            &&row.robloxFoundationF0Passed===true
            &&row.robloxBuildPreflightPassed===true
            &&row.robloxBuildOrPackagePassed===true
            &&row.robloxFailureStage==='PRIVATE_RUNTIME_CANDIDATE_DEPLOY'
            &&row.robloxFailureSignature==='ROBLOX_RUNTIME_CANDIDATE_DEPLOY_PENDING'
          );
          const gameId=requestedGameId||String(pending?.gameId||'').trim();
          const put=(key,value)=>fs.appendFileSync(process.env.GITHUB_OUTPUT,`${key}=${String(value??'')}\n`);
          if(!gameId){
            put('skip','true');
            put('skip_reason','no-pending-runtime-candidate');
            console.log('ROBLOX_RELEASE_TARGET=NO_PENDING_GAME');
            process.exit(0);
          }
          const item=(q.items||[]).find(row=>row.gameId===gameId);
          if(!item)throw new Error(`ROBLOX_RELEASE_TARGET_NOT_FOUND:${gameId}`);
          const requestedCycleId=String(process.env.PUBLISH_CYCLE_ID||'').trim();
          const finalEntry=publishStage==='final'
            ?(item.robloxCanonicalPublishQueue||[]).find(row=>String(row?.cycleId||'')===requestedCycleId)
            :null;
          if(publishStage==='final'&&!requestedCycleId)throw new Error('ROBLOX_FINAL_PUBLISH_CYCLE_ID_REQUIRED:'+gameId);
          if(publishStage==='final'&&!finalEntry)throw new Error('ROBLOX_FINAL_PUBLISH_QUEUE_ENTRY_MISSING:'+gameId+':'+requestedCycleId);
          const revision=String(publishStage==='final'?finalEntry.sourceRevision:item.robloxSourceCommit||'').trim();
          const artifact=String(publishStage==='final'?finalEntry.artifactIdentity:item.robloxBuildArtifactIdentity||'').trim();
          const sourceRoot=String(item.robloxProjectPath||item.targetSourcePath||'').replace(/^\/+|\/+$/g,'');
          const roadmap=JSON.parse(fs.readFileSync('company-learning/platform-release-roadmap.json','utf8'));
          const ownerExcludedGameIds=new Set(roadmap.developmentSpeedExecution?.perGameFailureIsolation?.ownerExcludedGameIds||[]);
          if(publishStage==='final'&&ownerExcludedGameIds.has(gameId)){
            put('skip','true');put('skip_reason','owner-excluded-game');
            console.log('ROBLOX_SERVER_PUBLICATION=SKIPPED_OWNER_EXCLUDED');process.exit(0);
          }
          const canonicalRobloxValidationMode=String(roadmap?.roblox?.validationMode||'').trim().toUpperCase();
          const f0Evidence=publishStage==='final'?(finalEntry.f0Evidence||{}):(item.robloxFoundationF0Evidence||{});
          const f0EvidenceMode=String(f0Evidence?.validationMode||item.robloxHeadlessFastMvpEvidence?.validationMode||'').trim().toUpperCase();
          const headlessMode=canonicalRobloxValidationMode==='HEADLESS_FAST_MVP'&&f0EvidenceMode==='HEADLESS_SOURCE_PREFLIGHT_F0';
          const artifactRunId=Number(publishStage==='final'
            ?finalEntry.artifactRunId
            :(item.robloxFoundationF0Evidence?.artifactRunId||item.robloxHeadlessFastMvpEvidence?.artifactRunId||item.robloxRuntimeEvidence?.artifactRunId||0));
          const publicationTarget=publishStage==='final'?(item.robloxPublicationTarget||{}):(item.robloxValidationTarget||{});
          const currentValidationCandidate=publishStage==='validation'
            &&item.robloxRuntimeCandidateEvidence?.published===true
            &&item.robloxRuntimeCandidateEvidence?.sourceRevision===revision
            &&item.robloxRuntimeCandidateEvidence?.artifactIdentity===artifact
            &&Number(item.robloxRuntimeCandidateEvidence?.versionNumber)>0
            &&String(item.robloxRuntimeCandidateEvidence?.universeId||'')===String(publicationTarget.universeId||'')
            &&String(item.robloxRuntimeCandidateEvidence?.placeId||'')===String(publicationTarget.placeId||'');
          const canonicalEvidence=item.robloxCanonicalReleaseEvidence||{};
          const currentFinalPublish=publishStage==='final'
            &&(
              String(finalEntry?.status||'')==='PUBLISHED'
              ||(
                canonicalEvidence.published===true
                &&canonicalEvidence.sourceRevision===revision
                &&canonicalEvidence.artifactIdentity===artifact
                &&String(canonicalEvidence.universeId||'')===String(publicationTarget.universeId||'')
                &&String(canonicalEvidence.placeId||'')===String(publicationTarget.placeId||'')
              )
            );
          if(currentValidationCandidate||currentFinalPublish){
            put('skip','true');
            put('skip_reason',publishStage==='final'?'canonical-final-already-published':'runtime-validation-candidate-already-deployed');
            console.log((publishStage==='final'?'ROBLOX_CANONICAL_FINAL_ALREADY_PUBLISHED=':'ROBLOX_RUNTIME_VALIDATION_CANDIDATE_ALREADY_DEPLOYED=')+gameId);
            process.exit(0);
          }
          const commonCanonical=
            String(item.productionClass||'').toUpperCase()==='DEVELOPMENT_CONFIRMED'
            &&(
              (Array.isArray(item.concurrentTargetPlatforms)&&item.concurrentTargetPlatforms.map(value=>String(value||'').toUpperCase()).includes('ROBLOX'))
              ||Boolean(item.platformDesignProfiles?.ROBLOX)
              ||Boolean(item.targetSourcePaths?.ROBLOX)
            )
            &&item.robloxInternalReleaseReady!==true
            &&item.robloxBuildOrPackagePassed===true
            &&item.robloxBuildPreflightPassed===true
            &&item.robloxBuildSourceRevision===revision
            &&/^[0-9a-f]{40}$/i.test(revision)
            &&/^sha256:[0-9a-f]{64}$/i.test(artifact)
            &&sourceRoot===`roblox-games/${gameId}`
            &&Number.isInteger(artifactRunId)&&artifactRunId>0;
          const headlessCanonical=headlessMode
            &&item.robloxFoundationF0Passed===true
            &&item.robloxFoundationF0Evidence?.sourcePreflightPassed===true
            &&item.robloxFoundationF0Evidence?.runtimeFoundationPassed===false
            &&item.robloxFailureStage==='PRIVATE_RUNTIME_CANDIDATE_DEPLOY'
            &&item.robloxFailureSignature==='ROBLOX_RUNTIME_CANDIDATE_DEPLOY_PENDING';
          const validationCanonical=commonCanonical&&headlessCanonical;
          const validationCandidate=item.robloxRuntimeCandidateEvidence||{};
          const finalCanonical=
            publishStage==='final'
            &&String(item.productionClass||'').toUpperCase()==='DEVELOPMENT_CONFIRMED'
            &&finalEntry?.finalReviewPassed===true
            &&finalEntry?.f9ReleaseRegressionPassed===true
            &&['PENDING','RETRY_REQUIRED'].includes(String(finalEntry?.status||''))
            &&Number(finalEntry?.validationVersionNumber)>0
            &&(
              finalEntry?.internalStudioValidationOnly===true
              ||(
                /^[1-9][0-9]*$/.test(String(finalEntry?.validationUniverseId||''))
                &&/^[1-9][0-9]*$/.test(String(finalEntry?.validationPlaceId||''))
              )
            )
            &&/^[0-9a-f]{40}$/i.test(revision)
            &&/^sha256:[0-9a-f]{64}$/i.test(artifact)
            &&sourceRoot===`roblox-games/${gameId}`
            &&Number.isInteger(artifactRunId)&&artifactRunId>0;
          const canonical=publishStage==='final'?finalCanonical:validationCanonical;
          console.log(`ROBLOX_RELEASE_CANONICAL_VALIDATION_MODE=${canonicalRobloxValidationMode||'MISSING'}`);
          console.log(`ROBLOX_RELEASE_F0_EVIDENCE_MODE=${f0EvidenceMode||'MISSING'}`);
          console.log(`ROBLOX_PUBLISH_STAGE=${publishStage.toUpperCase()}`);
          console.log(`ROBLOX_RELEASE_COMMON_CANONICAL=${commonCanonical?'YES':'NO'}`);
          console.log(`ROBLOX_RELEASE_HEADLESS_CANONICAL=${headlessCanonical?'YES':'NO'}`);
          if(!canonical)throw new Error(`ROBLOX_RELEASE_CANONICAL_GATE_BLOCKED:${gameId}`);

          const validIds=(target)=>/^[1-9][0-9]*$/.test(String(target?.universeId||'').trim())&&/^[1-9][0-9]*$/.test(String(target?.placeId||'').trim());
          const persistedTarget=publishStage==='final'?(item.robloxPublicationTarget||{}):(item.robloxValidationTarget||{});
          const canonicalTarget=item.robloxPublicationTarget||{};
          const validationTargetCollision=publishStage==='validation'
            &&validIds(persistedTarget)
            &&validIds(canonicalTarget)
            &&String(persistedTarget.universeId||'')===String(canonicalTarget.universeId||'')
            &&String(persistedTarget.placeId||'')===String(canonicalTarget.placeId||'');
          if(validationTargetCollision)throw new Error('ROBLOX_VALIDATION_TARGET_COLLIDES_WITH_CANONICAL:'+gameId);
          const persistedValid=validIds(persistedTarget)
            &&persistedTarget.dedicated===true
            &&persistedTarget.shared!==true
            &&(
              persistedTarget.verified===true
              ||String(persistedTarget.bootstrapState||'').toUpperCase()==='CREATED_PRIVATE_UNPUBLISHED'
            );
          if(!persistedValid){
            throw new Error((publishStage==='final'
              ?'ROBLOX_CANONICAL_PUBLICATION_TARGET_MISSING_OR_INVALID:'
              :'ROBLOX_VALIDATION_TARGET_MISSING_OR_INVALID:')+gameId);
          }
          const candidates=[{
            source:publishStage==='final'?'company-runtime-canonical-publication-target':'company-runtime-pre-f9-validation-target',
            target:persistedTarget,
          }];
          const selected=candidates[0];
          const universeId=String(selected.target.universeId).trim();
          const placeId=String(selected.target.placeId).trim();
          const selectedUsesSharedFallback=false;
          let sharedRotation=false;
          if(selectedUsesSharedFallback){
            const occupied=(q.items||[])
              .filter(row=>{
                if(row.gameId===gameId||row.robloxSharedTargetCurrent===false)return false;
                const current=row.robloxRuntimeCandidateEvidence?.published===true
                  ?row.robloxRuntimeCandidateEvidence
                  :(row.robloxInternalReleaseEvidence?.published===true?row.robloxInternalReleaseEvidence:null);
                return current
                  &&String(current.universeId||'').trim()===universeId
                  &&String(current.placeId||'').trim()===placeId;
              })
              .sort((a,b)=>Number(b.robloxRuntimeCandidateEvidence?.versionNumber||b.robloxInternalReleaseEvidence?.versionNumber||0)
                -Number(a.robloxRuntimeCandidateEvidence?.versionNumber||a.robloxInternalReleaseEvidence?.versionNumber||0))[0];
            sharedRotation=publishStage==='validation'&&headlessCanonical===true;
            const occupiedCandidate=occupied?.robloxRuntimeCandidateEvidence||occupied?.robloxInternalReleaseEvidence||occupied?.robloxReleaseEvidence||{};
            const occupiedPlay=occupied?.robloxInternalVibePlayEvidence||{};
            const occupiedVibePlayComplete=occupiedPlay.pass===true
              &&occupiedPlay.actualPlay===true
              &&String(occupiedPlay.sourceRevision||'')===String(occupied?.robloxSourceCommit||'')
              &&String(occupiedPlay.artifactIdentity||'')===String(occupied?.robloxBuildArtifactIdentity||'')
              &&String(occupiedPlay.universeId||'')===String(occupiedCandidate.universeId||'')
              &&String(occupiedPlay.placeId||'')===String(occupiedCandidate.placeId||'')
              &&Number(occupiedPlay.versionNumber||0)>0
              &&Number(occupiedPlay.versionNumber)===Number(occupiedCandidate.versionNumber||0);
            if(occupied&&!occupiedVibePlayComplete){
              throw new Error(`ROBLOX_RELEASE_SHARED_FALLBACK_CAPACITY_BUSY:${gameId}:${occupied.gameId}`);
            }
            if(occupied&&sharedRotation)console.log(`ROBLOX_FAST_MVP_SHARED_TARGET_ROTATE=${occupied.gameId}->${gameId}`);
          }
          for(const candidate of candidates.slice(1)){
            const candidateUniverse=String(candidate.target.universeId).trim();
            const candidatePlace=String(candidate.target.placeId).trim();
            if(candidateUniverse!==universeId||candidatePlace!==placeId){
              throw new Error(`ROBLOX_RELEASE_PUBLICATION_TARGET_CONFLICT:${gameId}:${selected.source}:${candidate.source}`);
            }
          }

          put('skip','false');
          put('game_id',gameId);
          put('source_revision',revision);
          put('artifact_identity',artifact);
          put('artifact_run_id',artifactRunId);
          put('source_root',sourceRoot);
          put('universe_id',universeId);
          put('place_id',placeId);
          put('publication_target_source',selected.source);
          put('shared_rotation',sharedRotation?'true':'false');
          put('visibility_intent',String(persistedTarget.visibilityIntent||'PRIVATE_OR_RESTRICTED_TEST_EXPERIENCE'));
          put('publish_stage',publishStage);
          put('publish_cycle_id',publishStage==='final'?requestedCycleId:'');
          console.log((publishStage==='final'?'ROBLOX_CANONICAL_FINAL_TARGET=':'ROBLOX_VALIDATION_TARGET=')+gameId);
          console.log(`ROBLOX_RELEASE_SOURCE_REVISION=${revision}`);
          console.log(`ROBLOX_RELEASE_ARTIFACT_IDENTITY=${artifact}`);
          console.log(`ROBLOX_RELEASE_ARTIFACT_RUN_ID=${artifactRunId}`);
          console.log(`ROBLOX_RELEASE_UNIVERSE_ID=${universeId}`);
          console.log(`ROBLOX_RELEASE_PLACE_ID=${placeId}`);
          console.log(`ROBLOX_RELEASE_PUBLICATION_TARGET_SOURCE=${selected.source}`);
          console.log('ROBLOX_INTERNAL_RELEASE_VISIBILITY_INTENT=PRIVATE_OR_RESTRICTED_TEST_EXPERIENCE');
          NODE

      - name: Verify unchanged source and exact F0 candidate evidence
        if: steps.target.outputs.skip != 'true'
        working-directory: main
        env:
          GAME_ID: ${{ steps.target.outputs.game_id }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_ROOT: ${{ steps.target.outputs.source_root }}
          SOURCE_REVISION: ${{ steps.target.outputs.source_revision }}
          ARTIFACT_IDENTITY: ${{ steps.target.outputs.artifact_identity }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$SOURCE_REVISION"
          git cat-file -e "${SOURCE_REVISION}^{commit}"
          compare_status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$SOURCE_REVISION...$(git rev-parse HEAD)" --jq '.status')"
          [[ "$compare_status" == ahead || "$compare_status" == identical ]]
          git diff --quiet "$SOURCE_REVISION" HEAD -- "$SOURCE_ROOT"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const q=JSON.parse(fs.readFileSync('../runtime/development-queue.json','utf8'));
          const item=(q.items||[]).find(row=>row.gameId===process.env.GAME_ID);
          if(!item)throw new Error('runtime candidate queue item missing');
          const e=item.robloxFoundationF0Evidence||{};
          if(item.robloxFoundationF0Passed!==true||e.sourcePreflightPassed!==true||e.f0SourceIntegrityPassed!==true)throw new Error('ROBLOX_F0_CANDIDATE_EVIDENCE_BLOCKED');
          if(e.actualRuntimeEvidence!==false||e.runtimeFoundationPassed!==false)throw new Error('ROBLOX_F0_FALSE_RUNTIME_CLAIM');
          if(e.sourceRevision!==process.env.SOURCE_REVISION||e.artifactIdentity!==process.env.ARTIFACT_IDENTITY)throw new Error('ROBLOX_F0_EXACT_BINDING_MISMATCH');
          fs.writeFileSync('/tmp/roblox-runtime-candidate-evidence.json',JSON.stringify(e,null,2)+'\n');
          console.log('ROBLOX_F0_CANDIDATE_EVIDENCE=PASS');
          NODE

      - name: Resolve retained immutable internal-release package by exact SHA256
        id: package
        if: steps.target.outputs.skip != 'true'
        working-directory: main
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_ID: ${{ steps.target.outputs.game_id }}
          ARTIFACT_RUN_ID: ${{ steps.target.outputs.artifact_run_id }}
          EXPECTED_ARTIFACT: ${{ steps.target.outputs.artifact_identity }}
          SOURCE_ROOT: ${{ steps.target.outputs.source_root }}
        shell: bash
        run: |
          set -euo pipefail
          name="development-roblox-package-$GAME_ID"
          root="/tmp/roblox-final-release-package"
          rm -rf "$root" "$SOURCE_ROOT/.canonical-release"
          mkdir -p "$root" "$SOURCE_ROOT/.canonical-release"
          gh run download "$ARTIFACT_RUN_ID" --repo "$GITHUB_REPOSITORY" -n "$name" -D "$root"
          mapfile -t place_files < <(find "$root" -type f \( -name '*.rbxl' -o -name '*.rbxlx' \) | sort)
          [ "${#place_files[@]}" -eq 1 ]
          place="${place_files[0]}"
          hash="$(sha256sum "$place" | awk '{print tolower($1)}')"
          expected="$(printf '%s' "$EXPECTED_ARTIFACT" | tr '[:upper:]' '[:lower:]')"
          [ "sha256:$hash" = "$expected" ]
          ext="${place##*.}"
          release_file="$SOURCE_ROOT/.canonical-release/place.$ext"
          cp "$place" "$release_file"
          copied_hash="$(sha256sum "$release_file" | awk '{print tolower($1)}')"
          [ "$copied_hash" = "$hash" ]
          printf 'place_file=%s\n' "$release_file" >> "$GITHUB_OUTPUT"
          printf 'package_sha256=%s\n' "$hash" >> "$GITHUB_OUTPUT"
          echo 'ROBLOX_RELEASE_IMMUTABLE_ARTIFACT_BIND=PASS'
          echo "ROBLOX_RELEASE_PACKAGE_SHA256=$hash"

      - name: Validate private runtime candidate publish plan fail-closed
        if: steps.target.outputs.skip != 'true'
        working-directory: main
        env:
          ROBLOX_UNIVERSE_ID: ${{ steps.target.outputs.universe_id }}
          ROBLOX_PLACE_ID: ${{ steps.target.outputs.place_id }}
          SOURCE_REVISION: ${{ steps.target.outputs.source_revision }}
          ARTIFACT_IDENTITY: ${{ steps.target.outputs.artifact_identity }}
          PLACE_FILE: ${{ steps.package.outputs.place_file }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createRobloxRuntimeCandidatePublishPlan} from './tools/vibe3-roblox-platform.mjs';
          const f0=JSON.parse(fs.readFileSync('/tmp/roblox-runtime-candidate-evidence.json','utf8'));
          const plan=createRobloxRuntimeCandidatePublishPlan({
            placeFile:process.env.PLACE_FILE,
            universeId:process.env.ROBLOX_UNIVERSE_ID,
            placeId:process.env.ROBLOX_PLACE_ID,
            sourceRevision:process.env.SOURCE_REVISION,
            artifactIdentity:process.env.ARTIFACT_IDENTITY,
            f0Evidence:f0,
          });
          if(plan.executionReady!==true)throw new Error('ROBLOX_RUNTIME_CANDIDATE_PLAN_BLOCKED:'+(plan.blockedReasons||[]).join(','));
          fs.writeFileSync('/tmp/roblox-runtime-candidate-plan.json',JSON.stringify(plan,null,2)+'\n');
          console.log('ROBLOX_RUNTIME_CANDIDATE_PLAN=READY');
          console.log('ROBLOX_RUNTIME_CLAIM=NO');
          console.log('ROBLOX_INTERNAL_RELEASE_CLAIM=NO');
          NODE

      - name: Ensure Roblox universe is private before runtime candidate publish
        if: steps.target.outputs.skip != 'true'
        working-directory: main
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_ROBLOSECURITY: ${{ secrets.ROBLOX_ROBLOSECURITY }}
          ROBLOX_SECURITY_COOKIE: ${{ secrets.ROBLOX_SECURITY_COOKIE }}
          ROBLOX_UNIVERSE_ID: ${{ steps.target.outputs.universe_id }}
        shell: bash
        run: |
          set -euo pipefail
          status=/tmp/roblox-universe-status.json
          status_code="$(curl --silent --show-error --output "$status" --write-out '%{http_code}' "https://develop.roblox.com/v1/universes/$ROBLOX_UNIVERSE_ID" || true)"
          already_private=0
          if [[ "$status_code" == 200 ]]; then
            already_private="$(node - "$status" <<'NODE'
          const fs=require('fs');
          const p=process.argv[2];
          try{
            const x=JSON.parse(fs.readFileSync(p,'utf8'));
            const active=x.isActive ?? x.IsActive ?? x.isUniverseActive ?? x.IsUniverseActive;
            process.stdout.write(active===false?'1':'0');
          }catch{process.stdout.write('0');}
          NODE
            )"
          fi
          if [[ "$already_private" == 1 ]]; then
            echo 'ROBLOX_INTERNAL_RELEASE_ALREADY_PRIVATE=YES'
            echo 'ROBLOX_INTERNAL_RELEASE_PRIVATE_ENFORCEMENT=PASS'
            echo 'ROBLOX_INTERNAL_RELEASE_PUBLIC_DISCOVERY=NO'
            exit 0
          fi

          response=/tmp/roblox-deactivate-response.txt
          code=000
          if [[ -n "${ROBLOX_OPEN_CLOUD_API_KEY:-}" ]]; then
            code="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' --request POST --header "x-api-key: $ROBLOX_OPEN_CLOUD_API_KEY" "https://apis.roblox.com/legacy-develop/v1/universes/$ROBLOX_UNIVERSE_ID/deactivate")"
          fi
          if [[ "$code" != 200 && "$code" != 201 && "$code" != 204 ]]; then
            raw_cookie="${ROBLOX_ROBLOSECURITY:-${ROBLOX_SECURITY_COOKIE:-}}"
            if [[ -z "$raw_cookie" ]]; then
              cat "$response" >&2 || true
              echo "ROBLOX_INTERNAL_RELEASE_PRIVATE_ENFORCEMENT=FAILED:HTTP_$code:NO_COOKIE_FALLBACK" >&2
              exit 42
            fi
            if [[ "$raw_cookie" == *'.ROBLOSECURITY='* ]]; then cookie="$raw_cookie"; else cookie=".ROBLOSECURITY=$raw_cookie;"; fi
            csrf_headers=/tmp/roblox-deactivate-headers.txt
            : > "$csrf_headers"
            curl --silent --show-error --output /tmp/roblox-deactivate-csrf-body.txt --dump-header "$csrf_headers" --request POST --header "cookie: $cookie" "https://develop.roblox.com/v1/universes/$ROBLOX_UNIVERSE_ID/deactivate" || true
            csrf="$(awk 'BEGIN{IGNORECASE=1}/^x-csrf-token:/{sub(/\r$/,"",$2);print $2;exit}' "$csrf_headers")"
            [[ -n "$csrf" ]] || { cat /tmp/roblox-deactivate-csrf-body.txt >&2 || true; echo 'ROBLOX_INTERNAL_RELEASE_PRIVATE_ENFORCEMENT=FAILED:NO_CSRF' >&2; exit 43; }
            code="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' --request POST --header "cookie: $cookie" --header "x-csrf-token: $csrf" "https://develop.roblox.com/v1/universes/$ROBLOX_UNIVERSE_ID/deactivate")"
            echo 'ROBLOX_INTERNAL_RELEASE_PRIVATE_FALLBACK=COOKIE_CSRF'
          fi
          case "$code" in
            200|201|204) ;;
            *) cat "$response" >&2 || true; echo "ROBLOX_INTERNAL_RELEASE_PRIVATE_ENFORCEMENT=FAILED:HTTP_$code" >&2; exit 42 ;;
          esac
          verify=/tmp/roblox-universe-status-after.json
          verify_code="$(curl --silent --show-error --output "$verify" --write-out '%{http_code}' "https://develop.roblox.com/v1/universes/$ROBLOX_UNIVERSE_ID" || true)"
          if [[ "$verify_code" == 200 ]]; then
            node - "$verify" <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const active=x.isActive ?? x.IsActive ?? x.isUniverseActive ?? x.IsUniverseActive;
          if(active===true)process.exit(44);
          NODE
          fi
          echo 'ROBLOX_INTERNAL_RELEASE_PRIVATE_ENFORCEMENT=PASS'
          echo 'ROBLOX_INTERNAL_RELEASE_PUBLIC_DISCOVERY=NO'

      - name: Publish exact package to validation target or F9-verified canonical target
        id: publish
        if: steps.target.outputs.skip != 'true'
        working-directory: main
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_ID: ${{ steps.target.outputs.game_id }}
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ steps.target.outputs.universe_id }}
          ROBLOX_PLACE_ID: ${{ steps.target.outputs.place_id }}
          SOURCE_ROOT: ${{ steps.target.outputs.source_root }}
          SOURCE_REVISION: ${{ steps.target.outputs.source_revision }}
          ARTIFACT_IDENTITY: ${{ steps.target.outputs.artifact_identity }}
          PLACE_FILE: ${{ steps.package.outputs.place_file }}
        shell: bash
        run: |
          set -euo pipefail
          retry_seconds=60
          retry_window_seconds=900
          deadline=$((SECONDS+retry_window_seconds))
          attempt=0
          while true; do
            attempt=$((attempt+1))
            # Refresh both source and runtime state on every retry, including server-busy retries.
            git fetch --no-tags --depth=1 origin main
            git -C ../runtime fetch --no-tags --depth=1 origin "$COMPANY_RUNTIME_BRANCH"
            git -C ../runtime show "origin/$COMPANY_RUNTIME_BRANCH:development-queue.json" > /tmp/roblox-latest-publish-queue.json
            export PUBLISH_SOURCE_TREE="$(git rev-parse "$SOURCE_REVISION:$SOURCE_ROOT")"
            export PUBLISH_LATEST_SOURCE_TREE="$(git rev-parse "origin/main:$SOURCE_ROOT")"
            : > /tmp/roblox-final-release-publish.log
            set +e
            node --input-type=module <<'NODE' 2>&1 | tee /tmp/roblox-final-release-publish.log
          import fs from 'node:fs';
          import {createRobloxRuntimeCandidatePublishPlan,publishRobloxPlace,assertRobloxLatestPublishCandidate} from './tools/vibe3-roblox-platform.mjs';
          const latestQueue=JSON.parse(fs.readFileSync('/tmp/roblox-latest-publish-queue.json','utf8'));
          assertRobloxLatestPublishCandidate({
            item:(latestQueue.items||[]).find(row=>row.gameId===process.env.GAME_ID),
            sourceRevision:process.env.SOURCE_REVISION,
            artifactIdentity:process.env.ARTIFACT_IDENTITY,
            sourceTree:process.env.PUBLISH_SOURCE_TREE,
            latestSourceTree:process.env.PUBLISH_LATEST_SOURCE_TREE,
          });
          console.log('ROBLOX_PUBLISH_LATEST_SOURCE_AND_F9=PASS');
          const f0=JSON.parse(fs.readFileSync('/tmp/roblox-runtime-candidate-evidence.json','utf8'));
          const plan=createRobloxRuntimeCandidatePublishPlan({
            placeFile:process.env.PLACE_FILE,
            universeId:process.env.ROBLOX_UNIVERSE_ID,
            placeId:process.env.ROBLOX_PLACE_ID,
            sourceRevision:process.env.SOURCE_REVISION,
            artifactIdentity:process.env.ARTIFACT_IDENTITY,
            f0Evidence:f0,
          });
          if(plan.executionReady!==true)throw new Error(`Roblox publish blocked: ${(plan.blockedReasons||[]).join(',')}`);
          const result=await publishRobloxPlace({plan,retryDelaysMs:[]});
          console.log(`ROBLOX_V3_STATE=${result.state}`);
          console.log(`ROBLOX_PUBLISHED_VERSION_NUMBER=${result.versionNumber}`);
          NODE
            publish_status=${PIPESTATUS[0]}
            set -e
            if [ "$publish_status" -eq 0 ]; then
              grep -q '^ROBLOX_V3_STATE=PUBLISHED$' /tmp/roblox-final-release-publish.log
              version="$(sed -n 's/^ROBLOX_PUBLISHED_VERSION_NUMBER=//p' /tmp/roblox-final-release-publish.log | tail -n1)"
              [[ "$version" =~ ^[1-9][0-9]*$ ]]
              printf 'version_number=%s\n' "$version" >> "$GITHUB_OUTPUT"
              printf 'deferred=false\n' >> "$GITHUB_OUTPUT"
              if [ "${{ steps.target.outputs.publish_stage }}" = 'final' ]; then
                 echo 'ROBLOX_CANONICAL_FINAL_OPEN_CLOUD_PUBLISH=PASS'
               else
                 echo 'ROBLOX_RUNTIME_CANDIDATE_OPEN_CLOUD_PUBLISH=PASS'
               fi
              exit 0
            fi
            if ! grep -Eqi 'Roblox publish failed HTTP 409:.*(server is busy|unable to process your upload request)' /tmp/roblox-final-release-publish.log; then
              exit "$publish_status"
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              printf 'deferred=true\n' >> "$GITHUB_OUTPUT"
              echo 'ROBLOX_RUNTIME_CANDIDATE_OPEN_CLOUD_PUBLISH=REPAIR_REQUIRED'
              echo 'ROBLOX_RELEASE_AUTOMATIC_REDISPATCH=PENDING_EXISTING_RUNTIME_REPAIR'
              exit 75
            fi
            echo "ROBLOX_PUBLISH_SERVER_BUSY_ATTEMPT=$attempt;RETRY_IN_SECONDS=$retry_seconds"
            sleep "$retry_seconds"
          done

      - name: Persist publication retry requirement and kick existing runtime repair
        if: always() && steps.target.outputs.skip != 'true' && steps.publish.outcome != 'success'
        working-directory: runtime
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_ID: ${{ steps.target.outputs.game_id }}
          PUBLISH_STAGE: ${{ steps.target.outputs.publish_stage }}
          PUBLISH_CYCLE_ID: ${{ steps.target.outputs.publish_cycle_id }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-roblox-runtime'
          git config user.email 'actions@users.noreply.github.com'
          persisted=0
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin "$COMPANY_RUNTIME_BRANCH" main
            git reset --hard "origin/$COMPANY_RUNTIME_BRANCH"
            GAME_ID="$GAME_ID" PUBLISH_STAGE="$PUBLISH_STAGE" PUBLISH_CYCLE_ID="$PUBLISH_CYCLE_ID" node <<'NODE'
          const fs=require('fs');
          const q=JSON.parse(fs.readFileSync('development-queue.json','utf8'));
          const item=(q.items||[]).find(row=>row.gameId===process.env.GAME_ID);
          if(!item)throw new Error('retry queue item missing: '+process.env.GAME_ID);
          const stamp=new Date().toISOString();
          const stage=String(process.env.PUBLISH_STAGE||'final').trim().toLowerCase();
          if(stage==='final'){
            const cycle=String(process.env.PUBLISH_CYCLE_ID||'').trim();
            const queue=Array.isArray(item.robloxCanonicalPublishQueue)?item.robloxCanonicalPublishQueue:[];
            const entry=queue.find(row=>String(row?.cycleId||'')===cycle);
            if(!cycle||!entry)throw new Error('exact final publish retry cycle missing: '+cycle);
            if(entry.finalReviewPassed!==true||entry.f9ReleaseRegressionPassed!==true)throw new Error('retry cannot weaken F9 gate');
            entry.status='RETRY_REQUIRED';
            entry.attempts=Number(entry.attempts||0)+1;
            entry.lastAttemptAt=stamp;
            entry.lastFailureSignature='ROBLOX_CANONICAL_PUBLISH_REPAIR_REQUIRED';
            item.robloxCanonicalPublishQueue=queue;
            item.robloxCanonicalPublishPending=true;
            item.robloxCanonicalPublishRepairRequired=true;
            item.robloxCanonicalPublishRepairCycleId=cycle;
          }else{
            item.robloxValidationPublishRepairRequired=true;
            item.robloxValidationPublishRepairAt=stamp;
          }
          item.updatedAt=stamp;
          q.updatedAt=stamp;
          fs.writeFileSync('development-queue.json',JSON.stringify(q,null,2)+'\n');
          NODE
            git add development-queue.json
            if git diff --cached --quiet; then persisted=1; break; fi
            git commit -m "runtime: mark Roblox publication retry $GAME_ID [skip ci]"
            if git push origin HEAD:"$COMPANY_RUNTIME_BRANCH"; then persisted=1; break; fi
            sleep $((attempt*2))
          done
          test "$persisted" = 1
          gh workflow run company-development-roblox-final-review-revalidation.yml --repo "$GITHUB_REPOSITORY" --ref main -f game_id="$GAME_ID" || true
          echo "ROBLOX_RELEASE_AUTOMATIC_REDISPATCH=YES_EXISTING_F9_REPAIR:$GAME_ID:${PUBLISH_CYCLE_ID:-VALIDATION}"
          echo "ROBLOX_PUBLICATION_RETRY_BLOCKS_NEXT_EVOLUTION=NO"

      - name: Persist proven internal release state only
        if: steps.target.outputs.skip != 'true' && steps.publish.outcome == 'success' && steps.publish.outputs.deferred != 'true'
        working-directory: runtime
        env:
          GAME_ID: ${{ steps.target.outputs.game_id }}
          SOURCE_REVISION: ${{ steps.target.outputs.source_revision }}
          ARTIFACT_IDENTITY: ${{ steps.target.outputs.artifact_identity }}
          ARTIFACT_RUN_ID: ${{ steps.target.outputs.artifact_run_id }}
          UNIVERSE_ID: ${{ steps.target.outputs.universe_id }}
          PLACE_ID: ${{ steps.target.outputs.place_id }}
          PUBLICATION_TARGET_SOURCE: ${{ steps.target.outputs.publication_target_source }}
          VISIBILITY_INTENT: ${{ steps.target.outputs.visibility_intent }}
          SHARED_ROTATION: ${{ steps.target.outputs.shared_rotation }}
          VERSION_NUMBER: ${{ steps.publish.outputs.version_number }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          PUBLISH_STAGE: ${{ steps.target.outputs.publish_stage }}
          PUBLISH_CYCLE_ID: ${{ steps.target.outputs.publish_cycle_id }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-roblox-runtime'
          git config user.email 'actions@users.noreply.github.com'
          persisted=0
          for attempt in 1 2 3 4 5; do
            echo "ROBLOX_RELEASE_RUNTIME_PERSIST_OPTIMISTIC_ATTEMPT=$attempt/5"
            git fetch --no-tags origin "$COMPANY_RUNTIME_BRANCH" main
            git reset --hard "origin/$COMPANY_RUNTIME_BRANCH"
            node <<'NODE'
          const fs=require('fs');
          const q=JSON.parse(fs.readFileSync('development-queue.json','utf8'));
          const item=(q.items||[]).find(row=>row.gameId===process.env.GAME_ID);
          if(!item)throw new Error(`queue item missing: ${process.env.GAME_ID}`);
          const version=Number(process.env.VERSION_NUMBER);
          const artifactRunId=Number(process.env.ARTIFACT_RUN_ID);
          const releaseRunId=Number(process.env.RELEASE_RUN_ID);
          const publishStage=String(process.env.PUBLISH_STAGE||'final').trim().toLowerCase();
          if(publishStage!=='final')throw new Error('invalid publish stage: final only: '+publishStage);
          const publishCycleId=String(process.env.PUBLISH_CYCLE_ID||'').trim();
          const publishQueue=Array.isArray(item.robloxCanonicalPublishQueue)?item.robloxCanonicalPublishQueue:[];
          const queuedFinalEntry=publishStage==='final'
            ?publishQueue.find(row=>String(row?.cycleId||'')===publishCycleId)
            :null;
          if(publishStage==='final'&&!publishCycleId)throw new Error('final publish cycle id missing during persist');
          if(publishStage==='final'&&!queuedFinalEntry)throw new Error('final publish queue entry missing during persist: '+publishCycleId);
          const universeId=String(process.env.UNIVERSE_ID||'').trim();
          const placeId=String(process.env.PLACE_ID||'').trim();
          const targetSource=String(process.env.PUBLICATION_TARGET_SOURCE||'').trim();
          const sharedRotation=String(process.env.SHARED_ROTATION||'').trim()==='true';
          if(publishStage==='validation'){
            if(item.robloxSourceCommit!==process.env.SOURCE_REVISION)throw new Error('validation source revision changed before persist');
            if(item.robloxBuildArtifactIdentity!==process.env.ARTIFACT_IDENTITY)throw new Error('validation artifact identity changed before persist');
          }else{
            if(String(queuedFinalEntry.sourceRevision||'')!==String(process.env.SOURCE_REVISION||''))throw new Error('queued final source revision mismatch during persist');
            if(String(queuedFinalEntry.artifactIdentity||'')!==String(process.env.ARTIFACT_IDENTITY||''))throw new Error('queued final artifact identity mismatch during persist');
          }
          const finalGate=publishStage==='final'
            ?queuedFinalEntry?.finalReviewPassed===true
              &&queuedFinalEntry?.f9ReleaseRegressionPassed===true
              &&['PENDING','RETRY_REQUIRED','PUBLISHING'].includes(String(queuedFinalEntry?.status||''))
            :item.robloxFoundationF0Passed===true&&item.robloxFoundationF0Evidence?.sourcePreflightPassed===true;
          if(!finalGate)throw new Error(publishStage==='final'
            ?'immutable F9 publish queue gate no longer valid during canonical persist'
            :'F0 source preflight no longer passed before validation candidate persist');
          if(!Number.isInteger(version)||version<=0)throw new Error('published Roblox version missing');
          if(!/^[1-9][0-9]*$/.test(universeId)||!/^[1-9][0-9]*$/.test(placeId))throw new Error('published Roblox target IDs missing');
          const existingTarget=publishStage==='final'?(item.robloxPublicationTarget||{}):(item.robloxValidationTarget||{});
          const existingValid=/^[1-9][0-9]*$/.test(String(existingTarget.universeId||''))&&/^[1-9][0-9]*$/.test(String(existingTarget.placeId||''));
          if(existingValid&&(String(existingTarget.universeId)!==universeId||String(existingTarget.placeId)!==placeId))throw new Error((publishStage==='final'?'canonical Roblox publication target':'pre-F9 validation target')+' changed before persist');
          const stamp=new Date().toISOString();
          const visibilityIntent=String(process.env.VISIBILITY_INTENT||'PRIVATE_OR_RESTRICTED_TEST_EXPERIENCE');
          const preserveExistingVisibility=visibilityIntent==='PRESERVE_EXISTING_TARGET_VISIBILITY';
          if(publishStage==='final'){
            const entry=queuedFinalEntry;
            if(Number(entry.validationVersionNumber||0)<=0)throw new Error('queued F9 validation version missing during canonical persist');
            if(
              entry.internalStudioValidationOnly!==true
              &&(
                !/^[1-9][0-9]*$/.test(String(entry.validationUniverseId||''))
                ||!/^[1-9][0-9]*$/.test(String(entry.validationPlaceId||''))
              )
            )throw new Error('queued F9 validation target missing during canonical persist');
            const canonicalEvidence={
              version:2,gameId:item.gameId,platform:'ROBLOX',cycleId:publishCycleId,
              sourceRevision:process.env.SOURCE_REVISION,artifactIdentity:process.env.ARTIFACT_IDENTITY,artifactRunId,
              universeId,placeId,versionNumber:version,workflowRunId:releaseRunId,
              published:true,publishedAt:stamp,finalReviewPassed:true,f9ReleaseRegressionPassed:true,
              exactValidationCandidateVersionNumber:Number(entry.validationVersionNumber||0),
              exactValidationUniverseId:String(entry.validationUniverseId||''),exactValidationPlaceId:String(entry.validationPlaceId||''),
              releaseClaim:'INTERNAL_PLATFORM_RELEASE_AFTER_F9',publicRelease:false,f9RuntimeReplay:entry.f9RuntimeReplay===false,
              internalStudioValidationOnly:entry.internalStudioValidationOnly===true,
              authority:'roblox-open-cloud-f9-verified-canonical-publish'
            };
            entry.status='PUBLISHED';
            entry.published=true;
            entry.publishedAt=stamp;
            entry.versionNumber=version;
            entry.universeId=universeId;
            entry.placeId=placeId;
            entry.workflowRunId=releaseRunId;
            entry.attempts=Number(entry.attempts||0)+1;
            entry.lastAttemptAt=stamp;
            item.robloxCanonicalPublishQueue=publishQueue;
            item.robloxCanonicalPublishPending=publishQueue.some(row=>['PENDING','RETRY_REQUIRED','PUBLISHING'].includes(String(row?.status||'')));
            item.robloxPublicationTarget={...existingTarget,version:Number(existingTarget.version||3),gameId:item.gameId,universeId,placeId,verified:true,verifiedAt:existingTarget.verifiedAt||stamp,lastVerifiedAt:stamp,authority:'roblox-canonical-publication-target',dedicated:true,shared:false,bootstrapState:'PUBLISHED_PRIVATE'};
            item.robloxCanonicalReleaseEvidence=canonicalEvidence;
            item.robloxLastCanonicalPublishedEvidence=canonicalEvidence;
            item.robloxInternalReleasePublished=true;
            item.robloxInternalReleaseAt=stamp;
            item.robloxInternalReleaseEvidence={...canonicalEvidence};
            item.robloxReleaseEvidence={...canonicalEvidence,authority:'roblox-canonical-release-compatibility-after-f9'};
            item.robloxReleaseVersionNumber=version;
            item.robloxReleaseClaim=false;
            item.robloxReleasePublishedAt=null;
            const currentIdentityStillSame=
              String(item.robloxSourceCommit||'')===String(process.env.SOURCE_REVISION||'')
              &&String(item.robloxBuildArtifactIdentity||'')===String(process.env.ARTIFACT_IDENTITY||'');
            console.log('ROBLOX_CANONICAL_SERVER_PUBLISH_CURRENT_IDENTITY='+(currentIdentityStillSame?'YES':'NO'));
            item.updatedAt=stamp;q.updatedAt=stamp;
            fs.writeFileSync('development-queue.json',JSON.stringify(q,null,2)+'\n');
            console.log('ROBLOX_CANONICAL_FINAL_PUBLISH=PASS');
            console.log('ROBLOX_CANONICAL_FINAL_SOURCE_ARTIFACT_MATCH=YES');
            console.log('ROBLOX_CANONICAL_FINAL_VERSION='+version);
            console.log('ROBLOX_CANONICAL_FINAL_CYCLE_ID='+publishCycleId);
            console.log('ROBLOX_CANONICAL_FINAL_PERSIST_PRESERVED_CURRENT_EVOLUTION=YES');
            process.exit(0);
          }
          if(!preserveExistingVisibility&&visibilityIntent!=='PRIVATE_OR_RESTRICTED_TEST_EXPERIENCE')throw new Error('release visibility intent changed');
          if(sharedRotation){
            for(const other of q.items||[]){
              if(other.gameId===item.gameId||other.robloxSharedTargetCurrent===false)continue;
              const prior=other.robloxRuntimeCandidateEvidence?.published===true
                ?other.robloxRuntimeCandidateEvidence
                :(other.robloxInternalReleaseEvidence?.published===true?other.robloxInternalReleaseEvidence:null);
              if(prior&&String(prior.universeId||'')===universeId&&String(prior.placeId||'')===placeId){
                other.robloxSharedTargetCurrent=false;
                other.robloxFastMvpSupersededBy=item.gameId;
                if(other.robloxRuntimeCandidateEvidence&&typeof other.robloxRuntimeCandidateEvidence==='object'){
                  other.robloxRuntimeCandidateEvidence={...other.robloxRuntimeCandidateEvidence,current:false,supersededAt:stamp,supersededBy:item.gameId};
                }
                other.updatedAt=stamp;
              }
            }
          }
          item.robloxSharedTargetCurrent=true;
          item.robloxFastMvpSupersededBy=null;
          const dedicatedTarget=existingTarget.dedicated===true
            ||targetSource==='canonical-dedicated-open-cloud-bootstrap'
            ||String(existingTarget.source||'')==='canonical-dedicated-open-cloud-bootstrap'
            ||String(existingTarget.source||'')==='owner-dedicated-github-bootstrap';
          item.robloxValidationTarget={
            version:3,
            gameId:item.gameId,
            universeId,
            placeId,
            verified:true,
            verifiedAt:existingTarget.verifiedAt||stamp,
            lastVerifiedAt:stamp,
            source:existingTarget.source||targetSource||'proven-open-cloud-internal-release',
            authority:'roblox-pre-f9-validation-target',
            dedicated:dedicatedTarget,
            shared:dedicatedTarget?false:(existingTarget.shared===true),
            visibilityIntent,
            internalOnly:!preserveExistingVisibility,
            publicDiscoveryAllowed:preserveExistingVisibility?null:false,
            bootstrapState:'PUBLISHED_PRIVATE',
          };
          item.robloxRuntimeCandidateEvidence={
            version:1,
            gameId:item.gameId,
            platform:'ROBLOX',
            sourceRevision:process.env.SOURCE_REVISION,
            artifactIdentity:process.env.ARTIFACT_IDENTITY,
            artifactRunId,
            universeId,
            placeId,
            foundationF0Passed:item.robloxFoundationF0Passed===true,
            published:true,
            releaseClaim:false,
            canonicalGameTarget:false,
            validationOnly:true,
            exposure:'PRIVATE_PRE_F9_VALIDATION_CANDIDATE',
            visibilityIntent,
            versionNumber:version,
            workflowRunId:releaseRunId,
            publishedAt:stamp,
            authority:'roblox-open-cloud-pre-f9-validation-candidate',
          };
          item.robloxCanonicalPublishPending=false;
          item.robloxReleaseVersionNumber=version;
          item.robloxInternalReleaseReady=false;
          item.robloxPublicReleaseReady=false;
          item.robloxPublicRelease=false;
          item.robloxReleaseClaim=false;
          item.robloxReleasePublishedAt=null;
          item.robloxInternalReleaseEvidence=null;
          item.robloxReleaseEvidence=null;
          item.robloxFinalReviewPassed=false;
          item.robloxFinalReviewPassedAt=null;
          item.robloxF9ReleaseRegressionPassed=false;
          item.robloxF9ReleaseRegressionEvidence=null;
          item.robloxInternalVibePlayEvidence=null;
          item.robloxGameCompletionEvidence=null;
          item.robloxPlatformAdaptationEvidence=null;
          item.robloxSecurityReleaseEvidence=null;
          item.robloxPresentationCompletionEvidence=null;
          item.robloxReleaseStabilityEvidence=null;
          item.robloxPublicReleaseFinalEvidence=null;
          item.robloxPostRuntimeQaEvidence=null;
          item.robloxRuntimeEvidence=null;
          item.robloxRuntimeFoundationEvidence=null;
          item.robloxIndependentQaPassed=false;
          item.robloxIndependentQaPassedAt=null;
          item.robloxRegressionPassed=false;
          item.robloxRegressionPassedAt=null;
          item.robloxServerClientBoundaryPassed=false;
          item.robloxDatastoreRejoinPassed=false;
          item.robloxMobileControlUiPassed=false;
          item.robloxMultiplayerQaPassed=false;
          item.robloxRuntimePassedAt=null;
          item.robloxRuntimeFailedAt=null;
          item.robloxRuntimePassed=false;
          item.robloxRuntimeFoundationPassed=false;
          item.currentStep='TARGET_PLATFORM_RUNTIME_FOUNDATION';
          item.canonicalState='PRE_F9_VALIDATION_CANDIDATE_DEPLOYED';
          item.robloxLastSuccessfulStage='PRIVATE_RUNTIME_CANDIDATE_DEPLOY';
          item.robloxFailureStage='TARGET_PLATFORM_RUNTIME_FOUNDATION';
          item.robloxFailureSignature='ROBLOX_RUNTIME_FOUNDATION_PENDING';
          item.routingBlockers=['roblox-runtime-foundation-awaiting-observation'];
          if(item.executionEvidence&&String(item.executionEvidence.platform||'').toUpperCase()==='ROBLOX'){
            item.executionEvidence.lastSuccessfulStage='PRIVATE_RUNTIME_CANDIDATE_DEPLOY';
            item.executionEvidence.failureStage='TARGET_PLATFORM_RUNTIME_FOUNDATION';
            item.executionEvidence.failureSignature='ROBLOX_RUNTIME_FOUNDATION_PENDING';
          }
          item.updatedAt=stamp;
          q.updatedAt=stamp;
          fs.writeFileSync('development-queue.json',JSON.stringify(q,null,2)+'\n');
          console.log(`ROBLOX_VALIDATION_TARGET_PERSISTED=${universeId}/${placeId}`);
          console.log('ROBLOX_VALIDATION_TARGET_PUBLISH=PASS');
          console.log('ROBLOX_CANONICAL_GAME_TARGET_MUTATED=NO');
          if(preserveExistingVisibility){
            console.log('ROBLOX_FAST_MVP_TARGET_PUBLISHED=YES');
            console.log('ROBLOX_TARGET_VISIBILITY=PRESERVED');
            console.log(`ROBLOX_FAST_MVP_VERSION_NUMBER=${version}`);
            console.log('ROBLOX_NEXT_STAGE=FAST_MVP_PLAYTEST_AND_LINK_CHECK');
          }else{
            console.log('ROBLOX_RUNTIME_CANDIDATE_DEPLOYED=YES');
            console.log('ROBLOX_RELEASE_CLAIM=NO');
            console.log(`ROBLOX_INTERNAL_RELEASE_VERSION_NUMBER=${version}`);
            console.log('ROBLOX_PUBLIC_RELEASE=NO');
            console.log('ROBLOX_NEXT_STAGE=TARGET_PLATFORM_RUNTIME_FOUNDATION');
          }
          console.log(`ROBLOX_RELEASE_UNIVERSE_ID=${universeId}`);
          console.log(`ROBLOX_RELEASE_PLACE_ID=${placeId}`);
          NODE
            git add development-queue.json
            git diff --cached --check
            if git diff --cached --quiet; then
              persisted=1
              echo 'ROBLOX_RELEASE_RUNTIME_PERSIST_WRITE=NO_CHANGE'
              break
            fi
            git commit -m 'runtime: persist Roblox private runtime candidate [skip ci]'
            if git push origin HEAD:"$COMPANY_RUNTIME_BRANCH"; then
              persisted=1
              echo 'ROBLOX_RELEASE_RUNTIME_PERSIST_WRITE=PUSHED'
              break
            fi
            echo "ROBLOX_RELEASE_RUNTIME_PERSIST_CONFLICT_RETRY=$attempt"
            sleep $((attempt*2))
          done
          test "$persisted" = '1'
          echo 'ROBLOX_RELEASE_RUNTIME_PERSIST=PASS'

      - name: Dispatch existing game tester runtime foundation QA
        if: steps.target.outputs.skip != 'true' && steps.publish.outcome == 'success' && steps.publish.outputs.deferred != 'true' && steps.target.outputs.publish_stage != 'final'
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_ID: ${{ steps.target.outputs.game_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run company-development-roblox-post-runtime-qa.yml --repo "$GITHUB_REPOSITORY" --ref main -f game_id="$GAME_ID"
          echo "ROBLOX_EXISTING_TESTER_FOUNDATION_QA_DISPATCHED=$GAME_ID"

      - name: Record canonical publication result without gating evolution
        if: always() && steps.target.outputs.publish_stage == 'final'
        env:
          GAME_ID: ${{ steps.target.outputs.game_id }}
        shell: bash
        run: |
          set -euo pipefail
          echo "ROBLOX_CANONICAL_PUBLISH_RESULT_RECONCILED=$GAME_ID"
          echo 'ROBLOX_CANONICAL_PUBLISH_RESULT_BLOCKS_NEXT_CYCLE=NO'

      - name: Apply and verify Roblox title description and server size
        id: metadata
        continue-on-error: true
        if: steps.target.outputs.skip != 'true' && steps.publish.outcome == 'success' && steps.publish.outputs.deferred != 'true'
        working-directory: main
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ steps.target.outputs.universe_id }}
          ROBLOX_PLACE_ID: ${{ steps.target.outputs.place_id }}
          SOURCE_ROOT: ${{ steps.target.outputs.source_root }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const launch=JSON.parse(fs.readFileSync(`${process.env.SOURCE_ROOT}/launch-mvp.json`,'utf8'));
          const displayName=String(launch.robloxTitleKorean||launch.gameName||'').trim();
          const description=String(launch.robloxDescriptionKorean||'').trim();
          const serverSize=Number(launch.robloxServerSize||0);
          if(!displayName)throw new Error('ROBLOX_METADATA_TITLE_MISSING');

          const fields=['displayName','description'];
          const payload={displayName,description};
          if(Number.isInteger(serverSize)&&serverSize>0){fields.push('serverSize');payload.serverSize=serverSize;}

          const base=`https://apis.roblox.com/cloud/v2/universes/${process.env.ROBLOX_UNIVERSE_ID}/places/${process.env.ROBLOX_PLACE_ID}`;
          const headers={'x-api-key':process.env.ROBLOX_OPEN_CLOUD_API_KEY,'content-type':'application/json'};
          const update=await fetch(`${base}?updateMask=${encodeURIComponent(fields.join(','))}`,{
            method:'PATCH',headers,body:JSON.stringify(payload),
          });
          const updateText=await update.text();
          if(!update.ok)throw new Error(`ROBLOX_METADATA_UPDATE_FAILED:${update.status}:${updateText}`);

          const verify=await fetch(base,{headers:{'x-api-key':process.env.ROBLOX_OPEN_CLOUD_API_KEY}});
          const place=await verify.json();
          if(!verify.ok)throw new Error(`ROBLOX_METADATA_VERIFY_FAILED:${verify.status}`);
          if(String(place.displayName||'')!==displayName)throw new Error(`ROBLOX_TITLE_VERIFY_MISMATCH:${place.displayName}`);
          if(description&&String(place.description||'')!==description)throw new Error('ROBLOX_DESCRIPTION_VERIFY_MISMATCH');
          if(Number.isInteger(serverSize)&&serverSize>0&&Number(place.serverSize)!==serverSize)throw new Error(`ROBLOX_SERVER_SIZE_VERIFY_MISMATCH:${place.serverSize}`);

          console.log(`ROBLOX_EXPERIENCE_TITLE=${displayName}`);
          console.log(`ROBLOX_EXPERIENCE_DESCRIPTION_LENGTH=${description.length}`);
          if(serverSize>0)console.log(`ROBLOX_SERVER_SIZE=${serverSize}`);
          console.log('ROBLOX_EXPERIENCE_METADATA_UPDATE=PASS');
          NODE

      - name: Private runtime candidate deployment summary
        if: always()
        env:
          SKIP: ${{ steps.target.outputs.skip }}
          SKIP_REASON: ${{ steps.target.outputs.skip_reason }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          RETRY_DEFERRED: ${{ steps.publish.outputs.deferred }}
          METADATA_OUTCOME: ${{ steps.metadata.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$SKIP" = 'true' ]; then
            echo "ROBLOX_INTERNAL_RELEASE_PROMOTION=SKIPPED:$SKIP_REASON"
            exit 0
          fi
          if [ "$RETRY_DEFERRED" = 'true' ]; then
            echo 'ROBLOX_INTERNAL_RELEASE_PROMOTION=REPAIR_REQUIRED:ROBLOX_409_SERVER_BUSY'
            echo 'ROBLOX_RELEASE_RETRY_INTERVAL_SECONDS=60'
            echo 'ROBLOX_RELEASE_AUTOMATIC_REDISPATCH=YES_EXISTING_F9_REPAIR'
            echo 'ROBLOX_RUNTIME_FOUNDATION_RERUN=REQUIRED'
            echo 'ROBLOX_MOBILE_INDEPENDENT_QA_RERUN=NO'
            echo 'ROBLOX_REGRESSION_RERUN=NO'
            echo 'ROBLOX_MULTIPLAYER_QA_RERUN=NO'
            exit 0
          fi
          [ "$PUBLISH_OUTCOME" = 'success' ]
          echo 'ROBLOX_RUNTIME_CANDIDATE_DEPLOYMENT=PASS'
          echo 'ROBLOX_RUNTIME_CANDIDATE_EXACT_ARTIFACT=YES'
          echo 'ROBLOX_RUNTIME_FOUNDATION_REQUIRED=YES'
          echo 'ROBLOX_RUNTIME_FOUNDATION_RERUN=REQUIRED'
          echo 'ROBLOX_MOBILE_INDEPENDENT_QA_RERUN=NO'
          echo 'ROBLOX_REGRESSION_RERUN=NO'
          echo 'ROBLOX_MULTIPLAYER_QA_RERUN=NO'
          if [ "$METADATA_OUTCOME" = 'failure' ]; then
            echo 'ROBLOX_METADATA_SYNC=REPAIR_REQUIRED_NON_BLOCKING'
            echo 'ROBLOX_METADATA_REQUIRED_OPEN_CLOUD_SCOPE=universe.place:write'
            echo 'ROBLOX_RUNTIME_CANDIDATE_INVALIDATED_BY_METADATA_FAILURE=NO'
          else
            echo 'ROBLOX_METADATA_SYNC=PASS_OR_NOT_REQUIRED'
          fi

  thumbnail-sync:
    name: sync canonical Roblox and homepage thumbnails
    needs: release
    if: ${{ always() && (github.event_name == 'push' || inputs.thumbnail_only == true || needs.release.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current canonical implementation
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
          fetch-depth: 1
          filter: blob:none

      - name: Checkout canonical runtime state
        uses: actions/checkout@v4
        with:
          ref: company-runtime
          path: runtime
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deterministic SVG renderer
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rsvg-convert >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y librsvg2-bin
          fi
          rsvg-convert --version

      - name: Verify thumbnail sync contract
        working-directory: main
        run: |
          set -euo pipefail
          node --test qa/company-roblox-thumbnail-sync.test.mjs qa/company-homepage-runtime-propagation.test.mjs

      - name: Resolve thumbnail sync games
        id: thumbnail_games
        working-directory: main
        env:
          REQUESTED_GAME_ID: ${{ inputs.game_id || '' }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import fs from 'node:fs';
          const requested=String(process.env.REQUESTED_GAME_ID||'').trim();
          if(requested){
            console.log('game_ids='+requested);
          }else{
            const catalog=JSON.parse(fs.readFileSync('game-catalog.json','utf8'));
            const exposure=JSON.parse(fs.readFileSync('homepage-platform-exposure.json','utf8'));
            const ids=[];
            for(const row of exposure.games||[]){
              const gameId=String(row?.gameId||'').trim();
              const roblox=(row.platforms||[]).find(p=>String(p?.platform||'').toUpperCase()==='ROBLOX');
              const game=(catalog.games||[]).find(g=>String(g?.id||'')===gameId);
              const image=String(game?.canonical?.marketing?.thumbnail||game?.marketingThumbnail||'');
              if(
                roblox?.internalReleaseReady===true
                &&/^[1-9][0-9]*$/.test(String(roblox?.placeId||''))
                &&image.startsWith('assets/roblox-thumbnails/')
              ) ids.push(gameId);
            }
            console.log('game_ids='+ids.join(' '));
          }
          NODE
          game_ids="$(sed -n 's/^game_ids=//p' "$GITHUB_OUTPUT" | tail -n1)"
          test -n "$game_ids"
          echo "ROBLOX_THUMBNAIL_SYNC_GAMES=$game_ids"

      - name: Render upload and verify shared thumbnails
        id: thumbnail
        working-directory: main
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          GAME_IDS: ${{ steps.thumbnail_games.outputs.game_ids }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ROBLOX_OPEN_CLOUD_API_KEY"
          mkdir -p .tmp/roblox-thumbnail-evidence
          failures=()
          for game_id in $GAME_IDS; do
            echo "ROBLOX_THUMBNAIL_SYNC_START=$game_id"
            log_file=".tmp/roblox-thumbnail-evidence/$game_id.log"
            if node tools/company-roblox-thumbnail-sync.mjs \
              --game-id="$game_id" \
              --catalog=game-catalog.json \
              --queue=../runtime/development-queue.json \
              --output=".tmp/roblox-thumbnail-evidence/$game_id.json" 2>&1 | tee "$log_file"; then
              cat ".tmp/roblox-thumbnail-evidence/$game_id.json"
            elif grep -Eq 'ROBLOX_THUMBNAIL_UPLOAD_FAILED:403:.*Scope not authorized' "$log_file"; then
              rm -f ".tmp/roblox-thumbnail-evidence/$game_id.json"
              echo "ROBLOX_THUMBNAIL_SCOPE_403_NON_BLOCKING=$game_id"
            else
              failures+=("$game_id")
            fi
          done
          if [ "${#failures[@]}" -ne 0 ]; then
            echo "ROBLOX_THUMBNAIL_SYNC_FAILED_GAMES=${failures[*]}"
            exit 1
          fi
          echo 'ROBLOX_THUMBNAIL_BATCH_UPLOAD=PASS'

      - name: Persist verified thumbnail evidence to runtime
        working-directory: main
        env:
          GAME_IDS: ${{ steps.thumbnail_games.outputs.game_ids }}
          RUNTIME_BRANCH: company-runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/roblox-thumbnail-evidence
          shopt -s nullglob
          evidence_files=(.tmp/roblox-thumbnail-evidence/*.json)
          if [ "${#evidence_files[@]}" -gt 0 ]; then
            cp "${evidence_files[@]}" /tmp/roblox-thumbnail-evidence/
          fi
          for attempt in 1 2 3 4 5; do
            git -C ../runtime fetch --no-tags origin "$RUNTIME_BRANCH"
            git -C ../runtime reset --hard "origin/$RUNTIME_BRANCH"
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const queuePath='../runtime/development-queue.json';
          const queue=JSON.parse(fs.readFileSync(queuePath,'utf8').replace(/^\uFEFF/,''));
          let latest=queue.updatedAt||null;
          for(const gameId of String(process.env.GAME_IDS||'').trim().split(/\s+/).filter(Boolean)){
            const evidencePath='/tmp/roblox-thumbnail-evidence/'+gameId+'.json';
            if(!fs.existsSync(evidencePath)){
              console.log('ROBLOX_THUMBNAIL_EVIDENCE_SKIPPED_NON_BLOCKING='+gameId);
              continue;
            }
            const evidence=JSON.parse(fs.readFileSync(evidencePath,'utf8'));
            const item=(queue.items||[]).find(row=>String(row?.gameId||'')===gameId);
            if(!item)throw new Error('ROBLOX_THUMBNAIL_RUNTIME_ITEM_MISSING:'+gameId);
            item.robloxThumbnailEvidence=evidence;
            item.updatedAt=evidence.uploadedAt;
            if(!latest||Date.parse(evidence.uploadedAt)>Date.parse(latest))latest=evidence.uploadedAt;
          }
          queue.updatedAt=latest||new Date().toISOString();
          fs.writeFileSync(queuePath,JSON.stringify(queue,null,2)+'\n');
          NODE
            git -C ../runtime config user.name "jaewoon-roblox-thumbnail-sync"
            git -C ../runtime config user.email "roblox-thumbnail-sync@users.noreply.github.com"
            git -C ../runtime add development-queue.json
            if git -C ../runtime diff --cached --quiet; then
              echo 'ROBLOX_THUMBNAIL_RUNTIME_PERSIST=NO_CHANGE'
              exit 0
            fi
            git -C ../runtime commit -m "runtime: persist verified Roblox thumbnail evidence"
            if git -C ../runtime push origin HEAD:"$RUNTIME_BRANCH"; then
              echo 'ROBLOX_THUMBNAIL_RUNTIME_PERSIST=PASS'
              exit 0
            fi
            sleep $((attempt*2))
          done
          echo 'ROBLOX_THUMBNAIL_RUNTIME_PERSIST=FAILED'
          exit 1
