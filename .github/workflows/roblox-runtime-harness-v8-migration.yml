name: One-shot Roblox Runtime Harness V8 Migration

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: roblox-runtime-harness-v8-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          fetch-tags: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Migrate canonical Roblox runtime harness to v8
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/company-development-roblox-runtime-continuation.yml')
          test = Path('qa/company-development-roblox-runtime-continuation.test.mjs')
          w = workflow.read_text()
          t = test.read_text()
          old_w = "ROBLOX_RUNTIME_HARNESS_VERSION: '7'"
          new_w = "ROBLOX_RUNTIME_HARNESS_VERSION: '8'"
          old_t = "workflow.includes(\"ROBLOX_RUNTIME_HARNESS_VERSION: '7'\")"
          new_t = "workflow.includes(\"ROBLOX_RUNTIME_HARNESS_VERSION: '8'\")"
          if w.count(old_w) != 1:
              raise SystemExit(f'expected exactly one workflow harness v7 marker, got {w.count(old_w)}')
          if t.count(old_t) != 1:
              raise SystemExit(f'expected exactly one QA harness v7 marker, got {t.count(old_t)}')
          workflow.write_text(w.replace(old_w, new_w))
          test.write_text(t.replace(old_t, new_t))
          PY
          node --test qa/company-development-roblox-runtime-continuation.test.mjs
          git diff --check
          grep -Fq "ROBLOX_RUNTIME_HARNESS_VERSION: '8'" .github/workflows/company-development-roblox-runtime-continuation.yml
          echo 'ROBLOX_RUNTIME_HARNESS_V8_MIGRATION=PASS'
      - name: Commit v8 canonical harness
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-roblox-runtime'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/company-development-roblox-runtime-continuation.yml qa/company-development-roblox-runtime-continuation.test.mjs
          git commit -m 'fix: migrate local Roblox runtime harness to v8'
          git push origin HEAD:main
      - name: Dispatch canonical continuation on v8
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run company-development-roblox-runtime-continuation.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'ROBLOX_RUNTIME_V8_CONTINUATION_DISPATCH=YES'
