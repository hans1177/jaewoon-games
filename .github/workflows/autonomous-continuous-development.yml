name: Autonomous Continuous Development

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/autonomous-continuous-development.yml'
      - '.github/actions/prepare-ollama/action.yml'
      - '.github/workflows/autonomous-portfolio-continuation.yml'
      - '.github/workflows/autonomous-new-game-incubator.yml'
      - 'tools/autonomous-work-planner.mjs'
      - 'tools/autonomous-24h-work-planner.mjs'
      - 'tools/autonomous-department-cycle.mjs'
      - 'tools/autonomous-department-scope.mjs'
      - 'tools/autonomous-department-integrator.mjs'
      - 'tools/autonomous-diagnostics.mjs'
      - 'tools/autonomous-rule-patcher.mjs'
      - 'tools/autonomous-queue-state.mjs'
      - 'tools/autonomous-development-worker.mjs'
      - 'tools/autonomous-safe-edit.mjs'
      - 'tools/autonomous-portfolio-continuation.mjs'
      - 'tools/autonomous-new-game-incubator.mjs'
      - 'qa/autonomous-work-planner.test.mjs'
      - 'qa/autonomous-24h-work-planner.test.mjs'
      - 'qa/autonomous-department-scope.test.mjs'
      - 'qa/autonomous-diagnostics.test.mjs'
      - 'qa/autonomous-rule-patcher.test.mjs'
      - 'qa/autonomous-queue-state.test.mjs'
      - 'qa/autonomous-development-worker.test.mjs'
      - 'qa/autonomous-portfolio-continuation.test.mjs'
      - 'qa/autonomous-new-game-incubator.test.mjs'
      - 'autonomous-portfolio.json'
      - 'game-catalog.json'
      - 'public-game-health.json'
      - 'game-artbooks.json'
  schedule:
    - cron: '17 * * * *' # recovery wake-up; successful verified/released floors chain immediately
  workflow_dispatch:
    inputs:
      priority_game_id:
        description: 'Optional game slug/id handed off from a newly completed DESIGN_BASELINE artbook'
        required: false
        type: string

permissions:
  contents: write
  actions: write

# Reservation/state writes are serialized, but different reserved game roots may run their department floors in parallel.
# Only the integrated candidate/promotion path may write shared game branches.
env:
  AUTONOMOUS_LOCAL_MODEL: qwen3:1.7b
  AUTONOMOUS_MODEL_MAX_PREDICT: '2560'
  AUTONOMOUS_MODEL_CONTEXT_TOKENS: '16384'
  AUTONOMOUS_MODEL_TIMEOUT_MS: '300000'
  AUTONOMOUS_MODEL_MAX_ATTEMPTS: '2'
  AUTONOMOUS_DEPARTMENT_MAX_PREDICT: '480'
  AUTONOMOUS_DEPARTMENT_TIMEOUT_MS: '150000'
  OLLAMA_HOST: 127.0.0.1:11434
  OLLAMA_VERSION: '0.33.3'

jobs:
  prepare:
    name: prepare development floor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: autonomous-dev-writer
      cancel-in-progress: false
    outputs:
      run: ${{ steps.order.outputs.run }}
      reason: ${{ steps.order.outputs.reason }}
      game_id: ${{ steps.order.outputs.game_id }}
      game_slug: ${{ steps.order.outputs.game_slug }}
      source_path: ${{ steps.order.outputs.source_path }}
      work_date: ${{ steps.order.outputs.work_date }}
      candidate_id: ${{ steps.order.outputs.candidate_id }}
      repair_mode: ${{ steps.order.outputs.repair_mode }}
      model_calls: ${{ steps.order.outputs.model_calls }}
      reserved: ${{ steps.reserve.outputs.reserved }}
      reserved_sha: ${{ steps.reserve.outputs.reserved_sha }}
    steps:
      - name: Checkout continuous development branch
        uses: actions/checkout@v4
        with:
          ref: autonomous-dev
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync public baseline into development line without touching main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-autonomous-sync'
          git config user.email 'autonomous-sync@users.noreply.github.com'
          git fetch origin main autonomous-dev
          git merge --no-edit origin/main
          git push origin HEAD:autonomous-dev
          echo 'PUBLIC_MAIN_WRITE=NO'
          echo "DEV_BASELINE=$(git rev-parse HEAD)"

      - name: Plan next 24h artbook development floor
        env:
          AUTONOMOUS_PRIORITY_GAME_ID: ${{ github.event.inputs.priority_game_id || '' }}
        run: node tools/autonomous-24h-work-planner.mjs --output=.autonomous/work-order.json --priority-game-id="$AUTONOMOUS_PRIORITY_GAME_ID"

      - name: Bind work order
        id: order
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const o=JSON.parse(fs.readFileSync('.autonomous/work-order.json','utf8'));
          const out=process.env.GITHUB_OUTPUT;
          const line=(k,v)=>fs.appendFileSync(out,`${k}=${String(v??'').replaceAll('\n',' ')}\n`);
          line('run',o.run?'true':'false');
          line('reason',o.reason||o.selectedReason||'');
          line('repair_mode',o.repairMode||'MODEL');
          line('model_calls',Number(o.budget?.modelCalls||0));
          if(!o.run)process.exit(0);
          const candidateId=`${o.gameId}-${String(o.date||'').replaceAll('-','')}-${process.env.GITHUB_RUN_ID}`;
          line('game_id',o.gameId);
          line('game_slug',o.gameSlug);
          line('source_path',o.sourcePath);
          line('work_date',o.date);
          line('candidate_id',candidateId);
          const env=process.env.GITHUB_ENV;
          fs.appendFileSync(env,`AUTONOMOUS_GAME_ID=${o.gameId}\n`);
          fs.appendFileSync(env,`AUTONOMOUS_GAME_SLUG=${o.gameSlug}\n`);
          fs.appendFileSync(env,`AUTONOMOUS_SOURCE_PATH=${o.sourcePath}\n`);
          fs.appendFileSync(env,`AUTONOMOUS_WORK_DATE=${o.date}\n`);
          fs.appendFileSync(env,`AUTONOMOUS_SELECTED_REASON=${o.selectedReason}\n`);
          fs.appendFileSync(env,`AUTONOMOUS_REPAIR_MODE=${o.repairMode||'MODEL'}\n`);
          fs.appendFileSync(env,`AUTONOMOUS_MODEL_CALL_BUDGET=${Number(o.budget?.modelCalls||0)}\n`);
          fs.appendFileSync(env,`AUTONOMOUS_CANDIDATE_ID=${candidateId}\n`);
          const calls=Number(o.budget?.modelCalls),max=Number(o.budget?.maxModelCalls);
          if(o.budget?.paidApi!==false||!Number.isInteger(calls)||calls<0||calls>max||max<0||max>2)throw new Error('free budget work-order gate failed');
          if((o.repairMode==='RULE_PATCH'&&calls!==0)||(o.repairMode!=='RULE_PATCH'&&calls<1))throw new Error('repair/model budget mismatch');
          NODE

      - name: Stop cleanly when no actionable floor exists now
        if: steps.order.outputs.run != 'true'
        run: |
          echo 'AUTONOMOUS_WORK=NO_ACTIONABLE_FLOOR_NOW'
          echo 'QUEUE_STOP_REASON=${{ steps.order.outputs.reason }}'
          echo 'HOURLY_RECOVERY_WAKEUP=ENABLED'

      - name: Deterministic planner, diagnostics, integration, queue, budget and worker tests
        if: steps.order.outputs.run == 'true'
        run: |
          node --check tools/autonomous-department-cycle.mjs
          node --check tools/autonomous-department-scope.mjs
          node --check tools/autonomous-department-integrator.mjs
          node --test qa/autonomous-work-planner.test.mjs
          node --test qa/autonomous-24h-work-planner.test.mjs
          node --test qa/autonomous-department-scope.test.mjs
          node --test qa/autonomous-diagnostics.test.mjs
          node --test qa/autonomous-rule-patcher.test.mjs
          node --test qa/autonomous-queue-state.test.mjs
          node --test qa/free-budget-telemetry.test.mjs
          node --test qa/autonomous-development-worker.test.mjs

      - name: Verified free budget preflight
        if: steps.order.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node tools/free-budget-telemetry.mjs \
            --verify-public-repo=true \
            --runner=ubuntu-latest \
            --model-calls="${{ steps.order.outputs.model_calls }}" \
            --runner-minutes=20 \
            --output=.autonomous/free-budget-telemetry.json
          echo 'FREE_BUDGET_PREFLIGHT=PASS'
          echo 'ACTIONS_QUOTA_MODE=UNMETERED_FREE'

      - name: Reserve this development floor
        id: reserve
        if: steps.order.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source_before="$(git rev-parse HEAD)"
          node tools/autonomous-queue-state.mjs \
            --state=.autonomous/queue-state.json \
            --date="$AUTONOMOUS_WORK_DATE" \
            --game-id="$AUTONOMOUS_GAME_ID" \
            --game-slug="$AUTONOMOUS_GAME_SLUG" \
            --source-path="$AUTONOMOUS_SOURCE_PATH" \
            --reason="$AUTONOMOUS_SELECTED_REASON" \
            --run-id="$GITHUB_RUN_ID" \
            --source-commit="$source_before"
          git config user.name 'jaewoon-autonomous-queue'
          git config user.email 'autonomous-queue@users.noreply.github.com'
          git add .autonomous/queue-state.json
          git commit -m "autonomy: reserve ${AUTONOMOUS_GAME_ID} floor ${AUTONOMOUS_WORK_DATE} [skip ci]"
          git push origin HEAD:autonomous-dev
          reserved_sha="$(git rev-parse HEAD)"
          echo 'QUEUE_RESERVATION=PASS'
          echo 'reserved=true' >> "$GITHUB_OUTPUT"
          echo "reserved_sha=$reserved_sha" >> "$GITHUB_OUTPUT"

      - name: Upload immutable floor context
        if: steps.order.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-floor-context-${{ github.run_id }}
          path: |
            .autonomous/work-order.json
            .autonomous/free-budget-telemetry.json
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

      - name: Prepare summary
        if: always()
        run: |
          echo '### Autonomous floor preparation' >> "$GITHUB_STEP_SUMMARY"
          echo '- game floor scheduling: PARALLEL_BY_SOURCE_ROOT' >> "$GITHUB_STEP_SUMMARY"
          echo '- reservation writer: SERIAL_ONLY' >> "$GITHUB_STEP_SUMMARY"
          echo '- local model runtime: PINNED_CACHE_THEN_REUSE' >> "$GITHUB_STEP_SUMMARY"
          echo '- department review: PARALLEL_5' >> "$GITHUB_STEP_SUMMARY"
          echo '- department code workspaces: PARALLEL_ISOLATED_4' >> "$GITHUB_STEP_SUMMARY"
          echo '- planning: integration/ownership authority, no direct source overwrite' >> "$GITHUB_STEP_SUMMARY"
          echo '- shared branch write: FINAL_INTEGRATION_ONLY' >> "$GITHUB_STEP_SUMMARY"

  fanout:
    name: fill another free game floor
    needs: prepare
    if: needs.prepare.outputs.reserved == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch next free source-root planner
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gh workflow run autonomous-continuous-development.yml --repo "$GITHUB_REPOSITORY" --ref main; then
              echo 'PARALLEL_FANOUT_NEXT=DISPATCHED'
              echo 'SAME_SOURCE_ROOT_DUPLICATION=LEASE_BLOCKED'
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

  ollama_runtime:
    name: warm shared Ollama runtime cache
    needs: prepare
    if: needs.prepare.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout reserved development evidence
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.reserved_sha }}
          fetch-depth: 1
      - name: Warm pinned local runtime cache once per floor
        uses: ./.github/actions/prepare-ollama
        with:
          model: ${{ env.AUTONOMOUS_LOCAL_MODEL }}
          version: ${{ env.OLLAMA_VERSION }}
          pull-model: 'false'
      - name: Runtime cache summary
        run: |
          echo 'OLLAMA_RUNTIME_WARMUP=PASS'
          echo 'OLLAMA_INSTALL_SH_PER_EMPLOYEE=NO'

  departments:
    name: department (${{ matrix.role }})
    needs: [prepare, ollama_runtime]
    if: needs.prepare.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        role: [planning, development, graphics, qa, balance]
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout reserved development evidence
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.reserved_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore immutable floor context
        uses: actions/download-artifact@v4
        with:
          name: autonomous-floor-context-${{ github.run_id }}
          path: .autonomous
      - name: Restore cached local Ollama runtime
        uses: ./.github/actions/prepare-ollama
        with:
          model: ${{ env.AUTONOMOUS_LOCAL_MODEL }}
          version: ${{ env.OLLAMA_VERSION }}
          department-role: ${{ matrix.role }}
      - name: Mark independent department active
        run: echo 'DEPARTMENT_WORK_STATE=ACTIVE'
      - name: Independent department review
        env:
          AUTONOMOUS_CANDIDATE_ID: ${{ needs.prepare.outputs.candidate_id }}
          AUTONOMOUS_DEPARTMENT_ROLE: ${{ matrix.role }}
          AUTONOMOUS_DEPARTMENT_OUTPUT: department-results/${{ matrix.role }}.json
        run: node tools/autonomous-department-cycle.mjs
      - name: Upload department-owned review
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-department-${{ matrix.role }}-${{ github.run_id }}
          path: department-results/${{ matrix.role }}.json
          retention-days: 1
          if-no-files-found: error
      - name: Department state summary
        if: always()
        run: |
          echo '### ${{ matrix.role }} department review' >> "$GITHUB_STEP_SUMMARY"
          echo '- queue item: ${{ needs.prepare.outputs.candidate_id }}' >> "$GITHUB_STEP_SUMMARY"
          echo '- queued=WAITING / in_progress=ACTIVE / failure=BLOCKED / success=DONE' >> "$GITHUB_STEP_SUMMARY"

  planning_final:
    name: department (planning-final)
    needs: [prepare, departments]
    if: needs.prepare.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout reserved development evidence
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.reserved_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore immutable floor context
        uses: actions/download-artifact@v4
        with:
          name: autonomous-floor-context-${{ github.run_id }}
          path: .autonomous
      - name: Restore all five independent department results
        uses: actions/download-artifact@v4
        with:
          pattern: autonomous-department-*-${{ github.run_id }}
          path: department-results
          merge-multiple: true
      - name: Verify five department handoffs
        shell: bash
        run: |
          set -euo pipefail
          for role in planning development graphics qa balance; do test -s "department-results/${role}.json"; done
          echo 'DEPARTMENT_HANDOFFS=5/5'
      - name: Restore cached local Ollama runtime for planning integration
        uses: ./.github/actions/prepare-ollama
        with:
          model: ${{ env.AUTONOMOUS_LOCAL_MODEL }}
          version: ${{ env.OLLAMA_VERSION }}
      - name: Planning integrates independent department handoffs
        env:
          AUTONOMOUS_CANDIDATE_ID: ${{ needs.prepare.outputs.candidate_id }}
          AUTONOMOUS_DEPARTMENT_FINALIZE: 'true'
          AUTONOMOUS_DEPARTMENT_RESULTS_DIR: department-results
          AUTONOMOUS_DEPARTMENT_CYCLE_OUTPUT: department-cycle.json
        run: node tools/autonomous-department-cycle.mjs
      - name: Upload integrated department cycle
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-department-cycle-${{ github.run_id }}
          path: department-cycle.json
          retention-days: 1
          if-no-files-found: error

  implementations:
    name: code workspace (${{ matrix.role }})
    needs: [prepare, planning_final]
    if: needs.prepare.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        role: [development, graphics, qa, balance]
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Checkout immutable reserved baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.reserved_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore immutable floor context
        uses: actions/download-artifact@v4
        with:
          name: autonomous-floor-context-${{ github.run_id }}
          path: .autonomous
      - name: Restore planning-integrated constraints
        uses: actions/download-artifact@v4
        with:
          name: autonomous-department-cycle-${{ github.run_id }}
          path: .
      - name: Bind department functional code scope
        id: scope
        env:
          ROLE: ${{ matrix.role }}
          BASE_CANDIDATE_ID: ${{ needs.prepare.outputs.candidate_id }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/autonomous-department-scope.mjs
          echo "DEPARTMENT_CODE_SCOPE=${{ matrix.role }}:${{ steps.scope.outputs.scope }}"
          echo "DEPARTMENT_SCOPE_REASON=${{ steps.scope.outputs.scope_reason }}"
      - name: Restore cached local Ollama runtime for department implementation
        if: steps.scope.outputs.run == 'true' && steps.scope.outputs.repair_mode != 'RULE_PATCH'
        uses: ./.github/actions/prepare-ollama
        with:
          model: ${{ env.AUTONOMOUS_LOCAL_MODEL }}
          version: ${{ env.OLLAMA_VERSION }}
      - name: Department-owned isolated code modification
        if: steps.scope.outputs.run == 'true'
        run: node tools/autonomous-development-worker.mjs
      - name: Package isolated implementation
        if: always()
        env:
          ROLE: ${{ matrix.role }}
          SHOULD_RUN: ${{ steps.scope.outputs.run }}
          OWNED_SCOPE: ${{ steps.scope.outputs.scope }}
          ROLE_CANDIDATE_ID: ${{ steps.scope.outputs.candidate_id }}
        shell: bash
        run: |
          set -euo pipefail
          root="department-implementations/$ROLE"
          mkdir -p "$root"
          if [ "$SHOULD_RUN" = 'true' ]; then
            evidence=".autonomous/evidence/${ROLE_CANDIDATE_ID}.json"
            candidate="web-games/.autonomous-candidates/${{ needs.prepare.outputs.game_id }}/${ROLE_CANDIDATE_ID}"
            test -s "$evidence" && test -d "$candidate"
            cp "$evidence" "$root/evidence.json"
            cp -R "$candidate" "$root/game"
            ROLE="$ROLE" OWNED_SCOPE="$OWNED_SCOPE" node <<'NODE'
            const fs=require('fs');
            const root=`department-implementations/${process.env.ROLE}`;
            const e=JSON.parse(fs.readFileSync(`${root}/evidence.json`,'utf8'));
            const scope=String(process.env.OWNED_SCOPE||'').split(',').filter(Boolean);
            if(scope.length&&e.changedFiles.some(x=>!scope.includes(x)))throw new Error('department changed outside owned scope');
            fs.writeFileSync(`${root}/status.json`,JSON.stringify({role:process.env.ROLE,status:'PASS',scope,candidateId:e.candidateId,changedFiles:e.changedFiles},null,2)+'\n');
            NODE
          else
            ROLE="$ROLE" node <<'NODE'
            const fs=require('fs');const root=`department-implementations/${process.env.ROLE}`;
            fs.writeFileSync(`${root}/status.json`,JSON.stringify({role:process.env.ROLE,status:'NO_SCOPE',reason:'NO_FUNCTIONAL_RESPONSIBILITY_FOR_THIS_FLOOR',scope:[]},null,2)+'\n');
            NODE
          fi
      - name: Upload isolated implementation workspace
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-implementation-${{ matrix.role }}-${{ github.run_id }}
          path: department-implementations/${{ matrix.role }}
          retention-days: 1
          if-no-files-found: error
      - name: Code workspace summary
        if: always()
        run: |
          echo '### ${{ matrix.role }} code workspace' >> "$GITHUB_STEP_SUMMARY"
          echo '- isolated workspace: YES' >> "$GITHUB_STEP_SUMMARY"
          echo '- shared branch write: NO' >> "$GITHUB_STEP_SUMMARY"
          echo '- owned scope: ${{ steps.scope.outputs.scope }}' >> "$GITHUB_STEP_SUMMARY"

  integrate:
    name: integrate department code and dispatch final QA
    needs: [prepare, planning_final, implementations]
    if: needs.prepare.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Checkout immutable reserved baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.reserved_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore floor context and planning integration
        uses: actions/download-artifact@v4
        with:
          pattern: autonomous-*-$(echo never)
          path: /tmp/unused
        continue-on-error: true
      - name: Restore immutable floor context
        uses: actions/download-artifact@v4
        with:
          name: autonomous-floor-context-${{ github.run_id }}
          path: .autonomous
      - name: Restore integrated department cycle
        uses: actions/download-artifact@v4
        with:
          name: autonomous-department-cycle-${{ github.run_id }}
          path: .
      - name: Restore all department implementation workspaces
        uses: actions/download-artifact@v4
        with:
          pattern: autonomous-implementation-*-${{ github.run_id }}
          path: department-implementations
      - name: Normalize downloaded implementation artifact layout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/impl-normalized
          for role in development graphics qa balance; do
            src="department-implementations/autonomous-implementation-${role}-${GITHUB_RUN_ID}"
            if [ -d "$src/department-implementations/$role" ]; then src="$src/department-implementations/$role"; fi
            test -d "$src"
            mkdir -p "/tmp/impl-normalized/$role"
            cp -R "$src"/. "/tmp/impl-normalized/$role/"
          done
          rm -rf department-implementations
          mv /tmp/impl-normalized department-implementations
      - name: Three-way integrate isolated department code
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          candidate="web-games/.autonomous-candidates/${{ needs.prepare.outputs.game_id }}/${{ needs.prepare.outputs.candidate_id }}"
          evidence=".autonomous/evidence/${{ needs.prepare.outputs.candidate_id }}.json"
          node tools/autonomous-department-integrator.mjs \
            --order=.autonomous/work-order.json \
            --cycle=department-cycle.json \
            --implementations=department-implementations \
            --candidate-id="${{ needs.prepare.outputs.candidate_id }}" \
            --candidate-path="$candidate" \
            --source-commit="${{ needs.prepare.outputs.reserved_sha }}" \
            --evidence="$evidence" \
            --report=department-integration.json
      - name: Prepare true same-file conflict for AI adjustment
        if: steps.merge.outputs.status == 'CONFLICT'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('department-integration.json','utf8'));
          if(!r.conflicts?.length||r.conflicts.length>4)throw new Error('unsupported conflict width');
          const o=JSON.parse(fs.readFileSync('.autonomous/work-order.json','utf8'));
          o.responsibilityFiles=r.conflicts.map(x=>x.path);
          fs.writeFileSync('.autonomous/work-order.json',JSON.stringify(o,null,2)+'\n');
          const temp=`web-games/.autonomous-integration-base/${r.candidateId}`;
          fs.rmSync(temp,{recursive:true,force:true});fs.mkdirSync(require('path').dirname(temp),{recursive:true});fs.cpSync(r.candidatePath,temp,{recursive:true});
          const cycle=JSON.parse(fs.readFileSync('department-cycle.json','utf8'));
          const env=process.env.GITHUB_ENV;
          fs.appendFileSync(env,`AUTONOMOUS_GAME_ID=${o.gameId}\nAUTONOMOUS_SOURCE_PATH=${temp}\nAUTONOMOUS_CANDIDATE_ID=${r.candidateId}-conflict\nAUTONOMOUS_REPAIR_MODE=MODEL\nAUTONOMOUS_PROTECTED_VALUES=${(o.protectedValues||[]).join(',')}\n`);
          fs.appendFileSync(env,`AUTONOMOUS_GOAL<<JAEWOON_CONFLICT\n${cycle.finalGoal} 같은 파일에 남은 Git conflict marker만 제거하면서 관련 부서 의도를 모두 보존하고 새로운 기능을 추가하지 마라.\nJAEWOON_CONFLICT\n`);
          NODE
      - name: Restore cached local Ollama runtime only for true merge conflict
        if: steps.merge.outputs.status == 'CONFLICT'
        uses: ./.github/actions/prepare-ollama
        with:
          model: ${{ env.AUTONOMOUS_LOCAL_MODEL }}
          version: ${{ env.OLLAMA_VERSION }}
      - name: AI adjusts true same-file conflict only
        if: steps.merge.outputs.status == 'CONFLICT'
        run: node tools/autonomous-development-worker.mjs
      - name: Finalize conflict-adjusted integration
        if: steps.merge.outputs.status == 'CONFLICT'
        shell: bash
        run: |
          set -euo pipefail
          candidate="web-games/.autonomous-candidates/${{ needs.prepare.outputs.game_id }}/${{ needs.prepare.outputs.candidate_id }}"
          resolver="web-games/.autonomous-candidates/${{ needs.prepare.outputs.game_id }}/${{ needs.prepare.outputs.candidate_id }}-conflict"
          evidence=".autonomous/evidence/${{ needs.prepare.outputs.candidate_id }}.json"
          node tools/autonomous-department-integrator.mjs \
            --order=.autonomous/work-order.json \
            --cycle=department-cycle.json \
            --implementations=department-implementations \
            --candidate-id="${{ needs.prepare.outputs.candidate_id }}" \
            --candidate-path="$candidate" \
            --source-commit="${{ needs.prepare.outputs.reserved_sha }}" \
            --resolution-candidate="$resolver" \
            --evidence="$evidence" \
            --report=department-integration.json
          rm -rf "web-games/.autonomous-integration-base/${{ needs.prepare.outputs.candidate_id }}" "$resolver" ".autonomous/evidence/${{ needs.prepare.outputs.candidate_id }}-conflict.json"
      - name: Verify integrated candidate construction only
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./department-integration.json').status")" = PASS
          test -s ".autonomous/evidence/${{ needs.prepare.outputs.candidate_id }}.json"
          test -d "web-games/.autonomous-candidates/${{ needs.prepare.outputs.game_id }}/${{ needs.prepare.outputs.candidate_id }}"
          git diff --check
          echo 'INTEGRATED_CANDIDATE_CONSTRUCTION=PASS'
          echo 'FINAL_QA_AUTHORITY=AUTONOMOUS_CANDIDATE_PROMOTION'
      - name: Create integrated candidate branch
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          branch="autonomous/candidate-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
          echo 'MAIN_DIRECT_WRITE=NO'
      - name: Commit only the integrated candidate and evidence
        shell: bash
        run: |
          set -euo pipefail
          candidate="web-games/.autonomous-candidates/${{ needs.prepare.outputs.game_id }}/${{ needs.prepare.outputs.candidate_id }}"
          evidence=".autonomous/evidence/${{ needs.prepare.outputs.candidate_id }}.json"
          git config user.name 'jaewoon-autonomous-integrator'
          git config user.email 'autonomous-integrator@users.noreply.github.com'
          git add -f "$candidate" "$evidence"
          test -n "$(git diff --cached --name-only)"
          git commit -m "candidate: integrated parallel departments ${{ needs.prepare.outputs.game_id }} ${GITHUB_RUN_ID}"
          git push origin "HEAD:${{ steps.branch.outputs.name }}"
          echo 'DEPARTMENT_CODE_WORKSPACES=PARALLEL'
          echo 'FINAL_INTEGRATION_WRITE=SERIAL_PROMOTION_GATE'
          echo 'SELF_PROMOTE_MAIN=NO'
      - name: Dispatch one strong independent final QA gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gh workflow run autonomous-candidate-promotion.yml --ref main -f candidate_branch="${{ steps.branch.outputs.name }}"; then
              echo 'FINAL_INTEGRATED_QA_DISPATCHED=YES'
              echo 'FINAL_QA_GATE=AUTONOMOUS_CANDIDATE_PROMOTION'
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
      - name: Integration summary
        if: always()
        run: |
          echo '### Integrated autonomous candidate' >> "$GITHUB_STEP_SUMMARY"
          echo '- review: five AI departments in parallel' >> "$GITHUB_STEP_SUMMARY"
          echo '- code: development/graphics/qa/balance isolated workspaces in parallel' >> "$GITHUB_STEP_SUMMARY"
          echo '- planning: final constraints + functional code ownership' >> "$GITHUB_STEP_SUMMARY"
          echo '- same-file handling: isolated departments may share a functional file; common-base 3-way merge resolves it' >> "$GITHUB_STEP_SUMMARY"
          echo '- local model runtime: cached pinned archive, no per-job install.sh' >> "$GITHUB_STEP_SUMMARY"
          echo '- final independent QA: Autonomous Candidate Promotion (serialized shared write)' >> "$GITHUB_STEP_SUMMARY"
          echo '- public main write here: NO' >> "$GITHUB_STEP_SUMMARY"

  recover:
    name: recover failed reserved floor
    needs: [prepare, ollama_runtime, departments, planning_final, implementations, integrate]
    if: >-
      ${{ always() && needs.prepare.outputs.reserved == 'true' &&
          (needs.prepare.result == 'failure' || needs.ollama_runtime.result == 'failure' ||
           needs.ollama_runtime.result == 'cancelled' || needs.departments.result == 'failure' ||
           needs.departments.result == 'cancelled' || needs.planning_final.result == 'failure' ||
           needs.planning_final.result == 'cancelled' || needs.implementations.result == 'failure' ||
           needs.implementations.result == 'cancelled' || needs.integrate.result == 'failure' ||
           needs.integrate.result == 'cancelled') }}
    runs-on: ubuntu-latest
    concurrency:
      group: autonomous-dev-writer
      cancel-in-progress: false
    steps:
      - name: Checkout latest autonomous queue state
        uses: actions/checkout@v4
        with:
          ref: autonomous-dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Release failed source-root lease
        shell: bash
        run: |
          set -euo pipefail
          node tools/autonomous-queue-state.mjs --state=.autonomous/queue-state.json --settle-run-id="$GITHUB_RUN_ID" --status=FAILED
          git config user.name 'jaewoon-autonomous-recovery'
          git config user.email 'autonomous-recovery@users.noreply.github.com'
          git add .autonomous/queue-state.json
          if ! git diff --cached --quiet; then
            git commit -m "autonomy: release failed floor ${GITHUB_RUN_ID} [skip ci]"
            git push origin HEAD:autonomous-dev
          fi
          echo 'FAILED_SOURCE_ROOT_LEASE=RELEASED'
      - name: Continue 24h loop after a reserved floor failure
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gh workflow run autonomous-continuous-development.yml --repo "$GITHUB_REPOSITORY" --ref main; then
              echo 'FAILED_FLOOR_NEXT=DISPATCHED'
              echo 'PUBLIC_MAIN_RELEASE=NO'
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
