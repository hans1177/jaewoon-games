name: Autonomous Continuous Development

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/autonomous-continuous-development.yml'
      - 'tools/autonomous-work-planner.mjs'
      - 'tools/autonomous-queue-state.mjs'
      - 'tools/autonomous-development-worker.mjs'
      - 'tools/autonomous-safe-edit.mjs'
      - 'qa/autonomous-work-planner.test.mjs'
      - 'qa/autonomous-queue-state.test.mjs'
      - 'qa/autonomous-development-worker.test.mjs'
      - 'autonomous-portfolio.json'
      - 'public-game-health.json'
      - 'game-artbooks.json'
  schedule:
    - cron: '5 15 * * *' # 00:05 Asia/Seoul daily reset wake-up
    - cron: '10 7 * * *' # 16:10 Asia/Seoul safety/recovery wake-up
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: autonomous-dev-writer
  cancel-in-progress: false

env:
  AUTONOMOUS_LOCAL_MODEL: qwen3:0.6b
  AUTONOMOUS_MODEL_MAX_PREDICT: '1536'
  AUTONOMOUS_MODEL_TIMEOUT_MS: '240000'
  OLLAMA_HOST: 127.0.0.1:11434

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout continuous development branch
        uses: actions/checkout@v4
        with:
          ref: autonomous-dev
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync public baseline into development line without touching main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "jaewoon-autonomous-sync"
          git config user.email "autonomous-sync@users.noreply.github.com"
          git fetch origin main autonomous-dev
          git merge --no-edit origin/main
          git push origin HEAD:autonomous-dev
          echo "PUBLIC_MAIN_WRITE=NO"
          echo "DEV_BASELINE=$(git rev-parse HEAD)"

      - name: Plan next evidence-based free work item
        run: node tools/autonomous-work-planner.mjs --output=.autonomous/work-order.json

      - name: Bind work order
        id: order
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const o=JSON.parse(fs.readFileSync('.autonomous/work-order.json','utf8'));
          const out=process.env.GITHUB_OUTPUT;
          fs.appendFileSync(out,`run=${o.run?'true':'false'}\n`);
          fs.appendFileSync(out,`reason=${String(o.reason||o.selectedReason||'').replaceAll('\n',' ')}\n`);
          if(!o.run)process.exit(0);
          const env=process.env.GITHUB_ENV;
          fs.appendFileSync(env,`AUTONOMOUS_GAME_ID=${o.gameId}\n`);
          fs.appendFileSync(env,`AUTONOMOUS_GAME_SLUG=${o.gameSlug}\n`);
          fs.appendFileSync(env,`AUTONOMOUS_SOURCE_PATH=${o.sourcePath}\n`);
          fs.appendFileSync(env,`AUTONOMOUS_WORK_DATE=${o.date}\n`);
          fs.appendFileSync(env,`AUTONOMOUS_SELECTED_REASON=${o.selectedReason}\n`);
          fs.appendFileSync(env,`AUTONOMOUS_CANDIDATE_ID=${o.gameId}-${o.date.replaceAll('-','')}-${process.env.GITHUB_RUN_ID}\n`);
          fs.appendFileSync(env,`AUTONOMOUS_PROTECTED_VALUES=${(o.protectedValues||[]).join(',')}\n`);
          fs.appendFileSync(env,`AUTONOMOUS_GOAL<<JAEWOON_GOAL\n${String(o.goal||'').replaceAll('\r',' ')}\nJAEWOON_GOAL\n`);
          if(o.budget?.paidApi!==false||Number(o.budget?.modelCalls)!==1||Number(o.budget?.maxModelCalls)<1)throw new Error('free budget work-order gate failed');
          NODE

      - name: Stop cleanly when no eligible work remains today
        if: steps.order.outputs.run != 'true'
        run: |
          echo "AUTONOMOUS_WORK=NO_ELIGIBLE_ITEM"
          echo "QUEUE_STOP_REASON=${{ steps.order.outputs.reason }}"

      - name: Hand off exhausted game queue to portfolio continuation
        if: steps.order.outputs.run != 'true' && steps.order.outputs.reason == 'NO_UNPROCESSED_WORK_TODAY'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run autonomous-portfolio-continuation.yml --ref main
          echo 'PORTFOLIO_CONTINUATION=DISPATCHED'
          echo 'PUBLIC_MAIN_RELEASE=NO'

      - name: Deterministic planner, queue, budget and worker tests
        if: steps.order.outputs.run == 'true'
        run: |
          node --test qa/autonomous-work-planner.test.mjs
          node --test qa/autonomous-queue-state.test.mjs
          node --test qa/free-budget-telemetry.test.mjs
          node --test qa/autonomous-development-worker.test.mjs

      - name: Verified free budget preflight
        if: steps.order.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node tools/free-budget-telemetry.mjs \
            --verify-public-repo=true \
            --runner=ubuntu-latest \
            --model-calls=1 \
            --runner-minutes=20 \
            --output=.autonomous/free-budget-telemetry.json
          echo 'FREE_BUDGET_PREFLIGHT=PASS'
          echo 'ACTIONS_QUOTA_MODE=UNMETERED_FREE'

      - name: Reserve this game once for today's continuous queue
        id: reserve
        if: steps.order.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source_before="$(git rev-parse HEAD)"
          node tools/autonomous-queue-state.mjs \
            --state=.autonomous/queue-state.json \
            --date="$AUTONOMOUS_WORK_DATE" \
            --game-id="$AUTONOMOUS_GAME_ID" \
            --game-slug="$AUTONOMOUS_GAME_SLUG" \
            --source-path="$AUTONOMOUS_SOURCE_PATH" \
            --reason="$AUTONOMOUS_SELECTED_REASON" \
            --run-id="$GITHUB_RUN_ID" \
            --source-commit="$source_before"
          git config user.name "jaewoon-autonomous-queue"
          git config user.email "autonomous-queue@users.noreply.github.com"
          git add .autonomous/queue-state.json
          git commit -m "autonomy: reserve ${AUTONOMOUS_GAME_ID} work ${AUTONOMOUS_WORK_DATE} [skip ci]"
          git push origin HEAD:autonomous-dev
          echo "QUEUE_RESERVATION=PASS"
          echo "reserved=true" >> "$GITHUB_OUTPUT"
          echo "AUTONOMOUS_RESERVED_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Create isolated candidate branch
        if: steps.order.outputs.run == 'true'
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          branch="autonomous/candidate-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
          echo "MAIN_DIRECT_WRITE=NO"

      - name: Install local Ollama
        if: steps.order.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          installed=0
          for attempt in 1 2 3; do
            echo "OLLAMA_INSTALL_ATTEMPT=$attempt/3"
            if curl -fsSL --retry 3 --retry-all-errors --connect-timeout 15 https://ollama.com/install.sh | sh; then installed=1; break; fi
            sleep $((attempt * 4))
          done
          test "$installed" = 1
          nohup ollama serve > /tmp/ollama-autonomous.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && exit 0
            sleep 2
          done
          cat /tmp/ollama-autonomous.log || true
          exit 1

      - name: Pull one free local model
        if: steps.order.outputs.run == 'true'
        run: |
          ollama pull "$AUTONOMOUS_LOCAL_MODEL"
          echo "MODEL_CALL_BUDGET=1"
          echo "MODEL_MAX_PREDICT=$AUTONOMOUS_MODEL_MAX_PREDICT"
          echo "PAID_API=NO"

      - name: Generate isolated candidate
        if: steps.order.outputs.run == 'true'
        run: node tools/autonomous-development-worker.mjs

      - name: Candidate pre-promotion QA
        if: steps.order.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          candidate="web-games/.autonomous-candidates/${AUTONOMOUS_GAME_ID}/${AUTONOMOUS_CANDIDATE_ID}"
          test -d "$candidate"
          git diff --check
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find "$candidate" -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -print0)
          if [ -f qa/vibe-regression.mjs ]; then node qa/vibe-regression.mjs; fi
          echo "PRE_PROMOTION_QA=PASS"

      - name: Commit candidate branch only
        if: steps.order.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "jaewoon-autonomous-worker"
          git config user.email "autonomous-worker@users.noreply.github.com"
          git add -f "web-games/.autonomous-candidates/${AUTONOMOUS_GAME_ID}/${AUTONOMOUS_CANDIDATE_ID}" ".autonomous/evidence/${AUTONOMOUS_CANDIDATE_ID}.json"
          test -n "$(git diff --cached --name-only)"
          git commit -m "candidate: ${AUTONOMOUS_GAME_ID} continuous development ${GITHUB_RUN_ID}"
          git push origin "HEAD:${{ steps.branch.outputs.name }}"
          echo "CANDIDATE_COMMIT=$(git rev-parse HEAD)"
          echo "SELF_PROMOTE_MAIN=NO"

      - name: Continue queue after a reserved work failure
        if: failure() && steps.reserve.outputs.reserved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run autonomous-continuous-development.yml --ref main
          echo "FAILED_WORK_NEXT=DISPATCHED"
          echo "FAILED_GAME_SKIPPED_FOR_TODAY=$AUTONOMOUS_GAME_ID"
          echo "PUBLIC_MAIN_RELEASE=NO"

      - name: Summary
        if: always()
        run: |
          echo "### Autonomous Continuous Development" >> "$GITHUB_STEP_SUMMARY"
          echo "- public main write: NO" >> "$GITHUB_STEP_SUMMARY"
          echo "- cash budget: 0" >> "$GITHUB_STEP_SUMMARY"
          echo "- paid API: NO" >> "$GITHUB_STEP_SUMMARY"
          echo "- actions quota mode: verified public standard / unmetered free" >> "$GITHUB_STEP_SUMMARY"
          echo "- local model calls/run: max 1" >> "$GITHUB_STEP_SUMMARY"
          echo "- local model max predict: 1536" >> "$GITHUB_STEP_SUMMARY"
          echo "- local model timeout: 240000ms" >> "$GITHUB_STEP_SUMMARY"
          echo "- daily work cap: 8" >> "$GITHUB_STEP_SUMMARY"
          echo "- same game per KST day: max 1 reservation" >> "$GITHUB_STEP_SUMMARY"
          echo "- exhausted game queue: portfolio continuation dispatch" >> "$GITHUB_STEP_SUMMARY"
          echo "- failed reserved work: dispatch next item" >> "$GITHUB_STEP_SUMMARY"
          echo "- candidate promotion: separate independent QA" >> "$GITHUB_STEP_SUMMARY"
