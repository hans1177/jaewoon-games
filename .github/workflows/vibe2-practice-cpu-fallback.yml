name: Vibe2 Unity Practice CPU Fallback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vibe2-practice-cpu-fallback.yml'
      - 'company-learning/unity-teacher-materials/**'
      - 'tools/vibe2-online-unity-teacher.mjs'
      - 'tools/vibe2-licensed-reference-samples.mjs'
      - 'tools/vibe2-practice-dataset.mjs'
      - 'tools/vibe2-practice-train.py'
      - 'tools/vibe2-train.py'
      - 'company-learning/roblox-practice.json'
      - 'tools/vibe2-bootstrap-python.ps1'
  schedule:
    - cron: '27 * * * *'
  workflow_dispatch:
    inputs:
      unity_practice:
        description: 'Explicit Unity practice after Roblox finishes (off by default)'
        required: false
        type: boolean
        default: false

# Coalesce all automatic push/hourly requests while one local CPU run is active.
# Manual requests remain independent; no running safe training is cancelled.
concurrency:
  group: vibe2-unity-practice-cpu-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'scheduled-and-push' }}
  queue: single
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  LEARNING_FOCUS: ROBLOX_CODING_ONLY
  PRACTICE_AUTHORITY: PRACTICE_ONLY
  PRACTICE_RUNTIME_PROMOTION: 'NO'

jobs:
  prepare-practice:
    # Unity is OWNER_HOLD: only explicit manual opt-in may prepare its practice samples.
    if: github.event_name == 'workflow_dispatch' && inputs.unity_practice == true
    env:
      LEARNING_FOCUS: UNITY_CODING_ONLY
    # Sample preparation is control-plane work; keep game-primary ubuntu-latest capacity for heavy workers.
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build GPT Unity teacher samples
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/unity-online-teacher-samples"
          practice="$RUNNER_TEMP/unity-gpt-practice-samples"
          node tools/vibe2-online-unity-teacher.mjs \
            --sample-dir company-learning/training-samples \
            --lessons company-learning/unity-teacher-materials/core-lessons.json \
            --practice-drills company-learning/unity-teacher-materials/gpt-practice-drills.json \
            --out-dir "$out" \
            --practice-out-dir "$practice" \
            --max 96 \
            --max-practice 96
          teacher_count=$(find "$practice" -maxdepth 1 -type f -name 'gpt-u-*.json' | wc -l | tr -d ' ')
          test "$teacher_count" -ge 12
          echo "TEACHER_PRACTICE_SAMPLES=$teacher_count"
      - name: Distill licensed external Unity code references
        shell: bash
        run: |
          set -euo pipefail
          practice="$RUNNER_TEMP/unity-gpt-practice-samples"
          node tools/vibe2-licensed-reference-samples.mjs \
            --drills company-learning/unity-teacher-materials/licensed-reference-drills.json \
            --out "$practice" \
            --max 96
          licensed_count=$(find "$practice" -maxdepth 1 -type f -name 'licensed-u-*.json' | wc -l | tr -d ' ')
          test "$licensed_count" -ge 8
          total_count=$(find "$practice" -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')
          test "$total_count" -ge 20
          echo "LICENSED_REFERENCE_SAMPLES=$licensed_count"
          echo "TOTAL_PRACTICE_SAMPLES=$total_count"
          echo 'LICENSED_REFERENCE_IS_VERIFIED_PRODUCTION_POSITIVE=NO'
          echo 'PRACTICE_RUNTIME_PROMOTION=NO'
      - name: Upload practice samples
        uses: actions/upload-artifact@v4
        with:
          name: unity-gpt-practice-samples-cpu
          path: ${{ runner.temp }}/unity-gpt-practice-samples
          retention-days: 1
          if-no-files-found: error

  prepare-roblox-practice:
    # 기존 샘플 준비 흐름을 공유하며 외부 네트워크/유료 API/게임 배포 권한은 부여하지 않는다.
    runs-on: ubuntu-slim
    timeout-minutes: 10
    env:
      LEARNING_FOCUS: ROBLOX_CODING_ONLY
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare pinned MIT and Apache Roblox Luau reference samples
        shell: bash
        run: |
          set -euo pipefail
          samples="$RUNNER_TEMP/roblox-licensed-practice-samples-cpu"
          dataset="$RUNNER_TEMP/roblox-practice-preflight"
          node tools/vibe2-licensed-reference-samples.mjs \
            --drills company-learning/roblox-practice.json \
            --out "$samples" --max 96
          sample_count=$(find "$samples" -maxdepth 1 -type f -name 'roblox-ref-*.json' | wc -l | tr -d ' ')
          code_count=$(find "$samples" -maxdepth 1 -type f -name 'roblox-code-*.json' | wc -l | tr -d ' ')
          test "$sample_count" -eq 25
          test "$code_count" -eq 14
          node tools/vibe2-practice-dataset.mjs \
            --input "$samples" --out "$dataset" --min-samples 20 --task-type roblox
          node --input-type=module -e 'import fs from "node:fs";const m=JSON.parse(fs.readFileSync(process.argv[1]));if(m.targetTaskType!=="roblox"||m.authority!=="PRACTICE_ONLY"||m.runtimePromotionAllowed!==false||m.stats.codeImplementationTrain<10||m.stats.codeImplementationEval<1)throw Error("ROBLOX_IMPLEMENTATION_TRAINING_DATASET_NOT_READY")' "$dataset/manifest.json"
          node --test qa/vibe2-licensed-reference-learning.test.mjs
          echo "ROBLOX_LICENSED_REFERENCE_SAMPLES=$sample_count"
          echo "ROBLOX_ORIGINAL_LUAU_IMPLEMENTATION_SAMPLES=$code_count"
          echo 'ROBLOX_PRACTICE_AUTHORITY=PRACTICE_ONLY'
          echo 'ROBLOX_STUDIO_RUNTIME_VERIFIED=NO'
          echo 'ROBLOX_MODEL_AUTO_PROMOTION=NO'
      - name: Upload Roblox licensed practice samples
        uses: actions/upload-artifact@v4
        with:
          name: roblox-licensed-practice-samples-cpu
          path: ${{ runner.temp }}/roblox-licensed-practice-samples-cpu
          retention-days: 1
          if-no-files-found: error

  cpu-practice-train:
    # Even with explicit Unity opt-in, finish this run's Roblox practice first.
    if: github.event_name == 'workflow_dispatch' && inputs.unity_practice == true
    needs: [prepare-practice, roblox-practice-train]
    env:
      LEARNING_FOCUS: UNITY_CODING_ONLY
    concurrency:
      group: vibe2-unity-practice-local-training
      cancel-in-progress: false
    runs-on: [self-hosted, Windows, X64, jaewoon-unity]
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Provision local Python and ML stack
        run: .\tools\vibe2-bootstrap-python.ps1
      - name: Confirm CPU fallback is required
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:PYTHON_EXE -c "import torch; print('CPU_FALLBACK_CUDA_AVAILABLE=' + str(torch.cuda.is_available())); print('CPU_FALLBACK_DEVICE=' + ('cuda' if torch.cuda.is_available() else 'cpu'))"
          if ($LASTEXITCODE -ne 0) { throw 'PyTorch device probe failed' }
      - name: Download Unity practice and licensed-reference samples
        uses: actions/download-artifact@v4
        with:
          name: unity-gpt-practice-samples-cpu
          path: ${{ runner.temp }}/unity-gpt-practice-samples-cpu
      - name: Build mixed practice-only dataset
        run: |
          $ErrorActionPreference = 'Stop'
          $samples = Join-Path $env:RUNNER_TEMP 'unity-gpt-practice-samples-cpu'
          $datasetDir = Join-Path $env:RUNNER_TEMP "unity-practice-cpu-$env:GITHUB_RUN_ID"
          node tools/vibe2-practice-dataset.mjs --input $samples --out $datasetDir --min-samples 20
          if ($LASTEXITCODE -ne 0) { throw 'practice dataset build failed' }
          $manifestPath = Join-Path $datasetDir 'manifest.json'
          $manifest = [System.IO.File]::ReadAllText($manifestPath, [System.Text.Encoding]::UTF8) | ConvertFrom-Json
          if ($manifest.authority -ne 'PRACTICE_ONLY' -or $manifest.practiceOnly -ne $true -or $manifest.runtimePromotionAllowed -ne $false -or $manifest.readyForTraining -ne $true) { throw 'practice dataset safety gate failed' }
          if ($manifest.containsLicensedReference -ne $true -or $manifest.stats.licensedReferenceTotal -lt 8) { throw 'licensed Unity reference samples missing from dataset' }
          "PRACTICE_DATASET_DIR=$datasetDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "PRACTICE_DATASET_TRAIN=$($manifest.stats.train)"
          Write-Host "PRACTICE_DATASET_EVAL=$($manifest.stats.eval)"
          Write-Host "PRACTICE_LICENSED_REFERENCE_TOTAL=$($manifest.stats.licensedReferenceTotal)"
          Write-Host "PRACTICE_SOURCE_KINDS=$($manifest.sourceKinds -join ',')"
      - name: Train actual CPU LoRA adapter
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:USERPROFILE 'jaewoon-vibe2-learning'
          $adapterVersion = "unity-practice-licensed-cpu-$env:GITHUB_RUN_ID"
          $adapterDir = Join-Path $root "adapters\unity-practice\$adapterVersion"
          if (Test-Path $adapterDir) { Remove-Item $adapterDir -Recurse -Force }
          New-Item -ItemType Directory -Path $adapterDir -Force | Out-Null
          $trainArgs = @(
            'tools/vibe2-practice-train.py',
            '--train', (Join-Path $env:PRACTICE_DATASET_DIR 'train.jsonl'),
            '--eval', (Join-Path $env:PRACTICE_DATASET_DIR 'eval.jsonl'),
            '--dataset-manifest', (Join-Path $env:PRACTICE_DATASET_DIR 'manifest.json'),
            '--output', $adapterDir,
            '--adapter-version', $adapterVersion,
            '--task-type', 'unity',
            '--method', 'lora',
            '--epochs', '1.0',
            '--max-length', '256',
            '--batch-size', '1',
            '--grad-accum', '1',
            '--final-eval-only',
            '--cpu-practice-recovery'
          )
          & $env:PYTHON_EXE @trainArgs
          if ($LASTEXITCODE -ne 0) {
            # A Windows CPU job may end after most of the epoch with no Python
            # traceback. Resume ONE time only from its exact Trainer checkpoint.
            $checkpointRoot = Join-Path $adapterDir 'checkpoints'
            $complete = @(Get-ChildItem $checkpointRoot -Directory -Filter 'checkpoint-*' -ErrorAction SilentlyContinue | Where-Object {
              (Test-Path (Join-Path $_.FullName 'trainer_state.json')) -and
              (Test-Path (Join-Path $_.FullName 'optimizer.pt'))
            })
            if ($complete.Count -eq 0) { throw 'CPU practice LoRA training failed without verified checkpoint' }
            Write-Host 'WINDOWS_CPU_PRACTICE_RESUME=VERIFIED_CHECKPOINT'
            & $env:PYTHON_EXE @trainArgs '--resume-checkpoint'
            if ($LASTEXITCODE -ne 0) { throw 'CPU practice LoRA training retry failed' }
          }
          $metadataPath = Join-Path $adapterDir 'training-metadata.json'
          $metadata = [System.IO.File]::ReadAllText($metadataPath, [System.Text.Encoding]::UTF8) | ConvertFrom-Json
          if ($metadata.practiceOnly -ne $true -or $metadata.promotionState -ne 'UNVERIFIED' -or $metadata.runtimePromotionAllowed -ne $false) { throw 'practice adapter safety gate failed' }
          if ($metadata.containsLicensedReference -ne $true -or $metadata.licensedReferenceSamples -lt 8) { throw 'adapter metadata lost licensed-reference provenance' }
          if ($metadata.finalEvalOnly -ne $true) { throw 'single-final-eval optimization was not applied' }
          $weights = Get-ChildItem (Join-Path $adapterDir 'adapter') -Filter 'adapter_model*.safetensors' -File | Select-Object -First 1
          if ($null -eq $weights -or $weights.Length -le 0) { throw 'adapter weights were not created' }
          $sha = (Get-FileHash $weights.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $receipt = [ordered]@{
            version = 3
            adapterVersion = $adapterVersion
            method = 'lora'
            device = 'cpu'
            baseModel = $metadata.baseModel
            trainLoss = $metadata.trainMetrics.train_loss
            evalLoss = $metadata.evalMetrics.eval_loss
            finalEvalOnly = $metadata.finalEvalOnly
            practiceSourceKinds = $metadata.practiceSourceKinds
            licensedReferenceSamples = $metadata.licensedReferenceSamples
            adapterWeightsBytes = $weights.Length
            adapterWeightsSha256 = $sha
            promotionState = $metadata.promotionState
            runtimePromotionAllowed = $metadata.runtimePromotionAllowed
            requiredNextGate = $metadata.requiredNextGate
          }
          $receiptPath = Join-Path $env:RUNNER_TEMP 'vibe2-cpu-practice-learning-receipt.json'
          $receipt | ConvertTo-Json -Depth 10 | Set-Content $receiptPath -Encoding utf8
          "PRACTICE_RECEIPT=$receiptPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'PRACTICE_WEIGHT_LEARNING=PASS'
          Write-Host "PRACTICE_TRAIN_LOSS=$($metadata.trainMetrics.train_loss)"
          Write-Host "PRACTICE_EVAL_LOSS=$($metadata.evalMetrics.eval_loss)"
          Write-Host 'PRACTICE_EVAL_PASSES=1'
          Write-Host "PRACTICE_LICENSED_REFERENCE_SAMPLES=$($metadata.licensedReferenceSamples)"
          Write-Host "PRACTICE_ADAPTER_WEIGHTS_BYTES=$($weights.Length)"
          Write-Host "PRACTICE_ADAPTER_WEIGHTS_SHA256=$sha"
          Write-Host 'PRACTICE_PROMOTION_STATE=UNVERIFIED'
          Write-Host 'PRACTICE_RUNTIME_PROMOTION=NO'
      - name: Upload learning receipt
        uses: actions/upload-artifact@v4
        with:
          name: vibe2-cpu-practice-learning-receipt
          path: ${{ env.PRACTICE_RECEIPT }}
          retention-days: 1
          if-no-files-found: error


  roblox-practice-train:
    needs: prepare-roblox-practice
    env:
      LEARNING_FOCUS: ROBLOX_CODING_ONLY
    concurrency:
      group: vibe2-roblox-practice-local-training
      queue: single
      cancel-in-progress: false
    runs-on: [self-hosted, Windows, X64, jaewoon-unity]
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Provision local Python and ML stack
        run: .\tools\vibe2-bootstrap-python.ps1
      - name: Confirm CPU fallback is required
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:PYTHON_EXE -c "import torch; print('CPU_FALLBACK_CUDA_AVAILABLE=' + str(torch.cuda.is_available())); print('CPU_FALLBACK_DEVICE=' + ('cuda' if torch.cuda.is_available() else 'cpu'))"
          if ($LASTEXITCODE -ne 0) { throw 'PyTorch device probe failed' }
      - name: Download licensed Roblox Luau practice samples
        uses: actions/download-artifact@v4
        with:
          name: roblox-licensed-practice-samples-cpu
          path: ${{ runner.temp }}/roblox-licensed-practice-samples-cpu
      - name: Build mixed practice-only dataset
        run: |
          $ErrorActionPreference = 'Stop'
          $samples = Join-Path $env:RUNNER_TEMP 'roblox-licensed-practice-samples-cpu'
          $datasetDir = Join-Path $env:RUNNER_TEMP "roblox-practice-cpu-$env:GITHUB_RUN_ID"
          node tools/vibe2-practice-dataset.mjs --input $samples --out $datasetDir --min-samples 20 --task-type roblox
          if ($LASTEXITCODE -ne 0) { throw 'practice dataset build failed' }
          $manifestPath = Join-Path $datasetDir 'manifest.json'
          $manifest = [System.IO.File]::ReadAllText($manifestPath, [System.Text.Encoding]::UTF8) | ConvertFrom-Json
          if ($manifest.authority -ne 'PRACTICE_ONLY' -or $manifest.practiceOnly -ne $true -or $manifest.runtimePromotionAllowed -ne $false -or $manifest.readyForTraining -ne $true) { throw 'practice dataset safety gate failed' }
          if ($manifest.containsLicensedReference -ne $true -or $manifest.stats.licensedReferenceTotal -lt 20) { throw 'licensed Roblox reference samples missing from dataset' }
          "PRACTICE_DATASET_DIR=$datasetDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "PRACTICE_DATASET_TRAIN=$($manifest.stats.train)"
          Write-Host "PRACTICE_DATASET_EVAL=$($manifest.stats.eval)"
          Write-Host "PRACTICE_LICENSED_REFERENCE_TOTAL=$($manifest.stats.licensedReferenceTotal)"
          Write-Host "PRACTICE_ROBLOX_CODE_TRAIN=$($manifest.stats.codeImplementationTrain)"
          Write-Host "PRACTICE_ROBLOX_CODE_EVAL=$($manifest.stats.codeImplementationEval)"
          Write-Host "PRACTICE_SOURCE_KINDS=$($manifest.sourceKinds -join ',')"
      - name: Train Roblox CPU LoRA adapter
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:USERPROFILE 'jaewoon-vibe2-learning'
          $adapterVersion = "roblox-practice-licensed-cpu-$env:GITHUB_RUN_ID"
          $adapterDir = Join-Path $root "adapters\roblox-practice\$adapterVersion"
          if (Test-Path $adapterDir) { Remove-Item $adapterDir -Recurse -Force }
          New-Item -ItemType Directory -Path $adapterDir -Force | Out-Null
          $trainArgs = @(
            'tools/vibe2-practice-train.py',
            '--train', (Join-Path $env:PRACTICE_DATASET_DIR 'train.jsonl'),
            '--eval', (Join-Path $env:PRACTICE_DATASET_DIR 'eval.jsonl'),
            '--dataset-manifest', (Join-Path $env:PRACTICE_DATASET_DIR 'manifest.json'),
            '--output', $adapterDir,
            '--adapter-version', $adapterVersion,
            '--task-type', 'roblox',
            # This is PRACTICE_ONLY: use the same permitted model family at a
            # smaller CPU size, leaving the canonical 1.7B trainer unchanged.
            '--base-model', 'Qwen/Qwen3-0.6B',
            '--method', 'lora',
            '--epochs', '1.0',
            '--max-length', '256',
            '--batch-size', '1',
            '--grad-accum', '1',
            '--final-eval-only',
            '--cpu-practice-recovery'
          )
          & $env:PYTHON_EXE @trainArgs
          if ($LASTEXITCODE -ne 0) {
            # A Windows CPU job may end after most of the epoch with no Python
            # traceback. Resume ONE time only from its exact Trainer checkpoint.
            $checkpointRoot = Join-Path $adapterDir 'checkpoints'
            $complete = @(Get-ChildItem $checkpointRoot -Directory -Filter 'checkpoint-*' -ErrorAction SilentlyContinue | Where-Object {
              (Test-Path (Join-Path $_.FullName 'trainer_state.json')) -and
              (Test-Path (Join-Path $_.FullName 'optimizer.pt'))
            })
            if ($complete.Count -eq 0) { throw 'CPU practice LoRA training failed without verified checkpoint' }
            Write-Host 'WINDOWS_CPU_PRACTICE_RESUME=VERIFIED_CHECKPOINT'
            & $env:PYTHON_EXE @trainArgs '--resume-checkpoint'
            if ($LASTEXITCODE -ne 0) { throw 'CPU practice LoRA training retry failed' }
          }
          $metadataPath = Join-Path $adapterDir 'training-metadata.json'
          $metadata = [System.IO.File]::ReadAllText($metadataPath, [System.Text.Encoding]::UTF8) | ConvertFrom-Json
          if ($metadata.practiceOnly -ne $true -or $metadata.promotionState -ne 'UNVERIFIED' -or $metadata.runtimePromotionAllowed -ne $false) { throw 'practice adapter safety gate failed' }
          if ($metadata.baseModel -ne 'Qwen/Qwen3-0.6B') { throw 'Roblox CPU practice trained an unexpected base model' }
          if ($metadata.containsLicensedReference -ne $true -or $metadata.licensedReferenceSamples -lt 20) { throw 'adapter metadata lost licensed-reference provenance' }
          if ($metadata.finalEvalOnly -ne $true) { throw 'single-final-eval optimization was not applied' }
          $comparison = $metadata.practiceEvalComparison
          if ($null -eq $comparison -or $comparison.scope -ne 'MATCHED_PRACTICE_EVAL_ONLY' -or
              $comparison.evalSha256 -ne $metadata.datasetEvalSha256 -or
              $comparison.fixedHoldoutABVerified -ne $false -or
              $comparison.robloxNativeRuntimeVerified -ne $false -or
              $comparison.runtimePromotionAllowed -ne $false) {
            throw 'Roblox baseline comparison missing or incorrectly claims promotion authority'
          }
          if ($metadata.codeImplementationEvalSamples -lt 1) { throw 'Roblox implementation eval coverage missing' }
          $codeEval = $comparison.codeImplementation
          if ($null -eq $codeEval -or $codeEval.scope -ne 'EXISTING_EVAL_SUBSET_ONLY' -or
              $codeEval.sampleCount -ne $metadata.codeImplementationEvalSamples -or
              $codeEval.encodedWindows -lt 1 -or $codeEval.independentHoldoutVerified -ne $false -or
              $codeEval.generalizationVerified -ne $false) {
            throw 'Roblox code-only evaluation or non-promotion scope missing'
          }
          $weights = Get-ChildItem (Join-Path $adapterDir 'adapter') -Filter 'adapter_model*.safetensors' -File | Select-Object -First 1
          if ($null -eq $weights -or $weights.Length -le 0) { throw 'adapter weights were not created' }
          $sha = (Get-FileHash $weights.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $receipt = [ordered]@{
            version = 3
            adapterVersion = $adapterVersion
            method = 'lora'
            device = 'cpu'
            baseModel = $metadata.baseModel
            modelScope = 'SMALL_CPU_PRACTICE_NOT_CANONICAL_1P7B'
            trainLoss = $metadata.trainMetrics.train_loss
            evalLoss = $metadata.evalMetrics.eval_loss
            practiceEvalComparison = $comparison
            codeImplementationTrainSamples = $metadata.codeImplementationTrainSamples
            codeImplementationEvalSamples = $metadata.codeImplementationEvalSamples
            finalEvalOnly = $metadata.finalEvalOnly
            practiceSourceKinds = $metadata.practiceSourceKinds
            licensedReferenceSamples = $metadata.licensedReferenceSamples
            adapterWeightsBytes = $weights.Length
            adapterWeightsSha256 = $sha
            promotionState = $metadata.promotionState
            runtimePromotionAllowed = $metadata.runtimePromotionAllowed
            requiredNextGate = $metadata.requiredNextGate
          }
          $receiptPath = Join-Path $env:RUNNER_TEMP 'vibe2-roblox-practice-learning-receipt.json'
          $receipt | ConvertTo-Json -Depth 10 | Set-Content $receiptPath -Encoding utf8
          "PRACTICE_RECEIPT=$receiptPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'PRACTICE_WEIGHT_LEARNING=PASS'
          Write-Host "PRACTICE_TRAIN_LOSS=$($metadata.trainMetrics.train_loss)"
          Write-Host "PRACTICE_EVAL_LOSS=$($metadata.evalMetrics.eval_loss)"
          Write-Host 'PRACTICE_EVAL_PASSES=4'
          Write-Host "PRACTICE_CODE_EVAL_SAMPLES=$($codeEval.sampleCount)"
          Write-Host "PRACTICE_CODE_BASELINE_EVAL_LOSS=$($codeEval.baselineEvalLoss)"
          Write-Host "PRACTICE_CODE_ADAPTED_EVAL_LOSS=$($codeEval.adaptedEvalLoss)"
          Write-Host "PRACTICE_CODE_MATCHED_EVAL_IMPROVED=$($codeEval.lowerEvalLoss)"
          Write-Host 'PRACTICE_CODE_INDEPENDENT_HOLDOUT_VERIFIED=NO'
          Write-Host "PRACTICE_BASELINE_EVAL_LOSS=$($comparison.baselineEvalLoss)"
          Write-Host "PRACTICE_ADAPTED_EVAL_LOSS=$($comparison.adaptedEvalLoss)"
          Write-Host "PRACTICE_LOSS_REDUCTION=$($comparison.lossReduction)"
          Write-Host "PRACTICE_MATCHED_EVAL_IMPROVED=$($comparison.lowerEvalLoss)"
          Write-Host 'PRACTICE_MODEL_SCOPE=SMALL_CPU_PRACTICE_NOT_CANONICAL_1P7B'
          Write-Host 'PRACTICE_FIXED_HOLDOUT_AB_VERIFIED=NO'
          Write-Host 'PRACTICE_NATIVE_RUNTIME_VERIFIED=NO'
          Write-Host "PRACTICE_LICENSED_REFERENCE_SAMPLES=$($metadata.licensedReferenceSamples)"
          Write-Host "PRACTICE_ADAPTER_WEIGHTS_BYTES=$($weights.Length)"
          Write-Host "PRACTICE_ADAPTER_WEIGHTS_SHA256=$sha"
          Write-Host 'PRACTICE_PROMOTION_STATE=UNVERIFIED'
          Write-Host 'PRACTICE_RUNTIME_PROMOTION=NO'
      - name: Upload Roblox practice learning receipt
        uses: actions/upload-artifact@v4
        with:
          name: vibe2-roblox-practice-learning-receipt
          path: ${{ env.PRACTICE_RECEIPT }}
          retention-days: 1
          if-no-files-found: error
