name: Vibe2 Work Package Refactor Temp

on:
  push:
    branches:
      - 'feat/vibe2-work-package-scheduler'
    paths:
      - '.github/workflows/vibe2-work-package-refactor-temp.yml'
      - 'tools/vibe2-work-package-refactor-temp.py'
      - 'tools/vibe2-work-package-refactor-fix-temp.py'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vibe2-work-package-scheduler
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply work package scheduler refactor
        run: |
          python tools/vibe2-work-package-refactor-temp.py
          python tools/vibe2-work-package-refactor-fix-temp.py

      - name: Syntax and machine-state consistency
        run: |
          set -euo pipefail
          node --check tools/vibe2-work-package.mjs
          node --check tools/vibe2-auto-planner.mjs
          node --check tools/vibe2-continuous-runner.mjs
          node --check assets/vibe-continuous-queue.js
          node --check qa/vibe2-work-package.test.mjs
          node --check qa/vibe2-auto-planner.test.mjs
          node --check qa/vibe2-queue-control.test.mjs
          node --check qa/vibe2-controller-contract.test.mjs
          node tools/vibe2-handoff.mjs --check --output=/tmp/vibe2-work-package-handoff.json >/tmp/vibe2-work-package-handoff.log
          git diff --check

      - name: Work package and planner tests
        run: |
          set -euo pipefail
          node --test qa/vibe2-work-package.test.mjs
          node --test qa/vibe2-auto-planner.test.mjs
          node --test qa/vibe2-queue-control.test.mjs
          node --test qa/vibe2-controller-contract.test.mjs

      - name: Full Vibe2 regression contract
        run: |
          set -euo pipefail
          node --test --test-concurrency=4 \
            qa/vibe2-auto-planner.test.mjs \
            qa/vibe2-work-package.test.mjs \
            qa/vibe2-core-engine-motion.test.mjs \
            qa/vibe2-design-intelligence.test.mjs \
            qa/vibe2-source-worker.test.mjs \
            qa/vibe2-queue-control.test.mjs \
            qa/vibe2-incremental-qa.test.mjs \
            qa/vibe2-parallelism-telemetry.test.mjs \
            qa/vibe2-adaptive-backpressure.test.mjs \
            qa/vibe2-controller-contract.test.mjs \
            qa/vibe2-candidate-reconcile.test.mjs \
            qa/vibe2-experience-control.test.mjs \
            qa/vibe2-handoff.test.mjs

      - name: Commit verified product changes and QA workflow snapshot
        run: |
          set -euo pipefail
          mkdir -p .vibe2/workflow-snapshots
          cp .github/workflows/vibe2-core-qa.yml .vibe2/workflow-snapshots/vibe2-core-qa.yml
          git checkout -- .github/workflows/vibe2-core-qa.yml
          git config user.name 'jaewoon-vibe2-work-package'
          git config user.email 'vibe2-work-package@users.noreply.github.com'
          git add \
            VIBE2.md \
            vibe2-runtime.json \
            assets/vibe-continuous-queue.js \
            tools/vibe2-work-package.mjs \
            tools/vibe2-auto-planner.mjs \
            tools/vibe2-continuous-runner.mjs \
            qa/vibe2-work-package.test.mjs \
            qa/vibe2-auto-planner.test.mjs \
            qa/vibe2-queue-control.test.mjs \
            qa/vibe2-controller-contract.test.mjs \
            .vibe2/workflow-snapshots/vibe2-core-qa.yml
          git diff --cached --check
          git commit -m 'vibe2: schedule functional work packages with workload telemetry'
          git push origin HEAD:feat/vibe2-work-package-scheduler
