name: Game Loop Test

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test common game loop and session integration
        run: |
          rm -rf /tmp/jaewoon-loop
          mkdir -p /tmp/jaewoon-loop
          cp assets/game-loop.js assets/game-session.js assets/vibe-runtime.js assets/game-blueprint.js assets/game-presets.js assets/game-kit.js assets/d20-rules.js assets/turn-combat.js assets/character-progression.js assets/inventory-equipment.js assets/quest-dialogue.js assets/skill-effects.js assets/economy-loot-shop.js assets/save-versioning.js /tmp/jaewoon-loop/
          printf '{"type":"module"}\n' > /tmp/jaewoon-loop/package.json
          cd /tmp/jaewoon-loop
          node --check game-loop.js
          node --check game-session.js
          node --input-type=module <<'NODE'
          import { JaewoonGameLoop } from './game-loop.js';
          import { createGameSession } from './game-session.js';
          import { buildGamePreset } from './game-presets.js';

          let updates = 0;
          let renders = 0;
          const scheduled = [];
          const loop = new JaewoonGameLoop({
            stepSeconds: 0.1,
            maxUpdatesPerFrame: 3,
            update: () => { updates += 1; },
            render: () => { renders += 1; },
            schedule: (fn) => { scheduled.push(fn); return scheduled.length; },
            cancel: () => {},
          });
          loop.start();
          const first = scheduled.shift();
          first(1000);
          const second = scheduled.shift();
          second(1250);
          if (updates !== 2) throw new Error(`fixed step failed: ${updates}`);
          if (renders !== 2) throw new Error('render count failed');
          loop.pause();
          const third = scheduled.shift();
          third(1500);
          if (updates !== 2) throw new Error('paused loop updated');
          loop.resume();
          loop.stepOnce(2);
          if (updates !== 4) throw new Error('manual step failed');
          loop.stop();

          const storage = new Map();
          globalThis.localStorage = {
            getItem: (key) => storage.has(key) ? storage.get(key) : null,
            setItem: (key, value) => storage.set(key, String(value)),
            removeItem: (key) => storage.delete(key),
          };
          const session = createGameSession({
            gameId: 'loop-session',
            genre: 'action',
            autoRestore: false,
            loopOptions: { schedule: () => 1, cancel: () => {} },
          });
          session.start({ bootRuntime: false, startLoop: true });
          if (!session.loop.running) throw new Error('session loop did not start');
          session.pause('qa');
          if (!session.loop.paused || !session.runtime.paused) throw new Error('session pause sync failed');
          session.resume('qa');
          if (session.loop.paused || session.runtime.paused) throw new Error('session resume sync failed');
          session.destroy();
          if (session.loop.running) throw new Error('session loop did not stop');

          const preset = buildGamePreset({ genre: 'action' });
          if (!preset.systems.includes('game-loop')) throw new Error('game-loop missing from preset');
          if (!preset.qa.includes('game-loop-timing') || !preset.qa.includes('pause-resume')) throw new Error('game-loop QA missing');
          console.log('PASS game loop');
          NODE
