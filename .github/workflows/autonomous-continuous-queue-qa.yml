name: Autonomous Continuous Queue QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/autonomous-continuous-development.yml'
      - '.github/workflows/autonomous-candidate-promotion.yml'
      - '.github/workflows/autonomous-continuous-queue-qa.yml'
      - '.github/workflows/vibe2-candidate-release.yml'
      - '.github/workflows/vibe2-unity-release-result.yml'
      - '.github/workflows/public-game-health.yml'
      - '.github/workflows/autonomous-portfolio-continuation.yml'
      - '.github/workflows/autonomous-new-game-incubator.yml'
      - 'tools/autonomous-work-planner.mjs'
      - 'tools/autonomous-24h-work-planner.mjs'
      - 'tools/autonomous-department-cycle.mjs'
      - 'tools/autonomous-department-integrator.mjs'
      - 'tools/autonomous-queue-state.mjs'
      - 'tools/autonomous-development-worker.mjs'
      - 'tools/autonomous-vibe-release-handoff.mjs'
      - 'tools/autonomous-safe-edit.mjs'
      - 'tools/autonomous-diagnostics.mjs'
      - 'tools/autonomous-rule-patcher.mjs'
      - 'tools/autonomous-portfolio-continuation.mjs'
      - 'tools/autonomous-new-game-incubator.mjs'
      - 'qa/autonomous-department-integrator.test.mjs'
      - 'qa/autonomous-work-planner.test.mjs'
      - 'qa/autonomous-24h-work-planner.test.mjs'
      - 'qa/autonomous-queue-state.test.mjs'
      - 'qa/autonomous-development-worker.test.mjs'
      - 'qa/autonomous-vibe-release-handoff.test.mjs'
      - 'qa/autonomous-diagnostics.test.mjs'
      - 'qa/autonomous-rule-patcher.test.mjs'
      - 'qa/autonomous-portfolio-continuation.test.mjs'
      - 'qa/autonomous-new-game-incubator.test.mjs'
      - 'autonomous-portfolio.json'
  pull_request:
    paths:
      - '.github/workflows/autonomous-continuous-development.yml'
      - '.github/workflows/autonomous-candidate-promotion.yml'
      - '.github/workflows/autonomous-continuous-queue-qa.yml'
      - '.github/workflows/vibe2-candidate-release.yml'
      - '.github/workflows/vibe2-unity-release-result.yml'
      - '.github/workflows/public-game-health.yml'
      - 'tools/autonomous-24h-work-planner.mjs'
      - 'tools/autonomous-department-cycle.mjs'
      - 'tools/autonomous-department-integrator.mjs'
      - 'tools/autonomous-development-worker.mjs'
      - 'tools/autonomous-vibe-release-handoff.mjs'
      - 'qa/autonomous-department-integrator.test.mjs'
      - 'qa/autonomous-development-worker.test.mjs'
      - 'qa/autonomous-vibe-release-handoff.test.mjs'
      - 'autonomous-portfolio.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  queue-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Queue, planner, integration, worker and continuation tests
        run: |
          set -euo pipefail
          node --check tools/autonomous-queue-state.mjs
          node --check tools/autonomous-work-planner.mjs
          node --check tools/autonomous-24h-work-planner.mjs
          node --check tools/autonomous-department-cycle.mjs
          node --check tools/autonomous-department-integrator.mjs
          node --check tools/autonomous-development-worker.mjs
          node --check tools/autonomous-vibe-release-handoff.mjs
          node --test qa/autonomous-queue-state.test.mjs
          node --test qa/autonomous-work-planner.test.mjs
          node --test qa/autonomous-24h-work-planner.test.mjs
          node --test qa/autonomous-development-worker.test.mjs
          node --test qa/autonomous-department-integrator.test.mjs
          node --test qa/autonomous-vibe-release-handoff.test.mjs
      - name: Enforce 24h parallel-code event queue contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const continuous=fs.readFileSync('.github/workflows/autonomous-continuous-development.yml','utf8');
          const promotion=fs.readFileSync('.github/workflows/autonomous-candidate-promotion.yml','utf8');
          const release=fs.readFileSync('.github/workflows/vibe2-candidate-release.yml','utf8');
          const unity=fs.readFileSync('.github/workflows/vibe2-unity-release-result.yml','utf8');
          const health=fs.readFileSync('.github/workflows/public-game-health.yml','utf8');
          const integrator=fs.readFileSync('tools/autonomous-department-integrator.mjs','utf8');
          const portfolio=JSON.parse(fs.readFileSync('autonomous-portfolio.json','utf8'));
          const must=(ok,msg)=>{if(!ok)throw new Error(msg)};
          must(portfolio.paidApi===false,'paidApi must remain false');
          must(portfolio.continuous24hDevelopment===true,'24h loop must remain enabled');
          must(portfolio.sameGameDailyFloorCap===null,'same-game daily cap must remain disabled');
          must(portfolio.completedArtbookDailyWorkCap===null,'completed-artbook cap must remain disabled');
          must(portfolio.departmentCodeWorkspaces==='PARALLEL_ISOLATED','parallel department code workspaces missing');
          must(portfolio.finalIntegrationConcurrency==='SERIAL','final integration must remain serial');
          must(continuous.includes("cron: '17 * * * *'"),'recovery wake missing');
          must(continuous.includes('group: autonomous-dev-writer'),'single source-root floor ownership missing');
          must(continuous.includes('role: [planning, development, graphics, qa, balance]'),'parallel review matrix missing');
          must(continuous.includes('role: [development, graphics, qa, balance]'),'parallel code matrix missing');
          must(continuous.includes('NO_DISJOINT_RESPONSIBILITY_FILE_FOR_THIS_FLOOR'),'disjoint responsibility guard missing');
          must(continuous.includes('Three-way integrate isolated department code'),'integration queue stage missing');
          must(continuous.includes('AI adjusts true same-file conflict only'),'conflict adjustment stage missing');
          must(continuous.includes('FINAL_QA_GATE=AUTONOMOUS_CANDIDATE_PROMOTION'),'single final QA dispatch evidence missing');
          must(continuous.includes('FAILED_FLOOR_NEXT=DISPATCHED'),'failed floor continuation missing');
          must(integrator.includes('COMMON_BASE_THREE_WAY'),'common-base integrator missing');
          must(integrator.includes('changed file count exceeds 4'),'bounded integrated change count missing');
          must(promotion.includes('INDEPENDENT_CANDIDATE_QA=PASS')&&promotion.includes('DEV_REGRESSION=PASS'),'final independent promotion QA missing');
          must(release.includes('AUTONOMOUS_NEXT_FLOOR=WAITING_FOR_PUBLIC_HEALTH'),'release must not start next floor before health');
          must(health.includes('POST_RELEASE_NEXT_FLOOR=DISPATCHED'),'health must resume next floor');
          must(health.includes('POST_RELEASE_VIBE_LEARNING=DISPATCHED'),'health must dispatch Vibe learning');
          must(unity.includes('AUTONOMOUS_NEXT_FLOOR=DISPATCHED_AFTER_UNITY_RELEASE_EVIDENCE'),'Unity must resume after release evidence');
          console.log('CONTINUOUS_24H_PARALLEL_CODE_QUEUE_CONTRACT=PASS');
          console.log('FINAL_INTEGRATION_AND_QA_QUEUE_CONTRACT=PASS');
          console.log('POST_RELEASE_FEEDBACK_QUEUE_CONTRACT=PASS');
          NODE
