name: Autonomous Continuous Queue QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/autonomous-continuous-development.yml'
      - '.github/workflows/autonomous-candidate-promotion.yml'
      - '.github/workflows/autonomous-continuous-queue-qa.yml'
      - '.github/workflows/autonomous-portfolio-continuation.yml'
      - '.github/workflows/autonomous-new-game-incubator.yml'
      - 'tools/autonomous-work-planner.mjs'
      - 'tools/autonomous-24h-work-planner.mjs'
      - 'tools/autonomous-department-cycle.mjs'
      - 'tools/autonomous-queue-state.mjs'
      - 'tools/autonomous-development-worker.mjs'
      - 'tools/autonomous-safe-edit.mjs'
      - 'tools/autonomous-diagnostics.mjs'
      - 'tools/autonomous-rule-patcher.mjs'
      - 'tools/autonomous-portfolio-continuation.mjs'
      - 'tools/autonomous-new-game-incubator.mjs'
      - 'qa/autonomous-work-planner.test.mjs'
      - 'qa/autonomous-24h-work-planner.test.mjs'
      - 'qa/autonomous-queue-state.test.mjs'
      - 'qa/autonomous-development-worker.test.mjs'
      - 'qa/autonomous-diagnostics.test.mjs'
      - 'qa/autonomous-rule-patcher.test.mjs'
      - 'qa/autonomous-portfolio-continuation.test.mjs'
      - 'qa/autonomous-new-game-incubator.test.mjs'
      - 'autonomous-portfolio.json'
  pull_request:
    paths:
      - '.github/workflows/autonomous-continuous-development.yml'
      - '.github/workflows/autonomous-candidate-promotion.yml'
      - '.github/workflows/autonomous-continuous-queue-qa.yml'
      - '.github/workflows/autonomous-portfolio-continuation.yml'
      - '.github/workflows/autonomous-new-game-incubator.yml'
      - 'tools/autonomous-work-planner.mjs'
      - 'tools/autonomous-24h-work-planner.mjs'
      - 'tools/autonomous-department-cycle.mjs'
      - 'tools/autonomous-queue-state.mjs'
      - 'tools/autonomous-development-worker.mjs'
      - 'tools/autonomous-safe-edit.mjs'
      - 'tools/autonomous-diagnostics.mjs'
      - 'tools/autonomous-rule-patcher.mjs'
      - 'tools/autonomous-portfolio-continuation.mjs'
      - 'tools/autonomous-new-game-incubator.mjs'
      - 'qa/autonomous-work-planner.test.mjs'
      - 'qa/autonomous-24h-work-planner.test.mjs'
      - 'qa/autonomous-queue-state.test.mjs'
      - 'qa/autonomous-development-worker.test.mjs'
      - 'qa/autonomous-diagnostics.test.mjs'
      - 'qa/autonomous-rule-patcher.test.mjs'
      - 'qa/autonomous-portfolio-continuation.test.mjs'
      - 'qa/autonomous-new-game-incubator.test.mjs'
      - 'autonomous-portfolio.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  queue-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Queue, planner, departments, worker, diagnostics and continuation tests
        run: |
          set -euo pipefail
          node --check tools/autonomous-queue-state.mjs
          node --check tools/autonomous-work-planner.mjs
          node --check tools/autonomous-24h-work-planner.mjs
          node --check tools/autonomous-department-cycle.mjs
          node --check tools/autonomous-development-worker.mjs
          node --check tools/autonomous-safe-edit.mjs
          node --check tools/autonomous-diagnostics.mjs
          node --check tools/autonomous-rule-patcher.mjs
          node --check tools/autonomous-portfolio-continuation.mjs
          node --check tools/autonomous-new-game-incubator.mjs
          node --test qa/autonomous-queue-state.test.mjs
          node --test qa/autonomous-work-planner.test.mjs
          node --test qa/autonomous-24h-work-planner.test.mjs
          node --test qa/autonomous-development-worker.test.mjs
          node --test qa/autonomous-diagnostics.test.mjs
          node --test qa/autonomous-rule-patcher.test.mjs
          node --test qa/autonomous-portfolio-continuation.test.mjs
          node --test qa/autonomous-new-game-incubator.test.mjs
      - name: Enforce 24h event-driven department queue contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const continuous=fs.readFileSync('.github/workflows/autonomous-continuous-development.yml','utf8');
          const promotion=fs.readFileSync('.github/workflows/autonomous-candidate-promotion.yml','utf8');
          const continuation=fs.readFileSync('.github/workflows/autonomous-portfolio-continuation.yml','utf8');
          const incubator=fs.readFileSync('.github/workflows/autonomous-new-game-incubator.yml','utf8');
          const worker=fs.readFileSync('tools/autonomous-development-worker.mjs','utf8');
          const planner=fs.readFileSync('tools/autonomous-24h-work-planner.mjs','utf8');
          const department=fs.readFileSync('tools/autonomous-department-cycle.mjs','utf8');
          const incubatorTool=fs.readFileSync('tools/autonomous-new-game-incubator.mjs','utf8');
          const portfolio=JSON.parse(fs.readFileSync('autonomous-portfolio.json','utf8'));
          const must=(ok,msg)=>{if(!ok)throw new Error(msg)};
          must(portfolio.paidApi===false,'paidApi must remain false');
          must(Number(portfolio.maxModelCallsPerRun)===2,'worker model retry cap must remain 2');
          must(portfolio.continuous24hDevelopment===true,'24h loop must be enabled');
          must(portfolio.sameGameDailyFloorCap===null,'same game must be allowed multiple floors per day');
          must(portfolio.completedArtbookDailyWorkCap===null,'completed artbook daily cap must be disabled');
          must(Array.isArray(portfolio.departmentDevelopmentCycle)&&portfolio.departmentDevelopmentCycle.join(',')==='planning,development,graphics,qa,balance,planning-final','department cycle mismatch');
          must(continuous.includes("cron: '17 * * * *'"),'hourly recovery wake missing');
          must(continuous.includes('actions: write'),'continuous workflow dispatch permission missing');
          must(continuous.includes("AUTONOMOUS_MODEL_MAX_PREDICT: '1536'"),'CPU model output bound missing');
          must(continuous.includes("AUTONOMOUS_MODEL_TIMEOUT_MS: '240000'"),'CPU model timeout bound missing');
          must(continuous.includes("AUTONOMOUS_MODEL_MAX_ATTEMPTS: '2'"),'two-attempt worker retry contract missing');
          must(continuous.includes('node tools/autonomous-24h-work-planner.mjs'),'24h planner missing');
          must(continuous.includes('Reserve this development floor'),'repeatable floor reservation missing');
          must(continuous.indexOf('Verified free budget preflight') < continuous.indexOf('Reserve this development floor'),'budget preflight must precede reservation');
          must(continuous.indexOf('Reserve this development floor') < continuous.indexOf('Install local Ollama'),'reservation must precede AI work');
          must(continuous.includes('AI departments run the development floor'),'department cycle step missing');
          must(continuous.includes('Attach department cycle to candidate evidence'),'department evidence gate missing');
          must(continuous.includes('same game daily floor cap: NONE'),'same-game unlimited evidence missing');
          must(continuous.includes('completed DESIGN_BASELINE daily work cap: NONE'),'completed-artbook unlimited evidence missing');
          must(continuous.includes("if: failure() && steps.reserve.outputs.reserved == 'true'"),'reserved failure continuation missing');
          must(continuous.includes('FAILED_FLOOR_NEXT=DISPATCHED'),'failed floor must dispatch another floor');
          must(planner.includes("selection:'LEAST_KST_ATTEMPTS_FIRST'"),'fair repeated-floor selection missing');
          must(department.includes("const ROLES=['planning','development','graphics','qa','balance','planning-final']"),'all AI departments are not wired');
          must(department.includes('allDepartmentsWorked:true'),'department completion evidence missing');
          must(worker.includes('stream:true'),'worker Ollama response must be streamed');
          must(worker.includes("modelTransport:repairMode==='RULE_PATCH'?'NONE':'NDJSON_STREAM_STRUCTURED_SCHEMA'"),'structured stream transport evidence missing');
          must(worker.includes('modelNormalization:candidate.normalization'),'deterministic model-normalization evidence missing');
          must(continuation.includes('workflow_dispatch:'),'portfolio continuation must remain explicitly dispatched');
          must(!continuation.includes('workflow_run:'),'portfolio continuation must not duplicate workflow_run');
          must(incubator.includes('created_today'),'new-concept duplicate guard missing');
          must(incubatorTool.includes('stream:true'),'incubator model response must be streamed');
          must(promotion.includes('actions: write'),'promotion dispatch permission missing');
          must(promotion.includes('gh workflow run autonomous-continuous-development.yml --ref main'),'immediate next-floor dispatch missing');
          must(promotion.includes('if: always()'),'queue continuation must survive candidate rejection');
          must(promotion.includes('public game main promotion: NO'),'public main promotion guard missing');
          must(!promotion.includes('PUBLIC_RELEASE=YES'),'public release must never be automatic');
          console.log('CONTINUOUS_24H_DEPARTMENT_QUEUE_CONTRACT=PASS');
          NODE
