name: Autonomous Continuous Queue QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/autonomous-continuous-development.yml'
      - '.github/workflows/autonomous-candidate-promotion.yml'
      - '.github/workflows/autonomous-continuous-queue-qa.yml'
      - '.github/workflows/autonomous-portfolio-continuation.yml'
      - '.github/workflows/autonomous-new-game-incubator.yml'
      - 'tools/autonomous-work-planner.mjs'
      - 'tools/autonomous-queue-state.mjs'
      - 'tools/autonomous-development-worker.mjs'
      - 'tools/autonomous-safe-edit.mjs'
      - 'tools/autonomous-portfolio-continuation.mjs'
      - 'tools/autonomous-new-game-incubator.mjs'
      - 'qa/autonomous-work-planner.test.mjs'
      - 'qa/autonomous-queue-state.test.mjs'
      - 'qa/autonomous-development-worker.test.mjs'
      - 'qa/autonomous-portfolio-continuation.test.mjs'
      - 'qa/autonomous-new-game-incubator.test.mjs'
      - 'autonomous-portfolio.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  queue-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Queue, planner, worker and continuation tests
        run: |
          node --check tools/autonomous-queue-state.mjs
          node --check tools/autonomous-work-planner.mjs
          node --check tools/autonomous-development-worker.mjs
          node --check tools/autonomous-safe-edit.mjs
          node --check tools/autonomous-portfolio-continuation.mjs
          node --check tools/autonomous-new-game-incubator.mjs
          node --test qa/autonomous-queue-state.test.mjs
          node --test qa/autonomous-work-planner.test.mjs
          node --test qa/autonomous-development-worker.test.mjs
          node --test qa/autonomous-portfolio-continuation.test.mjs
          node --test qa/autonomous-new-game-incubator.test.mjs
      - name: Enforce bounded event-driven queue contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const continuous=fs.readFileSync('.github/workflows/autonomous-continuous-development.yml','utf8');
          const promotion=fs.readFileSync('.github/workflows/autonomous-candidate-promotion.yml','utf8');
          const continuation=fs.readFileSync('.github/workflows/autonomous-portfolio-continuation.yml','utf8');
          const incubator=fs.readFileSync('.github/workflows/autonomous-new-game-incubator.yml','utf8');
          const worker=fs.readFileSync('tools/autonomous-development-worker.mjs','utf8');
          const incubatorTool=fs.readFileSync('tools/autonomous-new-game-incubator.mjs','utf8');
          const portfolio=JSON.parse(fs.readFileSync('autonomous-portfolio.json','utf8'));
          const must=(ok,msg)=>{if(!ok)throw new Error(msg)};
          must(portfolio.paidApi===false,'paidApi must remain false');
          must(Number(portfolio.maxAutonomousWorkItemsPerDay)>=1&&Number(portfolio.maxAutonomousWorkItemsPerDay)<=24,'daily autonomous cap missing/unsafe');
          must(continuous.includes("cron: '5 15 * * *'"),'00:05 KST daily reset wake missing');
          must(continuous.includes("cron: '10 7 * * *'"),'16:10 KST recovery wake missing');
          must(continuous.includes('actions: write'),'continuous workflow dispatch permission missing');
          must(continuous.includes("AUTONOMOUS_MODEL_MAX_PREDICT: '1536'"),'CPU model output bound missing');
          must(continuous.includes("AUTONOMOUS_MODEL_TIMEOUT_MS: '240000'"),'CPU model timeout bound missing');
          must(continuous.includes('Reserve this game once for today'),'queue reservation missing');
          must(continuous.indexOf('Verified free budget preflight') < continuous.indexOf('Reserve this game once for today'),'budget preflight must precede reservation');
          must(continuous.indexOf('Reserve this game once for today') < continuous.indexOf('Install local Ollama'),'reservation must precede model work');
          must(continuous.includes('same game per KST day: max 1 reservation'),'same-game daily bound missing');
          must(continuous.includes("steps.order.outputs.reason == 'NO_UNPROCESSED_WORK_TODAY'"),'exhausted queue condition missing');
          must(continuous.includes('gh workflow run autonomous-portfolio-continuation.yml --ref main'),'direct portfolio handoff missing');
          must(continuous.includes('PORTFOLIO_CONTINUATION=DISPATCHED'),'portfolio handoff evidence missing');
          must(continuous.includes("if: failure() && steps.reserve.outputs.reserved == 'true'"),'reserved failure continuation missing');
          must(continuous.includes('FAILED_WORK_NEXT=DISPATCHED'),'failed work must dispatch next bounded item');
          must(worker.includes('stream:true'),'Ollama response must be streamed');
          must(worker.includes("modelTransport:'NDJSON_STREAM'"),'stream transport evidence missing');
          must(worker.includes('modelNormalization:candidate.normalization'),'deterministic model-normalization evidence missing');
          must(continuation.includes('workflow_dispatch:'),'portfolio continuation must be explicitly dispatched');
          must(!continuation.includes('workflow_run:'),'portfolio continuation must not have duplicate workflow_run trigger');
          must(continuation.includes("gh workflow run autonomous-new-game-incubator.yml --ref main -f create_concept=true"),'portfolio to incubator dispatch missing');
          must(incubator.includes('created_today'),'duplicate new concept daily guard missing');
          must(incubator.includes("INCUBATOR_MODEL_MAX_PREDICT: '1536'"),'incubator CPU output bound missing');
          must(incubator.includes("INCUBATOR_MODEL_TIMEOUT_MS: '240000'"),'incubator CPU timeout bound missing');
          must(incubatorTool.includes("if(process.argv[1]&&import.meta.url===pathToFileURL(process.argv[1]).href)"),'incubator import-safe guard missing');
          must(incubatorTool.includes('stream:true'),'incubator model response must be streamed');
          must(promotion.includes('actions: write'),'promotion workflow dispatch permission missing');
          must(promotion.includes('gh workflow run autonomous-continuous-development.yml --ref main'),'immediate next-work dispatch missing');
          must(promotion.includes('if: always()'),'queue continuation must survive candidate rejection');
          must(promotion.includes('public game main promotion: NO'),'public main promotion guard missing');
          must(!promotion.includes('PUBLIC_RELEASE=YES'),'public release must never be automatic');
          console.log('CONTINUOUS_QUEUE_CONTRACT=PASS');
          NODE
