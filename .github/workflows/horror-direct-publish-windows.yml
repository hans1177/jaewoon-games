name: Horror Direct Publish Windows

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/horror-direct-publish-windows.yml'

permissions:
  contents: read

concurrency:
  group: horror-direct-publish-windows
  cancel-in-progress: true

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GAME_ID: horror-escape-room
      GAME_NAME: '심야 감염전 [4대4]'
      UNIVERSE_ID: '10767445796'
      PLACE_ID: '98222620265768'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rojo
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path C:\horror-direct | Out-Null
          Invoke-WebRequest -Uri "https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip" -OutFile C:\horror-direct\rojo.zip
          Expand-Archive -Path C:\horror-direct\rojo.zip -DestinationPath C:\horror-direct\rojo -Force

      - name: Build latest main place
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & C:\horror-direct\rojo\rojo.exe build "roblox-games/$env:GAME_ID/default.project.json" -o "C:\horror-direct\$env:GAME_ID.rbxlx"
          if (-not (Test-Path "C:\horror-direct\$env:GAME_ID.rbxlx")) { throw "BUILD_MISSING" }

      - name: Publish latest main to existing Roblox place
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_ROBLOSECURITY: ${{ secrets.ROBLOX_ROBLOSECURITY }}
          ROBLOX_SECURITY_COOKIE: ${{ secrets.ROBLOX_SECURITY_COOKIE }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:ROBLOX_OPEN_CLOUD_API_KEY)) { throw "ROBLOX_OPEN_CLOUD_API_KEY_MISSING" }
          node tools/company-roblox-dedicated-experience.mjs --game-id "$env:GAME_ID" --game-name "$env:GAME_NAME" --place-file "C:\horror-direct\$env:GAME_ID.rbxlx" --source-revision "$env:GITHUB_SHA" --output "C:\horror-direct\result.json" --reuse-universe-id "$env:UNIVERSE_ID" --reuse-place-id "$env:PLACE_ID"

      - name: Verify publish
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $r = Get-Content "C:\horror-direct\result.json" -Raw | ConvertFrom-Json
          if (-not $r.pass -or -not $r.published) { throw "DIRECT_PUBLISH_FAILED" }
          if ([string]$r.universeId -ne $env:UNIVERSE_ID -or [string]$r.placeId -ne $env:PLACE_ID) { throw "DIRECT_PUBLISH_TARGET_DRIFT" }
          Write-Host "HORROR_DIRECT_PUBLISH=PASS"
          Write-Host "HORROR_DIRECT_TARGET=$($r.universeId)/$($r.placeId)"
