name: Unity Animation Test Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'unity-games/animation-test/**'
      - '.github/workflows/unity-animation-test-android.yml'

permissions:
  contents: read

env:
  PROJECT_PATH: unity-games/animation-test

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Verify Unity license secrets
        env:
          UNITY_LICENSE_VALUE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL_VALUE: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD_VALUE: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$UNITY_LICENSE_VALUE" ] || [ -z "$UNITY_EMAIL_VALUE" ] || [ -z "$UNITY_PASSWORD_VALUE" ]; then
            echo '::error::Unity CI secrets missing. Required: UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD.'
            exit 1
          fi

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: unity-animation-test-android-${{ hashFiles('unity-games/animation-test/Assets/**', 'unity-games/animation-test/Packages/**', 'unity-games/animation-test/ProjectSettings/**') }}
          restore-keys: |
            unity-animation-test-android-

      - name: Free disk space for Android build
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: Build Android development APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: auto
          targetPlatform: Android
          androidExportType: androidPackage
          buildMethod: AndroidCiBuild.Build

      - name: Verify exact-commit APK
        run: |
          set -euo pipefail
          APK="$PROJECT_PATH/Build/animation-test.apk"
          test -s "$APK"
          printf '%s\n' "$GITHUB_SHA" > "$PROJECT_PATH/Build/commit-sha.txt"
          sha256sum "$APK" > "$PROJECT_PATH/Build/animation-test.apk.sha256"

      - name: Upload exact-commit APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: animation-test-android-${{ github.sha }}
          path: |
            unity-games/animation-test/Build/animation-test.apk
            unity-games/animation-test/Build/animation-test.apk.sha256
            unity-games/animation-test/Build/commit-sha.txt
          if-no-files-found: error
          retention-days: 14
