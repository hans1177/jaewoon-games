name: Multiplayer Integration Test

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/multiplayer-integration-test.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run multiplayer integration test
        env:
          BASE_URL: https://jaewoon-multiplayer.anyanguy12.workers.dev
          RUN_ID_VALUE: ${{ github.run_id }}
        run: |
          node <<'NODE'
          const base = process.env.BASE_URL;
          const run = process.env.RUN_ID_VALUE;
          const password = `Jaewoon!${run}Test9`;
          const emails = Array.from({length:4}, (_,i)=>`jw-multi-${run}-${i+1}@example.com`);

          async function req(path, method='GET', body, token) {
            const headers = {'content-type':'application/json'};
            if (token) headers.authorization = `Bearer ${token}`;
            const r = await fetch(base + path, {method, headers, body: body ? JSON.stringify(body) : undefined});
            const text = await r.text();
            let data; try { data = JSON.parse(text); } catch { data = {raw:text}; }
            if (!r.ok) throw new Error(`${path} ${r.status} ${JSON.stringify(data)}`);
            return data;
          }

          async function openWs(roomId, token) {
            return await new Promise((resolve, reject) => {
              const url = base.replace(/^http/, 'ws') + `/room/${encodeURIComponent(roomId)}?token=${encodeURIComponent(token)}`;
              const ws = new WebSocket(url);
              const timer = setTimeout(()=>reject(new Error('websocket timeout')), 10000);
              ws.addEventListener('open', ()=>{});
              ws.addEventListener('message', e => {
                const m = JSON.parse(e.data);
                if (m.type === 'connected') { clearTimeout(timer); resolve(ws); }
              });
              ws.addEventListener('error', e => { clearTimeout(timer); reject(new Error('websocket error')); });
            });
          }

          const health = await req('/health');
          if (!health.ok) throw new Error('health failed');
          console.log('PASS health');

          const tokens = [];
          for (let i=0;i<4;i++) {
            await req('/auth/signup','POST',{email:emails[i],password,nickname:`tester${i+1}`});
            const login = await req('/auth/login','POST',{email:emails[i],password});
            if (!login.access_token) throw new Error('missing access token');
            tokens.push(login.access_token);
            const me = await req('/auth/me','GET',undefined,login.access_token);
            if (!me.user?.id) throw new Error('auth/me failed');
          }
          console.log('PASS signup login auth/me x4');

          const pvp1 = await req('/matchmake','POST',{mode:'pvp'},tokens[0]);
          const pvp2 = await req('/matchmake','POST',{mode:'pvp'},tokens[1]);
          if (pvp1.roomId !== pvp2.roomId || pvp2.status !== 'ready' || pvp2.maxPlayers !== 2) throw new Error('pvp matchmaking mismatch');
          console.log('PASS pvp auto matchmaking 2 players');

          const coop = [];
          for (let i=0;i<4;i++) coop.push(await req('/matchmake','POST',{mode:'coop'},tokens[i]));
          if (!coop.every(x=>x.roomId===coop[0].roomId) || coop[3].status!=='ready' || coop[3].maxPlayers!==4) throw new Error('coop 4-player matchmaking mismatch');
          console.log('PASS coop auto matchmaking 4 players');

          const friend = await req('/friend/create','POST',{mode:'pvp'},tokens[0]);
          const joined = await req('/friend/join','POST',{inviteCode:friend.inviteCode},tokens[1]);
          if (friend.roomId !== joined.roomId || joined.status !== 'ready') throw new Error('friend room mismatch');
          console.log('PASS friend room create/join');

          const ws1 = await openWs(friend.roomId,tokens[0]);
          const ws2 = await openWs(friend.roomId,tokens[1]);
          const gotEvent = new Promise((resolve,reject)=>{
            const t=setTimeout(()=>reject(new Error('event relay timeout')),8000);
            ws2.addEventListener('message',e=>{const m=JSON.parse(e.data); if(m.type==='event'&&m.test==='relay'){clearTimeout(t);resolve();}});
          });
          ws1.send(JSON.stringify({type:'event',test:'relay'}));
          await gotEvent;
          console.log('PASS websocket relay');

          const rematchReady = new Promise((resolve,reject)=>{
            const t=setTimeout(()=>reject(new Error('rematch timeout')),8000);
            const fn=e=>{const m=JSON.parse(e.data); if(m.type==='rematch_ready'){clearTimeout(t);resolve();}};
            ws1.addEventListener('message',fn); ws2.addEventListener('message',fn);
          });
          ws1.send(JSON.stringify({type:'rematch'}));
          ws2.send(JSON.stringify({type:'rematch'}));
          await rematchReady;
          console.log('PASS rematch');
          ws1.close(); ws2.close();
          console.log(`TEST_EMAIL_PREFIX=jw-multi-${run}-`);
          NODE
      - name: Self delete test workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/multiplayer-integration-test.yml
          git commit -m "멀티 통합 테스트 워크플로 정리"
          git push
