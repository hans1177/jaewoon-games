# 바이브 비주얼 래더: Studio 캡처 한 바퀴(플로어)가 오류 없이 끝날 때마다 NPC·배경·몹 디테일 단계를 한 칸 올린다.
# 상태 파일과 생성 Luau 모듈만 main에 커밋한다. 승인 자산이 필요한 단계는 올리지 않고 docs/devloop/VISUAL_LADDER.md에 부족 자산으로 기록한다.
name: Vibe Visual Ladder
on:
  workflow_run:
    workflows: ["Devloop Studio Capture"]
    types: [completed]
  workflow_dispatch:
    inputs:
      game:
        description: 게임 폴더 이름 (비우면 래더가 있는 모든 게임)
        required: false
        default: ''
        type: string
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: vibe-visual-ladder
  cancel-in-progress: false
jobs:
  advance:
    if: github.repository == 'hans1177/jaewoon-games' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Pillow (화면 검사용)
        run: pip install --quiet pillow
      - name: Advance ladder
        env:
          GAME_IN: ${{ inputs.game }}
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: |
          set -euo pipefail
          # 수동 실행은 지정한 게임만, 캡처 완료 이벤트는 래더가 있는 모든 게임을 대상으로 한다.
          if [ -n "${GAME_IN:-}" ]; then games="$GAME_IN"; else games=$(ls roblox-games/*/visual-ladder.json | cut -d/ -f2); fi
          for game in $games; do
            [[ "$game" =~ ^[a-z0-9-]+$ ]] || { echo "bad game id $game"; exit 1; }
            [ -f "roblox-games/$game/visual-ladder.json" ] || { echo "no ladder for $game"; continue; }
            report=""; extra=()
            if git fetch -q --depth 1 origin "${game}-studio-frames:refs/remotes/origin/${game}-studio-frames" 2>/dev/null; then
              git show "origin/${game}-studio-frames:report.json" > "$RUNNER_TEMP/report-$game.json" 2>/dev/null && report="$RUNNER_TEMP/report-$game.json"
              mkdir -p "$RUNNER_TEMP/frames-$game"
              git archive "origin/${game}-studio-frames" | tar -x -C "$RUNNER_TEMP/frames-$game" 2>/dev/null || true
              extra+=(--frames "$RUNNER_TEMP/frames-$game")
            fi
            # 성능 예산이 있는 게임만 실제 플레이 FPS를 읽어 성능 게이트에 쓴다(키가 없으면 건너뜀).
            uni=$(node -e "try{const s=require('./roblox-games/$game/visual-ladder.json');process.stdout.write((s.perfBudget&&s.perfBudget.universeId)||'')}catch{}")
            if [ -n "$uni" ] && [ -n "${ROBLOX_OPEN_CLOUD_API_KEY:-}" ]; then
              python3 tools/vibe-ladder-telemetry.py --universe "$uni" > "$RUNNER_TEMP/tel-$game.json" || echo '{"sessions":0}' > "$RUNNER_TEMP/tel-$game.json"
              extra+=(--telemetry "$RUNNER_TEMP/tel-$game.json")
            fi
            if [ -n "$report" ]; then
              node tools/vibe-visual-ladder.mjs --game "$game" --advance --report "$report" "${extra[@]}"
            else
              node tools/vibe-visual-ladder.mjs --game "$game" --advance "${extra[@]}"
            fi
            node tools/vibe-visual-ladder.mjs --game "$game" --check
            # 리그 키트 점검: 새 몬스터의 모션 가족·팔레트 누락을 일감 표로 남긴다(보고서에 BONES 줄이 없으면 건너뜀).
            [ -n "$report" ] && node tools/vibe-rig-kit.mjs --game "$game" --report "$report" || true
          done
      - name: Verify existing look quality contract
        run: node --test qa/vibe-look-govern.test.mjs
      - name: Promote ladder result through canonical reviewed PR
        id: promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "vibe-visual-ladder"
          git config user.email "vibe-visual-ladder@users.noreply.github.com"
          git add roblox-games/*/visual-ladder-state.json roblox-games/*/shared/VisualLadderState.luau roblox-games/*/src/ReplicatedStorage/Shared/VisualLadderState.luau roblox-games/*/shared/LookAssignment.luau roblox-games/*/src/ReplicatedStorage/Shared/LookAssignment.luau docs/devloop/VISUAL_LADDER_*.md docs/devloop/RIG_KIT_*.md vibe-ladder-status.json docs/devloop/ladder
          if git diff --cached --quiet; then echo 'VIBE_LADDER_CHANGE=NONE'; exit 0; fi
          # [권한] 자동 작성자는 main에 직접 쓰지 않는다. 검증된 변경만 기존 PR 병합 경로를 쓴다.
          mare_changed=$(git diff --cached --name-only | grep -E '^roblox-games/mare-essentia/(visual-ladder-state\.json|src/ReplicatedStorage/Shared/LookAssignment\.luau)$' || true)
          base=$(git rev-parse HEAD)
          branch="vibe-visual-ladder/${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git commit -m "비주얼 래더: 검증된 스튜디오 결과로 자산·룩 승급"
          git push origin "HEAD:refs/heads/$branch"
          pr=$(gh api -X POST "repos/$GITHUB_REPOSITORY/pulls" -f base=main -f head="$branch" -f title="바이브 비주얼 래더 자동 승급: ${GITHUB_RUN_ID}" -f body="기존 Studio 시각 검사 및 룩 회귀 테스트를 통과한 결과다. 게임 소스와 원본 에셋은 기존대로 유지하며 권한·F9·게시 검증을 생략하지 않는다." --jq '.number')
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr/files?per_page=100" --jq '.[].filename')
          bad=$(printf '%s\n' "$files" | grep -v -E '^(roblox-games/[a-z0-9-]+/(visual-ladder-state\.json|shared/(VisualLadderState|LookAssignment)\.luau|src/ReplicatedStorage/Shared/(VisualLadderState|LookAssignment)\.luau)|docs/devloop/(VISUAL_LADDER_[a-z0-9-]+\.md|RIG_KIT_[a-z0-9-]+\.md|ladder/.*)|vibe-ladder-status\.json)$' || true)
          if [ -n "$bad" ]; then echo "VIBE_LADDER_UNEXPECTED_FILE=$bad"; exit 1; fi
          # [동일 소스] 다른 main 변경이 먼저 들어왔으면 PR을 남기고 이번 자동 병합은 중단한다.
          live=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$live" != "$base" ]; then echo "VIBE_LADDER_STALE_MAIN_PR_OPEN=$pr"; exit 0; fi
          if gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$pr/merge" -f merge_method=squash -f commit_title="바이브 비주얼 래더 자동 승급 (#$pr)" >/dev/null; then
            echo "VIBE_LADDER_VERIFIED_PR_MERGED=$pr"
            if [ -n "$mare_changed" ]; then echo 'mare_changed=true' >> "$GITHUB_OUTPUT"; fi
          else
            echo "VIBE_LADDER_MERGE_UNVERIFIED_PR_OPEN=$pr"
          fi
      - name: Continue exact Mare look verification in official Studio
        if: steps.promotion.outputs.mare_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # [승격 이후] 연속 개선 후보나 실제 게임 적용 중일 때만 기존 30클릭·31화면 검사를 재요청한다.
          follow=$(node -e "const s=require('./roblox-games/mare-essentia/visual-ladder-state.json'); const l=s.look||{}; process.stdout.write(Number(l.pending?.streak||0)>0||(typeof l.preset==='string'&&l.confirmed!==true)?'yes':'no')")
          if [ "$follow" = 'yes' ]; then
            gh workflow run devloop-studio.yml --ref main -f game=mare-essentia -f script=roblox-games/mare-essentia/tools/devloop/studio-scripts/mare-qa-click.json
            echo 'MARE_LOOK_EXACT_STUDIO_RECHECK_DISPATCHED=YES' >> "$GITHUB_STEP_SUMMARY"
          fi
