name: Horror Owner Direct Publish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/horror-owner-direct-publish.yml'

permissions:
  contents: read

concurrency:
  group: horror-owner-direct-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GAME_ID: horror-escape-room
      SOURCE_REVISION: '2726daf945da958b062c7a2cd2089959f9b42a97'
      UNIVERSE_ID: '10767445796'
      PLACE_ID: '98222620265768'

    steps:
      - name: Checkout exact owner revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REVISION }}
          fetch-depth: 1

      - name: Verify owner lobby source
        shell: bash
        run: |
          set -euo pipefail
          grep -F '"name": "심야 대탈출"' "roblox-games/$GAME_ID/default.project.json"
          grep -F 'LobbyArtPass","MIDNIGHT_HOTEL_LOBBY_V2"' "roblox-games/$GAME_ID/server/Game.server.luau"
          grep -F 'LobbyBuildRevision","MIDNIGHT_HOTEL_20260930B"' "roblox-games/$GAME_ID/server/Game.server.luau"
          grep -F 'lobbyHeader.Name="LobbyHeader"' "roblox-games/$GAME_ID/client/Game.client.luau"
          grep -F 'lobbyHint.Text="승강기에 들어가면 5초 후 출발 · 최대 8명"' "roblox-games/$GAME_ID/client/Game.client.luau"
          python - <<'PY'
          from pathlib import Path
          p=Path("roblox-games/horror-escape-room/client/Game.client.luau")
          s=p.read_text(encoding="utf-8")
          assert "local browser=not isRoomServer\\n" not in s
          assert 'loadingTitle.Text="심야 대탈출"' in s
          assert 'hud.BackgroundColor3=Color3.fromRGB(12,12,13)' in s
          print("OWNER_SOURCE_GUARD=PASS")
          PY

      - name: Install pinned Rojo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rojo-bin /tmp/horror-owner
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip
          echo '22503e5839864f9d7c2171c48b536fc229f2cc4d8774c9cc149f60941d864073  /tmp/rojo.zip' | sha256sum -c -
          unzip -q /tmp/rojo.zip -d /tmp/rojo-bin
          chmod +x /tmp/rojo-bin/rojo

      - name: Build exact place
        shell: bash
        run: |
          set -euo pipefail
          /tmp/rojo-bin/rojo build "roblox-games/$GAME_ID/default.project.json" -o "/tmp/horror-owner/$GAME_ID.rbxlx"
          test -s "/tmp/horror-owner/$GAME_ID.rbxlx"
          sha256sum "/tmp/horror-owner/$GAME_ID.rbxlx" | tee /tmp/horror-owner/build.sha256
          echo "PLACE_FILE=/tmp/horror-owner/$GAME_ID.rbxlx" >> "$GITHUB_ENV"

      - name: Configure private experience directly
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ROBLOX_OPEN_CLOUD_API_KEY"
          curl --fail-with-body --retry 3 --retry-delay 2 \
            -X PATCH \
            -H "x-api-key: $ROBLOX_OPEN_CLOUD_API_KEY" \
            -H "Content-Type: application/json" \
            --data '{"displayName":"심야 대탈출","description":"심야 호텔에서 시작되는 8인 공포 추격전","visibility":"PRIVATE"}' \
            "https://apis.roblox.com/cloud/v2/universes/$UNIVERSE_ID?updateMask=displayName,description,visibility" \
            -o /tmp/horror-owner/configure.json
          curl --fail-with-body --retry 3 --retry-delay 2 \
            -X POST \
            -H "x-api-key: $ROBLOX_OPEN_CLOUD_API_KEY" \
            "https://apis.roblox.com/legacy-develop/v1/universes/$UNIVERSE_ID/deactivate" \
            -o /tmp/horror-owner/private.json

      - name: Publish directly with Roblox Open Cloud
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ROBLOX_OPEN_CLOUD_API_KEY"
          curl --fail-with-body --retry 3 --retry-delay 2 \
            -X POST \
            -H "x-api-key: $ROBLOX_OPEN_CLOUD_API_KEY" \
            -H "Content-Type: application/xml" \
            --data-binary "@$PLACE_FILE" \
            "https://apis.roblox.com/universes/v1/$UNIVERSE_ID/places/$PLACE_ID/versions?versionType=Published" \
            -o /tmp/horror-owner/publish.json
          cat /tmp/horror-owner/publish.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("/tmp/horror-owner/publish.json").read_text())
          n=r.get("versionNumber")
          assert isinstance(n,int) and n>0, r
          print("HORROR_OWNER_DIRECT_PUBLISH=PASS")
          print("ROBLOX_PLACE_VERSION="+str(n))
          PY

      - name: Upload direct publish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horror-owner-direct-publish
          path: |
            /tmp/horror-owner/build.sha256
            /tmp/horror-owner/configure.json
            /tmp/horror-owner/private.json
            /tmp/horror-owner/publish.json
          if-no-files-found: warn
          retention-days: 3
