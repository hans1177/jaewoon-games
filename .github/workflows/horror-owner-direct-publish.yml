name: Horror Owner Direct Publish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/horror-owner-direct-publish.yml'

permissions:
  contents: read

concurrency:
  group: horror-owner-direct-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: [self-hosted, Windows, X64, roblox-studio-authenticated]
    timeout-minutes: 20
    env:
      GAME_ID: horror-escape-room
      SOURCE_REVISION: '01a5bd5e1859c9d287b3638b0b0b85541d513aea'
      UNIVERSE_ID: '10767445796'
      PLACE_ID: '98222620265768'

    steps:
      - name: Checkout exact owner revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REVISION }}
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify owner direct policy and lobby source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $server=Get-Content "roblox-games/$env:GAME_ID/server/Game.server.luau" -Raw
          $client=Get-Content "roblox-games/$env:GAME_ID/client/Game.client.luau" -Raw
          $project=Get-Content "roblox-games/$env:GAME_ID/default.project.json" -Raw
          $policy=Get-Content "company-learning/platform-release-roadmap.json" -Raw
          $requiredServer=@(
            'LobbyArtPass","MIDNIGHT_HOTEL_LOBBY_V3"',
            'LobbyBuildRevision","MIDNIGHT_HOTEL_DETAIL_20260930"',
            'LobbySafetyCatch',
            'LobbySafetyRecoveredAt',
            'ElevatorBankWall',
            'ElevatorRouteSign',
            'teleport(player,lobbySpawns[slot],Vector3.new(0,3,210))'
          )
          foreach($marker in $requiredServer){ if(-not $server.Contains($marker)){ throw "SERVER_MARKER_MISSING:$marker" } }
          $requiredClient=@(
            'MidnightLobbyColor',
            'LobbyVignetteTop',
            'hud.Visible=running',
            'lobbyColor.Enabled=lobbyWaiting',
            '① 승강기 선택',
            'nearestDist<26'
          )
          foreach($marker in $requiredClient){ if(-not $client.Contains($marker)){ throw "CLIENT_MARKER_MISSING:$marker" } }
          if(-not $project.Contains('"name": "심야 대탈출"')){ throw 'PROJECT_NAME_MISSING' }
          if(-not $policy.Contains('"ownerExclusiveDevelopment"')){ throw 'OWNER_DIRECT_POLICY_MISSING' }
          if(-not $policy.Contains('"humanReadablePolicyMirrorForbidden": true')){ throw 'MACHINE_POLICY_GUARD_MISSING' }
          if($server.Contains('Enum.Material.Leather')){ throw 'UNSUPPORTED_MATERIAL_LEFT' }
          if($client.Contains('local browser=not isRoomServer\n')){ throw 'LITERAL_NEWLINE_BUG' }
          Write-Host 'HORROR_OWNER_STATIC_SOURCE=PASS'

      - name: Verify canonical machine policy contract
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          node --test qa/company-central-policy-contract.test.mjs

      - name: Install pinned Rojo
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'horror-owner-direct-v3'
          $bin=Join-Path $root 'rojo-bin'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          $zip=Join-Path $root 'rojo.zip'
          Invoke-WebRequest -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $zip
          $hash=(Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if($hash -ne '2179c44862a10ecbd725bdfeb4abc64e16dc4aad9b6c8f3e1a7c46a87280b949'){ throw "ROJO_HASH_MISMATCH:$hash" }
          Expand-Archive -Path $zip -DestinationPath $bin -Force
          $rojo=Get-ChildItem -Path $bin -Filter 'rojo.exe' -Recurse | Select-Object -First 1
          if(-not $rojo){ throw 'ROJO_EXE_MISSING' }
          "ROJO_EXE=$($rojo.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OWNER_OUT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build exact place
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $place=Join-Path $env:OWNER_OUT "$env:GAME_ID.rbxlx"
          & $env:ROJO_EXE build "roblox-games/$env:GAME_ID/default.project.json" -o $place
          if(-not (Test-Path $place)){ throw 'PLACE_BUILD_MISSING' }
          $hash=(Get-FileHash -Algorithm SHA256 $place).Hash.ToLowerInvariant()
          $hash | Out-File -FilePath (Join-Path $env:OWNER_OUT 'build.sha256') -Encoding utf8
          Write-Host "HORROR_OWNER_BUILD_SHA256=$hash"
          "PLACE_FILE=$place" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish directly to existing Roblox place
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:ROBLOX_OPEN_CLOUD_API_KEY)){ throw 'ROBLOX_OPEN_CLOUD_API_KEY_MISSING' }
          $headers=@{'x-api-key'=$env:ROBLOX_OPEN_CLOUD_API_KEY}
          $out=Join-Path $env:OWNER_OUT 'publish.json'
          $uri="https://apis.roblox.com/universes/v1/$env:UNIVERSE_ID/places/$env:PLACE_ID/versions?versionType=Published"
          Invoke-WebRequest -Method Post -Uri $uri -Headers $headers -ContentType 'application/xml' -InFile $env:PLACE_FILE -OutFile $out
          $r=Get-Content $out -Raw | ConvertFrom-Json
          $version=[int]$r.versionNumber
          if($version -le 0){ throw 'ROBLOX_PUBLISH_VERSION_MISSING' }
          Write-Host 'HORROR_OWNER_DIRECT_PUBLISH=PASS'
          Write-Host "ROBLOX_PLACE_VERSION=$version"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horror-owner-direct-publish-v3
          path: |
            ${{ env.OWNER_OUT }}\build.sha256
            ${{ env.OWNER_OUT }}\publish.json
          if-no-files-found: warn
          retention-days: 3
