# 파일명: .github/workflows/horror-owner-direct-publish.yml
name: Horror Owner Direct Publish
on:
  push:
    branches: [main]
    paths: ['.github/workflows/horror-owner-direct-publish.yml']
permissions:
  contents: write
concurrency:
  group: horror-owner-direct-publish
  cancel-in-progress: false
jobs:
  repair:
    runs-on: [self-hosted, Windows, X64, roblox-studio-authenticated]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Install verified compiler and packager in this job
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP ("horror-fix-"+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Force $out | Out-Null
          "OWNER_OUT=$out" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Invoke-WebRequest 'https://github.com/luau-lang/luau/releases/download/0.740/luau-windows.zip' -OutFile "$out/luau.zip"
          if((Get-FileHash "$out/luau.zip" -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'be676d9a1092b3d5ee36be5f5f11e2af1976911c32f5644a052548dc7c66bb9c'){throw 'LUAU_CHECKSUM'}
          Expand-Archive "$out/luau.zip" "$out/luau" -Force
          Invoke-WebRequest 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile "$out/rojo.zip"
          if((Get-FileHash "$out/rojo.zip" -Algorithm SHA256).Hash.ToLowerInvariant() -ne '2179c44862a10ecbd725bdfeb4abc64e16dc4aad9b6c8f3e1a7c46a87280b949'){throw 'ROJO_CHECKSUM'}
          Expand-Archive "$out/rojo.zip" "$out/rojo" -Force
      - name: Repair existing room initialization and compile actual sources
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          const fs=require('fs'),path=require('path'),cp=require('child_process'),assert=require('assert/strict');
          const base='roblox-games/horror-escape-room/';
          const sf=base+'server/Game.server.luau',cf=base+'client/Game.client.luau';
          const git=(...a)=>cp.execFileSync('git',a,{encoding:'utf8'}).trim();
          const expected='d494ba0f2301498e056d5dd71fa593939d966d6c';
          const current=git('rev-parse','HEAD:'+sf);
          assert(['76f16e373b5401d9fae7cabfad52e4caf38ae1da',expected].includes(current),'SERVER_CHANGED_REVIEW_REQUIRED');
          assert.equal(git('rev-parse','HEAD:'+cf),'416498c600416dd6b2bc5e0ee448cf3199854233','CLIENT_CHANGED_REVIEW_REQUIRED');
          if(current!==expected){
            let s=fs.readFileSync(sf,'utf8').replace(/\r\n/g,'\n');
            const replacements=[
              ['local roomDirectory=MemoryStoreService:GetSortedMap("midnight-infection-room-directory-v1")\nlocal studioRoomFallback=RunService:IsStudio()', '-- 로컬 플레이는 기존 단일 서버 방 흐름을 사용하고 온라인 방 저장소는 게시 서버에서만 연다.\nlocal studioRoomFallback=RunService:IsStudio()\nlocal roomDirectory\nif not studioRoomFallback then\n roomDirectory=MemoryStoreService:GetSortedMap("midnight-infection-room-directory-v1")\nend'],
              ['local function setRoomDirectoryEntry(code,data)\n if code==""or','local function setRoomDirectoryEntry(code,data)\n if not roomDirectory or code==""or'],
              ['local function getRoomDirectoryEntry(code)\n local ok,data=','local function getRoomDirectoryEntry(code)\n if not roomDirectory then return nil end\n local ok,data='],
              ['local function removeRoomDirectoryEntry(code)\n if code==""then','local function removeRoomDirectoryEntry(code)\n if not roomDirectory or code==""then'],
              ['local function quickJoinRoom(p,friendsOnly)\n if roomServer or state=="RUNNING"or not roomActionReady(p)then return end\n local ok,rows=','local function quickJoinRoom(p,friendsOnly)\n if roomServer or state=="RUNNING"or not roomActionReady(p)then return end\n if not roomDirectory then roomFeedback(p,"EMPTY","로컬 테스트는 승강기로 입장");return end\n local ok,rows=']
            ];
            for(const [a,b]of replacements){assert.equal(s.split(a).length,2,'SOURCE_MISMATCH');s=s.replace(a,b);}
            fs.writeFileSync(sf,s);
          }
          assert.equal(git('hash-object',sf),expected,'UNREVIEWED_SOURCE_CHANGE');
          const exe=path.join(process.env.OWNER_OUT,'luau','luau-compile.exe');
          const evidence={sourceBlob:expected,compiler:'0.740',files:[],pass:false};
          for(const f of [sf,cf,...fs.readdirSync(base+'shared').filter(x=>/\.luau?$/.test(x)).map(x=>base+'shared/'+x)]){
            const r=cp.spawnSync(exe,['--null',f],{encoding:'utf8',timeout:45000});
            const row={file:f,status:r.status,error:String(r.error||''),stdout:r.stdout,stderr:r.stderr};
            evidence.files.push(row);console.log('COMPILE='+JSON.stringify(row));
          }
          evidence.pass=evidence.files.every(x=>x.status===0);
          fs.writeFileSync(path.join(process.env.OWNER_OUT,'compile.json'),JSON.stringify(evidence,null,2));
          fs.writeFileSync(path.join(process.env.OWNER_OUT,'repair.diff'),git('diff','--',sf));
          assert(evidence.pass,'COMPILE_FAILED');
          const changed=git('diff','--name-only').split(/\r?\n/).filter(Boolean);
          assert(changed.every(f=>f===sf),'UNRELATED_SOURCE_CHANGE');
          if(changed.length){
            git('diff','--check');git('config','user.name','hans1177');git('config','user.email','actions@users.noreply.github.com');
            git('add','--',sf);git('commit','-m','fix(horror): 로컬 플레이의 방 저장소 초기화 중단 복구');
            git('fetch','origin','main');git('rebase','origin/main');
            assert.equal(git('rev-parse','HEAD:'+sf),expected,'SERVER_CHANGED_DURING_REBASE');
            git('push','origin','HEAD:main');
          }
          console.log('REPAIR_COMMIT='+git('rev-parse','HEAD'));
          '@ | node
          if($LASTEXITCODE -ne 0){throw 'REPAIR_VALIDATION_FAILED'}
          "SOURCE_REVISION=$(git rev-parse HEAD)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build exact repaired local place
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $rojo=Get-ChildItem "$env:OWNER_OUT/rojo" -Filter rojo.exe -Recurse | Select-Object -First 1
          $name='horror-fix-'+$env:GITHUB_RUN_ID
          $place=Join-Path $env:OWNER_OUT ($name+'.rbxlx')
          & $rojo.FullName build 'roblox-games/horror-escape-room/default.project.json' -o $place
          if($LASTEXITCODE -ne 0 -or -not(Test-Path $place)){throw 'PLACE_BUILD_FAILED'}
          "PLACE_FILE=$place" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "STUDIO_NAME=$name" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "BUILD_SHA256=$((Get-FileHash $place -Algorithm SHA256).Hash)"
      - name: Observe actual lobby ground movement restart and match entry
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Get-ChildItem "$env:LOCALAPPDATA/Roblox/Versions" -Filter RobloxStudioBeta.exe -Recurse | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if(-not $exe){throw 'STUDIO_EXE_UNAVAILABLE'}
          $proc=Start-Process -FilePath $exe.FullName -ArgumentList @('--task','EditFile','--localPlaceFile',('"'+$env:PLACE_FILE+'"')) -PassThru
          "OWNER_STUDIO_PID=$($proc.Id)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          @'
          const fs=require('fs'),path=require('path');
          let text=fs.readFileSync('tools/company-development-roblox-studio-local-play.mjs','utf8');
          text=text.replace('class McpStdioClient{','export class McpStdioClient{');
          text+='\nexport {fillRequired,setStudioId,startStopArgs,executeLuauArgs,characterNavigationArgs};\n';
          fs.writeFileSync(path.join(process.env.OWNER_OUT,'studio.mjs'),text);
          '@ | node
          @'
          import fs from 'node:fs';
          import path from 'node:path';
          import {pathToFileURL} from 'node:url';
          import assert from 'node:assert/strict';
          const out=process.env.OWNER_OUT;
          const m=await import(pathToFileURL(path.join(out,'studio.mjs')));
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          const mcp=path.join(process.env.LOCALAPPDATA,'Roblox','mcp.bat');
          assert(fs.existsSync(mcp),'STUDIO_MCP_UNAVAILABLE');
          const c=new m.McpStdioClient({command:'cmd.exe',args:['/c',mcp],timeoutMs:45000});
          const report={sourceRevision:process.env.SOURCE_REVISION,engine:'ROBLOX_STUDIO',initial:[],movement:[],match:[],pass:false};
          let id='',started=false;
          function txt(v){if(typeof v==='string')return v;if(Array.isArray(v))return v.map(txt).join('\n');if(v&&typeof v==='object')return Object.entries(v).filter(([k])=>k!=='data').map(([,x])=>txt(x)).join('\n');return '';}
          function args(name){const a={};const schema=c.tool(name).inputSchema;m.setStudioId(a,schema,id);return m.fillRequired(a,schema);}
          async function probe(context='Client'){
            const code=`local Players=game:GetService("Players") local p=Players.LocalPlayer or Players:GetPlayers()[1] local character=p and p.Character local r=character and character:FindFirstChild("HumanoidRootPart") local h=character and character:FindFirstChildOfClass("Humanoid") local ui=p and p:FindFirstChild("PlayerGui") local gui=ui and ui:FindFirstChild("MidnightTagHUD") local load=gui and gui:FindFirstChild("LoadingScreen") local q=RaycastParams.new() q.FilterType=Enum.RaycastFilterType.Exclude q.FilterDescendantsInstances=character and {character} or {} local hit=r and workspace:Raycast(r.Position,Vector3.new(0,-12,0),q) local result={lobbyReady=workspace:GetAttribute("PhysicalLobbyReady")==true,mapReady=workspace:GetAttribute("MapReady")==true,revision=workspace:GetAttribute("LobbyBuildRevision"),x=r and r.Position.X or 0,y=r and r.Position.Y or 999,z=r and r.Position.Z or 0,anchored=r and r.Anchored or false,health=h and h.Health or 0,grounded=h and h.FloorMaterial~=Enum.Material.Air or false,floor=hit and hit.Instance.Name or "",hud=gui~=nil,loading=load and load.Visible or false,state=p and p:GetAttribute("RoundState") or "",role=p and p:GetAttribute("Role") or "",roomState=workspace:GetAttribute("RoomState"),phase=workspace:GetAttribute("LobbyPhase"),population=workspace:GetAttribute("ActivePopulation") or 0} return "HORROR_PROBE="..game:GetService("HttpService"):JSONEncode(result)`;
            const res=await c.call('execute_luau',m.executeLuauArgs(c.tool('execute_luau').inputSchema,id,code,context));
            const text=txt(res);const match=text.match(/HORROR_PROBE=(\{[^\n]+\})/);assert(match,'MISSING_PROBE:'+text.slice(0,1000));return JSON.parse(match[1]);
          }
          function valid(p){return p.lobbyReady&&p.mapReady&&p.revision==='NOCTURNE_BOOT_COMPILE_FIXED_20260930'&&p.health>0&&!p.anchored&&p.y>0&&p.y<8&&p.z>=180&&p.z<=310&&p.grounded&&p.floor&&p.hud&&!p.loading;}
          async function navigate(target){await c.call('character_navigation',m.characterNavigationArgs(c.tool('character_navigation').inputSchema,id,target));}
          try{
            await c.connect();await c.waitForTools(['list_roblox_studios','start_stop_play','execute_luau','get_console_output','screen_capture','character_navigation'],{attempts:12,delayMs:1500});
            for(let i=0;i<40;i++){
              const studios=m.collectStudios(await c.call('list_roblox_studios',{}));
              const own=studios.find(s=>s.name.toLowerCase().includes(process.env.STUDIO_NAME));
              if(own){id=own.studioId;break;}await wait(2000);
            }
            assert(id,'NO_EXACT_LOCAL_STUDIO_ATTACHED');
            await c.call('start_stop_play',m.startStopArgs(c.tool('start_stop_play').inputSchema,id,true));started=true;
            for(let i=0;i<40;i++){await wait(1500);const p=await probe();report.initial.push(p);console.log('SPAWN_PROBE='+JSON.stringify(p));if(valid(p))break;}
            assert(valid(report.initial.at(-1)),'INITIAL_GROUND_CONTACT_FAILED');
            for(let i=0;i<3;i++){await wait(1000);const p=await probe();report.initial.push(p);assert(valid(p),'UNSTABLE_GROUND_CONTACT');}
            const before=await probe();await navigate({x:0,y:3.7,z:258});
            await wait(1500);const after=await probe();report.movement.push(before,after);assert(valid(after),'MOVE_GROUND_CONTACT_FAILED');assert(Math.hypot(after.x-before.x,after.z-before.z)>2,'MOVEMENT_NOT_OBSERVED');
            m.collectImages(await c.call('screen_capture',args('screen_capture')),[],out,'lobby');
            await c.call('start_stop_play',m.startStopArgs(c.tool('start_stop_play').inputSchema,id,false));started=false;await wait(1800);
            await c.call('start_stop_play',m.startStopArgs(c.tool('start_stop_play').inputSchema,id,true));started=true;
            for(let i=0;i<40;i++){await wait(1500);const p=await probe();report.restart=p;if(valid(p))break;}
            assert(valid(report.restart),'RESTART_SPAWN_FAILED');
            await navigate({x:-18,y:3.7,z:230});await navigate({x:-18,y:4.3,z:202});
            for(let i=0;i<30;i++){await wait(1000);const p=await probe();report.match.push(p);console.log('MATCH_PROBE='+JSON.stringify(p));if(p.state==='RUNNING'&&Math.abs(p.z)<100&&p.grounded&&!p.anchored)break;}
            const match=report.match.at(-1);assert(match.state==='RUNNING'&&Math.abs(match.z)<100&&match.grounded&&!match.anchored,'MATCH_ENTRY_NOT_OBSERVED');
            report.server=await probe('Server');assert(report.server.state==='RUNNING'&&report.server.phase==='RUNNING'&&report.server.population>0,'SERVER_MATCH_NOT_RUNNING');
            m.collectImages(await c.call('screen_capture',args('screen_capture')),[],out,'match');
            const logs=await c.call('get_console_output',args('get_console_output'));fs.writeFileSync(path.join(out,'console.json'),JSON.stringify(logs,null,2));
            assert(!/Out of local registers|attempt to call a nil value|CompileError/.test(txt(logs)),'GAME_RUNTIME_ERROR');
            report.pass=true;console.log('ACTUAL_STUDIO_GROUND_MOVE_RESTART_MATCH=PASS');
          }catch(e){report.error=String(e.stack||e);throw e;}finally{
            if(id)try{const logs=await c.call('get_console_output',args('get_console_output'));fs.writeFileSync(path.join(out,'console.json'),JSON.stringify(logs,null,2));}catch{}
            fs.writeFileSync(path.join(out,'runtime.json'),JSON.stringify(report,null,2));
            if(started)try{await c.call('start_stop_play',m.startStopArgs(c.tool('start_stop_play').inputSchema,id,false));}catch{}
            c.close();
          }
          '@ | Set-Content "$env:OWNER_OUT/play.mjs" -Encoding utf8
          node "$env:OWNER_OUT/play.mjs"
          if($LASTEXITCODE -ne 0){throw 'ACTUAL_STUDIO_CHECK_FAILED_NO_PUBLISH'}
      - name: Publish only verified exact repair
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $e=Get-Content "$env:OWNER_OUT/runtime.json" -Raw | ConvertFrom-Json
          if($e.pass -ne $true){throw 'RUNTIME_NOT_PASSED'}
          if([string]::IsNullOrWhiteSpace($env:ROBLOX_OPEN_CLOUD_API_KEY)){throw 'PUBLISH_KEY_MISSING'}
          git fetch origin main
          if($LASTEXITCODE -ne 0){throw 'REFRESH_MAIN_FAILED'}
          git diff --exit-code HEAD origin/main -- roblox-games/horror-escape-room
          if($LASTEXITCODE -ne 0){throw 'GAME_SOURCE_ADVANCED_NO_PUBLISH'}
          Invoke-WebRequest -Method Post -Uri 'https://apis.roblox.com/universes/v1/10767445796/places/98222620265768/versions?versionType=Published' -Headers @{'x-api-key'=$env:ROBLOX_OPEN_CLOUD_API_KEY} -ContentType 'application/xml' -InFile $env:PLACE_FILE -OutFile "$env:OWNER_OUT/publish.json"
          $r=Get-Content "$env:OWNER_OUT/publish.json" -Raw | ConvertFrom-Json
          if([int]$r.versionNumber -le 0){throw 'PUBLISH_VERSION_MISSING'}
          Write-Host "ROBLOX_PLACE_VERSION=$($r.versionNumber)"
      - name: Close only this test Studio
        if: always()
        shell: pwsh
        run: |
          if($env:OWNER_STUDIO_PID){Stop-Process -Id ([int]$env:OWNER_STUDIO_PID) -ErrorAction SilentlyContinue}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: horror-repair-evidence
          path: |
            ${{ env.OWNER_OUT }}/*.json
            ${{ env.OWNER_OUT }}/*.png
            ${{ env.OWNER_OUT }}/repair.diff
          retention-days: 1
