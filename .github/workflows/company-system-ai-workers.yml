name: Company System AI Workers

on:
  workflow_dispatch:
    inputs:
      security_recovery_task_id:
        description: 'Exact Primary-AI-assigned security recovery task id; when set, reserve only this task'
        required: false
        type: string
  repository_dispatch:
    types: [company-system-ai-cycle]
  schedule:
    - cron: '7,27,47 * * * *'
  push:
    branches: [main]
    paths:
      - 'tools/company-system-ai-worker.mjs'
      - 'tools/company-system-ai-queue.mjs'
      - 'tools/company-recovery-dispatch.mjs'
      - 'tools/company-recovery-escalation.mjs'
      - 'tools/company-recovery-queue.mjs'
      - 'qa/company-recovery-learning.test.mjs'
      - 'qa/company-system-ai-worker.test.mjs'
      - 'qa/company-system-ai-supervision-loop.test.mjs'
      - 'qa/company-security-recovery-e2e.test.mjs'
      - 'company-learning/platform-release-roadmap.json'
      - '.github/workflows/company-system-ai-workers.yml'

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  SYSTEM_AI_MODEL: qwen3:1.7b
  VIBE2_LOCAL_MODEL: qwen3:1.7b
  SYSTEM_AI_MAX_BATCH: '32'
  OLLAMA_HOST: 127.0.0.1:11434

jobs:
  reserve:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: company-system-ai-control
      cancel-in-progress: false
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
      targeted_security_recovery: ${{ steps.matrix.outputs.targeted_security_recovery }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify shared contracts and worker code
        run: |
          set -euo pipefail
          node --check tools/company-system-ai-worker.mjs
          node --check tools/company-system-ai-queue.mjs
          node --check tools/company-recovery-dispatch.mjs
          node --check tools/company-recovery-escalation.mjs
          node --check tools/company-recovery-queue.mjs
          node --test qa/company-system-ai-worker.test.mjs qa/company-system-ai-supervision-loop.test.mjs qa/company-security-recovery-e2e.test.mjs qa/company-recovery-learning.test.mjs
          node tools/company-shared-context.mjs --output=/tmp/system-ai-shared-context.json

      - name: Reserve disjoint supervised assignments
        id: matrix
        env:
          SECURITY_RECOVERY_TASK_ID: ${{ inputs.security_recovery_task_id || '' }}
        shell: bash
        run: |
          set -euo pipefail
          reservation="system-ai:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          persisted=0

          for attempt in 1 2 3; do
            cd "$GITHUB_WORKSPACE"
            git worktree remove --force /tmp/system-ai-control 2>/dev/null || true
            rm -rf /tmp/system-ai-control
            git worktree prune
            git fetch origin vibe2-unreal-core --quiet
            git worktree add --detach /tmp/system-ai-control origin/vibe2-unreal-core >/dev/null
            test -f /tmp/system-ai-control/.vibe2/system-ai-queue.json
            test -f /tmp/system-ai-control/.vibe2/recovery-queue.json

            node tools/company-recovery-escalation.mjs \
              --queue=/tmp/system-ai-control/.vibe2/queue.json \
              --system-ai=/tmp/system-ai-control/.vibe2/system-ai-queue.json \
              --recovery=/tmp/system-ai-control/.vibe2/recovery-queue.json | tee /tmp/system-ai-recovery-escalation.log

            dispatch_args=(
              --route=system-ai
              --queue=/tmp/system-ai-control/.vibe2/queue.json
              --system-ai=/tmp/system-ai-control/.vibe2/system-ai-queue.json
              --recovery=/tmp/system-ai-control/.vibe2/recovery-queue.json
            )
            if [ -n "$SECURITY_RECOVERY_TASK_ID" ]; then
              dispatch_args+=(--source-task="$SECURITY_RECOVERY_TASK_ID")
            fi
            node tools/company-recovery-dispatch.mjs "${dispatch_args[@]}" | tee /tmp/system-ai-recovery-dispatch.log

            if [ -n "$SECURITY_RECOVERY_TASK_ID" ]; then
              node tools/company-system-ai-queue.mjs \
                --command=reserve-security-recovery \
                --queue=/tmp/system-ai-control/.vibe2/system-ai-queue.json \
                --id="$SECURITY_RECOVERY_TASK_ID" \
                --reservation="$reservation" \
                --output=/tmp/system-ai-reserved.json
            else
              node tools/company-system-ai-queue.mjs \
                --command=reserve \
                --queue=/tmp/system-ai-control/.vibe2/system-ai-queue.json \
                --max="$SYSTEM_AI_MAX_BATCH" \
                --reservation="$reservation" \
                --output=/tmp/system-ai-reserved.json
            fi

            cd /tmp/system-ai-control
            git config user.name 'jaewoon-system-ai-scheduler'
            git config user.email 'system-ai-scheduler@users.noreply.github.com'
            if git diff --quiet -- .vibe2/system-ai-queue.json .vibe2/recovery-queue.json; then
              persisted=1
              echo 'COMPANY_SYSTEM_AI_CONTROL_WRITE=NO_CHANGE'
              break
            fi

            git add .vibe2/system-ai-queue.json .vibe2/recovery-queue.json
            git commit -m "system-ai: reserve supervised assignments [skip ci]"
            if git push origin HEAD:vibe2-unreal-core; then
              persisted=1
              echo "COMPANY_SYSTEM_AI_CONTROL_WRITE=YES:attempt-$attempt"
              break
            fi

            echo "COMPANY_SYSTEM_AI_CONTROL_REFRESH_RETRY=$attempt"
            cd "$GITHUB_WORKSPACE"
            git worktree remove --force /tmp/system-ai-control 2>/dev/null || true
            rm -rf /tmp/system-ai-control
            sleep $((attempt * 2))
          done

          cd "$GITHUB_WORKSPACE"
          test "$persisted" = 1
          SECURITY_RECOVERY_TASK_ID="$SECURITY_RECOVERY_TASK_ID" node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/system-ai-reserved.json','utf8'));
          const rows=(x.tasks||[]).map(t=>({taskId:t.id}));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`matrix=${JSON.stringify({include:rows})}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`count=${rows.length}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`targeted_security_recovery=${process.env.SECURITY_RECOVERY_TASK_ID?'YES':'NO'}\n`);
          console.log(`COMPANY_SYSTEM_AI_RESERVED=${rows.length}`);
          NODE

  worker:
    needs: reserve
    if: needs.reserve.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.reserve.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore free local model cache
        id: ollama_cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.ollama/models
            ~/.cache/company-system-ai-ollama/bin/ollama
            ~/.cache/company-system-ai-ollama/lib/ollama
          key: company-system-ai-ollama-v1-Linux-qwen3-1.7b

      - name: Prepare cached Ollama runtime
        shell: bash
        run: |
          set -euo pipefail
          cached="$HOME/.cache/company-system-ai-ollama/bin/ollama"
          cached_lib="$HOME/.cache/company-system-ai-ollama/lib/ollama"
          if [ -x "$cached" ] && [ -d "$cached_lib" ] && find "$cached_lib" -type f -name 'llama-server' -perm -u+x -print -quit | grep -q .; then
            sudo mkdir -p /usr/local/lib/ollama
            sudo cp -a "$cached_lib/." /usr/local/lib/ollama/
            echo "$HOME/.cache/company-system-ai-ollama/bin" >> "$GITHUB_PATH"
            ollama_bin="$cached"
            echo 'COMPANY_SYSTEM_AI_OLLAMA_RUNTIME=CACHE'
          else
            installed=0
            for attempt in 1 2 3; do
              if curl -fsSL --retry 3 --retry-all-errors --connect-timeout 15 https://ollama.com/install.sh | sh; then installed=1; break; fi
              sleep $((attempt * 4))
            done
            test "$installed" = 1
            mkdir -p "$HOME/.cache/company-system-ai-ollama/bin" "$cached_lib"
            cp "$(command -v ollama)" "$cached"
            chmod +x "$cached"
            runtime_lib=""
            for candidate in /usr/local/lib/ollama /usr/lib/ollama; do
              if [ -d "$candidate" ] && find "$candidate" -type f -name 'llama-server' -perm -u+x -print -quit | grep -q .; then runtime_lib="$candidate"; break; fi
            done
            test -n "$runtime_lib"
            cp -a "$runtime_lib/." "$cached_lib/"
            echo "$HOME/.cache/company-system-ai-ollama/bin" >> "$GITHUB_PATH"
            ollama_bin="$cached"
            echo 'COMPANY_SYSTEM_AI_OLLAMA_RUNTIME=FRESH_INSTALL'
          fi
          test -x "$ollama_bin"
          nohup "$ollama_bin" serve > /tmp/company-system-ai-ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            if [ "$i" = 30 ]; then cat /tmp/company-system-ai-ollama.log || true; exit 1; fi
            sleep 2
          done
          if ! "$ollama_bin" list | awk 'NR>1 {print $1}' | grep -Fqx "$SYSTEM_AI_MODEL"; then
            "$ollama_bin" pull "$SYSTEM_AI_MODEL"
          fi

      - name: Load reserved assignment
        env:
          TASK_ID: ${{ matrix.taskId }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin vibe2-unreal-core --quiet
          git show origin/vibe2-unreal-core:.vibe2/system-ai-queue.json > /tmp/system-ai-queue.json
          node - "$TASK_ID" <<'NODE' > /tmp/system-ai-task.json
          const fs=require('fs');
          const id=process.argv[2];
          const q=JSON.parse(fs.readFileSync('/tmp/system-ai-queue.json','utf8'));
          const task=(q.tasks||[]).find(x=>x.id===id);
          if(!task)throw new Error('assignment missing: '+id);
          if(task.status!=='running')throw new Error('assignment not reserved: '+id+':'+task.status);
          process.stdout.write(JSON.stringify(task,null,2));
          NODE
          safe="$(printf '%s' "$TASK_ID" | tr -cs 'A-Za-z0-9._-' '-')"
          branch="system-ai/candidate/${safe}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "SYSTEM_AI_BRANCH=$branch" >> "$GITHUB_ENV"
          git checkout -b "$branch"

      - name: Verify existing verifier contract before model
        id: preverify
        if: startsWith(matrix.taskId, 'sys-verify-')
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE' > /tmp/system-ai-preverify-commands.txt
          const fs=require('fs');
          const task=JSON.parse(fs.readFileSync('/tmp/system-ai-task.json','utf8'));
          const commands=Array.isArray(task.verificationCommands)?task.verificationCommands:[];
          if(!commands.length)throw new Error('SYSTEM_AI_PREVERIFY_COMMAND_REQUIRED');
          for(const cmd of commands)process.stdout.write(String(cmd).replace(/[\r\n]+/g,' ')+'\n');
          NODE
          while IFS= read -r cmd; do
            [ -n "$cmd" ] || continue
            echo "COMPANY_SYSTEM_AI_PREVERIFY=$cmd"
            timeout 240s bash -lc "$cmd"
          done < /tmp/system-ai-preverify-commands.txt
          echo 'COMPANY_SYSTEM_AI_PREVERIFY_SATISFIED=YES'

      - name: Execute external AI assignment
        id: implement
        if: steps.preverify.outcome != 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node tools/company-shared-context.mjs --output=/tmp/system-ai-context-before.json
          node tools/company-system-ai-worker.mjs             --task=/tmp/system-ai-task.json             --output=/tmp/system-ai-worker-result.json 2>&1 | tee /tmp/system-ai-worker.log

      - name: Verify no-change assignment against current main
        id: current_main
        if: steps.implement.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SYSTEM_AI_NO_CHANGE' /tmp/system-ai-worker.log
          git diff --quiet
          node - <<'NODE' > /tmp/system-ai-current-main-verification-commands.txt
          const fs=require('fs');
          const task=JSON.parse(fs.readFileSync('/tmp/system-ai-task.json','utf8'));
          const commands=Array.isArray(task.verificationCommands)?task.verificationCommands:[];
          if(!commands.length)throw new Error('SYSTEM_AI_CURRENT_MAIN_VERIFICATION_REQUIRED');
          for(const cmd of commands)process.stdout.write(String(cmd).replace(/[\r\n]+/g,' ')+'\n');
          NODE
          while IFS= read -r cmd; do
            [ -n "$cmd" ] || continue
            echo "COMPANY_SYSTEM_AI_CURRENT_MAIN_VERIFY=$cmd"
            timeout 240s bash -lc "$cmd"
          done < /tmp/system-ai-current-main-verification-commands.txt
          echo 'COMPANY_SYSTEM_AI_CURRENT_MAIN_SATISFIED=YES'

      - name: Verify external AI candidate
        id: verify
        if: steps.implement.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check tools/company-security-steward.mjs
          node tools/company-security-steward.mjs --output=/tmp/system-ai-security-report.json
          echo 'COMPANY_SYSTEM_AI_SECURITY=PASS'
          node - <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const result=JSON.parse(fs.readFileSync('/tmp/system-ai-worker-result.json','utf8'));
          for(const file of result.changedFiles||[]){
            if(/\.(?:mjs|js|cjs)$/.test(file))cp.execFileSync(process.execPath,['--check',file],{stdio:'inherit'});
            if(/\.json$/.test(file))JSON.parse(fs.readFileSync(file,'utf8'));
          }
          NODE
          node - <<'NODE' > /tmp/system-ai-verification-commands.txt
          const fs=require('fs');
          const task=JSON.parse(fs.readFileSync('/tmp/system-ai-task.json','utf8'));
          for(const cmd of task.verificationCommands||[])process.stdout.write(String(cmd).replace(/[\r\n]+/g,' ')+'\n');
          NODE
          while IFS= read -r cmd; do
            [ -n "$cmd" ] || continue
            echo "COMPANY_SYSTEM_AI_VERIFY=$cmd"
            timeout 240s bash -lc "$cmd"
          done < /tmp/system-ai-verification-commands.txt
          node tools/company-shared-context.mjs --output=/tmp/system-ai-context-after.json
          echo 'COMPANY_SYSTEM_AI_VERIFICATION=PASS'

      - name: Publish verified candidate PR
        id: publish
        if: steps.implement.outcome == 'success' && steps.verify.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_ID: ${{ matrix.taskId }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-system-ai-worker'
          git config user.email 'system-ai-worker@users.noreply.github.com'
          git add -- tools qa assets .github/workflows company-learning
          test -n "$(git diff --cached --name-only)"
          git commit -m "system-ai: candidate ${TASK_ID}"
          git push origin "HEAD:${SYSTEM_AI_BRANCH}"
          body="External free-AI system candidate.\n\nTask: ${TASK_ID}\n\nStatus: deterministic worker verification passed; primary AI review still required.\n\nDo not merge solely from worker self-assessment."
          pr_url="$(gh pr create --base main --head "$SYSTEM_AI_BRANCH" --title "system-ai: ${TASK_ID}" --body "$body" 2>/dev/null || gh pr view "$SYSTEM_AI_BRANCH" --json url -q .url)"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "COMPANY_SYSTEM_AI_PR=$pr_url"

      - name: Build immutable assignment result
        if: always()
        env:
          TASK_ID: ${{ matrix.taskId }}
          IMPLEMENT_OUTCOME: ${{ steps.implement.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          PREVERIFY_OUTCOME: ${{ steps.preverify.outcome }}
          CURRENT_MAIN_OUTCOME: ${{ steps.current_main.outcome }}
          PR_URL: ${{ steps.publish.outputs.pr_url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/company-system-ai-results
          node - <<'NODE'
          const fs=require('fs');
          let worker={};
          if(fs.existsSync('/tmp/system-ai-worker-result.json'))worker=JSON.parse(fs.readFileSync('/tmp/system-ai-worker-result.json','utf8'));
          let security={verdict:'NOT_RUN',highestSeverity:'NONE',findings:[]};
          if(fs.existsSync('/tmp/system-ai-security-report.json')){
            const report=JSON.parse(fs.readFileSync('/tmp/system-ai-security-report.json','utf8'));
            security={
              verdict:String(report.verdict||'NOT_RUN'),
              highestSeverity:String(report.highestSeverity||'NONE'),
              findings:(report.findings||[]).map(x=>({rule:x.rule,severity:x.severity,category:x.category,file:x.file,line:x.line,evidenceSha256:x.evidenceSha256,disposition:x.disposition||'QUARANTINE'}))
            };
          }
          const preverified=process.env.PREVERIFY_OUTCOME==='success';
          const currentMainSatisfied=preverified||(process.env.IMPLEMENT_OUTCOME==='failure'&&process.env.CURRENT_MAIN_OUTCOME==='success');
          const candidateOk=process.env.IMPLEMENT_OUTCOME==='success'&&process.env.VERIFY_OUTCOME==='success'&&process.env.PUBLISH_OUTCOME==='success'&&security.verdict==='PASS';
          const blocker=currentMainSatisfied||candidateOk?'':security.verdict==='QUARANTINE'?'system-ai-security-quarantined':security.verdict==='REVIEW'?'system-ai-security-review-required':process.env.IMPLEMENT_OUTCOME!=='success'?'system-ai-implementation-failed':process.env.VERIFY_OUTCOME!=='success'?'system-ai-verification-failed':'system-ai-candidate-publish-failed';
          const row={
            version:4,taskId:process.env.TASK_ID,outcome:currentMainSatisfied?'CURRENT_MAIN_SATISFIED':candidateOk?'PASS':'FAIL',blocker,security,
            candidateBranch:candidateOk?process.env.SYSTEM_AI_BRANCH:null,pullRequestUrl:candidateOk?(process.env.PR_URL||null):null,
            evidence:[
              `actions-run:${process.env.GITHUB_RUN_ID}`,
              `implementation:${process.env.IMPLEMENT_OUTCOME||'unknown'}`,
              `verification:${process.env.VERIFY_OUTCOME||'unknown'}`,
              `publish:${process.env.PUBLISH_OUTCOME||'unknown'}`,
              `pre-model-verification:${process.env.PREVERIFY_OUTCOME||'unknown'}`,
              `current-main-verification:${process.env.CURRENT_MAIN_OUTCOME||'unknown'}`,
              ...(preverified?['model-call-skipped:deterministic-verifier-already-satisfied']:[]),
              ...(currentMainSatisfied?['no-candidate-required:current-main-already-satisfies-task']:[]),
              ...(worker.changedFiles||[]).map(x=>`changed-file:${x}`),
              worker.rawModelOutputSha256?`model-output-sha256:${worker.rawModelOutputSha256}`:null,
              'worker-self-acceptance:NO',
              'primary-ai-review-required:YES'
            ].filter(Boolean)
          };
          const safe=String(row.taskId||'task').replace(/[^A-Za-z0-9._-]+/g,'-');
          fs.writeFileSync(`/tmp/company-system-ai-results/${safe}.json`,JSON.stringify(row,null,2)+'\n');
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: company-system-ai-result-${{ matrix.taskId }}
          path: /tmp/company-system-ai-results/*.json
          if-no-files-found: error
          retention-days: 7

  fan_in:
    needs: [reserve, worker]
    if: always() && needs.reserve.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    concurrency:
      group: company-system-ai-control
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          pattern: company-system-ai-result-*
          path: /tmp/company-system-ai-results
          merge-multiple: true

      - name: Persist results for primary AI supervision
        env:
          GH_TOKEN: ${{ github.token }}
          TARGETED_SECURITY_RECOVERY: ${{ needs.reserve.outputs.targeted_security_recovery }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin vibe2-unreal-core --quiet
          rm -rf /tmp/system-ai-control
          git worktree prune
          git worktree add /tmp/system-ai-control origin/vibe2-unreal-core
          node tools/company-system-ai-queue.mjs --command=fan-in --queue=/tmp/system-ai-control/.vibe2/system-ai-queue.json --results=/tmp/company-system-ai-results
          node tools/company-recovery-queue.mjs --command=fan-in-system-ai --queue=/tmp/system-ai-control/.vibe2/recovery-queue.json --system-ai=/tmp/system-ai-control/.vibe2/system-ai-queue.json --results=/tmp/company-system-ai-results

          node - <<'NODE' > /tmp/system-ai-security.tsv
          const fs=require('fs'),path=require('path');
          const dir='/tmp/company-system-ai-results';
          for(const file of fs.readdirSync(dir).filter(x=>x.endsWith('.json')).sort()){
            const row=JSON.parse(fs.readFileSync(path.join(dir,file),'utf8'));
            const verdict=String(row.security?.verdict||'PASS').toUpperCase();
            if(!['QUARANTINE','REVIEW'].includes(verdict))continue;
            const safe=String(row.taskId||'task').replace(/[^A-Za-z0-9._-]+/g,'-');
            const report={version:2,kind:'company-security-report',verdict,highestSeverity:String(row.security?.highestSeverity||'HIGH'),findings:row.security?.findings||[],rawSecretStored:false,rawMalwareStored:false};
            const reportFile='/tmp/system-ai-security-'+safe+'.json';
            fs.writeFileSync(reportFile,JSON.stringify(report,null,2)+'\n');
            process.stdout.write([String(row.taskId||''),verdict,report.highestSeverity,reportFile].join('\t')+'\n');
          }
          NODE

          while read -r task_id verdict highest report_file; do
            [ -n "$task_id" ] || continue
            node tools/company-security-incident.mjs --command=record --store=/tmp/system-ai-control/.vibe2/security-incidents.json --report="$report_file"
            if [ "$verdict" = 'QUARANTINE' ]; then
              node tools/company-recovery-queue.mjs --command=enqueue --queue=/tmp/system-ai-control/.vibe2/recovery-queue.json --priority=critical --source-queue=security --source-task="$task_id" --stage=SYSTEM_AI_SECURITY_SCAN --signature="system-ai-security-${highest:-HIGH}" --blast-radius=affected-candidate --evidence="system-ai-task:$task_id,actions-run:${GITHUB_RUN_ID}" --strategy=SECURITY_CONTAIN_REMEDIATE_RESCAN_PRIMARY_AI_REVIEW --verify=RERUN_SECURITY_SCAN,REGRESSION_RESCAN,PRIMARY_AI_SECURITY_REVIEW --owner=SYSTEM_AI
            fi
          done < /tmp/system-ai-security.tsv

          cd /tmp/system-ai-control
          git config user.name 'jaewoon-system-ai-fanin'
          git config user.email 'system-ai-fanin@users.noreply.github.com'
          if ! git diff --quiet -- .vibe2/system-ai-queue.json .vibe2/security-incidents.json .vibe2/recovery-queue.json; then
            git add .vibe2/system-ai-queue.json .vibe2/security-incidents.json .vibe2/recovery-queue.json
            git commit -m "system-ai: persist supervised results and security quarantine [skip ci]"
            for attempt in 1 2 3; do
              if git pull --rebase origin vibe2-unreal-core && git push origin HEAD:vibe2-unreal-core; then break; fi
              git rebase --abort 2>/dev/null || true
              git fetch origin vibe2-unreal-core --quiet
              sleep $((attempt * 2))
              test "$attempt" != 3
            done
          fi

          node "$GITHUB_WORKSPACE/tools/company-system-ai-queue.mjs" --command=summary --queue=.vibe2/system-ai-queue.json | tee /tmp/company-system-ai-summary.log
          queued="$(node -e "const q=require('./.vibe2/system-ai-queue.json');console.log((q.tasks||[]).filter(x=>x.status==='queued').length)")"
          if [ "$TARGETED_SECURITY_RECOVERY" = 'YES' ]; then
            echo 'COMPANY_SYSTEM_AI_REFILL=SKIPPED_TARGETED_SECURITY_RECOVERY'
          elif [ "$queued" -gt 0 ]; then
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
              --data '{"event_type":"company-system-ai-cycle"}'
            echo 'COMPANY_SYSTEM_AI_REFILL=DISPATCHED'
          fi
