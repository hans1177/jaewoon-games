name: Graphics Engine QA

on:
  push:
    branches: [main]
    paths:
      - "assets/jaewoon-graphics-engine.js"
      - "qa/jaewoon-graphics-engine.test.cjs"
      - "unity-games/monster-adventure/Assets/Editor/UnityWebFloorBuild.cs"
      - "unity-games/monster-adventure/Assets/Materials/LibrarySurface.shader"
      - "qa/company-unity-web-first-stage.test.mjs"
      - ".github/workflows/graphics-engine-qa.yml"
  pull_request:
    paths:
      - "assets/jaewoon-graphics-engine.js"
      - "qa/jaewoon-graphics-engine.test.cjs"
      - "unity-games/monster-adventure/Assets/Editor/UnityWebFloorBuild.cs"
      - "unity-games/monster-adventure/Assets/Materials/LibrarySurface.shader"
      - "qa/company-unity-web-first-stage.test.mjs"
      - ".github/workflows/graphics-engine-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graphics-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax
        run: node --check assets/jaewoon-graphics-engine.js
      - name: Graphics evolution safety tests
        run: node --test qa/jaewoon-graphics-engine.test.cjs
      - name: Unity Web triplanar material regression
        run: node --test --test-name-pattern="Unity monster adventure keeps real UV-less source meshes" qa/company-unity-web-first-stage.test.mjs
