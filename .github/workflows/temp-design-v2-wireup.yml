name: Temp Design V2 Wireup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-design-v2-wireup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire V2 design schema and scorer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def must_sub(text, pattern, repl, label, flags=0):
              out, n = re.subn(pattern, repl, text, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 replacement, got {n}')
              return out

          # 1) Design producer: emit explicit structured evidence for the 11-axis design gate.
          p=Path('tools/company-design-cycle.mjs')
          s=p.read_text()
          schema="""const V2_TEXT={type:'string',maxLength:420};
          const DESIGN={type:'object',required:['identity','playerFantasy','coreFun','coreLoop','signatureSystems','progressionDirection','visualDirection','mobileUx','marketTargetDirection','steamExpansionDecision','multiplayerMode','multiplayerExpansionDecision','technicalAssumptions','validationQuestions','openQuestions','systemInterconnections','progressionEconomyBalance','contentExpansionPlan','failureRetryRisk','platformFitPlan','uxAccessibilityPlan','artAudioDirection','implementationTraceability'],properties:{
            identity:{type:'string',maxLength:1000},playerFantasy:{type:'string',maxLength:900},coreFun:{type:'string',maxLength:900},
            coreLoop:{type:'array',minItems:3,maxItems:8,items:{type:'string',maxLength:340}},
            signatureSystems:{type:'array',minItems:2,maxItems:6,items:{type:'object',required:['name','purpose','playerChoice'],properties:{name:{type:'string',maxLength:130},purpose:{type:'string',maxLength:440},playerChoice:{type:'string',maxLength:440}},additionalProperties:false}},
            progressionDirection:{type:'string',maxLength:900},visualDirection:{type:'string',maxLength:900},mobileUx:{type:'string',maxLength:900},marketTargetDirection:{type:'string',maxLength:900},steamExpansionDecision:{type:'string',maxLength:500},
            multiplayerMode:{type:'string',enum:MULTIPLAYER_MODES},multiplayerExpansionDecision:{type:'string',maxLength:500},
            technicalAssumptions:{type:'array',minItems:2,maxItems:8,items:{type:'string',maxLength:340}},validationQuestions:{type:'array',minItems:2,maxItems:8,items:{type:'string',maxLength:340}},openQuestions:{type:'array',maxItems:8,items:{type:'string',maxLength:340}},
            systemInterconnections:{type:'array',minItems:3,maxItems:8,items:{type:'object',required:['fromSystem','toSystem','trigger','stateChange'],properties:{fromSystem:V2_TEXT,toSystem:V2_TEXT,trigger:V2_TEXT,stateChange:V2_TEXT},additionalProperties:false}},
            progressionEconomyBalance:{type:'object',required:['progressionLoop','resourceFlow','balanceRules'],properties:{progressionLoop:V2_TEXT,resourceFlow:V2_TEXT,balanceRules:V2_TEXT},additionalProperties:false},
            contentExpansionPlan:{type:'array',minItems:3,maxItems:8,items:{type:'object',required:['milestone','newGameplay','systemImpact'],properties:{milestone:V2_TEXT,newGameplay:V2_TEXT,systemImpact:V2_TEXT},additionalProperties:false}},
            failureRetryRisk:{type:'object',required:['failureStates','retryFlow','riskPressure','recoveryRules'],properties:{failureStates:{type:'array',minItems:2,maxItems:6,items:V2_TEXT},retryFlow:V2_TEXT,riskPressure:V2_TEXT,recoveryRules:V2_TEXT},additionalProperties:false},
            platformFitPlan:{type:'object',required:['targetPlatform','inputModel','performanceBudget','sessionConstraints'],properties:{targetPlatform:V2_TEXT,inputModel:V2_TEXT,performanceBudget:V2_TEXT,sessionConstraints:V2_TEXT},additionalProperties:false},
            uxAccessibilityPlan:{type:'object',required:['hudPriorities','touchAndInput','readability','accessibility'],properties:{hudPriorities:V2_TEXT,touchAndInput:V2_TEXT,readability:V2_TEXT,accessibility:V2_TEXT},additionalProperties:false},
            artAudioDirection:{type:'object',required:['visualIdentity','audioIdentity','gameplayFeedbackSync'],properties:{visualIdentity:V2_TEXT,audioIdentity:V2_TEXT,gameplayFeedbackSync:V2_TEXT},additionalProperties:false},
            implementationTraceability:{type:'array',minItems:3,maxItems:8,items:{type:'object',required:['designElement','responsibleSystem','validationEvidence'],properties:{designElement:V2_TEXT,responsibleSystem:V2_TEXT,validationEvidence:V2_TEXT},additionalProperties:false}}
          },additionalProperties:false};"""
          s=must_sub(s,r'^const DESIGN=.*$',schema,'design schema',re.M)
          s=s.replace("writeJson(path.join(base,'design-draft.json'),{version:4,", "writeJson(path.join(base,'design-draft.json'),{version:5,",1)
          s=s.replace("writeJson(path.join(base,'design-revised.json'),{version:4,", "writeJson(path.join(base,'design-revised.json'),{version:5,",1)
          s=s.replace("writeJson(path.join(base,'cycle-status.json'),{version:5,", "writeJson(path.join(base,'cycle-status.json'),{version:6,",1)
          p.write_text(s)

          # 2) Repair/promotion guard: old designs cannot masquerade as V2-complete.
          p=Path('tools/company-design-prepromotion-repair.mjs')
          s=p.read_text()
          old="const required=['identity','playerFantasy','coreFun','coreLoop','signatureSystems','progressionDirection','visualDirection','mobileUx','marketTargetDirection','steamExpansionDecision','multiplayerMode','multiplayerExpansionDecision','technicalAssumptions','validationQuestions','openQuestions'];"
          new="const required=['identity','playerFantasy','coreFun','coreLoop','signatureSystems','progressionDirection','visualDirection','mobileUx','marketTargetDirection','steamExpansionDecision','multiplayerMode','multiplayerExpansionDecision','technicalAssumptions','validationQuestions','openQuestions','systemInterconnections','progressionEconomyBalance','contentExpansionPlan','failureRetryRisk','platformFitPlan','uxAccessibilityPlan','artAudioDirection','implementationTraceability'];"
          if old not in s: raise SystemExit('prepromotion required list not found')
          s=s.replace(old,new,1)
          old_pred="if(['signatureSystems','technicalAssumptions','validationQuestions','openQuestions'].includes(key))return !Array.isArray(out[key]);"
          new_pred="if(['signatureSystems','technicalAssumptions','validationQuestions','openQuestions'].includes(key))return !Array.isArray(out[key]);\n    if(['systemInterconnections','contentExpansionPlan','implementationTraceability'].includes(key))return !Array.isArray(out[key])||out[key].length<3;\n    if(['progressionEconomyBalance','failureRetryRisk','platformFitPlan','uxAccessibilityPlan','artAudioDirection'].includes(key))return !out[key]||Array.isArray(out[key])||typeof out[key]!=='object';"
          if old_pred not in s: raise SystemExit('prepromotion unresolved predicate not found')
          s=s.replace(old_pred,new_pred,1)
          old_pass="if(phase==='REVIEW_FEEDBACK'&&strictBefore?.verdict==='PASS'&&Number(strictBefore?.totalScore)>=80&&Array.isArray(strictBefore?.hardFailures)&&strictBefore.hardFailures.length===0)"
          new_pass="if(phase==='REVIEW_FEEDBACK'&&strictBefore?.scoreSystem==='STAGE_GATE_SCORING_V2'&&strictBefore?.verdict==='PASS'&&Number(strictBefore?.totalScore)>=80&&Array.isArray(strictBefore?.hardFailures)&&strictBefore.hardFailures.length===0)"
          if old_pass not in s: raise SystemExit('prepromotion pass guard not found')
          s=s.replace(old_pass,new_pass,1)
          p.write_text(s)

          # 3) Strict scorer: replace legacy 9-axis design scoring with canonical V2 module.
          p=Path('tools/company-strict-production-review.mjs')
          s=p.read_text()
          import_anchor="import {classifyRobloxGenre} from './roblox-genre-profile.mjs';"
          if "company-design-gate-scoring-v2.mjs" not in s:
              if import_anchor not in s: raise SystemExit('strict scorer import anchor missing')
              s=s.replace(import_anchor,import_anchor+"\nimport {DESIGN_GATE_WEIGHTS,scoreDesignGateV2} from './company-design-gate-scoring-v2.mjs';",1)
          s=must_sub(s,r'^const designWeights=\{.*\};$',"const designWeights=DESIGN_GATE_WEIGHTS;",'strict design weights',re.M)
          s=s.replace("implementationScoreComposition:reviewStage==='IMPLEMENTATION_STRICT_REVIEW'?'COMMON_60_PLUS_CATEGORY_40':'LEGACY_DESIGN_100'","implementationScoreComposition:reviewStage==='IMPLEMENTATION_STRICT_REVIEW'?'COMMON_60_PLUS_CATEGORY_40':'STAGE_GATE_SCORING_V2_DESIGN_11_AXIS'",1)
          design_fn="""function designReview(){
            const loops=Array.isArray(seed.CORE_LOOP)?seed.CORE_LOOP:[];
            const identity=clean(seed.DISTINCT_IDENTITY);
            const materials=Array.isArray(seed.SEED_MATERIAL_IDS)?seed.SEED_MATERIAL_IDS:[];
            const generation=clean(seed.generation).toUpperCase();
            const materialComposed=generation.includes('MATERIAL')||generation.includes('COMPOSED');
            const designPath=date?path.join('design',gameId,date,'design-revised.json'):'';
            const cyclePath=date?path.join('design',gameId,date,'cycle-status.json'):'';
            const design=readJson(designPath,null);
            const cycleStatus=readJson(cyclePath,{});
            const designContent=design?.content&&typeof design.content==='object'?design.content:{};
            const designText=JSON.stringify(designContent);
            const robloxGenreProfile=classifyRobloxGenre({category:seed.GAME_CATEGORY,identity,coreLoop:loops,designText,multiplayerMode:designContent.multiplayerMode||seed.MULTIPLAYER_DESIGN_MODE});
            const v2=scoreDesignGateV2({seed,designRecord:design||{},cycleStatus,robloxGenreProfile});
            const base=finalResult({scores:v2.scores,hardFailures:v2.hardFailures,evidence:{seedId:seed.seedId,seedGeneration:seed.generation||null,materialContractApplied:materialComposed,materialIds:materials,designPath:designPath||null,cyclePath:cyclePath||null,multiplayerDesignMode:designContent.multiplayerMode||seed.MULTIPLAYER_DESIGN_MODE,robloxGenreProfile,scoreSystem:v2.scoreSystem,directScoreLevels:v2.directScoreLevels,axisEvidenceLevels:v2.evidenceLevels,criticalAxisMinimumPercent:v2.criticalAxisMinimumPercent,criticalAxisFailures:v2.criticalAxisFailures,revalidated:v2.revalidated,thirtyMinuteHardGateApplied:false,reviewContextSource},reviewStage:'DESIGN_STRICT_REVIEW',passThreshold:DESIGN_PASS_THRESHOLD,rebuildBelow:60,scoreWeights:DESIGN_GATE_WEIGHTS});
            return {...base,scoreSystem:v2.scoreSystem,directScoreLevels:v2.directScoreLevels,axisEvidenceLevels:v2.evidenceLevels,criticalAxisMinimumPercent:v2.criticalAxisMinimumPercent,criticalAxisFailures:v2.criticalAxisFailures,rules:{...base.rules,designScoreComposition:'STAGE_GATE_SCORING_V2_DESIGN_11_AXIS',sourceKeywordOnlyScoringForbidden:true,allApplicableDesignAxesCritical:true,thirtyMinuteHardGateAtDesign:false}};
          }
          """
          s=must_sub(s,r'function designReview\(\)\{.*?\nfunction implementationReview\(\)\{',design_fn+"function implementationReview(){",'strict designReview',re.S)
          p.write_text(s)

          # 4) Canonical pipeline must not reuse a legacy v4 design after V2 becomes authoritative.
          p=Path('tools/artbook-production-pipeline.mjs')
          s=p.read_text()
          old="const d=date||kstDate();\n  return fs.existsSync(path.join('design',gameId,d,'design-revised.json'));"
          new="const d=date||kstDate();\n  const revised=readJson(path.join('design',gameId,d,'design-revised.json'),null);\n  return Number(revised?.version||0)>=5;"
          if old not in s: raise SystemExit('pipeline reuse guard not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY

          node --check tools/company-design-cycle.mjs
          node --check tools/company-design-prepromotion-repair.mjs
          node --check tools/company-strict-production-review.mjs
          node --check tools/artbook-production-pipeline.mjs
          node --check tools/company-design-gate-scoring-v2.mjs
          node qa/company-design-gate-scoring-v2.test.mjs

          if grep -q 'LEGACY_DESIGN_100' tools/company-strict-production-review.mjs; then
            echo 'legacy design scorer marker remains' >&2
            exit 1
          fi
          if grep -q "if(!sessionOk)hard.push('30MIN_CONTENT_FAIL')" tools/company-strict-production-review.mjs; then
            echo 'design-stage 30-minute hard gate remains' >&2
            exit 1
          fi

          git rm -f --ignore-unmatch .github/workflows/temp-design-v2-wireup.yml
          git add tools/company-design-cycle.mjs tools/company-design-prepromotion-repair.mjs tools/company-strict-production-review.mjs tools/artbook-production-pipeline.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: wire design gate scoring v2"
          git push origin HEAD:main
