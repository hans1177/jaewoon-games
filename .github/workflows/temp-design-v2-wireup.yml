name: MIGRATE_STAGE_GATE_V2
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-design-v2-wireup.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node tools/temp-migrate-stage-gate-v2.mjs
      - run: |
          node --check tools/company-design-cycle.mjs
          node --check tools/company-design-prepromotion-repair.mjs
          node --check tools/company-strict-production-review.mjs
          node --check tools/artbook-production-pipeline.mjs
          node --check tools/company-design-gate-scoring-v2.mjs
          node qa/company-design-gate-scoring-v2.test.mjs
          test $(grep -c LEGACY_DESIGN_100 tools/company-strict-production-review.mjs) -eq 0
          test $(grep -c "if(!sessionOk)hard.push('30MIN_CONTENT_FAIL')" tools/company-strict-production-review.mjs) -eq 0
          grep -q STAGE_GATE_SCORING_V2_DESIGN_11_AXIS tools/company-strict-production-review.mjs
          grep -q systemInterconnections tools/company-design-cycle.mjs
      - run: |
          git rm -f .github/workflows/temp-design-v2-wireup.yml tools/temp-migrate-stage-gate-v2.mjs
          git add tools/company-design-cycle.mjs tools/company-design-prepromotion-repair.mjs tools/company-strict-production-review.mjs tools/artbook-production-pipeline.mjs
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git commit -m MIGRATE_STAGE_GATE_V2
          git push origin HEAD:main
