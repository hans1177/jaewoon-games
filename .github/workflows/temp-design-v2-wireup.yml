name: MIGRATE_STAGE_GATE_V2
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-design-v2-wireup.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: APPLY
        run: node tools/temp-migrate-stage-gate-v2.mjs
      - name: CHECK_DESIGN_CYCLE
        run: node --check tools/company-design-cycle.mjs
      - name: CHECK_PREPROMOTION_REPAIR
        run: node --check tools/company-design-prepromotion-repair.mjs
      - name: CHECK_STRICT_REVIEW
        run: node --check tools/company-strict-production-review.mjs
      - name: CHECK_PRODUCTION_PIPELINE
        run: node --check tools/artbook-production-pipeline.mjs
      - name: CHECK_V2_MODULE
        run: node --check tools/company-design-gate-scoring-v2.mjs
      - name: TEST_V2_SCORING
        run: node qa/company-design-gate-scoring-v2.test.mjs
      - name: CHECK_LEGACY_MARKER_REMOVED
        run: test $(grep -c LEGACY_DESIGN_100 tools/company-strict-production-review.mjs) -eq 0
      - name: CHECK_DESIGN_30MIN_GATE_REMOVED
        run: test $(grep -c "if(!sessionOk)hard.push('30MIN_CONTENT_FAIL')" tools/company-strict-production-review.mjs) -eq 0
      - name: CHECK_V2_MARKER
        run: grep -q STAGE_GATE_SCORING_V2_DESIGN_11_AXIS tools/company-strict-production-review.mjs
      - name: CHECK_V2_SCHEMA
        run: grep -q systemInterconnections tools/company-design-cycle.mjs
      - name: COMMIT
        run: |
          git rm -f .github/workflows/temp-design-v2-wireup.yml tools/temp-migrate-stage-gate-v2.mjs
          git add tools/company-design-cycle.mjs tools/company-design-prepromotion-repair.mjs tools/company-strict-production-review.mjs tools/artbook-production-pipeline.mjs
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git commit -m MIGRATE_STAGE_GATE_V2
          git push origin HEAD:main
