name: TMP Apply Adaptive Parallel 20 Core

on:
  push:
    branches: [feat/adaptive-parallel-20-final-core]
    paths:
      - 'tools/apply-adaptive-parallel-20-core.mjs'
      - '.github/workflows/tmp-apply-adaptive-parallel-20-core.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/adaptive-parallel-20-final-core
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply core 20-slot migration
        run: node tools/apply-adaptive-parallel-20-core.mjs
      - name: Verify syntax
        run: |
          node --check assets/vibe-continuous-queue.js
          node --check tools/vibe2-auto-planner.mjs
      - name: Verify queue contract
        run: node --test qa/vibe2-queue-control.test.mjs
      - name: Verify planner contract
        run: node --test qa/vibe2-auto-planner.test.mjs
      - name: Verify 20-slot contract
        run: node --test qa/vibe2-parallelism-20-contract.test.mjs
      - name: Commit verified core changes
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-vibe2-migration'
          git config user.email 'vibe2-migration@users.noreply.github.com'
          git add \
            .github/workflows/vibe2-continuous-core.yml \
            assets/vibe-continuous-queue.js \
            tools/vibe2-auto-planner.mjs \
            qa/vibe2-queue-control.test.mjs \
            qa/vibe2-parallelism-20-contract.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'vibe2: enable adaptive 20-slot core parallelism'
          git push origin HEAD:feat/adaptive-parallel-20-final-core
