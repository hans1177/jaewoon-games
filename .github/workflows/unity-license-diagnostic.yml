name: Unity License Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.build-requests/unity-license-diagnostic.request'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Diagnose UNITY_LICENSE without exposing secret
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, re, xml.etree.ElementTree as ET

          text = os.environ.get('UNITY_LICENSE', '').strip()
          email = os.environ.get('UNITY_EMAIL', '').strip()
          password = os.environ.get('UNITY_PASSWORD', '')
          pv = pathlib.Path('unity-games/daechung-rpg/ProjectSettings/ProjectVersion.txt').read_text(encoding='utf-8')
          m = re.search(r'm_EditorVersion:\s*([^\s]+)', pv)
          project_version = m.group(1) if m else 'unknown'

          print(f'UNITY_EMAIL_PRESENT={bool(email)}')
          print(f'UNITY_PASSWORD_PRESENT={bool(password)}')
          print(f'UNITY_LICENSE_PRESENT={bool(text)}')
          print(f'UNITY_LICENSE_LENGTH={len(text)}')
          print(f'PROJECT_UNITY_VERSION={project_version}')

          classification = 'MISSING'
          client_version = 'none'
          personal = False
          developer_data = False
          gameci_binding = False
          machine_binding_count = 0
          expected_binding = '576562626572264761624c65526f7578'

          if text:
            try:
              root = ET.fromstring(text)
              developer = root.find('.//DeveloperData')
              developer_data = developer is not None and bool(developer.attrib.get('Value'))
              personal = any(e.attrib.get('Tag') == 'UnityPersonal' for e in root.findall('.//Entitlement'))
              cpv = root.find('.//ClientProvidedVersion')
              if cpv is not None and cpv.attrib.get('Value'):
                client_version = cpv.attrib['Value']
              bindings = [b.attrib.get('Value','') for b in root.findall('.//MachineBindings/Binding')]
              machine_binding_count = len(bindings)
              gameci_binding = bool(bindings) and all(v == expected_binding for v in bindings)
              classification = 'ULF_LIKELY' if developer_data and personal and len(text) >= 500 else 'INVALID_OR_INCOMPLETE_ULF'
            except ET.ParseError:
              classification = 'INVALID_XML'

          print(f'CLASSIFICATION={classification}')
          print(f'UNITY_PERSONAL={personal}')
          print(f'HAS_DEVELOPER_DATA={developer_data}')
          print(f'CLIENT_PROVIDED_VERSION={client_version}')
          print(f'MACHINE_BINDING_COUNT={machine_binding_count}')
          print(f'GAMECI_MACHINE_BINDING_MATCH={gameci_binding}')
          print('SECRET_CONTENT_NOT_PRINTED=true')

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
            f.write('## Unity Personal cloud license diagnostic\n')
            f.write(f'- Classification: **{classification}**\n')
            f.write(f'- Project Unity: **{project_version}**\n')
            f.write(f'- License ClientProvidedVersion: **{client_version}**\n')
            f.write(f'- GameCI legacy machine binding match: **{gameci_binding}**\n')
            f.write(f'- Unity Personal entitlement: **{personal}**\n')
            f.write('- Secret contents were not printed.\n')

          if classification != 'ULF_LIKELY':
            raise SystemExit('UNITY_LICENSE is not a complete Unity Personal ULF.')
          PY
