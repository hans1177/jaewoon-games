name: Apply Detailed Stage Scoring V2

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply-detailed-stage-scoring-v2.mjs'
      - '.github/workflows/apply-detailed-stage-scoring-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply scoring migration
        run: node tools/apply-detailed-stage-scoring-v2.mjs
      - name: Run focused scoring tests
        run: |
          node --test qa/company-detailed-stage-scoring-v2.test.mjs
          if [ -f qa/company-common-development-quality-contract.test.mjs ]; then node --test qa/company-common-development-quality-contract.test.mjs; fi
          if [ -f qa/company-development-validation-selected-platform.test.mjs ]; then node --test qa/company-development-validation-selected-platform.test.mjs; fi
      - name: Commit applied policy and scoring engine
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'SCORING_MIGRATION_CHANGES=NONE'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add COMPANY_FLOW.md company-directive.json tools/company-web-validation-evidence-contract.mjs qa/
          git commit -m 'vibe2: apply detailed stage scoring v2'
          git push origin HEAD:main
          echo 'SCORING_MIGRATION_CHANGES=APPLIED'
