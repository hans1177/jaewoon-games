name: Vibe2 24H Runner
# restart-marker: 2026-09-17-workflow-dispatch-refill

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vibe2-24h-runner.yml'
      - '.github/workflows/vibe2-continuous-core.yml'
      - '.github/workflows/vibe2-roblox-candidate-result.yml'
      - '.github/workflows/vibe2-roblox-candidate-runtime.yml'
      - 'tools/vibe2-roblox-skyline-runtime-smoke.mjs'
      - 'tools/vibe2-authorized-source-memory.mjs'
      - 'tools/vibe2-web-experience-ingest.mjs'
      - 'tools/company-system-ai-external-learning-feed.mjs'
      - 'tools/vibe2-external-ai-distillation.mjs'
      - 'tools/vibe2-auto-planner.mjs'
      - 'tools/company-growth-marketing-planner.mjs'
      - 'tools/company-growth-marketing-qa.mjs'
      - 'tools/company-growth-marketing-decision.mjs'
      - 'tools/company-department-portfolio-control.mjs'
      - 'qa/company-department-portfolio-control.test.mjs'
      - '.github/workflows/company-growth-marketing-runtime.yml'
      - 'tools/vibe2-continuous-runner.mjs'
      - 'tools/vibe2-asset-production-plan.mjs'
      - 'assets/vibe-studio-asset-universe.js'
      - 'qa/vibe-studio-asset-universe.test.mjs'
      - 'tools/vibe2-source-worker.mjs'
      - 'tools/vibe2-capability-distillation.mjs'
      - 'tools/vibe3-roblox-distillation.mjs'
      - 'tools/vibe3-roblox-learning-context.mjs'
      - 'tools/vibe2-incremental-qa.mjs'
      - 'qa/vibe3-roblox-distillation.test.mjs'
      - 'qa/company-development-web-runtime.test.mjs'
      - 'tools/company-development-web-gameplay-validation.mjs'
      - 'qa/vibe2-auto-planner.test.mjs'
      - 'qa/vibe2-native-asset-production.test.mjs'
      - 'qa/vibe2-source-worker.test.mjs'
      - 'qa/vibe2-capability-distillation.test.mjs'
      - 'qa/vibe2-incremental-qa.test.mjs'
      - 'tools/vibe2-learning-motor.mjs'
      - 'tools/vibe2-practice-distillation.mjs'
      - 'tools/vibe2-design-intelligence.mjs'
      - 'company-learning/vibe2-learning-motor.json'
      - 'company-learning/vibe3-task-playbooks.json'
      - 'qa/vibe2-learning-motor.test.mjs'
      - 'qa/vibe2-practice-distillation.test.mjs'
      - 'qa/vibe2-design-intelligence.test.mjs'
      - 'tools/vibe2-release-dispatch-recovery.mjs'
      - 'tools/company-recovery-queue.mjs'
      - 'tools/company-recovery-escalation.mjs'
      - 'tools/company-tester-debug-intake.mjs'
      - 'tools/company-platform-suitability.mjs'
      - 'tools/company-platform-exposure-control.mjs'
      - 'qa/company-platform-exposure-control.test.mjs'
      - 'qa/company-platform-suitability.test.mjs'
      - 'qa/company-tester-debug-intake.test.mjs'
      - 'tools/company-recovery-dispatch.mjs'
      - 'tools/company-recovery-learning.mjs'
      - 'tools/company-recovery-code-distillation.mjs'
      - 'tools/company-security-learning.mjs'
      - 'tools/company-system-ai-learning.mjs'
      - 'qa/company-recovery-learning.test.mjs'
      - 'qa/company-security-steward.test.mjs'
      - 'tools/vibe2-post-release-focus.mjs'
      - 'tools/vibe2-system-steward.mjs'
      - 'tools/vibe2-neural-expansion-readiness.mjs'
      - 'qa/vibe2-system-steward.test.mjs'
      - 'qa/vibe2-neural-expansion-readiness.test.mjs'
      - 'qa/vibe2-owner-rule1-continuity.test.mjs'
      - 'qa/vibe2-owner-rule2-external-ai.test.mjs'
      - 'qa/vibe2-owner-rule3-unbounded-learning.test.mjs'
      - 'qa/vibe2-owner-rule4-self-architecture.test.mjs'
      - 'assets/vibe-continuous-queue.js'
      - 'company-learning/platform-release-roadmap.json'
      - 'qa/company-shared-context.test.mjs'
      - 'tools/company-shared-context.mjs'
      - 'company-learning/company-architecture-map.json'
      - 'company-learning/company-log-map.json'
      - 'company-learning/roblox-sustained-maintenance.json'
      - 'company-learning/authorized-source/block-blast/authorized-learning-summary.json'
      - 'VIBE2.md'
      - 'vibe2-runtime.json'
      - 'game-catalog.json'
      - 'company-status.json'
      - 'design/**/design-development-baseline.json'
      - 'design/**/release-production-request.json'
      - 'web-games/**'
      - 'unity-games/**'
      - 'roblox-games/**'
      - 'unreal-games/**'
  workflow_run:
    workflows:
      - Vibe2 Distillation Sample Ingest
    types: [completed]
  schedule:
    # Canonical five-minute safety-net. Event-driven refill remains the primary continuation path.
    - cron: '*/5 * * * *'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  VIBE2_PRIORITY_POLICY: owner-release-development
  VIBE2_AUTO_DEPLOY_VERIFIED_ONLY: 'true'
  VIBE2_MAX_CONCURRENT_GAME_TASKS: '256'
  VIBE2_GAME_PRIMARY_BASELINE_TARGET: '256'
  VIBE2_GAME_PRIMARY_ADAPTIVE_MIN: '30'
  VIBE2_EXTERNAL_MATRIX_BATCH_MAX: '256'
  VIBE2_WORK_ORDER_OUTPUT_CONTRACT: explicit-cli-first
  VIBE2_24H_LEARNING_PROVIDER: 'LOCAL_OLLAMA'
  VIBE2_24H_GEMINI_ALLOWED: 'false'
  VIBE2_LEARNING_ALWAYS_ON: 'true'
  VIBE2_LEARNING_CONCURRENT_WITH_PRODUCTION: 'true'
  VIBE2_LEARNING_LANE_MAX: '4'

# Keep one continuous scheduler chain. v2 releases stale pre-lane-isolation concurrency
# while still collapsing wake signals into one pending cycle per current scheduler epoch.
concurrency:
  group: vibe2-24h-cycle-singleton-v3
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-slim
    timeout-minutes: 8
    outputs:
      continue_required: ${{ steps.queue_state.outputs.continue_required }}
      wave_ready: ${{ steps.queue_state.outputs.wave_ready }}
      game_refill_ready: ${{ steps.queue_state.outputs.game_refill_ready }}
      free_worker_slots: ${{ steps.queue_state.outputs.free_worker_slots }}
      active_worker_reservations: ${{ steps.queue_state.outputs.active_worker_reservations }}
      game_primary_queued: ${{ steps.queue_state.outputs.game_primary_queued }}
      learning_idle_queued: ${{ steps.queue_state.outputs.learning_idle_queued }}
      recovery_fast_queued: ${{ steps.queue_state.outputs.recovery_fast_queued }}
      runner_pressure: ${{ steps.queue_state.outputs.runner_pressure }}
    steps:
      - name: Checkout Vibe2 control branch
        uses: actions/checkout@v4
        with:
          ref: vibe2-unreal-core
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify machine state and planner tools
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs=require('fs'); for (const file of ['.vibe2/queue.json','.vibe2/parallelism-control.json']) JSON.parse(fs.readFileSync(file,'utf8')); console.log('VIBE2_CONTROL_STATE_JSON=VALID')"
          echo "VIBE2_PRIORITY_POLICY=$VIBE2_PRIORITY_POLICY"
          echo "VIBE2_AUTO_DEPLOY_VERIFIED_ONLY=$VIBE2_AUTO_DEPLOY_VERIFIED_ONLY"
          echo "VIBE2_MAX_CONCURRENT_GAME_TASKS=$VIBE2_MAX_CONCURRENT_GAME_TASKS"
          echo 'VIBE2_PARALLELISM_POLICY=UNBOUNDED_BY_POLICY'
          echo "VIBE2_EXTERNAL_MATRIX_BATCH_MAX=$VIBE2_EXTERNAL_MATRIX_BATCH_MAX"
          echo "VIBE2_WORK_ORDER_OUTPUT_CONTRACT=$VIBE2_WORK_ORDER_OUTPUT_CONTRACT"
          test "$VIBE2_24H_LEARNING_PROVIDER" = "LOCAL_OLLAMA"
          test "$VIBE2_24H_GEMINI_ALLOWED" = "false"
          echo "VIBE2_24H_LEARNING_PROVIDER=$VIBE2_24H_LEARNING_PROVIDER"
          echo "VIBE2_24H_GEMINI_LEARNING=FORBIDDEN"

      - name: Plan from latest main and persist control queue
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-vibe2-planner'
          git config user.email 'vibe2-planner@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            echo "VIBE2_AUTOPLAN_ATTEMPT=$attempt/5"
            git fetch origin '+refs/heads/main:refs/remotes/origin/main' '+refs/heads/vibe2-unreal-core:refs/remotes/origin/vibe2-unreal-core' '+refs/heads/company-runtime:refs/remotes/origin/company-runtime' --depth=2 --no-tags --quiet
            git fetch origin '+refs/heads/vibe2-learning-runtime:refs/remotes/origin/vibe2-learning-runtime' --depth=2 --no-tags --quiet || true
            git reset --hard origin/vibe2-unreal-core
            rm -rf /tmp/vibe2-main
            git worktree prune
            git worktree add --detach /tmp/vibe2-main origin/main >/dev/null
            control_root="$PWD"

            (
              cd /tmp/vibe2-main
              node --check tools/company-shared-context.mjs
              node --check tools/company-constitution-enforcer.mjs
              node --test qa/company-shared-context.test.mjs
              node tools/company-shared-context.mjs --output=/tmp/vibe2-shared-context-before-plan.json | tee /tmp/vibe2-shared-context-before-plan.log
              node tools/company-constitution-enforcer.mjs --phase=24h-planner | tee /tmp/vibe2-constitution-enforcer.log
              node --check tools/vibe2-learning-motor.mjs
              node --check tools/vibe2-auto-planner.mjs
              node --check tools/vibe2-continuous-runner.mjs
              node --check tools/vibe2-asset-production-plan.mjs
              node --check assets/vibe-studio-asset-universe.js
              node --check tools/vibe2-source-worker.mjs
              node --check tools/vibe2-capability-distillation.mjs
              node --check tools/vibe3-roblox-distillation.mjs
              node --check tools/vibe3-roblox-learning-context.mjs
              node --check tools/vibe2-incremental-qa.mjs
              node --check tools/company-development-web-gameplay-validation.mjs
              node --check tools/vibe2-practice-distillation.mjs
              node --check tools/vibe2-design-intelligence.mjs
              node --test qa/vibe2-learning-motor.test.mjs
              node --test qa/vibe2-auto-planner.test.mjs
              node --test qa/vibe2-native-asset-production.test.mjs
              node --test qa/vibe-studio-asset-universe.test.mjs
              node --test qa/vibe2-source-worker.test.mjs
              node --test qa/vibe2-capability-distillation.test.mjs
              node --test qa/vibe3-roblox-distillation.test.mjs
              node --test qa/vibe2-incremental-qa.test.mjs
              node --test qa/company-development-web-runtime.test.mjs
              node --test qa/vibe2-practice-distillation.test.mjs
              node --test qa/vibe2-design-intelligence.test.mjs

              # Rule 4 final-stage neural expansion readiness is derived from direct targeted QA.
              node --check tools/vibe2-neural-expansion-readiness.mjs
              node tools/vibe2-neural-expansion-readiness.mjs \
                --root=. \
                --output=/tmp/vibe2-neural-expansion-readiness.json | tee /tmp/vibe2-neural-expansion-readiness.log
            )

            # Repair canonical queue/parallelism state before fail-closed handoff validation.
            node --check /tmp/vibe2-main/tools/vibe2-system-steward.mjs
            node --test /tmp/vibe2-main/qa/vibe2-system-steward.test.mjs
            node /tmp/vibe2-main/tools/vibe2-system-steward.mjs \
              --queue="$control_root/.vibe2/queue.json" \
              --control="$control_root/.vibe2/parallelism-control.json" \
              --neural-readiness=/tmp/vibe2-neural-expansion-readiness.json | tee /tmp/vibe2-system-steward.log

            node --check /tmp/vibe2-main/tools/vibe2-handoff.mjs
            node /tmp/vibe2-main/tools/vibe2-handoff.mjs --check \
              --runtime=/tmp/vibe2-main/vibe2-runtime.json \
              --queue="$control_root/.vibe2/queue.json" \
              --control="$control_root/.vibe2/parallelism-control.json" \
              --experience="$control_root/.vibe2/experience.json" \
              --project-lifecycle="$control_root/.vibe2/web-roblox-handoffs.json" \
              --output=/tmp/vibe2-handoff-before-plan.json >/tmp/vibe2-handoff-before-plan.log

            if git show origin/vibe2-learning-runtime:company-learning/vibe3-recombination-memory.json > /tmp/vibe2-recombination-memory.json 2>/dev/null; then
              echo 'VIBE2_RECOMBINATION_MEMORY=LOADED'
            else
              printf '%s\n' '{"version":1,"recipes":[]}' > /tmp/vibe2-recombination-memory.json
              echo 'VIBE2_RECOMBINATION_MEMORY=EMPTY'
            fi

            if git show origin/vibe2-learning-runtime:company-learning/vibe3-roblox-distillation-ledger.json > /tmp/vibe3-roblox-distillation-ledger.json 2>/dev/null; then
              echo 'VIBE3_ROBLOX_DISTILLATION_MEMORY=LOADED'
            else
              printf '%s\n' '{"version":1,"kind":"vibe3-roblox-distillation-ledger","records":[]}' > /tmp/vibe3-roblox-distillation-ledger.json
              echo 'VIBE3_ROBLOX_DISTILLATION_MEMORY=EMPTY'
            fi
            node /tmp/vibe2-main/tools/vibe3-roblox-distillation.mjs \
              --existing=/tmp/vibe3-roblox-distillation-ledger.json \
              --known-good=/tmp/vibe2-main/roblox-games/known-good-runtime-evidence.json \
              --root=/tmp/vibe2-main \
              --output=/tmp/vibe3-roblox-distillation-ledger.json | tee /tmp/vibe3-roblox-distillation.log

            git show origin/company-runtime:development-queue.json > /tmp/vibe2-company-runtime-queue.json
            git -C /tmp/vibe2-main fetch origin '+refs/heads/company-runtime:refs/remotes/origin/company-runtime' --depth=2 --no-tags --quiet
            for runtime_design_path in design game-seed-state.json; do
              if git -C /tmp/vibe2-main cat-file -e "origin/company-runtime:$runtime_design_path" 2>/dev/null; then
                git -C /tmp/vibe2-main checkout origin/company-runtime -- "$runtime_design_path"
                git -C /tmp/vibe2-main reset -- "$runtime_design_path" >/dev/null 2>&1 || true
              fi
            done
            echo 'VIBE2_RUNTIME_DESIGN_OVERLAY=company-runtime:design,game-seed-state.json'
            node --check /tmp/vibe2-main/tools/vibe2-post-release-focus.mjs
            node /tmp/vibe2-main/tools/vibe2-post-release-focus.mjs \
              --roadmap=/tmp/vibe2-main/company-learning/platform-release-roadmap.json \
              --company-runtime-queue=/tmp/vibe2-company-runtime-queue.json \
              --historical-registry=/tmp/vibe2-main/company-learning/roblox-sustained-maintenance.json \
              --queue=.vibe2/queue.json \
              --recombination=/tmp/vibe2-recombination-memory.json \
              --exposure=.vibe2/platform-exposure-state.json \
              --root=/tmp/vibe2-main | tee /tmp/vibe2-post-release-focus.log

            # Focused release caretakers are primary game work. Persist them before auxiliary planning
            # so unrelated marketing/learning failures cannot erase or delay the 24H game queue.
            if grep -q '^VIBE2_POST_RELEASE_FOCUS_ADDED=YES$' /tmp/vibe2-post-release-focus.log; then
              git add .vibe2/queue.json
              if ! git diff --cached --quiet; then
                git commit -m 'vibe2: checkpoint focused release caretakers [skip ci]'
                git push origin HEAD:vibe2-unreal-core
                echo 'VIBE2_FOCUSED_CARETAKER_CHECKPOINT=PUSHED'
                git fetch origin '+refs/heads/vibe2-unreal-core:refs/remotes/origin/vibe2-unreal-core' --depth=2 --no-tags --quiet
              else
                echo 'VIBE2_FOCUSED_CARETAKER_CHECKPOINT=UNCHANGED'
              fi
            fi

            node /tmp/vibe2-main/tools/vibe2-authorized-source-memory.mjs \
              --summary=/tmp/vibe2-main/company-learning/authorized-source/block-blast/authorized-learning-summary.json \
              --experience=.vibe2/experience.json | tee /tmp/vibe2-authorized-source-memory.log

            test -f .vibe2/external-ai-distilled-knowledge.json || printf '%s\n' '{"version":1,"kind":"vibe2-external-ai-distilled-knowledge","entries":[]}' > .vibe2/external-ai-distilled-knowledge.json
            node --check /tmp/vibe2-main/tools/company-system-ai-external-learning-feed.mjs
            node --check /tmp/vibe2-main/tools/vibe2-external-ai-distillation.mjs
            node /tmp/vibe2-main/tools/company-system-ai-external-learning-feed.mjs \
              --queue=.vibe2/system-ai-queue.json \
              --output=/tmp/system-ai-external-learning-feed.json | tee /tmp/system-ai-external-learning-feed.log
            node /tmp/vibe2-main/tools/vibe2-external-ai-distillation.mjs \
              --input=/tmp/system-ai-external-learning-feed.json \
              --output=.vibe2/external-ai-distilled-knowledge.json | tee /tmp/vibe2-external-ai-distillation.log

            node --check /tmp/vibe2-main/tools/vibe2-web-experience-ingest.mjs
            node /tmp/vibe2-main/tools/vibe2-web-experience-ingest.mjs \
              --queue=/tmp/vibe2-company-runtime-queue.json \
              --experience=.vibe2/experience.json \
              --external-ai-distilled=.vibe2/external-ai-distilled-knowledge.json \
              --company-runtime-ref=origin/company-runtime | tee /tmp/vibe2-web-experience-ingest.log

            node --check /tmp/vibe2-main/tools/vibe2-code-pattern-ingest.mjs
            node /tmp/vibe2-main/tools/vibe2-code-pattern-ingest.mjs \
              --samples=/tmp/vibe2-main/company-learning/training-samples \
              --output=.vibe2/code-pattern-library.json | tee /tmp/vibe2-code-pattern-ingest.log

            node --check /tmp/vibe2-main/tools/vibe2-learning-motor.mjs
            node /tmp/vibe2-main/tools/vibe2-learning-motor.mjs \
              --experience=.vibe2/experience.json \
              --code-patterns=.vibe2/code-pattern-library.json \
              --queue=.vibe2/queue.json \
              --company-queue=/tmp/vibe2-company-runtime-queue.json \
              --roadmap=/tmp/vibe2-main/company-learning/platform-release-roadmap.json \
              --state=.vibe2/learning-motor-state.json \
              --benchmark=.vibe2/benchmark-ladder.json \
              --practice=.vibe2/idle-practice-queue.json \
              --handoff=.vibe2/web-roblox-handoffs.json | tee /tmp/vibe2-learning-motor.log

            node --check /tmp/vibe2-main/tools/company-recovery-queue.mjs
            node --check /tmp/vibe2-main/tools/company-recovery-escalation.mjs
            node --check /tmp/vibe2-main/tools/company-recovery-dispatch.mjs
            node --check /tmp/vibe2-main/tools/company-recovery-learning.mjs
            node --check /tmp/vibe2-main/tools/company-recovery-code-distillation.mjs
            node --check /tmp/vibe2-main/tools/company-security-learning.mjs
            (
              cd /tmp/vibe2-main
              node --test qa/company-recovery-learning.test.mjs
            )

            test -f .vibe2/recovery-queue.json || printf '%s\n' '{"version":1,"kind":"company-recovery-queue","policy":"REPEATED_FAILURE_AND_BOTTLENECK_RECOVERY_WITH_VERIFIED_LEARNING","tasks":[]}' > .vibe2/recovery-queue.json
            test -f .vibe2/tester-debug-tickets.json || printf '%s\n' '{"version":1,"kind":"tester-debug-tickets","policy":"UNIFIED_WEB_NATIVE_POST_RELEASE_TESTER_DEBUG_INTAKE","tickets":[]}' > .vibe2/tester-debug-tickets.json
            test -f .vibe2/platform-exposure-state.json || printf '%s\n' '{"version":1,"kind":"platform-exposure-state","games":[]}' > .vibe2/platform-exposure-state.json
            test -f .vibe2/homepage-platform-exposure.json || printf '%s\n' '{"version":1,"publicSafe":true,"internalCompanySurface":true,"games":[]}' > .vibe2/homepage-platform-exposure.json
            test -f .vibe2/system-ai-queue.json || printf '%s\n' '{"version":1,"kind":"company-system-ai-queue","policy":"PRIMARY_AI_SUPERVISED_FREE_EXTERNAL_AI_SYSTEM_WORK","tasks":[]}' > .vibe2/system-ai-queue.json
            test -f .vibe2/security-incidents.json || printf '%s\n' '{"version":1,"kind":"company-security-incidents","policy":"QUARANTINE_PRESERVE_REDACTED_EVIDENCE_VERIFY_RECOVERY_THEN_DISTILL","incidents":[]}' > .vibe2/security-incidents.json

            node --check /tmp/vibe2-main/tools/company-growth-marketing-planner.mjs
            node --check /tmp/vibe2-main/tools/company-growth-marketing-decision.mjs
            node --check /tmp/vibe2-main/tools/company-growth-marketing-qa.mjs
            git show origin/company-runtime:game-catalog.json > /tmp/vibe2-marketing-catalog.json
            node /tmp/vibe2-main/tools/company-growth-marketing-planner.mjs \
              --catalog=/tmp/vibe2-marketing-catalog.json \
              --queue=.vibe2/system-ai-queue.json \
              --roadmap=/tmp/vibe2-main/company-learning/platform-release-roadmap.json \
              --output=/tmp/vibe2-marketing-plan.json | tee /tmp/vibe2-marketing-plan.log

            mkdir -p .vibe2/marketing-decisions
            : > /tmp/vibe2-marketing-decision.log
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              game_id="$(node -p "require('$file').gameId")"
              decision_file=".vibe2/marketing-decisions/${game_id}.json"
              if ! node /tmp/vibe2-main/tools/company-growth-marketing-decision.mjs --file="$file" --output="$decision_file" | tee -a /tmp/vibe2-marketing-decision.log; then
                echo "MARKETING_AUXILIARY_DECISION_FAILED=$game_id" | tee -a /tmp/vibe2-marketing-decision.log
                rm -f "$decision_file"
                continue
              fi
              if ! node /tmp/vibe2-main/tools/company-growth-marketing-qa.mjs --file="$decision_file" --game-id="$game_id"; then
                echo "MARKETING_AUXILIARY_QA_BLOCKED=$game_id" | tee -a /tmp/vibe2-marketing-decision.log
                rm -f "$decision_file"
                continue
              fi
            done < <(find /tmp/vibe2-main/company-learning/marketing -mindepth 2 -maxdepth 2 -name latest.json -type f 2>/dev/null | sort)

            node --check /tmp/vibe2-main/tools/company-tester-debug-intake.mjs
            (
              cd /tmp/vibe2-main
              node --test qa/company-tester-debug-intake.test.mjs
            )
            node /tmp/vibe2-main/tools/company-tester-debug-intake.mjs \
              --development-queue=/tmp/vibe2-company-runtime-queue.json \
              --tickets=.vibe2/tester-debug-tickets.json \
              --recovery=.vibe2/recovery-queue.json \
              --output=/tmp/vibe2-tester-debug-intake.json | tee /tmp/vibe2-tester-debug-intake.log

            node /tmp/vibe2-main/tools/company-recovery-escalation.mjs \
              --queue=.vibe2/queue.json \
              --system-ai=.vibe2/system-ai-queue.json \
              --recovery=.vibe2/recovery-queue.json | tee /tmp/vibe2-recovery-escalation.log

            node /tmp/vibe2-main/tools/company-recovery-dispatch.mjs \
              --route=vibe \
              --queue=.vibe2/queue.json \
              --system-ai=.vibe2/system-ai-queue.json \
              --recovery=.vibe2/recovery-queue.json | tee /tmp/vibe2-recovery-dispatch.log

            node /tmp/vibe2-main/tools/company-recovery-learning.mjs \
              --recovery=.vibe2/recovery-queue.json \
              --experience=.vibe2/experience.json | tee /tmp/vibe2-recovery-learning.log

            node /tmp/vibe2-main/tools/company-recovery-code-distillation.mjs \
              --recovery=.vibe2/recovery-queue.json \
              --library=.vibe2/code-pattern-library.json \
              --authorized=/tmp/vibe2-main/company-learning/authorized-source/block-blast/authorized-learning-summary.json \
              --external=/tmp/vibe2-main/company-learning/vibe3-memory-index.json | tee /tmp/vibe2-recovery-code-distillation.log

            node /tmp/vibe2-main/tools/company-security-learning.mjs \
              --incidents=.vibe2/security-incidents.json \
              --experience=.vibe2/experience.json \
              --patterns=.vibe2/code-pattern-library.json | tee /tmp/vibe2-security-learning.log

            node --check /tmp/vibe2-main/tools/company-system-ai-learning.mjs
            node /tmp/vibe2-main/tools/company-system-ai-learning.mjs \
              --queue=.vibe2/system-ai-queue.json \
              --experience=.vibe2/experience.json \
              --patterns=.vibe2/code-pattern-library.json \
              --state=.vibe2/learning-motor-state.json | tee /tmp/vibe2-system-ai-learning.log

            if grep -Eq '^(RECOVERY_LEARNING_ADDED|RECOVERY_CODE_INTERNAL_ADDED|SECURITY_LEARNING_EXPERIENCE_ADDED|SECURITY_LEARNING_PATTERNS_ADDED|SYSTEM_AI_LEARNING_EXPERIENCE_ADDED|SYSTEM_AI_LEARNING_PATTERNS_ADDED)=[1-9][0-9]*$' /tmp/vibe2-recovery-learning.log /tmp/vibe2-recovery-code-distillation.log /tmp/vibe2-security-learning.log /tmp/vibe2-system-ai-learning.log 2>/dev/null; then
              node /tmp/vibe2-main/tools/vibe2-learning-motor.mjs \
                --experience=.vibe2/experience.json \
                --code-patterns=.vibe2/code-pattern-library.json \
                --queue=.vibe2/queue.json \
                --company-queue=/tmp/vibe2-company-runtime-queue.json \
                --roadmap=/tmp/vibe2-main/company-learning/platform-release-roadmap.json \
                --state=.vibe2/learning-motor-state.json \
                --benchmark=.vibe2/benchmark-ladder.json \
                --practice=.vibe2/idle-practice-queue.json \
                --handoff=.vibe2/web-roblox-handoffs.json | tee /tmp/vibe2-recovery-learning-motor.log
            else
              echo 'VIBE2_VERIFIED_LEARNING_MOTOR=NO_NEW_VERIFIED_LESSONS'
            fi

            node /tmp/vibe2-main/tools/vibe2-handoff.mjs --check \
              --runtime=/tmp/vibe2-main/vibe2-runtime.json \
              --queue="$control_root/.vibe2/queue.json" \
              --control="$control_root/.vibe2/parallelism-control.json" \
              --experience="$control_root/.vibe2/experience.json" \
              --project-lifecycle="$control_root/.vibe2/web-roblox-handoffs.json" \
              --output=/tmp/vibe2-handoff-before-attempt.json >/tmp/vibe2-handoff-before-attempt.log

            node /tmp/vibe2-main/tools/vibe2-release-baseline-queue.mjs \
              --catalog=/tmp/vibe2-main/game-catalog.json \
              --development-queue=/tmp/vibe2-company-runtime-queue.json \
              --queue="$control_root/.vibe2/queue.json" \
              --root=/tmp/vibe2-main | tee /tmp/vibe2-release-baseline-plan.log

            node --check /tmp/vibe2-main/tools/vibe2-auto-planner.mjs
            node /tmp/vibe2-main/tools/vibe2-auto-planner.mjs \
              --runtime=/tmp/vibe2-main/vibe2-runtime.json \
              --status=/tmp/vibe2-main/company-status.json \
              --catalog=/tmp/vibe2-main/game-catalog.json \
              --development-queue=/tmp/vibe2-company-runtime-queue.json \
              --queue="$control_root/.vibe2/queue.json" \
              --control="$control_root/.vibe2/parallelism-control.json" \
              --experience="$control_root/.vibe2/experience.json" \
              --recombination=/tmp/vibe2-recombination-memory.json \
              --roblox-distillation=/tmp/vibe3-roblox-distillation-ledger.json \
              --historical-registry=/tmp/vibe2-main/company-learning/roblox-sustained-maintenance.json \
              --root=/tmp/vibe2-main \
              --max="$VIBE2_MAX_CONCURRENT_GAME_TASKS" | tee /tmp/vibe2-autoplan.log

            node --check /tmp/vibe2-main/tools/company-department-portfolio-control.mjs
            (
              cd /tmp/vibe2-main
              node --test qa/company-department-portfolio-control.test.mjs
            )
            node /tmp/vibe2-main/tools/company-department-portfolio-control.mjs \
              --catalog=/tmp/vibe2-marketing-catalog.json \
              --development-queue=/tmp/vibe2-company-runtime-queue.json \
              --queue="$control_root/.vibe2/queue.json" \
              --marketing=/tmp/vibe2-main/company-learning/marketing \
              --previous="$control_root/.vibe2/portfolio-decisions.json" \
              --output="$control_root/.vibe2/portfolio-decisions.json" | tee /tmp/vibe2-portfolio-control.log

            node --check /tmp/vibe2-main/tools/company-platform-suitability.mjs
            (
              cd /tmp/vibe2-main
              node --test qa/company-platform-suitability.test.mjs qa/company-selected-platform-router.test.mjs
            )
            node /tmp/vibe2-main/tools/company-platform-suitability.mjs \
              --catalog=/tmp/vibe2-marketing-catalog.json \
              --development-queue=/tmp/vibe2-company-runtime-queue.json \
              --root=/tmp/vibe2-main \
              --output="$control_root/.vibe2/platform-suitability.json" | tee /tmp/vibe2-platform-suitability.log

            node --check /tmp/vibe2-main/tools/company-platform-exposure-control.mjs
            (
              cd /tmp/vibe2-main
              node --test qa/company-platform-exposure-control.test.mjs qa/vibe2-post-release-boundary.test.mjs
            )
            node /tmp/vibe2-main/tools/company-platform-exposure-control.mjs \
              --development-queue=/tmp/vibe2-company-runtime-queue.json \
              --tickets="$control_root/.vibe2/tester-debug-tickets.json" \
              --suitability="$control_root/.vibe2/platform-suitability.json" \
              --roadmap=/tmp/vibe2-main/company-learning/platform-release-roadmap.json \
              --queue="$control_root/.vibe2/queue.json" \
              --output="$control_root/.vibe2/platform-exposure-state.json" \
              --homepage-output="$control_root/.vibe2/homepage-platform-exposure.json" | tee /tmp/vibe2-platform-exposure.log

            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createVibeContinuousQueue } from 'file:///tmp/vibe2-main/assets/vibe-continuous-queue.js';
          const file = '.vibe2/queue.json';
          const beforeText = fs.readFileSync(file, 'utf8');
          const before = JSON.parse(beforeText);
          const configured = Number(process.env.VIBE2_MAX_CONCURRENT_GAME_TASKS);
          const maxConcurrentTasks = Number.isFinite(configured) && configured > 0 ? Math.floor(configured) : 256;
          const normalized = createVibeContinuousQueue({ ...before, maxConcurrentTasks });
          const afterText = `${JSON.stringify(normalized, null, 2)}\n`;
          if (beforeText !== afterText) {
            fs.writeFileSync(file, afterText, 'utf8');
            console.log('VIBE2_QUEUE_SCHEMA_MIGRATED=YES');
          } else {
            console.log('VIBE2_QUEUE_SCHEMA_MIGRATED=NO');
          }
          NODE

            node /tmp/vibe2-main/tools/vibe2-handoff.mjs --check \
              --runtime=/tmp/vibe2-main/vibe2-runtime.json \
              --queue="$control_root/.vibe2/queue.json" \
              --control="$control_root/.vibe2/parallelism-control.json" \
              --experience="$control_root/.vibe2/experience.json" \
              --project-lifecycle="$control_root/.vibe2/web-roblox-handoffs.json" \
              --output=/tmp/vibe2-handoff-after-plan.json >/tmp/vibe2-handoff-after-plan.log

            (
              cd /tmp/vibe2-main
              node tools/company-shared-context.mjs --output=/tmp/vibe2-shared-context-after-plan.json | tee /tmp/vibe2-shared-context-after-plan.log
            )

            git add .vibe2/queue.json .vibe2/parallelism-control.json .vibe2/experience.json .vibe2/external-ai-distilled-knowledge.json .vibe2/code-pattern-library.json .vibe2/learning-motor-state.json .vibe2/benchmark-ladder.json .vibe2/idle-practice-queue.json .vibe2/web-roblox-handoffs.json .vibe2/recovery-queue.json .vibe2/security-incidents.json .vibe2/system-ai-queue.json .vibe2/marketing-decisions .vibe2/portfolio-decisions.json .vibe2/tester-debug-tickets.json .vibe2/platform-suitability.json .vibe2/platform-exposure-state.json .vibe2/homepage-platform-exposure.json
            if git diff --cached --quiet; then
              echo 'VIBE2_AUTOPLAN_WRITE=NO'
              exit 0
            fi

            if grep -Eq '^(RECOVERY_ESCALATION_ADDED|RECOVERY_LEARNING_ADDED|RECOVERY_CODE_INTERNAL_ADDED|SECURITY_LEARNING_EXPERIENCE_ADDED|SECURITY_LEARNING_PATTERNS_ADDED|SYSTEM_AI_LEARNING_EXPERIENCE_ADDED|SYSTEM_AI_LEARNING_PATTERNS_ADDED)=[1-9][0-9]*$' /tmp/vibe2-recovery-escalation.log /tmp/vibe2-recovery-learning.log /tmp/vibe2-recovery-code-distillation.log /tmp/vibe2-security-learning.log /tmp/vibe2-system-ai-learning.log 2>/dev/null; then
              commit_message='vibe2: persist recovery and verified learning state [skip ci]'
            elif test -f /tmp/vibe2-system-steward.log && ! grep -Eq '^VIBE2_SYSTEM_STEWARD_ACTION=(HEALTHY_NO_SCOPED_REPAIR|NO_RUNNABLE_WORK_FOR_PLANNER_REFILL)$' /tmp/vibe2-system-steward.log; then
              commit_message='vibe2: repair machine state with system steward [skip ci]'
            elif test -f /tmp/vibe2-platform-exposure.log && grep -Eq '^PLATFORM_INTERNAL_RELEASES=[1-9][0-9]*$|^PLATFORM_SECOND_GATE_READY=[1-9][0-9]*$' /tmp/vibe2-platform-exposure.log; then
              commit_message='vibe2: persist platform exposure and second gate state [skip ci]'
            elif test -f /tmp/vibe2-post-release-focus.log && grep -q '^VIBE2_POST_RELEASE_FOCUS_ADDED=YES$' /tmp/vibe2-post-release-focus.log; then
              commit_message='vibe2: queue post-release focused development [skip ci]'
            elif grep -q '^VIBE2_AUTHORIZED_SOURCE_MEMORY_ADDED=YES$' /tmp/vibe2-authorized-source-memory.log; then
              commit_message='vibe2: ingest authorized Block Blast learning memory [skip ci]'
            elif test -f /tmp/vibe2-external-ai-distillation.log && grep -Eq '^VIBE2_EXTERNAL_AI_ACCEPTED=[1-9][0-9]*$' /tmp/vibe2-external-ai-distillation.log; then
              commit_message='vibe2: persist distilled external ai knowledge [skip ci]'
            elif grep -Eq '^VIBE2_MASTERY_NEW_(EXPERIENCE|CODE_PATTERNS)=[1-9][0-9]*$|^VIBE2_SPECIALIZED_EXPERIENCE_PERSISTED=[1-9][0-9]*$|^VIBE2_ROBLOX_STUDIO_EXPERIENCE_PERSISTED=[1-9][0-9]*$' /tmp/vibe2-learning-motor.log; then
              commit_message='vibe2: absorb verified development mastery and experience [skip ci]'
            elif grep -q '^VIBE2_RELEASE_BASELINE_GAP_PLAN=YES$' /tmp/vibe2-release-baseline-plan.log; then
              commit_message='vibe2: queue release baseline implementation gap [skip ci]'
            elif grep -q '^VIBE2_AUTO_PLAN=YES$' /tmp/vibe2-autoplan.log; then
              commit_message='vibe2: plan next machine-state work [skip ci]'
            else
              commit_message='vibe2: persist policy-unbounded adaptive parallel queue state [skip ci]'
            fi
            git commit -m "$commit_message"
            if git push origin HEAD:vibe2-unreal-core; then
              echo 'VIBE2_AUTOPLAN_WRITE=YES'
              exit 0
            fi
            echo "VIBE2_AUTOPLAN_OPTIMISTIC_RETRY=$attempt"
            sleep $((attempt * 2))
          done

          echo 'VIBE2_AUTOPLAN_PUSH=FAILED' >&2
          exit 1

      - name: Read queue continuation state
        id: queue_state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node /tmp/vibe2-main/tools/vibe2-queue-control.mjs summary | tee /tmp/vibe2-plan-summary.log

          runner_pressure='YES'
          pressure_count='unknown'
          if curl --fail-with-body --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --output /tmp/vibe2-24h-actions-runs.json; then
            if pressure_count="$(node <<'NODE'
          const fs=require('fs');
          const payload=JSON.parse(fs.readFileSync('/tmp/vibe2-24h-actions-runs.json','utf8'));
          const currentRun=String(process.env.GITHUB_RUN_ID||'');
          const pressureStates=new Set(['queued','pending','requested']);
          const count=(payload.workflow_runs||[]).filter(row=>
            String(row.id||'')!==currentRun &&
            pressureStates.has(String(row.status||'').toLowerCase())
          ).length;
          process.stdout.write(String(count));
          NODE
            )" && [[ "$pressure_count" =~ ^[0-9]+$ ]]; then
              if [ "$pressure_count" -eq 0 ]; then runner_pressure='NO'; fi
              echo 'VIBE2_24H_RUNNER_PRESSURE_OBSERVATION=PASS'
            else
              pressure_count='unknown'
              echo 'VIBE2_24H_RUNNER_PRESSURE_OBSERVATION=FAIL_DEFER_LEARNING'
            fi
          else
            echo 'VIBE2_24H_RUNNER_PRESSURE_OBSERVATION=FAIL_DEFER_LEARNING'
          fi
          echo "runner_pressure=$runner_pressure" >> "$GITHUB_OUTPUT"
          echo "VIBE2_24H_RUNNER_QUEUE_PRESSURE=${pressure_count}"
          if [ "$runner_pressure" = 'YES' ]; then
            echo 'VIBE2_24H_LEARNING_IDLE_DEFERRED=RUNNER_PRESSURE'
          else
            echo 'VIBE2_24H_LEARNING_IDLE_DEFERRED=NO'
          fi
          continue_required="$(sed -n 's/^VIBE2_QUEUE_CONTINUE=//p' /tmp/vibe2-plan-summary.log | tail -n1)"
          case "${continue_required:-NO}" in
            YES|NO) ;;
            *) echo "invalid VIBE2_QUEUE_CONTINUE=${continue_required:-}" >&2; exit 1 ;;
          esac
          echo "continue_required=${continue_required:-NO}" >> "$GITHUB_OUTPUT"
          node <<'NODE'
          const fs=require('fs');
          const q=JSON.parse(fs.readFileSync('.vibe2/queue.json','utf8'));
          const lane=t=>{
            const status=String(t.status||'').toLowerCase(),blocker=String(t.blocker||''),dep=String(t.department||'').toLowerCase(),type=String(t.type||'implementation').toLowerCase(),ev=(t.evidence||[]).map(String);
            if(status==='running'&&/candidate-awaiting-qa-and-deployment|awaiting.*qa|qa.*awaiting|slot-released.*fan-in/i.test(blocker))return'RELEASE_WAIT';
            if(ev.includes('learning-practice-only')||dep==='learning'||(dep==='development'&&type==='research'))return'LEARNING_IDLE';
            if(dep==='development'&&type==='implementation')return'GAME_PRIMARY';
            if(t.systemSteward===true)return'RECOVERY_FAST';
            return'CONTROL_FAST';
          };
          const tasks=q.tasks||[];
          const activeGame=tasks.filter(t=>String(t.status||'').toLowerCase()==='running'&&String(t.reservationRunId||'').trim()&&!String(t.blocker||'').trim()&&lane(t)==='GAME_PRIMARY').length;
          const gameQueued=tasks.filter(t=>String(t.status||'').toLowerCase()==='queued'&&lane(t)==='GAME_PRIMARY').length;
          const learningQueued=tasks.filter(t=>String(t.status||'').toLowerCase()==='queued'&&lane(t)==='LEARNING_IDLE').length;
          const recoveryQueued=tasks.filter(t=>String(t.status||'').toLowerCase()==='queued'&&lane(t)==='RECOVERY_FAST').length;
          const control=JSON.parse(fs.readFileSync('.vibe2/parallelism-control.json','utf8'));
          const configuredMax=Math.max(1,Number(process.env.VIBE2_MAX_CONCURRENT_GAME_TASKS||256));
          const baselineTarget=Math.max(1,Number(process.env.VIBE2_GAME_PRIMARY_BASELINE_TARGET||20));
          const adaptiveMin=Math.max(1,Number(process.env.VIBE2_GAME_PRIMARY_ADAPTIVE_MIN||30));
          const controlTarget=Math.max(adaptiveMin,Number(control.currentMax||baselineTarget));
          const effectiveMax=configuredMax;
          const freeWorkerSlots=Math.max(0,effectiveMax-activeGame);
          const waveReady=activeGame===0?'YES':'NO';
          const gameRefillReady=freeWorkerSlots>0?'YES':'NO';
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            'wave_ready='+waveReady+'\n'+
            'game_refill_ready='+gameRefillReady+'\n'+
            'free_worker_slots='+freeWorkerSlots+'\n'+
            'active_worker_reservations='+activeGame+'\n'+
            'game_primary_queued='+gameQueued+'\n'+
            'learning_idle_queued='+learningQueued+'\n'+
            'recovery_fast_queued='+recoveryQueued+'\n');
          console.log('VIBE2_24H_ACTIVE_GAME_WORKER_RESERVATIONS='+activeGame);
          console.log('VIBE2_24H_GAME_PRIMARY_ACTIVE_MAX='+effectiveMax);
          console.log('VIBE2_24H_ADAPTIVE_RECOMMENDED_MAX='+controlTarget);
          console.log('VIBE2_24H_GAME_PRIMARY_RESERVATION_LIMIT_SOURCE=CONFIGURED_EXTERNAL_PROVIDER_BOUNDARY');
          console.log('VIBE2_24H_FREE_GAME_WORKER_SLOTS='+freeWorkerSlots);
          console.log('VIBE2_24H_GAME_REFILL_READY='+gameRefillReady);
          console.log('VIBE2_24H_GAME_PRIMARY_QUEUED='+gameQueued);
          console.log('VIBE2_24H_LEARNING_IDLE_QUEUED='+learningQueued);
          console.log('VIBE2_24H_RECOVERY_FAST_QUEUED='+recoveryQueued);
          console.log('VIBE2_24H_WAVE_READY='+waveReady);
          NODE
          echo "VIBE2_24H_CONTINUE=${continue_required:-NO}"

      - name: Recover reviewed winners stranded before release dispatch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-vibe2-release-recovery'
          git config user.email 'vibe2-release-recovery@users.noreply.github.com'

          node --check /tmp/vibe2-main/tools/vibe2-release-dispatch-recovery.mjs
          stamp="$(date +%s%3N)"
          pushed=0
          : > /tmp/vibe2-release-recovery-dispatch.tsv

          # Shared queue state is changed concurrently by independent candidate-release jobs.
          # Never rebase JSON state. Re-read the latest control branch and re-apply the
          # semantic queue command on every optimistic retry.
          for attempt in 1 2 3; do
            echo "VIBE2_RELEASE_RECOVERY_OPTIMISTIC_ATTEMPT=$attempt/3"
            git fetch origin vibe2-unreal-core --quiet
            git reset --hard origin/vibe2-unreal-core

            node /tmp/vibe2-main/tools/vibe2-release-dispatch-recovery.mjs \
              --queue=.vibe2/queue.json \
              --format=tsv > /tmp/vibe2-release-recovery-candidates.tsv

            : > /tmp/vibe2-release-recovery-current.tsv
            while IFS=$'\t' read -r task_id candidate_branch candidate_sha; do
              [ -n "$task_id" ] || continue
              [ -n "$candidate_branch" ] || continue
              [ -n "$candidate_sha" ] || continue
              remote_sha="$(git ls-remote origin "refs/heads/$candidate_branch" | awk 'NR==1 {print $1}')"
              if [ "$remote_sha" != "$candidate_sha" ]; then
                echo "VIBE2_RELEASE_RECOVERY_SHA_MISMATCH=$task_id:$candidate_branch:${remote_sha:-MISSING}:$candidate_sha"
                continue
              fi
              printf '%s\t%s\t%s\n' "$task_id" "$candidate_branch" "$candidate_sha" >> /tmp/vibe2-release-recovery-current.tsv
            done < /tmp/vibe2-release-recovery-candidates.tsv

            count="$(wc -l < /tmp/vibe2-release-recovery-current.tsv | tr -d ' ')"
            echo "VIBE2_RELEASE_RECOVERY_COUNT=${count:-0}"
            if [ "${count:-0}" -eq 0 ]; then
              pushed=1
              : > /tmp/vibe2-release-recovery-dispatch.tsv
              break
            fi

            while IFS=$'\t' read -r task_id candidate_branch candidate_sha; do
              node /tmp/vibe2-main/tools/vibe2-queue-control.mjs await \
                --id="$task_id" \
                --blocker=candidate-awaiting-qa-and-deployment \
                --evidence="release-dispatch-recovery-requested:$candidate_branch,release-dispatch-recovery-at:$stamp,release-dispatch-recovery-candidate-sha:$candidate_sha"
            done < /tmp/vibe2-release-recovery-current.tsv

            git add .vibe2/queue.json
            if git diff --cached --quiet; then
              cp /tmp/vibe2-release-recovery-current.tsv /tmp/vibe2-release-recovery-dispatch.tsv
              pushed=1
              break
            fi
            git commit -m 'vibe2: mark reviewed winner release recovery [skip ci]'
            if git push origin HEAD:vibe2-unreal-core; then
              cp /tmp/vibe2-release-recovery-current.tsv /tmp/vibe2-release-recovery-dispatch.tsv
              pushed=1
              break
            fi
            echo "VIBE2_RELEASE_RECOVERY_PUSH_RETRY=$attempt"
            sleep $((attempt * 2))
          done
          test "$pushed" = 1

          while IFS=$'\t' read -r task_id candidate_branch candidate_sha; do
            body="$(jq -nc --arg branch "$candidate_branch" '{ref:"main",inputs:{candidate_branch:$branch}}')"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/vibe2-candidate-release.yml/dispatches" \
              --data "$body"
            echo "VIBE2_RELEASE_RECOVERY_DISPATCHED=$task_id:$candidate_branch:$candidate_sha"
          done < /tmp/vibe2-release-recovery-dispatch.tsv

      - name: Upload generated machine handoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibe2-machine-handoff-plan-${{ github.run_id }}
          path: |
            /tmp/vibe2-handoff-before-plan.json
            /tmp/vibe2-handoff-before-attempt.json
            /tmp/vibe2-handoff-after-plan.json
            /tmp/vibe2-autoplan.log
            /tmp/vibe2-release-baseline-plan.log
            /tmp/vibe2-authorized-source-memory.log
            /tmp/vibe2-web-experience-ingest.log
            /tmp/vibe2-code-pattern-ingest.log
            /tmp/vibe2-learning-motor.log
            /tmp/vibe2-neural-expansion-readiness.json
            /tmp/vibe2-neural-expansion-readiness.log
            /tmp/vibe2-system-steward.log
            /tmp/vibe2-recovery-escalation.log
            /tmp/vibe2-recovery-dispatch.log
            /tmp/vibe2-recovery-learning.log
            /tmp/vibe2-recovery-code-distillation.log
            /tmp/vibe2-security-learning.log
            /tmp/vibe2-system-ai-learning.log
            /tmp/vibe2-recovery-learning-motor.log
            /tmp/vibe2-post-release-focus.log
            /tmp/vibe2-plan-summary.log
          if-no-files-found: warn
          retention-days: 7

  recovery_fast:
    needs: plan
    if: ${{ needs.plan.outputs.recovery_fast_queued != '0' }}
    uses: ./.github/workflows/vibe2-continuous-core.yml
    with:
      execution_lane: recovery-fast
      lane_max: '5'
    permissions:
      contents: write
      actions: write

  continuous:
    needs: plan
    if: ${{ needs.plan.outputs.game_refill_ready == 'YES' && needs.plan.outputs.game_primary_queued != '0' }}
    uses: ./.github/workflows/vibe2-continuous-core.yml
    with:
      execution_lane: game-primary
      lane_max: '256'
    permissions:
      contents: write
      actions: write

  learning_idle:
    needs: plan
    # Production preempts learning. Keep learning queued, but do not start auxiliary
    # learning workers while the live Actions queue is already under runner pressure.
    if: ${{ needs.plan.outputs.learning_idle_queued != '0' && needs.plan.outputs.runner_pressure != 'YES' }}
    uses: ./.github/workflows/vibe2-continuous-core.yml
    with:
      execution_lane: learning-idle
      lane_max: '4'
    permissions:
      contents: write
      actions: write

  game_study:
    needs: [plan, continuous, learning_idle]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.wave_ready == 'YES' && needs.plan.outputs.game_primary_queued == '0' && needs.plan.outputs.learning_idle_queued == '0' }}
    uses: hans1177/jaewoon-games/.github/workflows/vibe2-game-study-continuous.yml@vibe2-unreal-core
    permissions:
      contents: write
      actions: write

  refill:
    needs: [plan, recovery_fast, continuous, learning_idle, game_study]
    if: ${{ always() }}
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Dispatch next cycle unconditionally
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body='{"ref":"main"}'
          for attempt in 1 2 3; do
            code="$(curl --silent --show-error --output /tmp/vibe2-refill-body.txt --write-out '%{http_code}' \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/vibe2-24h-runner.yml/dispatches" \
              --data "$body" || true)"
            if [ "$code" = '204' ]; then
              echo 'VIBE2_24H_REFILL=DISPATCHED'
              exit 0
            fi
            echo "VIBE2_24H_REFILL_ATTEMPT=$attempt HTTP=$code"
            cat /tmp/vibe2-refill-body.txt || true
            sleep $((attempt * 2))
          done
          echo 'VIBE2_24H_REFILL=FAILED' >&2
          exit 1
