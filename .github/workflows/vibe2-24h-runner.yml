      - name: Propose verified distilled knowledge promotion to main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          promotion_branch='vibe2/learning-promotion/external-ai-auto'
          promote_root='/tmp/vibe2-verified-learning-main-promotion'
          base_store='/tmp/vibe2-verified-learning-main-base.json'
          rm -rf "$promote_root"
          git worktree prune
          git fetch origin main --quiet
          git worktree add --detach "$promote_root" origin/main >/dev/null

          test -s "$promote_root/.vibe2/external-ai-distilled-knowledge.json"
          test -s "$GITHUB_WORKSPACE/.vibe2/external-ai-distilled-knowledge.json"
          cp "$promote_root/.vibe2/external-ai-distilled-knowledge.json" "$base_store"

