            --merge-main-store=true \
            --base="$base_store" \
            --incoming="$GITHUB_WORKSPACE/.vibe2/external-ai-distilled-knowledge.json" \
            --output="$promote_root/.vibe2/external-ai-distilled-knowledge.json" | tee /tmp/vibe2-verified-learning-main-merge.log
          grep -q '^VIBE2_EXTERNAL_AI_MAIN_STORE_MERGE=PASS$' /tmp/vibe2-verified-learning-main-merge.log

          added="$(sed -n 's/^VIBE2_EXTERNAL_AI_MAIN_STORE_ADDED=//p' /tmp/vibe2-verified-learning-main-merge.log | tail -1)"
          if [ -z "$added" ] || [ "$added" -eq 0 ]; then
            echo 'VIBE2_VERIFIED_LEARNING_PROMOTION_PR=NOT_REQUIRED'
            echo 'PUBLIC_MAIN_WRITE=NO'
            exit 0
          fi

          node "$promote_root/tools/vibe2-external-ai-distillation.mjs" \
            --verify-main-promotion=true \
            --base="$base_store" \
            --candidate="$promote_root/.vibe2/external-ai-distilled-knowledge.json" \
            --changed-files='.vibe2/external-ai-distilled-knowledge.json' | tee /tmp/vibe2-verified-learning-main-gate.log
          grep -q '^VIBE2_EXTERNAL_AI_MAIN_PROMOTION=PASS$' /tmp/vibe2-verified-learning-main-gate.log

          git -C "$promote_root" config user.name 'jaewoon-vibe2-learning'
          git -C "$promote_root" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$promote_root" switch -c "$promotion_branch"
          git -C "$promote_root" add -- .vibe2/external-ai-distilled-knowledge.json
          git -C "$promote_root" commit -m 'learning: promote verified distilled knowledge'

          remote_ref="refs/heads/$promotion_branch"
          pushed='NO'
          for attempt in 1 2 3; do
            expected="$(git ls-remote --heads origin "$promotion_branch" | awk '{print $1}' | head -1)"
            if [ -n "$expected" ]; then
              if git -C "$promote_root" push --force-with-lease="$remote_ref:$expected" origin "HEAD:$remote_ref"; then
                pushed='YES'
                break
              fi
            else
              if git -C "$promote_root" push origin "HEAD:$remote_ref"; then
                pushed='YES'
                break
              fi
            fi
            echo "VIBE2_VERIFIED_LEARNING_PROMOTION_PUSH_RETRY=$attempt"
            sleep "$((attempt * 2))"
          done
          [ "$pushed" = 'YES' ]

          pr_url="$(gh pr list --repo "$repo" --state open --base main --head "$promotion_branch" --json url --jq '.[0].url // empty')"
          if [ -z "$pr_url" ]; then
            promotion_body="$(printf '%s\n' \
              'Automatic verified static learning promotion from the existing 24H learning chain.' \
              '' \
              '- trusted store: .vibe2/external-ai-distilled-knowledge.json' \
              '- all trusted distilled learning domains eligible' \
              '- existing canonical entries immutable' \
              '- independent verification evidence >= 2' \
              '- raw external output forbidden' \
              '- direct main write: NO' \
              '- automatic merge only after Company Evolution QA + Vibe2 Core QA succeed on the exact head' \
              '- model-weight training promotion remains FIXED_HOLDOUT_AB_THEN_CANARY' \
              '- central policy / finalDevelopmentLock mutation forbidden')"
            pr_url="$(gh pr create \
              --repo "$repo" \
              --base main \
              --head "$promotion_branch" \
              --title 'learning: auto promote verified distilled knowledge' \
              --body "$promotion_body")"
          fi

          echo "VIBE2_VERIFIED_LEARNING_PROMOTION_PR=$pr_url"
          echo "VIBE2_VERIFIED_LEARNING_PROMOTION_ADDED=$added"
          echo 'PUBLIC_MAIN_WRITE=NO'

      - name: Read queue continuation state
        id: queue_state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node /tmp/vibe2-main/tools/vibe2-queue-control.mjs summary | tee /tmp/vibe2-plan-summary.log

          # 완료됐거나 최신 core에 의해 대체된 asset reservation run은 실제 worker capacity를 점유하지 않는다.
          # queue mutation은 기존 continuous-core recovery가 소유하고, 여기서는 refill gate가 교착되지 않도록
          # 정확한 reservation run 상태만 관찰해 reclaimable capacity를 계산한다.
          asset_reservation_runs="$(node <<'NODE'
          const fs=require('fs');
          const q=JSON.parse(fs.readFileSync('.vibe2/queue.json','utf8'));
          const ids=[...new Set((q.tasks||[])
            .filter(t=>
              String(t.status||'').toLowerCase()==='running'
              &&String(t.reservationRunId||'').trim()
              &&!String(t.blocker||'').trim()
              &&(t.assetProductionLane===true||(t.evidence||[]).map(String).includes('asset-production-parallel:v1'))
            )
            .map(t=>String(t.reservationRunId||'').trim())
            .filter(id=>/^\d+$/.test(id))
          )];
          process.stdout.write(ids.join(','));
          NODE
          )"
          asset_reclaimable_runs=''
          asset_reservation_probe_failures=0
          rm -f /tmp/vibe2-24h-asset-reservation-*.reclaim /tmp/vibe2-24h-asset-reservation-*.error
          if [ -n "$asset_reservation_runs" ]; then
            latest_main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha' 2>/dev/null || true)"
            latest_core_blob=''
            if [ -n "$latest_main_sha" ]; then
              latest_core_blob="$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/vibe2-continuous-core.yml?ref=$latest_main_sha" --jq '.sha' 2>/dev/null || true)"
            fi
            IFS=',' read -r -a asset_reservation_run_ids <<< "$asset_reservation_runs"
            probe_pids=()
            for reservation_run_id in "${asset_reservation_run_ids[@]}"; do
              [ -n "$reservation_run_id" ] || continue
              (
                run_file="/tmp/vibe2-24h-asset-reservation-${reservation_run_id}.json"
                jobs_file="/tmp/vibe2-24h-asset-reservation-${reservation_run_id}.jobs.json"
                if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${reservation_run_id}" > "$run_file" 2>/dev/null; then
                  reservation_run_status="$(jq -r '.status // ""' "$run_file")"
                  reservation_run_head="$(jq -r '.head_sha // ""' "$run_file")"
                  if [ "$reservation_run_status" = 'completed' ]; then
                    printf '%s\n' "$reservation_run_id" > "/tmp/vibe2-24h-asset-reservation-${reservation_run_id}.reclaim"
                  elif [[ "$reservation_run_status" =~ ^(queued|pending|requested|in_progress)$ ]] \
                    && [ -n "$latest_main_sha" ] \
                    && [ -n "$reservation_run_head" ] \
                    && [ "$reservation_run_head" != "$latest_main_sha" ] \
                    && [ -n "$latest_core_blob" ]; then
                    old_core_blob="$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/vibe2-continuous-core.yml?ref=${reservation_run_head}" --jq '.sha' 2>/dev/null || true)"
                    if [ -n "$old_core_blob" ] && [ "$old_core_blob" != "$latest_core_blob" ] \
                      && gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${reservation_run_id}/jobs?per_page=100" > "$jobs_file" 2>/dev/null; then
                      queued_workers="$(jq '[.jobs[] | select((.status=="queued" or .status=="pending" or .status=="requested") and (.name | test("(^| / )worker \\(")))] | length' "$jobs_file")"
                      active_workers="$(jq '[.jobs[] | select(.status=="in_progress" and (.name | test("(^| / )worker \\(")))] | length' "$jobs_file")"
                      if [ "${queued_workers:-0}" -gt 0 ] && [ "${active_workers:-0}" -eq 0 ]; then
                        printf '%s\n' "$reservation_run_id" > "/tmp/vibe2-24h-asset-reservation-${reservation_run_id}.reclaim"
                      fi
                    fi
                  fi
                else
                  : > "/tmp/vibe2-24h-asset-reservation-${reservation_run_id}.error"
                fi
              ) &
              probe_pids+=("$!")
              if [ "${#probe_pids[@]}" -ge 8 ]; then
                for probe_pid in "${probe_pids[@]}"; do wait "$probe_pid" || true; done
                probe_pids=()
              fi
            done
            for probe_pid in "${probe_pids[@]}"; do wait "$probe_pid" || true; done
            mapfile -t reclaimable_ids < <(
              while IFS= read -r probe_file; do cat "$probe_file"; done < <(
                find /tmp -maxdepth 1 -type f -name 'vibe2-24h-asset-reservation-*.reclaim' | sort
              )
            )
            asset_reservation_probe_failures="$(find /tmp -maxdepth 1 -type f -name 'vibe2-24h-asset-reservation-*.error' | wc -l | tr -d ' ')"
            if [ "${#reclaimable_ids[@]}" -gt 0 ]; then
              asset_reclaimable_runs="$(IFS=,; echo "${reclaimable_ids[*]}")"
            fi
          fi
          if [ "$asset_reservation_probe_failures" -eq 0 ]; then
            echo 'VIBE2_24H_ASSET_RESERVATION_PROBE=PASS'
          else
            echo "VIBE2_24H_ASSET_RESERVATION_PROBE=PARTIAL_FAIL_OPEN:${asset_reservation_probe_failures}"
          fi
          echo "VIBE2_24H_ASSET_RESERVATION_RUNS=${asset_reservation_runs:-NONE}"
          echo "VIBE2_24H_ASSET_RECLAIMABLE_RUNS=${asset_reclaimable_runs:-NONE}"
          export VIBE2_24H_ASSET_RECLAIMABLE_RUNS="$asset_reclaimable_runs"

          runner_pressure='YES'
          pressure_count='unknown'
          job_pressure_count='unknown'
          pressure_threshold="${VIBE2_RUNNER_PRESSURE_DISPATCH_THRESHOLD:-4}"
          job_pressure_threshold="${VIBE2_RUNNER_JOB_PRESSURE_THRESHOLD:-8}"
          if curl --fail-with-body --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --output /tmp/vibe2-24h-actions-runs.json; then
            if pressure_count="$(node <<'NODE'
          const fs=require('fs');
          const payload=JSON.parse(fs.readFileSync('/tmp/vibe2-24h-actions-runs.json','utf8'));
          const currentRun=String(process.env.GITHUB_RUN_ID||'');
          const pressureStates=new Set(['queued','pending','requested']);
          const count=(payload.workflow_runs||[]).filter(row=>
            String(row.id||'')!==currentRun &&
            pressureStates.has(String(row.status||'').toLowerCase())
          ).length;
          process.stdout.write(String(count));
          NODE
            )" && [[ "$pressure_count" =~ ^[0-9]+$ ]]; then
              mapfile -t vibe_pressure_runs < <(node <<'NODE'
          const fs=require('fs');
          const payload=JSON.parse(fs.readFileSync('/tmp/vibe2-24h-actions-runs.json','utf8'));
          const current=String(process.env.GITHUB_RUN_ID||'');
          const active=new Set(['queued','pending','requested','in_progress']);
          const paths=new Set(['.github/workflows/vibe2-24h-runner.yml','.github/workflows/vibe2-continuous-core.yml']);
          for(const row of payload.workflow_runs||[]){
            if(String(row.id||'')===current)continue;
            if(!active.has(String(row.status||'').toLowerCase()))continue;
            if(!paths.has(String(row.path||'')))continue;
            console.log(String(row.id));
          }
          NODE
              )
              job_pressure_count=0
              for run_id in "${vibe_pressure_runs[@]:0:12}"; do
                queued_in_run="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" \
                  --jq '[.jobs[] | select(.status=="queued" or .status=="pending" or .status=="requested")] | length' 2>/dev/null \
                  | awk '{s+=$1}END{print s+0}' || echo 0)"
                [[ "$queued_in_run" =~ ^[0-9]+$ ]] || queued_in_run=0
                job_pressure_count=$((job_pressure_count+queued_in_run))
              done
              if [ "$job_pressure_count" -eq 0 ]; then
                runner_pressure='NO'
                echo 'VIBE2_24H_RUNNER_ZERO_JOB_PRESSURE_BYPASS=YES'
              elif [ "$pressure_count" -lt "$pressure_threshold" ] && [ "$job_pressure_count" -lt "$job_pressure_threshold" ]; then
                runner_pressure='NO'
                echo 'VIBE2_24H_RUNNER_ZERO_JOB_PRESSURE_BYPASS=NO'
              else
                echo 'VIBE2_24H_RUNNER_ZERO_JOB_PRESSURE_BYPASS=NO'
              fi
              echo 'VIBE2_24H_RUNNER_PRESSURE_OBSERVATION=PASS'
            else
              pressure_count='unknown'
              job_pressure_count='unknown'
              echo 'VIBE2_24H_RUNNER_PRESSURE_OBSERVATION=FAIL_DEFER_LEARNING'
            fi
          else
            echo 'VIBE2_24H_RUNNER_PRESSURE_OBSERVATION=FAIL_DEFER_LEARNING'
          fi
          echo "runner_pressure=$runner_pressure" >> "$GITHUB_OUTPUT"
          echo "VIBE2_24H_RUNNER_QUEUE_PRESSURE=${pressure_count}"
          echo "VIBE2_24H_RUNNER_JOB_QUEUE_PRESSURE=${job_pressure_count}"
          echo "VIBE2_24H_RUNNER_PRESSURE_THRESHOLD=${pressure_threshold}"
          echo "VIBE2_24H_RUNNER_JOB_PRESSURE_THRESHOLD=${job_pressure_threshold}"
          if [ "$runner_pressure" = 'YES' ]; then
            echo 'VIBE2_24H_LEARNING_IDLE_DEFERRED=RUNNER_PRESSURE'
          else
            echo 'VIBE2_24H_LEARNING_IDLE_DEFERRED=NO'
          fi
          continue_required="$(sed -n 's/^VIBE2_QUEUE_CONTINUE=//p' /tmp/vibe2-plan-summary.log | tail -n1)"
          case "${continue_required:-NO}" in
            YES|NO) ;;
            *) echo "invalid VIBE2_QUEUE_CONTINUE=${continue_required:-}" >&2; exit 1 ;;
          esac
          echo "continue_required=${continue_required:-NO}" >> "$GITHUB_OUTPUT"
          node <<'NODE'
          const fs=require('fs');
          const q=JSON.parse(fs.readFileSync('.vibe2/queue.json','utf8'));
          const lane=t=>{
            const status=String(t.status||'').toLowerCase(),blocker=String(t.blocker||''),dep=String(t.department||'').toLowerCase(),type=String(t.type||'implementation').toLowerCase(),ev=(t.evidence||[]).map(String);
            if(status==='running'&&/candidate-awaiting-qa-and-deployment|awaiting.*qa|qa.*awaiting|slot-released.*fan-in/i.test(blocker))return'RELEASE_WAIT';
            if(ev.includes('learning-practice-only')||dep==='learning'||(dep==='development'&&type==='research'))return'LEARNING_IDLE';
            if(t.assetProductionLane===true||ev.includes('asset-production-parallel:v1'))return'ASSET_DEVELOPMENT';
            if(dep==='development'&&type==='implementation')return'GAME_PRIMARY';
            if(t.systemSteward===true)return'RECOVERY_FAST';
            return'CONTROL_FAST';
          };
          const tasks=q.tasks||[];
          const activeGame=tasks.filter(t=>String(t.status||'').toLowerCase()==='running'&&String(t.reservationRunId||'').trim()&&!String(t.blocker||'').trim()&&lane(t)==='GAME_PRIMARY').length;
          const gameQueued=tasks.filter(t=>String(t.status||'').toLowerCase()==='queued'&&lane(t)==='GAME_PRIMARY').length;
          const reclaimableAssetRuns=new Set(String(process.env.VIBE2_24H_ASSET_RECLAIMABLE_RUNS||'').split(',').map(v=>v.trim()).filter(Boolean));
          const activeAssetRows=tasks.filter(t=>String(t.status||'').toLowerCase()==='running'&&String(t.reservationRunId||'').trim()&&!String(t.blocker||'').trim()&&lane(t)==='ASSET_DEVELOPMENT');
          const reclaimableAssetReservations=activeAssetRows.filter(t=>reclaimableAssetRuns.has(String(t.reservationRunId||'').trim())).length;
          const activeAsset=activeAssetRows.filter(t=>!reclaimableAssetRuns.has(String(t.reservationRunId||'').trim())).length;
          const assetQueued=tasks.filter(t=>String(t.status||'').toLowerCase()==='queued'&&lane(t)==='ASSET_DEVELOPMENT').length;
          const learningQueued=tasks.filter(t=>String(t.status||'').toLowerCase()==='queued'&&lane(t)==='LEARNING_IDLE').length;
          const recoveryQueued=tasks.filter(t=>String(t.status||'').toLowerCase()==='queued'&&lane(t)==='RECOVERY_FAST').length;
          const control=JSON.parse(fs.readFileSync('.vibe2/parallelism-control.json','utf8'));
          const configuredMax=Math.max(1,Number(process.env.VIBE2_GAME_PRIMARY_FIXED_REPEAT_SLOTS||64));
          const baselineTarget=Math.max(1,Number(process.env.VIBE2_GAME_PRIMARY_BASELINE_TARGET||64));
          const adaptiveMin=Math.max(1,Number(process.env.VIBE2_GAME_PRIMARY_ADAPTIVE_MIN||64));
          const controlTarget=Math.max(adaptiveMin,Number(control.currentMax||baselineTarget));
          const effectiveMax=configuredMax;
          const freeWorkerSlots=Math.max(0,effectiveMax-activeGame);
          const waveReady=activeGame===0?'YES':'NO';
          const gameRefillReady=freeWorkerSlots>0?'YES':'NO';
          const assetMax=Math.max(1,Number(process.env.VIBE2_ASSET_DEVELOPMENT_MAX||63));
          const assetRefillReady=Math.max(0,assetMax-activeAsset)>0?'YES':'NO';
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            'wave_ready='+waveReady+'\n'+
            'game_refill_ready='+gameRefillReady+'\n'+
            'free_worker_slots='+freeWorkerSlots+'\n'+
            'active_worker_reservations='+activeGame+'\n'+
            'game_primary_queued='+gameQueued+'\n'+
            'asset_development_queued='+assetQueued+'\n'+
            'asset_development_active='+activeAsset+'\n'+
            'asset_development_refill_ready='+assetRefillReady+'\n'+
            'learning_idle_queued='+learningQueued+'\n'+
            'recovery_fast_queued='+recoveryQueued+'\n');
          console.log('VIBE2_24H_ACTIVE_GAME_WORKER_RESERVATIONS='+activeGame);
          console.log('VIBE2_24H_GAME_PRIMARY_ACTIVE_MAX='+effectiveMax);
          console.log('VIBE2_24H_ADAPTIVE_RECOMMENDED_MAX='+controlTarget);
          console.log('VIBE2_24H_GAME_PRIMARY_RESERVATION_LIMIT_SOURCE=FIXED_REPEAT_DEVELOPMENT_128');
          console.log('VIBE2_GAME_PRIMARY_FIXED_REPEAT_SLOTS=64');
          console.log('VIBE2_GAME_PRIMARY_REFILL_TARGET=64');
          console.log('VIBE2_24H_FREE_GAME_WORKER_SLOTS='+freeWorkerSlots);
          console.log('VIBE2_24H_GAME_REFILL_READY='+gameRefillReady);
          console.log('VIBE2_24H_GAME_PRIMARY_QUEUED='+gameQueued);
          console.log('VIBE2_ASSET_DEVELOPMENT_QUEUED='+assetQueued);
          console.log('VIBE2_ASSET_DEVELOPMENT_ACTIVE='+activeAsset);
          console.log('VIBE2_ASSET_DEVELOPMENT_RECLAIMABLE_RESERVATIONS='+reclaimableAssetReservations);
          console.log('VIBE2_ASSET_DEVELOPMENT_REFILL_READY='+assetRefillReady);
          console.log('VIBE2_24H_LEARNING_IDLE_QUEUED='+learningQueued);
          console.log('VIBE2_24H_RECOVERY_FAST_QUEUED='+recoveryQueued);
          console.log('VIBE2_24H_WAVE_READY='+waveReady);
          NODE
          echo "VIBE2_24H_CONTINUE=${continue_required:-NO}"

      - name: Recover reviewed winners stranded before release dispatch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VIBE2_RUNNER_PRESSURE: ${{ steps.queue_state.outputs.runner_pressure }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${VIBE2_RUNNER_PRESSURE:-YES}" = 'YES' ]; then
            echo 'VIBE2_RELEASE_RECOVERY_RUNNER_PRESSURE=OBSERVED_EXTERNAL_QUEUE_OWNS_CAPACITY'
          else
            echo 'VIBE2_RELEASE_RECOVERY_RUNNER_PRESSURE=LOW'
          fi
          git config user.name 'jaewoon-vibe2-release-recovery'
          git config user.email 'vibe2-release-recovery@users.noreply.github.com'

          node --check /tmp/vibe2-main/tools/vibe2-release-dispatch-recovery.mjs
          stamp="$(date +%s%3N)"
          pushed=0
          : > /tmp/vibe2-release-recovery-dispatch.tsv

          # Shared queue state is changed concurrently by independent candidate-release jobs.
          # Never rebase JSON state. Re-read the latest control branch and re-apply the
          # semantic queue command on every optimistic retry.
          for attempt in 1 2 3; do
            echo "VIBE2_RELEASE_RECOVERY_OPTIMISTIC_ATTEMPT=$attempt/3"
            git fetch origin vibe2-unreal-core --quiet
            git reset --hard origin/vibe2-unreal-core

            node /tmp/vibe2-main/tools/vibe2-release-dispatch-recovery.mjs \
              --queue=.vibe2/queue.json \
              --format=tsv > /tmp/vibe2-release-recovery-candidates.tsv

            : > /tmp/vibe2-release-recovery-current.tsv
            while IFS=$'\t' read -r task_id candidate_branch candidate_sha evidence_only; do
              [ -n "$task_id" ] || continue
              [ -n "$candidate_branch" ] || continue
              [ -n "$candidate_sha" ] || continue
              remote_sha="$(git ls-remote origin "refs/heads/$candidate_branch" | awk 'NR==1 {print $1}')"
              if [ "$remote_sha" != "$candidate_sha" ]; then
                echo "VIBE2_RELEASE_RECOVERY_SHA_MISMATCH=$task_id:$candidate_branch:${remote_sha:-MISSING}:$candidate_sha"
                continue
              fi
              printf '%s\t%s\t%s\t%s\n' "$task_id" "$candidate_branch" "$candidate_sha" "$evidence_only" >> /tmp/vibe2-release-recovery-current.tsv
            done < /tmp/vibe2-release-recovery-candidates.tsv

            count="$(wc -l < /tmp/vibe2-release-recovery-current.tsv | tr -d ' ')"
            recovery_batch_max="${VIBE2_RELEASE_RECOVERY_BATCH_MAX:-256}"
            if [ "${count:-0}" -gt "$recovery_batch_max" ]; then
              head -n "$recovery_batch_max" /tmp/vibe2-release-recovery-current.tsv > /tmp/vibe2-release-recovery-limited.tsv
              mv /tmp/vibe2-release-recovery-limited.tsv /tmp/vibe2-release-recovery-current.tsv
              count="$(wc -l < /tmp/vibe2-release-recovery-current.tsv | tr -d ' ')"
              echo "VIBE2_RELEASE_RECOVERY_BATCH_LIMIT=$recovery_batch_max"
            fi
            echo "VIBE2_RELEASE_RECOVERY_COUNT=${count:-0}"
            if [ "${count:-0}" -eq 0 ]; then
              pushed=1
              : > /tmp/vibe2-release-recovery-dispatch.tsv
              break
            fi

            while IFS=$'\t' read -r task_id candidate_branch candidate_sha evidence_only; do
              blocker=candidate-awaiting-qa-and-deployment
              if [ "$evidence_only" = true ]; then blocker=candidate-awaiting-runtime-evidence; fi
              node /tmp/vibe2-main/tools/vibe2-queue-control.mjs await \
                --id="$task_id" \
                --blocker="$blocker" \
                --evidence="release-dispatch-recovery-requested:$candidate_branch,release-dispatch-recovery-at:$stamp,release-dispatch-recovery-candidate-sha:$candidate_sha"
            done < /tmp/vibe2-release-recovery-current.tsv

            git add .vibe2/queue.json
            if git diff --cached --quiet; then
              cp /tmp/vibe2-release-recovery-current.tsv /tmp/vibe2-release-recovery-dispatch.tsv
              pushed=1
              break
            fi
            git commit -m 'vibe2: mark reviewed winner release recovery [skip ci]'
            if git push origin HEAD:vibe2-unreal-core; then
              cp /tmp/vibe2-release-recovery-current.tsv /tmp/vibe2-release-recovery-dispatch.tsv
              pushed=1
              break
            fi
            echo "VIBE2_RELEASE_RECOVERY_PUSH_RETRY=$attempt"
            sleep $((attempt * 2))
          done
          test "$pushed" = 1

          while IFS=$'\t' read -r task_id candidate_branch candidate_sha evidence_only; do
            body="$(jq -nc --arg branch "$candidate_branch" --arg evidence_only "$evidence_only" '{ref:"main",inputs:{candidate_branch:$branch,evidence_only:$evidence_only}}')"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/vibe2-candidate-release.yml/dispatches" \
              --data "$body"
            echo "VIBE2_RELEASE_RECOVERY_DISPATCHED=$task_id:$candidate_branch:$candidate_sha"
          done < /tmp/vibe2-release-recovery-dispatch.tsv

      - name: Upload generated machine handoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibe2-machine-handoff-plan-${{ github.run_id }}
          path: |
            /tmp/vibe2-handoff-before-plan.json
            /tmp/vibe2-handoff-before-attempt.json
            /tmp/vibe2-handoff-after-plan.json
            /tmp/vibe2-autoplan.log
            /tmp/vibe2-release-baseline-plan.log
            /tmp/vibe2-authorized-source-memory.log
            /tmp/vibe2-web-experience-ingest.log
            /tmp/vibe2-code-pattern-ingest.log
            /tmp/vibe2-learning-motor.log
            /tmp/vibe2-neural-expansion-readiness.json
            /tmp/vibe2-neural-expansion-readiness.log
            /tmp/vibe2-system-steward.log
            /tmp/vibe2-recovery-escalation.log
            /tmp/vibe2-recovery-dispatch.log
            /tmp/vibe2-recovery-learning.log
            /tmp/vibe2-recovery-code-distillation.log
            /tmp/vibe2-security-learning.log
            /tmp/vibe2-system-ai-learning.log
            /tmp/vibe2-recovery-learning-motor.log
            /tmp/vibe2-post-release-focus.log
            /tmp/vibe2-plan-summary.log
          if-no-files-found: warn
          retention-days: 7

  recovery_fast:
    needs: plan
    if: ${{ needs.plan.outputs.recovery_fast_queued != '0' }}
    uses: ./.github/workflows/vibe2-continuous-core.yml
    with:
      execution_lane: recovery-fast
      lane_max: '5'
    permissions:
      contents: write
      actions: write

  continuous:
    needs: plan
    if: ${{ needs.plan.outputs.game_refill_ready == 'YES' && needs.plan.outputs.game_primary_queued != '0' }}
    uses: ./.github/workflows/vibe2-continuous-core.yml
    with:
      execution_lane: game-primary
      lane_max: '64'
    permissions:
      contents: write
      actions: write

  asset_development:
    needs: plan
    # Asset capacity is policy-independent from GAME_PRIMARY; provider scarcity may queue this job but may not suppress the lane.
    if: ${{ needs.plan.outputs.asset_development_refill_ready == 'YES' && (needs.plan.outputs.asset_development_queued != '0' || needs.plan.outputs.asset_development_active != '0') }}
    uses: ./.github/workflows/vibe2-continuous-core.yml
    with:
      execution_lane: asset-development
      lane_max: '63'
    permissions:
      contents: write
      actions: write

  learning_idle:
    needs: plan
    # Reserve exactly one learning worker only while the GitHub runner queue is below the pressure threshold.
    if: ${{ needs.plan.outputs.runner_pressure != 'YES' && needs.plan.outputs.learning_idle_queued != '0' }}
    uses: ./.github/workflows/vibe2-continuous-core.yml
    with:
      execution_lane: learning-idle
      lane_max: '1'
    permissions:
      contents: write
      actions: write

  game_study:
    needs: [plan, continuous, asset_development, learning_idle]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.runner_pressure != 'YES' && needs.plan.outputs.wave_ready == 'YES' && needs.plan.outputs.game_primary_queued == '0' && needs.plan.outputs.asset_development_queued == '0' && needs.plan.outputs.asset_development_active == '0' && needs.plan.outputs.learning_idle_queued == '0' }}
    uses: hans1177/jaewoon-games/.github/workflows/vibe2-game-study-continuous.yml@vibe2-unreal-core
    permissions:
      contents: write
      actions: write

  refill:
    needs: [plan, recovery_fast, continuous, asset_development, learning_idle, game_study]
    if: ${{ always() }}
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Dispatch next cycle while external runner queue owns physical backpressure
        env:
          GH_TOKEN: ${{ github.token }}
          CONTINUE_REQUIRED: ${{ needs.plan.outputs.continue_required }}
        run: |
          set -euo pipefail
          if [ "${CONTINUE_REQUIRED:-NO}" != 'YES' ]; then
            echo 'VIBE2_24H_REFILL=SKIPPED_NO_CONTINUE_REQUIRED'
            exit 0
          fi
          active_scheduler='0'
          if curl --fail-with-body --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/vibe2-24h-runner.yml/runs?per_page=100" \
            --output /tmp/vibe2-24h-active-runs.json; then
            active_scheduler="$(node <<'NODE'
          const fs=require('fs');
          const payload=JSON.parse(fs.readFileSync('/tmp/vibe2-24h-active-runs.json','utf8'));
          const current=String(process.env.GITHUB_RUN_ID||'');
          const active=new Set(['queued','pending','requested','in_progress']);
          const count=(payload.workflow_runs||[]).filter(row=>
            String(row.id||'')!==current &&
            active.has(String(row.status||'').toLowerCase())
          ).length;
          process.stdout.write(String(count));
          NODE
            )"
          else
            echo 'VIBE2_24H_REFILL_ACTIVE_SCHEDULER_OBSERVATION=UNAVAILABLE_FAIL_OPEN'
          fi

          if [[ "$active_scheduler" =~ ^[0-9]+$ ]] && [ "$active_scheduler" -gt 0 ]; then
            echo "VIBE2_24H_REFILL=SKIPPED_EXISTING_SCHEDULER:$active_scheduler"
            exit 0
          fi

          echo 'VIBE2_24H_REFILL_RUNNER_PRESSURE_POLICY=EXTERNAL_QUEUE_OWNS_PHYSICAL_BACKPRESSURE'
          body='{"ref":"main"}'
          for attempt in 1 2 3; do
            code="$(curl --silent --show-error --output /tmp/vibe2-refill-body.txt --write-out '%{http_code}' \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/vibe2-24h-runner.yml/dispatches" \
              --data "$body" || true)"
            if [ "$code" = '204' ]; then
              echo 'VIBE2_24H_REFILL=DISPATCHED'
              exit 0
            fi
            echo "VIBE2_24H_REFILL_ATTEMPT=$attempt HTTP=$code"
            cat /tmp/vibe2-refill-body.txt || true
            sleep $((attempt * 2))
          done
          echo 'VIBE2_24H_REFILL=FAILED' >&2
          exit 1
