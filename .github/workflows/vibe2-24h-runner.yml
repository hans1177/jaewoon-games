name: Vibe2 24H Runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vibe2-24h-runner.yml'
      - '.github/workflows/vibe2-continuous-core.yml'
      - 'VIBE2.md'
      - 'vibe2-runtime.json'
      - 'game-catalog.json'
      - 'company-status.json'
      - 'design/**/design-development-baseline.json'
      - 'design/**/release-production-request.json'
      - 'web-games/**'
      - 'unity-games/**'
      - 'roblox-games/**'
      - 'unreal-games/**'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  VIBE2_PRIORITY_POLICY: owner-release-development
  VIBE2_AUTO_DEPLOY_VERIFIED_ONLY: 'true'
  VIBE2_MAX_CONCURRENT_GAME_TASKS: '20'
  VIBE2_WORK_ORDER_OUTPUT_CONTRACT: explicit-cli-first

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: vibe2-control-state-vibe2-unreal-core
      cancel-in-progress: false
    steps:
      - name: Checkout Vibe2 control branch
        uses: actions/checkout@v4
        with:
          ref: vibe2-unreal-core
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify machine state and planner tools
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/vibe2-release-baseline-queue.mjs
          node --check tools/vibe2-auto-planner.mjs
          node --check tools/vibe2-handoff.mjs
          node tools/vibe2-handoff.mjs --check --output=/tmp/vibe2-handoff-before-plan.json >/tmp/vibe2-handoff-before-plan.log
          echo "VIBE2_PRIORITY_POLICY=$VIBE2_PRIORITY_POLICY"
          echo "VIBE2_AUTO_DEPLOY_VERIFIED_ONLY=$VIBE2_AUTO_DEPLOY_VERIFIED_ONLY"
          echo "VIBE2_MAX_CONCURRENT_GAME_TASKS=$VIBE2_MAX_CONCURRENT_GAME_TASKS"
          echo "VIBE2_WORK_ORDER_OUTPUT_CONTRACT=$VIBE2_WORK_ORDER_OUTPUT_CONTRACT"

      - name: Plan from latest main and persist control queue
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-vibe2-planner'
          git config user.email 'vibe2-planner@users.noreply.github.com'

          for attempt in 1 2 3; do
            echo "VIBE2_AUTOPLAN_ATTEMPT=$attempt/3"
            git fetch origin main vibe2-unreal-core --quiet
            git reset --hard origin/vibe2-unreal-core
            rm -rf /tmp/vibe2-main
            git worktree prune
            git worktree add --detach /tmp/vibe2-main origin/main >/dev/null

            node tools/vibe2-handoff.mjs --check --output=/tmp/vibe2-handoff-before-attempt.json >/tmp/vibe2-handoff-before-attempt.log

            node tools/vibe2-release-baseline-queue.mjs \
              --catalog=/tmp/vibe2-main/game-catalog.json \
              --queue=.vibe2/queue.json \
              --root=/tmp/vibe2-main | tee /tmp/vibe2-release-baseline-plan.log

            node tools/vibe2-auto-planner.mjs \
              --runtime=vibe2-runtime.json \
              --status=/tmp/vibe2-main/company-status.json \
              --catalog=/tmp/vibe2-main/game-catalog.json \
              --queue=.vibe2/queue.json \
              --control=.vibe2/parallelism-control.json \
              --experience=.vibe2/experience.json \
              --root=/tmp/vibe2-main \
              --max="$VIBE2_MAX_CONCURRENT_GAME_TASKS" | tee /tmp/vibe2-autoplan.log

            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createVibeContinuousQueue } from './assets/vibe-continuous-queue.js';
          const file = '.vibe2/queue.json';
          const beforeText = fs.readFileSync(file, 'utf8');
          const before = JSON.parse(beforeText);
          const maxConcurrentTasks = Math.max(1, Math.min(20, Number(process.env.VIBE2_MAX_CONCURRENT_GAME_TASKS) || 20));
          const normalized = createVibeContinuousQueue({ ...before, maxConcurrentTasks });
          const afterText = `${JSON.stringify(normalized, null, 2)}\n`;
          if (beforeText !== afterText) {
            fs.writeFileSync(file, afterText, 'utf8');
            console.log('VIBE2_QUEUE_SCHEMA_MIGRATED=YES');
          } else {
            console.log('VIBE2_QUEUE_SCHEMA_MIGRATED=NO');
          }
          NODE

            node tools/vibe2-handoff.mjs --check --output=/tmp/vibe2-handoff-after-plan.json >/tmp/vibe2-handoff-after-plan.log

            git add .vibe2/queue.json
            if git diff --cached --quiet; then
              echo 'VIBE2_AUTOPLAN_WRITE=NO'
              exit 0
            fi

            if grep -q '^VIBE2_RELEASE_BASELINE_GAP_PLAN=YES$' /tmp/vibe2-release-baseline-plan.log; then
              commit_message='vibe2: queue release baseline implementation gap [skip ci]'
            elif grep -q '^VIBE2_AUTO_PLAN=YES$' /tmp/vibe2-autoplan.log; then
              commit_message='vibe2: plan next machine-state work [skip ci]'
            else
              commit_message='vibe2: persist twenty-slot adaptive parallel queue state [skip ci]'
            fi

            git commit -m "$commit_message"
            if git pull --rebase origin vibe2-unreal-core && git push origin HEAD:vibe2-unreal-core; then
              echo 'VIBE2_AUTOPLAN_WRITE=YES'
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done

          echo 'VIBE2_AUTOPLAN_PUSH=FAILED' >&2
          exit 1

      - name: Upload generated machine handoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibe2-machine-handoff-plan-${{ github.run_id }}
          path: |
            /tmp/vibe2-handoff-before-plan.json
            /tmp/vibe2-handoff-before-attempt.json
            /tmp/vibe2-handoff-after-plan.json
            /tmp/vibe2-autoplan.log
            /tmp/vibe2-release-baseline-plan.log
          if-no-files-found: warn
          retention-days: 7

  continuous:
    needs: plan
    uses: ./.github/workflows/vibe2-continuous-core.yml
    permissions:
      contents: write
      actions: write

  game_study:
    needs: [plan, continuous]
    if: ${{ always() && needs.plan.result == 'success' }}
    uses: hans1177/jaewoon-games/.github/workflows/vibe2-game-study-continuous.yml@vibe2-unreal-core
    permissions:
      contents: write
      actions: write
