          const normalized = createVibeContinuousQueue({ ...before, maxConcurrentTasks });
          const afterText = `${JSON.stringify(normalized)}\n`;
          if (beforeText !== afterText) {
            fs.writeFileSync(file, afterText, 'utf8');
            console.log('VIBE2_QUEUE_SCHEMA_MIGRATED=YES');
          } else {
            console.log('VIBE2_QUEUE_SCHEMA_MIGRATED=NO');
