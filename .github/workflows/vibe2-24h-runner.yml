name: Vibe2 24H Runner
# restart-marker: 2026-09-17-workflow-dispatch-refill

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vibe2-24h-runner.yml'
      - '.github/workflows/vibe2-continuous-core.yml'
      - '.github/workflows/vibe2-roblox-candidate-result.yml'
      - '.github/workflows/vibe2-roblox-candidate-runtime.yml'
      - 'tools/vibe2-roblox-skyline-runtime-smoke.mjs'
      - 'tools/vibe2-authorized-source-memory.mjs'
      - 'tools/vibe2-web-experience-ingest.mjs'
      - 'tools/company-system-ai-external-learning-feed.mjs'
      - 'company-learning/assistant-vibe-coauthoring-log.json'
      - 'tools/vibe2-external-ai-distillation.mjs'
      - 'tools/vibe2-auto-planner.mjs'
      - 'tools/company-build-up-directive.mjs'
      - 'tools/company-growth-marketing-planner.mjs'
      - 'tools/company-growth-marketing-qa.mjs'
      - 'tools/company-growth-marketing-decision.mjs'
      - 'tools/company-department-portfolio-control.mjs'
      - '.github/workflows/company-growth-marketing-runtime.yml'
      - 'tools/vibe2-continuous-runner.mjs'
      - 'tools/vibe2-asset-production-plan.mjs'
      - 'assets/vibe-studio-asset-universe.js'
      # Re-enter the existing planner when platform-neutral native master/source or
      # company asset registrations change; do not create a new authoring queue.
      - 'assets/shared/**'
      - 'company-asset-library.json'
      - 'tools/vibe2-source-worker.mjs'
      - 'tools/vibe2-queue-control.mjs'
      - 'tools/vibe2-capability-distillation.mjs'
      - 'tools/vibe3-roblox-distillation.mjs'
      - 'tools/vibe3-roblox-learning-context.mjs'
      - 'tools/vibe2-incremental-qa.mjs'
      - 'tools/company-development-web-gameplay-validation.mjs'
      - 'tools/company-web-contract-adapter.mjs'
      - 'qa/company-web-contract-adapter.test.mjs'
      - 'tools/vibe2-learning-motor.mjs'
      - 'tools/vibe2-practice-distillation.mjs'
      - 'tools/vibe2-design-intelligence.mjs'
      - 'company-learning/vibe2-learning-motor.json'
      - 'company-learning/vibe3-task-playbooks.json'
      - 'tools/vibe2-release-dispatch-recovery.mjs'
      - 'tools/company-recovery-queue.mjs'
      - 'tools/company-recovery-escalation.mjs'
      - 'tools/company-tester-debug-intake.mjs'
      - 'tools/company-platform-suitability.mjs'
      - 'tools/company-platform-exposure-control.mjs'
      - 'tools/company-recovery-dispatch.mjs'
      - 'tools/company-recovery-learning.mjs'
      - 'tools/company-recovery-code-distillation.mjs'
      - 'tools/company-security-learning.mjs'
      - 'tools/company-system-ai-learning.mjs'
      - 'tools/vibe2-post-release-focus.mjs'
      - 'tools/vibe2-system-steward.mjs'
      - 'tools/vibe2-neural-expansion-readiness.mjs'
      - 'assets/vibe-continuous-queue.js'
      - 'company-learning/platform-release-roadmap.json'
      - 'tools/company-shared-context.mjs'
      - 'company-learning/roblox-sustained-maintenance.json'
      - 'company-learning/authorized-source/block-blast/authorized-learning-summary.json'
      - 'vibe2-runtime.json'
      - 'game-catalog.json'
      - 'company-status.json'
      - 'design/**/design-development-baseline.json'
      - 'design/**/release-production-request.json'
      - 'web-games/**'
      - 'unity-games/**'
      - 'roblox-games/**'
      - 'unreal-games/**'
  workflow_run:
    workflows:
      - Vibe2 Distillation Sample Ingest
    types: [completed]
  schedule:
    # Canonical five-minute safety-net. Event-driven refill remains the primary continuation path.
    - cron: '*/5 * * * *'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: write

env:
  VIBE2_PRIORITY_POLICY: owner-release-development
  VIBE2_AUTO_DEPLOY_VERIFIED_ONLY: 'true'
  VIBE2_MAX_CONCURRENT_GAME_TASKS: '256'
  VIBE2_GAME_PRIMARY_BASELINE_TARGET: '128'
  VIBE2_GAME_PRIMARY_ADAPTIVE_MIN: '128'
  VIBE2_GAME_PRIMARY_FIXED_REPEAT_SLOTS: '128'
  VIBE2_EXTERNAL_MATRIX_BATCH_MAX: '256'
  VIBE2_WORK_ORDER_OUTPUT_CONTRACT: explicit-cli-first
  VIBE2_24H_LEARNING_PROVIDER: 'GEMINI_API'
  VIBE2_24H_GEMINI_ALLOWED: 'true'
  VIBE2_LEARNING_ALWAYS_ON: 'true'
  VIBE2_LEARNING_CONCURRENT_WITH_PRODUCTION: 'true'
  VIBE2_LEARNING_LANE_MAX: '4'
  VIBE2_ASSET_DEVELOPMENT_MAX: '63'
  VIBE2_ASSET_PRIORITY_BURST_MAX: '8'
  VIBE2_RUNNER_PRESSURE_DISPATCH_THRESHOLD: '4'
  VIBE2_RUNNER_JOB_PRESSURE_THRESHOLD: '8'
  VIBE2_RELEASE_RECOVERY_BATCH_MAX: '256'

# 24H cycles are run-scoped. Shared queue writes already use optimistic fetch/reset/replan/push
# retries and Work Lock protects exact responsible-file conflicts. Do not serialize unrelated
# development behind an older scheduler run. Actual Roblox Studio execution remains the only
# intentional heavy shared-host serialization.
concurrency:
  group: vibe2-24h-cycle-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04-arm
    # 제어 plan만 coalesce한다. 이미 실행 중인 게임/에셋 워커는 건드리지 않고,
    # 동일 제어 wake가 몰릴 때 활성 1개 + 최신 대기 1개만 유지한다.
    concurrency:
      group: vibe2-24h-plan-control-v1
      cancel-in-progress: false
    timeout-minutes: 15
    outputs:
      continue_required: ${{ steps.queue_state.outputs.continue_required }}
      wave_ready: ${{ steps.queue_state.outputs.wave_ready }}
      game_refill_ready: ${{ steps.queue_state.outputs.game_refill_ready }}
      free_worker_slots: ${{ steps.queue_state.outputs.free_worker_slots }}
      active_worker_reservations: ${{ steps.queue_state.outputs.active_worker_reservations }}
      game_primary_queued: ${{ steps.queue_state.outputs.game_primary_queued }}
      asset_development_queued: ${{ steps.queue_state.outputs.asset_development_queued }}
      asset_development_active: ${{ steps.queue_state.outputs.asset_development_active }}
      asset_development_refill_ready: ${{ steps.queue_state.outputs.asset_development_refill_ready }}
      learning_idle_queued: ${{ steps.queue_state.outputs.learning_idle_queued }}
      recovery_fast_queued: ${{ steps.queue_state.outputs.recovery_fast_queued }}
      runner_pressure: ${{ steps.queue_state.outputs.runner_pressure }}
      autonomy_admitted: ${{ steps.auto_admission.outputs.admitted }}
    steps:
      - name: Checkout Vibe2 control branch
        uses: actions/checkout@v4
        with:
          ref: vibe2-unreal-core
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify machine state and planner tools
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs=require('fs'); for (const file of ['.vibe2/queue.json','.vibe2/parallelism-control.json']) JSON.parse(fs.readFileSync(file,'utf8')); console.log('VIBE2_CONTROL_STATE_JSON=VALID')"
          echo "VIBE2_PRIORITY_POLICY=$VIBE2_PRIORITY_POLICY"
          echo "VIBE2_AUTO_DEPLOY_VERIFIED_ONLY=$VIBE2_AUTO_DEPLOY_VERIFIED_ONLY"
          echo "VIBE2_MAX_CONCURRENT_GAME_TASKS=$VIBE2_MAX_CONCURRENT_GAME_TASKS"
          echo 'VIBE2_PARALLELISM_POLICY=FIXED_GAME_PRIMARY_REPEAT_DEVELOPMENT_128'
          echo "VIBE2_EXTERNAL_MATRIX_BATCH_MAX=$VIBE2_EXTERNAL_MATRIX_BATCH_MAX"
          echo "VIBE2_WORK_ORDER_OUTPUT_CONTRACT=$VIBE2_WORK_ORDER_OUTPUT_CONTRACT"
          test "$VIBE2_24H_LEARNING_PROVIDER" = "GEMINI_API"
          test "$VIBE2_24H_GEMINI_ALLOWED" = "true"
          echo "VIBE2_24H_LEARNING_PROVIDER=$VIBE2_24H_LEARNING_PROVIDER"
          echo "VIBE2_24H_GEMINI_LEARNING=EXTERNAL_ONLY"

      - name: Gate new autonomous waves behind owner publication and real queue backlog
        id: auto_admission
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Only scheduled autonomous work is paused. Direct owner game requests
          # use their separate pwa-command-bridge; existing worker results and
          # security/release QA continue independently.
          queued_count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=queued&per_page=1" --jq '.total_count' 2>/dev/null || echo unknown)"
          pending_count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=pending&per_page=1" --jq '.total_count' 2>/dev/null || echo unknown)"
          owner_pending="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/owner-fast-pages-publish.yml/runs?per_page=20" \
            --jq '[.workflow_runs[] | select(.status == "queued" or .status == "pending" or .status == "requested" or .status == "waiting" or .status == "in_progress")] | length' 2>/dev/null || echo unknown)"
          admitted=true
          # [배정/확장 분리] 대기 중인 기존 게임 작업은 빈 슬롯을 채우되
          # 새 자율 기획·팬아웃만 대기량에 따라 보류한다.
          dispatch_admitted=true
          reason=AUTONOMOUS_ADMITTED
          threshold=48
          if [[ "$owner_pending" =~ ^[0-9]+$ ]] && [ "$owner_pending" -gt 0 ]; then
            admitted=false
            dispatch_admitted=false
            reason=OWNER_PUBLICATION_PRIORITY
          elif [[ "$queued_count" =~ ^[0-9]+$ && "$pending_count" =~ ^[0-9]+$ ]] && \
               [ "$((queued_count+pending_count))" -ge "$threshold" ]; then
            admitted=false
            reason=AUTONOMOUS_WORKFLOW_BACKLOG
          fi
          echo "admitted=$admitted" >> "$GITHUB_OUTPUT"
          echo "dispatch_admitted=$dispatch_admitted" >> "$GITHUB_OUTPUT"
          echo "VIBE2_EXISTING_QUEUE_DISPATCH_ADMITTED=$dispatch_admitted"
          echo "VIBE2_AUTO_WAVE_ADMISSION=$admitted"
          echo "VIBE2_AUTO_WAVE_ADMISSION_REASON=$reason"
          echo "VIBE2_AUTO_WAVE_QUEUED=$queued_count"
          echo "VIBE2_AUTO_WAVE_PENDING=$pending_count"
          echo "VIBE2_OWNER_PAGES_PENDING=$owner_pending"
          echo 'VIBE2_OWNER_DIRECT_DISPATCH=UNCHANGED'
          echo 'VIBE2_VERIFIED_QA_RECOVERY=UNCHANGED'

      - name: Dispatch queued GAME_PRIMARY and independent asset work before full planning
        if: steps.auto_admission.outputs.dispatch_admitted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # GAME_PRIMARY 128슬롯은 논리 용량이며 실제 러너 부족은 GitHub Actions 큐가 흡수한다.
          # 러너 압력은 관찰하되 GAME_PRIMARY/asset production dispatch 자체를 억제하지 않는다.
          pressure_threshold="${VIBE2_RUNNER_PRESSURE_DISPATCH_THRESHOLD:-4}"
          preplan_pressure='unknown'
          if curl --fail-with-body --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --output /tmp/vibe2-preplan-actions-runs.json; then
            preplan_pressure="$(node <<'NODE'
          const fs=require('fs');
          const payload=JSON.parse(fs.readFileSync('/tmp/vibe2-preplan-actions-runs.json','utf8'));
          const current=String(process.env.GITHUB_RUN_ID||'');
          const pressured=new Set(['queued','pending','requested']);
          const count=(payload.workflow_runs||[]).filter(row=>
            String(row.id||'')!==current &&
            pressured.has(String(row.status||'').toLowerCase())
          ).length;
          process.stdout.write(String(count));
          NODE
            )"
          fi
          if [[ "$preplan_pressure" =~ ^[0-9]+$ ]] && [ "$preplan_pressure" -ge "$pressure_threshold" ]; then
            echo "VIBE2_PREPLAN_PRODUCTION_PRESSURE_OBSERVATION=QUEUE_ALLOWED:$preplan_pressure:$pressure_threshold"
          elif [[ "$preplan_pressure" =~ ^[0-9]+$ ]]; then
            echo "VIBE2_PREPLAN_PRODUCTION_PRESSURE_OBSERVATION=BELOW_THRESHOLD:$preplan_pressure:$pressure_threshold"
          else
            echo 'VIBE2_PREPLAN_PRODUCTION_PRESSURE_OBSERVATION=UNAVAILABLE_FAIL_OPEN'
          fi

          state="$(node <<'NODE'
          const fs=require('fs');
          const q=JSON.parse(fs.readFileSync('.vibe2/queue.json','utf8'));
          const lane=t=>{
            const status=String(t.status||'').toLowerCase();
            const blocker=String(t.blocker||'');
            const dep=String(t.department||'').toLowerCase();
            const type=String(t.type||'implementation').toLowerCase();
            const ev=(t.evidence||[]).map(String);
            if(status==='running'&&/candidate-awaiting-qa-and-deployment|awaiting.*qa|qa.*awaiting|slot-released.*fan-in/i.test(blocker))return'RELEASE_WAIT';
            if(ev.includes('learning-practice-only')||dep==='learning'||(dep==='development'&&type==='research'))return'LEARNING_IDLE';
            if(t.assetProductionLane===true||ev.includes('asset-production-parallel:v1'))return'ASSET_DEVELOPMENT';
            if(dep==='development'&&type==='implementation')return'GAME_PRIMARY';
            if(t.systemSteward===true)return'RECOVERY_FAST';
            return'CONTROL_FAST';
          };
          const tasks=q.tasks||[];
          const activeGame=tasks.filter(t=>String(t.status||'').toLowerCase()==='running'&&String(t.reservationRunId||'').trim()&&!String(t.blocker||'').trim()&&lane(t)==='GAME_PRIMARY').length;
          const queuedGame=tasks.filter(t=>String(t.status||'').toLowerCase()==='queued'&&lane(t)==='GAME_PRIMARY').length;
          const activeAsset=tasks.filter(t=>String(t.status||'').toLowerCase()==='running'&&String(t.reservationRunId||'').trim()&&!String(t.blocker||'').trim()&&lane(t)==='ASSET_DEVELOPMENT').length;
          const queuedAsset=tasks.filter(t=>String(t.status||'').toLowerCase()==='queued'&&lane(t)==='ASSET_DEVELOPMENT').length;
          const gameMax=Math.max(1,Number(process.env.VIBE2_GAME_PRIMARY_FIXED_REPEAT_SLOTS||128));
          const assetMax=Math.max(1,Number(process.env.VIBE2_ASSET_DEVELOPMENT_MAX||63));
          process.stdout.write([
            queuedGame,activeGame,Math.max(0,gameMax-activeGame),
            queuedAsset,activeAsset,Math.max(0,assetMax-activeAsset)
          ].join('\t'));
          NODE
          )"
          IFS=$'\t' read -r game_queued game_active game_free asset_queued asset_active asset_free <<< "$state"
          echo "VIBE2_PREPLAN_GAME_PRIMARY_QUEUED=$game_queued"
          echo "VIBE2_PREPLAN_GAME_PRIMARY_ACTIVE=$game_active"
          echo "VIBE2_PREPLAN_GAME_PRIMARY_FREE_SLOTS=$game_free"
          echo "VIBE2_PREPLAN_ASSET_DEVELOPMENT_QUEUED=$asset_queued"
          echo "VIBE2_PREPLAN_ASSET_DEVELOPMENT_ACTIVE=$asset_active"
          echo "VIBE2_PREPLAN_ASSET_DEVELOPMENT_FREE_SLOTS=$asset_free"

          current_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha' 2>/dev/null || true)"
          queued_asset_wake=''
          if [[ "$preplan_pressure" =~ ^[0-9]+$ && "$current_main_sha" =~ ^[a-f0-9]{40}$ ]]; then
            queued_asset_wake="$(CURRENT_MAIN_SHA="$current_main_sha" node <<'NODE'
          const fs=require('fs');
          const snapshot=JSON.parse(fs.readFileSync('/tmp/vibe2-preplan-actions-runs.json','utf8'));
          const queued=new Set(['queued','pending','requested']);
          const matches=(snapshot.workflow_runs||[]).filter(run=>
            run.path==='.github/workflows/vibe2-continuous-core.yml'
            &&run.event==='workflow_dispatch'
            &&run.head_sha===process.env.CURRENT_MAIN_SHA
            &&run.display_title==='Vibe2 Continuous Core · workflow_dispatch · asset-development');
          const wake=matches.find(run=>queued.has(String(run.status||'').toLowerCase()))
            ||matches.find(run=>String(run.status||'').toLowerCase()==='in_progress');
          process.stdout.write(wake?String(wake.id)+(wake.status==='in_progress'?':reserve-check':''):'');
          NODE
            )"
          fi
          # Reuse a running workflow only while its reserve job still owns the pending reservation.
          # Once reserve finishes, free slots must be refillable by independent waves.
          if [[ "$queued_asset_wake" =~ ^([0-9]+):reserve-check$ ]]; then
            wake_id="${BASH_REMATCH[1]}"
            reserve_status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${wake_id}/jobs?per_page=100" --jq '.jobs[] | select(.name=="reserve") | .status' 2>/dev/null || true)"
            if [[ "$reserve_status" == 'queued' || "$reserve_status" == 'in_progress' ]]; then
              queued_asset_wake="$wake_id"
            else
              queued_asset_wake=''
            fi
          fi
          if [[ "$queued_asset_wake" =~ ^[0-9]+$ ]]; then
            echo "VIBE2_PREPLAN_ASSET_DEVELOPMENT_DISPATCH=COALESCED_QUEUED_EXACT_MAIN:$queued_asset_wake:$current_main_sha"
          elif [ "$asset_queued" -gt 0 ] && [ "$asset_free" -gt 0 ]; then
            burst_max="${VIBE2_ASSET_PRIORITY_BURST_MAX:-8}"
            asset_burst="$asset_free"
            if [ "$asset_burst" -gt "$asset_queued" ]; then asset_burst="$asset_queued"; fi
            if [ "$asset_burst" -gt "$burst_max" ]; then asset_burst="$burst_max"; fi
            body="$(jq -nc --arg lane_max "$asset_burst" '{ref:"main",inputs:{execution_lane:"asset-development",lane_max:$lane_max}}')"
            if curl --fail-with-body --silent --show-error \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/vibe2-continuous-core.yml/dispatches" \
              --data "$body"; then
              echo 'VIBE2_PREPLAN_PRIORITY_LANE=ASSET_DEVELOPMENT'
              echo "VIBE2_PREPLAN_ASSET_DEVELOPMENT_DISPATCH=DISPATCHED:$asset_burst"
            else
              echo 'VIBE2_PREPLAN_ASSET_DEVELOPMENT_DISPATCH=FAILED_FALLBACK_POST_PLAN' >&2
            fi
          fi

          if [ "$game_queued" -eq 0 ] || [ "$game_free" -eq 0 ]; then
            echo 'VIBE2_PREPLAN_GAME_PRIMARY_DISPATCH=NOT_NEEDED'
            exit 0
          fi

          # 메인 · 대기 중이거나 예약 단계가 실행 중인 정확히 같은 main의 GAME_PRIMARY 호출만 재사용한다.
          # main push 예약도 기존 동일 SHA 게임 제작 wake이므로 별도 dispatch를 만들지 않는다.
          # 다른 SHA·다른 레인은 독립 처리하고, 조회 실패 때는 기존 호출을 진행한다.
          if [[ "$preplan_pressure" =~ ^[0-9]+$ && "$current_main_sha" =~ ^[a-f0-9]{40}$ ]]; then
            queued_exact_wake="$(CURRENT_MAIN_SHA="$current_main_sha" node <<'NODE'
          const fs=require('fs');
          const snapshot=JSON.parse(fs.readFileSync('/tmp/vibe2-preplan-actions-runs.json','utf8'));
          const queued=new Set(['queued','pending','requested']);
          const matches=(snapshot.workflow_runs||[]).filter(run=>
            run.path==='.github/workflows/vibe2-continuous-core.yml'
            &&(run.event==='workflow_dispatch'||(run.event==='push'&&run.head_branch==='main'))
            &&run.head_sha===process.env.CURRENT_MAIN_SHA
            &&(run.display_title==='Vibe2 Continuous Core · workflow_dispatch · game-primary'
              ||run.display_title==='Vibe2 Continuous Core · push · game-primary'));
          const wake=matches.find(run=>queued.has(String(run.status||'').toLowerCase()))
            ||matches.find(run=>String(run.status||'').toLowerCase()==='in_progress');
          process.stdout.write(wake?String(wake.id)+(wake.status==='in_progress'?':reserve-check':''):'');
          NODE
            )"
            # A running worker/fan-in is not an active reservation: allow fresh free-slot refills.
            if [[ "$queued_exact_wake" =~ ^([0-9]+):reserve-check$ ]]; then
              wake_id="${BASH_REMATCH[1]}"
              reserve_status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${wake_id}/jobs?per_page=100" --jq '.jobs[] | select(.name=="reserve") | .status' 2>/dev/null || true)"
              if [[ "$reserve_status" == 'queued' || "$reserve_status" == 'in_progress' ]]; then
                queued_exact_wake="$wake_id"
              else
                queued_exact_wake=''
              fi
            fi
            if [[ "$queued_exact_wake" =~ ^[0-9]+$ ]]; then
              echo "VIBE2_PREPLAN_GAME_PRIMARY_DISPATCH=COALESCED_QUEUED_EXACT_MAIN:$queued_exact_wake:$current_main_sha"
              exit 0
            fi
          fi

          body='{"ref":"main","inputs":{"execution_lane":"game-primary","lane_max":"128"}}'
          if curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/vibe2-continuous-core.yml/dispatches" \
            --data "$body"; then
            echo 'VIBE2_PREPLAN_PRIORITY_LANE=GAME_PRIMARY'
            echo 'VIBE2_PREPLAN_GAME_PRIMARY_DISPATCH=DISPATCHED'
          else
            echo 'VIBE2_PREPLAN_GAME_PRIMARY_DISPATCH=FAILED_FALLBACK_POST_PLAN' >&2
          fi

      - name: Plan from latest main and persist control queue
        env:
          GH_TOKEN: ${{ github.token }}
          VIBE2_AUTONOMY_ADMITTED: ${{ steps.auto_admission.outputs.admitted }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-vibe2-planner'
          git config user.email 'vibe2-planner@users.noreply.github.com'

          attempt=0
          # One latest-main source snapshot per plan ingress; every optimistic retry
          # replays decisions against the newest canonical control queue, NOT a
          # different moving main source. New main pushes launch their own planner.
          # Preserve the exact-SHA QA evidence and all existing fail-closed gates.
          plan_main_sha=''
          validated_main_sha=''
          echo 'VIBE2_AUTOPLAN_OPTIMISTIC_RETRY_POLICY=UNTIL_JOB_TIMEOUT'
          while true; do
            attempt=$((attempt+1))
            echo "VIBE2_AUTOPLAN_ATTEMPT=$attempt"
            git fetch origin '+refs/heads/main:refs/remotes/origin/main' '+refs/heads/vibe2-unreal-core:refs/remotes/origin/vibe2-unreal-core' '+refs/heads/company-runtime:refs/remotes/origin/company-runtime' --depth=2 --no-tags --quiet
            git fetch origin '+refs/heads/vibe2-learning-runtime:refs/remotes/origin/vibe2-learning-runtime' --depth=2 --no-tags --quiet || true
            if [ -z "$plan_main_sha" ]; then
              plan_main_sha="$(git rev-parse origin/main)"
              test "$plan_main_sha" != ''
              echo "VIBE2_AUTOPLAN_MAIN_SNAPSHOT=PINNED_AT_INGRESS:$plan_main_sha"
            else
              # Never reuse old machine authority after a protected contract change.
              # A new main-triggered cycle must verify the changed policy/code.
              if ! git diff --quiet "$plan_main_sha" origin/main -- \
                  company-learning/platform-release-roadmap.json \
                  company-learning/company-log-map.json \
                  company-learning/company-architecture-map.json \
                  company-learning/security-immune-system.json \
                  tools/company-constitution-enforcer.mjs \
                  tools/main-write-guard.mjs \
                  tools/vibe2-auto-planner.mjs \
                  tools/vibe2-queue-control.mjs \
                  .github/workflows/vibe2-24h-runner.yml; then
                echo 'VIBE2_AUTOPLAN_PINNED_AUTHORITY_DRIFT=BLOCKED_NEW_MAIN_CYCLE_REQUIRED' >&2
                exit 1
              fi
              echo "VIBE2_AUTOPLAN_MAIN_SNAPSHOT=REUSED_ON_CONTROL_RETRY:$plan_main_sha"
            fi
            git reset --hard origin/vibe2-unreal-core
            rm -rf /tmp/vibe2-main
            git worktree prune
            git worktree add --detach /tmp/vibe2-main "$plan_main_sha" >/dev/null
            # Verify current main policy exists; do not leak the production policy env into isolated QA fixtures.
            test -s /tmp/vibe2-main/company-learning/platform-release-roadmap.json
            # [설계 원본] 버전 고정된 company-runtime 아트북을 기존 main 작업 공간에 읽기 전용으로 적재한다.
            runtime_design_sha="$(git rev-parse origin/company-runtime)"
            test "$(git -C /tmp/vibe2-main ls-tree -d --name-only "$runtime_design_sha" -- artbook-submissions)" = 'artbook-submissions'
            git -C /tmp/vibe2-main restore --source="$runtime_design_sha" --worktree -- artbook-submissions
            test -d /tmp/vibe2-main/artbook-submissions
            echo "VIBE2_SEED_ARTBOOK_SOURCE=company-runtime:$runtime_design_sha"
            node /tmp/vibe2-main/tools/vibe2-queue-control.mjs storage-unpack
            control_root="$PWD"
            main_sha="$(git -C /tmp/vibe2-main rev-parse HEAD)"
            core_qa_reuse=0
            if curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${main_sha}&per_page=100" \
              --output /tmp/vibe2-24h-core-qa-runs.json; then
              # A successful workflow with its scoped test job SKIPPED is not
              # a full regression PASS. Reuse only an actual successful main test job.
              core_qa_run_id="$(MAIN_SHA="$main_sha" node <<'NODE'
          const fs=require('fs');
          const payload=JSON.parse(fs.readFileSync('/tmp/vibe2-24h-core-qa-runs.json','utf8'));
          const sha=String(process.env.MAIN_SHA||'');
          const pass=(payload.workflow_runs||[]).find(row=>
            String(row.name||'')==='Vibe2 Core QA' &&
            String(row.head_branch||'')==='main' &&
            ['push','workflow_dispatch'].includes(String(row.event||'')) &&
            String(row.head_sha||'')===sha &&
            String(row.status||'')==='completed' &&
            String(row.conclusion||'')==='success'
          );
          process.stdout.write(String(pass?.id||0));
          NODE
              )"
              if [[ "$core_qa_run_id" =~ ^[1-9][0-9]*$ ]]; then
                core_qa_test_conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${core_qa_run_id}/jobs?per_page=100" \
                  --jq '[.jobs[] | select(.name=="test")] | if length == 1 then .[0].conclusion else "missing" end' 2>/dev/null || true)"
                if [ "$core_qa_test_conclusion" = success ]; then core_qa_reuse=1; fi
              fi
              echo "VIBE2_24H_CORE_QA_SOURCE_RUN=$core_qa_run_id"
              echo "VIBE2_24H_CORE_QA_TEST_JOB=${core_qa_test_conclusion:-MISSING_OR_UNVERIFIED}"
              echo "VIBE2_24H_CORE_QA_REUSE_OBSERVATION=PASS:$core_qa_reuse:$main_sha"
            else
              core_qa_reuse=0
              echo "VIBE2_24H_CORE_QA_REUSE_OBSERVATION=FAIL_RUN_TARGETED_QA:$main_sha"
            fi
            export VIBE2_24H_CORE_QA_REUSE="$core_qa_reuse"
            if [ -n "$validated_main_sha" ] && [ "$validated_main_sha" = "$main_sha" ]; then
              export VIBE2_24H_SAME_MAIN_QA_REUSE=1
              echo "VIBE2_24H_SAME_MAIN_QA_REUSE=VERIFIED_SAME_MAIN_SHA:$main_sha"
            else
              export VIBE2_24H_SAME_MAIN_QA_REUSE=0
              echo "VIBE2_24H_SAME_MAIN_QA_REUSE=REVALIDATE_NEW_MAIN_SHA:$main_sha"
            fi

            (
              cd /tmp/vibe2-main
              # Four minimal reference documents: integrity only, not constitution authority.
              node --test qa/company-four-docs-fingerprint.test.mjs qa/company-shared-context-retained.test.mjs
              node tools/company-shared-context.mjs --output=/tmp/vibe2-shared-context-before-plan.json
              node --check tools/company-constitution-enforcer.mjs
              node tools/company-constitution-enforcer.mjs --phase=24h-planner | tee /tmp/vibe2-constitution-enforcer.log
              node --check tools/vibe2-learning-motor.mjs
              node --check tools/vibe2-auto-planner.mjs
              node --check tools/company-build-up-directive.mjs
              node --check qa/company-build-up-experience-quality.test.mjs
              node --check tools/vibe2-continuous-runner.mjs
              node --check tools/vibe2-asset-production-plan.mjs
              node --check assets/vibe-studio-asset-universe.js
              node --check tools/vibe2-source-worker.mjs
              node --check tools/vibe2-capability-distillation.mjs
              node --check tools/vibe3-roblox-distillation.mjs
              node --check tools/vibe3-roblox-learning-context.mjs
              node --check tools/vibe2-incremental-qa.mjs
              node --check tools/company-development-web-gameplay-validation.mjs
              node --check tools/vibe2-practice-distillation.mjs
              node --check tools/vibe2-design-intelligence.mjs
              node --check tools/vibe2-verified-design-handoff.mjs
              if [ "${VIBE2_24H_SAME_MAIN_QA_REUSE:-0}" = '1' ]; then
                echo "VIBE2_24H_DUPLICATE_CORE_TESTS=REUSED_THIS_RUN_EXACT_MAIN_SHA:$main_sha"
              elif [ "${VIBE2_24H_CORE_QA_REUSE:-0}" = '1' ]; then
                echo 'VIBE2_24H_DUPLICATE_CORE_TESTS=SKIPPED_EXACT_SHA_CORE_QA_PASS'
              else
                node --test qa/vibe2-learning-motor.test.mjs
                node --test qa/vibe2-auto-planner.test.mjs
                node --test qa/company-build-up-experience-quality.test.mjs
                # 원본 자산 품질 관련 검증은 계획 단계에서 직접 실행한다.
                # 전체 124개 native asset 통합 회귀는 독립 Vibe2 Core QA 및 출시 검증에서 그대로 실행한다.
                # 계획 단계의 범위 축소는 전체 회귀 PASS를 의미하지 않는다.
                echo 'VIBE2_24H_NATIVE_ASSET_PREFLIGHT=SCOPED_SOURCE_INTEGRITY_FULL_QA_REMAINS_IN_CORE'
                node --test --test-name-pattern='^(?:asset registry change detection|registry sync change detection|OBJ static validation|source GLB inventory|master GLB rejects|master GLB evidence|native actor binding|licensed FBX motion|all source GLBs|GLB production inspection|GLB world bounds|GLB scene geometry identity|native authoring reviews)' qa/vibe2-native-asset-production.test.mjs
                # [자동코딩] 실정책·수정범위·stale 차단만 예약 전 검증; 전체 모델 회귀는 독립 Core QA에서 유지.
                node --test --test-name-pattern='^real production Roblox auto-coding preflight' qa/vibe2-central-work-contract.test.mjs
                node --test qa/vibe2-capability-distillation.test.mjs
                node --test qa/vibe2-incremental-qa.test.mjs
                node --test qa/vibe2-practice-distillation.test.mjs
                node --test qa/vibe2-design-intelligence.test.mjs
                node --test qa/vibe2-verified-design-handoff.test.mjs
              fi
              # 24H 전용 QA는 처음 실행에 반드시 통과해야 하며, 같은 main SHA 낙관적 재시도만 재사용한다.
              if [ "${VIBE2_24H_SAME_MAIN_QA_REUSE:-0}" = '1' ]; then
                echo "VIBE2_24H_PLANNER_DEPENDENCY_TESTS=REUSED_THIS_RUN_EXACT_MAIN_SHA:$main_sha"
              else
                # 동일 main SHA의 Core QA가 전체 자산 검증에 성공한 경우에만 재검사 비용을 생략한다.
              # Core QA와 24H의 소스 SHA가 다르거나 실패했다면 반드시 원본 QA를 다시 수행한다.
              if [ "${VIBE2_24H_CORE_QA_REUSE:-0}" = '1' ]; then
                echo "VIBE2_24H_ASSET_QA=REUSED_VERIFIED_EXACT_SHA_CORE_QA:$main_sha"
              elif [ "${VIBE2_24H_SAME_MAIN_QA_REUSE:-0}" = '1' ]; then
                echo "VIBE2_24H_ASSET_QA=REUSED_VERIFIED_THIS_RUN_EXACT_SHA:$main_sha"
              else
                echo "VIBE2_24H_ASSET_QA=RUN_REQUIRED:$main_sha"
                node --test qa/vibe-studio-asset-universe.test.mjs 2>&1 | tee /tmp/vibe2-asset-library-qa.log
              fi
                node --test qa/vibe3-roblox-distillation.test.mjs
                node --test qa/company-web-contract-adapter.test.mjs
                node --test qa/company-development-web-runtime.test.mjs
              fi

              # Rule 4 final-stage neural expansion readiness is derived from direct targeted QA.
              node --check tools/vibe2-neural-expansion-readiness.mjs
              node tools/vibe2-neural-expansion-readiness.mjs \
                --root=. \
                --output=/tmp/vibe2-neural-expansion-readiness.json | tee /tmp/vibe2-neural-expansion-readiness.log
            )
            # 단일 작업의 전체 소스 QA 성공만 기록한다. control 상태/큐/인계 검증은 매 시도 새로 실행한다.
            validated_main_sha="$main_sha"

            # Repair canonical queue/parallelism state before fail-closed handoff validation.
            node --check /tmp/vibe2-main/tools/vibe2-system-steward.mjs
            if [ "${VIBE2_24H_SAME_MAIN_QA_REUSE:-0}" = '1' ]; then
              echo "VIBE2_24H_STEWARD_UNIT_QA=REUSED_THIS_RUN_EXACT_MAIN_SHA:$main_sha"
            else
              node --test /tmp/vibe2-main/qa/vibe2-system-steward.test.mjs
            fi
            node /tmp/vibe2-main/tools/vibe2-system-steward.mjs \
              --queue="$control_root/.vibe2/queue.json" \
              --control="$control_root/.vibe2/parallelism-control.json" \
              --neural-readiness=/tmp/vibe2-neural-expansion-readiness.json | tee /tmp/vibe2-system-steward.log

            node --check /tmp/vibe2-main/tools/vibe2-handoff.mjs
            node /tmp/vibe2-main/tools/vibe2-handoff.mjs --check \
              --runtime=/tmp/vibe2-main/vibe2-runtime.json \
              --queue="$control_root/.vibe2/queue.json" \
              --control="$control_root/.vibe2/parallelism-control.json" \
              --experience="$control_root/.vibe2/experience.json" \
              --project-lifecycle="$control_root/.vibe2/web-roblox-handoffs.json" \
              --output=/tmp/vibe2-handoff-before-plan.json >/tmp/vibe2-handoff-before-plan.log

            if git show origin/vibe2-learning-runtime:company-learning/vibe3-recombination-memory.json > /tmp/vibe2-recombination-memory.json 2>/dev/null; then
              echo 'VIBE2_RECOMBINATION_MEMORY=LOADED'
            else
              printf '%s\n' '{"version":1,"recipes":[]}' > /tmp/vibe2-recombination-memory.json
              echo 'VIBE2_RECOMBINATION_MEMORY=EMPTY'
            fi

            # 관찰 워커는 모델 실습을 기다리지 않는다. 기존 학습 슬롯이 최신 관찰을 소비한다.
            external_samples=/tmp/vibe2-external-practice-samples
            rm -rf "$external_samples"
            mkdir -p "$external_samples"
            if git cat-file -e origin/vibe2-learning-runtime:company-learning/training-samples 2>/dev/null; then
              while IFS= read -r external_sample; do
                [[ "$external_sample" =~ ^company-learning/training-samples/commercial-runtime-[a-z0-9._-]+\.json$ ]] || continue
                git show "origin/vibe2-learning-runtime:$external_sample" > "$external_samples/${external_sample##*/}"
              done < <(git ls-tree -r --name-only origin/vibe2-learning-runtime -- company-learning/training-samples)
            fi
            echo 'VIBE2_EXTERNAL_PRACTICE_ROUTE=CANONICAL_LEARNING_LANE'

            if git show origin/vibe2-learning-runtime:company-learning/vibe3-roblox-distillation-ledger.json > /tmp/vibe3-roblox-distillation-ledger.json 2>/dev/null; then
              echo 'VIBE3_ROBLOX_DISTILLATION_MEMORY=LOADED'
            else
              printf '%s\n' '{"version":1,"kind":"vibe3-roblox-distillation-ledger","records":[]}' > /tmp/vibe3-roblox-distillation-ledger.json
              echo 'VIBE3_ROBLOX_DISTILLATION_MEMORY=EMPTY'
            fi
            node /tmp/vibe2-main/tools/vibe3-roblox-distillation.mjs \
              --existing=/tmp/vibe3-roblox-distillation-ledger.json \
              --known-good=/tmp/vibe2-main/roblox-games/known-good-runtime-evidence.json \
              --root=/tmp/vibe2-main \
              --output=/tmp/vibe3-roblox-distillation-ledger.json | tee /tmp/vibe3-roblox-distillation.log

            git -C /tmp/vibe2-main fetch origin '+refs/heads/company-runtime:refs/remotes/origin/company-runtime' --depth=2 --no-tags --quiet
            runtime_design_sha="$(git -C /tmp/vibe2-main rev-parse origin/company-runtime)"
            git -C /tmp/vibe2-main show "$runtime_design_sha:development-queue.json" > /tmp/vibe2-company-runtime-queue.json
            # Refuse stale design authority; route the exact failed owner's game
            # back through its existing Game Seed -> Designer -> Promotion lane.
            # This does not synthesize an authored design or treat a failed gate as PASS.
            if (
              cd /tmp/vibe2-main
              COMPANY_VERIFIED_POLICY_PATH="$PWD/company-learning/platform-release-roadmap.json" \
              COMPANY_VERIFIED_DESIGN_POLICY_PATH="$PWD/company-learning/platform-release-roadmap.json" \
                node tools/vibe2-verified-design-handoff.mjs --runtime-sha="$runtime_design_sha"
            ) | tee /tmp/vibe2-verified-design-handoff.log; then
              grep -q '^VIBE2_VERIFIED_DESIGN_INTAKE=PASS
            for runtime_design_path in design game-seed-state.json; do
              if git -C /tmp/vibe2-main cat-file -e "origin/company-runtime:$runtime_design_path" 2>/dev/null; then
                git -C /tmp/vibe2-main checkout origin/company-runtime -- "$runtime_design_path"
                git -C /tmp/vibe2-main reset -- "$runtime_design_path" >/dev/null 2>&1 || true
              fi
            done
            echo 'VIBE2_RUNTIME_DESIGN_OVERLAY=company-runtime:design,game-seed-state.json'
            node --check /tmp/vibe2-main/tools/vibe2-post-release-focus.mjs
            node /tmp/vibe2-main/tools/vibe2-post-release-focus.mjs \
              --roadmap=/tmp/vibe2-main/company-learning/platform-release-roadmap.json \
              --company-runtime-queue=/tmp/vibe2-company-runtime-queue.json \
              --historical-registry=/tmp/vibe2-main/company-learning/roblox-sustained-maintenance.json \
              --queue=.vibe2/queue.json \
              --recombination=/tmp/vibe2-recombination-memory.json \
              --exposure=.vibe2/platform-exposure-state.json \
              --root=/tmp/vibe2-main | tee /tmp/vibe2-post-release-focus.log

            # Focused release caretakers are primary game work. Persist them before auxiliary planning
            # so unrelated marketing/learning failures cannot erase or delay the 24H game queue.
            if grep -q '^VIBE2_POST_RELEASE_FOCUS_ADDED=YES$' /tmp/vibe2-post-release-focus.log; then
              node /tmp/vibe2-main/tools/vibe2-queue-control.mjs storage-pack --queue=.vibe2/queue.json
              if [ -d ./.vibe2/queue ]; then git add -A -- .vibe2/queue; fi
              git add .vibe2/queue.json
              node /tmp/vibe2-main/tools/vibe2-queue-control.mjs storage-unpack --queue=.vibe2/queue.json
              if ! git diff --cached --quiet; then
                git commit -m 'vibe2: checkpoint focused release caretakers [skip ci]'
                git push origin HEAD:vibe2-unreal-core
                echo 'VIBE2_FOCUSED_CARETAKER_CHECKPOINT=PUSHED'
                git fetch origin '+refs/heads/vibe2-unreal-core:refs/remotes/origin/vibe2-unreal-core' --depth=2 --no-tags --quiet
              else
                echo 'VIBE2_FOCUSED_CARETAKER_CHECKPOINT=UNCHANGED'
              fi
            fi

            node /tmp/vibe2-main/tools/vibe2-authorized-source-memory.mjs \
              --summary=/tmp/vibe2-main/company-learning/authorized-source/block-blast/authorized-learning-summary.json \
              --experience=.vibe2/experience.json | tee /tmp/vibe2-authorized-source-memory.log

            test -s /tmp/vibe2-main/.vibe2/external-ai-distilled-knowledge.json
            test -f .vibe2/external-ai-distilled-knowledge.json || cp /tmp/vibe2-main/.vibe2/external-ai-distilled-knowledge.json .vibe2/external-ai-distilled-knowledge.json
            cp .vibe2/external-ai-distilled-knowledge.json /tmp/vibe2-external-ai-runtime-before-main-sync.json
            node /tmp/vibe2-main/tools/vibe2-external-ai-distillation.mjs \
              --merge-main-store=true \
              --base=/tmp/vibe2-main/.vibe2/external-ai-distilled-knowledge.json \
              --incoming=/tmp/vibe2-external-ai-runtime-before-main-sync.json \
              --output=.vibe2/external-ai-distilled-knowledge.json | tee /tmp/vibe2-external-ai-main-store-sync.log
            grep -q '^VIBE2_EXTERNAL_AI_MAIN_STORE_MERGE=PASS$' /tmp/vibe2-external-ai-main-store-sync.log

            node --check /tmp/vibe2-main/tools/company-system-ai-external-learning-feed.mjs
            node --check /tmp/vibe2-main/tools/vibe2-external-ai-distillation.mjs
            node /tmp/vibe2-main/tools/company-system-ai-external-learning-feed.mjs \
              --queue=.vibe2/system-ai-queue.json \
              --assistant-trace=/tmp/vibe2-main/company-learning/assistant-vibe-coauthoring-log.json \
              --output=/tmp/system-ai-external-learning-feed.json | tee /tmp/system-ai-external-learning-feed.log
            node /tmp/vibe2-main/tools/vibe2-external-ai-distillation.mjs \
              --input=/tmp/system-ai-external-learning-feed.json \
              --output=.vibe2/external-ai-distilled-knowledge.json | tee /tmp/vibe2-external-ai-distillation.log

            # Checkpoint *only* independently verified advisory learning before later
            # queue work: a >100 MiB task queue must never erase accepted learning.
            # Use the existing Vibe2 control ref/knowledge store; no direct main write.
            if grep -Eq '^VIBE2_EXTERNAL_AI_ACCEPTED=[1-9][0-9]*$' /tmp/vibe2-external-ai-distillation.log; then
              git add -- .vibe2/external-ai-distilled-knowledge.json
              if ! git diff --cached --quiet -- .vibe2/external-ai-distilled-knowledge.json; then
                staged="$(git diff --cached --name-only)"
                test "$staged" = '.vibe2/external-ai-distilled-knowledge.json'
                git commit -m 'vibe2: checkpoint independently verified advisory learning [skip ci]'
                if git push origin HEAD:vibe2-unreal-core; then
                  echo 'VIBE2_VERIFIED_ADVISORY_CHECKPOINT=PUSHED'
                else
                  # Re-read canonical control/QA evidence on a newly fetched exact ref.
                  echo 'VIBE2_VERIFIED_ADVISORY_CHECKPOINT=STALE_CONTROL_REF_RETRY'
                  sleep 2
                  continue
                fi
              else
                echo 'VIBE2_VERIFIED_ADVISORY_CHECKPOINT=ALREADY_PERSISTED'
              fi
            else
              echo 'VIBE2_VERIFIED_ADVISORY_CHECKPOINT=NO_NEW_VERIFIED_CANDIDATES'
            fi

            # 검증된 학습 선체크포인트 직후 기존 큐의 원문·순서·이력을 분할 저장한다.
            # 뒤쪽 부가 학습/마케팅 실패가 첫 무손실 저장을 막지 않게 한다.
            node /tmp/vibe2-main/tools/vibe2-queue-control.mjs storage-migrate
            # Keep the #7702 diagnostic on the persisted index; all task parts are
            # independently bounded and hash-verified by the queue storage owner.
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='.vibe2/queue.json';
          const bytes=fs.statSync(file).size;
          const githubBlobMaxBytes=100*1024*1024;
          console.log('VIBE2_QUEUE_SERIALIZED_BYTES='+bytes);
          console.log('VIBE2_QUEUE_GITHUB_BLOB_MAX_BYTES='+githubBlobMaxBytes);
          if(bytes>githubBlobMaxBytes){
            console.error('VIBE2_QUEUE_GIT_BLOB_LIMIT_BLOCKED='+bytes);
            console.error('VIBE2_QUEUE_COMPACTION_REQUIRES_LOSSLESS_DURABLE_HISTORY_MIGRATION');
            console.error('VIBE2_QUEUE_TASKS_REMOVED=0');
            process.exit(1);
          }
          NODE

            node /tmp/vibe2-main/tools/vibe2-queue-control.mjs storage-unpack --queue=.vibe2/queue.json
            node /tmp/vibe2-main/tools/vibe2-queue-control.mjs storage-pack --queue=.vibe2/queue.json
            git add -A -- .vibe2/queue
            git add .vibe2/queue.json
            node /tmp/vibe2-main/tools/vibe2-queue-control.mjs storage-unpack --queue=.vibe2/queue.json
            if ! git diff --cached --quiet -- .vibe2/queue.json .vibe2/queue; then
              git commit -m 'vibe2: checkpoint lossless asset queue storage [skip ci]'
              if git push origin HEAD:vibe2-unreal-core; then
                echo 'VIBE2_QUEUE_STORAGE_EARLY_CHECKPOINT=PUSHED'
                git fetch origin '+refs/heads/vibe2-unreal-core:refs/remotes/origin/vibe2-unreal-core' --depth=2 --no-tags --quiet
              else
