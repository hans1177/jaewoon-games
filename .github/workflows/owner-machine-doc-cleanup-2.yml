name: Owner Machine Doc Cleanup 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/owner-machine-doc-cleanup-2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Purge remaining human-readable policy mirrors
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch REMOTE_AUTOMATION.md VIBE2.md VIBE_RELEASE_TARGET.md
          git rm -f --ignore-unmatch .github/workflows/owner-machine-doc-cleanup-2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: purge human-readable policy mirrors"
          git push origin HEAD:main
