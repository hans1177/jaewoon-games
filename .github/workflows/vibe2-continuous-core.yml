name: Vibe2 Continuous Core

on:
  workflow_call:
    inputs:
      execution_lane:
        required: false
        type: string
        default: game-primary
      lane_max:
        required: false
        type: string
        default: '256'
  workflow_dispatch:
    inputs:
      execution_lane:
        required: false
        type: choice
        default: game-primary
        options:
          - game-primary
          - learning-idle
          - control-fast
      lane_max:
        required: false
        type: string
        default: '256'
  repository_dispatch:
    types: [vibe2-fanin-refill]
  push:
    branches:
      - 'vibe2/refill/fanin/**'

permissions:
  contents: write
  actions: write

env:
  VIBE2_LOCAL_MODEL: qwen3:1.7b
  VIBE2_MODEL_MAX_PREDICT: '1536'
  VIBE2_MODEL_TIMEOUT_MS: '240000'
  VIBE2_MAX_CONCURRENT_GAME_TASKS: '256'
  VIBE2_EXTERNAL_MATRIX_BATCH_MAX: '256'
  VIBE2_OWNER_MINIMUM_WAVE: '20'
  OLLAMA_HOST: 127.0.0.1:11434
  VIBE2_GAME_DEVELOPMENT_OWNER: VIBE2_VIBE3
  VIBE2_GAME_SOURCE_PROVIDER: LOCAL_OLLAMA
  VIBE2_CODEX_ROLE: SYSTEM_TOOLING_CI_TEST_INFRA_ONLY
  VIBE2_CODEX_GAME_SOURCE_WRITE: FORBIDDEN
  VIBE2_OPENAI_PAID_API_ALLOWED: 'false'
  VIBE2_SHARED_CONTEXT_REQUIRED: 'true'
  VIBE2_EXECUTION_LANE: ${{ inputs.execution_lane || 'game-primary' }}
  VIBE2_LANE_MAX: ${{ inputs.lane_max || '256' }}

jobs:
  reserve:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    concurrency:
      group: vibe2-control-state-vibe2-unreal-core
      cancel-in-progress: false
    outputs:
      worker_matrix: ${{ steps.batch.outputs.worker_matrix }}
      worker_count: ${{ steps.batch.outputs.worker_count }}
      task_count: ${{ steps.batch.outputs.task_count }}
      reserved_at: ${{ steps.batch.outputs.reserved_at }}
      effective_max: ${{ steps.batch.outputs.effective_max }}
      contract_sha: ${{ steps.contract.outputs.sha }}
    steps:
      - name: Checkout Vibe2 control line
        uses: actions/checkout@v4
        with:
          ref: vibe2-unreal-core
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare latest main machine contract
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 --no-tags origin main --quiet
          contract_sha="$(git rev-parse FETCH_HEAD)"
          rm -rf /tmp/vibe2-main
          mkdir -p /tmp/vibe2-main
          git archive "$contract_sha" | tar -x -C /tmp/vibe2-main
          test -f /tmp/vibe2-main/vibe2-runtime.json
          echo "sha=$contract_sha" >> "$GITHUB_OUTPUT"
          echo "VIBE2_CONTINUOUS_CONTRACT_SHA=$contract_sha"
          echo 'VIBE2_MAIN_CONTRACT_SNAPSHOT=ARCHIVE'

      - name: Fast scheduler preflight
        shell: bash
        run: |
          set -euo pipefail
          control_root="$GITHUB_WORKSPACE"
          for file in \
            assets/vibe-continuous-queue.js \
            tools/vibe2-auto-planner.mjs \
            tools/vibe2-continuous-runner.mjs \
            tools/vibe2-exploration-worker.mjs \
            tools/vibe2-source-worker.mjs \
            tools/vibe2-performance-sanity.mjs \
            tools/vibe2-fan-in-review.mjs \
            tools/vibe2-queue-control.mjs \
            tools/vibe2-work-package.mjs \
            tools/vibe2-incremental-qa.mjs \
            tools/vibe2-parallelism-telemetry.mjs \
            tools/vibe2-adaptive-backpressure.mjs \
            tools/vibe2-handoff.mjs \
            tools/vibe2-system-steward.mjs; do
            node --check "/tmp/vibe2-main/$file"
          done
          node /tmp/vibe2-main/tools/vibe2-system-steward.mjs \
            --queue="$control_root/.vibe2/queue.json" \
            --control="$control_root/.vibe2/parallelism-control.json" | tee /tmp/vibe2-reserve-preflight-steward.log
          echo 'VIBE2_RESERVE_PREFLIGHT_STEWARD=PASS'
          node /tmp/vibe2-main/tools/vibe2-handoff.mjs --check \
            --runtime=/tmp/vibe2-main/vibe2-runtime.json \
            --queue="$control_root/.vibe2/queue.json" \
            --control="$control_root/.vibe2/parallelism-control.json" \
            --experience="$control_root/.vibe2/experience.json" \
            --project-lifecycle="$control_root/.vibe2/web-roblox-handoffs.json" \
            --output=/tmp/vibe2-handoff-preflight.json >/tmp/vibe2-handoff-preflight.log
          echo 'VIBE2_RESERVE_PREFLIGHT=MAIN_CONTRACT_CONTROL_STATE'

      - name: Reserve conflict-free DAG batch
        id: batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-vibe2-scheduler'
          git config user.email 'vibe2-scheduler@users.noreply.github.com'
          git fetch origin vibe2-unreal-core --quiet
          git reset --hard origin/vibe2-unreal-core
          control_root="$PWD"

          callback_ref="${GITHUB_REF_NAME:-}"
          callback_kind='none'
          callback_cleanup='no'
          dispatch_type=''
          if [ "${GITHUB_EVENT_NAME:-}" = 'repository_dispatch' ]; then
            dispatch_type="$(node -e "const fs=require('fs');const e=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH,'utf8'));process.stdout.write(String(e.action||''))")"
          fi
          if [ "${GITHUB_EVENT_NAME:-}" = 'repository_dispatch' ] && [ "$dispatch_type" = 'vibe2-fanin-refill' ]; then
            callback_kind='fanin'
            echo 'VIBE2_SLOT_CALLBACK_FANIN=YES'
          elif [ "${GITHUB_EVENT_NAME:-}" = 'push' ] && [[ "$callback_ref" == vibe2/refill/fanin/* ]]; then
            callback_kind='fanin'
            callback_cleanup='yes'
            echo 'VIBE2_SLOT_CALLBACK_FANIN=YES'
          fi

          node /tmp/vibe2-main/tools/vibe2-system-steward.mjs \
            --queue="$control_root/.vibe2/queue.json" \
            --control="$control_root/.vibe2/parallelism-control.json" | tee /tmp/vibe2-reserve-steward.log
          echo 'VIBE2_RESERVE_STEWARD=PASS'

          if [ "$callback_kind" = 'fanin' ]; then
            git fetch origin company-runtime --quiet
            git show origin/company-runtime:development-queue.json > /tmp/vibe2-company-runtime-queue.json
            node /tmp/vibe2-main/tools/vibe2-auto-planner.mjs \
              --runtime=/tmp/vibe2-main/vibe2-runtime.json \
              --status=/tmp/vibe2-main/company-status.json \
              --catalog=/tmp/vibe2-main/game-catalog.json \
              --development-queue=/tmp/vibe2-company-runtime-queue.json \
              --queue="$control_root/.vibe2/queue.json" \
              --control="$control_root/.vibe2/parallelism-control.json" \
              --experience="$control_root/.vibe2/experience.json" \
              --historical-registry=/tmp/vibe2-main/company-learning/roblox-sustained-maintenance.json \
              --root=/tmp/vibe2-main \
              --max="$VIBE2_MAX_CONCURRENT_GAME_TASKS" | tee /tmp/vibe2-fanin-refill-autoplan.log
            echo 'VIBE2_FANIN_REFILL_PLANNER_SYNC=PASS'
          fi

          node /tmp/vibe2-main/tools/vibe2-handoff.mjs --check \
            --runtime=/tmp/vibe2-main/vibe2-runtime.json \
            --queue="$control_root/.vibe2/queue.json" \
            --control="$control_root/.vibe2/parallelism-control.json" \
            --experience="$control_root/.vibe2/experience.json" \
            --project-lifecycle="$control_root/.vibe2/web-roblox-handoffs.json" \
            --output=/tmp/vibe2-handoff-before-reserve.json >/tmp/vibe2-handoff-before-reserve.log
          active_worker_reservations="$(node -e "const fs=require('fs');const q=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));const requested=String(process.env.VIBE2_EXECUTION_LANE||'game-primary').toUpperCase().replaceAll('-','_');const lane=t=>{const status=String(t.status||'').toLowerCase(),blocker=String(t.blocker||''),dep=String(t.department||'').toLowerCase(),type=String(t.type||'implementation').toLowerCase(),ev=(t.evidence||[]).map(String);if(status==='running'&&/candidate-awaiting-qa-and-deployment|awaiting.*qa|qa.*awaiting|slot-released.*fan-in/i.test(blocker))return'RELEASE_WAIT';if(ev.includes('learning-practice-only')||dep==='learning'||(dep==='development'&&type==='research'))return'LEARNING_IDLE';if(dep==='development'&&type==='implementation')return'GAME_PRIMARY';if(t.systemSteward===true)return'RECOVERY_FAST';return'CONTROL_FAST';};const rows=(q.tasks||[]).filter(t=>String(t.status||'').toLowerCase()==='running'&&String(t.reservationRunId||'').trim()&&!String(t.blocker||'').trim()&&lane(t)===requested);process.stdout.write(String(rows.length))" "$control_root/.vibe2/queue.json")"
          echo "VIBE2_EXECUTION_LANE=$VIBE2_EXECUTION_LANE"
          echo "VIBE2_ACTIVE_LANE_RESERVATIONS_BEFORE_RESERVE=${active_worker_reservations:-0}"
          reservation_id="${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          reserved_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          if [ "${active_worker_reservations:-0}" -gt 0 ]; then
            export VIBE2_GUARD_RESERVED_AT="$reserved_at"
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const control=JSON.parse(fs.readFileSync('.vibe2/parallelism-control.json','utf8'));
          const lane=String(process.env.VIBE2_EXECUTION_LANE||'game-primary');
          const requested=Math.max(1,Number(process.env.VIBE2_LANE_MAX||256));
          const effective=lane==='game-primary'?Math.max(1,Number(control.currentMax||20)):requested;
          const out={
            version:1,
            createdAt:process.env.VIBE2_GUARD_RESERVED_AT||new Date().toISOString(),
            matrix:[],
            scheduler:{
              lane,
              requestedMaxConcurrentTasks:requested,
              effectiveMaxConcurrentTasks:effective,
              reservedTaskCount:0,
              workerCount:0,
              guard:'ACTIVE_LANE_RESERVATION_PRESENT'
            }
          };
          fs.writeFileSync('/tmp/vibe2-batch.json',JSON.stringify(out,null,2)+'\n');
          NODE
            : > /tmp/vibe2-reserve.log
            echo 'VIBE2_RESERVE_GUARD=ACTIVE_WAVE_PRESENT'
          else
            lane_min='1'
            if [ "$VIBE2_EXECUTION_LANE" = 'game-primary' ]; then lane_min="$VIBE2_OWNER_MINIMUM_WAVE"; fi
            node /tmp/vibe2-main/tools/vibe2-queue-control.mjs reserve-batch \
              --queue="$control_root/.vibe2/queue.json" \
              --control="$control_root/.vibe2/parallelism-control.json" \
              --lane="$VIBE2_EXECUTION_LANE" \
              --max="$VIBE2_LANE_MAX" \
              --min="$lane_min" \
              --reservation-id="$reservation_id" \
              --reservation-run="$GITHUB_RUN_ID" \
              --reservation-attempt="$GITHUB_RUN_ATTEMPT" \
              --reserved-at="$reserved_at" \
              --output=/tmp/vibe2-batch.json | tee /tmp/vibe2-reserve.log
          fi
          node /tmp/vibe2-main/tools/vibe2-handoff.mjs --check \
            --runtime=/tmp/vibe2-main/vibe2-runtime.json \
            --queue="$control_root/.vibe2/queue.json" \
            --control="$control_root/.vibe2/parallelism-control.json" \
            --experience="$control_root/.vibe2/experience.json" \
            --project-lifecycle="$control_root/.vibe2/web-roblox-handoffs.json" \
            --output=/tmp/vibe2-handoff-after-reserve.json >/tmp/vibe2-handoff-after-reserve.log

          if git diff --quiet -- .vibe2/queue.json .vibe2/parallelism-control.json; then
            echo 'VIBE2_BATCH_RESERVATION_WRITE=NO'
          else
            git add .vibe2/queue.json .vibe2/parallelism-control.json
            git commit -m "vibe2: repair state and reserve parallel DAG batch [skip ci]"
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase origin vibe2-unreal-core && git push origin HEAD:vibe2-unreal-core; then pushed=1; break; fi
              git rebase --abort 2>/dev/null || true
              git fetch origin vibe2-unreal-core --quiet
              sleep $((attempt * 2))
            done
            test "$pushed" = 1
            echo 'VIBE2_BATCH_RESERVATION_WRITE=YES'
          fi

          if [ "$callback_cleanup" = 'yes' ]; then
            git push origin --delete "$callback_ref" >/dev/null 2>&1 || true
            echo "VIBE2_SLOT_CALLBACK_CLEANUP=$callback_ref"
          fi

          node <<'NODE'
          const fs=require('fs');
          const out=process.env.GITHUB_OUTPUT;
          const batch=JSON.parse(fs.readFileSync('/tmp/vibe2-batch.json','utf8'));
          const workers=[];
          const safe=value=>String(value||'task').replace(/[^A-Za-z0-9._-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60)||'task';
          for(const row of batch.matrix||[]){
            const safeTask=safe(row.taskId);
            const variantCount=Math.max(1,Math.min(5,Number(row.speculativeVariants||1)));
            const shared={taskId:row.taskId,safeTask,shard:row.shard,packageId:row.packageId||'',packageRole:row.packageRole||'',longWorkProtected:row.longWorkProtected===true,reservationId:row.reservationId||'',reservationRunId:row.reservationRunId||'',reservationRunAttempt:Number(row.reservationRunAttempt||0),reservedAt:row.reservedAt||batch.createdAt,requestedMax:Number(batch.scheduler?.requestedMaxConcurrentTasks||256),effectiveMax:Number(batch.scheduler?.effectiveMaxConcurrentTasks||256)};
            workers.push({...shared,variant:'primary'});
            for(let i=1;i<variantCount;i++)workers.push({...shared,variant:`speculative-${i}`});
          }
          fs.appendFileSync(out,`worker_matrix=${JSON.stringify({include:workers})}\n`);
          fs.appendFileSync(out,`worker_count=${workers.length}\n`);
          fs.appendFileSync(out,`task_count=${(batch.matrix||[]).length}\n`);
          fs.appendFileSync(out,`reserved_at=${batch.createdAt||''}\n`);
          fs.appendFileSync(out,`effective_max=${Number(batch.scheduler?.effectiveMaxConcurrentTasks||256)}\n`);
          console.log(`VIBE2_HIERARCHICAL_FAN_OUT=${workers.length}`);
          console.log(`VIBE2_RESERVED_TASK_COUNT=${(batch.matrix||[]).length}`);
          console.log(`VIBE2_LONG_WORK_PROTECTED_SLOT=${batch.scheduler?.longWorkProtectedSlotUsed?'USED':'NOT_USED'}`);
          NODE

  model_cache:
    needs: reserve
    if: needs.reserve.outputs.worker_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    continue-on-error: true
    steps:
      - name: Restore or persist shared Ollama runtime cache
        id: ollama_cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.ollama/models
            ~/.cache/vibe2-ollama/bin/ollama
            ~/.cache/vibe2-ollama/lib/ollama
          key: vibe2-ollama-v3-Linux-qwen3-1.7b

      - name: Warm local coding model once on cache miss
        if: steps.ollama_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          installed=0
          for attempt in 1 2 3; do
            if curl -fsSL --retry 3 --retry-all-errors --connect-timeout 15 https://ollama.com/install.sh | sh; then installed=1; break; fi
            sleep $((attempt * 4))
          done
          test "$installed" = 1
          mkdir -p "$HOME/.cache/vibe2-ollama/bin" "$HOME/.cache/vibe2-ollama/lib/ollama"
          cp "$(command -v ollama)" "$HOME/.cache/vibe2-ollama/bin/ollama"
          chmod +x "$HOME/.cache/vibe2-ollama/bin/ollama"
          runtime_lib=""
          for candidate in /usr/local/lib/ollama /usr/lib/ollama; do
            if [ -d "$candidate" ] && find "$candidate" -type f -name 'llama-server' -perm -u+x -print -quit | grep -q .; then
              runtime_lib="$candidate"
              break
            fi
          done
          test -n "$runtime_lib"
          cp -a "$runtime_lib/." "$HOME/.cache/vibe2-ollama/lib/ollama/"
          find "$HOME/.cache/vibe2-ollama/lib/ollama" -type f -name 'llama-server' -perm -u+x -print -quit | grep -q .
          nohup ollama serve > /tmp/ollama-prewarm.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            if [ "$i" = 30 ]; then cat /tmp/ollama-prewarm.log || true; exit 1; fi
            sleep 2
          done
          ollama pull "$VIBE2_LOCAL_MODEL"
          echo 'VIBE2_MODEL_PREWARM=PASS'

  worker:
    needs: [reserve, model_cache]
    if: always() && needs.reserve.outputs.worker_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.reserve.outputs.worker_matrix) }}
    steps:
      - name: Mark worker start
        shell: bash
        run: echo "$(date +%s%3N)" > /tmp/vibe2-worker-start-ms

      - name: Checkout Vibe2 control line
        uses: actions/checkout@v4
        with:
          ref: vibe2-unreal-core
          fetch-depth: 1

      - name: Checkout pinned main contract
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.reserve.outputs.contract_sha }}
          path: vibe2-contract
          fetch-depth: 1

      - name: Measure worker checkout
        id: checkout_metrics
        shell: bash
        run: |
          now="$(date +%s%3N)"
          start="$(cat /tmp/vibe2-worker-start-ms)"
          echo "ms=$((now-start))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore shared Ollama runtime cache
        id: worker_ollama_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.ollama/models
            ~/.cache/vibe2-ollama/bin/ollama
            ~/.cache/vibe2-ollama/lib/ollama
          key: vibe2-ollama-v3-Linux-qwen3-1.7b

      - name: Prepare cached Ollama runtime
        id: worker_ollama_runtime
        shell: bash
        run: |
          set -euo pipefail
          prep_started="$(date +%s%3N)"
          cached="$HOME/.cache/vibe2-ollama/bin/ollama"
          cached_lib="$HOME/.cache/vibe2-ollama/lib/ollama"
          if [ -x "$cached" ] && [ -d "$cached_lib" ] && find "$cached_lib" -type f -name 'llama-server' -perm -u+x -print -quit | grep -q .; then
            sudo mkdir -p /usr/local/lib/ollama
            sudo cp -a "$cached_lib/." /usr/local/lib/ollama/
            echo "$HOME/.cache/vibe2-ollama/bin" >> "$GITHUB_PATH"
            echo 'VIBE2_OLLAMA_RUNTIME_SOURCE=CACHE'
            echo 'source=CACHE' >> "$GITHUB_OUTPUT"
          else
            installed=0
            for attempt in 1 2 3; do
              if curl -fsSL --retry 3 --retry-all-errors --connect-timeout 15 https://ollama.com/install.sh | sh; then installed=1; break; fi
              sleep $((attempt * 4))
            done
            test "$installed" = 1
            mkdir -p "$HOME/.cache/vibe2-ollama/bin" "$cached_lib"
            cp "$(command -v ollama)" "$cached"
            chmod +x "$cached"
            runtime_lib=""
            for candidate in /usr/local/lib/ollama /usr/lib/ollama; do
              if [ -d "$candidate" ] && find "$candidate" -type f -name 'llama-server' -perm -u+x -print -quit | grep -q .; then
                runtime_lib="$candidate"
                break
              fi
            done
            test -n "$runtime_lib"
            cp -a "$runtime_lib/." "$cached_lib/"
            find "$cached_lib" -type f -name 'llama-server' -perm -u+x -print -quit | grep -q .
            echo "$HOME/.cache/vibe2-ollama/bin" >> "$GITHUB_PATH"
            echo 'VIBE2_OLLAMA_RUNTIME_SOURCE=FALLBACK_INSTALL'
            echo 'source=FALLBACK_INSTALL' >> "$GITHUB_OUTPUT"
          fi
          prep_finished="$(date +%s%3N)"
          echo "duration_ms=$((prep_finished-prep_started))" >> "$GITHUB_OUTPUT"

      - name: Build reserved task work order
        id: order
        env:
          TASK_ID: ${{ matrix.taskId }}
          VARIANT: ${{ matrix.variant }}
          SAFE_TASK: ${{ matrix.safeTask }}
        shell: bash
        run: |
          set -euo pipefail
          contract_root="$GITHUB_WORKSPACE/vibe2-contract"
          node "$contract_root/tools/vibe2-continuous-runner.mjs" \
            --runtime="$contract_root/vibe2-runtime.json" \
            --queue="$GITHUB_WORKSPACE/.vibe2/queue.json" \
            --control="$GITHUB_WORKSPACE/.vibe2/parallelism-control.json" \
            --experience="$GITHUB_WORKSPACE/.vibe2/experience.json" \
            --project-lifecycle="$GITHUB_WORKSPACE/.vibe2/web-roblox-handoffs.json" \
            --task-id="$TASK_ID" \
            --variant="$VARIANT" \
            --output=/tmp/vibe2-work-order.json | tee /tmp/vibe2-order.log
          node <<'NODE'
          const fs=require('fs');
          const order=JSON.parse(fs.readFileSync('/tmp/vibe2-work-order.json','utf8'));
          const out=process.env.GITHUB_OUTPUT;
          const put=(k,v)=>fs.appendFileSync(out,`${k}=${String(v??'').replaceAll('\n',' ')}\n`);
          put('run',order.run?'true':'false');
          put('reason',order.reason||'');
          put('task_id',order.taskId||process.env.TASK_ID||'');
          put('safe_task',process.env.SAFE_TASK||'');
          put('game_id',order.gameId||'');
          put('target',order.target||'');
          put('route',order.executionRoute||'');
          put('source_root',order.source?.root||'');
          put('release_state',order.releaseState||'other');
          put('cache_namespace',order.incrementalQa?.cacheNamespace||`${order.target||'unknown'}:${order.gameId||'global'}`);
          put('variant',process.env.VARIANT||'primary');
          NODE

      - name: Run source-free learning practice
        id: practice
        if: steps.order.outputs.run == 'true' && steps.order.outputs.route == 'analysis-only'
        continue-on-error: true
        env:
          SAFE_TASK: ${{ matrix.safeTask }}
          VARIANT: ${{ matrix.variant }}
        shell: bash
        run: |
          set -euo pipefail
          command -v ollama >/dev/null
          nohup ollama serve > "/tmp/ollama-practice-${SAFE_TASK}-${VARIANT}.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            if [ "$i" = 30 ]; then cat "/tmp/ollama-practice-${SAFE_TASK}-${VARIANT}.log" || true; exit 1; fi
            sleep 2
          done
          if ! ollama list | awk 'NR>1 {print $1}' | grep -Fqx "$VIBE2_LOCAL_MODEL"; then
            ollama pull "$VIBE2_LOCAL_MODEL"
          fi
          node tools/vibe2-learning-practice-worker.mjs \
            --order=/tmp/vibe2-work-order.json \
            --output=/tmp/vibe2-learning-practice-result.json
          test -f /tmp/vibe2-learning-practice-result.json
          node tools/vibe2-practice-distillation.mjs \
            --result=/tmp/vibe2-learning-practice-result.json \
            --order=/tmp/vibe2-work-order.json \
            --experience=.vibe2/experience.json \
            --patterns=.vibe2/code-pattern-library.json \
            --knowledge=.vibe2/game-study-knowledge.json \
            --output=/tmp/vibe2-practice-distillation.json
          test -f /tmp/vibe2-practice-distillation.json
          echo 'VIBE2_ANALYSIS_WORKER=PRACTICE_ONLY'
          echo 'VIBE2_PRACTICE_PRODUCTION_PASS=NO'
          echo 'VIBE2_PRACTICE_RAW_CANDIDATE_PERSISTED=NO'

      - name: Build task-local exploration handoff
        id: local_exploration
        if: steps.order.outputs.run == 'true' && steps.order.outputs.route == 'text-source-worker'
        env:
          TASK_ID: ${{ steps.order.outputs.task_id }}
          SAFE_TASK: ${{ matrix.safeTask }}
          CONTRACT_SHA: ${{ needs.reserve.outputs.contract_sha }}
        shell: bash
        run: |
          set -euo pipefail
          contract_root="$GITHUB_WORKSPACE/vibe2-contract"
          base_sha="$CONTRACT_SHA"
          test -n "$base_sha"
          test "$(git -C "$contract_root" rev-parse HEAD)" = "$base_sha"
          explore_dir="/tmp/vibe2-worker-explore-${SAFE_TASK}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git -C "$contract_root" worktree add --detach "$explore_dir" "$base_sha"
          mkdir -p "$explore_dir/.vibe2" /tmp/vibe2-exploration
          cp /tmp/vibe2-work-order.json "$explore_dir/.vibe2/work-order.json"
          cd "$explore_dir"
          export VIBE2_BASE_MAIN_SHA="$base_sha"
          node "$contract_root/tools/vibe2-exploration-worker.mjs" \
            --order=.vibe2/work-order.json \
            --output=/tmp/vibe2-exploration/vibe2-exploration.json | tee /tmp/vibe2-exploration.log
          test -s /tmp/vibe2-exploration/vibe2-exploration.json
          echo 'VIBE2_TASK_LOCAL_EXPLORATION=PASS'
          echo "VIBE2_BASE_MAIN_SHA=$base_sha"

      - name: Verify free execution budget
        if: steps.order.outputs.run == 'true' && steps.order.outputs.route == 'text-source-worker'
        shell: bash
        run: |
          set -euo pipefail
          node tools/free-budget-telemetry.mjs \
            --verify-public-repo=true \
            --runner=ubuntu-latest \
            --model-calls=1 \
            --runner-minutes=22 \
            --output=/tmp/vibe2-free-budget.json
          echo 'VIBE2_PAID_API=NO'
          echo 'VIBE2_PAID_RUNNER=NO'
          echo 'VIBE2_PARALLELISM_POLICY=UNBOUNDED_BY_POLICY'
          echo "VIBE2_EXTERNAL_MATRIX_BATCH_MAX=$VIBE2_EXTERNAL_MATRIX_BATCH_MAX"
          echo 'VIBE2_FREE_AI_SCALE=ONE_WORKER_PER_INDEPENDENT_TASK'
          test "$VIBE2_GAME_DEVELOPMENT_OWNER" = "VIBE2_VIBE3"
          test "$VIBE2_GAME_SOURCE_PROVIDER" = "LOCAL_OLLAMA"
          test "$VIBE2_CODEX_ROLE" = "SYSTEM_TOOLING_CI_TEST_INFRA_ONLY"
          test "$VIBE2_CODEX_GAME_SOURCE_WRITE" = "FORBIDDEN"
          test "$VIBE2_OPENAI_PAID_API_ALLOWED" = "false"
          echo 'VIBE2_GAME_SOURCE_AUTHORITY=PASS'
          echo 'VIBE2_CODEX_ROLE=SYSTEM_TOOLING_CI_TEST_INFRA_ONLY'

      - name: Generate isolated candidate from pinned main contract
        id: candidate
        if: steps.order.outputs.run == 'true' && steps.order.outputs.route == 'text-source-worker'
        continue-on-error: true
        env:
          TASK_ID: ${{ steps.order.outputs.task_id }}
          SAFE_TASK: ${{ matrix.safeTask }}
          SOURCE_ROOT: ${{ steps.order.outputs.source_root }}
          VARIANT: ${{ matrix.variant }}
          CONTRACT_SHA: ${{ needs.reserve.outputs.contract_sha }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_started="$(date +%s%3N)"
          contract_root="$GITHUB_WORKSPACE/vibe2-contract"
          base_sha="$CONTRACT_SHA"
          test -n "$base_sha"
          test "$(git -C "$contract_root" rev-parse HEAD)" = "$base_sha"
          candidate_branch="vibe2/candidate/${SAFE_TASK}-${VARIANT}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          candidate_dir="/tmp/vibe2-candidate-${SAFE_TASK}-${VARIANT}-${GITHUB_RUN_ID}"
          git -C "$contract_root" worktree add -b "$candidate_branch" "$candidate_dir" "$base_sha"
          mkdir -p "$candidate_dir/.vibe2"
          cp /tmp/vibe2-work-order.json "$candidate_dir/.vibe2/work-order.json"
          cp /tmp/vibe2-exploration/vibe2-exploration.json "$candidate_dir/.vibe2/exploration.json"

          test "$VIBE2_GAME_DEVELOPMENT_OWNER" = "VIBE2_VIBE3" || { echo "GAME_DEVELOPMENT_OWNER_INVALID=$VIBE2_GAME_DEVELOPMENT_OWNER" >&2; exit 1; }
          test "$VIBE2_GAME_SOURCE_PROVIDER" = "LOCAL_OLLAMA" || { echo "GAME_SOURCE_PROVIDER_INVALID=$VIBE2_GAME_SOURCE_PROVIDER" >&2; exit 1; }
          test "$VIBE2_CODEX_GAME_SOURCE_WRITE" = "FORBIDDEN" || { echo "CODEX_GAME_SOURCE_WRITE_FORBIDDEN=$VIBE2_CODEX_GAME_SOURCE_WRITE" >&2; exit 1; }
          test "$VIBE2_OPENAI_PAID_API_ALLOWED" = "false" || { echo "OPENAI_PAID_API_GAME_SOURCE_FORBIDDEN=$VIBE2_OPENAI_PAID_API_ALLOWED" >&2; exit 1; }
          echo 'VIBE2_GAME_DEVELOPMENT_OWNER=VIBE2_VIBE3'
          echo 'VIBE2_GAME_SOURCE_PROVIDER=LOCAL_OLLAMA'
          echo 'VIBE2_CODEX_GAME_SOURCE_WRITE=FORBIDDEN'

          command -v ollama >/dev/null
          nohup ollama serve > "/tmp/ollama-${SAFE_TASK}-${VARIANT}.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            if [ "$i" = 30 ]; then cat "/tmp/ollama-${SAFE_TASK}-${VARIANT}.log" || true; exit 1; fi
            sleep 2
          done
          if ollama list | awk 'NR>1 {print $1}' | grep -Fqx "$VIBE2_LOCAL_MODEL"; then
            echo 'VIBE2_LOCAL_MODEL_SOURCE=CACHE'
          else
            echo 'VIBE2_LOCAL_MODEL_SOURCE=FALLBACK_PULL'
            ollama pull "$VIBE2_LOCAL_MODEL"
          fi

          cd "$candidate_dir"
          node --check tools/company-shared-context.mjs
          node tools/company-shared-context.mjs --output="/tmp/vibe2-shared-context-${SAFE_TASK}-${VARIANT}-before.json" | tee "/tmp/vibe2-shared-context-${SAFE_TASK}-${VARIANT}-before.log"
          export VIBE2_BASE_MAIN_SHA="$base_sha"
          export VIBE2_SPECULATIVE_VARIANT="$VARIANT"
          export VIBE2_EXPLORATION_FILE=.vibe2/exploration.json
          source_worker_log="/tmp/vibe2-source-worker-${SAFE_TASK}-${VARIANT}.log"
          echo "candidate_dir=$candidate_dir" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          set +e
          node "$GITHUB_WORKSPACE/vibe2-contract/tools/vibe2-source-worker.mjs" --apply-source=true 2>&1 | tee "$source_worker_log"
          worker_rc=${PIPESTATUS[0]}
          set -e
          candidate_finished="$(date +%s%3N)"
          echo "duration_ms=$((candidate_finished-candidate_started))" >> "$GITHUB_OUTPUT"
          failure_class="$(sed -n 's/^VIBE2_SOURCE_WORKER_FAILURE_CLASS=//p' "$source_worker_log" | tail -n1)"
          failure_message="$(sed -n 's/^VIBE2_SOURCE_WORKER_FAILURE_MESSAGE=//p' "$source_worker_log" | tail -n1)"
          echo "failure_class=$failure_class" >> "$GITHUB_OUTPUT"
          echo "failure_message=$failure_message" >> "$GITHUB_OUTPUT"
          if [ "$worker_rc" -ne 0 ]; then exit "$worker_rc"; fi
          candidate_manifest_rel="$(sed -n 's/^VIBE2_CANDIDATE_MANIFEST=//p' "$source_worker_log" | tail -n1)"
          test -n "$candidate_manifest_rel"
          candidate_manifest="$candidate_dir/$candidate_manifest_rel"
          test -f "$candidate_manifest"
          echo "candidate_manifest=$candidate_manifest" >> "$GITHUB_OUTPUT"
          echo "VIBE2_CANDIDATE_MANIFEST=$candidate_manifest_rel"
          node tools/company-shared-context.mjs --output="/tmp/vibe2-shared-context-${SAFE_TASK}-${VARIANT}-after.json" | tee "/tmp/vibe2-shared-context-${SAFE_TASK}-${VARIANT}-after.log"
          git diff --check
          node --check tools/company-security-steward.mjs
          node tools/company-security-steward.mjs --output="/tmp/vibe2-security-${SAFE_TASK}-${VARIANT}.json"
          echo 'VIBE2_SECURITY_IMMUNE_SCAN=PASS'

          git add "$SOURCE_ROOT" .vibe2/candidates
          git diff --cached --quiet && { echo 'candidate has no source diff' >&2; exit 1; }
          mapfile -t changed < <(git diff --cached --name-only)
          for file in "${changed[@]}"; do
            case "$file" in
              "$SOURCE_ROOT"/*|.vibe2/candidates/*) ;;
              *) echo "candidate escaped approved boundary: $file" >&2; exit 1 ;;
            esac
          done

          changed_file_count="$(git diff --cached --name-only -- "$SOURCE_ROOT" | sed '/^$/d' | wc -l | tr -d ' ')"
          read -r added_line_count deleted_line_count < <(git diff --cached --numstat -- "$SOURCE_ROOT" | awk '{if($1~/^[0-9]+$/)a+=$1;if($2~/^[0-9]+$/)d+=$2}END{print a+0,d+0}')
          echo "changed_file_count=${changed_file_count:-0}" >> "$GITHUB_OUTPUT"
          echo "added_line_count=${added_line_count:-0}" >> "$GITHUB_OUTPUT"
          echo "deleted_line_count=${deleted_line_count:-0}" >> "$GITHUB_OUTPUT"

          git config user.name 'jaewoon-vibe2-worker'
          git config user.email 'vibe2-worker@users.noreply.github.com'
          git commit -m "vibe2: candidate ${TASK_ID} ${VARIANT}"
          git push origin "HEAD:$candidate_branch"
          candidate_sha="$(git rev-parse HEAD)"
          echo "candidate_branch=$candidate_branch" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "VIBE2_CANDIDATE_BRANCH=$candidate_branch"
          echo "VIBE2_CANDIDATE_SHA=$candidate_sha"
          echo "VIBE2_BASE_MAIN_SHA=$base_sha"
          echo "VIBE2_CHANGED_FILE_COUNT=${changed_file_count:-0}"
          echo "VIBE2_CHANGED_LINE_COUNT=$(( ${added_line_count:-0} + ${deleted_line_count:-0} ))"

      - name: Restore incremental QA content-hash cache
        if: steps.candidate.outcome == 'success'
        uses: actions/cache@v4
        with:
          path: /tmp/vibe2-qa-cache
          key: vibe2-iqa-v2-${{ runner.os }}-${{ steps.order.outputs.game_id }}-${{ github.run_id }}-${{ matrix.variant }}
          restore-keys: |
            vibe2-iqa-v2-${{ runner.os }}-${{ steps.order.outputs.game_id }}-

      - name: Run impact-first incremental QA role
        id: incremental_qa
        if: steps.candidate.outcome == 'success'
        continue-on-error: true
        env:
          CANDIDATE_DIR: ${{ steps.candidate.outputs.candidate_dir }}
          CANDIDATE_MANIFEST: ${{ steps.candidate.outputs.candidate_manifest }}
          CACHE_NAMESPACE: ${{ steps.order.outputs.cache_namespace }}
        shell: bash
        run: |
          set -euo pipefail
          qa_started="$(date +%s%3N)"
          mkdir -p /tmp/vibe2-qa-cache
          manifest="$CANDIDATE_MANIFEST"
          test -f "$manifest"
          node "$GITHUB_WORKSPACE/vibe2-contract/tools/vibe2-incremental-qa.mjs" \
            --root="$CANDIDATE_DIR" \
            --manifest="$manifest" \
            --cache=/tmp/vibe2-qa-cache/cache.json \
            --namespace="$CACHE_NAMESPACE" \
            --output=/tmp/vibe2-incremental-qa.json | tee /tmp/vibe2-incremental-qa.log
          hash="$(sed -n 's/^VIBE2_INCREMENTAL_QA_HASH=//p' /tmp/vibe2-incremental-qa.log | tail -n1)"
          cache="$(sed -n 's/^VIBE2_INCREMENTAL_QA_CACHE=//p' /tmp/vibe2-incremental-qa.log | tail -n1)"
          replay_status="$(sed -n 's/^VIBE2_CAUSAL_REPLAY_STATUS=//p' /tmp/vibe2-incremental-qa.log | tail -n1)"
          replay_executed="$(sed -n 's/^VIBE2_CAUSAL_REPLAY_EXECUTED=//p' /tmp/vibe2-incremental-qa.log | tail -n1)"
          drift_status="$(sed -n 's/^VIBE2_ARCHITECTURE_DRIFT_STATUS=//p' /tmp/vibe2-incremental-qa.log | tail -n1)"
          drift_risk="$(sed -n 's/^VIBE2_ARCHITECTURE_DRIFT_RISK=//p' /tmp/vibe2-incremental-qa.log | tail -n1)"
          drift_score="$(sed -n 's/^VIBE2_ARCHITECTURE_DRIFT_SCORE=//p' /tmp/vibe2-incremental-qa.log | tail -n1)"
          drift_signals="$(sed -n 's/^VIBE2_ARCHITECTURE_DRIFT_SIGNALS=//p' /tmp/vibe2-incremental-qa.log | tail -n1)"
          presentation_status="$(sed -n 's/^VIBE2_PRESENTATION_QA_STATUS=//p' /tmp/vibe2-incremental-qa.log | tail -n1)"
          presentation_pass="$(sed -n 's/^VIBE2_PRESENTATION_QA_PASS=//p' /tmp/vibe2-incremental-qa.log | tail -n1)"
          presentation_runtime_required="$(sed -n 's/^VIBE2_PRESENTATION_RUNTIME_REQUIRED=//p' /tmp/vibe2-incremental-qa.log | tail -n1)"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "cache=$cache" >> "$GITHUB_OUTPUT"
          echo "causal_replay_status=$replay_status" >> "$GITHUB_OUTPUT"
          echo "causal_replay_executed=$replay_executed" >> "$GITHUB_OUTPUT"
          echo "architecture_drift_status=$drift_status" >> "$GITHUB_OUTPUT"
          echo "architecture_drift_risk=$drift_risk" >> "$GITHUB_OUTPUT"
          echo "architecture_drift_score=$drift_score" >> "$GITHUB_OUTPUT"
          echo "architecture_drift_signals=$drift_signals" >> "$GITHUB_OUTPUT"
          echo "presentation_status=$presentation_status" >> "$GITHUB_OUTPUT"
          echo "presentation_pass=$presentation_pass" >> "$GITHUB_OUTPUT"
          echo "presentation_runtime_required=$presentation_runtime_required" >> "$GITHUB_OUTPUT"
          qa_finished="$(date +%s%3N)"
          echo "duration_ms=$((qa_finished-qa_started))" >> "$GITHUB_OUTPUT"
          echo 'VIBE2_TEST_ROLE=PASS'
          echo 'VIBE2_TEST_ROLE_SOURCE_WRITE=NO'

      - name: Run read-only performance sanity role
        id: performance
        if: steps.candidate.outcome == 'success' && steps.incremental_qa.outcome == 'success'
        continue-on-error: true
        env:
          CANDIDATE_DIR: ${{ steps.candidate.outputs.candidate_dir }}
          CANDIDATE_MANIFEST: ${{ steps.candidate.outputs.candidate_manifest }}
        shell: bash
        run: |
          set -euo pipefail
          manifest="$CANDIDATE_MANIFEST"
          test -f "$manifest"
          node "$GITHUB_WORKSPACE/vibe2-contract/tools/vibe2-performance-sanity.mjs" \
            --root="$CANDIDATE_DIR" \
            --manifest="$manifest" \
            --output=/tmp/vibe2-performance.json | tee /tmp/vibe2-performance.log
          echo 'VIBE2_PERFORMANCE_ROLE=PASS'
          echo 'VIBE2_PERFORMANCE_ROLE_SOURCE_WRITE=NO'

      - name: Build immutable worker result
        id: result
        if: always()
        env:
          TASK_ID: ${{ matrix.taskId }}
          VARIANT: ${{ matrix.variant }}
          ORDER_RUN: ${{ steps.order.outputs.run }}
          ORDER_REASON: ${{ steps.order.outputs.reason }}
          ROUTE: ${{ steps.order.outputs.route }}
          CANDIDATE_OUTCOME: ${{ steps.candidate.outcome }}
          CANDIDATE_BRANCH: ${{ steps.candidate.outputs.candidate_branch }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
          CANDIDATE_DIR: ${{ steps.candidate.outputs.candidate_dir }}
          CANDIDATE_MANIFEST: ${{ steps.candidate.outputs.candidate_manifest }}
          CANDIDATE_FAILURE_CLASS: ${{ steps.candidate.outputs.failure_class }}
          CANDIDATE_FAILURE_MESSAGE: ${{ steps.candidate.outputs.failure_message }}
          EXPLORATION_FILE: /tmp/vibe2-exploration/vibe2-exploration.json
          BASE_SHA: ${{ steps.candidate.outputs.base_sha }}
          CHANGED_FILE_COUNT: ${{ steps.candidate.outputs.changed_file_count }}
          ADDED_LINE_COUNT: ${{ steps.candidate.outputs.added_line_count }}
          DELETED_LINE_COUNT: ${{ steps.candidate.outputs.deleted_line_count }}
          IQA_OUTCOME: ${{ steps.incremental_qa.outcome }}
          IQA_HASH: ${{ steps.incremental_qa.outputs.hash }}
          IQA_CACHE: ${{ steps.incremental_qa.outputs.cache }}
          IQA_CAUSAL_REPLAY_STATUS: ${{ steps.incremental_qa.outputs.causal_replay_status }}
          IQA_CAUSAL_REPLAY_EXECUTED: ${{ steps.incremental_qa.outputs.causal_replay_executed }}
          IQA_ARCHITECTURE_DRIFT_STATUS: ${{ steps.incremental_qa.outputs.architecture_drift_status }}
          IQA_ARCHITECTURE_DRIFT_RISK: ${{ steps.incremental_qa.outputs.architecture_drift_risk }}
          IQA_ARCHITECTURE_DRIFT_SCORE: ${{ steps.incremental_qa.outputs.architecture_drift_score }}
          IQA_ARCHITECTURE_DRIFT_SIGNALS: ${{ steps.incremental_qa.outputs.architecture_drift_signals }}
          IQA_PRESENTATION_STATUS: ${{ steps.incremental_qa.outputs.presentation_status }}
          IQA_PRESENTATION_PASS: ${{ steps.incremental_qa.outputs.presentation_pass }}
          IQA_PRESENTATION_RUNTIME_REQUIRED: ${{ steps.incremental_qa.outputs.presentation_runtime_required }}
          PERFORMANCE_OUTCOME: ${{ steps.performance.outcome }}
          PRACTICE_OUTCOME: ${{ steps.practice.outcome }}
          SAFE_TASK: ${{ matrix.safeTask }}
          RESERVATION_ID: ${{ matrix.reservationId }}
          RESERVED_AT: ${{ matrix.reservedAt }}
          REQUESTED_MAX: ${{ matrix.requestedMax }}
          EFFECTIVE_MAX: ${{ matrix.effectiveMax }}
          WORKER_STARTED_AT_FILE: /tmp/vibe2-worker-start-ms
          CHECKOUT_MS: ${{ steps.checkout_metrics.outputs.ms }}
          MODEL_PREP_MS: ${{ steps.worker_ollama_runtime.outputs.duration_ms }}
          OLLAMA_CACHE_HIT: ${{ steps.worker_ollama_cache.outputs.cache-hit }}
          OLLAMA_RUNTIME_SOURCE: ${{ steps.worker_ollama_runtime.outputs.source }}
          SHARED_CONTEXT_FILE: /tmp/vibe2-shared-context-${{ matrix.safeTask }}-${{ matrix.variant }}-after.json
          CANDIDATE_MS: ${{ steps.candidate.outputs.duration_ms }}
          QA_MS: ${{ steps.incremental_qa.outputs.duration_ms }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/vibe2-result
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const clean=v=>String(v??'').trim();
          const route=clean(process.env.ROUTE);
          const candidateOk=process.env.CANDIDATE_OUTCOME==='success';
          const testOk=process.env.IQA_OUTCOME==='success';
          const performanceOk=process.env.PERFORMANCE_OUTCOME==='success';
          let outcome='BLOCKED', blocker=clean(process.env.ORDER_REASON)||'work-order-not-runnable';
          if(process.env.ORDER_RUN==='true' && route==='text-source-worker'){
            if(candidateOk&&testOk&&performanceOk){outcome='PASS';blocker='candidate-awaiting-qa-and-deployment';}
            else if(!candidateOk){outcome='FAIL';blocker='source-candidate-generation-failed';}
            else if(!testOk){outcome='FAIL';blocker='incremental-qa-failed';}
            else{outcome='FAIL';blocker='performance-sanity-failed';}
          }else if(process.env.ORDER_RUN==='true' && route==='engine-editor') blocker='engine-editor-worker-not-connected';
          else if(process.env.ORDER_RUN==='true' && route==='analysis-only'){
            if(process.env.PRACTICE_OUTCOME==='success'){outcome='PASS';blocker='learning-practice-complete';}
            else{outcome='FAIL';blocker='learning-practice-worker-failed';}
          }

          let manifest={};
          const candidateManifest=clean(process.env.CANDIDATE_MANIFEST);
          if(candidateManifest&&fs.existsSync(candidateManifest))manifest=JSON.parse(fs.readFileSync(candidateManifest,'utf8'));
          let workOrder={};
          if(fs.existsSync('/tmp/vibe2-work-order.json'))workOrder=JSON.parse(fs.readFileSync('/tmp/vibe2-work-order.json','utf8'));
          const explorationFile=clean(process.env.EXPLORATION_FILE);
          const exploration=manifest.exploration||(explorationFile&&fs.existsSync(explorationFile)?JSON.parse(fs.readFileSync(explorationFile,'utf8')):null);
          const sourceGenerationAttempted=process.env.ORDER_RUN==='true' && route==='text-source-worker';
          const candidateFailureClass=sourceGenerationAttempted&&!candidateOk?(clean(process.env.CANDIDATE_FAILURE_CLASS)||null):null;
          const candidateFailureMessage=sourceGenerationAttempted&&!candidateOk?(clean(process.env.CANDIDATE_FAILURE_MESSAGE)||null):null;
          const fallbackCodingMethod=clean(workOrder?.candidateStrategyRole?.strategy)?{
            version:2,
            strategy:clean(workOrder.candidateStrategyRole.strategy),
            candidateVariant:clean(workOrder?.candidateStrategyRole?.variant)||clean(process.env.VARIANT)||'primary',
            responsibilityConfidence:clean(exploration?.editContract?.responsibilityConfidence)||'LOW',
            primaryTargets:Array.isArray(exploration?.editContract?.primaryTargets)?exploration.editContract.primaryTargets.slice(0,8):[],
            primarySystems:Array.isArray(exploration?.editContract?.primarySystems)?exploration.editContract.primarySystems.slice(0,12):[],
            dependentSystems:Array.isArray(exploration?.editContract?.dependentSystems)?exploration.editContract.dependentSystems.slice(0,12):[],
            ownedState:Array.isArray(exploration?.editContract?.ownedState)?exploration.editContract.ownedState.slice(0,24):[],
            semanticDiffBudget:exploration?.editContract?.semanticDiffBudget||null,
            semanticDiffEnforcement:null,
            causalReplay:exploration?.editContract?.causalReplay||null,
            failureFingerprint:clean(workOrder?.unifiedLearning?.failureFingerprint)||null,
            patchRecipeMode:clean(exploration?.editContract?.patchRecipe?.mode)||null,
            verifiedFailureLocalMemoryCount:Number(exploration?.editContract?.patchRecipe?.verifiedMemoryCount||0),
            verifiedFailureLocalMemoryIds:Array.isArray(exploration?.editContract?.patchRecipe?.verifiedMemoryIds)?exploration.editContract.patchRecipe.verifiedMemoryIds.slice(0,8):[],
            generationAttempts:0,
            candidateProducedFirstAttempt:false,
            writableScopeExpansionAllowed:false,
            learningAuthorityExpanded:false
          }:null;
          const baseCodingMethod=manifest?.codingMethod||fallbackCodingMethod;
          const presentationQuality=manifest?.presentationQuality&&typeof manifest.presentationQuality==='object'?{
            ...manifest.presentationQuality,
            staticQaStatus:clean(process.env.IQA_PRESENTATION_STATUS)||'NOT_REQUIRED',
            staticQaPass:clean(process.env.IQA_PRESENTATION_PASS)||null,
            runtimeQaRequired:clean(process.env.IQA_PRESENTATION_RUNTIME_REQUIRED).toUpperCase()==='YES',
            authorityExpanded:false
          }:null;
          const roleResults={
            exploration:exploration?.reuseKey?'PASS':'FAIL',
            implementation:candidateOk?'PASS':'FAIL',
            test:testOk?'PASS':'FAIL',
            performance:performanceOk?'PASS':'FAIL',
            regression:'WAITING_FAN_IN',
            review:'WAITING_FAN_IN'
          };
          const evidence=[
            clean(process.env.CANDIDATE_BRANCH),
            clean(process.env.CANDIDATE_SHA)&&`candidate-sha:${clean(process.env.CANDIDATE_SHA)}`,
            clean(process.env.BASE_SHA)&&`base-main:${clean(process.env.BASE_SHA)}`,
            clean(process.env.IQA_HASH)&&`incremental-qa-hash:${clean(process.env.IQA_HASH)}`,
            clean(process.env.IQA_CACHE)&&`incremental-qa-cache:${clean(process.env.IQA_CACHE)}`,
            clean(process.env.IQA_CAUSAL_REPLAY_STATUS)&&`causal-replay-status:${clean(process.env.IQA_CAUSAL_REPLAY_STATUS)}`,
            clean(process.env.IQA_CAUSAL_REPLAY_EXECUTED)&&`causal-replay-executed:${clean(process.env.IQA_CAUSAL_REPLAY_EXECUTED)}`,
            clean(process.env.IQA_ARCHITECTURE_DRIFT_STATUS)&&`architecture-drift-status:${clean(process.env.IQA_ARCHITECTURE_DRIFT_STATUS)}`,
            clean(process.env.IQA_ARCHITECTURE_DRIFT_RISK)&&`architecture-drift-risk:${clean(process.env.IQA_ARCHITECTURE_DRIFT_RISK)}`,
            clean(process.env.IQA_ARCHITECTURE_DRIFT_SCORE)&&`architecture-drift-score:${clean(process.env.IQA_ARCHITECTURE_DRIFT_SCORE)}`,
            clean(process.env.IQA_ARCHITECTURE_DRIFT_SIGNALS)&&`architecture-drift-signals:${clean(process.env.IQA_ARCHITECTURE_DRIFT_SIGNALS)}`,
            clean(process.env.IQA_PRESENTATION_STATUS)&&`presentation-static-qa-status:${clean(process.env.IQA_PRESENTATION_STATUS)}`,
            clean(process.env.IQA_PRESENTATION_PASS)&&clean(process.env.IQA_PRESENTATION_PASS)!=='NONE'&&`presentation-pass-verified:${clean(process.env.IQA_PRESENTATION_PASS)}`,
            clean(process.env.IQA_PRESENTATION_RUNTIME_REQUIRED).toUpperCase()==='YES'?'presentation-runtime-qa-required:YES':'',
            ['MEDIUM','HIGH'].includes(clean(process.env.IQA_ARCHITECTURE_DRIFT_RISK).toUpperCase())?'architecture-drift-focused-review-required:YES':'',
            ...Object.entries(roleResults).map(([role,status])=>`role-result:${role}:${status}`),
            candidateFailureClass&&`source-generation-failure:${candidateFailureClass}`,
            clean(baseCodingMethod?.strategy)&&`coding-strategy:${clean(baseCodingMethod.strategy)}`,
            clean(baseCodingMethod?.responsibilityConfidence)&&`coding-responsibility-confidence:${clean(baseCodingMethod.responsibilityConfidence)}`,
            Number(baseCodingMethod?.generationAttempts)>0&&`coding-generation-attempts:${Number(baseCodingMethod.generationAttempts)}`,
            Number(baseCodingMethod?.generationAttemptBudget)>0&&`coding-generation-attempt-budget:${Number(baseCodingMethod.generationAttemptBudget)}`,
            baseCodingMethod?.speculativeAttemptBudgetApplied===true?'coding-speculative-attempt-budget:YES':'',
            baseCodingMethod?.fullWebInitialSeedStrategy===true?'coding-full-web-initial-seed:YES':'',
            Array.isArray(baseCodingMethod?.fullWebInitialSeedTargetBytes)&&baseCodingMethod.fullWebInitialSeedTargetBytes.length===2&&`coding-full-web-initial-seed-target:${baseCodingMethod.fullWebInitialSeedTargetBytes.join('-')}`,
            baseCodingMethod?.partialTimeoutRecovery===true?'coding-timeout-partial-recovery:YES':'',
            baseCodingMethod?.partialMalformedRecovery===true?'coding-malformed-partial-recovery:YES':'',
            baseCodingMethod?.streamedPartialEditRecovery===true?'coding-streamed-partial-edit-recovery:YES':'',
            baseCodingMethod?.focusedFinalRetry===true?'coding-focused-final-retry:YES':'',
            baseCodingMethod?.focusedMinimalJsonContract===true?'coding-focused-minimal-json:YES':'',
            clean(baseCodingMethod?.contextMode)&&`coding-context-mode:${clean(baseCodingMethod.contextMode)}`,
            Number(baseCodingMethod?.contextBytes)>0&&`coding-context-bytes:${Number(baseCodingMethod.contextBytes)}`,
            Number(baseCodingMethod?.focusedSymbolCount)>0&&`coding-focused-symbol-count:${Number(baseCodingMethod.focusedSymbolCount)}`,
            Number(baseCodingMethod?.fullWebExpansionStages)>0&&`coding-full-web-expansion-stages:${Number(baseCodingMethod.fullWebExpansionStages)}`,
            Number(baseCodingMethod?.fullWebExpansionDocumentSeedRecoveries)>0&&`coding-full-web-expansion-document-seed-recoveries:${Number(baseCodingMethod.fullWebExpansionDocumentSeedRecoveries)}`,
            Number(baseCodingMethod?.fullWebFallbackBestPartialBytes)>0&&`coding-full-web-fallback-best-partial-bytes:${Number(baseCodingMethod.fullWebFallbackBestPartialBytes)}`,
            baseCodingMethod?.fullWebRetryPromptCompacted===true?'coding-full-web-retry-prompt-compacted:YES':'',
            Number(baseCodingMethod?.fullWebRetryPromptBytes)>0&&`coding-full-web-retry-prompt-bytes:${Number(baseCodingMethod.fullWebRetryPromptBytes)}`,
            Number(baseCodingMethod?.intermediateGrowthTotalBytes)>0&&`coding-intermediate-growth-total:${Number(baseCodingMethod.intermediateGrowthTotalBytes)}`,
            Number(baseCodingMethod?.repeatedIntermediateOutputs)>0&&`coding-repeated-intermediate:${Number(baseCodingMethod.repeatedIntermediateOutputs)}`,
            Array.isArray(baseCodingMethod?.expansionStageTargets)&&baseCodingMethod.expansionStageTargets.length&&`coding-expansion-stage-targets:${encodeURIComponent(JSON.stringify(baseCodingMethod.expansionStageTargets.slice(0,8)))}`,
            baseCodingMethod?.candidateProducedFirstAttempt===true?'coding-candidate-first-attempt:YES':baseCodingMethod?'coding-candidate-first-attempt:NO':'',
            Number(baseCodingMethod?.primaryTargets?.length||0)>0&&`coding-primary-target-count:${Number(baseCodingMethod.primaryTargets.length)}`,
            Number(baseCodingMethod?.primaryTargets?.length||0)>0&&`coding-primary-targets:${encodeURIComponent(JSON.stringify(baseCodingMethod.primaryTargets.slice(0,8)))}`,
            Number(baseCodingMethod?.primarySystems?.length||0)>0&&`coding-primary-systems:${encodeURIComponent(JSON.stringify(baseCodingMethod.primarySystems.slice(0,12)))}`,
            Number(baseCodingMethod?.dependentSystems?.length||0)>0&&`coding-dependent-systems:${encodeURIComponent(JSON.stringify(baseCodingMethod.dependentSystems.slice(0,12)))}`,
            Number(baseCodingMethod?.semanticDiffBudget?.allowedSystems?.length||0)>0&&`coding-semantic-system-budget:${Number(baseCodingMethod.semanticDiffBudget.allowedSystems.length)}`,
            clean(baseCodingMethod?.semanticDiffEnforcement?.mode)&&`coding-semantic-diff-mode:${clean(baseCodingMethod.semanticDiffEnforcement.mode)}`,
            baseCodingMethod?.semanticDiffEnforcement?.pass===true?'coding-semantic-diff-pass:YES':baseCodingMethod?.semanticDiffEnforcement?'coding-semantic-diff-pass:NO':'',
            clean(baseCodingMethod?.failureFingerprint)&&`coding-failure-fingerprint:${clean(baseCodingMethod.failureFingerprint)}`,
            clean(baseCodingMethod?.patchRecipeMode)&&`coding-patch-recipe:${clean(baseCodingMethod.patchRecipeMode)}`,
            Number(baseCodingMethod?.verifiedFailureLocalMemoryCount||0)>0&&`coding-verified-failure-memory-count:${Number(baseCodingMethod.verifiedFailureLocalMemoryCount)}`,
            `actions-run:${process.env.GITHUB_RUN_ID}`,
            clean(process.env.RESERVATION_ID)&&`reservation-id:${clean(process.env.RESERVATION_ID)}`,
            `variant:${clean(process.env.VARIANT)||'primary'}`,
            ...(fs.existsSync(clean(process.env.SHARED_CONTEXT_FILE))?(()=>{
              const c=JSON.parse(fs.readFileSync(clean(process.env.SHARED_CONTEXT_FILE),'utf8'));
              return[
                `shared-context-policy:${clean(c?.hashes?.policySha256)}`,
                `shared-context-log-map:${clean(c?.hashes?.logMapSha256)}`,
                `shared-context-architecture:${clean(c?.hashes?.architectureSha256)}`,
                'shared-context-sync:PASS'
              ];
            })():['shared-context-sync:MISSING']),
            ...(route==='analysis-only'?['learning-practice-only','production-pass:NO','source-write:NO']:[ ])
          ].filter(Boolean);
          const workerStartedAt=Number(fs.readFileSync(process.env.WORKER_STARTED_AT_FILE,'utf8'))||Date.now();
          const workerFinishedAt=Date.now();
          const cacheRaw=clean(process.env.OLLAMA_CACHE_HIT).toLowerCase();
          const metrics={
            requestedMax:Number(process.env.REQUESTED_MAX||256),effectiveMax:Number(process.env.EFFECTIVE_MAX||256),reservationId:clean(process.env.RESERVATION_ID),reservedAt:clean(process.env.RESERVED_AT),
            workerStartedAt,workerFinishedAt,checkoutMs:Number(process.env.CHECKOUT_MS||0),modelPrepMs:Number(process.env.MODEL_PREP_MS||0),
            candidateMs:Number(process.env.CANDIDATE_MS||0),qaMs:Number(process.env.QA_MS||0),workerTotalMs:Math.max(0,workerFinishedAt-workerStartedAt),
            changedFileCount:Number(process.env.CHANGED_FILE_COUNT||0),addedLineCount:Number(process.env.ADDED_LINE_COUNT||0),deletedLineCount:Number(process.env.DELETED_LINE_COUNT||0),
            ollamaCacheHit:cacheRaw==='true'?true:cacheRaw==='false'?false:null,ollamaRuntimeSource:clean(process.env.OLLAMA_RUNTIME_SOURCE)||null
          };
          let practiceDistillation=null;
          if(route==='analysis-only'&&fs.existsSync('/tmp/vibe2-practice-distillation.json')){
            const distilled=JSON.parse(fs.readFileSync('/tmp/vibe2-practice-distillation.json','utf8'));
            practiceDistillation={
              version:Number(distilled.version||1),
              kind:clean(distilled.kind),
              accepted:Array.isArray(distilled.accepted)?distilled.accepted:[],
              rejected:Array.isArray(distilled.rejected)?distilled.rejected:[],
              rawCandidateStored:false,
              authorityExpanded:false
            };
          }
          const candidateBranch=clean(process.env.CANDIDATE_BRANCH)||null;
          const baseMainSha=clean(process.env.BASE_SHA)||null;
          const candidateIdentity=candidateOk?{
            taskId:clean(manifest.taskId)||null,
            gameId:clean(manifest.gameId)||null,
            target:clean(manifest.target).toLowerCase()||null,
            sourceRoot:clean(manifest.sourceRoot).replaceAll('\\','/').replace(/^\.\//,'').replace(/\/+$/,'')||null,
            baseMainSha:clean(manifest.baseMainSha)||null,
            manifestPath:candidateManifest||null
          }:null;
          const candidateFailure=sourceGenerationAttempted&&!candidateOk?{class:candidateFailureClass||'OTHER',message:candidateFailureMessage}:null;
          const codingMethod=baseCodingMethod?{
            ...baseCodingMethod,
            implementationPass:candidateOk,
            incrementalQaPass:testOk,
            performanceSanityPass:performanceOk,
            firstCandidatePass:Boolean(candidateOk&&testOk&&performanceOk&&baseCodingMethod.candidateProducedFirstAttempt===true),
            fullRegressionVerified:false,
            reviewVerified:false,
            causalReplayStatus:clean(process.env.IQA_CAUSAL_REPLAY_STATUS)||clean(baseCodingMethod?.causalReplay?.status)||'NOT_REQUIRED',
            causalReplayExecuted:clean(process.env.IQA_CAUSAL_REPLAY_EXECUTED).toUpperCase()==='YES',
            architectureDrift:{
              status:clean(process.env.IQA_ARCHITECTURE_DRIFT_STATUS)||'NOT_AVAILABLE',
              riskLevel:clean(process.env.IQA_ARCHITECTURE_DRIFT_RISK)||'LOW',
              score:Number(process.env.IQA_ARCHITECTURE_DRIFT_SCORE||0),
              signals:clean(process.env.IQA_ARCHITECTURE_DRIFT_SIGNALS).split(',').map(clean).filter(value=>value&&value!=='NONE'),
              hardReject:false,
              focusedReviewRequired:['MEDIUM','HIGH'].includes(clean(process.env.IQA_ARCHITECTURE_DRIFT_RISK).toUpperCase())
            },
            telemetrySource:manifest?.codingMethod?'CANDIDATE_MANIFEST':'WORK_ORDER_FALLBACK'
          }:null;
          const result={version:9,taskId:clean(process.env.TASK_ID),reservationId:clean(process.env.RESERVATION_ID),variant:clean(process.env.VARIANT)||'primary',outcome,blocker,candidateBranch,baseMainSha,candidateIdentity,candidateFailure,evidence,exploration,codingMethod,presentationQuality,roleResults,practiceDistillation,durationMs:metrics.workerTotalMs,metrics};
          const safe=clean(process.env.SAFE_TASK)||'task';
          const file=`/tmp/vibe2-result/result-${safe}-${result.variant}.json`;
          fs.writeFileSync(file,JSON.stringify(result,null,2)+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`file=${file}\n`);
          console.log(`VIBE2_WORKER_RESULT=${outcome}`);
          console.log(`VIBE2_IMPLEMENTATION_ROLE=${roleResults.implementation}`);
          console.log(`VIBE2_TEST_ROLE=${roleResults.test}`);
          console.log(`VIBE2_PERFORMANCE_ROLE=${roleResults.performance}`);
          NODE

      - name: Upload worker result for fan-in
        if: always() && steps.result.outputs.file != ''
        uses: actions/upload-artifact@v4
        with:
          name: vibe2-result-${{ matrix.safeTask }}-${{ matrix.variant }}
          path: ${{ steps.result.outputs.file }}
          if-no-files-found: error
          retention-days: 1

  fan_in:
    needs: [reserve, worker]
    if: always() && needs.reserve.outputs.worker_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: vibe2-control-state-vibe2-unreal-core
      cancel-in-progress: false
    outputs:
      refill: ${{ steps.persist.outputs.refill }}
    steps:
      - name: Mark fan-in start
        shell: bash
        run: echo "$(date +%s%3N)" > /tmp/vibe2-fan-in-start-ms

      - name: Checkout latest Vibe2 control line
        uses: actions/checkout@v4
        with:
          ref: vibe2-unreal-core
          fetch-depth: 0

      - name: Checkout pinned main contract
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.reserve.outputs.contract_sha }}
          path: vibe2-contract
          fetch-depth: 1

      - name: Measure fan-in checkout
        id: fan_checkout_metrics
        shell: bash
        run: |
          now="$(date +%s%3N)"
          start="$(cat /tmp/vibe2-fan-in-start-ms)"
          echo "ms=$((now-start))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download all parallel worker results
        uses: actions/download-artifact@v4
        with:
          pattern: vibe2-result-*
          path: /tmp/vibe2-results
          merge-multiple: true

      - name: Aggregate immutable results
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const dir='/tmp/vibe2-results';
          const files=fs.readdirSync(dir).filter(f=>f.endsWith('.json')).sort();
          const results=files.map(f=>JSON.parse(fs.readFileSync(path.join(dir,f),'utf8')));
          const queue=JSON.parse(fs.readFileSync('.vibe2/queue.json','utf8'));
          fs.writeFileSync('/tmp/vibe2-fan-in.json',JSON.stringify({version:3,results,tasks:queue.tasks||[]},null,2)+'\n');
          console.log(`VIBE2_FAN_IN_RESULT_COUNT=${results.length}`);
          NODE

      - name: Merge outcomes run regression and package review
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-vibe2-fan-in'
          git config user.email 'vibe2-fan-in@users.noreply.github.com'
          git fetch origin vibe2-unreal-core --quiet
          git reset --hard origin/vibe2-unreal-core
          control_root="$GITHUB_WORKSPACE"
          contract_root="$GITHUB_WORKSPACE/vibe2-contract"
          contract_sha="${{ needs.reserve.outputs.contract_sha }}"
          test -n "$contract_sha"
          test "$(git -C "$contract_root" rev-parse HEAD)" = "$contract_sha"

          lane_min='1'
          if [ "$VIBE2_EXECUTION_LANE" = 'game-primary' ]; then lane_min="$VIBE2_OWNER_MINIMUM_WAVE"; fi
          node "$contract_root/tools/vibe2-queue-control.mjs" fan-in \
            --queue="$control_root/.vibe2/queue.json" \
            --control="$control_root/.vibe2/parallelism-control.json" \
            --lane="$VIBE2_EXECUTION_LANE" \
            --min="$lane_min" \
            --input=/tmp/vibe2-fan-in.json | tee /tmp/vibe2-fan-in.log

          # Game-primary candidates require full regression. Auxiliary analysis/practice lanes are source-write:NO and do not mutate production.
          if [ "$VIBE2_EXECUTION_LANE" = 'game-primary' ]; then
            set +e
            (cd "$contract_root" && node --test --test-concurrency=4 \
            qa/vibe2-auto-planner.test.mjs \
            qa/vibe2-core-engine-motion.test.mjs \
            qa/vibe2-source-worker.test.mjs \
            qa/vibe2-exploration-worker.test.mjs \
            qa/vibe2-queue-control.test.mjs \
            qa/vibe2-work-package.test.mjs \
            qa/vibe2-incremental-qa.test.mjs \
            qa/vibe2-parallelism-telemetry.test.mjs \
            qa/vibe2-adaptive-backpressure.test.mjs \
            qa/vibe2-candidate-reconcile.test.mjs \
            qa/vibe2-experience-control.test.mjs \
            qa/vibe2-handoff.test.mjs \
            qa/vibe2-practice-distillation.test.mjs)
          regression_rc=$?
          set -e
          if [ "$regression_rc" -ne 0 ]; then
            node "$contract_root/tools/vibe2-queue-control.mjs" fan-in-regression-fail \
              --queue="$control_root/.vibe2/queue.json" \
              --control="$control_root/.vibe2/parallelism-control.json" \
              --input=/tmp/vibe2-fan-in.json \
              --blocker=fan-in-regression-failed
            git add .vibe2/queue.json .vibe2/parallelism-control.json
            if ! git diff --cached --quiet; then
              git commit -m "vibe2: requeue after fan-in regression failure [skip ci]"
              pushed=0
              for attempt in 1 2 3; do
                if git pull --rebase origin vibe2-unreal-core && git push origin HEAD:vibe2-unreal-core; then pushed=1; break; fi
                git rebase --abort 2>/dev/null || true
                git fetch origin vibe2-unreal-core --quiet
                sleep $((attempt * 2))
              done
              test "$pushed" = 1
            fi
            echo 'VIBE2_REGRESSION_ROLE=FAIL_REQUEUED'
            echo 'VIBE2_REGRESSION_ROLE_SOURCE_WRITE=NO'
            exit "$regression_rc"
          fi
            echo 'VIBE2_REGRESSION_ROLE=PASS'
            echo 'VIBE2_REGRESSION_ROLE_SOURCE_WRITE=NO'
          else
            echo "VIBE2_REGRESSION_ROLE=SKIPPED_AUXILIARY_LANE:$VIBE2_EXECUTION_LANE"
            echo 'VIBE2_REGRESSION_ROLE_SOURCE_WRITE=NO'
          fi

          node "$contract_root/tools/vibe2-practice-distillation.mjs" \
            --fanin=/tmp/vibe2-fan-in.json \
            --store="$control_root/.vibe2/practice-distilled-knowledge.json" | tee /tmp/vibe2-practice-distillation-fanin.log

          if [ "$VIBE2_EXECUTION_LANE" = 'game-primary' ]; then
            node "$contract_root/tools/vibe2-fan-in-review.mjs" \
              --queue="$control_root/.vibe2/queue.json" \
              --input=/tmp/vibe2-fan-in.json \
              --output=/tmp/vibe2-package-review.json | tee /tmp/vibe2-package-review.log
          else
            printf '%s\n' '{"version":1,"releaseCandidates":[],"decision":"AUXILIARY_LANE_NO_RELEASE"}' > /tmp/vibe2-package-review.json
            echo "VIBE2_REVIEW_ROLE=AUXILIARY_NO_RELEASE:$VIBE2_EXECUTION_LANE" | tee /tmp/vibe2-package-review.log
          fi
          echo 'VIBE2_REVIEW_ROLE_SOURCE_WRITE=NO'

          if git diff --quiet -- .vibe2/queue.json .vibe2/parallelism-control.json .vibe2/practice-distilled-knowledge.json; then
            echo 'VIBE2_FAN_IN_QUEUE_WRITE=NO'
          else
            git add .vibe2/queue.json .vibe2/parallelism-control.json .vibe2/practice-distilled-knowledge.json
            git commit -m "vibe2: fan in parallel worker results [skip ci]"
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase origin vibe2-unreal-core && git push origin HEAD:vibe2-unreal-core; then pushed=1; break; fi
              git rebase --abort 2>/dev/null || true
              git fetch origin vibe2-unreal-core --quiet
              sleep $((attempt * 2))
            done
            test "$pushed" = 1
            echo 'VIBE2_FAN_IN_QUEUE_WRITE=YES'
          fi

          node "$contract_root/tools/vibe2-handoff.mjs" --check \
            --runtime="$contract_root/vibe2-runtime.json" \
            --queue="$control_root/.vibe2/queue.json" \
            --control="$control_root/.vibe2/parallelism-control.json" \
            --experience="$control_root/.vibe2/experience.json" \
            --project-lifecycle="$control_root/.vibe2/web-roblox-handoffs.json" \
            --output=/tmp/vibe2-handoff-after-fanin.json >/tmp/vibe2-handoff-after-fanin.log
          node "$contract_root/tools/vibe2-queue-control.mjs" summary \
            --queue="$control_root/.vibe2/queue.json" \
            --control="$control_root/.vibe2/parallelism-control.json" | tee /tmp/vibe2-summary.log
          continue_required="$(sed -n 's/^VIBE2_QUEUE_CONTINUE=//p' /tmp/vibe2-summary.log | tail -n1)"
          if [ "$VIBE2_EXECUTION_LANE" = 'game-primary' ] && [ "${continue_required:-NO}" = 'YES' ]; then
            echo 'refill=1' >> "$GITHUB_OUTPUT"
          else
            echo 'refill=0' >> "$GITHUB_OUTPUT"
          fi
          echo "VIBE2_HIERARCHICAL_FAN_IN=PASS:$VIBE2_EXECUTION_LANE"

      - name: Dispatch reviewed winner candidates to release gate
        if: env.VIBE2_EXECUTION_LANE == 'game-primary'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/vibe2-package-review.json
          node - <<'NODE' > /tmp/vibe2-release-candidates.tsv
          const fs=require('fs');
          const review=JSON.parse(fs.readFileSync('/tmp/vibe2-package-review.json','utf8'));
          for(const row of review.releaseCandidates||[]){
            const taskId=String(row?.taskId||'').trim();
            const candidateBranch=String(row?.candidateBranch||'').trim();
            if(taskId&&candidateBranch)process.stdout.write(taskId+'\t'+candidateBranch+'\n');
          }
          NODE
          count="$(wc -l < /tmp/vibe2-release-candidates.tsv | tr -d ' ')"
          echo "VIBE2_RELEASE_CANDIDATE_COUNT=${count:-0}"
          while IFS=$'\t' read -r task_id candidate_branch; do
            [ -n "$task_id" ] || continue
            [ -n "$candidate_branch" ] || continue
            body="$(jq -nc --arg branch "$candidate_branch" '{ref:"main",inputs:{candidate_branch:$branch}}')"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/vibe2-candidate-release.yml/dispatches" \
              --data "$body"
            echo "VIBE2_RELEASE_DISPATCHED=${task_id}:${candidate_branch}"
          done < /tmp/vibe2-release-candidates.tsv

      - name: Upload generated machine handoff and role review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibe2-machine-handoff-${{ github.run_id }}
          path: |
            /tmp/vibe2-handoff-after-fanin.json
            /tmp/vibe2-handoff-after-fanin.log
            /tmp/vibe2-package-review.json
            /tmp/vibe2-package-review.log
            /tmp/vibe2-practice-distillation-fanin.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Aggregate Vibe2 parallelism telemetry
        if: always()
        continue-on-error: true
        env:
          REQUESTED_MAX: 256
          EFFECTIVE_MAX: ${{ needs.reserve.outputs.effective_max }}
          TASK_COUNT: ${{ needs.reserve.outputs.task_count }}
          FAN_CHECKOUT_MS: ${{ steps.fan_checkout_metrics.outputs.ms }}
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/vibe2-fan-in.json || exit 0
          fan_end="$(date +%s%3N)"
          fan_start="$(cat /tmp/vibe2-fan-in-start-ms)"
          node "$GITHUB_WORKSPACE/vibe2-contract/tools/vibe2-parallelism-telemetry.mjs" --input=/tmp/vibe2-fan-in.json --requested="$REQUESTED_MAX" --effective="${EFFECTIVE_MAX:-256}" --task-count="${TASK_COUNT:-0}" --output=/tmp/vibe2-parallelism-telemetry.json | tee /tmp/vibe2-parallelism-telemetry.log
          node - "$FAN_CHECKOUT_MS" "$((fan_end-fan_start))" <<'NODE2'
          const fs=require('fs');const [checkout,total]=process.argv.slice(2).map(Number);const file='/tmp/vibe2-parallelism-telemetry.json';const x=JSON.parse(fs.readFileSync(file,'utf8'));x.fanIn={checkoutMs:checkout||0,totalMs:total||0};fs.writeFileSync(file,JSON.stringify(x,null,2)+'\n');
          NODE2

      - name: Upload Vibe2 parallelism telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibe2-parallelism-telemetry-${{ github.run_id }}
          path: |
            /tmp/vibe2-parallelism-telemetry.json
            /tmp/vibe2-parallelism-telemetry.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Event-driven fan-in refill fallback
        if: steps.persist.outputs.refill == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(node -e "process.stdout.write(JSON.stringify({event_type:'vibe2-fanin-refill',client_payload:{source_run:process.env.GITHUB_RUN_ID||'',source_attempt:process.env.GITHUB_RUN_ATTEMPT||''}}))")"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
            --data "$payload"
          echo 'VIBE2_EVENT_DRIVEN_REFILL=FANIN_REPOSITORY_DISPATCH'
