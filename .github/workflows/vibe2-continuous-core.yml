name: Vibe2 Continuous Core

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: vibe2-single-game-worker
  cancel-in-progress: false

env:
  VIBE2_LOCAL_MODEL: qwen3:1.7b
  VIBE2_MODEL_MAX_PREDICT: '1536'
  VIBE2_MODEL_TIMEOUT_MS: '240000'
  OLLAMA_HOST: 127.0.0.1:11434

jobs:
  controller:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Vibe2 control line
        uses: actions/checkout@v4
        with:
          ref: vibe2-unreal-core
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-vibe2-core'
          git config user.email 'vibe2-core@users.noreply.github.com'
          echo 'VIBE2_CONTROL_BRANCH=vibe2-unreal-core' >> "$GITHUB_ENV"
          echo 'VIBE2_SEPARATE_FILE_LOCK=NO'
          echo 'VIBE2_MAX_CONCURRENT_GAME_TASKS=1'
          echo 'VIBE2_DIRECT_MAIN_WRITE=NO'

      - name: Core contract preflight
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/vibe2-continuous-runner.mjs
          node --check tools/vibe2-source-worker.mjs
          node --check tools/vibe2-queue-control.mjs
          node --check tools/vibe2-auto-planner.mjs
          node --check tools/vibe2-experience-control.mjs
          node --test qa/vibe2-core-engine-motion.test.mjs
          node --test qa/vibe2-source-worker.test.mjs
          node --test qa/vibe2-queue-control.test.mjs
          node --test qa/vibe2-auto-planner.test.mjs
          node --test qa/vibe2-candidate-reconcile.test.mjs
          node --test qa/vibe2-experience-control.test.mjs

      - name: Plan next work order
        id: order
        shell: bash
        run: |
          set -euo pipefail
          node tools/vibe2-continuous-runner.mjs
          node <<'NODE'
          const fs=require('fs');
          const order=JSON.parse(fs.readFileSync('.vibe2/work-order.json','utf8'));
          const out=process.env.GITHUB_OUTPUT;
          const put=(k,v)=>fs.appendFileSync(out,`${k}=${String(v??'').replaceAll('\n',' ')}\n`);
          put('run',order.run?'true':'false');
          put('reason',order.reason||'');
          if(!order.run)process.exit(0);
          put('task_id',order.taskId);
          put('game_id',order.gameId||'');
          put('target',order.target);
          put('route',order.executionRoute);
          put('source_root',order.source.root);
          put('release_state',order.releaseState||'other');
          put('auto_deploy',order.deployment?.automaticEligible?'true':'false');
          NODE

      - name: Stop when queue has no eligible work
        if: steps.order.outputs.run != 'true'
        run: |
          echo 'VIBE2_WORK=NO_ELIGIBLE_ITEM'
          echo 'VIBE2_STOP_REASON=${{ steps.order.outputs.reason }}'

      - name: Reserve exactly one task
        if: steps.order.outputs.run == 'true'
        env:
          EXPECTED_TASK: ${{ steps.order.outputs.task_id }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/vibe2-queue-control.mjs reserve
          node <<'NODE'
          const fs=require('fs');
          const q=JSON.parse(fs.readFileSync('.vibe2/queue.json','utf8'));
          const running=q.tasks.filter(t=>t.status==='running');
          if(running.length!==1)throw new Error(`expected one running task, got ${running.length}`);
          if(running[0].id!==process.env.EXPECTED_TASK)throw new Error(`reserved wrong task: ${running[0].id}`);
          NODE

      - name: Persist reservation
        if: steps.order.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add .vibe2/queue.json
          git diff --cached --quiet || git commit -m "vibe2: reserve ${{ steps.order.outputs.task_id }} [skip ci]"
          if ! git diff HEAD^ --quiet -- .vibe2/queue.json 2>/dev/null; then
            for attempt in 1 2 3; do
              git pull --rebase origin "$VIBE2_CONTROL_BRANCH"
              git push origin "HEAD:$VIBE2_CONTROL_BRANCH" && break
              test "$attempt" -lt 3
              sleep $((attempt * 2))
            done
          fi

      - name: Verify free budget
        if: steps.order.outputs.run == 'true' && steps.order.outputs.route == 'text-source-worker'
        shell: bash
        run: |
          set -euo pipefail
          node tools/free-budget-telemetry.mjs \
            --verify-public-repo=true \
            --runner=ubuntu-latest \
            --model-calls=1 \
            --runner-minutes=20 \
            --output=.vibe2/free-budget-telemetry.json
          echo 'VIBE2_PAID_API=NO'
          echo 'VIBE2_PAID_RUNNER=NO'

      - name: Generate candidate from current main
        id: candidate
        if: steps.order.outputs.run == 'true' && steps.order.outputs.route == 'text-source-worker'
        continue-on-error: true
        env:
          TASK_ID: ${{ steps.order.outputs.task_id }}
          SOURCE_ROOT: ${{ steps.order.outputs.source_root }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          base_sha="$(git rev-parse origin/main)"
          safe_task="$(printf '%s' "$TASK_ID" | tr -cs 'A-Za-z0-9._-' '-' | sed 's/^-*//;s/-*$//' | cut -c1-60)"
          candidate_branch="vibe2/candidate/${safe_task}-${GITHUB_RUN_ID}"
          candidate_dir="/tmp/vibe2-candidate-${GITHUB_RUN_ID}"
          git worktree add -b "$candidate_branch" "$candidate_dir" origin/main
          mkdir -p "$candidate_dir/.vibe2"
          cp .vibe2/work-order.json "$candidate_dir/.vibe2/work-order.json"

          installed=0
          for attempt in 1 2 3; do
            if curl -fsSL --retry 3 --retry-all-errors --connect-timeout 15 https://ollama.com/install.sh | sh; then installed=1; break; fi
            sleep $((attempt * 4))
          done
          test "$installed" = 1
          nohup ollama serve > /tmp/ollama-vibe2.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            if [ "$i" = 30 ]; then cat /tmp/ollama-vibe2.log || true; exit 1; fi
            sleep 2
          done
          ollama pull "$VIBE2_LOCAL_MODEL"

          cd "$candidate_dir"
          export VIBE2_BASE_MAIN_SHA="$base_sha"
          node "$GITHUB_WORKSPACE/tools/vibe2-source-worker.mjs" --apply-source=true
          git diff --check

          git add "$SOURCE_ROOT" .vibe2/candidates
          git diff --cached --quiet && { echo 'candidate has no source diff' >&2; exit 1; }
          mapfile -t changed < <(git diff --cached --name-only)
          for file in "${changed[@]}"; do
            case "$file" in
              "$SOURCE_ROOT"/*|.vibe2/candidates/*) ;;
              *) echo "candidate escaped approved boundary: $file" >&2; exit 1 ;;
            esac
          done
          git config user.name 'jaewoon-vibe2-worker'
          git config user.email 'vibe2-worker@users.noreply.github.com'
          git commit -m "vibe2: candidate ${TASK_ID}"
          git push origin "HEAD:$candidate_branch"
          candidate_sha="$(git rev-parse HEAD)"
          echo "candidate_branch=$candidate_branch" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "VIBE2_CANDIDATE_BRANCH=$candidate_branch"
          echo "VIBE2_CANDIDATE_SHA=$candidate_sha"
          echo "VIBE2_BASE_MAIN_SHA=$base_sha"

      - name: Keep candidate task running while QA and deployment complete
        if: steps.order.outputs.run == 'true' && steps.order.outputs.route == 'text-source-worker' && steps.candidate.outcome == 'success'
        env:
          TASK_ID: ${{ steps.order.outputs.task_id }}
          CANDIDATE_BRANCH: ${{ steps.candidate.outputs.candidate_branch }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
          BASE_SHA: ${{ steps.candidate.outputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin "$VIBE2_CONTROL_BRANCH"
          node tools/vibe2-queue-control.mjs await \
            --id="$TASK_ID" \
            --blocker=candidate-awaiting-qa-and-deployment \
            --evidence="$CANDIDATE_BRANCH,$CANDIDATE_SHA,base-main-$BASE_SHA,actions-run-${GITHUB_RUN_ID}"
          git add .vibe2/queue.json
          git commit -m "vibe2: await QA for ${TASK_ID} [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin "$VIBE2_CONTROL_BRANCH"
            git push origin "HEAD:$VIBE2_CONTROL_BRANCH" && break
            test "$attempt" -lt 3
            sleep $((attempt * 2))
          done
          echo 'VIBE2_TASK_STATE=RUNNING_AWAITING_QA_DEPLOYMENT'

      - name: Record candidate generation failure
        if: steps.order.outputs.run == 'true' && steps.order.outputs.route == 'text-source-worker' && steps.candidate.outcome != 'success'
        env:
          TASK_ID: ${{ steps.order.outputs.task_id }}
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin "$VIBE2_CONTROL_BRANCH"
          node tools/vibe2-queue-control.mjs fail --id="$TASK_ID" --blocker=source-candidate-generation-failed --evidence="actions-run-${GITHUB_RUN_ID}"
          git add .vibe2/queue.json
          git commit -m "vibe2: record candidate failure ${TASK_ID} [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin "$VIBE2_CONTROL_BRANCH"
            git push origin "HEAD:$VIBE2_CONTROL_BRANCH" && break
            test "$attempt" -lt 3
            sleep $((attempt * 2))
          done

      - name: Block editor route until approved engine editor exists
        if: steps.order.outputs.run == 'true' && steps.order.outputs.route == 'engine-editor'
        env:
          TASK_ID: ${{ steps.order.outputs.task_id }}
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin "$VIBE2_CONTROL_BRANCH"
          node tools/vibe2-queue-control.mjs block --id="$TASK_ID" --blocker=engine-editor-worker-not-connected --evidence="actions-run-${GITHUB_RUN_ID}"
          git add .vibe2/queue.json
          git commit -m "vibe2: block editor task ${TASK_ID} [skip ci]"
          git pull --rebase origin "$VIBE2_CONTROL_BRANCH"
          git push origin "HEAD:$VIBE2_CONTROL_BRANCH"

      - name: Block analysis route until analysis worker exists
        if: steps.order.outputs.run == 'true' && steps.order.outputs.route == 'analysis-only'
        env:
          TASK_ID: ${{ steps.order.outputs.task_id }}
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin "$VIBE2_CONTROL_BRANCH"
          node tools/vibe2-queue-control.mjs block --id="$TASK_ID" --blocker=analysis-worker-not-connected --evidence="actions-run-${GITHUB_RUN_ID}"
          git add .vibe2/queue.json
          git commit -m "vibe2: block analysis task ${TASK_ID} [skip ci]"
          git pull --rebase origin "$VIBE2_CONTROL_BRANCH"
          git push origin "HEAD:$VIBE2_CONTROL_BRANCH"

      - name: Continue immediately only after a retryable failure or non-QA block
        if: always() && steps.order.outputs.run == 'true' && !(steps.order.outputs.route == 'text-source-worker' && steps.candidate.outcome == 'success')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$VIBE2_CONTROL_BRANCH" --quiet
          git show "origin/$VIBE2_CONTROL_BRANCH:.vibe2/queue.json" > /tmp/vibe2-queue.json
          cp /tmp/vibe2-queue.json .vibe2/queue.json
          next="$(node tools/vibe2-queue-control.mjs summary | sed -n 's/^VIBE2_QUEUE_CONTINUE=//p' | tail -n1)"
          if [ "$next" = 'YES' ]; then
            gh workflow run vibe2-24h-runner.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo 'VIBE2_NEXT_RUN_DISPATCHED=YES'
          else
            echo 'VIBE2_NEXT_RUN_DISPATCHED=NO'
          fi
