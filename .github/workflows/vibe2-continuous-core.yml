name: Vibe2 Continuous Core

on:
  workflow_call:
    inputs:
      execution_lane:
        required: false
        type: string
        default: game-primary
      lane_max:
        required: false
        type: string
        default: '256'
  workflow_dispatch:
    inputs:
      execution_lane:
        required: false
        type: choice
        default: game-primary
        options:
          - game-primary
          - learning-idle
          - control-fast
      lane_max:
        required: false
        type: string
        default: '256'
  repository_dispatch:
    types: [vibe2-neuron-complete, vibe2-fanin-refill]
  push:
    branches:
      - 'vibe2/refill/fanin/**'

permissions:
  contents: write
  actions: write

# Collapse duplicate fan-in refill events to one pending workflow while never cancelling
# the currently running control-state mutation.
concurrency:
  group: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'vibe2-fanin-refill' && 'vibe2-fanin-refill-singleton' || format('vibe2-continuous-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  VIBE2_LOCAL_MODEL: qwen3:1.7b
  VIBE2_MODEL_MAX_PREDICT: '3072'
  VIBE2_MODEL_TIMEOUT_MS: '240000'
  VIBE2_MAX_CONCURRENT_GAME_TASKS: '256'
  VIBE2_EXTERNAL_MATRIX_BATCH_MAX: '256'
  VIBE2_GAME_PRIMARY_BASELINE_TARGET: '256'
  VIBE2_GAME_PRIMARY_ADAPTIVE_MIN: '4'
  OLLAMA_HOST: 127.0.0.1:11434
  VIBE2_GAME_DEVELOPMENT_OWNER: VIBE2_VIBE3
  VIBE2_GAME_SOURCE_PROVIDER: LOCAL_OLLAMA
  VIBE2_CODEX_ROLE: SYSTEM_TOOLING_CI_TEST_INFRA_ONLY
  VIBE2_CODEX_GAME_SOURCE_WRITE: FORBIDDEN
  VIBE2_OPENAI_PAID_API_ALLOWED: 'false'
  VIBE2_SHARED_CONTEXT_REQUIRED: 'true'
  VIBE2_EXECUTION_LANE: ${{ inputs.execution_lane || github.event.client_payload.execution_lane || 'game-primary' }}
  VIBE2_LANE_MAX: ${{ inputs.lane_max || '256' }}

jobs:
  reserve:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    concurrency:
      # Atomic callbacks keep unique slots; normal reserve work is isolated by execution lane.
      # GitHub concurrency keeps one pending job per group, so sharing one fallback group across
      # production/recovery/learning can starve another lane before it starts. Shared state writes
      # remain conflict-safe through the existing optimistic fetch/reset/push retry loop.
      group: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'vibe2-neuron-complete' && format('vibe2-neuron-{0}-{1}', github.event.client_payload.source_run, github.event.client_payload.artifact_name) || github.event_name == 'repository_dispatch' && github.event.action == 'vibe2-fanin-refill' && format('vibe2-fanin-{0}', github.run_id) || github.event_name == 'push' && startsWith(github.ref_name, 'vibe2/refill/fanin/') && format('vibe2-fanin-{0}', github.run_id) || format('vibe2-control-state-{0}', inputs.execution_lane || github.event.client_payload.execution_lane || 'game-primary') }}
      cancel-in-progress: false
      queue: max
    outputs:
      worker_matrix: ${{ steps.batch.outputs.worker_matrix }}
      worker_count: ${{ steps.batch.outputs.worker_count }}
      task_count: ${{ steps.batch.outputs.task_count }}
      reserved_at: ${{ steps.batch.outputs.reserved_at }}
      effective_max: ${{ steps.batch.outputs.effective_max }}
      contract_sha: ${{ steps.contract.outputs.sha }}
      model_cache_hit: ${{ steps.ollama_cache_probe.outputs.cache-hit }}
    steps:
      - name: Checkout Vibe2 control line
        uses: actions/checkout@v4
        with:
          ref: vibe2-unreal-core
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download atomic neuron completion result
        if: github.event_name == 'repository_dispatch' && github.event.action == 'vibe2-neuron-complete'
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.client_payload.artifact_name }}
          path: /tmp/vibe2-neuron-result
          github-token: ${{ github.token }}
          run-id: ${{ github.event.client_payload.source_run }}

      - name: Prepare latest main machine contract
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          requested_contract_sha=''
          if [ "${GITHUB_EVENT_NAME:-}" = 'repository_dispatch' ]; then
            dispatch_type="$(node -e "const fs=require('fs');const e=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH,'utf8'));process.stdout.write(String(e.action||''))")"
            if [ "$dispatch_type" = 'vibe2-neuron-complete' ]; then
              requested_contract_sha="$(node -e "const fs=require('fs');const e=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH,'utf8'));process.stdout.write(String(e.client_payload?.contract_sha||''))")"
            fi
          fi
          if [ -n "$requested_contract_sha" ]; then
            git fetch --depth=1 --no-tags origin "$requested_contract_sha" --quiet
          else
            git fetch --depth=1 --no-tags origin main --quiet
          fi
          contract_sha="$(git rev-parse FETCH_HEAD)"
          rm -rf /tmp/vibe2-main
          mkdir -p /tmp/vibe2-main
          git archive "$contract_sha" | tar -x -C /tmp/vibe2-main
          test -f /tmp/vibe2-main/vibe2-runtime.json
          echo "sha=$contract_sha" >> "$GITHUB_OUTPUT"
          echo "VIBE2_CONTINUOUS_CONTRACT_SHA=$contract_sha"
          echo 'VIBE2_MAIN_CONTRACT_SNAPSHOT=ARCHIVE'

      - name: Fast scheduler preflight
        if: github.event_name != 'repository_dispatch' || github.event.action != 'vibe2-neuron-complete'
        shell: bash
        run: |
          set -euo pipefail
          control_root="$GITHUB_WORKSPACE"
          for file in \
            assets/vibe-continuous-queue.js \
            tools/vibe2-auto-planner.mjs \
            tools/company-build-up-directive.mjs \
            tools/vibe2-learning-motor.mjs \
            tools/vibe2-continuous-runner.mjs \
            tools/vibe2-asset-production-plan.mjs \
            tools/vibe2-central-work-contract.mjs \
            tools/vibe2-neural-diagnosis.mjs \
            tools/vibe2-neural-feedback.mjs \
            tools/vibe2-neural-critic.mjs \
            tools/vibe2-neural-root-cause.mjs \
            tools/vibe2-neural-event-router.mjs \
            tools/vibe2-neural-shadow-audit.mjs \
            tools/vibe2-neural-event-telemetry.mjs \
            tools/vibe2-neural-phase2-readiness.mjs \
            tools/vibe2-neural-expansion-readiness.mjs \
            tools/vibe2-exploration-worker.mjs \
            tools/vibe2-source-worker.mjs \
            tools/vibe2-capability-distillation.mjs \
            tools/vibe2-performance-sanity.mjs \
            tools/vibe2-fan-in-review.mjs \
            tools/vibe2-queue-control.mjs \
            tools/vibe2-work-package.mjs \
            tools/vibe2-incremental-qa.mjs \
            tools/vibe2-parallelism-telemetry.mjs \
            tools/vibe2-adaptive-backpressure.mjs \
            tools/vibe2-handoff.mjs \
            tools/vibe2-system-steward.mjs; do
            node --check "/tmp/vibe2-main/$file"
          done
          node /tmp/vibe2-main/tools/vibe2-neural-expansion-readiness.mjs \
            --root=/tmp/vibe2-main \
            --output=/tmp/vibe2-neural-expansion-readiness.json | tee /tmp/vibe2-neural-expansion-readiness.log
          node /tmp/vibe2-main/tools/vibe2-system-steward.mjs \
            --queue="$control_root/.vibe2/queue.json" \
            --control="$control_root/.vibe2/parallelism-control.json" \
            --neural-readiness=/tmp/vibe2-neural-expansion-readiness.json | tee /tmp/vibe2-reserve-preflight-steward.log
          echo 'VIBE2_RESERVE_PREFLIGHT_STEWARD=PASS'
          node /tmp/vibe2-main/tools/vibe2-handoff.mjs --check \
            --runtime=/tmp/vibe2-main/vibe2-runtime.json \
            --queue="$control_root/.vibe2/queue.json" \
            --control="$control_root/.vibe2/parallelism-control.json" \
            --experience="$control_root/.vibe2/experience.json" \
            --project-lifecycle="$control_root/.vibe2/web-roblox-handoffs.json" \
            --output=/tmp/vibe2-handoff-preflight.json >/tmp/vibe2-handoff-preflight.log
          echo 'VIBE2_RESERVE_PREFLIGHT=MAIN_CONTRACT_CONTROL_STATE'

      - name: Reserve conflict-free DAG batch
        id: batch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          control_root="$GITHUB_WORKSPACE"
          test -d "$control_root/.git"
          git -C "$control_root" config user.name 'jaewoon-vibe2-scheduler'
          git -C "$control_root" config user.email 'vibe2-scheduler@users.noreply.github.com'
          echo "VIBE2_CONTROL_ROOT=$control_root"

          callback_ref="${GITHUB_REF_NAME:-}"
          callback_kind='none'
          callback_cleanup='no'
          dispatch_type=''
          if [ "${GITHUB_EVENT_NAME:-}" = 'repository_dispatch' ]; then
            dispatch_type="$(node -e "const fs=require('fs');const e=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH,'utf8'));process.stdout.write(String(e.action||''))")"
          fi
          if [ "${GITHUB_EVENT_NAME:-}" = 'repository_dispatch' ] && [ "$dispatch_type" = 'vibe2-neuron-complete' ]; then
            callback_kind='neuron'
            echo 'VIBE2_ATOMIC_NEURON_CALLBACK=YES'
          elif [ "${GITHUB_EVENT_NAME:-}" = 'repository_dispatch' ] && [ "$dispatch_type" = 'vibe2-fanin-refill' ]; then
            callback_kind='fanin'
            echo 'VIBE2_SLOT_CALLBACK_FANIN=YES'
          elif [ "${GITHUB_EVENT_NAME:-}" = 'push' ] && [[ "$callback_ref" == vibe2/refill/fanin/* ]]; then
            callback_kind='fanin'
            callback_cleanup='yes'
            echo 'VIBE2_SLOT_CALLBACK_FANIN=YES'
          fi

          state_persisted=0
          state_write='NO'
          neuron_refill=0
          for state_attempt in 1 2 3 4 5; do
            echo "VIBE2_CONTROL_OPTIMISTIC_ATTEMPT=$state_attempt/5"
            git -C "$control_root" fetch origin vibe2-unreal-core --quiet
            git -C "$control_root" reset --hard origin/vibe2-unreal-core

            if [ "$callback_kind" = 'neuron' ]; then
              neuron_result_file="$(find /tmp/vibe2-neuron-result -type f -name '*.json' -print -quit)"
              test -n "$neuron_result_file"
              expected_variants="$(node -e "const fs=require('fs');const e=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH,'utf8'));process.stdout.write(String(Math.max(1,Math.min(5,Number(e.client_payload?.expected_variants)||1))))")"
              node /tmp/vibe2-main/tools/vibe2-queue-control.mjs neuron-complete \
                --queue="$control_root/.vibe2/queue.json" \
                --control="$control_root/.vibe2/parallelism-control.json" \
                --lane="$VIBE2_EXECUTION_LANE" \
                --max="$VIBE2_LANE_MAX" \
                --min="$VIBE2_GAME_PRIMARY_ADAPTIVE_MIN" \
                --expected-variants="$expected_variants" \
                --input="$neuron_result_file" | tee /tmp/vibe2-neuron-complete.log
              neuron_reason="$(sed -n 's/^VIBE2_NEURON_RESULT=//p' /tmp/vibe2-neuron-complete.log | tail -n1)"
              case "$neuron_reason" in
                TASK_MICRO_FANIN_COMPLETE)
                  neuron_refill=1
                  echo 'VIBE2_ATOMIC_NEURON_MICRO_FANIN=TASK_MICRO_FANIN_COMPLETE'
                  ;;
                TASK_ALREADY_MICRO_FANIN_COMPLETE)
                  neuron_refill=0
                  echo 'VIBE2_ATOMIC_NEURON_MICRO_FANIN=ALREADY_COMPLETE_DEDUP_NO_REFILL'
                  ;;
                AWAITING_VARIANTS)
                  echo 'VIBE2_ATOMIC_NEURON_MICRO_FANIN=RESULT_RECORDED_PENDING'
                  ;;
                DUPLICATE_VARIANT)
                  echo 'VIBE2_ATOMIC_NEURON_MICRO_FANIN=DUPLICATE_VARIANT_NOOP'
                  ;;
                *)
                  echo "VIBE2_ATOMIC_NEURON_MICRO_FANIN=NOOP:${neuron_reason:-UNKNOWN}"
                  ;;
              esac

              git -C "$control_root" add .vibe2/queue.json .vibe2/parallelism-control.json
              if git -C "$control_root" diff --cached --quiet; then
                state_persisted=1
                state_write='NO'
                break
              fi
              git -C "$control_root" commit -m "vibe2: persist atomic neuron result [skip ci]"
              if git -C "$control_root" push origin HEAD:vibe2-unreal-core; then
                state_persisted=1
                state_write='YES'
                break
              fi
              echo "VIBE2_NEURON_INGRESS_OPTIMISTIC_RETRY=$state_attempt"
              sleep $((state_attempt * 2))
              continue
            fi

            node /tmp/vibe2-main/tools/vibe2-system-steward.mjs \
              --queue="$control_root/.vibe2/queue.json" \
              --control="$control_root/.vibe2/parallelism-control.json" \
              --neural-readiness=/tmp/vibe2-neural-expansion-readiness.json | tee /tmp/vibe2-reserve-steward.log
            echo 'VIBE2_RESERVE_STEWARD=PASS'

            # Every non-neuron reserve ingress must synchronize from the current company runtime
            # before planning or reserving. Otherwise an empty/stale control queue can remain idle
            # until a later fan-in callback even though company-runtime already has actionable work.
            git -C "$control_root" fetch origin company-runtime --quiet
            git -C "$control_root" show origin/company-runtime:development-queue.json > /tmp/vibe2-company-runtime-queue.json
            for runtime_design_path in design game-seed-state.json; do
              if git -C "$control_root" cat-file -e "origin/company-runtime:$runtime_design_path" 2>/dev/null; then
                rm -rf "/tmp/vibe2-main/$runtime_design_path"
                git -C "$control_root" archive "origin/company-runtime" "$runtime_design_path" | tar -x -C /tmp/vibe2-main
              fi
            done
            echo 'VIBE2_RUNTIME_DESIGN_OVERLAY=company-runtime:design,game-seed-state.json'
            echo "VIBE2_RESERVE_RUNTIME_SYNC_SOURCE=company-runtime:$callback_kind"

            # Released Roblox caretakers and active repair work are refilled from the same canonical
            # company-runtime snapshot on manual, callable, refill and fan-in reserve ingress.
            node --check /tmp/vibe2-main/tools/vibe2-post-release-focus.mjs
            node /tmp/vibe2-main/tools/vibe2-post-release-focus.mjs \
              --roadmap=/tmp/vibe2-main/company-learning/platform-release-roadmap.json \
              --company-runtime-queue=/tmp/vibe2-company-runtime-queue.json \
              --historical-registry=/tmp/vibe2-main/company-learning/roblox-sustained-maintenance.json \
              --queue="$control_root/.vibe2/queue.json" \
              --exposure="$control_root/.vibe2/platform-exposure-state.json" \
              --root=/tmp/vibe2-main | tee /tmp/vibe2-reserve-post-release-focus.log
            echo 'VIBE2_RESERVE_FOCUSED_CARETAKER_REFILL=PASS'

            node /tmp/vibe2-main/tools/vibe2-auto-planner.mjs \
              --runtime=/tmp/vibe2-main/vibe2-runtime.json \
              --status=/tmp/vibe2-main/company-status.json \
              --catalog=/tmp/vibe2-main/game-catalog.json \
              --development-queue=/tmp/vibe2-company-runtime-queue.json \
              --queue="$control_root/.vibe2/queue.json" \
              --control="$control_root/.vibe2/parallelism-control.json" \
              --experience="$control_root/.vibe2/experience.json" \
              --historical-registry=/tmp/vibe2-main/company-learning/roblox-sustained-maintenance.json \
              --root=/tmp/vibe2-main \
              --max="$VIBE2_MAX_CONCURRENT_GAME_TASKS" | tee /tmp/vibe2-reserve-autoplan.log
            node /tmp/vibe2-main/tools/vibe2-learning-motor.mjs \
              --state="$control_root/.vibe2/learning-motor-state.json" \
              --experience="$control_root/.vibe2/experience.json" \
              --code-patterns="$control_root/.vibe2/code-pattern-library.json" \
              --company-queue=/tmp/vibe2-company-runtime-queue.json \
              --queue="$control_root/.vibe2/queue.json" \
              --roadmap=/tmp/vibe2-main/company-learning/platform-release-roadmap.json \
              --benchmark="$control_root/.vibe2/benchmark-ladder.json" \
              --practice="$control_root/.vibe2/idle-practice-queue.json" \
              --handoff="$control_root/.vibe2/web-roblox-handoffs.json" | tee /tmp/vibe2-self-signal-mesh.log
            echo 'VIBE2_SELF_SIGNAL_MESH=PASS'
            echo "VIBE2_RESERVE_RUNTIME_SYNC=PASS:$callback_kind"

          node /tmp/vibe2-main/tools/vibe2-handoff.mjs --check \
            --runtime=/tmp/vibe2-main/vibe2-runtime.json \
            --queue="$control_root/.vibe2/queue.json" \
            --control="$control_root/.vibe2/parallelism-control.json" \
            --experience="$control_root/.vibe2/experience.json" \
            --project-lifecycle="$control_root/.vibe2/web-roblox-handoffs.json" \
            --output=/tmp/vibe2-handoff-before-reserve.json >/tmp/vibe2-handoff-before-reserve.log
          active_worker_reservations="$(node -e "const fs=require('fs');const q=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));const requested=String(process.env.VIBE2_EXECUTION_LANE||'game-primary').toUpperCase().replaceAll('-','_');const lane=t=>{const status=String(t.status||'').toLowerCase(),blocker=String(t.blocker||''),dep=String(t.department||'').toLowerCase(),type=String(t.type||'implementation').toLowerCase(),ev=(t.evidence||[]).map(String);if(status==='running'&&/candidate-awaiting-qa-and-deployment|awaiting.*qa|qa.*awaiting|slot-released.*fan-in/i.test(blocker))return'RELEASE_WAIT';if(ev.includes('learning-practice-only')||dep==='learning'||(dep==='development'&&type==='research'))return'LEARNING_IDLE';if(dep==='development'&&type==='implementation')return'GAME_PRIMARY';if(t.systemSteward===true)return'RECOVERY_FAST';return'CONTROL_FAST';};const rows=(q.tasks||[]).filter(t=>String(t.status||'').toLowerCase()==='running'&&String(t.reservationRunId||'').trim()&&!String(t.blocker||'').trim()&&lane(t)===requested);process.stdout.write(String(rows.length))" "$control_root/.vibe2/queue.json")"
          echo "VIBE2_EXECUTION_LANE=$VIBE2_EXECUTION_LANE"
          echo "VIBE2_ACTIVE_LANE_RESERVATIONS_BEFORE_RESERVE=${active_worker_reservations:-0}"
          reservation_id="${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          reserved_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          lane_min='1'
          if [ "$VIBE2_EXECUTION_LANE" = 'game-primary' ]; then lane_min="$VIBE2_GAME_PRIMARY_ADAPTIVE_MIN"; fi
          if [ "${active_worker_reservations:-0}" -gt 0 ]; then
            echo 'VIBE2_RESERVE_MODE=FREE_SLOT_REFILL_DURING_ACTIVE_WORK'
          else
            echo 'VIBE2_RESERVE_MODE=NEW_WAVE_OR_IDLE_REFILL'
          fi
          node /tmp/vibe2-main/tools/vibe2-queue-control.mjs reserve-batch \
            --queue="$control_root/.vibe2/queue.json" \
            --control="$control_root/.vibe2/parallelism-control.json" \
            --lane="$VIBE2_EXECUTION_LANE" \
            --max="$VIBE2_LANE_MAX" \
            --min="$lane_min" \
            --reservation-id="$reservation_id" \
            --reservation-run="$GITHUB_RUN_ID" \
            --reservation-attempt="$GITHUB_RUN_ATTEMPT" \
            --reserved-at="$reserved_at" \
            --output=/tmp/vibe2-batch.json | tee /tmp/vibe2-reserve.log
          node /tmp/vibe2-main/tools/vibe2-handoff.mjs --check \
            --runtime=/tmp/vibe2-main/vibe2-runtime.json \
            --queue="$control_root/.vibe2/queue.json" \
            --control="$control_root/.vibe2/parallelism-control.json" \
            --experience="$control_root/.vibe2/experience.json" \
            --project-lifecycle="$control_root/.vibe2/web-roblox-handoffs.json" \
            --output=/tmp/vibe2-handoff-after-reserve.json >/tmp/vibe2-handoff-after-reserve.log

            state_paths=(
              .vibe2/queue.json
              .vibe2/parallelism-control.json
              .vibe2/learning-motor-state.json
              .vibe2/benchmark-ladder.json
              .vibe2/idle-practice-queue.json
              .vibe2/web-roblox-handoffs.json
            )
            if [ -d "$control_root/.vibe2/build-up-directives" ]; then
              state_paths+=(.vibe2/build-up-directives)
            fi
            if git -C "$control_root" diff --quiet -- "${state_paths[@]}"; then
              state_persisted=1
              state_write='NO'
              break
            fi

            git -C "$control_root" add "${state_paths[@]}"
            git -C "$control_root" commit -m "vibe2: repair state and reserve parallel DAG batch [skip ci]"
            if git -C "$control_root" push origin HEAD:vibe2-unreal-core; then
              state_persisted=1
              state_write='YES'
              break
            fi

            echo "VIBE2_CONTROL_OPTIMISTIC_RETRY=$state_attempt"
            sleep $((state_attempt * 2))
          done
          test "$state_persisted" = 1
          echo "VIBE2_BATCH_RESERVATION_WRITE=$state_write"

          if [ "$callback_kind" = 'neuron' ]; then
            node <<'NODE'
          const fs=require('fs');
          const payload={
            version:1,
            createdAt:new Date().toISOString(),
            matrix:[],
            scheduler:{requestedMaxConcurrentTasks:0,effectiveMaxConcurrentTasks:0,longWorkProtectedSlotUsed:false}
          };
          fs.writeFileSync('/tmp/vibe2-batch.json',JSON.stringify(payload,null,2)+'\n');
          NODE
            if [ "$neuron_refill" = '1' ]; then
              payload="$(node -e "process.stdout.write(JSON.stringify({event_type:'vibe2-fanin-refill',client_payload:{source_run:process.env.GITHUB_RUN_ID||'',execution_lane:process.env.VIBE2_EXECUTION_LANE||'game-primary',reason:'atomic-task-micro-fanin-complete'}}))")"
              curl --fail-with-body --silent --show-error \
                --request POST \
                --header 'Accept: application/vnd.github+json' \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
                --data "$payload"
              echo 'VIBE2_NEURON_REFILL_DISPATCH=TASK_MICRO_FANIN_COMPLETE'
            else
              echo 'VIBE2_NEURON_REFILL_DISPATCH=SKIPPED_PENDING_VARIANTS'
            fi
          fi

          if [ "$callback_cleanup" = 'yes' ]; then
            git -C "$control_root" push origin --delete "$callback_ref" >/dev/null 2>&1 || true
            echo "VIBE2_SLOT_CALLBACK_CLEANUP=$callback_ref"
          fi

          node <<'NODE'
          const fs=require('fs');
          const out=process.env.GITHUB_OUTPUT;
          const batch=JSON.parse(fs.readFileSync('/tmp/vibe2-batch.json','utf8'));
          const workers=[];
          const safe=value=>String(value||'task').replace(/[^A-Za-z0-9._-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60)||'task';
          for(const row of batch.matrix||[]){
            const safeTask=safe(row.taskId);
            const variantCount=Math.max(1,Math.min(5,Number(row.speculativeVariants||1)));
            const shared={taskId:row.taskId,safeTask,shard:row.shard,packageId:row.packageId||'',packageRole:row.packageRole||'',longWorkProtected:row.longWorkProtected===true,reservationId:row.reservationId||'',reservationRunId:row.reservationRunId||'',reservationRunAttempt:Number(row.reservationRunAttempt||0),reservedAt:row.reservedAt||batch.createdAt,requestedMax:Number(batch.scheduler?.requestedMaxConcurrentTasks||256),effectiveMax:Number(batch.scheduler?.effectiveMaxConcurrentTasks||256),expectedVariants:variantCount};
            workers.push({...shared,variant:'primary'});
            for(let i=1;i<variantCount;i++)workers.push({...shared,variant:`speculative-${i}`});
          }
          fs.appendFileSync(out,`worker_matrix=${JSON.stringify({include:workers})}\n`);
          fs.appendFileSync(out,`worker_count=${workers.length}\n`);
          fs.appendFileSync(out,`task_count=${(batch.matrix||[]).length}\n`);
          fs.appendFileSync(out,`reserved_at=${batch.createdAt||''}\n`);
          fs.appendFileSync(out,`effective_max=${Number(batch.scheduler?.effectiveMaxConcurrentTasks||256)}\n`);
          console.log(`VIBE2_HIERARCHICAL_FAN_OUT=${workers.length}`);
          console.log(`VIBE2_RESERVED_TASK_COUNT=${(batch.matrix||[]).length}`);
          console.log(`VIBE2_PRIMARY_TASK_COUNT=${Number(batch.scheduler?.primaryTaskCount||(batch.matrix||[]).length)}`);
          console.log(`VIBE2_SPECULATIVE_WORKER_COUNT=${Math.max(0,workers.length-Number(batch.scheduler?.primaryTaskCount||(batch.matrix||[]).length))}`);
          console.log(`VIBE2_SPECULATIVE_EXPANSION=${batch.scheduler?.speculativeExpansionAllowed===false?'SUPPRESSED_RUNNER_PRESSURE':'ENABLED'}`);
          console.log(`VIBE2_SPECULATIVE_EXPANSION_REASON=${String(batch.scheduler?.speculativeExpansionReason||'AVAILABLE')}`);
          console.log(`VIBE2_LONG_WORK_PROTECTED_SLOT=${batch.scheduler?.longWorkProtectedSlotUsed?'USED':'NOT_USED'}`);
          NODE

      - name: Probe shared Ollama cache from reserve runner
        id: ollama_cache_probe
        if: steps.batch.outputs.worker_count != '0'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.ollama/models
            ~/.cache/vibe2-ollama/bin/ollama
            ~/.cache/vibe2-ollama/lib/ollama
          key: vibe2-ollama-v3-Linux-qwen3-1.7b
          lookup-only: true

      - name: Record reserve model cache decision
        if: steps.batch.outputs.worker_count != '0'
        shell: bash
        run: |
          echo 'VIBE2_MODEL_CACHE_RESERVE_PROBE_LOOKUP_ONLY=YES'
          echo "VIBE2_MODEL_CACHE_RESERVE_PROBE_HIT=${{ steps.ollama_cache_probe.outputs.cache-hit }}"
          if [ "${{ steps.ollama_cache_probe.outputs.cache-hit }}" = 'true' ]; then
            echo 'VIBE2_MODEL_CACHE_WARMUP_DECISION=SKIP_CACHE_HIT'
          else
            echo 'VIBE2_MODEL_CACHE_WARMUP_DECISION=RUN_CACHE_MISS'
          fi

  model_cache:
    needs: reserve
    if: needs.reserve.outputs.worker_count != '0' && needs.reserve.outputs.model_cache_hit != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    continue-on-error: true
    steps:
      - name: Recheck or persist shared Ollama runtime cache
        id: ollama_cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.ollama/models
            ~/.cache/vibe2-ollama/bin/ollama
            ~/.cache/vibe2-ollama/lib/ollama
          key: vibe2-ollama-v3-Linux-qwen3-1.7b
          lookup-only: true

      - name: Record model cache probe
        shell: bash
        run: |
          echo 'VIBE2_MODEL_CACHE_WARMUP_LOOKUP_ONLY=YES'
          echo "VIBE2_MODEL_CACHE_WARMUP_HIT=${{ steps.ollama_cache.outputs.cache-hit }}"
          echo 'VIBE2_MODEL_CACHE_WARMUP_JOB=RUN_CACHE_MISS'

      - name: Warm local coding model once on cache miss
        if: steps.ollama_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          installed=0
          for attempt in 1 2 3; do
            if curl -fsSL --retry 3 --retry-all-errors --connect-timeout 15 https://ollama.com/install.sh | sh; then installed=1; break; fi
            sleep $((attempt * 4))
          done
          test "$installed" = 1
          mkdir -p "$HOME/.cache/vibe2-ollama/bin" "$HOME/.cache/vibe2-ollama/lib/ollama"
          cp "$(command -v ollama)" "$HOME/.cache/vibe2-ollama/bin/ollama"
          chmod +x "$HOME/.cache/vibe2-ollama/bin/ollama"
          runtime_lib=""
          for candidate in /usr/local/lib/ollama /usr/lib/ollama; do
            if [ -d "$candidate" ] && find "$candidate" -type f -name 'llama-server' -perm -u+x -print -quit | grep -q .; then
              runtime_lib="$candidate"
              break
            fi
          done
          test -n "$runtime_lib"
          cp -a "$runtime_lib/." "$HOME/.cache/vibe2-ollama/lib/ollama/"
          find "$HOME/.cache/vibe2-ollama/lib/ollama" -type f -name 'llama-server' -perm -u+x -print -quit | grep -q .
          nohup ollama serve > /tmp/ollama-prewarm.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            if [ "$i" = 30 ]; then cat /tmp/ollama-prewarm.log || true; exit 1; fi
            sleep 2
          done
          ollama pull "$VIBE2_LOCAL_MODEL"
          echo 'VIBE2_MODEL_PREWARM=PASS'

  worker:
    needs: [reserve, model_cache]
    if: always() && needs.reserve.outputs.worker_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.reserve.outputs.worker_matrix) }}
    steps:
      - name: Mark worker start
        shell: bash
        run: echo "$(date +%s%3N)" > /tmp/vibe2-worker-start-ms

      - name: Checkout Vibe2 control line
        uses: actions/checkout@v4
        with:
          ref: vibe2-unreal-core
          fetch-depth: 1
          sparse-checkout: |
            .vibe2

      - name: Checkout pinned main contract
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.reserve.outputs.contract_sha }}
          path: vibe2-contract
          fetch-depth: 1

      - name: Measure worker checkout
        id: checkout_metrics
        shell: bash
        run: |
          now="$(date +%s%3N)"
          start="$(cat /tmp/vibe2-worker-start-ms)"
          echo "ms=$((now-start))" >> "$GITHUB_OUTPUT"
          echo 'VIBE2_CONTROL_CHECKOUT_SCOPE=STATE_ONLY'
          echo 'VIBE2_WORKER_EXECUTABLE_CODE_SOURCE=PINNED_MAIN_CONTRACT'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Synchronize worker with Vibe before work
        env:
          TASK_ID: ${{ matrix.taskId }}
          RESERVATION_ID: ${{ matrix.reservationId }}
          RESERVATION_RUN_ID: ${{ matrix.reservationRunId }}
          RESERVATION_RUN_ATTEMPT: ${{ matrix.reservationRunAttempt }}
          RESERVED_AT: ${{ matrix.reservedAt }}
          CONTRACT_SHA: ${{ needs.reserve.outputs.contract_sha }}
        shell: bash
        run: |
          set -euo pipefail
          contract_root="$GITHUB_WORKSPACE/vibe2-contract"
          test -n "$CONTRACT_SHA"
          test "$(git -C "$contract_root" rev-parse HEAD)" = "$CONTRACT_SHA"
          (
            cd "$contract_root"
            node tools/company-shared-context.mjs --output=/tmp/vibe2-worker-shared-context.json | tee /tmp/vibe2-worker-shared-context.log
          )
          grep -q '^WORKER_CONTEXT_SYNC=PASS$' /tmp/vibe2-worker-shared-context.log
          node "$contract_root/tools/vibe2-queue-control.mjs" verify-worker-sync             --queue="$GITHUB_WORKSPACE/.vibe2/queue.json"             --id="$TASK_ID"             --reservation-id="$RESERVATION_ID"             --reservation-run="$RESERVATION_RUN_ID"             --reservation-attempt="$RESERVATION_RUN_ATTEMPT"             --reserved-at="$RESERVED_AT" | tee /tmp/vibe2-worker-sync.log
          grep -q '^VIBE2_WORKER_SYNC=PASS$' /tmp/vibe2-worker-sync.log
          echo "VIBE2_WORKER_CONTRACT_SHA=$CONTRACT_SHA"
          echo 'VIBE2_WORKER_PREFLIGHT_SYNC=PASS'

      - name: Enforce canonical constitution before source write
        shell: bash
        run: |
          set -euo pipefail
          contract_root="$GITHUB_WORKSPACE/vibe2-contract"
          cd "$contract_root"
          node --check tools/company-constitution-enforcer.mjs
          node tools/company-constitution-enforcer.mjs --phase=worker-before-source-write

      - name: Restore shared Ollama runtime cache
        id: worker_ollama_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.ollama/models
            ~/.cache/vibe2-ollama/bin/ollama
            ~/.cache/vibe2-ollama/lib/ollama
          key: vibe2-ollama-v3-Linux-qwen3-1.7b

      - name: Prepare cached Ollama runtime
        id: worker_ollama_runtime
        shell: bash
        run: |
          set -euo pipefail
          prep_started="$(date +%s%3N)"
          cached="$HOME/.cache/vibe2-ollama/bin/ollama"
          cached_lib="$HOME/.cache/vibe2-ollama/lib/ollama"
          if [ -x "$cached" ] && [ -d "$cached_lib" ] && find "$cached_lib" -type f -name 'llama-server' -perm -u+x -print -quit | grep -q .; then
            sudo mkdir -p /usr/local/lib/ollama
            sudo cp -a "$cached_lib/." /usr/local/lib/ollama/
            echo "$HOME/.cache/vibe2-ollama/bin" >> "$GITHUB_PATH"
            echo 'VIBE2_OLLAMA_RUNTIME_SOURCE=CACHE'
            echo 'source=CACHE' >> "$GITHUB_OUTPUT"
          else
            installed=0
            for attempt in 1 2 3; do
              if curl -fsSL --retry 3 --retry-all-errors --connect-timeout 15 https://ollama.com/install.sh | sh; then installed=1; break; fi
              sleep $((attempt * 4))
            done
            test "$installed" = 1
            mkdir -p "$HOME/.cache/vibe2-ollama/bin" "$cached_lib"
            cp "$(command -v ollama)" "$cached"
            chmod +x "$cached"
            runtime_lib=""
            for candidate in /usr/local/lib/ollama /usr/lib/ollama; do
              if [ -d "$candidate" ] && find "$candidate" -type f -name 'llama-server' -perm -u+x -print -quit | grep -q .; then
                runtime_lib="$candidate"
                break
              fi
            done
            test -n "$runtime_lib"
            cp -a "$runtime_lib/." "$cached_lib/"
            find "$cached_lib" -type f -name 'llama-server' -perm -u+x -print -quit | grep -q .
            echo "$HOME/.cache/vibe2-ollama/bin" >> "$GITHUB_PATH"
            echo 'VIBE2_OLLAMA_RUNTIME_SOURCE=FALLBACK_INSTALL'
            echo 'source=FALLBACK_INSTALL' >> "$GITHUB_OUTPUT"
          fi
          prep_finished="$(date +%s%3N)"
          echo "duration_ms=$((prep_finished-prep_started))" >> "$GITHUB_OUTPUT"

      - name: Build reserved task work order
        id: order
        env:
          TASK_ID: ${{ matrix.taskId }}
          VARIANT: ${{ matrix.variant }}
          SAFE_TASK: ${{ matrix.safeTask }}
          VIBE2_BASE_MAIN_SHA: ${{ needs.reserve.outputs.contract_sha }}
        shell: bash
        run: |
          set -euo pipefail
          contract_root="$GITHUB_WORKSPACE/vibe2-contract"
          node "$contract_root/tools/vibe2-continuous-runner.mjs" \
            --runtime="$contract_root/vibe2-runtime.json" \
            --queue="$GITHUB_WORKSPACE/.vibe2/queue.json" \
            --control="$GITHUB_WORKSPACE/.vibe2/parallelism-control.json" \
            --experience="$GITHUB_WORKSPACE/.vibe2/experience.json" \
            --project-lifecycle="$GITHUB_WORKSPACE/.vibe2/web-roblox-handoffs.json" \
            --task-id="$TASK_ID" \
            --variant="$VARIANT" \
            --output=/tmp/vibe2-work-order.json | tee /tmp/vibe2-order.log
          node <<'NODE'
          const fs=require('fs');
          const order=JSON.parse(fs.readFileSync('/tmp/vibe2-work-order.json','utf8'));
          const out=process.env.GITHUB_OUTPUT;
          const put=(k,v)=>fs.appendFileSync(out,`${k}=${String(v??'').replaceAll('\n',' ')}\n`);
          put('run',order.run?'true':'false');
          put('reason',order.reason||'');
          put('task_id',order.taskId||process.env.TASK_ID||'');
          put('safe_task',process.env.SAFE_TASK||'');
          put('game_id',order.gameId||'');
          put('target',order.target||'');
          put('route',order.executionRoute||'');
          put('source_root',order.source?.root||'');
          put('work_lock_required',order.compiledWorkContract?.workLock?.requiredBeforeSourceWrite===true?'true':'false');
          put('work_lock_base_sha',order.compiledWorkContract?.workLock?.baseSha||'');
          put('release_state',order.releaseState||'other');
          put('cache_namespace',order.incrementalQa?.cacheNamespace||`${order.target||'unknown'}:${order.gameId||'global'}`);
          put('variant',process.env.VARIANT||'primary');
          NODE

      - name: Acquire shared Work Lock before source write
        id: work_lock
        if: steps.order.outputs.run == 'true' && steps.order.outputs.route == 'text-source-worker'
        env:
          GH_TOKEN: ${{ github.token }}
          CONTRACT_SHA: ${{ needs.reserve.outputs.contract_sha }}
        shell: bash
        run: |
          set -euo pipefail
          contract_root="$GITHUB_WORKSPACE/vibe2-contract"
          node <<'NODE' > /tmp/vibe2-work-lock-request.env
          const fs=require('fs');
          const order=JSON.parse(fs.readFileSync('/tmp/vibe2-work-order.json','utf8'));
          const lock=order?.compiledWorkContract?.workLock||{};
          if(lock.requiredBeforeSourceWrite!==true)throw new Error('WORK_LOCK_REQUIRED_CONTRACT_MISSING');
          if(!lock.taskId||!lock.baseSha||!Array.isArray(lock.files)||!lock.files.length)throw new Error('WORK_LOCK_IDENTITY_INCOMPLETE');
          const emit=(key,value)=>process.stdout.write(key+'='+JSON.stringify(String(value??''))+'\n');
          emit('LOCK_TASK',lock.taskId);
          emit('LOCK_GAME',lock.gameId||order.gameId||'');
          emit('LOCK_FILES',lock.files.join(','));
          emit('LOCK_BASE_SHA',lock.baseSha);
          emit('LOCK_CHANGE_SET',order?.compiledWorkContract?.changeSet?.id||lock.taskId);
          NODE
          source /tmp/vibe2-work-lock-request.env
          test -n "$LOCK_TASK"
          test -n "$LOCK_FILES"
          test -n "$LOCK_BASE_SHA"
          test "$LOCK_BASE_SHA" = "$CONTRACT_SHA"
          node "$contract_root/tools/vibe2-remote-work-lock.mjs" acquire \
            --worker=vibe2 \
            --task="$LOCK_TASK" \
            --game="$LOCK_GAME" \
            --files="$LOCK_FILES" \
            --base-sha="$LOCK_BASE_SHA" \
            --evidence="compiled-central-work-contract,change-set:$LOCK_CHANGE_SET" | tee /tmp/vibe2-work-lock-acquire.log
          acquired="$(sed -n 's/^VIBE_REMOTE_WORK_LOCK_ACQUIRED=//p' /tmp/vibe2-work-lock-acquire.log | tail -n1)"
          lock_id="$(sed -n 's/^VIBE_REMOTE_WORK_LOCK_ID=//p' /tmp/vibe2-work-lock-acquire.log | tail -n1)"
          reason="$(sed -n 's/^VIBE_REMOTE_WORK_LOCK_REASON=//p' /tmp/vibe2-work-lock-acquire.log | tail -n1)"
          if [ "$acquired" = 'YES' ]; then
            echo 'acquired=true' >> "$GITHUB_OUTPUT"
          else
            echo 'acquired=false' >> "$GITHUB_OUTPUT"
          fi
          echo "lock_id=$lock_id" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "VIBE2_SHARED_WORK_LOCK_ACQUIRED=${acquired:-NO}"
          echo "VIBE2_SHARED_WORK_LOCK_REASON=${reason:-UNKNOWN}"

      - name: Run isolated learning practice
        id: practice
        if: steps.order.outputs.run == 'true' && (steps.order.outputs.route == 'analysis-only' || steps.order.outputs.route == 'learning-web-artifact')
        continue-on-error: true
        env:
          SAFE_TASK: ${{ matrix.safeTask }}
          VARIANT: ${{ matrix.variant }}
        shell: bash
        run: |
          set -euo pipefail
          contract_root="$GITHUB_WORKSPACE/vibe2-contract"
          command -v ollama >/dev/null
          nohup ollama serve > "/tmp/ollama-practice-${SAFE_TASK}-${VARIANT}.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            if [ "$i" = 30 ]; then cat "/tmp/ollama-practice-${SAFE_TASK}-${VARIANT}.log" || true; exit 1; fi
            sleep 2
          done
          if ! ollama list | awk 'NR>1 {print $1}' | grep -Fqx "$VIBE2_LOCAL_MODEL"; then
            ollama pull "$VIBE2_LOCAL_MODEL"
          fi
          practice_route="$(node -e "const fs=require('fs');const o=JSON.parse(fs.readFileSync('/tmp/vibe2-work-order.json','utf8'));process.stdout.write(String(o.executionRoute||''))")"
          artifact_dir="/tmp/vibe2-practice-web-${SAFE_TASK}-${VARIANT}"
          node "$contract_root/tools/vibe2-learning-practice-worker.mjs" \
            --order=/tmp/vibe2-work-order.json \
            --output=/tmp/vibe2-learning-practice-result.json \
            --artifact-dir="$artifact_dir"
          test -f /tmp/vibe2-learning-practice-result.json
          if [ "$practice_route" = 'learning-web-artifact' ]; then
            test -s "$artifact_dir/index.html"
          fi
          node "$contract_root/tools/vibe2-practice-distillation.mjs" \
            --result=/tmp/vibe2-learning-practice-result.json \
            --order=/tmp/vibe2-work-order.json \
            --experience=.vibe2/experience.json \
            --patterns=.vibe2/code-pattern-library.json \
            --knowledge=.vibe2/game-study-knowledge.json \
            --output=/tmp/vibe2-practice-distillation.json
          test -f /tmp/vibe2-practice-distillation.json
          echo 'VIBE2_ANALYSIS_WORKER=PRACTICE_ONLY'
          echo 'VIBE2_PRACTICE_PRODUCTION_PASS=NO'
          echo 'VIBE2_PRACTICE_CANONICAL_CANDIDATE_PERSISTED=NO'
          if [ "$practice_route" = 'learning-web-artifact' ]; then
            echo 'VIBE2_PRACTICE_EPHEMERAL_WEB_ARTIFACT=YES'
          else
            echo 'VIBE2_PRACTICE_EPHEMERAL_WEB_ARTIFACT=NO'
          fi

      - name: Upload ephemeral Web practice artifact
        if: always() && steps.order.outputs.route == 'learning-web-artifact'
        uses: actions/upload-artifact@v4
        with:
          name: vibe2-practice-web-${{ matrix.safeTask }}-${{ matrix.variant }}
          path: |
            /tmp/vibe2-practice-web-${{ matrix.safeTask }}-${{ matrix.variant }}/index.html
            /tmp/vibe2-learning-practice-result.json
          if-no-files-found: warn
          retention-days: 1

      - name: Build task-local exploration handoff
        id: local_exploration
        if: steps.order.outputs.run == 'true' && steps.order.outputs.route == 'text-source-worker'
        env:
          TASK_ID: ${{ steps.order.outputs.task_id }}
          SAFE_TASK: ${{ matrix.safeTask }}
          CONTRACT_SHA: ${{ needs.reserve.outputs.contract_sha }}
        shell: bash
        run: |
          set -euo pipefail
          contract_root="$GITHUB_WORKSPACE/vibe2-contract"
          base_sha="$CONTRACT_SHA"
          test -n "$base_sha"
          test "$(git -C "$contract_root" rev-parse HEAD)" = "$base_sha"
          explore_dir="/tmp/vibe2-worker-explore-${SAFE_TASK}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git -C "$contract_root" worktree add --detach "$explore_dir" "$base_sha"
          mkdir -p "$explore_dir/.vibe2" /tmp/vibe2-exploration
          cp /tmp/vibe2-work-order.json "$explore_dir/.vibe2/work-order.json"
          cd "$explore_dir"
          export VIBE2_BASE_MAIN_SHA="$base_sha"
          node "$contract_root/tools/vibe2-exploration-worker.mjs" \
            --order=.vibe2/work-order.json \
            --output=/tmp/vibe2-exploration/vibe2-exploration.json | tee /tmp/vibe2-exploration.log
          test -s /tmp/vibe2-exploration/vibe2-exploration.json
          echo 'VIBE2_TASK_LOCAL_EXPLORATION=PASS'
          echo "VIBE2_BASE_MAIN_SHA=$base_sha"

      - name: Verify free execution budget
        if: steps.order.outputs.run == 'true' && steps.order.outputs.route == 'text-source-worker'
        shell: bash
        run: |
          set -euo pipefail
          contract_root="$GITHUB_WORKSPACE/vibe2-contract"
          node "$contract_root/tools/free-budget-telemetry.mjs" \
            --verify-public-repo=true \
            --runner=ubuntu-latest \
            --model-calls=1 \
            --runner-minutes=22 \
            --output=/tmp/vibe2-free-budget.json
          echo 'VIBE2_PAID_API=NO'
          echo 'VIBE2_PAID_RUNNER=NO'
          echo 'VIBE2_PARALLELISM_POLICY=UNBOUNDED_BY_POLICY'
          echo "VIBE2_EXTERNAL_MATRIX_BATCH_MAX=$VIBE2_EXTERNAL_MATRIX_BATCH_MAX"
          echo 'VIBE2_FREE_AI_SCALE=ONE_WORKER_PER_INDEPENDENT_TASK'
          test "$VIBE2_GAME_DEVELOPMENT_OWNER" = "VIBE2_VIBE3"
          test "$VIBE2_GAME_SOURCE_PROVIDER" = "LOCAL_OLLAMA"
          test "$VIBE2_CODEX_ROLE" = "SYSTEM_TOOLING_CI_TEST_INFRA_ONLY"
          test "$VIBE2_CODEX_GAME_SOURCE_WRITE" = "FORBIDDEN"
          test "$VIBE2_OPENAI_PAID_API_ALLOWED" = "false"
          echo 'VIBE2_GAME_SOURCE_AUTHORITY=PASS'
          echo 'VIBE2_CODEX_ROLE=SYSTEM_TOOLING_CI_TEST_INFRA_ONLY'

      - name: Generate isolated candidate from pinned main contract
        id: candidate
        if: steps.order.outputs.run == 'true' && steps.order.outputs.route == 'text-source-worker' && steps.work_lock.outputs.acquired == 'true'
        continue-on-error: true
        env:
          TASK_ID: ${{ steps.order.outputs.task_id }}
          SAFE_TASK: ${{ matrix.safeTask }}
          SOURCE_ROOT: ${{ steps.order.outputs.source_root }}
          VARIANT: ${{ matrix.variant }}
          CONTRACT_SHA: ${{ needs.reserve.outputs.contract_sha }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_started="$(date +%s%3N)"
          contract_root="$GITHUB_WORKSPACE/vibe2-contract"
          base_sha="$CONTRACT_SHA"
          test -n "$base_sha"
          test "$(git -C "$contract_root" rev-parse HEAD)" = "$base_sha"
          candidate_branch="vibe2/candidate/${SAFE_TASK}-${VARIANT}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          candidate_dir="/tmp/vibe2-candidate-${SAFE_TASK}-${VARIANT}-${GITHUB_RUN_ID}"
          git -C "$contract_root" worktree add -b "$candidate_branch" "$candidate_dir" "$base_sha"
          mkdir -p "$candidate_dir/.vibe2"
          cp /tmp/vibe2-work-order.json "$candidate_dir/.vibe2/work-order.json"
          cp /tmp/vibe2-exploration/vibe2-exploration.json "$candidate_dir/.vibe2/exploration.json"

          test "$VIBE2_GAME_DEVELOPMENT_OWNER" = "VIBE2_VIBE3" || { echo "GAME_DEVELOPMENT_OWNER_INVALID=$VIBE2_GAME_DEVELOPMENT_OWNER" >&2; exit 1; }
          test "$VIBE2_GAME_SOURCE_PROVIDER" = "LOCAL_OLLAMA" || { echo "GAME_SOURCE_PROVIDER_INVALID=$VIBE2_GAME_SOURCE_PROVIDER" >&2; exit 1; }
          test "$VIBE2_CODEX_GAME_SOURCE_WRITE" = "FORBIDDEN" || { echo "CODEX_GAME_SOURCE_WRITE_FORBIDDEN=$VIBE2_CODEX_GAME_SOURCE_WRITE" >&2; exit 1; }
          test "$VIBE2_OPENAI_PAID_API_ALLOWED" = "false" || { echo "OPENAI_PAID_API_GAME_SOURCE_FORBIDDEN=$VIBE2_OPENAI_PAID_API_ALLOWED" >&2; exit 1; }
          echo 'VIBE2_GAME_DEVELOPMENT_OWNER=VIBE2_VIBE3'
          echo 'VIBE2_GAME_SOURCE_PROVIDER=LOCAL_OLLAMA'
          echo 'VIBE2_CODEX_GAME_SOURCE_WRITE=FORBIDDEN'

          command -v ollama >/dev/null
          nohup ollama serve > "/tmp/ollama-${SAFE_TASK}-${VARIANT}.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            if [ "$i" = 30 ]; then cat "/tmp/ollama-${SAFE_TASK}-${VARIANT}.log" || true; exit 1; fi
            sleep 2
          done
          if ollama list | awk 'NR>1 {print $1}' | grep -Fqx "$VIBE2_LOCAL_MODEL"; then
            echo 'VIBE2_LOCAL_MODEL_SOURCE=CACHE'
          else
            echo 'VIBE2_LOCAL_MODEL_SOURCE=FALLBACK_PULL'
            ollama pull "$VIBE2_LOCAL_MODEL"
          fi

          cd "$candidate_dir"
          node --check tools/company-shared-context.mjs
          node tools/company-shared-context.mjs --output="/tmp/vibe2-shared-context-${SAFE_TASK}-${VARIANT}-before.json" | tee "/tmp/vibe2-shared-context-${SAFE_TASK}-${VARIANT}-before.log"
          export VIBE2_BASE_MAIN_SHA="$base_sha"
          export VIBE2_SPECULATIVE_VARIANT="$VARIANT"
          export VIBE2_EXPLORATION_FILE=.vibe2/exploration.json
          source_worker_log="/tmp/vibe2-source-worker-${SAFE_TASK}-${VARIANT}.log"
          echo "candidate_dir=$candidate_dir" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          set +e
          node "$GITHUB_WORKSPACE/vibe2-contract/tools/vibe2-source-worker.mjs" --apply-source=true 2>&1 | tee "$source_worker_log"
          worker_rc=${PIPESTATUS[0]}
          set -e
          candidate_finished="$(date +%s%3N)"
          echo "duration_ms=$((candidate_finished-candidate_started))" >> "$GITHUB_OUTPUT"
          failure_class="$(sed -n 's/^VIBE2_SOURCE_WORKER_FAILURE_CLASS=//p' "$source_worker_log" | tail -n1)"
          failure_message="$(sed -n 's/^VIBE2_SOURCE_WORKER_FAILURE_MESSAGE=//p' "$source_worker_log" | tail -n1)"
          echo "failure_class=$failure_class" >> "$GITHUB_OUTPUT"
          echo "failure_message=$failure_message" >> "$GITHUB_OUTPUT"
          if [ "$worker_rc" -ne 0 ]; then exit "$worker_rc"; fi
          candidate_manifest_rel="$(sed -n 's/^VIBE2_CANDIDATE_MANIFEST=//p' "$source_worker_log" | tail -n1)"
          test -n "$candidate_manifest_rel"
          candidate_manifest="$candidate_dir/$candidate_manifest_rel"
          test -f "$candidate_manifest"
          echo "candidate_manifest=$candidate_manifest" >> "$GITHUB_OUTPUT"
          echo "VIBE2_CANDIDATE_MANIFEST=$candidate_manifest_rel"
          node tools/company-shared-context.mjs --output="/tmp/vibe2-shared-context-${SAFE_TASK}-${VARIANT}-after.json" | tee "/tmp/vibe2-shared-context-${SAFE_TASK}-${VARIANT}-after.log"
          git diff --check
          security_sensitive="$(node --input-type=module - "$candidate_manifest" <<'NODE'
          import fs from 'node:fs';
          const manifest=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const files=(manifest.changedFiles||[]).map(value=>String(value).replaceAll('\\','/'));
          const sensitive=files.some(file=>
            /^(?:\.github\/(?:workflows|actions)\/)/.test(file) ||
            /^tools\/company-security-/.test(file) ||
            /^qa\/company-security-/.test(file) ||
            /^(?:tools\/(?:company-shared-context|company-constitution-enforcer|vibe2-central-work-contract|vibe2-system-steward|vibe2-system-architecture-contract)\.mjs|company-learning\/(?:security-immune-system|platform-release-roadmap|company-log-map|company-architecture-map)\.json|company-directive\.json|package\.json|package-lock\.json|pnpm-lock\.yaml|yarn\.lock)$/.test(file)
          );
          process.stdout.write(sensitive?'YES':'NO');
          NODE
          )"
          if [ "$security_sensitive" = 'YES' ]; then
            node --check tools/company-security-steward.mjs
            node tools/company-security-steward.mjs --output="/tmp/vibe2-security-${SAFE_TASK}-${VARIANT}.json"
            echo 'VIBE2_SECURITY_IMMUNE_SCAN=PASS'
          else
            echo 'VIBE2_SECURITY_IMMUNE_SCAN=SKIPPED_NON_SECURITY_CHANGE'
          fi

          candidate_target="$(node -e "const fs=require('fs');const o=JSON.parse(fs.readFileSync('/tmp/vibe2-work-order.json','utf8'));process.stdout.write(String(o.target||''))")"
          if [ "$candidate_target" = 'system' ]; then
            node --input-type=module - "$candidate_manifest" <<'NODE' > /tmp/vibe2-system-candidate-files.txt
            import fs from 'node:fs';
            import { isAllowedSystemArchitecturePath } from './tools/vibe2-system-architecture-contract.mjs';
            const m=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
            const responsible=new Set(m?.compiledWorkContract?.writableScope?.exactResponsibleFiles||[]);
            for(const file of m.changedFiles||[]){
              if(!isAllowedSystemArchitecturePath(file)||!responsible.has(file))throw new Error('SYSTEM_CANDIDATE_PATH_FORBIDDEN:'+file);
              console.log(file);
            }
          NODE
            mapfile -t system_files < /tmp/vibe2-system-candidate-files.txt
            [ "${#system_files[@]}" -gt 0 ]
            git add -- "${system_files[@]}" .vibe2/candidates
            git diff --cached --quiet && { echo 'candidate has no system diff' >&2; exit 1; }
            mapfile -t changed < <(git diff --cached --name-only)
            for file in "${changed[@]}"; do
              case "$file" in
                .vibe2/candidates/*) ;;
                *) printf '%s\n' "${system_files[@]}" | grep -Fxq "$file" || { echo "system candidate escaped exact boundary: $file" >&2; exit 1; } ;;
              esac
            done
            changed_file_count="${#system_files[@]}"
            read -r added_line_count deleted_line_count < <(git diff --cached --numstat -- "${system_files[@]}" | awk '{if($1~/^[0-9]+$/)a+=$1;if($2~/^[0-9]+$/)d+=$2}END{print a+0,d+0}')
          else
            git add "$SOURCE_ROOT" .vibe2/candidates
            git diff --cached --quiet && { echo 'candidate has no source diff' >&2; exit 1; }
            mapfile -t changed < <(git diff --cached --name-only)
            for file in "${changed[@]}"; do
              case "$file" in
                "$SOURCE_ROOT"/*|.vibe2/candidates/*) ;;
                *) echo "candidate escaped approved boundary: $file" >&2; exit 1 ;;
              esac
            done
            changed_file_count="$(git diff --cached --name-only -- "$SOURCE_ROOT" | sed '/^$/d' | wc -l | tr -d ' ')"
            read -r added_line_count deleted_line_count < <(git diff --cached --numstat -- "$SOURCE_ROOT" | awk '{if($1~/^[0-9]+$/)a+=$1;if($2~/^[0-9]+$/)d+=$2}END{print a+0,d+0}')
          fi
          echo "changed_file_count=${changed_file_count:-0}" >> "$GITHUB_OUTPUT"
          echo "added_line_count=${added_line_count:-0}" >> "$GITHUB_OUTPUT"
          echo "deleted_line_count=${deleted_line_count:-0}" >> "$GITHUB_OUTPUT"

          git config user.name 'jaewoon-vibe2-worker'
          git config user.email 'vibe2-worker@users.noreply.github.com'
          git commit -m "vibe2: candidate ${TASK_ID} ${VARIANT}"
          git push origin "HEAD:$candidate_branch"
          candidate_sha="$(git rev-parse HEAD)"
          echo "candidate_branch=$candidate_branch" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "VIBE2_CANDIDATE_BRANCH=$candidate_branch"
          echo "VIBE2_CANDIDATE_SHA=$candidate_sha"
          echo "VIBE2_BASE_MAIN_SHA=$base_sha"
          echo "VIBE2_CHANGED_FILE_COUNT=${changed_file_count:-0}"
          echo "VIBE2_CHANGED_LINE_COUNT=$(( ${added_line_count:-0} + ${deleted_line_count:-0} ))"

      - name: Restore incremental QA content-hash cache
        if: steps.candidate.outcome == 'success'
        uses: actions/cache@v4
        with:
          path: /tmp/vibe2-qa-cache
          key: vibe2-iqa-v2-${{ runner.os }}-${{ steps.order.outputs.game_id }}-${{ github.run_id }}-${{ matrix.variant }}
          restore-keys: |
            vibe2-iqa-v2-${{ runner.os }}-${{ steps.order.outputs.game_id }}-

      - name: Run impact-first incremental QA role
        id: incremental_qa
        if: steps.candidate.outcome == 'success'
        continue-on-error: true
        env:
          CANDIDATE_DIR: ${{ steps.candidate.outputs.candidate_dir }}
          CANDIDATE_MANIFEST: ${{ steps.candidate.outputs.candidate_manifest }}
          CACHE_NAMESPACE: ${{ steps.order.outputs.cache_namespace }}
        shell: bash
        run: |
          set -euo pipefail
          qa_started="$(date +%s%3N)"
          mkdir -p /tmp/vibe2-qa-cache
          manifest="$CANDIDATE_MANIFEST"
          test -f "$manifest"
          set +e
          node "$GITHUB_WORKSPACE/vibe2-contract/tools/vibe2-incremental-qa.mjs" \
            --root="$CANDIDATE_DIR" \
            --manifest="$manifest" \
            --cache=/tmp/vibe2-qa-cache/cache.json \
            --namespace="$CACHE_NAMESPACE" \
            --output=/tmp/vibe2-incremental-qa.json 2>&1 | tee /tmp/vibe2-incremental-qa.log
          qa_rc=${PIPESTATUS[0]}
          set -e
          hash="$(sed -n 's/^VIBE2_INCREMENTAL_QA_HASH=//p' /tmp/vibe2-incremental-qa.log | tail -n1)"
          cache="$(sed -n 's/^VIBE2_INCREMENTAL_QA_CACHE=//p' /tmp/vibe2-incremental-qa.log | tail -n1)"
          replay_status="$(sed -n 's/^VIBE2_CAUSAL_REPLAY_STATUS=//p' /tmp/vibe2-incremental-qa.log | tail -n1)"
          replay_executed="$(sed -n 's/^VIBE2_CAUSAL_REPLAY_EXECUTED=//p' /tmp/vibe2-incremental-qa.log | tail -n1)"
          replay_prepatch_reproduced="$(sed -n 's/^VIBE2_CAUSAL_REPLAY_PREPATCH_REPRODUCED=//p' /tmp/vibe2-incremental-qa.log | tail -n1)"
          replay_verified_responsible_system="$(sed -n 's/^VIBE2_CAUSAL_REPLAY_VERIFIED_RESPONSIBLE_SYSTEM=//p' /tmp/vibe2-incremental-qa.log | tail -n1)"
          drift_status="$(sed -n 's/^VIBE2_ARCHITECTURE_DRIFT_STATUS=//p' /tmp/vibe2-incremental-qa.log | tail -n1)"
          drift_risk="$(sed -n 's/^VIBE2_ARCHITECTURE_DRIFT_RISK=//p' /tmp/vibe2-incremental-qa.log | tail -n1)"
          drift_score="$(sed -n 's/^VIBE2_ARCHITECTURE_DRIFT_SCORE=//p' /tmp/vibe2-incremental-qa.log | tail -n1)"
          drift_signals="$(sed -n 's/^VIBE2_ARCHITECTURE_DRIFT_SIGNALS=//p' /tmp/vibe2-incremental-qa.log | tail -n1)"
          presentation_status="$(sed -n 's/^VIBE2_PRESENTATION_QA_STATUS=//p' /tmp/vibe2-incremental-qa.log | tail -n1)"
          presentation_pass="$(sed -n 's/^VIBE2_PRESENTATION_QA_PASS=//p' /tmp/vibe2-incremental-qa.log | tail -n1)"
          presentation_runtime_required="$(sed -n 's/^VIBE2_PRESENTATION_RUNTIME_REQUIRED=//p' /tmp/vibe2-incremental-qa.log | tail -n1)"
          failure_signature="$(sed -n 's/^VIBE2_INCREMENTAL_QA_FAILURE_SIGNATURE=//p' /tmp/vibe2-incremental-qa.log | tail -n1)"
          failure_message="$(sed -n 's/^VIBE2_INCREMENTAL_QA_FAILURE_MESSAGE=//p' /tmp/vibe2-incremental-qa.log | tail -n1)"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "cache=$cache" >> "$GITHUB_OUTPUT"
          echo "causal_replay_status=$replay_status" >> "$GITHUB_OUTPUT"
          echo "causal_replay_executed=$replay_executed" >> "$GITHUB_OUTPUT"
          echo "causal_replay_prepatch_reproduced=$replay_prepatch_reproduced" >> "$GITHUB_OUTPUT"
          echo "causal_replay_verified_responsible_system=$replay_verified_responsible_system" >> "$GITHUB_OUTPUT"
          echo "architecture_drift_status=$drift_status" >> "$GITHUB_OUTPUT"
          echo "architecture_drift_risk=$drift_risk" >> "$GITHUB_OUTPUT"
          echo "architecture_drift_score=$drift_score" >> "$GITHUB_OUTPUT"
          echo "architecture_drift_signals=$drift_signals" >> "$GITHUB_OUTPUT"
          echo "presentation_status=$presentation_status" >> "$GITHUB_OUTPUT"
          echo "presentation_pass=$presentation_pass" >> "$GITHUB_OUTPUT"
          echo "presentation_runtime_required=$presentation_runtime_required" >> "$GITHUB_OUTPUT"
          echo "failure_signature=$failure_signature" >> "$GITHUB_OUTPUT"
          echo "failure_message=$failure_message" >> "$GITHUB_OUTPUT"
          qa_finished="$(date +%s%3N)"
          echo "duration_ms=$((qa_finished-qa_started))" >> "$GITHUB_OUTPUT"
          if [ "$qa_rc" -ne 0 ]; then
            echo 'VIBE2_TEST_ROLE=FAIL'
            echo 'VIBE2_TEST_ROLE_SOURCE_WRITE=NO'
            exit "$qa_rc"
          fi
          echo 'VIBE2_TEST_ROLE=PASS'
          echo 'VIBE2_TEST_ROLE_SOURCE_WRITE=NO'

      - name: Run read-only performance sanity role
        id: performance
        if: steps.candidate.outcome == 'success' && steps.incremental_qa.outcome == 'success'
        continue-on-error: true
        env:
          CANDIDATE_DIR: ${{ steps.candidate.outputs.candidate_dir }}
          CANDIDATE_MANIFEST: ${{ steps.candidate.outputs.candidate_manifest }}
        shell: bash
        run: |
          set -euo pipefail
          manifest="$CANDIDATE_MANIFEST"
          test -f "$manifest"
          node "$GITHUB_WORKSPACE/vibe2-contract/tools/vibe2-performance-sanity.mjs" \
            --root="$CANDIDATE_DIR" \
            --manifest="$manifest" \
            --output=/tmp/vibe2-performance.json | tee /tmp/vibe2-performance.log
          echo 'VIBE2_PERFORMANCE_ROLE=PASS'
          echo 'VIBE2_PERFORMANCE_ROLE_SOURCE_WRITE=NO'

      - name: Capture actual Web presentation runtime before and after
        id: runtime_visual
        if: steps.candidate.outcome == 'success' && steps.incremental_qa.outcome == 'success' && steps.performance.outcome == 'success' && steps.order.outputs.target == 'web' && steps.incremental_qa.outputs.presentation_runtime_required == 'YES'
        env:
          SAFE_TASK: ${{ matrix.safeTask }}
          VARIANT: ${{ matrix.variant }}
          SOURCE_ROOT: ${{ steps.order.outputs.source_root }}
          BASE_SHA: ${{ steps.candidate.outputs.base_sha }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
          CANDIDATE_DIR: ${{ steps.candidate.outputs.candidate_dir }}
        shell: bash
        run: |
          set -euo pipefail
          contract_root="$GITHUB_WORKSPACE/vibe2-contract"
          baseline_root="$contract_root/$SOURCE_ROOT"
          candidate_root="$CANDIDATE_DIR/$SOURCE_ROOT"
          capture_dir="/tmp/vibe2-runtime-visual-$SAFE_TASK-$VARIANT"
          result_file="/tmp/vibe2-runtime-visual-comparison.json"
          artifact_name="vibe2-visual-$SAFE_TASK-$VARIANT-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$capture_dir"
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          status=READY
          before_stable=false
          after_stable=false
          visible_delta=false
          before_sha=''
          after_sha=''
          before_bytes=0
          after_bytes=0
          before_entry=''
          after_entry=''
          resolve_entry() {
            local root="$1"
            if [ -f "$root/index.html" ]; then printf '%s' 'index.html'; return 0; fi
            find "$root" -maxdepth 1 -type f \( -iname '*.html' -o -iname '*.htm' \) -printf '%f\n' | sort | head -n1
          }
          before_entry="$(resolve_entry "$baseline_root" || true)"
          after_entry="$(resolve_entry "$candidate_root" || true)"
          if [ -z "$browser" ]; then status=BROWSER_UNAVAILABLE; fi
          if [ -z "$before_entry" ] || [ -z "$after_entry" ]; then status=RUNTIME_ENTRY_MISSING; fi
          pids=()
          cleanup() { for pid in "${pids[@]:-}"; do kill "$pid" >/dev/null 2>&1 || true; done; }
          trap cleanup EXIT
          if [ "$status" = READY ]; then
            python3 -m http.server 41731 --bind 127.0.0.1 --directory "$baseline_root" >"$capture_dir/before-server.log" 2>&1 & pids+=("$!")
            python3 -m http.server 41732 --bind 127.0.0.1 --directory "$candidate_root" >"$capture_dir/after-server.log" 2>&1 & pids+=("$!")
            ready=0
            for i in $(seq 1 20); do
              if curl -fsS "http://127.0.0.1:41731/" >/dev/null && curl -fsS "http://127.0.0.1:41732/" >/dev/null; then ready=1; break; fi
              sleep 0.25
            done
            if [ "$ready" != 1 ]; then status=RUNTIME_SERVER_UNAVAILABLE; fi
          fi
          if [ "$status" = READY ]; then
            before_url="http://127.0.0.1:41731/$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))' "$before_entry")"
            after_url="http://127.0.0.1:41732/$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))' "$after_entry")"
            capture() {
              local url="$1" out="$2"
              "$browser" --headless=new --disable-gpu --no-sandbox --hide-scrollbars --window-size=390,844 --virtual-time-budget=2500 --screenshot="$out" "$url" >/dev/null 2>&1
              test -s "$out"
            }
            if ! capture "$before_url" "$capture_dir/before-1.png" || ! capture "$before_url" "$capture_dir/before-2.png" || ! capture "$after_url" "$capture_dir/after-1.png" || ! capture "$after_url" "$capture_dir/after-2.png"; then
              status=RUNTIME_CAPTURE_FAILED
            fi
          fi
          if [ "$status" = READY ]; then
            before_sha="$(sha256sum "$capture_dir/before-1.png" | awk '{print $1}')"
            before_sha_2="$(sha256sum "$capture_dir/before-2.png" | awk '{print $1}')"
            after_sha="$(sha256sum "$capture_dir/after-1.png" | awk '{print $1}')"
            after_sha_2="$(sha256sum "$capture_dir/after-2.png" | awk '{print $1}')"
            before_bytes="$(stat -c%s "$capture_dir/before-1.png")"
            after_bytes="$(stat -c%s "$capture_dir/after-1.png")"
            [ "$before_sha" = "$before_sha_2" ] && before_stable=true
            [ "$after_sha" = "$after_sha_2" ] && after_stable=true
            [ "$before_sha" != "$after_sha" ] && visible_delta=true
            if [ "$before_stable" != true ] || [ "$after_stable" != true ]; then status=RUNTIME_CAPTURE_NONDETERMINISTIC; fi
            if [ "$visible_delta" != true ]; then status=NO_VISIBLE_RENDER_DELTA; fi
          fi
          STATUS="$status" BEFORE_STABLE="$before_stable" AFTER_STABLE="$after_stable" VISIBLE_DELTA="$visible_delta" \
          BEFORE_SHA="$before_sha" AFTER_SHA="$after_sha" BEFORE_BYTES="$before_bytes" AFTER_BYTES="$after_bytes" \
          BEFORE_ENTRY="$before_entry" AFTER_ENTRY="$after_entry" ARTIFACT_NAME="$artifact_name" RESULT_FILE="$result_file" node <<'NODE'
          const fs=require('fs');
          const yes=value=>String(value||'').toLowerCase()==='true';
          const status=String(process.env.STATUS||'UNKNOWN');
          const pass=status==='READY'&&yes(process.env.BEFORE_STABLE)&&yes(process.env.AFTER_STABLE)&&yes(process.env.VISIBLE_DELTA);
          const base=String(process.env.BASE_SHA||'').trim();
          const candidate=String(process.env.CANDIDATE_SHA||'').trim();
          const artifact=String(process.env.ARTIFACT_NAME||'').trim();
          const result={
            version:1,baselineRevision:base,candidateRevision:candidate,
            before:{source:'runtime-capture',artifactId:`actions-artifact:${artifact}:before-1.png`,candidateRevision:base,observed:status!=='BROWSER_UNAVAILABLE'&&status!=='RUNTIME_ENTRY_MISSING',reviewed:true,markerOnly:false,entry:String(process.env.BEFORE_ENTRY||''),sha256:String(process.env.BEFORE_SHA||''),bytes:Number(process.env.BEFORE_BYTES||0)},
            after:{source:'runtime-capture',artifactId:`actions-artifact:${artifact}:after-1.png`,candidateRevision:candidate,observed:status!=='BROWSER_UNAVAILABLE'&&status!=='RUNTIME_ENTRY_MISSING',reviewed:true,markerOnly:false,entry:String(process.env.AFTER_ENTRY||''),sha256:String(process.env.AFTER_SHA||''),bytes:Number(process.env.AFTER_BYTES||0)},
            comparison:{pass,visibleRenderDelta:yes(process.env.VISIBLE_DELTA),beforeStable:yes(process.env.BEFORE_STABLE),afterStable:yes(process.env.AFTER_STABLE),observed:true,reviewed:true,method:'dual-headless-browser-sha256-v1',status},
            markerOnly:false,authority:'github-actions-actual-web-runtime-before-after'
          };
          fs.writeFileSync(process.env.RESULT_FILE,JSON.stringify(result,null,2)+'\n');
          console.log('VIBE2_RUNTIME_VISUAL_COMPARISON='+status);
          console.log('VIBE2_RUNTIME_VISUAL_COMPARISON_PASS='+(pass?'YES':'NO'));
          NODE
          echo 'created=true' >> "$GITHUB_OUTPUT"
          if [ -s "$capture_dir/before-1.png" ] && [ -s "$capture_dir/after-1.png" ]; then echo 'captures_created=true' >> "$GITHUB_OUTPUT"; else echo 'captures_created=false' >> "$GITHUB_OUTPUT"; fi

      - name: Upload actual Web presentation before-after captures
        if: steps.runtime_visual.outputs.captures_created == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vibe2-visual-${{ matrix.safeTask }}-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/vibe2-runtime-visual-${{ matrix.safeTask }}-${{ matrix.variant }}/
          retention-days: 2

      - name: Enforce canonical constitution after worker execution
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          contract_root="$GITHUB_WORKSPACE/vibe2-contract"
          cd "$contract_root"
          node tools/company-constitution-enforcer.mjs --phase=worker-after-execution

      - name: Build immutable worker result
        id: result
        if: always()
        env:
          TASK_ID: ${{ matrix.taskId }}
          VARIANT: ${{ matrix.variant }}
          ORDER_RUN: ${{ steps.order.outputs.run }}
          ORDER_REASON: ${{ steps.order.outputs.reason }}
          ROUTE: ${{ steps.order.outputs.route }}
          WORK_LOCK_REQUIRED: ${{ steps.order.outputs.work_lock_required }}
          WORK_LOCK_ACQUIRED: ${{ steps.work_lock.outputs.acquired }}
          WORK_LOCK_ID: ${{ steps.work_lock.outputs.lock_id }}
          WORK_LOCK_REASON: ${{ steps.work_lock.outputs.reason }}
          CANDIDATE_OUTCOME: ${{ steps.candidate.outcome }}
          CANDIDATE_BRANCH: ${{ steps.candidate.outputs.candidate_branch }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
          CANDIDATE_DIR: ${{ steps.candidate.outputs.candidate_dir }}
          CANDIDATE_MANIFEST: ${{ steps.candidate.outputs.candidate_manifest }}
          CANDIDATE_FAILURE_CLASS: ${{ steps.candidate.outputs.failure_class }}
          CANDIDATE_FAILURE_MESSAGE: ${{ steps.candidate.outputs.failure_message }}
          EXPLORATION_FILE: /tmp/vibe2-exploration/vibe2-exploration.json
          BASE_SHA: ${{ steps.candidate.outputs.base_sha }}
          CHANGED_FILE_COUNT: ${{ steps.candidate.outputs.changed_file_count }}
          ADDED_LINE_COUNT: ${{ steps.candidate.outputs.added_line_count }}
