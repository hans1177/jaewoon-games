                  item.executionEvidence.regressionPassed=true;
                  item.executionEvidence.failureStage='PUBLIC_RELEASE_RUNTIME_OBSERVATION';
                  item.executionEvidence.failureSignature='ROBLOX_PUBLIC_RELEASE_AWAITING_REAL_SERVER_BOOT';
                }
                f9Ids.push(item.gameId);
                console.log(`ROBLOX_INTERNAL_FLOW_PASS_EXTERNAL_SERVER_BOOT_PENDING=${item.gameId}:attempt=${attempts}:engineVersion=${Number(candidate.versionNumber)}:sentinelVersion=${Number(sentinel.placeVersion||0)}:studioExact=${exactStudioInternalValidation?'YES':'NO'}`);
                pending++;
              }else{
                item.robloxFailureStage='TARGET_PLATFORM_RUNTIME_FOUNDATION';
                item.robloxFailureSignature='ROBLOX_RUNTIME_FOUNDATION_PENDING';
                item.routingBlockers=['roblox-runtime-foundation-stale-version'];
                console.log(`ROBLOX_FOUNDATION_STALE_RUNTIME=${item.gameId}:attempt=${attempts}:staleVersion=${Number(sentinel.placeVersion||0)}:expectedVersion=${Number(candidate.versionNumber)}:retry=UNLIMITED_CAUSAL_REPAIR`);
                pending++;
              }
              item.updatedAt=stamp;
              changed=true;
              continue;
            }
            const multiplayerReleasePassed=multiplayer.known===true
              &&(multiplayer.required!==true||staticMultiplayerCodePass);
            const cloudEnginePassed=engineProbe?.engineExecuted===true&&engineProbe?.exactPlace===true&&engineProbe?.exactVersion===true;
            const runtimeAcceptanceForRelease=result.developmentContinuationPassed===true&&multiplayerReleasePassed&&cloudEnginePassed&&engineProbe?.imageEvidence?.imageContentPassed===true;
            const evidence={
              ...result,
              releaseRuntimeAcceptancePassed:runtimeAcceptanceForRelease,
              validationProvider:'ROBLOX_OFFICIAL_CLOUD_API_ONLY',
              f7MultiplayerSourceContractPassed:staticMultiplayerCodePass,
              multiplayerSourceContract,
              sourceRevision,
              artifactIdentity,
              artifactRunId:Number(candidate.artifactRunId||0),
              universeId:String(candidate.universeId),
              candidateVersionNumber:Number(candidate.versionNumber),
              observedAt:stamp,
              workflowRunId:Number(process.env.GITHUB_RUN_ID||0),
              openCloudWorldEvidence:engineProbe?.worldEvidence||null,
              openCloudImageEvidence:engineProbe?.imageEvidence||null,
              authority:'existing-game-tester-roblox-runtime-foundation-v1',
            };
            item.robloxRuntimeFoundationEvidence=evidence;
            item.robloxRuntimeFoundationPassed=result.runtimeFoundationPassed===true;
            item.robloxRuntimePassed=runtimeAcceptanceForRelease;
            item.robloxServerClientBoundaryPassed=result.f6CoreServicesPassed===true;
            item.robloxDatastoreRejoinPassed=result.f6CoreServicesPassed===true;
            item.robloxMobileControlUiPassed=result.f5InputCameraUiPassed===true;
            item.robloxMultiplayerQaPassed=multiplayerReleasePassed;
            if(staticMultiplayerCodePass){
              item.robloxMultiplayerQaEvidence={
                version:2,
                gameId:item.gameId,
                sourceRevision,
                artifactIdentity,
                universeId:String(candidate.universeId||''),
                placeId:String(candidate.placeId||''),
                candidateVersionNumber:Number(candidate.versionNumber),
                passed:true,
                codeContractPassed:true,
                checks:multiplayerSourceContract.checks,
                runtimeTwoClientExecutionRequired:false,
                authority:'roblox-static-two-client-source-contract',
                verifiedAt:stamp,
              };
              item.robloxMultiplayerQaPassedAt=stamp;
              console.log('ROBLOX_F7_MULTIPLAYER_CODE_CONTRACT_PASS='+item.gameId);
            }
            const studioAssetRuntimeBindingPassed=studioAssetBindingRequired
              &&runtimeAcceptanceForRelease
              &&result.f5InputCameraUiPassed===true
              &&result.f8GameplaySystemsPassed===true
              &&engineProbe?.engineExecuted===true
              &&engineProbe?.exactPlace===true
              &&engineProbe?.exactVersion===true
              &&engineProbe?.studioAssetSelectionMatched===true;
            item.robloxStudioAssetRuntimeBindingPassed=studioAssetRuntimeBindingPassed;
            item.robloxStudioAssetRuntimeBindingEvidence=studioAssetBindingRequired?{
              version:1,
              gameId:item.gameId,
              sourceRevision,
              artifactIdentity,
              candidateVersionNumber:Number(candidate.versionNumber),
              uiAndInputRuntimePassed:result.f5InputCameraUiPassed===true,
              coreLoopRuntimePassed:result.f8GameplaySystemsPassed===true,
              runtimeAcceptancePassed:runtimeAcceptanceForRelease,
              exactRevision:true,
              targetEngineExecuted:engineProbe?.engineExecuted===true,
              targetEngineExactPlace:engineProbe?.exactPlace===true,
              targetEngineExactVersion:engineProbe?.exactVersion===true,
              targetEngineStudioAssetApplied:engineProbe?.studioAssetApplied===true,
              targetEngineStudioAssetBindingVersion:Number(engineProbe?.studioAssetBindingVersion||0),
              targetEngineSelectionMatched:engineProbe?.studioAssetSelectionMatched===true,
              targetEngineAtomMatch:engineProbe?.studioAssetAtomMatch===true,
              targetEngineFingerprintMatch:engineProbe?.studioAssetFingerprintMatch===true,
              targetEngineLibraryVersionMatch:engineProbe?.studioAssetLibraryVersionMatch===true,
              expectedSelectionFingerprint:String(engineProbe?.expectedStudioAssetSelectionFingerprint||''),
              observedSelectionFingerprint:String(engineProbe?.observedStudioAssetSelectionFingerprint||''),
              expectedLibraryVersion:Number(engineProbe?.expectedStudioAssetLibraryVersion||0),
              observedLibraryVersion:Number(engineProbe?.observedStudioAssetLibraryVersion||0),
              buildUpAssetSourceUsageFingerprint:String(engineProbe?.expectedBuildUpAssetSourceUsageFingerprint||''),
              expectedStudioAssetAtoms:engineProbe?.expectedStudioAssetAtoms||[],
              observedStudioAssetAtoms:engineProbe?.observedStudioAssetAtoms||[],
              actualPlatformRuntime:true,
              marker:studioAssetRuntimeBindingPassed?'ROBLOX_STUDIO_ASSET_RUNTIME_BINDING_PASS':'ROBLOX_STUDIO_ASSET_RUNTIME_BINDING_PENDING',
              authority:'roblox-exact-runtime-studio-asset-binding-v1',
              verifiedAt:studioAssetRuntimeBindingPassed?stamp:null,
            }:null;
            item.robloxRuntimeEvidence={
              ...evidence,
              runtimePassed:runtimeAcceptanceForRelease,
              serverClientBoundaryPassed:result.f6CoreServicesPassed===true,
              datastoreRejoinPassed:result.f6CoreServicesPassed===true,
              mobileControlUiPassed:result.f5InputCameraUiPassed===true,
              multiplayerQaPassed:multiplayerReleasePassed,
              studioAssetBindingRequired,
              studioAssetRuntimeBindingPassed,
              studioAssetRuntimeBindingMarker:studioAssetRuntimeBindingPassed?'ROBLOX_STUDIO_ASSET_RUNTIME_BINDING_PASS':studioAssetBindingRequired?'ROBLOX_STUDIO_ASSET_RUNTIME_BINDING_PENDING':'NOT_REQUIRED',
              actualPlatformRuntime:true,
              authority:'roblox-actual-runtime-foundation-and-core-acceptance',
            };

            if(runtimeAcceptanceForRelease){
              item.robloxRuntimeFoundationInternalReleaseException=false;
              item.robloxRuntimeFailureExternalReleaseOnly=false;
              item.robloxInternalQaContinuationAllowed=false;
              item.robloxInternalRegressionContinuationAllowed=false;
              item.robloxPublicReleaseRuntimeObservationPending=false;
              item.robloxPublicReleaseFailureSignature=null;
              item.robloxPublicReleaseBlockers=(Array.isArray(item.robloxPublicReleaseBlockers)?item.robloxPublicReleaseBlockers:[]).filter(value=>
                value!=='roblox-public-release-awaiting-real-server-boot'
                &&!String(value||'').startsWith('roblox-public-release-runtime-finding:')
              );
              item.robloxRuntimePassedAt=stamp;
              item.robloxRuntimeFailedAt=null;
              item.robloxIndependentQaPassed=true;
              item.robloxIndependentQaPassedAt=stamp;
              item.robloxRegressionPassed=true;
              item.robloxRegressionPassedAt=stamp;
              item.robloxPostRuntimeQaEvidence={
                version:2,
                gameId:item.gameId,
                sourceRevision,
                artifactIdentity,
                artifactRunId:Number(candidate.artifactRunId||0),
                candidateVersionNumber:Number(candidate.versionNumber),
                runtimeFoundationEvidence:evidence,
                exactRevision:true,
                independentQaPassed:true,
                regressionPassed:true,
                actualRuntimeEvidence:true,
                studioAssetBindingRequired,
                studioAssetRuntimeBindingPassed,
                studioAssetRuntimeBindingEvidence:item.robloxStudioAssetRuntimeBindingEvidence,
                deterministicQa:[
                  'qa/company-development-roblox-runtime-foundation.test.mjs',
                  'qa/company-development-roblox-headless-fast-mvp.test.mjs',
                  'qa/company-tester-debug-intake.test.mjs',
                ],
                authority:'existing-independent-qa-native-foundation-v2',
                verifiedAt:stamp,
              };
              item.currentStep='ROBLOX_FINAL_REVIEW_REVALIDATION';
              item.canonicalState='ROBLOX_RUNTIME_ACCEPTANCE_PASSED';
              item.robloxLastSuccessfulStage='TARGET_PLATFORM_REGRESSION';
              item.robloxFailureStage='ROBLOX_FINAL_REVIEW_REVALIDATION';
              item.robloxFailureSignature='ROBLOX_FINAL_REVIEW_PENDING';
              item.routingBlockers=['roblox-final-review-pending'];
              if(studioAssetBindingRequired&&!studioAssetRuntimeBindingPassed){
                throw new Error('ROBLOX_STUDIO_ASSET_RUNTIME_BINDING_EXPECTED_AFTER_ACCEPTANCE:'+item.gameId);
              }
              if(studioAssetRuntimeBindingPassed)console.log('ROBLOX_STUDIO_ASSET_RUNTIME_BINDING_PASS='+item.gameId+':'+sourceRevision+':'+candidate.versionNumber);
              if(item.executionEvidence){
                item.executionEvidence.lastSuccessfulStage='TARGET_PLATFORM_REGRESSION';
                item.executionEvidence.runtimePassed=true;
                item.executionEvidence.independentQaPassed=true;
                item.executionEvidence.regressionPassed=true;
                item.executionEvidence.failureStage=null;
                item.executionEvidence.failureSignature=null;
              }
              f9Ids.push(item.gameId);
              passed++;
            }else{
              const cp=result.checkpointPass||{};
              const groundFailure=result.exactVersion===true&&cp.CHARACTER_READY===true&&cp.GROUND_CONTACT!==true;
              const multiplayerCodeContractMissing=multiplayer.required===true&&!multiplayerReleasePassed;
              if(multiplayerCodeContractMissing){
                item.robloxParallelMultiplayerValidationPending=false;
                item.robloxInternalMultiplayerSimplifiedPassed=false;
                item.currentStep='TARGET_PLATFORM_TECHNICAL_VALIDATION';
                item.canonicalState='TARGET_PLATFORM_REPAIR_REQUIRED';
                item.robloxFailureStage='F7_MULTIPLAYER_CODE_CONTRACT';
                item.robloxFailureSignature='ROBLOX_MULTIPLAYER_CODE_CONTRACT_FAILED';
                item.routingBlockers=['roblox-multiplayer-code-contract-failed'];
                item.robloxPromotionBlockers=['roblox-multiplayer-code-contract-failed'];
                if(item.executionEvidence){
                  item.executionEvidence.runtimePassed=false;
                  item.executionEvidence.failureStage='F7_MULTIPLAYER_CODE_CONTRACT';
                  item.executionEvidence.failureSignature='ROBLOX_MULTIPLAYER_CODE_CONTRACT_FAILED';
                }
                console.log('ROBLOX_F7_MULTIPLAYER_CODE_CONTRACT_REPAIR='+item.gameId);
                pending++;
              }else{
                item.robloxParallelMultiplayerValidationPending=false;
                const studioPlay=item.robloxInternalVibePlayEvidence||{};
                const exactStudioPlay=
                  studioPlay.pass===true
                  &&studioPlay.actualPlay===true
                  &&studioPlay.runtimeVerified===true
                  &&studioPlay.officialStudioMcp===true
                  &&studioPlay.localPlaceFile===true
                  &&studioPlay.sourceRevision===sourceRevision
                  &&studioPlay.artifactIdentity===artifactIdentity
                  &&Number(studioPlay.versionNumber)===Number(candidate.versionNumber)
                  &&Number(studioPlay.runtimeSummary?.consoleErrorCount||0)===0;
                if(exactStudioPlay)item.robloxNativeFailureClass=null;
                const exactPrivateRuntimeFinding=
                  result.exactGame===true
                  &&result.exactPlace===true
                  &&result.exactVersion===true
                  &&result.actualRuntimeEvidence===true
                  &&exactStudioPlay;
                if(exactPrivateRuntimeFinding){
                  const runtimeSignature=groundFailure
                    ?'GROUND_CONTACT_FAILURE'
                    :(result.runtimeFoundationPassed===true?'ROBLOX_RUNTIME_ACCEPTANCE_PENDING':'ROBLOX_RUNTIME_FOUNDATION_PENDING');
                  item.robloxIndependentQaPassed=false;
                  item.robloxRegressionPassed=false;
                  item.robloxInternalQaContinuationAllowed=true;
                  item.robloxInternalRegressionContinuationAllowed=true;
                  item.robloxRuntimeFailureExternalReleaseOnly=true;
                  item.robloxPublicReleaseRuntimeObservationPending=true;
                  item.robloxPublicReleaseFailureSignature=runtimeSignature;
                  item.robloxPublicReleaseBlockers=[...new Set([
                    ...(Array.isArray(item.robloxPublicReleaseBlockers)?item.robloxPublicReleaseBlockers:[]),
                    'roblox-public-release-runtime-finding:'+runtimeSignature.toLowerCase(),
                  ])];
                  item.robloxPostRuntimeQaEvidence={
                    version:5,
                    gameId:item.gameId,
                    sourceRevision,
                    artifactIdentity,
                    artifactRunId:Number(candidate.artifactRunId||0),
                    candidateVersionNumber:Number(candidate.versionNumber),
                    runtimeFoundationEvidence:evidence,
                    exactRevision:true,
                    independentQaPassed:false,
                    regressionPassed:false,
                    internalQaContinuationAllowed:true,
                    internalRegressionContinuationAllowed:true,
                    runtimeFailureExternalReleaseOnly:true,
                    publicReleaseRuntimeObservationPending:true,
                    runtimeFailureSignature:runtimeSignature,
                    actualRuntimeEvidence:true,
                    officialStudioMcpActualPlayPassed:true,
                    studioAssetBindingRequired,
                    studioAssetRuntimeBindingPassed,
                    studioAssetRuntimeBindingEvidence:item.robloxStudioAssetRuntimeBindingEvidence,
                    authority:'roblox-internal-flow-runtime-finding-external-release-only',
                    verifiedAt:stamp,
                  };
                  item.robloxInternalReleaseReady=true;
                  item.robloxInternalReleasePublished=true;
                  item.robloxF9PendingInParallel=true;
                  item.currentStep='INTERNAL_PLATFORM_PLAYTEST_AND_DEBUG';
                  item.canonicalState='INTERNAL_PLATFORM_PLAYTEST_AND_DEBUG';
                  item.robloxFailureStage='PUBLIC_RELEASE_RUNTIME_FINDING';
                  item.robloxFailureSignature=runtimeSignature;
                  item.routingBlockers=[];
                  item.robloxPromotionBlockers=[...new Set([
                    ...(Array.isArray(item.robloxPromotionBlockers)?item.robloxPromotionBlockers:[]),
                    'roblox-public-release-runtime-finding:'+runtimeSignature.toLowerCase(),
                  ])];
                  if(item.executionEvidence){
                    item.executionEvidence.runtimePassed=false;
                    item.executionEvidence.independentQaPassed=false;
                    item.executionEvidence.regressionPassed=false;
                    item.executionEvidence.failureStage='PUBLIC_RELEASE_RUNTIME_FINDING';
                    item.executionEvidence.failureSignature=runtimeSignature;
                  }
                  f9Ids.push(item.gameId);
                  console.log('ROBLOX_INTERNAL_FLOW_CONTINUES_RUNTIME_FINDING_EXTERNAL_ONLY='+item.gameId+':'+runtimeSignature);
                  pending++;
                }else if(groundFailure){
                  item.robloxIndependentQaPassed=false;
                  item.robloxRegressionPassed=false;
                  item.robloxInternalQaContinuationAllowed=false;
                  item.robloxInternalRegressionContinuationAllowed=false;
                  item.robloxFailureStage='TARGET_PLATFORM_RUNTIME_FOUNDATION';
                  item.robloxFailureSignature='GROUND_CONTACT_FAILURE';
                  item.routingBlockers=['roblox-ground-contact-failure'];
                  failed++;
                }else if(result.runtimeFoundationPassed===true){
                  item.robloxIndependentQaPassed=false;
                  item.robloxRegressionPassed=false;
                  item.robloxInternalQaContinuationAllowed=false;
                  item.robloxInternalRegressionContinuationAllowed=false;
                  item.robloxFailureStage='TARGET_PLATFORM_RUNTIME_ACCEPTANCE';
                  item.robloxFailureSignature='ROBLOX_RUNTIME_ACCEPTANCE_PENDING';
                  item.routingBlockers=['roblox-runtime-acceptance-awaiting-tester-actions'];
                  pending++;
                }else{
                  item.robloxIndependentQaPassed=false;
                  item.robloxRegressionPassed=false;
                  item.robloxInternalQaContinuationAllowed=false;
                  item.robloxInternalRegressionContinuationAllowed=false;
                  item.robloxFailureStage='TARGET_PLATFORM_RUNTIME_FOUNDATION';
                  item.robloxFailureSignature='ROBLOX_RUNTIME_FOUNDATION_PENDING';
                  item.routingBlockers=['roblox-runtime-foundation-awaiting-observation'];
                  pending++;
                }
              }
            }
            queueStudioFollowupIfEligible(item);
            item.updatedAt=stamp;changed=true;
          }

          const equal=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
          const patches=[];
          for(const item of q.items||[]){
            const gameId=String(item?.gameId||'');
            const before=beforeById.get(gameId);
            if(!before)continue;
            const fields={};
            const keys=new Set([...Object.keys(before),...Object.keys(item)]);
            keys.delete('gameId');
            keys.delete('updatedAt');
            for(const key of [...keys].sort()){
              const beforePresent=Object.prototype.hasOwnProperty.call(before,key);
              const afterPresent=Object.prototype.hasOwnProperty.call(item,key);
              if(beforePresent===afterPresent&&(!beforePresent||equal(before[key],item[key])))continue;
              fields[key]={
                beforePresent,
                ...(beforePresent?{before:before[key]}:{}),
                afterPresent,
                ...(afterPresent?{after:item[key]}:{}),
              };
            }
            if(!Object.keys(fields).length)continue;
            const candidate=candidateForItem(item);
            patches.push({
              gameId,
              sourceRevision:String(item.robloxSourceCommit||''),
              artifactIdentity:String(item.robloxBuildArtifactIdentity||''),
              candidateVersionNumber:Number(candidate.versionNumber||0),
              beforeUpdatedAt:String(before.updatedAt||''),
              updatedAt:String(item.updatedAt||stamp),
              fields,
            });
          }
          fs.writeFileSync('/tmp/roblox-foundation-runtime-patch.json',JSON.stringify({version:1,generatedAt:stamp,patches},null,2)+'\n');
          if(changed){
            q.updatedAt=stamp;
            fs.writeFileSync(queuePath,JSON.stringify(q,null,2)+'\n');
          }
          console.log(`ROBLOX_FOUNDATION_RUNTIME_PATCH_COUNT=${patches.length}`);
          console.log(`ROBLOX_FOUNDATION_CANDIDATES=${candidates.length}`);
          console.log(`ROBLOX_FOUNDATION_RUNTIME_PASS=${passed}`);
          console.log(`ROBLOX_FOUNDATION_RUNTIME_PENDING=${pending}`);
          fs.writeFileSync('/tmp/roblox-f9-ids',f9Ids.join('\n')+(f9Ids.length?'\n':''));
          fs.writeFileSync('/tmp/roblox-studio-followup-ids',[...new Set(studioFollowupIds)].join('\n')+(studioFollowupIds.length?'\n':''));
          fs.writeFileSync('/tmp/roblox-local-f0-private-deploy-ids',[...new Set(localF0PrivateDeployIds)].join('\n')+(localF0PrivateDeployIds.length?'\n':''));
          fs.writeFileSync('/tmp/roblox-open-cloud-transient-probe-failures',transientProbeFailures.map(row=>String(row?.gameId||'')+':HTTP_'+Number(row?.status||0)).filter(Boolean).join('\n')+(transientProbeFailures.length?'\n':''));
          fs.writeFileSync('/tmp/roblox-open-cloud-blocking-probe-failures',blockingProbeFailures.map(row=>String(row?.gameId||'')+':HTTP_'+Number(row?.status||0)).filter(Boolean).join('\n')+(blockingProbeFailures.length?'\n':''));
          console.log(`ROBLOX_STUDIO_MCP_POST_FOUNDATION_READY_COUNT=${new Set(studioFollowupIds).size}`);
          console.log(`ROBLOX_OPEN_CLOUD_PERSISTENT_PROBE_FAILURE_COUNT=${persistentProbeFailures.length}`);
          console.log(`ROBLOX_OPEN_CLOUD_TRANSIENT_PROBE_FAILURE_COUNT=${transientProbeFailures.length}`);
          console.log(`ROBLOX_OPEN_CLOUD_BLOCKING_PROBE_FAILURE_COUNT=${blockingProbeFailures.length}`);
          console.log(`ROBLOX_FOUNDATION_RUNTIME_FAILURE=${failed}`);
          NODE

      - name: Persist runtime tester and QA evidence
        working-directory: runtime
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_STUDIO: ${{ inputs.run_studio || false }}
          RETRY_OPEN_CLOUD_ONLY: ${{ inputs.retry_open_cloud_only || false }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-roblox-tester-qa'
          git config user.email 'actions@users.noreply.github.com'
          patch_file=/tmp/roblox-foundation-runtime-patch.json
          test -f "$patch_file"
          persisted=0
          : > /tmp/roblox-foundation-persist-same-field-conflicts
          for attempt in 1 2 3 4 5; do
            echo "ROBLOX_FOUNDATION_PERSIST_OPTIMISTIC_ATTEMPT=$attempt/5"
            git fetch --no-tags origin "$COMPANY_RUNTIME_BRANCH"
            git reset --hard "origin/$COMPANY_RUNTIME_BRANCH"
            PATCH_FILE="$patch_file" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const patch=JSON.parse(fs.readFileSync(process.env.PATCH_FILE,'utf8'));
          const queuePath='development-queue.json';
          const queue=JSON.parse(fs.readFileSync(queuePath,'utf8'));
          const equal=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
          const conflicts=[];
          let applied=0;

          const currentCandidateVersion=item=>{
            const candidate=item?.robloxRuntimeCandidateEvidence||{};
            if(candidate.published===true&&Number(candidate.versionNumber||0)>0)return Number(candidate.versionNumber);
            return Number(item?.robloxFoundationF0Evidence?.artifactRunId||item?.robloxHeadlessFastMvpEvidence?.artifactRunId||0);
          };

          for(const delta of patch.patches||[]){
            const item=(queue.items||[]).find(row=>String(row?.gameId||'')===String(delta.gameId||''));
            if(!item){
              conflicts.push({gameId:delta.gameId,field:'GAME_ID_MISSING'});
              continue;
            }
            const sourceRevision=String(delta.sourceRevision||'');
            const artifactIdentity=String(delta.artifactIdentity||'');
            const candidateVersionNumber=Number(delta.candidateVersionNumber||0);
            if(sourceRevision&&String(item.robloxSourceCommit||'')!==sourceRevision){
              conflicts.push({gameId:delta.gameId,field:'EXACT_SOURCE_REVISION'});
              continue;
            }
            if(artifactIdentity&&String(item.robloxBuildArtifactIdentity||'')!==artifactIdentity){
              conflicts.push({gameId:delta.gameId,field:'EXACT_ARTIFACT_IDENTITY'});
              continue;
            }
            if(candidateVersionNumber>0&&currentCandidateVersion(item)!==candidateVersionNumber){
              conflicts.push({gameId:delta.gameId,field:'EXACT_CANDIDATE_VERSION'});
              continue;
            }

            const fieldEntries=Object.entries(delta.fields||{});
            const allAlreadyAfter=fieldEntries.every(([key,change])=>{
              const currentPresent=Object.prototype.hasOwnProperty.call(item,key);
              return currentPresent===change.afterPresent
                &&(!currentPresent||equal(item[key],change.after));
            });
            if(allAlreadyAfter)continue;

            if(String(item.updatedAt||'')!==String(delta.beforeUpdatedAt||'')){
              conflicts.push({gameId:delta.gameId,field:'SAME_GAME_ATOMIC_STATE'});
              continue;
            }

            let conflictField='';
            for(const [key,change] of fieldEntries){
              const currentPresent=Object.prototype.hasOwnProperty.call(item,key);
              const alreadyAfter=
                currentPresent===change.afterPresent
                &&(!currentPresent||equal(item[key],change.after));
              if(alreadyAfter)continue;
              const matchesBefore=
                currentPresent===change.beforePresent
                &&(!currentPresent||equal(item[key],change.before));
              if(!matchesBefore){
                conflictField=key;
                break;
              }
            }
            if(conflictField){
              conflicts.push({gameId:delta.gameId,field:conflictField});
              continue;
            }

            for(const [key,change] of Object.entries(delta.fields||{})){
              if(change.afterPresent)item[key]=change.after;
              else delete item[key];
            }
            const currentUpdated=Date.parse(String(item.updatedAt||''))||0;
            const patchUpdated=Date.parse(String(delta.updatedAt||''))||0;
            if(patchUpdated>currentUpdated)item.updatedAt=delta.updatedAt;
            applied++;
          }

          if(applied>0){
            const generatedAt=String(patch.generatedAt||new Date().toISOString());
            const currentQueueUpdated=Date.parse(String(queue.updatedAt||''))||0;
            const patchUpdated=Date.parse(generatedAt)||0;
            if(patchUpdated>currentQueueUpdated)queue.updatedAt=generatedAt;
            fs.writeFileSync(queuePath,JSON.stringify(queue,null,2)+'\n');
          }
          fs.writeFileSync('/tmp/roblox-foundation-persist-same-field-conflicts',conflicts.map(row=>row.gameId+'|'+row.field).join('\n')+(conflicts.length?'\n':''));
          console.log('ROBLOX_FOUNDATION_PERSIST_PATCH_APPLIED='+applied);
          console.log('ROBLOX_FOUNDATION_PERSIST_SAME_FIELD_CONFLICT_COUNT='+conflicts.length);
          for(const row of conflicts)console.log('ROBLOX_FOUNDATION_PERSIST_SAME_FIELD_CONFLICT='+row.gameId+':'+row.field);
          NODE
            git add development-queue.json
            git diff --cached --check
            if git diff --cached --quiet; then
              persisted=1
              echo 'ROBLOX_FOUNDATION_RUNTIME_STATE_CHANGE=NO_CHANGE_OR_ALREADY_MERGED'
              break
            fi
            git commit -m 'runtime: persist Roblox foundation tester QA [skip ci]'
            if git push origin HEAD:"$COMPANY_RUNTIME_BRANCH"; then
              persisted=1
              echo "ROBLOX_FOUNDATION_PERSIST_WRITE=PUSHED:$attempt"
              break
            fi
            echo "ROBLOX_FOUNDATION_PERSIST_CONFLICT_RETRY=$attempt"
            sleep $((attempt*2))
          done
          test "$persisted" = '1'

          if [ -s /tmp/roblox-foundation-persist-same-field-conflicts ]; then
            echo 'ROBLOX_FOUNDATION_PERSIST_REVALIDATION_REQUIRED=YES'
            cat /tmp/roblox-foundation-persist-same-field-conflicts
          else
            echo 'ROBLOX_FOUNDATION_PERSIST_REVALIDATION_REQUIRED=NO'
          fi

          node <<'NODE'
          const fs=require('fs');
          const conflictPath='/tmp/roblox-foundation-persist-same-field-conflicts';
          const conflicts=new Set(
            fs.existsSync(conflictPath)
              ?fs.readFileSync(conflictPath,'utf8').split(/\r?\n/).map(line=>line.split('|')[0].trim()).filter(Boolean)
              :[]
          );
          for(const path of ['/tmp/roblox-f9-ids','/tmp/roblox-studio-followup-ids','/tmp/roblox-local-f0-private-deploy-ids']){
            if(!fs.existsSync(path))continue;
            const ids=[...new Set(fs.readFileSync(path,'utf8').split(/\r?\n/).map(value=>value.trim()).filter(Boolean))]
              .filter(id=>!conflicts.has(id))
              .sort();
            fs.writeFileSync(path,ids.join('\n')+(ids.length?'\n':''));
          }
          console.log('ROBLOX_FOUNDATION_DOWNSTREAM_CONFLICT_FILTER_COUNT='+conflicts.size);
          NODE

          if [ -s /tmp/roblox-foundation-persist-same-field-conflicts ]; then
            cut -d'|' -f1 /tmp/roblox-foundation-persist-same-field-conflicts | sort -u > /tmp/roblox-foundation-revalidation-ids
            while read -r id; do
              [ -n "$id" ] || continue
              args=(workflow run company-development-roblox-post-runtime-qa.yml --repo "$GITHUB_REPOSITORY" --ref main -f game_id="$id")
              if [ "$RUN_STUDIO" = 'true' ]; then args+=(-f run_studio=true); fi
              if [ "$RETRY_OPEN_CLOUD_ONLY" = 'true' ]; then args+=(-f retry_open_cloud_only=true); fi
              gh "${args[@]}"
              echo "ROBLOX_FOUNDATION_CONFLICT_REVALIDATION_DISPATCHED=$id"
            done < /tmp/roblox-foundation-revalidation-ids
          else
            echo 'ROBLOX_FOUNDATION_CONFLICT_REVALIDATION_DISPATCHED=NONE'
          fi
          echo 'ROBLOX_FOUNDATION_RUNTIME_STATE_CHANGE=YES_OR_ALREADY_MERGED'

      - name: Resume repaired local F0 candidates through canonical Roblox runtime
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/roblox-local-f0-private-deploy-ids || { echo 'ROBLOX_LOCAL_F0_RUNTIME_RESUME=NONE'; exit 0; }
          sort -u /tmp/roblox-local-f0-private-deploy-ids -o /tmp/roblox-local-f0-private-deploy-ids
          git fetch --no-tags --depth=1 origin main
          current_main="$(git rev-parse origin/main)"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/company-development-roblox-runtime.yml/runs?per_page=100" > /tmp/roblox-local-f0-runtime-runs.json
          dispatch_count=0
          deduped_count=0
          while read -r id; do
            [ -n "$id" ] || continue
            active="$(GAME_ID="$id" CURRENT_MAIN="$current_main" node - <<'NODE'
          const fs=require('fs');
          const payload=JSON.parse(fs.readFileSync('/tmp/roblox-local-f0-runtime-runs.json','utf8'));
          const states=new Set(['queued','pending','in_progress','requested','waiting']);
          const title='Roblox runtime · '+String(process.env.GAME_ID||'');
          const currentMain=String(process.env.CURRENT_MAIN||'');
          const found=(payload.workflow_runs||[]).some(run=>
            states.has(String(run.status||'').toLowerCase())
            &&String(run.display_title||'')===title
            &&String(run.head_sha||'')===currentMain
          );
          process.stdout.write(found?'yes':'no');
          NODE
            )"
            if [ "$active" = 'yes' ]; then
              deduped_count=$((deduped_count+1))
              echo "ROBLOX_LOCAL_F0_RUNTIME_RESUME=DEDUPED_CURRENT_MAIN:$id:$current_main"
              continue
            fi
            gh workflow run company-development-roblox-runtime.yml --repo "$GITHUB_REPOSITORY" --ref main -f game_id="$id"
            dispatch_count=$((dispatch_count+1))
            echo "ROBLOX_LOCAL_F0_RUNTIME_RESUME=DISPATCHED:$id:$current_main"
          done < /tmp/roblox-local-f0-private-deploy-ids
          echo "ROBLOX_LOCAL_F0_RUNTIME_RESUME_DISPATCH_COUNT=$dispatch_count"
          echo "ROBLOX_LOCAL_F0_RUNTIME_RESUME_DEDUPED_COUNT=$deduped_count"

      - name: Dispatch exact F9 review for every runtime-accepted candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/roblox-f9-ids || exit 0
          sort -u /tmp/roblox-f9-ids -o /tmp/roblox-f9-ids
          candidate_count="$(wc -l < /tmp/roblox-f9-ids | tr -d '[:space:]')"
          candidate_count="${candidate_count:-0}"
          [ "$candidate_count" -gt 0 ] || exit 0

          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/company-development-roblox-final-review-revalidation.yml/runs?per_page=100" > /tmp/roblox-f9-active-runs.json
          node <<'NODE' > /tmp/roblox-f9-active-ids
          const fs=require('fs');
          const payload=JSON.parse(fs.readFileSync('/tmp/roblox-f9-active-runs.json','utf8'));
          const states=new Set(['queued','pending','in_progress','requested']);
          const currentSha=String(process.env.GITHUB_SHA||'').trim();
          const prefix='Roblox F9 · ';
          const ids=new Set();
          for(const run of payload.workflow_runs||[]){
            if(!states.has(String(run.status||'').toLowerCase()))continue;
            if(String(run.head_sha||'')!==currentSha)continue;
            const title=String(run.display_title||'');
            if(!title.startsWith(prefix))continue;
            const id=title.slice(prefix.length).trim();
            if(id&&id!=='scan')ids.add(id);
          }
          for(const id of [...ids].sort())console.log(id);
          NODE

          dispatch_count=0
          deduped_count=0
          while read -r id; do
            [ -n "$id" ] || continue
            if grep -Fxq "$id" /tmp/roblox-f9-active-ids; then
              deduped_count=$((deduped_count+1))
              echo "ROBLOX_F9_EXACT_DISPATCH=DEDUPED_CURRENT_MAIN:$id:$GITHUB_SHA"
              continue
            fi
            gh workflow run company-development-roblox-final-review-revalidation.yml --repo "$GITHUB_REPOSITORY" --ref main -f game_id="$id"
            printf '%s\n' "$id" >> /tmp/roblox-f9-active-ids
            dispatch_count=$((dispatch_count+1))
            echo "ROBLOX_F9_EXACT_DISPATCHED=$id"
          done < /tmp/roblox-f9-ids
          echo "ROBLOX_F9_EXACT_CANDIDATE_COUNT=$candidate_count"
          echo "ROBLOX_F9_EXACT_DISPATCH_COUNT=$dispatch_count"
          echo "ROBLOX_F9_EXACT_DEDUPED_COUNT=$deduped_count"

      - name: Dispatch exact Studio MCP follow-up after new runtime foundation evidence
        if: ${{ false }} # OWNER_DIRECTIVE_2026-10-05_CLOUD_API_ONLY
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/roblox-studio-followup-ids || exit 0
          dispatch_count=0
          while read -r id; do
            [ -n "$id" ] || continue
            gh workflow run company-development-roblox-post-runtime-qa.yml --repo "$GITHUB_REPOSITORY" --ref main -f game_id="$id" -f run_studio=true
            dispatch_count=$((dispatch_count+1))
            echo "ROBLOX_STUDIO_MCP_POST_FOUNDATION_DISPATCH=$id"
          done < /tmp/roblox-studio-followup-ids
          echo "ROBLOX_STUDIO_MCP_POST_FOUNDATION_DISPATCH_COUNT=$dispatch_count"

      - name: Enforce persistent Open Cloud probe failures after evidence persistence
        shell: bash
        run: |
          set -euo pipefail
          transient_file=/tmp/roblox-open-cloud-transient-probe-failures
          blocking_file=/tmp/roblox-open-cloud-blocking-probe-failures
          if [ -s "$transient_file" ]; then
            cat "$transient_file"
            echo 'QUALITY_FIRST_BUILDUP_SHORT_CIRCUIT=ACTIVE'
            echo 'QUALITY_FAILURE_CLASS=INFRASTRUCTURE_OR_EVIDENCE_ONLY'
            echo 'QUALITY_BUILDUP_AUTO_REQUEUE=NO'
            echo 'EXTERNAL_RELEASE_PROBE_SUPPRESSED=NO'
            echo 'RESUME_STAGE=TARGET_PLATFORM_RUNTIME_FOUNDATION'
            echo 'ROBLOX_OPEN_CLOUD_TRANSIENT_PROBE_RETRY=IN_SCAN_BOUNDED'
          fi
          if [ -s "$blocking_file" ]; then
            cat "$blocking_file"
            echo 'ROBLOX_OPEN_CLOUD_PERSISTENT_PROBE_FAILURE=YES'
            echo 'ROBLOX_OPEN_CLOUD_BLOCKING_PROBE_FAILURE=YES'
            exit 1
          fi
          echo 'ROBLOX_OPEN_CLOUD_PERSISTENT_PROBE_FAILURE=NO'
          echo 'ROBLOX_OPEN_CLOUD_BLOCKING_PROBE_FAILURE=NO'

  studio-local-plan:
    # Owner requires cloud API validation only; the legacy local lane is disabled.
    # Planning is read-only control work. Only actual Studio execution consumes the shared Windows host.
    # A skipped job is never Studio actual-play PASS.
    # 계획과 실행은 요청 시점의 동일한 제어 리비전을 사용한다.
    if: ${{ false }} # OWNER_DIRECTIVE_2026-10-05_CLOUD_API_ONLY
    name: plan exact local Studio MCP playtests for earliest eligible artifacts
    concurrency:
      group: roblox-studio-mcp-plan-${{ github.run_id }}
      cancel-in-progress: false
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - name: Checkout current canonical implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.control_revision || github.sha }}
          path: main
          fetch-depth: 1
          fetch-tags: false

      - name: Checkout latest canonical runtime state
        uses: actions/checkout@v4
        with:
          ref: company-runtime
          path: runtime
          fetch-depth: 1
          fetch-tags: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download isolated candidate context
        if: inputs.candidate_context != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.candidate_context }}
          path: candidate-context

      - name: Bind isolated candidate context without canonical state mutation
        if: inputs.candidate_context != ''
        env:
          CANDIDATE_REVISION: ${{ inputs.candidate_revision }}
          CANDIDATE_GAME: ${{ inputs.game_id }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const q=JSON.parse(fs.readFileSync('candidate-context/development-queue.json','utf8'));
          const i=q.items?.[0];
          if(q.items?.length!==1||i.gameId!==process.env.CANDIDATE_GAME||i.robloxSourceCommit!==process.env.CANDIDATE_REVISION||!/^[0-9a-f]{40}$/.test(i.robloxSourceCommit)||!/^[-a-zA-Z0-9_]+$/.test(i.gameId))throw Error('candidate context identity mismatch');
          fs.copyFileSync('candidate-context/development-queue.json','runtime/development-queue.json');
          fs.mkdirSync('main/roblox-games/'+i.gameId,{recursive:true});
          fs.copyFileSync('candidate-context/launch-mvp.json','main/roblox-games/'+i.gameId+'/launch-mvp.json');
          NODE

      - name: Select exact runtime-foundation or internal-release artifacts needing official Studio MCP play
        id: plan
        working-directory: main
        env:
          REQUESTED_GAME_ID: ${{ inputs.game_id || '' }}
          EVENT_NAME: ${{ github.event_name }}
          RECHECK_PRODUCT_FAILURE: ${{ github.event_name == 'workflow_dispatch' && inputs.run_studio == true && inputs.game_id != '' }}
          PUSH_BEFORE: ${{ github.event.before || '' }}
          CANDIDATE_CONTEXT: ${{ inputs.candidate_context }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          trigger_changed=false
          if [ "$EVENT_NAME" = 'push' ] && [[ "$PUSH_BEFORE" =~ ^[0-9a-f]{40}$ ]] && [ "$PUSH_BEFORE" != '0000000000000000000000000000000000000000' ]; then
            git fetch --no-tags --depth=1 origin "$PUSH_BEFORE"
            if ! git diff --quiet "$PUSH_BEFORE" HEAD -- roblox-games/.company-runtime-trigger; then
              trigger_changed=true
            fi
          fi
          export TRIGGER_CHANGED="$trigger_changed"
          if [ -z "$CANDIDATE_CONTEXT" ]; then
            git -C ../runtime fetch --no-tags origin company-runtime
            git -C ../runtime reset --hard origin/company-runtime
          fi
          requested="$REQUESTED_GAME_ID"
          if [ -z "$requested" ] && [ "$EVENT_NAME" = 'push' ] && [ "$trigger_changed" = 'true' ] && [ -f roblox-games/.company-runtime-trigger ]; then
            requested="$(sed -n 's/^gameId:[[:space:]]*//p' roblox-games/.company-runtime-trigger | head -n1 | xargs)"
          fi
          echo "ROBLOX_STUDIO_TRIGGER_CHANGED=$trigger_changed"
          echo "ROBLOX_STUDIO_REQUESTED_GAME_ID=${requested:-ALL_PENDING}"
          echo "trigger_changed=$trigger_changed" >> "$GITHUB_OUTPUT"

          existing_studio_run=''
          if [ -z "$requested" ] && [ "$trigger_changed" != 'true' ] && [ -z "$CANDIDATE_CONTEXT" ]; then
            payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/company-development-roblox-post-runtime-qa.yml/runs?per_page=100")"
            printf '%s' "$payload" | CURRENT_RUN_ID="$GITHUB_RUN_ID" node -e "
              let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{
                const j=JSON.parse(s),states=new Set(['queued','pending','requested','waiting','in_progress']);
                const prefix='Roblox runtime foundation QA · ';
                const current=Number(process.env.CURRENT_RUN_ID||0);
                for(const r of j.workflow_runs||[]){
                  const id=Number(r.id);
                  if(!Number.isFinite(id)||id>=current)continue;
                  if(!states.has(String(r.status||'').toLowerCase()))continue;
                  if(!String(r.display_title||'').startsWith(prefix))continue;
                  process.stdout.write(String(id)+'\n');
                }
              });
            " > /tmp/roblox-existing-studio-run-ids
            while read -r run_id; do
              [ -n "$run_id" ] || continue
              studio_jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" --jq '[.jobs[] | select(.name | startswith("Official Studio MCP actual play ")) | select(.status == "queued" or .status == "pending" or .status == "requested" or .status == "waiting" or .status == "in_progress")] | length' 2>/dev/null || echo 0)"
              if [ "$studio_jobs" != '0' ]; then
                existing_studio_run="$run_id"
                break
              fi
            done < /tmp/roblox-existing-studio-run-ids
          fi

          plan_output="$RUNNER_TEMP/roblox-studio-mcp-matrix.json"
          if [ -n "$existing_studio_run" ]; then
            printf '%s\n' '{"include":[]}' > "$plan_output"
            echo "ROBLOX_STUDIO_GENERIC_SCAN_DEFERRED_FOR_EXISTING_STUDIO_RUN=$existing_studio_run"
          else
            node tools/company-development-roblox-studio-local-play.mjs \
              --mode=plan \
              --queue=../runtime/development-queue.json \
              --roadmap=company-learning/platform-release-roadmap.json \
              --repo-root=. \
              "--game-id=$requested" \
              "--recheck-product-failure=$RECHECK_PRODUCT_FAILURE" \
              "--output=$plan_output"
          fi
          PLAN_OUTPUT="$plan_output" node <<'NODE'
          const fs=require('fs');
          const plan=JSON.parse(fs.readFileSync(process.env.PLAN_OUTPUT,'utf8'));
          const rawInclude=Array.isArray(plan.include)?plan.include:[];
          const workflowRunId=String(process.env.GITHUB_RUN_ID||'').trim();
          const include=rawInclude.map(row=>({
            ...row,
            sessionId:[workflowRunId,String(row.gameId||''),Number(row.artifactRunId||0),Number(row.versionNumber||0)].join(':')
          }));
          if(process.env.CANDIDATE_CONTEXT&&include.length!==1)throw new Error('candidate must schedule exactly one Studio playtest');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'matrix='+JSON.stringify({include})+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'count='+include.length+'\n');
          console.log('ROBLOX_STUDIO_MCP_PLAN_COUNT='+include.length);
          console.log('ROBLOX_STUDIO_MCP_PLAN_RUNNER=HOSTED_CONTROL');
          console.log('ROBLOX_STUDIO_SHARED_HOST_CONSUMED_BY_PLANNER=NO');
          NODE

      - name: Cancel superseded pending Studio runs selected by this exact plan
        if: steps.plan.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          PLANNED_MATRIX: ${{ steps.plan.outputs.matrix }}
          CURRENT_TRIGGER_CHANGED: ${{ steps.plan.outputs.trigger_changed }}
        shell: bash
        run: |
          set -euo pipefail
          planned_games="$(node -e "const m=JSON.parse(process.env.PLANNED_MATRIX||'{\"include\":[]}');process.stdout.write((m.include||[]).map(x=>String(x.gameId||'').trim()).filter(Boolean).join(','))")"
          [ -n "$planned_games" ] || exit 0
          payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/company-development-roblox-post-runtime-qa.yml/runs?per_page=100")"
          printf '%s' "$payload" | CURRENT_RUN_ID="$GITHUB_RUN_ID" node -e "
            let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{
              const j=JSON.parse(s),states=new Set(['queued','pending','requested','waiting','in_progress']);
              const prefix='Roblox runtime foundation QA · ';
              for(const r of j.workflow_runs||[]){
                if(String(r.id)===String(process.env.CURRENT_RUN_ID||''))continue;
                const runId=Number(r.id),currentRunId=Number(process.env.CURRENT_RUN_ID||0);
                if(!Number.isFinite(runId)||!Number.isFinite(currentRunId)||runId>=currentRunId)continue;
                if(!states.has(String(r.status||'').toLowerCase()))continue;
                const title=String(r.display_title||'');
                if(!title.startsWith(prefix))continue;
                const actor=String(r.actor?.login||r.triggering_actor?.login||'').trim().toLowerCase();
                const manualExactDispatch=r.event==='workflow_dispatch'&&title!==prefix+'scan'&&actor!=='github-actions[bot]';
                if(manualExactDispatch)continue;
                process.stdout.write(String(r.id)+'\n');
              }
            });
          " > /tmp/roblox-older-studio-run-ids
          while read -r run_id; do
            [ -n "$run_id" ] || continue
            run_event="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.event' 2>/dev/null || true)"
            run_head="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.head_sha' 2>/dev/null || true)"
            older_exact_trigger=false
            older_trigger_game=''
            if [ "$run_event" = 'push' ] && [[ "$run_head" =~ ^[0-9a-f]{40}$ ]]; then
              older_exact_trigger="$(gh api "repos/$GITHUB_REPOSITORY/commits/$run_head" --jq '[.files[]?.filename] | any(. == "roblox-games/.company-runtime-trigger")' 2>/dev/null || echo false)"
              if [ "$older_exact_trigger" = 'true' ]; then
                older_trigger_game="$(
                  gh api "repos/$GITHUB_REPOSITORY/contents/roblox-games/.company-runtime-trigger?ref=$run_head" --jq '.content' 2>/dev/null |
                    tr -d '\n' | base64 --decode 2>/dev/null |
                    sed -n 's/^gameId:[[:space:]]*//p' | head -n1 | xargs || true
                )"
                if [ "$CURRENT_TRIGGER_CHANGED" != 'true' ]; then
                  echo "ROBLOX_SUPERSEDED_PENDING_STUDIO_RUN_PRESERVED_EXACT_TRIGGER=$run_id:$older_trigger_game"
                  continue
                fi
                case ",$planned_games," in
                  *",$older_trigger_game,"*)
                    echo "ROBLOX_SUPERSEDED_PENDING_STUDIO_RUN_OWNER_EXACT_REPLACES_OLDER_EXACT=$run_id:$older_trigger_game"
                    ;;
                  *)
                    echo "ROBLOX_SUPERSEDED_PENDING_STUDIO_RUN_OWNER_EXACT_PREEMPTS_UNRELATED_EXACT=$run_id:$older_trigger_game"
                    ;;
                esac
              fi
            fi
            jobs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" 2>/dev/null || echo '{"jobs":[]}' )"
            decision="$(printf '%s' "$jobs_json" | PLANNED_GAMES="$planned_games" OWNER_EXACT="$CURRENT_TRIGGER_CHANGED" OLDER_EXACT="$older_exact_trigger" node -e "
              let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{
                const jobs=(JSON.parse(s).jobs||[]),prefix='Official Studio MCP actual play ';
                const planned=new Set(String(process.env.PLANNED_GAMES||'').split(',').filter(Boolean));
                const ownerExact=String(process.env.OWNER_EXACT||'').toLowerCase()==='true';
                const olderExact=String(process.env.OLDER_EXACT||'').toLowerCase()==='true';
                const studio=jobs.filter(j=>String(j.name||'').startsWith(prefix));
                if(studio.some(j=>String(j.status||'').toLowerCase()==='in_progress'))return process.stdout.write('PRESERVE_ACTIVE');
                const waiting=studio.filter(j=>['queued','pending','requested','waiting'].includes(String(j.status||'').toLowerCase()));
                if(!waiting.length)return process.stdout.write('NONE');
                if(ownerExact)return process.stdout.write('CANCEL');
                const games=waiting.map(j=>String(j.name||'').slice(prefix.length));
                process.stdout.write(games.every(g=>planned.has(g))?'CANCEL':'PRESERVE_UNRELATED');
              });
            ")"
            if [ "$decision" = 'PRESERVE_ACTIVE' ]; then
              echo "ROBLOX_SUPERSEDED_PENDING_STUDIO_RUN_PRESERVED_ACTIVE=$run_id"
              continue
            fi
            if [ "$decision" = 'PRESERVE_UNRELATED' ]; then
              echo "ROBLOX_SUPERSEDED_PENDING_STUDIO_RUN_PRESERVED_UNRELATED=$run_id"
              continue
            fi
            [ "$decision" = 'CANCEL' ] || continue
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null 2>&1 || true
            run_status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status' 2>/dev/null || true)"
            if [[ "$run_status" =~ ^(queued|pending|requested|waiting)$ ]]; then
              gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/force-cancel" >/dev/null 2>&1 || true
            fi
            echo "ROBLOX_SUPERSEDED_PENDING_STUDIO_RUN_CANCELLED=$run_id"
          done < /tmp/roblox-older-studio-run-ids

      - name: Persist reboot-safe Studio reservations before Windows execution
        if: steps.plan.outputs.count != '0' && inputs.candidate_context == ''
        working-directory: runtime
        env:
          PLANNED_MATRIX: ${{ steps.plan.outputs.matrix }}
          CONTROL_REVISION: ${{ inputs.control_revision || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-roblox-studio-session'
          git config user.email 'actions@users.noreply.github.com'
          persisted=0
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin company-runtime
            git reset --hard origin/company-runtime
            node <<'NODE'
          const fs=require('fs');
          const q=JSON.parse(fs.readFileSync('development-queue.json','utf8'));
          const matrix=JSON.parse(process.env.PLANNED_MATRIX||'{"include":[]}');
          const rows=Array.isArray(matrix.include)?matrix.include:[];
          const stamp=new Date().toISOString();
          let reserved=0,stale=0;
          for(const row of rows){
            const gameId=String(row?.gameId||'').trim();
            const item=(q.items||[]).find(x=>String(x?.gameId||'').trim()===gameId);
            if(!item){stale++;continue;}
            const sourceRevision=String(row?.sourceRevision||'').trim();
            const artifactIdentity=String(row?.artifactIdentity||'').trim();
            const candidate=item.robloxRuntimeCandidateEvidence||{};
            const currentVersion=candidate.published===true&&Number(candidate.versionNumber||0)>0
              ?Number(candidate.versionNumber)
              :Number(item.robloxFoundationF0Evidence?.artifactRunId||item.robloxHeadlessFastMvpEvidence?.artifactRunId||0);
            const exact=
              sourceRevision&&artifactIdentity
              &&String(item.robloxSourceCommit||'')===sourceRevision
              &&String(item.robloxBuildArtifactIdentity||'')===artifactIdentity
              &&Number(row?.versionNumber||0)===currentVersion;
            if(!exact){
              stale++;
              console.log('ROBLOX_STUDIO_REBOOT_CHECKPOINT_STALE_SKIP='+gameId);
              continue;
            }
            const prior=item.robloxStudioRuntimeSession&&typeof item.robloxStudioRuntimeSession==='object'
              ?item.robloxStudioRuntimeSession:{};
            item.robloxStudioRuntimeSession={
              version:1,
              sessionId:String(row?.sessionId||''),
              workflowRunId:Number(process.env.GITHUB_RUN_ID||0),
              workflowRunAttempt:Number(process.env.GITHUB_RUN_ATTEMPT||0),
              controlRevision:String(process.env.CONTROL_REVISION||''),
              gameId,
              sourceRevision,
              artifactIdentity,
              artifactRunId:Number(row?.artifactRunId||0),
              candidateVersionNumber:Number(row?.versionNumber||0),
              status:'QUEUED_FOR_STUDIO',
              queuedAt:stamp,
              interruptionRetryCount:Number(prior.interruptionRetryCount||0),
              rebootSafeCheckpoint:true,
              hostStateAuthoritative:false,
              companyRuntimeAuthoritative:true
            };
            item.updatedAt=stamp;
            reserved++;
          }
          if(reserved){
            q.updatedAt=stamp;
            fs.writeFileSync('development-queue.json',JSON.stringify(q,null,2)+'\n');
          }
          console.log('ROBLOX_STUDIO_REBOOT_CHECKPOINT_RESERVED='+reserved);
          console.log('ROBLOX_STUDIO_REBOOT_CHECKPOINT_STALE='+stale);
          NODE
            git add development-queue.json
            git diff --cached --check
            if git diff --cached --quiet; then
              persisted=1
              echo 'ROBLOX_STUDIO_REBOOT_CHECKPOINT_WRITE=NO_CHANGE'
              break
            fi
            git commit -m 'runtime: checkpoint reboot-safe Studio sessions [skip ci]'
            if git push origin HEAD:company-runtime; then
              persisted=1
              echo "ROBLOX_STUDIO_REBOOT_CHECKPOINT_WRITE=PUSHED:$attempt"
              break
            fi
            sleep $((attempt*2))
          done
          test "$persisted" = 1
          echo 'ROBLOX_STUDIO_PC_STATE_AUTHORITY=NONE'
          echo 'ROBLOX_STUDIO_COMPANY_RUNTIME_CHECKPOINT_AUTHORITY=YES'

  studio-mcp-auto-play:
    name: Official Studio MCP actual play ${{ matrix.gameId }}
    concurrency:
      group: roblox-studio-shared-host
      cancel-in-progress: false
      queue: max
    needs: studio-local-plan
    if: always() && needs.studio-local-plan.result == 'success' && needs.studio-local-plan.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.studio-local-plan.outputs.matrix) }}
    runs-on: [self-hosted, Windows, X64, roblox-studio-authenticated]
    timeout-minutes: 25
    steps:
      - name: Clear only previous automated evidence files
        shell: powershell -NoLogo -NoProfile -NonInteractive -WindowStyle Hidden -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $sessionId = "${{ github.run_id }}-${{ github.run_attempt }}-" + ([Guid]::NewGuid().ToString('N').Substring(0,8))
          $sessionRoot = Join-Path $env:RUNNER_TEMP ("studio-qa\" + $sessionId)
          New-Item -ItemType Directory -Force -Path $sessionRoot | Out-Null
          "VIBE2_STUDIO_PACKAGE_ROOT=$sessionRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          foreach ($name in @('studio-captures','company-roblox-studio-mcp-runtime.json')) {
            $previous = Join-Path $env:RUNNER_TEMP $name
            if (Test-Path $previous) { Remove-Item $previous -Recurse -Force }
          }

      - name: Checkout central policy and helper
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.control_revision || github.sha }}
          path: main
          fetch-depth: 1
          fetch-tags: false

      - name: Checkout canonical runtime state
        uses: actions/checkout@v4
        with:
          ref: company-runtime
          path: runtime
          fetch-depth: 1
          fetch-tags: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download isolated candidate context
        if: inputs.candidate_context != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.candidate_context }}
          path: candidate-context

      - name: Bind isolated candidate context without canonical state mutation
        if: inputs.candidate_context != ''
        shell: powershell -NoLogo -NoProfile -NonInteractive -WindowStyle Hidden -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          CANDIDATE_REVISION: ${{ inputs.candidate_revision }}
          CANDIDATE_GAME: ${{ inputs.game_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          node -e "const fs=require('fs');const q=JSON.parse(fs.readFileSync('candidate-context/development-queue.json','utf8'));const i=q.items?.[0];if(q.items?.length!==1||i.gameId!==process.env.CANDIDATE_GAME||i.robloxSourceCommit!==process.env.CANDIDATE_REVISION||!/^[0-9a-f]{40}$/.test(i.robloxSourceCommit)||!/^[-a-zA-Z0-9_]+$/.test(i.gameId))throw Error('candidate context identity mismatch');fs.copyFileSync('candidate-context/development-queue.json','runtime/development-queue.json');fs.mkdirSync('main/roblox-games/'+i.gameId,{recursive:true});fs.copyFileSync('candidate-context/launch-mvp.json','main/roblox-games/'+i.gameId+'/launch-mvp.json');"
          if ($LASTEXITCODE -ne 0) { throw 'isolated candidate context rejected' }

      - name: Verify official Studio MCP policy and runner
        id: mcp_preflight
        shell: powershell -NoLogo -NoProfile -NonInteractive -WindowStyle Hidden -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          & node 'main/tools/company-development-roblox-studio-local-play.mjs' --mode=check-head "--control-revision=${{ inputs.control_revision || github.sha }}"
          if ($LASTEXITCODE -ne 0) { throw 'Stale Studio workflow rejected before any Studio launch or cleanup' }
          & node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('main/company-learning/platform-release-roadmap.json','utf8').replace(/^\\uFEFF/,''));const s=r?.roblox?.studioExecution||{};const ok=s.officialStudioMcpOnly===true&&s.robloxPlayerAutomationForbidden===true&&s.undocumentedStudioCliAutomationForbidden===true&&s.externalGuiAutomationForbidden===true&&s.localPlaceFileRequired===true;if(!ok){console.error('ROBLOX_STUDIO_MCP_POLICY_MISMATCH');process.exit(1)}console.log('ROBLOX_STUDIO_MCP_POLICY=PASS')"
          if ($LASTEXITCODE -ne 0) { throw 'official Studio MCP policy validation failed' }
          if ($env:RUNNER_OS -ne 'Windows') { throw 'Roblox Studio MCP runner must be Windows' }
          $studio = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Roblox\Versions') -Directory -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            ForEach-Object { Join-Path $_.FullName 'RobloxStudioBeta.exe' } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not $studio) { throw 'RobloxStudioBeta.exe not found' }

          $mcpBat = Join-Path $env:LOCALAPPDATA 'Roblox\mcp.bat'
          $studioDir = Split-Path -Parent $studio
          $mcpExe = Join-Path $studioDir 'StudioMCP.exe'
          if (-not (Test-Path $mcpExe)) {
            $mcpExe = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Roblox\Versions') -Recurse -File -Filter 'StudioMCP.exe' -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -ExpandProperty FullName -First 1
          }
          if (-not (Test-Path $mcpBat) -and -not ($mcpExe -and (Test-Path $mcpExe))) {
            throw 'Official Roblox Studio MCP launcher and StudioMCP.exe not found'
          }

          $mcpFallbackCommand = ''
          $mcpBatchHealth = 'MISSING'
          if (Test-Path $mcpBat) {
            $batchText = Get-Content $mcpBat -Raw -ErrorAction SilentlyContinue
            $knownBrokenBatch = ($batchText -match '(?im)^\s*else\b') -or ($batchText -match '(?i)%B[/\\]\.\.[/\\]StudioMCP\.exe') -or ($batchText -match '(?m)\)\s*\r?\n\s*else\s*\(')
            if ($knownBrokenBatch) {
              if (-not ($mcpExe -and (Test-Path $mcpExe))) {
                throw 'Documented Roblox mcp.bat is malformed and official StudioMCP.exe fallback is unavailable'
              }
              $mcpCommand = $mcpExe
              $mcpFallbackCommand = $mcpExe
              $mcpLaunchKind = 'OFFICIAL_STUDIOMCP_EXE_FALLBACK_BROKEN_DOCUMENTED_BATCH'
              $mcpBatchHealth = 'BROKEN_USE_OFFICIAL_EXE'
            } else {
              $mcpCommand = $mcpBat
              $mcpLaunchKind = 'ROBLOX_DOCUMENTED_MCP_BATCH'
              $mcpBatchHealth = 'READY'
              if ($mcpExe -and (Test-Path $mcpExe)) {
                $mcpFallbackCommand = $mcpExe
              }
            }
          } elseif ($mcpExe -and (Test-Path $mcpExe)) {
            $mcpCommand = $mcpExe
            $mcpFallbackCommand = $mcpExe
            $mcpLaunchKind = 'OFFICIAL_STUDIOMCP_EXE_FALLBACK_BATCH_MISSING'
          } else {
            throw 'Official Roblox Studio MCP launcher unavailable'
          }
          Write-Host "ROBLOX_STUDIO_MCP_BATCH_HEALTH=$mcpBatchHealth"

          # Retire only legacy QA windows that opened the former shared temporary package.
          $legacyRoot = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP 'company-roblox-studio-package')) + '\'
          $legacyPattern = '(?i)(?:"|\s)' + [regex]::Escape($legacyRoot) + '[^"]+\.rbxlx?(?:"|\s|$)'
          $legacyProcesses = @(Get-CimInstance Win32_Process -Filter "Name = 'RobloxStudioBeta.exe'" -ErrorAction SilentlyContinue)
          foreach ($legacy in $legacyProcesses) {
            if ([string]$legacy.CommandLine -notmatch $legacyPattern) { continue }
            $owned = Get-Process -Id ([int]$legacy.ProcessId) -ErrorAction SilentlyContinue
            if (-not $owned -or $owned.ProcessName -ne 'RobloxStudioBeta') { continue }
            if ([math]::Abs(($owned.StartTime.ToUniversalTime() - $legacy.CreationDate.ToUniversalTime()).TotalSeconds) -gt 1) { continue }
            try {
              Stop-Process -InputObject $owned -Force -ErrorAction Stop
              if (-not $owned.WaitForExit(60000)) { throw 'Owned legacy Studio has not exited; next launch remains blocked' }
              Write-Host "ROBLOX_STUDIO_LEGACY_QA_WINDOW_CLOSED=$($legacy.ProcessId)"
            } finally { $owned.Dispose() }
          }

          if (Get-Process RobloxStudioBeta -ErrorAction SilentlyContinue) {
            & node 'main/tools/company-development-roblox-studio-local-play.mjs' '--mode=mcp-cleanup' "--mcp-command=$mcpCommand"
            if ($LASTEXITCODE -ne 0) { throw 'Existing Studio ownership could not be verified; preserving sessions' }
            for ($cleanupWait = 0; $cleanupWait -lt 60; $cleanupWait++) {
              if (-not (Get-Process RobloxStudioBeta -ErrorAction SilentlyContinue)) { break }
              Start-Sleep -Seconds 1
            }
            if (Get-Process RobloxStudioBeta -ErrorAction SilentlyContinue) {
              throw 'Unowned or unresponsive Studio session remains; preserving it without duplicate launch'
            }
          }

          $officialVersionsRoot = Join-Path $env:LOCALAPPDATA 'Roblox\Versions'
          Write-Host 'ROBLOX_STUDIO_MCP_OTHER_PROCESS_PRESERVED=YES'

          $settingsRoot = Join-Path $env:LOCALAPPDATA 'Roblox\AssistantSettings'
          $settingDiag = Join-Path $env:RUNNER_TEMP 'roblox-studio-mcp-setting-diagnostic.json'
          $diagArgs = @(
            '--mode=diagnose-setting',
            "--settings-root=$settingsRoot",
            "--output=$settingDiag"
          )
          & node 'main/tools/company-development-roblox-studio-local-play.mjs' @diagArgs
          if ($LASTEXITCODE -ne 0) { throw 'Studio MCP read-only setting diagnostic failed' }
          $diag = Get-Content $settingDiag -Raw | ConvertFrom-Json
          $settingState = [string]$diag.state
          $settingsFileCount = [int]$diag.fileCount
          $enabledCount = [int]$diag.enabledCount
          $disabledCount = [int]$diag.disabledCount
          $parseErrorCount = [int]$diag.parseErrorCount
          $candidatePathCount = [int]$diag.candidatePathCount
          $candidatePaths = @($diag.candidatePaths) -join ','
          "VIBE2_ROBLOX_STUDIO_MCP_SETTING_ENABLED=$settingState" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "ROBLOX_STUDIO_MCP_SETTING_ENABLED=$settingState"
          Write-Host "ROBLOX_STUDIO_MCP_SETTING_FILE_COUNT=$settingsFileCount"
          Write-Host "ROBLOX_STUDIO_MCP_SETTING_ENABLED_COUNT=$enabledCount"
          Write-Host "ROBLOX_STUDIO_MCP_SETTING_DISABLED_COUNT=$disabledCount"
          Write-Host "ROBLOX_STUDIO_MCP_SETTING_PARSE_ERROR_COUNT=$parseErrorCount"
          Write-Host "ROBLOX_STUDIO_MCP_SETTING_CANDIDATE_PATH_COUNT=$candidatePathCount"
          Write-Host "ROBLOX_STUDIO_MCP_SETTING_CANDIDATE_PATHS=$candidatePaths"
          Write-Host 'ROBLOX_STUDIO_MCP_SETTING_MUTATION=NO'

          $settingConfirmed = $settingState -eq 'YES'
          $settingExplicitlyDisabled = $settingState -eq 'NO'
          $settingProbeRequired = -not $settingConfirmed -and -not $settingExplicitlyDisabled
          $settingBlocked = $settingExplicitlyDisabled
          "setting_confirmed=$($settingConfirmed.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "setting_probe_required=$($settingProbeRequired.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "setting_blocked=$($settingBlocked.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($settingBlocked) {
            $blockedResult = Join-Path $env:RUNNER_TEMP 'company-roblox-studio-mcp-runtime.json'
            $settingSignature = "ROBLOX_STUDIO_MCP_SETTING_ENABLE_REQUIRED:$settingState"
            @{
              version = 1
              authority = 'roblox-official-studio-mcp-runtime'
              runtimeVerified = $false
              capabilities = @{
                officialStudioMcp = $false
                playMode = $false
                mcpInput = $false
                screenCapture = $false
                consoleCapture = $false
              }
              actions = @()
              checkpoints = @()
              errors = @(@{
                type = 'studio-mcp-infrastructure-or-runtime-error'
                actionId = $null
                signature = $settingSignature
              })
              metrics = @{
                distinctFrameChange = $false
                consoleErrorCount = 1
              }
              rawSourceIncluded = $false
              rawGameplayValuesIncluded = $false
              rawViewportIncluded = $false
            } | ConvertTo-Json -Depth 8 | Out-File -FilePath $blockedResult -Encoding utf8
            "VIBE2_STUDIO_RUNTIME_RESULT=$blockedResult" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "ROBLOX_STUDIO_MCP_PREREQUISITE=ENABLE_IN_STUDIO_ASSISTANT_UI:$settingState"
            Write-Host 'ROBLOX_STUDIO_MCP_AUTOMATIC_SETTING_MUTATION=NO'
            Write-Host 'ROBLOX_STUDIO_MCP_PLAY_ATTEMPT=SKIPPED_EXPLICITLY_DISABLED'
          } elseif ($settingProbeRequired) {
            Write-Host "ROBLOX_STUDIO_MCP_SETTING_DIAGNOSTIC_ADVISORY=$settingState"
            Write-Host 'ROBLOX_STUDIO_MCP_ENABLEMENT_AUTHORITY=OFFICIAL_REQUIRED_TOOL_HANDSHAKE'
            Write-Host 'ROBLOX_STUDIO_MCP_PLAY_ATTEMPT=PROBE_OFFICIAL_TOOL_HANDSHAKE'
          } else {
            Write-Host 'ROBLOX_STUDIO_MCP_SETTING_DIAGNOSTIC=CONFIRMED_ENABLED'
          }

          "VIBE2_ROBLOX_STUDIO_MCP_SETTINGS_ROOT=$settingsRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VIBE2_ROBLOX_STUDIO_PATH=$studio" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VIBE2_ROBLOX_STUDIO_MCP_COMMAND=$mcpCommand" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VIBE2_ROBLOX_STUDIO_MCP_FALLBACK_COMMAND=$mcpFallbackCommand" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VIBE2_ROBLOX_STUDIO_MCP_LAUNCH_KIND=$mcpLaunchKind" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $studioVersion = (Get-Item $studio).VersionInfo.ProductVersion
          $mcpVersion = if ($mcpExe -and (Test-Path $mcpExe)) { (Get-Item $mcpExe).VersionInfo.ProductVersion } else { 'NONE' }
          Write-Host "ROBLOX_STUDIO_PRODUCT_VERSION=$studioVersion"
          Write-Host "ROBLOX_STUDIO_MCP_PRODUCT_VERSION=$mcpVersion"
          Write-Host "ROBLOX_STUDIO_MCP_LAUNCH_KIND=$mcpLaunchKind"
          Write-Host 'ROBLOX_STUDIO_MCP_BATCH_REWRITE=NO'
          Write-Host 'ROBLOX_STUDIO_MCP_THIRD_PARTY_BRIDGE=NO'
          Write-Host 'ROBLOX_STUDIO_MCP_RUNNER=PASS'
          Write-Host 'ROBLOX_PLAYER_AUTOMATION=NO'
          Write-Host 'ROBLOX_UNDOCUMENTED_STUDIO_CLI_AUTOMATION=NO'

      - name: Download exact immutable Roblox build artifact
        id: artifact_download
        continue-on-error: true
        if: steps.mcp_preflight.outputs.setting_blocked != 'true'
        uses: actions/download-artifact@v4
        with:
          name: development-roblox-package-${{ matrix.gameId }}
          path: ${{ env.VIBE2_STUDIO_PACKAGE_ROOT }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ matrix.artifactRunId }}

      - name: Rebuild byte-identical exact artifact when GitHub artifact API is unavailable
        if: inputs.candidate_context == '' && steps.mcp_preflight.outputs.setting_blocked != 'true' && steps.artifact_download.outcome != 'success'
        shell: powershell -NoLogo -NoProfile -NonInteractive -WindowStyle Hidden -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GAME_ID: ${{ matrix.gameId }}
          SOURCE_REVISION: ${{ matrix.sourceRevision }}
          EXPECTED_ARTIFACT: ${{ matrix.artifactIdentity }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:VIBE2_STUDIO_PACKAGE_ROOT
          if ([string]::IsNullOrWhiteSpace($root)) { throw 'Isolated Studio package directory missing' }
          Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
          $packageDir = Join-Path $root 'packages'
          $evidenceDir = Join-Path $root 'results'
          New-Item -ItemType Directory -Force -Path $packageDir,$evidenceDir | Out-Null

          $metadataJson = & node -e "const fs=require('fs');const q=JSON.parse(fs.readFileSync(process.argv[1],'utf8').replace(/^\\uFEFF/,''));const row=(q.items||[]).find(x=>x.gameId===process.argv[2]);if(!row)process.exit(2);const sourcePath=row.robloxProjectPath||row.targetSourcePath||('roblox-games/'+row.gameId);const baselineSource=row.designBaselineSource||'';process.stdout.write(JSON.stringify({sourcePath,baselineSource}));" 'runtime/development-queue.json' $env:GAME_ID
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($metadataJson)) { throw 'Studio MCP exact rebuild metadata lookup failed' }
          $metadata = $metadataJson | ConvertFrom-Json
          $sourcePath = [string]$metadata.sourcePath
          $baselineSource = [string]$metadata.baselineSource
          if ([string]::IsNullOrWhiteSpace($sourcePath) -or [string]::IsNullOrWhiteSpace($baselineSource)) {
            throw 'Studio MCP exact rebuild source or baseline metadata missing'
          }

          git -C main fetch --no-tags origin $env:SOURCE_REVISION
          if ($LASTEXITCODE -ne 0) { throw 'Studio MCP exact source revision fetch failed' }

          $baseline = Join-Path (Resolve-Path 'runtime').Path $baselineSource
          if (-not (Test-Path $baseline)) { throw "Studio MCP exact rebuild baseline missing: $baselineSource" }

          $rojoZip = Join-Path $env:RUNNER_TEMP 'rojo-7.7.0-windows-x86_64.zip'
          $rojoDir = Join-Path $env:RUNNER_TEMP 'rojo-7.7.0-windows-x86_64'
          Remove-Item -Recurse -Force $rojoDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $rojoDir | Out-Null
          & curl.exe -fL --retry 3 --retry-delay 2 -o $rojoZip 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip'
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Windows Rojo download failed' }
          $rojoZipHash = (Get-FileHash -Path $rojoZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($rojoZipHash -ne '2179c44862a10ecbd725bdfeb4abc64e16dc4aad9b6c8f3e1a7c46a87280b949') {
            throw "Pinned Windows Rojo SHA256 mismatch: $rojoZipHash"
          }
          Expand-Archive -Path $rojoZip -DestinationPath $rojoDir -Force
          $rojo = Get-ChildItem -Path $rojoDir -Recurse -File -Filter 'rojo.exe' | Select-Object -ExpandProperty FullName -First 1
          if (-not $rojo) { throw 'Pinned Windows Rojo executable missing after extraction' }

          $buildEvidence = Join-Path $evidenceDir 'build.json'
          $buildArgs = @(
            '--repo-root=main',
            "--game-id=$env:GAME_ID",
            "--source-path=$sourcePath",
            "--source-revision=$env:SOURCE_REVISION",
            "--baseline=$baseline",
            "--rojo=$rojo",
            "--output-dir=$packageDir",
            "--evidence=$buildEvidence"
          )
          & node 'main/tools/company-development-roblox-package.mjs' @buildArgs
          if ($LASTEXITCODE -ne 0) { throw 'Studio MCP exact artifact deterministic rebuild failed' }

          $rebuilt = (& node -e "const e=require(process.argv[1]);process.stdout.write(String(e.artifactIdentity||''));" $buildEvidence).Trim().ToLowerInvariant()
          $expected = ([string]$env:EXPECTED_ARTIFACT).Trim().ToLowerInvariant()
          if ($rebuilt -ne $expected) { throw "Studio MCP exact rebuild identity mismatch: $rebuilt != $expected" }

          Write-Host "ROBLOX_STUDIO_MCP_ARTIFACT_REBUILD=PASS:$rebuilt"
          Write-Host 'ROBLOX_STUDIO_MCP_ARTIFACT_SOURCE=DETERMINISTIC_EXACT_HASH_MATCH'
          Write-Host 'ROBLOX_STUDIO_MCP_ARTIFACT_API_FALLBACK=NO_GAMEPLAY_OR_RUNTIME_BYPASS'

      - name: Bind and open exact local Place artifact
        if: steps.mcp_preflight.outputs.setting_blocked != 'true'
        shell: powershell -NoLogo -NoProfile -NonInteractive -WindowStyle Hidden -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          EXPECTED_ARTIFACT: ${{ matrix.artifactIdentity }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:VIBE2_STUDIO_PACKAGE_ROOT
          if ([string]::IsNullOrWhiteSpace($root)) { throw 'Isolated Studio package directory missing' }
          $places = @(Get-ChildItem -Path $root -Recurse -File | Where-Object { $_.Extension -in @('.rbxl','.rbxlx') })
          if ($places.Count -ne 1) { throw "Expected exactly one local Place artifact, found $($places.Count)" }
          $hash = (Get-FileHash -Path $places[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = ([string]$env:EXPECTED_ARTIFACT).ToLowerInvariant()
          if ("sha256:$hash" -ne $expected) { throw "Local Place SHA256 mismatch: sha256:$hash != $expected" }
          $places[0].IsReadOnly = $false

          & node 'main/tools/company-development-roblox-studio-local-play.mjs' --mode=validate-place "--place=$($places[0].FullName)"
          if ($LASTEXITCODE -ne 0) { throw 'Local Place rejected by PRE_PLAY_STUDIO_MODAL_GATE before Studio launch' }
          Write-Host 'ROBLOX_STUDIO_PRE_PLAY_STUDIO_MODAL_GATE=PASS'

          $existingStudio = @(Get-Process RobloxStudioBeta -ErrorAction SilentlyContinue)
          if ($existingStudio.Count) {
            Write-Host "ROBLOX_STUDIO_USER_SESSION_PRESERVED=YES:existing=$($existingStudio.Count)"
            throw 'Roblox Studio already open on shared runner; reschedule isolated Studio QA'
          }
          $exactPlaceStarted = [DateTime]::UtcNow
          # Publish ownership before launch so cleanup also covers a slow launcher handoff.
          "VIBE2_LOCAL_PLACE_FILE=$($places[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VIBE2_STUDIO_LAUNCH_STARTED=$($exactPlaceStarted.ToString('o'))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $placeLaunchProcess = Start-Process -FilePath $env:VIBE2_ROBLOX_STUDIO_PATH -ArgumentList @($places[0].FullName) -PassThru
          "VIBE2_STUDIO_PROCESS_ID=$($placeLaunchProcess.Id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VIBE2_STUDIO_PROCESS_IDS=$($placeLaunchProcess.Id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "ROBLOX_STUDIO_MCP_EXACT_PLACE_PROCESS_ID=$($placeLaunchProcess.Id)"
          $exactPlacePattern = '(?i)(?:^|[\s"])' + [regex]::Escape($places[0].FullName) + '(?=[\s"]|$)'
          # Observe the launch family before waiting on GUI initialization; launchers can exit meanwhile.
          $launchFamily = @{}
          $launchFamily[[string]$placeLaunchProcess.Id] = @{ processId = $placeLaunchProcess.Id; createdAt = $placeLaunchProcess.StartTime.ToUniversalTime().ToString('o'); parentProcessId = $PID }
          "VIBE2_STUDIO_OWNED_PROCESS_RECORDS=$(@($launchFamily.Values) | ConvertTo-Json -Compress)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $launchHandles = @{}
          $null = $placeLaunchProcess.Handle
          $launchHandles[[string]$placeLaunchProcess.Id] = $placeLaunchProcess
          $familyChangedAt = [DateTime]::UtcNow
          $studioProcess = $null
          $ownedStudioProcesses = @()
          try {
            for ($processProbe = 1; $processProbe -le 180; $processProbe++) {
              $observed = @(Get-CimInstance Win32_Process -Filter "Name LIKE 'Roblox%'" -ErrorAction Stop)
              $familyChanged = $false
              for ($generation = 0; $generation -lt 8; $generation++) {
                foreach ($record in $observed) {
                  $key = [string]$record.ProcessId
                  if ($launchFamily.ContainsKey($key)) { continue }
                  $parentKey = [string]$record.ParentProcessId
                  if (-not $launchFamily.ContainsKey($parentKey)) { continue }
                  $parent = $observed | Where-Object { [string]$_.ProcessId -eq $parentKey } | Select-Object -First 1
                  $parentCreated = [DateTime]::Parse($launchFamily[$parentKey].createdAt).ToUniversalTime()
                  if ($record.CreationDate.ToUniversalTime() -lt $parentCreated) { continue }
                  if ($parent) {
                    if ([math]::Abs(($parent.CreationDate.ToUniversalTime() - $parentCreated).TotalMilliseconds) -gt 10) { continue }
                  } else {
                    # Retain a verified process handle across exit; never infer ownership from a dead PID alone.
                    $parentHandle = $launchHandles[$parentKey]
                    if (-not $parentHandle) { continue }
                    try {
                      if ([math]::Abs(($parentHandle.StartTime.ToUniversalTime() - $parentCreated).TotalMilliseconds) -gt 10) { continue }
                      if (-not $parentHandle.HasExited) { continue }
                      if ($record.CreationDate.ToUniversalTime() -gt $parentHandle.ExitTime.ToUniversalTime()) { continue }
                    } catch { continue }
                    Write-Host "ROBLOX_STUDIO_PARENT_EXIT_HANDOFF=$parentKey`:$key"
                  }
                  $launchFamily[$key] = @{ processId = [int]$record.ProcessId; createdAt = $record.CreationDate.ToUniversalTime().ToString('o'); parentProcessId = [int]$record.ParentProcessId }
                  $childHandle = $null
                  try {
                    $childHandle = Get-Process -Id ([int]$record.ProcessId) -ErrorAction Stop
                    $null = $childHandle.Handle
                    if ([math]::Abs(($childHandle.StartTime.ToUniversalTime() - $record.CreationDate.ToUniversalTime()).TotalMilliseconds) -le 10) {
                      $launchHandles[$key] = $childHandle
                      $childHandle = $null
                    }
                  } catch { Write-Host "ROBLOX_STUDIO_PROCESS_HANDLE_UNAVAILABLE=$key" }
                  finally { if ($childHandle) { $childHandle.Dispose() } }
                  $familyChanged = $true
                }
              }
              if ($familyChanged) {
                $familyChangedAt = [DateTime]::UtcNow
                $familyJson = @($launchFamily.Values) | ConvertTo-Json -Compress
                "VIBE2_STUDIO_OWNED_PROCESS_RECORDS=$familyJson" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                Write-Host "ROBLOX_STUDIO_OWNED_PROCESS_CHAIN=$familyJson"
              }
              $ownedStudioProcesses = @($observed | Where-Object { $_.Name -eq 'RobloxStudioBeta.exe' -and $launchFamily.ContainsKey([string]$_.ProcessId) -and [math]::Abs(($_.CreationDate.ToUniversalTime() - [DateTime]::Parse($launchFamily[[string]$_.ProcessId].createdAt).ToUniversalTime()).TotalMilliseconds) -le 10 })
              if ($ownedStudioProcesses.Count -eq 1 -and ([DateTime]::UtcNow - $familyChangedAt).TotalSeconds -ge 15) {
                $candidate = Get-Process -Id ([int]$ownedStudioProcesses[0].ProcessId) -ErrorAction SilentlyContinue
                if ($candidate -and $candidate.MainWindowHandle -ne 0) { $studioProcess = $candidate; break }
              }
              Start-Sleep -Seconds 1
            }
          } finally {
            foreach ($ownedHandle in $launchHandles.Values) { $ownedHandle.Dispose() }
          }
          if ($ownedStudioProcesses.Count -ne 1 -or -not $studioProcess) { throw 'Expected one provably owned exact Place process after launch; no duplicate launch allowed' }
          Write-Host "ROBLOX_STUDIO_MCP_PRE_MCP_PROCESS_READY_COUNT=$($ownedStudioProcesses.Count)"
          $ownedRecord = $ownedStudioProcesses[0]
          if (-not $studioProcess -or $studioProcess.ProcessName -ne 'RobloxStudioBeta' -or [math]::Abs(($studioProcess.StartTime.ToUniversalTime() - $ownedRecord.CreationDate.ToUniversalTime()).TotalSeconds) -gt 1) {
            throw 'Exact Studio process handed off without provable ownership; preserve all other Studio windows'
          }
          try {
            if ($studioProcess.WaitForInputIdle(30000)) { Write-Host 'ROBLOX_STUDIO_GUI_READY=YES' }
            else { Write-Host 'ROBLOX_STUDIO_GUI_READY=TIMEOUT_CONTINUE_MCP_PROBE' }
          } catch { Write-Host 'ROBLOX_STUDIO_GUI_READY=UNAVAILABLE_CONTINUE_MCP_PROBE' }
          $ownedStudioIds = @([string]$studioProcess.Id)
          $env:VIBE2_STUDIO_PROCESS_ID = [string]$studioProcess.Id
          $env:VIBE2_STUDIO_PROCESS_IDS = $ownedStudioIds -join ','

          $assistantReady = $false
          for ($probe = 1; $probe -le 8; $probe++) {
            $recentStudioLogs = @(Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Roblox\logs') -File -Filter '*.log' -ErrorAction SilentlyContinue |
              Where-Object { $_.LastWriteTimeUtc -ge $exactPlaceStarted.AddSeconds(-2) } |
              Sort-Object LastWriteTimeUtc -Descending |
              Select-Object -First 4)
            foreach ($logFile in $recentStudioLogs) {
              if (Select-String -Path $logFile.FullName -Pattern 'AssistantVersion:|Running plugin sabuiltin_Assistant\.rbxm' -Quiet -ErrorAction SilentlyContinue) {
                $assistantReady = $true
                break
              }
            }
            if ($assistantReady) { break }
            Start-Sleep -Seconds 1
          }
          if ($assistantReady) {
            Write-Host 'ROBLOX_STUDIO_MCP_EXACT_ASSISTANT_LOG_READY=YES'
          } else {
            Write-Host 'ROBLOX_STUDIO_MCP_EXACT_ASSISTANT_LOG_READY=UNKNOWN_CONTINUE_OFFICIAL_HANDSHAKE'
          }
          Write-Host 'ROBLOX_STUDIO_MCP_ASSISTANT_LOG_GATE=ADVISORY_ONLY'

          "VIBE2_LOCAL_PLACE_FILE=$($places[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VIBE2_STUDIO_PROCESS_ID=$($studioProcess.Id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VIBE2_STUDIO_PROCESS_IDS=$($ownedStudioIds -join ',')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VIBE2_STUDIO_EXPECTED_NAME=$($places[0].BaseName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "ROBLOX_STUDIO_LOCAL_ARTIFACT_BIND=PASS:$hash"
          Write-Host "ROBLOX_STUDIO_PROCESS_ID=$($studioProcess.Id)"
          Write-Host "ROBLOX_STUDIO_MCP_OWNED_PROCESS_IDS=$($ownedStudioIds -join ',')"
          Write-Host 'ROBLOX_STUDIO_MCP_SINGLE_EXACT_STUDIO=YES'
          Start-Sleep -Seconds 3

          $postLaunchDiag = Join-Path $env:RUNNER_TEMP 'roblox-studio-mcp-setting-post-launch.json'
          $postLaunchArgs = @(
            '--mode=diagnose-setting',
            "--settings-root=$env:VIBE2_ROBLOX_STUDIO_MCP_SETTINGS_ROOT",
            "--output=$postLaunchDiag"
          )
          & node 'main/tools/company-development-roblox-studio-local-play.mjs' @postLaunchArgs
          if ($LASTEXITCODE -ne 0) { throw 'Studio MCP post-launch read-only setting diagnostic failed' }
          $postLaunch = Get-Content $postLaunchDiag -Raw | ConvertFrom-Json
          Write-Host "ROBLOX_STUDIO_MCP_POST_LAUNCH_SETTING_ENABLED=$([string]$postLaunch.state)"
          Write-Host "ROBLOX_STUDIO_MCP_POST_LAUNCH_SETTING_ENABLED_COUNT=$([int]$postLaunch.enabledCount)"
          Write-Host "ROBLOX_STUDIO_MCP_POST_LAUNCH_SETTING_DISABLED_COUNT=$([int]$postLaunch.disabledCount)"
          Write-Host "ROBLOX_STUDIO_MCP_POST_LAUNCH_SETTING_CANDIDATE_PATHS=$(@($postLaunch.candidatePaths) -join ',')"
          "VIBE2_ROBLOX_STUDIO_MCP_POST_LAUNCH_SETTING_ENABLED=$([string]$postLaunch.state)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VIBE2_ROBLOX_STUDIO_MCP_POST_LAUNCH_SETTING_CANDIDATE_PATH_COUNT=$([int]$postLaunch.candidatePathCount)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "ROBLOX_STUDIO_MCP_POST_LAUNCH_SETTING_CANDIDATE_PATH_COUNT=$([int]$postLaunch.candidatePathCount)"
          Write-Host 'ROBLOX_STUDIO_MCP_POST_LAUNCH_SETTING_MUTATION=NO'

      - name: Run actual local play through official Studio MCP
        id: studio_play
        if: steps.mcp_preflight.outputs.setting_blocked != 'true'
        shell: powershell -NoLogo -NoProfile -NonInteractive -WindowStyle Hidden -ExecutionPolicy Bypass -Command ". '{0}'"
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          $result = Join-Path $env:RUNNER_TEMP 'company-roblox-studio-mcp-runtime.json'
          "VIBE2_STUDIO_RUNTIME_RESULT=$result" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $attempt = 0
          $sessionCompleted = $false
          $runtimeVerified = $false
          $enablementRequired = $false
          $toolProviderTimeoutObserved = $false
          $studioAttachmentFailureObserved = $false
          $productFailureObserved = $false
          $productFailureSignature = ''

          & git -C main fetch --no-tags --depth=1 origin '${{ matrix.sourceRevision }}'
          if ($LASTEXITCODE -ne 0) { throw 'Exact Studio source revision fetch failed before static multiplayer binding' }
          Write-Host 'ROBLOX_STUDIO_EXACT_SOURCE_REVISION_FETCH=PASS'

          while ($true) {
            $attempt++
            if (Test-Path $result) { Remove-Item $result -Force -ErrorAction SilentlyContinue }
            $mcpCommandForAttempt = $env:VIBE2_ROBLOX_STUDIO_MCP_COMMAND
            if ($attempt -gt 1 -and $env:VIBE2_ROBLOX_STUDIO_MCP_FALLBACK_COMMAND) {
              $mcpCommandForAttempt = $env:VIBE2_ROBLOX_STUDIO_MCP_FALLBACK_COMMAND
              Write-Host "ROBLOX_STUDIO_MCP_TRANSPORT_FALLBACK=OFFICIAL_STUDIOMCP_EXE:attempt=$attempt"
            }
            Write-Host "ROBLOX_STUDIO_MCP_SESSION_ATTEMPT=$attempt"
            $runnerArgs = @(
              '--mode=mcp-run',
              '--queue=runtime/development-queue.json',
              '--game-id=${{ matrix.gameId }}',
              '--source-revision=${{ matrix.sourceRevision }}',
              '--artifact-identity=${{ matrix.artifactIdentity }}',
              "--control-revision=${{ inputs.control_revision || github.sha }}",
              "--mcp-command=$mcpCommandForAttempt",
              "--studio-name=$env:VIBE2_STUDIO_EXPECTED_NAME",
              "--output=$result",
              '--timeout=45000',
              '--tool-attempts=12',
              '--tool-delay-ms=3000',
              "--setting-state=$env:VIBE2_ROBLOX_STUDIO_MCP_POST_LAUNCH_SETTING_ENABLED",
              "--setting-candidate-path-count=$env:VIBE2_ROBLOX_STUDIO_MCP_POST_LAUNCH_SETTING_CANDIDATE_PATH_COUNT",
              "--actual-play-contract=main/roblox-games/${{ matrix.gameId }}/launch-mvp.json",
              "--audit-profile=${{ matrix.auditProfile || 'FAST_DEEP' }}"
            )
            & node 'main/tools/company-development-roblox-studio-local-play.mjs' @runnerArgs
            if ($LASTEXITCODE -eq 0) {
              $sessionCompleted = $true
              $runtimeState = (& node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync(process.argv[1],'utf8').replace(/^\\uFEFF/,''));process.stdout.write(r?.runtimeVerified===true?'PASS':'FAIL')" $result).Trim()
              if ($LASTEXITCODE -ne 0) { throw 'Studio MCP completed-session runtime evidence parse failed' }
              $runtimeVerified = $runtimeState -eq 'PASS'
              Write-Host "ROBLOX_STUDIO_MCP_SESSION_COMPLETED=YES:attempt=$attempt"
              Write-Host "ROBLOX_STUDIO_MCP_RUNTIME_VERIFIED=$runtimeState"
              break
            }

            if (Test-Path $result) {
              Write-Host "ROBLOX_STUDIO_MCP_FAILURE_EVIDENCE_PRESERVED=$result"
              $failureSignature = (& node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync(process.argv[1],'utf8').replace(/^\\uFEFF/,''));process.stdout.write(String(r?.errors?.[0]?.signature||''))" $result).Trim()
              if ($LASTEXITCODE -ne 0) { throw 'Studio MCP failure evidence parse failed' }
              $productFailureState = (& node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync(process.argv[1],'utf8').replace(/^\\uFEFF/,''));const q=Array.isArray(r?.qualityFailureKinds)?r.qualityFailureKinds.filter(Boolean):[];const e=Array.isArray(r?.errors)?r.errors:[];process.stdout.write(q.length>0||e.some(x=>/^studio-product-/i.test(String(x?.type||'')))?'PRODUCT':'NO')" $result).Trim()
              if ($LASTEXITCODE -ne 0) { throw 'Studio MCP product failure evidence parse failed' }
              if ($productFailureState -eq 'PRODUCT') {
                $productFailureObserved = $true
                $productFailureSignature = $failureSignature
                Write-Host "ROBLOX_STUDIO_MCP_PRODUCT_FAILURE_PRESERVED=YES:attempt=$attempt:signature=$productFailureSignature"
                break
              }
              $requiredToolsEmpty = ($failureSignature -match 'ROBLOX_STUDIO_MCP_REQUIRED_TOOLS_NOT_READY') -and ($failureSignature -match 'available=:')
              $mcpServerNotEnabled = $failureSignature -match 'stderrHint=MCP_SERVER_NOT_ENABLED'
              $emptyAssistantSettingsAfterReady = $failureSignature -match 'settingHint=ASSISTANT_SETTINGS_EMPTY_AFTER_ASSISTANT_READY'
              $toolProviderTimeout = $failureSignature -match 'stderrHint=STUDIO_TOOL_PROVIDER_TIMEOUT'
              $studioAttachmentFailure = $failureSignature -match 'ROBLOX_STUDIO_MCP_NO_STUDIO_AFTER_ATTACH_WAIT'
              if ($studioAttachmentFailure) {
                $studioAttachmentFailureObserved = $true
                Write-Host "ROBLOX_STUDIO_MCP_STUDIO_ATTACHMENT_PENDING=attempt=$attempt"
              }
              if ($requiredToolsEmpty -and $toolProviderTimeout) {
                $toolProviderTimeoutObserved = $true
                Write-Host "ROBLOX_STUDIO_MCP_TOOL_PROVIDER_TIMEOUT=attempt=$attempt"
              }
              if ($requiredToolsEmpty -and ($mcpServerNotEnabled -or $emptyAssistantSettingsAfterReady)) {
                $enablementRequired = $true
                Write-Host 'ROBLOX_STUDIO_MCP_PREREQUISITE=ENABLE_STUDIO_AS_MCP_SERVER_IN_ASSISTANT'
                if ($emptyAssistantSettingsAfterReady) {
                  Write-Host 'ROBLOX_STUDIO_MCP_PREREQUISITE_EVIDENCE=ASSISTANT_SETTINGS_EMPTY_AFTER_ASSISTANT_READY'
                }
                Write-Host 'ROBLOX_STUDIO_MCP_AUTOMATIC_SETTING_MUTATION=NO'
                break
              }
            }
            # The official launcher may hand the same Place to a replacement process.
            # Rebind only this job's unique Place path, never a user window or a fresh launch.
            $exactPlacePattern = '(?i)(?:^|[\s"])' + [regex]::Escape($env:VIBE2_LOCAL_PLACE_FILE) + '(?=[\s"]|$)'
            $launchStarted = [DateTime]::Parse($env:VIBE2_STUDIO_LAUNCH_STARTED).ToUniversalTime()
            $launchFamily = @{}
            $ownershipProofs = ConvertFrom-Json -InputObject $env:VIBE2_STUDIO_OWNED_PROCESS_RECORDS
            foreach ($proof in $ownershipProofs) { $launchFamily[[string]$proof.processId] = $proof }
            $ownedStudio = $null
            for ($handoffWait = 0; $handoffWait -lt 180; $handoffWait++) {
              $ownedRecords = @(Get-CimInstance Win32_Process -Filter "Name = 'RobloxStudioBeta.exe'" -ErrorAction Stop | Where-Object { $_.CreationDate.ToUniversalTime() -ge $launchStarted.AddSeconds(-2) -and (([string]$_.CommandLine -match $exactPlacePattern) -or ($launchFamily.ContainsKey([string]$_.ProcessId) -and [math]::Abs(($_.CreationDate.ToUniversalTime() - [DateTime]::Parse($launchFamily[[string]$_.ProcessId].createdAt).ToUniversalTime()).TotalMilliseconds) -le 10)) })
              if ($ownedRecords.Count -eq 1) {
                $record = $ownedRecords[0]
                $candidate = Get-Process -Id ([int]$record.ProcessId) -ErrorAction SilentlyContinue
                if ($candidate -and $candidate.ProcessName -eq 'RobloxStudioBeta' -and [math]::Abs(($candidate.StartTime.ToUniversalTime() - $record.CreationDate.ToUniversalTime()).TotalSeconds) -le 1) { $ownedStudio = $candidate; break }
              }
              Start-Sleep -Seconds 1
            }
            if (-not $ownedStudio) { throw 'Exact Place process ownership unavailable after handoff wait; preserve other windows without relaunch' }
            if ([string]$ownedStudio.Id -ne $env:VIBE2_STUDIO_PROCESS_ID) { Write-Host "ROBLOX_STUDIO_MCP_OWNED_PROCESS_HANDOFF=$($env:VIBE2_STUDIO_PROCESS_ID):$($ownedStudio.Id)" }
            $env:VIBE2_STUDIO_PROCESS_ID = [string]$ownedStudio.Id
            $env:VIBE2_STUDIO_PROCESS_IDS = [string]$ownedStudio.Id
            "VIBE2_STUDIO_PROCESS_ID=$($ownedStudio.Id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "VIBE2_STUDIO_PROCESS_IDS=$($ownedStudio.Id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "ROBLOX_STUDIO_MCP_RECONNECT_SAME_PROCESS=$($ownedStudio.Id):attempt=$attempt"
            Start-Sleep -Seconds 10
          }

          if (-not $sessionCompleted) {
            Write-Host "ROBLOX_STUDIO_MCP_SETTING_DIAGNOSTIC=$env:VIBE2_ROBLOX_STUDIO_MCP_SETTING_ENABLED"
            if ($toolProviderTimeoutObserved -or $studioAttachmentFailureObserved) {
              $studioLogsRoot = Join-Path $env:LOCALAPPDATA 'Roblox\logs'
              $latestStudioLog = Get-ChildItem $studioLogsRoot -File -Filter '*.log' -ErrorAction SilentlyContinue |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 1
              if ($latestStudioLog) {
                $diagnosticLines = @(Get-Content $latestStudioLog.FullName -Tail 5000 -ErrorAction SilentlyContinue |
                  Select-String -Pattern 'MCP|Assistant|StudioMCP|tool provider|RBX_STUDIO_NS|named pipe|connection|connected client' |
                  Select-Object -Last 60)
                Write-Host "ROBLOX_STUDIO_MCP_STUDIO_LOG_MATCH_COUNT=$($diagnosticLines.Count)"
                foreach ($match in $diagnosticLines) {
                  $safeLine = [string]$match.Line
                  if ($env:USERPROFILE) { $safeLine = $safeLine.Replace($env:USERPROFILE,'%USERPROFILE%') }
                  if ($safeLine.Length -gt 700) { $safeLine = $safeLine.Substring(0,700) }
                  Write-Host "ROBLOX_STUDIO_MCP_STUDIO_LOG=$safeLine"
                }
              } else {
                Write-Host 'ROBLOX_STUDIO_MCP_STUDIO_LOG=NOT_FOUND'
              }
            }
            if ($productFailureObserved) {
              throw "official Roblox Studio product failure preserved for repair: $productFailureSignature"
            }
            if ($enablementRequired) {
              throw 'official Roblox Studio MCP tools unavailable; enable Studio as MCP server in Assistant'
            }
            if ($toolProviderTimeoutObserved) {
              throw 'official Roblox Studio MCP tool provider remained unavailable after exact-session reconnects'
            }
            if ($studioAttachmentFailureObserved) {
              throw 'official Roblox Studio MCP client connected but Studio instance registration remained empty after exact-session reconnects'
            }
            throw 'official Roblox Studio MCP play ended without verified runtime evidence'
          }
          if ($runtimeVerified) {
            Write-Host 'ROBLOX_STUDIO_MCP_ACTUAL_PLAY=PASS'
          } else {
            Write-Host 'ROBLOX_STUDIO_MCP_ACTUAL_PLAY=RUNTIME_FAIL'
            Write-Host 'ROBLOX_STUDIO_MCP_RUNTIME_FAILURE_RETRY=SKIPPED_SESSION_HEALTHY'
          }

      - name: Finalize Studio session after final capture
        if: always()
        shell: powershell -NoLogo -NoProfile -NonInteractive -WindowStyle Hidden -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host 'ROBLOX_STUDIO_POST_CAPTURE_FINALIZE=AUTOMATED'
          Write-Host 'ROBLOX_STUDIO_MANUAL_SAVE_REQUIRED=NO'
          Write-Host 'ROBLOX_STUDIO_PLAYTEST_SOURCE_MUTATION_PERSIST=NO'
          Write-Host 'ROBLOX_STUDIO_MCP_POST_CAPTURE_UI_RELEASED=YES'

      - name: Persist exact Studio MCP play evidence
        id: persist
        if: always()
        shell: powershell -NoLogo -NoProfile -NonInteractive -WindowStyle Hidden -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GAME_ID: ${{ matrix.gameId }}
          SOURCE_REVISION: ${{ matrix.sourceRevision }}
          ARTIFACT_IDENTITY: ${{ matrix.artifactIdentity }}
          ARTIFACT_RUN_ID: ${{ matrix.artifactRunId }}
          UNIVERSE_ID: ${{ matrix.universeId }}
          PLACE_ID: ${{ matrix.placeId }}
          VERSION_NUMBER: ${{ matrix.versionNumber }}
          STUDIO_STEP_SUCCEEDED: ${{ steps.studio_play.outcome == 'success' }}
          STUDIO_STEP_OUTCOME: ${{ steps.studio_play.outcome }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:VIBE2_STUDIO_RUNTIME_RESULT -or -not (Test-Path $env:VIBE2_STUDIO_RUNTIME_RESULT)) {
            Write-Host 'ROBLOX_STUDIO_MCP_EVIDENCE_PERSIST=SKIPPED_NO_MCP_RUNTIME_EVIDENCE'
            Write-Host 'ROBLOX_STUDIO_MCP_EXISTING_EVIDENCE_PRESERVED=YES'
            if ($env:STUDIO_STEP_OUTCOME -eq 'failure' -or $env:STUDIO_STEP_OUTCOME -eq 'success') {
              throw 'Studio play produced no runtime report; actual play is unverified'
            }
            exit 0
          }

          if ('${{ inputs.candidate_context }}' -eq '') {
            git -C runtime fetch --no-tags origin company-runtime
            if ($LASTEXITCODE -ne 0) { throw 'company-runtime refresh failed' }
            git -C runtime reset --hard origin/company-runtime
            if ($LASTEXITCODE -ne 0) { throw 'company-runtime reset failed' }
          }

          $persistArgs = @(
            '--mode=persist',
            '--queue=runtime/development-queue.json',
            "--runtime=$env:VIBE2_STUDIO_RUNTIME_RESULT",
            "--game-id=$env:GAME_ID",
            "--source-revision=$env:SOURCE_REVISION",
            "--artifact-identity=$env:ARTIFACT_IDENTITY",
            "--artifact-run-id=$env:ARTIFACT_RUN_ID",
            "--universe-id=$env:UNIVERSE_ID",
            "--place-id=$env:PLACE_ID",
            "--version-number=$env:VERSION_NUMBER",
            "--workflow-run-id=${{ github.run_id }}",
            "--session-id=${{ matrix.sessionId }}",
            "--studio-step-succeeded=$env:STUDIO_STEP_SUCCEEDED"
          )
          & node 'main/tools/company-development-roblox-studio-local-play.mjs' @persistArgs
          if ($LASTEXITCODE -ne 0) { throw 'Studio MCP play evidence validation failed' }

          if ('${{ inputs.candidate_context }}' -ne '') {
            New-Item -ItemType Directory -Force -Path candidate-result | Out-Null
            Copy-Item runtime/development-queue.json candidate-result/development-queue.json
            Copy-Item $env:VIBE2_STUDIO_RUNTIME_RESULT candidate-result/studio-runtime.json
            Write-Host 'ROBLOX_CANDIDATE_STUDIO_CANONICAL_WRITE=NO'
            exit 0
          }

          git -C runtime config user.name 'jaewoon-roblox-studio-mcp'
          git -C runtime config user.email 'actions@users.noreply.github.com'
          $pushed = $false
          $attempt = 0
          while (-not $pushed) {
            $attempt++
            git -C runtime add development-queue.json
            git -C runtime diff --cached --check
            if ($LASTEXITCODE -ne 0) { throw 'runtime evidence diff check failed' }

            git -C runtime diff --cached --quiet
            if ($LASTEXITCODE -eq 0) {
              Write-Host "ROBLOX_STUDIO_MCP_RUNTIME_STATE_CHANGE=NO_OR_ALREADY_CONVERGED:attempt=$attempt"
              $pushed = $true
              break
            }

            git -C runtime commit -m 'runtime: persist official Studio MCP actual play [skip ci]'
            if ($LASTEXITCODE -ne 0) { throw 'runtime evidence commit failed' }
            git -C runtime push origin HEAD:company-runtime
            if ($LASTEXITCODE -eq 0) {
              Write-Host "ROBLOX_STUDIO_MCP_RUNTIME_PUSH=PASS:attempt=$attempt"
              $pushed = $true
              break
            }

            Write-Host "ROBLOX_STUDIO_MCP_RUNTIME_PUSH_CONFLICT=REAPPLY_LATEST:attempt=$attempt"
            git -C runtime fetch --no-tags origin company-runtime
            if ($LASTEXITCODE -ne 0) { throw 'runtime refresh after push conflict failed' }
            git -C runtime reset --hard origin/company-runtime
            if ($LASTEXITCODE -ne 0) { throw 'runtime reset after push conflict failed' }

            & node 'main/tools/company-development-roblox-studio-local-play.mjs' @persistArgs
            if ($LASTEXITCODE -ne 0) { throw 'Studio MCP evidence reapply on latest runtime failed' }
            $retryDelay = [math]::Min(30,[math]::Max(2,$attempt * 2))
            Write-Host "ROBLOX_STUDIO_MCP_RUNTIME_PUSH_RETRY_DELAY=$retryDelay"
            Start-Sleep -Seconds $retryDelay
          }

          $state = (& node -e "const fs=require('fs');const q=JSON.parse(fs.readFileSync('runtime/development-queue.json','utf8'));const row=(q.items||[]).find(x=>x.gameId===process.env.GAME_ID);if(!row){console.error('ROBLOX_STUDIO_MCP_QUEUE_ITEM_MISSING:'+process.env.GAME_ID);process.exit(2)}const e=row.robloxInternalVibePlayEvidence||{};if(e.pass===true){process.stdout.write('PASS')}else if(e.infrastructureFailure===true){process.stdout.write('INFRA')}else{process.stdout.write('FAIL')}" ).Trim()
          if ($LASTEXITCODE -eq 2) { throw "ROBLOX_STUDIO_MCP_QUEUE_ITEM_MISSING:$env:GAME_ID" }
          if ($LASTEXITCODE -ne 0) { throw 'Studio MCP persisted-state verification failed' }
          if ($state -eq 'PASS') {
            Write-Host "ROBLOX_STUDIO_MCP_PLAY_PASS=$env:GAME_ID"
          } elseif ($state -eq 'INFRA') {
            Write-Host "ROBLOX_STUDIO_MCP_INFRASTRUCTURE_PENDING=$env:GAME_ID"
          } else {
            throw "ROBLOX_STUDIO_MCP_PLAY_FAILED:$env:GAME_ID"
          }

      - name: Upload Studio captures and runtime report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-captures-${{ matrix.gameId }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/studio-captures
            ${{ runner.temp }}/company-roblox-studio-mcp-runtime.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload isolated candidate Studio evidence
        if: always() && inputs.candidate_context != ''
        uses: actions/upload-artifact@v4
        with:
          name: roblox-candidate-studio-${{ matrix.gameId }}
          path: candidate-result
          if-no-files-found: error
          retention-days: 7

      - name: Close owned Studio after evidence persistence
        if: always()
        shell: powershell -NoLogo -NoProfile -NonInteractive -WindowStyle Hidden -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:VIBE2_LOCAL_PLACE_FILE -or -not $env:VIBE2_STUDIO_LAUNCH_STARTED) {
            Write-Host 'ROBLOX_STUDIO_AUTOMATED_CLOSE_AFTER_EVIDENCE=NO_OWNED_LAUNCH'
            exit 0
          }
          $exactPlacePattern = '(?i)(?:^|[\s"])' + [regex]::Escape($env:VIBE2_LOCAL_PLACE_FILE) + '(?=[\s"]|$)'
          $launchStarted = [DateTime]::Parse($env:VIBE2_STUDIO_LAUNCH_STARTED).ToUniversalTime()
          $launchFamily = @{}
          if ($env:VIBE2_STUDIO_OWNED_PROCESS_RECORDS) {
            # Windows PowerShell 5.1 emits a JSON array as one pipeline object.
            # Assign first, then enumerate its records rather than wrapping that object in @().
            $ownershipProofs = ConvertFrom-Json -InputObject $env:VIBE2_STUDIO_OWNED_PROCESS_RECORDS
            foreach ($proof in $ownershipProofs) { $launchFamily[[string]$proof.processId] = $proof }
          }
          Write-Host "ROBLOX_STUDIO_OWNERSHIP_RESTORED_COUNT=$($launchFamily.Count)"
          # Rediscover the exact writable Place instead of trusting a launcher PID that may have exited.
          # 정상 소유 프로세스를 실제 종료한 뒤에는 연속 두 번 비어 있으면 즉시 슬롯을 반환한다.
          # 소유 프로세스를 한 번도 찾지 못한 예외 경로만 기존 15회 탐색을 유지한다.
          $ownedObserved = $false
          $emptyOwnedProbes = 0
          for ($closeProbe = 0; $closeProbe -lt 15; $closeProbe++) {
            $ownedRecords = @(Get-CimInstance Win32_Process -Filter "Name = 'RobloxStudioBeta.exe'" -ErrorAction Stop | Where-Object { $_.CreationDate.ToUniversalTime() -ge $launchStarted.AddSeconds(-2) -and (([string]$_.CommandLine -match $exactPlacePattern) -or ($launchFamily.ContainsKey([string]$_.ProcessId) -and [math]::Abs(($_.CreationDate.ToUniversalTime() - [DateTime]::Parse($launchFamily[[string]$_.ProcessId].createdAt).ToUniversalTime()).TotalMilliseconds) -le 10)) })
            if ($ownedRecords.Count -gt 0) {
              $ownedObserved = $true
              $emptyOwnedProbes = 0
            } elseif ($ownedObserved) {
              $emptyOwnedProbes++
              if ($emptyOwnedProbes -ge 2) {
                Write-Host "ROBLOX_STUDIO_CLOSE_STABLE_EMPTY=YES:probes=$emptyOwnedProbes"
                break
              }
            }
            foreach ($record in $ownedRecords) {
              $ownedStudio = Get-Process -Id ([int]$record.ProcessId) -ErrorAction SilentlyContinue
              if (-not $ownedStudio -or $ownedStudio.ProcessName -ne 'RobloxStudioBeta') { continue }
              if ([math]::Abs(($ownedStudio.StartTime.ToUniversalTime() - $record.CreationDate.ToUniversalTime()).TotalSeconds) -gt 1) { continue }
              try {
                Stop-Process -InputObject $ownedStudio -Force -ErrorAction Stop
                # A retained process object may remain queryable after exit; wait on its verified handle.
                if (-not $ownedStudio.WaitForExit(60000)) {
                  throw "Owned Studio has not exited; next launch must remain blocked:process=$($ownedStudio.Id)"
                }
                Write-Host "ROBLOX_STUDIO_AUTOMATED_CLOSE_AFTER_EVIDENCE=YES:process=$($ownedStudio.Id):exitConfirmed=YES"
              } finally { $ownedStudio.Dispose() }
            }
            Start-Sleep -Seconds 1
          }
          $remainingOwned = @(Get-CimInstance Win32_Process -Filter "Name = 'RobloxStudioBeta.exe'" -ErrorAction Stop | Where-Object { $_.CreationDate.ToUniversalTime() -ge $launchStarted.AddSeconds(-2) -and [string]$_.CommandLine -match $exactPlacePattern })
          if ($remainingOwned.Count) { throw 'Exact Place processes remain after owned-session cleanup' }
          Write-Host 'ROBLOX_STUDIO_OWNED_PLACE_PROCESS_REMAINING=0'
          # A pathless child must not be mistaken for a clean host or killed by guesswork.
          $unattributed = @(Get-CimInstance Win32_Process -Filter "Name = 'RobloxStudioBeta.exe'" -ErrorAction Stop)
          foreach ($record in $unattributed) {
            Write-Host ('ROBLOX_STUDIO_UNATTRIBUTED_PROCESS=' + (@{
              processId = [int]$record.ProcessId
              parentProcessId = [int]$record.ParentProcessId
              createdAt = $record.CreationDate.ToUniversalTime().ToString('o')
              exactPlaceArgument = [bool]([string]$record.CommandLine -match $exactPlacePattern)
            } | ConvertTo-Json -Compress))
          }
          if ($unattributed.Count) { throw 'Studio processes remain without proven Place ownership; preserved for diagnosis, host cleanup is not verified' }
          Write-Host 'ROBLOX_STUDIO_HOST_PROCESS_REMAINING=0'

      - name: Refill existing 24H development loop after verified play
        if: inputs.candidate_context == '' && steps.studio_play.outcome == 'success' && steps.persist.outcome == 'success'
        shell: powershell -NoLogo -NoProfile -NonInteractive -WindowStyle Hidden -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_ID: ${{ matrix.gameId }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $body = @{
            event_type = 'vibe2-fanin-refill'
            client_payload = @{
              source_run = "${{ github.run_id }}"
              source_attempt = "${{ github.run_attempt }}"
              source_task = "$env:GAME_ID"
              source_outcome = 'VERIFIED'
              reason = 'roblox-official-studio-mcp-actual-play'
            }
          } | ConvertTo-Json -Depth 5
          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/dispatches" -Headers $headers -Body $body -ContentType 'application/json'
          Write-Host "ROBLOX_STUDIO_MCP_VIBE_REFILL_DISPATCHED=$env:GAME_ID"

  verified-asset-promotion:
    name: promote exact runtime-verified company assets
    needs: [studio-mcp-auto-play]
    if: always() && inputs.candidate_context == '' && needs.studio-mcp-auto-play.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout current main for company asset promotion
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
          fetch-depth: 1
          fetch-tags: false

      - name: Checkout latest canonical runtime state
        uses: actions/checkout@v4
        with:
          ref: company-runtime
          path: runtime
          fetch-depth: 1
          fetch-tags: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build exact runtime-verified asset promotions
        id: asset_promotion
        working-directory: main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git reset --hard origin/main
          echo "base_main_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git -C ../runtime fetch --no-tags origin company-runtime
          git -C ../runtime reset --hard origin/company-runtime
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {promoteVerifiedCompanyAssetsFromRuntimeEvidence} from './assets/vibe-studio-asset-universe.js';
          const queue=JSON.parse(fs.readFileSync('../runtime/development-queue.json','utf8'));
          let registry=JSON.parse(fs.readFileSync('company-asset-library.json','utf8'));
          const promoted=[];
          const reviewed=[];
          for(const item of queue.items||[]){
            const plan=item?.robloxAssetRuntimePromotionPlan;
            if(!plan||plan.status!=='PENDING_EXACT_NATIVE_RUNTIME'||!Array.isArray(plan.candidates)||!plan.candidates.length)continue;
            const sourceRevision=String(item?.robloxSourceCommit||'').trim();
            const artifactIdentity=String(item?.robloxBuildArtifactIdentity||'').trim();
            if(!/^[0-9a-f]{40}$/.test(sourceRevision)||plan.promotedMainSha!==sourceRevision)continue;
            const studio=item?.robloxInternalVibePlayEvidence||{};
            const studioBinding=item?.robloxStudioAssetRuntimeBindingEvidence||{};
            const performancePass=(studio.scenarioCoverage||[]).some(row=>String(row?.id||'')==='adaptive-performance-budget'&&row?.pass===true);
            const exactStudio=Boolean(
              item.robloxInternalPlaytestPassed===true
              &&studio.pass===true
              &&studio.currentSourceArtifactBinding===true
              &&String(studio.sourceRevision||'')===sourceRevision
              &&String(studio.artifactIdentity||'')===artifactIdentity
            );
            const exactBinding=Boolean(
              item.robloxStudioAssetRuntimeBindingPassed===true
              &&String(studioBinding.sourceRevision||'')===sourceRevision
              &&String(studioBinding.artifactIdentity||'')===artifactIdentity
            );
            if(!exactStudio||!exactBinding||!performancePass||item.robloxIndependentQaPassed!==true||item.robloxRegressionPassed!==true){
              reviewed.push({gameId:item.gameId,promoted:false,reason:'RUNTIME_GATES_PENDING'});
              continue;
            }
            const existingById=new Map((registry.assets||[]).map(row=>[String(row?.id||''),row]));
            const pending=plan.candidates.filter(row=>{
              const asset=existingById.get(String(row?.assetId||''));
              if(asset)return asset.verifiedCompanyReusable!==true&&!/^VERIFIED_COMPANY_/i.test(String(asset.status||''));
              return row?.generatedByDeclaredRecipe===true
                &&row?.persistedForCandidate===true
                &&Boolean(String(row?.family||'').trim())
                &&Boolean(String(row?.license||'').trim())
                &&Boolean(String(row?.path||'').trim())
                &&Boolean(String(row?.sourceHash||'').trim())
                &&Boolean(String(row?.artifactHash||'').trim());
            });
            if(!pending.length){
              reviewed.push({gameId:item.gameId,promoted:false,reason:'NO_UNVERIFIED_BOUND_ASSET'});
              continue;
            }
            const evidenceAssets=pending.map(row=>{
              const asset=existingById.get(String(row.assetId));
              const registryLicense=String(asset?.license||'').trim();
              const declaredGenerated=row?.generatedByDeclaredRecipe===true&&row?.persistedForCandidate===true;
              const candidateLicense=String(row.license||'').trim();
              return{
                assetId:String(row.assetId),
                family:String(row.family||asset?.family||asset?.category||'').trim().toUpperCase(),
                path:String(row.path||asset?.path||'').trim(),
                license:candidateLicense||registryLicense,
                sourceHash:String(row.sourceHash||''),
                artifactHash:String(row.artifactHash||''),
                generatedByDeclaredRecipe:declaredGenerated,
                persistedForCandidate:row?.persistedForCandidate===true,
                nativeBindingPass:row.candidateSourceBindingVerified===true,
                licenseProvenancePass:asset
                  ?Boolean(registryLicense&&registryLicense===candidateLicense)
                  :Boolean(declaredGenerated&&candidateLicense&&!/^(?:unknown)$/i.test(candidateLicense)&&!/(?:CC-BY-NC|NONCOMMERCIAL|NO-COMMERCIAL|NC\b)/i.test(candidateLicense))
              };
            });
            const result=promoteVerifiedCompanyAssetsFromRuntimeEvidence({
              registry,consumer:{gameId:item.gameId,platform:'ROBLOX'},runtimeEvidence:{
                id:String(studio.sessionId||studio.workflowRunId||item.robloxInternalPlaytestPassedAt||sourceRevision),
                platform:'ROBLOX',gameId:item.gameId,assetIds:pending.map(row=>String(row.assetId)),assets:evidenceAssets,
                nativeBindingPass:true,visualRuntimePass:true,mobilePerformancePass:true,regressionPass:true,licenseProvenancePass:true
              }
            });
            registry=result.registry;
            promoted.push(...result.promotedAssetIds.map(assetId=>({gameId:item.gameId,assetId})));
            reviewed.push({gameId:item.gameId,promoted:result.updated,reason:result.reason,assetIds:[...result.promotedAssetIds]});
          }
          if(promoted.length)fs.writeFileSync('company-asset-library.json',JSON.stringify(registry,null,2)+'\n');
          fs.writeFileSync('/tmp/roblox-verified-asset-promotion.json',JSON.stringify({version:1,promoted,reviewed},null,2)+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'count='+promoted.length+'\n');
          console.log('ROBLOX_VERIFIED_COMPANY_ASSET_PROMOTION_COUNT='+promoted.length);
          for(const row of promoted)console.log('ROBLOX_VERIFIED_COMPANY_ASSET_PROMOTION='+row.gameId+':'+row.assetId);
          NODE

      - name: Promote verified company asset registry through reviewed PR
        if: steps.asset_promotion.outputs.count != '0'
        continue-on-error: true
        working-directory: main
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_MAIN_SHA: ${{ steps.asset_promotion.outputs.base_main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if [ -n "$(git diff --name-only "$BASE_MAIN_SHA" origin/main -- company-asset-library.json)" ]; then
            echo 'ROBLOX_VERIFIED_COMPANY_ASSET_PROMOTION=DEFERRED_LIBRARY_CHANGED'
            exit 0
          fi
          git config user.name 'jaewoon-asset-runtime-promotion'
          git config user.email 'actions@users.noreply.github.com'
          git add company-asset-library.json
          git diff --cached --check
          git diff --cached --quiet && exit 0
          branch="automation/verified-company-assets-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$branch"
          git commit -m 'assets: promote exact runtime-verified company assets'
          git push origin "HEAD:$branch"
          pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title 'assets: promote runtime-verified company assets' --body 'Exact Roblox source binding + official Studio runtime + mobile performance + independent QA + regression evidence. Direct main write: NO.')"
          gh pr checks "$pr_url" --watch --fail-fast --interval 10
          gh pr merge "$pr_url" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
          echo "ROBLOX_VERIFIED_COMPANY_ASSET_PROMOTION_PR=$pr_url"

      - name: Record nonblocking asset promotion state
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.asset_promotion.outputs.count || '0' }}" = '0' ]; then
            echo 'ROBLOX_VERIFIED_COMPANY_ASSET_PROMOTION=NOT_READY_OR_NOT_REQUIRED'
          else
            echo 'ROBLOX_VERIFIED_COMPANY_ASSET_PROMOTION=REVIEWED_PR_ATTEMPTED'
          fi
          echo 'ROBLOX_VERIFIED_COMPANY_ASSET_PROMOTION_RELEASE_AUTHORITY=NONE'

  studio-reboot-recovery:
    name: recover interrupted Studio session from company-runtime checkpoint
    needs: [studio-local-plan, studio-mcp-auto-play]
    if: always() && inputs.candidate_context == '' && needs.studio-local-plan.result == 'success' && needs.studio-local-plan.outputs.count != '0'
    runs-on: ubuntu-slim
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: company-runtime
          path: runtime
          fetch-depth: 1
          fetch-tags: false

      - name: Detect exact Studio sessions interrupted before evidence persistence
        id: recover
        env:
          PLANNED_MATRIX: ${{ needs.studio-local-plan.outputs.matrix }}
          STUDIO_JOB_RESULT: ${{ needs.studio-mcp-auto-play.result }}
        shell: bash
        run: |
          set -euo pipefail
          git -C runtime fetch --no-tags origin company-runtime
          git -C runtime reset --hard origin/company-runtime
          PLANNED_MATRIX="$PLANNED_MATRIX" node <<'NODE' > /tmp/roblox-studio-reboot-retry-ids
          const fs=require('fs');
          const q=JSON.parse(fs.readFileSync('runtime/development-queue.json','utf8'));
          const matrix=JSON.parse(process.env.PLANNED_MATRIX||'{"include":[]}');
          const rows=Array.isArray(matrix.include)?matrix.include:[];
          for(const row of rows){
            const gameId=String(row?.gameId||'').trim();
            const item=(q.items||[]).find(x=>String(x?.gameId||'').trim()===gameId);
            if(!item)continue;
            const sourceRevision=String(row?.sourceRevision||'').trim();
            const artifactIdentity=String(row?.artifactIdentity||'').trim();
            const candidate=item.robloxRuntimeCandidateEvidence||{};
            const currentVersion=candidate.published===true&&Number(candidate.versionNumber||0)>0
              ?Number(candidate.versionNumber)
              :Number(item.robloxFoundationF0Evidence?.artifactRunId||item.robloxHeadlessFastMvpEvidence?.artifactRunId||0);
            const exactCurrent=
              String(item.robloxSourceCommit||'')===sourceRevision
              &&String(item.robloxBuildArtifactIdentity||'')===artifactIdentity
              &&Number(row?.versionNumber||0)===currentVersion;
            if(!exactCurrent){
              console.error('ROBLOX_STUDIO_REBOOT_RECOVERY_STALE_IDENTITY='+gameId);
              continue;
            }
            const session=item.robloxStudioRuntimeSession||{};
            if(String(session.sessionId||'')!==String(row?.sessionId||'')){
              console.error('ROBLOX_STUDIO_REBOOT_RECOVERY_SESSION_SUPERSEDED='+gameId);
              continue;
            }
            const evidence=item.robloxInternalVibePlayEvidence||{};
            const exactEvidence=
              evidence.sourceRevision===sourceRevision
              &&evidence.artifactIdentity===artifactIdentity
              &&Number(evidence.versionNumber||0)===Number(row?.versionNumber||0);
            const exactInfrastructurePending=Boolean(
              exactEvidence
              &&evidence.infrastructureFailure===true
              &&String(evidence.failureClass||'')==='STUDIO_MCP_INFRASTRUCTURE_PENDING'
            );
            if(exactEvidence&&!exactInfrastructurePending){
              console.error('ROBLOX_STUDIO_REBOOT_RECOVERY_EVIDENCE_PRESENT='+gameId+':pass='+(evidence.pass===true)+':infra='+(evidence.infrastructureFailure===true));
              continue;
            }
            if(exactInfrastructurePending){
              console.error('ROBLOX_STUDIO_INFRASTRUCTURE_RETRY_REQUIRED='+gameId+':same-exact-candidate=YES');
            }
            if(item.robloxStudioLocalPlayRepairRequired===true||item.robloxQualityBuildUpRequired===true){
              console.error('ROBLOX_STUDIO_REBOOT_RECOVERY_PRODUCT_REPAIR_OWNS='+gameId);
              continue;
            }
            const retryableSessionStates=exactInfrastructurePending
              ?['QUEUED_FOR_STUDIO','INTERRUPTED_RETRY_QUEUED','COMPLETED_INFRASTRUCTURE_PENDING']
              :['QUEUED_FOR_STUDIO','INTERRUPTED_RETRY_QUEUED'];
            if(!retryableSessionStates.includes(String(session.status||''))){
              console.error('ROBLOX_STUDIO_REBOOT_RECOVERY_SESSION_TERMINAL='+gameId+':'+String(session.status||''));
              continue;
            }
            console.log(gameId);
          }
          NODE
          retry_count="$(grep -c . /tmp/roblox-studio-reboot-retry-ids || true)"
          echo "retry_count=$retry_count" >> "$GITHUB_OUTPUT"
          echo "ROBLOX_STUDIO_REBOOT_RECOVERY_CANDIDATES=$retry_count"
          echo "ROBLOX_STUDIO_REBOOT_RECOVERY_SOURCE_JOB_RESULT=${STUDIO_JOB_RESULT:-unknown}"

      - name: Persist interruption state before requeue
        if: steps.recover.outputs.retry_count != '0'
        working-directory: runtime
        env:
          PLANNED_MATRIX: ${{ needs.studio-local-plan.outputs.matrix }}
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/roblox-studio-reboot-retry-ids /tmp/retry-ids
          git config user.name 'jaewoon-roblox-studio-session'
          git config user.email 'actions@users.noreply.github.com'
          persisted=0
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin company-runtime
            git reset --hard origin/company-runtime
            RETRY_IDS=/tmp/retry-ids node <<'NODE'
          const fs=require('fs');
          const q=JSON.parse(fs.readFileSync('development-queue.json','utf8'));
          const ids=new Set(fs.readFileSync(process.env.RETRY_IDS,'utf8').split(/\r?\n/).map(x=>x.trim()).filter(Boolean));
          const matrix=JSON.parse(process.env.PLANNED_MATRIX||'{"include":[]}');
          const byId=new Map((matrix.include||[]).map(row=>[String(row.gameId||''),row]));
          const stamp=new Date().toISOString();
          let changed=0;
          for(const item of q.items||[]){
            if(!ids.has(String(item.gameId||'')))continue;
            const row=byId.get(String(item.gameId||''));
            const session=item.robloxStudioRuntimeSession||{};
            if(!row||String(session.sessionId||'')!==String(row.sessionId||''))continue;
            item.robloxStudioRuntimeSession={
              ...session,
              status:'INTERRUPTED_RETRY_QUEUED',
              interruptionRetryCount:Number(session.interruptionRetryCount||0)+1,
              lastInterruptedAt:stamp,
              lastInterruptedWorkflowRunId:Number(process.env.GITHUB_RUN_ID||0),
              rebootSafeCheckpoint:true,
              hostStateAuthoritative:false,
              companyRuntimeAuthoritative:true
            };
            item.updatedAt=stamp;
            changed++;
          }
          if(changed){
            q.updatedAt=stamp;
            fs.writeFileSync('development-queue.json',JSON.stringify(q,null,2)+'\n');
          }
          console.log('ROBLOX_STUDIO_REBOOT_RECOVERY_MARKED='+changed);
          NODE
            git add development-queue.json
            git diff --cached --check
            if git diff --cached --quiet; then persisted=1; break; fi
            git commit -m 'runtime: mark interrupted Studio sessions for retry [skip ci]'
            if git push origin HEAD:company-runtime; then persisted=1; break; fi
            sleep $((attempt*2))
          done
          test "$persisted" = 1

      - name: Requeue exact interrupted Studio games without duplicating active work
        if: steps.recover.outputs.retry_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/company-development-roblox-post-runtime-qa.yml/runs?per_page=100")"
          dispatch_count=0
          deduped_count=0
          while read -r id; do
            [ -n "$id" ] || continue
            active="$(printf '%s' "$payload" | GAME_ID="$id" CURRENT_RUN_ID="$GITHUB_RUN_ID" node -e "
              let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{
                const j=JSON.parse(s),states=new Set(['queued','pending','requested','waiting','in_progress']);
                const title='Roblox runtime foundation QA · '+String(process.env.GAME_ID||'');
                const n=(j.workflow_runs||[]).filter(r=>String(r.id)!==String(process.env.CURRENT_RUN_ID||'')&&states.has(String(r.status||'').toLowerCase())&&String(r.display_title||'')===title).length;
                process.stdout.write(String(n));
              });
            ")"
            if [ "$active" != '0' ]; then
              deduped_count=$((deduped_count+1))
              echo "ROBLOX_STUDIO_REBOOT_REQUEUE=DEDUPED_ACTIVE:$id"
              continue
            fi
            gh workflow run company-development-roblox-post-runtime-qa.yml --repo "$GITHUB_REPOSITORY" --ref main -f game_id="$id" -f run_studio=true
            dispatch_count=$((dispatch_count+1))
            echo "ROBLOX_STUDIO_REBOOT_REQUEUE=YES:$id"
          done < /tmp/roblox-studio-reboot-retry-ids
          echo "ROBLOX_STUDIO_REBOOT_REQUEUE_DISPATCH_COUNT=$dispatch_count"
          echo "ROBLOX_STUDIO_REBOOT_REQUEUE_DEDUPED_COUNT=$deduped_count"
          echo 'ROBLOX_STUDIO_PC_INTERRUPTION_COUNTS_AS_GAME_FAILURE=NO'
          echo 'ROBLOX_STUDIO_PC_REBOOT_RESTARTS_FROM_BLANK=NO'

