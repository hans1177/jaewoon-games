# 파일명: .github/workflows/company-development-roblox-post-runtime-qa.yml
name: Company DEVELOPMENT_CONFIRMED Roblox Runtime Foundation QA
run-name: Roblox runtime foundation QA · ${{ inputs.game_id || 'scan' }}

on:
  workflow_call:
    secrets:
      ROBLOX_OPEN_CLOUD_API_KEY:
        required: false
    inputs:
      run_studio:
        description: Deprecated compatibility input; cloud API validation only.
        type: boolean
        default: false
      retry_open_cloud_only:
        type: boolean
        default: false
      game_id:
        required: true
        type: string
      candidate_revision:
        required: true
        type: string
      control_revision:
        required: true
        type: string
      candidate_context:
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/company-development-roblox-post-runtime-qa.yml'
      - '.github/workflows/company-development-roblox-release-promotion.yml'
      - 'tools/company-development-roblox-runtime-foundation.mjs'
      - 'tools/company-development-roblox-studio-local-play.mjs'
      - 'qa/fixtures/company-roblox-studio-local-play-scenario.json'
      - 'qa/company-tester-debug-intake.test.mjs'
      - 'qa/company-development-roblox-studio-local-play.test.mjs'
      - 'qa/company-development-roblox-headless-fast-mvp.test.mjs'
      - 'qa/company-development-roblox-runtime-foundation.test.mjs'
      - 'company-learning/platform-release-roadmap.json'
      - 'company-learning/canonical-learning-pipeline.json'
      - 'roblox-games/.company-runtime-trigger'
  workflow_dispatch:
    inputs:
      run_studio:
        description: Deprecated compatibility input; Studio execution is disabled.
        type: boolean
        default: false
      game_id:
        description: Optional exact gameId. Empty means all pending Roblox runtime candidates.
        required: false
        type: string
      retry_open_cloud_only:
        description: Optional manual Open Cloud/server diagnostic for game_id. Never required for internal development.
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

env:
  COMPANY_RUNTIME_BRANCH: company-runtime

# Only duplicate jobs for the same immutable artifact share a slot below.
concurrency:
  group: roblox-runtime-foundation-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  dedupe:
    if: inputs.candidate_context == ''
    name: collapse duplicate runtime foundation scans
    # Exact dedupe ingress only: newest same-game/batch scan supersedes stale dedupe work.
    # Runtime foundation validation itself remains outside this job-level cancellation group.
    concurrency:
      group: roblox-runtime-foundation-dedupe-${{ inputs.game_id || 'batch' }}
      cancel-in-progress: true
    runs-on: ubuntu-slim
    timeout-minutes: 3
    outputs:
      run: ${{ steps.guard.outputs.run }}
    steps:
      - name: Cancel stale queued foundation runs before batch scan
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.game_id == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/company-development-roblox-post-runtime-qa.yml/runs?per_page=100")"
          printf '%s' "$payload" | CURRENT_RUN_ID="$GITHUB_RUN_ID" CURRENT_SHA="$GITHUB_SHA" node -e "
            let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{
              const j=JSON.parse(s);
              const states=new Set(['queued','pending','requested','in_progress']);
              const prefix='Roblox runtime foundation QA · ';
              for(const r of j.workflow_runs||[]){
                const title=String(r.display_title||'');
                if(!states.has(String(r.status||'').toLowerCase()))continue;
                if(String(r.id)===String(process.env.CURRENT_RUN_ID||''))continue;
                const runId=Number(r.id),currentRunId=Number(process.env.CURRENT_RUN_ID||0);
                if(Number.isFinite(runId)&&Number.isFinite(currentRunId)&&currentRunId>0&&runId>=currentRunId)continue;
                if(!title.startsWith(prefix))continue;
                // 오너가 요청한 단일 게임 재검사는 자동 일괄 검사보다 우선 보존한다.
                const actor=String(r.actor?.login||r.triggering_actor?.login||'').trim().toLowerCase();
                const manualExactDispatch=r.event==='workflow_dispatch'&&title!==prefix+'scan'&&actor!=='github-actions[bot]';
                if(manualExactDispatch)continue;
                if(String(r.head_sha||'')===String(process.env.CURRENT_SHA||''))continue;
                process.stdout.write(String(r.id)+'\n');
              }
            });
          " > /tmp/roblox-stale-foundation-run-ids
          cancelled=0
          while read -r run_id; do
            [ -n "$run_id" ] || continue
            run_status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status' 2>/dev/null || true)"
            if [[ "$run_status" =~ ^(queued|pending|requested|waiting|in_progress)$ ]]; then
              studio_jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" --jq '[.jobs[] | select(.name | startswith("Official Studio MCP actual play ")) | select(.status == "queued" or .status == "pending" or .status == "requested" or .status == "waiting" or .status == "in_progress")] | length' 2>/dev/null || echo 1)"
              if [ "$studio_jobs" != '0' ]; then
                echo "ROBLOX_PENDING_STUDIO_RUN_PRESERVED=$run_id"
                continue
              fi
              studio_planners="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" --jq '[.jobs[] | select(.name == "plan exact local Studio MCP playtests for earliest eligible artifacts") | select(.status == "queued" or .status == "pending" or .status == "requested" or .status == "waiting" or .status == "in_progress")] | length' 2>/dev/null || echo 1)"
              if [ "$studio_planners" != '0' ]; then
                echo "ROBLOX_PENDING_STUDIO_PLANNER_PRESERVED=$run_id"
                continue
              fi
            fi
            if [ "$run_status" = 'in_progress' ]; then
              active_jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" --jq '[.jobs[] | select(.status == "in_progress")] | length' 2>/dev/null || echo 0)"
              if [ "$active_jobs" != '0' ]; then
                echo "ROBLOX_STALE_FOUNDATION_ACTIVE_NON_STUDIO_CANCEL_REQUESTED=$run_id:$active_jobs"
              else
                echo "ROBLOX_OBSOLETE_RUN_ONLY_WAITING_FOR_RUNNER=$run_id"
              fi
            fi
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null 2>&1 || true
            run_status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status' 2>/dev/null || true)"
            if [[ "$run_status" =~ ^(queued|pending|requested|waiting)$ ]]; then
              gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/force-cancel" >/dev/null 2>&1 || true
              echo "ROBLOX_STALE_FOUNDATION_RUN_FORCE_CANCEL_REQUESTED=$run_id:$run_status"
            elif [ "$run_status" = 'in_progress' ]; then
              echo "ROBLOX_STALE_FOUNDATION_RUN_NORMAL_CANCEL_CLEANUP_PENDING=$run_id"
            fi
            cancelled=$((cancelled+1))
            echo "ROBLOX_STALE_FOUNDATION_RUN_CANCELLED=$run_id"
          done < /tmp/roblox-stale-foundation-run-ids
          echo "ROBLOX_STALE_FOUNDATION_RUN_CANCEL_COUNT=$cancelled"

      - name: Select newest same-identity runtime foundation run
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_ID: ${{ inputs.game_id || '' }}
          CURRENT_CONTROL_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/company-development-roblox-post-runtime-qa.yml/runs?per_page=100")"
          winner="$(printf '%s' "$payload" | GAME_ID="$GAME_ID" node -e "
            let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{
              const j=JSON.parse(s);
              const states=new Set(['queued','pending','in_progress','requested']);
              const game=String(process.env.GAME_ID||'').trim();
              const title='Roblox runtime foundation QA · '+(game||'scan');
              const controlSha=String(process.env.CURRENT_CONTROL_SHA||'').trim();
              const ids=(j.workflow_runs||[])
                .filter(r=>states.has(String(r.status||'').toLowerCase())&&String(r.display_title||'')===title&&String(r.head_sha||'')===controlSha)
                .map(r=>Number(r.id))
                .filter(Number.isFinite)
                .sort((a,b)=>a-b);
              if(!ids.length){process.stdout.write('');return;}
              process.stdout.write(String(ids[ids.length-1]));
            });
          ")"
          echo "ROBLOX_RUNTIME_FOUNDATION_QA_CONTROL_SHA=$CURRENT_CONTROL_SHA"
          echo "ROBLOX_RUNTIME_FOUNDATION_QA_ACTIVE_WINNER=${winner:-NONE}"
          if [ -n "$winner" ] && [ "$winner" != "$GITHUB_RUN_ID" ]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            if [ -n "$GAME_ID" ]; then
              echo "ROBLOX_RUNTIME_FOUNDATION_QA_EXACT_DEDUPED=$GAME_ID:$GITHUB_RUN_ID:$winner"
            else
              echo "ROBLOX_RUNTIME_FOUNDATION_QA_SCAN_DEDUPED_NEWER=$GITHUB_RUN_ID:$winner"
            fi
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo "ROBLOX_RUNTIME_FOUNDATION_QA_DEDUPE_PASS=${GAME_ID:-SCAN}:$GITHUB_RUN_ID"
          fi

  runtime-foundation-qa:
    needs: dedupe
    if: needs.dedupe.outputs.run == 'true'
    name: existing game tester and QA validate exact Roblox runtime candidate
    # Remote Open Cloud probe + deterministic Node QA only. Studio execution remains on authenticated self-hosted Windows jobs.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout current canonical implementation
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
          fetch-depth: 1
          fetch-tags: false

      - name: Checkout canonical runtime state
        uses: actions/checkout@v4
        with:
          ref: company-runtime
          path: runtime
          fetch-depth: 1
          fetch-tags: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Classify transient Open Cloud retry scope
        if: ${{ inputs.retry_open_cloud_only == true }}
        id: transient_retry
        working-directory: main
        env:
          REQUESTED_GAME_ID: ${{ inputs.game_id || '' }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const q=JSON.parse(fs.readFileSync('../runtime/development-queue.json','utf8'));
          const requested=String(process.env.REQUESTED_GAME_ID||'').trim();
          const transientStatuses=new Set([408,429,500,502,503,504]);
          const rows=(q.items||[]).filter(item=>{
            if(requested&&item.gameId!==requested)return false;
            const evidence=item.robloxRuntimeFoundationEvidence||{};
            const candidate=item.robloxRuntimeCandidateEvidence||{};
            const sourceRevision=String(item.robloxSourceCommit||'').trim();
            const artifactIdentity=String(item.robloxBuildArtifactIdentity||'').trim();
            return evidence.authority==='roblox-open-cloud-engine-probe-failure'
              &&transientStatuses.has(Number(evidence.httpStatus||0))
              &&evidence.sourceRevision===sourceRevision
              &&evidence.artifactIdentity===artifactIdentity
              &&Number(evidence.candidateVersionNumber||0)===Number(candidate.versionNumber||0);
          });
          const ids=[...new Set(rows.map(item=>String(item.gameId||'').trim()).filter(Boolean))];
          fs.writeFileSync('/tmp/roblox-open-cloud-transient-retry-ids',ids.join('\n')+(ids.length?'\n':''));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'count='+ids.length+'\n');
          console.log('ROBLOX_OPEN_CLOUD_TRANSIENT_RETRY_CANDIDATES='+(ids.join(',')||'NONE'));
          NODE

      - name: Synchronize worker with constitution central policy and compiled architecture
        working-directory: main
        shell: bash
        run: |
          set -euo pipefail
          node tools/company-shared-context.mjs --output=/tmp/roblox-foundation-worker-context.json
          node -e "const x=require('/tmp/roblox-foundation-worker-context.json');if(x.pass!==true||x.architectureProjection?.valid!==true)process.exit(1)"
          echo 'ROBLOX_FOUNDATION_SHARED_CONTEXT=PASS'

      - name: Keep transient Open Cloud retries inside bounded scan
        if: ${{ inputs.retry_open_cloud_only == true && inputs.game_id == '' && steps.transient_retry.outputs.count != '0' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "ROBLOX_OPEN_CLOUD_TRANSIENT_RETRY_MODE=IN_SCAN_BOUNDED"
          cat /tmp/roblox-open-cloud-transient-retry-ids

      - name: Verify only runtime-foundation executable syntax
        if: ${{ inputs.retry_open_cloud_only != true }}
        working-directory: main
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --check < tools/company-development-roblox-runtime-foundation.mjs
          node --input-type=module --check < tools/company-tester-debug-intake.mjs
          echo 'ROBLOX_FOUNDATION_CONTRACT_QA=REUSED_CURRENT_MAIN_CI'
          echo 'ROBLOX_FOUNDATION_CRITICAL_PATH_DUPLICATE_TESTS=0'

      - name: Probe exact Roblox Open Cloud engine execution
        working-directory: main
        continue-on-error: true
        env:
          REQUESTED_GAME_ID: ${{ inputs.game_id || '' }}
          RETRY_OPEN_CLOUD_ONLY: ${{ inputs.retry_open_cloud_only || false }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before || '' }}
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          trigger_changed=false
          if [ "$EVENT_NAME" = 'push' ] && [[ "$PUSH_BEFORE" =~ ^[0-9a-f]{40}$ ]] && [ "$PUSH_BEFORE" != '0000000000000000000000000000000000000000' ]; then
            git fetch --no-tags --depth=1 origin "$PUSH_BEFORE"
            if ! git diff --quiet "$PUSH_BEFORE" HEAD -- roblox-games/.company-runtime-trigger; then
              trigger_changed=true
            fi
          fi
          export TRIGGER_CHANGED="$trigger_changed"
          test -n "$ROBLOX_OPEN_CLOUD_API_KEY"
          git -C ../runtime fetch --no-tags origin "$COMPANY_RUNTIME_BRANCH"
          git -C ../runtime reset --hard "origin/$COMPANY_RUNTIME_BRANCH"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {probeRobloxOpenCloudEngine,probeRobloxOpenCloudImageEvidence} from './tools/company-development-roblox-runtime-foundation.mjs';
          let requested=String(process.env.REQUESTED_GAME_ID||'').trim();
          const retryOpenCloudOnly=String(process.env.RETRY_OPEN_CLOUD_ONLY||'').toLowerCase()==='true';
          if(!requested&&process.env.EVENT_NAME==='push'&&String(process.env.TRIGGER_CHANGED||'').toLowerCase()==='true'){
            const triggerPath='roblox-games/.company-runtime-trigger';
            if(fs.existsSync(triggerPath))requested=String(fs.readFileSync(triggerPath,'utf8').match(/^gameId:\s*([^\s]+)\s*$/m)?.[1]||'').trim();
          }
          const q=JSON.parse(fs.readFileSync('../runtime/development-queue.json','utf8'));
          const roadmap=JSON.parse(fs.readFileSync('company-learning/platform-release-roadmap.json','utf8'));
          const transientRetryPath='/tmp/roblox-open-cloud-transient-retry-ids';
          const transientRetryIds=new Set(fs.existsSync(transientRetryPath)?fs.readFileSync(transientRetryPath,'utf8').split(/\r?\n/).map(v=>v.trim()).filter(Boolean):[]);
          const transientRetryStatuses=new Set([408,429,500,502,503,504]);
          const sharedTarget=roadmap?.roblox?.deploymentControl?.ownerPinnedPublicationTarget||{};
          const sharedUniverse=String(sharedTarget.universeId||'').trim();
          const sharedPlace=String(sharedTarget.placeId||'').trim();
          const sharedRotationEnabled=sharedTarget.enabled===true&&sharedTarget.sharedFastMvpRotationAllowed===true;
          const candidateForItem=item=>{
            const persisted=item.robloxRuntimeCandidateEvidence||{};
            if(persisted.published===true)return persisted;
            const sourceRevision=String(item.robloxSourceCommit||'').trim();
            const artifactIdentity=String(item.robloxBuildArtifactIdentity||'').trim();
            const f0=item.robloxFoundationF0Evidence||{};
            const artifactRunId=Number(f0.artifactRunId||item.robloxHeadlessFastMvpEvidence?.artifactRunId||0);
            const localExact=
              item.robloxFoundationF0Passed===true
              &&item.robloxBuildPreflightPassed===true
              &&item.robloxBuildOrPackagePassed===true
              &&item.robloxBuildSourceRevision===sourceRevision
              &&f0.sourceRevision===sourceRevision
              &&f0.artifactIdentity===artifactIdentity
              &&artifactRunId>0;
            return localExact?{
              published:false,
              releaseClaim:false,
              authority:'roblox-local-f0-pre-f9-artifact',
              sourceRevision,
              artifactIdentity,
              artifactRunId,
              universeId:'',
              placeId:'',
              versionNumber:artifactRunId,
            }:persisted;
          };
          const candidates=(q.items||[]).filter(item=>{
            if(requested&&item.gameId!==requested)return false;
            if(transientRetryIds.has(item.gameId)){
              console.log('ROBLOX_OPEN_CLOUD_ENGINE_PROBE_RETRY_IN_CURRENT_SCAN='+item.gameId);
            }
            const c=item.robloxRuntimeCandidateEvidence||{};
            if(sharedRotationEnabled
              &&String(c.universeId||'').trim()===sharedUniverse
              &&String(c.placeId||'').trim()===sharedPlace
              &&item.robloxSharedTargetCurrent===false)return false;
            const sourceRevision=String(item.robloxSourceCommit||'').trim();
            const artifactIdentity=String(item.robloxBuildArtifactIdentity||'').trim();
            if(retryOpenCloudOnly&&requested&&item.gameId===requested){
              const transientEvidence=item.robloxRuntimeFoundationEvidence||{};
              const exactRetryStillCurrent=
                c.sourceRevision===sourceRevision
                &&c.artifactIdentity===artifactIdentity
                &&transientEvidence.authority==='roblox-open-cloud-engine-probe-failure'
                &&transientRetryStatuses.has(Number(transientEvidence.httpStatus||0))
                &&transientEvidence.sourceRevision===sourceRevision
                &&transientEvidence.artifactIdentity===artifactIdentity
                &&Number(transientEvidence.candidateVersionNumber||0)===Number(c.versionNumber||0);
              if(!exactRetryStillCurrent){
                console.log('ROBLOX_OPEN_CLOUD_EXACT_GATE_RETRY_SUPERSEDED_BY_CURRENT_SOURCE='+item.gameId+':resume='+(item.currentStep||'TARGET_PLATFORM_SOURCE_BIND'));
                return false;
              }
            }
            const activeQualityBuildUp=
              item.robloxQualityBuildUpRequired===true
              &&String(item.robloxQualityBuildUpSourceRevision||'').trim()===sourceRevision;
            if(activeQualityBuildUp){
              console.log('ROBLOX_OPEN_CLOUD_ENGINE_PROBE_SKIPPED_ACTIVE_QUALITY_BUILDUP='+item.gameId);
              console.log('QUALITY_FIRST_BUILDUP_SHORT_CIRCUIT=ACTIVE');
              console.log('QUALITY_FAILURE_CLASS=PRODUCT');
              console.log('QUALITY_BUILDUP_AUTO_REQUEUE=YES');
              console.log('EXTERNAL_RELEASE_PROBE_SUPPRESSED=YES');
              console.log('RESUME_STAGE=REPAIR_REQUIRED');
              return false;
            }
            const runtime=item.robloxRuntimeFoundationEvidence||{};
            const post=item.robloxPostRuntimeQaEvidence||{};
            const studioRequired=(item.robloxStudioAssetBindingApplied===true||item.robloxStudioAssetBinding?.required===true);
            const studio=item.robloxStudioAssetRuntimeBindingEvidence||{};
            const exactReusable=
              c.published===true
              &&Number(c.versionNumber)>0&&c.universeId&&c.placeId
              &&item.robloxRuntimeFoundationPassed===true
              &&item.robloxRuntimePassed===true
              &&item.robloxIndependentQaPassed===true
              &&item.robloxRegressionPassed===true
              &&runtime.sourceRevision===sourceRevision
              &&runtime.artifactIdentity===artifactIdentity
              &&String(runtime.placeId||'')===String(c.placeId||'')
              &&Number(runtime.candidateVersionNumber)===Number(c.versionNumber)
              &&runtime.runtimeFoundationPassed===true
              &&runtime.runtimeAcceptancePassed===true
              &&runtime.validationProvider==='ROBLOX_OFFICIAL_CLOUD_API_ONLY'
              &&runtime.openCloudImageEvidence?.imageContentPassed===true
              &&post.sourceRevision===sourceRevision
              &&post.artifactIdentity===artifactIdentity
              &&Number(post.candidateVersionNumber)===Number(c.versionNumber)
              &&(!studioRequired||(
                item.robloxStudioAssetRuntimeBindingPassed===true
                &&studio.sourceRevision===sourceRevision
                &&studio.artifactIdentity===artifactIdentity
                &&Number(studio.candidateVersionNumber)===Number(c.versionNumber)
                &&String(studio.expectedSelectionFingerprint||'')===String(item.robloxStudioAssetBinding?.selectionFingerprint||'')
                &&String(studio.observedSelectionFingerprint||'')===String(item.robloxStudioAssetBinding?.selectionFingerprint||'')
                &&Number(studio.expectedLibraryVersion||0)===Number(item.robloxStudioAssetBinding?.libraryVersion||0)
                &&Number(studio.observedLibraryVersion||0)===Number(item.robloxStudioAssetBinding?.libraryVersion||0)
                &&String(studio.buildUpAssetSourceUsageFingerprint||'')===String(item.robloxStudioAssetBinding?.buildUpAssetSourceUsageFingerprint||'')
              ));
            if(exactReusable){
              console.log('ROBLOX_OPEN_CLOUD_ENGINE_PROBE_SKIPPED_EXACT_EVIDENCE_REUSE='+item.gameId);
              return false;
            }
            return c.published===true&&Number(c.versionNumber)>0&&c.universeId&&c.placeId;
          }).sort((a,b)=>{
            if(!requested)return 0;
            return Number(b.gameId===requested)-Number(a.gameId===requested);
          });
          const probes=new Array(candidates.length);
          const imageRequests=new Map(); // Coalesce image API reads for games sharing one universe.
          const probeConcurrency=Math.max(1,Math.min(8,candidates.length||1));
          console.log('ROBLOX_OPEN_CLOUD_PARALLEL_MODE=MAX8_FILL_AVAILABLE');
          console.log('ROBLOX_OPEN_CLOUD_REQUESTED_PRIORITY='+(requested||'NONE'));
          console.log('ROBLOX_OPEN_CLOUD_REQUESTED_SCOPE='+(requested?'EXACT_GAME_ONLY':'ALL_PENDING_PARALLEL_BATCH'));
          console.log('ROBLOX_OPEN_CLOUD_429_SCOPE=PER_GAME_RETRY_ONLY');
          let probeCursor=0;
          const runProbeWorker=async()=>{
            while(true){
              const index=probeCursor++;
              if(index>=candidates.length)return;
              const item=candidates[index];
              const c=item.robloxRuntimeCandidateEvidence;
              let imageEvidence=null;
              try{
                const universeKey=String(c.universeId);
                if(!imageRequests.has(universeKey))imageRequests.set(universeKey,probeRobloxOpenCloudImageEvidence({
                  universeId:universeKey,apiKey:process.env.ROBLOX_OPEN_CLOUD_API_KEY,
                  networkRetryAttempts:4,networkRetryDelayMs:750,
                }));
                const [engineAttempt,imageAttempt]=await Promise.allSettled([
                  probeRobloxOpenCloudEngine({
                    universeId:String(c.universeId),placeId:String(c.placeId),versionNumber:Number(c.versionNumber),
                    apiKey:process.env.ROBLOX_OPEN_CLOUD_API_KEY,pollIntervalMs:1000,maxPolls:45,
                    networkRetryAttempts:6,networkRetryDelayMs:1000,
                    expectedStudioAssetBinding:(item.robloxStudioAssetBindingApplied===true||item.robloxStudioAssetBinding?.required===true)?item.robloxStudioAssetBinding:null,
                  }),
                  imageRequests.get(universeKey),
                ]);
                if(imageAttempt.status==='fulfilled')imageEvidence=imageAttempt.value;
                else{
                  const message=String(imageAttempt.reason?.message||imageAttempt.reason);
                  const status=Number(message.match(/_HTTP_(\d+)/)?.[1]||0);
                  imageEvidence={
                    available:false,permissionDenied:false,persistentFailure:true,status,
                    imageMetadataAvailable:false,thumbnailCount:0,imageUrls:[],
                    imageContentChecked:false,imageContentPassed:false,imageVisualQualityVerified:false,
                    runtimeScreenshot:false,exactRuntimeVersionImage:false,
                    state:'IMAGE_SANITY_UNAVAILABLE',error:message.slice(0,500),
                    authority:'roblox-open-cloud-thumbnail-image-sanity',
                    limitation:'THUMBNAIL_METADATA_IS_VISUAL_SANITY_ONLY_NOT_EXACT_RUNTIME_RENDER_PROOF',
                  };
                }
                imageEvidence={...imageEvidence,requestContext:{
                  sourceRevision:String(item.robloxSourceCommit||''),artifactIdentity:String(item.robloxBuildArtifactIdentity||''),
                  universeId:String(c.universeId),placeId:String(c.placeId),versionNumber:Number(c.versionNumber),
                  observedImageRevision:false,
                }};
                if(engineAttempt.status==='rejected')throw engineAttempt.reason;
                const result=engineAttempt.value;
                const probe={gameId:item.gameId,versionNumber:Number(c.versionNumber),...result,imageEvidence};
                console.log('ROBLOX_OPEN_CLOUD_ENGINE_PROBE='+JSON.stringify(probe));
                console.log('ROBLOX_OPEN_CLOUD_IMAGE_CHECK='+item.gameId+':'+String(imageEvidence?.state||'UNKNOWN')+':count='+Number(imageEvidence?.thumbnailCount||0));
                probes[index]=probe;
              }catch(error){
                const message=String(error?.message||error);
                const status=Number(message.match(/_HTTP_(\d+)/)?.[1]||0);
                const probe={
                  gameId:item.gameId,
                  versionNumber:Number(c.versionNumber),
                  available:false,
                  permissionDenied:false,
                  persistentFailure:true,
                  status,
                  engineExecuted:false,
                  exactPlace:false,
                  exactVersion:false,
                  failureStage:'PROBE',
                  imageEvidence,
                  error:message.slice(0,500),
                };
                console.log('ROBLOX_OPEN_CLOUD_ENGINE_PROBE_FAILURE='+JSON.stringify(probe));
                probes[index]=probe;
              }
            }
          };
          await Promise.all(Array.from({length:probeConcurrency},()=>runProbeWorker()));
          console.log('ROBLOX_RUNTIME_FOUNDATION_QA_PARALLEL_COUNT='+probeConcurrency);
          console.log('ROBLOX_RUNTIME_FOUNDATION_QA_PROBE_COUNT='+probes.length);
          fs.writeFileSync('/tmp/roblox-open-cloud-engine-probes.json',JSON.stringify(probes,null,2)+'\n');
          NODE

      - name: Read exact runtime sentinel and persist tester QA evidence
        working-directory: main
        env:
          REQUESTED_GAME_ID: ${{ inputs.game_id || '' }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before || '' }}
          SERVER_DIAGNOSTIC_ENABLED: true
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          trigger_changed=false
          if [ "$EVENT_NAME" = 'push' ] && [[ "$PUSH_BEFORE" =~ ^[0-9a-f]{40}$ ]] && [ "$PUSH_BEFORE" != '0000000000000000000000000000000000000000' ]; then
            git fetch --no-tags --depth=1 origin "$PUSH_BEFORE"
            if ! git diff --quiet "$PUSH_BEFORE" HEAD -- roblox-games/.company-runtime-trigger; then
              trigger_changed=true
            fi
          fi
          export TRIGGER_CHANGED="$trigger_changed"
          git -C ../runtime fetch --no-tags origin "$COMPANY_RUNTIME_BRANCH"
          git -C ../runtime reset --hard "origin/$COMPANY_RUNTIME_BRANCH"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {
            fetchRobloxRuntimeFoundationEvidence,
            validateRobloxRuntimeFoundationEvidence,
            validateRobloxMultiplayerSourceContract,
          } from './tools/company-development-roblox-runtime-foundation.mjs';
          import {planLocalStudioCandidates} from './tools/company-development-roblox-studio-local-play.mjs';

          let requested=String(process.env.REQUESTED_GAME_ID||'').trim();
          if(!requested&&process.env.EVENT_NAME==='push'&&String(process.env.TRIGGER_CHANGED||'').toLowerCase()==='true'){
            const triggerPath='roblox-games/.company-runtime-trigger';
            if(fs.existsSync(triggerPath)){
              requested=String(fs.readFileSync(triggerPath,'utf8').match(/^gameId:\s*([^\s]+)\s*$/m)?.[1]||'').trim();
            }
          }
          if(requested&&!/^[a-z0-9][a-z0-9-]{1,48}$/.test(requested))throw new Error('ROBLOX_FOUNDATION_REQUESTED_GAME_ID_INVALID:'+requested);
          console.log('ROBLOX_FOUNDATION_REQUESTED_GAME_ID='+(requested||'ALL_PENDING'));
          console.log('ROBLOX_FOUNDATION_REQUESTED_SCOPE='+(requested?'EXACT_GAME_ONLY':'ALL_PENDING_PARALLEL_BATCH'));
          const queuePath='../runtime/development-queue.json';
          const q=JSON.parse(fs.readFileSync(queuePath,'utf8'));
          const beforeById=new Map((q.items||[]).map(item=>[
            String(item?.gameId||''),
            JSON.parse(JSON.stringify(item)),
          ]));
          const roadmap=JSON.parse(fs.readFileSync('company-learning/platform-release-roadmap.json','utf8'));
          const cloudApiOnly=true; // Owner directive: no local Studio evidence or execution.
          const serverDiagnosticEnabled=cloudApiOnly||String(process.env.SERVER_DIAGNOSTIC_ENABLED||'').toLowerCase()==='true';
          const sharedTarget=roadmap?.roblox?.deploymentControl?.ownerPinnedPublicationTarget||{};
          const sharedUniverse=String(sharedTarget.universeId||'').trim();
          const sharedPlace=String(sharedTarget.placeId||'').trim();
          const sharedRotationEnabled=sharedTarget.enabled===true
            &&sharedTarget.sharedFastMvpRotationAllowed===true
            &&/^[1-9][0-9]*$/.test(sharedUniverse)
            &&/^[1-9][0-9]*$/.test(sharedPlace);
          const isSharedCandidate=(candidate={})=>sharedRotationEnabled
            &&String(candidate.universeId||'').trim()===sharedUniverse
            &&String(candidate.placeId||'').trim()===sharedPlace;
          const candidateForItem=item=>{
            const persisted=item.robloxRuntimeCandidateEvidence||{};
            if(persisted.published===true)return persisted;
            const sourceRevision=String(item.robloxSourceCommit||'').trim();
            const artifactIdentity=String(item.robloxBuildArtifactIdentity||'').trim();
            const f0=item.robloxFoundationF0Evidence||{};
            const artifactRunId=Number(f0.artifactRunId||item.robloxHeadlessFastMvpEvidence?.artifactRunId||0);
            const localExact=
              item.robloxFoundationF0Passed===true
              &&item.robloxBuildPreflightPassed===true
              &&item.robloxBuildOrPackagePassed===true
              &&item.robloxBuildSourceRevision===sourceRevision
              &&f0.sourceRevision===sourceRevision
              &&f0.artifactIdentity===artifactIdentity
              &&artifactRunId>0;
            return localExact?{
              published:false,
              releaseClaim:false,
              authority:'roblox-local-f0-pre-f9-artifact',
              sourceRevision,
              artifactIdentity,
              artifactRunId,
              universeId:'',
              placeId:'',
              versionNumber:artifactRunId,
            }:persisted;
          };
          let changed=false,passed=0,pending=0,failed=0;
          if(sharedRotationEnabled&&!requested){
            const sharedCurrent=(q.items||[])
              .filter(item=>item.robloxSharedTargetCurrent!==false&&item.robloxRuntimeCandidateEvidence?.published===true&&isSharedCandidate(item.robloxRuntimeCandidateEvidence))
              .sort((a,b)=>Number(b.robloxRuntimeCandidateEvidence?.versionNumber||0)-Number(a.robloxRuntimeCandidateEvidence?.versionNumber||0)
                ||String(b.robloxRuntimeCandidateEvidence?.publishedAt||'').localeCompare(String(a.robloxRuntimeCandidateEvidence?.publishedAt||'')));
            const actualCurrent=sharedCurrent[0]||null;
            for(const item of sharedCurrent.slice(1)){
              item.robloxSharedTargetCurrent=false;
              item.robloxFastMvpSupersededBy=actualCurrent?.gameId||null;
              if(item.robloxRuntimeCandidateEvidence&&typeof item.robloxRuntimeCandidateEvidence==='object'){
                item.robloxRuntimeCandidateEvidence={
                  ...item.robloxRuntimeCandidateEvidence,
                  current:false,
                  supersededAt:new Date().toISOString(),
                  supersededBy:actualCurrent?.gameId||null,
                };
              }
              if(item.robloxRuntimePassed!==true&&item.robloxFinalReviewPassed!==true){
                item.currentStep='PRIVATE_RUNTIME_CANDIDATE_DEPLOY';
                item.canonicalState='F0_SOURCE_PREFLIGHT_PASSED';
                item.robloxFailureStage='PRIVATE_RUNTIME_CANDIDATE_DEPLOY';
                item.robloxFailureSignature='ROBLOX_RUNTIME_CANDIDATE_DEPLOY_PENDING';
                item.routingBlockers=['roblox-shared-runtime-target-capacity-republish-required'];
              }
              item.updatedAt=new Date().toISOString();
              changed=true;
              console.log('ROBLOX_SHARED_TARGET_SUPERSEDED='+item.gameId+':current='+(actualCurrent?.gameId||'NONE'));
            }
            if(actualCurrent&&actualCurrent.robloxSharedTargetCurrent!==true){
              actualCurrent.robloxSharedTargetCurrent=true;
              actualCurrent.robloxFastMvpSupersededBy=null;
              actualCurrent.updatedAt=new Date().toISOString();
              changed=true;
            }
          }
          const probePath='/tmp/roblox-open-cloud-engine-probes.json';
          const probeRows=fs.existsSync(probePath)?JSON.parse(fs.readFileSync(probePath,'utf8')):[];
          const transientProbeStatuses=new Set([408,429,500,502,503,504]);
          const transientProbeFailure=row=>Boolean(
            row?.persistentFailure===true
            &&(
              transientProbeStatuses.has(Number(row?.status||0))
              ||(Number(row?.status||0)===0&&/EAI_AGAIN|ENOTFOUND|ECONNRESET|ETIMEDOUT|ECONNREFUSED|UND_ERR_CONNECT_TIMEOUT|UND_ERR_SOCKET|fetch failed|network/i.test(String(row?.error||'')))
            )
          );
          const persistentProbeFailures=(Array.isArray(probeRows)?probeRows:[]).filter(row=>row?.persistentFailure===true);
          const transientProbeFailures=persistentProbeFailures.filter(transientProbeFailure);
          const blockingProbeFailures=persistentProbeFailures.filter(row=>!transientProbeFailure(row));
          const transientRetryPath='/tmp/roblox-open-cloud-transient-retry-ids';
          const transientRetryIds=new Set(fs.existsSync(transientRetryPath)?fs.readFileSync(transientRetryPath,'utf8').split(/\r?\n/).map(v=>v.trim()).filter(Boolean):[]);
          const engineProbeByGame=new Map((Array.isArray(probeRows)?probeRows:[]).map(row=>[String(row?.gameId||''),row]));
          const candidates=(q.items||[]).filter(item=>{
            if(requested&&item.gameId!==requested)return false;
            if(transientRetryIds.has(item.gameId)){
              console.log('ROBLOX_OPEN_CLOUD_RUNTIME_STATE_RETRY_IN_CURRENT_SCAN='+item.gameId);
            }
            const candidate=candidateForItem(item);
            if(isSharedCandidate(candidate)&&item.robloxSharedTargetCurrent===false)return false;
            const sourceRevision=String(item.robloxSourceCommit||'').trim();
            const artifactIdentity=String(item.robloxBuildArtifactIdentity||'').trim();
            const activeQualityBuildUp=
              item.robloxQualityBuildUpRequired===true
              &&String(item.robloxQualityBuildUpSourceRevision||'').trim()===sourceRevision;
            if(activeQualityBuildUp){
              console.log('ROBLOX_FOUNDATION_PROCESSING_SKIPPED_ACTIVE_QUALITY_BUILDUP='+item.gameId);
              return false;
            }
            const studioPlay=item.robloxInternalVibePlayEvidence||{};
            const explicitRuntimeStage=['VIBE_INTERNAL_PLAY','PRIVATE_RUNTIME_CANDIDATE_DEPLOY','TARGET_PLATFORM_RUNTIME_FOUNDATION','TARGET_PLATFORM_RUNTIME_ACCEPTANCE'].includes(String(item.robloxFailureStage||''));
            const exactStudioPlayPendingRuntime=
              studioPlay.pass===true
              &&studioPlay.actualPlay===true
              &&studioPlay.officialStudioMcp===true
              &&studioPlay.localPlaceFile===true
              &&studioPlay.sourceRevision===sourceRevision
              &&studioPlay.artifactIdentity===artifactIdentity
              &&Number(studioPlay.versionNumber)===Number(candidate.versionNumber)
              &&(
                item.robloxRuntimeFoundationPassed!==true
                ||item.robloxRuntimePassed!==true
                ||item.robloxIndependentQaPassed!==true
                ||item.robloxRegressionPassed!==true
              );
            const externalRuntimeObservationPending=item.robloxPublicReleaseRuntimeObservationPending===true;
            return (candidate.published===true||candidate.authority==='roblox-local-f0-pre-f9-artifact')
              &&item.robloxFoundationF0Passed===true
              &&item.robloxPublicRelease!==true
              &&(item.robloxInternalReleaseReady!==true||externalRuntimeObservationPending)
              &&(explicitRuntimeStage||exactStudioPlayPendingRuntime||externalRuntimeObservationPending);
          }).sort((a,b)=>{
            if(!requested)return 0;
            return Number(b.gameId===requested)-Number(a.gameId===requested);
          });
          const f9Ids=[];
          const studioFollowupIds=[];
          const localF0PrivateDeployIds=[];
          const stamp=new Date().toISOString();
          const multiplayerRequirementFor=item=>{
            const rel=String(item.designBaselineSource||'').trim();
            const file=rel?'../runtime/'+rel:'';
            if(!file||!fs.existsSync(file))return{known:false,required:null,mode:'UNKNOWN'};
            try{
              const design=JSON.parse(fs.readFileSync(file,'utf8'));
              const mode=String(design?.content?.multiplayerMode||design?.content?.platformProfiles?.ROBLOX?.multiplayerRuntime||'').trim().toUpperCase();
              if(!mode)return{known:false,required:null,mode:'UNKNOWN'};
              const solo=/^(SINGLE|SINGLE_PLAYER|SINGLEPLAYER|SOLO|NONE|NOT_APPLICABLE|N\/A)$/.test(mode);
              return{known:true,required:!solo,mode};
            }catch{return{known:false,required:null,mode:'UNKNOWN'};}
          };
          const readLuauTree=root=>{
            const chunks=[];
            const walk=dir=>{
              if(!fs.existsSync(dir))return;
              for(const entry of fs.readdirSync(dir,{withFileTypes:true})){
                const p=dir+'/'+entry.name;
                if(entry.isDirectory())walk(p);
                else if(entry.isFile()&&/\.lua[u]?$/.test(entry.name))chunks.push(fs.readFileSync(p,'utf8'));
              }
            };
            walk(root);
            return chunks.join('\n');
          };
          const multiplayerSourceContractFor=item=>{
            const root=String(item.robloxProjectPath||item.targetSourcePath||('roblox-games/'+item.gameId)).trim();
            return validateRobloxMultiplayerSourceContract({
              serverSource:readLuauTree(root+'/server'),
              clientSource:readLuauTree(root+'/client'),
            });
          };
          const queueStudioFollowupIfEligible=()=>{}; // Local execution disabled by cloud-only authority.

          for(const item of candidates){
            const candidate=candidateForItem(item);
            const sourceRevision=String(item.robloxSourceCommit||'').trim();
            const artifactIdentity=String(item.robloxBuildArtifactIdentity||'').trim();
            const localPreF9Candidate=candidate.authority==='roblox-local-f0-pre-f9-artifact';
            const exactCandidate=
              candidate.sourceRevision===sourceRevision
              &&candidate.artifactIdentity===artifactIdentity
              &&Number(candidate.versionNumber)>0
              &&(
                localPreF9Candidate
                ||(
                  /^[1-9][0-9]*$/.test(String(candidate.universeId||''))
                  &&/^[1-9][0-9]*$/.test(String(candidate.placeId||''))
                )
              );
            if(!exactCandidate){
              item.robloxRuntimeFoundationPassed=false;
              item.robloxRuntimePassed=false;
              item.robloxFailureStage='TARGET_PLATFORM_RUNTIME_FOUNDATION';
              item.robloxFailureSignature='ROBLOX_RUNTIME_CANDIDATE_IDENTITY_MISMATCH';
              item.routingBlockers=['roblox-runtime-candidate-identity-mismatch'];
              item.updatedAt=stamp;changed=true;failed++;
              continue;
            }

            if(localPreF9Candidate){
              const alreadyPendingPrivateDeploy=
                item.currentStep==='PRIVATE_RUNTIME_CANDIDATE_DEPLOY'
                &&item.canonicalState==='F0_SOURCE_PREFLIGHT_PASSED'
                &&item.robloxFailureStage==='PRIVATE_RUNTIME_CANDIDATE_DEPLOY'
                &&item.robloxFailureSignature==='ROBLOX_RUNTIME_CANDIDATE_DEPLOY_PENDING'
                &&Array.isArray(item.routingBlockers)
                &&item.routingBlockers.length===1
                &&item.routingBlockers[0]==='roblox-runtime-candidate-deploy-pending'
                &&item.robloxRuntimeCandidateEvidence==null
                &&item.robloxRuntimeFoundationEvidence==null
                &&item.robloxRuntimeEvidence==null
                &&item.robloxPostRuntimeQaEvidence==null
                &&item.robloxCloudImageEvidence==null;
              if(!alreadyPendingPrivateDeploy){
                item.robloxRuntimeCandidateEvidence=null;
                item.robloxRuntimeFoundationPassed=false;
                item.robloxRuntimeFoundationEvidence=null;
                item.robloxRuntimePassed=false;
                item.robloxRuntimePassedAt=null;
                item.robloxRuntimeFailedAt=null;
                item.robloxRuntimeEvidence=null;
                item.robloxIndependentQaPassed=false;
                item.robloxIndependentQaPassedAt=null;
                item.robloxRegressionPassed=false;
                item.robloxRegressionPassedAt=null;
                item.robloxPostRuntimeQaEvidence=null;
                item.robloxCloudImageEvidence=null;
                item.robloxF9PendingInParallel=false;
                item.currentStep='PRIVATE_RUNTIME_CANDIDATE_DEPLOY';
                item.canonicalState='F0_SOURCE_PREFLIGHT_PASSED';
                item.robloxLastSuccessfulStage='F0_SOURCE_PREFLIGHT';
                item.robloxFailureStage='PRIVATE_RUNTIME_CANDIDATE_DEPLOY';
                item.robloxFailureSignature='ROBLOX_RUNTIME_CANDIDATE_DEPLOY_PENDING';
                item.routingBlockers=['roblox-runtime-candidate-deploy-pending'];
                if(item.executionEvidence){
                  item.executionEvidence.runtimePassed=false;
                  item.executionEvidence.independentQaPassed=false;
                  item.executionEvidence.regressionPassed=false;
                  item.executionEvidence.lastSuccessfulStage='F0_SOURCE_PREFLIGHT';
                  item.executionEvidence.failureStage='PRIVATE_RUNTIME_CANDIDATE_DEPLOY';
                  item.executionEvidence.failureSignature='ROBLOX_RUNTIME_CANDIDATE_DEPLOY_PENDING';
                }
                item.updatedAt=stamp;
                changed=true;
                console.log('ROBLOX_LOCAL_F0_STATE_REPAIRED_TO_PRIVATE_DEPLOY='+item.gameId);
              }else{
                console.log('ROBLOX_LOCAL_F0_WAITING_PRIVATE_DEPLOY='+item.gameId);
              }
              localF0PrivateDeployIds.push(item.gameId);
              pending++;
              continue;
            }

            const priorRuntime=item.robloxRuntimeFoundationEvidence||{};
            const priorPost=item.robloxPostRuntimeQaEvidence||{};
            const priorMultiplayer=item.robloxMultiplayerQaEvidence||{};
            const multiplayer=multiplayerRequirementFor(item);
            const multiplayerSourceContract=multiplayer.required===true
              ?multiplayerSourceContractFor(item)
              :{passed:multiplayer.known===true,checks:{},authority:'not-applicable'};
            const staticMultiplayerCodePass=multiplayer.required===true&&multiplayerSourceContract.passed===true;
            if(staticMultiplayerCodePass){
              const exactStaticMultiplayerEvidence={
                version:2,
                gameId:item.gameId,
                sourceRevision,
                artifactIdentity,
                candidateVersionNumber:Number(candidate.versionNumber),
                passed:true,
                codeContractPassed:true,
                checks:multiplayerSourceContract.checks,
                runtimeTwoClientExecutionRequired:false,
                authority:'roblox-static-two-client-source-contract',
                verifiedAt:stamp,
              };
              const priorStatic=item.robloxMultiplayerQaEvidence||{};
              const exactStaticAlreadyBound=
                priorStatic.passed===true
                &&priorStatic.codeContractPassed===true
                &&priorStatic.authority==='roblox-static-two-client-source-contract'
                &&priorStatic.sourceRevision===sourceRevision
                &&priorStatic.artifactIdentity===artifactIdentity
                &&['playerRoster','participantCount','authoritativeBroadcast','clientReceive','twoParticipantCapablePath'].every(key=>priorStatic.checks?.[key]===true);
              item.robloxMultiplayerQaPassed=true;
              item.robloxMultiplayerQaPassedAt=exactStaticAlreadyBound?(item.robloxMultiplayerQaPassedAt||stamp):stamp;
              item.robloxMultiplayerQaEvidence=exactStaticMultiplayerEvidence;
              if(!exactStaticAlreadyBound)changed=true;
              console.log('ROBLOX_F7_MULTIPLAYER_CODE_CONTRACT_PREBOUND='+item.gameId+':source='+sourceRevision);
            }
            let studioPlay=item.robloxInternalVibePlayEvidence||{};
            const studioAssetBindingRequired=(item.robloxStudioAssetBindingApplied===true||item.robloxStudioAssetBinding?.required===true);
            const priorStudio=item.robloxStudioAssetRuntimeBindingEvidence||{};
            const reusableLocalStudioArtifactEvidence=Boolean(
              !cloudApiOnly&&localPreF9Candidate
              &&studioPlay.pass===true
              &&studioPlay.actualPlay===true
              &&studioPlay.runtimeVerified===true
              &&studioPlay.officialStudioMcp===true
              &&studioPlay.localPlaceFile===true
              &&studioPlay.onlinePlaceDirectOpen===false
              &&studioPlay.robloxPlayerAutomation===false
              &&studioPlay.artifactIdentity===artifactIdentity
              &&Number(studioPlay.runtimeSummary?.consoleErrorCount||0)===0
            );
            if(reusableLocalStudioArtifactEvidence
              &&(studioPlay.sourceRevision!==sourceRevision||Number(studioPlay.versionNumber)!==Number(candidate.versionNumber))){
              const historicalSourceRevision=String(studioPlay.sourceRevision||'');
              const historicalVersionNumber=Number(studioPlay.versionNumber||0);
              item.robloxInternalVibePlayEvidence={
                ...studioPlay,
                sourceRevision,
                artifactIdentity,
                artifactRunId:Number(candidate.artifactRunId||0),
                universeId:String(candidate.universeId||''),
                placeId:String(candidate.placeId||''),
                versionNumber:Number(candidate.versionNumber),
                currentSourceArtifactBinding:true,
                reusedFromExactArtifactIdentity:true,
                historicalSourceRevision,
                historicalVersionNumber,
                reusedAt:stamp,
              };
              studioPlay=item.robloxInternalVibePlayEvidence;
              item.robloxInternalPlaytestPassed=true;
              item.robloxInternalPlaytestPassedAt=stamp;
              changed=true;
              console.log('ROBLOX_STUDIO_EXACT_ARTIFACT_EVIDENCE_REBOUND='+item.gameId+':version='+candidate.versionNumber);
            }
            const exactPriorMultiplayerValidation=Boolean(
              priorMultiplayer.passed===true
              &&priorMultiplayer.artifactIdentity===artifactIdentity
            );
            const exactMultiplayerValidationReusable=exactPriorMultiplayerValidation||staticMultiplayerCodePass;
            const exactStudioInternalValidation=
              !cloudApiOnly&&studioPlay.pass===true
              &&studioPlay.actualPlay===true
              &&studioPlay.runtimeVerified===true
              &&studioPlay.officialStudioMcp===true
              &&studioPlay.localPlaceFile===true
              &&studioPlay.onlinePlaceDirectOpen===false
              &&studioPlay.robloxPlayerAutomation===false
              &&studioPlay.sourceRevision===sourceRevision
              &&studioPlay.artifactIdentity===artifactIdentity
              &&Number(studioPlay.versionNumber)===Number(candidate.versionNumber)
              &&Number(studioPlay.runtimeSummary?.consoleErrorCount||0)===0;
            const exactExternalRuntimeEvidenceReusable=
              item.robloxRuntimeFoundationPassed===true
              &&item.robloxRuntimePassed===true
              &&item.robloxIndependentQaPassed===true
              &&item.robloxRegressionPassed===true
              &&priorRuntime.sourceRevision===sourceRevision
              &&priorRuntime.artifactIdentity===artifactIdentity
              &&String(priorRuntime.placeId||'')===String(candidate.placeId||'')
              &&Number(priorRuntime.candidateVersionNumber)===Number(candidate.versionNumber)
              &&priorRuntime.runtimeFoundationPassed===true
              &&priorRuntime.runtimeAcceptancePassed===true
              &&priorRuntime.validationProvider==='ROBLOX_OFFICIAL_CLOUD_API_ONLY'
              &&priorRuntime.openCloudImageEvidence?.imageContentPassed===true
              &&priorPost.sourceRevision===sourceRevision
              &&priorPost.artifactIdentity===artifactIdentity
              &&Number(priorPost.candidateVersionNumber)===Number(candidate.versionNumber)
              &&(!studioAssetBindingRequired||(
                item.robloxStudioAssetRuntimeBindingPassed===true
                &&priorStudio.sourceRevision===sourceRevision
                &&priorStudio.artifactIdentity===artifactIdentity
                &&Number(priorStudio.candidateVersionNumber)===Number(candidate.versionNumber)
              ));
            const exactStudioRuntimeEvidenceReusable=
              exactStudioInternalValidation
              &&item.robloxIndependentQaPassed===true
              &&item.robloxRegressionPassed===true
              &&priorPost.internalStudioValidationOnly===true
              &&priorPost.externalServerBootRequired===false
              &&priorPost.independentQaPassed===true
              &&priorPost.regressionPassed===true
              &&priorPost.multiplayerValidationPassed===true
              &&priorPost.sourceRevision===sourceRevision
              &&priorPost.artifactIdentity===artifactIdentity
              &&Number(priorPost.candidateVersionNumber)===Number(candidate.versionNumber);
            const exactRuntimeEvidenceReusable=exactExternalRuntimeEvidenceReusable;
            if(exactRuntimeEvidenceReusable){
              item.currentStep='ROBLOX_FINAL_REVIEW_REVALIDATION';
              item.canonicalState='ROBLOX_RUNTIME_ACCEPTANCE_PASSED';
              item.robloxFailureStage='ROBLOX_FINAL_REVIEW_REVALIDATION';
              item.robloxFailureSignature='ROBLOX_FINAL_REVIEW_PENDING';
              item.routingBlockers=['roblox-final-review-pending'];
              item.robloxRuntimeEvidenceReuse={
                sourceRevision,
                artifactIdentity,
                candidateVersionNumber:Number(candidate.versionNumber),
                reusedAt:stamp,
                reusedServerBootEvidence:exactExternalRuntimeEvidenceReusable,
                reusedStudioInternalEvidence:exactStudioRuntimeEvidenceReusable,
                reason:exactStudioRuntimeEvidenceReusable
                  ?'EXACT_SOURCE_ARTIFACT_VERSION_STUDIO_INTERNAL_EVIDENCE_ALREADY_VERIFIED'
                  :'EXACT_SOURCE_ARTIFACT_PLACE_VERSION_ALREADY_VERIFIED',
              };
              item.updatedAt=stamp;
              changed=true;
              f9Ids.push(item.gameId);
              passed++;
              queueStudioFollowupIfEligible(item);
              console.log('ROBLOX_RUNTIME_EVIDENCE_REUSED='+item.gameId+':version='+candidate.versionNumber);
              continue;
            }

            if(!serverDiagnosticEnabled){
              if(!exactStudioInternalValidation){
                queueStudioFollowupIfEligible(item);
                item.robloxRuntimeFoundationPassed=false;
                item.robloxRuntimePassed=false;
                item.robloxFailureStage='VIBE_INTERNAL_PLAY';
                item.robloxFailureSignature='ROBLOX_STUDIO_INTERNAL_VALIDATION_PENDING';
                item.routingBlockers=['roblox-studio-internal-validation-pending'];
                item.updatedAt=stamp;
                changed=true;
                pending++;
                console.log('ROBLOX_INTERNAL_VALIDATION_WAITING_FOR_STUDIO='+item.gameId);
                continue;
              }

              const multiplayerValidationPassed=multiplayer.known===true
                &&(multiplayer.required!==true||item.robloxMultiplayerQaPassed===true||exactMultiplayerValidationReusable);
              if(multiplayer.required===true&&staticMultiplayerCodePass){
                item.robloxMultiplayerQaPassed=true;
