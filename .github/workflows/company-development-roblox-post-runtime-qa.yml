name: Company DEVELOPMENT_CONFIRMED Roblox Runtime Foundation QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/company-development-roblox-post-runtime-qa.yml'
      - 'tools/company-development-roblox-runtime-foundation.mjs'
      - 'qa/company-development-roblox-runtime-foundation.test.mjs'
      - 'roblox-games/.company-runtime-trigger'
  workflow_dispatch:
    inputs:
      game_id:
        description: Optional exact gameId. Empty means all pending Roblox runtime candidates.
        required: false
        type: string
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: company-development-roblox-runtime-foundation-qa-${{ inputs.game_id || (github.event_name == 'schedule' && 'scheduled-scan') || (github.event_name == 'workflow_dispatch' && 'manual-scan') || github.run_id }}
  cancel-in-progress: false

env:
  COMPANY_RUNTIME_BRANCH: company-runtime

jobs:
  runtime-foundation-qa:
    name: existing game tester and QA validate exact Roblox runtime candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current canonical implementation
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
          fetch-depth: 1
          fetch-tags: false

      - name: Checkout canonical runtime state
        uses: actions/checkout@v4
        with:
          ref: company-runtime
          path: runtime
          fetch-depth: 1
          fetch-tags: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Synchronize worker with constitution central policy and compiled architecture
        working-directory: main
        shell: bash
        run: |
          set -euo pipefail
          node tools/company-shared-context.mjs --output=/tmp/roblox-foundation-worker-context.json
          node -e "const x=require('/tmp/roblox-foundation-worker-context.json');if(x.pass!==true||x.architectureProjection?.valid!==true)process.exit(1)"
          echo 'ROBLOX_FOUNDATION_SHARED_CONTEXT=PASS'

      - name: Run deterministic foundation protocol QA
        working-directory: main
        shell: bash
        run: |
          set -euo pipefail
          node --test             qa/company-development-roblox-runtime-foundation.test.mjs             qa/company-development-roblox-headless-fast-mvp.test.mjs             qa/company-tester-debug-intake.test.mjs
          echo 'ROBLOX_FOUNDATION_DETERMINISTIC_QA=PASS'

      - name: Probe exact Roblox Open Cloud engine execution
        working-directory: main
        continue-on-error: true
        env:
          REQUESTED_GAME_ID: ${{ inputs.game_id || '' }}
          EVENT_NAME: ${{ github.event_name }}
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ROBLOX_OPEN_CLOUD_API_KEY"
          git -C ../runtime fetch --no-tags origin "$COMPANY_RUNTIME_BRANCH"
          git -C ../runtime reset --hard "origin/$COMPANY_RUNTIME_BRANCH"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {probeRobloxOpenCloudEngine} from './tools/company-development-roblox-runtime-foundation.mjs';
          let requested=String(process.env.REQUESTED_GAME_ID||'').trim();
          if(!requested&&process.env.EVENT_NAME==='push'){
            const triggerPath='roblox-games/.company-runtime-trigger';
            if(fs.existsSync(triggerPath))requested=String(fs.readFileSync(triggerPath,'utf8').match(/^gameId:\s*([^\s]+)\s*$/m)?.[1]||'').trim();
          }
          const q=JSON.parse(fs.readFileSync('../runtime/development-queue.json','utf8'));
          const roadmap=JSON.parse(fs.readFileSync('company-learning/platform-release-roadmap.json','utf8'));
          const sharedTarget=roadmap?.roblox?.deploymentControl?.ownerPinnedPublicationTarget||{};
          const sharedUniverse=String(sharedTarget.universeId||'').trim();
          const sharedPlace=String(sharedTarget.placeId||'').trim();
          const sharedRotationEnabled=sharedTarget.enabled===true&&sharedTarget.sharedFastMvpRotationAllowed===true;
          const candidates=(q.items||[]).filter(item=>{
            if(requested&&item.gameId!==requested)return false;
            const c=item.robloxRuntimeCandidateEvidence||{};
            if(sharedRotationEnabled
              &&String(c.universeId||'').trim()===sharedUniverse
              &&String(c.placeId||'').trim()===sharedPlace
              &&item.robloxSharedTargetCurrent===false)return false;
            const sourceRevision=String(item.robloxSourceCommit||'').trim();
            const artifactIdentity=String(item.robloxBuildArtifactIdentity||'').trim();
            const runtime=item.robloxRuntimeFoundationEvidence||{};
            const post=item.robloxPostRuntimeQaEvidence||{};
            const studioRequired=item.robloxStudioAssetBindingApplied===true;
            const studio=item.robloxStudioAssetRuntimeBindingEvidence||{};
            const exactReusable=
              c.published===true
              &&Number(c.versionNumber)>0&&c.universeId&&c.placeId
              &&item.robloxRuntimeFoundationPassed===true
              &&item.robloxRuntimePassed===true
              &&item.robloxIndependentQaPassed===true
              &&item.robloxRegressionPassed===true
              &&runtime.sourceRevision===sourceRevision
              &&runtime.artifactIdentity===artifactIdentity
              &&String(runtime.placeId||'')===String(c.placeId||'')
              &&Number(runtime.candidateVersionNumber)===Number(c.versionNumber)
              &&runtime.runtimeFoundationPassed===true
              &&runtime.runtimeAcceptancePassed===true
              &&post.sourceRevision===sourceRevision
              &&post.artifactIdentity===artifactIdentity
              &&Number(post.candidateVersionNumber)===Number(c.versionNumber)
              &&(!studioRequired||(
                item.robloxStudioAssetRuntimeBindingPassed===true
                &&studio.sourceRevision===sourceRevision
                &&studio.artifactIdentity===artifactIdentity
                &&Number(studio.candidateVersionNumber)===Number(c.versionNumber)
              ));
            if(exactReusable){
              console.log('ROBLOX_OPEN_CLOUD_ENGINE_PROBE_SKIPPED_EXACT_EVIDENCE_REUSE='+item.gameId);
              return false;
            }
            return c.published===true&&Number(c.versionNumber)>0&&c.universeId&&c.placeId;
          });
          const probes=[];
          for(const item of candidates.slice(0,4)){
            const c=item.robloxRuntimeCandidateEvidence;
            const result=await probeRobloxOpenCloudEngine({
              universeId:String(c.universeId),placeId:String(c.placeId),versionNumber:Number(c.versionNumber),
              apiKey:process.env.ROBLOX_OPEN_CLOUD_API_KEY,pollIntervalMs:1000,maxPolls:45,
              expectedStudioAssetBinding:item.robloxStudioAssetBindingApplied===true?item.robloxStudioAssetBinding:null,
            });
            const probe={gameId:item.gameId,versionNumber:Number(c.versionNumber),...result};
            probes.push(probe);
            console.log('ROBLOX_OPEN_CLOUD_ENGINE_PROBE='+JSON.stringify(probe));
          }
          fs.writeFileSync('/tmp/roblox-open-cloud-engine-probes.json',JSON.stringify(probes,null,2)+'\n');
          NODE

      - name: Read exact runtime sentinel and persist tester QA evidence
        working-directory: main
        env:
          REQUESTED_GAME_ID: ${{ inputs.game_id || '' }}
          EVENT_NAME: ${{ github.event_name }}
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ROBLOX_OPEN_CLOUD_API_KEY"
          git -C ../runtime fetch --no-tags origin "$COMPANY_RUNTIME_BRANCH"
          git -C ../runtime reset --hard "origin/$COMPANY_RUNTIME_BRANCH"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {
            fetchRobloxRuntimeFoundationEvidence,
            validateRobloxRuntimeFoundationEvidence,
          } from './tools/company-development-roblox-runtime-foundation.mjs';

          let requested=String(process.env.REQUESTED_GAME_ID||'').trim();
          if(!requested&&process.env.EVENT_NAME==='push'){
            const triggerPath='roblox-games/.company-runtime-trigger';
            if(fs.existsSync(triggerPath)){
              requested=String(fs.readFileSync(triggerPath,'utf8').match(/^gameId:\s*([^\s]+)\s*$/m)?.[1]||'').trim();
            }
          }
          if(requested&&!/^[a-z0-9][a-z0-9-]{1,48}$/.test(requested))throw new Error('ROBLOX_FOUNDATION_REQUESTED_GAME_ID_INVALID:'+requested);
          console.log('ROBLOX_FOUNDATION_REQUESTED_GAME_ID='+(requested||'ALL_PENDING'));
          const queuePath='../runtime/development-queue.json';
          const q=JSON.parse(fs.readFileSync(queuePath,'utf8'));
          const roadmap=JSON.parse(fs.readFileSync('company-learning/platform-release-roadmap.json','utf8'));
          const sharedTarget=roadmap?.roblox?.deploymentControl?.ownerPinnedPublicationTarget||{};
          const sharedUniverse=String(sharedTarget.universeId||'').trim();
          const sharedPlace=String(sharedTarget.placeId||'').trim();
          const sharedRotationEnabled=sharedTarget.enabled===true
            &&sharedTarget.sharedFastMvpRotationAllowed===true
            &&/^[1-9][0-9]*$/.test(sharedUniverse)
            &&/^[1-9][0-9]*$/.test(sharedPlace);
          const isSharedCandidate=(candidate={})=>sharedRotationEnabled
            &&String(candidate.universeId||'').trim()===sharedUniverse
            &&String(candidate.placeId||'').trim()===sharedPlace;
          let changed=false,passed=0,pending=0,failed=0;
          if(sharedRotationEnabled){
            const sharedCurrent=(q.items||[])
              .filter(item=>item.robloxSharedTargetCurrent!==false&&item.robloxRuntimeCandidateEvidence?.published===true&&isSharedCandidate(item.robloxRuntimeCandidateEvidence))
              .sort((a,b)=>Number(b.robloxRuntimeCandidateEvidence?.versionNumber||0)-Number(a.robloxRuntimeCandidateEvidence?.versionNumber||0)
                ||String(b.robloxRuntimeCandidateEvidence?.publishedAt||'').localeCompare(String(a.robloxRuntimeCandidateEvidence?.publishedAt||'')));
            const actualCurrent=sharedCurrent[0]||null;
            for(const item of sharedCurrent.slice(1)){
              item.robloxSharedTargetCurrent=false;
              item.robloxFastMvpSupersededBy=actualCurrent?.gameId||null;
              if(item.robloxRuntimeCandidateEvidence&&typeof item.robloxRuntimeCandidateEvidence==='object'){
                item.robloxRuntimeCandidateEvidence={
                  ...item.robloxRuntimeCandidateEvidence,
                  current:false,
                  supersededAt:new Date().toISOString(),
                  supersededBy:actualCurrent?.gameId||null,
                };
              }
              if(item.robloxRuntimePassed!==true&&item.robloxFinalReviewPassed!==true){
                item.currentStep='PRIVATE_RUNTIME_CANDIDATE_DEPLOY';
                item.canonicalState='F0_SOURCE_PREFLIGHT_PASSED';
                item.robloxFailureStage='PRIVATE_RUNTIME_CANDIDATE_DEPLOY';
                item.robloxFailureSignature='ROBLOX_RUNTIME_CANDIDATE_DEPLOY_PENDING';
                item.routingBlockers=['roblox-shared-runtime-target-capacity-republish-required'];
              }
              item.updatedAt=new Date().toISOString();
              changed=true;
              console.log('ROBLOX_SHARED_TARGET_SUPERSEDED='+item.gameId+':current='+(actualCurrent?.gameId||'NONE'));
            }
            if(actualCurrent&&actualCurrent.robloxSharedTargetCurrent!==true){
              actualCurrent.robloxSharedTargetCurrent=true;
              actualCurrent.robloxFastMvpSupersededBy=null;
              actualCurrent.updatedAt=new Date().toISOString();
              changed=true;
            }
          }
          const probePath='/tmp/roblox-open-cloud-engine-probes.json';
          const probeRows=fs.existsSync(probePath)?JSON.parse(fs.readFileSync(probePath,'utf8')):[];
          const engineProbeByGame=new Map((Array.isArray(probeRows)?probeRows:[]).map(row=>[String(row?.gameId||''),row]));
          const candidates=(q.items||[]).filter(item=>{
            if(requested&&item.gameId!==requested)return false;
            const candidate=item.robloxRuntimeCandidateEvidence||{};
            if(isSharedCandidate(candidate)&&item.robloxSharedTargetCurrent===false)return false;
            return candidate.published===true
              &&item.robloxFoundationF0Passed===true
              &&item.robloxInternalReleaseReady!==true
              &&item.robloxPublicRelease!==true
              &&['TARGET_PLATFORM_RUNTIME_FOUNDATION','TARGET_PLATFORM_RUNTIME_ACCEPTANCE'].includes(String(item.robloxFailureStage||''));
          });
          const f9Ids=[];
          const stamp=new Date().toISOString();

          for(const item of candidates){
            const candidate=item.robloxRuntimeCandidateEvidence||{};
            const sourceRevision=String(item.robloxSourceCommit||'').trim();
            const artifactIdentity=String(item.robloxBuildArtifactIdentity||'').trim();
            const exactCandidate=
              candidate.sourceRevision===sourceRevision
              &&candidate.artifactIdentity===artifactIdentity
              &&Number(candidate.versionNumber)>0
              &&/^[1-9][0-9]*$/.test(String(candidate.universeId||''))
              &&/^[1-9][0-9]*$/.test(String(candidate.placeId||''));
            if(!exactCandidate){
              item.robloxRuntimeFoundationPassed=false;
              item.robloxRuntimePassed=false;
              item.robloxFailureStage='TARGET_PLATFORM_RUNTIME_FOUNDATION';
              item.robloxFailureSignature='ROBLOX_RUNTIME_CANDIDATE_IDENTITY_MISMATCH';
              item.routingBlockers=['roblox-runtime-candidate-identity-mismatch'];
              item.updatedAt=stamp;changed=true;failed++;
              continue;
            }

            const priorRuntime=item.robloxRuntimeFoundationEvidence||{};
            const priorPost=item.robloxPostRuntimeQaEvidence||{};
            const studioAssetBindingRequired=item.robloxStudioAssetBindingApplied===true;
            const priorStudio=item.robloxStudioAssetRuntimeBindingEvidence||{};
            const exactRuntimeEvidenceReusable=
              item.robloxRuntimeFoundationPassed===true
              &&item.robloxRuntimePassed===true
              &&item.robloxIndependentQaPassed===true
              &&item.robloxRegressionPassed===true
              &&priorRuntime.sourceRevision===sourceRevision
              &&priorRuntime.artifactIdentity===artifactIdentity
              &&String(priorRuntime.placeId||'')===String(candidate.placeId||'')
              &&Number(priorRuntime.candidateVersionNumber)===Number(candidate.versionNumber)
              &&priorRuntime.runtimeFoundationPassed===true
              &&priorRuntime.runtimeAcceptancePassed===true
              &&priorPost.sourceRevision===sourceRevision
              &&priorPost.artifactIdentity===artifactIdentity
              &&Number(priorPost.candidateVersionNumber)===Number(candidate.versionNumber)
              &&(!studioAssetBindingRequired||(
                item.robloxStudioAssetRuntimeBindingPassed===true
                &&priorStudio.sourceRevision===sourceRevision
                &&priorStudio.artifactIdentity===artifactIdentity
                &&Number(priorStudio.candidateVersionNumber)===Number(candidate.versionNumber)
              ));
            if(exactRuntimeEvidenceReusable){
              item.currentStep='ROBLOX_FINAL_REVIEW_REVALIDATION';
              item.canonicalState='ROBLOX_RUNTIME_ACCEPTANCE_PASSED';
              item.robloxFailureStage='ROBLOX_FINAL_REVIEW_REVALIDATION';
              item.robloxFailureSignature='ROBLOX_FINAL_REVIEW_PENDING';
              item.routingBlockers=['roblox-final-review-pending'];
              item.robloxRuntimeEvidenceReuse={
                sourceRevision,
                artifactIdentity,
                candidateVersionNumber:Number(candidate.versionNumber),
                reusedAt:stamp,
                reusedServerBootEvidence:true,
                reason:'EXACT_SOURCE_ARTIFACT_PLACE_VERSION_ALREADY_VERIFIED',
              };
              item.updatedAt=stamp;
              changed=true;
              f9Ids.push(item.gameId);
              passed++;
              console.log('ROBLOX_RUNTIME_EVIDENCE_REUSED='+item.gameId+':version='+candidate.versionNumber);
              continue;
            }

            const engineProbe=engineProbeByGame.get(item.gameId);
            if(engineProbe?.permissionDenied===true){
              const requiredScope=String(engineProbe.requiredScope||'universe.place.luau-execution-session:write');
              const failureSignature='ROBLOX_OPEN_CLOUD_LUAU_EXECUTION_PERMISSION_DENIED';
              const priorRetryCount=Math.max(0,Number(item.robloxRuntimeRetryCount||0));
              const samePermissionBlock=
                item.robloxFailureSignature===failureSignature
                &&item.robloxRuntimeFoundationEvidence?.authority==='roblox-open-cloud-engine-permission-evidence'
                &&item.robloxRuntimeFoundationEvidence?.requiredScope===requiredScope
                &&Number(item.robloxRuntimeFoundationEvidence?.httpStatus)===Number(engineProbe.status)
                &&priorRetryCount===0;
              item.robloxRuntimeFoundationPassed=false;
              item.robloxRuntimePassed=false;
              item.robloxRuntimeRetryCount=0;
              item.robloxFailureStage='TARGET_PLATFORM_RUNTIME_FOUNDATION';
              item.robloxFailureSignature=failureSignature;
              item.routingBlockers=['roblox-open-cloud-luau-execution-scope-missing','roblox-runtime-foundation-awaiting-observation'];
              if(!samePermissionBlock){
                item.robloxRuntimeFoundationEvidence={
                  version:1,
                  gameId:item.gameId,
                  sourceRevision,
                  artifactIdentity,
                  universeId:String(candidate.universeId),
                  placeId:String(candidate.placeId),
                  expectedVersionNumber:Number(candidate.versionNumber),
                  requiredScope,
                  httpStatus:Number(engineProbe.status)||0,
                  errorCode:String(engineProbe.errorCode||'PERMISSION_DENIED'),
                  failureStage:String(engineProbe.failureStage||'CREATE'),
                  observedAt:stamp,
                  authority:'roblox-open-cloud-engine-permission-evidence',
                };
                item.updatedAt=stamp;
                changed=true;
              }
              console.log(`ROBLOX_FOUNDATION_PERMISSION_BLOCKED=${item.gameId}:requiredScope=${requiredScope}:HTTP_${Number(engineProbe.status)||0}`);
              pending++;
              continue;
            }

            let sentinel;
            try{
              sentinel=await fetchRobloxRuntimeFoundationEvidence({
                universeId:String(candidate.universeId),
                apiKey:process.env.ROBLOX_OPEN_CLOUD_API_KEY,
              });
            }catch(error){
              const message=String(error?.message||error);
              if(/HTTP_404/.test(message)){
                const attempts=Math.max(0,Number(item.robloxRuntimeRetryCount||0))+1;
                item.robloxRuntimeRetryCount=attempts;
                item.robloxRuntimeLastObservationAttemptAt=stamp;
                item.robloxRuntimeFoundationPassed=false;
                item.robloxRuntimePassed=false;
                item.robloxFailureStage='TARGET_PLATFORM_RUNTIME_FOUNDATION';
                item.robloxFailureSignature='ROBLOX_RUNTIME_FOUNDATION_PENDING';
                item.routingBlockers=['roblox-runtime-foundation-awaiting-observation'];
                console.log(`ROBLOX_FOUNDATION_AWAITING_FIRST_RUNTIME=${item.gameId}:attempt=${attempts}:retry=UNLIMITED_CAUSAL_REPAIR`);
                pending++;
                item.updatedAt=stamp;
                changed=true;
                continue;
              }
              throw error;
            }

            const result=validateRobloxRuntimeFoundationEvidence({
              sentinel,
              gameId:item.gameId,
              placeId:String(candidate.placeId),
              versionNumber:Number(candidate.versionNumber),
            });
            console.log('ROBLOX_FOUNDATION_RESULT='+JSON.stringify({
              gameId:item.gameId,
              exactGame:result.exactGame,
              exactPlace:result.exactPlace,
              exactVersion:result.exactVersion,
              requiredCheckpoints:result.requiredCheckpoints,
              checkpointPass:result.checkpointPass,
              checkpointOrderPassed:result.checkpointOrderPassed,
              runtimeFoundationPassed:result.runtimeFoundationPassed,
              developmentContinuationPassed:result.developmentContinuationPassed,
              runtimeAcceptancePassed:result.runtimeAcceptancePassed,
              multiplayerPromotionPending:result.multiplayerPromotionPending,
              blockers:result.blockers,
            }));
            if(result.exactGame===true&&result.exactPlace===true&&result.exactVersion!==true){
              const attempts=Math.max(0,Number(item.robloxRuntimeRetryCount||0))+1;
              item.robloxRuntimeRetryCount=attempts;
              item.robloxRuntimeLastObservationAttemptAt=stamp;
              item.robloxRuntimeFoundationPassed=false;
              item.robloxRuntimePassed=false;
              item.robloxFailureStage='TARGET_PLATFORM_RUNTIME_FOUNDATION';
              item.robloxRuntimeFoundationEvidence={
                version:1,
                gameId:item.gameId,
                sourceRevision,
                artifactIdentity,
                universeId:String(candidate.universeId),
                placeId:String(candidate.placeId),
                expectedVersionNumber:Number(candidate.versionNumber),
                observedVersionNumber:Number(sentinel.placeVersion||0),
                exactGame:result.exactGame,
                exactPlace:result.exactPlace,
                exactVersion:false,
                blockers:result.blockers,
                observedAt:stamp,
                authority:'stale-runtime-sentinel-observation',
              };
              item.robloxFailureSignature='ROBLOX_RUNTIME_FOUNDATION_PENDING';
              item.routingBlockers=['roblox-runtime-foundation-stale-version'];
              console.log(`ROBLOX_FOUNDATION_STALE_RUNTIME=${item.gameId}:attempt=${attempts}:staleVersion=${Number(sentinel.placeVersion||0)}:expectedVersion=${Number(candidate.versionNumber)}:retry=UNLIMITED_CAUSAL_REPAIR`);
              pending++;
              item.updatedAt=stamp;
              changed=true;
              continue;
            }
            const evidence={
              ...result,
              sourceRevision,
              artifactIdentity,
              artifactRunId:Number(candidate.artifactRunId||0),
              universeId:String(candidate.universeId),
              candidateVersionNumber:Number(candidate.versionNumber),
              observedAt:stamp,
              workflowRunId:Number(process.env.GITHUB_RUN_ID||0),
              authority:'existing-game-tester-roblox-runtime-foundation-v1',
            };
            item.robloxRuntimeFoundationEvidence=evidence;
            item.robloxRuntimeFoundationPassed=result.runtimeFoundationPassed===true;
            item.robloxRuntimePassed=result.runtimeAcceptancePassed===true;
            item.robloxServerClientBoundaryPassed=result.f6CoreServicesPassed===true;
            item.robloxDatastoreRejoinPassed=result.f6CoreServicesPassed===true;
            item.robloxMobileControlUiPassed=result.f5InputCameraUiPassed===true;
            item.robloxMultiplayerQaPassed=result.f7MultiplayerFoundationPassed===true;
            const studioAssetBindingRequired=item.robloxStudioAssetBindingApplied===true;
            const studioAssetRuntimeBindingPassed=studioAssetBindingRequired
              &&result.runtimeAcceptancePassed===true
              &&result.f5InputCameraUiPassed===true
              &&result.f8GameplaySystemsPassed===true
              &&engineProbe?.engineExecuted===true
              &&engineProbe?.exactPlace===true
              &&engineProbe?.exactVersion===true
              &&engineProbe?.studioAssetSelectionMatched===true;
            item.robloxStudioAssetRuntimeBindingPassed=studioAssetRuntimeBindingPassed;
            item.robloxStudioAssetRuntimeBindingEvidence=studioAssetBindingRequired?{
              version:1,
              gameId:item.gameId,
              sourceRevision,
              artifactIdentity,
              candidateVersionNumber:Number(candidate.versionNumber),
              uiAndInputRuntimePassed:result.f5InputCameraUiPassed===true,
              coreLoopRuntimePassed:result.f8GameplaySystemsPassed===true,
              runtimeAcceptancePassed:result.runtimeAcceptancePassed===true,
              exactRevision:true,
              targetEngineExecuted:engineProbe?.engineExecuted===true,
              targetEngineExactPlace:engineProbe?.exactPlace===true,
              targetEngineExactVersion:engineProbe?.exactVersion===true,
              targetEngineStudioAssetApplied:engineProbe?.studioAssetApplied===true,
              targetEngineStudioAssetBindingVersion:Number(engineProbe?.studioAssetBindingVersion||0),
              targetEngineSelectionMatched:engineProbe?.studioAssetSelectionMatched===true,
              expectedStudioAssetAtoms:engineProbe?.expectedStudioAssetAtoms||[],
              observedStudioAssetAtoms:engineProbe?.observedStudioAssetAtoms||[],
              actualPlatformRuntime:true,
              marker:studioAssetRuntimeBindingPassed?'ROBLOX_STUDIO_ASSET_RUNTIME_BINDING_PASS':'ROBLOX_STUDIO_ASSET_RUNTIME_BINDING_PENDING',
              authority:'roblox-exact-runtime-studio-asset-binding-v1',
              verifiedAt:studioAssetRuntimeBindingPassed?stamp:null,
            }:null;
            item.robloxRuntimeEvidence={
              ...evidence,
              runtimePassed:result.runtimeAcceptancePassed===true,
              serverClientBoundaryPassed:result.f6CoreServicesPassed===true,
              datastoreRejoinPassed:result.f6CoreServicesPassed===true,
              mobileControlUiPassed:result.f5InputCameraUiPassed===true,
              multiplayerQaPassed:result.f7MultiplayerFoundationPassed===true,
              studioAssetBindingRequired,
              studioAssetRuntimeBindingPassed,
              studioAssetRuntimeBindingMarker:studioAssetRuntimeBindingPassed?'ROBLOX_STUDIO_ASSET_RUNTIME_BINDING_PASS':studioAssetBindingRequired?'ROBLOX_STUDIO_ASSET_RUNTIME_BINDING_PENDING':'NOT_REQUIRED',
              actualPlatformRuntime:true,
              authority:'roblox-actual-runtime-foundation-and-core-acceptance',
            };

            if(result.runtimeAcceptancePassed===true){
              item.robloxRuntimePassedAt=stamp;
              item.robloxRuntimeFailedAt=null;
              item.robloxIndependentQaPassed=true;
              item.robloxIndependentQaPassedAt=stamp;
              item.robloxRegressionPassed=true;
              item.robloxRegressionPassedAt=stamp;
              item.robloxPostRuntimeQaEvidence={
                version:2,
                gameId:item.gameId,
                sourceRevision,
                artifactIdentity,
                artifactRunId:Number(candidate.artifactRunId||0),
                candidateVersionNumber:Number(candidate.versionNumber),
                runtimeFoundationEvidence:evidence,
                exactRevision:true,
                independentQaPassed:true,
                regressionPassed:true,
                actualRuntimeEvidence:true,
                studioAssetBindingRequired,
                studioAssetRuntimeBindingPassed,
                studioAssetRuntimeBindingEvidence:item.robloxStudioAssetRuntimeBindingEvidence,
                deterministicQa:[
                  'qa/company-development-roblox-runtime-foundation.test.mjs',
                  'qa/company-development-roblox-headless-fast-mvp.test.mjs',
                  'qa/company-tester-debug-intake.test.mjs',
                ],
                authority:'existing-independent-qa-native-foundation-v2',
                verifiedAt:stamp,
              };
              item.currentStep='ROBLOX_FINAL_REVIEW_REVALIDATION';
              item.canonicalState='ROBLOX_RUNTIME_ACCEPTANCE_PASSED';
              item.robloxLastSuccessfulStage='TARGET_PLATFORM_REGRESSION';
              item.robloxFailureStage='ROBLOX_FINAL_REVIEW_REVALIDATION';
              item.robloxFailureSignature='ROBLOX_FINAL_REVIEW_PENDING';
              item.routingBlockers=['roblox-final-review-pending'];
              if(studioAssetBindingRequired&&!studioAssetRuntimeBindingPassed){
                throw new Error('ROBLOX_STUDIO_ASSET_RUNTIME_BINDING_EXPECTED_AFTER_ACCEPTANCE:'+item.gameId);
              }
              if(studioAssetRuntimeBindingPassed)console.log('ROBLOX_STUDIO_ASSET_RUNTIME_BINDING_PASS='+item.gameId+':'+sourceRevision+':'+candidate.versionNumber);
              if(item.executionEvidence){
                item.executionEvidence.lastSuccessfulStage='TARGET_PLATFORM_REGRESSION';
                item.executionEvidence.runtimePassed=true;
                item.executionEvidence.independentQaPassed=true;
                item.executionEvidence.regressionPassed=true;
                item.executionEvidence.failureStage=null;
                item.executionEvidence.failureSignature=null;
              }
              f9Ids.push(item.gameId);
              passed++;
            }else{
              const cp=result.checkpointPass||{};
              const groundFailure=result.exactVersion===true&&cp.CHARACTER_READY===true&&cp.GROUND_CONTACT!==true;
              const multiplayerOnlyPending=result.developmentContinuationPassed===true&&result.multiplayerPromotionPending===true;
              if(multiplayerOnlyPending){
                item.robloxIndependentQaPassed=true;
                item.robloxIndependentQaPassedAt=stamp;
                item.robloxRegressionPassed=true;
                item.robloxRegressionPassedAt=stamp;
                item.robloxParallelMultiplayerValidationPending=true;
                item.robloxPostRuntimeQaEvidence={
                  version:3,
                  gameId:item.gameId,
                  sourceRevision,
                  artifactIdentity,
                  artifactRunId:Number(candidate.artifactRunId||0),
                  candidateVersionNumber:Number(candidate.versionNumber),
                  runtimeFoundationEvidence:evidence,
                  exactRevision:true,
                  independentQaPassed:true,
                  regressionPassed:true,
                  multiplayerQaPassed:false,
                  multiplayerValidationMode:'PARALLEL_NON_BLOCKING_DEVELOPMENT_RELEASE_BLOCKING_ONLY',
                  actualRuntimeEvidence:true,
                  deterministicQa:[
                    'qa/company-development-roblox-runtime-foundation.test.mjs',
                    'qa/company-development-roblox-headless-fast-mvp.test.mjs',
                    'qa/company-tester-debug-intake.test.mjs',
                  ],
                  authority:'existing-independent-qa-native-foundation-v3',
                  verifiedAt:stamp,
                };
                item.robloxInternalMultiplayerSimplifiedPassed=false;
                item.currentStep='TARGET_PLATFORM_RUNTIME_ACCEPTANCE';
                item.canonicalState='ROBLOX_TWO_CLIENT_ONE_SYNC_PENDING';
                item.robloxLastSuccessfulStage='TARGET_PLATFORM_REGRESSION';
                item.robloxFailureStage='TARGET_PLATFORM_RUNTIME_ACCEPTANCE';
                item.robloxFailureSignature='ROBLOX_TWO_CLIENT_ONE_SYNC_PENDING';
                item.routingBlockers=['roblox-two-client-one-sync-pending'];
                item.robloxPromotionBlockers=['roblox-two-client-one-sync-pending'];
                if(item.executionEvidence){
                  item.executionEvidence.lastSuccessfulStage='TARGET_PLATFORM_REGRESSION';
                  item.executionEvidence.runtimePassed=false;
                  item.executionEvidence.independentQaPassed=true;
                  item.executionEvidence.regressionPassed=true;
                  item.executionEvidence.failureStage='TARGET_PLATFORM_RUNTIME_ACCEPTANCE';
                  item.executionEvidence.failureSignature='ROBLOX_TWO_CLIENT_ONE_SYNC_PENDING';
                }
                console.log('ROBLOX_TWO_CLIENT_ONE_SYNC_PENDING='+item.gameId);
                pending++;
              }else{
                item.robloxIndependentQaPassed=false;
                item.robloxRegressionPassed=false;
                item.robloxParallelMultiplayerValidationPending=false;
                item.robloxPromotionBlockers=[];
                if(groundFailure){
                item.robloxFailureStage='TARGET_PLATFORM_RUNTIME_FOUNDATION';
                item.robloxFailureSignature='GROUND_CONTACT_FAILURE';
                item.routingBlockers=['roblox-ground-contact-failure'];
                failed++;
              }else if(result.runtimeFoundationPassed===true){
                item.robloxFailureStage='TARGET_PLATFORM_RUNTIME_ACCEPTANCE';
                item.robloxFailureSignature='ROBLOX_RUNTIME_ACCEPTANCE_PENDING';
                item.routingBlockers=['roblox-runtime-acceptance-awaiting-tester-actions'];
                pending++;
              }else{
                item.robloxFailureStage='TARGET_PLATFORM_RUNTIME_FOUNDATION';
                item.robloxFailureSignature='ROBLOX_RUNTIME_FOUNDATION_PENDING';
                item.routingBlockers=['roblox-runtime-foundation-awaiting-observation'];
                pending++;
                }
              }
            }
            item.updatedAt=stamp;changed=true;
          }

          if(changed){
            q.updatedAt=stamp;
            fs.writeFileSync(queuePath,JSON.stringify(q,null,2)+'\n');
          }
          console.log(`ROBLOX_FOUNDATION_CANDIDATES=${candidates.length}`);
          console.log(`ROBLOX_FOUNDATION_RUNTIME_PASS=${passed}`);
          console.log(`ROBLOX_FOUNDATION_RUNTIME_PENDING=${pending}`);
          fs.writeFileSync('/tmp/roblox-f9-ids',f9Ids.join('\n')+(f9Ids.length?'\n':''));
          console.log(`ROBLOX_FOUNDATION_RUNTIME_FAILURE=${failed}`);
          NODE

      - name: Persist runtime tester and QA evidence
        working-directory: runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-roblox-tester-qa'
          git config user.email 'actions@users.noreply.github.com'
          git add development-queue.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'ROBLOX_FOUNDATION_RUNTIME_STATE_CHANGE=NO'
            exit 0
          fi
          git commit -m 'runtime: persist Roblox foundation tester QA [skip ci]'
          pushed=0
          for attempt in 1 2 3; do
            if git push origin HEAD:"$COMPANY_RUNTIME_BRANCH"; then pushed=1; break; fi
            git fetch --no-tags origin "$COMPANY_RUNTIME_BRANCH"
            git rebase "origin/$COMPANY_RUNTIME_BRANCH" || { git rebase --abort || true; exit 1; }
            sleep $((attempt*2))
          done
          test "$pushed" = '1'
          echo 'ROBLOX_FOUNDATION_RUNTIME_STATE_CHANGE=YES'

      - name: Dispatch F9 review for runtime-accepted candidates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/roblox-f9-ids || exit 0
          while read -r id; do
            [ -n "$id" ] || continue
            gh workflow run company-development-roblox-final-review-revalidation.yml --repo "$GITHUB_REPOSITORY" --ref main -f game_id="$id"
            echo "ROBLOX_F9_DISPATCHED=$id"
          done < /tmp/roblox-f9-ids

  studio-plan:
    name: plan exact Roblox candidates for local Studio auto play
    needs: runtime-foundation-qa
    if: always() && needs.runtime-foundation-qa.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - name: Checkout canonical runtime state
        uses: actions/checkout@v4
        with:
          ref: company-runtime
          fetch-depth: 1
          fetch-tags: false

      - name: Select exact candidates without reusable Studio evidence
        id: plan
        env:
          REQUESTED_GAME_ID: ${{ inputs.game_id || '' }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const q=JSON.parse(fs.readFileSync('development-queue.json','utf8'));
          const requested=String(process.env.REQUESTED_GAME_ID||'').trim();
          const rows=[];
          for(const item of q.items||[]){
            if(requested&&item.gameId!==requested)continue;
            const c=item.robloxRuntimeCandidateEvidence||{};
            const play=item.robloxInternalVibePlayEvidence||{};
            const sourceRevision=String(item.robloxSourceCommit||'').trim();
            const artifactIdentity=String(item.robloxBuildArtifactIdentity||'').trim();
            const artifactRunId=Number(c.artifactRunId||item.robloxBuildArtifactRunId||0);
            const exactCandidate=
              c.published===true
              &&sourceRevision&&artifactIdentity
              &&c.sourceRevision===sourceRevision
              &&c.artifactIdentity===artifactIdentity
              &&/^[1-9][0-9]*$/.test(String(c.universeId||''))
              &&/^[1-9][0-9]*$/.test(String(c.placeId||''))
              &&Number.isInteger(Number(c.versionNumber))
              &&Number(c.versionNumber)>0
              &&artifactRunId>0
              &&item.robloxSharedTargetCurrent!==false;
            if(!exactCandidate)continue;
            const reusable=
              play.pass===true
              &&play.actualPlay===true
              &&play.runtimeVerified===true
              &&play.sourceRevision===sourceRevision
              &&play.artifactIdentity===artifactIdentity
              &&String(play.universeId||'')===String(c.universeId)
              &&String(play.placeId||'')===String(c.placeId)
              &&Number(play.versionNumber||0)===Number(c.versionNumber);
            if(reusable)continue;
            rows.push({
              gameId:item.gameId,
              universeId:String(c.universeId),
              placeId:String(c.placeId),
              versionNumber:Number(c.versionNumber),
              sourceRevision,
              artifactIdentity,
              artifactRunId
            });
          }
          const matrix=JSON.stringify({include:rows});
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'matrix='+matrix+'\ncount='+rows.length+'\n');
          console.log('ROBLOX_STUDIO_AUTO_PLAY_CANDIDATES='+rows.length);
          for(const row of rows)console.log('ROBLOX_STUDIO_AUTO_PLAY_QUEUED='+row.gameId+':v'+row.versionNumber);
          NODE

  studio-auto-play:
    name: Studio auto play ${{ matrix.gameId }}
    needs: studio-plan
    if: needs.studio-plan.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.studio-plan.outputs.matrix) }}
    runs-on: [self-hosted, Windows, X64, roblox-studio-authenticated]
    timeout-minutes: 12
    env:
      GAME_ID: ${{ matrix.gameId }}
      UNIVERSE_ID: ${{ matrix.universeId }}
      PLACE_ID: ${{ matrix.placeId }}
      PLACE_VERSION: ${{ matrix.versionNumber }}
      SOURCE_REVISION: ${{ matrix.sourceRevision }}
      ARTIFACT_IDENTITY: ${{ matrix.artifactIdentity }}
      ARTIFACT_RUN_ID: ${{ matrix.artifactRunId }}
      COMPANY_RUNTIME_BRANCH: company-runtime
    steps:
      - name: Checkout Vibe2 Studio control
        uses: actions/checkout@v4
        with:
          ref: vibe2-unreal-core
          path: control
          fetch-depth: 1
          fetch-tags: false

      - name: Checkout canonical runtime state
        uses: actions/checkout@v4
        with:
          ref: company-runtime
          path: runtime
          fetch-depth: 1
          fetch-tags: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify authenticated local Studio runner
        working-directory: control
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows') { throw 'Roblox Studio auto play requires Windows' }
          node -e "import('./tools/vibe2-roblox-studio-cli-runner.mjs').then(m=>{const p=m.findRobloxStudioBinary({});if(!p)throw new Error('RobloxStudioBeta.exe not found');console.log('ROBLOX_STUDIO_LOCAL_PATH='+p);require('fs').appendFileSync(process.env.GITHUB_ENV,'VIBE2_ROBLOX_STUDIO_PATH='+p+'\n')})"
          if ($LASTEXITCODE -ne 0) { throw 'Roblox Studio discovery failed' }
          Write-Host 'ROBLOX_STUDIO_LOCAL_RUNNER=ONLINE'

      - name: Recheck exact candidate before Studio launch
        working-directory: runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch --no-tags origin $env:COMPANY_RUNTIME_BRANCH
          git reset --hard "origin/$env:COMPANY_RUNTIME_BRANCH"
          node -e "const fs=require('fs');const q=JSON.parse(fs.readFileSync('development-queue.json','utf8'));const i=(q.items||[]).find(x=>x.gameId===process.env.GAME_ID);if(!i)throw new Error('game missing');const c=i.robloxRuntimeCandidateEvidence||{};const ok=c.published===true&&String(i.robloxSourceCommit||'')===process.env.SOURCE_REVISION&&String(i.robloxBuildArtifactIdentity||'')===process.env.ARTIFACT_IDENTITY&&String(c.universeId||'')===process.env.UNIVERSE_ID&&String(c.placeId||'')===process.env.PLACE_ID&&Number(c.versionNumber)===Number(process.env.PLACE_VERSION)&&c.sourceRevision===process.env.SOURCE_REVISION&&c.artifactIdentity===process.env.ARTIFACT_IDENTITY&&i.robloxSharedTargetCurrent!==false;if(!ok)throw new Error('candidate became stale before Studio launch');console.log('ROBLOX_STUDIO_EXACT_CANDIDATE_RECHECK=PASS')"

      - name: Download retained immutable Roblox build artifact
        uses: actions/download-artifact@v4
        with:
          name: development-roblox-package-${{ matrix.gameId }}
          path: ${{ runner.temp }}/jaewoon-studio-artifact-${{ matrix.gameId }}
          run-id: ${{ matrix.artifactRunId }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}

      - name: Verify immutable local Studio artifact SHA256
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP "jaewoon-studio-artifact-$env:GAME_ID"
          $files = @(Get-ChildItem -Path $root -Recurse -File | Where-Object { $_.Extension -in '.rbxl','.rbxlx' })
          if ($files.Count -ne 1) { throw "Expected exactly one Roblox place artifact, found $($files.Count)" }
          $hash = (Get-FileHash -Path $files[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ("sha256:$hash" -ne $env:ARTIFACT_IDENTITY.ToLowerInvariant()) { throw 'immutable Roblox artifact SHA256 mismatch' }
          "ROBLOX_STUDIO_PLACE_FILE=$($files[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'ROBLOX_STUDIO_LOCAL_IMMUTABLE_ARTIFACT=PASS'

      - name: Build actual Studio API play scenario
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $scenario = @{
            version = 1
            engine = 'roblox'
            timeoutMs = 90000
            actions = @(
              @{ id='settle'; type='wait'; ms=1200 },
              @{ id='loaded'; type='expect'; name='game loaded'; expression='game-loaded' },
              @{ id='player'; type='expect'; name='player present'; expression='player-present' },
              @{ id='gui'; type='expect'; name='player gui nonempty'; expression='player-gui-nonempty' },
              @{ id='ui-visible'; type='expect'; name='visible ui exists'; expression='ui-visible-elements' },
              @{ id='ui-text'; type='expect'; name='visible ui text fits'; expression='ui-text-fits' },
              @{ id='post-assertion-settle'; type='wait'; ms=500 }
            )
          }
          $scenarioPath = Join-Path $env:RUNNER_TEMP "jaewoon-studio-$env:GAME_ID-scenario.json"
          $resultPath = Join-Path $env:RUNNER_TEMP "jaewoon-studio-$env:GAME_ID-result.json"
          $scenario | ConvertTo-Json -Depth 8 | Out-File -FilePath $scenarioPath -Encoding utf8
          "ROBLOX_STUDIO_SCENARIO=$scenarioPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ROBLOX_STUDIO_RESULT=$resultPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Execute actual Roblox Studio API play
        working-directory: control
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $nonce = [Guid]::NewGuid().ToString('N')
          node tools/vibe2-roblox-studio-cli-runner.mjs "--studio=$env:VIBE2_ROBLOX_STUDIO_PATH" "--scenario=$env:ROBLOX_STUDIO_SCENARIO" "--output=$env:ROBLOX_STUDIO_RESULT" "--nonce=$nonce" "--place-file=$env:ROBLOX_STUDIO_PLACE_FILE" --local-only=true --timeout=420000
          if ($LASTEXITCODE -ne 0) { throw 'Roblox Studio API play failed' }
          Write-Host 'ROBLOX_STUDIO_ACTUAL_PLAY=PASS'

      - name: Validate assertion-only Studio UI and error evidence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync(process.env.ROBLOX_STUDIO_RESULT,'utf8'));const required=(r.checkpoints||[]).filter(x=>x.required!==false);const actions=r.actions||[];const ok=r.authority==='vibe2-roblox-studio-runtime'&&r.runtimeVerified===true&&r.capabilities?.studioTestService===true&&r.capabilities?.virtualInput===false&&!actions.some(x=>x.dispatched===true)&&required.length>=5&&required.every(x=>x.pass===true)&&(r.errors||[]).length===0&&Number(r.metrics?.consoleErrorCount||0)===0;if(!ok){console.error(JSON.stringify(r,null,2));throw new Error('Studio assertion-only runtime evidence rejected')}console.log('ROBLOX_STUDIO_ASSERTION_ONLY_UI_ERROR_EVIDENCE=PASS')"

      - name: Persist sanitized exact Studio play evidence
        working-directory: runtime
        env:
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          node -e "const fs=require('fs');const q=JSON.parse(fs.readFileSync('development-queue.json','utf8'));const raw=JSON.parse(fs.readFileSync(process.env.ROBLOX_STUDIO_RESULT,'utf8'));const i=(q.items||[]).find(x=>x.gameId===process.env.GAME_ID);if(!i)throw new Error('game missing');const c=i.robloxRuntimeCandidateEvidence||{};const exact=String(i.robloxSourceCommit||'')===process.env.SOURCE_REVISION&&String(i.robloxBuildArtifactIdentity||'')===process.env.ARTIFACT_IDENTITY&&String(c.universeId||'')===process.env.UNIVERSE_ID&&String(c.placeId||'')===process.env.PLACE_ID&&Number(c.versionNumber)===Number(process.env.PLACE_VERSION);if(!exact)throw new Error('candidate changed before Studio evidence persist');const stamp=new Date().toISOString();const checkpoints=(raw.checkpoints||[]).map(x=>({id:String(x.id||''),name:String(x.name||x.id||''),required:x.required!==false,pass:x.pass===true}));const actions=(raw.actions||[]).map(x=>({id:String(x.id||''),type:String(x.type||''),dispatched:x.dispatched===true,ok:x.ok===true}));i.robloxInternalVibePlayEvidence={version:3,gameId:i.gameId,authority:'vibe2-roblox-studio-runtime',pass:true,actualPlay:true,runtimeVerified:true,learningReusable:true,executionSurface:'LOCAL_IMMUTABLE_ARTIFACT',immutableArtifactVerified:true,publishedCandidateObserved:false,automatedUserInput:false,rawSourceIncluded:false,rawGameplayValuesIncluded:false,sourceRevision:process.env.SOURCE_REVISION,artifactIdentity:process.env.ARTIFACT_IDENTITY,universeId:process.env.UNIVERSE_ID,placeId:process.env.PLACE_ID,versionNumber:Number(process.env.PLACE_VERSION),artifactRunId:Number(process.env.ARTIFACT_RUN_ID||0),capabilities:{studioTestService:true,virtualInput:false,assertionOnly:true},actions,checkpoints,errors:[],metrics:{consoleErrorCount:0},learningSignals:['roblox studio','actual play','assertion only','ui','runtime'],scenarioCoverage:['NEW_GAME_START'],scenarioCoveragePass:false,workflowRunId:Number(process.env.GITHUB_RUN_ID_VALUE||0),workflowRunAttempt:Number(process.env.GITHUB_RUN_ATTEMPT_VALUE||0),testedAt:stamp};i.robloxInternalPlaytestPassed=true;i.robloxInternalPlaytestPassedAt=stamp;i.updatedAt=stamp;q.updatedAt=stamp;fs.writeFileSync('development-queue.json',JSON.stringify(q,null,2)+'\n');console.log('ROBLOX_STUDIO_PLAY_EVIDENCE_PERSIST_READY='+i.gameId)"
          git config user.name 'jaewoon-roblox-studio-play'
          git config user.email 'actions@users.noreply.github.com'
          git add development-queue.json
          git diff --cached --check
          if (git diff --cached --quiet) {
            Write-Host 'ROBLOX_STUDIO_PLAY_STATE_CHANGE=NO'
            exit 0
          }
          git commit -m "runtime: persist exact Roblox Studio play $env:GAME_ID [skip ci]"
          $pushed = $false
          for ($attempt=1; $attempt -le 3; $attempt++) {
            git push origin "HEAD:$env:COMPANY_RUNTIME_BRANCH"
            if ($LASTEXITCODE -eq 0) { $pushed = $true; break }
            git fetch --no-tags origin $env:COMPANY_RUNTIME_BRANCH
            git rebase "origin/$env:COMPANY_RUNTIME_BRANCH"
            if ($LASTEXITCODE -ne 0) { git rebase --abort 2>$null; throw 'runtime evidence rebase failed' }
            Start-Sleep -Seconds ($attempt * 2)
          }
          if (-not $pushed) { throw 'runtime evidence push failed' }
          Write-Host 'ROBLOX_STUDIO_PLAY_STATE_CHANGE=YES'

      - name: Upload Studio evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roblox-studio-auto-play-${{ matrix.gameId }}-${{ github.run_id }}
          path: ${{ runner.temp }}/jaewoon-studio-${{ matrix.gameId }}-result.json
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup owned Studio automation sessions
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $owned = @(Get-CimInstance Win32_Process -Filter "Name='RobloxStudioBeta.exe'" -ErrorAction SilentlyContinue | Where-Object {
            $line = [string]$_.CommandLine
            ($line -match '(?i)--task\s+RunScript') -and ($line -match '(?i)--quitAfterExecution')
          })
          foreach ($process in $owned) { Stop-Process -Id ([int]$process.ProcessId) -Force -ErrorAction SilentlyContinue }
          Write-Host "ROBLOX_STUDIO_OWNED_SESSION_REAPED=$($owned.Count)"

  studio-learning-wake:
    name: wake existing Vibe learning loop after Studio evidence
    needs: [studio-plan, studio-auto-play]
    if: always() && needs.studio-plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch existing 24H learning and development cycle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run vibe2-24h-runner.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'ROBLOX_STUDIO_LEARNING_WAKE=DISPATCHED'

