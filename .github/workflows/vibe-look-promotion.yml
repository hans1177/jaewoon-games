name: Vibe Look Promotion
# 조명 탐색이 배운 조합 중 아주 엄격한 관문(tools/vibe-look-promote.mjs)을 통과한 것만 룩 프리셋 후보로 올리는 PR 을 만든다.
# PR 을 열고, 안전 확인(바뀐 파일이 룩 프리셋 표·Luau 생성 구간뿐인지)과 이 잡의 자체 검증을 통과하면 스스로 병합한다(사람 없이 승급).
# 병합이 브랜치 보호 규칙 등으로 거부되면 PR 을 열어 둔다(한 번에 하나만 열려 있다). 저장소 변수 VIBE_LOOK_AUTOMERGE=off 로 자동 병합만 끌 수 있다.
# 참고: GITHUB_TOKEN 으로 만든 PR 은 다른 워크플로를 자동으로 돌리지 않는다. 그래서 이 잡이 스스로 룩 키트 검증과 승급 테스트를 먼저 돌린다.
on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: vibe-look-promotion
  cancel-in-progress: false
jobs:
  promote:
    if: ${{ vars.VIBE_GYM_CLOUD != 'off' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Skip when a promotion PR is already open
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/pulls?state=open&per_page=100" --jq '[.[]|select(.head.ref|startswith("vibe-look-promotion/"))]|length')
          echo "count=$n" >> "$GITHUB_OUTPUT"
      - name: Install Blender and imaging libs
        if: steps.open.outputs.count == '0'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends blender python3-numpy libegl1 libgl1 libgl1-mesa-dri
          python3 -m pip install --quiet pillow numpy
      - name: Pull learned lights
        if: steps.open.outputs.count == '0'
        run: node tools/vibe-gym-publish.mjs pull --stats build/learned-lights.json --file learned-lights.json
      - name: Apply promotion through the strict gate
        if: steps.open.outputs.count == '0'
        id: promo
        env:
          VIBE2_BLENDER_BINARY: blender
        run: |
          out=$(node tools/vibe-look-promote.mjs --learned build/learned-lights.json --apply | tee -a "$GITHUB_STEP_SUMMARY")
          echo "$out"
          id=$(echo "$out" | sed -n 's/.*promoted id=\([a-z0-9-]*\).*/\1/p')
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Verify the kit and tests
        if: steps.promo.outputs.id != ''
        run: |
          node tools/vibe-look-kit.mjs --check
          node --test qa/vibe-look-kit.test.mjs qa/vibe-look-promote.test.mjs
      - name: Open the promotion PR
        id: openpr
        if: steps.promo.outputs.id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id="${{ steps.promo.outputs.id }}"
          git config user.name "vibe-look-promotion"
          git config user.email "vibe-look-promotion@users.noreply.github.com"
          git checkout -b "vibe-look-promotion/$id"
          git add assets/roblox/common-look-v1 roblox-games
          git commit -m "룩 프리셋 자동 승급 후보: $id"
          git push origin "vibe-look-promotion/$id"
          body=$'엄격한 관문(점수 72 이상, 3회 이상 연습, 기존과 충분히 다름, 처음 보는 CC0 모델 3개에서 재확인 평균 68·최저 60 이상, 룩 키트 검증)을 모두 통과한 조명 조합입니다.\n\n대기·색보정·블룸은 가장 가까운 기존 프리셋에서 물려받았고, 배운 것은 조명뿐입니다. 게임이 쓰려면 프리셋 id를 직접 고르는 승인이 필요합니다.'
          pr=$(gh api -X POST "repos/${{ github.repository }}/pulls" -f base=main -f head="vibe-look-promotion/$id" -f title="룩 프리셋 자동 승급 후보: $id" -f body="$body" --jq .number)
          echo "PR #$pr" >> "$GITHUB_STEP_SUMMARY"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
      - name: Auto-merge after safety check
        if: steps.promo.outputs.id != '' && vars.VIBE_LOOK_AUTOMERGE != 'off'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh api "repos/${{ github.repository }}/pulls?state=open&head=${{ github.repository_owner }}:vibe-look-promotion/${{ steps.promo.outputs.id }}" --jq '.[0].number')
          # 안전 확인: 바뀐 파일은 룩 프리셋 표, 키트 원본, 룩 정책 게임의 키트 사본뿐이어야 하고, 표와 키트 원본은 반드시 포함돼야 한다
          files=$(gh api "repos/${{ github.repository }}/pulls/$pr/files" --paginate --jq '.[].filename')
          bad=$(echo "$files" | grep -v -E '^(assets/roblox/common-look-v1/(look-presets\.json|RobloxCommonLookKit\.luau)|roblox-games/[a-z0-9-]+/.+/Common/RobloxCommonLookKit\.luau)$' || true)
          need=$(echo "$files" | grep -c -E '^assets/roblox/common-look-v1/(look-presets\.json|RobloxCommonLookKit\.luau)$' || true)
          if [ -n "$bad" ] || [ "$need" != "2" ]; then echo "안전 확인 실패: $files"; echo "자동 병합 중단: 예상 밖 파일 $bad" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          if gh api -X PUT "repos/${{ github.repository }}/pulls/$pr/merge" -f merge_method=squash -f commit_title="룩 프리셋 자동 승급: ${{ steps.promo.outputs.id }} (#$pr)" >/dev/null; then
            echo "자동 병합 완료 #$pr" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "병합이 거부됨(브랜치 보호 등). PR #$pr 은 열어 둔다." >> "$GITHUB_STEP_SUMMARY"
          fi
