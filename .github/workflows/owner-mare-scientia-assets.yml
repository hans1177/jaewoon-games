# 파일명: .github/workflows/owner-mare-scientia-assets.yml
# Mare Scientia: 신규 CC0 모델을 기존 Open Cloud 등록 통로로 등록한다.
# main 자산 변경 또는 수동 실행 시 동작하며 게임 게시 기본값은 꺼져 있다.
name: Owner Mare Scientia Register Assets
run-name: Owner Mare Scientia assets · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/owner-mare-scientia-assets.yml'
      - 'roblox-games/mare-scientia/assets/**'
      - 'tools/mare-scientia-upload-assets.mjs'
  workflow_dispatch:
    inputs:
      universe_id:
        description: 'Universe ID (사용 권한을 줄 체험)'
        type: string
        required: false
        default: '10774821253'
      publish_after_register:
        description: '자산 등록 확인 후 게시까지 할지 (기본: 게시 안 함)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: owner-mare-scientia-assets
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Upload CC0 models to Roblox and write AssetIds
        env:
          MARE_UNIVERSE_ID: ${{ inputs.universe_id }}
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_ROBLOSECURITY: ${{ secrets.ROBLOX_ROBLOSECURITY }}
          ROBLOX_SECURITY_COOKIE: ${{ secrets.ROBLOX_SECURITY_COOKIE }}
          ROBLOX_CREATOR_USER_ID: ${{ vars.ROBLOX_CREATOR_USER_ID }}
        run: node tools/mare-scientia-upload-assets.mjs

      - name: Commit registered asset IDs (API, main이 움직여도 안전)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for f in roblox-games/mare-scientia/assets-registered.json roblox-games/mare-scientia/src/ReplicatedStorage/Shared/AssetIds.luau; do
            if git diff --quiet -- "$f"; then echo "SKIP_UNCHANGED $f"; continue; fi
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${f}?ref=main" --jq .sha 2>/dev/null || true)"
            args=(-X PUT "repos/${GITHUB_REPOSITORY}/contents/${f}" -f message='Mare Scientia: Roblox 등록 자산 ID 갱신' -f content="$(base64 -w0 "$f")" -f branch=main)
            if [ -n "$sha" ]; then args+=(-f sha="$sha"); fi
            gh api "${args[@]}" --silent
            echo "COMMITTED $f"
          done

      - name: Publish the place with the new asset IDs
        if: ${{ inputs.publish_after_register == true && success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run owner-mare-scientia-direct-publish.yml --ref main -f universe_id="${{ inputs.universe_id }}"
