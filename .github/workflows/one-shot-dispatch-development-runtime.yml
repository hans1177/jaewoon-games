name: One Shot Dispatch Development Runtime

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-dispatch-development-runtime.yml

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove one-shot trigger and dispatch canonical runtime
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm '.github/workflows/one-shot-dispatch-development-runtime.yml'
          git config user.name 'jaewoon-company-ai'
          git config user.email 'actions@users.noreply.github.com'
          git add -- .github/workflows/one-shot-dispatch-development-runtime.yml
          git commit -m 'chore: remove one-shot DEVELOPMENT runtime dispatcher'
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run company-development-confirmed-runtime.yml --repo "$GITHUB_REPOSITORY" --ref main
