name: Unity Android Runtime Smoke

on:
  workflow_run:
    workflows: ["Unity Hybrid Android Build"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful Unity Hybrid Android Build run id'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: unity-android-runtime-smoke
  cancel-in-progress: false

jobs:
  runtime-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout QA tools
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve upstream build run
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ github.event_name }}' == 'workflow_run' ]]; then
            run_id='${{ github.event.workflow_run.id }}'
          else
            run_id='${{ inputs.run_id }}'
          fi
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo '[JAEWOON_BUILD_ERROR:INVALID_UPSTREAM_RUN_ID] invalid upstream run id' >&2; exit 2; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download APK build artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.upstream.outputs.run_id }}
          path: upstream-artifacts

      - name: Bind APK to exact build metadata
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find upstream-artifacts -type f -name '*.apk' -size +0c | head -n 1 || true)"
          info="$(find upstream-artifacts -type f -name 'build-info.json' -size +0c | head -n 1 || true)"
          [[ -n "$apk" && -s "$apk" ]] || { echo '[JAEWOON_BUILD_ERROR:RUNTIME_SMOKE_APK_MISSING] No APK artifact found in upstream build.' >&2; find upstream-artifacts -maxdepth 4 -type f -print || true; exit 3; }
          [[ -n "$info" && -s "$info" ]] || { echo '[JAEWOON_BUILD_ERROR:RUNTIME_SMOKE_BUILD_INFO_MISSING] build-info.json missing.' >&2; exit 4; }
          expected="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8-sig"))["sha256"])' "$info")"
          source_commit="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8-sig"))["sourceCommit"])' "$info")"
          source_tree="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8-sig")).get("sourceTreeSha", ""))' "$info")"
          actual="$(sha256sum "$apk" | awk '{print $1}')"
          [[ "$expected" =~ ^[0-9a-f]{64}$ && "$actual" == "$expected" ]] || { echo "[JAEWOON_BUILD_ERROR:RUNTIME_SMOKE_APK_SHA_MISMATCH] expected=$expected actual=$actual" >&2; exit 5; }
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]] || { echo '[JAEWOON_BUILD_ERROR:RUNTIME_SMOKE_SOURCE_COMMIT_INVALID] invalid exact source commit' >&2; exit 6; }
          [[ -z "$source_tree" || "$source_tree" =~ ^[0-9a-f]{40}$ ]] || { echo '[JAEWOON_BUILD_ERROR:RUNTIME_SMOKE_SOURCE_TREE_INVALID] invalid source tree sha' >&2; exit 7; }
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "sha256=$actual" >> "$GITHUB_OUTPUT"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "source_tree=$source_tree" >> "$GITHUB_OUTPUT"
          echo "UNITY_RUNTIME_APK=$apk"
          echo "UNITY_RUNTIME_BUILD_ID=$actual"
          echo "UNITY_RUNTIME_SOURCE_COMMIT=$source_commit"

      - name: Prepare Android 16 emulator
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [[ -n "$SDK" ]] || { echo '[JAEWOON_BUILD_ERROR:ANDROID_SDK_MISSING] Android SDK path missing.' >&2; exit 8; }
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'emulator' 'build-tools;36.0.0' 'system-images;android-36;google_apis;x86_64'
          echo no | avdmanager create avd --force --name jaewoon-qa --package 'system-images;android-36;google_apis;x86_64' --device 'pixel_6'
          if [[ -e /dev/kvm ]]; then sudo chmod 666 /dev/kvm || true; fi
          nohup "$SDK/emulator/emulator" -avd jaewoon-qa -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > /tmp/jaewoon-emulator.log 2>&1 &
          echo $! > /tmp/jaewoon-emulator.pid

      - name: Run Android 16 black-box APK play smoke
        shell: bash
        run: bash tools/unity-apk-runtime-smoke.sh '${{ steps.apk.outputs.path }}' qa-artifacts/unity-runtime-smoke

      - name: Bind runtime evidence to exact APK and source
        env:
          UPSTREAM_RUN: ${{ steps.upstream.outputs.run_id }}
          BUILD_ID: ${{ steps.apk.outputs.sha256 }}
          SOURCE_COMMIT: ${{ steps.apk.outputs.source_commit }}
          SOURCE_TREE: ${{ steps.apk.outputs.source_tree }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path('qa-artifacts/unity-runtime-smoke/evidence.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          if data.get('qaPassEligibleRuntimeEvidence') is not True:
              raise SystemExit('runtime evidence is not QA-pass eligible')
          data.update({
              'state': 'PASS',
              'runtime': 'PASS',
              'bound': True,
              'upstreamBuildRunId': int(os.environ['UPSTREAM_RUN']),
              'buildId': os.environ['BUILD_ID'],
              'apkSha256': os.environ['BUILD_ID'],
              'buildSourceCommit': os.environ['SOURCE_COMMIT'],
              'sourceTreeSha': os.environ.get('SOURCE_TREE') or None,
          })
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          echo "UNITY_RUNTIME_EVIDENCE=PASS"
          echo "UNITY_RUNTIME_BUILD_ID=$BUILD_ID"
          echo "UNITY_RUNTIME_SOURCE_COMMIT=$SOURCE_COMMIT"

      - name: Upload Unity runtime QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-runtime-smoke-${{ steps.upstream.outputs.run_id }}
          path: |
            qa-artifacts/unity-runtime-smoke/
            /tmp/jaewoon-emulator.log
          if-no-files-found: warn
          retention-days: 14
