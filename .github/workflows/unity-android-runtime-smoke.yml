name: Unity Android Runtime Smoke
run-name: Unity Android Runtime Smoke ${{ inputs.run_id || github.event.workflow_run.id }}

on:
  workflow_run:
    workflows: ["Unity Hybrid Android Build"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful Unity Hybrid Android Build run id'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: unity-android-runtime-smoke-${{ inputs.run_id || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  runtime-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Checkout QA tools
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve upstream build run
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ github.event_name }}' == 'workflow_run' ]]; then
            run_id='${{ github.event.workflow_run.id }}'
          else
            run_id='${{ inputs.run_id }}'
          fi
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo '[JAEWOON_BUILD_ERROR:INVALID_UPSTREAM_RUN_ID] invalid upstream run id' >&2; exit 2; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download APK build artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.upstream.outputs.run_id }}
          path: upstream-artifacts

      - name: Bind APK to exact build metadata
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find upstream-artifacts -type f -name '*.apk' -size +0c | head -n 1 || true)"
          info="$(find upstream-artifacts -type f -name 'build-info.json' -size +0c | head -n 1 || true)"
          [[ -n "$apk" && -s "$apk" ]] || { echo '[JAEWOON_BUILD_ERROR:RUNTIME_SMOKE_APK_MISSING] No APK artifact found in upstream build.' >&2; find upstream-artifacts -maxdepth 4 -type f -print || true; exit 3; }
          [[ -n "$info" && -s "$info" ]] || { echo '[JAEWOON_BUILD_ERROR:RUNTIME_SMOKE_BUILD_INFO_MISSING] build-info.json missing.' >&2; exit 4; }
          expected="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8-sig"))["sha256"])' "$info")"
          source_commit="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8-sig"))["sourceCommit"])' "$info")"
          source_tree="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8-sig")).get("sourceTreeSha", ""))' "$info")"
          actual="$(sha256sum "$apk" | awk '{print $1}')"
          [[ "$expected" =~ ^[0-9a-f]{64}$ && "$actual" == "$expected" ]] || { echo "[JAEWOON_BUILD_ERROR:RUNTIME_SMOKE_APK_SHA_MISMATCH] expected=$expected actual=$actual" >&2; exit 5; }
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]] || { echo '[JAEWOON_BUILD_ERROR:RUNTIME_SMOKE_SOURCE_COMMIT_INVALID] invalid exact source commit' >&2; exit 6; }
          [[ -z "$source_tree" || "$source_tree" =~ ^[0-9a-f]{40}$ ]] || { echo '[JAEWOON_BUILD_ERROR:RUNTIME_SMOKE_SOURCE_TREE_INVALID] invalid source tree sha' >&2; exit 7; }
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "sha256=$actual" >> "$GITHUB_OUTPUT"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "source_tree=$source_tree" >> "$GITHUB_OUTPUT"
          echo "UNITY_RUNTIME_APK=$apk"
          echo "UNITY_RUNTIME_BUILD_ID=$actual"
          echo "UNITY_RUNTIME_SOURCE_COMMIT=$source_commit"

      - name: Prepare native ARM64 Android 16 runtime
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "aarch64" || "$(uname -m)" == "arm64" ]] || { echo '[JAEWOON_BUILD_ERROR:ARM64_RUNNER_REQUIRED] Unity ARM64 runtime validation requires an ARM64 host.' >&2; exit 8; }
          [[ "$(getconf PAGESIZE)" == "4096" ]] || { echo '[JAEWOON_BUILD_ERROR:ARM64_RUNNER_PAGE_SIZE] Redroid runtime requires the verified 4K-page ARM64 runner.' >&2; exit 8; }

          sudo apt-get update -y
          sudo apt-get install -y adb aapt
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
          command -v docker >/dev/null 2>&1 || { echo '[JAEWOON_BUILD_ERROR:DOCKER_MISSING] Docker is unavailable on ARM64 runner.' >&2; exit 9; }
          sudo systemctl start docker || sudo service docker start || true
          docker version >/tmp/jaewoon-redroid-docker.txt 2>&1 || { cat /tmp/jaewoon-redroid-docker.txt >&2; exit 9; }

          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" || { echo '[JAEWOON_BUILD_ERROR:BINDER_MODULE_UNAVAILABLE] binder_linux could not be loaded.' >&2; exit 10; }
          sudo mkdir -p /dev/binderfs
          if ! mountpoint -q /dev/binderfs; then sudo mount -t binder binder /dev/binderfs; fi
          binder_devices=()
          for device in binder hwbinder vndbinder; do
            host_device="/dev/binderfs/$device"
            [[ -c "$host_device" ]] || { echo "[JAEWOON_BUILD_ERROR:BINDER_DEVICE_MISSING] $device missing" >&2; exit 10; }
            binder_devices+=(--device "$host_device:/dev/$device")
          done

          image='redroid/redroid:16.0.0_64only-latest'
          docker pull "$image"
          docker rm -f jaewoon-unity-redroid >/dev/null 2>&1 || true
          data="$RUNNER_TEMP/jaewoon-unity-redroid-data"
          mkdir -p "$data"
          docker run -d --privileged --name jaewoon-unity-redroid \
            -p 127.0.0.1:5555:5555 \
            "${binder_devices[@]}" \
            -v "$data:/data" \
            "$image" \
            androidboot.use_memfd=true \
            androidboot.redroid_width=1080 \
            androidboot.redroid_height=2400 \
            androidboot.redroid_dpi=420 \
            androidboot.redroid_gpu_mode=guest > /tmp/jaewoon-redroid-container.txt

          deadline=$((SECONDS+240))
          until [[ "$(timeout --kill-after=5s 20s docker exec jaewoon-unity-redroid getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" == "1" ]]; do
            if (( SECONDS >= deadline )); then
              docker logs jaewoon-unity-redroid > /tmp/jaewoon-redroid.log 2>&1 || true
              docker inspect jaewoon-unity-redroid > /tmp/jaewoon-redroid-inspect.json 2>&1 || true
              docker ps -a --filter name=jaewoon-unity-redroid >&2 || true
              tail -n 200 /tmp/jaewoon-redroid.log >&2 || true
              echo '[JAEWOON_BUILD_ERROR:REDROID_BOOT_TIMEOUT] ARM64 Android 16 runtime did not boot.' >&2
              exit 11
            fi
            sleep 5
          done
          docker logs jaewoon-unity-redroid > /tmp/jaewoon-redroid.log 2>&1 || true
          docker inspect jaewoon-unity-redroid > /tmp/jaewoon-redroid-inspect.json 2>&1 || true

          adb start-server >/dev/null
          connected=false
          for _ in $(seq 1 30); do
            adb connect 127.0.0.1:5555 >/tmp/jaewoon-redroid-adb-connect.txt 2>&1 || true
            if adb devices | awk '$1=="127.0.0.1:5555" && $2=="device" {ok=1} END{exit ok?0:1}'; then connected=true; break; fi
            sleep 2
          done
          [[ "$connected" == "true" ]] || { adb devices -l >&2 || true; cat /tmp/jaewoon-redroid-adb-connect.txt >&2 || true; exit 12; }

          api="$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
          abis="$(adb shell getprop ro.product.cpu.abilist | tr -d '\r')"
          release="$(adb shell getprop ro.build.version.release | tr -d '\r')"
          [[ "$api" == "36" ]] || { echo "[JAEWOON_BUILD_ERROR:ANDROID_API_MISMATCH] expected=36 actual=$api" >&2; exit 13; }
          grep -q 'arm64-v8a' <<<"$abis" || { echo "[JAEWOON_BUILD_ERROR:ANDROID_ARM64_RUNTIME_MISSING] abilist=$abis" >&2; exit 14; }
          printf 'HOST_ARCH=%s\nANDROID_RELEASE=%s\nANDROID_API=%s\nANDROID_ABIS=%s\nIMAGE=%s\n' "$(uname -m)" "$release" "$api" "$abis" "$image" | tee /tmp/jaewoon-redroid-device.txt
          echo 'UNITY_ANDROID_RUNTIME=ARM64_REDROID_ANDROID_16_READY'

      - name: Run Android 16 black-box APK play smoke
        shell: bash
        run: bash tools/unity-apk-runtime-smoke.sh '${{ steps.apk.outputs.path }}' qa-artifacts/unity-runtime-smoke

      - name: Bind runtime evidence to exact APK and source
        env:
          UPSTREAM_RUN: ${{ steps.upstream.outputs.run_id }}
          BUILD_ID: ${{ steps.apk.outputs.sha256 }}
          SOURCE_COMMIT: ${{ steps.apk.outputs.source_commit }}
          SOURCE_TREE: ${{ steps.apk.outputs.source_tree }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path('qa-artifacts/unity-runtime-smoke/evidence.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          if data.get('qaPassEligibleRuntimeEvidence') is not True:
              raise SystemExit('runtime evidence is not QA-pass eligible')
          if data.get('runtimeAbiCompatible') is not True or 'arm64-v8a' not in str(data.get('deviceAbis','')):
              raise SystemExit('runtime evidence is not ARM64-compatible')
          data.update({
              'state': 'PASS',
              'runtime': 'PASS',
              'bound': True,
              'runtimeProvider': 'REDROID_NATIVE_ARM64_ANDROID_16',
              'upstreamBuildRunId': int(os.environ['UPSTREAM_RUN']),
              'buildId': os.environ['BUILD_ID'],
              'apkSha256': os.environ['BUILD_ID'],
              'buildSourceCommit': os.environ['SOURCE_COMMIT'],
              'sourceTreeSha': os.environ.get('SOURCE_TREE') or None,
          })
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          echo "UNITY_RUNTIME_EVIDENCE=PASS"
          echo "UNITY_RUNTIME_BUILD_ID=$BUILD_ID"
          echo "UNITY_RUNTIME_SOURCE_COMMIT=$SOURCE_COMMIT"

      - name: Upload Unity runtime QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-runtime-smoke-${{ steps.upstream.outputs.run_id }}
          path: |
            qa-artifacts/unity-runtime-smoke/
            /tmp/jaewoon-redroid.log
            /tmp/jaewoon-redroid-device.txt
            /tmp/jaewoon-redroid-docker.txt
            /tmp/jaewoon-redroid-adb-connect.txt
            /tmp/jaewoon-redroid-inspect.json
          if-no-files-found: warn
          retention-days: 14