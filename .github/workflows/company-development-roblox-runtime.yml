              const runtimePassed=secondaryOwnerFocus?item.ownerFocusRobloxRuntimePassed:item.robloxRuntimePassed;
              const runtimeHarness=secondaryOwnerFocus?item.ownerFocusRobloxRuntimeHarnessVersion:item.robloxRuntimeHarnessVersion;
              const runtimeEvidence=secondaryOwnerFocus?item.ownerFocusRobloxRuntimeEvidence:item.robloxRuntimeEvidence;
              const securityHoldFlag=secondaryOwnerFocus?item.ownerFocusRobloxRuntimeSecurityHold:item.robloxRuntimeSecurityHold;
              const f0Passed=secondaryOwnerFocus?false:item.robloxFoundationF0Passed===true;
              const f0RepairRequired=!secondaryOwnerFocus
                &&String(item.canonicalState||'').toUpperCase()==='F0_SOURCE_PREFLIGHT_REPAIR_REQUIRED'
                &&String(item.robloxFailureStage||'').toUpperCase()==='F0_SOURCE_INTEGRITY'
                &&String(item.robloxFailureSignature||'').toUpperCase()==='ROBLOX_F0_SOURCE_PREFLIGHT_FAILED';
              if(preflightPassed!==true){
                preflightReady++;
                readyIds.add(item.gameId);
              }else if(!secondaryOwnerFocus&&f0Passed!==true&&!f0RepairRequired){
                f0Ready++;
                readyIds.add(item.gameId);
              }else if(runtimePassed!==true||String(runtimeHarness||'')!==harnessVersion){
                const securityBlocked=securityHoldFlag===true||['roblox-studio-authentication-required','roblox-studio-local-profile-unavailable'].includes(runtimeEvidence?.failure);
                if(securityBlocked)externalBlocked++;
              }
              continue;
            }
            if(secondaryOwnerFocus){
              if(['SOURCE_READY','BUILD_REPAIR_REQUIRED'].includes(String(item.ownerFocusRobloxAssetPipelineState||'').toUpperCase()))packagePending++;
              continue;
            }
            if(String(item.currentStep||'').toUpperCase()!=='TARGET_PLATFORM_TECHNICAL_VALIDATION')continue;
            if(String(item.canonicalState||'').toUpperCase()!=='TARGET_PLATFORM_REPAIR_REQUIRED')continue;
            packagePending++;
          }
          fs.writeFileSync('/tmp/roblox-continuation-ready-ids',[...readyIds].filter(Boolean).sort().join('\n')+([...readyIds].length?'\n':''));
          process.stdout.write(`${packagePending} ${preflightReady} ${f0Ready} ${externalBlocked}`);
          NODE
          )"
          read -r package_pending preflight_ready f0_ready external_blocked <<<"$state"
          echo "ROBLOX_PACKAGE_PENDING_BEFORE_CONTINUATION=$package_pending"
          echo "ROBLOX_PREFLIGHT_READY_COUNT=$preflight_ready"
          echo "ROBLOX_F0_READY_COUNT=$f0_ready"
          echo "ROBLOX_EXTERNAL_BLOCKED_COUNT=$external_blocked"
          echo "ROBLOX_RUNTIME_HARNESS_VERSION=$ROBLOX_RUNTIME_HARNESS_VERSION"
          echo 'ROBLOX_RUNTIME_RETRY_LIMIT=UNLIMITED_CAUSAL_REPAIR'
          echo 'ROBLOX_RUNTIME_SECURITY_CHALLENGE_RETRY=0'
          echo 'ROBLOX_RUNTIME_SECURITY_HOLD=ENABLED'
          echo 'ROBLOX_HEADLESS_FAST_MVP_AUTODISPATCH=ENABLED'
          echo 'ROBLOX_STUDIO_RUNTIME_REQUIRED=NO'
          echo 'ROBLOX_STUDIO_RUNTIME_PARALLEL_MAX=DISABLED_HEADLESS_PATH'
          echo 'ROBLOX_GLOBAL_PACKAGE_BARRIER=DISABLED'

          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/company-development-roblox-runtime-continuation.yml/runs?per_page=100" > /tmp/roblox-continuation-active-runs.json
          node <<'NODE' > /tmp/roblox-continuation-active-ids
          const fs=require('fs');
          const payload=JSON.parse(fs.readFileSync('/tmp/roblox-continuation-active-runs.json','utf8'));
          const states=new Set(['queued','pending','in_progress','requested']);
          const prefix='Roblox shared preflight · ';
          const ids=new Set();
          for(const run of payload.workflow_runs||[]){
            if(!states.has(String(run.status||'').toLowerCase()))continue;
            const title=String(run.display_title||'');
            if(!title.startsWith(prefix))continue;
            const id=title.slice(prefix.length).trim();
            if(/^[a-z0-9][a-z0-9-]{1,48}$/.test(id))ids.add(id);
          }
          for(const id of [...ids].sort())console.log(id);
          NODE

          active_continuations="$(grep -c . /tmp/roblox-continuation-active-ids || true)"
          echo "ROBLOX_ACTIVE_CONTINUATIONS=$active_continuations"
          echo "ROBLOX_ACTIVE_CONTINUATION_IDS=$(paste -sd, /tmp/roblox-continuation-active-ids 2>/dev/null || true)"

          dispatch_count=0
          deduped_count=0
          while read -r id; do
            [ -n "$id" ] || continue
            if grep -Fxq "$id" /tmp/roblox-continuation-active-ids; then
              deduped_count=$((deduped_count+1))
              echo "ROBLOX_POST_PACKAGE_CONTINUATION_DISPATCH=DEDUPED_ACTIVE:$id"
              continue
            fi
            gh workflow run company-development-roblox-runtime-continuation.yml --repo "$GITHUB_REPOSITORY" --ref main -f game_id="$id"
            printf '%s\n' "$id" >> /tmp/roblox-continuation-active-ids
            dispatch_count=$((dispatch_count+1))
            echo "ROBLOX_POST_PACKAGE_CONTINUATION_DISPATCH=YES:$id"
          done < /tmp/roblox-continuation-ready-ids

          if [ "$dispatch_count" -eq 0 ] && [ "$deduped_count" -eq 0 ]; then
            echo 'ROBLOX_POST_PACKAGE_CONTINUATION_DISPATCH=NO'
          fi
          echo "ROBLOX_POST_PACKAGE_CONTINUATION_DISPATCH_COUNT=$dispatch_count"
          echo "ROBLOX_POST_PACKAGE_CONTINUATION_DEDUPED_COUNT=$deduped_count"
