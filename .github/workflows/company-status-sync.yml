name: Company Status Sync

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Director Staff Supervisor
      - Autonomous Continuous Development
      - Free Artbook Department Bots
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'tools/company-status-sync.mjs'
      - 'tools/autonomous-24h-work-planner.mjs'
      - '.github/workflows/company-status-sync.yml'
      - 'director-supervision-status.json'
      - 'autonomous-portfolio.json'
      - 'game-artbooks.json'
      - 'game-catalog.json'

permissions:
  contents: write

concurrency:
  group: company-status-sync-main
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync main
        run: git pull --ff-only origin main

      - name: Sync company status and fixed-count dynamic production tiers
        run: |
          node --check tools/company-status-sync.mjs
          node --check tools/autonomous-24h-work-planner.mjs
          node tools/company-status-sync.mjs

      - name: Validate synchronized state
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const company=JSON.parse(fs.readFileSync('company-status.json','utf8'));
          const supervision=JSON.parse(fs.readFileSync('director-supervision-status.json','utf8'));
          const portfolio=JSON.parse(fs.readFileSync('autonomous-portfolio.json','utf8'));
          const catalog=JSON.parse(fs.readFileSync('game-catalog.json','utf8'));
          if(company.supervision?.dateKst!==supervision.dateKst)throw new Error('supervision date not synchronized');
          if(JSON.stringify(company.supervision?.counts||{})!==JSON.stringify(supervision.counts||{}))throw new Error('supervision counts not synchronized');
          if(JSON.stringify(company.supervision?.primaryFindings||[])!==JSON.stringify(supervision.primaryFindings||[]))throw new Error('supervision findings not synchronized');
          const map={WORKING:'working',DONE:'done',IDLE_NO_TASK:'idle',BLOCKED:'blocked',FAILED:'failed',STALE:'stale'};
          const expected=map[supervision.staff?.homepage?.status]||String(supervision.staff?.homepage?.status||'').toLowerCase();
          if(company.operations?.homepage?.status!==expected)throw new Error('homepage operation status not synchronized');

          const tierPolicy=portfolio.productionTierPolicy||{};
          if(tierPolicy.releaseConfirmedCount!==2||tierPolicy.developmentConfirmedCount!==3)throw new Error('fixed production tier counts changed');
          if(tierPolicy.fixedGameIds!==false||tierPolicy.autoPromotionDemotion!==true)throw new Error('tier membership must remain automatic');
          const tier1=portfolio.projects.filter(p=>Number(p.productionTier)===1);
          const tier2=portfolio.projects.filter(p=>Number(p.productionTier)===2);
          const tier3=portfolio.projects.filter(p=>Number(p.productionTier)===3);
          if(tier1.length!==2)throw new Error(`tier1 count mismatch: ${tier1.length}`);
          if(tier2.length!==3)throw new Error(`tier2 count mismatch: ${tier2.length}`);
          if(tier1.some(p=>p.targetEngine!=='unity-android'))throw new Error('tier1 must target Unity Android');
          if(tier2.some(p=>p.targetEngine!=='web'||p.mode!=='WEB_FIRST_IMPLEMENTATION'))throw new Error('tier2 must target Web first implementation');
          if(tier3.some(p=>p.mode!=='HOLD'&&p.targetEngine!=='design-only'))throw new Error('tier3 must remain design-only');
          if(Array.isArray(portfolio.developmentFocusPolicy?.preferredFocusedGameIds)&&portfolio.developmentFocusPolicy.preferredFocusedGameIds.length)throw new Error('focused game IDs must not be pinned');

          const catalogTier1=catalog.games.filter(g=>Number(g.productionTier)===1);
          const catalogTier2=catalog.games.filter(g=>Number(g.productionTier)===2);
          if(catalogTier1.length!==2||catalogTier2.length!==3)throw new Error('catalog tier count mismatch');
          if(catalogTier1.some(g=>g.homepageCategory!=='release-confirmed'))throw new Error('catalog tier1 category mismatch');
          if(catalogTier2.some(g=>g.homepageCategory!=='development-confirmed'))throw new Error('catalog tier2 category mismatch');

          const focusPolicy=portfolio.developmentFocusPolicy||{};
          const focus=company.operations?.autonomousFocus;
          const target=Math.max(0,Number(focusPolicy.targetFocusedGames??focusPolicy.maxFocusedGames??0)||0);
          if(target!==1)throw new Error('tier1 deep focus must stay exactly one');
          if(!focus||focus.enabled!==Boolean(portfolio.developmentFocusPolicy))throw new Error('autonomous focus status missing');
          if(focus.targetSlots!==1)throw new Error('autonomous focus target mismatch');
          if(!Array.isArray(focus.focusedGameIds)||!Array.isArray(focus.games))throw new Error('autonomous focus arrays missing');
          if(focus.focusedGameIds.length>1||focus.games.length>1)throw new Error('autonomous focus exceeds one slot');
          if(focus.games.some((row,index)=>row.gameId!==focus.focusedGameIds[index]))throw new Error('autonomous focus game mapping mismatch');
          if((focus.preferredGameIds||[]).length)throw new Error('company focus exposes pinned IDs');
          const state=portfolio.productionTierState||{};
          if(state.membershipMode!=='AUTO_EVIDENCE_RANKED'||state.fixedGameIds!==false||state.autoPromotionDemotion!==true)throw new Error('automatic tier state missing');
          if((state.releaseConfirmedGameIds||[]).length!==2||(state.developmentConfirmedGameIds||[]).length!==3)throw new Error('automatic tier state count mismatch');
          console.log('COMPANY_STATUS_SYNC_QA=PASS');
          console.log(`PRODUCTION_TIER_COUNTS_QA=2/3/${tier3.length}`);
          console.log(`COMPANY_AUTONOMOUS_FOCUS_QA=${focus.focusedGameIds.join(',')||'none'}`);
          NODE

      - name: Commit synchronized company status and production tiers
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-company-status-sync'
          git config user.email 'actions@users.noreply.github.com'
          git add company-status.json autonomous-portfolio.json game-catalog.json
          if git diff --cached --quiet; then
            echo 'COMPANY_STATUS_SYNC_COMMIT=NO_CHANGES'
            exit 0
          fi
          git commit -m 'company: sync dynamic production tiers and focus [skip ci]'
          git pull --rebase origin main
          git push origin main
          echo 'COMPANY_STATUS_SYNC_COMMIT=SUCCESS'
