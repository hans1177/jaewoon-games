name: Company Status Sync

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Company Seed DESIGN_ONLY Runtime
      - Company DESIGN_ONLY Promotion Sync
      - Company DEVELOPMENT_CONFIRMED Runtime
      - Company DEVELOPMENT_CONFIRMED Unity Runtime
      - Company DEVELOPMENT_CONFIRMED Roblox Runtime
      - Company DEVELOPMENT_CONFIRMED Roblox Runtime Continuation
      - Company DEVELOPMENT_CONFIRMED Roblox Post-Runtime QA
      - Company DEVELOPMENT_CONFIRMED Roblox Multiplayer QA
      - Company DEVELOPMENT_CONFIRMED Roblox Final Review Revalidation
      - Company DEVELOPMENT_CONFIRMED Roblox Release Promotion
      - Company Development Queue Reconcile
      - Owner Roblox Dedicated Private Experiences
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'tools/company-status-sync.mjs'
      - 'tools/game-catalog-normalization.mjs'
      - 'tools/production-classification.mjs'
      - 'tools/autonomous-24h-work-planner.mjs'
      - 'qa/production-diversity.test.mjs'
      - 'qa/game-catalog-normalization.test.mjs'
      - 'qa/autonomous-24h-work-planner.test.mjs'
      - 'qa/company-homepage-runtime-propagation.test.mjs'
      - 'qa/company-status-sync-direct-native.test.mjs'
      - 'company-learning/platform-release-roadmap.json'
      - 'qa/company-shared-context.test.mjs'
      - 'tools/company-shared-context.mjs'
      - 'company-learning/company-architecture-map.json'
      - 'company-learning/company-log-map.json'
      - '.github/workflows/company-status-sync.yml'
      - 'company-directive.json'
      - 'director-supervision-status.json'
      - 'autonomous-portfolio.json'
      - 'game-artbooks.json'
      - 'game-catalog.json'
      - 'web-games/**'

permissions:
  contents: write

concurrency:
  group: company-status-sync-runtime
  cancel-in-progress: true

env:
  COMPANY_RUNTIME_BRANCH: company-runtime

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare main engine without runtime history merge
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B company-status-engine origin/main
          if git ls-remote --exit-code --heads origin "$COMPANY_RUNTIME_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$COMPANY_RUNTIME_BRANCH"
            echo "COMPANY_RUNTIME_HEAD=$(git rev-parse origin/$COMPANY_RUNTIME_BRANCH)"
          else
            echo 'COMPANY_RUNTIME_HEAD=NOT_CREATED'
          fi
          echo "COMPANY_ENGINE_BASE=$(git rev-parse HEAD)"
          echo 'COMPANY_ENGINE_SOURCE=main'
          echo 'COMPANY_RUNTIME_HISTORY_MERGE=NO'
          echo 'PUBLIC_MAIN_WRITE=NO'
          if git show "origin/$COMPANY_RUNTIME_BRANCH:development-queue.json" > /tmp/company-runtime-development-queue.json 2>/dev/null; then
            echo 'COMPANY_RUNTIME_DEVELOPMENT_QUEUE_OVERLAY=YES'
            echo 'COMPANY_DEVELOPMENT_QUEUE_PATH=/tmp/company-runtime-development-queue.json' >> "$GITHUB_ENV"
          else
            rm -f /tmp/company-runtime-development-queue.json
            echo 'COMPANY_RUNTIME_DEVELOPMENT_QUEUE_OVERLAY=NO'
          fi
          if git show "origin/$COMPANY_RUNTIME_BRANCH:game-catalog.json" > /tmp/company-runtime-game-catalog.json 2>/dev/null; then
            echo 'COMPANY_RUNTIME_GAME_CATALOG_OVERLAY=YES'
            echo 'COMPANY_RUNTIME_GAME_CATALOG_PATH=/tmp/company-runtime-game-catalog.json' >> "$GITHUB_ENV"
          else
            rm -f /tmp/company-runtime-game-catalog.json
            echo 'COMPANY_RUNTIME_GAME_CATALOG_OVERLAY=NO'
          fi
          if git show "origin/$COMPANY_RUNTIME_BRANCH:game-seed-state.json" > /tmp/company-runtime-game-seed-state.json 2>/dev/null; then
            echo 'COMPANY_RUNTIME_SEED_STATE_OVERLAY=YES'
            echo 'COMPANY_SEED_STATE_PATH=/tmp/company-runtime-game-seed-state.json' >> "$GITHUB_ENV"
          else
            rm -f /tmp/company-runtime-game-seed-state.json
            echo 'COMPANY_RUNTIME_SEED_STATE_OVERLAY=NO'
          fi

      - name: Detect direct owner Web game changes
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          out=/tmp/company-owner-web-game-ids.txt
          : > "$out"
          before='${{ github.event.before }}'
          after='${{ github.sha }}'
          if [[ -n "$before" && ! "$before" =~ ^0+$ ]] && git cat-file -e "$before^{commit}" 2>/dev/null; then
            git diff --name-only "$before" "$after" -- web-games/ || true
          else
            git show --pretty='' --name-only "$after" -- web-games/ || true
          fi | awk -F/ '/^web-games\/[^/]+\// {print $2}' | sort -u > "$out"
          echo "COMPANY_OWNER_WEB_GAME_IDS_PATH=$out" >> "$GITHUB_ENV"
          echo "COMPANY_OWNER_WEB_CHANGED_IDS=$(paste -sd, "$out" || true)"

      - name: Validate shared worker context before status sync
        run: |
          node --check tools/company-shared-context.mjs
          node --test qa/company-shared-context.test.mjs
          node tools/company-shared-context.mjs --output=/tmp/company-shared-context-status-before.json

      - name: Sync company status and semantic production classes
        run: |
          node --check tools/production-classification.mjs
          node --check tools/game-catalog-normalization.mjs
          node --check tools/company-status-sync.mjs
          node --check tools/autonomous-24h-work-planner.mjs
          node --test qa/production-diversity.test.mjs
          node --test qa/autonomous-24h-work-planner.test.mjs
          node --test qa/company-homepage-runtime-propagation.test.mjs
          node --test qa/company-status-sync-direct-native.test.mjs
          node tools/company-status-sync.mjs
          node qa/game-catalog-normalization.test.mjs

      - name: Validate synchronized state
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const company=JSON.parse(fs.readFileSync('company-status.json','utf8'));
          const supervision=JSON.parse(fs.readFileSync('director-supervision-status.json','utf8'));
          const portfolio=JSON.parse(fs.readFileSync('autonomous-portfolio.json','utf8'));
          const catalog=JSON.parse(fs.readFileSync('game-catalog.json','utf8'));
          if(company.runtimeAuthority!=='company-runtime')throw new Error('company runtime authority missing');
          if(catalog.runtimeAuthority!=='company-runtime'||catalog.runtimeInfoAuthority!=='company-runtime')throw new Error('homepage runtime authority missing');
          if(JSON.stringify(catalog.runtimeSupportedPlatforms)!==JSON.stringify(['ROBLOX','UNITY']))throw new Error('homepage runtime platform coverage must match direct-native platforms');
          if((catalog.games||[]).some(game=>game.homepageInfo?.authority!=='company-runtime'))throw new Error('homepage runtime info missing from catalog game');
          if(company.supervision?.dateKst!==supervision.dateKst)throw new Error('supervision date not synchronized');
          const classes=['RELEASE_CONFIRMED','DEVELOPMENT_CONFIRMED','DESIGN_ONLY'];
          const valid=new Set(classes);
          const allowedPlatforms=new Set(['ROBLOX','UNITY']);
          const activeLifecycleStates=new Set(['ACTIVE','REBUILD']);
          const normalize=value=>{
            const raw=String(value??'').trim().toUpperCase().replaceAll('-','_');
            if(raw==='ROBLOX')return 'ROBLOX';
            if(['UNITY','UNITY_ANDROID','ANDROID_MOBILE'].includes(raw))return 'UNITY';
            if(['FORTNITE_UEFN','UEFN','FORTNITE'].includes(raw))return 'FORTNITE_UEFN';
            return '';
          };
          const targetEngine=platform=>platform==='ROBLOX'?'roblox':platform==='UNITY'?'unity-android':platform==='FORTNITE_UEFN'?'fortnite-uefn':'platform-selection-required';
          const projects=portfolio.projects||[];
          const catalogById=new Map((catalog.games||[]).map(game=>[String(game.id||'').trim(),game]));
          if(projects.some(p=>!valid.has(p.productionClass)))throw new Error('invalid project productionClass');
          if(projects.some(p=>Object.hasOwn(p,'productionTier')||Object.hasOwn(p,'productionTierSource')))throw new Error('legacy project production tier remains');
          const activeProjects=projects.filter(project=>{
            const game=catalogById.get(String(project.slug||'').trim());
            const lifecycle=String(project.lifecycleState||game?.lifecycleState||'ACTIVE').trim().toUpperCase();
            return Boolean(game)&&activeLifecycleStates.has(lifecycle);
          });
          const inactiveProjects=projects.filter(project=>!activeProjects.includes(project));
          if(inactiveProjects.some(project=>project.targetEngine!=='lifecycle-inactive'))throw new Error('inactive or missing-catalog project not quarantined');
          const release=activeProjects.filter(p=>p.productionClass==='RELEASE_CONFIRMED');
          const development=activeProjects.filter(p=>p.productionClass==='DEVELOPMENT_CONFIRMED');
          const design=activeProjects.filter(p=>p.productionClass==='DESIGN_ONLY');
          for(const project of release){
            const platform=normalize(project.selectedPlatform);
            if(!allowedPlatforms.has(platform))throw new Error(`release selected platform missing: ${project.id}`);
            if(project.targetEngine!==targetEngine(platform))throw new Error(`release target mismatch: ${project.id}`);
          }
          for(const project of development){
            const platform=normalize(project.selectedPlatform);
            if(platform&&!allowedPlatforms.has(platform))throw new Error(`development selected-platform mismatch: ${project.id}`);
            if(project.mode!=='ROBLOX_UNITY_DIRECT_NATIVE_CONCURRENT'||project.targetEngine!=='roblox-unity-native')throw new Error(`development direct-native mode mismatch: ${project.id}`);
            if(JSON.stringify(project.concurrentTargetPlatforms)!==JSON.stringify(['ROBLOX','UNITY']))throw new Error(`development concurrent targets missing: ${project.id}`);
            if(project.approvedDesignScopeMustBeFullyImplemented!==true)throw new Error(`development approved-scope requirement missing: ${project.id}`);
            if(project.strictDesignScoreRequiredForAdmission!==false||project.strictDesignReviewRunsInParallel!==true)throw new Error(`development strict-design admission contract mismatch: ${project.id}`);
            if(!project.targetSourcePaths?.ROBLOX||!project.targetSourcePaths?.UNITY)throw new Error(`development native source roots missing: ${project.id}`);
            for(const legacy of ['webPurpose','webCompanionRequired','webValidationRequired','webEvidenceMayReplaceNativePlatformEvidence','webGameplayValidationRequired','musicValidationRequired','webBeforeTargetPlatformByDefault']){
              if(Object.hasOwn(project,legacy))throw new Error(`development legacy Web projection remains: ${project.id}:${legacy}`);
            }
          }
          if(design.some(p=>p.mode!=='HOLD'&&p.targetEngine!=='design-only'))throw new Error('design target mismatch');
          const releasePolicy=portfolio.productionClassPolicy?.classes?.RELEASE_CONFIRMED||{};
          const developmentPolicy=portfolio.productionClassPolicy?.classes?.DEVELOPMENT_CONFIRMED||{};
          if(releasePolicy.engine!=='PROJECT_SELECTED_PLATFORM')throw new Error('release engine policy must be selected-platform');
          if(
            developmentPolicy.engine!=='ROBLOX_UNITY_DIRECT_NATIVE'||
            developmentPolicy.scope!=='MINIMUM_DESIGN_THEN_ROBLOX_UNITY_CONCURRENT'||
            developmentPolicy.admissionAuthority!=='MINIMUM_DUAL_PLATFORM_DESIGN_READY'||
            JSON.stringify(developmentPolicy.concurrentTargetPlatforms)!==JSON.stringify(['ROBLOX','UNITY'])||
            developmentPolicy.strictDesignScoreRequiredForAdmission!==false||
            developmentPolicy.strictDesignReviewRunsInParallel!==true||
            developmentPolicy.approvedDesignScopeMustBeFullyImplemented!==true||
            developmentPolicy.targetPlatformMayRunImmediately!==true||
            developmentPolicy.onePlatformFailureDoesNotCancelOther!==true
          )throw new Error('development direct-native policy mismatch');
          for(const legacy of ['webPurpose','webCompanionRequired','webEvidenceMayReplaceNativePlatformEvidence','webGameplayValidationRequired','musicValidationRequired','webBeforeTargetPlatformByDefault']){
            if(Object.hasOwn(developmentPolicy,legacy))throw new Error(`development policy legacy Web projection remains: ${legacy}`);
          }
          const focusPolicy=portfolio.developmentFocusPolicy||{};
          if(Object.hasOwn(focusPolicy,'requiredFullApprovedWebCompanionBeforeTargetPlatform'))throw new Error('legacy full-Web companion focus policy remains');
          if(focusPolicy.nativeDevelopmentAdmission!=='MINIMUM_DUAL_PLATFORM_DESIGN_READY')throw new Error('minimum-design admission focus policy missing');
          if(focusPolicy.nativePlatformEvidenceStillRequired!==true)throw new Error('native platform evidence focus policy missing');
          if(Object.hasOwn(focusPolicy,'requiredWebGameplayAndMusicValidationBeforeTargetPlatform'))throw new Error('legacy first-playable Web focus policy remains');
          if(Object.hasOwn(focusPolicy,'optionalWebGameplayTestbedAllowedAlongsideReleaseFocus'))throw new Error('legacy optional Web focus policy remains');
          if(Object.hasOwn(focusPolicy,'developmentConfirmedWebPrototypeAllowedAlongsideReleaseFocus'))throw new Error('legacy Web prototype focus policy remains');
          const categoryByClass={RELEASE_CONFIRMED:'release-confirmed',DEVELOPMENT_CONFIRMED:'development-confirmed',DESIGN_ONLY:'design-only'};
          const historicalDeploymentShelfAllowed=g=>g.productionClass==='DESIGN_ONLY'&&g.homepageCategory==='historical-deployed'&&g.selectedPlatform==='ROBLOX'&&g.robloxPublicationTarget?.verified===true&&g.robloxPublicationTarget?.historical===true&&g.robloxPublicationTarget?.currentReleaseClaim===false&&g.robloxReleaseEvidence?.historicalPublicationTargetVerified===true;
          for(const g of catalog.games||[]){
            if(!valid.has(g.productionClass))throw new Error(`invalid catalog class: ${g.id}`);
            if(Object.hasOwn(g,'productionTier')||Object.hasOwn(g,'productionTierSource'))throw new Error(`legacy catalog production tier remains: ${g.id}`);
            if(g.homepageCategory!==categoryByClass[g.productionClass]&&!historicalDeploymentShelfAllowed(g))throw new Error(`catalog category mismatch: ${g.id}`);
            if(g.productionClass==='DEVELOPMENT_CONFIRMED'&&(g.productionTarget!=='ROBLOX_UNITY'||g.homepageStage!=='개발확정 · Roblox + Unity 앱 동시개발'))throw new Error(`development homepage direct-native state mismatch: ${g.id}`);
            if(g.productionClass!=='DESIGN_ONLY'&&g.productionTarget==='web-first-playable')throw new Error(`legacy Web-first target remains: ${g.id}`);
          }
          const state=portfolio.productionClassState||{};
          const expected={releaseConfirmed:release.length,developmentConfirmed:development.length,designOnly:design.length};
          if(JSON.stringify(state.counts)!==JSON.stringify(expected))throw new Error('derived active class counts mismatch');
          if((state.ranking||[]).some(row=>Object.hasOwn(row,'unityReady')))throw new Error('Unity-only readiness leaked into generic ranking');
          if(Object.hasOwn(portfolio,'productionTierState')||Object.hasOwn(portfolio,'productionTierPolicy'))throw new Error('legacy portfolio production tier state remains');
          if(company.operations?.productionTiers)throw new Error('legacy company production tier state remains');
          if(!company.operations?.productionClasses)throw new Error('semantic company production class state missing');
          const focus=company.operations?.autonomousFocus;
          const expectedTargetSlots=Math.max(0,Number(focusPolicy.targetFocusedGames??focusPolicy.maxFocusedGames??0)||0);
          const maxFocusedGames=Math.max(expectedTargetSlots,Number(focusPolicy.maxFocusedGames??expectedTargetSlots)||0);
          if(!focus||focus.targetSlots!==expectedTargetSlots||focus.focusedGameIds?.length>maxFocusedGames)throw new Error('autonomous focus contract failed');
          if((focus.games||[]).some(game=>game.lane!=='selected-platform'||Object.hasOwn(game,'unityReady')))throw new Error('autonomous focus still uses Unity-only lane');
          if(JSON.stringify(focus.platformPriority)!==JSON.stringify(['ROBLOX','UNITY'])||focus.priorityMeaning!=='DEFAULT_FOCUS_ONLY_NO_PLATFORM_GATE')throw new Error('platform focus priority contract failed');
          console.log('COMPANY_STATUS_SYNC_QA=PASS');
          console.log(`PRODUCTION_CLASS_COUNTS_QA=${release.length}/${development.length}/${design.length}`);
          console.log(`LIFECYCLE_QUARANTINED_PROJECTS_QA=${inactiveProjects.length}`);
          console.log(`AUTONOMOUS_FOCUS_QA=${focus.focusedGameIds?.length||0}/${expectedTargetSlots} MAX=${maxFocusedGames}`);
          console.log('DIRECT_NATIVE_POLICY_SYNC_QA=PASS');
          console.log('ROBLOX_UNITY_RUNTIME_SYNC_QA=PASS');
          NODE

      - name: Revalidate shared worker context before runtime persistence
        run: node tools/company-shared-context.mjs --output=/tmp/company-shared-context-status-after.json

      - name: Persist validated runtime status without main write
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-company-status-sync'
          git config user.email 'actions@users.noreply.github.com'
          runtime_paths=(company-status.json autonomous-portfolio.json game-catalog.json)
          git add -- "${runtime_paths[@]}"
          if ! git diff --cached --quiet; then
            git commit -m 'runtime: generate selected-platform production status [skip ci]'
          fi
          generated_commit="$(git rev-parse HEAD)"
          persisted=0
          changed=0
          for attempt in 1 2 3 4; do
            git fetch origin main
            if git ls-remote --exit-code --heads origin "$COMPANY_RUNTIME_BRANCH" >/dev/null 2>&1; then
              git fetch origin "$COMPANY_RUNTIME_BRANCH"
              git checkout -B company-status-persist "origin/$COMPANY_RUNTIME_BRANCH"
            else
              git checkout -B company-status-persist origin/main
            fi
            git checkout "$generated_commit" -- "${runtime_paths[@]}"
            git add -- "${runtime_paths[@]}"
            if git diff --cached --quiet; then
              persisted=1
              echo 'COMPANY_STATUS_SYNC_COMMIT=NO_CHANGES'
              break
            fi
            changed=1
            git commit -m 'runtime: sync selected-platform production classes and focus [skip ci]'
            if git push origin "HEAD:refs/heads/$COMPANY_RUNTIME_BRANCH"; then
              persisted=1
              echo 'COMPANY_STATUS_SYNC_COMMIT=RUNTIME_PERSISTED'
              break
            fi
            git checkout -B company-status-engine "$generated_commit"
            sleep $((attempt * 2))
          done
          test "$persisted" = 1
          echo "COMPANY_STATUS_RUNTIME_CHANGED=$changed"
          echo "COMPANY_STATUS_RUNTIME_BRANCH=$COMPANY_RUNTIME_BRANCH"
          echo 'COMPANY_RUNTIME_HISTORY_MERGE=NO'
          echo 'PUBLIC_MAIN_WRITE=NO'