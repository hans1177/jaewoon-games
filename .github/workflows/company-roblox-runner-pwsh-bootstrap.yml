name: Company Roblox Runner Hidden Startup Bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/company-roblox-runner-pwsh-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: install durable Roblox runner startup
    runs-on: [self-hosted, Windows, X64, roblox-studio-authenticated]
    timeout-minutes: 5
    steps:
      - name: Install Windows service with hidden Startup fallback
        shell: powershell -NoLogo -NoProfile -NonInteractive -WindowStyle Hidden -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $runnerRoot = 'C:\actions-runner'
          $metadataPath = Join-Path $runnerRoot '.runner'
          $runCmd = Join-Path $runnerRoot 'run.cmd'
          $svcCmd = Join-Path $runnerRoot 'svc.cmd'

          if (-not (Test-Path -LiteralPath $metadataPath)) { throw 'Roblox runner metadata missing' }
          if (-not (Test-Path -LiteralPath $runCmd)) { throw 'Roblox runner run.cmd missing' }

          $metadata = Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json
          if ([string]$metadata.agentName -ne 'roblox-studio-local') { throw "Unexpected Roblox runner: $($metadata.agentName)" }

          # 같은 러너가 자기 자신을 실행 중일 때 listener를 재시작하지 않는다.
          # 대신 서비스 설치/자동 시작만 보장해 다음 재부팅부터 사용자 로그인 없이 복구되게 한다.
          $service = Get-Service -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like 'actions.runner.*' -and $_.Name -match 'roblox-studio-local' } |
            Select-Object -First 1

          if (-not $service -and (Test-Path -LiteralPath $svcCmd)) {
            Push-Location $runnerRoot
            try {
              & $svcCmd install
              $installExit = $LASTEXITCODE
            } finally {
              Pop-Location
            }

            $service = Get-Service -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -like 'actions.runner.*' -and $_.Name -match 'roblox-studio-local' } |
              Select-Object -First 1

            if (-not $service) {
              throw "Roblox runner Windows service install failed: exit=$installExit"
            }
          }

          if ($service) {
            Set-Service -Name $service.Name -StartupType Automatic
            Write-Host "ROBLOX_RUNNER_SERVICE=$($service.Name)"
            Write-Host 'ROBLOX_RUNNER_SERVICE_AUTOSTART=PASS'
          } else {
            Write-Host 'ROBLOX_RUNNER_SERVICE_AUTOSTART=UNAVAILABLE_SVC_CMD'
          }

          # 서비스 설치가 불가능한 구형 runner 구성만 로그인 Startup fallback을 사용한다.
          $startupRoot = [Environment]::GetFolderPath('Startup')
          if (-not $startupRoot) { throw 'Windows Startup folder unavailable' }

          $startupPath = Join-Path $startupRoot 'Jaewoon-Roblox-Runner.vbs'
          $launcher = @"
          Set shell = CreateObject("WScript.Shell")
          Set svc = GetObject("winmgmts:\\.\root\cimv2")
          Set runningService = svc.ExecQuery("SELECT * FROM Win32_Service WHERE Name LIKE 'actions.runner.%roblox-studio-local%' AND State='Running'")
          Set runningListener = svc.ExecQuery("SELECT * FROM Win32_Process WHERE Name='Runner.Listener.exe'")
          If runningService.Count = 0 And runningListener.Count = 0 Then
            shell.CurrentDirectory = "C:\actions-runner"
            shell.Run Chr(34) & "C:\actions-runner\run.cmd" & Chr(34), 0, False
          End If
          "@

          $launcher | Set-Content -LiteralPath $startupPath -Encoding ASCII

          Write-Host "ROBLOX_RUNNER_STARTUP_LAUNCHER=$startupPath"
          Write-Host 'ROBLOX_RUNNER_VISIBLE_CMD=NO'
          Write-Host 'ROBLOX_RUNNER_VISIBLE_POWERSHELL=NO'
          Write-Host 'ROBLOX_RUNNER_VISIBLE_APP=ROBLOX_STUDIO_ONLY'
          Write-Host 'ROBLOX_RUNNER_REBOOT_AUTOSTART=WINDOWS_SERVICE_WITH_STARTUP_FALLBACK'
          Write-Host 'ROBLOX_RUNNER_HIDDEN_BOOTSTRAP=PASS'
