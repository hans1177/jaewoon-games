name: Temporary Eldoria Scope Semantic Fix

on:
  push:
    branches:
      - fix/eldoria-scope-semantic-mapping
    paths:
      - '.github/workflows/temp-eldoria-scope-semantic-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/eldoria-scope-semantic-mapping
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fix semantic mapping and regression fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/company-development-web-bootstrap.mjs')
          s=p.read_text()
          old="""  if(/mobileux|mobile|touch/.test(text))return 2;
  if(/explor|area|quest|discover|character/.test(text))return 0;
  if(/progress through|real ending|complete story|major encounter/.test(text))return 4;
  if(/fight|combat|attack|enemy|boss/.test(text))return index%2===0?3:1;
  if(/equip|skill|upgrade|growth|level/.test(text))return 3;
"""
          new="""  if(/mobileux|mobile|touch/.test(text))return 2;
  if(/explor|area|quest|discover|character/.test(text))return 0;
  if(/fight\\s+enemies|combat|attack/.test(text))return index%2===0?3:1;
  if(/progress through|real ending|complete story|major encounter/.test(text))return 4;
  if(/enemy|boss/.test(text))return index%2===0?3:1;
  if(/equip|skill|upgrade|growth|level/.test(text))return 3;
"""
          if s.count(old)!=1: raise SystemExit(f'mapping target count={s.count(old)}')
          p.write_text(s.replace(old,new))

          t=Path('qa/company-development-web-runtime.test.mjs')
          q=t.read_text()
          old_block="""    'Fight enemies and bosses, gain equipment or skills, and use that growth to reach the next story location.',
    'Progress through the complete story arc to a final boss and a real ending.',
    'Explore an area, meet characters, accept or advance story quests, and discover information.',
    'Fight enemies and bosses, gain equipment or skills, and use that growth to reach the next story location.',
    'Progress through the complete story arc to a final boss and a real ending.',
    'Explore an area, meet characters, accept or advance story quests, and discover information.',
    'Fight enemies and bosses, gain equipment or skills, and use that growth to reach the next story location.'
  ],mobileUx:'touch-first story controls'}};
"""
          new_block="""    'Fight enemies and bosses, gain equipment or skills, and use that growth to reach the next story location or major encounter.',
    'Progress through the complete story arc to a final boss and a real ending, with optional post-game or sequel hooks kept separate from the base conclusion.',
    'Explore an area, meet characters, accept or advance story quests, and discover information that moves the main narrative forward.',
    'Fight enemies and bosses, gain equipment or skills, and use that growth to reach the next story location or major encounter.',
    'Progress through the complete story arc to a final boss and a real ending, with optional post-game or sequel hooks kept separate from the base conclusion.',
    'Explore an area, meet characters, accept or advance story quests, and discover information that moves the main narrative forward.',
    'Fight enemies and bosses, gain equipment or skills, and use that growth to reach the next story location or major encounter.'
  ],mobileUx:'Story Driven'}};
"""
          if q.count(old_block)!=1: raise SystemExit(f'fixture target count={q.count(old_block)}')
          q=q.replace(old_block,new_block)
          old_assert="""  assert.equal(output.review.pass,true);
  assert.equal(output.approvedScopeInventory.length,9);
"""
          new_assert="""  assert.equal(output.review.pass,true);
  assert.equal(output.review.mechanicCount,5);
  assert.equal(output.approvedScopeInventory.length,9);
"""
          if q.count(old_assert)!=1: raise SystemExit(f'assert target count={q.count(old_assert)}')
          t.write_text(q.replace(old_assert,new_assert))
          PY
          node --check tools/company-development-web-bootstrap.mjs
          node --test qa/company-development-web-runtime.test.mjs
          git diff --check
          git diff --stat
      - name: Commit canonical fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-runtime-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tools/company-development-web-bootstrap.mjs qa/company-development-web-runtime.test.mjs
          git diff --cached --quiet && { echo 'no canonical diff' >&2; exit 1; }
          git commit -m 'fix(web): distinguish combat from story progression scopes'
          git push origin HEAD:fix/eldoria-scope-semantic-mapping
