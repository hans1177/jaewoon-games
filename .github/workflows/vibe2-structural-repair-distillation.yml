name: Vibe2 Unity Coding Structural Distillation

on:
  push:
    branches: [main]
    paths:
      - 'company-learning/unity-teacher-rubric.json'
      - 'company-learning/unity-teacher-materials/**'
      - 'company-learning/training-samples/**'
      - 'tools/vibe2-online-unity-teacher.mjs'
      - 'tools/vibe2-structural-repair-distillation.mjs'
      - 'tools/vibe2-weight-learning.mjs'
      - 'tools/vibe2-practice-dataset.mjs'
      - 'tools/vibe2-practice-train.py'
      - 'qa/vibe2-structural-repair-distillation.test.mjs'
      - 'qa/vibe2-online-unity-teacher.test.mjs'
      - 'qa/vibe2-unity-teacher-rubric.test.mjs'
      - 'qa/vibe2-unity-learning-boundary.test.mjs'
      - 'qa/vibe2-weight-learning.test.mjs'
      - 'qa/vibe2-practice-weight-learning.test.mjs'
      - '.github/workflows/vibe2-structural-repair-distillation.yml'
  workflow_run:
    workflows: ['Vibe2 Distillation Sample Ingest']
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: vibe2-unity-coding-distillation
  cancel-in-progress: false

env:
  LEARNING_FOCUS: UNITY_CODING_ONLY
  ONLINE_TEACHER_ROUTE: GPT_AUTHORED_CURRICULUM_ON_GITHUB_HOSTED_RUNNER

jobs:
  static-gate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Unity coding learning contract
        run: |
          set -euo pipefail
          node --check tools/vibe2-structural-repair-distillation.mjs
          node --check tools/vibe2-online-unity-teacher.mjs
          node --check tools/vibe2-practice-dataset.mjs
          python -m py_compile tools/vibe2-practice-train.py
          node --test qa/vibe2-structural-repair-distillation.test.mjs
          node --test qa/vibe2-online-unity-teacher.test.mjs
          node --test qa/vibe2-unity-teacher-rubric.test.mjs
          node --test qa/vibe2-unity-learning-boundary.test.mjs
          node --test qa/vibe2-weight-learning.test.mjs
          node --test qa/vibe2-practice-weight-learning.test.mjs
          test -f company-learning/unity-teacher-rubric.json
          test -f company-learning/unity-teacher-materials/core-lessons.json
          test -f company-learning/unity-teacher-materials/graphics-motion-lessons.json
          test -f company-learning/unity-teacher-materials/gpt-practice-drills.json
          grep -q 'actions/setup-python@v5' .github/workflows/vibe2-structural-repair-distillation.yml
          echo 'LEARNING_FOCUS=UNITY_CODING_ONLY'
          echo 'SPECIALIZATION=GRAPHICS_ANIMATION_MOTION_SMOOTHNESS'
          echo 'KNOWHOW_TRANSFER=REPLICATE_REARRANGE_VARY_RECOMBINE_VERIFIED_INTERNAL_PATTERNS'
          echo 'EXTERNAL_PROPRIETARY_CODE_REUSE=NO'
          echo 'LICENSED_CODE_REUSE=LICENSE_TERMS_ONLY'
          echo 'ONLINE_TEACHER=YES'
          echo 'GPT_PRACTICE_SAMPLE_SUPPLY=YES'
          echo 'PRACTICE_SAMPLE_AUTHORITY=PRACTICE_ONLY'
          echo 'PRACTICE_WEIGHT_TRAINING=ENABLED'
          echo 'LOCAL_OLLAMA_TEACHER=NO'
          echo 'PAID_API=NO'
          echo 'TEACHER_CODE_AUTHORITY=NO'
          echo 'ANSWER_TARGET=VERIFIED_FINAL_DIFF_ONLY'

  online-teacher:
    needs: static-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sample_count: ${{ steps.teach.outputs.sample_count }}
      practice_count: ${{ steps.teach.outputs.practice_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download verified ingest samples
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: vibe2-verified-training-samples
          path: ${{ runner.temp }}/vibe2-ingest-samples
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Resolve verified sample source
        id: sample-source
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/vibe2-ingest-samples"
          if [ "${{ github.event_name }}" = 'workflow_run' ] && find "$artifact_dir" -type f -name '*.json' -print -quit 2>/dev/null | grep -q .; then
            echo "sample_dir=$artifact_dir" >> "$GITHUB_OUTPUT"
            echo 'VERIFIED_SAMPLE_SOURCE=INGEST_ARTIFACT'
          else
            echo 'sample_dir=company-learning/training-samples' >> "$GITHUB_OUTPUT"
            echo 'VERIFIED_SAMPLE_SOURCE=MAIN_REPOSITORY'
          fi
      - name: Apply GPT-authored Unity curriculum online
        id: teach
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/unity-online-teacher-samples"
          practice="$RUNNER_TEMP/unity-gpt-practice-samples"
          node tools/vibe2-online-unity-teacher.mjs \
            --sample-dir "${{ steps.sample-source.outputs.sample_dir }}" \
            --lessons company-learning/unity-teacher-materials/core-lessons.json \
            --practice-drills company-learning/unity-teacher-materials/gpt-practice-drills.json \
            --out-dir "$out" \
            --practice-out-dir "$practice" \
            --max 96 \
            --max-practice 96 | tee "$RUNNER_TEMP/unity-online-teacher-result.json"
          count=$(find "$out" -maxdepth 1 -type f -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
          practice_count=$(find "$practice" -maxdepth 1 -type f -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
          echo "sample_count=$count" >> "$GITHUB_OUTPUT"
          echo "practice_count=$practice_count" >> "$GITHUB_OUTPUT"
          echo "ONLINE_UNITY_TEACHER_SAMPLES=$count"
          echo "GPT_UNITY_PRACTICE_SAMPLES=$practice_count"
          echo 'PRACTICE_SAMPLES_ARE_VERIFIED_POSITIVE=NO'
          echo 'PRACTICE_RUNTIME_PROMOTION=NO'
          echo 'TEACHER_ROUTE=GPT_AUTHORED_CURRICULUM_ON_GITHUB_HOSTED_RUNNER'
          echo 'SPECIALIZATION=GRAPHICS_ANIMATION_MOTION_SMOOTHNESS'
          echo 'LOCAL_OLLAMA_TEACHER=NO'
          echo 'PAID_API=NO'
      - name: Upload GPT Unity practice samples
        if: steps.teach.outputs.practice_count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: unity-gpt-practice-samples
          path: ${{ runner.temp }}/unity-gpt-practice-samples
          retention-days: 1
          if-no-files-found: error
      - name: Upload online teacher verified samples
        if: steps.teach.outputs.sample_count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: unity-online-teacher-samples
          path: ${{ runner.temp }}/unity-online-teacher-samples
          retention-days: 1
          if-no-files-found: error

  unity-practice-train:
    needs: online-teacher
    if: needs.online-teacher.outputs.practice_count != '0'
    runs-on: [self-hosted, Windows, X64, jaewoon-unity]
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download GPT Unity practice samples
        uses: actions/download-artifact@v4
        with:
          name: unity-gpt-practice-samples
          path: ${{ runner.temp }}/unity-gpt-practice-samples
      - name: Ensure local ML training dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          python -c "import torch, transformers, peft, accelerate" 2>$null
          if ($LASTEXITCODE -ne 0) {
            python -m pip install --disable-pip-version-check torch transformers peft accelerate sentencepiece
            if ($LASTEXITCODE -ne 0) { throw 'ML dependency installation failed' }
          }
          python -c "import torch, transformers, peft, accelerate; print('PYTHON_ML_STACK=PASS'); print('TORCH=' + torch.__version__); print('TORCH_CUDA=' + str(torch.version.cuda))"
      - name: Preflight local GPU practice training stack
        run: |
          $ErrorActionPreference = 'Stop'
          $nvidia = Get-Command nvidia-smi -ErrorAction SilentlyContinue
          if ($null -eq $nvidia) { throw 'nvidia-smi not found on self-hosted Unity runner' }
          nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader
          python -c "import torch; assert torch.cuda.is_available(), 'CUDA GPU is required for practice adapter training'; print('PRACTICE_CUDA=' + torch.cuda.get_device_name(0)); print('PRACTICE_CUDA_MEMORY=' + str(torch.cuda.get_device_properties(0).total_memory))"
          $method = 'lora'
          python -c "import bitsandbytes" 2>$null
          if ($LASTEXITCODE -eq 0) { $method = 'qlora' }
          "PRACTICE_TRAINING_METHOD=$method" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $root = Join-Path $env:USERPROFILE 'jaewoon-vibe2-learning'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          "LOCAL_TRAINING_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $samples = Join-Path $env:RUNNER_TEMP 'unity-gpt-practice-samples'
          $count = @(Get-ChildItem $samples -Filter '*.json' -File).Count
          if ($count -lt 12) { throw "practice sample count $count/12" }
          "PRACTICE_SAMPLE_DIR=$samples" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "PRACTICE_SAMPLE_COUNT=$count"
      - name: Build practice-only Unity dataset
        run: |
          $ErrorActionPreference = 'Stop'
          $datasetDir = Join-Path $env:RUNNER_TEMP "unity-practice-$env:GITHUB_RUN_ID"
          node tools/vibe2-practice-dataset.mjs --input $env:PRACTICE_SAMPLE_DIR --out $datasetDir --min-samples 12
          if ($LASTEXITCODE -ne 0) { throw 'practice dataset build failed' }
          $manifest = [System.IO.File]::ReadAllText((Join-Path $datasetDir 'manifest.json'), [System.Text.Encoding]::UTF8) | ConvertFrom-Json
          if ($manifest.authority -ne 'PRACTICE_ONLY' -or $manifest.runtimePromotionAllowed -ne $false -or $manifest.readyForTraining -ne $true) { throw 'practice dataset authority gate failed' }
          "PRACTICE_DATASET_DIR=$datasetDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "PRACTICE_DATASET_TRAIN=$($manifest.stats.train)"
          Write-Host "PRACTICE_DATASET_EVAL=$($manifest.stats.eval)"
      - name: Train practice-only Unity adapter
        run: |
          $ErrorActionPreference = 'Stop'
          $adapterVersion = "unity-practice-$env:GITHUB_RUN_ID"
          $adapterDir = Join-Path $env:LOCAL_TRAINING_ROOT "adapters\unity-practice\$adapterVersion"
          if (Test-Path $adapterDir) { Remove-Item $adapterDir -Recurse -Force }
          New-Item -ItemType Directory -Path $adapterDir -Force | Out-Null
          python tools/vibe2-practice-train.py --train (Join-Path $env:PRACTICE_DATASET_DIR 'train.jsonl') --eval (Join-Path $env:PRACTICE_DATASET_DIR 'eval.jsonl') --dataset-manifest (Join-Path $env:PRACTICE_DATASET_DIR 'manifest.json') --output $adapterDir --adapter-version $adapterVersion --task-type unity --method $env:PRACTICE_TRAINING_METHOD --epochs 1
          if ($LASTEXITCODE -ne 0) { throw 'practice Unity adapter training failed' }
          $metadata = [System.IO.File]::ReadAllText((Join-Path $adapterDir 'training-metadata.json'), [System.Text.Encoding]::UTF8) | ConvertFrom-Json
          if ($metadata.practiceOnly -ne $true -or $metadata.promotionState -ne 'UNVERIFIED' -or $metadata.runtimePromotionAllowed -ne $false) { throw 'practice adapter safety gate failed' }
          Write-Host "PRACTICE_WEIGHT_LEARNING=PASS"
          Write-Host "PRACTICE_ADAPTER=$adapterDir"
          Write-Host "PRACTICE_TRAIN_LOSS=$($metadata.trainMetrics.train_loss)"
          Write-Host "PRACTICE_EVAL_LOSS=$($metadata.evalMetrics.eval_loss)"
          Write-Host 'PRACTICE_RUNTIME_PROMOTION=NO'
      - name: Practice learning summary
        if: always()
        run: |
          Write-Host 'LEARNING_STAGE=SAMPLE_TO_DATASET_TO_LORA'
          Write-Host 'AUTHORITY=PRACTICE_ONLY'
          Write-Host 'RUNTIME_PROMOTION_ALLOWED=NO'
          Write-Host 'NEXT_GATE=VERIFIED_UNITY_HOLDOUT_AB_AND_CANARY'

  unity-train:
    needs: online-teacher
    if: needs.online-teacher.outputs.sample_count != '0'
    runs-on: [self-hosted, Windows, X64, jaewoon-unity]
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download online Unity teacher samples
        uses: actions/download-artifact@v4
        with:
          name: unity-online-teacher-samples
          path: ${{ runner.temp }}/unity-online-teacher-samples
      - name: Ensure local ML training dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          python -c "import torch, transformers, peft, accelerate" 2>$null
          if ($LASTEXITCODE -ne 0) {
            python -m pip install --disable-pip-version-check torch transformers peft accelerate sentencepiece
            if ($LASTEXITCODE -ne 0) { throw 'ML dependency installation failed' }
          }
          python -c "import torch, transformers, peft, accelerate; print('PYTHON_ML_STACK=PASS'); print('TORCH=' + torch.__version__); print('TORCH_CUDA=' + str(torch.version.cuda))"
      - name: Preflight local GPU training stack only
        run: |
          $ErrorActionPreference = 'Stop'
          $nvidia = Get-Command nvidia-smi -ErrorAction SilentlyContinue
          if ($null -eq $nvidia) { throw 'nvidia-smi not found on self-hosted Unity runner' }
          nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader
          python -c "import torch; assert torch.cuda.is_available(), 'CUDA GPU is required for adapter training'; print('cuda=' + torch.cuda.get_device_name(0))"
          $method = 'lora'
          python -c "import bitsandbytes" 2>$null
          if ($LASTEXITCODE -eq 0) { $method = 'qlora' }
          "TRAINING_METHOD=$method" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $root = Join-Path $env:USERPROFILE 'jaewoon-vibe2-learning'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          "LOCAL_TRAINING_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $samples = Join-Path $env:RUNNER_TEMP 'unity-online-teacher-samples'
          "STRUCTURAL_SAMPLE_DIR=$samples" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $count = @(Get-ChildItem $samples -Filter '*.json' -File).Count
          "STRUCTURAL_SAMPLE_COUNT=$count" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "ONLINE_TEACHER_SAMPLE_COUNT=$count"
          Write-Host 'LOCAL_OLLAMA_TEACHER=NO'

      - name: Build Unity-only bootstrap dataset
        run: |
          $ErrorActionPreference = 'Stop'
          if ([int]$env:STRUCTURAL_SAMPLE_COUNT -lt 12) {
            Write-Host "WAITING_FOR_UNITY_SAMPLES=$env:STRUCTURAL_SAMPLE_COUNT/12"
            "STRUCTURAL_DATASET_READY=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            exit 0
          }
          $datasetDir = Join-Path $env:RUNNER_TEMP "unity-structural-$env:GITHUB_RUN_ID"
          node tools/vibe2-weight-learning.mjs dataset --input $env:STRUCTURAL_SAMPLE_DIR --out $datasetDir --task-type unity --min-train-samples 8 --min-fresh-train-samples 6 --min-distinct-projects 1 --max-project-share 1 --task-plan-min-samples 8 --task-plan-min-projects 1 --synthetic-ratio-cap 0
          if ($LASTEXITCODE -ne 0) {
            "STRUCTURAL_DATASET_READY=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            exit 0
          }
          "STRUCTURAL_DATASET_READY=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "STRUCTURAL_DATASET_DIR=$datasetDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Train Unity coding specialist adapter
        if: env.STRUCTURAL_DATASET_READY == 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $adapterVersion = "unity-coding-$env:GITHUB_RUN_ID"
          $adapterDir = Join-Path $env:LOCAL_TRAINING_ROOT "adapters\unity-coding\$adapterVersion"
          if (Test-Path $adapterDir) { Remove-Item $adapterDir -Recurse -Force }
          New-Item -ItemType Directory -Path $adapterDir -Force | Out-Null
          python tools/vibe2-train.py --train (Join-Path $env:STRUCTURAL_DATASET_DIR 'train.jsonl') --eval (Join-Path $env:STRUCTURAL_DATASET_DIR 'eval.jsonl') --dataset-manifest (Join-Path $env:STRUCTURAL_DATASET_DIR 'manifest.json') --output $adapterDir --adapter-version $adapterVersion --task-type unity --method $env:TRAINING_METHOD
          if ($LASTEXITCODE -ne 0) { throw 'Unity coding adapter training failed' }
          $metadata = [System.IO.File]::ReadAllText((Join-Path $adapterDir 'training-metadata.json'), [System.Text.Encoding]::UTF8) | ConvertFrom-Json
          if ($metadata.promotionState -ne 'UNVERIFIED' -or $metadata.runtimePromotionAllowed -ne $false) { throw 'fresh Unity coding adapter must stay UNVERIFIED' }
          [ordered]@{
            version=1
            specialization='unity-coding'
            learningFocus='UNITY_CODING_ONLY'
            taskType='unity'
            adapterVersion=$adapterVersion
            localAdapterPath=$adapterDir
            teacherRoute='GPT_AUTHORED_CURRICULUM_ON_GITHUB_HOSTED_RUNNER'
            teacherRole='ANALYSIS_ONLY'
            answerTarget='VERIFIED_FINAL_DIFF_ONLY'
            paidApi=$false
            promotionState='UNVERIFIED'
            runtimePromotionAllowed=$false
            requiredNextGate='FIXED_HOLDOUT_AB_AND_CANARY'
          } | ConvertTo-Json -Depth 10 | Set-Content (Join-Path $env:LOCAL_TRAINING_ROOT 'latest-unity-coding-runtime.json') -Encoding utf8
          Write-Host "UNITY_CODING_ADAPTER=$adapterDir"
          Write-Host 'AUTO_PROMOTION=NO'

      - name: Summary
        if: always()
        run: |
          Write-Host 'LEARNING_FOCUS=UNITY_CODING_ONLY'
          Write-Host 'TASK_TYPE=unity'
          Write-Host 'SCHEDULE=HOURLY_24H'
          Write-Host 'SPECIALIZATION=GRAPHICS_ANIMATION_MOTION_SMOOTHNESS'
          Write-Host 'TEACHER_ROUTE=GPT_AUTHORED_CURRICULUM_ON_GITHUB_HOSTED_RUNNER'
          Write-Host 'LOCAL_OLLAMA_TEACHER=NO'
          Write-Host 'PAID_API=NO'
          Write-Host 'TEACHER_CODE_AUTHORITY=NO'
          Write-Host 'ANSWER_TARGET=VERIFIED_FINAL_DIFF_ONLY'
          Write-Host 'AUTO_PROMOTION=NO'
