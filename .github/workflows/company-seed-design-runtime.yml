      - name: Resolve deterministic-or-model design candidate
        id: candidate_route
        if: steps.target.outputs.should_run == 'true'
        env:
          DETERMINISTIC_MATERIALIZED: ${{ steps.deterministic_recovery.outputs.materialized }}
          MODEL_COMPLETE: ${{ steps.design_pipeline.outputs.complete }}
