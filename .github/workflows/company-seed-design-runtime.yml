      - name: Verify design learning context consumption
        if: steps.target.outputs.should_run == 'true' && steps.design_pipeline.outputs.complete == 'true'
        env:
          ARTBOOK_GAME_ID: ${{ matrix.target.game_id }}
          ARTBOOK_DATE: ${{ matrix.target.date }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const gameId=String(process.env.ARTBOOK_GAME_ID||'').trim();
          const date=String(process.env.ARTBOOK_DATE||'').trim();
          const state=JSON.parse(fs.readFileSync('game-seed-state.json','utf8'));
          const status=JSON.parse(fs.readFileSync(path.join('design',gameId,date,'cycle-status.json'),'utf8'));
          const events=(Array.isArray(state?.seedMaterialLearning?.events)?state.seedMaterialLearning.events:[])
            .filter(event=>String(event?.gameId||'').trim()===gameId&&String(event?.reviewStage||'').trim()==='DESIGN_STRICT_REVIEW')
            .slice(-8);
          const expectedCount=events.length;
          if(Number(status?.designLearning?.candidateCount)!==expectedCount)throw new Error(`DESIGN_LEARNING_CANDIDATE_COUNT_MISMATCH expected=${expectedCount} actual=${status?.designLearning?.candidateCount}`);
          if(status?.designLearning?.usedAsDesignContext!==(expectedCount>0))throw new Error('DESIGN_LEARNING_CONTEXT_USAGE_MISMATCH');
          if(status?.vibe2LearningContextUsed!==(expectedCount>0))throw new Error('VIBE2_LEARNING_CONTEXT_USAGE_MISMATCH');
          if(status?.designLearning?.positiveTrainingEligible!==false)throw new Error('DESIGN_FEEDBACK_MUST_REMAIN_UNVALIDATED');
          if(status?.designLearning?.validatedRuntimeRequiredForPositiveTraining!==true)throw new Error('VALIDATED_RUNTIME_REQUIREMENT_MISSING');
          console.log(`DESIGN_LEARNING_RUNTIME_CHECK=PASS`);
          console.log(`DESIGN_LEARNING_CONTEXT_CANDIDATES=${expectedCount}`);
          console.log(`VIBE2_LEARNING_CONTEXT_USED=${expectedCount>0?'YES':'NO'}`);
          console.log('POSITIVE_TRAINING_FROM_DESIGN_ONLY=NO');
          NODE
      - name: Repair missing pre-promotion design requirements
        if: steps.target.outputs.should_run == 'true' && steps.candidate_route.outputs.ready == 'true'
        env:
          GAME_ID: ${{ matrix.target.game_id }}
          ARTBOOK_DATE: ${{ matrix.target.date }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/company-design-prepromotion-repair.mjs --game-id="$GAME_ID" --date="$ARTBOOK_DATE" --phase=PRE_REVIEW | tee /tmp/prepromotion-repair.txt
          node tools/company-baseline-gate.mjs
          unresolved="$(sed -n 's/^PREPROMOTION_REPAIR_UNRESOLVED=//p' /tmp/prepromotion-repair.txt | tail -n 1)"
          if [ -n "$unresolved" ]; then
            echo "PREPROMOTION_REPAIR_BLOCKED=$unresolved" >&2
            exit 1
          fi
          echo 'PREPROMOTION_REPAIR_GATE=PASS'

      - name: Persist minimum dual-platform design before strict review
        id: minimum_design
        if: steps.target.outputs.should_run == 'true' && steps.candidate_route.outputs.ready == 'true'
        env:
          GAME_ID: ${{ matrix.target.game_id }}
          DESIGN_DATE: ${{ matrix.target.date }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gate="$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {evaluateMinimumDesignContract} from './tools/company-minimum-design-contract.mjs';
          const file=`design/${process.env.GAME_ID}/${process.env.DESIGN_DATE}/design-revised.json`;
          const design=JSON.parse(fs.readFileSync(file,'utf8'));
          const gate=evaluateMinimumDesignContract(design);
          if(!gate.pass)console.error('MINIMUM_DESIGN_BLOCKERS='+gate.blockers.join('|'));
          process.stdout.write(gate.pass?'PASS':'PENDING');
          NODE
          )"
          echo "gate=$gate" >> "$GITHUB_OUTPUT"
          if [[ "$gate" != 'PASS' ]]; then
            echo 'MINIMUM_DESIGN_EARLY_PROMOTION=NO'
            exit 0
          fi
          git config user.name 'jaewoon-minimum-design'
          git config user.email 'minimum-design@users.noreply.github.com'
          game_path="design/$GAME_ID"
          worktree="/tmp/minimum-design-persist-$GAME_ID-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          pushed=0
          for attempt in 1 2 3 4; do
            git fetch origin "$COMPANY_RUNTIME_BRANCH"
            git worktree remove --force "$worktree" 2>/dev/null || true
            rm -rf "$worktree"
            git worktree add --detach "$worktree" "origin/$COMPANY_RUNTIME_BRANCH"
            git -C "$worktree" config user.name 'jaewoon-minimum-design'
            git -C "$worktree" config user.email 'minimum-design@users.noreply.github.com'
            git -C "$worktree" checkout "$GITHUB_SHA" -- "$game_path" 2>/dev/null || cp -R "$game_path" "$(dirname "$worktree/$game_path")/"
            git -C "$worktree" add -- "$game_path"
            if git -C "$worktree" diff --cached --quiet; then pushed=1; break; fi
            git -C "$worktree" commit -m "runtime: minimum dual-platform design $GAME_ID $DESIGN_DATE"
            if git -C "$worktree" push origin "HEAD:refs/heads/$COMPANY_RUNTIME_BRANCH"; then pushed=1; break; fi
            sleep $((attempt * 2))
          done
          git worktree remove --force "$worktree" 2>/dev/null || true
          git worktree prune
          test "$pushed" = 1
          gh workflow run company-design-promotion-sync.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'MINIMUM_DESIGN_CONTRACT=PASS'
          echo 'EARLY_NATIVE_PROMOTION_DISPATCH=YES'
          echo 'STRICT_REVIEW_CONTINUES_IN_PARALLEL=YES'

      - name: Apply strict 30-minute design review
        if: steps.target.outputs.should_run == 'true' && steps.candidate_route.outputs.ready == 'true'
        env:
          GAME_ID: ${{ matrix.target.game_id }}
          ARTBOOK_DATE: ${{ matrix.target.date }}
        shell: bash
        run: |
          set +e
          node tools/company-strict-production-review.mjs --mode=design --game-id="$GAME_ID" --date="$ARTBOOK_DATE"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then echo 'STRICT_DESIGN_GATE=PASS'; else echo 'STRICT_DESIGN_GATE=REVISE_OR_REBUILD'; fi
          exit 0
      - name: Apply review-feedback repair and re-review within this cycle
        if: steps.target.outputs.should_run == 'true' && steps.candidate_route.outputs.ready == 'true'
        env:
          GAME_ID: ${{ matrix.target.game_id }}
          ARTBOOK_DATE: ${{ matrix.target.date }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/company-design-prepromotion-repair.mjs --game-id="$GAME_ID" --date="$ARTBOOK_DATE" --phase=REVIEW_FEEDBACK | tee /tmp/review-feedback-repair.txt
          if grep -q '^PREPROMOTION_REPAIR_CHANGED=YES$' /tmp/review-feedback-repair.txt; then
            node tools/company-baseline-gate.mjs
            set +e
            node tools/company-strict-production-review.mjs --mode=design --game-id="$GAME_ID" --date="$ARTBOOK_DATE"
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then echo 'STRICT_DESIGN_REREVIEW=PASS'; else echo 'STRICT_DESIGN_REREVIEW=REVISE_OR_REBUILD'; fi
          else
            echo 'STRICT_DESIGN_REREVIEW=NO_TARGETED_FIELD_REPAIR_THIS_CYCLE'
          fi
          echo 'REVIEW_FEEDBACK_REPAIR_PER_CYCLE=1'
          echo 'DESIGN_GATE_TOTAL_REPAIR_ATTEMPTS=UNLIMITED'
      - name: Verify baseline and strict review contract
        if: steps.target.outputs.should_run == 'true' && steps.candidate_route.outputs.ready == 'true'
        env:
          ARTBOOK_GAME_ID: ${{ matrix.target.game_id }}
          ARTBOOK_DATE: ${{ matrix.target.date }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';const gameId=process.env.ARTBOOK_GAME_ID,date=process.env.ARTBOOK_DATE,base=path.join('design',gameId,date);const status=JSON.parse(fs.readFileSync(path.join(base,'cycle-status.json'),'utf8'));if(status.productionClass!=='DESIGN_ONLY')throw new Error('DESIGN_ONLY required');const roadmap=JSON.parse(fs.readFileSync('company-learning/platform-release-roadmap.json','utf8'));const deterministic=roadmap?.developmentLifecycleMachine?.deterministicGateAuthority?.enabled===true&&roadmap?.developmentLifecycleMachine?.deterministicGateAuthority?.aiMayDecidePassFail===false;if(!deterministic&&(status.departments?.count!==5||status.departments?.leadModelsDistinct!==true))throw new Error('legacy five department lead contract failed');if(deterministic&&status?.baselineGate?.evidence?.deterministicDesignGate?.pass!==true)throw new Error('deterministic design evidence missing');const strict=JSON.parse(fs.readFileSync(path.join(base,'strict-design-review.json'),'utf8'));if(!['PASS','REVISE','REBUILD'].includes(strict.verdict))throw new Error('strict verdict missing');if(fs.existsSync(path.join('artbook-submissions',gameId,'current.json')))console.log('LEGACY_PREPROMOTION_ARTBOOK_IGNORED=YES');console.log(`STRICT_DESIGN_SCORE=${strict.totalScore}`);console.log(`STRICT_DESIGN_VERDICT=${strict.verdict}`);console.log(`STRICT_DESIGN_READY_FOR_PROMOTION=${status?.baselineGate?.state==='DESIGN_BASELINE_READY'&&status?.baselineGate?.ready===true&&strict.verdict==='PASS'&&Number(strict.totalScore)>=80&&Array.isArray(strict.hardFailures)&&strict.hardFailures.length===0?'YES':'NO'}`);console.log(`STRICT_DESIGN_EXCELLENT=${strict.verdict==='PASS'&&Number(strict.totalScore)>=90?'YES':'NO'}`);console.log('STRICT_DESIGN_SCORE_SYNTHESIZED=NO');console.log('STRICT_DESIGN_VERDICT_SYNTHESIZED=NO');console.log('DESIGN_ONLY_ARTBOOK_BEFORE_PROMOTION=NO');
          NODE
      - name: Revalidate shared worker context before design persistence
        run: node tools/company-shared-context.mjs --output=/tmp/company-shared-context-design-persist.json

      - name: Persist validated design evidence to company runtime branch
        if: steps.target.outputs.should_run == 'true' && steps.candidate_route.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-seed-design';git config user.email 'seed-design@users.noreply.github.com'
          game_path="design/${{ matrix.target.game_id }}";seed_changed=0
          cmp -s game-seed-state.json /tmp/company-runtime-seed-state-before.json || seed_changed=1
          if [ "$seed_changed" = 1 ]; then cp game-seed-state.json "/tmp/seed-design-candidate-${{ matrix.target.game_id }}.json"; fi
          git add -- "$game_path";[ "$seed_changed" = 1 ] && git add -- game-seed-state.json || true
          git diff --cached --quiet && { echo 'SEED_DESIGN_RUNTIME_CHANGE=NO'; exit 0; }
          git commit -m "runtime: DESIGN_ONLY cycle ${{ matrix.target.game_id }} ${{ matrix.target.date }}"
          generated_commit="$(git rev-parse HEAD)"
          runtime_worktree="/tmp/seed-design-persist-${{ matrix.target.game_id }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          pushed=0
          for attempt in 1 2 3 4; do
            git fetch origin "$COMPANY_RUNTIME_BRANCH"
            git worktree remove --force "$runtime_worktree" 2>/dev/null || true
            rm -rf "$runtime_worktree"
            git worktree prune
            git worktree add --detach "$runtime_worktree" "origin/$COMPANY_RUNTIME_BRANCH"
            git -C "$runtime_worktree" config user.name 'jaewoon-seed-design'
            git -C "$runtime_worktree" config user.email 'seed-design@users.noreply.github.com'
            git -C "$runtime_worktree" checkout "$generated_commit" -- "$game_path"
            if [ "$seed_changed" = 1 ]; then
              TARGET_GAME_ID="${{ matrix.target.game_id }}" \
              CANDIDATE_SEED_STATE="/tmp/seed-design-candidate-${{ matrix.target.game_id }}.json" \
              RUNTIME_SEED_STATE="$runtime_worktree/game-seed-state.json" \
              node --input-type=module <<'NODE'
              import fs from 'node:fs';
              const gameId=String(process.env.TARGET_GAME_ID||'').trim();
              const candidate=JSON.parse(fs.readFileSync(process.env.CANDIDATE_SEED_STATE,'utf8'));
              const runtime=JSON.parse(fs.readFileSync(process.env.RUNTIME_SEED_STATE,'utf8'));
              const seed=(candidate.seeds||[]).find(row=>String(row?.gameId||'').trim()===gameId);
              if(!seed)throw new Error('TARGET_SEED_MERGE_SOURCE_MISSING:'+gameId);
              runtime.seeds=Array.isArray(runtime.seeds)?runtime.seeds:[];
              const index=runtime.seeds.findIndex(row=>String(row?.gameId||'').trim()===gameId);
              if(index<0)runtime.seeds.push(seed);
              else runtime.seeds[index]=seed;
              fs.writeFileSync(process.env.RUNTIME_SEED_STATE,JSON.stringify(runtime,null,2)+'\n');
              console.log('SEED_RUNTIME_TARGET_MERGE=YES|game='+gameId);
              NODE
            fi
            git -C "$runtime_worktree" add -- "$game_path"
            if [ "$seed_changed" = 1 ]; then git -C "$runtime_worktree" add -- game-seed-state.json; fi
            if git -C "$runtime_worktree" diff --cached --quiet; then pushed=1; break; fi
            git -C "$runtime_worktree" commit -m "runtime: DESIGN_ONLY cycle ${{ matrix.target.game_id }} ${{ matrix.target.date }}"
            if git -C "$runtime_worktree" push origin "HEAD:refs/heads/$COMPANY_RUNTIME_BRANCH"; then pushed=1; break; fi
            sleep $((attempt * 2))
          done
          git worktree remove --force "$runtime_worktree" 2>/dev/null || true
          git worktree prune
          test "$pushed" = 1
          echo 'SEED_DESIGN_RUNTIME_PERSIST_WORKTREE=ISOLATED'
          echo 'SEED_DESIGN_RUNTIME_CHANGE=PERSISTED'
          echo 'PUBLIC_MAIN_WRITE=NO'

      - name: Dispatch per-game promotion reconciliation on own strict PASS
        if: steps.target.outputs.should_run == 'true' && steps.candidate_route.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_ID: ${{ matrix.target.game_id }}
          ARTBOOK_DATE: ${{ matrix.target.date }}
        shell: bash
        run: |
          set -euo pipefail
          ready="$(node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';
          const base=path.join('design',process.env.GAME_ID,process.env.ARTBOOK_DATE);
          const status=JSON.parse(fs.readFileSync(path.join(base,'cycle-status.json'),'utf8'));
          const review=JSON.parse(fs.readFileSync(path.join(base,'strict-design-review.json'),'utf8'));
          const pass=status?.baselineGate?.state==='DESIGN_BASELINE_READY'&&status?.baselineGate?.ready===true&&review?.verdict==='PASS'&&Number(review?.totalScore)>=80&&Array.isArray(review?.hardFailures)&&review.hardFailures.length===0;
          process.stdout.write(pass?'YES':'NO');
          NODE
          )"
          if [ "$ready" != "YES" ]; then
            echo "PER_GAME_PROMOTION_DISPATCH=NO|game=$GAME_ID|reason=OWN_GATE_NOT_PASS"
            exit 0
          fi
          gh workflow run company-design-promotion-sync.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "PER_GAME_PROMOTION_DISPATCH=YES|game=$GAME_ID"
          echo 'PER_GAME_PROMOTION_FORCE=NO'
          echo 'PORTFOLIO_WIDE_PASS_WAIT=NO'
          echo 'WEB_DEVELOPMENT_START=NO'

  mark-design-engine-canary:
    needs: [resolve-seed-targets, design-cycle]
    if: always() && needs.resolve-seed-targets.outputs.run == 'true' && needs.resolve-seed-targets.outputs.canary_mode == 'true' && needs.design-cycle.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Persist verified design engine canary
        env:
          ENGINE_DIGEST: ${{ needs.resolve-seed-targets.outputs.engine_digest }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-design-canary'
          git config user.email 'design-canary@users.noreply.github.com'
          cat > /tmp/design-engine-canary.json <<JSON
          {
            "version": 1,
            "engineDigest": "$ENGINE_DIGEST",
            "engineSha": "$GITHUB_SHA",
            "verifiedGameCount": 2,
            "verifiedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "policy": "CANARY_TWO_GAMES_BEFORE_FIVE_LANE_BATCH"
          }
          JSON
          pushed=0
          for attempt in 1 2 3 4; do
            git fetch origin "$COMPANY_RUNTIME_BRANCH"
            git checkout -B design-canary-runtime "origin/$COMPANY_RUNTIME_BRANCH"
            cp /tmp/design-engine-canary.json design-engine-canary.json
            git add -- design-engine-canary.json
            if git diff --cached --quiet; then pushed=1; break; fi
            git commit -m "runtime: verify DESIGN_ONLY engine canary"
            if git push origin "HEAD:refs/heads/$COMPANY_RUNTIME_BRANCH"; then pushed=1; break; fi
            sleep $((attempt * 2))
          done
          test "$pushed" = 1
          echo 'DESIGN_ENGINE_CANARY=VERIFIED'
          echo "DESIGN_ENGINE_DIGEST=$ENGINE_DIGEST"
          echo 'PUBLIC_MAIN_WRITE=NO'

  sync-strict-design-scores:
    needs: [resolve-seed-targets, design-cycle]
    if: always() && needs.resolve-seed-targets.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Bind latest post-reset strict design scores once
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-design-score-sync'
          git config user.email 'design-score-sync@users.noreply.github.com'
          pushed=0
          for attempt in 1 2 3 4; do
            git fetch origin "$COMPANY_RUNTIME_BRANCH"
            git checkout -B design-score-sync "origin/$COMPANY_RUNTIME_BRANCH"
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const state=JSON.parse(fs.readFileSync('game-seed-state.json','utf8'));
          const catalog=JSON.parse(fs.readFileSync('game-catalog.json','utf8'));
          const canonical=new Set((catalog.games||[])
            .filter(game=>['ACTIVE','REBUILD'].includes(String(game.lifecycleState||'ACTIVE').toUpperCase()))
            .map(game=>String(game.id||'').trim())
            .filter(Boolean));
          const resetAt=Date.parse(state?.ownerAllGamesDesignReset?.updatedAt||'')||0;
          const resetDate=resetAt?new Date(resetAt).toISOString().slice(0,10):'';
          const designReviewEligible=seed=>{
            const status=String(seed?.status||'').trim().toUpperCase();
            return !['DISCARDED','REMOVED'].includes(status)&&(status==='ACTIVE'||seed?.promotion?.strictDesignReviewContinuesInParallel===true);
          };
          let bound=0,cleared=0;
          for(const seed of state.seeds||[]){
            const gameId=String(seed?.gameId||'').trim();
            if(!canonical.has(gameId)||!designReviewEligible(seed))continue;
            const root=path.join('design',gameId);
            const dates=fs.existsSync(root)?fs.readdirSync(root,{withFileTypes:true})
              .filter(entry=>entry.isDirectory()&&/^\d{4}-\d{2}-\d{2}$/.test(entry.name))
              .map(entry=>entry.name).sort().reverse():[];
            let selected=null;
            for(const date of dates){
              const reviewPath=path.join(root,date,'strict-design-review.json');
              if(!fs.existsSync(reviewPath))continue;
              const review=JSON.parse(fs.readFileSync(reviewPath,'utf8'));
              const score=Number(review.totalScore);
              if(!Number.isFinite(score)||score<0||score>100)continue;
              const evidenceAt=Date.parse(review.reviewedAt||review.generatedAt||review.updatedAt||review.createdAt||'')||0;
              if(resetAt){
                if(evidenceAt&&evidenceAt<resetAt)continue;
                if(!evidenceAt&&date<=resetDate)continue;
              }
              selected={review,date,reviewPath,score};
              break;
            }
            if(!selected){
              if(seed.strictDesignReview!=null||seed.strictDesignReviewUpdatedAt!=null){
                seed.strictDesignReview=null;
                seed.strictDesignReviewUpdatedAt=null;
                cleared++;
              }
              continue;
            }
            const next={
              verdict:String(selected.review.verdict||'').toUpperCase(),
              totalScore:selected.score,
              hardFailures:Array.isArray(selected.review.hardFailures)?selected.review.hardFailures:[],
              evidencePath:selected.reviewPath.replaceAll('\\','/'),
              passThreshold:Number(selected.review.passThreshold||80)
            };
            if(JSON.stringify(seed.strictDesignReview||null)===JSON.stringify(next))continue;
            seed.strictDesignReview=next;
            seed.strictDesignReviewUpdatedAt=new Date().toISOString();
            bound++;
          }
          if(bound>0||cleared>0)fs.writeFileSync('game-seed-state.json',JSON.stringify(state,null,2)+'\n');
          console.log(`STRICT_DESIGN_SCORE_BOUND_COUNT=${bound}`);
          console.log(`STRICT_DESIGN_SCORE_STALE_CLEAR_COUNT=${cleared}`);
          console.log(`STRICT_DESIGN_SCORE_RESET_CUTOFF=${state?.ownerAllGamesDesignReset?.updatedAt||'NONE'}`);
          console.log('STRICT_DESIGN_SCORE_SOURCE=STRICT_REVIEW_DIRECT_EVIDENCE');
          NODE
            git add -- game-seed-state.json
            if git diff --cached --quiet; then pushed=1; echo 'STRICT_DESIGN_SCORE_SYNC_CHANGE=NO'; break; fi
            git commit -m 'runtime: sync post-reset strict design scores'
            if git push origin "HEAD:refs/heads/$COMPANY_RUNTIME_BRANCH"; then pushed=1; echo 'STRICT_DESIGN_SCORE_SYNC=PERSISTED'; break; fi
            sleep $((attempt * 2))
          done
          test "$pushed" = 1

  continue-seed-supply:
    needs: [resolve-seed-targets, design-cycle, mark-design-engine-canary, sync-strict-design-scores]
    if: always() && needs.resolve-seed-targets.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false

      - name: Continue seed supply and immediately repeat failed design gates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$COMPANY_RUNTIME_BRANCH"
          pending="$(node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import {execFileSync} from 'node:child_process';
          const branch=process.env.COMPANY_RUNTIME_BRANCH;
          const show=file=>execFileSync('git',['show',`origin/${branch}:${file}`],{encoding:'utf8',maxBuffer:32*1024*1024});
          const state=JSON.parse(show('game-seed-state.json'));let count=0;
          const resetAt=Date.parse(state?.ownerAllGamesDesignReset?.updatedAt||'')||0;
          const resetDate=resetAt?new Date(resetAt).toISOString().slice(0,10):'';
          const designReviewEligible=seed=>{const status=String(seed?.status||'').trim().toUpperCase();return !['DISCARDED','REMOVED'].includes(status)&&(status==='ACTIVE'||seed?.promotion?.strictDesignReviewContinuesInParallel===true);};
          for(const seed of state.seeds||[]){
            if(!designReviewEligible(seed))continue;
            let passed=false;
            try{
              const tree=execFileSync('git',['ls-tree','-r','--name-only',`origin/${branch}`,`design/${seed.gameId}`],{encoding:'utf8',maxBuffer:32*1024*1024}).split(/\r?\n/).filter(Boolean);
              const dates=[...new Set(tree.map(file=>file.match(new RegExp(`^design/${String(seed.gameId).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}/(\\d{4}-\\d{2}-\\d{2})/`))?.[1]).filter(Boolean))].sort().reverse();
              for(const date of dates){
                const base=`design/${seed.gameId}/${date}`;
                const status=JSON.parse(show(`${base}/cycle-status.json`));const review=JSON.parse(show(`${base}/strict-design-review.json`));
                const evidenceAt=Date.parse(review.reviewedAt||review.generatedAt||review.updatedAt||review.createdAt||'')||0;
                if(resetAt){
                  if(evidenceAt&&evidenceAt<resetAt)continue;
                  if(!evidenceAt&&date<=resetDate)continue;
                }
                if(status?.baselineGate?.state==='DESIGN_BASELINE_READY'&&status?.baselineGate?.ready===true&&review.verdict==='PASS'&&Number(review.totalScore)>=80&&Array.isArray(review.hardFailures)&&review.hardFailures.length===0){passed=true;break;}
              }
            }catch{}
            if(!passed)count++;
          }
          process.stdout.write(String(count));
          NODE
          )"
          echo "DESIGN_GATE_REPAIR_PENDING=$pending"
          active_other="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/company-seed-design-runtime.yml/runs?per_page=20" | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const j=JSON.parse(s),current=Number(process.env.GITHUB_RUN_ID);const n=(j.workflow_runs||[]).filter(r=>r.id!==current&&['queued','in_progress','pending','waiting','requested'].includes(r.status)).length;process.stdout.write(String(n));})")"
          echo "DESIGN_GATE_ACTIVE_OTHER_RUNS=$active_other"
          quota_blocked="$(node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          const clean=value=>String(value??'').trim();
          const uniq=values=>[...new Set(values.map(clean).filter(Boolean))];
          const roles=['planning','graphics','development','qa','audio'];
          const leads=uniq(clean(process.env.COMPANY_GEMINI_LEAD_MODELS).split(',')).slice(0,roles.length);
          const fallback=uniq(clean(process.env.COMPANY_GEMINI_FALLBACK_MODELS).split(','));
          const laneSpec=clean(process.env.COMPANY_GEMINI_LEAD_FALLBACK_LANES);
          const configuredLanes=Object.fromEntries(roles.map(role=>[role,[]]));
          for(const entry of laneSpec.split(';').map(clean).filter(Boolean)){
            const at=entry.indexOf(':');if(at<1)continue;
            const role=clean(entry.slice(0,at));if(!roles.includes(role))continue;
            configuredLanes[role]=uniq(entry.slice(at+1).split('|'));
          }
          const lanes=Object.fromEntries(roles.map((role,index)=>[role,uniq([leads[index],...configuredLanes[role]])]));
          const branch=process.env.COMPANY_RUNTIME_BRANCH;
          const show=file=>execFileSync('git',['show',`origin/${branch}:${file}`],{encoding:'utf8',maxBuffer:32*1024*1024});
          const exists=file=>{try{execFileSync('git',['cat-file','-e',`origin/${branch}:${file}`],{stdio:'ignore'});return true;}catch{return false;}};
          const state=JSON.parse(show('game-seed-state.json'));
          const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
          const get=t=>parts.find(x=>x.type===t)?.value||'';const date=`${get('year')}-${get('month')}-${get('day')}`;
          const permanentUnavailable=/no longer available to new users|NOT_FOUND|PERMISSION_DENIED/i;
          const retryableQuota=/GenerateRequestsPerDayPerProjectPerModel-FreeTier|requests per day|daily quota|RESOURCE_EXHAUSTED|Quota exceeded/i;
          const dailyQuota=/GenerateRequestsPerDayPerProjectPerModel-FreeTier|requests per day|daily quota/i;
          const DAILY_QUOTA_PROBE_MS=60*60*1000;
          const providerRetryMs=row=>{
            const error=clean(row?.lastError);
            const seconds=Number(error.match(/Please retry in\s+([0-9.]+)s/i)?.[1]||error.match(/"retryDelay"\s*:\s*"([0-9.]+)s"/i)?.[1]);
            const providerMs=Number.isFinite(seconds)&&seconds>0?Math.ceil(seconds*1000):0;
            return dailyQuota.test(error)?Math.max(DAILY_QUOTA_PROBE_MS,providerMs):(providerMs||60*60*1000);
          };
          const modelUnavailable=row=>{
            const error=clean(row?.lastError);
            if(permanentUnavailable.test(error))return true;
            if(!retryableQuota.test(error))return false;
            const updated=Date.parse(row?.updatedAt||'');
            if(!Number.isFinite(updated))return true;
            return Date.now()<updated+providerRetryMs(row);
          };
          const designReviewEligible=seed=>{const status=clean(seed?.status).toUpperCase();return !['DISCARDED','REMOVED'].includes(status)&&(status==='ACTIVE'||seed?.promotion?.strictDesignReviewContinuesInParallel===true);};
          let blocked=0;
          for(const seed of state.seeds||[]){
            if(!designReviewEligible(seed))continue;
            const cpPath=`design/${seed.gameId}/${date}/design-checkpoint.json`;
            if(!exists(cpPath))continue;
            let cp={};try{cp=JSON.parse(show(cpPath));}catch{continue;}
            const deterministicRows=Object.entries(cp.phases||{}).filter(([name,value])=>/^deterministic_pre_gate(?:_after_repair_\d+)?$/.test(name)&&value&&typeof value==='object');
            const deterministicRecoverable=deterministicRows.some(([,value])=>{
              const threshold=Math.max(80,Number(value.passMinimum||80));
              const hard=Array.isArray(value.hardFailures)?value.hardFailures:[];
              const critical=Array.isArray(value.criticalAxisFailures)?value.criticalAxisFailures:[];
              return cp.phases?.designer_draft&&Number(value.totalScore)>=threshold&&hard.length===0&&critical.length===0;
            });
            if(deterministicRecoverable)continue;
            const exhausted=new Set(Object.entries(cp.modelHealth||{}).filter(([,row])=>modelUnavailable(row)).map(([model])=>clean(model).replace(/^gemini:/,'')));
            if(!exhausted.size)continue;
            const tasks=cp.tasks&&typeof cp.tasks==='object'?cp.tasks:{};
            const phases=cp.phases&&typeof cp.phases==='object'?cp.phases:{};
            const missingRoles=roles.filter(role=>!Object.prototype.hasOwnProperty.call(tasks,`five_lead_reviews::${role}`));
            const currentPhase=clean(cp.currentPhase).toUpperCase()||'BOOTSTRAP';
            const leadPhaseActive=currentPhase==='DEPARTMENT_REVIEWS'||missingRoles.length<roles.length;
            const roleBlocked=leadPhaseActive&&missingRoles.some(role=>lanes[role].every(model=>exhausted.has(model)));
            const designerModel=clean(process.env.COMPANY_GEMINI_DESIGNER_MODEL);
            const designerBlocked=!Object.prototype.hasOwnProperty.call(phases,'designer_draft')&&exhausted.has(designerModel);
            if(roleBlocked||(!leadPhaseActive&&designerBlocked))blocked++;
          }
          process.stdout.write(String(blocked));
          NODE
          )"
          echo "DESIGN_GATE_QUOTA_BLOCKED=$quota_blocked"
          echo 'DESIGN_DETERMINISTIC_RECOVERABLE_EXCLUDED_FROM_QUOTA_WAIT=YES'
          echo 'DESIGN_DAILY_QUOTA_IMMEDIATE_REDISPATCH=NO'
          all_quota_blocked=0
          if [[ "$pending" =~ ^[1-9][0-9]*$ && "$quota_blocked" == "$pending" ]]; then all_quota_blocked=1; fi
          if [ "$all_quota_blocked" = 0 ]; then
            gh workflow run company-game-seed-bootstrap.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo 'GAME_SEED_CONTINUATION_DISPATCHED=YES'
            echo 'GAME_SEED_CONTINUATION_SCOPE=BATCH_ONCE_AFTER_MATRIX'
          else
            echo 'GAME_SEED_CONTINUATION_DISPATCHED=NO_GEMINI_QUOTA'
            echo 'DESIGN_GATE_QUOTA_STATE=WAITING_FOR_GEMINI_QUOTA'
          fi
          if [ "$all_quota_blocked" = 1 ]; then
            echo 'DESIGN_GATE_REPAIR_LOOP_DISPATCH=WAITING_FOR_GEMINI_QUOTA'
          elif [[ "$pending" =~ ^[1-9][0-9]*$ && "$active_other" == '0' ]]; then
            gh workflow run company-seed-design-runtime.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo 'DESIGN_GATE_REPAIR_LOOP_DISPATCH=YES'
          elif [[ "$pending" =~ ^[1-9][0-9]*$ ]]; then
            echo 'DESIGN_GATE_REPAIR_LOOP_DISPATCH=SKIP_ACTIVE_SIBLING'
          else
            echo 'DESIGN_GATE_REPAIR_LOOP_DISPATCH=NO_ALL_PASS'
          fi
          echo 'DESIGN_GATE_REPAIR_LIMIT=UNLIMITED'
