name: Company Seed DESIGN_ONLY Runtime

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *' # 01:00 KST fallback; event chain remains primary

permissions:
  contents: write
  actions: write

concurrency:
  group: company-seed-design-runtime
  cancel-in-progress: true

env:
  COMPANY_RUNTIME_BRANCH: company-runtime
  OLLAMA_HOST: 127.0.0.1:11434
  OLLAMA_VERSION: '0.33.3'
  OLLAMA_MAX_LOADED_MODELS: '3'
  COMPANY_MODEL_PHASE_CONCURRENCY: '3'
  COMPANY_MODEL_KEEP_ALIVE: '1m'
  COMPANY_MODEL_CALL_TIMEOUT_MS: '75000'

jobs:
  resolve-seed-targets:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.targets.outputs.run }}
      targets: ${{ steps.targets.outputs.targets }}
      parallel_max: ${{ steps.targets.outputs.parallel_max }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Load latest company runtime state
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --heads origin "$COMPANY_RUNTIME_BRANCH" >/dev/null 2>&1; then
            echo 'COMPANY_RUNTIME_STATE=NOT_CREATED'
            exit 0
          fi
          git fetch origin "$COMPANY_RUNTIME_BRANCH"
          for runtime_path in game-seed-state.json design; do
            if git cat-file -e "origin/$COMPANY_RUNTIME_BRANCH:$runtime_path" 2>/dev/null; then
              git checkout "origin/$COMPANY_RUNTIME_BRANCH" -- "$runtime_path"
            fi
          done
          git reset -- game-seed-state.json design >/dev/null 2>&1 || true
          echo 'COMPANY_RUNTIME_STATE_OVERLAY=YES'
          echo 'DESIGN_ONLY_ARTBOOK_OVERLAY=NO'
          echo 'COMPANY_ENGINE_SOURCE=main'
      - name: Resolve centrally capped active incomplete GAME_SEED targets
        id: targets
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import fs from 'node:fs';
          import path from 'node:path';
          import {designArtifactsMatchSeed,seedRevisionOf} from './tools/company-design-seed-provenance.mjs';
          const policy=fs.readFileSync('COMPANY_FLOW.md','utf8');
          const maxMatch=policy.match(/concurrentGameWipMax:\s*(\d+)/);
          const designWipMax=Number(maxMatch?.[1]||0);
          if(!Number.isInteger(designWipMax)||designWipMax<1)throw new Error('CENTRAL_GAME_WIP_MAX_REQUIRED');
          const state=(()=>{try{return JSON.parse(fs.readFileSync('game-seed-state.json','utf8'));}catch{return{seeds:[]};}})();
          const active=(state.seeds||[]).filter(seed=>String(seed.status||'').toUpperCase()==='ACTIVE');
          const strictPassFor=(seed)=>{
            const gameRoot=path.join('design',String(seed.gameId));
            if(!fs.existsSync(gameRoot))return false;
            try{
              const dates=fs.readdirSync(gameRoot,{withFileTypes:true}).filter(x=>x.isDirectory()).map(x=>x.name).sort().reverse();
              for(const date of dates){
                const base=path.join(gameRoot,date);
                const statusPath=path.join(base,'cycle-status.json');
                const strictPath=path.join(base,'strict-design-review.json');
                if(!fs.existsSync(statusPath)||!fs.existsSync(strictPath))continue;
                const status=JSON.parse(fs.readFileSync(statusPath,'utf8'));
                const review=JSON.parse(fs.readFileSync(strictPath,'utf8'));
                const provenance=designArtifactsMatchSeed({gameId:String(seed.gameId),date,seed});
                const ready=status?.baselineGate?.state==='DESIGN_BASELINE_READY'&&status?.baselineGate?.ready===true;
                if(provenance.match&&ready&&review.verdict==='PASS'&&Number(review.totalScore)>=80&&Array.isArray(review.hardFailures)&&review.hardFailures.length===0)return true;
              }
            }catch{}
            return false;
          };
          const pending=active.filter(seed=>!strictPassFor(seed)).sort((a,b)=>String(a.createdAt||'').localeCompare(String(b.createdAt||''))).slice(0,designWipMax);
          const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
          const get=t=>parts.find(x=>x.type===t)?.value||'';const date=`${get('year')}-${get('month')}-${get('day')}`;
          const targets=pending.map(seed=>({game_id:seed.gameId,game_name:seed.gameName||seed.gameId,seed_id:seed.seedId,seed_revision:seedRevisionOf(seed),category:seed.GAME_CATEGORY,date,multiplayer_mode:seed.MULTIPLAYER_DESIGN_MODE||'SINGLE',target_session_minutes:Number(seed.TARGET_SESSION_MINUTES||30)}));
          console.log(`run=${targets.length?'true':'false'}`);
          console.log(`targets=${JSON.stringify(targets)}`);
          console.log(`parallel_max=${designWipMax}`);
          console.error(`GAME_SEED_DESIGN_TARGET_COUNT=${targets.length}`);
          console.error(`GAME_DESIGN_WIP_MAX=${designWipMax}`);
          console.error('GAME_DESIGN_WIP_SOURCE=COMPANY_FLOW');
          console.error('STRICT_DESIGN_PASS_THRESHOLD=80');
          console.error('STRICT_DESIGN_EXCELLENT_THRESHOLD=90');
          console.error('DESIGN_SEED_PROVENANCE_REQUIRED=YES');
          console.error('DESIGN_ONLY_ARTBOOK_BEFORE_PROMOTION=NO');
          NODE

  design-cycle:
    needs: resolve-seed-targets
    if: needs.resolve-seed-targets.outputs.run == 'true'
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.resolve-seed-targets.outputs.parallel_max) }}
      matrix:
        target: ${{ fromJSON(needs.resolve-seed-targets.outputs.targets) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Checkout isolated company runtime branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$COMPANY_RUNTIME_BRANCH"
          game_path="design/${{ matrix.target.game_id }}"
          for runtime_path in game-seed-state.json "$game_path"; do
            if git cat-file -e "origin/$COMPANY_RUNTIME_BRANCH:$runtime_path" 2>/dev/null; then git checkout "origin/$COMPANY_RUNTIME_BRANCH" -- "$runtime_path"; fi
          done
          git reset -- game-seed-state.json "$game_path" >/dev/null 2>&1 || true
          test -f game-seed-state.json
          cp game-seed-state.json /tmp/company-runtime-seed-state-before.json
          echo 'COMPANY_RUNTIME_STATE_OVERLAY=TARGET_ONLY'
          echo 'DESIGN_ONLY_ARTBOOK_OVERLAY=NO'
          echo 'PUBLIC_MAIN_WRITE=NO'
      - name: Revalidate current seed target
        id: target
        env:
          TARGET_GAME_ID: ${{ matrix.target.game_id }}
          TARGET_SEED_ID: ${{ matrix.target.seed_id }}
          TARGET_SEED_REVISION: ${{ matrix.target.seed_revision }}
        shell: bash
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import fs from 'node:fs';import path from 'node:path';
          import {designArtifactsMatchSeed,seedRevisionOf} from './tools/company-design-seed-provenance.mjs';
          const gameId=String(process.env.TARGET_GAME_ID||'').trim(),seedId=String(process.env.TARGET_SEED_ID||'').trim(),seedRevision=String(process.env.TARGET_SEED_REVISION||'').trim();
          const state=JSON.parse(fs.readFileSync('game-seed-state.json','utf8'));const seed=(state.seeds||[]).find(x=>String(x.gameId)===gameId&&String(x.status).toUpperCase()==='ACTIVE');
          const targetCurrent=Boolean(seed&&String(seed.seedId)===seedId&&seedRevisionOf(seed)===seedRevision);
          let strictPass=false;
          const gameRoot=path.join('design',gameId);
          if(targetCurrent&&fs.existsSync(gameRoot)){
            try{
              const dates=fs.readdirSync(gameRoot,{withFileTypes:true}).filter(x=>x.isDirectory()).map(x=>x.name).sort().reverse();
              for(const date of dates){
                const base=path.join(gameRoot,date),statusPath=path.join(base,'cycle-status.json'),strictPath=path.join(base,'strict-design-review.json');
                if(!fs.existsSync(statusPath)||!fs.existsSync(strictPath))continue;
                const status=JSON.parse(fs.readFileSync(statusPath,'utf8')),review=JSON.parse(fs.readFileSync(strictPath,'utf8'));
                const provenance=designArtifactsMatchSeed({gameId,date,seed});
                if(provenance.match&&status?.baselineGate?.state==='DESIGN_BASELINE_READY'&&status?.baselineGate?.ready===true&&review.verdict==='PASS'&&Number(review.totalScore)>=80&&Array.isArray(review.hardFailures)&&review.hardFailures.length===0){strictPass=true;break;}
              }
            }catch{}
          }
          console.log(`should_run=${targetCurrent&&!strictPass?'true':'false'}`);
          NODE
      - name: Static strict contracts
        if: steps.target.outputs.should_run == 'true'
        run: |
          node --check tools/game-seed-state.mjs
          node --check tools/company-game-seed-contract.mjs
          node --check tools/company-design-seed-provenance.mjs
          node --check tools/company-strict-production-review.mjs
          node --check tools/company-design-prepromotion-repair.mjs
          node --check tools/company-design-cycle.mjs
      - name: Restore Ollama model cache
        if: steps.target.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-seed-design-${{ runner.os }}-${{ hashFiles('company-directive.json') }}
          restore-keys: |
            ollama-seed-design-${{ runner.os }}-
      - name: Resolve configured free department models
        id: models
        if: steps.target.outputs.should_run == 'true'
        shell: bash
        run: |
          node --input-type=module <<'NODE' > /tmp/models.txt
          import fs from 'node:fs';const d=JSON.parse(fs.readFileSync('company-directive.json','utf8'));const roles=['planning','graphics','development','qa','balance'];const pool=[...new Set((d.ai?.modelPool||[]).map(String).map(x=>x.trim()).filter(Boolean))];const leads=roles.map(role=>String(d.ai?.departmentLeadModels?.[role]||'').trim());if(pool.length<Number(d.ai?.minDistinctModelsPerDepartment||3))throw new Error('model pool too small');if(new Set(leads).size<5)throw new Error('five distinct lead models required');for(const lead of leads)if(!pool.includes(lead))throw new Error(`lead not in pool: ${lead}`);for(const model of pool)console.log(model);
          NODE
          primary="$(head -n 1 /tmp/models.txt)"; test -n "$primary"; echo "primary_model=$primary" >> "$GITHUB_OUTPUT"
      - name: Prepare cached local Ollama runtime
        if: steps.target.outputs.should_run == 'true'
        uses: ./.github/actions/prepare-ollama
        with:
          model: ${{ steps.models.outputs.primary_model }}
          version: ${{ env.OLLAMA_VERSION }}
          pull-model: 'true'
      - name: Pull only missing configured free department models
        if: steps.target.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ollama list | awk 'NR>1 {print $1}' > /tmp/ollama-present-models.txt
          while IFS= read -r model; do [ -z "$model" ] && continue; grep -Fxq "$model" /tmp/ollama-present-models.txt || { ollama pull "$model"; printf '%s\n' "$model" >> /tmp/ollama-present-models.txt; }; done < /tmp/models.txt
          echo 'PAID_API=NO'
      - name: Run seed-backed DESIGN_ONLY pipeline without artbook
        if: steps.target.outputs.should_run == 'true'
        env:
          ARTBOOK_GAME_ID: ${{ matrix.target.game_id }}
          ARTBOOK_DATE: ${{ matrix.target.date }}
        run: node tools/artbook-production-pipeline.mjs
      - name: Bind generated design to current seed provenance
        if: steps.target.outputs.should_run == 'true'
        env:
          GAME_ID: ${{ matrix.target.game_id }}
          ARTBOOK_DATE: ${{ matrix.target.date }}
          TARGET_SEED_ID: ${{ matrix.target.seed_id }}
          TARGET_SEED_REVISION: ${{ matrix.target.seed_revision }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {loadSeedState,activeSeedForGame} from './tools/game-seed-state.mjs';
          import {seedRevisionOf,stampDesignSeedProvenance} from './tools/company-design-seed-provenance.mjs';
          const gameId=String(process.env.GAME_ID||'').trim(),date=String(process.env.ARTBOOK_DATE||'').trim();
          const expectedSeedId=String(process.env.TARGET_SEED_ID||'').trim(),expectedRevision=String(process.env.TARGET_SEED_REVISION||'').trim();
          const seed=activeSeedForGame(loadSeedState(),gameId);
          if(!seed||String(seed.seedId||'').trim()!==expectedSeedId||seedRevisionOf(seed)!==expectedRevision)throw new Error('DESIGN_SEED_TARGET_CHANGED_DURING_RUN');
          const result=stampDesignSeedProvenance({gameId,date,seed});
          if(!result.match)throw new Error(`DESIGN_SEED_PROVENANCE_BIND_FAILED ${result.reason}`);
          console.log('DESIGN_SEED_PROVENANCE_BIND=PASS');
          NODE
      - name: Repair missing pre-promotion design requirements
        if: steps.target.outputs.should_run == 'true'
        env:
          GAME_ID: ${{ matrix.target.game_id }}
          ARTBOOK_DATE: ${{ matrix.target.date }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/company-design-prepromotion-repair.mjs --game-id="$GAME_ID" --date="$ARTBOOK_DATE" --phase=PRE_REVIEW | tee /tmp/prepromotion-repair.txt
          node tools/company-baseline-gate.mjs
          unresolved="$(sed -n 's/^PREPROMOTION_REPAIR_UNRESOLVED=//p' /tmp/prepromotion-repair.txt | tail -n 1)"
          if [ -n "$unresolved" ]; then
            echo "PREPROMOTION_REPAIR_BLOCKED=$unresolved" >&2
            exit 1
          fi
          echo 'PREPROMOTION_REPAIR_GATE=PASS'
      - name: Apply strict 30-minute design review
        if: steps.target.outputs.should_run == 'true'
        env:
          GAME_ID: ${{ matrix.target.game_id }}
          ARTBOOK_DATE: ${{ matrix.target.date }}
        shell: bash
        run: |
          set +e
          node tools/company-strict-production-review.mjs --mode=design --game-id="$GAME_ID" --date="$ARTBOOK_DATE"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then echo 'STRICT_DESIGN_GATE=PASS'; else echo 'STRICT_DESIGN_GATE=REVISE_OR_REBUILD'; fi
          exit 0
      - name: Apply one bounded review-feedback repair and re-review
        if: steps.target.outputs.should_run == 'true'
        env:
          GAME_ID: ${{ matrix.target.game_id }}
          ARTBOOK_DATE: ${{ matrix.target.date }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/company-design-prepromotion-repair.mjs --game-id="$GAME_ID" --date="$ARTBOOK_DATE" --phase=REVIEW_FEEDBACK | tee /tmp/review-feedback-repair.txt
          if grep -q '^PREPROMOTION_REPAIR_CHANGED=YES$' /tmp/review-feedback-repair.txt; then
            node tools/company-baseline-gate.mjs
            set +e
            node tools/company-strict-production-review.mjs --mode=design --game-id="$GAME_ID" --date="$ARTBOOK_DATE"
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then echo 'STRICT_DESIGN_REREVIEW=PASS'; else echo 'STRICT_DESIGN_REREVIEW=REVISE_OR_REBUILD'; fi
          else
            echo 'STRICT_DESIGN_REREVIEW=SKIPPED_NO_GROUNDED_REPAIR'
          fi
          echo 'REVIEW_FEEDBACK_REPAIR_MAX=1'
      - name: Verify baseline and strict review contract
        if: steps.target.outputs.should_run == 'true'
        env:
          ARTBOOK_GAME_ID: ${{ matrix.target.game_id }}
          ARTBOOK_DATE: ${{ matrix.target.date }}
          TARGET_SEED_ID: ${{ matrix.target.seed_id }}
          TARGET_SEED_REVISION: ${{ matrix.target.seed_revision }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';
          import {loadSeedState,activeSeedForGame} from './tools/game-seed-state.mjs';
          import {designArtifactsMatchSeed,seedRevisionOf} from './tools/company-design-seed-provenance.mjs';
          const gameId=process.env.ARTBOOK_GAME_ID,date=process.env.ARTBOOK_DATE,base=path.join('design',gameId,date);const status=JSON.parse(fs.readFileSync(path.join(base,'cycle-status.json'),'utf8'));if(status.productionClass!=='DESIGN_ONLY')throw new Error('DESIGN_ONLY required');if(status.departments?.count!==5||status.departments?.leadModelsDistinct!==true)throw new Error('five department lead contract failed');const strict=JSON.parse(fs.readFileSync(path.join(base,'strict-design-review.json'),'utf8'));if(!['PASS','REVISE','REBUILD'].includes(strict.verdict))throw new Error('strict verdict missing');const seed=activeSeedForGame(loadSeedState(),gameId);if(!seed||String(seed.seedId||'').trim()!==String(process.env.TARGET_SEED_ID||'').trim()||seedRevisionOf(seed)!==String(process.env.TARGET_SEED_REVISION||'').trim())throw new Error('DESIGN_SEED_TARGET_CHANGED_BEFORE_PERSIST');const provenance=designArtifactsMatchSeed({gameId,date,seed});if(!provenance.match)throw new Error(`DESIGN_SEED_PROVENANCE_REQUIRED ${provenance.reason}`);if(fs.existsSync(path.join('artbook-submissions',gameId,'current.json')))console.log('LEGACY_PREPROMOTION_ARTBOOK_IGNORED=YES');console.log(`STRICT_DESIGN_SCORE=${strict.totalScore}`);console.log(`STRICT_DESIGN_VERDICT=${strict.verdict}`);console.log('DESIGN_SEED_PROVENANCE=PASS');console.log(`STRICT_DESIGN_READY_FOR_PROMOTION=${status?.baselineGate?.state==='DESIGN_BASELINE_READY'&&status?.baselineGate?.ready===true&&strict.verdict==='PASS'&&Number(strict.totalScore)>=80&&Array.isArray(strict.hardFailures)&&strict.hardFailures.length===0?'YES':'NO'}`);console.log(`STRICT_DESIGN_EXCELLENT=${strict.verdict==='PASS'&&Number(strict.totalScore)>=90?'YES':'NO'}`);console.log('STRICT_DESIGN_SCORE_SYNTHESIZED=NO');console.log('STRICT_DESIGN_VERDICT_SYNTHESIZED=NO');console.log('DESIGN_ONLY_ARTBOOK_BEFORE_PROMOTION=NO');
          NODE
      - name: Persist validated design evidence to company runtime branch
        if: steps.target.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-seed-design';git config user.email 'seed-design@users.noreply.github.com'
          game_path="design/${{ matrix.target.game_id }}";seed_changed=0
          cmp -s game-seed-state.json /tmp/company-runtime-seed-state-before.json || seed_changed=1
          git add -- "$game_path";[ "$seed_changed" = 1 ] && git add -- game-seed-state.json || true
          git diff --cached --quiet && { echo 'SEED_DESIGN_RUNTIME_CHANGE=NO'; exit 0; }
          git commit -m "runtime: DESIGN_ONLY cycle ${{ matrix.target.game_id }} ${{ matrix.target.date }}";generated_commit="$(git rev-parse HEAD)";[ "$seed_changed" = 0 ] && rm -f game-seed-state.json || true
          pushed=0
          for attempt in 1 2 3 4; do git fetch origin "$COMPANY_RUNTIME_BRANCH";git checkout -B seed-design-persist "origin/$COMPANY_RUNTIME_BRANCH";git checkout "$generated_commit" -- "$game_path";[ "$seed_changed" = 1 ] && git checkout "$generated_commit" -- game-seed-state.json || true;git add -- "$game_path";[ "$seed_changed" = 1 ] && git add -- game-seed-state.json || true;if git diff --cached --quiet; then pushed=1;break;fi;git commit -m "runtime: DESIGN_ONLY cycle ${{ matrix.target.game_id }} ${{ matrix.target.date }}";if git push origin "HEAD:refs/heads/$COMPANY_RUNTIME_BRANCH"; then pushed=1;break;fi;git reset --hard "$generated_commit";sleep $((attempt * 2));done
          test "$pushed" = 1
          echo 'SEED_DESIGN_RUNTIME_CHANGE=PERSISTED'
          echo 'PUBLIC_MAIN_WRITE=NO'

  continue-seed-supply:
    needs: [resolve-seed-targets, design-cycle]
    if: always() && needs.resolve-seed-targets.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Continue canonical seed supply evaluation once after design batch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run company-game-seed-bootstrap.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'GAME_SEED_CONTINUATION_DISPATCHED=YES'
          echo 'GAME_SEED_CONTINUATION_SCOPE=BATCH_ONCE_AFTER_MATRIX'
