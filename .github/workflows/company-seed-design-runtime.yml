name: Company Seed DESIGN_ONLY Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/company-design-cycle.mjs'
      - 'tools/company-design-seed-normalize.mjs'
      - 'tools/company-design-gate-scoring-v2.mjs'
      - 'tools/company-strict-production-review.mjs'
      - '.github/workflows/company-seed-design-runtime.yml'
  schedule:
    - cron: '0 16 * * *' # 01:00 KST fallback; event chain remains primary

permissions:
  contents: write
  actions: write

concurrency:
  # Keep the active pinned Gemini engine alive; GitHub keeps at most one additional pending run in this group.
  group: company-seed-design-runtime
  cancel-in-progress: false

env:
  COMPANY_RUNTIME_BRANCH: company-runtime
  COMPANY_MODEL_PHASE_CONCURRENCY: '2'
  COMPANY_MODEL_CALL_TIMEOUT_MS: '90000'
  # Model identity is remappable by central policy. Prefer models with remaining free-tier quota before exhausted daily lanes.
  COMPANY_GEMINI_DESIGNER_MODEL: 'gemini-3.5-flash-lite'
  COMPANY_GEMINI_LEAD_MODELS: 'gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3-flash-preview,gemini-3.6-flash,gemini-3.5-flash'
  COMPANY_GEMINI_FALLBACK_MODELS: 'gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3-flash-preview,gemini-3.6-flash,gemini-3.5-flash,gemini-3.8-flash,gemini-3.7-flash,gemini-2.5-flash,gemini-2.5-flash-lite,gemini-2.5-pro'

jobs:
  resolve-seed-targets:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.targets.outputs.run }}
      targets: ${{ steps.targets.outputs.targets }}
      parallel_max: ${{ steps.targets.outputs.parallel_max }}
      canary_mode: ${{ steps.targets.outputs.canary_mode }}
      engine_digest: ${{ steps.targets.outputs.engine_digest }}
      pending_total: ${{ steps.targets.outputs.pending_total }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Load latest company runtime state
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --heads origin "$COMPANY_RUNTIME_BRANCH" >/dev/null 2>&1; then
            echo 'COMPANY_RUNTIME_STATE=NOT_CREATED'
            exit 0
          fi
          git fetch origin "$COMPANY_RUNTIME_BRANCH"
          for runtime_path in game-seed-state.json design design-engine-canary.json; do
            if git cat-file -e "origin/$COMPANY_RUNTIME_BRANCH:$runtime_path" 2>/dev/null; then
              git checkout "origin/$COMPANY_RUNTIME_BRANCH" -- "$runtime_path"
            fi
          done
          git reset -- game-seed-state.json design >/dev/null 2>&1 || true
          echo 'COMPANY_RUNTIME_STATE_OVERLAY=YES'
          echo 'DESIGN_ONLY_ARTBOOK_OVERLAY=NO'
          echo 'COMPANY_ENGINE_SOURCE=main'
      - name: Resolve centrally capped active incomplete GAME_SEED targets
        id: targets
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import fs from 'node:fs';
          import path from 'node:path';
          import {createHash} from 'node:crypto';
          const policy=fs.readFileSync('COMPANY_FLOW.md','utf8');
          const directive=JSON.parse(fs.readFileSync('company-directive.json','utf8'));
          const designScheduling=directive?.platformStrategy?.designStabilizationScheduling||{};
          const engineFiles=['tools/company-design-cycle.mjs','tools/company-design-gate-scoring-v2.mjs','tools/company-strict-production-review.mjs','tools/company-design-prepromotion-repair.mjs','tools/company-baseline-gate.mjs'];
          const engineDigest=createHash('sha256').update(engineFiles.map(file=>`${file}\n${fs.readFileSync(file,'utf8')}`).join('\n---\n')).digest('hex');
          const canaryMarker=(()=>{try{return JSON.parse(fs.readFileSync('design-engine-canary.json','utf8'));}catch{return null;}})();
          const canaryVerified=canaryMarker?.engineDigest===engineDigest;
          const maxMatch=policy.match(/concurrentGameWipMax:\s*(\d+)/);
          const designWipMax=Number(maxMatch?.[1]||0);
          if(!Number.isInteger(designWipMax)||designWipMax<1)throw new Error('CENTRAL_GAME_WIP_MAX_REQUIRED');
          const state=(()=>{try{return JSON.parse(fs.readFileSync('game-seed-state.json','utf8'));}catch{return{seeds:[]};}})();
          const active=(state.seeds||[]).filter(seed=>String(seed.status||'').toUpperCase()==='ACTIVE');
          const resetAt=Date.parse(state?.ownerAllGamesDesignReset?.updatedAt||'')||0;
          const resetDate=resetAt?new Date(resetAt).toISOString().slice(0,10):'';
          const strictPassFor=(seed)=>{
            const gameRoot=path.join('design',String(seed.gameId));
            if(!fs.existsSync(gameRoot))return false;
            try{
              const dates=fs.readdirSync(gameRoot,{withFileTypes:true}).filter(x=>x.isDirectory()).map(x=>x.name).sort().reverse();
              for(const date of dates){
                const base=path.join(gameRoot,date);
                const statusPath=path.join(base,'cycle-status.json');
                const strictPath=path.join(base,'strict-design-review.json');
                if(!fs.existsSync(statusPath)||!fs.existsSync(strictPath))continue;
                const status=JSON.parse(fs.readFileSync(statusPath,'utf8'));
                const review=JSON.parse(fs.readFileSync(strictPath,'utf8'));
                const evidenceAt=Date.parse(review.reviewedAt||review.generatedAt||review.updatedAt||review.createdAt||'')||0;
                if(resetAt){
                  if(evidenceAt&&evidenceAt<resetAt)continue;
                  if(!evidenceAt&&date<=resetDate)continue;
                }
                const ready=status?.baselineGate?.state==='DESIGN_BASELINE_READY'&&status?.baselineGate?.ready===true;
                if(ready&&review.verdict==='PASS'&&Number(review.totalScore)>=80&&Array.isArray(review.hardFailures)&&review.hardFailures.length===0)return true;
              }
            }catch{}
            return false;
          };
          const platformPriority=seed=>{
            if(designScheduling.mode!=='ROBLOX_FIRST_THEN_OTHER_PLATFORMS')return 0;
            return String(seed?.INITIAL_TARGET_PLATFORM||'').trim().toUpperCase()==='ROBLOX'?0:1;
          };
          const pending=active.filter(seed=>!strictPassFor(seed)).sort((a,b)=>
            platformPriority(a)-platformPriority(b)||
            String(a.createdAt||'').localeCompare(String(b.createdAt||''))||
            String(a.gameId||'').localeCompare(String(b.gameId||''))
          ).slice(0,designWipMax);
          const selected=canaryVerified?pending:pending.slice(0,2);
          const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
          const get=t=>parts.find(x=>x.type===t)?.value||'';const date=`${get('year')}-${get('month')}-${get('day')}`;
          const targets=selected.map(seed=>({game_id:seed.gameId,game_name:seed.gameName||seed.gameId,seed_id:seed.seedId,category:seed.GAME_CATEGORY,target_platform:String(seed.INITIAL_TARGET_PLATFORM||'').toUpperCase(),date,multiplayer_mode:seed.MULTIPLAYER_DESIGN_MODE||'SINGLE',target_session_minutes:Number(seed.TARGET_SESSION_MINUTES||30)}));
          const parallelMax=Math.max(1,Math.min(canaryVerified?2:1,targets.length||1));
          console.log(`run=${targets.length?'true':'false'}`);
          console.log(`targets=${JSON.stringify(targets)}`);
          console.log(`parallel_max=${parallelMax}`);
          console.log(`canary_mode=${canaryVerified?'false':'true'}`);
          console.log(`engine_digest=${engineDigest}`);
          console.log(`pending_total=${pending.length}`);
          console.error(`GAME_SEED_DESIGN_TARGET_COUNT=${targets.length}`);
          console.error(`GAME_SEED_DESIGN_PENDING_TOTAL=${pending.length}`);
          console.error(`GAME_DESIGN_ENGINE_CANARY=${canaryVerified?'VERIFIED':'REQUIRED'}`);
          console.error(`GAME_DESIGN_ENGINE_DIGEST=${engineDigest}`);
          console.error(`GAME_DESIGN_WIP_MAX=${designWipMax}`);
          console.error(`GAME_DESIGN_EXECUTION_LANES=${parallelMax}`);
          console.error('GAME_DESIGN_WIP_SOURCE=COMPANY_FLOW');
          console.error(`GAME_DESIGN_SCHEDULING_MODE=${designScheduling.mode||'DEFAULT'}`);
          console.error(`GAME_DESIGN_ROBLOX_FIRST=${designScheduling.mode==='ROBLOX_FIRST_THEN_OTHER_PLATFORMS'?'YES':'NO'}`);
          console.error('GAME_DESIGN_FORCE_PROMOTION=NO');
          console.error('GAME_DESIGN_PORTFOLIO_WIDE_PASS_REQUIRED=NO');
          console.error('STRICT_DESIGN_PASS_THRESHOLD=80');
          console.error('STRICT_DESIGN_EXCELLENT_THRESHOLD=90');
          console.error('DESIGN_ONLY_ARTBOOK_BEFORE_PROMOTION=NO');
          NODE

  design-cycle:
    needs: resolve-seed-targets
    if: needs.resolve-seed-targets.outputs.run == 'true'
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.resolve-seed-targets.outputs.parallel_max) }}
      matrix:
        target: ${{ fromJSON(needs.resolve-seed-targets.outputs.targets) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Checkout isolated company runtime branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$COMPANY_RUNTIME_BRANCH"
          game_path="design/${{ matrix.target.game_id }}"
          for runtime_path in game-seed-state.json "$game_path"; do
            if git cat-file -e "origin/$COMPANY_RUNTIME_BRANCH:$runtime_path" 2>/dev/null; then git checkout "origin/$COMPANY_RUNTIME_BRANCH" -- "$runtime_path"; fi
          done
          git reset -- game-seed-state.json "$game_path" >/dev/null 2>&1 || true
          test -f game-seed-state.json
          cp game-seed-state.json /tmp/company-runtime-seed-state-before.json
          echo 'COMPANY_RUNTIME_STATE_OVERLAY=TARGET_ONLY'
          echo 'DESIGN_ONLY_ARTBOOK_OVERLAY=NO'
          echo 'PUBLIC_MAIN_WRITE=NO'
      - name: Normalize target GAME_SEED contract
        env:
          GAME_ID: ${{ matrix.target.game_id }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/company-design-seed-normalize.mjs --game-id="$GAME_ID"
          echo 'DESIGN_SEED_NORMALIZATION_STAGE=PRE_DESIGN'

      - name: Revalidate current seed target
        id: target
        env:
          TARGET_GAME_ID: ${{ matrix.target.game_id }}
          TARGET_SEED_ID: ${{ matrix.target.seed_id }}
        shell: bash
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import fs from 'node:fs';import path from 'node:path';
          const gameId=String(process.env.TARGET_GAME_ID||'').trim(),seedId=String(process.env.TARGET_SEED_ID||'').trim();
          const state=JSON.parse(fs.readFileSync('game-seed-state.json','utf8'));const seed=(state.seeds||[]).find(x=>String(x.gameId)===gameId&&String(x.status).toUpperCase()==='ACTIVE');
          const resetAt=Date.parse(state?.ownerAllGamesDesignReset?.updatedAt||'')||0;
          const resetDate=resetAt?new Date(resetAt).toISOString().slice(0,10):'';
          let strictPass=false;
          const gameRoot=path.join('design',gameId);
          if(seed&&String(seed.seedId)===seedId&&fs.existsSync(gameRoot)){
            try{
              const dates=fs.readdirSync(gameRoot,{withFileTypes:true}).filter(x=>x.isDirectory()).map(x=>x.name).sort().reverse();
              for(const date of dates){
                const base=path.join(gameRoot,date),statusPath=path.join(base,'cycle-status.json'),strictPath=path.join(base,'strict-design-review.json');
                if(!fs.existsSync(statusPath)||!fs.existsSync(strictPath))continue;
                const status=JSON.parse(fs.readFileSync(statusPath,'utf8')),review=JSON.parse(fs.readFileSync(strictPath,'utf8'));
                const evidenceAt=Date.parse(review.reviewedAt||review.generatedAt||review.updatedAt||review.createdAt||'')||0;
                if(resetAt){
                  if(evidenceAt&&evidenceAt<resetAt)continue;
                  if(!evidenceAt&&date<=resetDate)continue;
                }
                if(status?.baselineGate?.state==='DESIGN_BASELINE_READY'&&status?.baselineGate?.ready===true&&review.verdict==='PASS'&&Number(review.totalScore)>=80&&Array.isArray(review.hardFailures)&&review.hardFailures.length===0){strictPass=true;break;}
              }
            }catch{}
          }
          console.log(`should_run=${seed&&String(seed.seedId)===seedId&&!strictPass?'true':'false'}`);
          NODE
      - name: Static strict contracts
        if: steps.target.outputs.should_run == 'true'
        run: |
          node --check tools/game-seed-state.mjs
          node --check tools/company-game-seed-contract.mjs
          node --check tools/company-strict-production-review.mjs
          node --check tools/company-design-prepromotion-repair.mjs
          node --check tools/company-design-cycle.mjs
          test -n "${{ secrets.GEMINI_API_KEY }}" || { echo 'GEMINI_API_KEY_REQUIRED' >&2; exit 1; }
          echo 'DESIGN_AI_PROVIDER=GEMINI_ONLY'
      - name: Resolve checkpoint-aware Gemini quota lanes
        id: gemini_quota
        if: steps.target.outputs.should_run == 'true'
        env:
          ARTBOOK_GAME_ID: ${{ matrix.target.game_id }}
          ARTBOOK_DATE: ${{ matrix.target.date }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' | tee /tmp/gemini-quota-governor.txt
          import fs from 'node:fs';
          import path from 'node:path';

          const clean=value=>String(value??'').trim();
          const uniq=values=>[...new Set(values.map(clean).filter(Boolean))];
          const roles=['planning','graphics','development','qa','balance'];
          const leads=uniq(clean(process.env.COMPANY_GEMINI_LEAD_MODELS).split(','));
          const fallback=uniq(clean(process.env.COMPANY_GEMINI_FALLBACK_MODELS).split(','));
          if(leads.length<roles.length)throw new Error(`GEMINI_QUOTA_GOVERNOR_LEAD_COUNT=${leads.length}/${roles.length}`);
          const primary=leads.slice(0,roles.length);
          const primarySet=new Set(primary);
          const extras=fallback.filter(model=>!primarySet.has(model));
          const lanes=Object.fromEntries(roles.map((role,index)=>[role,uniq([primary[index],...extras.filter((_,fallbackIndex)=>fallbackIndex%roles.length===index)])]));
          const checkpointPath=path.join('design',clean(process.env.ARTBOOK_GAME_ID),clean(process.env.ARTBOOK_DATE),'design-checkpoint.json');
          let checkpoint={};
          try{checkpoint=JSON.parse(fs.readFileSync(checkpointPath,'utf8'));}catch{}
          const dailyQuota=/GenerateRequestsPerDayPerProjectPerModel-FreeTier|requests per day|daily quota/i;
          const exhausted=new Set();
          for(const [rawModel,row] of Object.entries(checkpoint.modelHealth||{})){
            if(!dailyQuota.test(clean(row?.lastError)))continue;
            exhausted.add(clean(rawModel).replace(/^gemini:/,''));
          }
          const completedTasks=checkpoint.tasks&&typeof checkpoint.tasks==='object'?checkpoint.tasks:{};
          const missingRoles=roles.filter(role=>!Object.prototype.hasOwnProperty.call(completedTasks,`five_lead_reviews::${role}`));
          const blockedRoles=missingRoles.filter(role=>lanes[role].every(model=>exhausted.has(model)));
          const allModels=uniq([clean(process.env.COMPANY_GEMINI_DESIGNER_MODEL),...fallback]);
          const modelCapacityRemaining=allModels.some(model=>!exhausted.has(model));
          const runModelCycle=blockedRoles.length===0&&modelCapacityRemaining;
          console.log(`GEMINI_QUOTA_GOVERNOR=${runModelCycle?'READY':'WAITING_FOR_GEMINI_QUOTA'}`);
          console.log(`GEMINI_DAILY_EXHAUSTED_MODELS=${[...exhausted].join(',')||'NONE'}`);
          console.log(`GEMINI_INCOMPLETE_LEAD_ROLES=${missingRoles.join(',')||'NONE'}`);
          console.log(`GEMINI_BLOCKED_LEAD_ROLES=${blockedRoles.join(',')||'NONE'}`);
          console.log(`GEMINI_QUOTA_CHECKPOINT_PRESERVED=${fs.existsSync(checkpointPath)?'YES':'NO'}`);
          console.log(`GEMINI_QUOTA_FULL_CYCLE_RESTART=NO`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`run_model_cycle=${runModelCycle?'true':'false'}\nquota_state=${runModelCycle?'READY':'WAITING_FOR_GEMINI_QUOTA'}\n`);
          NODE
      - name: Run seed-backed DESIGN_ONLY pipeline without artbook
        if: steps.target.outputs.should_run == 'true' && steps.gemini_quota.outputs.run_model_cycle == 'true'
        env:
          ARTBOOK_GAME_ID: ${{ matrix.target.game_id }}
          ARTBOOK_DATE: ${{ matrix.target.date }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          checkpoint_path="design/${{ matrix.target.game_id }}/${{ matrix.target.date }}/design-checkpoint.json"
          progress_path="design/${{ matrix.target.game_id }}/${{ matrix.target.date }}/design-progress.json"
          worktree="/tmp/design-checkpoint-${{ matrix.target.game_id }}"
          last_checkpoint_sync_key=''
          checkpoint_sync_key() {
            node -e "const fs=require('fs');const cp=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));let p={};try{p=JSON.parse(fs.readFileSync(process.argv[2],'utf8'))}catch{};process.stdout.write([cp.status||'',cp.currentPhase||'',(cp.completedPhases||[]).length,p.percent??'',cp.lastSuccessfulModelCallAt||'',Object.values(cp.modelHealth||{}).reduce((sum,row)=>sum+Number(row?.calls||0),0),cp.lastError||''].join('|'))" "$checkpoint_path" "$progress_path"
          }
          persist_design_checkpoint() {
            if [ ! -f "$checkpoint_path" ]; then
              echo 'DESIGN_CHECKPOINT_RUNTIME_PERSIST=NO_CHECKPOINT'
              return 0
            fi
            local sync_key
            sync_key="$(checkpoint_sync_key)"
            if [ "$sync_key" = "$last_checkpoint_sync_key" ]; then return 0; fi
            cp "$checkpoint_path" /tmp/design-checkpoint.json
            [ -f "$progress_path" ] && cp "$progress_path" /tmp/design-progress.json || true
            local pushed=0
            for attempt in 1 2 3 4; do
              git fetch origin "$COMPANY_RUNTIME_BRANCH"
              git worktree remove -f "$worktree" >/dev/null 2>&1 || true
              rm -rf "$worktree"
              git worktree add --detach "$worktree" "origin/$COMPANY_RUNTIME_BRANCH" >/dev/null
              mkdir -p "$worktree/$(dirname "$checkpoint_path")"
              cp /tmp/design-checkpoint.json "$worktree/$checkpoint_path"
              if [ -f /tmp/design-progress.json ]; then cp /tmp/design-progress.json "$worktree/$progress_path"; fi
              git -C "$worktree" config user.name 'jaewoon-seed-design-checkpoint'
              git -C "$worktree" config user.email 'seed-design-checkpoint@users.noreply.github.com'
              git -C "$worktree" add -- "$checkpoint_path" "$progress_path"
              if git -C "$worktree" diff --cached --quiet; then
                pushed=1
                git worktree remove -f "$worktree" >/dev/null 2>&1 || true
                break
              fi
              git -C "$worktree" commit -m "runtime: DESIGN_ONLY progress ${{ matrix.target.game_id }} ${{ matrix.target.date }}" >/dev/null
              if git -C "$worktree" push origin "HEAD:refs/heads/$COMPANY_RUNTIME_BRANCH"; then
                pushed=1
                git worktree remove -f "$worktree" >/dev/null 2>&1 || true
                break
              fi
              git worktree remove -f "$worktree" >/dev/null 2>&1 || true
              sleep "$attempt"
            done
            test "$pushed" = 1
            last_checkpoint_sync_key="$sync_key"
            echo "DESIGN_CHECKPOINT_RUNTIME_PERSIST=YES|$sync_key"
            echo 'DESIGN_PROGRESS_RUNTIME_PERSIST=YES'
            echo 'PUBLIC_MAIN_WRITE=NO'
          }
          pipeline_pid=0
          sync_pid=0
          cleanup_design_runtime() {
            rc=$?
            trap - EXIT TERM INT
            [ "$sync_pid" -gt 0 ] && kill "$sync_pid" >/dev/null 2>&1 || true
            [ "$pipeline_pid" -gt 0 ] && kill "$pipeline_pid" >/dev/null 2>&1 || true
            persist_design_checkpoint || true
            exit "$rc"
          }
          trap 'exit 143' TERM INT
          trap cleanup_design_runtime EXIT
          node tools/artbook-production-pipeline.mjs &
          pipeline_pid=$!
          (
            while kill -0 "$pipeline_pid" >/dev/null 2>&1; do
              sleep 15
              persist_design_checkpoint || true
            done
          ) &
          sync_pid=$!
          set +e
          wait "$pipeline_pid"
          rc=$?
          set -e
          kill "$sync_pid" >/dev/null 2>&1 || true
          wait "$sync_pid" >/dev/null 2>&1 || true
          sync_pid=0
          persist_design_checkpoint || true
          exit "$rc"
      - name: Verify design learning context consumption
        if: steps.target.outputs.should_run == 'true' && steps.gemini_quota.outputs.run_model_cycle == 'true'
        env:
          ARTBOOK_GAME_ID: ${{ matrix.target.game_id }}
          ARTBOOK_DATE: ${{ matrix.target.date }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const gameId=String(process.env.ARTBOOK_GAME_ID||'').trim();
          const date=String(process.env.ARTBOOK_DATE||'').trim();
          const state=JSON.parse(fs.readFileSync('game-seed-state.json','utf8'));
          const status=JSON.parse(fs.readFileSync(path.join('design',gameId,date,'cycle-status.json'),'utf8'));
          const events=(Array.isArray(state?.seedMaterialLearning?.events)?state.seedMaterialLearning.events:[])
            .filter(event=>String(event?.gameId||'').trim()===gameId&&String(event?.reviewStage||'').trim()==='DESIGN_STRICT_REVIEW')
            .slice(-8);
          const expectedCount=events.length;
          if(Number(status?.designLearning?.candidateCount)!==expectedCount)throw new Error(`DESIGN_LEARNING_CANDIDATE_COUNT_MISMATCH expected=${expectedCount} actual=${status?.designLearning?.candidateCount}`);
          if(status?.designLearning?.usedAsDesignContext!==(expectedCount>0))throw new Error('DESIGN_LEARNING_CONTEXT_USAGE_MISMATCH');
          if(status?.vibe2LearningContextUsed!==(expectedCount>0))throw new Error('VIBE2_LEARNING_CONTEXT_USAGE_MISMATCH');
          if(status?.designLearning?.positiveTrainingEligible!==false)throw new Error('DESIGN_FEEDBACK_MUST_REMAIN_UNVALIDATED');
          if(status?.designLearning?.validatedRuntimeRequiredForPositiveTraining!==true)throw new Error('VALIDATED_RUNTIME_REQUIREMENT_MISSING');
          console.log(`DESIGN_LEARNING_RUNTIME_CHECK=PASS`);
          console.log(`DESIGN_LEARNING_CONTEXT_CANDIDATES=${expectedCount}`);
          console.log(`VIBE2_LEARNING_CONTEXT_USED=${expectedCount>0?'YES':'NO'}`);
          console.log('POSITIVE_TRAINING_FROM_DESIGN_ONLY=NO');
          NODE
      - name: Repair missing pre-promotion design requirements
        if: steps.target.outputs.should_run == 'true' && steps.gemini_quota.outputs.run_model_cycle == 'true'
        env:
          GAME_ID: ${{ matrix.target.game_id }}
          ARTBOOK_DATE: ${{ matrix.target.date }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/company-design-prepromotion-repair.mjs --game-id="$GAME_ID" --date="$ARTBOOK_DATE" --phase=PRE_REVIEW | tee /tmp/prepromotion-repair.txt
          node tools/company-baseline-gate.mjs
          unresolved="$(sed -n 's/^PREPROMOTION_REPAIR_UNRESOLVED=//p' /tmp/prepromotion-repair.txt | tail -n 1)"
          if [ -n "$unresolved" ]; then
            echo "PREPROMOTION_REPAIR_BLOCKED=$unresolved" >&2
            exit 1
          fi
          echo 'PREPROMOTION_REPAIR_GATE=PASS'
      - name: Apply strict 30-minute design review
        if: steps.target.outputs.should_run == 'true' && steps.gemini_quota.outputs.run_model_cycle == 'true'
        env:
          GAME_ID: ${{ matrix.target.game_id }}
          ARTBOOK_DATE: ${{ matrix.target.date }}
        shell: bash
        run: |
          set +e
          node tools/company-strict-production-review.mjs --mode=design --game-id="$GAME_ID" --date="$ARTBOOK_DATE"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then echo 'STRICT_DESIGN_GATE=PASS'; else echo 'STRICT_DESIGN_GATE=REVISE_OR_REBUILD'; fi
          exit 0
      - name: Apply review-feedback repair and re-review within this cycle
        if: steps.target.outputs.should_run == 'true' && steps.gemini_quota.outputs.run_model_cycle == 'true'
        env:
          GAME_ID: ${{ matrix.target.game_id }}
          ARTBOOK_DATE: ${{ matrix.target.date }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/company-design-prepromotion-repair.mjs --game-id="$GAME_ID" --date="$ARTBOOK_DATE" --phase=REVIEW_FEEDBACK | tee /tmp/review-feedback-repair.txt
          if grep -q '^PREPROMOTION_REPAIR_CHANGED=YES$' /tmp/review-feedback-repair.txt; then
            node tools/company-baseline-gate.mjs
            set +e
            node tools/company-strict-production-review.mjs --mode=design --game-id="$GAME_ID" --date="$ARTBOOK_DATE"
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then echo 'STRICT_DESIGN_REREVIEW=PASS'; else echo 'STRICT_DESIGN_REREVIEW=REVISE_OR_REBUILD'; fi
          else
            echo 'STRICT_DESIGN_REREVIEW=NO_TARGETED_FIELD_REPAIR_THIS_CYCLE'
          fi
          echo 'REVIEW_FEEDBACK_REPAIR_PER_CYCLE=1'
          echo 'DESIGN_GATE_TOTAL_REPAIR_ATTEMPTS=UNLIMITED'
      - name: Verify baseline and strict review contract
        if: steps.target.outputs.should_run == 'true' && steps.gemini_quota.outputs.run_model_cycle == 'true'
        env:
          ARTBOOK_GAME_ID: ${{ matrix.target.game_id }}
          ARTBOOK_DATE: ${{ matrix.target.date }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';const gameId=process.env.ARTBOOK_GAME_ID,date=process.env.ARTBOOK_DATE,base=path.join('design',gameId,date);const status=JSON.parse(fs.readFileSync(path.join(base,'cycle-status.json'),'utf8'));if(status.productionClass!=='DESIGN_ONLY')throw new Error('DESIGN_ONLY required');if(status.departments?.count!==5||status.departments?.leadModelsDistinct!==true)throw new Error('five department lead contract failed');const strict=JSON.parse(fs.readFileSync(path.join(base,'strict-design-review.json'),'utf8'));if(!['PASS','REVISE','REBUILD'].includes(strict.verdict))throw new Error('strict verdict missing');if(fs.existsSync(path.join('artbook-submissions',gameId,'current.json')))console.log('LEGACY_PREPROMOTION_ARTBOOK_IGNORED=YES');console.log(`STRICT_DESIGN_SCORE=${strict.totalScore}`);console.log(`STRICT_DESIGN_VERDICT=${strict.verdict}`);console.log(`STRICT_DESIGN_READY_FOR_PROMOTION=${status?.baselineGate?.state==='DESIGN_BASELINE_READY'&&status?.baselineGate?.ready===true&&strict.verdict==='PASS'&&Number(strict.totalScore)>=80&&Array.isArray(strict.hardFailures)&&strict.hardFailures.length===0?'YES':'NO'}`);console.log(`STRICT_DESIGN_EXCELLENT=${strict.verdict==='PASS'&&Number(strict.totalScore)>=90?'YES':'NO'}`);console.log('STRICT_DESIGN_SCORE_SYNTHESIZED=NO');console.log('STRICT_DESIGN_VERDICT_SYNTHESIZED=NO');console.log('DESIGN_ONLY_ARTBOOK_BEFORE_PROMOTION=NO');
          NODE
      - name: Persist validated design evidence to company runtime branch
        if: steps.target.outputs.should_run == 'true' && steps.gemini_quota.outputs.run_model_cycle == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-seed-design';git config user.email 'seed-design@users.noreply.github.com'
          game_path="design/${{ matrix.target.game_id }}";seed_changed=0
          cmp -s game-seed-state.json /tmp/company-runtime-seed-state-before.json || seed_changed=1
          git add -- "$game_path";[ "$seed_changed" = 1 ] && git add -- game-seed-state.json || true
          git diff --cached --quiet && { echo 'SEED_DESIGN_RUNTIME_CHANGE=NO'; exit 0; }
          git commit -m "runtime: DESIGN_ONLY cycle ${{ matrix.target.game_id }} ${{ matrix.target.date }}";generated_commit="$(git rev-parse HEAD)";[ "$seed_changed" = 0 ] && rm -f game-seed-state.json || true
          pushed=0
          for attempt in 1 2 3 4; do git fetch origin "$COMPANY_RUNTIME_BRANCH";git checkout -B seed-design-persist "origin/$COMPANY_RUNTIME_BRANCH";git checkout "$generated_commit" -- "$game_path";[ "$seed_changed" = 1 ] && git checkout "$generated_commit" -- game-seed-state.json || true;git add -- "$game_path";[ "$seed_changed" = 1 ] && git add -- game-seed-state.json || true;if git diff --cached --quiet; then pushed=1;break;fi;git commit -m "runtime: DESIGN_ONLY cycle ${{ matrix.target.game_id }} ${{ matrix.target.date }}";if git push origin "HEAD:refs/heads/$COMPANY_RUNTIME_BRANCH"; then pushed=1;break;fi;git reset --hard "$generated_commit";sleep $((attempt * 2));done
          test "$pushed" = 1
          echo 'SEED_DESIGN_RUNTIME_CHANGE=PERSISTED'
          echo 'PUBLIC_MAIN_WRITE=NO'

      - name: Dispatch per-game promotion reconciliation on own strict PASS
        if: steps.target.outputs.should_run == 'true' && steps.gemini_quota.outputs.run_model_cycle == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_ID: ${{ matrix.target.game_id }}
          ARTBOOK_DATE: ${{ matrix.target.date }}
        shell: bash
        run: |
          set -euo pipefail
          ready="$(node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';
          const base=path.join('design',process.env.GAME_ID,process.env.ARTBOOK_DATE);
          const status=JSON.parse(fs.readFileSync(path.join(base,'cycle-status.json'),'utf8'));
          const review=JSON.parse(fs.readFileSync(path.join(base,'strict-design-review.json'),'utf8'));
          const pass=status?.baselineGate?.state==='DESIGN_BASELINE_READY'&&status?.baselineGate?.ready===true&&review?.verdict==='PASS'&&Number(review?.totalScore)>=80&&Array.isArray(review?.hardFailures)&&review.hardFailures.length===0;
          process.stdout.write(pass?'YES':'NO');
          NODE
          )"
          if [ "$ready" != "YES" ]; then
            echo "PER_GAME_PROMOTION_DISPATCH=NO|game=$GAME_ID|reason=OWN_GATE_NOT_PASS"
            exit 0
          fi
          gh workflow run company-design-promotion-sync.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "PER_GAME_PROMOTION_DISPATCH=YES|game=$GAME_ID"
          echo 'PER_GAME_PROMOTION_FORCE=NO'
          echo 'PORTFOLIO_WIDE_PASS_WAIT=NO'
          echo 'WEB_DEVELOPMENT_START=NO'

  mark-design-engine-canary:
    needs: [resolve-seed-targets, design-cycle]
    if: always() && needs.resolve-seed-targets.outputs.run == 'true' && needs.resolve-seed-targets.outputs.canary_mode == 'true' && needs.design-cycle.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Persist verified design engine canary
        env:
          ENGINE_DIGEST: ${{ needs.resolve-seed-targets.outputs.engine_digest }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-design-canary'
          git config user.email 'design-canary@users.noreply.github.com'
          cat > /tmp/design-engine-canary.json <<JSON
          {
            "version": 1,
            "engineDigest": "$ENGINE_DIGEST",
            "engineSha": "$GITHUB_SHA",
            "verifiedGameCount": 2,
            "verifiedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "policy": "CANARY_TWO_GAMES_BEFORE_FIVE_LANE_BATCH"
          }
          JSON
          pushed=0
          for attempt in 1 2 3 4; do
            git fetch origin "$COMPANY_RUNTIME_BRANCH"
            git checkout -B design-canary-runtime "origin/$COMPANY_RUNTIME_BRANCH"
            cp /tmp/design-engine-canary.json design-engine-canary.json
            git add -- design-engine-canary.json
            if git diff --cached --quiet; then pushed=1; break; fi
            git commit -m "runtime: verify DESIGN_ONLY engine canary"
            if git push origin "HEAD:refs/heads/$COMPANY_RUNTIME_BRANCH"; then pushed=1; break; fi
            sleep $((attempt * 2))
          done
          test "$pushed" = 1
          echo 'DESIGN_ENGINE_CANARY=VERIFIED'
          echo "DESIGN_ENGINE_DIGEST=$ENGINE_DIGEST"
          echo 'PUBLIC_MAIN_WRITE=NO'

  sync-strict-design-scores:
    needs: [resolve-seed-targets, design-cycle]
    if: always() && needs.resolve-seed-targets.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Bind latest post-reset strict design scores once
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-design-score-sync'
          git config user.email 'design-score-sync@users.noreply.github.com'
          pushed=0
          for attempt in 1 2 3 4; do
            git fetch origin "$COMPANY_RUNTIME_BRANCH"
            git checkout -B design-score-sync "origin/$COMPANY_RUNTIME_BRANCH"
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const state=JSON.parse(fs.readFileSync('game-seed-state.json','utf8'));
          const catalog=JSON.parse(fs.readFileSync('game-catalog.json','utf8'));
          const canonical=new Set((catalog.games||[])
            .filter(game=>['ACTIVE','REBUILD'].includes(String(game.lifecycleState||'ACTIVE').toUpperCase()))
            .map(game=>String(game.id||'').trim())
            .filter(Boolean));
          const resetAt=Date.parse(state?.ownerAllGamesDesignReset?.updatedAt||'')||0;
          const resetDate=resetAt?new Date(resetAt).toISOString().slice(0,10):'';
          let bound=0,cleared=0;
          for(const seed of state.seeds||[]){
            const gameId=String(seed?.gameId||'').trim();
            if(!canonical.has(gameId)||String(seed?.status||'').toUpperCase()!=='ACTIVE')continue;
            const root=path.join('design',gameId);
            const dates=fs.existsSync(root)?fs.readdirSync(root,{withFileTypes:true})
              .filter(entry=>entry.isDirectory()&&/^\d{4}-\d{2}-\d{2}$/.test(entry.name))
              .map(entry=>entry.name).sort().reverse():[];
            let selected=null;
            for(const date of dates){
              const reviewPath=path.join(root,date,'strict-design-review.json');
              if(!fs.existsSync(reviewPath))continue;
              const review=JSON.parse(fs.readFileSync(reviewPath,'utf8'));
              const score=Number(review.totalScore);
              if(!Number.isFinite(score)||score<0||score>100)continue;
              const evidenceAt=Date.parse(review.reviewedAt||review.generatedAt||review.updatedAt||review.createdAt||'')||0;
              if(resetAt){
                if(evidenceAt&&evidenceAt<resetAt)continue;
                if(!evidenceAt&&date<=resetDate)continue;
              }
              selected={review,date,reviewPath,score};
              break;
            }
            if(!selected){
              if(seed.strictDesignReview!=null||seed.strictDesignReviewUpdatedAt!=null){
                seed.strictDesignReview=null;
                seed.strictDesignReviewUpdatedAt=null;
                cleared++;
              }
              continue;
            }
            const next={
              verdict:String(selected.review.verdict||'').toUpperCase(),
              totalScore:selected.score,
              hardFailures:Array.isArray(selected.review.hardFailures)?selected.review.hardFailures:[],
              evidencePath:selected.reviewPath.replaceAll('\\','/'),
              passThreshold:Number(selected.review.passThreshold||80)
            };
            if(JSON.stringify(seed.strictDesignReview||null)===JSON.stringify(next))continue;
            seed.strictDesignReview=next;
            seed.strictDesignReviewUpdatedAt=new Date().toISOString();
            bound++;
          }
          if(bound>0||cleared>0)fs.writeFileSync('game-seed-state.json',JSON.stringify(state,null,2)+'\n');
          console.log(`STRICT_DESIGN_SCORE_BOUND_COUNT=${bound}`);
          console.log(`STRICT_DESIGN_SCORE_STALE_CLEAR_COUNT=${cleared}`);
          console.log(`STRICT_DESIGN_SCORE_RESET_CUTOFF=${state?.ownerAllGamesDesignReset?.updatedAt||'NONE'}`);
          console.log('STRICT_DESIGN_SCORE_SOURCE=STRICT_REVIEW_DIRECT_EVIDENCE');
          NODE
            git add -- game-seed-state.json
            if git diff --cached --quiet; then pushed=1; echo 'STRICT_DESIGN_SCORE_SYNC_CHANGE=NO'; break; fi
            git commit -m 'runtime: sync post-reset strict design scores'
            if git push origin "HEAD:refs/heads/$COMPANY_RUNTIME_BRANCH"; then pushed=1; echo 'STRICT_DESIGN_SCORE_SYNC=PERSISTED'; break; fi
            sleep $((attempt * 2))
          done
          test "$pushed" = 1

  continue-seed-supply:
    needs: [resolve-seed-targets, design-cycle, mark-design-engine-canary, sync-strict-design-scores]
    if: always() && needs.resolve-seed-targets.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false

      - name: Continue seed supply and immediately repeat failed design gates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$COMPANY_RUNTIME_BRANCH"
          pending="$(node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import {execFileSync} from 'node:child_process';
          const branch=process.env.COMPANY_RUNTIME_BRANCH;
          const show=file=>execFileSync('git',['show',`origin/${branch}:${file}`],{encoding:'utf8',maxBuffer:32*1024*1024});
          const state=JSON.parse(show('game-seed-state.json'));let count=0;
          const resetAt=Date.parse(state?.ownerAllGamesDesignReset?.updatedAt||'')||0;
          const resetDate=resetAt?new Date(resetAt).toISOString().slice(0,10):'';
          for(const seed of state.seeds||[]){
            if(String(seed.status||'').toUpperCase()!=='ACTIVE')continue;
            let passed=false;
            try{
              const tree=execFileSync('git',['ls-tree','-r','--name-only',`origin/${branch}`,`design/${seed.gameId}`],{encoding:'utf8',maxBuffer:32*1024*1024}).split(/\r?\n/).filter(Boolean);
              const dates=[...new Set(tree.map(file=>file.match(new RegExp(`^design/${String(seed.gameId).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}/(\\d{4}-\\d{2}-\\d{2})/`))?.[1]).filter(Boolean))].sort().reverse();
              for(const date of dates){
                const base=`design/${seed.gameId}/${date}`;
                const status=JSON.parse(show(`${base}/cycle-status.json`));const review=JSON.parse(show(`${base}/strict-design-review.json`));
                const evidenceAt=Date.parse(review.reviewedAt||review.generatedAt||review.updatedAt||review.createdAt||'')||0;
                if(resetAt){
                  if(evidenceAt&&evidenceAt<resetAt)continue;
                  if(!evidenceAt&&date<=resetDate)continue;
                }
                if(status?.baselineGate?.state==='DESIGN_BASELINE_READY'&&status?.baselineGate?.ready===true&&review.verdict==='PASS'&&Number(review.totalScore)>=80&&Array.isArray(review.hardFailures)&&review.hardFailures.length===0){passed=true;break;}
              }
            }catch{}
            if(!passed)count++;
          }
          process.stdout.write(String(count));
          NODE
          )"
          echo "DESIGN_GATE_REPAIR_PENDING=$pending"
          active_other="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/company-seed-design-runtime.yml/runs?per_page=20" | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const j=JSON.parse(s),current=Number(process.env.GITHUB_RUN_ID);const n=(j.workflow_runs||[]).filter(r=>r.id!==current&&['queued','in_progress','pending','waiting','requested'].includes(r.status)).length;process.stdout.write(String(n));})")"
          echo "DESIGN_GATE_ACTIVE_OTHER_RUNS=$active_other"
          quota_blocked="$(node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          const clean=value=>String(value??'').trim();
          const uniq=values=>[...new Set(values.map(clean).filter(Boolean))];
          const roles=['planning','graphics','development','qa','balance'];
          const leads=uniq(clean(process.env.COMPANY_GEMINI_LEAD_MODELS).split(',')).slice(0,roles.length);
          const fallback=uniq(clean(process.env.COMPANY_GEMINI_FALLBACK_MODELS).split(','));
          const primarySet=new Set(leads);
          const extras=fallback.filter(model=>!primarySet.has(model));
          const lanes=Object.fromEntries(roles.map((role,index)=>[role,uniq([leads[index],...extras.filter((_,fallbackIndex)=>fallbackIndex%roles.length===index)])]));
          const branch=process.env.COMPANY_RUNTIME_BRANCH;
          const show=file=>execFileSync('git',['show',`origin/${branch}:${file}`],{encoding:'utf8',maxBuffer:32*1024*1024});
          const exists=file=>{try{execFileSync('git',['cat-file','-e',`origin/${branch}:${file}`],{stdio:'ignore'});return true;}catch{return false;}};
          const state=JSON.parse(show('game-seed-state.json'));
          const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
          const get=t=>parts.find(x=>x.type===t)?.value||'';const date=`${get('year')}-${get('month')}-${get('day')}`;
          const dailyQuota=/GenerateRequestsPerDayPerProjectPerModel-FreeTier|requests per day|daily quota/i;
          let blocked=0;
          for(const seed of state.seeds||[]){
            if(clean(seed.status).toUpperCase()!=='ACTIVE')continue;
            const cpPath=`design/${seed.gameId}/${date}/design-checkpoint.json`;
            if(!exists(cpPath))continue;
            let cp={};try{cp=JSON.parse(show(cpPath));}catch{continue;}
            const exhausted=new Set(Object.entries(cp.modelHealth||{}).filter(([,row])=>dailyQuota.test(clean(row?.lastError))).map(([model])=>clean(model).replace(/^gemini:/,'')));
            if(!exhausted.size)continue;
            const tasks=cp.tasks&&typeof cp.tasks==='object'?cp.tasks:{};
            const missingRoles=roles.filter(role=>!Object.prototype.hasOwnProperty.call(tasks,`five_lead_reviews::${role}`));
            const roleBlocked=missingRoles.some(role=>lanes[role].every(model=>exhausted.has(model)));
            const allModels=uniq([clean(process.env.COMPANY_GEMINI_DESIGNER_MODEL),...fallback]);
            if(roleBlocked||allModels.every(model=>exhausted.has(model)))blocked++;
          }
          process.stdout.write(String(blocked));
          NODE
          )"
          echo "DESIGN_GATE_QUOTA_BLOCKED=$quota_blocked"
          all_quota_blocked=0
          if [[ "$pending" =~ ^[1-9][0-9]*$ && "$quota_blocked" == "$pending" ]]; then all_quota_blocked=1; fi
          if [ "$all_quota_blocked" = 0 ]; then
            gh workflow run company-game-seed-bootstrap.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo 'GAME_SEED_CONTINUATION_DISPATCHED=YES'
            echo 'GAME_SEED_CONTINUATION_SCOPE=BATCH_ONCE_AFTER_MATRIX'
          else
            echo 'GAME_SEED_CONTINUATION_DISPATCHED=NO_GEMINI_QUOTA'
            echo 'DESIGN_GATE_QUOTA_STATE=WAITING_FOR_GEMINI_QUOTA'
          fi
          if [ "$all_quota_blocked" = 1 ]; then
            echo 'DESIGN_GATE_REPAIR_LOOP_DISPATCH=WAITING_FOR_GEMINI_QUOTA'
          elif [[ "$pending" =~ ^[1-9][0-9]*$ && "$active_other" == '0' ]]; then
            gh workflow run company-seed-design-runtime.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo 'DESIGN_GATE_REPAIR_LOOP_DISPATCH=YES'
          elif [[ "$pending" =~ ^[1-9][0-9]*$ ]]; then
            echo 'DESIGN_GATE_REPAIR_LOOP_DISPATCH=SKIP_ACTIVE_SIBLING'
          else
            echo 'DESIGN_GATE_REPAIR_LOOP_DISPATCH=NO_ALL_PASS'
          fi
          echo 'DESIGN_GATE_REPAIR_LIMIT=UNLIMITED'
