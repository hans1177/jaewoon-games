name: Company Seed DESIGN_ONLY Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/company-design-cycle.mjs'
      - 'tools/company-design-checkpoint-recovery.mjs'
      - 'tools/company-baseline-gate.mjs'
      - 'tools/company-design-seed-normalize.mjs'
      - 'tools/company-design-gate-scoring-v2.mjs'
      - 'tools/company-strict-production-review.mjs'
      - 'company-learning/platform-release-roadmap.json'
      - 'owner-design-reset-queue.json'
      - 'qa/company-shared-context.test.mjs'
      - 'tools/company-shared-context.mjs'
      - 'company-learning/company-architecture-map.json'
      - 'company-learning/company-log-map.json'
      - '.github/workflows/company-seed-design-runtime.yml'
  schedule:
    - cron: '0 16 * * *' # 01:00 KST fallback; event chain remains primary

permissions:
  contents: write
  actions: write

concurrency:
  # Engine pushes replace only stale push-triggered runs. Continuation/schedule runs keep their checkpointed cycle.
  group: company-seed-design-runtime-${{ github.event_name == 'push' && 'engine-push' || 'continuation' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  COMPANY_RUNTIME_BRANCH: company-runtime
  COMPANY_MODEL_PHASE_CONCURRENCY: '2'
  COMPANY_MODEL_CALL_TIMEOUT_MS: '90000'
  # Model identity is remappable by central policy. Prefer models with remaining free-tier quota before exhausted daily lanes.
  COMPANY_GEMINI_DESIGNER_MODEL: 'gemini-3.5-flash-lite'
  COMPANY_GEMINI_LEAD_MODELS: 'gemini-3.8-flash,gemini-3.7-flash,gemini-3.6-flash,gemini-3.5-flash,gemini-3.5-flash-lite'
  COMPANY_GEMINI_FALLBACK_MODELS: 'gemini-3.8-flash,gemini-3.7-flash,gemini-3.6-flash,gemini-3.5-flash,gemini-3.5-flash-lite,gemini-3.1-pro-preview,gemini-2.5-pro,gemini-2.5-flash,gemini-2.5-flash-lite,gemini-3.1-flash-lite'
  COMPANY_GEMINI_LEAD_FALLBACK_LANES: ''
  COMPANY_VIBE_LOCAL_MODEL: 'qwen3:1.7b'

jobs:
  game-primary-gate:
    runs-on: ubuntu-latest
    outputs:
      defer: ${{ steps.gate.outputs.defer }}
      active_game_work: ${{ steps.gate.outputs.active_game_work }}
      preservation_only: ${{ steps.gate.outputs.preservation_only }}
    steps:
      - name: Defer noncritical work while Vibe2 game primary is active
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          queue_api="repos/${GITHUB_REPOSITORY}/contents/.vibe2/queue.json?ref=vibe2-unreal-core"
          if ! queue_response="$(gh api "$queue_api" 2>/dev/null)"; then
            echo 'defer=true' >> "$GITHUB_OUTPUT"
            echo 'active_game_work=unknown' >> "$GITHUB_OUTPUT"
            echo 'GAME_PRIMARY_GATE=DEFER_QUEUE_UNAVAILABLE'
            exit 0
          fi
          queue_b64="$(jq -r '.content // empty' <<<"$queue_response" | tr -d '\n')"
          queue_json="$(printf '%s' "$queue_b64" | base64 -d 2>/dev/null || true)"
          if [ -z "$queue_json" ] || ! jq -e . >/dev/null 2>&1 <<<"$queue_json"; then
            echo 'defer=true' >> "$GITHUB_OUTPUT"
            echo 'active_game_work=unknown' >> "$GITHUB_OUTPUT"
            echo 'GAME_PRIMARY_GATE=DEFER_QUEUE_INVALID'
            exit 0
          fi
          active_game_work="$(jq '[.tasks[]? | select(
            ((((.status // "") | ascii_downcase) == "queued") or (((.status // "") | ascii_downcase) == "running"))
            and (((.department // "") | ascii_downcase) == "development")
            and (((.type // "") | ascii_downcase) == "implementation"))
          ] | length' <<<"$queue_json")"
          echo "active_game_work=$active_game_work" >> "$GITHUB_OUTPUT"
          echo 'preservation_only=false' >> "$GITHUB_OUTPUT"
          echo 'defer=false' >> "$GITHUB_OUTPUT"
          echo 'preservation_only=false' >> "$GITHUB_OUTPUT"
          if [ "$active_game_work" -gt 0 ]; then
            echo "GAME_PRIMARY_GATE=RUN_PARALLEL_STRICT_DESIGN|active_game_work=$active_game_work"
          else
            echo 'GAME_PRIMARY_GATE=RUN'
          fi

  resolve-seed-targets:
    needs: game-primary-gate
    if: needs.game-primary-gate.outputs.defer != 'true'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.targets.outputs.run }}
      targets: ${{ steps.targets.outputs.targets }}
      parallel_max: ${{ steps.targets.outputs.parallel_max }}
      canary_mode: ${{ steps.targets.outputs.canary_mode }}
      engine_digest: ${{ steps.targets.outputs.engine_digest }}
      pending_total: ${{ steps.targets.outputs.pending_total }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Load latest company runtime state
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --heads origin "$COMPANY_RUNTIME_BRANCH" >/dev/null 2>&1; then
            echo 'COMPANY_RUNTIME_STATE=NOT_CREATED'
            exit 0
          fi
          git fetch origin "$COMPANY_RUNTIME_BRANCH"
          for runtime_path in game-seed-state.json design design-engine-canary.json; do
            if git cat-file -e "origin/$COMPANY_RUNTIME_BRANCH:$runtime_path" 2>/dev/null; then
              git checkout "origin/$COMPANY_RUNTIME_BRANCH" -- "$runtime_path"
            fi
          done
          git reset -- game-seed-state.json design >/dev/null 2>&1 || true
          echo 'COMPANY_RUNTIME_STATE_OVERLAY=YES'
          echo 'DESIGN_ONLY_ARTBOOK_OVERLAY=NO'
          echo 'COMPANY_ENGINE_SOURCE=main'
      - name: Synchronize active owner design reset seeds
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {loadSeedState,saveSeedState} from './tools/game-seed-state.mjs';
          import {activeOwnerDesignResetRequests,materializeOwnerDesignResetSeeds} from './tools/owner-design-reset.mjs';
          const state=loadSeedState();
          const active=activeOwnerDesignResetRequests();
          const result=materializeOwnerDesignResetSeeds(state);
          if(result.changed.length)saveSeedState(state);
          console.log(`OWNER_ACTIVE_DESIGN_RESET_COUNT=${active.length}`);
          console.log(`OWNER_ACTIVE_DESIGN_RESET_MATERIALIZED=${result.changed.length}`);
          console.log(`OWNER_ACTIVE_DESIGN_RESET_IDS=${active.map(x=>x.gameId).join(',')}`);
          NODE

      - name: Validate shared worker policy log and architecture context
        run: |
          node --check tools/company-shared-context.mjs
          node --test qa/company-shared-context.test.mjs
          node tools/company-shared-context.mjs --output=/tmp/company-shared-context-design-plan.json

      - name: Resolve central-policy active incomplete GAME_SEED targets
        id: targets
        env:
          PRESERVATION_ONLY: ${{ needs.game-primary-gate.outputs.preservation_only }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import fs from 'node:fs';
          import path from 'node:path';
          import {createHash} from 'node:crypto';
          const roadmap=JSON.parse(fs.readFileSync('company-learning/platform-release-roadmap.json','utf8'));
          const directive=JSON.parse(fs.readFileSync('company-directive.json','utf8'));
          const designScheduling=directive?.platformStrategy?.designStabilizationScheduling||{};
          const engineFiles=['tools/company-design-cycle.mjs','tools/company-design-checkpoint-recovery.mjs','tools/company-design-gate-scoring-v2.mjs','tools/company-strict-production-review.mjs','tools/company-design-prepromotion-repair.mjs','tools/company-baseline-gate.mjs'];
          const engineDigest=createHash('sha256').update(engineFiles.map(file=>`${file}\n${fs.readFileSync(file,'utf8')}`).join('\n---\n')).digest('hex');
          const canaryMarker=(()=>{try{return JSON.parse(fs.readFileSync('design-engine-canary.json','utf8'));}catch{return null;}})();
          const canaryVerified=canaryMarker?.engineDigest===engineDigest;
          const configuredWip=roadmap?.developmentSpeedExecution?.globalSelectedPlatformDevelopmentWipMax;
          const unboundedByPolicy=configuredWip===null||typeof configuredWip==='undefined';
          const externalBatchMax=Number(roadmap?.developmentSpeedExecution?.externalMatrixBatchMax||256);
          if(!Number.isInteger(externalBatchMax)||externalBatchMax<1)throw new Error('CENTRAL_EXTERNAL_MATRIX_BATCH_MAX_REQUIRED');
          if(unboundedByPolicy&&roadmap?.developmentSpeedExecution?.internalArtificialConcurrencyCapsForbidden!==true)throw new Error('CENTRAL_UNBOUNDED_WIP_CONTRACT_INCOMPLETE');
          if(!unboundedByPolicy&&(!Number.isInteger(Number(configuredWip))||Number(configuredWip)<1))throw new Error('CENTRAL_GAME_WIP_MAX_INVALID');
          const designWipMax=unboundedByPolicy?externalBatchMax:Math.min(Number(configuredWip),externalBatchMax);
          const state=(()=>{try{return JSON.parse(fs.readFileSync('game-seed-state.json','utf8'));}catch{return{seeds:[]};}})();
          const ownerReset=(()=>{try{return JSON.parse(fs.readFileSync('owner-design-reset-queue.json','utf8'));}catch{return{requests:[]};}})();
          const activeResetIds=new Set((ownerReset.requests||[])
            .filter(row=>String(row?.status||'').trim().toUpperCase()==='ACTIVE')
            .map(row=>String(row?.gameId||'').trim())
            .filter(Boolean));
          const designReviewEligible=seed=>{
            const status=String(seed?.status||'').trim().toUpperCase();
            if(['DISCARDED','REMOVED'].includes(status))return false;
            return status==='ACTIVE'||seed?.promotion?.strictDesignReviewContinuesInParallel===true;
          };
          const active=(state.seeds||[]).filter(designReviewEligible);
          const resetAt=Date.parse(state?.ownerAllGamesDesignReset?.updatedAt||'')||0;
          const resetDate=resetAt?new Date(resetAt).toISOString().slice(0,10):'';
          const latestStrictPassFor=(seed)=>{
            const gameRoot=path.join('design',String(seed.gameId));
            if(!fs.existsSync(gameRoot))return null;
            try{
              const dates=fs.readdirSync(gameRoot,{withFileTypes:true}).filter(x=>x.isDirectory()).map(x=>x.name).sort().reverse();
              for(const date of dates){
                const base=path.join(gameRoot,date);
                const statusPath=path.join(base,'cycle-status.json');
                const strictPath=path.join(base,'strict-design-review.json');
                if(!fs.existsSync(statusPath)||!fs.existsSync(strictPath))continue;
                const status=JSON.parse(fs.readFileSync(statusPath,'utf8'));
                const review=JSON.parse(fs.readFileSync(strictPath,'utf8'));
                const evidenceAt=Date.parse(review.reviewedAt||review.generatedAt||review.updatedAt||review.createdAt||'')||0;
                if(resetAt){
                  if(evidenceAt&&evidenceAt<resetAt)continue;
                  if(!evidenceAt&&date<=resetDate)continue;
                }
                const ready=status?.baselineGate?.state==='DESIGN_BASELINE_READY'&&status?.baselineGate?.ready===true;
                if(ready&&review.verdict==='PASS'&&Number(review.totalScore)>=80&&Array.isArray(review.hardFailures)&&review.hardFailures.length===0)return{date,evidenceAt,review,status};
              }
            }catch{}
            return null;
          };
          const strictPassFor=seed=>Boolean(latestStrictPassFor(seed));
          const designEvolution=roadmap?.directNativeDualPlatformDevelopment?.design?.continuousIntelligentDesignEvolution||{};
          const healthReview=designEvolution?.scheduledHealthReview||{};
          const deepReviewHours=Math.max(24,Number(healthReview.deepReviewIntervalHours||168));
          const designEvolutionDueFor=(seed)=>{
            const pass=latestStrictPassFor(seed);
            if(!pass)return{due:true,reason:'STRICT_PASS_MISSING',baselineReviewAt:0};
            const baselineReviewAt=Number(pass.evidenceAt||0);
            const explicitSignalTimes=[
              Date.parse(String(seed?.ownerRequestAt||''))||0,
              Date.parse(String(seed?.ownerDirectiveAt||''))||0,
              Date.parse(String(seed?.ownerDesignRevisionAt||''))||0,
              ...(Array.isArray(seed?.designEvolutionSignals)?seed.designEvolutionSignals
                .filter(row=>String(row?.status||'OPEN').trim().toUpperCase()!=='RESOLVED')
                .map(row=>Date.parse(String(row?.createdAt||row?.updatedAt||''))||0):[])
            ];
            const newestSignal=Math.max(0,...explicitSignalTimes);
            if(newestSignal>baselineReviewAt)return{due:true,reason:'NEW_VERIFIED_OR_OWNER_SIGNAL',baselineReviewAt};
            if(Date.now()-baselineReviewAt>=deepReviewHours*60*60*1000)return{due:true,reason:'PERIODIC_DEEP_HEALTH_REVIEW',baselineReviewAt};
            return{due:false,reason:'PASS_CHECKPOINT_STILL_FRESH_NO_NEW_SIGNAL',baselineReviewAt};
          };
          const platformPriority=seed=>{
            if(designScheduling.mode!=='ROBLOX_FIRST_THEN_OTHER_PLATFORMS')return 0;
            return String(seed?.INITIAL_TARGET_PLATFORM||'').trim().toUpperCase()==='ROBLOX'?0:1;
          };
          const deterministicCheckpointPriority=seed=>{
            const gameRoot=path.join('design',String(seed?.gameId||''));
            if(!fs.existsSync(gameRoot))return 1;
            try{
              const dates=fs.readdirSync(gameRoot,{withFileTypes:true}).filter(x=>x.isDirectory()).map(x=>x.name).sort().reverse();
              for(const date of dates){
                const checkpointPath=path.join(gameRoot,date,'design-checkpoint.json');
                if(!fs.existsSync(checkpointPath))continue;
                const checkpoint=JSON.parse(fs.readFileSync(checkpointPath,'utf8'));
                const checkpointAt=Date.parse(checkpoint.updatedAt||checkpoint.lastSuccessfulModelCallAt||checkpoint.createdAt||'')||0;
                if(resetAt){
                  if(checkpointAt&&checkpointAt<resetAt)continue;
                  if(!checkpointAt&&date<=resetDate)continue;
                }
                if(!checkpoint?.phases?.designer_draft)return 1;
                const rows=Object.entries(checkpoint.phases||{}).filter(([name,value])=>/^deterministic_pre_gate(?:_after_repair_\d+)?$/.test(name)&&value&&typeof value==='object');
                const pass=rows.some(([,value])=>{
                  const threshold=Math.max(80,Number(value.passMinimum||80));
                  const hard=Array.isArray(value.hardFailures)?value.hardFailures:[];
                  const critical=Array.isArray(value.criticalAxisFailures)?value.criticalAxisFailures:[];
                  return Number(value.totalScore)>=threshold&&hard.length===0&&critical.length===0;
                });
                return pass?0:1;
              }
            }catch{}
            return 1;
          };
          const checkpointResumePriority=seed=>{
            const gameRoot=path.join('design',String(seed?.gameId||''));
            if(!fs.existsSync(gameRoot))return 1;
            try{
              const dates=fs.readdirSync(gameRoot,{withFileTypes:true}).filter(x=>x.isDirectory()).map(x=>x.name).sort().reverse();
              for(const date of dates){
                const checkpointPath=path.join(gameRoot,date,'design-checkpoint.json');
                if(!fs.existsSync(checkpointPath))continue;
                const checkpoint=JSON.parse(fs.readFileSync(checkpointPath,'utf8'));
                const checkpointAt=Date.parse(checkpoint.updatedAt||checkpoint.lastSuccessfulModelCallAt||checkpoint.createdAt||'')||0;
                if(resetAt){
                  if(checkpointAt&&checkpointAt<resetAt)continue;
                  if(!checkpointAt&&date<=resetDate)continue;
                }
                const status=String(checkpoint.status||'').trim().toUpperCase();
                if(!status)continue;
                if(['COMPLETE','PASS','DONE','DESIGN_BASELINE_READY'].includes(status))return 1;
                return 0;
              }
            }catch{}
            return 1;
          };
          const preservationOnly=String(process.env.PRESERVATION_ONLY||'').trim().toLowerCase()==='true';
          const preservationSeed=seed=>seed?.REUSE_EXISTING_GAMEPLAY_IMPLEMENTATION===true&&String(seed?.OWNER_REBUILD_MODE||'').trim().toUpperCase()==='PRESERVATION_PRESENTATION_UPGRADE'&&String(seed?.productionClass||'DESIGN_ONLY').trim().toUpperCase()==='DESIGN_ONLY';
          const activeResetSeeds=active.filter(seed=>activeResetIds.has(String(seed?.gameId||'').trim()));
          const activeResetPending=activeResetSeeds.filter(seed=>designEvolutionDueFor(seed).due);
          const eligible=preservationOnly
            ? active.filter(preservationSeed)
            : (activeResetPending.length?activeResetSeeds:active);
          const pending=eligible.filter(seed=>designEvolutionDueFor(seed).due).sort((a,b)=>
            Number(strictPassFor(a))-Number(strictPassFor(b))||
            platformPriority(a)-platformPriority(b)||
            deterministicCheckpointPriority(a)-deterministicCheckpointPriority(b)||
            checkpointResumePriority(a)-checkpointResumePriority(b)||
            String(a.createdAt||'').localeCompare(String(b.createdAt||''))||
            String(a.gameId||'').localeCompare(String(b.gameId||''))
          ).slice(0,preservationOnly?1:designWipMax);
          const selected=canaryVerified?pending:pending.slice(0,preservationOnly?1:2);
          const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
          const get=t=>parts.find(x=>x.type===t)?.value||'';const date=`${get('year')}-${get('month')}-${get('day')}`;
          const targets=selected.map(seed=>{const evolution=designEvolutionDueFor(seed);return{game_id:seed.gameId,game_name:seed.gameName||seed.gameId,seed_id:seed.seedId,category:seed.GAME_CATEGORY,target_platform:String(seed.INITIAL_TARGET_PLATFORM||'').toUpperCase(),date,multiplayer_mode:seed.MULTIPLAYER_DESIGN_MODE||'SINGLE',target_session_minutes:Number(seed.TARGET_SESSION_MINUTES||30),design_evolution_due:evolution.due,design_evolution_reason:evolution.reason,baseline_review_at:Number(evolution.baselineReviewAt||0)};});
          const parallelMax=Math.max(1,Math.min(preservationOnly?1:(canaryVerified?designWipMax:1),targets.length||1));
          console.log(`run=${targets.length?'true':'false'}`);
          console.log(`targets=${JSON.stringify(targets)}`);
          console.log(`parallel_max=${parallelMax}`);
          console.log(`canary_mode=${canaryVerified?'false':'true'}`);
          console.log(`engine_digest=${engineDigest}`);
          console.log(`pending_total=${pending.length}`);
          console.error(`OWNER_ACTIVE_DESIGN_RESET_TARGETS=${activeResetSeeds.length}`);
          console.error(`OWNER_ACTIVE_DESIGN_RESET_PENDING=${activeResetPending.length}`);
          console.error(`GAME_SEED_DESIGN_TARGET_COUNT=${targets.length}`);
          console.error(`GAME_SEED_DESIGN_PENDING_TOTAL=${pending.length}`);
          console.error(`GAME_DESIGN_ENGINE_CANARY=${canaryVerified?'VERIFIED':'REQUIRED'}`);
          console.error(`GAME_DESIGN_ENGINE_DIGEST=${engineDigest}`);
          console.error(`GAME_DESIGN_WIP_MAX=${unboundedByPolicy?'UNBOUNDED_POLICY':designWipMax}`);
          console.error(`GAME_DESIGN_EXTERNAL_MATRIX_BATCH_MAX=${externalBatchMax}`);
          console.error(`GAME_DESIGN_EXECUTION_LANES=${parallelMax}`);
          console.error(`OWNER_PRESERVATION_DESIGN_LANE=${preservationOnly?'ACTIVE_MAX1':'INACTIVE'}`);
          console.error('GAME_DESIGN_DETERMINISTIC_CHECKPOINT_PRIORITY=FIRST');
          console.error('GAME_DESIGN_GATE_BYPASS=NO');
          console.error('GAME_DESIGN_ONLY_STRICT_PASS_REQUIRED=YES');
          console.error(`GAME_DESIGN_WIP_SOURCE=${unboundedByPolicy?'CANONICAL_ROADMAP_UNBOUNDED_EXTERNAL_BATCH':'CANONICAL_ROADMAP_NUMERIC_CAP'}`);
          console.error(`GAME_DESIGN_SCHEDULING_MODE=${designScheduling.mode||'DEFAULT'}`);
          console.error(`DESIGN_HEALTH_SCAN=DAILY|deep_review_hours=${deepReviewHours}`);
          console.error('DESIGN_PASS_IS_CHECKPOINT_NOT_TERMINAL=YES');
          console.error('DESIGN_EVOLUTION_NO_DUE_SIGNAL_MUTATION=NO');
          console.error(`GAME_DESIGN_ROBLOX_FIRST=${designScheduling.mode==='ROBLOX_FIRST_THEN_OTHER_PLATFORMS'?'YES':'NO'}`);
          console.error('GAME_DESIGN_FORCE_PROMOTION=NO');
          console.error('GAME_DESIGN_PORTFOLIO_WIDE_PASS_REQUIRED=NO');
          console.error('STRICT_DESIGN_PASS_THRESHOLD=80');
          console.error('STRICT_DESIGN_EXCELLENT_THRESHOLD=90');
          console.error('DESIGN_ONLY_ARTBOOK_BEFORE_PROMOTION=NO');
          NODE

  design-cycle:
    needs: resolve-seed-targets
    if: needs.resolve-seed-targets.outputs.run == 'true'
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.resolve-seed-targets.outputs.parallel_max) }}
      matrix:
        target: ${{ fromJSON(needs.resolve-seed-targets.outputs.targets) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Checkout isolated company runtime branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$COMPANY_RUNTIME_BRANCH"
          game_path="design/${{ matrix.target.game_id }}"
          for runtime_path in game-seed-state.json "$game_path"; do
            if git cat-file -e "origin/$COMPANY_RUNTIME_BRANCH:$runtime_path" 2>/dev/null; then git checkout "origin/$COMPANY_RUNTIME_BRANCH" -- "$runtime_path"; fi
          done
          git reset -- game-seed-state.json "$game_path" >/dev/null 2>&1 || true
          test -f game-seed-state.json
          cp game-seed-state.json /tmp/company-runtime-seed-state-before.json
          echo 'COMPANY_RUNTIME_STATE_OVERLAY=TARGET_ONLY'
          echo 'DESIGN_ONLY_ARTBOOK_OVERLAY=NO'
          echo 'PUBLIC_MAIN_WRITE=NO'
      - name: Synchronize target owner design reset seed
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {loadSeedState,saveSeedState} from './tools/game-seed-state.mjs';
          import {ensureOwnerDesignResetSeed} from './tools/owner-design-reset.mjs';
          const gameId=String(process.env.GAME_ID||'').trim();
          const state=loadSeedState();
          const result=ensureOwnerDesignResetSeed(state,gameId);
          if(result.changed)saveSeedState(state);
          console.log(`OWNER_TARGET_DESIGN_RESET_SEED=${result.seed?'READY':'NOT_REQUESTED'}`);
          NODE
        env:
          GAME_ID: ${{ matrix.target.game_id }}

      - name: Normalize target GAME_SEED contract
        env:
          GAME_ID: ${{ matrix.target.game_id }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/company-design-seed-normalize.mjs --game-id="$GAME_ID"
          echo 'DESIGN_SEED_NORMALIZATION_STAGE=PRE_DESIGN'

      - name: Revalidate current seed target
        id: target
        env:
          TARGET_GAME_ID: ${{ matrix.target.game_id }}
          TARGET_SEED_ID: ${{ matrix.target.seed_id }}
          TARGET_DESIGN_EVOLUTION_DUE: ${{ matrix.target.design_evolution_due }}
          TARGET_DESIGN_EVOLUTION_REASON: ${{ matrix.target.design_evolution_reason }}
          TARGET_BASELINE_REVIEW_AT: ${{ matrix.target.baseline_review_at }}
        shell: bash
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import fs from 'node:fs';import path from 'node:path';
          const gameId=String(process.env.TARGET_GAME_ID||'').trim(),seedId=String(process.env.TARGET_SEED_ID||'').trim();
          const state=JSON.parse(fs.readFileSync('game-seed-state.json','utf8'));const designReviewEligible=x=>{const status=String(x?.status||'').trim().toUpperCase();return !['DISCARDED','REMOVED'].includes(status)&&(status==='ACTIVE'||x?.promotion?.strictDesignReviewContinuesInParallel===true);};const seed=(state.seeds||[]).find(x=>String(x.gameId)===gameId&&designReviewEligible(x));
          const resetAt=Date.parse(state?.ownerAllGamesDesignReset?.updatedAt||'')||0;
          const resetDate=resetAt?new Date(resetAt).toISOString().slice(0,10):'';
          let strictPass=false,latestPassAt=0;
          const gameRoot=path.join('design',gameId);
          if(seed&&String(seed.seedId)===seedId&&fs.existsSync(gameRoot)){
            try{
              const dates=fs.readdirSync(gameRoot,{withFileTypes:true}).filter(x=>x.isDirectory()).map(x=>x.name).sort().reverse();
              for(const date of dates){
                const base=path.join(gameRoot,date),statusPath=path.join(base,'cycle-status.json'),strictPath=path.join(base,'strict-design-review.json');
                if(!fs.existsSync(statusPath)||!fs.existsSync(strictPath))continue;
                const status=JSON.parse(fs.readFileSync(statusPath,'utf8')),review=JSON.parse(fs.readFileSync(strictPath,'utf8'));
                const evidenceAt=Date.parse(review.reviewedAt||review.generatedAt||review.updatedAt||review.createdAt||'')||0;
                if(resetAt){
                  if(evidenceAt&&evidenceAt<resetAt)continue;
                  if(!evidenceAt&&date<=resetDate)continue;
                }
                if(status?.baselineGate?.state==='DESIGN_BASELINE_READY'&&status?.baselineGate?.ready===true&&review.verdict==='PASS'&&Number(review.totalScore)>=80&&Array.isArray(review.hardFailures)&&review.hardFailures.length===0){strictPass=true;latestPassAt=evidenceAt;break;}
              }
            }catch{}
          }
          const targetDue=String(process.env.TARGET_DESIGN_EVOLUTION_DUE||'').trim().toLowerCase()==='true';
          const selectedBaseline=Number(process.env.TARGET_BASELINE_REVIEW_AT||0);
          const supersededByNewerPass=latestPassAt>selectedBaseline&&selectedBaseline>0;
          const shouldRun=Boolean(seed&&String(seed.seedId)===seedId&&targetDue&&!supersededByNewerPass);
          console.log(`should_run=${shouldRun?'true':'false'}`);
          console.log(`design_evolution_reason=${String(process.env.TARGET_DESIGN_EVOLUTION_REASON||'UNKNOWN')}`);
          console.log(`design_evolution_superseded=${supersededByNewerPass?'true':'false'}`);
          NODE
      - name: Static strict contracts
        if: steps.target.outputs.should_run == 'true'
        run: |
          node --check tools/game-seed-state.mjs
          node --check tools/company-game-seed-contract.mjs
          node --check tools/company-strict-production-review.mjs
          node --check tools/company-design-prepromotion-repair.mjs
          node --check tools/company-design-cycle.mjs
          node --check tools/company-design-checkpoint-recovery.mjs
          node --check tools/company-baseline-gate.mjs
          node --check tools/company-minimum-design-contract.mjs
          node --test qa/company-minimum-design-contract.test.mjs
          echo 'DESIGN_AI_PROVIDER=GEMINI_PRIMARY_VIBE_LOCAL_FALLBACK'
          echo 'DESIGN_GATE_AUTHORITY=DETERMINISTIC_EVIDENCE'
          echo 'GEMINI_API_KEY_REQUIRED_FOR_GATE=NO'
      - name: Recover verified deterministic design checkpoint before external model wait
        id: deterministic_recovery
        if: steps.target.outputs.should_run == 'true'
        env:
          GAME_ID: ${{ matrix.target.game_id }}
          ARTBOOK_DATE: ${{ matrix.target.date }}
        shell: bash
        run: |
          set +e
          node tools/company-design-checkpoint-recovery.mjs --game-id="$GAME_ID" --date="$ARTBOOK_DATE" | tee /tmp/deterministic-design-recovery.txt
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 0 ] && grep -q '^DESIGN_DETERMINISTIC_RECOVERY=PASS$' /tmp/deterministic-design-recovery.txt; then
            echo 'materialized=true' >> "$GITHUB_OUTPUT"
            echo 'DESIGN_EXTERNAL_MODEL_WAIT_BYPASSED=YES'
            echo 'DESIGN_CHECKPOINT_PRESERVED=YES'
          else
            echo 'materialized=false' >> "$GITHUB_OUTPUT"
            echo 'DESIGN_DETERMINISTIC_RECOVERY=NOT_AVAILABLE'
          fi
          exit 0

      - name: Resolve checkpoint-aware Gemini quota lanes
        id: gemini_quota
        if: steps.target.outputs.should_run == 'true' && steps.deterministic_recovery.outputs.materialized != 'true'
        env:
          ARTBOOK_GAME_ID: ${{ matrix.target.game_id }}
          ARTBOOK_DATE: ${{ matrix.target.date }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' | tee /tmp/gemini-quota-governor.txt
          import fs from 'node:fs';
          import path from 'node:path';

          const clean=value=>String(value??'').trim();
          const uniq=values=>[...new Set(values.map(clean).filter(Boolean))];
          const roles=['planning','graphics','development','qa','audio'];
          const directive=JSON.parse(fs.readFileSync('company-directive.json','utf8'));
          const authorizedLeadPool=uniq(directive?.ai?.modelPool||[]);
          const leads=uniq(clean(process.env.COMPANY_GEMINI_LEAD_MODELS).split(','));
          if(leads.length<roles.length)throw new Error(`GEMINI_QUOTA_GOVERNOR_LEAD_COUNT=${leads.length}/${roles.length}`);
          const primary=leads.slice(0,roles.length);
          if(primary.some(model=>!authorizedLeadPool.includes(model)))throw new Error('GEMINI_QUOTA_GOVERNOR_UNAUTHORIZED_LEAD_MODEL');
          const fallback=authorizedLeadPool;
          const laneSpec=clean(process.env.COMPANY_GEMINI_LEAD_FALLBACK_LANES);
          const configuredLanes=Object.fromEntries(roles.map(role=>[role,[]]));
          for(const entry of laneSpec.split(';').map(clean).filter(Boolean)){
            const at=entry.indexOf(':');if(at<1)continue;
            const role=clean(entry.slice(0,at));if(!roles.includes(role))continue;
            configuredLanes[role]=uniq(entry.slice(at+1).split('|'));
          }
          const checkpointPath=path.join('design',clean(process.env.ARTBOOK_GAME_ID),clean(process.env.ARTBOOK_DATE),'design-checkpoint.json');
          let checkpoint={};
          try{checkpoint=JSON.parse(fs.readFileSync(checkpointPath,'utf8'));}catch{}
          const permanentUnavailable=/no longer available to new users|NOT_FOUND|PERMISSION_DENIED/i;
          const retryableQuota=/GenerateRequestsPerDayPerProjectPerModel-FreeTier|requests per day|daily quota|RESOURCE_EXHAUSTED|Quota exceeded/i;
          const dailyQuota=/GenerateRequestsPerDayPerProjectPerModel-FreeTier|requests per day|daily quota/i;
          const DAILY_QUOTA_PROBE_MS=60*60*1000;
          const providerRetryMs=row=>{
            const error=clean(row?.lastError);
            const seconds=Number(error.match(/Please retry in\s+([0-9.]+)s/i)?.[1]||error.match(/"retryDelay"\s*:\s*"([0-9.]+)s"/i)?.[1]);
            const providerMs=Number.isFinite(seconds)&&seconds>0?Math.ceil(seconds*1000):0;
            return dailyQuota.test(error)?Math.max(DAILY_QUOTA_PROBE_MS,providerMs):(providerMs||60*60*1000);
          };
          const modelUnavailable=row=>{
            const error=clean(row?.lastError);
            if(permanentUnavailable.test(error))return true;
            if(!retryableQuota.test(error))return false;
            const updated=Date.parse(row?.updatedAt||'');
            if(!Number.isFinite(updated))return true;
            return Date.now()<updated+providerRetryMs(row);
          };
          const exhausted=new Set();
          for(const [rawModel,row] of Object.entries(checkpoint.modelHealth||{})){
            if(!modelUnavailable(row))continue;
            exhausted.add(clean(rawModel).replace(/^gemini:/,''));
          }
          const completedTasks=checkpoint.tasks&&typeof checkpoint.tasks==='object'?checkpoint.tasks:{};
          const completedPhases=checkpoint.phases&&typeof checkpoint.phases==='object'?checkpoint.phases:{};
          const missingRoles=roles.filter(role=>!Object.prototype.hasOwnProperty.call(completedTasks,`five_lead_reviews::${role}`));
          const currentPhase=clean(checkpoint.currentPhase).toUpperCase()||'BOOTSTRAP';
          const leadPhaseActive=currentPhase==='DEPARTMENT_REVIEWS'||missingRoles.length<roles.length;
          const primarySet=new Set(primary);
          const availableExtraFallbacks=fallback.filter(model=>!primarySet.has(model)&&!exhausted.has(model));
          const adaptiveFallbacks=Object.fromEntries(roles.map(role=>[role,[]]));
          const usedFallbacks=new Set();
          const blockedPrimaryRoles=leadPhaseActive
            ? missingRoles.filter(role=>exhausted.has(primary[roles.indexOf(role)]))
            : [];
          const assignFallback=(role,candidates)=>{
            for(const model of candidates){
              if(exhausted.has(model)||primarySet.has(model)||usedFallbacks.has(model))continue;
              adaptiveFallbacks[role].push(model);
              usedFallbacks.add(model);
              return true;
            }
            return false;
          };
          for(const role of blockedPrimaryRoles){
            if(assignFallback(role,configuredLanes[role]))continue;
            assignFallback(role,availableExtraFallbacks);
          }
          for(const role of missingRoles){
            if(blockedPrimaryRoles.includes(role)||adaptiveFallbacks[role].length)continue;
            assignFallback(role,configuredLanes[role]);
          }
          const lanes=Object.fromEntries(roles.map((role,index)=>[role,uniq([primary[index],...adaptiveFallbacks[role]])]));
          const adaptiveLaneSpec=roles
            .filter(role=>adaptiveFallbacks[role].length)
            .map(role=>`${role}:${adaptiveFallbacks[role].join('|')}`)
            .join(';');
          const blockedRoles=leadPhaseActive?missingRoles.filter(role=>lanes[role].every(model=>exhausted.has(model))):[];
          const designerModel=clean(process.env.COMPANY_GEMINI_DESIGNER_MODEL);
          const designerCheckpointPresent=Object.prototype.hasOwnProperty.call(completedPhases,'designer_draft');
          const generativeAuthoringNeeded=!designerCheckpointPresent||['PRE_GATE_REPAIR','DESIGNER_DRAFT','DESIGNER_REVISION','BOOTSTRAP'].includes(currentPhase);
          const localFallbackNeeded=generativeAuthoringNeeded;
          const runModelCycle=true;
          const geminiDesignerAvailable=!exhausted.has(designerModel);
          console.log('DESIGN_PROVIDER_GOVERNOR=READY_WITH_LOCAL_FAILOVER');
          console.log(`GEMINI_QUOTA_GOVERNOR=${geminiDesignerAvailable?'READY':'DEGRADED_LOCAL_FALLBACK'}`);
          console.log(`GEMINI_QUOTA_CURRENT_PHASE=${currentPhase}`);
          console.log('GEMINI_QUOTA_LEAD_PHASE_BLOCKING=NO');
          console.log('DESIGN_AI_REVIEW_REQUIRED=NO');
          console.log(`GEMINI_UNAVAILABLE_MODELS=${[...exhausted].join(',')||'NONE'}`);
          console.log(`GEMINI_INCOMPLETE_LEAD_ROLES=${missingRoles.join(',')||'NONE'}`);
          console.log(`GEMINI_BLOCKED_LEAD_ROLES=${blockedRoles.join(',')||'NONE'}`);
          console.log(`GEMINI_ADAPTIVE_FALLBACK_LANES=${adaptiveLaneSpec||'NONE'}`);
          console.log(`DESIGN_LOCAL_AUTHORING_FALLBACK_NEEDED=${localFallbackNeeded?'YES':'NO'}`);
          console.log(`GEMINI_QUOTA_CHECKPOINT_PRESERVED=${fs.existsSync(checkpointPath)?'YES':'NO'}`);
          console.log('GEMINI_QUOTA_FULL_CYCLE_RESTART=NO');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`run_model_cycle=true\nquota_state=${geminiDesignerAvailable?'READY':'DEGRADED_LOCAL_FALLBACK'}\nfallback_lanes=${adaptiveLaneSpec}\nlocal_fallback_needed=${localFallbackNeeded?'true':'false'}\n`);
          NODE
      - name: Restore Vibe local design fallback cache
        id: design_local_cache
        if: steps.target.outputs.should_run == 'true' && steps.deterministic_recovery.outputs.materialized != 'true' && steps.gemini_quota.outputs.local_fallback_needed == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.ollama/models
            ~/.cache/vibe2-ollama/bin/ollama
            ~/.cache/vibe2-ollama/lib/ollama
          key: vibe2-ollama-v3-Linux-qwen3-1.7b

      - name: Prepare Vibe local design fallback
        id: design_local
        if: steps.target.outputs.should_run == 'true' && steps.deterministic_recovery.outputs.materialized != 'true' && steps.gemini_quota.outputs.local_fallback_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cached="$HOME/.cache/vibe2-ollama/bin/ollama"
          cached_lib="$HOME/.cache/vibe2-ollama/lib/ollama"
          if [ -x "$cached" ] && [ -d "$cached_lib" ] && find "$cached_lib" -type f -name 'llama-server' -perm -u+x -print -quit | grep -q .; then
            sudo mkdir -p /usr/local/lib/ollama
            sudo cp -a "$cached_lib/." /usr/local/lib/ollama/
            echo "$HOME/.cache/vibe2-ollama/bin" >> "$GITHUB_PATH"
            echo 'DESIGN_LOCAL_RUNTIME_SOURCE=CACHE'
          else
            installed=0
            for attempt in 1 2 3; do
              if curl -fsSL --retry 3 --retry-all-errors --connect-timeout 15 https://ollama.com/install.sh | sh; then installed=1; break; fi
              sleep $((attempt * 4))
            done
            test "$installed" = 1
            mkdir -p "$HOME/.cache/vibe2-ollama/bin" "$cached_lib"
            cp "$(command -v ollama)" "$cached"
            chmod +x "$cached"
            runtime_lib=""
            for candidate in /usr/local/lib/ollama /usr/lib/ollama; do
              if [ -d "$candidate" ] && find "$candidate" -type f -name 'llama-server' -perm -u+x -print -quit | grep -q .; then
                runtime_lib="$candidate"
                break
              fi
            done
            test -n "$runtime_lib"
            cp -a "$runtime_lib/." "$cached_lib/"
            echo "$HOME/.cache/vibe2-ollama/bin" >> "$GITHUB_PATH"
            echo 'DESIGN_LOCAL_RUNTIME_SOURCE=FALLBACK_INSTALL'
          fi
          nohup "$cached" serve > /tmp/design-ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            if [ "$i" = 30 ]; then cat /tmp/design-ollama.log || true; exit 1; fi
            sleep 2
          done
          if "$cached" list | awk 'NR>1 {print $1}' | grep -Fqx "$COMPANY_VIBE_LOCAL_MODEL"; then
            echo 'DESIGN_LOCAL_MODEL_SOURCE=CACHE'
          else
            "$cached" pull "$COMPANY_VIBE_LOCAL_MODEL"
            echo 'DESIGN_LOCAL_MODEL_SOURCE=FALLBACK_PULL'
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo 'DESIGN_LOCAL_AUTHORING_FALLBACK=READY'

      - name: Run seed-backed DESIGN_ONLY pipeline without artbook
        id: design_pipeline
        if: steps.target.outputs.should_run == 'true' && steps.deterministic_recovery.outputs.materialized != 'true' && steps.gemini_quota.outputs.run_model_cycle == 'true'
        env:
          ARTBOOK_GAME_ID: ${{ matrix.target.game_id }}
          ARTBOOK_DATE: ${{ matrix.target.date }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COMPANY_GEMINI_LEAD_FALLBACK_LANES: ${{ steps.gemini_quota.outputs.fallback_lanes }}
          COMPANY_LOCAL_DESIGN_FALLBACK_READY: ${{ steps.design_local.outputs.ready || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          checkpoint_path="design/${{ matrix.target.game_id }}/${{ matrix.target.date }}/design-checkpoint.json"
          progress_path="design/${{ matrix.target.game_id }}/${{ matrix.target.date }}/design-progress.json"
          worktree="/tmp/design-checkpoint-${{ matrix.target.game_id }}"
          last_checkpoint_sync_key=''
          checkpoint_sync_key() {
            node -e "const fs=require('fs');const cp=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));let p={};try{p=JSON.parse(fs.readFileSync(process.argv[2],'utf8'))}catch{};process.stdout.write([cp.status||'',cp.currentPhase||'',(cp.completedPhases||[]).length,p.percent??'',cp.lastSuccessfulModelCallAt||'',Object.values(cp.modelHealth||{}).reduce((sum,row)=>sum+Number(row?.calls||0),0),cp.lastError||''].join('|'))" "$checkpoint_path" "$progress_path"
          }
          persist_design_checkpoint() {
            if [ ! -f "$checkpoint_path" ]; then
              echo 'DESIGN_CHECKPOINT_RUNTIME_PERSIST=NO_CHECKPOINT'
              return 0
            fi
            local sync_key
            sync_key="$(checkpoint_sync_key)"
            if [ "$sync_key" = "$last_checkpoint_sync_key" ]; then return 0; fi
            cp "$checkpoint_path" /tmp/design-checkpoint.json
            [ -f "$progress_path" ] && cp "$progress_path" /tmp/design-progress.json || true
            local pushed=0
            for attempt in 1 2 3 4; do
              git fetch origin "$COMPANY_RUNTIME_BRANCH"
              git worktree remove -f "$worktree" >/dev/null 2>&1 || true
              rm -rf "$worktree"
              git worktree add --detach "$worktree" "origin/$COMPANY_RUNTIME_BRANCH" >/dev/null
              mkdir -p "$worktree/$(dirname "$checkpoint_path")"
              cp /tmp/design-checkpoint.json "$worktree/$checkpoint_path"
              if [ -f /tmp/design-progress.json ]; then cp /tmp/design-progress.json "$worktree/$progress_path"; fi
              git -C "$worktree" config user.name 'jaewoon-seed-design-checkpoint'
              git -C "$worktree" config user.email 'seed-design-checkpoint@users.noreply.github.com'
              git -C "$worktree" add -- "$checkpoint_path" "$progress_path"
              if git -C "$worktree" diff --cached --quiet; then
                pushed=1
                git worktree remove -f "$worktree" >/dev/null 2>&1 || true
                break
              fi
              git -C "$worktree" commit -m "runtime: DESIGN_ONLY progress ${{ matrix.target.game_id }} ${{ matrix.target.date }}" >/dev/null
              if git -C "$worktree" push origin "HEAD:refs/heads/$COMPANY_RUNTIME_BRANCH"; then
                pushed=1
                git worktree remove -f "$worktree" >/dev/null 2>&1 || true
                break
              fi
              git worktree remove -f "$worktree" >/dev/null 2>&1 || true
              sleep "$attempt"
            done
            test "$pushed" = 1
            last_checkpoint_sync_key="$sync_key"
            echo "DESIGN_CHECKPOINT_RUNTIME_PERSIST=YES|$sync_key"
            echo 'DESIGN_PROGRESS_RUNTIME_PERSIST=YES'
            echo 'PUBLIC_MAIN_WRITE=NO'
          }
          pipeline_pid=0
          sync_pid=0
          cleanup_design_runtime() {
            rc=$?
            trap - EXIT TERM INT
            [ "$sync_pid" -gt 0 ] && kill "$sync_pid" >/dev/null 2>&1 || true
            [ "$pipeline_pid" -gt 0 ] && kill "$pipeline_pid" >/dev/null 2>&1 || true
            persist_design_checkpoint || true
            exit "$rc"
          }
          trap 'exit 143' TERM INT
          trap cleanup_design_runtime EXIT
          node tools/artbook-production-pipeline.mjs &
          pipeline_pid=$!
          (
            while kill -0 "$pipeline_pid" >/dev/null 2>&1; do
              sleep 15
              persist_design_checkpoint || true
            done
          ) &
          sync_pid=$!
          set +e
          wait "$pipeline_pid"
          rc=$?
          set -e
          kill "$sync_pid" >/dev/null 2>&1 || true
          wait "$sync_pid" >/dev/null 2>&1 || true
          sync_pid=0
          persist_design_checkpoint || true
          if [ "$rc" -eq 0 ]; then
            echo 'complete=true' >> "$GITHUB_OUTPUT"
            echo 'quota_state=READY' >> "$GITHUB_OUTPUT"
            echo 'DESIGN_MODEL_CYCLE_RESULT=COMPLETE'
            exit 0
          fi

          quota_wait='false'
          if [ -f "$checkpoint_path" ]; then
            quota_wait="$(CHECKPOINT="$checkpoint_path" node <<'NODE'
          const fs=require('fs');
          const clean=value=>String(value??'').trim();
          const uniq=values=>[...new Set(values.map(clean).filter(Boolean))];
          const roles=['planning','graphics','development','qa','audio'];
          const leads=uniq(clean(process.env.COMPANY_GEMINI_LEAD_MODELS).split(',')).slice(0,roles.length);
          const laneSpec=clean(process.env.COMPANY_GEMINI_LEAD_FALLBACK_LANES);
          const configured=Object.fromEntries(roles.map(role=>[role,[]]));
          for(const entry of laneSpec.split(';').map(clean).filter(Boolean)){
            const at=entry.indexOf(':');
            if(at<1)continue;
            const role=clean(entry.slice(0,at));
            if(!roles.includes(role))continue;
            configured[role]=uniq(entry.slice(at+1).split('|'));
          }
          const lanes=Object.fromEntries(roles.map((role,index)=>[role,uniq([leads[index],...configured[role]])]));
          const cp=JSON.parse(fs.readFileSync(process.env.CHECKPOINT,'utf8'));
          const permanentUnavailable=/no longer available to new users|NOT_FOUND|PERMISSION_DENIED/i;
          const retryableQuota=/GenerateRequestsPerDayPerProjectPerModel-FreeTier|requests per day|daily quota|RESOURCE_EXHAUSTED|Quota exceeded/i;
          const dailyQuota=/GenerateRequestsPerDayPerProjectPerModel-FreeTier|requests per day|daily quota/i;
          const DAILY_QUOTA_PROBE_MS=60*60*1000;
          const providerRetryMs=row=>{
            const error=clean(row?.lastError);
            const seconds=Number(error.match(/Please retry in\s+([0-9.]+)s/i)?.[1]||error.match(/"retryDelay"\s*:\s*"([0-9.]+)s"/i)?.[1]);
            const providerMs=Number.isFinite(seconds)&&seconds>0?Math.ceil(seconds*1000):0;
            return dailyQuota.test(error)?Math.max(DAILY_QUOTA_PROBE_MS,providerMs):(providerMs||60*60*1000);
          };
          const modelUnavailable=row=>{
            const error=clean(row?.lastError);
            if(permanentUnavailable.test(error))return true;
            if(!retryableQuota.test(error))return false;
            const updated=Date.parse(row?.updatedAt||'');
            if(!Number.isFinite(updated))return true;
            return Date.now()<updated+providerRetryMs(row);
          };
          const exhausted=new Set(Object.entries(cp.modelHealth||{}).filter(([,row])=>modelUnavailable(row)).map(([model])=>clean(model).replace(/^gemini:/,'')));
          const tasks=cp.tasks&&typeof cp.tasks==='object'?cp.tasks:{};
          const phases=cp.phases&&typeof cp.phases==='object'?cp.phases:{};
          const missingRoles=roles.filter(role=>!Object.prototype.hasOwnProperty.call(tasks,`five_lead_reviews::${role}`));
          const currentPhase=clean(cp.currentPhase).toUpperCase()||'BOOTSTRAP';
          const leadPhaseActive=currentPhase==='DEPARTMENT_REVIEWS'||missingRoles.length<roles.length;
          const roleBlocked=leadPhaseActive&&missingRoles.some(role=>lanes[role].every(model=>exhausted.has(model)));
          const designer=clean(process.env.COMPANY_GEMINI_DESIGNER_MODEL);
          const designerBlocked=!Object.prototype.hasOwnProperty.call(phases,'designer_draft')&&exhausted.has(designer);
          const currentFailureQuota=retryableQuota.test(clean(cp.lastError));
          const aggregateCapacityFailure=/GEMINI_NO_AVAILABLE_(?:CANDIDATES|MODELS)\b/i.test(clean(cp.lastError));
          const checkpointHasQuotaEvidence=Object.values(cp.modelHealth||{}).some(row=>retryableQuota.test(clean(row?.lastError)));
          const currentFailureAggregateCapacity=aggregateCapacityFailure&&checkpointHasQuotaEvidence;
          if(currentFailureQuota||currentFailureAggregateCapacity)console.error('DESIGN_CURRENT_FAILURE_CLASS=EXTERNAL_MODEL_CAPACITY');
          process.stdout.write(currentFailureQuota||currentFailureAggregateCapacity||roleBlocked||(!leadPhaseActive&&designerBlocked)?'true':'false');
