# 파일명: .github/workflows/company-store.yml
# 역할: 회사 상태 저장 파일을 검증하고 GitHub Secret 기반 HMAC 무결성 서명을 생성·재검증한다.

name: Company Store Integrity

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - company-status.json
      - .github/workflows/company-store.yml

permissions:
  contents: read

jobs:
  verify-company-store:
    runs-on: ubuntu-latest
    env:
      COMPANY_STORE_HMAC_SECRET: ${{ secrets.COMPANY_STORE_HMAC_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check company store secret exists
        shell: bash
        run: |
          set -euo pipefail
          test -n "${COMPANY_STORE_HMAC_SECRET:-}"

      - name: Check company store secret length
        shell: bash
        run: |
          set -euo pipefail
          test "${#COMPANY_STORE_HMAC_SECRET}" -ge 64

      - name: Validate company status structure
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const status = JSON.parse(fs.readFileSync('company-status.json', 'utf8'));
          if (status.version !== 1) throw new Error('unsupported company status version');
          if (!status.policy || !status.summary || !status.redevelopmentReview) {
            throw new Error('company status required sections are missing');
          }
          console.log('company status structure: PASS');
          NODE

      - name: Sign company status
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const raw = fs.readFileSync('company-status.json');
          const secret = process.env.COMPANY_STORE_HMAC_SECRET;
          const digest = crypto.createHmac('sha256', secret).update(raw).digest('hex');
          const signature = {
            version: 1,
            algorithm: 'HMAC-SHA256',
            source: 'company-status.json',
            commit: process.env.GITHUB_SHA,
            hmac: digest
          };
          fs.writeFileSync('company-status.sig.json', JSON.stringify(signature, null, 2) + '\n');
          console.log('company store signature: PASS');
          NODE

      - name: Verify generated signature
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const raw = fs.readFileSync('company-status.json');
          const signature = JSON.parse(fs.readFileSync('company-status.sig.json', 'utf8'));
          const secret = process.env.COMPANY_STORE_HMAC_SECRET;

          if (signature.version !== 1) throw new Error('unsupported signature version');
          if (signature.algorithm !== 'HMAC-SHA256') throw new Error('unexpected signature algorithm');
          if (signature.source !== 'company-status.json') throw new Error('unexpected signature source');
          if (signature.commit !== process.env.GITHUB_SHA) throw new Error('signature commit mismatch');

          const expected = crypto.createHmac('sha256', secret).update(raw).digest();
          const actual = Buffer.from(String(signature.hmac || ''), 'hex');
          if (actual.length !== expected.length || !crypto.timingSafeEqual(actual, expected)) {
            throw new Error('company status HMAC verification failed');
          }
          console.log('company store signature verification: PASS');
          NODE

      - name: Upload signed company status
        uses: actions/upload-artifact@v4
        with:
          name: company-store-integrity
          path: |
            company-status.json
            company-status.sig.json
          if-no-files-found: error
          retention-days: 14
