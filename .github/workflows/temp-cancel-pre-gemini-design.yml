name: Cancel Pre-Gemini Design Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-cancel-pre-gemini-design.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel superseded Gemini DESIGN_ONLY run 1021
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=35312988820
          state="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status')"
          echo "PRE_GEMINI_RUN_STATUS=$state"
          if [[ "$state" =~ ^(queued|in_progress|pending|waiting|requested)$ ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/force-cancel" >/dev/null
            echo 'PRE_GEMINI_RUN_FORCE_CANCEL_REQUESTED=YES'
          else
            echo 'PRE_GEMINI_RUN_CANCEL_REQUESTED=NO_ALREADY_TERMINAL'
          fi
          echo 'KEEP_GEMINI_RUN_ID=35313263863'
