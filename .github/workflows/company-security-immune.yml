              ||!same(head.roblox?.deploymentControl?.verifiedCyclePublication?.sequence,requiredRobloxSequence)
              ||!same(loop?.sequence,requiredSequence)
              ||!same(record,requiredRecord)
              ||head.version!==base.version+1
              ||head.developmentSpeedExecution?.candidateReleasePromotionChecks?.webRequiredDeploymentCheck!=='GitHub Pages'
              ||loop?.platformBindings?.WEB?.deploymentTarget!=='GITHUB_PAGES_EXISTING_STATIC_SITE'
              ||loop?.developmentGamePublicationAllowed!==true
              ||loop?.publishBeforeF9Forbidden!==true
              ||loop?.exactVerifiedVersionRequiredForPublishAttempt!==true
              ||head.changeRecord?.playableWebMandatoryDeployment20261002?.cloudflareMainRequiredBeforeVibePass!==false
              ||head.changeRecord?.playableWebMandatoryDeployment20261002?.githubPagesMainRequiredBeforeVibePass!==true
              ||base.changeRecord?.playableWebMandatoryDeployment20261002?.nextBuildUpBeforeDeploymentSuccessForbidden!==true
              ||head.changeRecord?.playableWebMandatoryDeployment20261002?.nextBuildUpBeforeDeploymentSuccessForbidden!==false
              ||head.fixedAutonomousDevelopmentOperatingContract?.serverDeployment?.numericalScoreBlocksVerifiedDeployment!==false
              ||head.ownerCanonicalRules?.constitutionalBinding?.enforcerRequiredBeforeWorkerSourceWrite!==true
              ||!changes.some(key=>key==='changeRecord.ownerEveryGameF9Publish20261018')
              ||changes.some(key=>releaseKeys.has(key)&&!same(key==='changeRecord.ownerEveryGameF9Publish20261018'?record:undefined,
                key==='changeRecord.ownerEveryGameF9Publish20261018'?requiredRecord:undefined))
            )throw new Error('SECURITY_OWNER_F9_PAGES_APPROVAL_INVARIANT_FAIL');
            console.log('SECURITY_OWNER_APPROVED_F9_PAGES_POLICY_EXACT_SCOPE=PASS');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'pass=YES\n');
          console.log('SECURITY_AUTOMATED_OWNER_WEB3D_APPROVAL=PASS; changedKeys='+changes.length);
          NODE

      - name: Enforce quarantine verdict
        env:
          VERDICT: ${{ needs.scan.outputs.verdict }}
          HIGHEST: ${{ needs.scan.outputs.highest }}
          EVENT_NAME: ${{ github.event_name }}
          REVIEW_ONLY: ${{ needs.scan.outputs.review_only }}
          AUTO_PRUNE_PASS: ${{ steps.auto_prune.outputs.pass || 'NO' }}
          AUTO_POLICY_PASS: ${{ steps.auto_policy.outputs.pass || 'NO' }}
        run: |
          set -euo pipefail
          echo "VIBE_SECURITY_FINAL=$VERDICT"
          echo "VIBE_SECURITY_HIGHEST=$HIGHEST"
          case "$VERDICT" in
            PASS|REVIEW|QUARANTINE) ;;
            *) echo 'VIBE_SECURITY_ACTION=SCAN_RESULT_REQUIRED'; exit 1 ;;
          esac
          if [ "$VERDICT" = 'QUARANTINE' ]; then
            echo 'VIBE_SECURITY_ACTION=QUARANTINE_AFFECTED_CHANGE'
            exit 1
          fi
          if [ "$VERDICT" = 'REVIEW' ]; then
            if [ "$EVENT_NAME" = 'pull_request' ]; then
              test "$REVIEW_ONLY" = 'YES'
              if [ "$AUTO_PRUNE_PASS" = 'YES' ]; then
                echo 'VIBE_SECURITY_ACTION=ALLOW_VERIFIED_CURRENT_USE_AUTO_PRUNE'
                echo 'VIBE_SECURITY_REVIEW_STATE=DETERMINISTIC_ARCHIVE_ONLY_PRUNE_PASS'
                exit 0
              fi
              echo 'VIBE_SECURITY_ACTION=DETERMINISTIC_OWNER_POLICY_AUTO_REVIEW'
              test "$AUTO_POLICY_PASS" = 'YES'
              echo 'VIBE_SECURITY_REVIEW_STATE=AUTOMATED_VERIFIED_OWNER_WEB3D_POLICY_PASS'
              exit 0
            fi
            echo 'VIBE_SECURITY_REVIEW_STATE=RECORDED_NONBLOCKING_PUSH'
            exit 0
          fi
          echo 'VIBE_SECURITY_ACTION=ALLOW'
