name: Company Security Immune System

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'tools/company-security-*.mjs'
      - 'tools/company-shared-context.mjs'
      - 'tools/company-constitution-enforcer.mjs'
      - 'tools/vibe2-central-work-contract.mjs'
      - 'tools/vibe2-system-steward.mjs'
      - 'tools/vibe2-system-architecture-contract.mjs'
      - 'qa/company-security-*.test.mjs'
      - 'company-learning/security-immune-system.json'
      - 'company-learning/platform-release-roadmap.json'
      - 'company-learning/company-log-map.json'
      - 'company-learning/company-architecture-map.json'
      - 'company-directive.json'
      - 'package.json'
      - 'package-lock.json'
      - 'pnpm-lock.yaml'
      - 'yarn.lock'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'tools/company-security-*.mjs'
      - 'tools/company-shared-context.mjs'
      - 'tools/company-constitution-enforcer.mjs'
      - 'tools/vibe2-central-work-contract.mjs'
      - 'tools/vibe2-system-steward.mjs'
      - 'tools/vibe2-system-architecture-contract.mjs'
      - 'qa/company-security-*.test.mjs'
      - 'company-learning/security-immune-system.json'
      - 'company-learning/platform-release-roadmap.json'
      - 'company-learning/company-log-map.json'
      - 'company-learning/company-architecture-map.json'
      - 'company-directive.json'
      - 'package.json'
      - 'package-lock.json'
      - 'pnpm-lock.yaml'
      - 'yarn.lock'
  # 실제 변경 후보 또는 수동 요청만 검사한다. 같은 최근 커밋을 매일 다시 검사하지 않는다.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-slim
    timeout-minutes: 8
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.scan.outputs.verdict }}
      highest: ${{ steps.scan.outputs.highest }}
      findings: ${{ steps.scan.outputs.findings }}
      review_only: ${{ steps.scan.outputs.review_only }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          fetch-tags: false
          filter: blob:none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve security scan range
        id: range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head_sha="${PR_HEAD:-${CURRENT_SHA}}"
          if [ "$EVENT_NAME" = 'pull_request' ] && [ -n "${PR_BASE:-}" ]; then
            base_sha="$PR_BASE"
          elif [ "$EVENT_NAME" = 'push' ] && [ -n "${PUSH_BEFORE:-}" ] && ! printf '%s' "$PUSH_BEFORE" | grep -Eq '^0+$'; then
            base_sha="$PUSH_BEFORE"
          else
            base_sha="$(git rev-parse "$head_sha^" 2>/dev/null || git rev-parse "$head_sha")"
          fi
          git cat-file -e "$base_sha^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$base_sha"
          git cat-file -e "$head_sha^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$head_sha"
          git cat-file -e "$base_sha^{commit}"
          git cat-file -e "$head_sha^{commit}"
          echo "base=$base_sha" >> "$GITHUB_OUTPUT"
          echo "head=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Resolve impact-scoped security contract work
        id: scope
        env:
          BASE_SHA: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > /tmp/security-scope-files.txt 2>/dev/null || git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/security-scope-files.txt
          contract_changed=NO
          if grep -Eq '^(\.github/workflows/company-security-immune\.yml|tools/company-security-[^/]+\.mjs|qa/company-security-[^/]+\.test\.mjs|tools/company-shared-context\.mjs|tools/company-constitution-enforcer\.mjs|company-learning/security-immune-system\.json|company-directive\.json)$' /tmp/security-scope-files.txt; then
            contract_changed=YES
          fi
          echo "contract_changed=$contract_changed" >> "$GITHUB_OUTPUT"
          echo "SECURITY_CONTRACT_FULL_QA=$contract_changed"
          echo 'SECURITY_PATCH_SCAN_ALWAYS=YES'

      - name: Synchronize security context
        run: node tools/company-shared-context.mjs --output=/tmp/security-shared-context.json

      - name: Scan changed attack surface
        id: scan
        shell: bash
        env:
          BASE_SHA: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
        run: |
          set -euo pipefail
          git diff --unified=0 --no-color "$BASE_SHA...$HEAD_SHA" > /tmp/security.patch || git diff --unified=0 --no-color "$BASE_SHA" "$HEAD_SHA" > /tmp/security.patch
          cp /tmp/security-scope-files.txt /tmp/security-files.txt

          set +e
          node tools/company-security-steward.mjs             --base="$BASE_SHA" --head="$HEAD_SHA"             --patch=/tmp/security.patch             --files=/tmp/security-files.txt             --output=/tmp/security-report.json | tee /tmp/security-scan.log
          scan_code=$?
          set -e

          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('/tmp/security-report.json','utf8'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`verdict=${r.verdict}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`highest=${r.highestSeverity}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`security_contract_changed=${r.securityContractChanged?'YES':'NO'}\n`);
          console.log('SECURITY_DESIGN_DIAGNOSTICS='+JSON.stringify(r.productionDesignDiagnostics||[]));
          const findings=r.findings||[];
          const reviewOnly=r.verdict==='REVIEW'&&findings.length>0&&findings.every(row=>row.disposition==='REVIEW'&&row.rule==='CENTRAL_AUTHORITY_MUTATION_REQUIRES_REVIEW');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`findings=${findings.length}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`review_only=${reviewOnly?'YES':'NO'}\n`);
          console.log('SECURITY_REPORT='+JSON.stringify({verdict:r.verdict,highestSeverity:r.highestSeverity,findings:findings.length,reviewOnly}));
          NODE

          case "$scan_code" in
            0|2) ;;
            *) exit "$scan_code" ;;
          esac

      - name: Verify immune-system contracts only when security authority changed
        if: ${{ steps.scope.outputs.contract_changed == 'YES' || steps.scan.outputs.security_contract_changed == 'YES' }}
        run: |
          set -euo pipefail
          node --check tools/company-security-steward.mjs
          node --check tools/company-security-incident.mjs
          node --check tools/company-security-learning.mjs
          node --test qa/company-security-steward.test.mjs

      - uses: actions/upload-artifact@v4
        id: upload
        if: always()
        with:
          name: company-security-report-${{ github.run_id }}
          path: |
            /tmp/security-report.json
            /tmp/security-scan.log
            /tmp/security-shared-context.json
          if-no-files-found: error
          retention-days: 14

  record_incident:
    needs: scan
    if: ${{ always() && (needs.scan.outputs.verdict == 'REVIEW' || needs.scan.outputs.verdict == 'QUARANTINE') && github.event_name != 'pull_request' }}
    runs-on: ubuntu-slim
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          fetch-tags: false
          filter: blob:none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          name: company-security-report-${{ github.run_id }}
          path: /tmp/security-report

      - name: Persist quarantined incident and security recovery task
        env:
          HIGHEST: ${{ needs.scan.outputs.highest }}
          VERDICT: ${{ needs.scan.outputs.verdict }}
          SECURITY_ARTIFACT_ID: ${{ needs.scan.outputs.artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin vibe2-unreal-core --quiet
          rm -rf /tmp/security-control
          git worktree prune
          git worktree add /tmp/security-control origin/vibe2-unreal-core

          node tools/company-security-incident.mjs             --command=record             --store=/tmp/security-control/.vibe2/security-incidents.json             --report=/tmp/security-report/security-report.json             --security-run="${GITHUB_RUN_ID}"             --security-artifact="$SECURITY_ARTIFACT_ID"

          if [ "$VERDICT" = 'QUARANTINE' ]; then
            node tools/company-recovery-queue.mjs             --command=enqueue             --queue=/tmp/security-control/.vibe2/recovery-queue.json             --priority=critical             --source-queue=security             --source-task="security-run-${GITHUB_RUN_ID}"             --stage=SECURITY_IMMUNE_SCAN             --signature="security-quarantine-${HIGHEST:-UNKNOWN}"             --blast-radius=affected-change             --evidence="security-run:${GITHUB_RUN_ID},security-report:artifact-${GITHUB_RUN_ID}"             --security-report=/tmp/security-report/security-report.json             --strategy=SECURITY_CONTAIN_REMEDIATE_RESCAN_PRIMARY_AI_REVIEW             --verify=RERUN_SECURITY_SCAN,VERIFY_NO_SECRET_OR_MALWARE_PAYLOAD,REGRESSION_RESCAN,PRIMARY_AI_SECURITY_REVIEW             --owner=SYSTEM_AI
          else
            echo 'SECURITY_REVIEW_ONLY_RECOVERY_QUEUE=NO'
          fi

          cd /tmp/security-control
          git config user.name 'jaewoon-security-steward'
          git config user.email 'security-steward@users.noreply.github.com'
          git add .vibe2/security-incidents.json .vibe2/recovery-queue.json
          if ! git diff --cached --quiet; then
            git commit -m 'security: quarantine incident and recovery task [skip ci]'
            for attempt in 1 2 3; do
              if git pull --rebase origin vibe2-unreal-core && git push origin HEAD:vibe2-unreal-core; then exit 0; fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 2))
            done
            exit 1
          fi

  enforce:
    needs: [scan, record_incident]
    if: ${{ always() && (needs.scan.result != 'success' || needs.scan.outputs.verdict != 'PASS') }}
    runs-on: ubuntu-slim
    timeout-minutes: 4
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout exact PR head for deterministic auto-prune verification
        if: ${{ github.event_name == 'pull_request' && needs.scan.outputs.verdict == 'REVIEW' && needs.scan.outputs.review_only == 'YES' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify records-governance current-use auto-prune
        id: auto_prune
        if: ${{ github.event_name == 'pull_request' && needs.scan.outputs.verdict == 'REVIEW' && needs.scan.outputs.review_only == 'YES' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'pass=NO' >> "$GITHUB_OUTPUT"
          if [[ "$HEAD_REF" != records/central-current-use-* ]]; then
            echo 'CENTRAL_AUTO_PRUNE_SECURITY=NOT_AUTO_PRUNE_BRANCH'
            exit 0
          fi
          if [[ "$PR_TITLE" != 'records: auto-prune unused central policy' ]]; then
            echo 'CENTRAL_AUTO_PRUNE_SECURITY=TITLE_MISMATCH'
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --name-only "$BASE_SHA" HEAD > /tmp/central-prune-files.txt
          if grep -Ev '^(company-learning/(platform-release-roadmap|company-architecture-map|company-log-map)\.json|company-records/operations/[0-9]{4}/[0-9]{4}-[0-9]{2}-[0-9]{2}/company/(central-policy-archive--central-policy-current-use-[a-z0-9-]+|central-document-archive--central-companion-current-use-[a-z0-9-]+)\.json)$' /tmp/central-prune-files.txt | grep -q .; then
            echo 'CENTRAL_AUTO_PRUNE_SECURITY=UNEXPECTED_FILE'
            cat /tmp/central-prune-files.txt
            exit 0
          fi
          grep -Eq '^company-learning/(platform-release-roadmap|company-architecture-map|company-log-map)\.json$' /tmp/central-prune-files.txt
          grep -Eq '^company-records/operations/.+/(central-policy-archive--central-policy-current-use-|central-document-archive--central-companion-current-use-).+\.json$' /tmp/central-prune-files.txt
          node tools/company-records-governance.mjs --central-report
          BASE_SHA="$BASE_SHA" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {findCurrentCentralPolicyReferences,findCurrentCompanionDocumentReferences} from './tools/company-records-governance.mjs';

          const baseSha=process.env.BASE_SHA;
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const readBase=p=>JSON.parse(execFileSync('git',['show',baseSha+':'+p],{encoding:'utf8'}));
          const changed=fs.readFileSync('/tmp/central-prune-files.txt','utf8').split(/\r?\n/).filter(Boolean);
          const policyPath='company-learning/platform-release-roadmap.json';
          const architecturePath='company-learning/company-architecture-map.json';
          const logMapPath='company-learning/company-log-map.json';
          const policyArchives=changed.filter(x=>x.includes('/central-policy-archive--central-policy-current-use-')).map(read);
          const companionArchives=changed.filter(x=>x.includes('/central-document-archive--central-companion-current-use-')).map(read);
          if(policyArchives.length>1)throw new Error('AUTO_PRUNE_MULTIPLE_POLICY_ARCHIVES_FORBIDDEN');
          if(companionArchives.length>1)throw new Error('AUTO_PRUNE_MULTIPLE_COMPANION_ARCHIVES_FORBIDDEN');

          const get=(root,dotted)=>{
            let cur=root;
            for(const key of dotted.split('.').filter(Boolean)){
              if(!cur||typeof cur!=='object'||!Object.hasOwn(cur,key))return undefined;
              cur=cur[key];
            }
            return cur;
          };
          const del=(root,dotted)=>{
            const parts=dotted.split('.').filter(Boolean),last=parts.pop();
            let cur=root;
            for(const key of parts){
              if(!cur||typeof cur!=='object'||!Object.hasOwn(cur,key))return false;
              cur=cur[key];
            }
            if(!cur||typeof cur!=='object'||!Object.hasOwn(cur,last))return false;
            delete cur[last];
            return true;
          };
          const isReferenced=(path,refKeys)=>refKeys.includes('*')||refKeys.some(ref=>ref===path||ref.startsWith(path+'.')||path.startsWith(ref+'.'));

          if(changed.includes(policyPath)){
            if(policyArchives.length!==1)throw new Error('AUTO_PRUNE_POLICY_ARCHIVE_REQUIRED');
            const archive=policyArchives[0];
            if(archive?.data?.mode!=='AUTO_CURRENT_USE_ONLY')throw new Error('AUTO_PRUNE_POLICY_MODE_REQUIRED');
            const paths=archive?.data?.archivedPaths||[];
            const payload=archive?.data?.archivedPayload||{};
            if(!Array.isArray(paths)||!paths.length)throw new Error('AUTO_PRUNE_POLICY_PATHS_REQUIRED');
            const head=read(policyPath);
            const base=readBase(policyPath);
            const refKeys=Object.keys(findCurrentCentralPolicyReferences());
            const reconstructed=structuredClone(base);
            for(const p of paths){
              if(isReferenced(p,refKeys))throw new Error('AUTO_PRUNE_REFERENCED_POLICY_PATH:'+p);
              const prior=get(base,p);
              if(prior===undefined)throw new Error('AUTO_PRUNE_POLICY_BASE_PATH_MISSING:'+p);
              if(JSON.stringify(prior)!==JSON.stringify(payload[p]))throw new Error('AUTO_PRUNE_POLICY_ARCHIVE_PAYLOAD_MISMATCH:'+p);
              if(get(head,p)!==undefined)throw new Error('AUTO_PRUNE_POLICY_HEAD_PATH_NOT_REMOVED:'+p);
              if(!del(reconstructed,p))throw new Error('AUTO_PRUNE_POLICY_RECONSTRUCT_DELETE_FAILED:'+p);
            }
            reconstructed.centralDocumentRetention=head.centralDocumentRetention;
            if(JSON.stringify(reconstructed)!==JSON.stringify(head))throw new Error('AUTO_PRUNE_NON_ARCHIVAL_POLICY_MUTATION');
          }else if(policyArchives.length){
            throw new Error('AUTO_PRUNE_POLICY_ARCHIVE_WITHOUT_POLICY_CHANGE');
          }

          const companionChanged=[
            ['architecture',architecturePath],
            ['logMap',logMapPath]
          ].filter(([,sourcePath])=>changed.includes(sourcePath));
          if(companionChanged.length){
            if(companionArchives.length!==1)throw new Error('AUTO_PRUNE_COMPANION_ARCHIVE_REQUIRED');
            const archive=companionArchives[0];
            if(archive?.data?.mode!=='AUTO_CURRENT_USE_COMPANION')throw new Error('AUTO_PRUNE_COMPANION_MODE_REQUIRED');
            const documents=archive?.data?.documents||{};
            const refs=findCurrentCompanionDocumentReferences();
            const allowedKeys=new Set(companionChanged.map(([documentKey])=>documentKey));
            for(const documentKey of Object.keys(documents))if(!allowedKeys.has(documentKey))throw new Error('AUTO_PRUNE_UNCHANGED_COMPANION_ARCHIVED:'+documentKey);
            for(const [documentKey,sourcePath] of companionChanged){
              const row=documents[documentKey];
              if(!row||row.sourcePath!==sourcePath)throw new Error('AUTO_PRUNE_COMPANION_DOCUMENT_REQUIRED:'+documentKey);
              const paths=Array.isArray(row.archivedPaths)?row.archivedPaths:[];
              const payload=row.archivedPayload||{};
              if(!paths.length)throw new Error('AUTO_PRUNE_COMPANION_PATHS_REQUIRED:'+documentKey);
              const head=read(sourcePath);
              const base=readBase(sourcePath);
              const refKeys=Object.keys(refs[documentKey]||{});
              const reconstructed=structuredClone(base);
              for(const p of paths){
                if(isReferenced(p,refKeys))throw new Error('AUTO_PRUNE_REFERENCED_COMPANION_PATH:'+documentKey+':'+p);
                const prior=get(base,p);
                if(prior===undefined)throw new Error('AUTO_PRUNE_COMPANION_BASE_PATH_MISSING:'+documentKey+':'+p);
                if(JSON.stringify(prior)!==JSON.stringify(payload[p]))throw new Error('AUTO_PRUNE_COMPANION_ARCHIVE_PAYLOAD_MISMATCH:'+documentKey+':'+p);
                if(get(head,p)!==undefined)throw new Error('AUTO_PRUNE_COMPANION_HEAD_PATH_NOT_REMOVED:'+documentKey+':'+p);
                if(!del(reconstructed,p))throw new Error('AUTO_PRUNE_COMPANION_RECONSTRUCT_DELETE_FAILED:'+documentKey+':'+p);
              }
              if(JSON.stringify(reconstructed)!==JSON.stringify(head))throw new Error('AUTO_PRUNE_NON_ARCHIVAL_COMPANION_MUTATION:'+documentKey);
            }
          }else if(companionArchives.length){
            throw new Error('AUTO_PRUNE_COMPANION_ARCHIVE_WITHOUT_COMPANION_CHANGE');
          }

          if(!policyArchives.length&&!companionArchives.length)throw new Error('AUTO_PRUNE_ARCHIVE_REQUIRED');
          console.log('CENTRAL_AUTO_PRUNE_REFERENCED_PATHS_PROTECTED=PASS');
          console.log('CENTRAL_AUTO_PRUNE_ARCHIVE_FIDELITY=PASS');
          console.log('CENTRAL_AUTO_PRUNE_ONLY_ARCHIVAL_MUTATION=PASS');
          NODE
          echo 'pass=YES' >> "$GITHUB_OUTPUT"
          echo 'CENTRAL_AUTO_PRUNE_SECURITY=PASS'

      - name: Verify exact-head Primary-AI direct policy review
        id: direct_review
        if: ${{ github.event_name == 'pull_request' && needs.scan.outputs.verdict == 'REVIEW' && needs.scan.outputs.review_only == 'YES' && steps.auto_prune.outputs.pass != 'YES' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/pulls/$PR_NUMBER/reviews?per_page=100" > /tmp/security-pr-reviews.json
          node - <<'NODE'
          const fs=require('fs');
          const reviews=JSON.parse(fs.readFileSync('/tmp/security-pr-reviews.json','utf8'));
          const owner=String(process.env.REPO_OWNER||'').toLowerCase();
          const head=String(process.env.HEAD_SHA||'');
          const pass=reviews.some(row=>
            ['APPROVED','COMMENTED'].includes(String(row.state||'').toUpperCase()) &&
            String(row.body||'').trim()==='PRIMARY_AI_DIRECT_REVIEW=PASS' &&
            String(row.commit_id||'')===head &&
            String(row.user?.login||'').toLowerCase()===owner
          );
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`pass=${pass?'YES':'NO'}\n`);
          console.log('VIBE_SECURITY_PRIMARY_AI_DIRECT_REVIEW='+(pass?'PASS':'MISSING'));
          NODE

      - name: Enforce quarantine verdict
        env:
          VERDICT: ${{ needs.scan.outputs.verdict }}
          HIGHEST: ${{ needs.scan.outputs.highest }}
          EVENT_NAME: ${{ github.event_name }}
          REVIEW_ONLY: ${{ needs.scan.outputs.review_only }}
          AUTO_PRUNE_PASS: ${{ steps.auto_prune.outputs.pass || 'NO' }}
          DIRECT_REVIEW_PASS: ${{ steps.direct_review.outputs.pass || 'NO' }}
        run: |
          set -euo pipefail
          echo "VIBE_SECURITY_FINAL=$VERDICT"
          echo "VIBE_SECURITY_HIGHEST=$HIGHEST"
          case "$VERDICT" in
            PASS|REVIEW|QUARANTINE) ;;
            *) echo 'VIBE_SECURITY_ACTION=SCAN_RESULT_REQUIRED'; exit 1 ;;
          esac
          if [ "$VERDICT" = 'QUARANTINE' ]; then
            echo 'VIBE_SECURITY_ACTION=QUARANTINE_AFFECTED_CHANGE'
            exit 1
          fi
          if [ "$VERDICT" = 'REVIEW' ]; then
            if [ "$EVENT_NAME" = 'pull_request' ]; then
              test "$REVIEW_ONLY" = 'YES'
              if [ "$AUTO_PRUNE_PASS" = 'YES' ]; then
                echo 'VIBE_SECURITY_ACTION=ALLOW_VERIFIED_CURRENT_USE_AUTO_PRUNE'
                echo 'VIBE_SECURITY_REVIEW_STATE=DETERMINISTIC_ARCHIVE_ONLY_PRUNE_PASS'
                exit 0
              fi
              echo 'VIBE_SECURITY_ACTION=PRIMARY_AI_DIRECT_REVIEW_REQUIRED'
              test "$DIRECT_REVIEW_PASS" = 'YES'
              echo 'VIBE_SECURITY_REVIEW_STATE=EXACT_HEAD_OWNER_PRIMARY_AI_REVIEW_PASS'
              exit 0
            fi
            echo 'VIBE_SECURITY_REVIEW_STATE=RECORDED_NONBLOCKING_PUSH'
            exit 0
          fi
          echo 'VIBE_SECURITY_ACTION=ALLOW'
