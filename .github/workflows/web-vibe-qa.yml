name: Independent Web Vibe QA

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/web-vibe-qa.yml'
      - '.github/workflows/pwa-command-bridge.yml'
      - 'tools/web-vibe-organization.mjs'
      - 'tools/web-vibe-worker.mjs'
      - 'tools/vibe2-local-web-chat.mjs'
      - 'qa/web-vibe-organization.test.mjs'
      - 'qa/github-cloud-web-isolation.test.mjs'
      - 'qa/web-vibe-worker.test.mjs'
      - 'qa/pwa-command-vibe2-task.test.mjs'
      - 'qa/vibe2-local-web-chat.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/web-vibe-qa.yml'
      - '.github/workflows/pwa-command-bridge.yml'
      - 'tools/web-vibe-organization.mjs'
      - 'tools/web-vibe-worker.mjs'
      - 'tools/vibe2-local-web-chat.mjs'
      - 'qa/web-vibe-organization.test.mjs'
      - 'qa/github-cloud-web-isolation.test.mjs'
      - 'qa/web-vibe-worker.test.mjs'

permissions:
  contents: read

jobs:
  web-vibe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify independent WEB engine syntax
        run: |
          set -euo pipefail
          node --check tools/web-vibe-organization.mjs
          node --check tools/web-vibe-worker.mjs
          node --check tools/vibe2-local-web-chat.mjs
          node --check qa/web-vibe-organization.test.mjs
          node --check qa/web-vibe-worker.test.mjs
          node --check qa/vibe2-local-web-chat.test.mjs
      - name: Verify WEB-only ingress, queue, worker, and advisory
        run: |
          set -euo pipefail
          node --test qa/web-vibe-organization.test.mjs qa/web-vibe-worker.test.mjs
          node --test qa/pwa-command-vibe2-task.test.mjs qa/vibe2-local-web-chat.test.mjs
      - name: Ensure local and GitHub cloud development paths stay separate
        run: node --test qa/github-cloud-web-isolation.test.mjs
