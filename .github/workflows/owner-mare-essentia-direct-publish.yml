# Mare Essentia 오너 직접배포. 명시적 자산 연결 변경은 기존 전용 체험에 반영한다.
# 대상 ID를 비우면 canonical 대항해시대 전용 체험을 재사용한다. 실수로 새 체험을 생성하지 않는다.
name: Owner Mare Essentia Direct Publish
run-name: Owner Mare Essentia publish · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      # [오너 선배포] 대항해시대의 기존 소스·에셋·설정 및 무료 AI 제작 변경은
      # 정확한 main을 기존 전용 체험에 먼저 게시하고, 게시 뒤 기존 검증을 실행한다.
      # 비공개/공개 상태를 임의 변경하지 않는다.
      - '.github/workflows/owner-mare-essentia-direct-publish.yml'
      - 'roblox-games/mare-essentia/**'
      - 'tools/company-nemotron-design-review.mjs'
      - 'tools/vibe2-gemini-free-rotation.mjs'
      - 'company-learning/external-ai-distillation-policy.json'
  # 등록 완료 알림과 직접 호출의 중복을 금지한다. 등록기는 검증된 장부 변경 후
  # 아래 기존 수동 실행 경로를 한 번 호출한다(GITHUB_TOKEN 커밋은 push 재발생 없음).
  workflow_dispatch:
    inputs:
      universe_id:
        description: '기존 Universe ID (비우면 지정된 대항해시대 체험 사용). Place ID를 비우면 대표 Place를 자동 조회'
        type: string
        required: false
        default: ''
      place_id:
        description: '기존 Place ID (Universe ID와 함께 입력)'
        type: string
        required: false
        default: ''
      rollback_ref:
        description: '롤백: 이전에 정상이던 커밋 SHA/태그를 넣으면 그 소스를 다시 게시한다 (비우면 현재 main)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: owner-mare-essentia-direct-publish
  cancel-in-progress: false

env:
  GAME_ID: mare-essentia
  GAME_NAME: 'Mare Essentia: Explorer''s Encyclopedia'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          ref: ${{ inputs.rollback_ref || github.sha }}

      - name: Install pinned official Luau (type check, logic, smoke build)
        id: luau
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p /tmp/luau-bin
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/luau.zip https://github.com/luau-lang/luau/releases/download/0.739/luau-ubuntu.zip
          echo '8a9b4b381021722c82d6e6cda0964b5c9e7f354ec1035fcd8b657acc22e49247  /tmp/luau.zip' | sha256sum -c -
          unzip -q /tmp/luau.zip -d /tmp/luau-bin
          chmod +x /tmp/luau-bin/luau /tmp/luau-bin/luau-analyze

      - name: Gate - every referenced asset must be registered
        run: |
          set -euo pipefail
          python3 roblox-games/mare-essentia/tools/devloop/asset_check.py roblox-games/mare-essentia
          # [등록된 실제 GUI 이미지] 이전 Decal ID가 다시 게시되지 않도록 기존 AssetIds 연결을 확인한다.
          python3 - <<'PY'
          import json
          import pathlib
          import re
          root = pathlib.Path("roblox-games/mare-essentia")
          registry = json.loads((root / "assets-registered.json").read_text(encoding="utf-8"))
          ids = (root / "src/ReplicatedStorage/Shared/AssetIds.luau").read_text(encoding="utf-8")
          active = dict(re.findall(r'\["([^"]+)"\]\s*=\s*(\d+)', ids))
          assets = registry["assets"]
          if registry.get("universeId") != "10775310508":
              raise SystemExit("MARE_ASSET_UNIVERSE_MISMATCH")
          if set(assets) != set(active):
              raise SystemExit("MARE_ASSET_REGISTRY_LUAU_KEYS_MISMATCH")
          for key, asset in assets.items():
              if str(asset.get("assetId", "")) != active[key] or asset.get("usePermissionGranted") is not True:
                  raise SystemExit("MARE_ASSET_ID_OR_UNIVERSE_GRANT_UNVERIFIED:" + key)
              if key.startswith(("Goods/", "Menu/", "Portraits/")) and asset.get("assetType") != "Image":
                  raise SystemExit("MARE_GUI_ASSET_NOT_IMAGE:" + key)
          print("MARE_PUBLISH_VERIFIED_REGISTERED_ASSETS=" + str(len(assets)))
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Mare Essentia place with pinned Rojo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/owner-mare /tmp/rojo-bin
          bash tools/install-rojo.sh /tmp/rojo-bin
          /tmp/rojo-bin/rojo build "roblox-games/$GAME_ID/default.project.json" -o "/tmp/owner-mare/$GAME_ID.rbxlx"
          test -s "/tmp/owner-mare/$GAME_ID.rbxlx"

      - name: Publish to private Roblox Experience
        env:
          EXISTING_UNIVERSE_ID: ${{ inputs.universe_id || '10775310508' }}
          EXISTING_PLACE_ID: ${{ inputs.place_id || '73607605986189' }}
          SOURCE_REV: ${{ inputs.rollback_ref || github.sha }}
          # [1980 전용 배포] Creator Hub ROBLOX-1980-PUBLISH 키를 GitHub ROBLOX_DEPLOY_API_KEY에서만 읽는다.
          # 이전 계정 키와 인증 쿠키는 배포에 사용하지 않는다.
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_DEPLOY_API_KEY }}
          ROBLOX_CREATOR_USER_ID: '11664914771'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ROBLOX_OPEN_CLOUD_API_KEY:-}" ]]; then
            echo "::error::MARE_1980_DEPLOY_API_KEY_MISSING" >&2
            exit 1
          fi
          if [[ -n "${EXISTING_UNIVERSE_ID:-}" && -z "${EXISTING_PLACE_ID:-}" ]]; then
            EXISTING_PLACE_ID="$(curl -fsSL --retry 3 -H "x-api-key: ${ROBLOX_OPEN_CLOUD_API_KEY}" "https://apis.roblox.com/cloud/v2/universes/${EXISTING_UNIVERSE_ID}" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d);const m=String(j.rootPlace||'').match(/(\\d+)\\s*$/);if(!m){console.error('ROOT_PLACE_LOOKUP_FAILED');process.exit(1)}console.log(m[1])})")"
            echo "ROOT_PLACE_ID=${EXISTING_PLACE_ID}"
          fi

          # [배포 대상 검증] canonical 체험 외 배포 및 새 체험 생성 금지.
          expected_universe="$(node -p "require('./roblox-games/mare-essentia/experience-target.json').universeId")"
          expected_place="$(node -p "require('./roblox-games/mare-essentia/experience-target.json').placeId")"
          if [[ "$EXISTING_UNIVERSE_ID" != "$expected_universe" || "$EXISTING_PLACE_ID" != "$expected_place" ]]; then
            echo "::error::MARE_CANONICAL_TARGET_MISMATCH"
            exit 1
          fi
          args=(--game-id "$GAME_ID" --game-name "$GAME_NAME" --place-file "/tmp/owner-mare/$GAME_ID.rbxlx" --source-revision "$SOURCE_REV" --output "/tmp/owner-mare/result.json")
          if [[ -n "${EXISTING_UNIVERSE_ID:-}" && -n "${EXISTING_PLACE_ID:-}" ]]; then
            args+=(--reuse-universe-id "$EXISTING_UNIVERSE_ID" --reuse-place-id "$EXISTING_PLACE_ID")
          fi
          node tools/company-roblox-dedicated-experience.mjs "${args[@]}"

      - name: Report published Roblox version
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('/tmp/owner-mare/result.json','utf8'));
          if(r.published!==true||r.pass!==true||!(r.versionNumber>0))throw new Error('MARE_ESSENTIA_NOT_PUBLISHED');
          console.log('MARE_ESSENTIA_PUBLISHED_VERSION='+r.versionNumber);
          console.log('MARE_ESSENTIA_PLACE_ID='+r.placeId);
          console.log('MARE_ESSENTIA_UNIVERSE_ID='+r.universeId);
          console.log('MARE_ESSENTIA_LINK=https://www.roblox.com/games/'+r.placeId);
          NODE

      - name: Post-publish tests and port smoke (diagnostic only)
        if: steps.luau.outcome == 'success' && inputs.rollback_ref == ''
        continue-on-error: true
        run: |
          # [선배포 후 검증] 기존 게임 테스트는 게시 성공을 확인한 뒤 실행하며 배포 결과를 되돌리지 않는다.
          LUAU_DIR=/tmp/luau-bin bash roblox-games/mare-essentia/tests/run.sh 2>&1 | tail -25
          echo "TEST_GATE_RC=${PIPESTATUS[0]}"
          test "${PIPESTATUS[0]}" -eq 0 || echo "::warning::post-publish tests/smoke failed - published version preserved"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-mare-essentia-direct-publication
          path: /tmp/owner-mare/result.json
          if-no-files-found: warn
          retention-days: 14
