name: Autonomous New Game Incubator

on:
  workflow_dispatch:
    inputs:
      create_concept:
        description: 'Allow one valid new concept if none is active; quality-rejected attempts do not consume the valid slot'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '30 22 * * *' # 07:30 KST
  workflow_run:
    workflows: ['Free Artbook Department Bots']
    types: [completed]

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: autonomous-new-game-incubator
  cancel-in-progress: false

env:
  INCUBATOR_LOCAL_MODEL: qwen3:0.6b
  INCUBATOR_MODEL_MAX_PREDICT: '1536'
  INCUBATOR_MODEL_TIMEOUT_MS: '240000'
  OLLAMA_HOST: 127.0.0.1:11434

jobs:
  incubate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deterministic incubator tests
        run: |
          node --check tools/autonomous-new-game-incubator.mjs
          node --check tools/free-budget-telemetry.mjs
          node --test qa/autonomous-new-game-incubator.test.mjs
          node --test qa/free-budget-telemetry.test.mjs
      - name: Decide whether one free model call is needed
        id: mode
        shell: bash
        env:
          REQUEST_CREATE_CONCEPT: ${{ inputs.create_concept || 'false' }}
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs=require('fs');
          const state=JSON.parse(fs.readFileSync('autonomous-incubator.json','utf8'));
          const active=(state.candidates||[]).find(c=>['CONCEPT_CREATED','ARTBOOK_QUEUED','ARTBOOK_COMPLETE','PROTOTYPE_REGISTERED'].includes(c.status)&&c.prototypeDevComplete!==true);
          const kstDate=(value=new Date())=>{
            const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(value));
            const get=t=>parts.find(x=>x.type===t)?.value||'';return `${get('year')}-${get('month')}-${get('day')}`;
          };
          const today=kstDate();
          const rejected=c=>c.status==='REDESIGN_REQUIRED'&&c.qualityGate?.pass===false;
          const createdToday=(state.candidates||[]).some(c=>!rejected(c)&&c.createdAt&&kstDate(c.createdAt)===today);
          const attemptsToday=(state.candidates||[]).filter(c=>c.createdAt&&kstDate(c.createdAt)===today).length;
          const scheduled=process.env.GITHUB_EVENT_NAME==='schedule';
          const requested=String(process.env.REQUEST_CREATE_CONCEPT).toLowerCase()==='true';
          console.log(`has_active=${active?'true':'false'}`);
          console.log(`created_today=${createdToday?'true':'false'}`);
          console.log(`attempts_today=${attemptsToday}`);
          console.log(`need_model=${!active&&!createdToday&&attemptsToday<3&&(scheduled||requested)?'true':'false'}`);
          NODE
      - name: Verified free budget preflight
        if: steps.mode.outputs.has_active == 'true' || steps.mode.outputs.need_model == 'true'
        shell: bash
        run: |
          set -euo pipefail
          model_calls=0
          if [ "${{ steps.mode.outputs.need_model }}" = "true" ]; then model_calls=1; fi
          node tools/free-budget-telemetry.mjs \
            --verify-public-repo=true \
            --runner=ubuntu-latest \
            --model-calls="$model_calls" \
            --runner-minutes=20 \
            --output=.autonomous/free-budget-telemetry.json
          echo 'FREE_BUDGET_PREFLIGHT=PASS'
          echo 'ACTIONS_QUOTA_MODE=UNMETERED_FREE'
      - name: Install local Ollama only for one allowed new concept
        if: steps.mode.outputs.need_model == 'true'
        shell: bash
        run: |
          set -euo pipefail
          installed=0
          for attempt in 1 2 3; do
            if curl -fsSL --retry 3 --retry-all-errors --connect-timeout 15 https://ollama.com/install.sh | sh; then installed=1; break; fi
            sleep $((attempt * 4))
          done
          test "$installed" = 1
          nohup ollama serve > /tmp/ollama-incubator.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
      - name: Pull free local model only when needed
        if: steps.mode.outputs.need_model == 'true'
        run: |
          ollama pull "$INCUBATOR_LOCAL_MODEL"
          echo 'PAID_API=NO'
          echo 'MODEL_CALLS_MAX_THIS_RUN=1'
          echo "MODEL_MAX_PREDICT=$INCUBATOR_MODEL_MAX_PREDICT"
          echo "MODEL_TIMEOUT_MS=$INCUBATOR_MODEL_TIMEOUT_MS"
      - name: Advance operational incubator
        id: advance
        if: steps.mode.outputs.has_active == 'true' || steps.mode.outputs.need_model == 'true'
        env:
          INCUBATOR_ALLOW_NEW_CONCEPT: ${{ steps.mode.outputs.need_model }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { runOperationalIncubator } from './tools/autonomous-new-game-incubator.mjs';
          const result=await runOperationalIncubator({allowNewConcept:String(process.env.INCUBATOR_ALLOW_NEW_CONCEPT).toLowerCase()==='true'});
          console.log(JSON.stringify(result,null,2));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`action=${result.action}\nretry_allowed=${result.retryAllowed===true?'true':'false'}\nstatus=${result.status||''}\n`);
          NODE
      - name: Persist state/artbook queue/prototype request through merged PR
        id: state_persist
        if: steps.mode.outputs.has_active == 'true' || steps.mode.outputs.need_model == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "jaewoon-new-game-incubator"
          git config user.email "actions@users.noreply.github.com"
          git add autonomous-incubator.json autonomous-portfolio.json artbook-submission-queue.json
          if [ -f .autonomous/prototype-request.json ]; then git add -f .autonomous/prototype-request.json; fi
          if git diff --cached --quiet; then
            echo 'INCUBATOR_CHANGE=NO'
            echo 'merged=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "incubator: advance operational new-game pipeline"
          safe_action="$(printf '%s' "${{ steps.advance.outputs.action }}" | tr -cs 'A-Za-z0-9._-' '-' | sed 's/^-*//;s/-*$//' | cut -c1-48)"
          state_branch="automation/incubator-state-${safe_action:-advance}-${GITHUB_RUN_ID}"
          git push origin "HEAD:$state_branch"
          pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$state_branch" --title "incubator: persist operational state" --body "Operational incubator state/queue only. No public game code or release approval. Generated by run ${GITHUB_RUN_ID}.")"
          pr_number="${pr_url##*/}"
          sleep 5
          gh pr checks "$pr_number" --repo "$GITHUB_REPOSITORY" --watch --fail-fast
          git fetch origin main
          gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
          git fetch origin main
          git show origin/main:autonomous-incubator.json >/dev/null
          echo 'merged=true' >> "$GITHUB_OUTPUT"
          echo 'PUBLIC_GAME_CODE_WRITE=NO'
          echo 'NEW_GAME_RELEASE_APPROVAL=NO'
          echo 'INCUBATOR_STATE_WRITE=PR_MERGED'
      - name: Retry only a quality-rejected concept within bounded daily attempts
        if: steps.state_persist.outputs.merged == 'true' && steps.advance.outputs.retry_allowed == 'true' && (steps.advance.outputs.action == 'REDESIGN_REQUIRED' || steps.advance.outputs.action == 'CONCEPT_REJECTED')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run autonomous-new-game-incubator.yml --ref main -f create_concept=true
          echo 'QUALITY_RETRY_DISPATCHED=YES'
      - name: Continue accepted concept directly into five-department Artbook
        if: steps.state_persist.outputs.merged == 'true' && (steps.advance.outputs.action == 'CONCEPT_AND_ARTBOOK_QUEUED' || steps.advance.outputs.action == 'ARTBOOK_QUEUED')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run artbook-free-department-bots.yml --ref main
          echo 'ARTBOOK_CONTINUATION_DISPATCHED=YES'
