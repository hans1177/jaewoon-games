name: TMP Vibe2 Worker Shallow Checkout

on:
  push:
    branches: [perf/vibe2-worker-shallow-checkout]
    paths:
      - '.github/workflows/tmp-vibe2-worker-shallow-checkout.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/vibe2-worker-shallow-checkout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Make fan-out worker checkout shallow
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const workflow='.github/workflows/vibe2-continuous-core.yml';
          let text=fs.readFileSync(workflow,'utf8');
          const workerStart=text.indexOf('\n  worker:\n');
          const fanInStart=text.indexOf('\n  fan_in:\n');
          if(workerStart<0||fanInStart<0||fanInStart<=workerStart) throw new Error('WORKER_SECTION_NOT_FOUND');
          let before=text.slice(0,workerStart);
          let worker=text.slice(workerStart,fanInStart);
          let after=text.slice(fanInStart);
          const checkoutOld=`          ref: vibe2-unreal-core\n          fetch-depth: 0\n`;
          const checkoutNew=`          ref: vibe2-unreal-core\n          fetch-depth: 1\n`;
          if(!worker.includes(checkoutOld)) throw new Error('WORKER_CHECKOUT_MARKER_NOT_FOUND');
          worker=worker.replace(checkoutOld,checkoutNew);
          const fetchOld='          git fetch origin main --quiet\n';
          const fetchNew='          git fetch --depth=1 origin main:refs/remotes/origin/main --quiet\n';
          if(!worker.includes(fetchOld)) throw new Error('MAIN_FETCH_MARKER_NOT_FOUND');
          worker=worker.replace(fetchOld,fetchNew);
          text=before+worker+after;
          fs.writeFileSync(workflow,text,'utf8');

          const testFile='qa/vibe2-parallelism-20-contract.test.mjs';
          let test=fs.readFileSync(testFile,'utf8');
          const marker=`  assert.match(workflow,/VIBE2_OLLAMA_RUNTIME_SOURCE=FALLBACK_INSTALL/);\n`;
          const replacement=`  assert.match(workflow,/VIBE2_OLLAMA_RUNTIME_SOURCE=FALLBACK_INSTALL/);\n  assert.match(workflow,/worker:[\\s\\S]*?ref: vibe2-unreal-core\\n\\s+fetch-depth: 1/);\n  assert.match(workflow,/git fetch --depth=1 origin main:refs\\/remotes\\/origin\\/main --quiet/);\n  assert.match(workflow,/fan_in:[\\s\\S]*?ref: vibe2-unreal-core\\n\\s+fetch-depth: 0/);\n`;
          if(!test.includes(marker)) throw new Error('CONTRACT_ASSERT_MARKER_NOT_FOUND');
          test=test.replace(marker,replacement);
          fs.writeFileSync(testFile,test,'utf8');
          NODE
          node --test qa/vibe2-parallelism-20-contract.test.mjs
          node --test qa/vibe2-queue-control.test.mjs
          node --test qa/vibe2-auto-planner.test.mjs
      - name: Commit verified optimization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-vibe2-migration'
          git config user.email 'vibe2-migration@users.noreply.github.com'
          git add .github/workflows/vibe2-continuous-core.yml qa/vibe2-parallelism-20-contract.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'perf: shallow-clone Vibe2 fan-out workers'
          git push origin HEAD:perf/vibe2-worker-shallow-checkout
