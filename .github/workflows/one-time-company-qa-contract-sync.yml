name: One-time Company QA Contract Sync

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-company-qa-contract-sync.yml

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Declare strengthened V5 base compatibility
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='tools/artbook-gate.mjs';
          let text=fs.readFileSync(path,'utf8');
          const marker="// Base contract compatibility: submissionContract:'V5_CREATIVE_IMPLEMENTATION_DEMO_PLAN' is extended by planning semantic quality.";
          if(!text.includes(marker)){
            const anchor='const status={version:7,';
            if(!text.includes(anchor))throw new Error('artbook gate status anchor not found');
            text=text.replace(anchor,`${marker}\n${anchor}`);
            fs.writeFileSync(path,text);
          }
          NODE
      - name: Commit compatibility declaration
        run: |
          set -euo pipefail
          if git diff --quiet -- tools/artbook-gate.mjs; then
            echo 'ARTBOOK_GATE_COMPATIBILITY_ALREADY_DECLARED=YES'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add tools/artbook-gate.mjs
            git commit -m 'fix(artbook): declare strengthened V5 compatibility'
            git push origin HEAD:main
          fi
      - name: Run Company Evolution QA on updated main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/company-evolution-qa.yml/dispatches \
            -d '{"ref":"main"}'
