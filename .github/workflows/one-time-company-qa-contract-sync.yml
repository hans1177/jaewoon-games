name: One-time Company QA Contract Sync

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-company-qa-contract-sync.yml

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync strengthened V5 contract assertion
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='.github/workflows/company-evolution-qa.yml';
          let text=fs.readFileSync(path,'utf8');
          const before=`if(!gateSource.includes("submissionContract:'V5_CREATIVE_IMPLEMENTATION_DEMO_PLAN'"))throw new Error('v5 creative/implementation/demo contract missing');`;
          const after=`if(!gateSource.includes("submissionContract:'V5_CREATIVE_IMPLEMENTATION_DEMO_PLAN_PLUS_PLANNING_SEMANTIC_QUALITY'"))throw new Error('v5 creative/implementation/demo + planning semantic quality contract missing');`;
          if(!text.includes(before))throw new Error('stale QA contract assertion not found');
          text=text.replace(before,after);
          fs.writeFileSync(path,text);
          NODE
      - name: Commit QA contract sync
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/company-evolution-qa.yml
          git commit -m 'fix(artbook): align QA with semantic quality contract'
          git push origin HEAD:main
      - name: Run Company Evolution QA on updated main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/company-evolution-qa.yml/dispatches \
            -d '{"ref":"main"}'
