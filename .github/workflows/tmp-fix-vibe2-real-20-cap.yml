name: TMP Fix Vibe2 Real 20 Batch Cap

on:
  push:
    branches: [fix/vibe2-real-20-batch-cap]
    paths:
      - '.github/workflows/tmp-fix-vibe2-real-20-cap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vibe2-real-20-batch-cap
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch queue CLI cap and contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          {
            const file='tools/vibe2-queue-control.mjs';
            let text=fs.readFileSync(file,'utf8');
            const from='function maxConcurrent(value) { return Math.max(1, Math.min(8, Math.floor(Number(value) || DEFAULT_MAX_CONCURRENT_TASKS))); }';
            const to='function maxConcurrent(value) { return Math.max(1, Math.min(20, Math.floor(Number(value) || DEFAULT_MAX_CONCURRENT_TASKS))); }';
            if(!text.includes(from)) throw new Error('QUEUE_MAX_8_TARGET_NOT_FOUND');
            text=text.replace(from,to);
            fs.writeFileSync(file,text,'utf8');
          }
          {
            const file='qa/vibe2-parallelism-20-contract.test.mjs';
            let text=fs.readFileSync(file,'utf8');
            const from="  const planner=read('tools/vibe2-auto-planner.mjs');\n";
            const to="  const planner=read('tools/vibe2-auto-planner.mjs');\n  const queueControl=read('tools/vibe2-queue-control.mjs');\n";
            if(!text.includes(from)) throw new Error('CONTRACT_PLANNER_TARGET_NOT_FOUND');
            text=text.replace(from,to);
            const assertFrom="  assert.match(planner,/Math\\.min\\(20,/);\n";
            const assertTo="  assert.match(planner,/Math\\.min\\(20,/);\n  assert.match(queueControl,/function maxConcurrent\\(value\\) \\{ return Math\\.max\\(1, Math\\.min\\(20,/);\n";
            if(!text.includes(assertFrom)) throw new Error('CONTRACT_ASSERT_TARGET_NOT_FOUND');
            text=text.replace(assertFrom,assertTo);
            fs.writeFileSync(file,text,'utf8');
          }
          NODE
          node --check tools/vibe2-queue-control.mjs
          node --test qa/vibe2-queue-control.test.mjs
          node --test qa/vibe2-auto-planner.test.mjs
          node --test qa/vibe2-parallelism-20-contract.test.mjs
      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-vibe2-migration'
          git config user.email 'vibe2-migration@users.noreply.github.com'
          git add tools/vibe2-queue-control.mjs qa/vibe2-parallelism-20-contract.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'fix: remove stale 8-slot queue clamp'
          git push origin HEAD:fix/vibe2-real-20-batch-cap
