name: Game Blueprint Test

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test game blueprint
        run: |
          rm -rf /tmp/jaewoon-blueprint
          mkdir -p /tmp/jaewoon-blueprint
          cp assets/game-blueprint.js assets/game-presets.js assets/game-kit.js assets/d20-rules.js assets/turn-combat.js assets/character-progression.js assets/inventory-equipment.js assets/quest-dialogue.js assets/skill-effects.js assets/economy-loot-shop.js assets/save-versioning.js /tmp/jaewoon-blueprint/
          printf '{"type":"module"}\n' > /tmp/jaewoon-blueprint/package.json
          cd /tmp/jaewoon-blueprint
          node --check game-blueprint.js
          node --input-type=module <<'NODE'
          import { buildGameBlueprint, createGameFromBlueprint } from './game-blueprint.js';
          const rpg = buildGameBlueprint({ gameId: 'qa-rpg', genre: 'rpg' });
          for (const key of ['characterProgression','inventoryEquipment','questDialogue','skillEffects','economySystems','versionedSave']) {
            if (!rpg.kitConfig[key]) throw new Error(`missing RPG default: ${key}`);
          }
          const made = createGameFromBlueprint({
            gameId: 'qa-d20',
            genre: 'rpg',
            presetOptions: { d20Rules: true, turnBasedCombat: true },
          });
          if (!made.kit.has('d20') || !made.kit.has('turnCombat')) throw new Error('d20/turn kit missing');
          if (made.kit.get('turnCombat').rules !== made.kit.get('d20')) throw new Error('d20 not wired');
          const custom = buildGameBlueprint({
            gameId: 'custom',
            genre: 'rpg',
            kitOptions: { questDialogue: false, economySystems: false },
          });
          if (custom.kitConfig.questDialogue !== false || custom.kitConfig.economySystems !== false) throw new Error('override failed');
          const hybrid = buildGameBlueprint({ gameId: 'hybrid', genre: 'survival', mixGenres: ['rpg'] });
          if (!hybrid.systems.includes('quests') || !hybrid.systems.includes('crafting')) throw new Error('hybrid preset failed');
          console.log('PASS game blueprint');
          NODE
