name: Vibe2 External Mobile Free Game Playtest

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/external-mobile-free-game-playtest.yml'
      - 'company-learning/external-game-playtest/mobile-free-seed-games.json'
      - 'tools/external-mobile-free-playtest-hosted.mjs'
      - 'tools/vibe2-external-gameplay-distill.mjs'
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
    inputs:
      max_games:
        description: 'Maximum number of Google Play reference games to test in this batch'
        required: false
        default: '3'
      start_index:
        description: 'Catalog start index or auto'
        required: false
        default: 'auto'

permissions:
  contents: read
  actions: write

env:
  REFERENCE_AUTHORITY: EXTERNAL_COMMERCIAL_RUNTIME_REFERENCE
  RUNTIME_PROMOTION_ALLOWED: 'NO'
  CODE_EXTRACTION_ALLOWED: 'NO'

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.guard.outputs.should_run }}
    steps:
      - name: Keep exactly one active Google Play study run
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}/actions/workflows/external-mobile-free-game-playtest.yml/runs?per_page=50"
          runs_json="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}")"
          stale_revision_ids="$(jq -r --arg current "${CURRENT_RUN_ID}" --arg head "${GITHUB_SHA}" '.workflow_runs[] | select((.status=="queued" or .status=="pending" or .status=="in_progress" or .status=="waiting") and ((.id|tostring)!=$current) and (.head_sha!=$head)) | .id' <<<"${runs_json}")"
          if [ -n "${stale_revision_ids}" ]; then
            while IFS= read -r stale_id; do
              [ -n "${stale_id}" ] || continue
              echo "EXTERNAL_MOBILE_CANCEL_STALE_REVISION=${stale_id}"
              curl --fail --silent --show-error \
                -X POST \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${REPOSITORY}/actions/runs/${stale_id}/cancel" || true
            done <<<"${stale_revision_ids}"
          fi

          queue_api="https://api.github.com/repos/${REPOSITORY}/contents/.vibe2/queue.json?ref=vibe2-unreal-core"
          if ! queue_response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${queue_api}")"; then
            echo 'should_run=NO' >> "$GITHUB_OUTPUT"
            echo 'EXTERNAL_MOBILE_GATE=DEFER_GAME_PRIMARY_QUEUE_UNAVAILABLE'
            exit 0
          fi
          queue_b64="$(jq -r '.content // empty' <<<"${queue_response}" | tr -d '\n')"
          queue_json="$(printf '%s' "${queue_b64}" | base64 -d 2>/dev/null || true)"
          if [ -z "${queue_json}" ] || ! jq -e . >/dev/null 2>&1 <<<"${queue_json}"; then
            echo 'should_run=NO' >> "$GITHUB_OUTPUT"
            echo 'EXTERNAL_MOBILE_GATE=DEFER_GAME_PRIMARY_QUEUE_INVALID'
            exit 0
          fi
          active_game_work="$(jq '[.tasks[]? | select(
            (((.status // "") | ascii_downcase) == "queued" or ((.status // "") | ascii_downcase) == "running")
            and (((.department // "") | ascii_downcase) == "development")
            and (((.type // "") | ascii_downcase) == "implementation")
          )] | length' <<<"${queue_json}")"
          echo "EXTERNAL_MOBILE_ACTIVE_GAME_WORK=${active_game_work}"
          if [ "${active_game_work}" -gt 0 ]; then
            echo 'should_run=NO' >> "$GITHUB_OUTPUT"
            echo 'EXTERNAL_MOBILE_GATE=DEFER_TO_GAME_PRIMARY'
            exit 0
          fi
          running_other="$(jq --arg current "${CURRENT_RUN_ID}" --arg head "${GITHUB_SHA}" '[.workflow_runs[] | select((.status=="in_progress" or .status=="waiting") and ((.id|tostring)!=$current) and (.head_sha==$head))] | length' <<<"${runs_json}")"
          newer_pending="$(jq --argjson current "${CURRENT_RUN_ID}" --arg head "${GITHUB_SHA}" '[.workflow_runs[] | select((.status=="queued" or .status=="pending") and (.id > $current) and (.head_sha==$head))] | length' <<<"${runs_json}")"
          older_pending_ids="$(jq -r --argjson current "${CURRENT_RUN_ID}" --arg head "${GITHUB_SHA}" '.workflow_runs[] | select((.status=="queued" or .status=="pending") and (.id < $current) and (.head_sha==$head)) | .id' <<<"${runs_json}")"
          echo "EXTERNAL_MOBILE_RUNNING_SAME_REVISION=${running_other}"
          echo "EXTERNAL_MOBILE_NEWER_PENDING_SAME_REVISION=${newer_pending}"
          if [ "${running_other}" -gt 0 ] || [ "${newer_pending}" -gt 0 ]; then
            echo 'should_run=NO' >> "$GITHUB_OUTPUT"
            echo 'EXTERNAL_MOBILE_GATE=DEFER_TO_SAME_REVISION_ACTIVE_RUN'
            exit 0
          fi
          if [ -n "${older_pending_ids}" ]; then
            while IFS= read -r stale_id; do
              [ -n "${stale_id}" ] || continue
              echo "EXTERNAL_MOBILE_CANCEL_OLDER_SAME_REVISION=${stale_id}"
              curl --fail --silent --show-error \
                -X POST \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${REPOSITORY}/actions/runs/${stale_id}/cancel" || true
            done <<<"${older_pending_ids}"
          fi
          echo 'should_run=YES' >> "$GITHUB_OUTPUT"
          echo 'EXTERNAL_MOBILE_GATE=RUN'

  playtest:
    needs: gate
    if: needs.gate.outputs.should_run == 'YES'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve rotating Google Play batch
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const manifest=JSON.parse(fs.readFileSync('company-learning/external-game-playtest/mobile-free-seed-games.json','utf8'));
          const count=Array.isArray(manifest.games)?manifest.games.length:0;
          if(count<1)throw new Error('Google Play reference catalog is empty');
          const pushSmoke=process.env.GITHUB_EVENT_NAME==='push'&&!process.env.INPUT_MAX_GAMES&&!process.env.INPUT_START_INDEX;
          const maxRaw=pushSmoke?'1':(process.env.INPUT_MAX_GAMES||'3');
          const max=Number(maxRaw);
          if(!Number.isInteger(max)||max<1||max>12)throw new Error('max_games must be an integer from 1 to 12');
          const requested=pushSmoke?'0':(process.env.INPUT_START_INDEX||'auto').trim();
          let start;
          if(!requested||requested==='auto'){
            start=Number(process.env.GITHUB_RUN_NUMBER||0)%count;
          }else{
            const parsed=Number(requested);
            if(!Number.isInteger(parsed)||parsed<0)throw new Error('start_index must be auto or a non-negative integer');
            start=parsed%count;
          }
          console.log('GOOGLE_PLAY_PUSH_SMOKE='+(pushSmoke?'YES':'NO'));
          fs.appendFileSync(process.env.GITHUB_ENV,'PLAYTEST_MAX_GAMES='+max+'\nPLAYTEST_START_INDEX='+start+'\n');
          console.log('GOOGLE_PLAY_REFERENCE_CATALOG_COUNT='+count);
          console.log('GOOGLE_PLAY_REFERENCE_BATCH_SIZE='+max);
          console.log('GOOGLE_PLAY_REFERENCE_START_INDEX='+start);
          NODE
        env:
          INPUT_MAX_GAMES: ${{ github.event.inputs.max_games }}
          INPUT_START_INDEX: ${{ github.event.inputs.start_index }}

      - name: Verify commercial reference policy
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('company-learning/external-game-playtest/mobile-free-seed-games.json','utf8'));
          if(m.sourceSeed!=='game-seed-market-evidence.json')throw new Error('playtest manifest seed mismatch');
          if(m.authority!=='EXTERNAL_COMMERCIAL_RUNTIME_REFERENCE'||m.practiceOnly!==true||m.runtimePromotionAllowed!==false)throw new Error('unsafe external reference authority');
          if(m.codeExtractionAllowed!==false||m.binaryRedistributionAllowed!==false||m.installPolicy!=='OFFICIAL_GOOGLE_PLAY_ONLY')throw new Error('external commercial reference policy violation');
          if(!Array.isArray(m.games)||m.games.length<3)throw new Error('mobile reference catalog too small');
          console.log('EXTERNAL_REFERENCE_GAMES='+m.games.length);
          console.log('EXTERNAL_REFERENCE_HOST=GITHUB_HOSTED_ARM64_REDROID');
          console.log('EXTERNAL_REFERENCE_CODE_EXTRACTION=NO');
          NODE

      - name: Prepare runtime evidence directory
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/external-mobile-playtest-$GITHUB_RUN_ID"
          mkdir -p "$out"
          echo "EXTERNAL_PLAYTEST_OUT=$out" >> "$GITHUB_ENV"
          echo "EXTERNAL_PLAYTEST_OUT=$out"

      - name: Prepare ARM64 Redroid
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "aarch64" ]] || { echo HOST_NOT_ARM64; exit 1; }
          [[ "$(getconf PAGESIZE)" == "4096" ]] || { echo PAGE_SIZE_NOT_4K; exit 1; }

          sudo apt-get update -y
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" jq curl || true
          command -v docker >/dev/null 2>&1 || { echo DOCKER_CLI_MISSING; exit 1; }
          sudo systemctl start docker || sudo service docker start || true
          docker version > "$EXTERNAL_PLAYTEST_OUT/docker.txt" 2>&1 || { echo DOCKER_UNAVAILABLE; exit 1; }

          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder"
          sudo mkdir -p /dev/binderfs
          if ! mountpoint -q /dev/binderfs; then sudo mount -t binder binder /dev/binderfs; fi
          for d in binder hwbinder vndbinder; do
            [[ -e "/dev/binderfs/$d" ]] || { echo "BINDER_DEVICE_MISSING=$d"; exit 1; }
          done

          image='redroid/redroid:14.0.0_64only-latest'
          docker pull "$image"
          docker rm -f vibe2-redroid >/dev/null 2>&1 || true
          data="$RUNNER_TEMP/redroid-data"
          mkdir -p "$data"
          docker run -d --privileged --name vibe2-redroid \
            -v "$data:/data" \
            "$image" \
            androidboot.use_memfd=true \
            androidboot.redroid_width=1080 \
            androidboot.redroid_height=2400 \
            androidboot.redroid_dpi=420 \
            androidboot.redroid_gpu_mode=guest

          deadline=$((SECONDS+180))
          while (( SECONDS < deadline )); do
            boot="$(timeout --kill-after=5s 30s docker exec vibe2-redroid getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            [[ "$boot" == 1 ]] && break
            sleep 5
          done
          [[ "$(timeout --kill-after=5s 30s docker exec vibe2-redroid getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" == 1 ]] || { docker logs vibe2-redroid; exit 1; }
          abilist="$(docker exec vibe2-redroid getprop ro.product.cpu.abilist | tr -d '\r')"
          printf '%s' "$abilist" | grep -Fq 'arm64-v8a' || { echo ARM64_GUEST_ABSENT; exit 1; }
          echo 'NATIVE_ARM64_ANDROID_READY=PASS'

      - name: Download from Google Play delivery and black-box playtest
        id: playtest
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node tools/external-mobile-free-playtest-hosted.mjs \
            --manifest company-learning/external-game-playtest/mobile-free-seed-games.json \
            --out "$EXTERNAL_PLAYTEST_OUT" \
            --max-games "$PLAYTEST_MAX_GAMES" \
            --start-index "$PLAYTEST_START_INDEX"
          test -f "$EXTERNAL_PLAYTEST_OUT/summary.json"
          valid="$(node -e "const s=require(process.argv[1]); console.log((s.games||[]).filter(g=>g.installPass&&g.launchPass&&g.foregroundPass&&g.processAliveAfter&&g.noCrash).length)" "$EXTERNAL_PLAYTEST_OUT/summary.json")"
          [[ "$valid" -ge 1 ]] || { echo NO_VALID_RUNTIME_OBSERVATION; exit 1; }
          echo "EXTERNAL_RUNTIME_VALID_GAMES=$valid"

      - name: Distill runtime behavior into Unity implementation judgment
        if: steps.playtest.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          samples="$RUNNER_TEMP/external-mobile-playtest-samples-$GITHUB_RUN_ID"
          node tools/vibe2-external-gameplay-distill.mjs \
            --manifest company-learning/external-game-playtest/mobile-free-seed-games.json \
            --results "$EXTERNAL_PLAYTEST_OUT/summary.json" \
            --out "$samples"
          count="$(find "$samples" -maxdepth 1 -type f -name 'commercial-runtime-*.json' | wc -l | tr -d ' ')"
          [[ "$count" -ge 1 ]] || { echo COMMERCIAL_RUNTIME_SAMPLE_MISSING; exit 1; }
          echo "EXTERNAL_PLAYTEST_SAMPLES=$samples" >> "$GITHUB_ENV"
          echo "COMMERCIAL_RUNTIME_REFERENCE_SAMPLES=$count"
          echo 'COMMERCIAL_RUNTIME_REFERENCE_VERIFIED_PRODUCTION_POSITIVE=NO'

      - name: Upload ephemeral runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-mobile-gameplay-evidence
          path: ${{ env.EXTERNAL_PLAYTEST_OUT }}
          retention-days: 1
          if-no-files-found: warn

      - name: Upload distilled runtime reference samples
        if: steps.playtest.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: external-mobile-gameplay-samples
          path: ${{ env.EXTERNAL_PLAYTEST_SAMPLES }}
          retention-days: 1
          if-no-files-found: error

      - name: Cleanup hosted Android
        if: always()
        shell: bash
        run: |
          docker rm -f vibe2-redroid >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/redroid-data" || true

      - name: Enforce real-playtest gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ steps.playtest.outcome }}' != 'success' ]]; then
            test -f "$EXTERNAL_PLAYTEST_OUT/summary.json" && cat "$EXTERNAL_PLAYTEST_OUT/summary.json" || true
            throwaway=0
            echo 'EXTERNAL_MOBILE_PLAYTEST=FAILED'
            exit 1
          fi
          echo 'EXTERNAL_MOBILE_PLAYTEST=PASS'
          echo 'EXTERNAL_MOBILE_RUNTIME=GITHUB_HOSTED_ARM64_REDROID'
          echo 'LOCAL_RUNNER_REQUIRED=NO'
          echo 'RUNTIME_PROMOTION_ALLOWED=NO'
          echo "EXTERNAL_MOBILE_ROTATION_START=$PLAYTEST_START_INDEX"
          echo "EXTERNAL_MOBILE_ROTATION_BATCH=$PLAYTEST_MAX_GAMES"
          echo 'TRANSFORMATIVE_RECOMBINATION_INPUT=DERIVED_RUNTIME_FEATURES_ONLY'

  refill:
    name: continuous refill
    needs: [gate, playtest]
    if: always() && needs.gate.outputs.should_run == 'YES'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch canonical learning ingest for completed playtest
        if: needs.playtest.result == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          body="$(jq -nc --arg run_id "${CURRENT_RUN_ID}" '{ref:"main",inputs:{external_playtest_run_id:$run_id}}')"
          curl --fail --silent --show-error             -X POST             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${REPOSITORY}/actions/workflows/vibe2-distillation-ingest.yml/dispatches"             -d "${body}"
          echo "COMMERCIAL_RUNTIME_CANONICAL_INGEST_DISPATCHED=${CURRENT_RUN_ID}"

      - name: Dispatch next Google Play study batch when idle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}/actions/workflows/external-mobile-free-game-playtest.yml/runs?per_page=30"
          active_other="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}" | jq --arg current "${CURRENT_RUN_ID}" \
            '[.workflow_runs[] | select((.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending") and ((.id|tostring)!=$current))] | length')"
          echo "EXTERNAL_MOBILE_ACTIVE_OTHER=${active_other}"
          if [ "${active_other}" -gt 0 ]; then
            echo 'EXTERNAL_MOBILE_CONTINUOUS_REFILL=ALREADY_ACTIVE'
            exit 0
          fi
          body='{"ref":"main","inputs":{"max_games":"3","start_index":"auto"}}'
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/external-mobile-free-game-playtest.yml/dispatches" \
            -d "${body}"
          echo 'EXTERNAL_MOBILE_CONTINUOUS_REFILL=DISPATCHED'
          echo 'EXTERNAL_MOBILE_24H_CHAIN=ON'
