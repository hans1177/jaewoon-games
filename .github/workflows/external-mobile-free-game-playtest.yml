name: Vibe2 External Mobile Free Game Playtest

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/external-mobile-free-game-playtest.yml'
      - 'company-learning/external-game-playtest/mobile-free-seed-games.json'
      - 'tools/external-mobile-free-playtest.ps1'
      - 'tools/vibe2-external-gameplay-distill.mjs'
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
    inputs:
      max_games:
        description: 'Maximum number of Google Play reference games to test in this batch'
        required: false
        default: '3'
      start_index:
        description: 'Catalog start index or auto'
        required: false
        default: 'auto'

permissions:
  contents: read
  actions: write

env:
  REFERENCE_AUTHORITY: EXTERNAL_COMMERCIAL_RUNTIME_REFERENCE
  RUNTIME_PROMOTION_ALLOWED: 'NO'
  CODE_EXTRACTION_ALLOWED: 'NO'

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.guard.outputs.should_run }}
    steps:
      - name: Keep exactly one active Google Play study run
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}/actions/workflows/external-mobile-free-game-playtest.yml/runs?per_page=50"
          active_other="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}" | jq --arg current "${CURRENT_RUN_ID}" \
            '[.workflow_runs[] | select((.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending") and ((.id|tostring)!=$current))] | length')"
          echo "EXTERNAL_MOBILE_ACTIVE_OTHER=${active_other}"
          if [ "${active_other}" -gt 0 ]; then
            echo 'should_run=NO' >> "$GITHUB_OUTPUT"
            echo 'EXTERNAL_MOBILE_GATE=DEFER_TO_EXISTING_ACTIVE_RUN'
          else
            echo 'should_run=YES' >> "$GITHUB_OUTPUT"
            echo 'EXTERNAL_MOBILE_GATE=RUN'
          fi

  playtest:
    needs: gate
    if: needs.gate.outputs.should_run == 'YES'
    runs-on: [self-hosted, Windows, X64, jaewoon-unity]
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve rotating Google Play batch
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = 'company-learning/external-game-playtest/mobile-free-seed-games.json'
          $manifest = [System.IO.File]::ReadAllText($manifestPath, [System.Text.Encoding]::UTF8) | ConvertFrom-Json
          $catalogCount = @($manifest.games).Count
          if ($catalogCount -lt 1) { throw 'Google Play reference catalog is empty' }

          $maxRaw = '${{ github.event.inputs.max_games }}'
          if ([string]::IsNullOrWhiteSpace($maxRaw)) { $maxRaw = '3' }
          $max = 0
          if (-not [int]::TryParse($maxRaw, [ref]$max) -or $max -lt 1 -or $max -gt 12) { throw 'max_games must be an integer from 1 to 12' }

          $requestedStart = '${{ github.event.inputs.start_index }}'
          if ([string]::IsNullOrWhiteSpace($requestedStart) -or $requestedStart -eq 'auto') {
            $start = [int]$env:GITHUB_RUN_NUMBER % $catalogCount
          } else {
            $parsedStart = 0
            if (-not [int]::TryParse($requestedStart, [ref]$parsedStart) -or $parsedStart -lt 0) { throw 'start_index must be auto or a non-negative integer' }
            $start = $parsedStart % $catalogCount
          }

          "PLAYTEST_MAX_GAMES=$max" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PLAYTEST_START_INDEX=$start" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "GOOGLE_PLAY_REFERENCE_CATALOG_COUNT=$catalogCount"
          Write-Host "GOOGLE_PLAY_REFERENCE_BATCH_SIZE=$max"
          Write-Host "GOOGLE_PLAY_REFERENCE_START_INDEX=$start"
      - name: Verify seed-derived commercial reference policy
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = 'company-learning/external-game-playtest/mobile-free-seed-games.json'
          $manifest = [System.IO.File]::ReadAllText($manifestPath, [System.Text.Encoding]::UTF8) | ConvertFrom-Json
          if ($manifest.sourceSeed -ne 'game-seed-market-evidence.json') { throw 'playtest manifest is not bound to 3-category seed market evidence' }
          if ($manifest.authority -ne 'EXTERNAL_COMMERCIAL_RUNTIME_REFERENCE' -or $manifest.practiceOnly -ne $true -or $manifest.runtimePromotionAllowed -ne $false) { throw 'unsafe external reference authority' }
          if ($manifest.codeExtractionAllowed -ne $false -or $manifest.binaryRedistributionAllowed -ne $false -or $manifest.installPolicy -ne 'OFFICIAL_GOOGLE_PLAY_ONLY') { throw 'external commercial reference policy violation' }
          if (@($manifest.games).Count -lt 3) { throw 'mobile reference catalog too small' }
          Write-Host "EXTERNAL_REFERENCE_GAMES=$(@($manifest.games).Count)"
          Write-Host 'EXTERNAL_REFERENCE_INSTALL_POLICY=OFFICIAL_GOOGLE_PLAY_ONLY'
          Write-Host 'EXTERNAL_REFERENCE_CODE_EXTRACTION=NO'

      - name: Resolve Android platform tools from local Unity SDK
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = New-Object System.Collections.Generic.List[string]
          if (-not [string]::IsNullOrWhiteSpace($env:ANDROID_SDK_ROOT)) { $candidates.Add((Join-Path $env:ANDROID_SDK_ROOT 'platform-tools\adb.exe')) }
          if (-not [string]::IsNullOrWhiteSpace($env:ANDROID_HOME)) { $candidates.Add((Join-Path $env:ANDROID_HOME 'platform-tools\adb.exe')) }
          $localSdk = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'Android\Sdk\platform-tools\adb.exe'
          $candidates.Add($localSdk)
          $unityRoot = Join-Path $env:ProgramFiles 'Unity\Hub\Editor'
          if (Test-Path $unityRoot) {
            Get-ChildItem $unityRoot -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object {
              $candidates.Add((Join-Path $_.FullName 'Editor\Data\PlaybackEngines\AndroidPlayer\SDK\platform-tools\adb.exe'))
            }
          }
          $adb = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $adb) {
            Write-Host 'ADB_DISCOVERY_CANDIDATES:'
            $candidates | ForEach-Object { Write-Host " - $_" }
            throw 'BLOCKED_ADB_EXECUTABLE_NOT_FOUND_IN_INSTALLED_ANDROID_SDKS'
          }
          $platformTools = Split-Path $adb -Parent
          $sdkRoot = Split-Path $platformTools -Parent
          $platformTools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "ANDROID_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_HOME=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "ADB_EXE=$adb"
          Write-Host "ANDROID_SDK_ROOT=$sdkRoot"
          & $adb version
          if ($LASTEXITCODE -ne 0) { throw 'resolved adb executable did not run' }

      - name: Prepare runtime evidence directory
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP "external-mobile-playtest-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          "EXTERNAL_PLAYTEST_OUT=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "EXTERNAL_PLAYTEST_OUT=$out"

      - name: Ensure Android runtime device from accessible preinstalled Play Store image
        id: ensure_device
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tools\ensure-android-playtest-device-installed-only.ps1 -OutDir $env:EXTERNAL_PLAYTEST_OUT
          if ($LASTEXITCODE -ne 0) { throw 'Android playtest device provisioning failed' }

      - name: Install and black-box playtest free mobile reference game
        id: playtest
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tools\external-mobile-free-playtest.ps1 `
            -ManifestPath 'company-learning/external-game-playtest/mobile-free-seed-games.json' `
            -OutDir $env:EXTERNAL_PLAYTEST_OUT `
            -MaxGames ([int]$env:PLAYTEST_MAX_GAMES) `
            -StartIndex ([int]$env:PLAYTEST_START_INDEX)
          if ($LASTEXITCODE -ne 0) { throw 'external mobile playtest script failed' }
          $summaryPath = Join-Path $env:EXTERNAL_PLAYTEST_OUT 'summary.json'
          if (-not (Test-Path $summaryPath)) { throw 'runtime playtest summary missing' }
          $summary = [System.IO.File]::ReadAllText($summaryPath, [System.Text.Encoding]::UTF8) | ConvertFrom-Json
          $pass = @($summary.games | Where-Object { $_.installPass -and $_.launchPass -and $_.foregroundPass -and $_.processAliveAfter -and $_.noCrash }).Count
          if ($pass -lt 1) { throw 'no valid runtime-observed commercial game' }
          Write-Host "EXTERNAL_RUNTIME_VALID_GAMES=$pass"

      - name: Distill runtime behavior into Unity implementation judgment
        if: steps.playtest.outcome == 'success'
        run: |
          $ErrorActionPreference = 'Stop'
          $samples = Join-Path $env:RUNNER_TEMP "external-mobile-playtest-samples-$env:GITHUB_RUN_ID"
          node tools/vibe2-external-gameplay-distill.mjs `
            --manifest company-learning/external-game-playtest/mobile-free-seed-games.json `
            --results (Join-Path $env:EXTERNAL_PLAYTEST_OUT 'summary.json') `
            --out $samples
          if ($LASTEXITCODE -ne 0) { throw 'commercial runtime distillation failed' }
          "EXTERNAL_PLAYTEST_SAMPLES=$samples" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $count = @(Get-ChildItem $samples -Filter 'commercial-runtime-*.json' -File).Count
          if ($count -lt 1) { throw 'commercial runtime sample missing' }
          Write-Host "COMMERCIAL_RUNTIME_REFERENCE_SAMPLES=$count"
          Write-Host 'COMMERCIAL_RUNTIME_REFERENCE_VERIFIED_PRODUCTION_POSITIVE=NO'

      - name: Upload ephemeral runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-mobile-gameplay-evidence
          path: ${{ env.EXTERNAL_PLAYTEST_OUT }}
          retention-days: 1
          if-no-files-found: warn

      - name: Upload distilled runtime reference samples
        if: steps.playtest.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: external-mobile-gameplay-samples
          path: ${{ env.EXTERNAL_PLAYTEST_SAMPLES }}
          retention-days: 1
          if-no-files-found: error

      - name: Enforce real-playtest gate
        if: always()
        run: |
          if ('${{ steps.playtest.outcome }}' -ne 'success') {
            if (Test-Path (Join-Path $env:EXTERNAL_PLAYTEST_OUT 'device-provision.json')) {
              Get-Content -Raw (Join-Path $env:EXTERNAL_PLAYTEST_OUT 'device-provision.json') | Write-Host
            }
            if (Test-Path (Join-Path $env:EXTERNAL_PLAYTEST_OUT 'diagnostic.json')) {
              Get-Content -Raw (Join-Path $env:EXTERNAL_PLAYTEST_OUT 'diagnostic.json') | Write-Host
            }
            throw 'EXTERNAL_MOBILE_PLAYTEST=BLOCKED_OR_FAILED; no sample is accepted until an official Play Store install and real runtime test pass'
          }
          Write-Host 'EXTERNAL_MOBILE_PLAYTEST=PASS'
          Write-Host 'EXTERNAL_COMMERCIAL_REFERENCE_ONLY=YES'
          Write-Host 'RUNTIME_PROMOTION_ALLOWED=NO'
          Write-Host "EXTERNAL_MOBILE_ROTATION_START=$env:PLAYTEST_START_INDEX"
          Write-Host "EXTERNAL_MOBILE_ROTATION_BATCH=$env:PLAYTEST_MAX_GAMES"
          Write-Host 'TRANSFORMATIVE_RECOMBINATION_INPUT=DERIVED_RUNTIME_FEATURES_ONLY'

  refill:
    name: continuous refill
    needs: [gate, playtest]
    if: always() && needs.gate.outputs.should_run == 'YES'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch next Google Play study batch when idle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}/actions/workflows/external-mobile-free-game-playtest.yml/runs?per_page=30"
          active_other="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}" | jq --arg current "${CURRENT_RUN_ID}" \
            '[.workflow_runs[] | select((.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending") and ((.id|tostring)!=$current))] | length')"
          echo "EXTERNAL_MOBILE_ACTIVE_OTHER=${active_other}"
          if [ "${active_other}" -gt 0 ]; then
            echo 'EXTERNAL_MOBILE_CONTINUOUS_REFILL=ALREADY_ACTIVE'
            exit 0
          fi
          body='{"ref":"main","inputs":{"max_games":"3","start_index":"auto"}}'
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/external-mobile-free-game-playtest.yml/dispatches" \
            -d "${body}"
          echo 'EXTERNAL_MOBILE_CONTINUOUS_REFILL=DISPATCHED'
          echo 'EXTERNAL_MOBILE_24H_CHAIN=ON'
