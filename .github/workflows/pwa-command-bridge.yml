name: PWA Command Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pwa-command-bridge.yml'
      - 'tools/pwa-command-vibe2-task.mjs'
      - 'tools/web-vibe-worker.mjs'
      - 'qa/pwa-command-vibe2-task.test.mjs'
      - 'command.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'install.html'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  issue_comment:
    types: [created]
  repository_dispatch:
    types: [vibe-local-web-owner-directive]

permissions:
  contents: write
  actions: write
  id-token: write

concurrency:
  # Every explicitly submitted owner task must retain its own queued run.
  # Periodic PWA polling keeps its original single-run coalescing boundary.
  # Cloud PWA and local WEB Vibe keep independent state and identities.
  group: ${{ (github.event_name == 'repository_dispatch' || github.event_name == 'issue_comment') && format('pwa-command-bridge-owner-{0}', github.run_id) || 'pwa-command-bridge' }}
  cancel-in-progress: false

env:
  COMPANY_BRIDGE_URL: https://njpexgqvituaxrjpnqsi.supabase.co/functions/v1/company-bridge
  WEB_VIBE_BRANCH: web-vibe-control
  # Github cloud development has its own original queue and worker route.

jobs:
  bridge:
    # WEB_VIBE_1 owner ingress. Native/Roblox queue and workers stay separate.
    # Keep exact owner identity checks; this independent local route does not require cloud Vibe2.
    if: >-
      (github.event_name == 'repository_dispatch' &&
       github.event.action == 'vibe-local-web-owner-directive' &&
       github.repository == 'hans1177/jaewoon-games' &&
       github.actor == 'hans1177' &&
       github.event.sender.login == 'hans1177') ||
      (github.event_name == 'issue_comment' &&
       github.repository == 'hans1177/jaewoon-games' &&
       github.actor == 'hans1177' &&
       github.event.sender.login == 'hans1177' &&
       github.event.comment.user.login == 'hans1177' &&
       github.event.comment.user.type == 'User' &&
       github.event.comment.author_association == 'OWNER' &&
       startsWith(github.event.comment.body, '/vibe-local-web '))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      task_id: ${{ steps.local.outputs.task_id }}
      game_id: ${{ steps.local.outputs.game_id }}
      files: ${{ steps.local.outputs.files }}
      queued: ${{ steps.ingest.outputs.queued }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          fetch-tags: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate local WEB-only bridge contract
        run: |
          set -euo pipefail
          node --check tools/pwa-command-vibe2-task.mjs
          node --test qa/pwa-command-vibe2-task.test.mjs qa/web-vibe-organization.test.mjs

      - name: Receive GitHub-authenticated WEB-only owner directive
        if: github.event_name == 'issue_comment' || github.event_name == 'repository_dispatch'
        id: local
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {validateLocalWebOwnerEvent} from './tools/pwa-command-vibe2-task.mjs';
          const event=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH,'utf8'));
          const task=validateLocalWebOwnerEvent(event,{
            actor:process.env.GITHUB_ACTOR,repository:process.env.GITHUB_REPOSITORY
          });
          fs.writeFileSync('/tmp/pwa-next.json',JSON.stringify({task})+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'has_work=true\n'+'task_id='+task.id+'\n'+'game_id='+task.game_id+'\n'+'files='+task.files+'\n');
          console.log('LOCAL_WEB_OWNER_DIRECTIVE=AUTHORIZED');
          NODE

      - name: Add owner instruction to independent WEB Vibe queue
        if: steps.local.outputs.has_work == 'true'
        id: ingest
        env:
          TASK_ID: ${{ steps.local.outputs.task_id }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-pwa-vibe-bridge'
          git config user.email 'pwa-vibe-bridge@users.noreply.github.com'
          success=0
          for attempt in 1 2 3; do
            git fetch --depth=1 --filter=blob:none origin "$WEB_VIBE_BRANCH" main --quiet
            work="/tmp/web-vibe-${GITHUB_RUN_ID}-${attempt}"
            rm -rf "$work"
            git worktree prune
            git worktree add --detach "$work" "origin/$WEB_VIBE_BRANCH" >/dev/null
            if ! node "$GITHUB_WORKSPACE/tools/web-vibe-organization.mjs" ingest \
              --task=/tmp/pwa-next.json \
              --queue="$work/.web-vibe/queue.json" \
              --catalog="$GITHUB_WORKSPACE/game-catalog.json" \
              --status="$GITHUB_WORKSPACE/company-status.json" \
              --root="$GITHUB_WORKSPACE" \
              --output="$work/.web-vibe/queue.json"; then
              git worktree remove --force "$work" >/dev/null 2>&1 || true
              break
            fi
            cd "$work"
            git add .web-vibe/queue.json
            if git diff --cached --quiet; then
              success=1
            else
              git commit -m "web-vibe: enqueue WEB-only owner directive ${TASK_ID} [skip ci]"
              if git push origin "HEAD:$WEB_VIBE_BRANCH"; then success=1; fi
            fi
            cd "$GITHUB_WORKSPACE"
            git worktree remove --force "$work" >/dev/null 2>&1 || true
            [ "$success" = 1 ] && break
            sleep $((attempt * 2))
          done
          if [ "$success" != 1 ]; then
            if [ "$GITHUB_EVENT_NAME" = 'repository_dispatch' ] || [ "$GITHUB_EVENT_NAME" = 'issue_comment' ]; then
              echo 'LOCAL_WEB_OWNER_DIRECTIVE_QUEUE_INGEST=FAIL' >&2
              exit 1
            fi
            printf '{"action":"sync","updates":[{"taskId":"%s","status":"needs_input","blocker":"Vibe2 큐 연결 실패. 다음 브리지 실행에서 다시 확인 필요."}]}\n' "$TASK_ID" > /tmp/pwa-ingest-fail.json
            curl -fsS -X POST "$COMPANY_BRIDGE_URL" \
              -H "Authorization: Bearer $COMPANY_OIDC_TOKEN" \
              -H 'Content-Type: application/json' \
              --data-binary @/tmp/pwa-ingest-fail.json || true
            exit 1
          fi
          echo 'queued=true' >> "$GITHUB_OUTPUT"
          echo 'WEB_VIBE_QUEUE_WRITE=PASS'
          echo 'WEB_VIBE_QUEUE_ORGANIZATION=WEB_ONLY'

      - name: Confirm independent WEB Vibe handoff
        if: steps.ingest.outputs.queued == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Fail closed: never wake Roblox/Unity/Vibe2 workers if the WEB local engine is offline.
          echo 'WEB_VIBE_ENGINE=WEB_VIBE_1'
          echo 'WEB_VIBE_EXECUTION=DEDICATED_LOCAL_ENGINE_REQUIRED'
          echo 'WEB_VIBE_PUBLICATION=NOT_VERIFIED'

  github-cloud:
    # Original PWA polling stays in the existing cloud lane. Local WEB chat
    # and owner comments now execute only through independent WEB_VIBE_1.
    if: github.event_name != 'issue_comment' && github.event_name != 'repository_dispatch'
    env:
      VIBE2_BRANCH: vibe2-unreal-core
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          fetch-tags: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate GitHub cloud PWA bridge contract
        run: |
          set -euo pipefail
          node --check tools/pwa-command-vibe2-task.mjs
          node --test qa/pwa-command-vibe2-task.test.mjs

      - name: Get short-lived GitHub OIDC token
        if: github.event_name != 'repository_dispatch' && github.event_name != 'issue_comment'
        shell: bash
        run: |
          set -euo pipefail
          sep='?'
          [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *'?'* ]] && sep='&'
          token="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}${sep}audience=jaewoon-company" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value||''))")"
          test -n "$token"
          echo "::add-mask::$token"
          echo "COMPANY_OIDC_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Sync existing Vibe2 task states to PWA chat
        if: github.event_name != 'repository_dispatch' && github.event_name != 'issue_comment'
        shell: bash
        run: |
          set -euo pipefail
          # 현재 큐 스냅샷만 필요하다. 대형 제어 브랜치 전체 이력을 매 5분마다 복제하지 않는다.
          git fetch --depth=1 --filter=blob:none origin "$VIBE2_BRANCH" --quiet
          git show "origin/$VIBE2_BRANCH:.vibe2/queue.json" > /tmp/vibe2-queue.json || printf '{"version":3,"tasks":[]}\n' > /tmp/vibe2-queue.json
          node tools/pwa-command-vibe2-task.mjs sync --queue=/tmp/vibe2-queue.json --output=/tmp/pwa-sync.json
          curl -fsS -X POST "$COMPANY_BRIDGE_URL" \
            -H "Authorization: Bearer $COMPANY_OIDC_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/pwa-sync.json > /tmp/pwa-sync-result.json
          cat /tmp/pwa-sync-result.json

      - name: Claim next original PWA instruction
        id: next
        shell: bash
        run: |
          set -euo pipefail
          # Existing PWA polling and OIDC endpoint are unchanged.
            printf '{"action":"next"}\n' > /tmp/pwa-next-request.json
            curl -fsS -X POST "$COMPANY_BRIDGE_URL" \
              -H "Authorization: Bearer $COMPANY_OIDC_TOKEN" \
              -H 'Content-Type: application/json' \
              --data-binary @/tmp/pwa-next-request.json > /tmp/pwa-next.json
            node <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('/tmp/pwa-next.json','utf8'));
          if(data.ok!==true)throw new Error(data.error||'PWA bridge returned failure');
          const out=process.env.GITHUB_OUTPUT;
          fs.appendFileSync(out,`has_work=${data.task?'true':'false'}\n`);
          fs.appendFileSync(out,`task_id=${data.task?.id||''}\n`);
          console.log(`PWA_COMMAND=${data.task?'CLAIMED':'IDLE'}`);
          NODE
      - name: Classify authenticated owner stop or permanent deletion
        id: owner_stop
        if: steps.next.outputs.has_work == 'true'
        run: node tools/pwa-owner-stop.mjs classify --task=/tmp/pwa-next.json

      - name: Apply authenticated owner management task
        if: steps.owner_stop.outputs.owner_stop == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! node tools/pwa-owner-stop.mjs apply --task=/tmp/pwa-next.json; then
            node - <<'NODE'
          const fs=require('fs'),d=JSON.parse(fs.readFileSync('/tmp/pwa-next.json','utf8'));
          fs.writeFileSync('/tmp/pwa-owner-stop-status.json',JSON.stringify({action:'sync',updates:[{taskId:d.task.id,status:'needs_input',blocker:d.task.body==='OWNER_DELETE_GAME:'+d.task.game_id?'영구삭제 카탈로그/원본 반영 실패 · 복구 필요':'개발중단 카탈로그 반영 실패 · 복구 필요'}]}));
          NODE
            curl -fsS -X POST "$COMPANY_BRIDGE_URL" -H "Authorization: Bearer $COMPANY_OIDC_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/pwa-owner-stop-status.json || true
            exit 1
          fi
          gh workflow run magic-forest-pages.yml --repo "$GITHUB_REPOSITORY" --ref main
          node - <<'NODE'
          const fs=require('fs'),d=JSON.parse(fs.readFileSync('/tmp/pwa-next.json','utf8'));
          const deleting=d.task.body==='OWNER_DELETE_GAME:'+d.task.game_id;
          fs.writeFileSync('/tmp/pwa-owner-stop-status.json',JSON.stringify({action:'sync',updates:[{taskId:d.task.id,status:deleting?'testing':'done',message:deleting?'게임 원본을 main에서 제거하고 영구삭제 목록에 등록했어. Pages 게시를 요청했으며 실제 공개 반영은 확인 중이야. 다른 기기의 저장 데이터는 별도야.':'게임 자동개발 중단을 main과 company-runtime에 반영했어. 원본과 저장 데이터는 유지했어. Pages 게시 요청 접수됨.'}]}));
          NODE
          curl -fsS -X POST "$COMPANY_BRIDGE_URL" -H "Authorization: Bearer $COMPANY_OIDC_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/pwa-owner-stop-status.json > /tmp/pwa-owner-stop-result.json
          node -e "if(JSON.parse(require('fs').readFileSync('/tmp/pwa-owner-stop-result.json','utf8')).ok!==true)process.exit(1)"
          echo 'PWA_OWNER_GAME_MANAGEMENT_SOURCE_APPLIED=PASS'
          echo 'PWA_OWNER_GAME_PAGES_DEPLOYMENT=DISPATCHED_NOT_VERIFIED'

      - name: Add owner instruction to Vibe2 control queue
        if: steps.next.outputs.has_work == 'true' && steps.owner_stop.outputs.owner_stop != 'true'
        id: ingest
        env:
          TASK_ID: ${{ steps.next.outputs.task_id }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-pwa-vibe-bridge'
          git config user.email 'pwa-vibe-bridge@users.noreply.github.com'
          success=0
          for attempt in 1 2 3; do
            git fetch --depth=1 --filter=blob:none origin "$VIBE2_BRANCH" main --quiet
            work="/tmp/pwa-vibe2-${GITHUB_RUN_ID}-${attempt}"
            rm -rf "$work"
            git worktree prune
            git worktree add --detach "$work" "origin/$VIBE2_BRANCH" >/dev/null
            node tools/vibe2-queue-control.mjs storage-unpack --queue="$work/.vibe2/queue.json"
            if ! node "$GITHUB_WORKSPACE/tools/pwa-command-vibe2-task.mjs" ingest \
              --task=/tmp/pwa-next.json \
              --queue="$work/.vibe2/queue.json" \
              --catalog="$GITHUB_WORKSPACE/game-catalog.json" \
              --status="$GITHUB_WORKSPACE/company-status.json" \
              --root="$GITHUB_WORKSPACE" \
              --output="$work/.vibe2/queue.json"; then
              git worktree remove --force "$work" >/dev/null 2>&1 || true
              break
            fi
            cd "$work"
            node "$GITHUB_WORKSPACE/tools/vibe2-queue-control.mjs" storage-pack --queue=.vibe2/queue.json
            if [ -d ./.vibe2/queue ]; then git add -A -- .vibe2/queue; fi
            git add .vibe2/queue.json
            node "$GITHUB_WORKSPACE/tools/vibe2-queue-control.mjs" storage-unpack --queue=.vibe2/queue.json
            if git diff --cached --quiet; then
              success=1
            else
              git commit -m "vibe2: enqueue PWA owner directive ${TASK_ID} [skip ci]"
              if git push origin "HEAD:$VIBE2_BRANCH"; then success=1; fi
            fi
            cd "$GITHUB_WORKSPACE"
            git worktree remove --force "$work" >/dev/null 2>&1 || true
            [ "$success" = 1 ] && break
            sleep $((attempt * 2))
          done
          if [ "$success" != 1 ]; then
            printf '{"action":"sync","updates":[{"taskId":"%s","status":"needs_input","blocker":"Vibe2 큐 연결 실패. 다음 브리지 실행에서 다시 확인 필요."}]}\n' "$TASK_ID" > /tmp/pwa-ingest-fail.json
            curl -fsS -X POST "$COMPANY_BRIDGE_URL" \
              -H "Authorization: Bearer $COMPANY_OIDC_TOKEN" \
              -H 'Content-Type: application/json' \
              --data-binary @/tmp/pwa-ingest-fail.json || true
            exit 1
          fi
          echo 'queued=true' >> "$GITHUB_OUTPUT"
          echo 'PWA_VIBE_QUEUE_WRITE=PASS'

      - name: Start owner development directly in existing Vibe2 worker
        if: steps.ingest.outputs.queued == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Owner ingress bypasses the periodic auto-planner, not source/security/release guards.
          # The existing main deployment publishes first and validates the public route afterwards.
          gh workflow run vibe2-continuous-core.yml --repo "$GITHUB_REPOSITORY" --ref main -f execution_lane=game-primary
          echo 'PWA_OWNER_GAME_DIRECT_DISPATCH=PASS'
          echo 'PWA_OWNER_POST_PUBLISH_QA=EXISTING_MAIN_RELEASE_PIPELINE'


  web-recovery-select:
    # Five-minute PWA watchdog reuses the existing authenticated WEB-only queue.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-slim
    timeout-minutes: 3
    outputs:
      selected: ${{ steps.select.outputs.selected }}
      task_id: ${{ steps.select.outputs.task_id }}
      game_id: ${{ steps.select.outputs.game_id }}
      files: ${{ steps.select.outputs.files }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Select oldest eligible WEB owner task
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # 기존 5분 watchdog 안에서만 학습을 승격한다. PR 병합 + 정확한 공개 소스
          # + 해당 게임 실제 브라우저 플레이 증거가 없으면 기존 review를 보존한다.
          for attempt in 1 2 3; do
            gh api "repos/$GITHUB_REPOSITORY/contents/.web-vibe/queue.json?ref=web-vibe-control" > /tmp/web-recovery-head.json
            jq -r '.content' /tmp/web-recovery-head.json | base64 -d > /tmp/web-recovery-queue.json
            node tools/web-vibe-recovery.mjs reconcile /tmp/web-recovery-queue.json /tmp/web-recovery-verified.json > /tmp/web-recovery-verified-result.json
            if ! jq -e '.changed > 0' /tmp/web-recovery-verified-result.json >/dev/null; then break; fi
            content="$(base64 -w0 /tmp/web-recovery-verified.json)"
            sha="$(jq -r '.sha' /tmp/web-recovery-head.json)"
            jq -nc --arg message "web-vibe: preserve verified browser learning [skip ci]" \
              --arg content "$content" --arg sha "$sha" \
              '{message:$message,content:$content,sha:$sha,branch:"web-vibe-control"}' \
              > /tmp/web-recovery-learn-payload.json
            if gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/.web-vibe/queue.json" \
                --input /tmp/web-recovery-learn-payload.json >/dev/null; then
              echo 'WEB_VIBE_VERIFIED_LEARNING_CHECKPOINT=WRITTEN'
              break
            fi
          done
          # Claim the next eligible authenticated task on the existing WEB
          # control branch before dispatch. SHA CAS prevents duplicate cron
          # workers, and a 75-minute lease recovers abandoned runners.
          claim_written=0
          for claim_attempt in 1 2 3; do
            gh api "repos/$GITHUB_REPOSITORY/contents/.web-vibe/queue.json?ref=web-vibe-control" > /tmp/web-recovery-head.json
            jq -r '.content' /tmp/web-recovery-head.json | base64 -d > /tmp/web-recovery-queue.json
            node tools/web-vibe-recovery.mjs select /tmp/web-recovery-queue.json > /tmp/web-recovery-selection.json
            if ! jq -e 'type=="object" and .taskId != null' /tmp/web-recovery-selection.json >/dev/null; then
              echo "selected=false" >> "$GITHUB_OUTPUT"
              echo 'WEB_VIBE_RECOVERY=NO_ELIGIBLE_OWNER_QUEUE'
              exit 0
            fi
            task_id="$(jq -r '.taskId' /tmp/web-recovery-selection.json)"
            files="$(jq -r '.files' /tmp/web-recovery-selection.json)"
            game_id="$(jq -r '.gameId' /tmp/web-recovery-selection.json)"
            [[ "$game_id" =~ ^[a-zA-Z0-9][a-zA-Z0-9_-]{0,79}$ ]] || exit 1
            [[ "$task_id" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]] || exit 1
            node tools/web-vibe-recovery.mjs claim /tmp/web-recovery-queue.json "pwa-$task_id" \
              /tmp/web-recovery-claimed.json "$GITHUB_RUN_ID" > /tmp/web-recovery-claim.json
            content="$(base64 -w0 /tmp/web-recovery-claimed.json)"
            sha="$(jq -r '.sha' /tmp/web-recovery-head.json)"
            jq -nc --arg message "web-vibe: bounded watchdog claim [skip ci]" \
              --arg content "$content" --arg sha "$sha" \
              '{message:$message,content:$content,sha:$sha,branch:"web-vibe-control"}' \
              > /tmp/web-recovery-claim-payload.json
            if gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/.web-vibe/queue.json" \
                --input /tmp/web-recovery-claim-payload.json >/dev/null; then
              claim_written=1
              break
            fi
          done
          if [ "$claim_written" != 1 ]; then
            echo 'WEB_VIBE_RECOVERY=CLAIM_CONFLICT_NOT_DISPATCHED' >&2
            exit 1
          fi
          echo "selected=true" >> "$GITHUB_OUTPUT"
          echo "task_id=$task_id" >> "$GITHUB_OUTPUT"
          echo "game_id=$game_id" >> "$GITHUB_OUTPUT"
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo 'WEB_VIBE_RECOVERY=EXACT_OWNER_TASK_CLAIMED'


  web-recovery-onepatch:
    needs: web-recovery-select
    if: needs.web-recovery-select.outputs.selected == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    concurrency:
      group: web-vibe-onepatch-${{ needs.web-recovery-select.outputs.game_id }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    env:
      WEB_VIBE_GH_TOKEN: ${{ secrets.WEB_VIBE_GH_TOKEN || github.token }}
      WEB_VIBE_JOB_TOKEN: ${{ !secrets.WEB_VIBE_GH_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      VIBE2_EXTERNAL_FREE_ROTATION: 'YES'
      VIBE2_GROQ_FREE_PLAN_VERIFIED: ${{ vars.VIBE2_GROQ_FREE_PLAN_VERIFIED }}
      WEB_OWNER_TASK_ID: ${{ needs.web-recovery-select.outputs.task_id }}
      WEB_OWNER_FILES: ${{ needs.web-recovery-select.outputs.files }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve original WEB worker security and QA gates
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WEB_VIBE_GH_TOKEN"
          node tools/company-constitution-enforcer.mjs --phase=worker-before-source-write
          node --check tools/web-vibe-worker.mjs
          node --check tools/web-vibe-recovery.mjs
          node --test qa/web-vibe-worker.test.mjs qa/web-vibe-organization.test.mjs qa/pwa-command-vibe2-task.test.mjs
      - name: Resume exact authenticated WEB owner task
        id: resume_owner
        shell: bash
        run: |
          set -euo pipefail
          [[ "$WEB_OWNER_TASK_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]] || exit 1
          if [ "$WEB_OWNER_FILES" = '*' ] || [ "$WEB_OWNER_FILES" = 'all' ]; then
            node tools/web-vibe-worker.mjs "--task=pwa-$WEB_OWNER_TASK_ID" --all --cloud --apply --pr 2>&1 | tee "$RUNNER_TEMP/web-vibe-recovery.log"
          else
            node tools/web-vibe-worker.mjs "--task=pwa-$WEB_OWNER_TASK_ID" "--files=$WEB_OWNER_FILES" --cloud --apply --pr 2>&1 | tee "$RUNNER_TEMP/web-vibe-recovery.log"
          fi
          echo 'WEB_VIBE_RECOVERY_RESULT=PR_CANDIDATE_ONLY_NOT_MERGED'
      - name: Persist bounded WEB retry evidence after failure
        if: failure() && steps.resume_owner.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            gh api "repos/$GITHUB_REPOSITORY/contents/.web-vibe/queue.json?ref=web-vibe-control" > /tmp/web-recovery-current.json
            jq -r '.content' /tmp/web-recovery-current.json | base64 -d > /tmp/web-recovery-queue.json
            node tools/web-vibe-recovery.mjs failure /tmp/web-recovery-queue.json "pwa-$WEB_OWNER_TASK_ID" /tmp/web-recovery-updated.json "$RUNNER_TEMP/web-vibe-recovery.log" > /tmp/web-recovery-outcome.json
            if ! jq -e '.changed == true' /tmp/web-recovery-outcome.json >/dev/null; then
              echo 'WEB_VIBE_RECOVERY=ALREADY_REVIEWED_OR_SUPERSEDED'
              exit 0
            fi
            cat /tmp/web-recovery-outcome.json
            content="$(base64 -w0 /tmp/web-recovery-updated.json)"
            sha="$(jq -r '.sha' /tmp/web-recovery-current.json)"
            jq -nc --arg message "web-vibe: checkpoint failed owner retry [skip ci]" \
              --arg content "$content" --arg sha "$sha" \
              '{message:$message,content:$content,sha:$sha,branch:"web-vibe-control"}' \
              > /tmp/web-recovery-payload.json
            if gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/.web-vibe/queue.json" \
                --input /tmp/web-recovery-payload.json >/dev/null; then
              echo 'WEB_VIBE_RECOVERY=FAILED_WITH_BOUNDED_RETRY_CHECKPOINT'
              exit 0
            fi
          done
          echo 'WEB_VIBE_RECOVERY=QUEUE_WRITE_CONFLICT_NEEDS_TRIAGE' >&2
          exit 1

  web-cloud-onepatch:
    # Run WEB_VIBE_1 on GitHub with existing WEB-only queue; no native task dispatch.
    permissions:
      contents: write
      pull-requests: write
    needs: bridge
    if: >-
      (github.event_name == 'issue_comment' || github.event_name == 'repository_dispatch') &&
      needs.bridge.result == 'success' &&
      needs.bridge.outputs.queued == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    concurrency:
      group: web-vibe-onepatch-${{ needs.bridge.outputs.game_id }}
      cancel-in-progress: false
    env:
      WEB_VIBE_GH_TOKEN: ${{ secrets.WEB_VIBE_GH_TOKEN || github.token }}
      WEB_VIBE_JOB_TOKEN: ${{ !secrets.WEB_VIBE_GH_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      VIBE2_EXTERNAL_FREE_ROTATION: 'YES'
      VIBE2_GROQ_FREE_PLAN_VERIFIED: ${{ vars.VIBE2_GROQ_FREE_PLAN_VERIFIED }}
      WEB_OWNER_TASK_ID: ${{ needs.bridge.outputs.task_id }}
      WEB_OWNER_FILES: ${{ needs.bridge.outputs.files }}
    steps:
      - name: Checkout latest main for independent WEB Vibe
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify WEB-only source and existing authorization
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WEB_VIBE_GH_TOKEN" || { echo 'WEB_VIBE_GITHUB_DEDICATED_PAT_REQUIRED' >&2; exit 1; }
          # Canonical owner-policy enforcement is mandatory before any game source write.
          node tools/company-constitution-enforcer.mjs --phase=worker-before-source-write
          node --check tools/web-vibe-worker.mjs
          node --check tools/web-vibe-organization.mjs
          node --test qa/web-vibe-worker.test.mjs qa/web-vibe-organization.test.mjs qa/pwa-command-vibe2-task.test.mjs
      - name: Run existing WEB_VIBE_1 patch on GitHub and create reviewable PR
        id: run_owner
        shell: bash
        run: |
          set -euo pipefail
          [[ "$WEB_OWNER_TASK_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]] || exit 1
          if [ "$WEB_OWNER_FILES" = '*' ]; then
            node tools/web-vibe-worker.mjs "--task=pwa-$WEB_OWNER_TASK_ID" --all --cloud --apply --pr 2>&1 | tee "$RUNNER_TEMP/web-vibe-direct.log"
          else
            node tools/web-vibe-worker.mjs "--task=pwa-$WEB_OWNER_TASK_ID" "--files=$WEB_OWNER_FILES" --cloud --apply --pr 2>&1 | tee "$RUNNER_TEMP/web-vibe-direct.log"
          fi
          echo 'WEB_VIBE_CLOUD_PR_CREATED=YES'
          echo 'WEB_VIBE_CLOUD_MERGE_AND_PUBLICATION=NOT_VERIFIED'
      - name: Persist direct WEB failure classification in existing queue
        if: failure() && steps.run_owner.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Reuse the existing bounded checkpoint. No new job or queue.
          for attempt in 1 2 3; do
            gh api "repos/$GITHUB_REPOSITORY/contents/.web-vibe/queue.json?ref=web-vibe-control" > /tmp/web-vibe-direct-current.json
            jq -r '.content' /tmp/web-vibe-direct-current.json | base64 -d > /tmp/web-vibe-direct-queue.json
            node tools/web-vibe-recovery.mjs failure /tmp/web-vibe-direct-queue.json "pwa-$WEB_OWNER_TASK_ID" /tmp/web-vibe-direct-updated.json "$RUNNER_TEMP/web-vibe-direct.log" > /tmp/web-vibe-direct-outcome.json
            if ! jq -e '.changed == true' /tmp/web-vibe-direct-outcome.json >/dev/null; then
              echo 'WEB_VIBE_DIRECT_FAILURE_CHECKPOINT=NO_ELIGIBLE_TASK'
              exit 0
            fi
            content="$(base64 -w0 /tmp/web-vibe-direct-updated.json)"
            sha="$(jq -r '.sha' /tmp/web-vibe-direct-current.json)"
            jq -nc --arg message "web-vibe: checkpoint direct WEB repair failure [skip ci]" \
              --arg content "$content" --arg sha "$sha" \
              '{message:$message,content:$content,sha:$sha,branch:"web-vibe-control"}' \
              > /tmp/web-vibe-direct-checkpoint.json
            if gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/.web-vibe/queue.json" \
                --input /tmp/web-vibe-direct-checkpoint.json >/dev/null; then
              echo 'WEB_VIBE_DIRECT_FAILURE_CHECKPOINT=WRITTEN'
              exit 0
            fi
          done
          echo 'WEB_VIBE_DIRECT_FAILURE_CHECKPOINT=CONFLICT_REQUIRES_REVIEW' >&2
          exit 1
