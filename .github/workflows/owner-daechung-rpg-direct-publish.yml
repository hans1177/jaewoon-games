name: Owner Daechung RPG Direct Publish
run-name: Owner Daechung publish · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - 'roblox-games/daechung-rpg/**'
      - '.github/workflows/owner-daechung-rpg-direct-publish.yml'
      - 'tools/company-roblox-dedicated-experience.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: owner-daechung-rpg-direct-publish
  cancel-in-progress: true

env:
  COMPANY_RUNTIME_BRANCH: company-runtime
  GAME_ID: daechung-rpg
  GAME_NAME: '포탈 알피지'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: main
          fetch-depth: 1

      - name: Checkout company runtime
        uses: actions/checkout@v4
        with:
          ref: company-runtime
          path: runtime
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Rojo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rojo-bin
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip
          echo '22503e5839864f9d7c2171c48b536fc229f2cc4d8774c9cc149f60941d864073  /tmp/rojo.zip' | sha256sum -c -
          unzip -q /tmp/rojo.zip -d /tmp/rojo-bin
          chmod +x /tmp/rojo-bin/rojo

      - name: Resolve existing Daechung RPG target
        id: reuse
        working-directory: main
        env:
          GAME_ID: ${{ env.GAME_ID }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const q=JSON.parse(fs.readFileSync('../runtime/development-queue.json','utf8'));
          const item=(q.items||[]).find(x=>x.gameId===process.env.GAME_ID);
          if(!item)throw new Error('queue item missing: '+process.env.GAME_ID);
          const valid=v=>/^[1-9][0-9]*$/.test(String(v||''));
          const registry=fs.existsSync('../runtime/roblox-dedicated-targets.json')
            ?JSON.parse(fs.readFileSync('../runtime/roblox-dedicated-targets.json','utf8'))
            :{targets:[]};
          const current=item.robloxPublicationTarget||{};
          const registered=(registry.targets||[]).find(x=>x.gameId===process.env.GAME_ID)||{};
          const currentOk=current.dedicated===true&&current.shared!==true&&valid(current.universeId)&&valid(current.placeId);
          const registeredOk=registered.dedicated===true&&registered.shared!==true&&valid(registered.universeId)&&valid(registered.placeId);
          const chosen=currentOk?current:(registeredOk?registered:{});
          const reuse=valid(chosen.universeId)&&valid(chosen.placeId);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'universe_id='+(reuse?chosen.universeId:'')+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'place_id='+(reuse?chosen.placeId:'')+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'reuse='+(reuse?'true':'false')+'\n');
          console.log('DAECHUNG_OWNER_TARGET_REUSE='+(reuse?'YES':'NO'));
          console.log('DAECHUNG_OWNER_UNIVERSE_ID='+(reuse?chosen.universeId:'NEW'));
          console.log('DAECHUNG_OWNER_PLACE_ID='+(reuse?chosen.placeId:'NEW'));
          NODE

      - name: Build Daechung RPG from exact triggering source
        working-directory: main
        shell: bash
        run: |
          set -euo pipefail
          test -f "roblox-games/$GAME_ID/default.project.json"
          mkdir -p /tmp/daechung-owner-publish
          /tmp/rojo-bin/rojo build "roblox-games/$GAME_ID/default.project.json" -o "/tmp/daechung-owner-publish/$GAME_ID.rbxlx"
          test -s "/tmp/daechung-owner-publish/$GAME_ID.rbxlx"
          sha256sum "/tmp/daechung-owner-publish/$GAME_ID.rbxlx" | tee /tmp/daechung-owner-publish/build.sha256

      - name: Publish Daechung RPG to owner dedicated Roblox Experience
        working-directory: main
        env:
          REUSE_UNIVERSE_ID: ${{ steps.reuse.outputs.universe_id }}
          REUSE_PLACE_ID: ${{ steps.reuse.outputs.place_id }}
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_ROBLOSECURITY: ${{ secrets.ROBLOX_ROBLOSECURITY }}
          ROBLOX_SECURITY_COOKIE: ${{ secrets.ROBLOX_SECURITY_COOKIE }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --game-id "$GAME_ID"
            --game-name "$GAME_NAME"
            --place-file "/tmp/daechung-owner-publish/$GAME_ID.rbxlx"
            --source-revision "$GITHUB_SHA"
            --output "/tmp/daechung-owner-publish/$GAME_ID.result.json"
          )
          if [[ -n "${REUSE_UNIVERSE_ID:-}" && -n "${REUSE_PLACE_ID:-}" ]]; then
            args+=(--reuse-universe-id "$REUSE_UNIVERSE_ID" --reuse-place-id "$REUSE_PLACE_ID")
          fi
          node tools/company-roblox-dedicated-experience.mjs "${args[@]}"

      - name: Verify Daechung RPG publication
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const p='/tmp/daechung-owner-publish/daechung-rpg.result.json';
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          if(r.pass!==true||r.private!==true||r.published!==true)throw new Error('DAECHUNG_OWNER_PUBLISH_FAILED:'+String(r.stage||'unknown')+':'+String(r.error||'unknown'));
          if(!/^[1-9][0-9]*$/.test(String(r.universeId||''))||!/^[1-9][0-9]*$/.test(String(r.placeId||'')))throw new Error('DAECHUNG_OWNER_TARGET_INVALID');
          console.log('DAECHUNG_OWNER_PUBLISH_PASS=YES');
          console.log('DAECHUNG_OWNER_UNIVERSE_ID='+r.universeId);
          console.log('DAECHUNG_OWNER_PLACE_ID='+r.placeId);
          console.log('DAECHUNG_OWNER_VERSION_NUMBER='+r.versionNumber);
          console.log('DAECHUNG_OWNER_SOURCE_REVISION='+String(r.sourceRevision||''));
          NODE


      - name: Persist actual owner publication version with exact-build-only certification
        working-directory: runtime
        shell: bash
        env:
          RESULT_PATH: /tmp/daechung-owner-publish/daechung-rpg.result.json
          BUILD_HASH_PATH: /tmp/daechung-owner-publish/build.sha256
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-daechung-owner-publish'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags --depth=1 origin "$COMPANY_RUNTIME_BRANCH"
            git reset --hard "origin/$COMPANY_RUNTIME_BRANCH"
            node <<'NODE'
          const fs=require('fs');
          const queue=JSON.parse(fs.readFileSync('development-queue.json','utf8'));
          const result=JSON.parse(fs.readFileSync(process.env.RESULT_PATH,'utf8'));
          const sha256=fs.readFileSync(process.env.BUILD_HASH_PATH,'utf8').trim().split(/\s+/)[0];
          const artifact='sha256:'+sha256;
          const item=(queue.items||[]).find(x=>x.gameId===process.env.GAME_ID);
          const validId=x=>/^[1-9][0-9]*$/.test(String(x||''));
          const source=String(result.sourceRevision||'');
          const version=Number(result.versionNumber);
          const target=item?.robloxPublicationTarget;
          if(!item||result.pass!==true||result.published!==true||result.private!==true
            ||result.gameId!==item.gameId||!/^[a-f0-9]{40}$/i.test(source)
            ||source!==process.env.GITHUB_SHA||!/^sha256:[a-f0-9]{64}$/i.test(artifact)
            ||!Number.isInteger(version)||version<1||!validId(result.universeId)
            ||!validId(result.placeId)||target?.verified!==true||target?.dedicated!==true
            ||target?.shared!==false||String(target.universeId)!==String(result.universeId)
            ||String(target.placeId)!==String(result.placeId)){
            throw new Error('DAECHUNG_OWNER_PUBLISH_UNTRUSTED_TARGET_OR_ARTIFACT');
          }
          const prior=item.robloxDedicatedExperience;
          if(Number(prior?.versionNumber||0)>version){
            console.log('DAECHUNG_OWNER_PUBLISH_STALE_RESULT_IGNORED='+version);
            process.exit(0);
          }
          if(Number(prior?.versionNumber||0)===version
            &&(String(prior.publisherMainRevision||'')!==source
              ||String(prior.artifactIdentity||'')!==artifact)){
            throw new Error('DAECHUNG_OWNER_PUBLISH_VERSION_PROVENANCE_COLLISION');
          }
          const f0=item.robloxFoundationF0Evidence||{};
          const exact=item.robloxBuildOrPackagePassed===true
            &&item.robloxBuildPreflightPassed===true
            &&item.robloxFoundationF0Passed===true&&f0.pass===true
            &&item.robloxSourceCommit===source
            &&item.robloxBuildSourceRevision===source
            &&item.robloxBuildArtifactIdentity===artifact
            &&f0.sourceRevision===source&&f0.artifactIdentity===artifact
            &&Number.isInteger(Number(f0.artifactRunId))
            &&Number(f0.artifactRunId)>0;
          const newState=exact?'PASS':'REPAIR_REQUIRED';
          if(Number(prior?.versionNumber||0)===version
            &&prior?.state===newState&&prior?.publisherMainRevision===source
            &&prior?.artifactIdentity===artifact
            &&(exact?prior?.sourceRevision===source:true)){
            console.log('DAECHUNG_OWNER_PUBLISH_PROVENANCE_ALREADY_CURRENT='+version);
            process.exit(0);
          }
          const stamp=new Date().toISOString();
          item.robloxDedicatedExperience={
            version:2,gameId:item.gameId,sourceRevision:exact?source:null,
            publisherMainRevision:source,artifactIdentity:artifact,
            artifactRunId:exact?Number(f0.artifactRunId):null,
            universeId:String(result.universeId),placeId:String(result.placeId),
            created:result.created===true,reusedTarget:result.reusedTarget!==false,
            configured:true,private:true,published:true,versionNumber:version,
            state:newState,stage:exact?null:'EXACT_ARTIFACT_BINDING',
            error:exact?null:'DEDICATED_PUBLISH_ARTIFACT_NOT_BOUND_TO_CANONICAL_GAME_SOURCE',
            workflowRunId:Number(process.env.GITHUB_RUN_ID),updatedAt:stamp,
            authority:'owner-dedicated-roblox-experience-bootstrap',
          };
          item.robloxDedicatedExperiencePublished=exact;
          item.robloxDedicatedExperiencePublishedAt=exact?stamp:null;
          item.updatedAt=stamp;queue.updatedAt=stamp;
          fs.writeFileSync('development-queue.json',JSON.stringify(queue,null,2)+'\n');
          console.log('DAECHUNG_OWNER_PUBLISH_RECORDED_VERSION='+version);
          console.log('DAECHUNG_OWNER_PUBLISH_EXACT_ARTIFACT_PROVENANCE='+newState);
          console.log('DAECHUNG_OWNER_RUNTIME_OR_STUDIO_PLAY_CLAIM=NO');
          NODE
            git add development-queue.json
            git diff --cached --check
            if git diff --cached --quiet; then
              echo 'DAECHUNG_OWNER_PUBLISH_PROVENANCE=ALREADY_CURRENT'
              exit 0
            fi
            git commit -m 'runtime: record Daechung private owner publish provenance [skip ci]'
            if git push origin HEAD:"$COMPANY_RUNTIME_BRANCH"; then
              echo "DAECHUNG_OWNER_PUBLISH_PROVENANCE_PERSIST=PASS:$attempt"
              exit 0
            fi
            echo "DAECHUNG_OWNER_PUBLISH_PROVENANCE_CONFLICT_RETRY=$attempt"
            sleep 1
          done
          echo 'DAECHUNG_OWNER_PUBLISH_PROVENANCE_PERSIST=FAILED'
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: owner-daechung-rpg-publish
          path: |
            /tmp/daechung-owner-publish/daechung-rpg.result.json
            /tmp/daechung-owner-publish/build.sha256
          if-no-files-found: error
          retention-days: 14
