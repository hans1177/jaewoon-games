name: Finalize Detailed Stage Scoring V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-detailed-stage-scoring-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clean stale scoring mirror keys
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='company-directive.json';
          const d=JSON.parse(fs.readFileSync(file,'utf8'));
          const display=d.homepageOperations?.developmentProgressDisplay;
          if(display){
            delete display.scoreRequiresSchema13;
            delete display.scoreRequiresSchema14;
            display.scoreRequiresSchema15=true;
          }
          fs.writeFileSync(file,JSON.stringify(d,null,2)+'\n');
          NODE
      - name: Verify focused scoring contracts
        run: |
          node --test qa/company-detailed-stage-scoring-v2.test.mjs
          node --test qa/company-common-development-quality-contract.test.mjs
          node --test qa/company-development-validation-selected-platform.test.mjs
      - name: Remove one-shot migration files and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/apply-detailed-stage-scoring-v2.mjs
          rm -f .github/workflows/apply-detailed-stage-scoring-v2.yml
          rm -f .github/workflows/finalize-detailed-stage-scoring-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'FINALIZE_CHANGES=NONE'
            exit 0
          fi
          git commit -m 'vibe2: finalize detailed stage scoring v2'
          git push origin HEAD:main
          echo 'FINALIZE_CHANGES=APPLIED'
