name: Unity Hybrid Android Build

on:
  push:
    branches: [main]
    paths:
      - '.build-requests/unity/*.json'
  workflow_dispatch:
    inputs:
      request_file:
        description: 'Tracked .build-requests/unity/*.json request file'
        required: true
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: unity-hybrid-android-build
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      request_file: ${{ steps.request.outputs.request_file }}
      target: ${{ steps.probe.outputs.target }}
      heartbeat_age_seconds: ${{ steps.probe.outputs.heartbeat_age_seconds }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve build request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            request_file='${{ inputs.request_file }}'
          else
            before='${{ github.event.before }}'
            if [[ -n "$before" && ! "$before" =~ ^0+$ ]]; then
              mapfile -t files < <(git diff --name-only "$before" "$GITHUB_SHA" -- '.build-requests/unity/*.json')
            else
              mapfile -t files < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- '.build-requests/unity/*.json')
            fi
            if [[ ${#files[@]} -ne 1 ]]; then
              echo "Exactly one Unity build request must change. Found ${#files[@]}: ${files[*]}" >&2
              exit 1
            fi
            request_file="${files[0]}"
          fi

          python3 - "$request_file" <<'PY'
          import json, pathlib, re, sys
          request_file = sys.argv[1]
          if not re.fullmatch(r'\.build-requests/unity/[A-Za-z0-9._-]+\.json', request_file):
              raise SystemExit(f'invalid request path: {request_file}')
          path = pathlib.Path(request_file)
          if not path.is_file():
              raise SystemExit(f'build request missing: {request_file}')
          data = json.loads(path.read_text(encoding='utf-8'))
          if data.get('version') != 1:
              raise SystemExit('unsupported build request version')
          project = str(data.get('projectPath','')).replace('\\','/').strip('/')
          method = str(data.get('buildMethod','')).strip()
          if not re.fullmatch(r'unity-games/[A-Za-z0-9._-]+', project) or '..' in project:
              raise SystemExit(f'invalid projectPath: {project}')
          if not method or not re.fullmatch(r'[A-Za-z0-9_.]+', method):
              raise SystemExit('buildMethod is required and must be a fully qualified Unity static method')
          if not (pathlib.Path(project) / 'ProjectSettings' / 'ProjectVersion.txt').is_file():
              raise SystemExit(f'not a Unity project: {project}')
          PY
          echo "request_file=$request_file" >> "$GITHUB_OUTPUT"

      - name: Probe local PC runner, otherwise choose cloud
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$GITHUB_OUTPUT" <<'PY'
          import datetime as dt, json, os, sys, time, urllib.error, urllib.request

          output = sys.argv[1]
          repo = os.environ['GH_REPOSITORY']
          token = os.environ['GH_TOKEN']
          api = f'https://api.github.com/repos/{repo}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'jaewoon-unity-hybrid-router'
          }

          def request(url, method='GET', data=None):
              body = None if data is None else json.dumps(data).encode('utf-8')
              req = urllib.request.Request(url, data=body, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=20) as res:
                  raw = res.read()
                  return json.loads(raw) if raw else None

          try:
              request(f'{api}/actions/workflows/unity-local-runner-heartbeat.yml/dispatches', 'POST', {'ref':'main'})
              print('[INFO] Requested an immediate local-runner heartbeat.')
          except Exception as exc:
              print(f'[WARN] Could not dispatch heartbeat: {exc}')

          target = 'cloud'
          age = -1
          deadline = time.time() + 90
          while True:
              try:
                  payload = request(f'{api}/actions/workflows/unity-local-runner-heartbeat.yml/runs?branch=main&per_page=10') or {}
                  now = dt.datetime.now(dt.timezone.utc)
                  for run in payload.get('workflow_runs', []):
                      if run.get('conclusion') != 'success':
                          continue
                      stamp = run.get('updated_at') or run.get('created_at')
                      if not stamp:
                          continue
                      when = dt.datetime.fromisoformat(stamp.replace('Z', '+00:00'))
                      candidate_age = max(0, int((now - when).total_seconds()))
                      age = candidate_age
                      if candidate_age <= 480:
                          target = 'local'
                      break
              except Exception as exc:
                  print(f'[WARN] Heartbeat lookup failed: {exc}')

              if target == 'local' or time.time() >= deadline:
                  break
              time.sleep(10)

          print(f'[ROUTE] target={target} heartbeat_age_seconds={age}')
          with open(output, 'a', encoding='utf-8') as f:
              f.write(f'target={target}\n')
              f.write(f'heartbeat_age_seconds={age}\n')
          PY

      - name: Route summary
        shell: bash
        run: |
          echo "Build request: ${{ steps.request.outputs.request_file }}"
          echo "Selected route: ${{ steps.probe.outputs.target }}"
          echo "Local heartbeat age: ${{ steps.probe.outputs.heartbeat_age_seconds }} seconds"

  local:
    needs: route
    if: needs.route.outputs.target == 'local'
    uses: ./.github/workflows/unity-local-pc-android.yml
    with:
      request_file: ${{ needs.route.outputs.request_file }}
    secrets: inherit

  cloud:
    needs: route
    if: needs.route.outputs.target != 'local'
    uses: ./.github/workflows/unity-cloud-android-test.yml
    with:
      request_file: ${{ needs.route.outputs.request_file }}
    secrets: inherit
