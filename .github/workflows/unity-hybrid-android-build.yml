name: Unity Hybrid Android Build

on:
  push:
    branches: [main]
    paths:
      - '.build-requests/unity/*.json'
  workflow_dispatch:
    inputs:
      request_file:
        description: 'Tracked .build-requests/unity/*.json request file'
        required: true
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write

env:
  JAEWOON_LOCAL_RUNNER_ENABLED: 'false'

concurrency:
  group: unity-hybrid-android-build
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      request_file: ${{ steps.request.outputs.request_file }}
      target: ${{ steps.probe.outputs.target }}
      heartbeat_age_seconds: ${{ steps.probe.outputs.heartbeat_age_seconds }}
      route_reason: ${{ steps.probe.outputs.route_reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve build request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            request_file='${{ inputs.request_file }}'
          else
            before='${{ github.event.before }}'
            if [[ -n "$before" && ! "$before" =~ ^0+$ ]]; then
              mapfile -t files < <(git diff --name-only "$before" "$GITHUB_SHA" -- '.build-requests/unity/*.json')
            else
              mapfile -t files < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- '.build-requests/unity/*.json')
            fi
            if [[ ${#files[@]} -ne 1 ]]; then
              echo "Exactly one Unity build request must change. Found ${#files[@]}: ${files[*]}" >&2
              exit 1
            fi
            request_file="${files[0]}"
          fi

          python3 - "$request_file" <<'PY'
          import json, pathlib, re, sys
          request_file = sys.argv[1]
          if not re.fullmatch(r'\.build-requests/unity/[A-Za-z0-9._-]+\.json', request_file):
              raise SystemExit(f'invalid request path: {request_file}')
          path = pathlib.Path(request_file)
          if not path.is_file():
              raise SystemExit(f'build request missing: {request_file}')
          data = json.loads(path.read_text(encoding='utf-8'))
          if data.get('version') != 1:
              raise SystemExit('unsupported build request version')
          project = str(data.get('projectPath','')).replace('\\','/').strip('/')
          method = str(data.get('buildMethod','')).strip()
          if not re.fullmatch(r'unity-games/[A-Za-z0-9._-]+', project) or '..' in project:
              raise SystemExit(f'invalid projectPath: {project}')
          if not method or not re.fullmatch(r'[A-Za-z0-9_.]+', method):
              raise SystemExit('buildMethod is required and must be a fully qualified Unity static method')
          if not (pathlib.Path(project) / 'ProjectSettings' / 'ProjectVersion.txt').is_file():
              raise SystemExit(f'not a Unity project: {project}')
          PY
          echo "request_file=$request_file" >> "$GITHUB_OUTPUT"

      - name: Probe local PC runner, otherwise choose cloud
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$GITHUB_OUTPUT" <<'PY'
          import datetime as dt, json, os, sys, time, urllib.request

          output = sys.argv[1]

          if os.environ.get('JAEWOON_LOCAL_RUNNER_ENABLED', '').lower() != 'true':
              target = 'cloud'
              age = -1
              reason = 'local-route-locked'
              print(f'[ROUTE] target={target} reason={reason} heartbeat_age_seconds={age}')
              with open(output, 'a', encoding='utf-8') as f:
                  f.write(f'target={target}\n')
                  f.write(f'heartbeat_age_seconds={age}\n')
                  f.write(f'route_reason={reason}\n')
              raise SystemExit(0)

          repo = os.environ['GH_REPOSITORY']
          token = os.environ['GH_TOKEN']
          api = f'https://api.github.com/repos/{repo}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'jaewoon-unity-hybrid-router'
          }

          def request(url, method='GET', data=None):
              body = None if data is None else json.dumps(data).encode('utf-8')
              req = urllib.request.Request(url, data=body, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=20) as res:
                  raw = res.read()
                  return json.loads(raw) if raw else None

          workflow_api = f'{api}/actions/workflows/unity-local-runner-heartbeat.yml'
          target = 'cloud'
          age = -1
          reason = 'fresh-heartbeat-not-received'

          try:
              before_payload = request(f'{workflow_api}/runs?branch=main&event=workflow_dispatch&per_page=10') or {}
              before_ids = [int(run.get('id', 0)) for run in before_payload.get('workflow_runs', [])]
              baseline_id = max(before_ids, default=0)
              dispatch_time = dt.datetime.now(dt.timezone.utc)
              request(f'{workflow_api}/dispatches', 'POST', {'ref':'main'})
              print(f'[INFO] Requested fresh local-runner heartbeat after run id {baseline_id}.')
          except Exception as exc:
              baseline_id = 0
              dispatch_time = dt.datetime.now(dt.timezone.utc)
              reason = 'heartbeat-dispatch-failed'
              print(f'[WARN] Could not dispatch heartbeat: {exc}')

          deadline = time.time() + 90
          fresh_run_id = 0
          while reason != 'heartbeat-dispatch-failed' and time.time() < deadline:
              try:
                  payload = request(f'{workflow_api}/runs?branch=main&event=workflow_dispatch&per_page=10') or {}
                  fresh_runs = []
                  for run in payload.get('workflow_runs', []):
                      run_id = int(run.get('id', 0))
                      if run_id <= baseline_id:
                          continue
                      created = run.get('created_at')
                      if created:
                          created_at = dt.datetime.fromisoformat(created.replace('Z', '+00:00'))
                          if created_at < dispatch_time - dt.timedelta(seconds=5):
                              continue
                      fresh_runs.append(run)

                  if fresh_runs:
                      run = max(fresh_runs, key=lambda item: int(item.get('id', 0)))
                      fresh_run_id = int(run.get('id', 0))
                      status = run.get('status')
                      conclusion = run.get('conclusion')
                      print(f'[INFO] Fresh heartbeat run={fresh_run_id} status={status} conclusion={conclusion}')
                      if status == 'completed':
                          if conclusion == 'success':
                              target = 'local'
                              reason = 'fresh-heartbeat-success'
                              stamp = run.get('updated_at') or run.get('created_at')
                              if stamp:
                                  when = dt.datetime.fromisoformat(stamp.replace('Z', '+00:00'))
                                  age = max(0, int((dt.datetime.now(dt.timezone.utc) - when).total_seconds()))
                          else:
                              reason = f'fresh-heartbeat-{conclusion or "failed"}'
                          break
              except Exception as exc:
                  print(f'[WARN] Heartbeat lookup failed: {exc}')
              time.sleep(5)

          if target != 'local' and reason == 'fresh-heartbeat-not-received':
              reason = 'fresh-heartbeat-timeout'

          print(f'[ROUTE] target={target} reason={reason} heartbeat_run_id={fresh_run_id} heartbeat_age_seconds={age}')
          with open(output, 'a', encoding='utf-8') as f:
              f.write(f'target={target}\n')
              f.write(f'heartbeat_age_seconds={age}\n')
              f.write(f'route_reason={reason}\n')
          PY

      - name: Route summary
        shell: bash
        run: |
          echo "Build request: ${{ steps.request.outputs.request_file }}"
          echo "Selected route: ${{ steps.probe.outputs.target }}"
          echo "Route reason: ${{ steps.probe.outputs.route_reason }}"
          echo "Fresh local heartbeat age: ${{ steps.probe.outputs.heartbeat_age_seconds }} seconds"

  local:
    needs: route
    if: needs.route.outputs.target == 'local'
    uses: ./.github/workflows/unity-local-pc-android.yml
    with:
      request_file: ${{ needs.route.outputs.request_file }}
    secrets: inherit

  cloud:
    needs: route
    if: needs.route.outputs.target != 'local'
    uses: ./.github/workflows/unity-cloud-android-test.yml
    with:
      request_file: ${{ needs.route.outputs.request_file }}
    secrets: inherit

  phase4-native-evidence:
    needs: [route, local, cloud]
    if: always() && needs.cloud.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    continue-on-error: true
    steps:
      - name: Checkout exact Unity candidate/runtime source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Phase 4 Unity native completion payload
        env:
          REQUEST_FILE: ${{ needs.route.outputs.request_file }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "$REQUEST_FILE"
          game_id="$(node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync(process.env.REQUEST_FILE,'utf8'));process.stdout.write(String(r.gameId||''))")"
          test -n "$game_id"
          export GAME_ID="$game_id"
          node <<'NODE' > /tmp/vibe2-phase4-unity-native-completion.json
          const fs=require('fs');
          const path=require('path');
          const gameId=String(process.env.GAME_ID||'').trim();
          const files=[];
          const walk=dir=>{
            if(!fs.existsSync(dir))return;
            for(const entry of fs.readdirSync(dir,{withFileTypes:true})){
              const full=path.join(dir,entry.name);
              if(entry.isDirectory())walk(full);
              else if(entry.isFile()&&entry.name==='manifest.json')files.push(full);
            }
          };
          walk('.vibe2/candidates');
          const matches=[];
          for(const file of files){
            try{
              const m=JSON.parse(fs.readFileSync(file,'utf8'));
              const p=m?.phase4BenchmarkVerification;
              if(String(m?.gameId||'').trim()!==gameId)continue;
              if(String(m?.target||'').trim().toLowerCase()!=='unity')continue;
              if(p?.active!==true||String(p?.role||'').trim().toUpperCase()!=='CHALLENGER')continue;
              matches.push({m,p,file});
            }catch{}
          }
          if(matches.length!==1){
            process.stdout.write(JSON.stringify({version:1,capabilityBenchmarkNativeCompletions:[],reason:matches.length?'AMBIGUOUS_PHASE4_CHALLENGER':'NO_PHASE4_CHALLENGER'},null,2)+'\n');
            process.exit(0);
          }
          const {p}=matches[0];
          const completion={
            capabilityId:String(p.capabilityId||'').trim(),
            caseId:String(p.caseId||'').trim(),
            pairId:String(p.pairId||'').trim(),
            gameId,
            engine:'unity',
            unseenProblemFingerprint:String(p.unseenProblemFingerprint||'').trim(),
            nativeRuntimeVerified:true,
            evidence:[
              'phase4-native-runtime:UNITY_ANDROID16_ARM64_CLOUD_PASS',
              'actions-run:'+String(process.env.GITHUB_RUN_ID||'').trim(),
              'candidate-sha:'+String(process.env.GITHUB_SHA||'').trim()
            ]
          };
          if(!completion.capabilityId||!completion.caseId||!completion.pairId||!completion.unseenProblemFingerprint){
            process.stdout.write(JSON.stringify({version:1,capabilityBenchmarkNativeCompletions:[],reason:'INCOMPLETE_PHASE4_IDENTITY'},null,2)+'\n');
            process.exit(0);
          }
          process.stdout.write(JSON.stringify({version:1,capabilityBenchmarkNativeCompletions:[completion]},null,2)+'\n');
          NODE

      - name: Persist Unity native benchmark completion without release authority
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          count="$(node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('/tmp/vibe2-phase4-unity-native-completion.json','utf8'));process.stdout.write(String((p.capabilityBenchmarkNativeCompletions||[]).length))")"
          if [ "$count" != 1 ]; then
            echo 'VIBE2_PHASE4_UNITY_NATIVE_COMPLETION=SKIPPED_NO_ELIGIBLE_CHALLENGER'
            exit 0
          fi
          rm -rf /tmp/vibe2-control /tmp/vibe2-main-contract
          git clone --branch vibe2-unreal-core --single-branch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/vibe2-control >/dev/null 2>&1
          git -C /tmp/vibe2-control fetch origin main:refs/remotes/origin/main --quiet
          git -C /tmp/vibe2-control worktree add --detach /tmp/vibe2-main-contract origin/main >/dev/null
          cd /tmp/vibe2-control
          git config user.name 'jaewoon-vibe2-unity-native-evidence'
          git config user.email 'vibe2-unity-native-evidence@users.noreply.github.com'
          persisted=0
          for attempt in 1 2 3; do
            git fetch origin vibe2-unreal-core --quiet
            git reset --hard origin/vibe2-unreal-core
            node /tmp/vibe2-main-contract/tools/vibe2-experience-control.mjs \
              --memory="$PWD/.vibe2/experience.json" \
              --batch-review=/tmp/vibe2-phase4-unity-native-completion.json | tee /tmp/vibe2-phase4-unity-native-completion.log
            if git diff --quiet -- .vibe2/experience.json; then
              persisted=1
              break
            fi
            git add .vibe2/experience.json
            git commit -m "vibe2: bind Unity native Phase4 evidence [skip ci]"
            if git push origin HEAD:vibe2-unreal-core; then
              persisted=1
              break
            fi
            sleep $((attempt * 2))
          done
          test "$persisted" = 1
          echo 'VIBE2_PHASE4_UNITY_NATIVE_COMPLETION=BOUND_OR_ALREADY_PRESENT'
