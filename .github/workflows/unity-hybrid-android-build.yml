name: Unity Hybrid Android Build

on:
  push:
    branches: [main]
    paths:
      - '.build-requests/unity/*.json'
  workflow_dispatch:
    inputs:
      request_file:
        description: 'Tracked .build-requests/unity/*.json request file'
        required: true
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write

env:
  JAEWOON_LOCAL_RUNNER_ENABLED: 'false'

concurrency:
  group: unity-hybrid-android-build
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      request_file: ${{ steps.request.outputs.request_file }}
      target: ${{ steps.probe.outputs.target }}
      heartbeat_age_seconds: ${{ steps.probe.outputs.heartbeat_age_seconds }}
      route_reason: ${{ steps.probe.outputs.route_reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve build request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            request_file='${{ inputs.request_file }}'
          else
            before='${{ github.event.before }}'
            if [[ -n "$before" && ! "$before" =~ ^0+$ ]]; then
              mapfile -t files < <(git diff --name-only "$before" "$GITHUB_SHA" -- '.build-requests/unity/*.json')
            else
              mapfile -t files < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- '.build-requests/unity/*.json')
            fi
            if [[ ${#files[@]} -ne 1 ]]; then
              echo "Exactly one Unity build request must change. Found ${#files[@]}: ${files[*]}" >&2
              exit 1
            fi
            request_file="${files[0]}"
          fi

          python3 - "$request_file" <<'PY'
          import json, pathlib, re, sys
          request_file = sys.argv[1]
          if not re.fullmatch(r'\.build-requests/unity/[A-Za-z0-9._-]+\.json', request_file):
              raise SystemExit(f'invalid request path: {request_file}')
          path = pathlib.Path(request_file)
          if not path.is_file():
              raise SystemExit(f'build request missing: {request_file}')
          data = json.loads(path.read_text(encoding='utf-8'))
          if data.get('version') != 1:
              raise SystemExit('unsupported build request version')
          project = str(data.get('projectPath','')).replace('\\','/').strip('/')
          method = str(data.get('buildMethod','')).strip()
          if not re.fullmatch(r'unity-games/[A-Za-z0-9._-]+', project) or '..' in project:
              raise SystemExit(f'invalid projectPath: {project}')
          if not method or not re.fullmatch(r'[A-Za-z0-9_.]+', method):
              raise SystemExit('buildMethod is required and must be a fully qualified Unity static method')
          if not (pathlib.Path(project) / 'ProjectSettings' / 'ProjectVersion.txt').is_file():
              raise SystemExit(f'not a Unity project: {project}')
          PY
          echo "request_file=$request_file" >> "$GITHUB_OUTPUT"

      - name: Probe local PC runner, otherwise choose cloud
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$GITHUB_OUTPUT" <<'PY'
          import datetime as dt, json, os, sys, time, urllib.request

          output = sys.argv[1]

          if os.environ.get('JAEWOON_LOCAL_RUNNER_ENABLED', '').lower() != 'true':
              target = 'cloud'
              age = -1
              reason = 'local-route-locked'
              print(f'[ROUTE] target={target} reason={reason} heartbeat_age_seconds={age}')
              with open(output, 'a', encoding='utf-8') as f:
                  f.write(f'target={target}\n')
                  f.write(f'heartbeat_age_seconds={age}\n')
                  f.write(f'route_reason={reason}\n')
              raise SystemExit(0)

          repo = os.environ['GH_REPOSITORY']
          token = os.environ['GH_TOKEN']
          api = f'https://api.github.com/repos/{repo}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'jaewoon-unity-hybrid-router'
          }

          def request(url, method='GET', data=None):
              body = None if data is None else json.dumps(data).encode('utf-8')
              req = urllib.request.Request(url, data=body, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=20) as res:
                  raw = res.read()
                  return json.loads(raw) if raw else None

          workflow_api = f'{api}/actions/workflows/unity-local-runner-heartbeat.yml'
          target = 'cloud'
          age = -1
          reason = 'fresh-heartbeat-not-received'

          try:
              before_payload = request(f'{workflow_api}/runs?branch=main&event=workflow_dispatch&per_page=10') or {}
              before_ids = [int(run.get('id', 0)) for run in before_payload.get('workflow_runs', [])]
              baseline_id = max(before_ids, default=0)
              dispatch_time = dt.datetime.now(dt.timezone.utc)
              request(f'{workflow_api}/dispatches', 'POST', {'ref':'main'})
              print(f'[INFO] Requested fresh local-runner heartbeat after run id {baseline_id}.')
          except Exception as exc:
              baseline_id = 0
              dispatch_time = dt.datetime.now(dt.timezone.utc)
              reason = 'heartbeat-dispatch-failed'
              print(f'[WARN] Could not dispatch heartbeat: {exc}')

          deadline = time.time() + 90
          fresh_run_id = 0
          while reason != 'heartbeat-dispatch-failed' and time.time() < deadline:
              try:
                  payload = request(f'{workflow_api}/runs?branch=main&event=workflow_dispatch&per_page=10') or {}
                  fresh_runs = []
                  for run in payload.get('workflow_runs', []):
                      run_id = int(run.get('id', 0))
                      if run_id <= baseline_id:
                          continue
                      created = run.get('created_at')
                      if created:
                          created_at = dt.datetime.fromisoformat(created.replace('Z', '+00:00'))
                          if created_at < dispatch_time - dt.timedelta(seconds=5):
                              continue
                      fresh_runs.append(run)

                  if fresh_runs:
                      run = max(fresh_runs, key=lambda item: int(item.get('id', 0)))
                      fresh_run_id = int(run.get('id', 0))
                      status = run.get('status')
                      conclusion = run.get('conclusion')
                      print(f'[INFO] Fresh heartbeat run={fresh_run_id} status={status} conclusion={conclusion}')
                      if status == 'completed':
                          if conclusion == 'success':
                              target = 'local'
                              reason = 'fresh-heartbeat-success'
                              stamp = run.get('updated_at') or run.get('created_at')
                              if stamp:
                                  when = dt.datetime.fromisoformat(stamp.replace('Z', '+00:00'))
                                  age = max(0, int((dt.datetime.now(dt.timezone.utc) - when).total_seconds()))
                          else:
                              reason = f'fresh-heartbeat-{conclusion or "failed"}'
                          break
              except Exception as exc:
                  print(f'[WARN] Heartbeat lookup failed: {exc}')
              time.sleep(5)

          if target != 'local' and reason == 'fresh-heartbeat-not-received':
              reason = 'fresh-heartbeat-timeout'

          print(f'[ROUTE] target={target} reason={reason} heartbeat_run_id={fresh_run_id} heartbeat_age_seconds={age}')
          with open(output, 'a', encoding='utf-8') as f:
              f.write(f'target={target}\n')
              f.write(f'heartbeat_age_seconds={age}\n')
              f.write(f'route_reason={reason}\n')
          PY

      - name: Route summary
        shell: bash
        run: |
          echo "Build request: ${{ steps.request.outputs.request_file }}"
          echo "Selected route: ${{ steps.probe.outputs.target }}"
          echo "Route reason: ${{ steps.probe.outputs.route_reason }}"
          echo "Fresh local heartbeat age: ${{ steps.probe.outputs.heartbeat_age_seconds }} seconds"

  local:
    needs: route
    if: needs.route.outputs.target == 'local'
    uses: ./.github/workflows/unity-local-pc-android.yml
    with:
      request_file: ${{ needs.route.outputs.request_file }}
    secrets: inherit

  cloud:
    needs: route
    if: needs.route.outputs.target != 'local'
    uses: ./.github/workflows/unity-cloud-android-test.yml
    with:
      request_file: ${{ needs.route.outputs.request_file }}
    secrets: inherit
