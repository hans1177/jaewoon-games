name: TMP Fix Schema14 Regression

on:
  push:
    branches: [feat/adaptive-parallel-20-policy-final]
    paths:
      - '.github/workflows/tmp-fix-schema14-regression.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/adaptive-parallel-20-policy-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch stale schema assertion only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const file='qa/company-web-real-game-regression.test.mjs';
          let text=fs.readFileSync(file,'utf8');
          const from="assert.equal(WEB_VALIDATION_SCHEMA_VERSION,13,'Web evidence schema must carry staged-play semantics');";
          const to="assert.equal(WEB_VALIDATION_SCHEMA_VERSION,14,'Web evidence schema must match the canonical schema14 runtime contract');";
          if(!text.includes(from)) throw new Error('SCHEMA13_ASSERTION_NOT_FOUND');
          text=text.replace(from,to);
          fs.writeFileSync(file,text,'utf8');
          NODE
          node --check qa/company-web-real-game-regression.test.mjs
          node qa/company-web-real-game-regression.test.mjs
      - name: Commit exact regression fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-vibe2-migration'
          git config user.email 'vibe2-migration@users.noreply.github.com'
          git add qa/company-web-real-game-regression.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'qa: align real-game regression with schema14'
          git push origin HEAD:feat/adaptive-parallel-20-policy-final
