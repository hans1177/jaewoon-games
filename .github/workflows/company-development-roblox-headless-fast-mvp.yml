name: Company DEVELOPMENT_CONFIRMED Roblox F0 Source Preflight
run-name: Roblox F0 · ${{ inputs.game_id || 'batch' }}

on:
  push:
    branches: [main]
    paths:
      - 'roblox-games/.company-runtime-trigger'
  workflow_dispatch:
    inputs:
      game_id:
        description: Optional exact gameId. Empty means all pending F0 candidates.
        required: false
        type: string

permissions:
  contents: write
  actions: write

env:
  COMPANY_RUNTIME_BRANCH: company-runtime

jobs:
  plan:
    concurrency:
      group: roblox-f0-plan-${{ inputs.game_id || 'batch' }}
      cancel-in-progress: true
    runs-on: ubuntu-slim
    outputs:
      count: ${{ steps.targets.outputs.count || '0' }}
      matrix: ${{ steps.targets.outputs.matrix || '{"include":[]}' }}
      targets_json: ${{ steps.targets.outputs.targets_json || '[]' }}
    steps:
      - name: Reject superseded F0 planner
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_GAME_ID: ${{ inputs.game_id || '' }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/company-development-roblox-headless-fast-mvp.yml/runs?per_page=100")"
          winner="$(printf '%s' "$payload" | REQUESTED_GAME_ID="$REQUESTED_GAME_ID" node -e "
            let body='';process.stdin.on('data',c=>body+=c).on('end',()=>{
              const payload=JSON.parse(body);
              const active=new Set(['queued','pending','in_progress','requested']);
              const requested=String(process.env.REQUESTED_GAME_ID||'').trim();
              const currentSha=String(process.env.GITHUB_SHA||'').trim();
              const title='Roblox F0 · '+(requested||'batch');
              const ids=(payload.workflow_runs||[])
                .filter(run=>active.has(String(run.status||'').toLowerCase())&&String(run.display_title||'')===title&&String(run.head_sha||'')===currentSha)
                .map(run=>Number(run.id))
                .filter(Number.isFinite)
                .sort((a,b)=>a-b);
              if(!ids.length){process.stdout.write('');return;}
              process.stdout.write(String(requested?ids[0]:ids[ids.length-1]));
            });
          ")"
          echo "ROBLOX_F0_PLAN_CONTROL_SHA=$GITHUB_SHA"
          echo "ROBLOX_F0_PLAN_ACTIVE_WINNER=${winner:-NONE}"
          if [ -n "$winner" ] && [ "$winner" != "$GITHUB_RUN_ID" ]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            if [ -n "$REQUESTED_GAME_ID" ]; then
              echo "ROBLOX_F0_PLAN_EXACT_DEDUPED=$REQUESTED_GAME_ID:$GITHUB_RUN_ID:$winner"
            else
              echo "ROBLOX_F0_PLAN_BATCH_DEDUPED_NEWER=$GITHUB_RUN_ID:$winner"
            fi
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo "ROBLOX_F0_PLAN_DEDUPE_PASS=${REQUESTED_GAME_ID:-BATCH}:$GITHUB_RUN_ID"
          fi
      - uses: actions/checkout@v4
        if: steps.freshness.outputs.run == 'true'
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        if: steps.freshness.outputs.run == 'true'
        with:
          node-version: '22'
      - if: steps.freshness.outputs.run == 'true'
        run: node --test qa/company-development-roblox-headless-fast-mvp.test.mjs
      - name: Fetch runtime queue
        if: steps.freshness.outputs.run == 'true'
        run: |
          git fetch --no-tags origin "$COMPANY_RUNTIME_BRANCH"
          git show "origin/$COMPANY_RUNTIME_BRANCH:development-queue.json" > /tmp/development-queue.json
      - id: targets
        if: steps.freshness.outputs.run == 'true'
        env:
          REQUESTED_GAME_ID: ${{ inputs.game_id || '' }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const q=JSON.parse(fs.readFileSync('/tmp/development-queue.json','utf8'));
          const roadmap=JSON.parse(fs.readFileSync('company-learning/platform-release-roadmap.json','utf8'));
          const canonicalRobloxValidationMode=String(roadmap.roblox?.validationMode||'').trim();
          if(canonicalRobloxValidationMode!=='HEADLESS_FAST_MVP')throw new Error('ROBLOX_F0_CANONICAL_VALIDATION_MODE_INVALID:'+canonicalRobloxValidationMode);
          let requested=String(process.env.REQUESTED_GAME_ID||'').trim();
          if(!requested&&process.env.EVENT_NAME==='push'&&fs.existsSync('roblox-games/.company-runtime-trigger')){
            requested=String(fs.readFileSync('roblox-games/.company-runtime-trigger','utf8').match(/^gameId:\s*([^\s]+)\s*$/m)?.[1]||'').trim();
          }
          if(requested&&!/^[a-z0-9][a-z0-9-]{1,48}$/.test(requested))throw new Error('ROBLOX_F0_REQUESTED_GAME_ID_INVALID:'+requested);
          const rows=[];
          for(const item of q.items||[]){
            if(rows.length>=256)break;
            if(requested&&item.gameId!==requested)continue;
            if(String(item.status||'').toUpperCase()!=='ACTIVE')continue;
            if(String(item.productionClass||'').toUpperCase()!=='DEVELOPMENT_CONFIRMED')continue;
            const revision=String(item.robloxSourceCommit||'');
            const artifact=String(item.robloxBuildArtifactIdentity||'');
            const current3dF0=item.robloxFoundationF0Passed===true
              &&Number(item.robloxFoundationF0Evidence?.version||0)>=6
              &&item.robloxFoundationF0Evidence?.native3dSourcePreflight?.worldGeometry===true
              &&item.robloxFoundationF0Evidence?.native3dSourcePreflight?.characterAndCamera===true;
            if(item.robloxBuildOrPackagePassed!==true||item.robloxBuildPreflightPassed!==true||current3dF0)continue;
            if(item.robloxBuildSourceRevision!==revision||!/^[0-9a-f]{40}$/i.test(revision)||!/^sha256:[0-9a-f]{64}$/i.test(artifact))continue;
            rows.push({gameId:item.gameId,sourcePath:item.robloxProjectPath||item.targetSourcePath||('roblox-games/'+item.gameId),sourceRevision:revision,artifactIdentity:artifact,baseline:item.designBaselineSource});
          }
          if(requested&&rows.length===0)console.log('ROBLOX_F0_REQUESTED_TARGET_DEFERRED='+requested);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'count='+rows.length+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'matrix='+JSON.stringify({include:rows})+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'targets_json='+JSON.stringify(rows)+'\n');
          console.log('ROBLOX_F0_PREFLIGHT_TARGETS='+rows.map(x=>x.gameId).join(','));
          console.log('ROBLOX_F0_CANONICAL_VALIDATION_MODE='+canonicalRobloxValidationMode);
          console.log('ROBLOX_F0_PARALLELISM=EXTERNAL_PROVIDER_CAPACITY_ONLY');
          console.log('ROBLOX_F0_CHECKOUT_MODE=PER_GAME_MATRIX_PARALLEL');
          NODE

  validate:
    needs: plan
    if: needs.plan.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # Exact F0 work identity only. Unrelated games and newer source/artifact identities remain fully parallel.
    concurrency:
      group: roblox-f0-validate-${{ matrix.gameId }}-${{ matrix.sourceRevision }}-${{ matrix.artifactIdentity }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch exact source and runtime
        run: |
          git fetch --no-tags origin "$COMPANY_RUNTIME_BRANCH" main
          git fetch --no-tags origin "${{ matrix.sourceRevision }}"
      - name: Install pinned Rojo
        run: |
          mkdir -p /tmp/rojo-bin
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip
          echo '22503e5839864f9d7c2171c48b536fc229f2cc4d8774c9cc149f60941d864073  /tmp/rojo.zip' | sha256sum -c -
          unzip -q /tmp/rojo.zip -d /tmp/rojo-bin
          chmod +x /tmp/rojo-bin/rojo
      - name: Install pinned official Luau compiler
        run: |
          set -euo pipefail
          rm -rf /tmp/luau-bin /tmp/luau.zip
          mkdir -p /tmp/luau-bin
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/luau.zip https://github.com/luau-lang/luau/releases/download/0.739/luau-ubuntu.zip
          echo '8a9b4b381021722c82d6e6cda0964b5c9e7f354ec1035fcd8b657acc22e49247  /tmp/luau.zip' | sha256sum -c -
          unzip -q /tmp/luau.zip -d /tmp/luau-bin
          test -x /tmp/luau-bin/luau-compile || chmod +x /tmp/luau-bin/luau-compile
          test -x /tmp/luau-bin/luau-compile
          echo 'ROBLOX_F0_LUAU_COMPILER=0.739'
      - name: Rebuild exact artifact and F0 source preflight
        env:
          GAME_ID: ${{ matrix.gameId }}
          SOURCE_PATH: ${{ matrix.sourcePath }}
          SOURCE_REVISION: ${{ matrix.sourceRevision }}
          EXPECTED_ARTIFACT: ${{ matrix.artifactIdentity }}
          BASELINE: ${{ matrix.baseline }}
        run: |
          set -euo pipefail
          safe="$(printf '%s' "$GAME_ID" | tr -cs 'A-Za-z0-9._-' '-')"
          mkdir -p /tmp/headless/packages /tmp/headless/results /tmp/headless/input
          git show "origin/$COMPANY_RUNTIME_BRANCH:$BASELINE" > /tmp/headless/input/baseline.json
          rm -rf /tmp/luau-exact-source
          mkdir -p /tmp/luau-exact-source
          git archive "$SOURCE_REVISION" "$SOURCE_PATH" | tar -x -C /tmp/luau-exact-source
          mapfile -d '' luau_files < <(find "/tmp/luau-exact-source/$SOURCE_PATH" -type f -name '*.luau' -print0 | sort -z)
          [ "${#luau_files[@]}" -gt 0 ]
          for file in "${luau_files[@]}"; do
            /tmp/luau-bin/luau-compile "$file" >/dev/null
          done
          echo "ROBLOX_F0_LUAU_COMPILE_PASS=${#luau_files[@]}"
          node tools/company-development-roblox-package.mjs --repo-root=. --game-id="$GAME_ID" --source-path="$SOURCE_PATH" --source-revision="$SOURCE_REVISION" --baseline=/tmp/headless/input/baseline.json --rojo=/tmp/rojo-bin/rojo --output-dir=/tmp/headless/packages --evidence=/tmp/headless/results/build.json
          rebuilt="$(node -e "const e=require('/tmp/headless/results/build.json');process.stdout.write(e.artifactIdentity)")"
          [ "$rebuilt" = "$EXPECTED_ARTIFACT" ]
          node tools/company-development-roblox-headless-fast-mvp.mjs --repo-root=. --game-id="$GAME_ID" --source-path="$SOURCE_PATH" --source-revision="$SOURCE_REVISION" --artifact-identity="$EXPECTED_ARTIFACT" --rebuilt-artifact-identity="$rebuilt" --artifact-run-id="$GITHUB_RUN_ID" --native-language-compile-passed=true --native-compiler-version=0.739 --output="/tmp/headless/results/$safe.headless.json"
      - uses: actions/upload-artifact@v4
        id: package_artifact
        with:
          name: development-roblox-package-${{ matrix.gameId }}
          path: /tmp/headless/packages
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: development-roblox-f0-${{ matrix.gameId }}
          path: /tmp/headless/results/*.headless.json
          retention-days: 7
          if-no-files-found: warn
      - name: Persist this game's F0 result immediately
        id: persist
        if: always()
        env:
          GAME_ID: ${{ matrix.gameId }}
          SOURCE_REVISION: ${{ matrix.sourceRevision }}
          EXPECTED_ARTIFACT: ${{ matrix.artifactIdentity }}
          PACKAGE_ARTIFACT_READY: ${{ steps.package_artifact.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          safe="$(printf '%s' "$GAME_ID" | tr -cs 'A-Za-z0-9._-' '-')"
          evidence="/tmp/headless/results/$safe.headless.json"
          runtime_root="/tmp/company-runtime-f0-$safe"
          rm -rf "$runtime_root"
          git fetch --no-tags origin "+refs/heads/$COMPANY_RUNTIME_BRANCH:refs/remotes/origin/$COMPANY_RUNTIME_BRANCH"
          git worktree add --detach "$runtime_root" "origin/$COMPANY_RUNTIME_BRANCH"
          trap 'git worktree remove --force "'"$runtime_root"'" >/dev/null 2>&1 || true' EXIT
          cd "$runtime_root"
          git config user.name 'jaewoon-roblox-headless'
          git config user.email 'actions@users.noreply.github.com'
          persisted=0
          for attempt in 1 2 3 4 5; do
            echo "ROBLOX_F0_PERSIST_OPTIMISTIC_ATTEMPT=$attempt/5:$GAME_ID"
            git fetch --no-tags origin "+refs/heads/$COMPANY_RUNTIME_BRANCH:refs/remotes/origin/$COMPANY_RUNTIME_BRANCH"
            git reset --hard "origin/$COMPANY_RUNTIME_BRANCH"
            GAME_ID="$GAME_ID" SOURCE_REVISION="$SOURCE_REVISION" EXPECTED_ARTIFACT="$EXPECTED_ARTIFACT" EVIDENCE_FILE="$evidence" node <<'NODE'
          const fs=require('fs');
          const q=JSON.parse(fs.readFileSync('development-queue.json','utf8'));
          const gameId=String(process.env.GAME_ID||'').trim();
          const targetSourceRevision=String(process.env.SOURCE_REVISION||'').trim();
          const targetArtifactIdentity=String(process.env.EXPECTED_ARTIFACT||'').trim();
          const item=(q.items||[]).find(x=>x.gameId===gameId);
          const result={gameId,exact:false,stale:false,sourceRevision:targetSourceRevision,artifactIdentity:targetArtifactIdentity};
          if(!item){
            result.stale=true;
            fs.writeFileSync('/tmp/roblox-f0-persist-result.json',JSON.stringify(result));
            console.log('ROBLOX_F0_STALE_RESULT_IGNORED='+gameId+':QUEUE_ITEM_MISSING');
            process.exit(0);
          }
          const currentSourceRevision=String(item.robloxSourceCommit||'').trim();
          const currentArtifactIdentity=String(item.robloxBuildArtifactIdentity||'').trim();
          if(currentSourceRevision!==targetSourceRevision||currentArtifactIdentity!==targetArtifactIdentity){
            result.stale=true;
            fs.writeFileSync('/tmp/roblox-f0-persist-result.json',JSON.stringify(result));
            console.log('ROBLOX_F0_STALE_RESULT_IGNORED='+gameId);
            process.exit(0);
          }
          let e=null;
          try{
            if(process.env.EVIDENCE_FILE&&fs.existsSync(process.env.EVIDENCE_FILE))e=JSON.parse(fs.readFileSync(process.env.EVIDENCE_FILE,'utf8'));
          }catch(error){
            console.log('ROBLOX_F0_EVIDENCE_READ_FAILED='+gameId+':'+String(error?.message||error).slice(0,200));
          }
          const prior=item.robloxFoundationF0Evidence||{};
          if(item.robloxFoundationF0Passed===true&&prior.pass===true
            &&Number(prior.version||0)>=6&&prior.native3dSourcePreflight?.worldGeometry===true
            &&prior.native3dSourcePreflight?.characterAndCamera===true
            &&prior.gameId===gameId&&prior.sourceRevision===currentSourceRevision
            &&prior.artifactIdentity===currentArtifactIdentity&&Number(prior.artifactRunId)>0
            &&Number(prior.artifactRunId)>=Number(process.env.GITHUB_RUN_ID)){
            console.log('ROBLOX_F0_EXACT_EVIDENCE_REUSED='+gameId);
            process.exit(0);
          }
          const exact=process.env.PACKAGE_ARTIFACT_READY==='true'
            &&e?.pass===true&&Number(e.version||0)>=6
            &&e.native3dSourcePreflight?.worldGeometry===true
            &&e.native3dSourcePreflight?.characterAndCamera===true
            &&e.gameId===gameId&&Number(e.artifactRunId)>0
            &&e.sourceRevision===currentSourceRevision&&e.artifactIdentity===currentArtifactIdentity;
          const stamp=new Date().toISOString();
          item.robloxFoundationF0Passed=exact;
          item.robloxFoundationF0Evidence=exact?e:null;
          item.robloxFoundationF0PassedAt=exact?stamp:null;
          item.robloxHeadlessFastMvpPassed=exact;
          item.robloxHeadlessFastMvpEvidence=exact?e:null;
          item.robloxHeadlessFinalReviewPassed=false;
          item.robloxExactRevisionPassed=exact;
          item.robloxRuntimePassed=false;
          item.robloxRuntimeFoundationPassed=false;
          item.robloxInternalReleaseReady=false;
          item.updatedAt=stamp;
          if(exact){
            item.currentStep='PRIVATE_RUNTIME_CANDIDATE_DEPLOY';
            item.canonicalState='F0_SOURCE_PREFLIGHT_PASSED';
            item.robloxFailureStage='PRIVATE_RUNTIME_CANDIDATE_DEPLOY';
            item.robloxFailureSignature='ROBLOX_RUNTIME_CANDIDATE_DEPLOY_PENDING';
            item.routingBlockers=['roblox-runtime-candidate-deploy-pending'];
          }else{
            item.currentStep='ROBLOX_F0_SOURCE_PREFLIGHT';
            item.canonicalState='F0_SOURCE_PREFLIGHT_REPAIR_REQUIRED';
            item.robloxFailureStage='F0_SOURCE_INTEGRITY';
            item.robloxFailureSignature='ROBLOX_F0_SOURCE_PREFLIGHT_FAILED';
            item.routingBlockers=['roblox-f0-source-preflight-failed'];
          }
          q.updatedAt=stamp;
          fs.writeFileSync('development-queue.json',JSON.stringify(q,null,2)+'\n');
          result.exact=exact;
          fs.writeFileSync('/tmp/roblox-f0-persist-result.json',JSON.stringify(result));
          NODE
            git add development-queue.json
            git diff --cached --check
            if git diff --cached --quiet; then
              persisted=1
              echo "ROBLOX_F0_PERSIST_WRITE=NO_CHANGE:$GAME_ID"
              break
            fi
            git commit -m "runtime: persist Roblox F0 source preflight $GAME_ID [skip ci]"
            if git push origin HEAD:"$COMPANY_RUNTIME_BRANCH"; then
              persisted=1
              echo "ROBLOX_F0_PERSIST_WRITE=PUSHED:$GAME_ID"
              break
            fi
            echo "ROBLOX_F0_PERSIST_CONFLICT_RETRY=$attempt:$GAME_ID"
            sleep $((attempt*2))
          done
          test "$persisted" = '1'
          echo "ROBLOX_F0_PER_GAME_PERSIST=PASS:$GAME_ID"
      - name: Dispatch exact private Roblox validation directly after this game's F0 persist
        if: ${{ success() && steps.persist.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_ID: ${{ matrix.gameId }}
          SOURCE_REVISION: ${{ matrix.sourceRevision }}
          EXPECTED_ARTIFACT: ${{ matrix.artifactIdentity }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/$COMPANY_RUNTIME_BRANCH:refs/remotes/origin/$COMPANY_RUNTIME_BRANCH"
          git show "origin/$COMPANY_RUNTIME_BRANCH:development-queue.json" > /tmp/q.json
          ready="$(GAME_ID="$GAME_ID" node - <<'NODE'
          const fs=require('fs');
          const q=JSON.parse(fs.readFileSync('/tmp/q.json','utf8'));
          const id=String(process.env.GAME_ID||'').trim();
          const x=(q.items||[]).find(row=>row.gameId===id);
          if(!x){process.stdout.write('0');process.exit(0);}
          const revision=String(x.robloxSourceCommit||'').trim();
          const artifact=String(x.robloxBuildArtifactIdentity||'').trim();
          const f0=x.robloxFoundationF0Evidence||{};
          const exact=
            revision===String(process.env.SOURCE_REVISION||'').trim()
            &&artifact===String(process.env.EXPECTED_ARTIFACT||'').trim()
            &&x.robloxFoundationF0Passed===true
            &&x.robloxBuildPreflightPassed===true
            &&x.robloxBuildOrPackagePassed===true
            &&x.robloxBuildSourceRevision===revision
            &&Number(f0.version||0)>=6
            &&f0.native3dSourcePreflight?.worldGeometry===true
            &&f0.native3dSourcePreflight?.characterAndCamera===true
            &&f0.sourceRevision===revision
            &&f0.artifactIdentity===artifact
            &&Number(f0.artifactRunId||0)>0;
          const candidate=x.robloxRuntimeCandidateEvidence||{};
          const exactPublished=
            candidate.published===true
            &&candidate.sourceRevision===revision
            &&candidate.artifactIdentity===artifact
            &&Number(candidate.versionNumber||0)>0;
          const blocked=x.robloxQualityBuildUpRequired===true&&String(x.robloxQualityBuildUpSourceRevision||'').trim()===revision;
          process.stdout.write(exact&&!exactPublished&&!blocked?'1':'0');
          NODE
          )"
          if [ "$ready" != '1' ]; then
            echo 'ROBLOX_F0_PRIVATE_VALIDATION_CANDIDATE_COUNT=0'
            echo 'ROBLOX_F0_PRIVATE_VALIDATION_DISPATCH_COUNT=0'
            echo 'ROBLOX_F0_PRIVATE_VALIDATION_DEDUPED_COUNT=0'
            echo "ROBLOX_F0_PRIVATE_VALIDATION_HANDOFF=NOT_READY:$GAME_ID"
            echo 'ROBLOX_F0_PRIVATE_VALIDATION_TARGET=DEDICATED_NONCANONICAL'
            echo 'ROBLOX_STUDIO_REQUIRED_FOR_F0_CONTINUATION=NO'
            exit 0
          fi

          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/company-development-roblox-release-promotion.yml/runs?per_page=100" > /tmp/roblox-f0-validation-active-runs.json
          active="$(GAME_ID="$GAME_ID" node - <<'NODE'
          const fs=require('fs');
          const payload=JSON.parse(fs.readFileSync('/tmp/roblox-f0-validation-active-runs.json','utf8'));
          const states=new Set(['queued','pending','in_progress','requested']);
          const currentSha=String(process.env.GITHUB_SHA||'').trim();
          const title='Roblox publish · '+String(process.env.GAME_ID||'')+' · validation';
          const found=(payload.workflow_runs||[]).some(run=>
            states.has(String(run.status||'').toLowerCase())
            &&String(run.head_sha||'')===currentSha
            &&String(run.display_title||'')===title
          );
          process.stdout.write(found?'1':'0');
          NODE
          )"
          if [ "$active" = '1' ]; then
            echo "ROBLOX_F0_PRIVATE_VALIDATION_HANDOFF=DEDUPED_CURRENT_MAIN:$GAME_ID:$GITHUB_SHA"
            echo 'ROBLOX_F0_PRIVATE_VALIDATION_CANDIDATE_COUNT=1'
            echo 'ROBLOX_F0_PRIVATE_VALIDATION_DISPATCH_COUNT=0'
            echo 'ROBLOX_F0_PRIVATE_VALIDATION_DEDUPED_COUNT=1'
          else
            gh workflow run company-development-roblox-release-promotion.yml --repo "$GITHUB_REPOSITORY" --ref main -f game_id="$GAME_ID" -f publish_stage=validation
            echo "ROBLOX_F0_PRIVATE_VALIDATION_HANDOFF=DISPATCHED:$GAME_ID"
            echo 'ROBLOX_F0_PRIVATE_VALIDATION_CANDIDATE_COUNT=1'
            echo 'ROBLOX_F0_PRIVATE_VALIDATION_DISPATCH_COUNT=1'
            echo 'ROBLOX_F0_PRIVATE_VALIDATION_DEDUPED_COUNT=0'
          fi
          echo 'ROBLOX_F0_PRIVATE_VALIDATION_TARGET=DEDICATED_NONCANONICAL'
          echo 'ROBLOX_STUDIO_REQUIRED_FOR_F0_CONTINUATION=NO'
