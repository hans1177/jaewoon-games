name: Roblox Authenticated Runner Watchdog Removal

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/roblox-runner-self-heal.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roblox-authenticated-runner-watchdog-removal
  cancel-in-progress: true

jobs:
  remove:
    name: remove Roblox runner watchdog locally
    runs-on: [self-hosted, Windows, X64, roblox-studio-authenticated]
    timeout-minutes: 5
    steps:
      - name: Remove watchdog scheduled tasks and files
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $runnerRoot = 'C:\actions-runner'
          $taskNames = @(
            'Jaewoon-Roblox-GitHubRunner',
            'Jaewoon-Roblox-GitHubRunner-HiddenMigration'
          )

          foreach ($taskName in $taskNames) {
            $task = Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
            if ($task) {
              Stop-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
              Unregister-ScheduledTask -TaskName $taskName -Confirm:$false -ErrorAction Stop
              Write-Host "ROBLOX_WATCHDOG_TASK_REMOVED=$taskName"
            } else {
              Write-Host "ROBLOX_WATCHDOG_TASK_ALREADY_ABSENT=$taskName"
            }
          }

          foreach ($file in @(
            '.jaewoon-roblox-runner-watchdog.ps1',
            '.jaewoon-roblox-runner-hidden-migrate.ps1',
            '.jaewoon-roblox-runner-hidden-restart.pending',
            '.jaewoon-roblox-runner-hidden.vbs'
          )) {
            $target = Join-Path $runnerRoot $file
            if (Test-Path -LiteralPath $target) {
              Remove-Item -LiteralPath $target -Force -ErrorAction Stop
              Write-Host "ROBLOX_WATCHDOG_FILE_REMOVED=$target"
            }
          }

          $listener = @(Get-Process -Name 'Runner.Listener' -ErrorAction SilentlyContinue)
          Write-Host "ROBLOX_RUNNER_LISTENER_LEFT_RUNNING=$($listener.Count)"
          Write-Host 'ROBLOX_WATCHDOG_REMOVED=YES'
          Write-Host 'ROBLOX_RUNNER_PROCESS_STOPPED=NO'
