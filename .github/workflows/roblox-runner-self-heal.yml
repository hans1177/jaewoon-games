name: Roblox Authenticated Runner Self-Heal

on:
  push:
    branches: [main]
    paths:
      - 'tools/setup-roblox-runner-autostart.ps1'
      - 'tools/install-roblox-runner-watchdog.cmd'
      - 'qa/setup-roblox-runner-autostart.test.mjs'
      - '.github/workflows/roblox-runner-self-heal.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: roblox-authenticated-runner-self-heal
  cancel-in-progress: true

jobs:
  contract:
    name: verify Roblox runner self-heal contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Force-cancel stale Actions runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          for run_id in 36946411892 34748574272 36802981975 36802982062 36803420019; do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status' 2>/dev/null || echo unknown)"
            case "$status" in
              queued|pending|requested|waiting|in_progress)
                if gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/force-cancel" >/dev/null 2>&1; then
                  echo "STALE_FORCE_CANCELLED=${run_id}:${status}"
                else
                  echo "STALE_FORCE_CANCEL_FAILED=${run_id}:${status}"
                fi
                ;;
              *)
                echo "STALE_ALREADY_TERMINAL=${run_id}:${status}"
                ;;
            esac
          done
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          fetch-tags: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify self-heal contract
        run: node --test qa/setup-roblox-runner-autostart.test.mjs

  apply:
    name: apply Roblox runner self-heal locally
    needs: contract
    runs-on: [self-hosted, Windows, X64, roblox-studio-authenticated]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          fetch-tags: false
      - name: Verify exact local runner identity
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $runnerRoot = 'C:\actions-runner'
          $metadata = Get-Content (Join-Path $runnerRoot '.runner') -Raw | ConvertFrom-Json
          if ([string]$metadata.agentName -ne 'roblox-studio-local') {
            throw "Refusing self-heal on unexpected runner: $($metadata.agentName)"
          }
          Write-Host 'ROBLOX_RUNNER_SELF_HEAL_IDENTITY=PASS'
      - name: Install persistent interactive self-heal
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tools\setup-roblox-runner-autostart.ps1 `
            -RunnerPath 'C:\actions-runner' `
            -ExpectedRunnerName 'roblox-studio-local' `
            -HealthCheckMinutes 1
          Write-Host 'ROBLOX_RUNNER_SELF_HEAL_APPLIED=YES'
          Write-Host 'ROBLOX_RUNNER_MANUAL_LOCAL_ACTION_REQUIRED=NO'
