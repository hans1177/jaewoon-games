name: Autonomous Play Impact QA

on:
  pull_request:
    paths:
      - '.github/workflows/autonomous-candidate-promotion.yml'
      - '.github/workflows/autonomous-play-impact-qa.yml'
      - 'tools/autonomous-play-impact.mjs'
      - 'tools/autonomous-24h-work-planner.mjs'
      - 'tools/director-supervisor.mjs'
      - 'qa/autonomous-play-impact.test.mjs'
      - 'qa/autonomous-impact-priority.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/autonomous-candidate-promotion.yml'
      - '.github/workflows/autonomous-play-impact-qa.yml'
      - 'tools/autonomous-play-impact.mjs'
      - 'tools/autonomous-24h-work-planner.mjs'
      - 'tools/director-supervisor.mjs'
      - 'qa/autonomous-play-impact.test.mjs'
      - 'qa/autonomous-impact-priority.test.mjs'

permissions:
  contents: read

jobs:
  deterministic-impact-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and deterministic impact tests
        run: |
          set -euo pipefail
          node --check tools/autonomous-play-impact.mjs
          node --check tools/autonomous-24h-work-planner.mjs
          node --check tools/director-supervisor.mjs
          node --test qa/autonomous-play-impact.test.mjs
          node --test qa/autonomous-impact-priority.test.mjs
          node --test qa/autonomous-24h-work-planner.test.mjs
          echo 'AUTONOMOUS_PLAY_IMPACT_QA=PASS'
          echo 'FIRST_UNOBSERVED_IMPACT_PENALTY=NO'
          echo 'SECOND_CONSECUTIVE_UNOBSERVED_IMPACT_PENALTY=YES'
