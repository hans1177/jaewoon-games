name: Scene Flow Test

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test scene flow and session integration
        run: |
          rm -rf /tmp/jaewoon-scene
          mkdir -p /tmp/jaewoon-scene
          cp assets/scene-flow.js assets/game-session.js assets/input-actions.js assets/game-loop.js assets/vibe-runtime.js assets/game-blueprint.js assets/game-presets.js assets/game-kit.js assets/d20-rules.js assets/turn-combat.js assets/character-progression.js assets/inventory-equipment.js assets/quest-dialogue.js assets/skill-effects.js assets/economy-loot-shop.js assets/save-versioning.js /tmp/jaewoon-scene/
          printf '{"type":"module"}\n' > /tmp/jaewoon-scene/package.json
          cd /tmp/jaewoon-scene
          node --check scene-flow.js
          node --check game-session.js
          node --input-type=module <<'NODE'
          import { JaewoonSceneFlow } from './scene-flow.js';
          import { createGameSession } from './game-session.js';
          import { buildGamePreset } from './game-presets.js';

          let entered = 0;
          let restoredValue = 0;
          const flow = new JaewoonSceneFlow({ scenes: {
            menu: { enter: () => { entered += 1; } },
            field: {
              snapshot: () => ({ hp: 77 }),
              restore: (state) => { restoredValue = state.hp; },
            },
          }});
          flow.go('menu');
          flow.go('field', { area: 2 });
          if (flow.current !== 'field' || flow.history.length !== 1 || entered !== 1) throw new Error('scene transition failed');
          const cp = flow.checkpoint('camp');
          if (cp.sceneState.hp !== 77) throw new Error('checkpoint snapshot failed');
          flow.back();
          if (flow.current !== 'menu') throw new Error('scene back failed');
          flow.restoreCheckpoint('camp');
          if (flow.current !== 'field' || restoredValue !== 77) throw new Error('checkpoint restore failed');
          const snap = flow.snapshot();
          const flow2 = new JaewoonSceneFlow({ scenes: { menu: {}, field: {} } });
          if (!flow2.restore(snap) || flow2.current !== 'field') throw new Error('scene snapshot restore failed');

          const storage = new Map();
          globalThis.localStorage = {
            getItem: (key) => storage.has(key) ? storage.get(key) : null,
            setItem: (key, value) => storage.set(key, String(value)),
            removeItem: (key) => storage.delete(key),
          };
          const session = createGameSession({
            gameId: 'scene-session', genre: 'adventure', autoRestore: false,
            sceneOptions: { scenes: { village: {}, cave: {} } },
          });
          session.goToScene('village');
          session.goToScene('cave', { depth: 3 });
          session.checkpointScene('cave-start');
          session.save();
          const restored = createGameSession({
            gameId: 'scene-session', genre: 'adventure',
            sceneOptions: { scenes: { village: {}, cave: {} } },
          });
          if (restored.scenes.current !== 'cave' || restored.scenes.currentData.depth !== 3) throw new Error('session scene restore failed');
          restored.destroy();

          const preset = buildGamePreset({ genre: 'adventure' });
          if (!preset.systems.includes('scene-flow')) throw new Error('scene-flow missing from preset');
          if (!preset.qa.includes('scene-checkpoint')) throw new Error('scene checkpoint QA missing');
          console.log('PASS scene flow');
          NODE
