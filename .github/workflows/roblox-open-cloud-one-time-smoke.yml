name: Roblox Open Cloud One-Time Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/roblox-open-cloud-one-time-smoke.yml'

permissions:
  contents: read

concurrency:
  group: roblox-open-cloud-one-time-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: publish pinned test place once
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
      ROBLOX_UNIVERSE_ID: ${{ secrets.ROBLOX_UNIVERSE_ID }}
      ROBLOX_PLACE_ID: ${{ secrets.ROBLOX_PLACE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify owner-pinned test destination and secrets
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('company-learning/platform-release-roadmap.json','utf8'));
          const t=p?.roblox?.deploymentControl?.ownerPinnedPublicationTarget||{};
          const secretUniverse=String(process.env.ROBLOX_UNIVERSE_ID||'').trim();
          const secretPlace=String(process.env.ROBLOX_PLACE_ID||'').trim();
          if(t.enabled!==true)throw new Error('ROBLOX_SMOKE_PINNED_TARGET_DISABLED');
          if(t.purpose!=='OPEN_CLOUD_AUTOMATION_TEST_TARGET')throw new Error('ROBLOX_SMOKE_TARGET_PURPOSE_INVALID');
          if(!/^[1-9][0-9]*$/.test(secretUniverse)||!/^[1-9][0-9]*$/.test(secretPlace))throw new Error('ROBLOX_SMOKE_SECRET_IDS_INVALID');
          if(secretUniverse!==String(t.universeId)||secretPlace!==String(t.placeId))throw new Error('ROBLOX_SMOKE_SECRET_ID_MISMATCH');
          if(!String(process.env.ROBLOX_OPEN_CLOUD_API_KEY||'').trim())throw new Error('ROBLOX_SMOKE_API_KEY_MISSING');
          console.log('ROBLOX_SMOKE_PINNED_TARGET=PASS');
          console.log('ROBLOX_SMOKE_RELEASE_CLAIM=NO');
          NODE

      - name: Install pinned Rojo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rojo-bin
          curl -fsSL --retry 3 --retry-delay 2 \
            -o /tmp/rojo.zip \
            https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip
          echo '22503e5839864f9d7c2171c48b536fc229f2cc4d8774c9cc149f60941d864073  /tmp/rojo.zip' | sha256sum -c -
          unzip -q /tmp/rojo.zip -d /tmp/rojo-bin
          chmod +x /tmp/rojo-bin/rojo
          /tmp/rojo-bin/rojo --version

      - name: Build isolated smoke place
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/roblox-open-cloud-smoke
          rm -rf "$root"
          mkdir -p "$root"
          cp -R roblox-games/base/shared "$root/shared"
          cp -R roblox-games/base/server "$root/server"
          cp -R roblox-games/base/client "$root/client"
          cat > "$root/default.project.json" <<'JSON'
          {
            "name": "OpenCloudSmoke",
            "tree": {
              "$className": "DataModel",
              "ReplicatedStorage": {"Shared": {"$path": "shared"}},
              "ServerScriptService": {"GameServer": {"$path": "server"}},
              "StarterPlayer": {"StarterPlayerScripts": {"GameClient": {"$path": "client"}}}
            }
          }
          JSON
          /tmp/rojo-bin/rojo build "$root/default.project.json" --output /tmp/open-cloud-smoke.rbxlx
          test -s /tmp/open-cloud-smoke.rbxlx
          echo "ROBLOX_SMOKE_ARTIFACT_SHA256=$(sha256sum /tmp/open-cloud-smoke.rbxlx | awk '{print $1}')"
          echo 'ROBLOX_SMOKE_PRODUCTION_ARTIFACT=NO'

      - name: Publish isolated smoke place through official Open Cloud
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const apiKey=String(process.env.ROBLOX_OPEN_CLOUD_API_KEY||'').trim();
          const universe=String(process.env.ROBLOX_UNIVERSE_ID||'').trim();
          const place=String(process.env.ROBLOX_PLACE_ID||'').trim();
          const body=fs.readFileSync('/tmp/open-cloud-smoke.rbxlx');
          const endpoint=`https://apis.roblox.com/universes/v1/${universe}/places/${place}/versions?versionType=Published`;
          const waits=[0,30000,60000,120000];
          let last='';
          for(let attempt=0;attempt<waits.length;attempt++){
            if(waits[attempt])await new Promise(resolve=>setTimeout(resolve,waits[attempt]));
            const response=await fetch(endpoint,{
              method:'POST',
              headers:{'x-api-key':apiKey,'Content-Type':'application/xml'},
              body
            });
            const text=await response.text();
            let payload=null;
            try{payload=text?JSON.parse(text):null;}catch{payload={raw:text.slice(0,500)}}
            if(response.ok){
              const versionNumber=Number(payload?.versionNumber);
              if(!Number.isInteger(versionNumber)||versionNumber<=0)throw new Error('ROBLOX_SMOKE_VERSION_NUMBER_MISSING');
              fs.appendFileSync(process.env.GITHUB_OUTPUT,`version_number=${versionNumber}\n`);
              console.log(`ROBLOX_OPEN_CLOUD_SMOKE=PUBLISHED:${versionNumber}`);
              console.log('ROBLOX_SMOKE_RELEASE_CLAIM=NO');
              process.exit(0);
            }
            last=`HTTP ${response.status}: ${JSON.stringify(payload)}`;
            const transient=response.status===409||response.status===429;
            if(!transient||attempt===waits.length-1)throw new Error(`ROBLOX_OPEN_CLOUD_SMOKE_FAILED:${last}`);
            console.log(`ROBLOX_OPEN_CLOUD_SMOKE_RETRY=${response.status}:attempt-${attempt+1}`);
          }
          throw new Error(`ROBLOX_OPEN_CLOUD_SMOKE_FAILED:${last}`);
          NODE

      - name: Smoke summary
        env:
          VERSION_NUMBER: ${{ steps.publish.outputs.version_number }}
        run: |
          set -euo pipefail
          test -n "$VERSION_NUMBER"
          echo "ROBLOX_OPEN_CLOUD_SMOKE=PASS:$VERSION_NUMBER"
          echo 'ROBLOX_SMOKE_RUNTIME_STATE_MUTATION=NO'
          echo 'ROBLOX_SMOKE_RELEASE_CLAIM=NO'
