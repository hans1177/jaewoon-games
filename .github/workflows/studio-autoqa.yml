# 파일명: .github/workflows/studio-autoqa.yml
# [메인] 게임 변경·게시 완료 뒤 기존 공식 PC Studio 검사를 대항해시대만 요청한다.
# [배포 이벤트] 실행 이름(run-name)은 커밋별로 변하므로 변경되지 않는 워크플로 경로(path)로 판별한다.
# [개발 우선] 게임 소스 변경은 영향받은 실제 장면을 Studio에서 플레이·촬영한다.
# [전체 회귀] 게시 완료·수동 요청은 기존 정밀 QA를 유지하며 정식 배포 검증을 생략하지 않는다.
# [10분 감시] 같은 소스에서 이미 시도한 검사는 반복 예약하지 않고 미실행 소스만 복구한다.
# 결과 사진·리포트는 브랜치 <game>-studio-frames 에 올라가고, 클라우드 바이브가 읽고 고친다.
name: Studio Auto QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/studio-autoqa.yml'
      # [자동 재검증] Studio 실행기 또는 게임별 점검 스크립트 변경 시 기존 QA를 즉시 재실행한다.
      - '.github/workflows/devloop-studio.yml'
      # [무료 디자인 재검증] 실행기와 무료 모델 정책 변경도 기존 공식 Studio QA에 연결한다.
      - 'tools/company-nemotron-design-review.mjs'
      - 'company-learning/external-ai-distillation-policy.json'
      # [PC 복구] 메인에서 실행기 자동복구가 수정되면 기존 정확한 Studio QA를 대기열에 넣는다.
      - '.github/workflows/company-roblox-runner-pwsh-bootstrap.yml'
      - 'tools/move-roblox-studio-runner-to-e.ps1'
      - 'tools/company-development-roblox-studio-local-play.mjs'
      - 'tools/gen-qa-click-scripts.py'
      - 'roblox-games/mare-essentia/tools/devloop/studio-scripts/*.json'
      - 'roblox-games/mare-essentia/src/**'
      # Rojo 자산 폴더·빌드 트리 변경도 공식 Studio로 검증한다.
      - 'roblox-games/mare-essentia/default.project.json'
      # [자산 변경] 실제 자산·등록 ID·승인표 변경도 같은 Studio에서 검증한다.
      - 'roblox-games/mare-essentia/assets/**'
      - 'roblox-games/mare-essentia/audio/**'
      - 'roblox-games/mare-essentia/approved-assets.json'
      - 'roblox-games/mare-essentia/assets-registered.json'
      - 'roblox-games/mare-essentia/assets-wanted.json'
      - 'roblox-games/mare-essentia/assets-wanted.seed.json'
  # [정기 감시] 매 10분 최신 소스의 실검사 여부만 확인한다. 반복 순환 대신 개발 실행기를 비워 둔다.
  # 기존 push·게시 완료·수동 실행은 그대로 유지한다.
  schedule:
    - cron: '*/10 * * * *'
  workflow_run:
    workflows: ["Owner Mare Essentia Direct Publish"]
    types: [completed]
  workflow_dispatch:
    inputs:
      game:
        description: 대항해시대 (mare-essentia)
        required: false
        default: mare-essentia
        type: string
concurrency:
  # [동시 요청 차단] 푸시·게시·정기 이벤트 간 상태 조회와 실제 요청을 순서대로 처리한다.
  group: studio-autoqa-dispatch-mare-essentia
  cancel-in-progress: false
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    # [게시·Studio 독립 검증] 게시 403은 게시 실패로 남기되 게임 자체 Studio 검사는 요청한다.
    # Studio 종료 이벤트는 자신을 재발행하지 않고, 본래 게시 이벤트만 받는다.
    # 게시자의 run-name은 SHA를 포함해 변하므로 workflow_run.path로 정확히 판별한다.
    if: >-
      github.repository == 'hans1177/jaewoon-games' &&
      (github.event_name != 'schedule' || github.event.repository.private == false) &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.path == '.github/workflows/owner-mare-essentia-direct-publish.yml' &&
        (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Studio capture on owner PC
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_IN: ${{ inputs.game }}
        run: |
          set -euo pipefail
          game="${GAME_IN:-mare-essentia}"
          if [ "$game" != mare-essentia ]; then exit 0; fi
          # 이미 만들어진 마력숲 전용 캡처만 취소한다.
          stale=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/devloop-studio.yml/runs?per_page=100" --jq '
            .workflow_runs[] | select(.status != "completed") |
            select((.display_title // "") | contains(" · fantasy-survival ·")) | .id')
          while IFS= read -r id; do
            if [[ "$id" =~ ^[0-9]+$ ]]; then gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true; fi
          done <<< "$stale"
          if gh api "repos/$GITHUB_REPOSITORY/contents/qa-log/STOP" >/dev/null 2>&1; then echo "STOP file found"; exit 0; fi
          # [중복 제한] 같은 소스의 대기·실행 중 검사만 건너뛴다.
          head=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/devloop-studio.yml/runs?per_page=100")
          # [대기열 복구] 구버전의 대기 중인 마레 정밀검사만 취소한다. 실행 중인 검사는 그대로 둔다.
          # 최신 main 정밀검사 한 개를 유지해 반복 변경으로 인한 PC 검사 적체를 방지한다.
          stale_mare=$(printf '%s' "$runs" | jq -r --arg head "$head" --arg game "$game" '
            .workflow_runs[] | select(.head_sha != $head) |
            select(.status == "queued" or .status == "pending" or .status == "requested" or .status == "waiting") |
            select((.display_title // "") | contains(" · " + $game + " ·")) | .id' | head -20)
          if [ -n "$stale_mare" ]; then
            while IFS= read -r id; do
              if [[ "$id" =~ ^[0-9]+$ ]]; then
                gh run cancel "$id" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
                echo "STUDIO_STALE_QUEUED_CANCEL_REQUESTED=$id"
              fi
            done <<< "$stale_mare"
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/devloop-studio.yml/runs?per_page=100")
          fi
          pending=$(printf '%s' "$runs" | jq --arg head "$head" --arg game "$game" '[.workflow_runs[] |
            select(.head_sha == $head) |
            select(.status == "queued" or .status == "pending" or .status == "requested" or .status == "waiting" or .status == "in_progress") |
            select((.display_title // "") | contains(" · " + $game + " ·"))] | length')
          # [순환 중복 방지] 동일 게임 어느 버전이든 실행·대기 중이면 정기 검사는 추가 대기시키지 않는다.
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            busy=$(printf '%s' "$runs" | jq --arg game "$game" '[.workflow_runs[] |
              select(.status == "queued" or .status == "pending" or .status == "requested" or .status == "waiting" or .status == "in_progress") |
              select((.display_title // "") | contains(" · " + $game + " ·"))] | length')
            if [ "$busy" -ge 1 ]; then
              echo "STUDIO_WATCHDOG_SKIP=RUNNER_BUSY:$busy"
              exit 0
            fi
            # [중복 실검사 제거] 현재 소스에서 이미 실행한 검사(실패 포함)는 재반복하지 않는다.
            # 실패는 정확한 원인 수정 뒤 새 소스로 검증하고, 성공 증거는 그대로 재사용한다.
            checked=$(printf '%s' "$runs" | jq --arg head "$head" --arg game "$game" '[.workflow_runs[] |
              select(.head_sha == $head) |
              select((.display_title // "") | contains(" · " + $game + " ·"))] | length')
            if [ "$checked" -ge 1 ]; then
              echo "STUDIO_WATCHDOG_SKIP=SOURCE_ALREADY_CHECKED:$head:$checked"
              exit 0
            fi
          elif [ "$pending" -ge 1 ]; then
            echo "studio already queued/running for $game on $head, skip duplicate"
            exit 0
          fi
          # [실제 게임 개발 우선] 소스 변경은 영향 장면을 기존 Studio 스크립트로 플레이·촬영한다.
          # 서로 다른 분야가 함께 바뀌었거나 변경 내역을 읽을 수 없으면 전체 회귀로 되돌린다.
          # [필수 품질 보존] 게시 완료·수동 검사는 기존 243단계 정밀 회귀를 그대로 사용한다.
          script=roblox-games/mare-essentia/tools/devloop/studio-scripts/mare-qa-click.json
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            changed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.files[].filename' 2>/dev/null || true)
            scope=""
            if [ -n "$changed" ]; then
              while IFS= read -r changed_file; do
                case "$changed_file" in
                  # [항구 실화면 검사] 기존 전용 Studio 스크립트 변경은 해당 13개 항구를 실제 촬영한다.
                  roblox-games/mare-essentia/tools/devloop/studio-scripts/mare-startports.json)
                    candidate=PORTS ;;
                  # [같은 변경의 QA/선택기 파일] 실제 게임 영향 범위는 별도 소스 파일로 판단한다.
                  qa/mare-essentia-datastore-name.test.mjs|.github/workflows/studio-autoqa.yml)
                    continue ;;
                  roblox-games/mare-essentia/assets/people/*|roblox-games/mare-essentia/src/StarterPlayer/LookApply.client.luau|roblox-games/mare-essentia/src/ReplicatedStorage/Shared/Pose.luau|roblox-games/mare-essentia/tools/devloop/studio-scripts/mare-villagers.json)
                    candidate=PEOPLE ;;
                  roblox-games/mare-essentia/assets/naval/*|roblox-games/mare-essentia/src/ReplicatedStorage/Shared/Ships.luau|roblox-games/mare-essentia/tools/devloop/studio-scripts/mare-ships.json)
                    candidate=SHIPS ;;
                  roblox-games/mare-essentia/src/StarterPlayer/Game.client.luau|roblox-games/mare-essentia/tools/devloop/studio-scripts/mare-menus.json)
                    candidate=MENUS ;;
                  roblox-games/mare-essentia/src/ReplicatedStorage/Shared/FieldMotion.luau|roblox-games/mare-essentia/tools/devloop/studio-scripts/mare-motionlab.json)
                    candidate=MOTION ;;
                  roblox-games/mare-essentia/src/ReplicatedStorage/Shared/FieldScene.luau|roblox-games/mare-essentia/tools/devloop/studio-scripts/mare-field.json)
                    candidate=FIELD ;;
                  *) candidate=FULL ;;
                esac
                if [ "$candidate" = FULL ] || { [ -n "$scope" ] && [ "$scope" != "$candidate" ]; }; then
                  scope=FULL
                  break
                fi
                scope="$candidate"
              done <<< "$changed"
            fi
            case "$scope" in
              PORTS) script=roblox-games/mare-essentia/tools/devloop/studio-scripts/mare-startports.json ;;
              PEOPLE) script=roblox-games/mare-essentia/tools/devloop/studio-scripts/mare-villagers.json ;;
              SHIPS) script=roblox-games/mare-essentia/tools/devloop/studio-scripts/mare-ships.json ;;
              MENUS) script=roblox-games/mare-essentia/tools/devloop/studio-scripts/mare-menus.json ;;
              MOTION) script=roblox-games/mare-essentia/tools/devloop/studio-scripts/mare-motionlab.json ;;
              FIELD) script=roblox-games/mare-essentia/tools/devloop/studio-scripts/mare-field.json ;;
              *) scope=FULL ;;
            esac
            echo "STUDIO_PUSH_DEVELOPMENT_SCOPE=$scope"
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            echo "STUDIO_WATCHDOG_RECOVERY=SOURCE_NOT_YET_CHECKED:$head"
          else
            echo "STUDIO_RELEASE_REGRESSION=FULL"
          fi
          # [단일 Studio 검사] 각 실행 이벤트당 기존 공식 캡처 워크플로를 한 번만 호출한다.
          gh workflow run devloop-studio.yml --repo "$GITHUB_REPOSITORY" --ref main -f "game=$game" -f "script=$script"
          echo "dispatched $game $script"
