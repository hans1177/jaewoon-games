# 파일명: .github/workflows/studio-autoqa.yml
# [메인] 게임 변경·게시 완료 뒤 기존 공식 PC Studio 검사를 대항해시대만 요청한다.
# [배포 이벤트] 실행 이름(run-name)은 커밋별로 변하므로 변경되지 않는 워크플로 경로(path)로 판별한다.
# 대항해시대 기존 185단계 검사와 중복 대기 방지를 사용한다.
# 결과 사진·리포트는 브랜치 <game>-studio-frames 에 올라가고, 클라우드 바이브가 읽고 고친다.
name: Studio Auto QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/studio-autoqa.yml'
      # [자동 재검증] Studio 실행기 또는 게임별 점검 스크립트 변경 시 기존 QA를 즉시 재실행한다.
      - '.github/workflows/devloop-studio.yml'
      # [PC 복구] 메인에서 실행기 자동복구가 수정되면 기존 정확한 Studio QA를 대기열에 넣는다.
      - '.github/workflows/company-roblox-runner-pwsh-bootstrap.yml'
      - 'tools/move-roblox-studio-runner-to-e.ps1'
      - 'tools/company-development-roblox-studio-local-play.mjs'
      - 'tools/gen-qa-click-scripts.py'
      - 'roblox-games/mare-essentia/tools/devloop/studio-scripts/*.json'
      - 'roblox-games/mare-essentia/src/**'
      # Rojo 자산 폴더·빌드 트리 변경도 공식 Studio로 검증한다.
      - 'roblox-games/mare-essentia/default.project.json'
  # [정밀검사] 코드 변경이 없어도 매일 12:43(한국시간)에 기존 116단계 스크립트를 자동 요청한다.
  # GitHub 예약 누락 시 기존 push·게시 완료 이벤트와 수동 요청 경로가 유지된다.
  schedule:
    - cron: '43 3 * * *'
  workflow_run:
    workflows: ["Owner Mare Essentia Direct Publish"]
    types: [completed]
  workflow_dispatch:
    inputs:
      game:
        description: 대항해시대 (mare-essentia)
        required: false
        default: mare-essentia
        type: string
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    # [게시·Studio 독립 검증] 게시 403은 게시 실패로 남기되 게임 자체 Studio 검사는 요청한다.
    # Studio 종료 이벤트는 자신을 재발행하지 않고, 본래 게시 이벤트만 받는다.
    # 게시자의 run-name은 SHA를 포함해 변하므로 workflow_run.path로 정확히 판별한다.
    if: >-
      github.repository == 'hans1177/jaewoon-games' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.path == '.github/workflows/owner-mare-essentia-direct-publish.yml' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Studio capture on owner PC
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_IN: ${{ inputs.game }}
        run: |
          set -euo pipefail
          game="${GAME_IN:-mare-essentia}"
          if [ "$game" != mare-essentia ]; then exit 0; fi
          # 이미 만들어진 마력숲 전용 캡처만 취소한다.
          stale=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/devloop-studio.yml/runs?per_page=100" --jq '
            .workflow_runs[] | select(.status != "completed") |
            select((.display_title // "") | contains(" · fantasy-survival ·")) | .id')
          while IFS= read -r id; do
            if [[ "$id" =~ ^[0-9]+$ ]]; then gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true; fi
          done <<< "$stale"
          if gh api "repos/$GITHUB_REPOSITORY/contents/qa-log/STOP" >/dev/null 2>&1; then echo "STOP file found"; exit 0; fi
          # [중복 제한] 같은 소스의 대기·실행 중 검사만 건너뛴다.
          head=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/devloop-studio.yml/runs?per_page=100")
          # [대기열 복구] 구버전의 대기 중인 마레 정밀검사만 취소한다. 실행 중인 검사는 그대로 둔다.
          # 최신 main 정밀검사 한 개를 유지해 반복 변경으로 인한 PC 검사 적체를 방지한다.
          stale_mare=$(printf '%s' "$runs" | jq -r --arg head "$head" --arg game "$game" '
            .workflow_runs[] | select(.head_sha != $head) |
            select(.status == "queued" or .status == "pending" or .status == "requested" or .status == "waiting") |
            select((.display_title // "") | contains(" · " + $game + " ·")) | .id' | head -20)
          if [ -n "$stale_mare" ]; then
            while IFS= read -r id; do
              if [[ "$id" =~ ^[0-9]+$ ]]; then
                gh run cancel "$id" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
                echo "STUDIO_STALE_QUEUED_CANCEL_REQUESTED=$id"
              fi
            done <<< "$stale_mare"
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/devloop-studio.yml/runs?per_page=100")
          fi
          pending=$(printf '%s' "$runs" | jq --arg head "$head" --arg game "$game" '[.workflow_runs[] |
            select(.head_sha == $head) |
            select(.status == "queued" or .status == "pending" or .status == "requested" or .status == "waiting" or .status == "in_progress") |
            select((.display_title // "") | contains(" · " + $game + " ·"))] | length')
          # [예약] 새 소스 변경은 즉시 검사한다. 매일 정밀 검사는 최근 기록과 독립적으로 중복 여부를 판단한다.
          # 기존 일반 검사 하나가 대기 중이라고 하루 1번 정밀 검사를 통째로 누락시키지 않는다.
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            latest=$(gh api "repos/$GITHUB_REPOSITORY/contents/history.json?ref=mare-essentia-studio-frames" --jq .content 2>/dev/null \
              | base64 -d 2>/dev/null | jq -r '[.runs[] | select(.kind == "full")][0].at // ""' 2>/dev/null || true)
            if [ -n "$latest" ]; then
              last_s=$(date -u -d "$latest" +%s 2>/dev/null || echo 0)
              now_s=$(date -u +%s)
              if [ "$last_s" -gt 0 ] && [ "$now_s" -ge "$last_s" ] && [ "$(( now_s-last_s ))" -lt 72000 ]; then
                echo "STUDIO_DEEP_QA_SKIP=RECENT_FULL:$latest"
                exit 0
              fi
            fi
            # 공유 Windows Studio 러너의 작업을 직렬 처리하되, 다른 단순 검사 하나로 예약을 잃지 않는다.
            if [ "$pending" -ge 2 ]; then
              echo "STUDIO_DEEP_QA_SKIP=RUNNER_QUEUE:$pending"
              exit 0
            fi
          elif [ "$pending" -ge 1 ]; then
            echo "studio already queued/running for $game on $head, skip duplicate"
            exit 0
          fi
          script=roblox-games/mare-essentia/tools/devloop/studio-scripts/mare-qa-click.json
          gh workflow run devloop-studio.yml --repo "$GITHUB_REPOSITORY" --ref main -f "game=$game" -f "script=$script"
          echo "dispatched $game $script"
