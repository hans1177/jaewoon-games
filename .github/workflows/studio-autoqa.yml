# 파일명: .github/workflows/studio-autoqa.yml
# [메인] 게임 변경·게시 완료 뒤 기존 공식 PC Studio 검사를 두 게임 모두 순차적으로 요청한다.
# [배포 이벤트] 실행 이름(run-name)은 커밋별로 변하므로 변경되지 않는 워크플로 경로(path)로 판별한다.
# 대항해시대·마력숲 각각 185단계. 동일 소스·게임의 중복 대기만 막고 다른 게임은 검사한다.
# 결과 사진·리포트는 브랜치 <game>-studio-frames 에 올라가고, 클라우드 바이브가 읽고 고친다.
name: Studio Auto QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/studio-autoqa.yml'
      # [자동 재검증] Studio 실행기 또는 게임별 점검 스크립트 변경 시 기존 QA를 즉시 재실행한다.
      - '.github/workflows/devloop-studio.yml'
      # [PC 복구] 메인에서 실행기 자동복구가 수정되면 기존 정확한 Studio QA를 대기열에 넣는다.
      - '.github/workflows/company-roblox-runner-pwsh-bootstrap.yml'
      - 'tools/move-roblox-studio-runner-to-e.ps1'
      - 'tools/company-development-roblox-studio-local-play.mjs'
      - 'tools/gen-qa-click-scripts.py'
      - 'roblox-games/*/tools/devloop/studio-scripts/*.json'
      # [마력숲] 실제 게임 소스가 변하면 고정 시간 대기 없이 곧바로 PC 검사를 요청한다.
      - 'roblox-games/fantasy-survival/client/**'
      - 'roblox-games/fantasy-survival/server/**'
      - 'roblox-games/fantasy-survival/shared/**'
      - 'roblox-games/mare-essentia/src/**'
  workflow_run:
    workflows: ["Owner Mare Essentia Direct Publish", "Owner Roblox Dedicated Private Experiences"]
    types: [completed]
  workflow_dispatch:
    inputs:
      game:
        description: 기본 둘 다, 또는 mare-essentia / fantasy-survival
        required: false
        default: both
        type: string
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    # [게시·Studio 독립 검증] 게시 403은 게시 실패로 남기되 게임 자체 Studio 검사는 요청한다.
    # Studio 종료 이벤트는 자신을 재발행하지 않고, 본래 게시 이벤트만 받는다.
    # 게시자의 run-name은 SHA를 포함해 변하므로 workflow_run.path로 정확히 판별한다.
    if: >-
      github.repository == 'hans1177/jaewoon-games' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.path == '.github/workflows/owner-mare-essentia-direct-publish.yml' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main') ||
       (github.event.workflow_run.path == '.github/workflows/owner-roblox-dedicated-private-experiences.yml' &&
        github.event.workflow_run.head_branch == 'main' &&
        (github.event.workflow_run.event == 'push' ||
         github.event.workflow_run.event == 'workflow_dispatch') &&
        (github.event.workflow_run.conclusion == 'success' ||
         github.event.workflow_run.conclusion == 'failure')))
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Studio capture on owner PC
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_IN: ${{ inputs.game }}
        run: |
          set -euo pipefail
          game="${GAME_IN:-}"
          # 끄는 스위치: 저장소에 qa-log/STOP 파일이 있으면 멈춘다
          if gh api "repos/$GITHUB_REPOSITORY/contents/qa-log/STOP" >/dev/null 2>&1; then echo "STOP file found"; exit 0; fi
          # [기본값] 자동 진입은 게임 두 개 모두, 수동 진입에서만 개별 게임 지정 허용.
          games="mare-essentia fantasy-survival"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${GAME_IN:-both}" in
              both) games="mare-essentia fantasy-survival" ;;
              mare-essentia|fantasy-survival) games="$GAME_IN" ;;
              *) echo "bad game"; exit 1 ;;
            esac
          fi
          if [ "${{ github.event_name }}" = "workflow_run" ] &&
             [ "${{ github.event.workflow_run.path }}" = ".github/workflows/owner-roblox-dedicated-private-experiences.yml" ] &&
             [ "${{ github.event.workflow_run.event }}" = "push" ]; then
            # [게임 격리] 다른 게임의 자동 게시 결과는 별도 Studio 재검사를 발생시키지 않는다.
            changed=$(gh api "repos/$GITHUB_REPOSITORY/commits/${{ github.event.workflow_run.head_sha }}" --jq '.files[].filename')
            if ! printf '%s\n' "$changed" | grep -Eq '^roblox-games/fantasy-survival/|^[.]github/workflows/owner-roblox-dedicated-private-experiences[.]yml$'; then
              echo "no Forest source or publisher change, skip"; exit 0
            fi
          fi
          # [중복 제한] 게임별로 대기 중인 검사가 하나라도 있으면 새로 넣지 않는다(대기 검사는 시작할 때 최신 main 을 검사하므로 안전).
          # 실행 중인 검사는 같은 소스일 때만 중복으로 본다. 다른 게임은 절대 막지 않는다.
          head=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/devloop-studio.yml/runs?per_page=100")
          for game in $games; do
            pending=$(printf '%s' "$runs" | jq --arg head "$head" --arg game "$game" '[.workflow_runs[] |
              select(.status == "queued" or .status == "pending" or (.status == "in_progress" and .head_sha == $head)) |
              select((.display_title // "") | contains(" · " + $game + " ·"))] | length')
            if [ "$pending" -ge 1 ]; then
              echo "studio already queued/running for $game on $head, skip duplicate"
              continue
            fi
            case "$game" in
              mare-essentia) script=roblox-games/mare-essentia/tools/devloop/studio-scripts/mare-qa-click.json ;;
              fantasy-survival) script=roblox-games/fantasy-survival/tools/devloop/studio-scripts/fantasy-qa-click.json ;;
              *) echo "bad game"; exit 1 ;;
            esac
            gh workflow run devloop-studio.yml --repo "$GITHUB_REPOSITORY" --ref main -f "game=$game" -f "script=$script"
            echo "dispatched $game $script"
          done
