name: Emergency Kill Roblox Studio
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-kill-roblox-studio.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - name: Cancel every active Roblox runtime foundation run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          workflow_id=357224927
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/runs?per_page=100" > /tmp/runs.json
          node - <<'NODE' > /tmp/cancel-ids
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/runs.json','utf8'));
          const active=new Set(['queued','pending','requested','in_progress','waiting']);
          for(const r of j.workflow_runs||[]){
            if(active.has(String(r.status||'').toLowerCase())) process.stdout.write(String(r.id)+'\n');
          }
          NODE
          while read -r run_id; do
            [ -n "$run_id" ] || continue
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null || true
            echo "EMERGENCY_ROBLOX_STUDIO_RUN_CANCELLED=$run_id"
          done < /tmp/cancel-ids

  cleanup-studio:
    needs: cancel
    if: always()
    runs-on: [self-hosted, Windows, X64, roblox-studio-authenticated]
    timeout-minutes: 3
    steps:
      - name: Force close Roblox Studio and Studio MCP
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Get-Process RobloxStudioBeta -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process StudioMCP -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host 'EMERGENCY_ROBLOX_STUDIO_PROCESSES_CLOSED=YES'
