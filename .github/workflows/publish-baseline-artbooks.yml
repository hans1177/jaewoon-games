name: Publish Baseline Artbooks

on:
  push:
    branches: [main]
    paths:
      - 'artbook-submissions/*/current.json'
      - 'tools/sync-homepage-artbooks.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-baseline-artbooks-main
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Sync current baseline artbooks
        run: node tools/sync-homepage-artbooks.mjs

      - name: Commit homepage registry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-artbook-publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add -- game-artbooks.json
          if git diff --cached --quiet; then
            echo 'ARTBOOK_HOMEPAGE_SYNC=NO_CHANGES'
            exit 0
          fi
          git commit -m 'artbook: publish baseline-approved books to homepage [skip ci]'
          git pull --rebase origin main
          git push origin main
          echo 'ARTBOOK_HOMEPAGE_SYNC=SUCCESS'
