name: Vibe2 Distillation Sample Ingest

on:
  push:
    branches: [main]
    paths:
      - 'assets/vibe-v3-engine.js'
      - 'assets/vibe-development-ai.js'
      - 'tools/company-learning-sanitize.mjs'
      - 'tools/vibe2-training-sample.mjs'
      - 'tools/vibe2-distillation-ingest.mjs'
      - 'tools/vibe2-distillation-status.mjs'
      - 'tools/vibe2-training-request.mjs'
      - 'tools/vibe2-weight-learning.mjs'
      - 'tools/vibe2-real-platform-dataset-gate.mjs'
      - 'tools/vibe2-train.py'
      - 'tools/vibe3-trajectory-ingest.mjs'
      - 'tools/vibe3-model-selection.mjs'
      - 'tools/vibe3-pump-index.mjs'
      - 'tools/vibe3-transformative-recombination.mjs'
      - 'tools/vibe3-commercial-runtime-import.mjs'
      - 'qa/vibe2-training-sample.test.mjs'
      - 'qa/vibe2-distillation-status.test.mjs'
      - 'qa/vibe2-training-request.test.mjs'
      - 'qa/vibe2-weight-learning.test.mjs'
      - 'qa/vibe3-trajectory-ingest.test.mjs'
      - 'qa/vibe3-pump-index.test.mjs'
      - 'qa/vibe3-commercial-runtime-import.test.mjs'
      - 'qa/vibe2-google-play-catalog-coverage.test.mjs'
      - 'company-learning/invalidated-learning-sources.json'
      - 'company-learning/canonical-learning-pipeline.json'
      - 'company-learning/vibe3-trajectories/**'
      - 'company-learning/external-game-playtest/**'
      - 'company-learning/authorized-source/**'
      - 'design/**/release-baseline.json'
      - 'design/**/release-production-status.json'
      - 'design/**/vibe2-release-implementation.json'
      - 'design/**/unity-android-build.json'
      - 'design/**/android-runtime-validation.json'
      - 'design/**/independent-release-qa.json'
      - '.github/workflows/vibe2-distillation-ingest.yml'
      - '.github/workflows/vibe2-local-distillation-train.yml'
  workflow_run:
    workflows: ['Autonomous Candidate Promotion']
    types: [completed]
  workflow_dispatch:
    inputs:
      external_playtest_run_id:
        description: 'Completed external mobile playtest run id to import'
        required: false
        default: ''
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  actions: read

env:
  VIBE2_LEARNING_RUNTIME_BRANCH: vibe2-learning-runtime

concurrency:
  group: vibe2-distillation-ingest-pr
  cancel-in-progress: true

jobs:
  ingest:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch verified autonomous history and candidate refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/company-runtime:refs/remotes/origin/company-runtime' \
            '+refs/heads/autonomous-dev:refs/remotes/origin/autonomous-dev' \
            '+refs/heads/autonomous/candidate-*:refs/remotes/origin/autonomous/candidate-*' \
            --prune

      - name: Restore durable verified training samples
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$VIBE2_LEARNING_RUNTIME_BRANCH" >/dev/null 2>&1; then
            git fetch origin "+refs/heads/$VIBE2_LEARNING_RUNTIME_BRANCH:refs/remotes/origin/$VIBE2_LEARNING_RUNTIME_BRANCH"
            git checkout "origin/$VIBE2_LEARNING_RUNTIME_BRANCH" -- company-learning/training-samples
            echo "VIBE2_LEARNING_STATE_RESTORED=YES"
          else
            echo "VIBE2_LEARNING_STATE_RESTORED=BOOTSTRAP_MAIN"
          fi

      - name: Download verified Google Play runtime samples
        id: google_play_samples
        if: github.event_name == 'workflow_dispatch' && inputs.external_playtest_run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: external-mobile-gameplay-samples
          path: /tmp/external-mobile-gameplay-samples
          github-token: ${{ github.token }}
          run-id: ${{ inputs.external_playtest_run_id }}

      - name: Report deferred Google Play learning run
        if: github.event_name == 'workflow_dispatch' && inputs.external_playtest_run_id != '' && steps.google_play_samples.outcome != 'success'
        shell: bash
        run: |
          echo 'COMMERCIAL_RUNTIME_ARTIFACT=ABSENT'
          echo 'COMMERCIAL_RUNTIME_IMPORT=SKIPPED_NO_REAL_PLAYTEST_ARTIFACT'

      - name: Import Google Play runtime samples into canonical learning state
        if: github.event_name == 'workflow_dispatch' && inputs.external_playtest_run_id != '' && steps.google_play_samples.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          node tools/vibe3-commercial-runtime-import.mjs             --in=/tmp/external-mobile-gameplay-samples             --out=company-learning/training-samples | tee /tmp/vibe3-commercial-runtime-import.json
          node - <<'NODE'
          const fs=require('fs');
          const row=JSON.parse(fs.readFileSync('/tmp/vibe3-commercial-runtime-import.json','utf8').trim().split(/\r?\n/).at(-1));
          console.log(`COMMERCIAL_RUNTIME_IMPORTED=${row.written.length}`);
          console.log(`COMMERCIAL_RUNTIME_REPLACED=${row.replaced.length}`);
          console.log(`COMMERCIAL_RUNTIME_SKIPPED=${row.skipped.length}`);
          NODE

      - name: Validate distillation and Pump tooling
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/company-learning-sanitize.mjs
          node --check tools/vibe2-training-sample.mjs
          node --check tools/vibe2-distillation-ingest.mjs
          node --check tools/vibe2-distillation-status.mjs
          node --check tools/vibe2-training-request.mjs
          node --check tools/vibe2-weight-learning.mjs
          node --check tools/vibe2-real-platform-dataset-gate.mjs
          node --check tools/vibe3-trajectory-ingest.mjs
          node --check tools/vibe3-model-selection.mjs
          node --check tools/vibe3-pump-index.mjs
          node --check tools/vibe3-transformative-recombination.mjs
          node --check tools/vibe3-commercial-runtime-import.mjs
          python -m py_compile tools/vibe2-train.py
          node --test qa/vibe2-training-sample.test.mjs
          node --test qa/vibe2-distillation-status.test.mjs
          node --test qa/vibe2-training-request.test.mjs
          node --test qa/vibe2-weight-learning.test.mjs
          node qa/vibe3-trajectory-ingest.test.mjs
          node qa/vibe3-pump-index.test.mjs
          node qa/vibe3-commercial-runtime-import.test.mjs
          node qa/vibe2-google-play-catalog-coverage.test.mjs

      - name: Ingest verified diffs trajectories and refresh readiness
        id: ingest
        shell: bash
        run: |
          set -euo pipefail
          node tools/vibe2-distillation-ingest.mjs \
            --dev-ref=origin/autonomous-dev \
            --main-ref=origin/main \
            --company-runtime-ref=origin/company-runtime \
            --out-dir=company-learning/training-samples | tee /tmp/vibe2-distillation-ingest.json
          node tools/vibe3-trajectory-ingest.mjs \
            --trajectory-dir=company-learning/vibe3-trajectories \
            --out-dir=company-learning/training-samples | tee /tmp/vibe3-trajectory-ingest.json
          node tools/company-learning-sanitize.mjs \
            --policy=company-learning/invalidated-learning-sources.json \
            --evidence-dir=company-learning/evidence \
            --sample-dir=company-learning/training-samples \
            --dna=company-learning/company-dna.json \
            --ledger=department-experience.json | tee /tmp/company-learning-sanitize.json
          node tools/vibe2-distillation-status.mjs \
            --evidence-dir=company-learning/evidence \
            --sample-dir=company-learning/training-samples \
            --out=company-learning/distillation-status.json | tee /tmp/vibe2-distillation-status.json
          node tools/vibe2-training-request.mjs \
            --status=company-learning/distillation-status.json \
            --out=company-learning/distillation-training-request.json | tee /tmp/vibe2-distillation-request.json
          node tools/vibe3-pump-index.mjs \
            --sample-dir=company-learning/training-samples \
            --trajectory-dir=company-learning/vibe3-trajectories \
            --memory-out=company-learning/vibe3-memory-index.json \
            --playbooks-out=company-learning/vibe3-task-playbooks.json \
            --benchmark-out=company-learning/vibe3-benchmark-queue.json \
            --recombination-out=company-learning/vibe3-recombination-memory.json | tee /tmp/vibe3-pump.json
          node - <<'NODE'
          const fs=require('fs');
          const read=file=>JSON.parse(fs.readFileSync(file,'utf8').trim().split(/\r?\n/).at(-1));
          const ingest=read('/tmp/vibe2-distillation-ingest.json');
          const trajectory=read('/tmp/vibe3-trajectory-ingest.json');
          const sanitized=read('/tmp/company-learning-sanitize.json');
          const status=read('/tmp/vibe2-distillation-status.json');
          const request=read('/tmp/vibe2-distillation-request.json');
          const pump=read('/tmp/vibe3-pump.json');
          console.log(`DISTILLATION_SAMPLES_WRITTEN=${ingest.written.length}`);
          console.log(`DISTILLATION_SAMPLES_REFRESHED=${ingest.refreshed?.length||0}`);
          console.log(`WEB_FINAL_SAMPLES_EXAMINED=${ingest.webFinal?.examined||0}`);
          console.log(`WEB_FINAL_SAMPLES_WRITTEN=${ingest.webFinal?.written?.length||0}`);
          console.log(`WEB_FINAL_SAMPLES_SKIPPED=${ingest.webFinal?.skipped?.length||0}`);
          console.log(`LEGACY_LEARNING_INVALIDATED=${sanitized.invalidated||0}`);
          console.log(`LEGACY_LEARNING_INVALIDATION_GAMES=${Object.keys(sanitized.byGame||{}).join(',')||'NONE'}`);
          console.log('OWNER_EXISTING_GAMES_BLANKET_BLOCKED=NO');
          console.log('FUTURE_REVISIONS_ALLOWED=YES');
          console.log(`UNITY_RELEASE_BASELINES_EXAMINED=${ingest.unityRelease?.examined||0}`);
          console.log(`EXTERNAL_BLACK_BOX_EXAMINED=${ingest.externalBlackBox?.examined||0}`);
          console.log(`AUTHORIZED_SOURCE_EXAMINED=${ingest.authorizedSource?.examined||0}`);
          console.log(`AUTHORIZED_SOURCE_WRITTEN=${ingest.authorizedSource?.written?.length||0}`);
          console.log(`AUTHORIZED_SOURCE_REFRESHED=${ingest.authorizedSource?.refreshed?.length||0}`);
          console.log(`VIBE3_TRAJECTORIES_EXAMINED=${trajectory.examined||0}`);
          console.log(`VIBE3_TRAJECTORY_SAMPLES_WRITTEN=${trajectory.written?.length||0}`);
          console.log(`VIBE3_PUMP_POSITIVE_MEMORY=${pump.verifiedPositiveMemory||0}`);
          console.log(`VIBE3_PUMP_FAILURE_WARNINGS=${pump.failureWarnings||0}`);
          console.log(`VIBE3_CAPABILITY_TRACES=${pump.capabilityTraces||0}`);
          console.log(`VIBE3_CAPABILITY_PATTERNS=${pump.capabilityPatterns||0}`);
          console.log(`VIBE3_PUMP_PLAYBOOKS=${pump.playbooks||0}`);
          console.log(`VIBE3_PUMP_BENCHMARKS=${pump.benchmarks||0}`);
          console.log(`VIBE3_RECOMBINATION_MATERIALS=${pump.recombinationMaterials||0}`);
          console.log(`VIBE3_RECOMBINATION_RECIPES=${pump.recombinationRecipes||0}`);
          console.log(`DISTILLATION_READY_TASKS=${status.readyTasks.join(',')||'NONE'}`);
          console.log(`DISTILLATION_STATE=${status.state}`);
          console.log(`LOCAL_TRAINING_REQUEST_STATE=${request.state}`);
          NODE

      - name: Upload verified samples for online Unity teacher
        uses: actions/upload-artifact@v4
        with:
          name: vibe2-verified-training-samples
          path: company-learning/training-samples
          retention-days: 1
          if-no-files-found: warn

      - name: Upload verified samples and Pump memory artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibe2-vibe3-verified-learning-memory
          path: |
            company-learning/training-samples
            company-learning/vibe3-memory-index.json
            company-learning/vibe3-task-playbooks.json
            company-learning/vibe3-benchmark-queue.json
            company-learning/vibe3-recombination-memory.json
          retention-days: 1
          if-no-files-found: warn

      - name: Persist validated learning state without main write
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-vibe2-learning'
          git config user.email 'actions@users.noreply.github.com'

          state_paths=(
            company-learning/training-samples
            company-learning/distillation-status.json
            company-learning/distillation-training-request.json
            company-learning/vibe3-memory-index.json
            company-learning/vibe3-task-playbooks.json
            company-learning/vibe3-benchmark-queue.json
            company-learning/vibe3-recombination-memory.json
          )

          git add -A -- "${state_paths[@]}"
          if ! git diff --cached --quiet; then
            git commit -m 'learning: refresh canonical samples and Vibe3 Pump memory [skip ci]'
          fi
          generated_commit="$(git rev-parse HEAD)"

          remote_ref="refs/heads/$VIBE2_LEARNING_RUNTIME_BRANCH"
          if git ls-remote --exit-code --heads origin "$VIBE2_LEARNING_RUNTIME_BRANCH" >/dev/null 2>&1; then
            git fetch origin "+$remote_ref:refs/remotes/origin/$VIBE2_LEARNING_RUNTIME_BRANCH"
            expected="$(git rev-parse "origin/$VIBE2_LEARNING_RUNTIME_BRANCH")"
            git push --force-with-lease="$remote_ref:$expected" origin "$generated_commit:$remote_ref"
            echo 'VIBE2_LEARNING_RUNTIME_UPDATE=LEASED_REFRESH'
          else
            git push origin "$generated_commit:$remote_ref"
            echo 'VIBE2_LEARNING_RUNTIME_UPDATE=BOOTSTRAP_CREATED'
          fi

          persisted="$(git ls-remote origin "$remote_ref" | awk '{print $1}')"
          test "$persisted" = "$generated_commit"
          echo "VIBE2_LEARNING_RUNTIME_SHA=$persisted"
          echo "VIBE2_LEARNING_RUNTIME_BRANCH=$VIBE2_LEARNING_RUNTIME_BRANCH"
          echo 'GITHUB_HOSTED_MODEL_TRAINING=NO'
          echo 'BENCHMARK_COUNTS_AS_TRAINING_SAMPLE=NO'
          echo 'PUBLIC_GAME_CODE_WRITE=NO'
          echo 'PUBLIC_MAIN_WRITE=NO'

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo '### Vibe2/Vibe3 Canonical Distillation + Pump' >> "$GITHUB_STEP_SUMMARY"
          echo '- schedule: HOURLY_24H' >> "$GITHUB_STEP_SUMMARY"
          echo '- V3 Pump Mode: ON' >> "$GITHUB_STEP_SUMMARY"
          echo '- legacy generated versions: invalidated from positive learning only; original Git records preserved' >> "$GITHUB_STEP_SUMMARY"
          echo '- owner existing games: no blanket invalidation' >> "$GITHUB_STEP_SUMMARY"
          echo '- future rebuilt revisions: eligible again after current gates' >> "$GITHUB_STEP_SUMMARY"
          echo '- durable state: vibe2-learning-runtime branch; direct main write: NO' >> "$GITHUB_STEP_SUMMARY"
          echo '- verified RAG memory: verified positive evidence only' >> "$GITHUB_STEP_SUMMARY"
          echo '- failure memory: warning/avoidance context only' >> "$GITHUB_STEP_SUMMARY"
          echo '- task playbooks: coding/bugfix/qa/unity/roblox/fortnite_uefn/graphics/planning/general' >> "$GITHUB_STEP_SUMMARY"
          echo '- platform training lanes: one canonical trainer; isolated Unity/Roblox/Fortnite UEFN evidence, datasets, adapters, and runtime gates' >> "$GITHUB_STEP_SUMMARY"
          echo '- benchmark accumulation: ON; counts as training sample: NO' >> "$GITHUB_STEP_SUMMARY"
          echo '- transformative recombination: ON; verified feature materials only; 2+ project blend + original modifier required' >> "$GITHUB_STEP_SUMMARY"
          echo '- Google Play runtime bridge: successful official-store observations import into canonical learning state as practice-only derived feature material' >> "$GITHUB_STEP_SUMMARY"
          echo '- raw source/asset output: NO; new code/new asset expression required' >> "$GITHUB_STEP_SUMMARY"
          echo '- candidate tournament default: 5; allowed: 3-5' >> "$GITHUB_STEP_SUMMARY"
          echo '- bounded self repair: max 3 attempts' >> "$GITHUB_STEP_SUMMARY"
          echo '- external commercial source: black-box verified observations only; no proprietary code/assets/internal algorithms' >> "$GITHUB_STEP_SUMMARY"
          echo '- external black-box browser QA: NOT_APPLICABLE; dedicated evidence marker required' >> "$GITHUB_STEP_SUMMARY"
          echo '- authorized Block Blast source: owner-authorized static source/assets/native/algorithm learning; STATIC_VERIFIED is not runtime PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Unity/Roblox/Fortnite UEFN browser QA: NOT_APPLICABLE; verified native runtime evidence required' >> "$GITHUB_STEP_SUMMARY"
          echo '- failed Vibe3 candidates: comparison context only, never promoted as answer targets' >> "$GITHUB_STEP_SUMMARY"
          echo '- observable coding traces: winner/candidate/repair/QA facts only; hidden chain-of-thought persistence: NO' >> "$GITHUB_STEP_SUMMARY"
          echo '- capability distillation: verified trajectory patterns feed existing playbooks as advisory context; automatic promotion: NO' >> "$GITHUB_STEP_SUMMARY"
          echo '- paid API: NO' >> "$GITHUB_STEP_SUMMARY"
          echo '- GitHub-hosted model training: NO' >> "$GITHUB_STEP_SUMMARY"
          echo '- local weight training required for Pump: NO' >> "$GITHUB_STEP_SUMMARY"
          echo '- actual weight training: deferred until local capability and canonical readiness' >> "$GITHUB_STEP_SUMMARY"
          echo '- promotion: fixed holdout A/B then Canary' >> "$GITHUB_STEP_SUMMARY"
