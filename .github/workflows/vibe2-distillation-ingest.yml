name: Vibe2 Distillation Sample Ingest

on:
  push:
    branches: [main]
    paths:
      - 'tools/vibe2-training-sample.mjs'
      - 'tools/vibe2-distillation-ingest.mjs'
      - 'tools/vibe2-distillation-status.mjs'
      - 'tools/vibe2-training-request.mjs'
      - 'tools/vibe2-weight-learning.mjs'
      - 'qa/vibe2-training-sample.test.mjs'
      - 'qa/vibe2-distillation-status.test.mjs'
      - 'qa/vibe2-training-request.test.mjs'
      - 'design/**/release-baseline.json'
      - 'design/**/release-production-status.json'
      - 'design/**/vibe2-release-implementation.json'
      - 'design/**/unity-android-build.json'
      - 'design/**/android-runtime-validation.json'
      - 'design/**/independent-release-qa.json'
      - '.github/workflows/vibe2-distillation-ingest.yml'
      - '.github/workflows/vibe2-local-distillation-train.yml'
  workflow_run:
    workflows: ['Autonomous Candidate Promotion']
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: vibe2-distillation-ingest-pr
  cancel-in-progress: false

jobs:
  ingest:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch verified autonomous history and candidate refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/autonomous-dev:refs/remotes/origin/autonomous-dev' \
            '+refs/heads/autonomous/candidate-*:refs/remotes/origin/autonomous/candidate-*' \
            --prune

      - name: Validate distillation tooling
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/vibe2-training-sample.mjs
          node --check tools/vibe2-distillation-ingest.mjs
          node --check tools/vibe2-distillation-status.mjs
          node --check tools/vibe2-training-request.mjs
          node --check tools/vibe2-weight-learning.mjs
          node --test qa/vibe2-training-sample.test.mjs
          node --test qa/vibe2-distillation-status.test.mjs
          node --test qa/vibe2-training-request.test.mjs
          node --test qa/vibe2-weight-learning.test.mjs

      - name: Ingest verified diffs and refresh readiness
        id: ingest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/vibe2-distillation-ingest.mjs \
            --dev-ref=origin/autonomous-dev \
            --main-ref=origin/main \
            --out-dir=company-learning/training-samples | tee /tmp/vibe2-distillation-ingest.json
          node tools/vibe2-distillation-status.mjs \
            --evidence-dir=company-learning/evidence \
            --sample-dir=company-learning/training-samples \
            --out=company-learning/distillation-status.json | tee /tmp/vibe2-distillation-status.json
          node tools/vibe2-training-request.mjs \
            --status=company-learning/distillation-status.json \
            --out=company-learning/distillation-training-request.json | tee /tmp/vibe2-distillation-request.json
          node - <<'NODE'
          const fs=require('fs');
          const ingest=JSON.parse(fs.readFileSync('/tmp/vibe2-distillation-ingest.json','utf8').trim().split(/\r?\n/).at(-1));
          const status=JSON.parse(fs.readFileSync('/tmp/vibe2-distillation-status.json','utf8').trim().split(/\r?\n/).at(-1));
          const request=JSON.parse(fs.readFileSync('/tmp/vibe2-distillation-request.json','utf8').trim().split(/\r?\n/).at(-1));
          console.log(`DISTILLATION_SAMPLES_WRITTEN=${ingest.written.length}`);
          console.log(`DISTILLATION_SAMPLES_REFRESHED=${ingest.refreshed?.length||0}`);
          console.log(`UNITY_RELEASE_BASELINES_EXAMINED=${ingest.unityRelease?.examined||0}`);
          console.log(`UNITY_RELEASE_SAMPLES_WRITTEN=${ingest.unityRelease?.written?.length||0}`);
          console.log(`DISTILLATION_READY_TASKS=${status.readyTasks.join(',')||'NONE'}`);
          console.log(`DISTILLATION_STATE=${status.state}`);
          console.log(`LOCAL_TRAINING_REQUEST_STATE=${request.state}`);
          NODE

      - name: Upload verified samples for online Unity teacher
        uses: actions/upload-artifact@v4
        with:
          name: vibe2-verified-training-samples
          path: company-learning/training-samples
          retention-days: 1
          if-no-files-found: warn

      - name: Propose verified training samples and readiness through PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-vibe2-learning'
          git config user.email 'actions@users.noreply.github.com'

          if [ -d company-learning/training-samples ]; then git add company-learning/training-samples; fi
          git add company-learning/distillation-status.json company-learning/distillation-training-request.json
          if git diff --cached --quiet; then
            echo 'DISTILLATION_MEMORY_PR=NO_CHANGES'
            exit 0
          fi

          branch="automation/vibe2-distillation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$branch"
          git commit -m 'learning: refresh distillation samples and local training request [skip ci]'
          git push origin "HEAD:refs/heads/$branch"

          if pr_url="$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$branch" \
            --title 'learning: refresh distillation samples and local training request' \
            --body "Verified Vibe2 distillation sample/status refresh.\n\n- workflow run: ${GITHUB_RUN_ID}\n- direct main write: NO\n- GitHub-hosted model training: NO\n- public game code write: NO")"; then
            echo "DISTILLATION_MEMORY_PR=$pr_url"
          else
            echo 'DISTILLATION_MEMORY_PR=SKIPPED_ACTIONS_PR_PERMISSION'
            git checkout main
            git push origin --delete "$branch" || true
          fi
          echo 'GITHUB_HOSTED_MODEL_TRAINING=NO'
          echo 'PUBLIC_GAME_CODE_WRITE=NO'
          echo 'PUBLIC_MAIN_WRITE=NO'

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo '### Vibe2 Distillation Sample Ingest' >> "$GITHUB_STEP_SUMMARY"
          echo '- web source: independent-QA + browser-QA verified autonomous promotions' >> "$GITHUB_STEP_SUMMARY"
          echo '- Unity source: RELEASE_READY + current source/build binding + Android runtime PASS + independent QA PASS + merged PR' >> "$GITHUB_STEP_SUMMARY"
          echo '- Unity browser QA: NOT_APPLICABLE; never synthesized as PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- answer target: exact verified source diff' >> "$GITHUB_STEP_SUMMARY"
          echo '- online teacher handoff: short-lived verified-sample artifact' >> "$GITHUB_STEP_SUMMARY"
          echo '- paid API: NO' >> "$GITHUB_STEP_SUMMARY"
          echo '- GitHub-hosted model training: NO' >> "$GITHUB_STEP_SUMMARY"
          echo '- ready work emits deterministic training request' >> "$GITHUB_STEP_SUMMARY"
          echo '- persistence: PR when Actions PR creation is permitted; direct main write forbidden' >> "$GITHUB_STEP_SUMMARY"
          echo '- promotion: fixed holdout A/B then Canary' >> "$GITHUB_STEP_SUMMARY"
