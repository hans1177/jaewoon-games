name: Owner Pass80 Contract Sync

on:
  push:
    branches: [owner/design-pass80-fast-optimization-20260913]
    paths:
      - '.github/workflows/owner-pass80-contract-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: owner/design-pass80-fast-optimization-20260913
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync executable and QA contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); t=p.read_text()
              if old not in t: raise SystemExit(f'PATCH_TARGET_MISSING:{path}:{old[:100]!r}')
              p.write_text(t.replace(old,new,1))

          # Artbook cannot be created before the seed is actually promoted.
          replace_once('tools/company-design-artbook.mjs',
              "if(disposition==='DISCARDED'||status.disposition?.unanimousFatalDiscard===true)throw new Error('DESIGN_ARTBOOK_DISCARDED');\nconst directive=readJson('company-directive.json',{});",
              "if(disposition==='DISCARDED'||status.disposition?.unanimousFatalDiscard===true)throw new Error('DESIGN_ARTBOOK_DISCARDED');\nconst promotedSeed=seedForGame(loadSeedState(),gameId);if(clean(promotedSeed?.productionClass)!=='DEVELOPMENT_CONFIRMED')throw new Error('POST_PROMOTION_ARTBOOK_REQUIRES_DEVELOPMENT_CONFIRMED');\nconst directive=readJson('company-directive.json',{});")
          replace_once('tools/company-design-artbook.mjs',
              "const seed=seedForGame(loadSeedState(),gameId);const catalog=readJson('game-catalog.json',{games:[]});",
              "const seed=promotedSeed;const catalog=readJson('game-catalog.json',{games:[]});")
          replace_once('tools/company-design-artbook.mjs',
              "console.log('DESIGN_ARTBOOK=CREATED');console.log('DESIGN_ARTBOOK_AFTER_BASELINE=YES');",
              "console.log('DESIGN_ARTBOOK=CREATED');console.log('POST_PROMOTION_ARTBOOK=YES');console.log('DESIGN_ARTBOOK_AFTER_BASELINE=YES');")

          # Central contract test now locks: no DESIGN_ONLY artbook, 80 design gate, 90 implementation gate.
          old="""test('DESIGN_ONLY is seed-backed design review revision baseline then artbook with no Vibe2',()=>{\n  const design=directive.classes.DESIGN_ONLY;\n  assert.deepEqual(design.requiredFlow,[\n    'GAME_SEED','GAME_DESIGNER_DRAFT','FIVE_DISTINCT_DEPARTMENT_LEADS',\n    'DEPARTMENT_LEAD_PLUS_ASSISTANT_MULTIMODEL_REVIEW','DEPARTMENT_LEAD_INTERNAL_CONSENSUS',\n    'CROSS_DEPARTMENT_LEAD_MEETING','ONE_LEAD_REBUTTAL_ROUND','GAME_DESIGNER_REVISION',\n    'DESIGN_BASELINE_GATE','ARTBOOK_EDITOR_CORE_STRATEGY'\n  ]);\n  for(const token of ['TARGET_PLATFORM_UX_DIRECTION_DEFINED','PLATFORM_SELECTION_RECORDED','MANDATORY_WEB_COMPANION_REQUIREMENT_RECORDED','APPROVED_SCOPE_INVENTORY_RECORDED','FIVE_DEPARTMENT_SCORES_RECORDED'])assert.ok(design.baselineReadyRequires.includes(token));\n  assert.equal(design.readyState,'DESIGN_BASELINE_READY');\n  assert.equal(design.sourceCodeAutoDevelopment,false);\n  assert.equal(directive.ai.vibe2.startsAtClass,'DEVELOPMENT_CONFIRMED');\n  assert.equal(directive.ai.vibe2.designOnlyActive,false);\n  assert.equal(Object.hasOwn(directive.ai.vibe2.roleByClass,'DESIGN_ONLY'),false);\n  assert.match(designCycle,/GAME_SEED_REQUIRED/);\n  assert.match(designCycle,/sameModelAsDraft:true/);\n  assert.match(designCycle,/repeatedFiveDepartmentReview:true/);\n  assert.doesNotMatch(designCycle,/VIBE2_VALIDATION_LEARNING|vibe2-validator/);\n  assert.match(pipeline,/DESIGN_ONLY_VIBE2_USED=NO/);\n});"""
          new="""test('DESIGN_ONLY stops at strict design baseline; artbook begins only after 80-point promotion',()=>{\n  const design=directive.classes.DESIGN_ONLY;\n  assert.deepEqual(design.requiredFlow,[\n    'GAME_SEED','GAME_DESIGNER_DRAFT','FIVE_DISTINCT_DEPARTMENT_LEADS',\n    'DEPARTMENT_LEAD_PLUS_ASSISTANT_MULTIMODEL_REVIEW','DEPARTMENT_LEAD_INTERNAL_CONSENSUS',\n    'CROSS_DEPARTMENT_LEAD_MEETING','ONE_LEAD_REBUTTAL_ROUND','GAME_DESIGNER_REVISION',\n    'DESIGN_BASELINE_GATE'\n  ]);\n  for(const token of ['TARGET_PLATFORM_UX_DIRECTION_DEFINED','PLATFORM_SELECTION_RECORDED','MANDATORY_WEB_COMPANION_REQUIREMENT_RECORDED','APPROVED_SCOPE_INVENTORY_RECORDED','FIVE_DEPARTMENT_SCORES_RECORDED'])assert.ok(design.baselineReadyRequires.includes(token));\n  assert.equal(design.readyState,'DESIGN_BASELINE_READY');\n  assert.equal(design.sourceCodeAutoDevelopment,false);\n  assert.equal(design.artbookBeforePromotionForbidden,true);\n  assert.equal(directive.strictReview.designPassMinimum,80);\n  assert.equal(directive.strictReview.implementationPassMinimum,90);\n  assert.equal(directive.strictReview.excellentDesignMinimum,90);\n  assert.equal(directive.ai.artbookEditor.startsAfterDesignPromotion,true);\n  assert.equal(directive.ai.artbookEditor.startsAtClass,'DEVELOPMENT_CONFIRMED');\n  assert.ok(directive.classes.DEVELOPMENT_CONFIRMED.requiredFlow.includes('POST_PROMOTION_ARTBOOK'));\n  assert.equal(directive.classes.DEVELOPMENT_CONFIRMED.postPromotionArtbookRequiredBeforeWeb,true);\n  assert.equal(directive.ai.vibe2.startsAtClass,'DEVELOPMENT_CONFIRMED');\n  assert.equal(directive.ai.vibe2.designOnlyActive,false);\n  assert.equal(Object.hasOwn(directive.ai.vibe2.roleByClass,'DESIGN_ONLY'),false);\n  assert.match(designCycle,/GAME_SEED_REQUIRED/);\n  assert.match(designCycle,/sameModelAsDraft:true/);\n  assert.match(designCycle,/repeatedFiveDepartmentReview:true/);\n  assert.match(designCycle,/AbortSignal\\.timeout\\(modelCallTimeoutMs\\)/);\n  assert.doesNotMatch(designCycle,/VIBE2_VALIDATION_LEARNING|vibe2-validator/);\n  assert.match(pipeline,/DESIGN_ONLY_ARTBOOK_BEFORE_PROMOTION=NO/);\n  assert.doesNotMatch(pipeline,/await run\\('tools\\/company-design-artbook\\.mjs'\\)/);\n  assert.match(pipeline,/DESIGN_ONLY_VIBE2_USED=NO/);\n});"""
          replace_once('qa/company-central-policy-contract.test.mjs',old,new)

          # Add central owner contract assertions to the source-of-truth test.
          replace_once('qa/company-central-policy-contract.test.mjs',
              "  assert.match(flow,/ownerInstructionOverridesPolicy: true/);\n  assert.match(agents,/제작 정책 원본은 \\*\\*`COMPANY_FLOW\\.md` 하나\\*\\*/);",
              "  assert.match(flow,/ownerInstructionOverridesPolicy: true/);\n  assert.match(flow,/passMinimum: 80/);\n  assert.match(flow,/implementationPassMinimum: 90/);\n  assert.match(flow,/designOnlyArtbookBeforePromotionForbidden: true/);\n  assert.match(flow,/blockingBudgetMinutes: 10/);\n  assert.match(agents,/제작 정책 원본은 \\*\\*`COMPANY_FLOW\\.md` 하나\\*\\*/);")
          PY

          node --check tools/company-design-artbook.mjs
          node --test qa/company-central-policy-contract.test.mjs qa/company-game-seed-flow.test.mjs qa/design-only-promotion-sync.test.mjs
      - name: Commit and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'owner-contract-sync'
          git config user.email 'owner-contract-sync@users.noreply.github.com'
          git rm .github/workflows/owner-pass80-contract-sync.yml
          git add tools/company-design-artbook.mjs qa/company-central-policy-contract.test.mjs
          git diff --cached --check
          git commit -m 'test: lock pass80 and post-promotion artbook contracts'
          git push origin HEAD:owner/design-pass80-fast-optimization-20260913
