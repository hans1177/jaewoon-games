name: Targeting Test

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test targeting and session restore
        run: |
          rm -rf /tmp/jaewoon-targeting
          mkdir -p /tmp/jaewoon-targeting
          cp assets/targeting-system.js assets/game-session.js assets/combat-vitals.js assets/status-effects.js assets/resource-gathering.js assets/day-night-cycle.js assets/wave-spawner.js assets/game-timers.js assets/state-machine.js assets/scene-flow.js assets/input-actions.js assets/game-loop.js assets/vibe-runtime.js assets/game-blueprint.js assets/game-presets.js assets/game-kit.js assets/d20-rules.js assets/turn-combat.js assets/character-progression.js assets/inventory-equipment.js assets/quest-dialogue.js assets/skill-effects.js assets/economy-loot-shop.js assets/save-versioning.js assets/stat-modifiers.js assets/crafting-recipes.js assets/achievements-unlocks.js /tmp/jaewoon-targeting/
          printf '{"type":"module"}\n' > /tmp/jaewoon-targeting/package.json
          cd /tmp/jaewoon-targeting
          node --check targeting-system.js
          node --check game-session.js
          node --input-type=module <<'NODE'
          import { JaewoonTargetingSystem } from './targeting-system.js';
          import { createGameSession } from './game-session.js';
          import { buildGamePreset } from './game-presets.js';

          const targeting = new JaewoonTargetingSystem({ entities: [
            { id: 'tower', team: 'ally', x: 0, y: 0 },
            { id: 'near', team: 'enemy', x: 3, y: 4, hp: 50, maxHp: 100, threat: 2, priority: 1 },
            { id: 'far', team: 'enemy', x: 9, y: 0, hp: 90, maxHp: 100, threat: 10, priority: 5 },
            { id: 'dead', team: 'enemy', x: 1, y: 0, hp: 0, maxHp: 100, alive: false },
          ] });
          if (targeting.select('tower', { teams: ['enemy'], range: 6, strategy: 'nearest' })?.id !== 'near') throw new Error('nearest/range targeting failed');
          if (targeting.select('tower', { teams: ['enemy'], strategy: 'highest-threat' })?.id !== 'far') throw new Error('threat targeting failed');
          if (targeting.select('tower', { teams: ['enemy'], strategy: 'lowest-hp' })?.id !== 'near') throw new Error('lowest hp targeting failed');
          if (targeting.candidates('tower', { teams: ['enemy'] }).some((e) => e.id === 'dead')) throw new Error('dead target filtering failed');
          targeting.update('near', { targetable: false });
          if (targeting.select('tower', { teams: ['enemy'], range: 6 }) !== null) throw new Error('untargetable filtering failed');
          const restoredTargeting = new JaewoonTargetingSystem();
          restoredTargeting.restore(targeting.snapshot());
          if (restoredTargeting.get('far')?.priority !== 5) throw new Error('target restore failed');

          const storage = new Map();
          globalThis.localStorage = {
            getItem: (key) => storage.has(key) ? storage.get(key) : null,
            setItem: (key, value) => storage.set(key, String(value)),
            removeItem: (key) => storage.delete(key),
          };
          const options = { gameId: 'target-session', genre: 'defense', autoRestore: false };
          const session = createGameSession(options);
          session.registerTargetEntity({ id: 'tower', team: 'ally', x: 0, y: 0 });
          session.registerTargetEntity({ id: 'goblin', team: 'enemy', x: 2, y: 0, hp: 25, maxHp: 25 });
          session.registerCombatEntity({ id: 'goblin', hp: 25, maxHp: 25 });
          if (session.selectTarget('tower', { teams: ['enemy'], range: 5 })?.id !== 'goblin') throw new Error('session targeting failed');
          session.damageCombatEntity('goblin', 25);
          session.syncTargetVitals('goblin');
          if (session.selectTarget('tower', { teams: ['enemy'], range: 5 }) !== null) throw new Error('combat targeting sync failed');
          session.save();
          const restored = createGameSession({ ...options, autoRestore: true });
          if (restored.targeting.get('goblin')?.alive !== false) throw new Error('session target restore failed');
          restored.destroy();

          const defense = buildGamePreset({ genre: 'defense' });
          const action = buildGamePreset({ genre: 'action' });
          const strategy = buildGamePreset({ genre: 'strategy' });
          const puzzle = buildGamePreset({ genre: 'puzzle' });
          if (!defense.systems.includes('targeting-system') || !action.systems.includes('targeting-system') || !strategy.systems.includes('targeting-system')) throw new Error('preset targeting missing');
          if (puzzle.systems.includes('targeting-system')) throw new Error('puzzle should not force targeting');
          console.log('PASS targeting');
          NODE
