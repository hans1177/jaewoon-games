name: Horror Manor Native Review
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/horror-manor-review.yml'
      - 'tools/horror-manor-studio-review.mjs'
      - 'tools/horror-manor-native-check.mjs'
      - 'roblox-games/horror-escape-room/shared/ManorAssets.luau'
      - 'roblox-games/horror-escape-room/server/ManorLobby.luau'
permissions:
  contents: read
concurrency:
  group: horror-manor-native-review
  cancel-in-progress: true
jobs:
  review:
    runs-on: [self-hosted, Windows, X64, roblox-studio-authenticated]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Rojo for this Studio review
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $bin=Join-Path $env:RUNNER_TEMP 'horror-manor-review-rojo'
          $zip=Join-Path $env:RUNNER_TEMP 'rojo-7.7.0-windows-x86_64.zip'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $zip
          $hash=(Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if($hash -ne '2179c44862a10ecbd725bdfeb4abc64e16dc4aad9b6c8f3e1a7c46a87280b949'){throw "ROJO_SHA256_MISMATCH:$hash"}
          Expand-Archive -LiteralPath $zip -DestinationPath $bin -Force
          $rojo=Join-Path $bin 'rojo.exe'
          if(-not(Test-Path -LiteralPath $rojo)){throw 'ROJO_EXE_MISSING_AFTER_INSTALL'}
          "MANOR_REVIEW_ROJO=$rojo" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Download and verify exact Published Version 77 manor
        env:
          ROBLOX_ROBLOSECURITY: ${{ secrets.ROBLOX_ROBLOSECURITY }}
          ROBLOX_SECURITY_COOKIE: ${{ secrets.ROBLOX_SECURITY_COOKIE }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'midnight-manor-native-review'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $env:MANOR_NATIVE_ASSET_ID='89009422966867'
          $env:MANOR_NATIVE_MODEL=Join-Path $out 'manor-template.rbxm'
          $env:MANOR_NATIVE_EVIDENCE=Join-Path $out 'native-import-check.json'
          node tools/horror-manor-native-check.mjs
          if($LASTEXITCODE -ne 0){throw 'VERSION77_MANOR_NATIVE_CHECK_FAILED'}
          if(-not(Test-Path -LiteralPath $env:MANOR_NATIVE_MODEL)){throw 'VERSION77_MANOR_NATIVE_MODEL_MISSING'}
          "MANOR_REVIEW_OUT=$out" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "MANOR_REVIEW_MANOR=$($env:MANOR_NATIVE_MODEL)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host 'MANOR_REVIEW_VERSION77_NATIVE=PASS'
      - name: Open this review place and discover official Studio tools
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $rojo=$env:MANOR_REVIEW_ROJO
          if(-not $rojo -or -not(Test-Path -LiteralPath $rojo)){throw 'MANOR_REVIEW_ROJO_NOT_READY'}
          $place=Join-Path $env:MANOR_REVIEW_OUT 'midnight-manor-review.rbxlx'
          $project=Join-Path $env:MANOR_REVIEW_OUT 'review.project.json'
          $env:MANOR_REVIEW_PROJECT=$project
          @'
          const fs=require('fs');
          const source='roblox-games/horror-escape-room/default.project.json';
          const project=JSON.parse(fs.readFileSync(source,'utf8'));
          project.tree.ServerStorage={
            ...(project.tree.ServerStorage||{}),
            ManorTemplate:{$path:process.env.MANOR_REVIEW_MANOR}
          };
          fs.writeFileSync(process.env.MANOR_REVIEW_PROJECT,JSON.stringify(project,null,2)+'\n');
          '@ | node
          if($LASTEXITCODE -ne 0){throw 'REVIEW_PROJECT_BIND_FAILED'}
          & $rojo build $project -o $place
          if($LASTEXITCODE -ne 0){throw 'REVIEW_BUILD_FAILED'}
          Write-Host 'MANOR_REVIEW_PACKAGED_VERSION77=PASS'
          $studio=Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Roblox/Versions') -Directory | Sort-Object LastWriteTime -Descending | ForEach-Object {Join-Path $_.FullName 'RobloxStudioBeta.exe'} | Where-Object {Test-Path $_} | Select-Object -First 1
          if(-not $studio){throw 'STUDIO_NOT_FOUND'}
          $mcp=Join-Path (Split-Path $studio) 'StudioMCP.exe'
          if(-not(Test-Path $mcp)){throw 'STUDIO_MCP_NOT_FOUND'}
          $env:MANOR_MCP_EXE=$mcp
          $review=Start-Process $studio -ArgumentList "`"$place`"" -PassThru
          Start-Sleep -Seconds 15
          node tools/horror-manor-studio-review.mjs
          if($LASTEXITCODE -ne 0){throw 'REVIEW_MCP_DISCOVERY_FAILED'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: midnight-manor-native-review
          path: ${{ runner.temp }}/midnight-manor-native-review/
