name: ChatGPT Vibe2 Capability Upgrade

on:
  push:
    branches: [chatgpt/vibe2-capability-upgrade-20260909]
    paths:
      - '.github/workflows/chatgpt-vibe2-capability-upgrade.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/vibe2-capability-upgrade-20260909
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch Vibe2 capability bottlenecks
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text()
              if old not in text:
                  raise SystemExit(f'patch target missing: {path}: {old[:100]!r}')
              p.write_text(text.replace(old,new,1))

          worker='tools/autonomous-development-worker.mjs'
          replace_once(worker,
          "const DEFAULT_MODEL=process.env.AUTONOMOUS_LOCAL_MODEL||'qwen3:0.6b';\nconst MAX_CONTEXT_FILES=10;\nconst MAX_CONTEXT_BYTES=420000;\nconst MAX_FULL_CONTEXT_FILE_BYTES=180000;",
          "const DEFAULT_MODEL=process.env.AUTONOMOUS_LOCAL_MODEL||'qwen3:1.7b';\nconst MAX_CONTEXT_FILES=6;\nconst MAX_CONTEXT_BYTES=32000;\nconst MAX_FULL_CONTEXT_FILE_BYTES=18000;\nconst FEEDBACK_DIR='.autonomous/browser-failures';")
          replace_once(worker,
          "const readJson=(file,fallback={})=>{try{return JSON.parse(fs.readFileSync(file,'utf8'));}catch{return fallback;}};",
          "const readJson=(file,fallback={})=>{try{return JSON.parse(fs.readFileSync(file,'utf8'));}catch{return fallback;}};\nfunction browserFailureFeedback(gameId){const file=path.join(FEEDBACK_DIR,`${safeId(gameId)}.json`),report=readJson(file,null);if(!report||report.pass!==false)return'';const rows=[...(report.errors||[]),...(report.consoleErrors||[]).map(x=>`console:${x}`),...(report.pageErrors||[]).map(x=>`page:${x}`),...(report.failedRequests||[]).map(x=>`request:${x}`)].map(clean).filter(Boolean).slice(0,10);const metrics=report.metrics?`mobile=${report.metrics.viewportWidth||390}px body=${report.metrics.width||0}x${report.metrics.height||0} interactive=${report.metrics.visibleInteractive||0}`:'';return clean(`직전 후보 모바일 브라우저 QA 실패. 같은 실패를 반복하지 말고 원인을 직접 고쳐라. ${rows.join(' | ')} ${metrics} screenshot=${report.screenshot||'artifact-only'}`);}")
          replace_once(worker,
          "export function buildPrompt({gameId,sourcePath,goal,context,protectedValues=[],responsibilityFiles=[],attempt=1,failureReason=''}){\n  const evidence=context.files.map(file=>`\\n### FILE ${file.path}${file.preferred?' [RESPONSIBILITY]':''}${file.truncated?` [TRUNCATED originalBytes=${file.originalBytes}]`:''}\\n${file.content}`).join('\\n');\n  return `/no_think\\n너는 재운컴퍼니 Autonomous Development Worker다. 안정판 원본은 읽기 전용이며 별도 후보 복사본에 적용할 변경만 제안한다.\\n게임: ${gameId}\\n원본경로: ${sourcePath}\\n작은 목표: ${goal}\\n책임 파일: ${responsibilityFiles.join(', ')||'근거에서 가장 직접적인 파일 1개'}\\n시도: ${attempt}/${MAX_MODEL_ATTEMPTS}${failureReason?`\\n직전 실패: ${failureReason}`:''}\\n보호값: ${protectedValues.join(', ')||'save key / 진행 의미 / 공개 안정판'}\\n규칙:",
          "export function buildPrompt({gameId,sourcePath,goal,context,protectedValues=[],responsibilityFiles=[],attempt=1,failureReason='',departmentRole='',browserFeedback=''}){\n  const evidence=context.files.map(file=>`\\n### FILE ${file.path}${file.preferred?' [RESPONSIBILITY]':''}${file.truncated?` [TRUNCATED originalBytes=${file.originalBytes}]`:''}\\n${file.content}`).join('\\n');\n  const retryRule=attempt>1?'\\n재시도 규칙: 직전 실패 종류를 직접 해결하는 EXACT_EDITS를 우선하고, find는 아래 근거에서 짧지만 유일한 원문을 그대로 사용한다. 새 구조를 만들지 마라.':'';\n  return `/no_think\\n너는 재운컴퍼니 Autonomous Development Worker다. 안정판 원본은 읽기 전용이며 별도 후보 복사본에 적용할 변경만 제안한다.\\n게임: ${gameId}\\n부서: ${departmentRole||'development'}\\n원본경로: ${sourcePath}\\n작은 목표: ${goal}${browserFeedback?`\\n직전 브라우저 실패 근거: ${browserFeedback}`:''}\\n책임 파일: ${responsibilityFiles.join(', ')||'근거에서 가장 직접적인 파일 1개'}\\n시도: ${attempt}/${MAX_MODEL_ATTEMPTS}${failureReason?`\\n직전 생성 실패: ${failureReason}`:''}${retryRule}\\n보호값: ${protectedValues.join(', ')||'save key / 진행 의미 / 공개 안정판'}\\n규칙:")
          replace_once(worker,
          "body:JSON.stringify({model,prompt,stream:true,think:false,format:CANDIDATE_SCHEMA,options:{temperature:0.12,num_ctx:8192,num_predict:MODEL_MAX_PREDICT}})",
          "body:JSON.stringify({model,prompt,stream:true,think:false,format:CANDIDATE_SCHEMA,options:{temperature:0.1,num_ctx:12288,num_predict:MODEL_MAX_PREDICT}})")
          replace_once(worker,
          "try{const raw=await callOllama(buildPrompt({gameId,sourcePath,goal,context:activeContext,protectedValues:options.protectedValues??[],responsibilityFiles,attempt,failureReason}),options.model??DEFAULT_MODEL);",
          "try{const raw=await callOllama(buildPrompt({gameId,sourcePath,goal,context:activeContext,protectedValues:options.protectedValues??[],responsibilityFiles,attempt,failureReason,departmentRole:options.departmentRole||'',browserFeedback:options.browserFeedback||''}),options.model??DEFAULT_MODEL);")
          replace_once(worker,
          "const evidence={version:3,candidateOnly:true,selfPromote:false,publicStableModified:false,paidApi:false,model:repairMode==='RULE_PATCH'?null:(options.model??DEFAULT_MODEL),",
          "const evidence={version:4,candidateOnly:true,selfPromote:false,publicStableModified:false,paidApi:false,departmentRole:options.departmentRole||null,browserFailureFeedbackUsed:Boolean(options.browserFeedback),model:repairMode==='RULE_PATCH'?null:(options.model??DEFAULT_MODEL),")
          replace_once(worker,
          "async function main(){\n  const protectedValues=clean(process.env.AUTONOMOUS_PROTECTED_VALUES).split(',').map(clean).filter(Boolean),order=readJson('.autonomous/work-order.json',{});\n  const evidence=await generateAutonomousCandidate({gameId:process.env.AUTONOMOUS_GAME_ID,sourcePath:process.env.AUTONOMOUS_SOURCE_PATH,goal:process.env.AUTONOMOUS_GOAL,candidateId:process.env.AUTONOMOUS_CANDIDATE_ID,protectedValues,model:process.env.AUTONOMOUS_LOCAL_MODEL||DEFAULT_MODEL,repairMode:process.env.AUTONOMOUS_REPAIR_MODE||order.repairMode||'MODEL',responsibilityFiles:order.responsibilityFiles||[],diagnostic:order.diagnosticTopIssue||null});console.log(JSON.stringify(evidence,null,2));\n}",
          "async function main(){\n  const protectedValues=clean(process.env.AUTONOMOUS_PROTECTED_VALUES).split(',').map(clean).filter(Boolean),order=readJson('.autonomous/work-order.json',{}),gameId=process.env.AUTONOMOUS_GAME_ID,feedback=browserFailureFeedback(gameId);\n  const evidence=await generateAutonomousCandidate({gameId,sourcePath:process.env.AUTONOMOUS_SOURCE_PATH,goal:process.env.AUTONOMOUS_GOAL,candidateId:process.env.AUTONOMOUS_CANDIDATE_ID,protectedValues,model:process.env.AUTONOMOUS_LOCAL_MODEL||DEFAULT_MODEL,repairMode:process.env.AUTONOMOUS_REPAIR_MODE||order.repairMode||'MODEL',responsibilityFiles:order.responsibilityFiles||[],diagnostic:order.diagnosticTopIssue||null,departmentRole:process.env.AUTONOMOUS_DEPARTMENT_ROLE||'',browserFeedback:feedback});console.log(JSON.stringify(evidence,null,2));\n}")

          continuous='.github/workflows/autonomous-continuous-development.yml'
          replace_once(continuous,
          "      - 'tools/autonomous-department-integrator.mjs'\n      - 'tools/autonomous-diagnostics.mjs'",
          "      - 'tools/autonomous-department-integrator.mjs'\n      - 'tools/autonomous-department-scope.mjs'\n      - 'tools/autonomous-candidate-browser-qa.mjs'\n      - 'tools/autonomous-diagnostics.mjs'")
          replace_once(continuous,
          "      - 'qa/autonomous-development-worker.test.mjs'\n      - 'qa/autonomous-portfolio-continuation.test.mjs'",
          "      - 'qa/autonomous-development-worker.test.mjs'\n      - 'qa/autonomous-department-scope.test.mjs'\n      - 'qa/autonomous-candidate-browser-qa.test.mjs'\n      - 'qa/autonomous-portfolio-continuation.test.mjs'")
          replace_once(continuous,
          "  AUTONOMOUS_LOCAL_MODEL: qwen3:0.6b\n  AUTONOMOUS_MODEL_MAX_PREDICT: '1536'\n  AUTONOMOUS_MODEL_TIMEOUT_MS: '240000'\n  AUTONOMOUS_MODEL_MAX_ATTEMPTS: '2'\n  AUTONOMOUS_DEPARTMENT_MAX_PREDICT: '320'\n  AUTONOMOUS_DEPARTMENT_TIMEOUT_MS: '120000'",
          "  AUTONOMOUS_LOCAL_MODEL: qwen3:1.7b\n  AUTONOMOUS_MODEL_MAX_PREDICT: '3072'\n  AUTONOMOUS_MODEL_TIMEOUT_MS: '360000'\n  AUTONOMOUS_MODEL_MAX_ATTEMPTS: '2'\n  AUTONOMOUS_DEPARTMENT_MAX_PREDICT: '520'\n  AUTONOMOUS_DEPARTMENT_TIMEOUT_MS: '180000'")
          replace_once(continuous,
          "          node --check tools/autonomous-department-integrator.mjs\n          node --test qa/autonomous-work-planner.test.mjs",
          "          node --check tools/autonomous-department-integrator.mjs\n          node --check tools/autonomous-department-scope.mjs\n          node --check tools/autonomous-candidate-browser-qa.mjs\n          node --test qa/autonomous-work-planner.test.mjs")
          replace_once(continuous,
          "          node --test qa/autonomous-development-worker.test.mjs",
          "          node --test qa/autonomous-development-worker.test.mjs\n          node --test qa/autonomous-department-scope.test.mjs\n          node --test qa/autonomous-candidate-browser-qa.test.mjs")
          p=Path(continuous); text=p.read_text(); start=text.index('      - name: Bind one department-owned code scope'); end=text.index('      - name: Install local Ollama for department implementation',start)
          block="""      - name: Bind content-aware department code scope\n        id: scope\n        env:\n          ROLE: ${{ matrix.role }}\n          BASE_CANDIDATE_ID: ${{ needs.prepare.outputs.candidate_id }}\n        shell: bash\n        run: |\n          set -euo pipefail\n          node tools/autonomous-department-scope.mjs\n          echo \"DEPARTMENT_CODE_SCOPE=${{ matrix.role }}:${{ steps.scope.outputs.scope }}\"\n          echo \"DEPARTMENT_SCOPE_REASON=${{ steps.scope.outputs.scope_reason }}\"\n"""
          p.write_text(text[:start]+block+text[end:])

          promotion='.github/workflows/autonomous-candidate-promotion.yml'
          p=Path(promotion); text=p.read_text()
          marker="""      - name: Preserve reviewed candidate outside worktree\n"""
          if marker not in text: raise SystemExit('promotion browser insert marker missing')
          browser="""      - name: Install candidate mobile browser runtime\n        run: |\n          npm install --no-save playwright\n          npx playwright install --with-deps chromium\n\n      - name: Candidate mobile browser QA before dev/main\n        id: browser_qa\n        continue-on-error: true\n        shell: bash\n        run: |\n          set -euo pipefail\n          mkdir -p qa-artifacts/autonomous-candidate-browser\n          node tools/autonomous-candidate-browser-qa.mjs \\\n            --source=\"$PROMOTE_CANDIDATE_PATH\" \\\n            --output=qa-artifacts/autonomous-candidate-browser/report.json \\\n            --screenshot=qa-artifacts/autonomous-candidate-browser/failure.png\n\n      - name: Upload candidate browser QA evidence\n        if: always()\n        uses: actions/upload-artifact@v4\n        with:\n          name: autonomous-candidate-browser-${{ github.run_id }}\n          path: qa-artifacts/autonomous-candidate-browser/\n          retention-days: 7\n          if-no-files-found: warn\n\n      - name: Persist browser failure feedback and retry same game\n        if: steps.browser_qa.outcome != 'success'\n        env:\n          GH_TOKEN: ${{ github.token }}\n        shell: bash\n        run: |\n          set -euo pipefail\n          cp qa-artifacts/autonomous-candidate-browser/report.json /tmp/autonomous-browser-qa.json\n          git checkout -B autonomous-dev origin/autonomous-dev\n          current=\"$(git rev-parse HEAD)\"\n          [ \"$current\" = \"$PROMOTE_SOURCE_COMMIT\" ] || { echo \"SOURCE_REVISION_MISMATCH current=$current expected=$PROMOTE_SOURCE_COMMIT\" >&2; exit 1; }\n          mkdir -p .autonomous/browser-failures\n          cp /tmp/autonomous-browser-qa.json \".autonomous/browser-failures/${PROMOTE_GAME_ID}.json\"\n          git config user.name 'jaewoon-browser-qa-feedback'\n          git config user.email 'browser-qa-feedback@users.noreply.github.com'\n          git add \".autonomous/browser-failures/${PROMOTE_GAME_ID}.json\"\n          if ! git diff --cached --quiet; then git commit -m \"qa: retain browser failure ${PROMOTE_GAME_ID} [skip ci]\"; git push origin HEAD:autonomous-dev; fi\n          gh workflow run autonomous-continuous-development.yml --repo \"$GITHUB_REPOSITORY\" --ref main -f priority_game_id=\"$PROMOTE_GAME_ID\"\n          echo 'BROWSER_QA_FEEDBACK_REQUEUED=YES'\n          exit 1\n\n"""
          p.write_text(text.replace(marker,browser+marker,1))
          replace_once(promotion,
          "          mkdir -p .autonomous/dev-history\n          node <<'NODE'",
          "          mkdir -p .autonomous/dev-history\n          rm -f \".autonomous/browser-failures/${PROMOTE_GAME_ID}.json\"\n          node <<'NODE'")
          replace_once(promotion,
          "          git add \"$PROMOTE_SOURCE_PATH\" \".autonomous/dev-history/${PROMOTE_CANDIDATE_ID}.json\"",
          "          git add \"$PROMOTE_SOURCE_PATH\" \".autonomous/dev-history/${PROMOTE_CANDIDATE_ID}.json\"\n          git add -A \".autonomous/browser-failures/${PROMOTE_GAME_ID}.json\" 2>/dev/null || true")
          PY
      - name: Verify capability upgrade
        run: |
          node --check tools/autonomous-development-worker.mjs
          node --check tools/autonomous-department-scope.mjs
          node --check tools/autonomous-candidate-browser-qa.mjs
          node --test qa/autonomous-development-worker.test.mjs
          node --test qa/autonomous-department-scope.test.mjs
          node --test qa/autonomous-candidate-browser-qa.test.mjs
          git diff --check
      - name: Commit isolated upgrade and remove patch workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/chatgpt-vibe2-capability-upgrade.yml
          git config user.name 'chatgpt-vibe2-upgrade'
          git config user.email 'chatgpt-vibe2-upgrade@users.noreply.github.com'
          git add tools/autonomous-development-worker.mjs tools/autonomous-department-scope.mjs tools/autonomous-candidate-browser-qa.mjs qa/autonomous-department-scope.test.mjs qa/autonomous-candidate-browser-qa.test.mjs .github/workflows/autonomous-continuous-development.yml .github/workflows/autonomous-candidate-promotion.yml
          git commit -m 'vibe2: strengthen parallel implementation and pre-release QA'
          git push origin HEAD:chatgpt/vibe2-capability-upgrade-20260909
