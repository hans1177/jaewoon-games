name: Owner Machine Doc Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/owner-machine-doc-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove legacy human-readable policy and handoff docs
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch AGENTS.md PROJECT_HANDOFF.md README.md STRUCTURE.md
          git rm -f --ignore-unmatch .github/workflows/owner-machine-doc-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: remove human-readable policy docs"
          git push origin HEAD:main
