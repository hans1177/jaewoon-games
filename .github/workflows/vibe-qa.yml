name: Vibe QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate asset manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('assets/asset-manifest.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data.get('version') == 1
          assert isinstance(data.get('approvedSources'), list)
          assert isinstance(data.get('assets'), list)
          blocked = set(data.get('policy', {}).get('blocked', []))
          assert {'NC', 'unknown'}.issubset(blocked)
          print('PASS asset manifest')
          PY

      - name: Check common web runtime syntax
        run: node --input-type=module --check < assets/vibe-runtime.js

      - name: Check game config syntax
        run: node --input-type=module --check < assets/game-config.js

      - name: Test game config behavior
        run: |
          cp assets/game-config.js /tmp/game-config.mjs
          node --input-type=module <<'NODE'
          import { JaewoonGameConfig, configValidators } from 'file:///tmp/game-config.mjs';
          const config = new JaewoonGameConfig({
            defaults: { player: { hp: 100 }, wave: { count: 20 } },
            validators: {
              'player.hp': configValidators.number({ min: 1, max: 99999, integer: true }),
              'wave.count': configValidators.number({ min: 1, max: 999, integer: true }),
            },
          });
          if (config.get('player.hp') !== 100) throw new Error('default config failed');
          config.set('player.hp', 130);
          if (config.get('player.hp') !== 130) throw new Error('set config failed');
          let rejected = false;
          try { config.set('player.hp', 0); } catch { rejected = true; }
          if (!rejected) throw new Error('invalid config was not rejected');
          console.log('PASS game config');
          NODE

      - name: Check game preset syntax
        run: node --input-type=module --check < assets/game-presets.js

      - name: Test game preset behavior
        run: |
          cp assets/game-presets.js /tmp/game-presets.mjs
          node --input-type=module <<'NODE'
          import { GAME_PRESETS, buildGamePreset } from 'file:///tmp/game-presets.mjs';
          const preset = buildGamePreset({ genre: 'rpg', multiplayer: true, aiCompanions: true, npcDialogue: true });
          if (!GAME_PRESETS.rpg) throw new Error('rpg preset missing');
          for (const required of ['inventory','quests','multiplayer-client','common-ai','gemini-helper']) {
            if (!preset.systems.includes(required)) throw new Error(`missing preset system: ${required}`);
          }
          if (!preset.rules.preserveExistingBalance || !preset.rules.preserveSaveFormat) throw new Error('preservation rules missing');
          let rejected = false;
          try { buildGamePreset({ genre: 'unknown' }); } catch { rejected = true; }
          if (!rejected) throw new Error('unknown preset was not rejected');
          console.log('PASS game presets');
          NODE

      - name: Reject files over 100 MB
        run: |
          python - <<'PY'
          from pathlib import Path
          limit = 100 * 1024 * 1024
          bad = []
          for p in Path('.').rglob('*'):
            if p.is_file() and '.git' not in p.parts and p.stat().st_size >= limit:
              bad.append((str(p), p.stat().st_size))
          if bad:
            for path, size in bad:
              print(f'ERROR oversized: {path} ({size} bytes)')
            raise SystemExit(1)
          print('PASS file size')
          PY

      - name: Report missing local HTML assets
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          missing = set()
          attrs = re.compile(r'''(?:src|href)=["']([^"']+)["']''', re.I)
          for html in list(Path('web-games').rglob('*.html')) + [Path('index.html')]:
            if not html.exists():
              continue
            text = html.read_text(encoding='utf-8', errors='ignore')
            for ref in attrs.findall(text):
              if ref.startswith(('http://','https://','//','#','data:','mailto:','tel:','javascript:')):
                continue
              clean = ref.split('#',1)[0].split('?',1)[0]
              if not clean or clean.startswith('/'):
                target = Path(clean.lstrip('/'))
              else:
                target = html.parent / clean
              if clean and not target.exists() and not clean.endswith('/'):
                missing.add(f'{html}: {ref}')
          if missing:
            print('WARN missing local references:')
            for item in sorted(missing):
              print(' -', item)
          else:
            print('PASS local HTML references')
          PY

      - name: QA summary
        run: |
          echo "Vibe QA complete"
          echo "- manifest validated"
          echo "- common runtime syntax checked"
          echo "- game config syntax and behavior checked"
          echo "- game preset syntax and behavior checked"
          echo "- 100 MB limit checked"
          echo "- missing local HTML references reported as warnings"
