name: Vibe QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate asset manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('assets/asset-manifest.json').read_text(encoding='utf-8'))
          assert data.get('version') == 1
          assert isinstance(data.get('approvedSources'), list)
          assert isinstance(data.get('assets'), list)
          assert {'NC', 'unknown'}.issubset(set(data.get('policy', {}).get('blocked', [])))
          print('PASS asset manifest')
          PY

      - name: Check all JavaScript syntax
        run: |
          for file in assets/*.js; do
            node --input-type=module --check < "$file"
          done
          node --input-type=module --check < qa/vibe-regression.mjs
          echo 'PASS JavaScript syntax'

      - name: Test core and common systems
        run: |
          node --input-type=module <<'NODE'
          import { JaewoonD20Rules } from './assets/d20-rules.js';
          import { JaewoonCharacterProgression } from './assets/character-progression.js';
          import { JaewoonInventoryEquipment } from './assets/inventory-equipment.js';
          import { JaewoonCraftingRecipes } from './assets/crafting-recipes.js';
          import { JaewoonAchievementsUnlocks } from './assets/achievements-unlocks.js';
          import { JaewoonStatModifiers } from './assets/stat-modifiers.js';
          import { JaewoonWaveSpawner } from './assets/wave-spawner.js';
          import { JaewoonDayNightCycle } from './assets/day-night-cycle.js';
          import { JaewoonResourceGathering } from './assets/resource-gathering.js';
          import { JaewoonStatusEffects } from './assets/status-effects.js';
          import { JaewoonCombatVitals } from './assets/combat-vitals.js';
          import { JaewoonTargetingSystem } from './assets/targeting-system.js';
          import { JaewoonCombatActions } from './assets/combat-actions.js';
          import { JaewoonProjectiles } from './assets/projectiles.js';
          const rules = new JaewoonD20Rules({ rng: () => 0.5 });
          if (rules.abilityModifier(18) !== 4) throw new Error('d20 failed');
          const progression = new JaewoonCharacterProgression({ maxLevel: 10, xpForLevel: (level) => (level - 1) * 100 });
          const hero = progression.createCharacter({ id: 'hero' });
          progression.addXp(hero, 250);
          if (hero.level !== 3) throw new Error('progression failed');
          const inventory = new JaewoonInventoryEquipment({ capacity: 5 });
          const inv = inventory.createState({ items: [{ id: 'wood', quantity: 3 }] });
          const crafting = new JaewoonCraftingRecipes({ inventory, recipes: [{ id: 'club', inputs: [{ id: 'wood', quantity: 3 }], outputs: [{ id: 'club', stackable: false }] }] });
          if (!crafting.craft(crafting.createState(), inv, 'club').ok || inventory.countItem(inv, 'club') !== 1) throw new Error('crafting failed');
          const stats = new JaewoonStatModifiers();
          const statState = stats.createState({ base: { hp: 100 } });
          stats.addModifier(statState, 'hp', { id: 'armor', flat: 50 });
          if (stats.calculate(statState, 'hp') !== 150) throw new Error('stat modifiers failed');
          const achievements = new JaewoonAchievementsUnlocks({ definitions: [{ id: 'first-kill', requirements: [{ key: 'kills', target: 1 }], rewards: { gold: 10 } }] });
          const achievementState = achievements.createState();
          if (!achievements.increment(achievementState, 'kills', 1).includes('first-kill')) throw new Error('achievement unlock failed');
          if (achievements.claimReward(achievementState, 'first-kill')?.gold !== 10) throw new Error('achievement reward failed');
          const waves = new JaewoonWaveSpawner({ waves: [{ id: 'w1', maxAlive: 1, groups: [{ enemyId: 'slime', count: 2, interval: 1 }] }] });
          waves.start(0);
          if (waves.update(0).length !== 1 || waves.progress().alive !== 1) throw new Error('wave spawn failed');
          const cycle = new JaewoonDayNightCycle({ dayDuration: 10, nightDuration: 5, startDay: 2 });
          cycle.update(10);
          if (!cycle.isNight() || cycle.status().day !== 2) throw new Error('day night failed');
          const gathering = new JaewoonResourceGathering({ rng: () => 0.5, nodes: [{ id: 'branch', resourceId: 'wood', minAmount: 1, maxAmount: 3, maxCharges: 2, respawnDelay: 5, phases: ['day'] }] });
          if (gathering.gather('branch', { day: 1, phase: 'day' }).quantity !== 2) throw new Error('resource gather failed');
          const effects = new JaewoonStatusEffects();
          effects.apply('hero', { id: 'poison', duration: 3, tickInterval: 1, magnitude: 5, stackMode: 'stack', maxStacks: 3 });
          if (!effects.update(1).some((e) => e.type === 'effect-tick')) throw new Error('status effects failed');
          const combat = new JaewoonCombatVitals({ entities: [{ id: 'hero', hp: 100, maxHp: 100, shield: 20, maxShield: 20 }, { id: 'near', hp: 50, maxHp: 50 }] });
          if (combat.damage('hero', 30).hpDamage !== 10) throw new Error('combat failed');
          const targeting = new JaewoonTargetingSystem({ entities: [{ id: 'tower', team: 'ally', x: 0, y: 0 }, { id: 'near', team: 'enemy', x: 3, y: 4, hp: 50, maxHp: 100, threat: 2 }] });
          if (targeting.select('tower', { teams: ['enemy'], range: 6, strategy: 'nearest' })?.id !== 'near') throw new Error('targeting failed');
          const actions = new JaewoonCombatActions({ targeting, combatVitals: combat, statusEffects: effects, rng: () => 0 });
          actions.register({ id: 'strike', damage: 10, range: 6, cooldown: 2, criticalChance: 1, criticalMultiplier: 2 });
          if (!actions.use('hero', 'strike', 'near').critical) throw new Error('combat action failed');
          const projectiles = new JaewoonProjectiles();
          projectiles.spawn({ id: 'p', position: { x: 0, y: 0 }, velocity: { x: 10, y: 0 }, lifetime: 2 });
          projectiles.update(0.5);
          if (projectiles.get('p')?.position.x !== 5) throw new Error('projectile failed');
          console.log('PASS core/common systems');
          NODE

      - name: Test game kit and session restore
        run: |
          node --input-type=module <<'NODE'
          import { createGameKit } from './assets/game-kit.js';
          import { buildGameBlueprint } from './assets/game-blueprint.js';
          import { createGameSession } from './assets/game-session.js';
          const config = { gameId: 'qa-game', inventoryEquipment: true, achievementsUnlocks: { definitions: [{ id: 'collector', requirements: [{ key: 'items', target: 2 }] }] }, versionedSave: { currentVersion: 2 } };
          const kit = createGameKit(config);
          kit.get('achievements').increment(kit.state.achievements, 'items', 2);
          const wrapped = kit.wrapSave();
          const restored = createGameKit(config);
          restored.restoreState(wrapped);
          if (!restored.get('achievements').isUnlocked(restored.state.achievements, 'collector')) throw new Error('achievement restore failed');
          for (const [genre, required] of [['survival', ['day-night-cycle','resource-gathering','combat-vitals','combat-actions']], ['defense', ['targeting-system','combat-actions']]]) {
            const blueprint = buildGameBlueprint({ gameId: `qa-${genre}`, genre });
            for (const system of required) if (!blueprint.systems.includes(system)) throw new Error(`${genre} system missing: ${system}`);
          }
          const storage = new Map();
          globalThis.localStorage = { getItem: (k) => storage.has(k) ? storage.get(k) : null, setItem: (k,v) => storage.set(k, String(v)), removeItem: (k) => storage.delete(k) };
          const options = { gameId: 'qa-session', genre: 'survival', autoRestore: false, dayNightOptions: { dayDuration: 10, nightDuration: 5 }, resourceOptions: { nodes: [{ id: 'stone', resourceId: 'stone', amount: 1, maxCharges: 1, respawnDelay: 4, phases: ['day'] }] }, combatActionOptions: { actions: [{ id: 'bite', damage: 5, range: 3, cooldown: 2 }] } };
          const session = createGameSession(options);
          session.registerCombatEntity({ id: 'player', hp: 50, maxHp: 50 });
          session.save();
          const restoredSession = createGameSession({ ...options, autoRestore: true });
          if (restoredSession.combatVitals.get('player').hp !== 50) throw new Error('session restore failed');
          session.destroy();
          restoredSession.destroy();
          console.log('PASS game kit/session restore');
          NODE

      - name: Run integrated regression
        run: node qa/vibe-regression.mjs

      - name: Check Godot common toolkit structure
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('godot-games/common-game-systems.gd').read_text(encoding='utf-8')
          for token in ['class_name JaewoonCommonGameSystems','create_inventory','start_quest','can_use_skill','roll_loot','migrate_save']:
            assert token in text, token
          print('PASS Godot common toolkit structure')
          PY

      - name: Repository hygiene
        run: |
          python - <<'PY'
          from pathlib import Path
          limit = 100 * 1024 * 1024
          bad = [(str(p), p.stat().st_size) for p in Path('.').rglob('*') if p.is_file() and '.git' not in p.parts and p.stat().st_size >= limit]
          if bad: raise SystemExit('\n'.join(f'{p}: {s}' for p, s in bad))
          print('PASS repository hygiene')
          PY
