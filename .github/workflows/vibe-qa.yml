name: Vibe QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate asset manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('assets/asset-manifest.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data.get('version') == 1
          assert isinstance(data.get('approvedSources'), list)
          assert isinstance(data.get('assets'), list)
          blocked = set(data.get('policy', {}).get('blocked', []))
          assert {'NC', 'unknown'}.issubset(blocked)
          print('PASS asset manifest')
          PY

      - name: Check common web runtime syntax
        run: node --input-type=module --check < assets/vibe-runtime.js

      - name: Check game config syntax
        run: node --input-type=module --check < assets/game-config.js

      - name: Test game config behavior
        run: |
          cp assets/game-config.js /tmp/game-config.mjs
          node --input-type=module <<'NODE'
          import { JaewoonGameConfig, configValidators } from 'file:///tmp/game-config.mjs';
          const config = new JaewoonGameConfig({
            defaults: { player: { hp: 100 }, wave: { count: 20 } },
            validators: {
              'player.hp': configValidators.number({ min: 1, max: 99999, integer: true }),
              'wave.count': configValidators.number({ min: 1, max: 999, integer: true }),
            },
          });
          if (config.get('player.hp') !== 100) throw new Error('default config failed');
          config.set('player.hp', 130);
          if (config.get('player.hp') !== 130) throw new Error('set config failed');
          let rejected = false;
          try { config.set('player.hp', 0); } catch { rejected = true; }
          if (!rejected) throw new Error('invalid config was not rejected');
          console.log('PASS game config');
          NODE

      - name: Check d20 rules syntax
        run: node --input-type=module --check < assets/d20-rules.js

      - name: Test d20 rules behavior
        run: |
          cp assets/d20-rules.js /tmp/d20-rules.mjs
          node --input-type=module <<'NODE'
          import { JaewoonD20Rules } from 'file:///tmp/d20-rules.mjs';
          const values = [0.95, 0.10, 0.75, 0.25, 0.5, 0.5, 0.5, 0.5];
          const rules = new JaewoonD20Rules({ rng: () => values.shift() ?? 0.5 });
          if (rules.abilityModifier(10) !== 0 || rules.abilityModifier(18) !== 4) throw new Error('ability modifier failed');
          if (rules.proficiencyBonus(1) !== 2 || rules.proficiencyBonus(5) !== 3 || rules.proficiencyBonus(17) !== 6) throw new Error('proficiency bonus failed');
          const advantage = rules.rollD20('advantage');
          if (advantage.natural !== 20 || advantage.rolls.length !== 2) throw new Error('advantage failed');
          const attack = rules.attackRoll({ attackBonus: 5, defense: 15 });
          if (!attack.hit) throw new Error('attack roll failed');
          const combatant = rules.createCombatant({ id: 'hero', hp: 20, maxHp: 20, defense: 14 });
          rules.applyDamage(combatant, 7);
          if (combatant.hp !== 13) throw new Error('damage apply failed');
          rules.heal(combatant, 99);
          if (combatant.hp !== 20) throw new Error('heal clamp failed');
          rules.setCondition(combatant, 'poisoned', true);
          if (!combatant.conditions.has('poisoned')) throw new Error('condition add failed');
          rules.setCondition(combatant, 'poisoned', false);
          if (combatant.conditions.has('poisoned')) throw new Error('condition remove failed');
          console.log('PASS d20 rules');
          NODE

      - name: Check turn combat syntax
        run: node --input-type=module --check < assets/turn-combat.js

      - name: Test turn combat behavior
        run: |
          cp assets/turn-combat.js /tmp/turn-combat.mjs
          node --input-type=module <<'NODE'
          import { JaewoonTurnCombat } from 'file:///tmp/turn-combat.mjs';
          const rules = {
            initiative: ({ modifier }) => ({ total: 10 + modifier }),
            attackRoll: ({ attackBonus, defense }) => ({ hit: 10 + attackBonus >= defense, critical: false, total: 10 + attackBonus }),
            damageRoll: ({ modifier = 0 }) => ({ total: 4 + modifier, rolls: [4], critical: false }),
          };
          const combat = new JaewoonTurnCombat({ rules });
          combat.addCombatant({ id: 'hero', team: 'a', hp: 20, maxHp: 20, defense: 12, initiativeModifier: 5 });
          combat.addCombatant({ id: 'ally', team: 'a', hp: 10, maxHp: 10, defense: 10, initiativeModifier: 1 });
          combat.addCombatant({ id: 'enemy', team: 'b', hp: 6, maxHp: 6, defense: 10, initiativeModifier: 3 });
          combat.addCombatant({ id: 'enemy2', team: 'b', hp: 5, maxHp: 5, defense: 10, initiativeModifier: -1 });
          const first = combat.start();
          if (first.id !== 'hero' || combat.round !== 1) throw new Error('turn order failed');
          combat.addCondition('hero', 'focus', { rounds: 1 });
          const hit = combat.attack({ attackerId: 'hero', targetId: 'enemy', attackBonus: 2, damage: { modifier: 2 } });
          if (!hit.attack.hit || combat.getCombatant('enemy').hp !== 0) throw new Error('attack resolution failed');
          const next = combat.nextTurn();
          if (!next || next.id !== 'ally') throw new Error('defeated combatant skip failed');
          combat.applyDamage('enemy2', 5, 'hero');
          if (!combat.finished || combat.livingTeams()[0] !== 'a') throw new Error('combat end failed');
          const snapshot = combat.snapshot();
          if (!Array.isArray(snapshot.combatants) || snapshot.combatants.length !== 4) throw new Error('snapshot failed');
          console.log('PASS turn combat');
          NODE

      - name: Check character progression syntax
        run: node --input-type=module --check < assets/character-progression.js

      - name: Test character progression behavior
        run: |
          cp assets/character-progression.js /tmp/character-progression.mjs
          node --input-type=module <<'NODE'
          import { JaewoonCharacterProgression } from 'file:///tmp/character-progression.mjs';
          const progression = new JaewoonCharacterProgression({ maxLevel: 10, xpForLevel: (level) => (level - 1) * 100 });
          const hero = progression.createCharacter({ id: 'hero', attributes: { power: 5 }, statPoints: 1, skillPoints: 2 });
          progression.setResource(hero, 'mana', 8, 10);
          const result = progression.addXp(hero, 250, { statPointsPerLevel: 1, skillPointsPerLevel: 2 });
          if (result.afterLevel !== 3 || result.levelsGained !== 2) throw new Error('level up failed');
          if (!progression.spendStatPoints(hero, 'power', 2, { gainPerPoint: 3 })) throw new Error('stat point spend failed');
          progression.changeResource(hero, 'mana', 99);
          const restored = progression.restore(progression.snapshot(hero));
          if (restored.level !== 3 || restored.attributes.power !== 11 || restored.resources.mana.current !== 10) throw new Error('progression restore failed');
          console.log('PASS character progression');
          NODE

      - name: Check new common system syntax
        run: |
          for file in assets/inventory-equipment.js assets/quest-dialogue.js assets/skill-effects.js assets/economy-loot-shop.js assets/save-versioning.js; do
            node --input-type=module --check < "$file"
          done

      - name: Test new common game systems
        run: |
          cp assets/inventory-equipment.js /tmp/inventory-equipment.mjs
          cp assets/quest-dialogue.js /tmp/quest-dialogue.mjs
          cp assets/skill-effects.js /tmp/skill-effects.mjs
          cp assets/economy-loot-shop.js /tmp/economy-loot-shop.mjs
          cp assets/save-versioning.js /tmp/save-versioning.mjs
          node --input-type=module <<'NODE'
          import { JaewoonInventoryEquipment } from 'file:///tmp/inventory-equipment.mjs';
          import { JaewoonQuestDialogue } from 'file:///tmp/quest-dialogue.mjs';
          import { JaewoonSkillEffects } from 'file:///tmp/skill-effects.mjs';
          import { JaewoonEconomyLootShop } from 'file:///tmp/economy-loot-shop.mjs';
          import { JaewoonSaveVersioning } from 'file:///tmp/save-versioning.mjs';

          const inventoryEngine = new JaewoonInventoryEquipment({ capacity: 5, stackLimit: 10 });
          const inventory = inventoryEngine.createState({ currencies: { gold: 20 } });
          if (!inventoryEngine.addItem(inventory, { id: 'potion', quantity: 3 })) throw new Error('inventory add failed');
          if (!inventoryEngine.addItem(inventory, { id: 'sword', equipSlot: 'weapon', stackable: false })) throw new Error('equipment add failed');
          if (!inventoryEngine.equip(inventory, 'sword') || inventory.equipment.weapon?.id !== 'sword') throw new Error('equip failed');
          if (!inventoryEngine.removeItem(inventory, 'potion', 2) || inventoryEngine.countItem(inventory, 'potion') !== 1) throw new Error('inventory remove failed');

          const questEngine = new JaewoonQuestDialogue();
          const quests = questEngine.createState();
          questEngine.startQuest(quests, { id: 'q1', objectives: [{ id: 'kill', target: 2 }], rewards: [{ id: 'coin', quantity: 3 }] });
          questEngine.progress(quests, 'q1', 'kill', 2);
          if (quests.quests.q1.status !== 'ready' || !questEngine.completeQuest(quests, 'q1')) throw new Error('quest completion failed');
          const choice = questEngine.chooseDialogue({ choices: [{ id: 'yes', next: 'n2', requirements: { flags: { met: true } } }] }, 'yes', { flags: { met: true } });
          if (choice?.next !== 'n2') throw new Error('dialogue choice failed');

          const skillEngine = new JaewoonSkillEffects();
          const skills = skillEngine.createState();
          skillEngine.setResource(skills, 'mana', 10, 10);
          if (!skillEngine.useSkill(skills, { id: 'fire', costs: { mana: 3 }, cooldown: 2 })) throw new Error('skill use failed');
          if (skillEngine.canUseSkill(skills, { id: 'fire' })) throw new Error('cooldown block failed');
          skillEngine.addEffect(skills, { id: 'burn', kind: 'debuff', duration: 2 });
          skillEngine.tick(skills, 2);
          if (skillEngine.hasEffect(skills, 'burn') || skills.cooldowns.fire !== 0) throw new Error('effect/cooldown tick failed');

          const rolls = [0.1, 0.5];
          const economy = new JaewoonEconomyLootShop({ rng: () => rolls.shift() ?? 0.5 });
          const loot = economy.rollLoot([{ id: 'gem', chance: 1, min: 1, max: 2 }]);
          if (loot.length !== 1 || loot[0].id !== 'gem') throw new Error('loot failed');
          const wallet = economy.createWallet({ gold: 10 });
          const bought = economy.buy({ wallet, listing: { price: { gold: 5 }, item: { id: 'potion', quantity: 1 } }, addItem: (item) => inventoryEngine.addItem(inventory, item) });
          if (!bought || wallet.gold !== 5) throw new Error('shop buy failed');

          const saves = new JaewoonSaveVersioning({ currentVersion: 2 });
          saves.registerMigration(1, (payload) => ({ ...payload, data: { ...payload.data, migrated: true } }));
          const migrated = saves.load({ version: 1, gameId: 'test', data: { score: 7 } }, { expectedGameId: 'test' });
          if (!migrated.migrated || migrated.score !== 7) throw new Error('save migration failed');
          let futureRejected = false;
          try { saves.load({ version: 3, gameId: 'test', data: {} }); } catch { futureRejected = true; }
          if (!futureRejected) throw new Error('future save was not rejected');
          console.log('PASS common game systems');
          NODE

      - name: Check Godot common toolkit structure
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('godot-games/common-game-systems.gd').read_text(encoding='utf-8')
          required = ['class_name JaewoonCommonGameSystems','create_inventory','start_quest','can_use_skill','roll_loot','migrate_save']
          for token in required:
            assert token in text, token
          print('PASS Godot common toolkit structure')
          PY

      - name: Check game preset syntax
        run: node --input-type=module --check < assets/game-presets.js

      - name: Test game preset behavior
        run: |
          cp assets/game-presets.js /tmp/game-presets.mjs
          node --input-type=module <<'NODE'
          import { GAME_PRESETS, buildGamePreset } from 'file:///tmp/game-presets.mjs';
          const preset = buildGamePreset({
            genre: 'rpg', multiplayer: true, aiCompanions: true, npcDialogue: true,
            d20Rules: true, turnBasedCombat: true, characterProgression: true,
            inventoryEquipment: true, questDialogue: true, skillEffects: true,
            economySystems: true, versionedSave: true,
          });
          if (!GAME_PRESETS.rpg) throw new Error('rpg preset missing');
          for (const required of ['multiplayer-client','common-ai','gemini-helper','d20-rules','turn-combat','character-progression','inventory-equipment','quest-dialogue','skill-effects','economy-loot-shop','save-versioning']) {
            if (!preset.systems.includes(required)) throw new Error(`missing preset system: ${required}`);
          }
          if (!preset.rules.saveMigrationsRequiredForBreakingChanges || !preset.rules.commonSystemsOptional) throw new Error('new preservation rules missing');
          const hybrid = buildGamePreset({ genre: 'rpg', mixGenres: ['defense'], extras: { systems: ['custom-turn-action'] }, remove: { systems: ['shops'] } });
          if (!hybrid.systems.includes('waves') || hybrid.systems.includes('shops')) throw new Error('hybrid/remove failed');
          console.log('PASS game presets');
          NODE

      - name: Reject files over 100 MB
        run: |
          python - <<'PY'
          from pathlib import Path
          limit = 100 * 1024 * 1024
          bad = []
          for p in Path('.').rglob('*'):
            if p.is_file() and '.git' not in p.parts and p.stat().st_size >= limit:
              bad.append((str(p), p.stat().st_size))
          if bad:
            for path, size in bad:
              print(f'ERROR oversized: {path} ({size} bytes)')
            raise SystemExit(1)
          print('PASS file size')
          PY

      - name: Report missing local HTML assets
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          missing = set()
          attrs = re.compile(r'''(?:src|href)=["']([^"']+)["']''', re.I)
          for html in list(Path('web-games').rglob('*.html')) + [Path('index.html')]:
            if not html.exists():
              continue
            text = html.read_text(encoding='utf-8', errors='ignore')
            for ref in attrs.findall(text):
              if ref.startswith(('http://','https://','//','#','data:','mailto:','tel:','javascript:')):
                continue
              clean = ref.split('#',1)[0].split('?',1)[0]
              if not clean or clean.startswith('/'):
                target = Path(clean.lstrip('/'))
              else:
                target = html.parent / clean
              if clean and not target.exists() and not clean.endswith('/'):
                missing.add(f'{html}: {ref}')
          if missing:
            print('WARN missing local references:')
            for item in sorted(missing):
              print(' -', item)
          else:
            print('PASS local HTML references')
          PY

      - name: QA summary
        run: |
          echo "Vibe QA complete"
          echo "- manifest/runtime/config checked"
          echo "- d20/turn combat/progression checked"
          echo "- inventory/quest/skills/economy/versioned save checked"
          echo "- Godot common toolkit structure checked"
          echo "- preset composition checked"
          echo "- file size and local references checked"
