name: Department Experience

on:
  workflow_run:
    workflows: ["Vibe QA"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: department-experience-main
  cancel-in-progress: false

jobs:
  award:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync main
        run: git pull --ff-only origin main

      - name: Award verified department XP
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node tools/award-department-experience.mjs "$SOURCE_SHA" "$SOURCE_RUN_ID"

      - name: Commit XP state when changed
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          git config user.name "jaewoon-company-ai"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            if [ "$attempt" -gt 1 ]; then
              echo "main moved while recording XP; refreshing before retry $attempt/5"
              git fetch origin main
              git reset --hard origin/main
              node tools/award-department-experience.mjs "$SOURCE_SHA" "$SOURCE_RUN_ID"
            fi

            if git diff --quiet -- department-experience.json assets/department-experience-state.js; then
              echo "No new verified XP to record."
              exit 0
            fi

            git add department-experience.json assets/department-experience-state.js
            git commit -m "company-xp: record verified department experience [skip ci]"

            if git push origin HEAD:main; then
              exit 0
            fi
          done

          echo "Failed to record verified XP after 5 fresh-main attempts."
          exit 1
