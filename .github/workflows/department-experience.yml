name: Department Experience

on:
  workflow_run:
    workflows: ["Vibe QA"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: department-experience-pr
  cancel-in-progress: false

jobs:
  award:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync main
        run: git pull --ff-only origin main

      - name: Award verified department XP
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node tools/award-department-experience.mjs "$SOURCE_SHA" "$SOURCE_RUN_ID"

      - name: Propose XP state through PR when changed
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "jaewoon-company-ai"
          git config user.email "actions@users.noreply.github.com"

          if git diff --quiet -- department-experience.json assets/department-experience-state.js; then
            echo "No new verified XP to record."
            exit 0
          fi

          branch="automation/department-experience-${SOURCE_RUN_ID}-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git add -- department-experience.json assets/department-experience-state.js
          git commit -m "company-xp: record verified department experience [skip ci]"
          git push origin "HEAD:refs/heads/$branch"

          pr_url="$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$branch" \
            --title "company-xp: record verified department experience" \
            --body "Verified department experience update from Vibe QA.\n\n- source SHA: ${SOURCE_SHA}\n- source run: ${SOURCE_RUN_ID}\n- workflow run: ${GITHUB_RUN_ID}\n- direct main write: NO")"

          echo "DEPARTMENT_EXPERIENCE_PR=$pr_url"
          echo "PUBLIC_MAIN_WRITE=NO"
