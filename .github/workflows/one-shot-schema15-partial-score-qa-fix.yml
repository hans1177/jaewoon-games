name: One Shot Schema15 Partial Score QA Fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-schema15-partial-score-qa-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Align stale zero-score assertions with schema15 partial scoring
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='qa/company-web-validation-evidence-contract.test.mjs';
          let text=fs.readFileSync(file,'utf8');
          const replacements=[
            ["test('tower-defense keywords do not earn placement, tower variety, or strategy points without runtime outcomes',()=>{","test('tower-defense keywords cannot substitute for full runtime placement, role diversity, or strategy evidence',()=>{"],
            ["  assert.equal(shallow.scores.CATEGORY_PLACEMENT_MEANING,0);","  assert.ok(shallow.scores.CATEGORY_PLACEMENT_MEANING<WEB_CATEGORY_SCORE_WEIGHTS.TOWER_DEFENSE.PLACEMENT_MEANING);"],
            ["  assert.equal(shallow.scores.CATEGORY_TOWER_ROLE_DISTINCTNESS,0);","  assert.ok(shallow.scores.CATEGORY_TOWER_ROLE_DISTINCTNESS<WEB_CATEGORY_SCORE_WEIGHTS.TOWER_DEFENSE.TOWER_ROLE_DISTINCTNESS);"],
            ["  assert.equal(shallow.scores.CATEGORY_ECONOMY_AND_STRATEGY,0);","  assert.ok(shallow.scores.CATEGORY_ECONOMY_AND_STRATEGY<WEB_CATEGORY_SCORE_WEIGHTS.TOWER_DEFENSE.ECONOMY_AND_STRATEGY);"],
            ["test('many score++ controls backed by one function count as roughly one functional UI',()=>{","test('many score++ controls backed by one function cannot earn full functional UI credit',()=>{"],
            ["  assert.ok(result.scores.FUNCTIONAL_UI_UX<=1,result.scores.FUNCTIONAL_UI_UX);","  assert.ok(result.scores.FUNCTIONAL_UI_UX<WEB_COMMON_SCORE_WEIGHTS.FUNCTIONAL_UI_UX,result.scores.FUNCTIONAL_UI_UX);"],
          ];
          for(const [from,to] of replacements){
            const count=text.split(from).length-1;
            if(count!==1)throw new Error(`EXPECTED_EXACTLY_ONE_MATCH:${count}:${from}`);
            text=text.replace(from,to);
          }
          fs.writeFileSync(file,text);
          NODE
          rm '.github/workflows/one-shot-schema15-partial-score-qa-fix.yml'
          git config user.name 'jaewoon-company-ai'
          git config user.email 'actions@users.noreply.github.com'
          git add -- qa/company-web-validation-evidence-contract.test.mjs .github/workflows/one-shot-schema15-partial-score-qa-fix.yml
          git commit -m 'qa: align schema15 partial-score expectations'
          git pull --rebase origin main
          git push origin HEAD:main
