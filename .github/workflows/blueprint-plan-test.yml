name: Game Blueprint Plan Test

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test blueprint planning
        run: |
          rm -rf /tmp/jaewoon-blueprint-plan
          mkdir -p /tmp/jaewoon-blueprint-plan
          cp assets/game-blueprint.js assets/game-presets.js assets/game-kit.js assets/d20-rules.js assets/turn-combat.js assets/character-progression.js assets/inventory-equipment.js assets/quest-dialogue.js assets/skill-effects.js assets/economy-loot-shop.js assets/save-versioning.js /tmp/jaewoon-blueprint-plan/
          printf '{"type":"module"}\n' > /tmp/jaewoon-blueprint-plan/package.json
          cd /tmp/jaewoon-blueprint-plan
          node --check game-blueprint.js
          node --input-type=module <<'NODE'
          import { buildGameBlueprint, DEFAULT_ASSET_POLICY } from './game-blueprint.js';
          const plan = buildGameBlueprint({
            gameId: 'qa-survival-rpg',
            genre: 'survival',
            mixGenres: ['rpg'],
            presetOptions: { d20Rules: true, turnBasedCombat: true },
          });
          if (!plan.materialPlan.categories.includes('player')) throw new Error('material category missing');
          if (!plan.materialPlan.workflow.includes('verify-license-per-asset')) throw new Error('license workflow missing');
          if (!plan.materialPlan.policy.preferExistingAssets || !plan.materialPlan.policy.downloadOnDemand) throw new Error('asset policy missing');
          if (!DEFAULT_ASSET_POLICY.blockedLicenses.includes('unknown')) throw new Error('blocked license policy missing');
          if (!plan.qaPlan.checks.includes('d20-rolls') || !plan.qaPlan.checks.includes('day-night-loop')) throw new Error('qa plan missing');
          const summary = plan.plan();
          if (!summary.preservation.preserveExistingBalance || !summary.preservation.preserveSaveFormat) throw new Error('preservation plan missing');
          const custom = buildGameBlueprint({
            gameId: 'custom',
            genre: 'puzzle',
            assetPlanOptions: { policy: { maxSingleAssetBytes: 1234 } },
          });
          if (custom.materialPlan.policy.maxSingleAssetBytes !== 1234) throw new Error('asset policy override failed');
          console.log('PASS blueprint planning');
          NODE
