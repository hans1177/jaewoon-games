name: Company Bridge Export

on:
  push:
    branches: [main]
    paths:
      - 'autonomous-portfolio.json'
      - 'public-game-health.json'
      - 'company-learning/company-dna.json'
      - 'game-artbooks.json'
      - 'tools/company-bridge-export.mjs'
      - 'qa/company-bridge-export.test.mjs'
      - '.github/workflows/company-bridge-export.yml'
  workflow_run:
    workflows: ['Autonomous Candidate Promotion']
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * *' # 21:30 KST safety refresh

permissions:
  contents: write

concurrency:
  group: company-bridge-export
  cancel-in-progress: true

jobs:
  export:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tools/company-bridge-export.mjs
      - run: node --test qa/company-bridge-export.test.mjs
      - run: node tools/company-bridge-export.mjs
      - name: Persist safe snapshot only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "jaewoon-company-bridge"
          git config user.email "actions@users.noreply.github.com"
          git add -f company-bridge/games-status.json
          if git diff --cached --quiet; then echo 'BRIDGE_CHANGE=NO'; exit 0; fi
          git commit -m "bridge: refresh safe games status [skip ci]"
          git pull --rebase origin main
          git push origin main
          echo 'BRIDGE_SECRETS=NO'
          echo 'PUBLIC_GAME_CODE_WRITE=NO'
