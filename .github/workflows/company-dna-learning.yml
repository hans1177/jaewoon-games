name: Company DNA Learning

on:
  push:
    branches: [main]
    paths:
      - 'tools/company-dna-learning.mjs'
      - 'tools/department-learning-memory.mjs'
      - 'tools/evolution-evidence-recorder.mjs'
      - 'tools/vibe2-weight-learning.mjs'
      - 'tools/vibe2-distillation-status.mjs'
      - 'qa/company-dna-learning.test.mjs'
      - 'qa/department-learning-memory.test.mjs'
      - 'qa/vibe2-weight-learning.test.mjs'
      - 'qa/vibe2-distillation-status.test.mjs'
      - 'company-learning/**'
      - '.github/workflows/company-dna-learning.yml'
  pull_request:
    paths:
      - 'tools/company-dna-learning.mjs'
      - 'tools/department-learning-memory.mjs'
      - 'tools/evolution-evidence-recorder.mjs'
      - 'tools/autonomous-department-cycle.mjs'
      - 'tools/vibe2-weight-learning.mjs'
      - 'tools/vibe2-distillation-status.mjs'
      - 'qa/company-dna-learning.test.mjs'
      - 'qa/department-learning-memory.test.mjs'
      - 'qa/vibe2-weight-learning.test.mjs'
      - 'qa/vibe2-distillation-status.test.mjs'
      - '.github/workflows/company-dna-learning.yml'
  workflow_run:
    workflows: ['Autonomous Candidate Promotion']
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '10 14 * * 0' # 23:10 KST Sunday, after weekly review

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: company-dna-learning
  cancel-in-progress: false

jobs:
  learn:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tools/company-dna-learning.mjs
      - run: node --check tools/department-learning-memory.mjs
      - run: node --check tools/evolution-evidence-recorder.mjs
      - run: node --check tools/autonomous-department-cycle.mjs
      - run: node --check tools/vibe2-weight-learning.mjs
      - run: node --check tools/vibe2-distillation-status.mjs
      - run: node --test qa/company-dna-learning.test.mjs
      - run: node --test qa/department-learning-memory.test.mjs
      - run: node --test qa/vibe2-weight-learning.test.mjs
      - run: node --test qa/vibe2-distillation-status.test.mjs
      - name: Deterministic evidence ingestion
        run: node tools/company-dna-learning.mjs
      - name: Ingest independent-QA verified department outcomes
        run: node tools/department-learning-memory.mjs --evidence-dir=company-learning/evidence --ledger=department-experience.json
      - name: Refresh distillation readiness
        run: node tools/vibe2-distillation-status.mjs --evidence-dir=company-learning/evidence --sample-dir=company-learning/training-samples --out=company-learning/distillation-status.json
      - name: Guard company-standard authority
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "jayApproved===true" tools/company-dna-learning.mjs
          grep -Fq "selfPromote:false" tools/company-dna-learning.mjs
          grep -Fq "structured learning must not mutate XP/history authority" tools/department-learning-memory.mjs
          grep -Fq "LOCAL_SELF_HOSTED_ONLY" tools/vibe2-distillation-status.mjs
          grep -Fq "FIXED_HOLDOUT_AB_THEN_CANARY" tools/vibe2-distillation-status.mjs
          echo 'DNA_SELF_PROMOTION=NO'
          echo 'DEPARTMENT_LEARNING_EXPANDS_AUTHORITY=NO'
          echo 'DISTILLATION_AUTO_PROMOTION=NO'
      - name: Persist refreshed memory through checked PR
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "jaewoon-company-learning"
          git config user.email "actions@users.noreply.github.com"
          git add company-learning/company-dna.json company-learning/distillation-status.json department-experience.json
          if git diff --cached --quiet; then
            echo 'LEARNING_MEMORY_CHANGE=NO'
            exit 0
          fi

          safe_run="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          branch="automation/company-dna-memory-${safe_run}"
          git checkout -b "$branch"
          git commit -m "learning: refresh Company DNA, department memory and distillation status"
          learning_commit="$(git rev-parse HEAD)"
          git push origin "HEAD:$branch"
          pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title "learning: refresh Company DNA memory" --body "Deterministic verified-evidence refresh. No game source changes. Direct main write: NO. Run: ${GITHUB_RUN_ID}")"
          sleep 5
          gh pr checks "$pr_url" --watch --fail-fast --interval 10
          git fetch origin main --quiet
          gh pr merge "$pr_url" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
          git fetch origin main --quiet
          for file in company-learning/company-dna.json company-learning/distillation-status.json department-experience.json; do
            git diff --quiet "$learning_commit" origin/main -- "$file"
          done
          echo 'PUBLIC_GAME_CODE_WRITE=NO'
          echo 'VERIFIED_DEPARTMENT_MEMORY_WRITE=YES'
          echo 'DISTILLATION_STATUS_WRITE=YES'
          echo 'DIRECT_MAIN_WRITE=NO'
