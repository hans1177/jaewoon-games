name: Game Timers Test

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test game timers and session integration
        run: |
          rm -rf /tmp/jaewoon-timers
          mkdir -p /tmp/jaewoon-timers
          cp assets/game-timers.js assets/game-session.js assets/state-machine.js assets/scene-flow.js assets/input-actions.js assets/game-loop.js assets/vibe-runtime.js assets/game-blueprint.js assets/game-presets.js assets/game-kit.js assets/d20-rules.js assets/turn-combat.js assets/character-progression.js assets/inventory-equipment.js assets/quest-dialogue.js assets/skill-effects.js assets/economy-loot-shop.js assets/save-versioning.js /tmp/jaewoon-timers/
          printf '{"type":"module"}\n' > /tmp/jaewoon-timers/package.json
          cd /tmp/jaewoon-timers
          node --check game-timers.js
          node --check game-session.js
          node --input-type=module <<'NODE'
          import { JaewoonGameTimers } from './game-timers.js';
          import { createGameSession } from './game-session.js';
          import { buildGamePreset } from './game-presets.js';

          let fires = 0;
          const timers = new JaewoonGameTimers();
          timers.create('spawn', { duration: 1, repeat: true, interval: 1, onFire: () => { fires += 1; } });
          timers.update(0.4);
          if (timers.remaining('spawn') !== 0.6) throw new Error('timer countdown failed');
          timers.update(0.6);
          if (fires !== 1 || timers.get('spawn').fires !== 1) throw new Error('repeat timer fire failed');
          timers.pause('spawn');
          timers.update(5);
          if (fires !== 1) throw new Error('paused timer advanced');
          timers.resume('spawn');
          timers.update(2.1);
          if (fires !== 3) throw new Error('repeat catch-up failed');

          timers.create('boss', { duration: 3, data: { wave: 10 } });
          timers.update(1.25);
          const snapshot = timers.snapshot();
          const restoredTimers = new JaewoonGameTimers();
          restoredTimers.restore(snapshot);
          if (Math.abs(restoredTimers.remaining('boss') - 1.75) > 1e-9) throw new Error('timer restore failed');
          if (restoredTimers.get('boss').data.wave !== 10) throw new Error('timer data restore failed');

          const storage = new Map();
          globalThis.localStorage = {
            getItem: (key) => storage.has(key) ? storage.get(key) : null,
            setItem: (key, value) => storage.set(key, String(value)),
            removeItem: (key) => storage.delete(key),
          };
          const session = createGameSession({
            gameId: 'timer-session', genre: 'defense', autoRestore: false,
            timerOptions: { timers: { wave: { duration: 7 } } },
          });
          session.updateTimers(2.5);
          session.save();
          const restored = createGameSession({
            gameId: 'timer-session', genre: 'defense',
            timerOptions: { timers: { wave: { duration: 7 } } },
          });
          if (Math.abs(restored.getTimer('wave').remaining - 4.5) > 1e-9) throw new Error('session timer restore failed');
          restored.destroy();

          const preset = buildGamePreset({ genre: 'defense' });
          if (!preset.systems.includes('game-timers')) throw new Error('game-timers missing from preset');
          if (!preset.qa.includes('game-timers') || !preset.qa.includes('timer-restore')) throw new Error('timer QA missing');
          console.log('PASS game timers');
          NODE
