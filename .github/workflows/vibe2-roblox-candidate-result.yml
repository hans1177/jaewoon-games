name: Vibe2 Roblox Candidate Result

on:
  workflow_run:
    workflows:
      - Vibe2 Roblox Candidate Runtime
    types:
      - completed

permissions:
  contents: write
  actions: write

concurrency:
  group: vibe2-control-state-vibe2-unreal-core
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download candidate machine context from Studio QA run
        uses: actions/download-artifact@v4
        with:
          name: vibe2-roblox-candidate-context-${{ github.event.workflow_run.id }}
          path: /tmp/vibe2-roblox-candidate-context
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Resolve verified candidate identity
        id: context
        shell: bash
        run: |
          set -euo pipefail
          file='/tmp/vibe2-roblox-candidate-context/vibe2-roblox-candidate-context.json'
          test -s "$file"
          node - "$file" <<'NODE'
          const fs=require('fs');
          const file=process.argv[2];
          const x=JSON.parse(fs.readFileSync(file,'utf8'));
          const branch=String(x.candidateBranch||'').trim();
          const sha=String(x.candidateSha||'').trim();
          if(!branch.startsWith('vibe2/candidate/OWNER-ROBLOX-OBBY-'))throw new Error(`invalid candidate branch: ${branch}`);
          if(!/^[0-9a-f]{40}$/i.test(sha))throw new Error(`invalid candidate sha: ${sha}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`candidate_branch=${branch}\ncandidate_sha=${sha}\n`);
          console.log(`VIBE2_ROBLOX_RESULT_CANDIDATE=${branch}`);
          console.log(`VIBE2_ROBLOX_RESULT_SHA=${sha}`);
          NODE

      - name: Checkout Vibe2 control line
        uses: actions/checkout@v4
        with:
          ref: vibe2-unreal-core
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconcile Studio evidence into machine queue
        id: reconcile
        env:
          CONTROL_BRANCH: vibe2-unreal-core
          CANDIDATE_BRANCH: ${{ steps.context.outputs.candidate_branch }}
          QA_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          QA_RUN_ID: ${{ github.event.workflow_run.id }}
          QA_HEAD_SHA: ${{ steps.context.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-vibe2-verifier'
          git config user.email 'vibe2-verifier@users.noreply.github.com'
          persisted=0
          final_continue=0
          for attempt in 1 2 3; do
            git fetch origin "$CONTROL_BRANCH"
            git checkout -B "$CONTROL_BRANCH" "origin/$CONTROL_BRANCH"
            node tools/vibe2-candidate-reconcile.mjs \
              --branch="$CANDIDATE_BRANCH" \
              --target=roblox \
              --conclusion="$QA_CONCLUSION" \
              --run-id="$QA_RUN_ID" \
              --head-sha="$QA_HEAD_SHA" | tee /tmp/vibe2-roblox-reconcile.log
            updated=0
            continue_work=0
            grep -q 'VIBE2_RECONCILE_UPDATED=YES' /tmp/vibe2-roblox-reconcile.log && updated=1 || true
            grep -q 'VIBE2_RECONCILE_CONTINUE=YES' /tmp/vibe2-roblox-reconcile.log && continue_work=1 || true
            if [ "$updated" != 1 ]; then
              echo 'updated=0' >> "$GITHUB_OUTPUT"
              echo 'continue_work=0' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git add .vibe2/queue.json
            if git diff --cached --quiet; then
              echo 'updated=0' >> "$GITHUB_OUTPUT"
              echo 'continue_work=0' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "vibe2: record Roblox candidate verification ${QA_RUN_ID} [skip ci]"
            if git push origin "HEAD:$CONTROL_BRANCH"; then
              persisted=1
              final_continue="$continue_work"
              break
            fi
            sleep $((attempt * 2))
          done
          test "$persisted" = 1
          echo 'updated=1' >> "$GITHUB_OUTPUT"
          echo "continue_work=$final_continue" >> "$GITHUB_OUTPUT"
          echo 'VIBE2_VERIFIER_ENGINE_EDITOR_WRITE=NO'
          echo 'VIBE2_AUTO_MAIN_PROMOTION=NO'
          echo 'VIBE2_AUTO_FINAL_PASS=NO'
          echo 'VIBE2_AUTO_LEARNING=NO_UNTIL_VERIFIED_REVIEW'

      - name: Dispatch Studio-verified candidate to release review gate
        if: steps.reconcile.outputs.updated == '1' && github.event.workflow_run.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_BRANCH: ${{ steps.context.outputs.candidate_branch }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run vibe2-candidate-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f candidate_branch="$CANDIDATE_BRANCH"
          echo "VIBE2_ROBLOX_RELEASE_GATE_DISPATCHED=$CANDIDATE_BRANCH"

      - name: Refill Vibe work after verification releases capacity
        if: steps.reconcile.outputs.updated == '1' && steps.reconcile.outputs.continue_work == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run vibe2-24h-runner.yml --repo "$GITHUB_REPOSITORY" --ref vibe2-unreal-core
          echo 'VIBE2_ROBLOX_VERIFICATION_REFILL=YES'
