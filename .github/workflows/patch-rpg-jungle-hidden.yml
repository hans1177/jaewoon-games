name: Patch RPG jungle hidden quest
on:
  push:
    paths:
      - '.github/workflows/patch-rpg-jungle-hidden.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch rpg.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('rpg.html')
          s=p.read_text(encoding='utf-8')
          if 'RPG_PATCH_V7_JUNGLE' in s:
              raise SystemExit(0)
          def rep(old,new):
              global s
              if old not in s:
                  raise RuntimeError('missing replace: '+old[:100])
              s=s.replace(old,new,1)
          def span(a,b,new):
              global s
              i=s.index(a); j=s.index(b,i)
              s=s[:i]+new+s[j:]

          rep('// 그래픽/오디오는 외부 파일 0개. WebAudio + Canvas만 사용.','// 그래픽/오디오는 외부 파일 0개. WebAudio + Canvas만 사용.\n// RPG_PATCH_V7_JUNGLE')
          rep('.row{display:flex;gap:6px;flex-wrap:wrap}.pill,#quest,#area{','.row{display:flex;gap:6px;flex-wrap:wrap}.pill,#quest,#hiddenQuest,#area{')
          rep('#quest,#area{margin-top:5px;max-width:340px}','#quest,#hiddenQuest,#area{margin-top:5px;max-width:355px}#hiddenQuest{display:none;border-color:#b985ff;background:#201434dd;color:#eadbff}')
          rep('<span class="pill" id="weaponText">맨손</span><span class="pill" id="xpText">','<span class="pill" id="weaponText">맨손</span><span class="pill" id="armorText">방어구 없음</span><span class="pill" id="xpText">')
          rep('<div id="quest">퀘스트: 촌장에게 말을 걸어라.</div><div id="area">','<div id="quest">퀘스트: 촌장에게 말을 걸어라.</div><div id="hiddenQuest"></div><div id="area">')
          rep('6개의 포탈과 동굴 던전을 탐험해라.','7개의 포탈과 동굴, 숨겨진 기사 퀘스트를 탐험해라.')
          rep('<div id="sellShop" class="overlay">','<div id="armorShop" class="overlay"><div class="panel"><h2>갑옷상인</h2><div id="armorList"></div><button id="closeArmor" class="main dark">닫기</button></div></div>\n<div id="hiddenOffer" class="overlay"><div class="panel"><h2>⚰️ 이름 없는 기사의 비석</h2><p>“나는 용맹한 기사였고 군단의 대장이었다. 하지만 결국 여기서 쓰러졌다. 내가 모두 죽였다고 믿었던 적군 중 하나가 아직 남아 있다. 내 마지막 소원을 들어다오.”</p><button id="acceptHidden" class="main">죽여주겠다</button><button id="declineHidden" class="main dark">나중에</button></div></div>\n<div id="sellShop" class="overlay">')

          span("const F={", "const P=", """const F={
 f1:{n:'1번 사냥터',l:'Lv.1',bg:'#5ca44f',m:[['초록 슬라임',1,30,4,40,15,6,3,6,'slime']]},
 f2:{n:'2번 사냥터',l:'Lv.2~3',bg:'#4d9b54',m:[['파란 슬라임',2,56,6,44,16,9,5,4,'blue'],['들멧돼지',3,88,9,55,19,13,7,3,'boar']]},
 f3:{n:'3번 사냥터',l:'Lv.4',bg:'#6f9648',m:[['회색 늑대',4,136,12,68,18,18,10,6,'wolf']]},
 f4:{n:'4번 사냥터',l:'Lv.5~6',bg:'#8a6d40',m:[['오크',5,200,15,48,21,24,14,3,'orc'],['붉은 늑대',6,270,19,73,19,31,18,3,'redwolf']]},
 f5:{n:'5번 사냥터',l:'Lv.7 이상',bg:'#51475f',m:[['균열 기사',7,380,24,56,22,42,25,3,'knight'],['균열 악마',8,500,30,61,23,55,32,2,'demon']]},
 f6:{n:'6번 사냥터',l:'Lv.8~10',bg:'#483a3e',m:[['해골 전사',8,650,32,58,21,65,38,3,'skeleton'],['고블린 정예',9,850,38,65,22,80,48,2,'eliteGoblin'],['오우거',10,1100,45,50,28,100,60,1,'ogre']]},
 f7:{n:'7번 정글',l:'Lv.11~12',bg:'#243d2c',m:[['정글 호랑이',11,1250,48,76,24,125,72,3,'tiger'],['원시인 전사',11,1450,52,58,22,138,78,3,'primitive'],['정글 표범',12,1700,58,82,22,155,88,2,'panther']]}
};
""")
          span("const P=", "const WEAPONS=", """const P=[['f1',700,390,'1번 포탈','Lv.1'],['f2',890,390,'2번 포탈','Lv.2~3'],['f3',1080,390,'3번 포탈','Lv.4'],['f4',1270,390,'4번 포탈','Lv.5~6'],['f5',760,610,'5번 포탈','Lv.7 이상'],['f6',1010,610,'6번 포탈','Lv.8~10'],['f7',1260,610,'7번 포탈','Lv.11~12']];
""")
          span("const WEAPONS=", "const SELL_PRICE=", """const WEAPONS={'낡은 돌검':{price:100,damage:5,cd:.35},'철 도끼':{price:500,damage:12,cd:.35},'철 쌍검':{price:700,damage:20,cd:.35},'철 망치':{price:500,damage:40,cd:1},'낡은 쌍절곤':{price:0,damage:30,cd:.35,hidden:true,desc:'이 무기는 외부는 낡았지만 내부와 무기의 주인은 절대로 낡지 않았습니다.'}};
const ARMORS={'나무 갑옷':{price:50,hp:50},'철 갑옷':{price:200,hp:200}};
""")
          rep("const CAVE={\n entrance:{x:1660,y:1040},chest:{x:1490,y:600},exit:{x:1690,y:600},", "const CAVE={\n entrance:{x:1660,y:1040},chest:{x:1490,y:600},exit:{x:1690,y:600},")
          rep("};\n\n// ==============================\n// 사운드", "};\nconst TOMB={x:930,y:610,enemyX:930,enemyY:760};\n\n// ==============================\n// 사운드")

          span("let run=false,last=0", "function reset(){", """let run=false,last=0,cam={x:0,y:0},keys={},j={x:0,y:0},ac=0,pc=0,flash=0,zone='town',combatTimer=0,portalMsgCd=0,townHeal=0;
let p,mons=[],drops=[],fx=[],arrows=[],q=0,hq=0,chestOpened=false,guardianDead=false;
const inv={'슬라임 젤리':0,'멧돼지 고기':0,'늑대 가죽':0,'오크 이빨':0,'균열 조각':0,'수상한 당근':0};
const ownedWeapons={'낡은 돌검':false,'철 도끼':false,'철 쌍검':false,'철 망치':false,'낡은 쌍절곤':false};
const ownedArmors={'나무 갑옷':false,'철 갑옷':false};
const npcs=[{x:520,y:610,n:'촌장',k:'chief'},{x:690,y:670,n:'대장장이',k:'smith'},{x:405,y:805,n:'무기상인',k:'weapon'},{x:610,y:830,n:'판매상인',k:'seller'},{x:820,y:830,n:'갑옷상인',k:'armor'}];
function armorBonus(){return p.armor&&ARMORS[p.armor]?ARMORS[p.armor].hp:0}
function maxHp(){return p.baseHp+armorBonus()}
function currentAtk(){return (WEAPONS[p.weapon]?.damage||3)+(p.bonusAtk||0)}
""")
          span("function reset(){", "function hud(){", """function reset(){
 p={x:560,y:730,r:17,hp:100,baseHp:100,lv:1,xp:0,nxp:100,g:0,bonusAtk:0,spd:185,dir:1,inv:0,weapon:'맨손',armor:null,animState:'idle',animFrame:0,animTick:0};
 zone='town';mons=[];drops=[];fx=[];arrows=[];q=0;hq=0;pc=0;chestOpened=false;guardianDead=false;combatTimer=0;window.sk=0;
 for(const k in inv)inv[k]=0;for(const k in ownedWeapons)ownedWeapons[k]=false;for(const k in ownedArmors)ownedArmors[k]=false;hud()
}
""")
          span("function hud(){", "function toastMsg", """function hud(){
 const mh=maxHp();lv.textContent=`Lv.${p.lv}`;gold.textContent=`${p.g} G`;atk.textContent=`공격 ${Math.floor(currentAtk())}`;weaponText.textContent=p.weapon;armorText.textContent=p.armor||'방어구 없음';xpText.textContent=`EXP ${Math.floor(p.xp)}/${p.nxp}`;
 hp.style.width=`${Math.max(0,p.hp/mh*100)}%`;xp.style.width=`${Math.min(100,p.xp/p.nxp*100)}%`;
 if(q===0)quest.textContent='퀘스트: 촌장에게 말을 걸어라.';else if(q===1)quest.textContent=`퀘스트: 슬라임 5마리 처치 (${Math.min(5,window.sk||0)}/5)`;else if(q===2)quest.textContent='완료: 촌장에게 돌아가 보상 50G 받기';else if(q===3)quest.textContent='퀘스트: 슬라임 왕을 처치하라.';else if(q===4)quest.textContent='완료: 촌장에게 돌아가 보상 50G 받기';else if(q===5)quest.textContent='퀘스트: 2번 포탈로 들어가라.';else if(q===6)quest.textContent='완료: 촌장에게 돌아가 보상 50G 받기';else quest.textContent='현재 메인 퀘스트 완료';
 hiddenQuest.style.display=hq?'block':'none';hiddenQuest.textContent=hq===1?'히든 퀘스트: 기사의 마지막 원수를 처치하라.':hq>=2?'히든 퀘스트 완료 · 낡은 쌍절곤 획득':'';
 area.textContent=zone==='town'?'현재 지역: 마을':zone==='cave'?'현재 지역: 동굴 던전':`현재 지역: ${F[zone].n} · ${F[zone].l}`
}
""")
          span("function enter(z){", "function spawnAll", """function enter(z){
 const prev=zone;zone=z;mons=[];drops=[];fx=[];arrows=[];pc=1;combatTimer=0;setAggro(false);
 if(z==='town'){p.x=560;p.y=700;sfx(prev==='cave'?'caveExit':'portalExit');toastMsg('마을 · 촌장 옆으로 돌아왔다')}
 else if(z==='cave'){p.x=160;p.y=600;sfx('caveEnter');spawnCave();toastMsg('동굴 던전 입장')}
 else{p.x=185;p.y=600;sfx('portalEnter');spawnAll(z);if(z==='f5'&&hq===1)spawnHiddenEnemy();toastMsg(`${F[z].n} 입장`);if(z==='f2'&&q===5){q=6;sfx('questComplete');toastMsg('목표 완료! 촌장에게 가서 보상받기')}}
 hud()
}
""")
          span("function spawnCave(){", "function nearest(){", """function spawnCave(){
 for(let i=0;i<4;i++)spawnCaveMonster(CAVE.caveSlime,360+Math.random()*900,140+Math.random()*920);
 for(let i=0;i<2;i++)spawnCaveMonster(CAVE.archer,500+Math.random()*760,140+Math.random()*920);
 spawnCaveMonster(CAVE.giant,CAVE.chest.x-120,CAVE.chest.y)
}
function spawnCaveMonster(s,px,py){mons.push({n:s.n,lv:s.lv,x:px,y:py,hp:s.hp,mhp:s.hp,a:s.atk,spd:s.spd,r:s.r,xp:s.xp,g:s.g,type:s.type,baseType:s.type,z:'cave',hit:0,dead:false,shootCd:1+Math.random()*1.5,animState:'walk',animFrame:0,animTick:0,deathAge:0,dir:1,aggroed:false})}
function spawnHiddenEnemy(){if(mons.some(m=>m.type==='hiddenEnemy'&&!m.dead)||hq!==1)return;mons.push({n:'기사단의 마지막 원수',lv:8,x:TOMB.enemyX,y:TOMB.enemyY,hp:300,mhp:300,a:10,spd:58,r:23,xp:120,g:0,type:'hiddenEnemy',baseType:'hiddenEnemy',z:'f5',hit:0,dead:false,shootCd:0,animState:'walk',animFrame:0,animTick:0,deathAge:0,dir:1,aggroed:false})}
""")
          span("function talkNow(){", "function openWeaponShop", """function talkNow(){
 const n=nearest();if(!n){toastMsg(zone==='town'?'근처에 대화할 사람이 없다':'여기서는 대화할 사람이 없다');return}
 if(n.k==='chief'){
  if(q===0){q=1;window.sk=0;sfx('questAccept');say('촌장','1번 포탈에서 슬라임 5마리를 잡아라. 완료하면 내게 돌아와 보상을 받아라.')}
  else if(q===1)say('촌장',`슬라임 ${5-Math.min(5,window.sk||0)}마리 남았다.`);
  else if(q===2){p.g+=50;q=3;sfx('questReward');say('촌장','보상 <b>50골드</b>. 다음은 슬라임 왕 처치다.')}
  else if(q===3)say('촌장','슬라임 왕은 슬라임 스폰 때 10% 확률로 나타난다.');
  else if(q===4){p.g+=50;q=5;sfx('questReward');say('촌장','보상 <b>50골드</b>. 다음은 2번 포탈 입장이다.')}
  else if(q===5)say('촌장','2번 포탈로 들어가라.');
  else if(q===6){p.g+=50;q=7;sfx('questReward');say('촌장','보상 <b>50골드</b>. 이제 자유롭게 사냥해라.')}
  else say('촌장','7번 포탈은 어두운 정글이다. Lv.11~12 권장.')
 }else if(n.k==='smith'){
  if(p.weapon==='낡은 쌍절곤')say('대장장이','이건... <b>전설이 쓰는 무기는 강화 못한다.</b><br><br>“이 무기는 외부는 낡았지만 내부와 무기의 주인은 절대로 낡지 않았습니다.”');
  else if(p.g>=25){p.g-=25;p.bonusAtk+=2;sfx('smith');say('대장장이','25골드. 현재 공격력 +2.')}else say('대장장이','강화는 25골드다.')
 }else if(n.k==='weapon')openWeaponShop();else if(n.k==='seller')openSellShop();else if(n.k==='armor')openArmorShop();
 hud()
}
""")
          span("function openWeaponShop", "function getAction(){", """function openWeaponShop(){sfx('shopOpen');renderWeaponShop();weaponShop.style.display='flex'}
function renderWeaponShop(){weaponList.innerHTML=Object.entries(WEAPONS).filter(([,w])=>!w.hidden).map(([name,w])=>{const o=ownedWeapons[name],e=p.weapon===name,l=e?'장착중':o?'장착':`${w.price}G 구매`;return `<div class="slot"><span><b>${name}</b><br><span class="small">데미지 ${w.damage}${w.cd===1?' · 쿨타임 1초':''}</span></span><button data-weapon="${name}" ${e?'disabled':''}>${l}</button></div>`}).join('');weaponList.querySelectorAll('[data-weapon]').forEach(b=>b.onclick=()=>buyOrEquipWeapon(b.dataset.weapon))}
function equipWeapon(name){p.weapon=name;sfx('weaponEquip');toastMsg(`${name} 장착 · 공격 ${Math.floor(currentAtk())}`);hud()}
function buyOrEquipWeapon(name){const w=WEAPONS[name];if(!ownedWeapons[name]){if(p.g<w.price){sfx('noGold');toastMsg('골드가 부족하다');return}p.g-=w.price;ownedWeapons[name]=true;sfx('buy')}equipWeapon(name);renderWeaponShop()}
function openArmorShop(){sfx('shopOpen');renderArmorShop();armorShop.style.display='flex'}
function renderArmorShop(){armorList.innerHTML=Object.entries(ARMORS).map(([name,a])=>{const o=ownedArmors[name],e=p.armor===name,l=e?'착용중':o?'착용':`${a.price}G 구매`;return `<div class="slot"><span><b>${name}</b><br><span class="small">최대체력 +${a.hp}</span></span><button data-armor="${name}" ${e?'disabled':''}>${l}</button></div>`}).join('');armorList.querySelectorAll('[data-armor]').forEach(b=>b.onclick=()=>buyOrEquipArmor(b.dataset.armor))}
function buyOrEquipArmor(name){const a=ARMORS[name],old=maxHp();if(!ownedArmors[name]){if(p.g<a.price){sfx('noGold');toastMsg('골드가 부족하다');return}p.g-=a.price;ownedArmors[name]=true;sfx('buy')}p.armor=name;p.hp=Math.min(maxHp(),p.hp+Math.max(0,maxHp()-old));sfx('weaponEquip');renderArmorShop();hud()}
function openSellShop(){sfx('shopOpen');renderSellShop();sellShop.style.display='flex'}
function renderSellShop(){sellList.innerHTML=Object.entries(SELL_PRICE).map(([name,price])=>`<div class="slot"><span>${name}<br><span class="small">${price}G / 개</span></span><span>×${inv[name]||0} <button data-sell="${name}" ${(inv[name]||0)<=0?'disabled':''}>판매</button></span></div>`).join('');sellList.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>sellItem(b.dataset.sell))}
function sellItem(name){if((inv[name]||0)<=0)return;inv[name]--;p.g+=SELL_PRICE[name];sfx('sell');renderSellShop();hud()}
function sellEverything(){let t=0;for(const [n,pr] of Object.entries(SELL_PRICE)){t+=(inv[n]||0)*pr;inv[n]=0}if(!t){toastMsg('판매할 아이템이 없다');return}p.g+=t;sfx('sell');toastMsg(`전부 판매 +${t}G`);renderSellShop();hud()}

""")
          span("function getAction(){", "function hitSoundFor", """function getAction(){
 if(zone==='f2'&&Math.hypot(p.x-CAVE.entrance.x,p.y-CAVE.entrance.y)<85)return {label:'들어가기',kind:'enterCave'};
 if(zone==='f5'&&Math.hypot(p.x-TOMB.x,p.y-TOMB.y)<90&&hq===0)return {label:'비석 조사',kind:'tomb'};
 if(zone==='cave'&&!chestOpened&&Math.hypot(p.x-CAVE.chest.x,p.y-CAVE.chest.y)<85)return {label:guardianDead?'상자 열기':'상자 잠김',kind:'chest'};
 if(zone==='cave'&&Math.hypot(p.x-CAVE.exit.x,p.y-CAVE.exit.y)<85)return {label:'나가기',kind:'exitCave'};return null
}
function updateActionButton(){const a=getAction();actionBtn.style.display=a?'block':'none';if(a)actionBtn.textContent=a.label}
function useAction(){const a=getAction();if(!a)return;if(a.kind==='enterCave')enter('cave');else if(a.kind==='tomb')hiddenOffer.style.display='flex';else if(a.kind==='exitCave'){if(combatTimer>0){toastMsg('전투 중에는 마을로 갈 수 없다');return}enter('town')}else if(a.kind==='chest'){if(!guardianDead){toastMsg('거대 동굴슬라임을 먼저 잡아야 한다');return}chestOpened=true;p.g+=250;sfx('chestOpen');sfx('dungeonClear');toastMsg('보물상자 +250골드! 마을로 귀환');setTimeout(()=>enter('town'),600)}}

""")
          span("function attackNow(){", "function fireArrow", """function attackNow(){
 if(!run||ac>0)return;const w=WEAPONS[p.weapon];ac=w?w.cd:.35;combatTimer=4;p.animState='attack';p.animTick=0;p.animFrame=0;sfx('weaponSwing');
 const ax=p.x+p.dir*30;fx.push({x:ax,y:p.y,t:.18,d:p.dir});
 for(const m of mons){if(m.dead)continue;if(Math.hypot(m.x-ax,m.y-p.y)<62+m.r){m.hp-=currentAtk();m.hit=.12;m.x+=p.dir*13;sfx(p.weapon==='철 도끼'||p.weapon==='철 망치'?'axeHit':p.weapon==='철 쌍검'||p.weapon==='낡은 쌍절곤'?'dualHit':'swordHit');if(m.hp<=0)kill(m)}}
}
function kill(m){
 m.dead=true;m.animState='dead';m.animTick=0;m.animFrame=0;m.deathAge=0;sfx(deathSoundFor(m));p.xp+=m.xp;p.g+=m.g;
