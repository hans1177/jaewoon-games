name: Horror Direct Publish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/horror-direct-publish.yml'
      - 'roblox-games/horror-escape-room/**'
      - 'qa/horror-escape-room-release.test.mjs'

permissions:
  contents: read

concurrency:
  group: horror-direct-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GAME_ID: horror-escape-room
      GAME_NAME: '심야 감염전 [4대4]'
      UNIVERSE_ID: '10767445796'
      PLACE_ID: '98222620265768'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rojo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rojo-bin /tmp/horror-direct
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip
          echo '22503e5839864f9d7c2171c48b536fc229f2cc4d8774c9cc149f60941d864073  /tmp/rojo.zip' | sha256sum -c -
          unzip -q /tmp/rojo.zip -d /tmp/rojo-bin
          chmod +x /tmp/rojo-bin/rojo

      - name: Validate horror source contract
        shell: bash
        run: |
          set -euo pipefail
          node --test qa/horror-escape-room-release.test.mjs

      - name: Build latest main place
        shell: bash
        run: |
          set -euo pipefail
          /tmp/rojo-bin/rojo build "roblox-games/$GAME_ID/default.project.json" -o "/tmp/horror-direct/$GAME_ID.rbxlx"
          test -s "/tmp/horror-direct/$GAME_ID.rbxlx"
          sha256sum "/tmp/horror-direct/$GAME_ID.rbxlx"

      - name: Publish latest main to existing Roblox place
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_ROBLOSECURITY: ${{ secrets.ROBLOX_ROBLOSECURITY }}
          ROBLOX_SECURITY_COOKIE: ${{ secrets.ROBLOX_SECURITY_COOKIE }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ROBLOX_OPEN_CLOUD_API_KEY"
          node tools/company-roblox-dedicated-experience.mjs \
            --game-id "$GAME_ID" \
            --game-name "$GAME_NAME" \
            --place-file "/tmp/horror-direct/$GAME_ID.rbxlx" \
            --source-revision "$GITHUB_SHA" \
            --output "/tmp/horror-direct/result.json" \
            --reuse-universe-id "$UNIVERSE_ID" \
            --reuse-place-id "$PLACE_ID"

      - name: Verify publish
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('/tmp/horror-direct/result.json','utf8'));
          if(r.pass!==true||r.published!==true) throw new Error('DIRECT_PUBLISH_FAILED:'+String(r.stage||'unknown')+':'+String(r.error||'unknown'));
          if(String(r.universeId)!=='10767445796'||String(r.placeId)!=='98222620265768') throw new Error('DIRECT_PUBLISH_TARGET_DRIFT');
          console.log('HORROR_DIRECT_PUBLISH=PASS');
          console.log('HORROR_DIRECT_TARGET='+r.universeId+'/'+r.placeId);
          NODE
