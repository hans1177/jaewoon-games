name: Company Roblox Verified Learning Sweep
run-name: Roblox verified learning sweep · ${{ inputs.game_id || 'batch' }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/company-roblox-verified-learning-sweep.yml'
      - 'tools/company-roblox-verified-learning-sweep.mjs'
      - 'tools/company-development-roblox-bootstrap.mjs'
      - 'tools/vibe3-roblox-learning-context.mjs'
  workflow_dispatch:
    inputs:
      game_id:
        description: Optional exact Roblox gameId. Empty keeps batch-compatible sweep behavior.
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  # Coalesce repeated sweeps for the same game across fast-moving main SHAs.
  # Keep the active run alive; GitHub retains only the newest pending run per group.
  group: roblox-verified-learning-sweep-${{ inputs.game_id || 'batch' }}
  cancel-in-progress: false

env:
  VIBE2_LEARNING_RUNTIME_BRANCH: vibe2-learning-runtime

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch verified Vibe learning
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "+refs/heads/$VIBE2_LEARNING_RUNTIME_BRANCH:refs/remotes/origin/$VIBE2_LEARNING_RUNTIME_BRANCH"
          git show "origin/$VIBE2_LEARNING_RUNTIME_BRANCH:company-learning/vibe3-task-playbooks.json" > /tmp/vibe3-task-playbooks.json
          git show "origin/$VIBE2_LEARNING_RUNTIME_BRANCH:company-learning/vibe3-recombination-memory.json" > /tmp/vibe3-recombination-memory.json

      - name: Verify Roblox learning sweep contract before mutation
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/company-roblox-verified-learning-sweep.mjs
          node --check tools/company-development-roblox-bootstrap.mjs
          node --check tools/company-development-roblox-source-reconcile.mjs
          node --test qa/company-development-roblox-source-reconcile.test.mjs

      - name: Apply verified learning to selected Roblox source scope
        id: apply
        env:
          GAME_ID: ${{ inputs.game_id || '' }}
        shell: bash
        run: |
          set -euo pipefail
          scope="${GAME_ID:-batch}"
          branch="development/roblox-learning-sweep-${scope}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          node tools/company-roblox-verified-learning-sweep.mjs \
            --root=roblox-games \
            --game-id="$GAME_ID" \
            --playbooks=/tmp/vibe3-task-playbooks.json \
            --recombination=/tmp/vibe3-recombination-memory.json \
            --report=/tmp/roblox-learning-sweep.json
          git diff --binary -- roblox-games > /tmp/roblox-learning-sweep-first.diff
          node tools/company-roblox-verified-learning-sweep.mjs \
            --root=roblox-games \
            --game-id="$GAME_ID" \
            --playbooks=/tmp/vibe3-task-playbooks.json \
            --recombination=/tmp/vibe3-recombination-memory.json \
            --report=/tmp/roblox-learning-sweep-repeat.json
          git diff --binary -- roblox-games > /tmp/roblox-learning-sweep-repeat.diff
          cmp -s /tmp/roblox-learning-sweep-first.diff /tmp/roblox-learning-sweep-repeat.diff || {
            echo 'ROBLOX_VERIFIED_LEARNING_SWEEP_IDEMPOTENCE=FAIL' >&2
            exit 1
          }
          echo 'ROBLOX_VERIFIED_LEARNING_SWEEP_IDEMPOTENCE=PASS'
          git diff --check
          if git diff --quiet -- roblox-games; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "ROBLOX_VERIFIED_LEARNING_SWEEP=NO_CHANGE"
            exit 0
          fi
          git config user.name 'jaewoon-roblox-learning-sweep'
          git config user.email 'actions@users.noreply.github.com'
          if [ -n "$GAME_ID" ]; then
            git add "roblox-games/$GAME_ID"
          else
            git add roblox-games
          fi
          if git diff --cached --name-only | grep -E '/server/' >/dev/null; then
            echo 'ROBLOX_VERIFIED_LEARNING_SWEEP_SERVER_FILE_FORBIDDEN' >&2
            exit 2
          fi
          git commit -m "development: apply verified learning to Roblox ${scope}"
          git push origin "HEAD:$branch"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Promote sweep through PR
        if: steps.apply.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ steps.apply.outputs.branch }}
          GAME_ID: ${{ inputs.game_id || '' }}
        shell: bash
        run: |
          set -euo pipefail
          pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$SOURCE_BRANCH" \
            --title "development: apply verified learning to Roblox ${GAME_ID:-batch}" \
            --body "Updates the selected Roblox shared/client source scope with current verified external black-box distilled learning. Server files are not modified by this sweep.")"
          attempt=0
          while true; do
            attempt=$((attempt+1))
            if gh pr merge "$pr_url" --repo "$GITHUB_REPOSITORY" --squash --delete-branch; then
              break
            fi
            state="$(gh pr view "$pr_url" --repo "$GITHUB_REPOSITORY" --json state --jq '.state' 2>/dev/null || true)"
            [ "$state" = "MERGED" ] && break
            git fetch --no-tags --depth=1 origin main "+refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"
            git checkout "$SOURCE_BRANCH"
            git rebase origin/main
            git push --force-with-lease origin "HEAD:$SOURCE_BRANCH"
            sleep 1
            [ "$attempt" -lt 20 ] || { echo 'ROBLOX_VERIFIED_LEARNING_SWEEP_PROMOTION_RETRY_EXHAUSTED' >&2; exit 75; }
          done
          echo "ROBLOX_VERIFIED_LEARNING_SWEEP_PROMOTED=$pr_url"
