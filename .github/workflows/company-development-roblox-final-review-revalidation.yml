          echo "ROBLOX_F9_NEXT_CYCLE_CANDIDATE_COUNT=$next_count"
          echo "ROBLOX_F9_NEXT_CYCLE_DISPATCH_COUNT=$dispatch_count"
          echo "ROBLOX_F9_NEXT_CYCLE_DEDUPED_COUNT=$deduped_count"
