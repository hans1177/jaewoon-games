          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/company-development-confirmed-runtime.yml/runs?per_page=100" > /tmp/roblox-development-active-runs.json
          dispatch_count=0
          deduped_count=0
          while read -r id; do
            [ -n "$id" ] || continue
            active="$(GAME_ID="$id" CURRENT_SHA="$GITHUB_SHA" node - <<'NODE'
          const fs=require('fs');
          const payload=JSON.parse(fs.readFileSync('/tmp/roblox-development-active-runs.json','utf8'));
          const states=new Set(['queued','pending','in_progress','requested']);
          const prefix='DEVELOPMENT cycle | '+String(process.env.GAME_ID||'')+' | ';
          const currentSha=String(process.env.CURRENT_SHA||'').trim();
          process.stdout.write(String((payload.workflow_runs||[]).filter(run=>
            states.has(String(run.status||'').toLowerCase())
            &&String(run.head_sha||'')===currentSha
            &&String(run.display_title||'').startsWith(prefix)
          ).length));
          NODE
            )"
            if [ "$active" -gt 0 ]; then
              deduped_count=$((deduped_count+1))
