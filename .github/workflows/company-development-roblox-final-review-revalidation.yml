name: Company DEVELOPMENT_CONFIRMED Roblox F9 Final Review
run-name: Roblox F9 · ${{ inputs.game_id || 'scan' }}

on:
  workflow_dispatch:
    inputs:
      game_id:
        description: Optional exact gameId. Empty means all Roblox candidates ready for F9.
        required: false
        type: string
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write

env:
  COMPANY_RUNTIME_BRANCH: company-runtime

jobs:
  dedupe:
    name: collapse duplicate F9 reviews
    runs-on: ubuntu-slim
    timeout-minutes: 3
    outputs:
      run: ${{ steps.guard.outputs.run }}
    steps:
      - name: Select exact-game oldest run or newest scan
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_ID: ${{ inputs.game_id || '' }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/company-development-roblox-final-review-revalidation.yml/runs?per_page=100")"
          winner="$(printf '%s' "$payload" | GAME_ID="$GAME_ID" node -e "
            let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{
              const j=JSON.parse(s);
              const states=new Set(['queued','pending','in_progress','requested']);
              const game=String(process.env.GAME_ID||'').trim();
              const title='Roblox F9 · '+(game||'scan');
              const ids=(j.workflow_runs||[])
                .filter(r=>states.has(String(r.status||'').toLowerCase())&&String(r.display_title||'')===title)
                .map(r=>Number(r.id))
                .filter(Number.isFinite)
                .sort((a,b)=>a-b);
              if(!ids.length){process.stdout.write('');return;}
              process.stdout.write(String(game?ids[0]:ids[ids.length-1]));
            });
          ")"
          echo "ROBLOX_F9_ACTIVE_WINNER=${winner:-NONE}"
          if [ -n "$winner" ] && [ "$winner" != "$GITHUB_RUN_ID" ]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            if [ -n "$GAME_ID" ]; then
              echo "ROBLOX_F9_EXACT_DEDUPED=$GAME_ID:$GITHUB_RUN_ID:$winner"
            else
              echo "ROBLOX_F9_SCAN_DEDUPED_NEWER=$GITHUB_RUN_ID:$winner"
            fi
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo "ROBLOX_F9_DEDUPE_PASS=${GAME_ID:-SCAN}:$GITHUB_RUN_ID"
          fi

  final-review:
    needs: dedupe
    if: needs.dedupe.outputs.run == 'true'
    name: deterministic F9 review and exact-candidate internal release promotion
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current canonical implementation
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
          fetch-depth: 1
          fetch-tags: false

      - name: Checkout canonical runtime state
        uses: actions/checkout@v4
        with:
          ref: company-runtime
          path: runtime
          fetch-depth: 1
          fetch-tags: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Synchronize constitution central policy and compiled architecture
        working-directory: main
        shell: bash
        run: |
          set -euo pipefail
          node tools/company-shared-context.mjs --output=/tmp/roblox-f9-worker-context.json
          node -e "const x=require('/tmp/roblox-f9-worker-context.json');if(x.pass!==true||x.architectureProjection?.valid!==true)process.exit(1)"
          echo 'ROBLOX_F9_SHARED_CONTEXT=PASS'

      - name: Run F9 deterministic regression contract
        working-directory: main
        shell: bash
        run: |
          set -euo pipefail
          node --test             qa/company-development-roblox-runtime-foundation.test.mjs             qa/company-development-roblox-headless-fast-mvp.test.mjs             qa/company-tester-debug-intake.test.mjs             qa/company-development-roblox-release-promotion.test.mjs             qa/vibe3-roblox-platform.test.mjs
          echo 'ROBLOX_F9_DETERMINISTIC_REGRESSION=PASS'

      - name: Promote only the exact tested runtime candidate
        working-directory: main
        env:
          REQUESTED_GAME_ID: ${{ inputs.game_id || '' }}
        shell: bash
        run: |
          set -euo pipefail
          git -C ../runtime fetch --no-tags origin "$COMPANY_RUNTIME_BRANCH"
          git -C ../runtime reset --hard "origin/$COMPANY_RUNTIME_BRANCH"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {ingestTesterDebug} from './tools/company-tester-debug-intake.mjs';

          const requested=String(process.env.REQUESTED_GAME_ID||'').trim();
          const queuePath='../runtime/development-queue.json';
          const q=JSON.parse(fs.readFileSync(queuePath,'utf8'));
          const fresh=ingestTesterDebug({developmentQueue:q,ticketQueue:{tickets:[]},recoveryQueue:{tasks:[]}});
          const currentBlockingTickets=new Map();
          for(const ticket of fresh.tickets.tickets||[]){
            if(
              ticket.status!=='OPEN'
              ||ticket.repairEligible===false
              ||ticket.internalFlowBlocking===false
              ||ticket.externalReleaseBlockingOnly===true
              ||!['CRITICAL','HIGH'].includes(ticket.severity)
            )continue;
            const rows=currentBlockingTickets.get(ticket.gameId)||[];rows.push(ticket);currentBlockingTickets.set(ticket.gameId,rows);
          }
          const stamp=new Date().toISOString();
          let promoted=0,blocked=0;

          for(const item of q.items||[]){
            if(requested&&item.gameId!==requested)continue;
            const legacyF9Pending=item.currentStep==='ROBLOX_FINAL_REVIEW_REVALIDATION'&&item.robloxFailureSignature==='ROBLOX_FINAL_REVIEW_PENDING';
            const parallelF9Pending=item.robloxF9PendingInParallel===true;
            if(!legacyF9Pending&&!parallelF9Pending)continue;
            const candidate=item.robloxRuntimeCandidateEvidence||{};
            const runtime=item.robloxRuntimeFoundationEvidence||{};
            const post=item.robloxPostRuntimeQaEvidence||{};
            const sourceRevision=String(item.robloxSourceCommit||'').trim();
            const artifactIdentity=String(item.robloxBuildArtifactIdentity||'').trim();
            const sharedReleaseRuntimeAcceptance=
              item.robloxRuntimePassed===true
              &&runtime.runtimeAcceptancePassed===true
              &&runtime.f7MultiplayerFoundationPassed===true
              &&item.robloxMultiplayerQaPassed===true;
            const studioPlay=item.robloxInternalVibePlayEvidence||{};
            const internalRuntimeObservationDeferred=
              item.robloxRuntimeFoundationInternalReleaseException===true
              &&item.robloxPublicReleaseRuntimeObservationPending===true
              &&runtime.authority==='exact-engine-version-awaiting-real-server-boot'
              &&runtime.exactEngineVersion===true
              &&runtime.engineExecuted===true
              &&runtime.serverBootObserved!==true
              &&runtime.sourceRevision===sourceRevision
              &&runtime.artifactIdentity===artifactIdentity
              &&Number(runtime.candidateVersionNumber||runtime.expectedVersionNumber)===Number(candidate.versionNumber)
              &&studioPlay.pass===true
              &&studioPlay.actualPlay===true
              &&studioPlay.runtimeVerified===true
              &&studioPlay.officialStudioMcp===true
              &&studioPlay.localPlaceFile===true
              &&studioPlay.sourceRevision===sourceRevision
              &&studioPlay.artifactIdentity===artifactIdentity
              &&Number(studioPlay.versionNumber)===Number(candidate.versionNumber)
              &&Number(studioPlay.runtimeSummary?.consoleErrorCount||0)===0;
            const internalRuntimeFindingDeferred=
              item.robloxRuntimeFailureExternalReleaseOnly===true
              &&item.robloxInternalQaContinuationAllowed===true
              &&item.robloxInternalRegressionContinuationAllowed===true
              &&post.runtimeFailureExternalReleaseOnly===true
              &&post.internalQaContinuationAllowed===true
              &&post.internalRegressionContinuationAllowed===true
              &&post.actualRuntimeEvidence===true
              &&post.officialStudioMcpActualPlayPassed===true
              &&post.sourceRevision===sourceRevision
              &&post.artifactIdentity===artifactIdentity
              &&Number(post.candidateVersionNumber)===Number(candidate.versionNumber)
              &&runtime.sourceRevision===sourceRevision
              &&runtime.artifactIdentity===artifactIdentity
              &&runtime.exactGame===true
              &&runtime.exactPlace===true
              &&runtime.exactVersion===true
              &&Number(runtime.candidateVersionNumber)===Number(candidate.versionNumber);
            const internalRuntimeAcceptance=sharedReleaseRuntimeAcceptance||internalRuntimeObservationDeferred||internalRuntimeFindingDeferred;
            const publicRuntimeAcceptance=false; // Any deferred runtime finding remains external-public-release blocking.
            const studioAssetBindingRequired=item.robloxStudioAssetBindingApplied===true;
            const studioAssetRuntimeBindingExact=!studioAssetBindingRequired||(
              item.robloxStudioAssetRuntimeBindingPassed===true
              &&post.studioAssetBindingRequired===true
              &&post.studioAssetRuntimeBindingPassed===true
              &&post.studioAssetRuntimeBindingEvidence?.marker==='ROBLOX_STUDIO_ASSET_RUNTIME_BINDING_PASS'
              &&post.studioAssetRuntimeBindingEvidence?.sourceRevision===sourceRevision
              &&post.studioAssetRuntimeBindingEvidence?.artifactIdentity===artifactIdentity
              &&Number(post.studioAssetRuntimeBindingEvidence?.candidateVersionNumber)===Number(candidate.versionNumber)
            )
              ||(internalRuntimeObservationDeferred&&post.studioAssetEngineBindingMatched===true)
              ||(internalRuntimeFindingDeferred&&post.studioAssetBindingRequired!==true)
              ||(internalRuntimeFindingDeferred&&post.studioAssetRuntimeBindingPassed===true);
            const exact=
              item.robloxFoundationF0Passed===true
              &&(item.robloxRuntimeFoundationPassed===true||internalRuntimeObservationDeferred||internalRuntimeFindingDeferred)
              &&internalRuntimeAcceptance===true
              &&(
                (item.robloxIndependentQaPassed===true&&item.robloxRegressionPassed===true)
                ||internalRuntimeFindingDeferred
              )
              &&candidate.published===true
              &&candidate.releaseClaim===false
              &&candidate.sourceRevision===sourceRevision
              &&candidate.artifactIdentity===artifactIdentity
              &&/^[1-9][0-9]*$/.test(String(candidate.universeId||''))
              &&/^[1-9][0-9]*$/.test(String(candidate.placeId||''))
              &&runtime.sourceRevision===sourceRevision
              &&runtime.artifactIdentity===artifactIdentity
              &&String(runtime.universeId||'')===String(candidate.universeId||'')
              &&String(runtime.placeId||'')===String(candidate.placeId||'')
              &&runtime.exactGame===true
              &&runtime.exactPlace===true
              &&(runtime.exactVersion===true||internalRuntimeObservationDeferred)
              &&Number(runtime.candidateVersionNumber||runtime.expectedVersionNumber)===Number(candidate.versionNumber)
              &&post.sourceRevision===sourceRevision
              &&post.artifactIdentity===artifactIdentity
              &&Number(post.candidateVersionNumber)===Number(candidate.versionNumber)
              &&(post.actualRuntimeEvidence===true||(
                internalRuntimeObservationDeferred
                &&post.internalRuntimeObservationDeferred===true
                &&post.publicReleaseRuntimeObservationPending===true
              ))
              &&(
                (post.independentQaPassed===true&&post.regressionPassed===true)
                ||internalRuntimeFindingDeferred
              )
              &&studioAssetRuntimeBindingExact===true;
            const tickets=currentBlockingTickets.get(item.gameId)||[];
            if(!exact||tickets.length){
              const f9FailureSignature=!exact?'ROBLOX_F9_EXACT_EVIDENCE_MISMATCH':'ROBLOX_F9_OPEN_TESTER_FAILURE';
              const f9Blocker=!exact?'roblox-f9-exact-evidence-mismatch':'roblox-f9-open-tester-failure';
              const internalFlowNonBlocking=
                item.robloxRuntimeFailureExternalReleaseOnly===true
                ||item.robloxRuntimeFoundationInternalReleaseException===true
                ||item.robloxInternalReleaseReady===true;
              item.robloxFinalReviewPassed=false;
              item.robloxF9PendingInParallel=internalFlowNonBlocking;
              item.robloxF9FailureSignature=f9FailureSignature;
              item.robloxF9Blockers=[f9Blocker];
              if(internalFlowNonBlocking){
                item.currentStep='INTERNAL_PLATFORM_PLAYTEST_AND_DEBUG';
                item.canonicalState='INTERNAL_PLATFORM_PLAYTEST_AND_DEBUG';
                item.robloxFailureStage=item.robloxRuntimeFailureExternalReleaseOnly===true
                  ?'PUBLIC_RELEASE_RUNTIME_FINDING'
                  :'PUBLIC_RELEASE_RUNTIME_OBSERVATION';
                item.robloxFailureSignature=String(item.robloxPublicReleaseFailureSignature||f9FailureSignature);
                item.routingBlockers=[];
              }else{
                item.robloxFailureStage='ROBLOX_FINAL_REVIEW_REVALIDATION';
                item.robloxFailureSignature=f9FailureSignature;
                item.routingBlockers=[f9Blocker];
              }
              item.updatedAt=stamp;blocked++;
              continue;
            }

            item.robloxFinalReviewPassed=true;
            item.robloxFinalReviewPassedAt=stamp;
            item.robloxF9PendingInParallel=false;
            item.robloxF9FailureSignature=null;
            item.robloxF9Blockers=[];
            item.robloxF9ReleaseRegressionPassed=true;
            item.robloxF9ReleaseRegressionEvidence={
              version:1,
              gameId:item.gameId,
              sourceRevision,
              artifactIdentity,
              artifactRunId:Number(candidate.artifactRunId||0),
              candidateVersionNumber:Number(candidate.versionNumber),
              runtimeFoundationEvidenceAuthority:runtime.authority,
              postRuntimeQaAuthority:post.authority,
              noCurrentCriticalOrHighTesterFailure:true,
              studioAssetBindingRequired,
              studioAssetRuntimeBindingPassed:studioAssetRuntimeBindingExact,
              studioAssetRuntimeBindingEvidence:studioAssetBindingRequired?post.studioAssetRuntimeBindingEvidence:null,
              exactCandidateReusedWithoutRepublish:true,
              deterministicRegression:[
                'qa/company-development-roblox-runtime-foundation.test.mjs',
                'qa/company-development-roblox-headless-fast-mvp.test.mjs',
                'qa/company-tester-debug-intake.test.mjs',
                'qa/company-development-roblox-release-promotion.test.mjs',
                'qa/vibe3-roblox-platform.test.mjs',
              ],
              authority:'deterministic-f9-exact-runtime-candidate-review',
              verifiedAt:stamp,
            };
            item.robloxInternalReleaseReady=true;
            item.robloxInternalReleaseAt=stamp;
            item.robloxInternalReleaseEvidence={
              version:2,
              ...candidate,
              sourceRevision,
              artifactIdentity,
              artifactRunId:Number(candidate.artifactRunId||0),
              versionNumber:Number(candidate.versionNumber),
              published:true,
              actualRuntimeFoundationPassed:item.robloxRuntimeFoundationPassed===true,
              runtimeAcceptancePassed:sharedReleaseRuntimeAcceptance,
              internalRuntimeObservationDeferred,
              internalRuntimeFindingDeferred,
              runtimeFailureExternalReleaseOnly:internalRuntimeFindingDeferred,
              runtimeFailureSignature:internalRuntimeFindingDeferred?String(post.runtimeFailureSignature||item.robloxPublicReleaseFailureSignature||'ROBLOX_RUNTIME_FINDING'):null,
              publicReleaseRuntimeObservationPending:internalRuntimeObservationDeferred||internalRuntimeFindingDeferred,
              studioAssetBindingRequired,
              studioAssetRuntimeBindingPassed:studioAssetRuntimeBindingExact,
              studioAssetRuntimeBindingMarker:studioAssetBindingRequired?'ROBLOX_STUDIO_ASSET_RUNTIME_BINDING_PASS':'NOT_REQUIRED',
              internalReleaseRuntimeAccepted:true,
              publicReleaseRuntimeAccepted:publicRuntimeAcceptance,
              multiplayerVerificationMode:'TWO_CLIENT_ONE_SYNC',
              twoClientOneSyncPassed:sharedReleaseRuntimeAcceptance,
              fullMultiplayerQaPassed:item.robloxMultiplayerQaPassed===true,
              simplifiedInternalMultiplayerPassed:internalRuntimeObservationDeferred||internalRuntimeFindingDeferred,
              publicReleaseMultiplayerVerificationPending:internalRuntimeObservationDeferred||internalRuntimeFindingDeferred,
              independentQaPassed:item.robloxIndependentQaPassed===true,
              regressionPassed:item.robloxRegressionPassed===true,
              independentQaContinuationAllowed:internalRuntimeFindingDeferred,
              regressionContinuationAllowed:internalRuntimeFindingDeferred,
              finalReviewPassed:true,
              f9ReleaseRegressionPassed:true,
              promotedWithoutRepublish:true,
              releaseClaim:'INTERNAL_PLATFORM_RELEASE_ONLY',
              publicRelease:false,
              authority:internalRuntimeObservationDeferred
                ?'roblox-internal-release-after-f9-external-runtime-observation-deferred'
                :internalRuntimeFindingDeferred
                  ?'roblox-internal-release-after-f9-runtime-finding-external-only'
                  :'roblox-exact-runtime-candidate-promoted-after-f9',
              promotedAt:stamp,
            };
            item.robloxReleaseEvidence={...item.robloxInternalReleaseEvidence,authority:'roblox-internal-release-compatibility-after-f9'};
            item.robloxReleaseVersionNumber=Number(candidate.versionNumber);
            item.robloxPublicReleaseReady=false;
            item.robloxPublicReleaseVersionNumber=Number(candidate.versionNumber);
            item.robloxPublicReleaseEvidence={
              ...item.robloxInternalReleaseEvidence,
              releaseClaim:'INTERNAL_BUILDUP_PENDING_EXTERNAL_PUBLIC_HARD_GATE',
              publicRelease:false,
              publicReleaseReady:false,
              publicExposurePending:false,
              externalPublicHardGatePending:true,
              sameAsInternalVersion:true,
              authority:'roblox-internal-release-awaiting-perpetual-buildup-hard-gate',
            };
            item.robloxPublicRelease=false;
            item.robloxPromotionBlockers=internalRuntimeObservationDeferred
              ?['roblox-public-release-awaiting-real-server-boot','roblox-perpetual-buildup-public-hard-gate-pending']
              :internalRuntimeFindingDeferred
                ?[...(Array.isArray(item.robloxPublicReleaseBlockers)?item.robloxPublicReleaseBlockers:[]),'roblox-perpetual-buildup-public-hard-gate-pending']
                :['roblox-perpetual-buildup-public-hard-gate-pending'];
            item.robloxReleaseClaim=false;
            item.robloxReleasePublishedAt=null;
            item.currentStep='INTERNAL_PLATFORM_PLAYTEST_AND_DEBUG';
            item.canonicalState='INTERNAL_PLATFORM_PLAYTEST_AND_DEBUG';
            item.robloxLastSuccessfulStage='INTERNAL_PLATFORM_RELEASE';
            item.robloxFailureStage=item.robloxRuntimeFailureExternalReleaseOnly===true
              ?'PUBLIC_RELEASE_RUNTIME_FINDING'
              :item.robloxPublicReleaseRuntimeObservationPending===true
                ?'PUBLIC_RELEASE_RUNTIME_OBSERVATION'
                :null;
            item.robloxFailureSignature=String(item.robloxPublicReleaseFailureSignature||'').trim()||null;
            item.routingBlockers=[];
            if(item.executionEvidence){
              item.executionEvidence.lastSuccessfulStage='INTERNAL_PLATFORM_RELEASE';
              item.executionEvidence.failureStage=null;
              item.executionEvidence.failureSignature=null;
            }
            item.updatedAt=stamp;promoted++;
          }

          if(promoted||blocked){
            q.updatedAt=stamp;
            fs.writeFileSync(queuePath,JSON.stringify(q,null,2)+'\n');
          }
          console.log(`ROBLOX_F9_INTERNAL_RELEASE_PROMOTED=${promoted}`);
          console.log(`ROBLOX_F9_BLOCKED=${blocked}`);
          NODE

      - name: Persist F9 internal release state
        working-directory: runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-roblox-f9-qa'
          git config user.email 'actions@users.noreply.github.com'
          git add development-queue.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'ROBLOX_F9_RUNTIME_STATE_CHANGE=NO'
            exit 0
          fi
          git commit -m 'runtime: promote exact Roblox candidate after F9 [skip ci]'
          pushed=0
          for attempt in 1 2 3; do
            if git push origin HEAD:"$COMPANY_RUNTIME_BRANCH"; then pushed=1; break; fi
            git fetch --no-tags origin "$COMPANY_RUNTIME_BRANCH"
            git rebase "origin/$COMPANY_RUNTIME_BRANCH" || { git rebase --abort || true; exit 1; }
            sleep $((attempt*2))
          done
          test "$pushed" = '1'
          echo 'ROBLOX_F9_RUNTIME_STATE_CHANGE=YES'

      - name: Fan verified F9 runtime proof into waiting Vibe Roblox tasks
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_GAME_ID: ${{ inputs.game_id || '' }}
        shell: bash
        run: |
          set -euo pipefail
          proof_tsv=/tmp/roblox-f9-vibe-fanin.tsv
          node --input-type=module - "../runtime/development-queue.json" "$REQUESTED_GAME_ID" > "$proof_tsv" <<'NODE'
          import fs from 'node:fs';
          const [queuePath,requested='']=process.argv.slice(2);
          const q=JSON.parse(fs.readFileSync(queuePath,'utf8'));
          for(const item of q.items||[]){
            if(requested&&item.gameId!==requested)continue;
            if(item.robloxFinalReviewPassed!==true||item.robloxRuntimePassed!==true)continue;
            const studioRequired=item.robloxStudioAssetBindingApplied===true;
            if(studioRequired&&item.robloxStudioAssetRuntimeBindingPassed!==true)continue;
            const source=String(item.robloxSourceCommit||'').trim();
            const version=Number(item.robloxRuntimeCandidateEvidence?.versionNumber||item.robloxReleaseVersionNumber||0);
            if(!/^[0-9a-f]{40}$/i.test(source)||version<=0)continue;
            process.stdout.write([item.gameId,studioRequired?'YES':'NO',source,String(version)].join('\t')+'\n');
          }
          NODE

          if [ ! -s "$proof_tsv" ]; then
            echo 'ROBLOX_F9_VIBE_FANIN=NO_VERIFIED_WAITERS'
            exit 0
          fi

          rm -rf /tmp/vibe2-f9-control
          git clone --branch vibe2-unreal-core --single-branch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/vibe2-f9-control >/dev/null 2>&1
          git -C /tmp/vibe2-f9-control config user.name 'jaewoon-roblox-f9-fanin'
          git -C /tmp/vibe2-f9-control config user.email 'actions@users.noreply.github.com'
          pushed=0
          settled_count=0
          for attempt in 1 2 3; do
            attempt_settled=0
            git -C /tmp/vibe2-f9-control fetch origin vibe2-unreal-core --quiet
            git -C /tmp/vibe2-f9-control reset --hard origin/vibe2-unreal-core >/dev/null
            while IFS=$'\t' read -r game_id studio_required source_revision version_number; do
              [ -n "$game_id" ] || continue
              mapfile -t task_ids < <(GAME_ID="$game_id" node --input-type=module <<'NODE'
              import fs from 'node:fs';
              const q=JSON.parse(fs.readFileSync('/tmp/vibe2-f9-control/.vibe2/queue.json','utf8'));
              const game=String(process.env.GAME_ID||'').trim();
              for(const task of q.tasks||[]){
                const evidence=(task.evidence||[]).map(String);
                if(task.gameId!==game)continue;
                if(String(task.target||'').toLowerCase()!=='roblox')continue;
                if(String(task.status||'').toLowerCase()!=='running')continue;
                if(String(task.blocker||'')!=='candidate-awaiting-roblox-runtime-qa')continue;
                if(!evidence.includes('roblox-runtime-await-game:'+game))continue;
                process.stdout.write(String(task.id)+'\n');
              }
              NODE
              )
              for task_id in "${task_ids[@]}"; do
                evidence="roblox-runtime-acceptance-pass,roblox-final-review-pass,roblox-runtime-source-revision:${source_revision},roblox-runtime-version:${version_number},verification-conclusion:success,target-engine-qa-ref:roblox-f9-${GITHUB_RUN_ID},actions-run:${GITHUB_RUN_ID}"
                if [ "$studio_required" = YES ]; then
                  evidence="${evidence},ROBLOX_STUDIO_ASSET_RUNTIME_BINDING_PASS,roblox-studio-asset-runtime-binding-pass"
                fi
                (
                  cd /tmp/vibe2-f9-control
                  node "$GITHUB_WORKSPACE/main/tools/vibe2-queue-control.mjs" pass --id="$task_id" --evidence="$evidence"
                )
                echo "ROBLOX_F9_VIBE_TASK_PASS=${game_id}:${task_id}:studio=${studio_required}"
                attempt_settled=$((attempt_settled+1))
              done
            done < "$proof_tsv"

            git -C /tmp/vibe2-f9-control add .vibe2/queue.json
            if git -C /tmp/vibe2-f9-control diff --cached --quiet; then
              pushed=1
              settled_count=$attempt_settled
              break
            fi
            git -C /tmp/vibe2-f9-control commit -m 'vibe2: settle Roblox tasks after exact F9 runtime proof [skip ci]'
            if git -C /tmp/vibe2-f9-control push origin HEAD:vibe2-unreal-core; then
              pushed=1
              settled_count=$attempt_settled
              break
            fi
            sleep $((attempt*2))
          done
          test "$pushed" = '1'
          echo "ROBLOX_F9_VIBE_SETTLED_COUNT=$settled_count"
          if [ "$settled_count" -gt 0 ]; then
            payload="$(jq -nc \
              --arg run "${GITHUB_RUN_ID:-}" \
              --arg attempt "${GITHUB_RUN_ATTEMPT:-}" \
              --arg game "${REQUESTED_GAME_ID:-}" \
              '{event_type:"vibe2-fanin-refill",client_payload:{source_run:$run,source_attempt:$attempt,source_task:$game,source_outcome:"VERIFIED",reason:"roblox-f9-verified"}}')"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
              --data "$payload"
            echo "ROBLOX_F9_VIBE_REFILL_DISPATCHED=$settled_count"
          else
            echo 'ROBLOX_F9_VIBE_REFILL_DISPATCHED=0'
          fi
          echo 'ROBLOX_F9_VIBE_FANIN=PASS'
