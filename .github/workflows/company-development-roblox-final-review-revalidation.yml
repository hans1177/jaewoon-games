              done
            done < "$proof_tsv"

            git -C /tmp/vibe2-f9-control add .vibe2/queue.json
            if git -C /tmp/vibe2-f9-control diff --cached --quiet; then
              pushed=1
              settled_count=$attempt_settled
              break
            fi
            git -C /tmp/vibe2-f9-control commit -m 'vibe2: settle Roblox tasks after exact F9 runtime proof [skip ci]'
            if git -C /tmp/vibe2-f9-control push origin HEAD:vibe2-unreal-core; then
              pushed=1
              settled_count=$attempt_settled
              break
            fi
            sleep $((attempt*2))
          done
          test "$pushed" = '1'
          echo "ROBLOX_F9_VIBE_SETTLED_COUNT=$settled_count"
          refill_count=0
          while IFS= read -r game_id; do
            [ -n "$game_id" ] || continue
            payload="$(jq -nc \
              --arg run "${GITHUB_RUN_ID:-}" \
              --arg attempt "${GITHUB_RUN_ATTEMPT:-}" \
              --arg game "$game_id" \
              '{event_type:"vibe2-fanin-refill",client_payload:{source_run:$run,source_attempt:$attempt,source_task:$game,source_outcome:"VERIFIED",execution_lane:"game-primary",reason:"roblox-f9-verified-next-evolution"}}')"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
              --data "$payload"
            refill_count=$((refill_count+1))
            echo "ROBLOX_F9_VIBE_REFILL_GAME_DISPATCHED=$game_id"
          done < <(cut -f1 "$proof_tsv" | sed '/^$/d' | sort -u)
          echo "ROBLOX_F9_VIBE_REFILL_DISPATCHED=$refill_count"
          echo 'ROBLOX_F9_VIBE_REFILL_REQUIRES_SETTLED_WAITER=NO'
          echo 'ROBLOX_F9_VIBE_FANIN=PASS'
          echo 'ROBLOX_NEXT_EVOLUTION_CYCLE_DEPENDS_ON_PUBLICATION_OUTCOME=NO'
