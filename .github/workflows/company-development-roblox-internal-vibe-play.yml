name: Company Roblox Internal Vibe Play

on:
  workflow_dispatch:
    inputs:
      game_id:
        description: Exact internally released Roblox gameId to play and capture.
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: company-roblox-internal-vibe-play-${{ inputs.game_id }}
  cancel-in-progress: false

env:
  COMPANY_RUNTIME_BRANCH: company-runtime

jobs:
  play:
    name: actual Roblox Player internal play and store creative capture
    runs-on: [self-hosted, Windows, X64, roblox-studio-authenticated]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
          fetch-depth: 1
          fetch-tags: false

      - uses: actions/checkout@v4
        with:
          ref: company-runtime
          path: runtime
          fetch-depth: 1
          fetch-tags: false

      - name: Resolve exact internally released candidate
        id: candidate
        shell: powershell
        env:
          GAME_ID: ${{ inputs.game_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $q = Get-Content 'runtime/development-queue.json' -Raw | ConvertFrom-Json
          $item = @($q.items | Where-Object { [string]$_.gameId -eq $env:GAME_ID }) | Select-Object -First 1
          if (-not $item) { throw "ROBLOX_VIBE_PLAY_GAME_NOT_FOUND:$env:GAME_ID" }
          $e = $item.robloxInternalReleaseEvidence
          if ($item.robloxInternalReleaseReady -ne $true -or -not $e -or $e.published -ne $true) {
            throw "ROBLOX_VIBE_PLAY_REQUIRES_INTERNAL_RELEASE:$env:GAME_ID"
          }
          if ([string]$item.currentStep -ne 'INTERNAL_PLATFORM_PLAYTEST_AND_DEBUG') {
            throw "ROBLOX_VIBE_PLAY_WRONG_STAGE:$($item.currentStep)"
          }
          if ($item.robloxSharedTargetCurrent -eq $false) {
            throw 'ROBLOX_VIBE_PLAY_SHARED_TARGET_NOT_CURRENT'
          }
          $source = [string]$item.robloxSourceCommit
          $artifact = [string]$item.robloxBuildArtifactIdentity
          if ([string]$e.sourceRevision -ne $source -or [string]$e.artifactIdentity -ne $artifact) {
            throw 'ROBLOX_VIBE_PLAY_EXACT_CANDIDATE_MISMATCH'
          }
          if ([int64]$e.versionNumber -le 0 -or [int64]$e.placeId -le 0 -or [int64]$e.universeId -le 0) {
            throw 'ROBLOX_VIBE_PLAY_CANDIDATE_IDENTITY_MISSING'
          }
          "source_revision=$source" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "artifact_identity=$artifact" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "universe_id=$($e.universeId)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "place_id=$($e.placeId)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version_number=$($e.versionNumber)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "ROBLOX_VIBE_PLAY_EXACT_CANDIDATE=PASS:$env:GAME_ID:$($e.versionNumber)"

      - name: Launch actual Roblox Player and perform internal play input
        id: actualplay
        shell: powershell
        env:
          GAME_ID: ${{ inputs.game_id }}
          PLACE_ID: ${{ steps.candidate.outputs.place_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class NativeInput {
            [DllImport("user32.dll")] public static extern void keybd_event(byte bVk, byte bScan, uint dwFlags, UIntPtr dwExtraInfo);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
          }
          "@

          function Capture-Screen([string]$path) {
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $bounds.Width,$bounds.Height
            $gfx = [System.Drawing.Graphics]::FromImage($bmp)
            $gfx.CopyFromScreen($bounds.Location,[System.Drawing.Point]::Empty,$bounds.Size)
            $bmp.Save($path,[System.Drawing.Imaging.ImageFormat]::Png)
            $gfx.Dispose(); $bmp.Dispose()
          }
          function Key-Hold([byte]$vk,[int]$ms) {
            [NativeInput]::keybd_event($vk,0,0,[UIntPtr]::Zero)
            Start-Sleep -Milliseconds $ms
            [NativeInput]::keybd_event($vk,0,2,[UIntPtr]::Zero)
          }

          $frames = Join-Path $env:RUNNER_TEMP "roblox-vibe-play-$env:GAME_ID"
          Remove-Item -Recurse -Force $frames -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $frames | Out-Null
          Get-Process -Name RobloxPlayerBeta,RobloxPlayer -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          $uri = "roblox://placeID=$env:PLACE_ID"
          Start-Process $uri
          $deadline = (Get-Date).AddSeconds(100)
          $player = $null
          do {
            Start-Sleep -Seconds 2
            $player = @(Get-Process -Name RobloxPlayerBeta,RobloxPlayer -ErrorAction SilentlyContinue | Sort-Object StartTime -Descending | Select-Object -First 1)[0]
            if ($player) { $player.Refresh() }
          } while ((-not $player -or $player.MainWindowHandle -eq 0) -and (Get-Date) -lt $deadline)
          if (-not $player -or $player.MainWindowHandle -eq 0) { throw 'ROBLOX_PLAYER_ACTUAL_WINDOW_NOT_FOUND' }

          [NativeInput]::SetForegroundWindow($player.MainWindowHandle) | Out-Null
          Start-Sleep -Seconds 18
          Capture-Screen (Join-Path $frames '01-start.png')

          Key-Hold 0x57 1700
          Start-Sleep -Seconds 2
          Capture-Screen (Join-Path $frames '02-forward.png')

          Key-Hold 0x44 1200
          Key-Hold 0x20 250
          Start-Sleep -Seconds 2
          Capture-Screen (Join-Path $frames '03-move-jump.png')

          Key-Hold 0x41 1100
          Start-Sleep -Seconds 2
          Capture-Screen (Join-Path $frames '04-move-left.png')

          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point(
            [int]([System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Width * 0.72),
            [int]([System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Height * 0.72)
          )
          [System.Windows.Forms.SendKeys]::SendWait(" ")
          Start-Sleep -Seconds 3
          Capture-Screen (Join-Path $frames '05-action.png')

          $player.Refresh()
          if ($player.HasExited) { throw 'ROBLOX_PLAYER_EXITED_DURING_ACTUAL_PLAY' }
          $hashes = @(Get-ChildItem $frames -Filter '*.png' | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash })
          $distinct = @($hashes | Select-Object -Unique).Count
          if ($distinct -lt 3) { throw "ROBLOX_VIBE_PLAY_SCREEN_CHANGE_INSUFFICIENT:$distinct" }

          "frames_dir=$frames" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "player_pid=$($player.Id)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "distinct_frames=$distinct" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "ROBLOX_VIBE_PLAY_PLAYER_PROCESS=PASS:$($player.Id)"
          Write-Host "ROBLOX_VIBE_PLAY_ACTUAL_INPUT=PASS"
          Write-Host "ROBLOX_VIBE_PLAY_DISTINCT_FRAMES=$distinct"

      - name: Build three gameplay-derived thumbnail candidates and icon
        id: creative
        shell: powershell
        env:
          FRAMES_DIR: ${{ steps.actualplay.outputs.frames_dir }}
          GAME_ID: ${{ inputs.game_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP "roblox-store-presentation-$env:GAME_ID"
          Remove-Item -Recurse -Force $out -ErrorAction SilentlyContinue
          python -m pip install --disable-pip-version-check --quiet pillow
          python main/tools/company-roblox-thumbnail-compose.py --frames-dir "$env:FRAMES_DIR" --output-dir "$out"
          if (-not (Test-Path (Join-Path $out 'manifest.json'))) { throw 'ROBLOX_THUMBNAIL_MANIFEST_MISSING' }
          $m = Get-Content (Join-Path $out 'manifest.json') -Raw | ConvertFrom-Json
          if ($m.actualGameplayFrameSource -ne $true -or $m.sharedPlaceholderUsed -ne $false -or [int]$m.homepageThumbnailCandidateCount -ne 3) {
            throw 'ROBLOX_THUMBNAIL_ACTUAL_GAMEPLAY_CONTRACT_FAILED'
          }
          "output_dir=$out" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host 'ROBLOX_GAMEPLAY_THUMBNAIL_CANDIDATES=3'
          Write-Host 'ROBLOX_GAMEPLAY_ICON=PASS'

      - name: Resolve and apply English-primary Korean-subtitle title
        id: title
        continue-on-error: true
        shell: powershell
        env:
          GAME_ID: ${{ inputs.game_id }}
          UNIVERSE_ID: ${{ steps.candidate.outputs.universe_id }}
          PLACE_ID: ${{ steps.candidate.outputs.place_id }}
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $launch = "main/roblox-games/$env:GAME_ID/launch-mvp.json"
          if (-not (Test-Path $launch)) { throw 'ROBLOX_STORE_LAUNCH_MVP_MISSING' }
          $marketing = "main/company-learning/marketing/$env:GAME_ID/latest.json"
          if (-not (Test-Path $marketing)) { $marketing = '' }
          $args = @(
            'main/tools/company-roblox-store-presentation.mjs',
            "--launch=$launch",
            '--catalog=main/game-catalog.json',
            "--game-id=$env:GAME_ID",
            '--output=' + (Join-Path $env:RUNNER_TEMP 'roblox-store-spec.json')
          )
          if ($marketing) { $args += "--marketing=$marketing" }
          node @args
          $spec = Get-Content (Join-Path $env:RUNNER_TEMP 'roblox-store-spec.json') -Raw | ConvertFrom-Json
          $title = [string]$spec.title.displayName
          if (-not $title -or $spec.title.verifiedBilingual -ne $true) { throw 'ROBLOX_STORE_BILINGUAL_TITLE_FAILED' }
          $body = @{ displayName = $title } | ConvertTo-Json -Compress
          $url = "https://apis.roblox.com/cloud/v2/universes/$env:UNIVERSE_ID/places/$env:PLACE_ID?updateMask=displayName"
          $headers = @{ 'x-api-key' = $env:ROBLOX_OPEN_CLOUD_API_KEY; 'content-type'='application/json' }
          Invoke-RestMethod -Method Patch -Uri $url -Headers $headers -Body $body | Out-Null
          $verify = Invoke-RestMethod -Method Get -Uri "https://apis.roblox.com/cloud/v2/universes/$env:UNIVERSE_ID/places/$env:PLACE_ID" -Headers @{ 'x-api-key'=$env:ROBLOX_OPEN_CLOUD_API_KEY }
          if ([string]$verify.displayName -ne $title) { throw "ROBLOX_STORE_TITLE_VERIFY_MISMATCH:$($verify.displayName)" }
          "display_name=$title" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "ROBLOX_STORE_TITLE=$title"
          Write-Host 'ROBLOX_STORE_TITLE_BILINGUAL_VERIFY=PASS'

      - name: Upload generated icon and thumbnails to Roblox
        id: upload
        continue-on-error: true
        shell: powershell
        env:
          GAME_ID: ${{ inputs.game_id }}
          UNIVERSE_ID: ${{ steps.candidate.outputs.universe_id }}
          CREATIVE_DIR: ${{ steps.creative.outputs.output_dir }}
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content (Join-Path $env:CREATIVE_DIR 'manifest.json') -Raw | ConvertFrom-Json
          $headers = @('-H', "x-api-key: $env:ROBLOX_OPEN_CLOUD_API_KEY")
          $accepted = 0
          foreach ($thumb in @($manifest.homepageThumbnails)) {
            $code = & curl.exe -sS -o "$env:RUNNER_TEMP/thumb-upload-$accepted.json" -w "%{http_code}" -X POST @headers -F "file=@$thumb" "https://apis.roblox.com/legacy-game-internationalization/v1/game-thumbnails/games/$env:UNIVERSE_ID/language-codes/en-us/image"
            if ([int]$code -lt 200 -or [int]$code -ge 300) { throw "ROBLOX_THUMBNAIL_UPLOAD_FAILED:$code" }
            $accepted++
          }
          $icon = [string]$manifest.icon
          $iconCode = & curl.exe -sS -o "$env:RUNNER_TEMP/icon-upload.json" -w "%{http_code}" -X POST @headers -F "file=@$icon" "https://apis.roblox.com/legacy-game-internationalization/v1/game-icon/games/$env:UNIVERSE_ID/language-codes/en-us"
          if ([int]$iconCode -lt 200 -or [int]$iconCode -ge 300) { throw "ROBLOX_ICON_UPLOAD_FAILED:$iconCode" }
          if ($accepted -ne 3) { throw "ROBLOX_THUMBNAIL_UPLOAD_COUNT_MISMATCH:$accepted" }
          Write-Host 'ROBLOX_STORE_THUMBNAIL_UPLOAD_ACCEPTED=3'
          Write-Host 'ROBLOX_STORE_ICON_UPLOAD_ACCEPTED=YES'

      - name: Persist actual play and store-presentation evidence
        shell: powershell
        env:
          GAME_ID: ${{ inputs.game_id }}
          SOURCE_REVISION: ${{ steps.candidate.outputs.source_revision }}
          ARTIFACT_IDENTITY: ${{ steps.candidate.outputs.artifact_identity }}
          UNIVERSE_ID: ${{ steps.candidate.outputs.universe_id }}
          PLACE_ID: ${{ steps.candidate.outputs.place_id }}
          VERSION_NUMBER: ${{ steps.candidate.outputs.version_number }}
          DISTINCT_FRAMES: ${{ steps.actualplay.outputs.distinct_frames }}
          TITLE_OUTCOME: ${{ steps.title.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location runtime
          git fetch --no-tags origin $env:COMPANY_RUNTIME_BRANCH
          git reset --hard "origin/$env:COMPANY_RUNTIME_BRANCH"
          $q = Get-Content 'development-queue.json' -Raw | ConvertFrom-Json
          $item = @($q.items | Where-Object { [string]$_.gameId -eq $env:GAME_ID }) | Select-Object -First 1
          if (-not $item) { throw 'ROBLOX_VIBE_PLAY_PERSIST_GAME_MISSING' }
          $e = $item.robloxInternalReleaseEvidence
          if ([string]$item.robloxSourceCommit -ne $env:SOURCE_REVISION -or [string]$item.robloxBuildArtifactIdentity -ne $env:ARTIFACT_IDENTITY) { throw 'ROBLOX_VIBE_PLAY_SOURCE_CHANGED_BEFORE_PERSIST' }
          if ([int64]$e.versionNumber -ne [int64]$env:VERSION_NUMBER) { throw 'ROBLOX_VIBE_PLAY_VERSION_CHANGED_BEFORE_PERSIST' }
          $stamp = (Get-Date).ToUniversalTime().ToString('o')
          $play = [ordered]@{
            pass=$true; actualPlay=$true; playerProcessObserved=$true; actualInputIssued=$true; screenChangeObserved=$true
            distinctGameplayFrames=[int]$env:DISTINCT_FRAMES
            scenarioCoveragePass=$false
            scenarioCoverage=@('NEW_GAME_START','CORE_GAMEPLAY_INPUT_SMOKE')
            sourceRevision=$env:SOURCE_REVISION; artifactIdentity=$env:ARTIFACT_IDENTITY
            universeId=[string]$env:UNIVERSE_ID; placeId=[string]$env:PLACE_ID; versionNumber=[int64]$env:VERSION_NUMBER
            workflowRunId=[int64]$env:GITHUB_RUN_ID; playedAt=$stamp
            authority='actual-roblox-player-internal-vibe-play'
          }
          $store = [ordered]@{
            pass=($env:TITLE_OUTCOME -eq 'success' -and $env:UPLOAD_OUTCOME -eq 'success')
            titleBilingualPass=($env:TITLE_OUTCOME -eq 'success')
            englishPrimaryKoreanSubtitle=$true
            homepageThumbnailGeneratedFromActualGameplay=$true
            homepageThumbnailCandidateCount=3
            iconGeneratedFromActualGameplay=$true
            sharedPlaceholderUsed=$false
            thumbnailUploadVerified=($env:UPLOAD_OUTCOME -eq 'success')
            iconUploadVerified=($env:UPLOAD_OUTCOME -eq 'success')
            sourceRevision=$env:SOURCE_REVISION; artifactIdentity=$env:ARTIFACT_IDENTITY
            universeId=[string]$env:UNIVERSE_ID; placeId=[string]$env:PLACE_ID; versionNumber=[int64]$env:VERSION_NUMBER
            workflowRunId=[int64]$env:GITHUB_RUN_ID; updatedAt=$stamp
            authority='roblox-internal-vibe-play-store-presentation'
          }
          $item | Add-Member -NotePropertyName robloxInternalVibePlayEvidence -NotePropertyValue $play -Force
          $item | Add-Member -NotePropertyName robloxStorePresentationEvidence -NotePropertyValue $store -Force
          $item | Add-Member -NotePropertyName robloxInternalPlaytestPassed -NotePropertyValue $true -Force
          $item.updatedAt=$stamp
          $q.updatedAt=$stamp
          $q | ConvertTo-Json -Depth 100 | Set-Content 'development-queue.json' -Encoding utf8
          git config user.name 'jaewoon-roblox-vibe-play'
          git config user.email 'actions@users.noreply.github.com'
          git add development-queue.json
          git diff --cached --check
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "runtime: persist actual Roblox Vibe play $env:GAME_ID [skip ci]"
            for ($i=1; $i -le 3; $i++) {
              git push origin "HEAD:$env:COMPANY_RUNTIME_BRANCH"
              if ($LASTEXITCODE -eq 0) { break }
              git fetch --no-tags origin $env:COMPANY_RUNTIME_BRANCH
              git rebase "origin/$env:COMPANY_RUNTIME_BRANCH"
              Start-Sleep -Seconds (2*$i)
            }
            if ($LASTEXITCODE -ne 0) { throw 'ROBLOX_VIBE_PLAY_RUNTIME_PUSH_FAILED' }
          }
          Write-Host 'ROBLOX_INTERNAL_VIBE_PLAY_EVIDENCE=PERSISTED'
          Write-Host "ROBLOX_STORE_PRESENTATION_UPLOAD_OUTCOME=$env:UPLOAD_OUTCOME"

      - name: Upload actual gameplay and generated creative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roblox-internal-vibe-play-${{ inputs.game_id }}-${{ github.run_id }}
          path: |
            ${{ steps.actualplay.outputs.frames_dir }}/*.png
            ${{ steps.creative.outputs.output_dir }}/*
          if-no-files-found: error
          retention-days: 14

      - name: Refill existing Vibe development loop
        if: success()
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run vibe2-24h-runner.yml --repo $env:GITHUB_REPOSITORY --ref main
          Write-Host 'ROBLOX_VIBE_PLAY_TO_EXISTING_REPAIR_LOOP=DISPATCHED'
