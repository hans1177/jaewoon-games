name: Unity Android Exact Artifact Regression
run-name: Unity Android Regression ${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Unity cloud build run id whose exact APK must be regression tested'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: unity-android-regression-${{ inputs.run_id }}
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Checkout regression tools
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate upstream run id
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          run_id='${{ inputs.run_id }}'
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo '[JAEWOON_BUILD_ERROR:REGRESSION_RUN_ID_INVALID] invalid upstream run id' >&2; exit 2; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download exact upstream build artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.upstream.outputs.run_id }}
          path: upstream-artifacts

      - name: Bind exact artifact identity
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find upstream-artifacts -type f -name '*.apk' -size +0c | head -n 1 || true)"
          info="$(find upstream-artifacts -type f -name build-info.json -size +0c | head -n 1 || true)"
          [[ -n "$apk" && -s "$apk" && -n "$info" && -s "$info" ]] || { echo '[JAEWOON_BUILD_ERROR:REGRESSION_ARTIFACT_MISSING] exact build artifact missing' >&2; exit 3; }
          expected="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8-sig"))["sha256"])' "$info")"
          source_commit="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8-sig"))["sourceCommit"])' "$info")"
          actual="$(sha256sum "$apk" | awk '{print $1}')"
          [[ "$expected" =~ ^[0-9a-f]{64}$ && "$actual" == "$expected" ]] || { echo '[JAEWOON_BUILD_ERROR:REGRESSION_ARTIFACT_MISMATCH] APK SHA mismatch' >&2; exit 4; }
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]] || { echo '[JAEWOON_BUILD_ERROR:REGRESSION_SOURCE_INVALID] invalid source revision' >&2; exit 5; }
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "sha256=$actual" >> "$GITHUB_OUTPUT"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"

      - name: Prepare native ARM64 Android 16 regression runtime
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "aarch64" || "$(uname -m)" == "arm64" ]] || { echo '[JAEWOON_BUILD_ERROR:REGRESSION_ARM64_RUNNER_REQUIRED] regression requires ARM64 host.' >&2; exit 6; }
          [[ "$(getconf PAGESIZE)" == "4096" ]] || { echo '[JAEWOON_BUILD_ERROR:REGRESSION_ARM64_PAGE_SIZE] verified Redroid path requires 4K page size.' >&2; exit 6; }
          sudo apt-get update -y
          sudo apt-get install -y adb aapt
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
          sudo systemctl start docker || sudo service docker start || true
          docker version >/tmp/jaewoon-regression-redroid-docker.txt 2>&1 || { cat /tmp/jaewoon-regression-redroid-docker.txt >&2; exit 7; }
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" || { echo '[JAEWOON_BUILD_ERROR:REGRESSION_BINDER_MODULE_UNAVAILABLE] binder_linux unavailable.' >&2; exit 8; }
          sudo mkdir -p /dev/binderfs
          if ! mountpoint -q /dev/binderfs; then sudo mount -t binder binder /dev/binderfs; fi
          for device in binder hwbinder vndbinder; do [[ -e "/dev/binderfs/$device" ]] || { echo "binder device missing: $device" >&2; exit 8; }; done

          image='redroid/redroid:16.0.0_64only-latest'
          docker pull "$image"
          docker rm -f jaewoon-regression-redroid >/dev/null 2>&1 || true
          data="$RUNNER_TEMP/jaewoon-regression-redroid-data"
          mkdir -p "$data"
          docker run -d --privileged --name jaewoon-regression-redroid \
            -p 5555:5555 \
            -v "$data:/data" \
            "$image" \
            androidboot.use_memfd=true \
            androidboot.redroid_width=1080 \
            androidboot.redroid_height=2400 \
            androidboot.redroid_dpi=420 \
            androidboot.redroid_gpu_mode=guest > /tmp/jaewoon-regression-redroid-container.txt

          deadline=$((SECONDS+240))
          until [[ "$(timeout --kill-after=5s 20s docker exec jaewoon-regression-redroid getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" == "1" ]]; do
            if (( SECONDS >= deadline )); then
              docker logs jaewoon-regression-redroid > /tmp/jaewoon-regression-redroid.log 2>&1 || true
              tail -n 200 /tmp/jaewoon-regression-redroid.log >&2 || true
              exit 9
            fi
            sleep 5
          done
          docker logs jaewoon-regression-redroid > /tmp/jaewoon-regression-redroid.log 2>&1 || true
          adb start-server >/dev/null
          connected=false
          for _ in $(seq 1 30); do
            adb connect 127.0.0.1:5555 >/tmp/jaewoon-regression-redroid-adb-connect.txt 2>&1 || true
            if adb devices | awk '$1=="127.0.0.1:5555" && $2=="device" {ok=1} END{exit ok?0:1}'; then connected=true; break; fi
            sleep 2
          done
          [[ "$connected" == "true" ]] || { adb devices -l >&2 || true; exit 10; }
          api="$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
          abis="$(adb shell getprop ro.product.cpu.abilist | tr -d '\r')"
          [[ "$api" == "36" ]] || { echo "[JAEWOON_BUILD_ERROR:REGRESSION_ANDROID_API_MISMATCH] actual=$api" >&2; exit 11; }
          grep -q 'arm64-v8a' <<<"$abis" || { echo "[JAEWOON_BUILD_ERROR:REGRESSION_ARM64_RUNTIME_MISSING] abilist=$abis" >&2; exit 11; }
          printf 'HOST_ARCH=%s\nANDROID_API=%s\nANDROID_ABIS=%s\nIMAGE=%s\n' "$(uname -m)" "$api" "$abis" "$image" > /tmp/jaewoon-regression-redroid-device.txt

      - name: Run exact-artifact regression smoke
        env:
          APK: ${{ steps.apk.outputs.path }}
          BUILD_ID: ${{ steps.apk.outputs.sha256 }}
          SOURCE_REVISION: ${{ steps.apk.outputs.source_commit }}
          UPSTREAM_RUN: ${{ steps.upstream.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          bash tools/unity-apk-runtime-smoke.sh "$APK" qa-artifacts/unity-regression
          python3 - <<'PY'
          import json, os, pathlib
          path=pathlib.Path('qa-artifacts/unity-regression/evidence.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          if data.get('qaPassEligibleRuntimeEvidence') is not True:
              raise SystemExit('regression runtime evidence is not pass eligible')
          if data.get('runtimeAbiCompatible') is not True or 'arm64-v8a' not in str(data.get('deviceAbis','')):
              raise SystemExit('regression runtime evidence is not ARM64-compatible')
          data.update({
              'state':'PASS',
              'regression':'PASS',
              'regressionPassed':True,
              'runtimeProvider':'REDROID_NATIVE_ARM64_ANDROID_16',
              'upstreamBuildRunId':int(os.environ['UPSTREAM_RUN']),
              'buildId':os.environ['BUILD_ID'],
              'apkSha256':os.environ['BUILD_ID'],
              'buildSourceCommit':os.environ['SOURCE_REVISION'],
              'exactArtifactRegression':True
          })
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          echo 'UNITY_EXACT_ARTIFACT_REGRESSION=PASS'

      - name: Upload exact-artifact regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-regression-${{ steps.upstream.outputs.run_id }}
          path: |
            qa-artifacts/unity-regression/
            /tmp/jaewoon-regression-redroid.log
            /tmp/jaewoon-regression-redroid-device.txt
            /tmp/jaewoon-regression-redroid-docker.txt
            /tmp/jaewoon-regression-redroid-adb-connect.txt
          if-no-files-found: warn
          retention-days: 14