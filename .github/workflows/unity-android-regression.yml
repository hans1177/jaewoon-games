name: Unity Android Exact Artifact Regression
run-name: Unity Android Regression ${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Unity build run id whose exact APK is being reviewed at F9'
        required: true
        type: string
      runtime_run_id:
        description: 'Exact prior Unity runtime run containing the single-session F1-F8 evidence'
        required: true
        type: string
      independent_run_id:
        description: 'Exact prior independent QA run for the same APK'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: unity-android-regression-${{ inputs.run_id }}
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout regression tools
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          fetch-tags: false

      - name: Validate exact evidence run ids
        id: upstream
        env:
          BUILD_RUN_ID: ${{ inputs.run_id }}
          RUNTIME_RUN_ID: ${{ inputs.runtime_run_id }}
          INDEPENDENT_RUN_ID: ${{ inputs.independent_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          for value in "$BUILD_RUN_ID" "$RUNTIME_RUN_ID" "$INDEPENDENT_RUN_ID"; do
            [[ "$value" =~ ^[0-9]+$ ]] || { echo '[JAEWOON_BUILD_ERROR:REGRESSION_RUN_ID_INVALID] exact evidence run id is invalid' >&2; exit 2; }
          done
          echo "run_id=$BUILD_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "runtime_run_id=$RUNTIME_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "independent_run_id=$INDEPENDENT_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download exact upstream prerelease assets
        env:
          UPSTREAM_RUN_ID: ${{ steps.upstream.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/unity-release-artifact-transport.mjs \
            --run-id "$UPSTREAM_RUN_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --out upstream-artifacts

      - name: Bind exact artifact identity
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find upstream-artifacts -type f -name '*.apk' -size +0c | head -n 1 || true)"
          info="$(find upstream-artifacts -type f -name build-info.json -size +0c | head -n 1 || true)"
          [[ -n "$apk" && -s "$apk" && -n "$info" && -s "$info" ]] || { echo '[JAEWOON_BUILD_ERROR:REGRESSION_ARTIFACT_MISSING] exact build artifact missing' >&2; exit 3; }
          expected="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8-sig"))["sha256"])' "$info")"
          source_commit="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8-sig"))["sourceCommit"])' "$info")"
          source_tree="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8-sig")).get("sourceTreeSha",""))' "$info")"
          actual="$(sha256sum "$apk" | awk '{print $1}')"
          [[ "$expected" =~ ^[0-9a-f]{64}$ && "$actual" == "$expected" ]] || { echo '[JAEWOON_BUILD_ERROR:REGRESSION_ARTIFACT_MISMATCH] APK SHA mismatch' >&2; exit 4; }
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]] || { echo '[JAEWOON_BUILD_ERROR:REGRESSION_SOURCE_INVALID] invalid source revision' >&2; exit 5; }
          [[ "$source_tree" =~ ^[0-9a-f]{40}$ ]] || { echo '[JAEWOON_BUILD_ERROR:REGRESSION_SOURCE_TREE_INVALID] invalid source tree' >&2; exit 5; }
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "build_info=$info" >> "$GITHUB_OUTPUT"
          echo "sha256=$actual" >> "$GITHUB_OUTPUT"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "source_tree=$source_tree" >> "$GITHUB_OUTPUT"

      - name: Download prior exact runtime and independent QA evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_RUN_ID: ${{ steps.upstream.outputs.runtime_run_id }}
          INDEPENDENT_RUN_ID: ${{ steps.upstream.outputs.independent_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upstream-runtime upstream-independent
          mkdir -p upstream-runtime upstream-independent
          gh run download "$RUNTIME_RUN_ID" --repo "$GITHUB_REPOSITORY" -D upstream-runtime
          gh run download "$INDEPENDENT_RUN_ID" --repo "$GITHUB_REPOSITORY" -D upstream-independent
          runtime_json="$(find upstream-runtime -type f -name evidence.json -size +0c | head -n1 || true)"
          independent_json="$(find upstream-independent -type f -name evidence.json -size +0c | head -n1 || true)"
          [[ -n "$runtime_json" && -n "$independent_json" ]] || { echo '[JAEWOON_BUILD_ERROR:F9_EVIDENCE_FANIN_MISSING] runtime or independent evidence missing' >&2; exit 6; }
          echo "UNITY_F9_RUNTIME_REPLAY=NO"
          echo "UNITY_F9_EVIDENCE_FANIN=READY:$RUNTIME_RUN_ID:$INDEPENDENT_RUN_ID"

      - name: Review F0-F8 evidence without replaying the runtime
        env:
          BUILD_ID: ${{ steps.apk.outputs.sha256 }}
          SOURCE_REVISION: ${{ steps.apk.outputs.source_commit }}
          SOURCE_TREE: ${{ steps.apk.outputs.source_tree }}
          BUILD_RUN_ID: ${{ steps.upstream.outputs.run_id }}
          RUNTIME_RUN_ID: ${{ steps.upstream.outputs.runtime_run_id }}
          INDEPENDENT_RUN_ID: ${{ steps.upstream.outputs.independent_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts/unity-regression
          runtime_json="$(find upstream-runtime -type f -name evidence.json -size +0c | head -n1)"
          independent_json="$(find upstream-independent -type f -name evidence.json -size +0c | head -n1)"
          RUNTIME_JSON="$runtime_json" INDEPENDENT_JSON="$independent_json" python3 - <<'PY'
          import json, os, pathlib

          runtime=json.loads(pathlib.Path(os.environ['RUNTIME_JSON']).read_text(encoding='utf-8-sig'))
          independent=json.loads(pathlib.Path(os.environ['INDEPENDENT_JSON']).read_text(encoding='utf-8-sig'))
          build_id=os.environ['BUILD_ID']
          source=os.environ['SOURCE_REVISION']
          source_tree=os.environ['SOURCE_TREE']

          def require(condition,message):
              if not condition:
                  raise SystemExit(message)

          require(runtime.get('state')=='PASS' and runtime.get('runtime')=='PASS' and runtime.get('qaPassEligibleRuntimeEvidence') is True,
                  'F9 requires prior exact runtime PASS')
          require(runtime.get('apkSha256')==build_id and runtime.get('buildSourceCommit')==source and runtime.get('sourceTreeSha')==source_tree,
                  'F9 runtime identity drift')
          foundation=runtime.get('blackBoxFoundation') or {}
          require(foundation.get('version')==1 and foundation.get('mode')=='ONE_EXACT_RUNTIME_SESSION_F1_THROUGH_F8',
                  'F9 requires Unity single-session foundation adapter evidence')
          require(foundation.get('singleRuntimeSession') is True and foundation.get('runtimeReplayForF9Required') is False and foundation.get('foundationPass') is True,
                  'F9 cannot replay or fabricate F1-F8')
          floors=foundation.get('floors') or {}
          for floor in ('F1','F2','F3','F4','F5','F6','F8'):
              require((floors.get(floor) or {}).get('state')=='PASS',f'F9 missing prior {floor} PASS')

          require(independent.get('state')=='PASS' and independent.get('independentQa')=='PASS' and independent.get('independent') is True,
                  'F9 requires prior independent QA PASS')
          require(independent.get('apkSha256')==build_id and independent.get('buildSourceCommit')==source and independent.get('sourceTreeSha')==source_tree,
                  'F9 independent QA identity drift')
          checks=independent.get('checks') or {}
          for key in ('processLaunch','rapidInputStress','backgroundResume','processAliveAfterStress','fatalCrashScan','screenshotCaptured'):
              require(checks.get(key)=='PASS',f'F9 independent QA check failed: {key}')

          evidence={
              'version':3,
              'state':'PASS',
              'regression':'PASS',
              'regressionPassed':True,
              'exactArtifactRegression':True,
              'runtimeReplayPerformed':False,
              'f9Mode':'F0_TO_F8_EVIDENCE_FAN_IN_AND_REGRESSION_REVIEW',
              'upstreamBuildRunId':int(os.environ['BUILD_RUN_ID']),
              'runtimeRunId':int(os.environ['RUNTIME_RUN_ID']),
              'independentQaRunId':int(os.environ['INDEPENDENT_RUN_ID']),
              'buildId':build_id,
              'apkSha256':build_id,
              'buildSourceCommit':source,
              'sourceTreeSha':source_tree,
              'foundationFloors':floors,
              'reviewedIndependentChecks':checks,
          }
          pathlib.Path('qa-artifacts/unity-regression/evidence.json').write_text(
              json.dumps(evidence,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )
          PY
          echo 'UNITY_EXACT_ARTIFACT_REGRESSION=PASS'
          echo 'UNITY_F9_RUNTIME_REPLAY=NO'
          echo 'UNITY_F9_MODE=F0_TO_F8_EVIDENCE_FAN_IN_AND_REGRESSION_REVIEW'

      - name: Upload exact-artifact regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-regression-${{ steps.upstream.outputs.run_id }}
          path: qa-artifacts/unity-regression/
          if-no-files-found: warn
          retention-days: 14
