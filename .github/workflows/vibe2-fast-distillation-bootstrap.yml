name: Vibe2 Fast Distillation Bootstrap

on:
  workflow_run:
    workflows: ['Vibe2 Distillation Sample Ingest']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vibe2-local-distillation-training
  cancel-in-progress: false

jobs:
  gate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    outputs:
      ready: ${{ steps.plan.outputs.ready }}
      tasks: ${{ steps.plan.outputs.tasks }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate fast distillation contract
        run: |
          set -euo pipefail
          node --check tools/vibe2-fast-distillation-stage.mjs
          node --test qa/vibe2-fast-distillation-stage.test.mjs
          node --test qa/vibe2-distillation-status.test.mjs
          node --test qa/vibe2-weight-learning.test.mjs

      - name: Resolve early learning stages
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          node tools/vibe2-fast-distillation-stage.mjs \
            --evidence-dir=company-learning/evidence \
            --sample-dir=company-learning/training-samples \
            --out=/tmp/fast-distillation-plan.json
          node - <<'NODE'
          const fs = require('fs');
          const plan = JSON.parse(fs.readFileSync('/tmp/fast-distillation-plan.json', 'utf8'));
          const ready = plan.state === 'FAST_DISTILLATION_READY' && plan.earlyReadyTasks.length > 0;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `ready=${ready}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tasks=${JSON.stringify(plan.earlyReadyTasks)}\n`);
          console.log(`FAST_DISTILLATION_STATE=${plan.state}`);
          console.log(`FAST_DISTILLATION_TASKS=${plan.earlyReadyTasks.join(',') || 'NONE'}`);
          console.log(`STABLE_PIPELINE_TASKS=${plan.stableReadyTasks.join(',') || 'NONE'}`);
          console.log(`EXPLICIT_QUALITY_REJECTED=${plan.rejectedFastSamples.length}`);
          NODE

      - name: Confirm bootstrap cannot promote runtime adapter
        run: |
          echo 'FAST_DISTILLATION_RUNTIME_PROMOTION=NO'
          echo 'STABLE_PIPELINE_AUTHORITY=YES'
          echo 'PAID_API=NO'
          echo 'GITHUB_HOSTED_MODEL_TRAINING=NO'

  train-local:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: [self-hosted, Windows, X64, jaewoon-unity]
    timeout-minutes: 180
    permissions:
      contents: read
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Preflight local CUDA stack
        run: |
          $ErrorActionPreference = 'Stop'
          python -c "import torch, transformers, peft; assert torch.cuda.is_available(), 'CUDA GPU is required'; print('cuda=' + torch.cuda.get_device_name(0))"
          $method = 'lora'
          python -c "import bitsandbytes" 2>$null
          if ($LASTEXITCODE -eq 0) { $method = 'qlora' }
          "TRAINING_METHOD=$method" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $root = Join-Path $env:USERPROFILE 'jaewoon-vibe2-learning'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          "LOCAL_TRAINING_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Train bootstrap or stabilizing adapters without promotion
        env:
          FAST_TASKS_JSON: ${{ needs.gate.outputs.tasks }}
        run: |
          $ErrorActionPreference = 'Stop'
          node tools/vibe2-fast-distillation-stage.mjs `
            --evidence-dir company-learning/evidence `
            --sample-dir company-learning/training-samples `
            --out fast-distillation-plan.json
          if ($LASTEXITCODE -ne 0) { throw 'fast distillation plan failed' }
          $plan = [System.IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE 'fast-distillation-plan.json'), [System.Text.Encoding]::UTF8) | ConvertFrom-Json
          if ($plan.state -ne 'FAST_DISTILLATION_READY') { throw "fast lane no longer owns work: $($plan.state)" }
          $tasks = $env:FAST_TASKS_JSON | ConvertFrom-Json
          $runtimeItems = @()

          foreach ($taskType in @($tasks)) {
            $task = $plan.tasks.$taskType
            if (-not $task -or $task.ready -ne $true) { throw "task no longer ready: $taskType" }
            if ($task.learningStage -eq 'STABLE') { throw "stable task must use canonical stable pipeline: $taskType" }
            if ($task.runtimePromotionEligible -ne $false) { throw "fast task may not be promotion eligible: $taskType" }

            $policy = $task.trainingPolicy
            $taskPlanProjects = if ($task.learningStage -eq 'BOOTSTRAP_FAST') { 1 } else { 2 }
            $requestId = "fast-$taskType-$($task.learningStage.ToLower())-$env:GITHUB_RUN_ID"
            $datasetDir = Join-Path $env:GITHUB_WORKSPACE ("vibe2-learning\datasets\$taskType\$requestId")
            node tools/vibe2-weight-learning.mjs dataset `
              --input company-learning/training-samples `
              --out $datasetDir `
              --task-type $taskType `
              --min-train-samples $policy.minTrainSamples `
              --min-fresh-train-samples $policy.minFreshTrainSamples `
              --min-distinct-projects $policy.minDistinctProjects `
              --max-project-share $policy.maxProjectShare `
              --task-plan-min-samples 8 `
              --task-plan-min-projects $taskPlanProjects `
              --synthetic-ratio-cap $policy.syntheticRatioCap
            if ($LASTEXITCODE -ne 0) { throw "fast dataset gate failed: $taskType" }

            $manifestPath = Join-Path $datasetDir 'manifest.json'
            $manifest = [System.IO.File]::ReadAllText($manifestPath, [System.Text.Encoding]::UTF8) | ConvertFrom-Json
            if ($manifest.readyForTraining -ne $true) { throw "fast manifest not ready: $taskType" }

            $adapterVersion = "$taskType-fast-$($task.learningStage.ToLower())-$env:GITHUB_RUN_ID"
            $adapterDir = Join-Path $env:LOCAL_TRAINING_ROOT ("adapters\$taskType\$adapterVersion")
            if (Test-Path $adapterDir) { Remove-Item $adapterDir -Recurse -Force }
            New-Item -ItemType Directory -Path $adapterDir -Force | Out-Null

            python tools/vibe2-train.py `
              --train (Join-Path $datasetDir 'train.jsonl') `
              --eval (Join-Path $datasetDir 'eval.jsonl') `
              --dataset-manifest $manifestPath `
              --output $adapterDir `
              --adapter-version $adapterVersion `
              --task-type $taskType `
              --method $env:TRAINING_METHOD
            if ($LASTEXITCODE -ne 0) { throw "fast adapter training failed: $taskType" }

            $metadataPath = Join-Path $adapterDir 'training-metadata.json'
            $metadata = [System.IO.File]::ReadAllText($metadataPath, [System.Text.Encoding]::UTF8) | ConvertFrom-Json
            if ($metadata.promotionState -ne 'UNVERIFIED' -or $metadata.runtimePromotionAllowed -ne $false) {
              throw "fast adapter escaped UNVERIFIED gate: $taskType"
            }

            $runtimeItems += [pscustomobject]@{
              taskType = $taskType
              learningStage = $task.learningStage
              adapterVersion = $adapterVersion
              localAdapterPath = $adapterDir
              promotionState = 'UNVERIFIED'
              runtimePromotionAllowed = $false
              nextGate = 'COLLECT_TO_STABLE_THEN_FIXED_HOLDOUT_AB_AND_CANARY'
            }
          }

          $runtime = [ordered]@{
            version = 1
            state = 'FAST_TRAINED_UNVERIFIED'
            trainedAt = (Get-Date).ToUniversalTime().ToString('o')
            runner = $env:RUNNER_NAME
            items = $runtimeItems
            autoPromotion = $false
            stablePipelineAuthority = $true
          }
          $runtime | ConvertTo-Json -Depth 10 | Set-Content (Join-Path $env:LOCAL_TRAINING_ROOT 'latest-fast-distillation-runtime.json') -Encoding utf8

      - name: Summary
        if: always()
        run: |
          Write-Host 'FAST_DISTILLATION_TRAINING=LOCAL_ONLY'
          Write-Host 'AUTO_PROMOTION=NO'
          Write-Host 'RUNTIME_USE=NO'
          Write-Host 'NEXT=COLLECT_TO_STABLE_THEN_FIXED_HOLDOUT_AB_AND_CANARY'
