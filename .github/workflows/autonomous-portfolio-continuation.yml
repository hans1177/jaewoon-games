name: Autonomous Portfolio Continuation

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: autonomous-portfolio-continuation
  cancel-in-progress: false

jobs:
  continue-portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Hydrate read-only continuous queue state from autonomous-dev
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin autonomous-dev --quiet
          mkdir -p .autonomous
          if git cat-file -e 'origin/autonomous-dev:.autonomous/queue-state.json' 2>/dev/null; then
            git show 'origin/autonomous-dev:.autonomous/queue-state.json' > .autonomous/queue-state.json
            echo 'QUEUE_STATE_SOURCE=autonomous-dev'
          else
            printf '{"attempts":[]}\n' > .autonomous/queue-state.json
            echo 'QUEUE_STATE_SOURCE=empty-fallback'
          fi
      - name: Validate continuation routing
        run: |
          node --check tools/autonomous-portfolio-continuation.mjs
          node --check tools/game-seed-state.mjs
          node --test qa/autonomous-portfolio-continuation.test.mjs
          grep -q 'ref: main' .github/workflows/autonomous-portfolio-continuation.yml
          grep -q 'origin/autonomous-dev:.autonomous/queue-state.json' .github/workflows/autonomous-portfolio-continuation.yml
      - name: Decide next company-level work
        id: route
        shell: bash
        run: |
          set -euo pipefail
          node tools/autonomous-portfolio-continuation.mjs > /tmp/portfolio-continuation.json
          cat /tmp/portfolio-continuation.json
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/portfolio-continuation.json','utf8'));
          console.log(`action=${d.action}`);
          console.log(`reason=${d.reason}`);
          NODE
      - name: Dispatch GAME_SEED bootstrap or vacancy replenishment only
        if: steps.route.outputs.action == 'DISPATCH_GAME_SEED'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run company-game-seed-bootstrap.yml --ref main
          echo 'PORTFOLIO_NEXT=GAME_SEED'
          echo 'FREE_CONCEPT_INCUBATOR=REMOVED'
          echo 'PAID_API=NO'
          echo 'PUBLIC_RELEASE=NO'
      - name: Summary
        if: always()
        run: |
          echo "### Autonomous Portfolio Continuation" >> "$GITHUB_STEP_SUMMARY"
          echo "- route: ${{ steps.route.outputs.action }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- reason: ${{ steps.route.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- GAME_SEED bootstrap: one initial six-category batch" >> "$GITHUB_STEP_SUMMARY"
          echo "- GAME_SEED replenishment: one-for-one vacancy only" >> "$GITHUB_STEP_SUMMARY"
          echo "- free-concept incubator: REMOVED" >> "$GITHUB_STEP_SUMMARY"
          echo "- continuous attempt ledger: autonomous-dev (read-only)" >> "$GITHUB_STEP_SUMMARY"
          echo "- trigger route: explicit workflow_dispatch only" >> "$GITHUB_STEP_SUMMARY"
          echo "- public release: NO" >> "$GITHUB_STEP_SUMMARY"
