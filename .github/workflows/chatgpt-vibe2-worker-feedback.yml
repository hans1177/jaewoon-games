name: ChatGPT Vibe2 Worker Feedback Patch

on:
  push:
    branches: [chatgpt/vibe2-capability-review-20260909]
    paths:
      - '.github/workflows/chatgpt-vibe2-worker-feedback.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/vibe2-capability-review-20260909
          fetch-depth: 0
      - name: Bind browser failure evidence into next worker prompt
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('tools/autonomous-development-worker.mjs')
          s=p.read_text()
          def rep(old,new,label):
              global s
              if old not in s: raise SystemExit(f'{label}: target missing')
              s=s.replace(old,new,1)
          rep("const DEFAULT_MODEL=process.env.AUTONOMOUS_LOCAL_MODEL||'qwen3:0.6b';","const DEFAULT_MODEL=process.env.AUTONOMOUS_LOCAL_MODEL||'qwen3:1.7b';",'default model')
          rep("const MAX_CONTEXT_FILES=8;\nconst MAX_CONTEXT_BYTES=56_000;\nconst MAX_FULL_CONTEXT_FILE_BYTES=28_000;","const MAX_CONTEXT_FILES=8;\nconst MAX_CONTEXT_BYTES=48_000;\nconst MAX_FULL_CONTEXT_FILE_BYTES=24_000;\nconst FEEDBACK_DIR='.autonomous/browser-failures';",'context budget')
          rep("const readJson=(file,fallback={})=>{try{return JSON.parse(fs.readFileSync(file,'utf8'));}catch{return fallback;}};","const readJson=(file,fallback={})=>{try{return JSON.parse(fs.readFileSync(file,'utf8'));}catch{return fallback;}};\nfunction browserFailureFeedback(gameId){\n  const file=path.join(FEEDBACK_DIR,`${safeId(gameId)}.json`),report=readJson(file,null);\n  if(!report||report.pass!==false)return '';\n  const rows=[...(report.errors||[]),...(report.consoleErrors||[]).map(x=>`console:${x}`),...(report.pageErrors||[]).map(x=>`page:${x}`),...(report.failedRequests||[]).map(x=>`request:${x}`)].map(clean).filter(Boolean).slice(0,10);\n  const metrics=report.metrics?`mobile=${report.metrics.viewportWidth||390}px body=${report.metrics.width||0}x${report.metrics.height||0} interactive=${report.metrics.visibleInteractive||0}`:'';\n  return clean(`직전 후보 모바일 브라우저 QA 실패. 같은 실패를 반복하지 말고 원인을 직접 고쳐라. ${rows.join(' | ')} ${metrics} screenshot=${report.screenshot||'artifact-only'}`);\n}", 'feedback reader')
          rep("export function buildPrompt({gameId,sourcePath,goal,context,protectedValues=[],responsibilityFiles=[],attempt=1,failureReason='',diagnostic=null,role='development'}){","export function buildPrompt({gameId,sourcePath,goal,context,protectedValues=[],responsibilityFiles=[],attempt=1,failureReason='',diagnostic=null,role='development',browserFeedback=''}){",'prompt arg')
          rep("작은 목표: ${goal}\\n책임 파일:","작은 목표: ${goal}${browserFeedback?`\\n직전 브라우저 실패 근거: ${browserFeedback}`:''}\\n책임 파일:",'prompt evidence')
          rep("const responsibilityFiles=(options.responsibilityFiles||[]).map(posix).filter(Boolean),diagnostic=options.diagnostic||null,role=clean(options.role)||roleFromCandidateId(candidateId),context=readContext(sourcePath,{preferredFiles:responsibilityFiles,diagnostic});","const responsibilityFiles=(options.responsibilityFiles||[]).map(posix).filter(Boolean),diagnostic=options.diagnostic||null,role=clean(options.role)||roleFromCandidateId(candidateId),browserFeedback=clean(options.browserFeedback),context=readContext(sourcePath,{preferredFiles:responsibilityFiles,diagnostic});",'worker option')
          rep("failureReason,diagnostic,role}),options.model??DEFAULT_MODEL);","failureReason,diagnostic,role,browserFeedback}),options.model??DEFAULT_MODEL);",'prompt call')
          rep("generationFailures:failures,repairMode,rulePatchId,role,gameId,","generationFailures:failures,repairMode,rulePatchId,role,browserFailureFeedbackUsed:Boolean(browserFeedback),gameId,",'evidence marker')
          old="""async function main(){
  const protectedValues=clean(process.env.AUTONOMOUS_PROTECTED_VALUES).split(',').map(clean).filter(Boolean),order=readJson('.autonomous/work-order.json',{});
  const evidence=await generateAutonomousCandidate({gameId:process.env.AUTONOMOUS_GAME_ID,sourcePath:process.env.AUTONOMOUS_SOURCE_PATH,goal:process.env.AUTONOMOUS_GOAL,candidateId:process.env.AUTONOMOUS_CANDIDATE_ID,protectedValues,model:process.env.AUTONOMOUS_LOCAL_MODEL||DEFAULT_MODEL,repairMode:process.env.AUTONOMOUS_REPAIR_MODE||order.repairMode||'MODEL',responsibilityFiles:order.responsibilityFiles||[],diagnostic:order.diagnosticTopIssue||null});console.log(JSON.stringify(evidence,null,2));
}"""
          new="""async function main(){
  const protectedValues=clean(process.env.AUTONOMOUS_PROTECTED_VALUES).split(',').map(clean).filter(Boolean),order=readJson('.autonomous/work-order.json',{}),gameId=process.env.AUTONOMOUS_GAME_ID,feedback=browserFailureFeedback(gameId);
  const evidence=await generateAutonomousCandidate({gameId,sourcePath:process.env.AUTONOMOUS_SOURCE_PATH,goal:process.env.AUTONOMOUS_GOAL,candidateId:process.env.AUTONOMOUS_CANDIDATE_ID,protectedValues,model:process.env.AUTONOMOUS_LOCAL_MODEL||DEFAULT_MODEL,repairMode:process.env.AUTONOMOUS_REPAIR_MODE||order.repairMode||'MODEL',responsibilityFiles:order.responsibilityFiles||[],diagnostic:order.diagnosticTopIssue||null,role:process.env.AUTONOMOUS_DEPARTMENT_ROLE||'',browserFeedback:feedback});console.log(JSON.stringify(evidence,null,2));
}"""
          rep(old,new,'main feedback')
          p.write_text(s)
          PY
          node --check tools/autonomous-development-worker.mjs
          node --test qa/autonomous-development-worker.test.mjs
          git diff --check
      - name: Commit worker feedback patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'chatgpt-vibe2-review'
          git config user.email 'chatgpt-vibe2-review@users.noreply.github.com'
          git add tools/autonomous-development-worker.mjs
          git commit -m 'feat: feed browser QA failures into next worker attempt'
          git push origin HEAD:chatgpt/vibe2-capability-review-20260909
