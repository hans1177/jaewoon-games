name: Company Evolution QA

on:
  push:
    branches: [main]
    paths:
      - index.html
      - artbook.html
      - game-artbooks.json
      - artbook-submission-queue.json
      - artbook-second-work-queue.json
      - artbook-gate-status.json
      - artbook-submissions/**
      - public-game-health.json
      - public-release-baselines.json
      - company-learning/**
      - assets/artbook-runtime.js
      - assets/homepage-enhancements.js
      - assets/homepage-layout-v2.js
      - assets/homepage-layout-v2.css
      - assets/company-quality-bar.js
      - assets/vibe-company-orchestration-bridge.js
      - tools/homepage-manager.mjs
      - tools/artbook-prepare-daily.mjs
      - tools/artbook-department-runner.mjs
      - tools/artbook-second-work-runner.mjs
      - tools/artbook-collaboration-runner.mjs
      - tools/artbook-director-review.mjs
      - tools/artbook-gate.mjs
      - tools/artbook-assemble.mjs
      - tools/public-game-health.mjs
      - tools/asset-health-check.mjs
      - tools/update-release-baselines.mjs
      - tools/award-postmortem-learning.mjs
      - HOMEPAGE_OPERATIONS.md
      - .github/agents/homepage.agent.md
      - .github/workflows/homepage-manager.yml
      - .github/workflows/artbook-free-department-bots.yml
      - .github/workflows/artbook-section-gate.yml
      - .github/workflows/company-evolution-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          node --input-type=module --check < assets/artbook-runtime.js
          node --input-type=module --check < assets/homepage-enhancements.js
          node --input-type=module --check < assets/homepage-layout-v2.js
          node --input-type=module --check < assets/company-quality-bar.js
          node --input-type=module --check < assets/vibe-company-orchestration-bridge.js
          node --check tools/homepage-manager.mjs
          node --check tools/artbook-prepare-daily.mjs
          node --check tools/artbook-department-runner.mjs
          node --check tools/artbook-second-work-runner.mjs
          node --check tools/artbook-collaboration-runner.mjs
          node --check tools/artbook-director-review.mjs
          node --check tools/artbook-gate.mjs
          node --check tools/artbook-assemble.mjs
          node --check tools/public-game-health.mjs
          node --check tools/asset-health-check.mjs
          node --check tools/update-release-baselines.mjs
          node --check tools/award-postmortem-learning.mjs

      - name: Validate homepage manager contract
        run: |
          set -euo pipefail
          grep -Fq 'otherGamesMayAppearOnHomepage:true' tools/homepage-manager.mjs
          grep -Fq 'short-cards -> dedicated-artbook-detail-page' tools/homepage-manager.mjs
          grep -Fq 'artbookVisibilityIsProductionApproval:false' tools/homepage-manager.mjs
          grep -Fq 'runtimeGameHealthBadgeVisible:false' tools/homepage-manager.mjs
          grep -Fq "cron: '20 23 * * *'" .github/workflows/homepage-manager.yml
          grep -Fq '홈 = 짧은 게임 카드' .github/agents/homepage.agent.md
          grep -Fq '홈 = 짧은 카드 / 아트북 = 별도 상세 페이지' HOMEPAGE_OPERATIONS.md
          if grep -Fq '새 게임 자동 공개 금지' .github/agents/homepage.agent.md; then
            echo 'stale homepage publication ban returned' >&2
            exit 1
          fi
          node tools/homepage-manager.mjs
          node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('homepage-manager-status.json','utf8'));
          if(s.manager!=='homepage'||s.status!=='running')throw new Error(`homepage manager not healthy: ${s.status}`);
          if(s.policy?.runtimeGameHealthBadgeVisible!==false)throw new Error('runtime game health badge must stay hidden');
          console.log('HOMEPAGE_MANAGER_CONTRACT=PASS');
          NODE

      - name: Validate homepage presentation contract
        run: |
          set -euo pipefail
          grep -Fq '/assets/homepage-layout-v2.css' index.html
          grep -Fq '/assets/homepage-layout-v2.js' index.html
          grep -Fq '/artbook.html?game=' assets/homepage-layout-v2.js
          grep -Fq 'installExtrasDetails' assets/homepage-layout-v2.js
          grep -Fq '.gameCard{display:block!important}' assets/homepage-layout-v2.css
          if grep -Eq '웹 실행 양호|웹 실행 주의|웹 실행 오류|웹 실행 점검대기|건강 \$\{h\.score\}' assets/homepage-enhancements.js assets/homepage-layout-v2.js; then
            echo 'runtime health/game-quality-like badge leaked into homepage' >&2
            exit 1
          fi
          grep -Fq "params.get('game')" artbook.html
          echo 'HOMEPAGE_PRESENTATION=PASS'

      - name: Validate free department bot contract
        run: |
          set -euo pipefail
          grep -Fq 'paidApi:false' tools/artbook-department-runner.mjs
          grep -Fq 'readsOtherDepartmentSubmissions:false' tools/artbook-department-runner.mjs
          grep -Fq 'webArchiveReadOnly:true' tools/artbook-department-runner.mjs
          grep -Fq 'WEB_ARCHIVE_READ_ONLY' tools/artbook-department-runner.mjs
          grep -Fq 'conceptPlanRequired:true' tools/artbook-department-runner.mjs
          grep -Fq 'creativeIdeasAreProposals:true' tools/artbook-department-runner.mjs
          grep -Fq 'implementationPlanRequired:true' tools/artbook-department-runner.mjs
          grep -Fq 'demoValidationRequired:true' tools/artbook-department-runner.mjs
          grep -Fq 'paidApi:false' tools/artbook-collaboration-runner.mjs
          grep -Fq 'PEER_IMPROVEMENT_STAR_5' tools/artbook-collaboration-runner.mjs
          grep -Fq 'mayEvaluateOwnDepartment:false' tools/artbook-collaboration-runner.mjs
          grep -Fq 'paidApi:false' tools/artbook-director-review.mjs
          grep -Fq 'DIRECTOR_IMPROVEMENT_STAR_5' tools/artbook-director-review.mjs
          grep -Fq 'mayRewriteDepartmentResults:false' tools/artbook-director-review.mjs
          grep -Fq 'tools/artbook-second-work-runner.mjs' .github/workflows/artbook-free-department-bots.yml
          grep -Fq 'tools/artbook-director-review.mjs' .github/workflows/artbook-free-department-bots.yml
          grep -Eq '^  director:$' .github/workflows/artbook-free-department-bots.yml
          grep -Fq 'cancel-in-progress: true' .github/workflows/artbook-free-department-bots.yml
          grep -Fq 'qwen3:0.6b' .github/workflows/artbook-free-department-bots.yml
          if grep -Eq 'OPENAI_API_KEY|ANTHROPIC_API_KEY|GROQ_API_KEY|MISTRAL_API_KEY' .github/workflows/artbook-free-department-bots.yml tools/artbook-department-runner.mjs tools/artbook-second-work-runner.mjs tools/artbook-collaboration-runner.mjs tools/artbook-director-review.mjs; then
            echo 'paid/external AI key leaked into free department bot path' >&2
            exit 1
          fi
          echo 'FREE_DEPARTMENT_BOT_CONTRACT=PASS'

      - name: Validate artbook contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('game-artbooks.json','utf8'));
          const roles=['planning','graphics','development','qa','balance'];
          if(data?.policy?.maxCutsPerEdition!==10)throw new Error('artbook max cuts must be 10');
          if(data?.policy?.homepageVisibilityIsProductionApproval!==false)throw new Error('homepage visibility must not equal production approval');
          for(const book of data.artbooks||[]){
            if((book.cuts||[]).length>10)throw new Error(`${book.id}: more than 10 cuts`);
            if(book.published===true||book.homepageVisible===true){
              if(book.productionApproval!==false)throw new Error(`${book.id}: visibility cannot grant production approval`);
              if(book.collaborationProtocol==='PEER_PLUS_DIRECTOR_IMPROVEMENT_STAR_5'){
                const opinions=book.departmentOpinions||{};
                for(const role of roles){
                  const o=opinions[role];
                  if(!o||!String(o.priorityImprovement||'').trim()||!Number.isFinite(Number(o.averageStars))||Number(o.averageStars)<1||Number(o.averageStars)>5)throw new Error(`${book.id}: invalid ${role} five-vote improvement/star opinion`);
                  if(Number(o.reviewsReceived)!==5)throw new Error(`${book.id}: ${role} must receive 5 ratings`);
                  if(Number(o.departmentVotes)!==4||Number(o.directorVotes)!==1)throw new Error(`${book.id}: ${role} must receive 4 department votes + 1 director vote`);
                }
                if(Number(book.ratingSummary?.ratingsPerDepartment)!==5)throw new Error(`${book.id}: ratingsPerDepartment must be 5`);
                if(Number(book.ratingSummary?.departmentVotesPerResult)!==4||Number(book.ratingSummary?.directorVotesPerResult)!==1)throw new Error(`${book.id}: vote composition must be 4+1`);
              }
              for(const cut of book.cuts||[]){if(!cut.title||!cut.body||!cut.image)throw new Error(`${book.id}: incomplete cut ${cut.no}`);}
            }
          }
          console.log('ARTBOOK_CONTRACT=PASS');
          NODE

      - name: Validate five-vote display
        run: |
          set -euo pipefail
          grep -Fq '부서 결과물 5표 평가' artbook.html
          grep -Fq '타부서 4표 + 총괄 1표' artbook.html
          grep -Fq '결과물당 5표' artbook.html
          grep -Fq '보완점 1개' artbook.html
          grep -Fq '별점 5점 만점' artbook.html
          grep -Fq '전체 부서 평균 이하' artbook.html
          grep -Fq 'priorityImprovement' assets/homepage-enhancements.js
          grep -Fq 'averageStars' assets/homepage-enhancements.js
          if grep -Eq '>AGREE<|>COUNTER<|>TEST<|>RESULT<|>DECISION<' artbook.html; then
            echo 'old collaboration labels returned' >&2
            exit 1
          fi
          grep -Fq 'departmentOpinions' tools/artbook-assemble.mjs
          grep -Fq 'departmentOpinionsPublished:true' tools/artbook-assemble.mjs
          echo 'FIVE_VOTE_DISPLAY=PASS'

      - name: Validate artbook five-vote gate contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const q=JSON.parse(fs.readFileSync('artbook-submission-queue.json','utf8'));
          const gate=JSON.parse(fs.readFileSync('artbook-gate-status.json','utf8'));
          const roles=['planning','graphics','development','qa','balance'];
          if(JSON.stringify(q.requiredRoles)!==JSON.stringify(roles))throw new Error('required artbook roles changed');
          if(gate.directorMayAuthorMissingSections!==false)throw new Error('director section ghostwriting guard missing');
          if(gate.directorMayAuthorMissingReviews!==false)throw new Error('director review ghostwriting guard missing');
          if(gate.readyCount<gate.requiredCount&&gate.readyForDirectorAssembly!==false)throw new Error('director assembly opened before 5/5 sections');
          if(gate.reviewReadyCount<gate.reviewRequiredCount&&gate.readyForDirectorAssembly!==false)throw new Error('director assembly opened before 5/5 department reviews');
          if(gate.collaborationProtocol==='PEER_PLUS_DIRECTOR_IMPROVEMENT_STAR_5'&&gate.directorReviewReady!==true&&gate.readyForDirectorAssembly!==false)throw new Error('director assembly opened before director fifth ratings');
          const gateSource=fs.readFileSync('tools/artbook-gate.mjs','utf8');
          if(!gateSource.includes('PEER_PLUS_DIRECTOR_IMPROVEMENT_STAR_5'))throw new Error('five-vote protocol missing from gate source');
          if(!gateSource.includes('DIRECTOR_IMPROVEMENT_STAR_5'))throw new Error('director rating protocol missing from gate source');
          if(!gateSource.includes('ratingsPerDepartment'))throw new Error('ratings-per-department gate missing');
          if(!gateSource.includes("submissionContract:'V5_CREATIVE_IMPLEMENTATION_DEMO_PLAN'"))throw new Error('v5 creative/implementation/demo contract missing');
          if(!gateSource.includes('historicalPreV5Compatibility:true'))throw new Error('historical pre-v5 compatibility guard missing');
          const assembler=fs.readFileSync('tools/artbook-assemble.mjs','utf8');
          if(!assembler.includes('newDepartmentClaimsAdded:false'))throw new Error('assembler new-department-claims guard missing');
          if(!assembler.includes('daily final artbook limit reached'))throw new Error('daily one-artbook guard missing');
          if(!assembler.includes('productionApproval:false'))throw new Error('assembly must not grant production approval');
          if(!assembler.includes("criterion:'FIVE_VOTE_DEPARTMENT_AVERAGE_STARS_LE_OVERALL_AVERAGE'"))throw new Error('five-vote average-or-below second-work criterion missing');
          if(!assembler.includes('ratingsPerDepartment:5'))throw new Error('five ratings per department missing');
          if(!assembler.includes('departmentVotesPerResult:4'))throw new Error('four department votes per result missing');
          if(!assembler.includes('directorVotesPerResult:1'))throw new Error('one director vote per result missing');
          if(!assembler.includes("addDays(date,1)"))throw new Error('next-day scheduling missing');
          if(gate.assembled===true&&gate.collaborationProtocol==='PEER_PLUS_DIRECTOR_IMPROVEMENT_STAR_5'){
            const finalFile=gate.assembledFile;
            if(!finalFile||!fs.existsSync(finalFile))throw new Error('assembled gate has no artbook file');
            const book=JSON.parse(fs.readFileSync(finalFile,'utf8'));
            if(book.productionApproval!==false)throw new Error('assembled artbook granted production approval');
            if(book.directorSummary?.newDepartmentClaimsAdded!==false)throw new Error('director summary introduced department claims');
            if(Object.keys(book.departments||{}).length!==roles.length)throw new Error('assembled artbook is not 5/5');
            if(Object.keys(book.departmentOpinions||{}).length!==roles.length)throw new Error('assembled artbook has no 5/5 result ratings');
            if(book.collaboration?.allFiveDepartmentsReviewed!==true)throw new Error('assembled artbook has no 5/5 department peer review');
            if(Number(book.ratingSummary?.ratingsPerDepartment)!==5)throw new Error('assembled artbook result does not have five ratings');
            if((book.collaboration?.directorReview?.ratings||[]).length!==5)throw new Error('assembled artbook has no director fifth ratings');
          }
          console.log('ARTBOOK_FIVE_VOTE_GATE=PASS');
          NODE

      - name: Validate next-day second-work contract
        run: |
          set -euo pipefail
          grep -Fq "mode='SECOND_WORK'" tools/artbook-prepare-daily.mjs
          grep -Fq "criterion:'FIVE_VOTE_AVERAGE_OR_BELOW_OVERALL_AVERAGE'" tools/artbook-second-work-runner.mjs
          grep -Fq 'receivedFiveVoteFeedback' tools/artbook-second-work-runner.mjs
          grep -Fq 'CARRIED_FORWARD' tools/artbook-second-work-runner.mjs
          grep -Fq "ARTBOOK_DAILY_MODE" tools/artbook-prepare-daily.mjs
          grep -Fq 'SECOND_WORK' .github/workflows/artbook-free-department-bots.yml
          grep -Fq 'node tools/artbook-second-work-runner.mjs' .github/workflows/artbook-free-department-bots.yml
          echo 'NEXT_DAY_SECOND_WORK_CONTRACT=PASS'

      - name: Validate learning and rollback contracts
        run: |
          node <<'NODE'
          const fs=require('fs');
          const bugs=JSON.parse(fs.readFileSync('company-learning/bug-memory.json','utf8'));
          const research=JSON.parse(fs.readFileSync('company-learning/research-notes.json','utf8'));
          const health=JSON.parse(fs.readFileSync('public-game-health.json','utf8'));
          const rollback=JSON.parse(fs.readFileSync('public-release-baselines.json','utf8'));
          if(!Array.isArray(bugs.bugs)||!bugs.policy?.repeatFailureWithoutNewLearningGetsNoXp)throw new Error('bug memory policy invalid');
          if(!Array.isArray(research.notes)||!research.policy?.crossProjectReuseAllowed)throw new Error('research notes policy invalid');
          if(health.policy?.webArchiveMutation!=='forbidden')throw new Error('web archive mutation protection missing');
          if(rollback.policy?.neverPublishesUnapprovedGame!==true)throw new Error('rollback publication protection missing');
          console.log('LEARNING_ROLLBACK_CONTRACT=PASS');
          NODE

      - name: Validate experience quality-bar integration
        run: |
          set -euo pipefail
          grep -Fq 'createCompanyQualityBar' assets/vibe-company-orchestration-bridge.js
          grep -Fq 'qualityBar:companyQualityBar' assets/vibe-company-orchestration-bridge.js
          grep -Fq 'authorityNeverExpandsWithLevel' assets/department-experience.js
          echo 'EXPERIENCE_QUALITY_BAR=PASS'
