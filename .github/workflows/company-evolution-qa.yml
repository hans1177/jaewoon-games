name: Company Evolution QA

on:
  push:
    branches: [main]
    paths:
      - COMPANY_FLOW.md
      - company-directive.json
      - game-artbooks.json
      - game-catalog.json
      - design/**
      - company-learning/**
      - public-game-health.json
      - public-release-baselines.json
      - index.html
      - artbook.html
      - assets/artbook-runtime.js
      - assets/homepage-enhancements.js
      - assets/homepage-layout-v2.js
      - assets/company-quality-bar.js
      - assets/vibe-company-orchestration-bridge.js
      - tools/production-classification.mjs
      - tools/company-design-cycle.mjs
      - tools/company-baseline-gate.mjs
      - tools/artbook-production-pipeline.mjs
      - tools/artbook-fact-pack.mjs
      - tools/homepage-manager.mjs
      - .github/workflows/artbook-free-department-bots.yml
      - .github/workflows/company-evolution-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check active JavaScript syntax
        run: |
          set -euo pipefail
          node --input-type=module --check < assets/artbook-runtime.js
          node --input-type=module --check < assets/homepage-enhancements.js
          node --input-type=module --check < assets/homepage-layout-v2.js
          node --input-type=module --check < assets/company-quality-bar.js
          node --input-type=module --check < assets/vibe-company-orchestration-bridge.js
          node --check tools/homepage-manager.mjs
          node --check tools/production-classification.mjs
          node --check tools/artbook-fact-pack.mjs
          node --check tools/company-design-cycle.mjs
          node --check tools/company-baseline-gate.mjs
          node --check tools/artbook-production-pipeline.mjs

      - name: Validate homepage manager contract
        run: |
          set -euo pipefail
          grep -Fq '홈페이지를 수정하지 않고 현재 홈 구조와 게임 데이터만 진단한다.' tools/homepage-manager.mjs
          grep -Fq 'automaticLayoutInjectionAbsent' tools/homepage-manager.mjs
          grep -Fq 'homepageEnhancementLoaded' tools/homepage-manager.mjs
          grep -Fq 'HOMEPAGE_AUTO_LAYOUT_WRITE=DISABLED' tools/homepage-manager.mjs
          grep -Fq 'workflow_dispatch:' .github/workflows/homepage-manager.yml
          grep -Fq 'contents: read' .github/workflows/homepage-manager.yml
          if grep -Eq '^[[:space:]]+schedule:|contents: write' .github/workflows/homepage-manager.yml; then
            echo 'homepage manager must stay manual/read-only' >&2
            exit 1
          fi
          node tools/homepage-manager.mjs
          echo 'HOMEPAGE_MANAGER_CONTRACT=PASS'

      - name: Validate centralized production policy contract
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const directive=JSON.parse(fs.readFileSync('company-directive.json','utf8'));
          const policy=fs.readFileSync('COMPANY_FLOW.md','utf8');
          if(directive.policyDocument!=='COMPANY_FLOW.md')throw new Error('machine settings must point to COMPANY_FLOW.md');
          const pool=[...new Set(directive.ai?.modelPool||[])];
          const min=Number(directive.ai?.minDistinctModelsPerDepartment||0);
          if(min<3||pool.length<min)throw new Error(`multimodel pool insufficient: ${pool.length}/${min}`);
          for(const token of ['회사 최종목표','전체 시스템 아키텍처','Game Designer AI','Artbook Editor AI','CONSENSUS / CONFLICT / HOLD','Web Gameplay Validation','Unity Technical Validation','Vibe2가 확정된 개발 기준선']){
            if(!policy.includes(token))throw new Error(`central policy missing: ${token}`);
          }
          if(directive.production?.canonicalField!=='productionClass')throw new Error('productionClass must remain canonical');
          if(directive.production?.fixedClassCounts!==false)throw new Error('production class counts must remain dynamic');
          if(directive.production?.numericLabelsAreAliasesOnly!==true||directive.production?.numericLabelsOwnerRemappable!==true)throw new Error('numeric labels must remain remappable aliases only');
          for(const file of ['ARTBOOK_POLICY.md','ARTBOOK_LIFECYCLE.md','ARTBOOK_DESIGN_CONTRACT.md','ARTBOOK_OPERATIONS.md','ARTBOOK_PRODUCTION_CAPACITY.md','ARTBOOK_SUBMISSION_CONTRACT.md','VIBE2_ARTBOOK_DRAFT_POLICY.md']){
            const text=fs.readFileSync(file,'utf8');
            if(!text.includes('COMPANY_FLOW.md'))throw new Error(`${file} must point to COMPANY_FLOW.md`);
          }
          console.log('CENTRAL_POLICY=PASS');
          console.log(`DISTINCT_MODEL_POOL=${pool.length}`);
          console.log('NUMERIC_CLASS_LABELS=REMAPPABLE_ALIAS_ONLY');
          NODE

      - name: Validate real multimodel design cycle contract
        run: |
          set -euo pipefail
          grep -Fq 'tools/artbook-production-pipeline.mjs' .github/workflows/artbook-free-department-bots.yml
          grep -Fq 'Pull all configured free department models' .github/workflows/artbook-free-department-bots.yml
          grep -Fq 'tools/company-baseline-gate.mjs' .github/workflows/artbook-free-department-bots.yml
          grep -Fq 'DISTINCT_MODELS_PER_DEPARTMENT' tools/company-design-cycle.mjs
          grep -Fq 'DEPARTMENT_REBUTTAL_ROUNDS=1' tools/company-design-cycle.mjs
          grep -Fq 'sameModelAsDraft:true' tools/company-design-cycle.mjs
          grep -Fq 'departmentPageAuthorship:false' tools/company-design-cycle.mjs
          grep -Fq 'ARTBOOK_PROVENANCE_GATE=PASS' tools/company-design-cycle.mjs
          grep -Fq 'aiMeetingCompletionDoesNotEqualBaselineApproval:true' tools/company-baseline-gate.mjs
          grep -Fq 'webSmokeDoesNotEqualGameplayValidation:true' tools/company-baseline-gate.mjs
          grep -Fq 'tier2RequiresUnityTechnicalValidation:true' tools/company-baseline-gate.mjs
          if grep -Eq 'OPENAI_API_KEY|ANTHROPIC_API_KEY|GROQ_API_KEY|MISTRAL_API_KEY' .github/workflows/artbook-free-department-bots.yml tools/company-design-cycle.mjs tools/company-baseline-gate.mjs tools/artbook-production-pipeline.mjs; then
            echo 'paid/external AI key leaked into free multimodel path' >&2
            exit 1
          fi
          echo 'MULTIMODEL_DESIGN_CONTRACT=PASS'

      - name: Validate DEVELOPMENT_CONFIRMED baseline cannot be faked by Web smoke
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {productionClassOf,PRODUCTION_CLASSES} from './tools/production-classification.mjs';
          const source=fs.readFileSync('tools/company-baseline-gate.mjs','utf8');
          for(const token of ['web-gameplay-validation.json','unity-technical-validation.json','unity-project-required-for-technical-validation','DEVELOPMENT_BASELINE_PENDING_VALIDATION']){
            if(!source.includes(token))throw new Error(`development evidence gate missing: ${token}`);
          }
          const directive=JSON.parse(fs.readFileSync('company-directive.json','utf8'));
          const numericLabels=directive.production?.numericLabels||{};
          const catalog=JSON.parse(fs.readFileSync('game-catalog.json','utf8'));
          for(const game of (catalog.games||[]).filter(x=>productionClassOf({},x,{numericLabels})===PRODUCTION_CLASSES.DEVELOPMENT_CONFIRMED)){
            if(!game.webPath)throw new Error(`${game.id}: DEVELOPMENT_CONFIRMED Web validation surface missing`);
          }
          console.log('DEVELOPMENT_BASELINE_EVIDENCE_CONTRACT=PASS');
          NODE

      - name: Validate historical artbook safety
        run: |
          node <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('game-artbooks.json','utf8'));
          for(const book of data.artbooks||[]){
            if(book.published===true||book.homepageVisible===true){
              if(book.productionApproval!==false)throw new Error(`${book.id}: historical visibility cannot grant production approval`);
            }
          }
          console.log('HISTORICAL_ARTBOOK_SAFETY=PASS');
          NODE

      - name: Validate learning and rollback contracts
        run: |
          node <<'NODE'
          const fs=require('fs');
          const bugs=JSON.parse(fs.readFileSync('company-learning/bug-memory.json','utf8'));
          const research=JSON.parse(fs.readFileSync('company-learning/research-notes.json','utf8'));
          const health=JSON.parse(fs.readFileSync('public-game-health.json','utf8'));
          const rollback=JSON.parse(fs.readFileSync('public-release-baselines.json','utf8'));
          if(!Array.isArray(bugs.bugs)||!bugs.policy?.repeatFailureWithoutNewLearningGetsNoXp)throw new Error('bug memory policy invalid');
          if(!Array.isArray(research.notes)||!research.policy?.crossProjectReuseAllowed)throw new Error('research notes policy invalid');
          if(health.policy?.webArchiveMutation!=='forbidden')throw new Error('web archive mutation protection missing');
          if(rollback.policy?.neverPublishesUnapprovedGame!==true)throw new Error('rollback publication protection missing');
          console.log('LEARNING_ROLLBACK_CONTRACT=PASS');
          NODE

      - name: Validate experience quality-bar integration
        run: |
          set -euo pipefail
          grep -Fq 'createCompanyQualityBar' assets/vibe-company-orchestration-bridge.js
          grep -Fq 'qualityBar:companyQualityBar' assets/vibe-company-orchestration-bridge.js
          grep -Fq 'authorityNeverExpandsWithLevel' assets/department-experience.js
          echo 'EXPERIENCE_QUALITY_BAR=PASS'
