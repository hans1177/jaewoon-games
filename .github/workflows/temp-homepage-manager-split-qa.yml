name: Temp Homepage Manager Split QA
on:
  push:
    branches:
      - fix/homepage-development-visibility
permissions:
  contents: write
jobs:
  patch-and-test:
    if: "!contains(github.event.head_commit.message, '[split-qa-patched]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/homepage-development-visibility
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply split QA patch
        run: python3 tools/temp-homepage-manager-split-qa.py
      - name: Validate syntax
        run: node --check tools/homepage-manager.mjs
      - name: Run homepage publication regression
        run: node --test qa/homepage-manager-publication-order.test.mjs
      - name: Run homepage manager self-QA against current branch fixtures
        run: node tools/homepage-manager.mjs
      - name: Verify diff
        run: git diff --check
      - name: Commit validated manager change
        run: |
          git config user.name hans1177
          git config user.email anyanguy2@naver.com
          git add tools/homepage-manager.mjs
          git diff --cached --quiet && { echo 'NO_MANAGER_DIFF'; exit 1; }
          git commit -m 'fix(homepage): align manager QA with development progress split [split-qa-patched]'
          git push origin HEAD:fix/homepage-development-visibility
