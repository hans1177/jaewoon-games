name: Owner Web Edit Native Isolation Audit

on:
  push:
    branches: [main]
    paths:
      - 'web-games/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/company-owner-web-edit-propagation.yml'
      - 'qa/company-owner-web-isolation.test.mjs'

permissions:
  contents: read

concurrency:
  group: owner-web-edit-native-isolation-audit
  cancel-in-progress: false

jobs:
  isolation-qa:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject WEB-to-native development coupling
        run: node --test qa/company-owner-web-isolation.test.mjs
  audit:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Confirm WEB edits do not wake native development
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git cat-file -e "$AFTER_SHA^{commit}"
          if git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- web-games/ > /tmp/web-edits.txt
          else
            git ls-tree -r --name-only "$AFTER_SHA" -- web-games/ > /tmp/web-edits.txt
          fi
          echo "WEB_ONLY_CHANGED_GAME_FILE_COUNT=$(wc -l < /tmp/web-edits.txt)"
          # GitHub recognizes pushed/merged local source edits from paths and SHA-256,
          # without asking any model or native developer to generate further code.
          : > /tmp/web-changed-content-sha256.txt
          while IFS= read -r file; do
            case "$file" in web-games/*) ;; *) echo 'WEB_EDIT_PATH_NOT_WEB' >&2; exit 1 ;; esac
            if [ -f "$file" ]; then
              digest="$(sha256sum -- "$file" | cut -d ' ' -f1)"
            else
              digest="DELETED"
            fi
            printf '%s  %s\n' "$digest" "$file" >> /tmp/web-changed-content-sha256.txt
          done < /tmp/web-edits.txt
          echo 'WEB_CHANGED_CONTENT_SHA256_BEGIN'
          cat /tmp/web-changed-content-sha256.txt
          echo 'WEB_CHANGED_CONTENT_SHA256_END'
          {
            echo '### GitHub recognized WEB source changes'
            echo 'No code generation or native development was dispatched.'
            echo '\`\`\`text'
            cat /tmp/web-changed-content-sha256.txt
            echo '\`\`\`'
          } >> "$GITHUB_STEP_SUMMARY"
          # An observed WEB source delta cannot enqueue or dispatch Roblox/Unity work.
          echo 'WEB_EDIT_NATIVE_QUEUE_MUTATION=DENIED'
          echo 'WEB_EDIT_ROBLOX_DISPATCH=DENIED'
          echo 'WEB_EDIT_UNITY_DISPATCH=DENIED'
          echo 'WEB_SHARED_ASSET_LIBRARY=READ_ONLY'
