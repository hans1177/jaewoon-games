name: Homepage Manager

on:
  workflow_run:
    workflows:
      - Company Status Sync
      - Company DEVELOPMENT_CONFIRMED Runtime
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'COMPANY_FLOW.md'
      - 'company-directive.json'
      - 'HOMEPAGE_OPERATIONS.md'
      - 'REMOTE_AUTOMATION.md'
      - '.github/agents/homepage.agent.md'
      - '.github/agents/director.agent.md'
      - 'index.html'
      - 'company.html'
      - 'game-catalog.json'
      - 'company-status.json'
      - 'test-game-candidates.json'
      - 'public-release-baselines.json'
      - 'game-artbooks.json'
      - 'artbook-viewer.html'
      - 'artbook-submissions/**'
      - 'web-games/**'
      - 'assets/**'
      - 'manifest.webmanifest'
      - 'install.html'
      - 'sw.js'
      - 'offline.html'
      - 'command.html'
      - '_headers'
      - 'tools/homepage-manager.mjs'
      - 'tools/homepage-test-candidate-sync.mjs'
      - 'qa/homepage-manager-publication-order.test.mjs'
      - '.github/workflows/homepage-manager.yml'
  pull_request:
    branches: [main]
    paths:
      - 'COMPANY_FLOW.md'
      - 'company-directive.json'
      - 'HOMEPAGE_OPERATIONS.md'
      - 'REMOTE_AUTOMATION.md'
      - '.github/agents/homepage.agent.md'
      - '.github/agents/director.agent.md'
      - 'index.html'
      - 'company.html'
      - 'game-catalog.json'
      - 'company-status.json'
      - 'test-game-candidates.json'
      - 'public-release-baselines.json'
      - 'game-artbooks.json'
      - 'artbook-viewer.html'
      - 'artbook-submissions/**'
      - 'web-games/**'
      - 'assets/**'
      - 'manifest.webmanifest'
      - 'install.html'
      - 'sw.js'
      - 'offline.html'
      - 'command.html'
      - '_headers'
      - 'tools/homepage-manager.mjs'
      - 'tools/homepage-test-candidate-sync.mjs'
      - 'qa/homepage-manager-publication-order.test.mjs'
      - '.github/workflows/homepage-manager.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# A self-QA candidate must reach Director supervision/publication once captured.
# Failed upstream workflow_run events are isolated so they cannot interrupt a valid run.
concurrency:
  group: homepage-manager-${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' && github.run_id || github.ref }}
  cancel-in-progress: false

env:
  COMPANY_RUNTIME_BRANCH: company-runtime

jobs:
  manage-and-self-qa:
    name: Homepage Manager Self-QA
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      base_sha: ${{ steps.capture.outputs.base_sha }}
      candidate_changed: ${{ steps.capture.outputs.candidate_changed }}
      patch_sha256: ${{ steps.capture.outputs.patch_sha256 }}
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0

      - name: Bind synchronized server runtime snapshot
        shell: bash
        run: |
          set -euo pipefail
          echo 'HOMEPAGE_PUBLIC_STATUS_SYNC=NO' >> "$GITHUB_ENV"
          if [[ "${{ github.event_name }}" == 'pull_request' ]]; then
            echo "HOMEPAGE_CATALOG_PATH=game-catalog.json" >> "$GITHUB_ENV"
            echo "HOMEPAGE_STATUS_PATH=company-status.json" >> "$GITHUB_ENV"
            echo 'HOMEPAGE_RUNTIME_SOURCE=PR_REVISION'
          elif git fetch origin "$COMPANY_RUNTIME_BRANCH"; then
            mkdir -p /tmp/homepage-runtime
            git show "origin/$COMPANY_RUNTIME_BRANCH:game-catalog.json" > /tmp/homepage-runtime/game-catalog.json
            git show "origin/$COMPANY_RUNTIME_BRANCH:company-status.json" > /tmp/homepage-runtime/company-status.json
            node -e "JSON.parse(require('fs').readFileSync('/tmp/homepage-runtime/game-catalog.json','utf8'));JSON.parse(require('fs').readFileSync('/tmp/homepage-runtime/company-status.json','utf8'))"
            echo "HOMEPAGE_CATALOG_PATH=/tmp/homepage-runtime/game-catalog.json" >> "$GITHUB_ENV"
            echo "HOMEPAGE_STATUS_PATH=/tmp/homepage-runtime/company-status.json" >> "$GITHUB_ENV"
            echo 'HOMEPAGE_RUNTIME_SOURCE=COMPANY_RUNTIME'
            if [[ "${{ github.event_name }}" == 'workflow_run' && "${{ github.event.workflow_run.name }}" == 'Company Status Sync' ]]; then
              echo 'HOMEPAGE_PUBLIC_STATUS_SYNC=YES' >> "$GITHUB_ENV"
              echo 'HOMEPAGE_STATUS_SYNC_TRIGGER=COMPANY_STATUS_SYNC_SUCCESS'
            fi
          else
            if [[ "${{ github.event_name }}" == 'workflow_run' && "${{ github.event.workflow_run.name }}" == 'Company Status Sync' ]]; then
              echo 'Company Status Sync completed successfully but company-runtime could not be fetched.' >&2
              exit 1
            fi
            echo "HOMEPAGE_CATALOG_PATH=game-catalog.json" >> "$GITHUB_ENV"
            echo "HOMEPAGE_STATUS_PATH=company-status.json" >> "$GITHUB_ENV"
            echo 'HOMEPAGE_RUNTIME_SOURCE=MAIN_FALLBACK'
          fi

      - name: Prepare verified runtime status/catalog candidate
        if: env.HOMEPAGE_PUBLIC_STATUS_SYNC == 'YES'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/homepage-runtime/game-catalog.json game-catalog.json
          cp /tmp/homepage-runtime/company-status.json company-status.json
          node -e "JSON.parse(require('fs').readFileSync('game-catalog.json','utf8'));JSON.parse(require('fs').readFileSync('company-status.json','utf8'))"
          echo "HOMEPAGE_CATALOG_PATH=game-catalog.json" >> "$GITHUB_ENV"
          echo "HOMEPAGE_STATUS_PATH=company-status.json" >> "$GITHUB_ENV"
          echo 'HOMEPAGE_VERIFIED_PUBLIC_STATUS_CANDIDATE=READY'

      - name: Sync top rated validated test candidates
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/remotes/origin/$COMPANY_RUNTIME_BRANCH"; then
            node --check tools/homepage-test-candidate-sync.mjs
            COMPANY_RUNTIME_REF="origin/$COMPANY_RUNTIME_BRANCH" node tools/homepage-test-candidate-sync.mjs
          else
            echo 'HOMEPAGE_TEST_SYNC=NO_RUNTIME_BRANCH'
          fi

      - name: Run homepage manager contract
        run: node tools/homepage-manager.mjs

      - name: Validate homepage live files, official routes and top30 test shelf
        run: |
          set -euo pipefail
          for file in \
            index.html company.html game-catalog.json company-status.json test-game-candidates.json \
            public-release-baselines.json game-artbooks.json artbook-viewer.html \
            assets/homepage-enhancements.js assets/homepage-enhancements-core.js assets/artbook-viewer.js manifest.webmanifest install.html sw.js offline.html command.html \
            COMPANY_FLOW.md company-directive.json HOMEPAGE_OPERATIONS.md REMOTE_AUTOMATION.md _headers; do
            test -f "$file"
          done
          node -e "for (const file of ['game-catalog.json','company-status.json','test-game-candidates.json','public-release-baselines.json','game-artbooks.json','company-directive.json','manifest.webmanifest']) JSON.parse(require('fs').readFileSync(file,'utf8'))"
          node --check assets/homepage-enhancements.js
          node --check assets/homepage-enhancements-core.js
          node --check assets/artbook-viewer.js
          node --check tools/homepage-manager.mjs
          node --check tools/homepage-test-candidate-sync.mjs
          node --test qa/homepage-manager-publication-order.test.mjs
          grep -Fq '/assets/homepage-enhancements.js' index.html
          grep -Fq 'const SYNC_INTERVAL_MS=5000;' assets/homepage-enhancements-core.js
          grep -Fq "const RAW_MAIN_BASE='https://raw.githubusercontent.com/hans1177/jaewoon-games/main';" assets/homepage-enhancements-core.js
          grep -Fq "const RAW_RUNTIME_BASE='https://raw.githubusercontent.com/hans1177/jaewoon-games/company-runtime';" assets/homepage-enhancements-core.js
          node <<'NODE'
          const fs=require('fs');
          const catalog=JSON.parse(fs.readFileSync(process.env.HOMEPAGE_CATALOG_PATH||'game-catalog.json','utf8'));
          const tests=JSON.parse(fs.readFileSync('test-game-candidates.json','utf8'));
          const failures=[];
          for(const game of catalog.games||[]){
            const official=game.homepageOfficialCard===true||String(game.productionClass||'').toUpperCase()==='RELEASE_CONFIRMED';
            if(!official||game.homepageWebPlayable!==true)continue;
            const webPath=String(game.webPath||'').replace(/^\/+|\/+$/g,'');
            const expected=`web-games/${game.id}`;
            const index=webPath?`${webPath}/index.html`:'';
            if(webPath!==expected||!index||!fs.existsSync(index)||fs.statSync(index).size<512)failures.push(`official:${game.id}`);
          }
          const rows=tests.candidates||[];
          if(rows.length>30)failures.push(`test-overflow:${rows.length}`);
          for(let i=0;i<rows.length;i++){
            const row=rows[i],score=Number(row.strictScore??row.reviewScore??row.totalScore??row.score);
            const hard=Array.isArray(row.strictReviewHardFailures)?row.strictReviewHardFailures:['MISSING'];
            if(row.homepageTestCandidate!==true||row.homepageOfficialCard!==false||row.homepageTestVerdict!=='PASS'||!Number.isFinite(score)||score<80||hard.length!==0)failures.push(`test-contract:${row.gameId||row.id}`);
            if(i&&score>Number(rows[i-1].strictScore??rows[i-1].score))failures.push('test-score-order');
            const web=String(row.webPath||row.testUrl||'').replace(/^\/+|\/+$/g,'');
            if(!web||!fs.existsSync(`${web}/index.html`)||fs.statSync(`${web}/index.html`).size<512)failures.push(`test-web:${row.gameId||row.id}`);
            if(!row.artbookSource||!fs.existsSync(row.artbookSource))failures.push(`test-artbook:${row.gameId||row.id}`);
          }
          if(failures.length)throw new Error(`homepage route/test failures: ${failures.join(',')}`);
          console.log(`HOMEPAGE_TEST_SHELF_QA=PASS COUNT=${rows.length}/30 MIN_SCORE=80`);
          console.log('HOMEPAGE_OFFICIAL_CARD_BOUNDARY=PASS');
          NODE
          node <<'NODE'
          const fs=require('fs');
          const catalog=JSON.parse(fs.readFileSync(process.env.HOMEPAGE_CATALOG_PATH||'game-catalog.json','utf8'));
          const registry=JSON.parse(fs.readFileSync('game-artbooks.json','utf8'));
          const tests=JSON.parse(fs.readFileSync('test-game-candidates.json','utf8'));
          const games=new Set((catalog.games||[]).map(game=>String(game.id||'').trim()).filter(Boolean));
          const testGameIds=new Set((tests.candidates||[]).filter(row=>row.homepageTestCandidate===true).map(row=>String(row.gameId||row.id||'').trim()).filter(Boolean));
          const visible=(registry.artbooks||[]).filter(book=>book.published===true||book.homepageVisible===true);
          const failures=[];
          for(const book of visible){
            const gameId=String(book.gameId||'').trim();
            const currentTestArtbook=book.homepageTestCandidate===true&&testGameIds.has(gameId);
            if(!games.has(gameId)&&!currentTestArtbook){failures.push(`${book.id}:catalog`);continue;}
            const source=String(book.sourceFile||'').replace(/^\/+/, '');
            if(!source||!fs.existsSync(source)){failures.push(`${book.id}:source`);continue;}
            if(source.endsWith('.json')){try{JSON.parse(fs.readFileSync(source,'utf8'));}catch{failures.push(`${book.id}:json`);}}
          }
          const core=fs.readFileSync('assets/homepage-enhancements-core.js','utf8');
          const entry=fs.readFileSync('assets/homepage-enhancements.js','utf8');
          const viewer=fs.readFileSync('assets/artbook-viewer.js','utf8');
          if(!core.includes('getLatestArtbook(')||!core.includes('/artbook-viewer.html?game='))failures.push('homepage:artbook-link-contract');
          if(!entry.includes('TEST_SHELF_LIMIT=30')||!entry.includes('TEST_SHELF_MIN_SCORE=80')||!entry.includes('enforceOfficialCardVisibility'))failures.push('homepage:test-shelf-contract');
          if(!viewer.includes("loadJson('/game-artbooks.json'"))failures.push('viewer:registry-contract');
          if(failures.length)throw new Error(`homepage artbook failures: ${failures.join(',')}`);
          console.log(`HOMEPAGE_ARTBOOK_QA=PASS COUNT=${visible.length}`);
          NODE
          grep -Fq 'homepageOperations:' COMPANY_FLOW.md
          grep -Fq 'maxVisibleTestCandidates: 30' COMPANY_FLOW.md
          grep -Fq 'webStrictScoreMinimum: 80' COMPANY_FLOW.md
          grep -Fq 'SINGLE_MANAGER_WITH_SINGLE_POST_WORK_SUPERVISOR' COMPANY_FLOW.md
          grep -Fq 'PWA_COMMAND_CHAT_WINDOW' COMPANY_FLOW.md
          grep -Fq '홈페이지 단일 사후 감독' .github/agents/director.agent.md
          grep -Fxq '/*.json' _headers
          grep -Fxq '/assets/*' _headers
          echo 'HOMEPAGE_RUNTIME_DATA_SYNC=PASS'
          echo 'HOMEPAGE_LIVE_SYNC=PASS'
          echo 'HOMEPAGE_MANAGER_SELF_QA=PASS'

      - name: Capture exact self-QA candidate
        id: capture
        shell: bash
        run: |
          set -euo pipefail
          candidate_dir='.homepage-candidate'
          rm -rf "$candidate_dir"
          mkdir -p "$candidate_dir"
          published_paths=(company-status.json game-catalog.json test-game-candidates.json game-artbooks.json web-games artbook-submissions)
          base_sha="$(git rev-parse HEAD)"
          git add -- "${published_paths[@]}"
          git diff --cached --binary HEAD -- "${published_paths[@]}" > "$candidate_dir/homepage-candidate.patch"
          candidate_changed=false
          if [[ -s "$candidate_dir/homepage-candidate.patch" ]]; then candidate_changed=true; fi
          patch_sha256="$(sha256sum "$candidate_dir/homepage-candidate.patch" | awk '{print $1}')"
          BASE_SHA="$base_sha" PATCH_SHA256="$patch_sha256" CANDIDATE_CHANGED="$candidate_changed" node <<'NODE'
          const fs=require('fs');
          fs.writeFileSync('.homepage-candidate/homepage-candidate.json',JSON.stringify({
            version:1,
            baseSha:process.env.BASE_SHA,
            patchSha256:process.env.PATCH_SHA256,
            changed:process.env.CANDIDATE_CHANGED==='true',
            paths:['company-status.json','game-catalog.json','test-game-candidates.json','game-artbooks.json','web-games','artbook-submissions'],
          },null,2)+'\n');
          NODE
          git reset --quiet
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "candidate_changed=$candidate_changed" >> "$GITHUB_OUTPUT"
          echo "patch_sha256=$patch_sha256" >> "$GITHUB_OUTPUT"
          echo "HOMEPAGE_CANDIDATE_BASE=$base_sha"
          echo "HOMEPAGE_CANDIDATE_CHANGED=$candidate_changed"
          echo "HOMEPAGE_CANDIDATE_PATCH_SHA256=$patch_sha256"

      - name: Upload exact self-QA candidate
        uses: actions/upload-artifact@v4
        with:
          name: homepage-candidate-${{ github.run_id }}
          path: .homepage-candidate/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  director-supervision:
    name: Director Single Post-Work Supervision
    needs: manage-and-self-qa
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout supervised base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.manage-and-self-qa.outputs.base_sha }}
          fetch-depth: 1

      - name: Download exact self-QA candidate
        uses: actions/download-artifact@v4
        with:
          name: homepage-candidate-${{ github.run_id }}
          path: .homepage-candidate

      - name: Verify and apply exact self-QA candidate
        shell: bash
        run: |
          set -euo pipefail
          meta='.homepage-candidate/homepage-candidate.json'
          patch='.homepage-candidate/homepage-candidate.patch'
          test -f "$meta" && test -f "$patch"
          base_sha="$(node -p "JSON.parse(require('fs').readFileSync('$meta','utf8')).baseSha")"
          patch_sha="$(node -p "JSON.parse(require('fs').readFileSync('$meta','utf8')).patchSha256")"
          changed="$(node -p "JSON.parse(require('fs').readFileSync('$meta','utf8')).changed")"
          test "$base_sha" = "$(git rev-parse HEAD)"
          test "$base_sha" = "${{ needs.manage-and-self-qa.outputs.base_sha }}"
          test "$patch_sha" = "${{ needs.manage-and-self-qa.outputs.patch_sha256 }}"
          test "$patch_sha" = "$(sha256sum "$patch" | awk '{print $1}')"
          if [[ "$changed" == 'true' ]]; then
            git apply --check --binary "$patch"
            git apply --binary "$patch"
          else
            test ! -s "$patch"
          fi
          echo 'DIRECTOR_EXACT_HOMEPAGE_CANDIDATE=BOUND'

      - name: Verify single manager and supervisor policy
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('company-directive.json','utf8'));
          const h=d.homepageOperations;
          if(!h) throw new Error('homepageOperations missing');
          if(h.manager!=='HOMEPAGE'||h.supervisor!=='DIRECTOR') throw new Error('homepage roles mismatch');
          if(h.managerCount!==1||h.supervisorCount!==1) throw new Error('homepage role count mismatch');
          if(h.secondHomepageManagerForbidden!==true||h.secondHomepageSupervisorForbidden!==true) throw new Error('duplicate manager/supervisor not forbidden');
          if(h.fixedFunctionProtection?.ownerLocked!==true) throw new Error('fixed-function owner lock missing');
          const tests=JSON.parse(fs.readFileSync('test-game-candidates.json','utf8'));
          const rows=tests.candidates||[];
          if(rows.length>30)throw new Error('DIRECTOR_TEST_SHELF_OVER_30');
          if(rows.some(x=>x.homepageOfficialCard!==false||x.homepageTestCandidate!==true||x.homepageTestVerdict!=='PASS'||Number(x.strictScore??x.score)<80||!Array.isArray(x.strictReviewHardFailures)||x.strictReviewHardFailures.length))throw new Error('DIRECTOR_INVALID_TEST_CANDIDATE');
          NODE

      - name: Recheck owner-fixed PWA and chat contract
        run: |
          set -euo pipefail
          node tools/homepage-manager.mjs
          grep -Fq '"id": "/command.html"' manifest.webmanifest
          grep -Fq '"start_url": "/command.html"' manifest.webmanifest
          grep -Fq "navigator.serviceWorker.register('/sw.js'" install.html
          grep -Fq "navigator.serviceWorker.register('/sw.js')" command.html
          grep -Fq "'/offline.html'" sw.js
          grep -Fq 'id="attachBtn"' command.html
          grep -Fq 'id="sendBtn"' command.html
          grep -Fq 'id="claimBtn"' command.html
          echo 'DIRECTOR_HOMEPAGE_SUPERVISION=PASS'
          echo 'DIRECTOR_TEST_SHELF_SUPERVISION=PASS'
          echo 'OWNER_FIXED_PWA_CHAT_REGRESSION=PASS'

  publish-after-director:
    name: Publish Director-Approved Homepage Candidate
    needs: [manage-and-self-qa, director-supervision]
    if: github.event_name != 'pull_request' && needs.manage-and-self-qa.outputs.candidate_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.manage-and-self-qa.outputs.base_sha }}
          fetch-depth: 0

      - name: Download Director-approved candidate
        uses: actions/download-artifact@v4
        with:
          name: homepage-candidate-${{ github.run_id }}
          path: .homepage-candidate

      - name: Verify and apply Director-approved candidate
        shell: bash
        run: |
          set -euo pipefail
          meta='.homepage-candidate/homepage-candidate.json'
          patch='.homepage-candidate/homepage-candidate.patch'
          test -f "$meta" && test -f "$patch"
          base_sha="$(node -p "JSON.parse(require('fs').readFileSync('$meta','utf8')).baseSha")"
          patch_sha="$(node -p "JSON.parse(require('fs').readFileSync('$meta','utf8')).patchSha256")"
          changed="$(node -p "JSON.parse(require('fs').readFileSync('$meta','utf8')).changed")"
          test "$changed" = 'true'
          test "$base_sha" = "$(git rev-parse HEAD)"
          test "$base_sha" = "${{ needs.manage-and-self-qa.outputs.base_sha }}"
          test "$patch_sha" = "${{ needs.manage-and-self-qa.outputs.patch_sha256 }}"
          test "$patch_sha" = "$(sha256sum "$patch" | awk '{print $1}')"
          git apply --check --binary "$patch"
          git apply --binary "$patch"
          echo 'HOMEPAGE_PUBLICATION_CANDIDATE=EXACT_DIRECTOR_APPROVED_PATCH'

      - name: Publish verified homepage mirror through PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-homepage-manager'
          git config user.email 'homepage-manager@users.noreply.github.com'
          published_paths=(company-status.json game-catalog.json test-game-candidates.json game-artbooks.json web-games artbook-submissions)
          git add -- "${published_paths[@]}"
          if git diff --cached --quiet; then
            echo 'HOMEPAGE_PUBLICATION=NO_CHANGES_AFTER_DIRECTOR'
            exit 0
          fi
          branch="automation/homepage-runtime-sync-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git commit -m 'homepage: publish Director-approved runtime mirror'
          git push origin "HEAD:refs/heads/$branch"
          if pr_url="$(gh pr create --base main --head "$branch" --title 'homepage: publish Director-approved runtime mirror' --body 'Homepage Manager self-QA and Director supervision both passed on the exact same hashed candidate. Publishes verified company-status/game-catalog differences plus Web strict 80+ hard-gate-clear Top30 test-shelf assets. No pre-promotion official cards.' 2>/tmp/homepage-pr-error.log)"; then
            echo "HOMEPAGE_PUBLICATION_PR=$pr_url"
            gh pr merge "$pr_url" --squash --delete-branch
            echo 'HOMEPAGE_PUBLICATION=PR_VALIDATED_AND_MERGED_AFTER_DIRECTOR'
          else
            cat /tmp/homepage-pr-error.log >&2 || true
            echo "HOMEPAGE_PUBLICATION_BRANCH_READY=$branch"
            echo 'HOMEPAGE_PUBLICATION=BRANCH_READY_PR_PERMISSION_REQUIRED'
          fi
