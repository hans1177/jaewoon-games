name: Homepage Manager

on:
  workflow_dispatch:
  schedule:
    - cron: '20 23 * * *' # 08:20 KST
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'artbook.html'
      - 'game-catalog.json'
      - 'game-artbooks.json'
      - 'artbook-submission-queue.json'
      - 'company-status.json'
      - 'public-game-health.json'
      - 'assets/homepage-enhancements.js'
      - 'HOMEPAGE_OPERATIONS.md'
      - '.github/agents/homepage.agent.md'
      - 'tools/homepage-manager.mjs'
      - '.github/workflows/homepage-manager.yml'

permissions:
  contents: write

concurrency:
  group: homepage-manager-main
  cancel-in-progress: true

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync main
        run: git pull --ff-only origin main

      - name: Run homepage manager
        run: node tools/homepage-manager.mjs

      - name: Validate managed files
        run: |
          set -euo pipefail
          node -e "JSON.parse(require('fs').readFileSync('homepage-manager-status.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('company-status.json','utf8'))"
          grep -Fq 'short-cards -> dedicated-artbook-detail-page' homepage-manager-status.json
          grep -Fq 'artbookVisibilityIsProductionApproval' homepage-manager-status.json
          echo 'HOMEPAGE_MANAGER_QA=PASS'

      - name: Commit manager state
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-homepage-manager'
          git config user.email 'actions@users.noreply.github.com'
          git add homepage-manager-status.json company-status.json
          if git diff --cached --quiet; then
            echo 'HOMEPAGE_MANAGER_COMMIT=NO_CHANGES'
            exit 0
          fi
          git commit -m 'homepage: record manager maintenance state [skip ci]'
          git pull --rebase origin main
          git push origin main
          echo 'HOMEPAGE_MANAGER_COMMIT=SUCCESS'
