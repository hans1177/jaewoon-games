name: Homepage Manager

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homepage-manager-manual
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Run homepage diagnostics
        run: node tools/homepage-manager.mjs

      - name: Validate homepage files
        run: |
          set -euo pipefail
          test -f index.html
          test -f game-catalog.json
          node -e "JSON.parse(require('fs').readFileSync('game-catalog.json','utf8'))"
          grep -Fq '/assets/homepage-enhancements.js' index.html
          echo 'HOMEPAGE_DIAGNOSTICS=PASS'
