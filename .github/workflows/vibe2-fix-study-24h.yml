name: Vibe2 Fix Study 24H

on:
  push:
    branches:
      - fix/vibe2-study-24h

permissions:
  contents: write

jobs:
  fix-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: fix/vibe2-study-24h
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Align Experience schema contract
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path

          runtime_path = Path('vibe2-runtime.json')
          runtime = json.loads(runtime_path.read_text(encoding='utf-8'))
          versions = runtime['documentation']['machineStateVersions']
          actual = versions.get('experience')
          if actual not in (1, 3):
              raise SystemExit(f'unexpected experience metadata version: {actual}')
          versions['experience'] = 3
          runtime_path.write_text(json.dumps(runtime, indent=2) + '\n', encoding='utf-8')

          test_path = Path('qa/vibe2-handoff.test.mjs')
          text = test_path.read_text(encoding='utf-8')
          replacements = {
              "const experience = { version: 1, records: [{ id: 'x' }] };": "const experience = { version: 3, records: [{ id: 'x' }] };",
              "assert.equal(snapshot.generatedFrom.experienceVersion, 1);": "assert.equal(snapshot.generatedFrom.experienceVersion, 3);",
              "const experience = { version: 1, records: [] };": "const experience = { version: 3, records: [] };",
              "JSON.stringify({ version:1, records:[] })": "JSON.stringify({ version:3, records:[] })",
              "JSON.stringify({ version:1, records:[] }, null, 2)": "JSON.stringify({ version:3, records:[] }, null, 2)",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected test contract: {old}')
              text = text.replace(old, new)
          test_path.write_text(text, encoding='utf-8')
          PY

      - name: Run focused Core QA
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/vibe2-handoff.mjs
          node --check tools/vibe2-game-study-queue.mjs
          node --test qa/vibe2-handoff.test.mjs qa/vibe2-game-study.test.mjs

      - name: Commit verified fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-vibe2-fix'
          git config user.email 'vibe2-fix@users.noreply.github.com'
          git rm .github/workflows/vibe2-fix-study-24h.yml
          git add vibe2-runtime.json qa/vibe2-handoff.test.mjs
          git commit -m "fix(vibe2): align Experience schema contract"
          git push origin HEAD:fix/vibe2-study-24h
