name: Vibe2 Parallelism Contract QA

on:
  pull_request:
    paths:
      - 'COMPANY_FLOW.md'
      - 'VIBE2_PARALLEL_ARCHITECTURE.md'
      - '.github/workflows/vibe2-24h-runner.yml'
      - '.github/workflows/vibe2-continuous-core.yml'
      - 'vibe2-runtime.json'
      - 'tools/vibe2-adaptive-backpressure.mjs'
      - 'tools/vibe2-queue-control.mjs'
      - 'qa/vibe2-parallelism-main-contract.test.mjs'
      - 'qa/vibe2-parallelism-20-contract.test.mjs'
      - '.github/workflows/vibe2-parallelism-contract-qa.yml'
  push:
    branches: [main]
    paths:
      - 'COMPANY_FLOW.md'
      - 'VIBE2_PARALLEL_ARCHITECTURE.md'
      - '.github/workflows/vibe2-24h-runner.yml'
      - '.github/workflows/vibe2-continuous-core.yml'
      - 'vibe2-runtime.json'
      - 'tools/vibe2-adaptive-backpressure.mjs'
      - 'tools/vibe2-queue-control.mjs'
      - 'qa/vibe2-parallelism-main-contract.test.mjs'
      - 'qa/vibe2-parallelism-20-contract.test.mjs'
      - '.github/workflows/vibe2-parallelism-contract-qa.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  parallelism-contract:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify self-adaptive GAME_PRIMARY parallelism contract
        run: node --test qa/vibe2-parallelism-main-contract.test.mjs qa/vibe2-parallelism-20-contract.test.mjs
