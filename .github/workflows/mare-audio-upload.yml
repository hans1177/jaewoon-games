# 파일명: .github/workflows/mare-audio-upload.yml
# 기존 마리 에센시아 CC0 오디오 등록 작업. 등록 ID/영수증은 main 직접 쓰기 대신 기존 PR 검토로 전달한다.
name: Mare Audio Upload
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mare-audio-upload.yml'
      - 'roblox-games/mare-essentia/audio/manifest.json'
      - 'tools/mare-audio-upload.mjs'
  workflow_dispatch:
    inputs:
      universe_id:
        type: string
        required: false
        default: '10775310508'
      fresh:
        description: '0 = 기존 등록 보존. 이전 오디오 강제 재등록 불가'
        type: string
        required: false
        default: '0'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mare-audio-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify rights, hashes and encoded audio
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg unzip
          AUDIO_CC0_PREFLIGHT=1 node tools/mare-audio-upload.mjs
      - name: Upload verified audio and grant Universe use
        id: upload
        continue-on-error: true
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_DEPLOY_API_KEY || secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          MARE_UNIVERSE_ID: ${{ inputs.universe_id || '10775310508' }}
          ROBLOX_CREATOR_USER_ID: '11664914771'
          AUDIO_FRESH: '0'
        run: node tools/mare-audio-upload.mjs
      - name: Propose verified audio IDs through existing main PR review
        if: ${{ always() && (steps.upload.outcome == 'success' || steps.upload.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'mare-audio-upload'
          git config user.email 'actions@users.noreply.github.com'
          git add roblox-games/mare-essentia/audio/manifest.json roblox-games/mare-essentia/audio/uploaded.json roblox-games/mare-essentia/src/ReplicatedStorage/Shared/AudioIds.luau
          # 다운로드·변환된 실제 OGG를 Git LFS 포인터가 아닌 일반 Git 바이너리로 저장한다.
          # 업로드 영수증의 SHA-256과 작업트리/스테이징 바이너리 모두 일치해야 PR을 생성한다.
          node --input-type=module <<'AUDIO_ASSET_VERIFY'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const base='roblox-games/mare-essentia/audio/';
          const manifest=JSON.parse(fs.readFileSync(base+'manifest.json','utf8'));
          const receipts=JSON.parse(fs.readFileSync(base+'uploaded.json','utf8'));
          const paths=[];
          for(const track of manifest.tracks.filter(track=>track.license==='CC0-1.0')){
            const file=base+track.file;
            if(!fs.existsSync(file))throw Error('AUDIO_BINARY_MISSING '+track.name);
            const bytes=fs.readFileSync(file);
            if(bytes.subarray(0,4).toString()!=='OggS')throw Error('AUDIO_BINARY_NOT_OGG '+track.name);
            const sha=crypto.createHash('sha256').update(bytes).digest('hex');
            const receipt=receipts[track.name];
            if(!receipt?.granted || receipt.sha256!==sha || !/^[1-9][0-9]*$/.test(String(receipt.assetId||'')))
              throw Error('AUDIO_BINARY_UPLOAD_RECEIPT_MISMATCH '+track.name);
            paths.push(file);
          }
          // 복구 대상 12개가 과거 LFS 포인터였더라도 새로 검증된 실제 OGG 바이트를 스테이징한다.
          if(paths.length)execFileSync('git',['-c','filter.lfs.clean=cat','add','--',...paths]);
          for(const file of paths){
            const staged=execFileSync('git',['show',':'+file],{maxBuffer:12*1024*1024});
            const actual=fs.readFileSync(file);
            if(staged.subarray(0,4).toString()!=='OggS' || !staged.equals(actual))
              throw Error('AUDIO_GIT_STAGED_POINTER_OR_MISMATCH '+file);
          }
          console.log('AUDIO_REAL_BINARIES_STAGED '+paths.length);
          AUDIO_ASSET_VERIFY
          if git diff --cached --quiet; then echo 'AUDIO_IDS_ALREADY_CURRENT'; exit 0; fi
          branch="assets/mare-audio-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git commit -m 'assets(mare): bind verified CC0 audio IDs'
          git push origin "HEAD:$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title 'assets(mare): bind verified audio IDs' \
            --body 'CC0 원본·해시와 파일 디코딩은 오디오 등록 단계에서 확인. 업로드 결과와 Universe 사용 권한 기록을 반영할 후보. 실제 Roblox Studio/모바일 재생·볼륨·루프 QA 및 F0~F9를 완료 전제로 주장하지 않는다.'
      - name: Report upload failures accurately
        if: ${{ always() && steps.upload.outcome == 'failure' }}
        run: |
          echo 'AUDIO_UPLOAD_FAILED; preserve candidate receipts, no completed or PASS claim'
          exit 1
