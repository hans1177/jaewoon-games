name: 웹게임 표준 구조 이전

on:
  push:
    paths:
      - '.github/workflows/migrate-web-games.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 웹게임 구조 이전
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p web-games/insect-survival
          mkdir -p web-games/daechung-rpg
          mkdir -p web-games/island-village
          mkdir -p web-games/egg-heist
          mkdir -p web-games/monster-adventure

          cp play_survival_v4.html web-games/insect-survival/index.html
          cp rpg-play.html web-games/daechung-rpg/index.html
          cp island.html web-games/island-village/index.html
          cp egg-heist.html web-games/egg-heist/index.html
          cp monster-adventure.html web-games/monster-adventure/index.html

          rm -rf web-games/crystal-defense web-games/bug-defense web-games/human-go
          cp -R crystal-defense web-games/crystal-defense
          cp -R bug-defense web-games/bug-defense
          cp -R human-go web-games/human-go

          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              "link:'/play_survival_v4.html'": "link:'/web-games/insect-survival/'",
              "link:'/crystal-defense/'": "link:'/web-games/crystal-defense/'",
              "link:'/bug-defense/'": "link:'/web-games/bug-defense/'",
              "link:'/human-go/'": "link:'/web-games/human-go/'",
              "link:'/rpg-play.html'": "link:'/web-games/daechung-rpg/'",
              "link:'/island.html'": "link:'/web-games/island-village/'",
              "link:'/egg-heist.html'": "link:'/web-games/egg-heist/'",
              "link:'/monster-adventure.html'": "link:'/web-games/monster-adventure/'",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'기존 대문 링크를 찾지 못함: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: 구조 검사
        shell: bash
        run: |
          set -euo pipefail
          test -f web-games/insect-survival/index.html
          test -f web-games/crystal-defense/index.html
          test -f web-games/bug-defense/index.html
          test -f web-games/human-go/index.html
          test -f web-games/daechung-rpg/index.html
          test -f web-games/island-village/index.html
          test -f web-games/egg-heist/index.html
          test -f web-games/monster-adventure/index.html
          grep -q "link:'/web-games/insect-survival/'" index.html
          grep -q "link:'/web-games/crystal-defense/'" index.html
          grep -q "link:'/web-games/bug-defense/'" index.html
          grep -q "link:'/web-games/human-go/'" index.html
          grep -q "link:'/web-games/daechung-rpg/'" index.html
          grep -q "link:'/web-games/island-village/'" index.html
          grep -q "link:'/web-games/egg-heist/'" index.html
          grep -q "link:'/web-games/monster-adventure/'" index.html

      - name: main 반영
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/migrate-web-games.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo '변경 없음'
            exit 0
          fi
          git commit -m '웹게임 8종 표준 구조 이전'
          git push origin main
