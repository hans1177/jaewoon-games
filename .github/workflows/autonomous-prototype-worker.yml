name: Autonomous Prototype Worker

on:
  push:
    branches: [main]
    paths:
      - '.autonomous/prototype-request.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autonomous-dev-writer
  cancel-in-progress: false

env:
  AUTONOMOUS_LOCAL_MODEL: qwen3:0.6b
  OLLAMA_HOST: 127.0.0.1:11434

jobs:
  prototype-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate prototype worker on main
        run: |
          node --check tools/autonomous-prototype-worker.mjs
          node --test qa/autonomous-prototype-worker.test.mjs
          node --test qa/autonomous-development-worker.test.mjs
          node --test qa/incubator-promotion-state.test.mjs
      - name: Preserve exact request
        shell: bash
        run: |
          set -euo pipefail
          test -f .autonomous/prototype-request.json
          cp .autonomous/prototype-request.json /tmp/jaewoon-prototype-request.json
          node - <<'NODE' >> "$GITHUB_ENV"
          const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/jaewoon-prototype-request.json','utf8'));
          for(const [k,v] of Object.entries({PROTOTYPE_PROJECT_ID:r.projectId,PROTOTYPE_INCUBATOR_ID:r.candidateId,PROTOTYPE_SOURCE_PATH:r.sourcePath}))console.log(`${k}=${v}`);
          NODE
      - name: Sync latest main into continuous development line
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "jaewoon-autonomous-sync"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main autonomous-dev
          git checkout -B autonomous-dev-base origin/autonomous-dev
          git merge --no-edit origin/main
          node --check tools/autonomous-prototype-worker.mjs
          node --test qa/autonomous-prototype-worker.test.mjs
          git push origin HEAD:autonomous-dev
          echo "AUTONOMOUS_DEV_SYNCED=$(git rev-parse HEAD)"
          echo 'PUBLIC_MAIN_WRITE=NO'
      - name: Create candidate branch from synced continuous development line
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          branch="autonomous/candidate-prototype-${PROTOTYPE_PROJECT_ID,,}-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
          echo 'PUBLIC_MAIN_BASE=NO'
      - name: Install local Ollama
        shell: bash
        run: |
          set -euo pipefail
          installed=0
          for attempt in 1 2 3; do
            if curl -fsSL --retry 3 --retry-all-errors --connect-timeout 15 https://ollama.com/install.sh | sh; then installed=1; break; fi
            sleep $((attempt * 4))
          done
          test "$installed" = 1
          nohup ollama serve > /tmp/ollama-prototype.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
      - name: Pull free local model
        run: |
          ollama pull "$AUTONOMOUS_LOCAL_MODEL"
          echo 'PAID_API=NO'
          echo 'MODEL_CALLS_MAX=1'
      - name: Generate new-game candidate only
        env:
          AUTONOMOUS_PROTOTYPE_REQUEST: /tmp/jaewoon-prototype-request.json
          AUTONOMOUS_CANDIDATE_ID: prototype-${{ env.PROTOTYPE_INCUBATOR_ID }}-${{ github.run_id }}
        run: node tools/autonomous-prototype-worker.mjs
      - name: Candidate syntax and scope QA
        shell: bash
        run: |
          set -euo pipefail
          evidence=".autonomous/evidence/prototype-${PROTOTYPE_INCUBATOR_ID}-${GITHUB_RUN_ID}.json"
          test -f "$evidence"
          candidate_path="$(node -e "const e=require('./$evidence');process.stdout.write(e.candidatePath)")"
          test -f "$candidate_path/index.html"
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find "$candidate_path" -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -print0)
          git diff --check
          echo 'PROTOTYPE_CANDIDATE_QA=PASS'
          echo 'PUBLIC_STABLE_MODIFIED=NO'
      - name: Push candidate branch for independent promotion gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "jaewoon-prototype-worker"
          git config user.email "prototype-worker@users.noreply.github.com"
          git add -f "web-games/.autonomous-candidates/${PROTOTYPE_PROJECT_ID}" ".autonomous/evidence/prototype-${PROTOTYPE_INCUBATOR_ID}-${GITHUB_RUN_ID}.json"
          git commit -m "candidate: ${PROTOTYPE_PROJECT_ID} incubator prototype ${GITHUB_RUN_ID}"
          git push origin "HEAD:${{ steps.branch.outputs.name }}"
          echo 'SELF_PROMOTE=NO'
          echo 'NEXT_GATE=AUTONOMOUS_CANDIDATE_PROMOTION'
