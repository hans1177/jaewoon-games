# internal redeploy kick: asset-world-midnight-expanded-rules 2026-09-22
name: Owner Roblox Dedicated Private Experiences

on:
  workflow_dispatch:
    inputs:
      game_id:
        description: Optional exact owner-selected game id
        required: false
        type: string
  pull_request:
    paths:
      - '.github/workflows/owner-roblox-dedicated-private-experiences.yml'
      - 'tools/company-roblox-dedicated-experience.mjs'
      - 'qa/company-roblox-dedicated-experience.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/owner-roblox-dedicated-private-experiences.yml'
      - 'tools/company-roblox-dedicated-experience.mjs'
      - 'qa/company-roblox-dedicated-experience.test.mjs'
      - 'roblox-games/cozy-island/**'
      - 'roblox-games/fantasy-survival/**'

permissions:
  contents: write
  pull-requests: write

## [중복 등록 병목] 동일 main 소스의 로블록스 게시를 직렬화해 두 개의 에셋 업로드가 겹치지 않게 한다.
## 실행 중인 게시를 취소하면 로블록스 자산 등록이 반쯤 끝나므로 마지막 실행을 보존한다.
concurrency:
  group: owner-roblox-dedicated-private-experiences-${{ inputs.game_id || 'main' }}
  cancel-in-progress: false

env:
  COMPANY_RUNTIME_BRANCH: company-runtime

jobs:
  contract:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      count: ${{ steps.targets.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - if: github.event_name == 'pull_request'
        run: node --test qa/company-roblox-dedicated-experience.test.mjs
      - name: Select exact owner publication targets
        id: targets
        env:
          REQUESTED_GAME_ID: ${{ inputs.game_id || '' }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before || '' }}
        shell: bash
        run: |
          set -euo pipefail
          # [정체·중복 처리] 새 main이 이미 존재하면 지난 커밋의 등록·게시를 실행하지 않는다.
          # 보안·라이선스/F0~F9 검사를 생략하지 않으며 최신 main 게시 요청은 그대로 검사한다.
          if [[ "$EVENT_NAME" == 'push' || "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            git fetch --no-tags --depth=1 origin main
            if [[ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]]; then
              echo "OWNER_STALE_MAIN_REVISION=SKIP_SUPERSEDED_SOURCE"
              printf 'matrix={"include":[]}\ncount=0\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [[ "$EVENT_NAME" == 'push' && "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ && "$BEFORE_SHA" != '0000000000000000000000000000000000000000' ]]; then
            git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
            git diff --name-only "$BEFORE_SHA" HEAD -- roblox-games/ .github/workflows/owner-roblox-dedicated-private-experiences.yml > /tmp/owner-changed-source.txt
          else
            : > /tmp/owner-changed-source.txt
          fi
          node <<'NODE'
          const fs=require('fs');
          const games=[
            {gameId:'cozy-island',gameName: '포근섬: 작은 왕국 키우기'},
            {gameId:'daechung-rpg',gameName: '포탈 알피지'},
            {gameId:'horror-escape-room',gameName: '심야 대탈출'},
            {gameId:'fantasy-survival',gameName: '마력숲 생존기'},
          ];
          const requested=String(process.env.REQUESTED_GAME_ID||'').trim();
          if(requested&&!games.some(row=>row.gameId===requested))throw Error('OWNER_GAME_NOT_SUPPORTED');
          const changed=fs.readFileSync('/tmp/owner-changed-source.txt','utf8').split('\n').filter(Boolean);
          const exact=games.filter(row=>changed.some(file=>file.startsWith('roblox-games/'+row.gameId+'/'))
            ||(row.gameId==='fantasy-survival'&&changed.includes('.github/workflows/owner-roblox-dedicated-private-experiences.yml')));
          const selected=requested?games.filter(row=>row.gameId===requested):exact.length?exact:process.env.EVENT_NAME==='workflow_dispatch'?games.filter(row=>row.gameId!=='fantasy-survival'):[];
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'matrix='+JSON.stringify({include:selected})+'\ncount='+selected.length+'\n');
          console.log('OWNER_DIRECT_SELECTED_GAMES='+selected.map(row=>row.gameId).join(','));
          NODE

  publish:
    needs: contract
    if: github.event_name != 'pull_request' && needs.contract.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.contract.outputs.matrix) }}
    concurrency:
      group: owner-roblox-private-game-${{ matrix.gameId }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
          fetch-depth: 1

      - name: Checkout company runtime
        uses: actions/checkout@v4
        with:
          ref: company-runtime
          path: runtime
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Rojo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rojo-bin
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip
          echo '22503e5839864f9d7c2171c48b536fc229f2cc4d8774c9cc149f60941d864073  /tmp/rojo.zip' | sha256sum -c -
          unzip -q /tmp/rojo.zip -d /tmp/rojo-bin
          chmod +x /tmp/rojo-bin/rojo

      - name: Resolve existing dedicated target
        id: reuse
        working-directory: main
        env:
          GAME_ID: ${{ matrix.gameId }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const q=JSON.parse(fs.readFileSync('../runtime/development-queue.json','utf8'));
          const item=(q.items||[]).find(x=>x.gameId===process.env.GAME_ID);
          if(!item)throw new Error('queue item missing: '+process.env.GAME_ID);
          const valid=v=>/^[1-9][0-9]*$/.test(String(v||''));
          const t=item.robloxPublicationTarget||(process.env.GAME_ID==='fantasy-survival'?item.robloxValidationTarget:null)||{};
          const registryPath='../runtime/roblox-dedicated-targets.json';
          const registry=fs.existsSync(registryPath)?JSON.parse(fs.readFileSync(registryPath,'utf8')):{targets:[]};
          const registered=(registry.targets||[]).find(row=>row.gameId===process.env.GAME_ID)||{};
          const currentDedicated=t.dedicated===true&&t.shared!==true&&valid(t.universeId)&&valid(t.placeId);
          const registeredDedicated=registered.dedicated===true&&registered.shared!==true&&valid(registered.universeId)&&valid(registered.placeId);
          const chosen=currentDedicated?t:(registeredDedicated?registered:{});
          const dedicated=valid(chosen.universeId)&&valid(chosen.placeId);
          if(process.env.GAME_ID==='fantasy-survival'&&(!dedicated||chosen.verified!==true||String(chosen.universeId)!=='10773436325'||String(chosen.placeId)!=='108565970231899'))throw Error('OWNER_FOREST_EXISTING_PRIVATE_TARGET_REQUIRED');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'universe_id='+(dedicated?chosen.universeId:'')+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'place_id='+(dedicated?chosen.placeId:'')+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'reuse='+(dedicated?'true':'false')+'\n');
          console.log('ROBLOX_DEDICATED_TARGET_REUSE='+(dedicated?'YES':'NO'));
          if(registeredDedicated&&!currentDedicated)console.log('ROBLOX_DEDICATED_TARGET_RECOVERED_FROM_REGISTRY=YES');
          NODE

      # [마력숲 원본 등록] 기존 CC0 생산기를 재사용한다. 등록이 안 된 상태에서는
      # 이번 Place 게시를 중단하고 원본 ID/해시를 main 병합용 PR로 보존한다.
      - name: Register approved Forest village originals through the existing asset pipeline
        if: matrix.gameId == 'fantasy-survival'
        working-directory: main
        env:
          ROBLOX_UNIVERSE_ID: ${{ steps.reuse.outputs.universe_id }}
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_ROBLOSECURITY: ${{ secrets.ROBLOX_ROBLOSECURITY }}
          ROBLOX_SECURITY_COOKIE: ${{ secrets.ROBLOX_SECURITY_COOKIE }}
          ROBLOX_CREATOR_USER_ID: ${{ secrets.ROBLOX_CREATOR_USER_ID }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$ROBLOX_UNIVERSE_ID" = '10773436325'
          if node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const registry=JSON.parse(fs.readFileSync('roblox-games/fantasy-survival/CC0-ASSET-REGISTRY.json','utf8'));
          const ids=fs.readFileSync('roblox-games/fantasy-survival/shared/VisualAssetIds.luau','utf8');
          const village=registry.villagePrefabs;
          if(village?.sourceVerified!==true||Object.keys(village.models||{}).length!==23)
            throw Error('FOREST_VILLAGE_APPROVED_SOURCE_SET_REQUIRED');
          const valid=village.registrationVerified===true&&Object.entries(village.models).every(([role,row])=>
            Number.isSafeInteger(row.assetId)&&row.assetId>0
            &&ids.includes(role+'='+row.assetId));
          process.exit(valid?0:1);
          NODE
          then
            echo "FOREST_VILLAGE_REGISTERED=YES"
            exit 0
          fi
          # 열려 있는 등록 PR을 중복 실행하거나 외부 자산을 중복 업로드하지 않는다.
          if [[ "$(gh pr list --state open --head asset/fantasy-village-originals --json number --jq 'length')" != "0" ]]; then
            echo "FOREST_VILLAGE_REGISTRATION_PR_PENDING"
            exit 1
          fi
          # 기존 원본 등록 경로에서만 네 개의 CC0 완성 집 메시를 변환한다.
          # [원본 Blender GLB 변환] Ubuntu Blender는 glTF 내보내기에서
          # NumPy를 요구한다. 존재하는 Blender만 검사하면 모듈 부족으로 실패한다.
          if ! command -v blender >/dev/null 2>&1 || ! dpkg-query -W -f='${Status}' python3-numpy 2>/dev/null | grep -qx 'install ok installed'; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq blender python3-numpy
          fi
          python3 tools/baeksu-war-author-meshes.py -- /tmp/forest-village-assets --game-id=fantasy-survival
          node tools/baeksu-war-upload-meshes.mjs /tmp/forest-village-assets /tmp/forest-village-receipt.json --game-id=fantasy-survival
          # 기존 모델 ID를 보존하고 새 모델을 등록하고 기존 10종 원본 ID가 보존됐는지 재검사한다.
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const registry=JSON.parse(fs.readFileSync('roblox-games/fantasy-survival/CC0-ASSET-REGISTRY.json','utf8'));
          const village=registry.villagePrefabs;
          const ids=fs.readFileSync('roblox-games/fantasy-survival/shared/VisualAssetIds.luau','utf8');
          if(village?.registrationVerified!==true||Object.keys(village.models||{}).length!==23
            ||!Object.entries(village.models).every(([role,row])=>
              Number.isSafeInteger(row.assetId)&&row.assetId>0
              &&(row.sourceFile.endsWith('.zip')?(/^[a-f0-9]{64}$/.test(row.sha256)&&row.sha256!==row.sourceSha256):row.sourceSha256===row.sha256)
              &&ids.includes(role+'='+row.assetId)))
            throw Error('FOREST_VILLAGE_REGISTRATION_PROOF_INCOMPLETE');
          console.log('FOREST_VILLAGE_REGISTERED_MODELS='+Object.keys(village.models).length);
          NODE
          git config user.name 'jaewoon-roblox-asset-register'
          git config user.email 'actions@users.noreply.github.com'
          git switch -c asset/fantasy-village-originals
          git add roblox-games/fantasy-survival/CC0-ASSET-REGISTRY.json roblox-games/fantasy-survival/shared/VisualAssetIds.luau
          git commit -m 'assets(fantasy-survival): register 23 verified village originals'
          git push origin HEAD:asset/fantasy-village-originals
          gh pr create --base main --head asset/fantasy-village-originals \
            --title '마력숲 CC0 마을 건물 원본 23종 등록' \
            --body '기존 검증된 CC0 원본 등록기로 발급받은 자산 ID와 해시를 반영한다. main 병합 및 Universe 자산 사용 권한 검증 전에는 게시하지 않는다.'
          echo "FOREST_VILLAGE_REGISTRATION_AWAIT_MAIN_MERGE"
          # 새 등록은 반드시 검증된 main 소스에서만 Place에 반영한다.
          exit 1

      - name: Grant original Forest models to the existing private Universe
        if: matrix.gameId == 'fantasy-survival'
        working-directory: main
        env:
          ROBLOX_UNIVERSE_ID: ${{ steps.reuse.outputs.universe_id }}
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_ROBLOSECURITY: ${{ secrets.ROBLOX_ROBLOSECURITY }}
          ROBLOX_SECURITY_COOKIE: ${{ secrets.ROBLOX_SECURITY_COOKIE }}
        shell: bash
        run: |
          set -euo pipefail
          test "$ROBLOX_UNIVERSE_ID" = '10773436325'
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const root='roblox-games/fantasy-survival';
          const bytes=fs.readFileSync(root+'/native-assets.json');
          const manifest=JSON.parse(bytes),registry=JSON.parse(fs.readFileSync(root+'/CC0-ASSET-REGISTRY.json','utf8'));
          const sha=bytes=>crypto.createHash('sha256').update(bytes).digest('hex');
          const ids=fs.readFileSync(root+'/shared/VisualAssetIds.luau','utf8');
          const roles=['wolf','bee','golem','deer','boar','rabbit','tree','bat','mushroom','skeleton','ruin'];
          if(manifest.gameId!=='fantasy-survival'||manifest.ownerApproved!==true||manifest.license!=='CC0-1.0'
            ||Object.keys(manifest.models||{}).sort().join(',')!==[...roles].sort().join(',')
            ||registry.gameId!==manifest.gameId||registry.registrationVerified!==true
            ||registry.nativeRegistrationVersion!==1||registry.sourceManifestSha256!==sha(bytes))throw Error('OWNER_FOREST_CC0_PROVENANCE_REQUIRED');
          const selected=roles.map(role=>{
            const row=registry.models?.[role],source=manifest.models[role];
            if(!row||!Number.isSafeInteger(row.assetId)||row.assetId<1||row.license!=='CC0-1.0'
              ||row.sourceSha256!==source.sourceSha256||row.sha256!==source.sourceSha256||row.licenseEvidence!==source.licenseEvidence
              ||!new RegExp('\\b'+role+'\\s*=\\s*'+row.assetId+'\\b').test(ids))throw Error('OWNER_FOREST_MODEL_BINDING_INVALID:'+role);
            if(source.sourcePath&&(!(/^assets\/shared\/forest\/[a-z]+(?:-[a-z]+)*\.(?:fbx|glb)$/.test(source.sourcePath)
              ||((['tree','ruin'].includes(role)&&source.sourcePath===(role==='tree'?'assets/shared/party/tree.glb':'assets/shared/party/wall-broken.glb')))
                  ||(['bat','mushroom','skeleton'].includes(role)&&/^assets\/roblox\/actors\/sources\/quaternius-(?:cute|monsters)\/FBX\/[A-Za-z]+\.fbx$/.test(source.sourcePath)))
              ||sha(fs.readFileSync(source.sourcePath))!==source.sourceSha256))throw Error('OWNER_FOREST_SOURCE_HASH_INVALID:'+role);
            return row.assetId;
          });
          // [초원 마을] 기존 원본 에셋 사용 권한 검증을 동일한 공식 검수 단계에서 수행한다.
          const village=registry.villagePrefabs;
          if(village?.sourceVerified===true){
            if(village.registrationVerified!==true||Object.keys(village.models||{}).length!==23)
              throw Error('OWNER_FOREST_VILLAGE_MODEL_REGISTRATION_REQUIRED');
            const manifest=JSON.parse(fs.readFileSync('assets/shared/party/sources.json','utf8'));
            const priority=JSON.parse(fs.readFileSync('assets/external/simple-rpg/priority-v1/manifest.json','utf8'));
            const villageIds=Object.entries(village.models).map(([role,row])=>{
              const completeHouse=row.sourceFile?.startsWith('assets/external/simple-rpg/priority-v1/')&&row.sourceFile.endsWith('.zip');
              const original=completeHouse
                ?(priority.packs||[]).find(entry=>row.sourceFile==='assets/external/simple-rpg/priority-v1/'+entry.file)
                :(manifest.records||[]).find(entry=>entry.file===row.sourceFile);
              const originalDigest=completeHouse?original?.sha256:original?.sha256;
              const provenanceValid=completeHouse
                ?original?.licenseDeclared==='CC0-1.0'
                  &&original?.licenseSourceUrl==='https://opengameart.org/content/medieval-house-pack'
                  &&/^[a-f0-9]{64}$/.test(row.sha256)&&row.sha256!==row.sourceSha256
                :original?.license==='CC0-1.0'&&row.sha256===row.sourceSha256
                  &&row.licenseEvidence==='https://kenney.nl/assets/fantasy-town-kit';
              if(!original||!provenanceValid||row.license!=='CC0-1.0'
                ||originalDigest!==row.sourceSha256||row.licenseEvidence!==(completeHouse?original.licenseSourceUrl:'https://kenney.nl/assets/fantasy-town-kit')
                ||!Number.isSafeInteger(row.assetId)||row.assetId<1
                ||row.sourceFile.includes('..')||sha(fs.readFileSync(row.sourceFile))!==row.sourceSha256
                ||!new RegExp('\\b'+role+'\\s*=\\s*'+row.assetId+'\\b').test(ids))
                throw Error('OWNER_FOREST_VILLAGE_MODEL_BINDING_INVALID:'+role);
              return row.assetId;
            });
            selected.push(...villageIds);
          }
          const assetIds=selected;
          if(assetIds.length){
            // Verified CC0 models still require explicit Roblox Universe grants.
            // An owner-authenticated cookie is an official alternative to an API
            // key without asset-permissions:write; never skip grant verification.
            const url='https://apis.roblox.com/asset-permissions-api/v1/assets/permissions';
            const body=JSON.stringify({subjectType:'Universe',subjectId:String(process.env.ROBLOX_UNIVERSE_ID),
              action:'Use',requests:assetIds.map(assetId=>({assetId,grantToDependencies:true}))});
            const apiKey=String(process.env.ROBLOX_OPEN_CLOUD_API_KEY||'').trim();
            const ownerRaw=String(process.env.ROBLOX_ROBLOSECURITY||process.env.ROBLOX_SECURITY_COOKIE||'').trim();
            if(!apiKey&&!ownerRaw)throw new Error('ROBLOX_CC0_GRANT_OWNER_CREDENTIAL_REQUIRED');
            const request=async headers=>fetch(url,{method:'PATCH',headers,body,signal:AbortSignal.timeout(30000)});
            const decode=async result=>result.json().catch(()=>({}));
            const complete=(result,answer)=>{
              const granted=new Set(Array.isArray(answer?.successAssetIds)?answer.successAssetIds.map(String):[]);
              return result?.ok===true
                &&(!Array.isArray(answer?.errors)||answer.errors.length===0)
                &&assetIds.every(assetId=>granted.has(String(assetId)));
            };
            let grant=null,answer=null,authority='API_KEY';
            if(apiKey){
              grant=await request({'x-api-key':apiKey,'content-type':'application/json'});
              answer=await decode(grant);
            }
            if((!grant||grant.status===403)&&!complete(grant,answer)&&ownerRaw){
              // Roblox validates the owner and issues the CSRF challenge.
              const cookie=ownerRaw.includes('.ROBLOSECURITY=')?ownerRaw:'.ROBLOSECURITY='+ownerRaw+';';
              let headers={'content-type':'application/json',cookie};
              grant=await request(headers);
              if(grant.status===403){
                const csrf=grant.headers.get('x-csrf-token');
                if(csrf){
                  headers={...headers,'x-csrf-token':csrf};
                  grant=await request(headers);
                }
              }
              answer=await decode(grant);
              authority='OWNER_COOKIE_CSRF';
            }
            if(!complete(grant,answer)){
              // Do not log response bodies or auth material.
              const reason=String(answer?.error?.code||answer?.errors?.[0]?.code||'UNSPECIFIED')
                .replace(/[^A-Za-z0-9_]/g,'_').slice(0,64);
              console.error('ROBLOX_CC0_UNIVERSE_GRANT_DENIAL_CODE='+reason);
              if(grant?.status===403)console.error('ROBLOX_CC0_GRANT_RIGHTS_REQUIRED=ASSET_PERMISSIONS_WRITE_AND_ASSET_SUBJECT_ACCESS');
              throw new Error('ROBLOX_CC0_UNIVERSE_GRANT_INCOMPLETE_HTTP_'+(grant?.status||0));
            }
            console.log('ROBLOX_CC0_UNIVERSE_GRANT_AUTHORITY='+authority);
            console.log('ROBLOX_CC0_UNIVERSE_GRANT_ACCEPTED='+assetIds.length);
          }else console.log('ROBLOX_CC0_UNIVERSE_GRANT=NO_REGISTERED_ACTOR_USE');
          NODE

      - name: Build exact current main Roblox place
        id: build
        working-directory: main
        env:
          GAME_ID: ${{ matrix.gameId }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "roblox-games/$GAME_ID/default.project.json"
          mkdir -p /tmp/roblox-dedicated
          /tmp/rojo-bin/rojo build "roblox-games/$GAME_ID/default.project.json" -o "/tmp/roblox-dedicated/$GAME_ID.rbxlx"
          test -s "/tmp/roblox-dedicated/$GAME_ID.rbxlx"
          echo "source_revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "ROBLOX_DEDICATED_BUILD_SHA256=$(sha256sum "/tmp/roblox-dedicated/$GAME_ID.rbxlx" | awk '{print $1}')"

      - name: Create private dedicated Experience and publish
        id: live
        continue-on-error: true
        working-directory: main
        env:
          GAME_ID: ${{ matrix.gameId }}
          GAME_NAME: ${{ matrix.gameName }}
          REUSE_UNIVERSE_ID: ${{ steps.reuse.outputs.universe_id }}
          REUSE_PLACE_ID: ${{ steps.reuse.outputs.place_id }}
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_ROBLOSECURITY: ${{ secrets.ROBLOX_ROBLOSECURITY }}
          ROBLOX_SECURITY_COOKIE: ${{ secrets.ROBLOX_SECURITY_COOKIE }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --game-id "$GAME_ID"
            --game-name "$GAME_NAME"
            --place-file "/tmp/roblox-dedicated/$GAME_ID.rbxlx"
            --source-revision "${{ steps.build.outputs.source_revision }}"
            --output "/tmp/roblox-dedicated/$GAME_ID.result.json"
          )
          if [[ -n "${REUSE_UNIVERSE_ID:-}" && -n "${REUSE_PLACE_ID:-}" ]]; then
            args+=(--reuse-universe-id "$REUSE_UNIVERSE_ID" --reuse-place-id "$REUSE_PLACE_ID")
          fi
          if [[ "$GAME_ID" == 'fantasy-survival' ]]; then args+=(--avatar-rig R15); fi
          node tools/company-roblox-dedicated-experience.mjs "${args[@]}"

      - name: Upload dedicated publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roblox-dedicated-${{ matrix.gameId }}
          path: /tmp/roblox-dedicated/${{ matrix.gameId }}.result.json
          if-no-files-found: error
          retention-days: 7

      - name: Require dedicated private publish success
        if: always()
        env:
          GAME_ID: ${{ matrix.gameId }}
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const id=process.env.GAME_ID;
          const p='/tmp/roblox-dedicated/'+id+'.result.json';
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          if(r.pass!==true||r.private!==true||r.published!==true){
            throw new Error('ROBLOX_DEDICATED_PRIVATE_PUBLISH_FAILED:'+id+':'+r.stage+':'+String(r.error||'unknown'));
          }
          NODE

  persist:
    needs: [contract, publish]
    if: always() && github.event_name != 'pull_request' && needs.contract.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: company-runtime-writer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: company-runtime
          fetch-depth: 1

      - name: Download latest dedicated publication result per game
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_TARGETS_JSON: ${{ needs.contract.outputs.matrix }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/roblox-dedicated-results /tmp/roblox-dedicated-zips
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100"
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$api" > /tmp/roblox-artifacts.json
          mapfile -t names < <(node -e "const p=JSON.parse(process.env.OWNER_TARGETS_JSON);for(const row of p.include||[])console.log('roblox-dedicated-'+row.gameId)")
          for name in "${names[@]}"
          do
            id="$(jq -r --arg n "$name" '[.artifacts[] | select(.name==$n and (.expired|not))] | sort_by(.created_at) | last | .id // empty' /tmp/roblox-artifacts.json)"
            test -n "$id" || { echo "Missing latest artifact: $name" >&2; exit 1; }
            zip="/tmp/roblox-dedicated-zips/$name.zip"
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" \
              -o "$zip"
            unzip -q -o "$zip" -d /tmp/roblox-dedicated-results
            echo "ROBLOX_DEDICATED_LATEST_ARTIFACT=$name:$id"
          done

      - name: Persist dedicated Experience targets
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$COMPANY_RUNTIME_BRANCH"
          git reset --hard "origin/$COMPANY_RUNTIME_BRANCH"
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const q=JSON.parse(fs.readFileSync('development-queue.json','utf8'));
          const registryPath='roblox-dedicated-targets.json';
          const registry=fs.existsSync(registryPath)
            ?JSON.parse(fs.readFileSync(registryPath,'utf8'))
            :{version:1,authority:'company-runtime',purpose:'durable-game-specific-roblox-dedicated-target-identity',targets:[]};
          registry.targets ||= [];
          const root='/tmp/roblox-dedicated-results';
          const names=fs.existsSync(root)?fs.readdirSync(root).filter(x=>x.endsWith('.result.json')).sort():[];
          if(names.length===0)throw new Error('no dedicated Roblox results');
          const stamp=new Date().toISOString();
          const failures=[];
          for(const name of names){
            const r=JSON.parse(fs.readFileSync(path.join(root,name),'utf8'));
            const item=(q.items||[]).find(x=>x.gameId===r.gameId);
            if(!item)throw new Error('queue item missing: '+r.gameId);
            if(r.gameId==='fantasy-survival'){
              if(String(r.universeId)!=='10773436325'||String(r.placeId)!=='108565970231899')throw Error('OWNER_FOREST_RESULT_TARGET_MISMATCH');
              item.robloxOwnerDirectPublication={...r,workflowRunId:Number(process.env.GITHUB_RUN_ID)||null,
                authority:'owner-direct-github-dedicated-private-publish',releaseClaim:false,f9PassClaim:false,
                postPublishVerification:'PENDING',updatedAt:stamp};
              item.updatedAt=stamp;
              if(r.pass!==true||r.published!==true||r.private!==true)failures.push(r.gameId+':'+String(r.stage||'unknown')+':'+String(r.error||'unknown'));
              continue;
            }
            const canonicalSourceRevision=String(item.robloxSourceCommit||'').trim();
            const canonicalArtifactIdentity=String(item.robloxBuildArtifactIdentity||'').trim();
            const artifactRunId=Number(
              item.robloxRuntimeCandidateEvidence?.artifactRunId
              ||item.robloxFoundationF0Evidence?.artifactRunId
              ||item.robloxHeadlessFastMvpEvidence?.artifactRunId
              ||0
            );
            const exactPublishedArtifact=
              /^[a-f0-9]{40}$/i.test(canonicalSourceRevision)
              &&/^sha256:[a-f0-9]{64}$/i.test(canonicalArtifactIdentity)
              &&String(r.artifactIdentity||'').trim()===canonicalArtifactIdentity
              &&artifactRunId>0;
            const valid=v=>/^[1-9][0-9]*$/.test(String(v||''));
            if(valid(r.universeId)&&valid(r.placeId)){
              item.robloxPublicationTarget={
                version:3,
                gameId:r.gameId,
                universeId:String(r.universeId),
                placeId:String(r.placeId),
                verified:r.private===true,
                verifiedAt:stamp,
                lastVerifiedAt:stamp,
                source:'owner-dedicated-github-bootstrap',
                authority:'roblox-canonical-publication-target',
                dedicated:true,
                shared:false,
                visibilityIntent:'PRIVATE_OR_RESTRICTED_TEST_EXPERIENCE',
                internalOnly:true,
                publicDiscoveryAllowed:false,
                bootstrapState:r.pass===true?'PUBLISHED_PRIVATE':String(r.stage||'FAILED'),
              };
              item.robloxSharedTargetCurrent=false;
              item.robloxFastMvpSupersededBy=null;
              const registryTarget={
                gameId:r.gameId,
                universeId:String(r.universeId),
                placeId:String(r.placeId),
                dedicated:true,
                shared:false,
                private:r.private===true,
                verified:r.private===true&&r.published===true,
                source:'owner-dedicated-github-bootstrap',
                bootstrapState:r.pass===true?'PUBLISHED_PRIVATE':String(r.stage||'FAILED'),
                verifiedAt:r.pass===true?stamp:null,
                lastVerifiedAt:r.pass===true?stamp:null,
                workflowRunId:Number(process.env.GITHUB_RUN_ID)||null,
              };
              const registryIndex=registry.targets.findIndex(row=>row.gameId===r.gameId);
              if(registryIndex>=0)registry.targets[registryIndex]={...registry.targets[registryIndex],...registryTarget};
              else registry.targets.push(registryTarget);
            }
            item.robloxDedicatedExperience={
              version:2,
              gameId:r.gameId,
              sourceRevision:exactPublishedArtifact?canonicalSourceRevision:null,
              publisherMainRevision:r.sourceRevision||null,
              artifactIdentity:r.artifactIdentity||null,
              artifactRunId:exactPublishedArtifact?artifactRunId:null,
              universeId:r.universeId||null,
              placeId:r.placeId||null,
              created:r.created===true,
              reusedTarget:r.reusedTarget===true,
              configured:r.configured===true,
              private:r.private===true,
              published:r.published===true,
              versionNumber:Number(r.versionNumber)||null,
              state:r.pass===true?'PASS':'REPAIR_REQUIRED',
              stage:r.stage||null,
              error:r.error||null,
              workflowRunId:Number(process.env.GITHUB_RUN_ID)||null,
              updatedAt:stamp,
              authority:'owner-dedicated-roblox-experience-bootstrap',
            };
            if(r.pass===true){
              if(!exactPublishedArtifact){
                item.robloxDedicatedExperiencePublished=false;
                item.robloxDedicatedExperience.state='REPAIR_REQUIRED';
                item.robloxDedicatedExperience.stage='EXACT_ARTIFACT_BINDING';
                item.robloxDedicatedExperience.error='DEDICATED_PUBLISH_ARTIFACT_NOT_BOUND_TO_CANONICAL_GAME_SOURCE';
                failures.push(r.gameId+':EXACT_ARTIFACT_BINDING:DEDICATED_PUBLISH_ARTIFACT_NOT_BOUND_TO_CANONICAL_GAME_SOURCE');
                item.updatedAt=stamp;
                continue;
              }
              item.robloxDedicatedExperiencePublished=true;
              item.robloxDedicatedExperiencePublishedAt=stamp;
              item.robloxFastMvpPublished=true;
              item.robloxFastMvpPublishedAt=stamp;
              item.robloxReleaseVersionNumber=Number(r.versionNumber);
              item.robloxInternalReleaseReady=true;
              item.robloxInternalReleasePublished=true;
              item.robloxPublicRelease=false;
              item.robloxReleaseClaim=false;
              item.robloxRuntimeCandidateEvidence={
                version:2,
                gameId:r.gameId,
                platform:'ROBLOX',
                sourceRevision:canonicalSourceRevision,
                artifactIdentity:canonicalArtifactIdentity,
                artifactRunId,
                universeId:String(r.universeId),
                placeId:String(r.placeId),
                foundationF0Passed:item.robloxFoundationF0Passed===true,
                published:true,
                releaseClaim:false,
                exposure:'PRIVATE_OR_RESTRICTED_RUNTIME_CANDIDATE',
                visibilityIntent:'PRIVATE_OR_RESTRICTED_TEST_EXPERIENCE',
                versionNumber:Number(r.versionNumber),
                workflowRunId:Number(process.env.GITHUB_RUN_ID)||null,
                publishedAt:stamp,
                authority:'roblox-open-cloud-dedicated-private-runtime-candidate',
                dedicated:true,
                current:true,
                publisherMainRevision:r.sourceRevision||null,
              };
              item.robloxInternalReleaseEvidence={
                version:3,
                gameId:r.gameId,
                platform:'ROBLOX',
                sourceRevision:canonicalSourceRevision,
                artifactIdentity:canonicalArtifactIdentity,
                artifactRunId,
                publisherMainRevision:r.sourceRevision||null,
                universeId:String(r.universeId),
                placeId:String(r.placeId),
                finalReviewPassed:item.robloxHeadlessFinalReviewPassed===true||item.robloxFinalReviewPassed===true,
                validationMode:item.robloxValidationMode||null,
                headlessFastMvpPassed:item.robloxHeadlessFastMvpPassed===true,
                published:true,
                publicRelease:false,
                exposure:'PRIVATE_OR_RESTRICTED',
                visibilityIntent:'PRIVATE_OR_RESTRICTED_TEST_EXPERIENCE',
                versionNumber:Number(r.versionNumber),
                workflowRunId:Number(process.env.GITHUB_RUN_ID)||null,
                publishedAt:stamp,
                dedicated:true,
                authority:'owner-direct-github-dedicated-private-publish',
              };
              item.currentStep='INTERNAL_PLATFORM_PLAYTEST_AND_DEBUG';
              item.canonicalState='INTERNAL_PLATFORM_PLAYTEST_AND_DEBUG';
              item.robloxFailureStage='VIBE_INTERNAL_PLAY';
              item.robloxFailureSignature='ROBLOX_INTERNAL_VIBE_PLAY_PENDING';
              item.routingBlockers=['roblox-internal-vibe-play-pending'];
              item.robloxInternalPlaytestPassed=false;
              item.robloxInternalPlaytestPassedAt=null;
              item.robloxStudioLocalPlayRepairRequired=false;
              item.robloxStudioLocalPlayInfrastructurePending=false;
              if(item.robloxDedicatedTargetMigration&&typeof item.robloxDedicatedTargetMigration==='object'){
                item.robloxDedicatedTargetMigration={
                  ...item.robloxDedicatedTargetMigration,
                  state:'COMPLETE',
                  blocking:false,
                  internalReleasePreserved:true,
                  dedicatedUniverseId:String(r.universeId),
                  dedicatedPlaceId:String(r.placeId),
                  completedAt:stamp,
                  updatedAt:stamp,
                };
              }
              item.robloxLastSuccessfulStage='DEDICATED_PRIVATE_EXPERIENCE_PUBLISHED';
            }else{
              item.robloxDedicatedExperiencePublished=false;
              failures.push(r.gameId+':'+String(r.stage||'unknown')+':'+String(r.error||'unknown'));
            }
            item.updatedAt=stamp;
          }
          q.updatedAt=stamp;
          registry.updatedAt=stamp;
          registry.targets.sort((a,b)=>String(a.gameId||'').localeCompare(String(b.gameId||'')));
          fs.writeFileSync('development-queue.json',JSON.stringify(q,null,2)+'\n');
          fs.writeFileSync(registryPath,JSON.stringify(registry,null,2)+'\n');
          fs.writeFileSync('/tmp/roblox-dedicated-failures.json',JSON.stringify(failures,null,2)+'\n');
          NODE
          git config user.name 'jaewoon-roblox-dedicated'
          git config user.email 'actions@users.noreply.github.com'
          git add development-queue.json roblox-dedicated-targets.json
          if ! git diff --cached --quiet; then
            git commit -m 'runtime: persist dedicated private Roblox experiences [skip ci]'
            for i in 1 2 3 4 5; do
              git push origin HEAD:"$COMPANY_RUNTIME_BRANCH" && break
              git fetch --no-tags origin "$COMPANY_RUNTIME_BRANCH"
              git rebase "origin/$COMPANY_RUNTIME_BRANCH"
            done
          fi

      - name: Require selected owner publications
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const failures=JSON.parse(fs.readFileSync('/tmp/roblox-dedicated-failures.json','utf8'));
          if(failures.length)throw new Error('ROBLOX_DEDICATED_REPAIR_REQUIRED:'+failures.join(';'));
          NODE
