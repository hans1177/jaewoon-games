name: Artbook Postprocess

on:
  workflow_run:
    workflows: ["Free Artbook Department Bots"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: artbook-postprocess-main
  cancel-in-progress: true

jobs:
  postprocess:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve assembled artbook target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs=require('fs');
          const gate=JSON.parse(fs.readFileSync('artbook-gate-status.json','utf8'));
          const ready=gate.assembled===true && gate.readyForDirectorAssembly===true && gate.collaborationComplete===true && gate.directorReviewReady===true && gate.readyCount===5 && gate.reviewReadyCount===5 && gate.ratingsPerDepartment===5;
          console.log(`run=${ready?'true':'false'}`);
          console.log(`game_id=${gate.gameId||''}`);
          console.log(`date=${gate.date||''}`);
          NODE

      - name: Postprocess completed artbook
        if: steps.target.outputs.run == 'true'
        env:
          ARTBOOK_GAME_ID: ${{ steps.target.outputs.game_id }}
          ARTBOOK_DATE: ${{ steps.target.outputs.date }}
        run: node tools/artbook-postprocess.mjs

      - name: Validate completed artbook
        if: steps.target.outputs.run == 'true'
        env:
          ARTBOOK_GAME_ID: ${{ steps.target.outputs.game_id }}
          ARTBOOK_DATE: ${{ steps.target.outputs.date }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const gameId=process.env.ARTBOOK_GAME_ID,date=process.env.ARTBOOK_DATE;
          const file=`artbook-submissions/${gameId}/${date}/artbook.json`;
          const artbook=JSON.parse(fs.readFileSync(file,'utf8'));
          const registry=JSON.parse(fs.readFileSync('game-artbooks.json','utf8'));
          const registered=(registry.artbooks||[]).find(x=>x.sourceFile===file);
          const cuts=Array.isArray(artbook.cuts)?artbook.cuts.length:0;
          const required=Math.round(Number(artbook.postprocess?.requiredCuts||artbook.publication?.requiredCuts||artbook.targetArtbookPages||cuts));
          const supportedPageCount=required===10||(required>=12&&required<=30);
          if(artbook.status!=='COMPLETED'||artbook.postprocess?.complete!==true||!supportedPageCount||cuts!==required)throw new Error(`artbook postprocess incomplete: cuts=${cuts}, required=${required}`);
          if(!registered||registered.status!=='completed-artbook'||registered.published!==true||registered.homepageVisible!==true||registered.cuts?.length!==required||Number(registered.requiredCuts||required)!==required)throw new Error(`homepage registry completion mismatch: required=${required}`);
          console.log('ARTBOOK_COMPLETED=YES');
          console.log(`ARTBOOK_CUTS=${cuts}/${required}`);
          console.log(`ARTBOOK_PAGE_POLICY=${required===10?'LEGACY_10':'VARIABLE_12_30'}`);
          console.log('HOMEPAGE_COMPLETION=YES');
          NODE

      - name: Persist completed artbook through review PR
        if: steps.target.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          GAME_ID='${{ steps.target.outputs.game_id }}';DATE_KST='${{ steps.target.outputs.date }}'
          git config user.name 'jaewoon-company-postprocess'
          git config user.email 'actions@users.noreply.github.com'
          git add "artbook-submissions/${GAME_ID}/${DATE_KST}/artbook.json" artbook-gate-status.json game-artbooks.json
          if git diff --cached --quiet; then
            echo 'ARTBOOK_POSTPROCESS_COMMIT=NO_CHANGES'
            exit 0
          fi
          BRANCH="automation/artbook-postprocess-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$BRANCH"
          git commit -m "artbook: postprocess ${GAME_ID} ${DATE_KST}"
          git push origin "HEAD:${BRANCH}"
          PR_URL="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "artbook: postprocess ${GAME_ID} ${DATE_KST}" --body "Automated artbook postprocess persistence from workflow run ${GITHUB_RUN_ID}. Direct writes to main are forbidden; this PR preserves review and CI before integration.")"
          echo "ARTBOOK_POSTPROCESS_PR=${PR_URL}"
          echo 'ARTBOOK_POSTPROCESS_COMMIT=PR_OPENED'
