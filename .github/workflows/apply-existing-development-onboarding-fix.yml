name: Apply Existing Development Onboarding Fix

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply-existing-development-onboarding-fix.mjs'
      - '.github/workflows/apply-existing-development-onboarding-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: node tools/apply-existing-development-onboarding-fix.mjs
      - name: Validate syntax
        run: |
          node --check tools/design-only-promotion-sync.mjs
          node --check tools/vibe2-auto-planner.mjs
      - name: Validate onboarding contract
        run: node qa/company-existing-development-onboarding.test.mjs
      - name: Commit applied changes
        run: |
          if git diff --quiet; then
            echo 'NO_CHANGES=YES'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add COMPANY_FLOW.md tools/design-only-promotion-sync.mjs tools/vibe2-auto-planner.mjs qa/company-existing-development-onboarding.test.mjs
          git commit -m 'company: onboard existing confirmed web games into development'
          git push origin main
