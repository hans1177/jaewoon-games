name: Candidate Central20 V2 Sync

on:
  push:
    branches:
      - fix/central-20-runtime-persist-v2-20260915

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[candidate-sync]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/central-20-runtime-persist-v2-20260915
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact central-20 mirror replacements in worktree
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          function replaceExact(file,from,to,expected){
            let text=fs.readFileSync(file,'utf8');
            const count=text.split(from).length-1;
            if(count!==expected)throw new Error(`${file}: expected ${expected} occurrences of ${JSON.stringify(from)}, found ${count}`);
            text=text.split(from).join(to);
            fs.writeFileSync(file,text);
            console.log(`REPLACED ${file}: ${count} x ${from} -> ${to}`);
          }
          const runtime='.github/workflows/company-development-confirmed-runtime.yml';
          replaceExact(runtime,'WEB_PARALLEL_TARGET=6','WEB_PARALLEL_TARGET=20',1);
          replaceExact(runtime,'WEB_PARALLEL_MAX=6','WEB_PARALLEL_MAX=20',1);
          replaceExact(runtime,'max-parallel: 6','max-parallel: 20',1);
          replaceExact(runtime,'queue.webValidationParallelism=6;','queue.webValidationParallelism=20;',1);
          replaceExact(runtime,'WEB_PARALLEL_ACTIVE_MAX=6','WEB_PARALLEL_ACTIVE_MAX=20',3);

          const speed='qa/company-speed-sequence-workflow.test.mjs';
          replaceExact(speed,'parallel-first with six isolated workers','parallel-first with twenty isolated workers',1);
          replaceExact(speed,'max-parallel:\\s*6','max-parallel:\\s*20',1);
          replaceExact(speed,'WEB_PARALLEL_TARGET=6','WEB_PARALLEL_TARGET=20',1);
          replaceExact(speed,'WEB_PARALLEL_MAX=6','WEB_PARALLEL_MAX=20',1);
          replaceExact(speed,'queue\\.webValidationParallelism=6','queue\\.webValidationParallelism=20',1);
          replaceExact(speed,'WEB_PARALLEL_ACTIVE_MAX=6','WEB_PARALLEL_ACTIVE_MAX=20',1);
          replaceExact(speed,'webValidationParallelismTarget: 6','webValidationParallelismTarget: 20',1);
          replaceExact(speed,'webValidationParallelismMax: 6','webValidationParallelismMax: 20',1);

          const directive='company-directive.json';
          replaceExact(directive,'"concurrentGameWipTarget": 6','"concurrentGameWipTarget": 20',1);
          replaceExact(directive,'"concurrentGameWipMax": 6','"concurrentGameWipMax": 20',1);

          const out='tmp/candidate-central20/company-development-confirmed-runtime.yml';
          fs.mkdirSync(path.dirname(out),{recursive:true});
          fs.copyFileSync(runtime,out);
          NODE
      - name: Validate central-20 candidate contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/company-selected-platform-router.mjs
          node --test \
            qa/company-selected-platform-router.test.mjs \
            qa/company-speed-sequence-workflow.test.mjs \
            qa/vibe2-parallelism-main-contract.test.mjs \
            qa/design-promotion-workflow-contract.test.mjs
          grep -q 'concurrentGameWipTarget: 20' COMPANY_FLOW.md
          grep -q 'concurrentGameWipMax: 20' COMPANY_FLOW.md
          grep -q 'webValidationParallelismTarget: 20' COMPANY_FLOW.md
          grep -q 'webValidationParallelismMax: 20' COMPANY_FLOW.md
          grep -q 'adaptiveBackpressureSteps: \[20, 16, 12, 8, 4\]' COMPANY_FLOW.md
      - name: Persist only non-workflow mirrors and verified workflow copy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-candidate-sync'
          git config user.email 'candidate-sync@users.noreply.github.com'
          git restore -- .github/workflows/company-development-confirmed-runtime.yml
          git add company-directive.json qa/company-speed-sequence-workflow.test.mjs tmp/candidate-central20/company-development-confirmed-runtime.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'CANDIDATE_CENTRAL20_NONWORKFLOW_CHANGE=NO'
          else
            git commit -m 'fix(runtime): align central 20 mirrors [candidate-sync]'
            git push origin HEAD:fix/central-20-runtime-persist-v2-20260915
          fi
