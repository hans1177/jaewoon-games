name: Artbook Initial Backfill Chain

on:
  workflow_run:
    workflows: ['Free Artbook Department Bots']
    types: [completed]
  schedule:
    - cron: '29 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: design-tier-transition-watch
  cancel-in-progress: true

jobs:
  tier-transition-watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Find tier changed game requiring design or artbook refresh
        id: target
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs=require('fs');
          const path=require('path');
          const catalog=JSON.parse(fs.readFileSync('game-catalog.json','utf8'));
          function latestStatus(gameId){
            const root=path.join('design',gameId);
            if(!fs.existsSync(root))return null;
            for(const date of fs.readdirSync(root).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x)).sort().reverse()){
              const file=path.join(root,date,'cycle-status.json');
              if(!fs.existsSync(file))continue;
              try{return JSON.parse(fs.readFileSync(file,'utf8'));}catch{}
            }
            return null;
          }
          const games=(catalog.games||[]).filter(g=>[1,2,3].includes(Number(g.productionTier)));
          const changed=games.map(g=>({g,last:latestStatus(g.id)})).filter(x=>x.last&&Number(x.last.tier)!==Number(x.g.productionTier));
          const missing=games.map(g=>({g,last:latestStatus(g.id)})).filter(x=>!x.last);
          const target=changed[0]?.g||missing[0]?.g||null;
          console.log(`dispatch=${target?'true':'false'}`);
          console.log(`game_id=${target?.id||''}`);
          console.log(`tier=${target?.productionTier||''}`);
          console.log(`reason=${changed.length?'TIER_CHANGED_NEEDS_BASELINE_AND_ARTBOOK_REFRESH':missing.length?'NO_CENTRAL_DESIGN_CYCLE_YET':'UP_TO_DATE'}`);
          NODE

      - name: Dispatch central multimodel cycle
        if: steps.target.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run artbook-free-department-bots.yml --ref main -f game_id="${{ steps.target.outputs.game_id }}"
          echo "DESIGN_REFRESH_DISPATCHED=${{ steps.target.outputs.game_id }}"
          echo "TARGET_TIER=${{ steps.target.outputs.tier }}"
          echo "REASON=${{ steps.target.outputs.reason }}"

      - name: No refresh needed
        if: steps.target.outputs.dispatch != 'true'
        run: echo 'DESIGN_TIER_TRANSITION=UP_TO_DATE'
