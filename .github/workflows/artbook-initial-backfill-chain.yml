name: Artbook Initial Backfill Chain

on:
  workflow_run:
    workflows: ['Free Artbook Department Bots']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: artbook-initial-backfill-chain
  cancel-in-progress: false

jobs:
  continue-existing-initials:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve next existing game without an initial artbook
        id: next
        shell: bash
        run: |
          set -euo pipefail
          node tools/artbook-prepare-daily.mjs
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs=require('fs');
          const context=JSON.parse(fs.readFileSync('artbook-daily-context.json','utf8'));
          const catalog=JSON.parse(fs.readFileSync('game-catalog.json','utf8'));
          const game=(catalog.games||[]).find(x=>x.id===context.gameId)||{};
          const existing=game.hasWebArchive===true||String(game.unityProjectPath||'').trim().length>0;
          const shouldContinue=context.run===true&&String(context.mode||'').toUpperCase()==='INITIAL'&&existing;
          console.log(`continue=${shouldContinue?'true':'false'}`);
          console.log(`game_id=${shouldContinue?context.gameId:''}`);
          console.log(`reason=${shouldContinue?'EXISTING_INITIAL_BACKLOG_REMAINS':'NO_EXISTING_INITIAL_BACKLOG'}`);
          NODE
      - name: Dispatch next initial artbook
        if: steps.next.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run artbook-free-department-bots.yml --ref main
          echo "ARTBOOK_BACKFILL_DISPATCHED=${{ steps.next.outputs.game_id }}"
      - name: Backfill queue drained
        if: steps.next.outputs.continue != 'true'
        run: echo 'ARTBOOK_BACKFILL=NO_EXISTING_INITIAL_BACKLOG'
