name: Apply Company Evolution

on:
  push:
    branches: [main]
    paths:
      - company-evolution.request

permissions:
  contents: write

concurrency:
  group: company-evolution-main
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wire discussed systems into existing runtime
        run: node tools/apply-company-evolution.mjs

      - name: Commit wiring
        run: |
          git config user.name "jaewoon-company-ai"
          git config user.email "actions@users.noreply.github.com"
          git add index.html assets/vibe-company-orchestration-bridge.js COMPANY_FLOW.md HOMEPAGE_OPERATIONS.md .github/agents/director.agent.md ASSET_RULES.md
          if git diff --cached --quiet; then
            echo "Evolution wiring already applied."
            exit 0
          fi
          git commit -m "company-ai: wire artbook health learning and quality systems"
          git pull --rebase origin main
          git push origin main
