name: Unity Web Floor Source Bootstrap
run-name: Unity Web Floor Bootstrap ${{ inputs.game_id }}

on:
  workflow_call:
    inputs:
      game_id:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      game_id:
        description: 'Exact DEVELOPMENT_CONFIRMED game id that needs canonical Unity Web floor source'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  bootstrap:
    concurrency:
      group: unity-web-bootstrap-source-${{ inputs.game_id }}
      cancel-in-progress: false
    runs-on: ubuntu-slim
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
          fetch-tags: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate shared worker context before source work
        run: |
          set -euo pipefail
          node tools/company-shared-context.mjs --output=/tmp/company-unity-web-bootstrap-context.json

      - name: Verify bootstrap contract
        run: |
          set -euo pipefail
          node --check tools/company-unity-web-floor-bootstrap.mjs
          node --test qa/company-unity-web-floor-bootstrap.test.mjs

      - name: Fetch runtime design and verified learning authority
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin company-runtime
          git fetch --no-tags --depth=1 origin vibe2-unreal-core
          git fetch --no-tags --depth=1 origin vibe2-learning-runtime
          git show origin/company-runtime:development-queue.json > /tmp/development-queue.json
          git show origin/vibe2-learning-runtime:company-learning/vibe3-task-playbooks.json > /tmp/vibe3-task-playbooks.json
          test -s /tmp/vibe3-task-playbooks.json
          learning_sha="$(git rev-parse origin/vibe2-learning-runtime)"
          [[ "$learning_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'verified learning revision missing' >&2; exit 2; }
          echo "UNITY_WEB_VERIFIED_LEARNING_REVISION=$learning_sha" >> "$GITHUB_ENV"


      - name: Reuse pending design-bound Unity source PR
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_ID: ${{ inputs.game_id }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          if git cat-file -e "origin/main:unity-games/$GAME_ID" 2>/dev/null; then
            echo 'already_on_main=true' >> "$GITHUB_OUTPUT"
            echo "UNITY_WEB_BOOTSTRAP_SOURCE_ALREADY_ON_MAIN=$GAME_ID"
            exit 0
          fi
          # Search this game's title server-side; a shared 300-PR window loses valid
          # candidates under heavy, unrelated per-game bootstrap traffic.
          pending="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"dev: bootstrap Unity Web floor source $GAME_ID\"" \
            --limit 100 --json number,title,url,headRefName,author \
            | jq -c --arg title "dev: bootstrap Unity Web floor source $GAME_ID" \
              --arg prefix "unity-web-floor/bootstrap-$GAME_ID-" \
              '[.[] | select(.title==$title and (.headRefName|startswith($prefix)) and .author.login=="github-actions[bot]")] | sort_by(.number) | reverse | .[0] // empty')"
          if [[ -z "$pending" ]]; then
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
            echo "UNITY_WEB_BOOTSTRAP_SOURCE_PR=NEW:$GAME_ID"
            exit 0
          fi
          pr_url="$(jq -r '.url' <<<"$pending")"
          pr_branch="$(jq -r '.headRefName' <<<"$pending")"
          [[ "$pr_branch" == unity-web-floor/bootstrap-"$GAME_ID"-* ]] || exit 31
          git fetch --no-tags --depth=1 origin "refs/heads/$pr_branch"
          git show "FETCH_HEAD:unity-games/$GAME_ID/unity-web-floor-source.json" > /tmp/unity-web-pending-source.json
          export GAME_ID
          set +e
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          const gameId=process.env.GAME_ID;
          const q=JSON.parse(fs.readFileSync('/tmp/development-queue.json','utf8'));
          const item=(q.items||[]).find(row=>row.gameId===gameId);
          if(item?.productionClass!=='DEVELOPMENT_CONFIRMED'||item?.minimumDesignContract?.pass!==true)
            throw new Error('UNITY_WEB_BOOTSTRAP_PENDING_DESIGN_NOT_ADMITTED');
          const designPath=String(item.designBaselineSource||item.minimumDesignContract?.source||'');
          const document=JSON.parse(execFileSync('git',['show','origin/company-runtime:'+designPath],{encoding:'utf8',maxBuffer:16*1024*1024}));
          const design=document.content||document;
          const source=JSON.parse(fs.readFileSync('/tmp/unity-web-pending-source.json','utf8'));
          const generator=createHash('sha256').update(fs.readFileSync('tools/company-unity-web-floor-bootstrap.mjs')).digest('hex');
          const identity=String(design.identity||item.gameName||gameId).replace(/\s+/g,' ').trim();
          const coreLoop=(Array.isArray(design.coreLoop)?design.coreLoop:[]).map(value=>String(value).trim()).filter(Boolean).slice(0,6);
          if(source.gameId!==gameId||source.generatorFingerprint!==generator
            ||source.identity!==identity||JSON.stringify(source.coreLoop)!==JSON.stringify(coreLoop)
            ||JSON.stringify(source.unityPlatformProfile)!==JSON.stringify(design.platformProfiles?.UNITY)
            ||source.upperPlatformReady!==false||source.releaseOrDeploymentAuthority!==false)
            {
              console.error('UNITY_WEB_BOOTSTRAP_PENDING_SOURCE_SUPERSEDED_BY_CURRENT_DESIGN');
              process.exit(77);
            }
          console.log('UNITY_WEB_BOOTSTRAP_PENDING_DESIGN_REUSE=PASS:'+gameId);
          NODE
          validation_rc=$?
          set -e
          # Only proven stale design content may close a generated candidate.
          # A missing authority file, network error, or runtime exception must fail closed.
          if (( validation_rc != 0 && validation_rc != 77 )); then exit "$validation_rc"; fi
          if (( validation_rc == 77 )); then
            echo "UNITY_WEB_BOOTSTRAP_STALE_PR_CLOSED=$GAME_ID:$pr_url"
            gh pr close "$pr_url" --repo "$GITHUB_REPOSITORY" --comment 'Generated source no longer matches current design/profile or generator. The canonical bootstrap will create a fresh source candidate.'
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout FETCH_HEAD -- "unity-games/$GAME_ID"
          echo 'reuse=true' >> "$GITHUB_OUTPUT"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "UNITY_WEB_BOOTSTRAP_PENDING_SOURCE_REUSED=$GAME_ID:$pr_url"

      - name: Generate canonical Unity Web floor sources
        if: steps.pending.outputs.reuse != 'true' && steps.pending.outputs.already_on_main != 'true'
        id: generate
        env:
          GAME_ID: ${{ inputs.game_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          import {nativeUpperPlatformAlreadyStarted} from './tools/company-upper-platform-admission.mjs';
          const gameId=String(process.env.GAME_ID||'').trim();
          if(!/^[a-z0-9][a-z0-9-]{1,80}$/.test(gameId))throw new Error('UNITY_WEB_BOOTSTRAP_GAME_ID_INVALID:'+gameId);
          const queue=JSON.parse(fs.readFileSync('/tmp/development-queue.json','utf8'));
          const item=(queue.items||[]).find(row=>row.gameId===gameId);
          if(!item)throw new Error('UNITY_WEB_BOOTSTRAP_QUEUE_ITEM_MISSING:'+gameId);
          if(String(item.productionClass||'').toUpperCase()!=='DEVELOPMENT_CONFIRMED')throw new Error('UNITY_WEB_BOOTSTRAP_PRODUCTION_CLASS_INVALID:'+gameId);
          if(fs.existsSync(path.join('unity-games',gameId)))throw new Error('UNITY_WEB_BOOTSTRAP_EXISTING_SOURCE_MUST_BE_REPAIRED_IN_PLACE:'+gameId);
           if(nativeUpperPlatformAlreadyStarted(item))console.log('UNITY_WEB_BOOTSTRAP_NATIVE_PROGRESS_PRESERVED='+gameId);
          const designSource=String(item.designBaselineSource||item.minimumDesignContract?.source||'').trim();
          if(!designSource)throw new Error('UNITY_WEB_BOOTSTRAP_DESIGN_SOURCE_MISSING:'+gameId);
          const local=path.join('/tmp/unity-web-bootstrap-design',gameId,'design-revised.json');
          fs.mkdirSync(path.dirname(local),{recursive:true});
          fs.writeFileSync(local,execFileSync('git',['show','origin/company-runtime:'+designSource]));
          const directive='/tmp/unity-web-bootstrap-directive/'+gameId+'/current.json';
          fs.mkdirSync(path.dirname(directive),{recursive:true});
          let directiveArg=[];
          try{
            fs.writeFileSync(directive,execFileSync('git',['show','origin/vibe2-unreal-core:.vibe2/build-up-directives/'+gameId+'/current.json']));
            directiveArg=['--build-up-directive='+directive];
            console.log('UNITY_WEB_BUILD_UP_DIRECTIVE_SOURCE=VIBE_RUNTIME:'+gameId);
          }catch{
            console.log('UNITY_WEB_BUILD_UP_DIRECTIVE_SOURCE=BASELINE_ONLY_NO_VIBE_DIRECTIVE:'+gameId);
          }
          execFileSync(process.execPath,[
            'tools/company-unity-web-floor-bootstrap.mjs',
            '--game-id='+gameId,
            '--game-name='+String(item.gameName||gameId),
            '--baseline='+local,
            '--output=unity-games/'+gameId,
            '--playbooks=/tmp/vibe3-task-playbooks.json',
            '--learning-revision='+String(process.env.UNITY_WEB_VERIFIED_LEARNING_REVISION||''),
            ...directiveArg
          ],{stdio:'inherit'});
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'game_id='+gameId+'\n');
          console.log('UNITY_WEB_BOOTSTRAP_GENERATED_ID='+gameId);
          NODE

      - name: Validate canonical Unity project before source promotion
        if: steps.pending.outputs.already_on_main != 'true'
        env:
          GAME_ID: ${{ inputs.game_id }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/company-unity-web-first-stage.mjs \
            --game-id="$GAME_ID" \
            --source-root="unity-games/$GAME_ID" \
            --build-method="UnityWebFloorBuild.BuildWeb" --validate-only

      - name: Create bootstrap PR
        id: create
        if: steps.pending.outputs.reuse != 'true' && steps.pending.outputs.already_on_main != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_ID: ${{ steps.generate.outputs.game_id }}
        shell: bash
        run: |
          set -euo pipefail
          safe="$(printf '%s' "$GAME_ID" | tr -cs 'A-Za-z0-9._-' '-')"
          branch="unity-web-floor/bootstrap-${safe}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "jaewoon-unity-web-floor"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$branch"
          git add "unity-games/$GAME_ID"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'UNITY_WEB_BOOTSTRAP_PR=NO_CHANGE'
            exit 0
          fi
          git commit -m "dev: bootstrap Unity Web floor source $GAME_ID"
          git push origin HEAD:"$branch"
          pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch"             --title "dev: bootstrap Unity Web floor source $GAME_ID"             --body "Bootstrap canonical Unity source for: $GAME_ID. After merge, Company DEVELOPMENT_CONFIRMED Runtime dispatches the Unity Web floor build for this exact game. Games with durable native progress are rejected by the canonical admission classifier. Generated source still requires WebGL build, actual browser play, independent QA, regression, and UPPER_PLATFORM_DEVELOPMENT_READY.")"
          echo "UNITY_WEB_BOOTSTRAP_PR=$pr_url"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo 'UNITY_WEB_BOOTSTRAP_DIRECT_MAIN_WRITE=NO'

      - name: Promote static-verified bootstrap through existing PR gate
        if: steps.pending.outputs.already_on_main != 'true' && (steps.pending.outputs.reuse == 'true' || steps.create.outcome == 'success')
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_ID: ${{ inputs.game_id }}
          PR_URL: ${{ steps.pending.outputs.pr_url || steps.create.outputs.pr_url }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_URL" == "https://github.com/$GITHUB_REPOSITORY/pull/"* ]] || exit 32
          # Source bootstrap is not release; GitHub's protected PR rules remain authoritative.
          if gh pr merge "$PR_URL" --repo "$GITHUB_REPOSITORY" --squash --delete-branch; then
            echo "UNITY_WEB_BOOTSTRAP_MAIN_SOURCE_MERGED=$GAME_ID:$PR_URL"
          elif [[ "$(gh pr view "$PR_URL" --repo "$GITHUB_REPOSITORY" --json state --jq '.state')" == MERGED ]]; then
            echo "UNITY_WEB_BOOTSTRAP_ALREADY_MERGED=$GAME_ID:$PR_URL"
          else
            echo "UNITY_WEB_BOOTSTRAP_PR_PROMOTION_BLOCKED=$GAME_ID:$PR_URL" >&2
            exit 75
          fi
          echo 'UNITY_WEB_BOOTSTRAP_RUNTIME_QA=NOT_YET_VERIFIED'
