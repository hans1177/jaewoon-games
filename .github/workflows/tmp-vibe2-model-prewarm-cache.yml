name: TMP Vibe2 Model Prewarm Cache

on:
  push:
    branches: [fix/vibe2-model-prewarm-cache]
    paths:
      - '.github/workflows/tmp-vibe2-model-prewarm-cache.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vibe2-model-prewarm-cache
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch shared Ollama model prewarm/cache
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const workflow='.github/workflows/vibe2-continuous-core.yml';
          let text=fs.readFileSync(workflow,'utf8');
          const workerMarker=`  worker:\n    needs: reserve\n    if: needs.reserve.outputs.worker_count != '0'\n`;
          if(!text.includes(workerMarker)) throw new Error('WORKER_MARKER_NOT_FOUND');
          const modelCache=`  model_cache:\n    needs: reserve\n    if: needs.reserve.outputs.worker_count != '0'\n    runs-on: ubuntu-latest\n    timeout-minutes: 12\n    continue-on-error: true\n    steps:\n      - name: Restore or persist shared Ollama model cache\n        id: ollama_cache\n        uses: actions/cache@v4\n        with:\n          path: ~/.ollama/models\n          key: vibe2-ollama-v1-\${{ runner.os }}-qwen3-1.7b\n\n      - name: Warm local coding model once on cache miss\n        if: steps.ollama_cache.outputs.cache-hit != 'true'\n        shell: bash\n        run: |\n          set -euo pipefail\n          installed=0\n          for attempt in 1 2 3; do\n            if curl -fsSL --retry 3 --retry-all-errors --connect-timeout 15 https://ollama.com/install.sh | sh; then installed=1; break; fi\n            sleep $((attempt * 4))\n          done\n          test \"$installed\" = 1\n          nohup ollama serve > /tmp/ollama-prewarm.log 2>&1 &\n          for i in $(seq 1 30); do\n            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break\n            if [ \"$i\" = 30 ]; then cat /tmp/ollama-prewarm.log || true; exit 1; fi\n            sleep 2\n          done\n          ollama pull \"$VIBE2_LOCAL_MODEL\"\n          echo 'VIBE2_MODEL_PREWARM=PASS'\n\n  worker:\n    needs: [reserve, model_cache]\n    if: always() && needs.reserve.outputs.worker_count != '0'\n`;
          text=text.replace(workerMarker,modelCache);
          const setupMarker=`      - uses: actions/setup-node@v4\n        with:\n          node-version: '22'\n\n      - name: Build reserved task work order\n`;
          const setupReplacement=`      - uses: actions/setup-node@v4\n        with:\n          node-version: '22'\n\n      - name: Restore shared Ollama model cache\n        id: worker_ollama_cache\n        uses: actions/cache/restore@v4\n        with:\n          path: ~/.ollama/models\n          key: vibe2-ollama-v1-\${{ runner.os }}-qwen3-1.7b\n\n      - name: Build reserved task work order\n`;
          const idx=text.indexOf(setupMarker,text.indexOf('  worker:'));
          if(idx<0) throw new Error('WORKER_SETUP_MARKER_NOT_FOUND');
          text=text.slice(0,idx)+setupReplacement+text.slice(idx+setupMarker.length);
          const pullMarker='          ollama pull "$VIBE2_LOCAL_MODEL"\n\n          cd "$candidate_dir"';
          const pullReplacement=`          if ollama list | awk 'NR>1 {print $1}' | grep -Fqx \"$VIBE2_LOCAL_MODEL\"; then\n            echo 'VIBE2_LOCAL_MODEL_SOURCE=CACHE'\n          else\n            echo 'VIBE2_LOCAL_MODEL_SOURCE=FALLBACK_PULL'\n            ollama pull \"$VIBE2_LOCAL_MODEL\"\n          fi\n\n          cd \"$candidate_dir\"`;
          if(!text.includes(pullMarker)) throw new Error('WORKER_PULL_MARKER_NOT_FOUND');
          text=text.replace(pullMarker,pullReplacement);
          fs.writeFileSync(workflow,text,'utf8');

          const testFile='qa/vibe2-parallelism-20-contract.test.mjs';
          let test=fs.readFileSync(testFile,'utf8');
          const assertMarker=`  assert.match(workflow,/max-parallel: 20/);\n`;
          const assertReplacement=`  assert.match(workflow,/max-parallel: 20/);\n  assert.match(workflow,/model_cache:/);\n  assert.match(workflow,/uses: actions\\/cache@v4/);\n  assert.match(workflow,/uses: actions\\/cache\\/restore@v4/);\n  assert.match(workflow,/VIBE2_LOCAL_MODEL_SOURCE=CACHE/);\n  assert.match(workflow,/VIBE2_LOCAL_MODEL_SOURCE=FALLBACK_PULL/);\n`;
          if(!test.includes(assertMarker)) throw new Error('PARALLEL_CONTRACT_MARKER_NOT_FOUND');
          test=test.replace(assertMarker,assertReplacement);
          fs.writeFileSync(testFile,test,'utf8');
          NODE
          node --test qa/vibe2-parallelism-20-contract.test.mjs
          node --test qa/vibe2-queue-control.test.mjs
          node --test qa/vibe2-auto-planner.test.mjs
      - name: Commit verified optimization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-vibe2-migration'
          git config user.email 'vibe2-migration@users.noreply.github.com'
          git add .github/workflows/vibe2-continuous-core.yml qa/vibe2-parallelism-20-contract.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'perf: prewarm shared Vibe2 model cache'
          git push origin HEAD:fix/vibe2-model-prewarm-cache
