name: Vibe2 Bottleneck Branch QA

on:
  push:
    branches:
      - chatgpt/vibe2-bottleneck-1-5-20260909

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          set -euo pipefail
          node --check tools/autonomous-diagnostics.mjs
          node --check tools/autonomous-rule-patcher.mjs
          node --check tools/autonomous-work-planner.mjs
          node --check tools/autonomous-development-worker.mjs
          node --check tools/vibe2-artbook-story-draft.mjs
      - name: JSON checks
        run: |
          node -e "JSON.parse(require('fs').readFileSync('autonomous-portfolio.json','utf8')); console.log('portfolio json ok')"
      - name: Unit tests
        run: |
          set -euo pipefail
          node --test qa/autonomous-diagnostics.test.mjs
          node --test qa/autonomous-rule-patcher.test.mjs
          node --test qa/autonomous-work-planner.test.mjs
          node --test qa/autonomous-queue-state.test.mjs
          node --test qa/free-budget-telemetry.test.mjs
          node --test qa/autonomous-development-worker.test.mjs
      - name: Repository planner smoke
        run: |
          set -euo pipefail
          node tools/autonomous-work-planner.mjs --date=2026-09-09 --output=/tmp/vibe2-work-order.json
          node <<'NODE'
          const fs=require('fs');
          const o=JSON.parse(fs.readFileSync('/tmp/vibe2-work-order.json','utf8'));
          if(typeof o.run!=='boolean')throw new Error('planner run flag missing');
          if(o.run){
            if(!o.projectStage)throw new Error('projectStage missing');
            if(!['MODEL','RULE_PATCH'].includes(o.repairMode))throw new Error('repairMode invalid');
            if(!Array.isArray(o.responsibilityFiles))throw new Error('responsibilityFiles missing');
            if(Number(o.budget?.modelCalls)<0||Number(o.budget?.modelCalls)>2)throw new Error('model call budget invalid');
          }
          console.log(JSON.stringify({run:o.run,gameId:o.gameId||null,projectStage:o.projectStage||null,repairMode:o.repairMode||null,modelCalls:o.budget?.modelCalls??null}));
          NODE
