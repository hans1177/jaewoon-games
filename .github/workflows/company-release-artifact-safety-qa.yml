name: Company Release Artifact Safety QA

on:
  push:
    branches: [main]
    paths:
      - 'company-learning/platform-release-roadmap.json'
      - 'company-directive.json'
      - 'game-catalog.json'
      - 'tools/production-classification.mjs'
      - 'tools/company-release-production-cycle.mjs'
      - 'tools/company-release-stale-artifact-guard.mjs'
      - 'qa/company-release-production-cycle.test.mjs'
      - 'qa/release-stale-artifact-guard.test.mjs'
      - '.github/workflows/company-release-artifact-safety-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-artifact-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check release contract syntax
        run: |
          set -euo pipefail
          node --check tools/company-release-production-cycle.mjs
          node --check tools/company-release-stale-artifact-guard.mjs
          node --check qa/company-release-production-cycle.test.mjs
          node --check qa/release-stale-artifact-guard.test.mjs

      - name: Verify central release safety contract
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const directive=JSON.parse(fs.readFileSync('company-directive.json','utf8'));
          const roadmap=JSON.parse(fs.readFileSync('company-learning/platform-release-roadmap.json','utf8'));
          const contract=directive.classes?.RELEASE_CONFIRMED||{};
          const owner=roadmap.fixedAutonomousDevelopmentOperatingContract?.ownerRequestedVibeOneShotPatch||{};
          if(contract.executionMode!=='GATED_DIRECT_RELEASE_PRODUCTION')
            throw new Error('CENTRAL_RELEASE_EXECUTION_MODE_INVALID');
          for(const field of [
            'sourceChangeInvalidatesOldBuildValidation',
            'buildPreflightIsNotFinalApproval',
            'finalReviewMustReadSameCurrentBuildRuntimeQaEvidence',
            'independentQaSeparatedFromVibe2SelfCheck',
            'finalArtbookOnlyAfterReleaseReady'
          ])if(contract[field]!==true)throw new Error('CENTRAL_RELEASE_SAFETY_MISSING:'+field);
          for(const field of ['noPublicReleaseBypass','nativePlatformCanonicalPublicationGatesUnchanged',
            'credentialsAuthorizationAndSaveCompatibilityPreserved','noSourceOrRuntimeWriteWhenCentralPreflightFails'])
            if(owner.hardBoundaries?.[field]!==true)
              throw new Error('OWNER_RELEASE_HARD_BOUNDARY_MISSING:'+field);
          const release=fs.readFileSync('tools/company-release-production-cycle.mjs','utf8');
          const guard=fs.readFileSync('tools/company-release-stale-artifact-guard.mjs','utf8');
          if(!release.includes('finalDepartmentReviewEvidenceBound:true'))throw new Error('current release baseline must bind final QA evidence');
          for(const token of ['release-history','preservedAsHistory:true','FINAL_RELEASE_ARTIFACTS_ACTIVE=NO']){
            if(!guard.includes(token))throw new Error(`release guard contract missing: ${token}`);
          }
          console.log('RELEASE_ARTIFACT_SAFETY_CONTRACT=PASS');
          NODE

      - name: Test central gated direct release flow
        run: node --test qa/company-release-production-cycle.test.mjs

      - name: Test stale final artifact archival and ready preservation
        run: node --test qa/release-stale-artifact-guard.test.mjs
