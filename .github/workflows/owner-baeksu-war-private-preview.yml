name: Owner Baeksu War Versioned Private Preview
run-name: 백수대전쟁 비공개 선배포 · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - 'roblox-games/baeksu-war/**'
      - 'tools/baeksu-war-author-meshes.py'
      - 'tools/baeksu-war-upload-meshes.mjs'
      - '.github/workflows/owner-baeksu-war-private-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owner-baeksu-war-private-preview
  cancel-in-progress: true

jobs:
  private-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
      ROBLOX_ROBLOSECURITY: ${{ secrets.ROBLOX_ROBLOSECURITY }}
      ROBLOX_SECURITY_COOKIE: ${{ secrets.ROBLOX_SECURITY_COOKIE }}
      ROBLOX_CREATOR_USER_ID: ${{ secrets.ROBLOX_CREATOR_USER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 오래된 push 작업이 뒤늦게 실행되어 최신 게임을 덮어쓰지 못하게 한다.
      - name: Reject outdated baeksu-war preview source
        shell: bash
        run: |
          set -euo pipefail
          latest="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ -z "$latest" ] || [ "$latest" != "$GITHUB_SHA" ]; then
            echo "BAEKSU_STALE_PREVIEW_REJECTED: source=$GITHUB_SHA latest=$latest"
            exit 1
          fi
      # 4차 비공개 게시(40343077784 / Place v5)에서 실제 업로드 및 전용 Universe 허가가
      # 입증된 모델 12개를 재사용한다. 매 push마다 재업로드하면 시작 지연과 잘못된 ID를 유발한다.
      - name: Verify pinned CC0 original meshes and approved universe permission receipts
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read=(p)=>JSON.parse(fs.readFileSync(p,'utf8'));
          const record=read('roblox-games/baeksu-war/CC0-ASSET-REGISTRY.json');
          const actors=read('assets/roblox/actors/manifest.json').sources.flatMap(s=>s.sourceFiles||[]);
          const wildlife=read('assets/external/simple-rpg/wildlife/manifest.json').packs;
          const priority=read('assets/external/simple-rpg/priority-v1/manifest.json').packs;
          const lua=fs.readFileSync('roblox-games/baeksu-war/shared/VisualAssetIds.luau','utf8');
          const entries=Object.fromEntries([...lua.matchAll(/([a-z]+)\s*=\s*([0-9]+)/g)].map(m=>[m[1],Number(m[2])]));
          const roles=['sparrow','ant','beetle','wolf','turtle','slime','golem','dragon','home','gate','tree','rock'];
          if(record.gameId!=='baeksu-war'||String(record.universeId)!=='10773115989'||String(record.placeId)!=='120481433333785'||record.verifiedPublishRunId!==40343077784||record.verifiedPlaceVersion!==5||Object.keys(record.models||{}).length!==12)throw Error('PUBLISHED_CC0_ASSET_PROVENANCE_MISSING');
          for(const role of roles){
            const asset=record.models[role];
            if(!asset||!Number.isSafeInteger(asset.assetId)||asset.assetId<1||entries[role]!==asset.assetId||asset.license!=='CC0-1.0'||!/^https:\/\//.test(asset.licenseEvidence||'')||!(/^[a-f0-9]{64}$/).test(asset.glbSha256||''))throw Error('PINNED_CC0_MODEL_UNVERIFIED:'+role);
            let original;
            if(asset.sourcePath.startsWith('assets/roblox/actors/'))original=actors.find(x=>x.path===asset.sourcePath);
            else if(asset.sourcePath.startsWith('assets/external/simple-rpg/wildlife/'))original=wildlife.find(x=>asset.sourcePath.endsWith('/'+x.file));
            else if(asset.sourcePath.startsWith('assets/external/simple-rpg/priority-v1/'))original=priority.find(x=>asset.sourcePath.endsWith('/'+x.file));
            if(!original||String(original.sha256)!==asset.sourceSha256||!fs.existsSync(asset.sourcePath))throw Error('ORIGINAL_CC0_DIGEST_NOT_PINNED:'+role);
          }
          console.log('BAEKSU_WAR_VERIFIED_REUSED_CC0_MODELS=12');
          console.log('BAEKSU_WAR_PROVENANCE_RUN_ID='+record.verifiedPublishRunId);
          NODE
      - name: Build only baeksu-war Roblox place
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ROBLOX_OPEN_CLOUD_API_KEY"
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/rojo-7.7.0.zip https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip
          echo '22503e5839864f9d7c2171c48b536fc229f2cc4d8774c9cc149f60941d864073  /tmp/rojo-7.7.0.zip' | sha256sum -c -
          mkdir -p /tmp/owner-baeksu-rojo
          unzip -q /tmp/rojo-7.7.0.zip -d /tmp/owner-baeksu-rojo
          chmod +x /tmp/owner-baeksu-rojo/rojo
          /tmp/owner-baeksu-rojo/rojo build roblox-games/baeksu-war/default.project.json -o /tmp/owner-baeksu-war-private-preview.rbxlx
          test -s /tmp/owner-baeksu-war-private-preview.rbxlx
      - name: Update existing baeksu-war private place using official Roblox API
        shell: bash
        run: |
          set -euo pipefail
          latest="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ -z "$latest" ] || [ "$latest" != "$GITHUB_SHA" ]; then
            echo "BAEKSU_PRE_PUBLISH_STALE_REVISION: source=$GITHUB_SHA latest=$latest"
            exit 1
          fi
          node tools/company-roblox-dedicated-experience.mjs \
            --game-id=baeksu-war \
            --game-name='백수대전쟁 [비공개 선배포]' \
            --place-file=/tmp/owner-baeksu-war-private-preview.rbxlx \
            --reuse-universe-id=10773115989 \
            --reuse-place-id=120481433333785 \
            --source-revision="$GITHUB_SHA" \
            --output=/tmp/owner-baeksu-war-preview-receipt.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('/tmp/owner-baeksu-war-preview-receipt.json','utf8'));
          if(p.gameId!=='baeksu-war'||p.private!==true||p.published!==true||p.reusedTarget!==true||String(p.universeId)!=='10773115989'||String(p.placeId)!=='120481433333785'||!Number.isInteger(Number(p.versionNumber))||Number(p.versionNumber)<2)throw new Error('PRIVATE_PREVIEW_EXISTING_TARGET_NOT_PUBLISHED');
          if(!/^[1-9][0-9]*$/.test(String(p.placeId||'')))throw new Error('PRIVATE_PREVIEW_PLACE_ID_MISSING');
          const url='https://www.roblox.com/games/'+p.placeId+'/';
          console.log('BAEKSU_WAR_PRIVATE_PREVIEW_URL='+url);
          console.log('BAEKSU_WAR_PUBLISHED_PLACE_VERSION='+p.versionNumber);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '## 백수대전쟁 비공개 선배포\\n\\n'+
            '- Roblox game link: '+url+'\\n'+
            '- Place ID: '+p.placeId+'\\n'+
            '- Universe ID: '+p.universeId+'\\n'+
            '- Published version: '+p.versionNumber+'\\n'+
            '- Source revision: '+p.sourceRevision+'\\n'+
            '- Exposure: PRIVATE (not public/canonical release)\\n');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baeksu-war-private-preview-receipt
          path: |
            /tmp/owner-baeksu-war-preview-receipt.json
            /tmp/baeksu-art-upload.json
            /tmp/baeksu-art/provenance.json
          if-no-files-found: ignore
