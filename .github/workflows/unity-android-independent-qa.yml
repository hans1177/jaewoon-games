name: Unity Android Independent QA
run-name: Unity Android Independent QA ${{ inputs.run_id || github.event.workflow_run.id }}

on:
  workflow_run:
    workflows: ["Unity Hybrid Android Build"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful Unity Hybrid Android Build run id'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: unity-android-independent-qa-${{ inputs.run_id || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  independent-qa:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Checkout QA tools
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve upstream build run
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ github.event_name }}' == 'workflow_run' ]]; then
            run_id='${{ github.event.workflow_run.id }}'
          else
            run_id='${{ inputs.run_id }}'
          fi
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo 'invalid upstream run id' >&2; exit 2; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download exact upstream build artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.upstream.outputs.run_id }}
          path: upstream-artifacts

      - name: Bind APK to build metadata
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find upstream-artifacts -type f -name '*.apk' -size +0c | head -n 1 || true)"
          info="$(find upstream-artifacts -type f -name 'build-info.json' | head -n 1 || true)"
          [[ -n "$apk" && -s "$apk" && -n "$info" && -s "$info" ]] || { echo 'APK/build-info missing' >&2; exit 3; }
          expected="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8-sig"))["sha256"])' "$info")"
          source_commit="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8-sig"))["sourceCommit"])' "$info")"
          source_tree="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8-sig")).get("sourceTreeSha", ""))' "$info")"
          actual="$(sha256sum "$apk" | awk '{print $1}')"
          [[ "$actual" == "$expected" ]] || { echo "APK SHA mismatch expected=$expected actual=$actual" >&2; exit 4; }
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]] || { echo 'invalid exact source commit' >&2; exit 5; }
          [[ -z "$source_tree" || "$source_tree" =~ ^[0-9a-f]{40}$ ]] || { echo 'invalid source tree sha' >&2; exit 6; }
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "sha256=$actual" >> "$GITHUB_OUTPUT"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "source_tree=$source_tree" >> "$GITHUB_OUTPUT"

      - name: Prepare independent native ARM64 Android 16 runtime
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "aarch64" || "$(uname -m)" == "arm64" ]] || { echo '[JAEWOON_BUILD_ERROR:INDEPENDENT_ARM64_RUNNER_REQUIRED] independent Unity QA requires ARM64 host.' >&2; exit 7; }
          [[ "$(getconf PAGESIZE)" == "4096" ]] || { echo '[JAEWOON_BUILD_ERROR:INDEPENDENT_ARM64_PAGE_SIZE] verified Redroid path requires 4K page size.' >&2; exit 7; }
          sudo apt-get update -y
          sudo apt-get install -y adb aapt
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
          sudo systemctl start docker || sudo service docker start || true
          docker version >/tmp/jaewoon-independent-redroid-docker.txt 2>&1 || { cat /tmp/jaewoon-independent-redroid-docker.txt >&2; exit 8; }
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" || { echo '[JAEWOON_BUILD_ERROR:INDEPENDENT_BINDER_MODULE_UNAVAILABLE] binder_linux unavailable.' >&2; exit 9; }
          sudo mkdir -p /dev/binderfs
          if ! mountpoint -q /dev/binderfs; then sudo mount -t binder binder /dev/binderfs; fi
          for device in binder hwbinder vndbinder; do [[ -e "/dev/binderfs/$device" ]] || { echo "binder device missing: $device" >&2; exit 9; }; done

          image='redroid/redroid:16.0.0_64only-latest'
          docker pull "$image"
          docker rm -f jaewoon-independent-redroid >/dev/null 2>&1 || true
          data="$RUNNER_TEMP/jaewoon-independent-redroid-data"
          mkdir -p "$data"
          docker run -d --privileged --name jaewoon-independent-redroid \
            -p 5555:5555 \
            -v "$data:/data" \
            "$image" \
            androidboot.use_memfd=true \
            androidboot.redroid_width=1080 \
            androidboot.redroid_height=2400 \
            androidboot.redroid_dpi=420 \
            androidboot.redroid_gpu_mode=guest > /tmp/jaewoon-independent-redroid-container.txt

          deadline=$((SECONDS+240))
          until [[ "$(timeout --kill-after=5s 20s docker exec jaewoon-independent-redroid getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" == "1" ]]; do
            if (( SECONDS >= deadline )); then
              docker logs jaewoon-independent-redroid > /tmp/jaewoon-independent-redroid.log 2>&1 || true
              tail -n 200 /tmp/jaewoon-independent-redroid.log >&2 || true
              exit 10
            fi
            sleep 5
          done
          docker logs jaewoon-independent-redroid > /tmp/jaewoon-independent-redroid.log 2>&1 || true
          adb start-server >/dev/null
          connected=false
          for _ in $(seq 1 30); do
            adb connect 127.0.0.1:5555 >/tmp/jaewoon-independent-redroid-adb-connect.txt 2>&1 || true
            if adb devices | awk '$1=="127.0.0.1:5555" && $2=="device" {ok=1} END{exit ok?0:1}'; then connected=true; break; fi
            sleep 2
          done
          [[ "$connected" == "true" ]] || { adb devices -l >&2 || true; exit 11; }
          api="$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
          abis="$(adb shell getprop ro.product.cpu.abilist | tr -d '\r')"
          [[ "$api" == "36" ]] || { echo "independent runtime API mismatch: $api" >&2; exit 12; }
          grep -q 'arm64-v8a' <<<"$abis" || { echo "independent runtime is not ARM64: $abis" >&2; exit 12; }
          printf 'HOST_ARCH=%s\nANDROID_API=%s\nANDROID_ABIS=%s\nIMAGE=%s\n' "$(uname -m)" "$api" "$abis" "$image" > /tmp/jaewoon-independent-redroid-device.txt

      - name: Independently install, stress, background and resume APK
        id: qa
        env:
          APK: ${{ steps.apk.outputs.path }}
          BUILD_SHA: ${{ steps.apk.outputs.sha256 }}
          BUILD_SOURCE_COMMIT: ${{ steps.apk.outputs.source_commit }}
          BUILD_SOURCE_TREE: ${{ steps.apk.outputs.source_tree }}
          UPSTREAM_RUN: ${{ steps.upstream.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts/unity-independent-qa
          AAPT="$(command -v aapt 2>/dev/null || true)"
          [[ -n "$AAPT" && -x "$AAPT" ]] || { echo 'aapt unavailable for independent QA' >&2; exit 13; }
          package="$($AAPT dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n1)"
          [[ -n "$package" ]] || { echo 'could not resolve package id' >&2; exit 13; }
          device_abis="$(adb shell getprop ro.product.cpu.abilist | tr -d '\r')"
          unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/' || { echo 'APK ARM64 payload missing' >&2; exit 13; }
          grep -q 'arm64-v8a' <<<"$device_abis" || { echo "independent runtime ABI mismatch: $device_abis" >&2; exit 13; }

          adb logcat -c
          adb install -r -t "$APK" >/tmp/independent-install.log
          adb shell monkey -p "$package" -c android.intent.category.LAUNCHER 1 >/tmp/independent-launch.log
          sleep 5
          pid="$(adb shell pidof "$package" | tr -d '\r' | awk '{print $1}')"
          [[ -n "$pid" ]] || { echo 'process did not start' >&2; exit 14; }

          for xy in '540 1500' '540 1320' '300 1480' '780 1480' '540 1180' '540 1500'; do adb shell input tap $xy; sleep 0.15; done
          adb shell input swipe 820 1500 240 1500 220
          adb shell input keyevent 3
          sleep 2
          adb shell monkey -p "$package" -c android.intent.category.LAUNCHER 1 >/tmp/independent-resume.log
          sleep 4
          for xy in '540 1500' '540 1320' '540 1500' '540 1320'; do adb shell input tap $xy; sleep 0.15; done

          pid_after="$(adb shell pidof "$package" | tr -d '\r' | awk '{print $1}')"
          [[ -n "$pid_after" ]] || { echo 'process died during independent QA' >&2; exit 15; }
          adb exec-out screencap -p > qa-artifacts/unity-independent-qa/screen.png
          adb logcat -d > qa-artifacts/unity-independent-qa/logcat.txt
          if grep -Eiq "FATAL EXCEPTION|ANR in ${package}|Fatal signal|Process ${package} .* has died" qa-artifacts/unity-independent-qa/logcat.txt; then
            echo 'fatal runtime signal found during independent QA' >&2
            exit 16
          fi

          python3 - <<'PY'
          import json, os
          evidence = {
              'version': 2,
              'state': 'PASS',
              'independentQa': 'PASS',
              'independent': True,
              'runtimeProvider': 'REDROID_NATIVE_ARM64_ANDROID_16',
              'upstreamBuildRunId': int(os.environ['UPSTREAM_RUN']),
              'buildId': os.environ['BUILD_SHA'],
              'apkSha256': os.environ['BUILD_SHA'],
              'buildSourceCommit': os.environ['BUILD_SOURCE_COMMIT'],
              'sourceTreeSha': os.environ.get('BUILD_SOURCE_TREE') or None,
              'checks': {
                  'architectureCompatibleRuntime': 'PASS',
                  'freshInstall': 'PASS',
                  'processLaunch': 'PASS',
                  'rapidInputStress': 'PASS',
                  'backgroundResume': 'PASS',
                  'processAliveAfterStress': 'PASS',
                  'fatalCrashScan': 'PASS',
                  'screenshotCaptured': 'PASS'
              }
          }
          with open('qa-artifacts/unity-independent-qa/evidence.json','w',encoding='utf-8') as f:
              json.dump(evidence,f,ensure_ascii=False,indent=2)
              f.write('\n')
          PY
          echo "INDEPENDENT_QA=PASS"
          echo "INDEPENDENT_BUILD_ID=$BUILD_SHA"
          echo "INDEPENDENT_SOURCE_COMMIT=$BUILD_SOURCE_COMMIT"
          echo "INDEPENDENT_SOURCE_TREE=$BUILD_SOURCE_TREE"

      - name: Upload independent Unity QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-independent-qa-${{ steps.upstream.outputs.run_id }}
          path: |
            qa-artifacts/unity-independent-qa/
            /tmp/jaewoon-independent-redroid.log
            /tmp/jaewoon-independent-redroid-device.txt
            /tmp/jaewoon-independent-redroid-docker.txt
            /tmp/jaewoon-independent-redroid-adb-connect.txt
          if-no-files-found: warn
          retention-days: 14