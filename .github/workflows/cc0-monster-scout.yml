name: CC0 Monster Scout
on:
  workflow_dispatch:
jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - name: Print monster license evidence
        run: |
          git clone --depth 1 -q https://github.com/tech-leads-club/nj-mmo.git repo
          cd repo
          echo "=== monsters/LICENSE.txt"; cat client/public/models/monsters/LICENSE.txt
          echo "=== root LICENSE head"; head -5 LICENSE
          echo "=== grep monsters in docs"; grep -rIl "Ultimate Monsters" --include=*.md --include=*.txt --include=*.json . 2>/dev/null | head -5
          grep -rIh "Ultimate Monsters" --include=*.md . 2>/dev/null | head -5
          echo "=== skins"; for f in Werewolf WerewolfChieftain WerewolfHunter OrcSoldier OrcWarrior OrcCaptain Goblin GiantSpider StoneGolem Wolf ElderWolf; do sha256sum client/public/models/monsters/$f.glb; done
