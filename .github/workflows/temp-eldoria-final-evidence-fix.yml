name: Temp Eldoria Final Evidence Fix
on:
  push:
    branches:
      - fix/eldoria-final-evidence-contracts
    paths:
      - tools/temp-eldoria-final-evidence-fix.py
      - .github/workflows/temp-eldoria-final-evidence-fix.yml
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/eldoria-final-evidence-contracts
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact final evidence patch
        run: python3 tools/temp-eldoria-final-evidence-fix.py
      - name: Validate shared runtime syntax
        run: node --check web-games/_shared/vibe2-final.js
      - name: Run Web runtime regression tests
        run: node --test qa/company-development-web-runtime.test.mjs qa/company-web-validation-evidence-contract.test.mjs
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit validated canonical changes
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-web-runtime'
          git config user.email 'actions@users.noreply.github.com'
          git add web-games/_shared/vibe2-final.js qa/company-development-web-runtime.test.mjs
          git diff --cached --quiet && { echo 'NO_CANONICAL_CHANGES'; exit 1; }
          git commit -m 'fix(web): expose replay seed and persisted gameplay state'
          git push origin HEAD:fix/eldoria-final-evidence-contracts
