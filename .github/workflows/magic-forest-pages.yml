# 파일명: .github/workflows/magic-forest-pages.yml
name: Magic Forest Static Play

on:
  push:
    branches: [main]
    paths:
      - "web-games/**"
      - "game-catalog.json"
      - "assets/**"
      - "!assets/external/**"
      - "!assets/roblox/**"
      - "!assets/native-authoring/**"
      - "!assets/homepage-media/**"
      - "!assets/homepage-covers/**"
      - ".github/workflows/magic-forest-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: magic-forest-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact main source without hydrating large unused assets
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            web-games
            game-catalog.json

      - name: Prepare all registered game routes and necessary shared assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const cp=require('node:child_process');
          const catalog=JSON.parse(fs.readFileSync('game-catalog.json','utf8'));
          const site='_site',routes=[];
          fs.rmSync(site,{recursive:true,force:true});
          fs.mkdirSync(path.join(site,'web-games'),{recursive:true});
          const forest='web-games/fantasy-survival';
          for(const filename of ['index.html','tier.html']){
            if(!fs.existsSync(path.join(forest,filename)))throw Error('MAGIC_FOREST_SOURCE_MISSING:'+filename);
            fs.copyFileSync(path.join(forest,filename),path.join(site,filename));
          }
          if(fs.existsSync('web-games/_shared'))fs.cpSync('web-games/_shared',path.join(site,'web-games/_shared'),{recursive:true});
          for(const game of catalog.games||[]){
            const id=String(game?.canonical?.identity?.gameId||game?.id||'').trim();
            if(!/^[a-z0-9][a-z0-9-]*$/.test(id))continue;
            const lifecycle=String(game?.canonical?.lifecycle?.state||game?.lifecycleState||'ACTIVE').toUpperCase();
            if(!['ACTIVE','REBUILD'].includes(lifecycle))continue;
            const web=game?.canonical?.sources?.web||{};
            const state=String(web.state||game.ownerWebSourceState||'').toUpperCase();
            if(['NON_GAME_SURFACE','WITHDRAWN_SIMPLE_PROTOTYPE','ENTRY_MISSING_OR_INVALID'].includes(state))continue;
            const root=String(web.path||game.webPath||'').replace(/^\/+|\/+$/g,'');
            if(root!=='web-games/'+id)continue;
            const entry=root+'/index.html';
            if(!fs.existsSync(entry)){
              console.log('WEB_GAME_SOURCE_NOT_READY='+id);
              continue;
            }
            fs.cpSync(root,path.join(site,root),{recursive:true});
            routes.push(root+'/');
          }
          if(!routes.includes('web-games/fantasy-survival/'))throw Error('MAGIC_FOREST_REGISTERED_ROUTE_MISSING');
          // Only direct files referenced by published games are hydrated from the canonical Git tree.
          // The original assets library stays untouched in GitHub and is never copied wholesale.
          const trackedAssets=new Set(cp.execFileSync('git',['ls-tree','-r','--name-only','HEAD','--','assets'],{encoding:'utf8'}).trim().split('\n'));
          const refs=new Set();
          const collect=root=>{
            if(!fs.existsSync(root))return;
            for(const entry of fs.readdirSync(root,{withFileTypes:true})){
              const file=path.join(root,entry.name);
              if(entry.isDirectory()){collect(file);continue;}
              if(!entry.isFile()||!/\.(?:html|css|m?js|json|gltf|svg)$/i.test(file))continue;
              const source=fs.readFileSync(file,'utf8');
              for(const match of source.matchAll(/(?:^|[^a-zA-Z0-9._/-])\/?assets\/([a-zA-Z0-9._/-]+)/gm)){
                const relative=match[1].replace(/[^a-zA-Z0-9._/-].*$/,'');
                const asset='assets/'+relative;
                if(!asset.includes('..')&&trackedAssets.has(asset))refs.add(asset);
              }
            }
          };
          collect(site);
          for(const asset of [...refs].sort()){
            const target=path.join(site,asset);
            fs.mkdirSync(path.dirname(target),{recursive:true});
            const source=cp.execFileSync('git',['show','HEAD:'+asset],{maxBuffer:105*1024*1024});
            if(source.length>100*1024*1024)throw Error('GITHUB_PAGES_ASSET_TOO_LARGE:'+asset);
            fs.writeFileSync(target,source);
          }
          fs.writeFileSync(path.join(site,'.nojekyll'),'');
          fs.writeFileSync(path.join(site,'web-games/publish-manifest.json'),JSON.stringify({
            version:1,sourceSha:process.env.GITHUB_SHA,routes:routes.sort(),sharedAssets:[...refs].sort(),
            target:'GITHUB_PAGES_INTERNAL_STATIC',gameCount:routes.length
          },null,2)+'\n');
          if(!routes.length)throw Error('WEB_GAME_ROUTES_EMPTY');
          console.log('WEB_PAGES_SOURCE_SHA='+process.env.GITHUB_SHA);
          console.log('WEB_PAGES_PREPARED_GAMES='+routes.length);
          console.log('WEB_PAGES_SHARED_ASSETS='+refs.size);
          NODE

      - name: Publish gh-pages without force or deleting earlier games
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "jaewoon-pages"
          git config user.email "pages@users.noreply.github.com"
          gh auth setup-git
          git fetch --no-tags --depth=1 origin gh-pages:refs/remotes/origin/gh-pages
          site="$RUNNER_TEMP/jaewoon-pages-publish"
          git worktree add --detach "$site" origin/gh-pages
          # Copy only, never delete previous published game directories.
          rsync -a "$GITHUB_WORKSPACE/_site/" "$site/"
          git -C "$site" add --all
          if ! git -C "$site" diff --cached --quiet; then
            git -C "$site" commit -m "pages: publish registered web games from main $GITHUB_SHA"
            git -C "$site" push origin HEAD:gh-pages
          fi
          published="$(git ls-remote --exit-code origin refs/heads/gh-pages | cut -f1)"
          test "$published" = "$(git -C "$site" rev-parse HEAD)"
          echo "WEB_PAGES_PUBLISHED_COMMIT=$published"
          echo "WEB_PAGES_SOURCE_SHA=$GITHUB_SHA"

      - name: Verify live GitHub Pages source and game routes
        shell: bash
        run: |
          set -euo pipefail
          base="https://$GITHUB_REPOSITORY_OWNER.github.io/jaewoon-games/"
          manifest_url="$base""web-games/publish-manifest.json"
          verified=false
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL --max-time 15 "$manifest_url" \
              | GITHUB_SHA="$GITHUB_SHA" node -e "let x='';process.stdin.on('data',d=>x+=d);process.stdin.on('end',()=>{let m;try{m=JSON.parse(x)}catch{process.exit(1)}if(m.sourceSha!==process.env.GITHUB_SHA||!Array.isArray(m.routes)||!m.routes.length)process.exit(1)})"; then
              verified=true
              break
            fi
            sleep 10
          done
          if [ "$verified" != true ]; then echo "WEB_PAGES_LIVE_SOURCE_NOT_VERIFIED" >&2; exit 1; fi
          curl -fsSL --max-time 15 "$manifest_url" -o /tmp/web-pages-published.json
          node -e "const m=require('/tmp/web-pages-published.json');for(const p of m.routes)if(!/^web-games\/[a-z0-9-]+\/$/.test(p))process.exit(1)"
          node -p "require('/tmp/web-pages-published.json').routes.join('\n')" | while IFS= read -r route; do
            curl -fsSL --max-time 15 -o /dev/null "$base$route" || { echo "WEB_PAGES_ROUTE_NOT_LIVE=$route" >&2; exit 1; }
          done
          echo "WEB_PAGES_LIVE_SOURCE_SHA=$GITHUB_SHA"
          echo "WEB_PAGES_ROUTES_HTTP_200=PASS"
          echo "MAGIC_FOREST_PLAY_URL=$base"
