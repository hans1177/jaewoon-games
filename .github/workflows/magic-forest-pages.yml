name: Magic Forest Static Play

on:
  push:
    branches: [main]
    paths:
      - "web-games/fantasy-survival/index.html"
      - ".github/workflows/magic-forest-pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: magic-forest-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp web-games/fantasy-survival/index.html _site/index.html
          touch _site/.nojekyll

      - name: Publish gh-pages branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/magic-forest-pages
          mkdir -p /tmp/magic-forest-pages
          cp -a _site/. /tmp/magic-forest-pages/
          git config user.name "jaewoon-pages"
          git config user.email "pages@users.noreply.github.com"
          git switch --orphan magic-forest-pages-publish
          git rm -rf . >/dev/null 2>&1 || true
          cp -a /tmp/magic-forest-pages/. .
          git add -A
          git commit -m "pages: publish magic forest"
          git push origin HEAD:gh-pages --force

      - name: Ensure branch-based GitHub Pages when integration permits
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload='{"source":{"branch":"gh-pages","path":"/"},"build_type":"legacy"}'
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            if printf '%s\n' "$payload" | gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" --input -; then
              echo 'MAGIC_FOREST_PAGES_CONFIG=UPDATED'
            else
              echo 'MAGIC_FOREST_PAGES_CONFIG=EXISTING_CONFIG_UPDATE_NOT_PERMITTED'
              echo 'MAGIC_FOREST_GH_PAGES_BRANCH_PUBLISHED=YES'
            fi
          else
            if printf '%s\n' "$payload" | gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" --input -; then
              echo 'MAGIC_FOREST_PAGES_CONFIG=CREATED'
            else
              echo 'MAGIC_FOREST_PAGES_CONFIG=CREATE_NOT_PERMITTED'
              echo 'MAGIC_FOREST_GH_PAGES_BRANCH_PUBLISHED=YES'
            fi
          fi

      - name: Show play URL
        run: echo "MAGIC_FOREST_PLAY_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io/jaewoon-games/"
