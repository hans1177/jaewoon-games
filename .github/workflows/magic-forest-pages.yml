name: Magic Forest Static Play

on:
  push:
    branches: [main]
    paths:
      - "web-games/fantasy-survival/index.html"
      - "web-games/fantasy-survival/tier.html"
      - ".github/workflows/magic-forest-pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: magic-forest-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            web-games/fantasy-survival
          sparse-checkout-cone-mode: true

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp web-games/fantasy-survival/index.html _site/index.html
          cp web-games/fantasy-survival/tier.html _site/tier.html
          touch _site/.nojekyll

      - name: Publish gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Sparse checkout와 무관한 정적 결과 디렉터리에서만 배포 커밋 생성.
          # 기존 루트의 LFS 변환 파일을 checkout하지 않아 20개 파일 오염 오류 방지.
          cd _site
          git init -q
          git config user.name "jaewoon-pages"
          git config user.email "pages@users.noreply.github.com"
          git checkout -qb magic-forest-pages-publish
          git add -A
          git commit -qm "pages: publish magic forest"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          gh auth setup-git
          git push origin HEAD:gh-pages --force

      - name: Verify branch-based GitHub Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # 이 저장소의 Pages 설정은 이미 존재한다. Actions 토큰으로 관리자용
          # PUT/POST를 반복하면 403이 발생하므로 읽은 실제 설정을 엄격히 검증한다.
          pages="$(gh api "repos/${GITHUB_REPOSITORY}/pages")"
          node -e '
            const config=JSON.parse(process.argv[1]);
            if(config.source?.branch!=="gh-pages"||config.source?.path!=="/"||config.build_type!=="legacy"){
              console.error("MAGIC_FOREST_PAGES_CONFIG_MISMATCH: owner must configure gh-pages / (legacy)");
              process.exit(1);
            }
            console.log("MAGIC_FOREST_PAGES_SOURCE_VERIFIED=gh-pages:/");
          ' "$pages"

      - name: Show play URL
        run: echo "MAGIC_FOREST_PLAY_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io/jaewoon-games/"
