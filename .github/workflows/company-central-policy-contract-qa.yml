      - '.github/workflows/company-development-roblox-runtime.yml'
      - '.github/workflows/vibe2-24h-runner.yml'
      - '.github/workflows/unity-android-regression.yml'
      - '.github/workflows/director-supervisor.yml'
      - '.github/workflows/homepage-manager.yml'
      - '.github/workflows/company-central-policy-contract-qa.yml'
  workflow_dispatch:

concurrency:
  group: company-central-policy-contract-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  central-policy-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify central policy and selected-platform production authority
        run: |
          node --check tools/company-shared-context.mjs
          node --test qa/company-shared-context.test.mjs
          node --test qa/company-long-horizon-vision.test.mjs
          node tools/company-shared-context.mjs --output=/tmp/company-shared-context.json
          node --check tools/production-classification.mjs
          node --check tools/design-only-promotion-sync.mjs
          node --check tools/company-selected-platform-router.mjs
          node --check tools/company-development-unity-platform.mjs
          node --check tools/company-development-uefn-platform.mjs
          node --check tools/vibe3-roblox-platform.mjs
          node --check tools/company-development-web-bootstrap.mjs
          node --check tools/company-development-web-gameplay-validation.mjs
          node --check tools/company-web-validation-evidence-contract.mjs
          node --check tools/company-strict-production-review.mjs
          node --check tools/company-development-unity-bootstrap.mjs
          node --check tools/company-development-unity-evidence.mjs
          node --check tools/company-development-validation-cycle.mjs
          node --check tools/company-release-production-cycle.mjs
          node --check tools/company-development-roblox-bootstrap.mjs
          node --check tools/company-development-roblox-source-reconcile.mjs
          node --check tools/vibe2-post-release-focus.mjs
          node --check tools/homepage-test-candidate-sync.mjs
          node --test \
            qa/company-direct-native-policy-contract.test.mjs \
            qa/company-machine-development-lifecycle.test.mjs \
            qa/vibe2-post-release-focus.test.mjs \
            qa/company-central-pipeline-only.test.mjs \
            qa/company-platform-speed-policy.test.mjs \
            qa/company-minimum-design-contract.test.mjs \
            qa/company-selected-platform-router.test.mjs \
            qa/company-development-validation-selected-platform.test.mjs \
            qa/company-development-unity-runtime.test.mjs \
            qa/company-development-roblox-runtime.test.mjs \
            qa/company-development-roblox-runtime-continuation.test.mjs \
            qa/company-development-roblox-release-promotion.test.mjs \
            qa/company-native-learning-real-evidence-contract.test.mjs \
            qa/company-native-score-not-web-score-contract.test.mjs \
            qa/company-platform-score-learning-contract.test.mjs \
            qa/company-strict-learning-delta-contract.test.mjs \
            qa/vibe2-handoff.test.mjs
