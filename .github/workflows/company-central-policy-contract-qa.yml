name: Company Central Policy Contract QA

on:
  pull_request:
    paths:
      - 'COMPANY_FLOW.md'
      - 'company-directive.json'
      - 'company-learning/platform-release-roadmap.json'
      - 'AGENTS.md'
      - 'tools/production-classification.mjs'
      - 'tools/design-only-promotion-sync.mjs'
      - 'tools/company-selected-platform-router.mjs'
      - 'tools/company-development-unity-platform.mjs'
      - 'tools/company-development-uefn-platform.mjs'
      - 'tools/vibe3-roblox-platform.mjs'
      - 'tools/company-development-web-bootstrap.mjs'
      - 'tools/company-development-web-gameplay-validation.mjs'
      - 'tools/company-web-validation-evidence-contract.mjs'
      - 'tools/company-strict-production-review.mjs'
      - 'tools/company-development-unity-bootstrap.mjs'
      - 'tools/company-development-unity-evidence.mjs'
      - 'tools/company-development-validation-cycle.mjs'
      - 'tools/company-release-production-cycle.mjs'
      - 'tools/homepage-test-candidate-sync.mjs'
      - 'qa/company-central-policy-contract.test.mjs'
      - 'qa/company-central-pipeline-only.test.mjs'
      - 'qa/company-platform-speed-policy.test.mjs'
      - 'qa/company-selected-platform-router.test.mjs'
      - 'qa/company-speed-sequence-workflow.test.mjs'
      - 'qa/design-only-promotion-sync.test.mjs'
      - 'qa/company-development-validation-selected-platform.test.mjs'
      - 'qa/company-development-web-runtime.test.mjs'
      - 'qa/company-development-unity-runtime.test.mjs'
      - 'qa/company-homepage-top30-contract.test.mjs'
      - 'qa/company-native-learning-real-evidence-contract.test.mjs'
      - 'qa/company-native-score-not-web-score-contract.test.mjs'
      - 'qa/company-platform-score-learning-contract.test.mjs'
      - 'qa/company-strict-learning-delta-contract.test.mjs'
      - 'qa/company-top30-platform-promotion-learning.test.mjs'
      - 'qa/company-web-evidence-freshness-contract.test.mjs'
      - 'qa/company-web-independent-promotion-contract.test.mjs'
      - 'qa/company-web-validation-evidence-contract.test.mjs'
      - '.github/workflows/company-seed-design-runtime.yml'
      - '.github/workflows/company-design-promotion-sync.yml'
      - '.github/workflows/company-development-confirmed-runtime.yml'
      - '.github/workflows/company-development-unity-runtime.yml'
      - '.github/workflows/unity-android-regression.yml'
      - '.github/workflows/director-supervisor.yml'
      - '.github/workflows/company-central-policy-contract-qa.yml'
  push:
    branches: [main]
    paths:
      - 'COMPANY_FLOW.md'
      - 'company-directive.json'
      - 'company-learning/platform-release-roadmap.json'
      - 'AGENTS.md'
      - 'tools/production-classification.mjs'
      - 'tools/design-only-promotion-sync.mjs'
      - 'tools/company-selected-platform-router.mjs'
      - 'tools/company-development-unity-platform.mjs'
      - 'tools/company-development-uefn-platform.mjs'
      - 'tools/vibe3-roblox-platform.mjs'
      - 'tools/company-development-web-bootstrap.mjs'
      - 'tools/company-development-web-gameplay-validation.mjs'
      - 'tools/company-web-validation-evidence-contract.mjs'
      - 'tools/company-strict-production-review.mjs'
      - 'tools/company-development-unity-bootstrap.mjs'
      - 'tools/company-development-unity-evidence.mjs'
      - 'tools/company-development-validation-cycle.mjs'
      - 'tools/company-release-production-cycle.mjs'
      - 'tools/homepage-test-candidate-sync.mjs'
      - 'qa/company-central-policy-contract.test.mjs'
      - 'qa/company-central-pipeline-only.test.mjs'
      - 'qa/company-platform-speed-policy.test.mjs'
      - 'qa/company-selected-platform-router.test.mjs'
      - 'qa/company-speed-sequence-workflow.test.mjs'
      - 'qa/design-only-promotion-sync.test.mjs'
      - 'qa/company-development-validation-selected-platform.test.mjs'
      - 'qa/company-development-web-runtime.test.mjs'
      - 'qa/company-development-unity-runtime.test.mjs'
      - 'qa/company-homepage-top30-contract.test.mjs'
      - 'qa/company-native-learning-real-evidence-contract.test.mjs'
      - 'qa/company-native-score-not-web-score-contract.test.mjs'
      - 'qa/company-platform-score-learning-contract.test.mjs'
      - 'qa/company-strict-learning-delta-contract.test.mjs'
      - 'qa/company-top30-platform-promotion-learning.test.mjs'
      - 'qa/company-web-evidence-freshness-contract.test.mjs'
      - 'qa/company-web-independent-promotion-contract.test.mjs'
      - 'qa/company-web-validation-evidence-contract.test.mjs'
      - '.github/workflows/company-seed-design-runtime.yml'
      - '.github/workflows/company-design-promotion-sync.yml'
      - '.github/workflows/company-development-confirmed-runtime.yml'
      - '.github/workflows/company-development-unity-runtime.yml'
      - '.github/workflows/unity-android-regression.yml'
      - '.github/workflows/director-supervisor.yml'
      - '.github/workflows/company-central-policy-contract-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  central-policy-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify central policy and selected-platform production authority
        run: |
          node --check tools/production-classification.mjs
          node --check tools/design-only-promotion-sync.mjs
          node --check tools/company-selected-platform-router.mjs
          node --check tools/company-development-unity-platform.mjs
          node --check tools/company-development-uefn-platform.mjs
          node --check tools/vibe3-roblox-platform.mjs
          node --check tools/company-development-web-bootstrap.mjs
          node --check tools/company-development-web-gameplay-validation.mjs
          node --check tools/company-web-validation-evidence-contract.mjs
          node --check tools/company-strict-production-review.mjs
          node --check tools/company-development-unity-bootstrap.mjs
          node --check tools/company-development-unity-evidence.mjs
          node --check tools/company-development-validation-cycle.mjs
          node --check tools/company-release-production-cycle.mjs
          node --check tools/homepage-test-candidate-sync.mjs
          node --test \
            qa/company-central-policy-contract.test.mjs \
            qa/company-central-pipeline-only.test.mjs \
            qa/company-platform-speed-policy.test.mjs \
            qa/company-selected-platform-router.test.mjs \
            qa/company-speed-sequence-workflow.test.mjs \
            qa/design-only-promotion-sync.test.mjs \
            qa/company-development-validation-selected-platform.test.mjs \
            qa/company-development-web-runtime.test.mjs \
            qa/company-development-unity-runtime.test.mjs \
            qa/company-homepage-top30-contract.test.mjs \
            qa/company-native-learning-real-evidence-contract.test.mjs \
            qa/company-native-score-not-web-score-contract.test.mjs \
            qa/company-platform-score-learning-contract.test.mjs \
            qa/company-strict-learning-delta-contract.test.mjs \
            qa/company-top30-platform-promotion-learning.test.mjs \
            qa/company-web-evidence-freshness-contract.test.mjs \
            qa/company-web-independent-promotion-contract.test.mjs \
            qa/company-web-validation-evidence-contract.test.mjs
