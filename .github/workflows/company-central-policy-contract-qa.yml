name: Company Central Policy Contract QA

on:
  pull_request:
    paths:
      - 'COMPANY_FLOW.md'
      - 'company-directive.json'
      - 'AGENTS.md'
      - 'assets/company-department-standards.js'
      - 'tools/production-classification.mjs'
      - 'tools/design-only-promotion-sync.mjs'
      - 'tools/company-selected-platform-router.mjs'
      - 'tools/company-development-validation-cycle.mjs'
      - 'tools/company-release-production-cycle.mjs'
      - 'tools/company-post-modification-review.mjs'
      - 'tools/vibe3-department-evidence-extract.mjs'
      - 'qa/company-central-policy-contract.test.mjs'
      - 'qa/company-central-pipeline-only.test.mjs'
      - 'qa/company-department-standards.test.mjs'
      - 'qa/vibe3-department-evidence-extract.test.mjs'
      - 'qa/design-only-promotion-sync.test.mjs'
      - 'qa/company-development-unity-runtime.test.mjs'
      - 'qa/company-speed-sequence-workflow.test.mjs'
      - '.github/workflows/company-seed-design-runtime.yml'
      - '.github/workflows/company-design-promotion-sync.yml'
      - '.github/workflows/company-development-confirmed-runtime.yml'
      - '.github/workflows/company-development-unity-runtime.yml'
      - '.github/workflows/director-supervisor.yml'
      - '.github/workflows/company-central-policy-contract-qa.yml'
  push:
    branches: [main]
    paths:
      - 'COMPANY_FLOW.md'
      - 'company-directive.json'
      - 'AGENTS.md'
      - 'assets/company-department-standards.js'
      - 'tools/production-classification.mjs'
      - 'tools/design-only-promotion-sync.mjs'
      - 'tools/company-selected-platform-router.mjs'
      - 'tools/company-development-validation-cycle.mjs'
      - 'tools/company-release-production-cycle.mjs'
      - 'tools/company-post-modification-review.mjs'
      - 'tools/vibe3-department-evidence-extract.mjs'
      - 'qa/company-central-policy-contract.test.mjs'
      - 'qa/company-central-pipeline-only.test.mjs'
      - 'qa/company-department-standards.test.mjs'
      - 'qa/vibe3-department-evidence-extract.test.mjs'
      - 'qa/design-only-promotion-sync.test.mjs'
      - 'qa/company-development-unity-runtime.test.mjs'
      - 'qa/company-speed-sequence-workflow.test.mjs'
      - '.github/workflows/company-seed-design-runtime.yml'
      - '.github/workflows/company-design-promotion-sync.yml'
      - '.github/workflows/company-development-confirmed-runtime.yml'
      - '.github/workflows/company-development-unity-runtime.yml'
      - '.github/workflows/director-supervisor.yml'
      - '.github/workflows/company-central-policy-contract-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  central-policy-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify central policy and production pipeline authority
        run: |
          node --check tools/production-classification.mjs
          node --check tools/design-only-promotion-sync.mjs
          node --check tools/company-selected-platform-router.mjs
          node --check tools/company-development-validation-cycle.mjs
          node --check tools/company-release-production-cycle.mjs
          node --check tools/company-post-modification-review.mjs
          node --check tools/vibe3-department-evidence-extract.mjs
          node --check assets/company-department-standards.js
          node --test \
            qa/company-central-policy-contract.test.mjs \
            qa/company-central-pipeline-only.test.mjs \
            qa/company-department-standards.test.mjs \
            qa/vibe3-department-evidence-extract.test.mjs \
            qa/design-only-promotion-sync.test.mjs \
            qa/company-development-unity-runtime.test.mjs \
            qa/company-speed-sequence-workflow.test.mjs
