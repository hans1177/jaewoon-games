name: Company Central Policy Contract QA

on:
  pull_request:
    paths:
      - 'COMPANY_FLOW.md'
      - 'company-directive.json'
      - 'AGENTS.md'
      - 'tools/autonomous-work-planner.mjs'
      - 'tools/autonomous-24h-work-planner.mjs'
      - 'tools/development-baseline-evidence.mjs'
      - 'qa/company-central-policy-contract.test.mjs'
      - 'qa/company-tier-execution-routing.test.mjs'
      - '.github/workflows/company-central-policy-contract-qa.yml'
  push:
    branches: [main]
    paths:
      - 'COMPANY_FLOW.md'
      - 'company-directive.json'
      - 'AGENTS.md'
      - 'tools/autonomous-work-planner.mjs'
      - 'tools/autonomous-24h-work-planner.mjs'
      - 'tools/development-baseline-evidence.mjs'
      - 'qa/company-central-policy-contract.test.mjs'
      - 'qa/company-tier-execution-routing.test.mjs'
      - '.github/workflows/company-central-policy-contract-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  central-policy-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify central production policy and runtime routing
        run: node --test qa/company-central-policy-contract.test.mjs qa/company-tier-execution-routing.test.mjs
