# 공통(게임 id 입력): 오너 PC의 로그인된 Roblox Studio(기존 러너 라벨 roblox-studio-authenticated)로 마을을 직접 띄워 화면을 캡처한다.
# 기존 Studio MCP 도구(tools/company-development-roblox-studio-local-play.mjs, studio-script 모드)를 그대로 쓴다.
# 결과 사진·리포트는 브랜치 <game>-studio-frames (예: mare-essentia-studio-frames)에 올라간다 (바이브 복구가 실패 증거를 읽는다).
name: Devloop Studio Capture
run-name: Devloop Studio Capture · ${{ inputs.game || 'mare-essentia' }} · ${{ github.sha }}
on:
  # [메인] 마력숲 UI 수집 진단 변경이 main에 병합되면 기존 Windows Studio 검사를 자동 재실행한다.
  push:
    branches: [main]
    paths:
      - 'tools/gen-qa-click-scripts.py'
      - 'tools/company-development-roblox-studio-local-play.mjs'
      - 'roblox-games/mare-essentia/tools/devloop/studio-scripts/mare-qa-click.json'
      - 'roblox-games/mare-essentia/src/**'
  workflow_dispatch:
    inputs:
      game:
        description: 게임 폴더 이름 (roblox-games/<game>)
        required: false
        default: mare-essentia
        type: string
      script:
        description: Studio script JSON path in repo (비우면 게임의 tools/devloop/studio-scripts/default.json, 없으면 opening-capture)
        required: false
        default: ''
        type: string
permissions:
  contents: write
concurrency:
  group: roblox-studio-shared-host
  cancel-in-progress: false
  queue: max
jobs:
  capture:
    if: github.repository == 'hans1177/jaewoon-games' && (github.event_name == 'push' || inputs.game == 'mare-essentia')
    runs-on: [self-hosted, Windows, X64, roblox-studio-authenticated]
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate inputs
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GAME_IN: ${{ github.event_name == 'push' && 'mare-essentia' || inputs.game }}
          SCRIPT_IN: ${{ github.event_name == 'push' && 'roblox-games/mare-essentia/tools/devloop/studio-scripts/mare-qa-click.json' || inputs.script }}
        run: |
          $g = $env:GAME_IN
          if ($g -notmatch '^[a-z0-9-]+$') { throw "bad game id" }
          if (-not (Test-Path "main/roblox-games/$g/default.project.json")) { throw "no project for $g" }
          $sc = $env:SCRIPT_IN
          if ($sc -eq '') {
            $d = "roblox-games/$g/tools/devloop/studio-scripts/default.json"
            if (Test-Path "main/$d") { $sc = $d } elseif ($g -eq 'mare-essentia') { $sc = "roblox-games/mare-essentia/tools/devloop/studio-scripts/mare-town.json" } else { $sc = '' }
          }
          if ($sc -ne '' -and $sc -notmatch '^roblox-games/[a-z0-9-]+/[A-Za-z0-9_./-]+\.json$') { throw "bad script path" }
          "CAP_GAME=$g" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CAP_SCRIPT=$sc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build place with pinned Rojo
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          # [메인] 자동개발 빌드 임시 파일은 기존 E: 인증 실행기 작업 경로만 사용한다.
          $jobTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          if ([IO.Path]::GetPathRoot($jobTemp) -ne 'E:\') { throw 'ROBLOX_STUDIO_E_RUNNER_TEMP_REQUIRED' }
          if (([IO.DriveInfo]::new('E:\')).AvailableFreeSpace -lt 2GB) { throw 'ROBLOX_STUDIO_E_DRIVE_FREE_SPACE_REQUIRED' }
          $env:TEMP = $jobTemp
          $env:TMP = $jobTemp
          Write-Host 'ROBLOX_STUDIO_BUILD_TEMP_DRIVE=E'
          $rojoZip = Join-Path $env:RUNNER_TEMP 'rojo.zip'
          $rojoDir = Join-Path $env:RUNNER_TEMP 'rojo-bin'
          Remove-Item -Recurse -Force $rojoDir -ErrorAction SilentlyContinue
          & curl.exe -fL --retry 3 -o $rojoZip 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip'
          $h = (Get-FileHash $rojoZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($h -ne '2179c44862a10ecbd725bdfeb4abc64e16dc4aad9b6c8f3e1a7c46a87280b949') { throw "rojo hash $h" }
          Expand-Archive $rojoZip -DestinationPath $rojoDir -Force
          $rojo = (Get-ChildItem $rojoDir -Recurse -Filter rojo.exe | Select-Object -First 1).FullName
          $place = Join-Path $env:RUNNER_TEMP 'marecheck.rbxl'
          Remove-Item $place -ErrorAction SilentlyContinue
          & $rojo build "main/roblox-games/$($env:CAP_GAME)/default.project.json" -o $place
          if ($LASTEXITCODE -ne 0) { throw 'rojo build failed' }
          "MARE_PLACE=$place" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Launch Studio, run script, capture frames
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          # [메인] 공식 Studio·MCP·Node의 사용자 임시 파일은 기존 E: 러너 작업 폴더에서 생성한다.
          # LOCALAPPDATA·로블록스 설치·계정/저장 경로는 이동하지 않는다.
          $jobTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          if ([IO.Path]::GetPathRoot($jobTemp) -ne 'E:\') { throw 'ROBLOX_STUDIO_E_RUNNER_TEMP_REQUIRED' }
          if (([IO.DriveInfo]::new('E:\')).AvailableFreeSpace -lt 2GB) { throw 'ROBLOX_STUDIO_E_DRIVE_FREE_SPACE_REQUIRED' }
          $env:TEMP = $jobTemp
          $env:TMP = $jobTemp
          Write-Host 'ROBLOX_STUDIO_PROCESS_TEMP_DRIVE=E'
          if (@(Get-Process RobloxStudioBeta -ErrorAction SilentlyContinue).Count) { Get-Process RobloxStudioBeta -ErrorAction SilentlyContinue | Stop-Process -Force; Start-Sleep -Seconds 5 }
          # [로그] Studio 실행 전 시스템 드라이브 압박만 해소한다. 오래된 Roblox 로그 외에는 삭제하지 않는다.
          $studioVolume = [IO.DriveInfo]::new([IO.Path]::GetPathRoot($env:LOCALAPPDATA))
          Write-Host "STUDIO_SYSTEM_DISK_FREE_MB_BEFORE=$([math]::Round($studioVolume.AvailableFreeSpace/1MB,1))"
          if ($studioVolume.AvailableFreeSpace -lt 128MB) {
            $robloxLogRoot = Join-Path $env:LOCALAPPDATA 'Roblox\logs'
            if (Test-Path -LiteralPath $robloxLogRoot -PathType Container) {
              $logRootInfo = Get-Item -LiteralPath $robloxLogRoot -Force
              if (-not ($logRootInfo.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
                $cutoff = (Get-Date).AddHours(-1)
                $cleared = 0
                foreach ($log in @(Get-ChildItem -LiteralPath $robloxLogRoot -File -ErrorAction Stop |
                  Where-Object { $_.LastWriteTime -lt $cutoff -and $_.Extension -in @('.log','.txt') -and
                    -not ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) })) {
                  try {
                    Remove-Item -LiteralPath $log.FullName -Force -ErrorAction Stop
                    $cleared++
                  } catch {
                    Write-Warning 'STUDIO_OLD_LOG_LOCKED_OR_UNAVAILABLE'
                  }
                }
                Write-Host "STUDIO_OLD_ROBLOX_LOGS_CLEARED=$cleared"
              }
            }
          }
          $studioVolume = [IO.DriveInfo]::new([IO.Path]::GetPathRoot($env:LOCALAPPDATA))
          Write-Host "STUDIO_SYSTEM_DISK_FREE_MB_AFTER=$([math]::Round($studioVolume.AvailableFreeSpace/1MB,1))"
          if ($studioVolume.AvailableFreeSpace -lt 32MB) { throw 'STUDIO_SYSTEM_DISK_SPACE_REQUIRED' }
          $roots = @((Join-Path $env:LOCALAPPDATA 'Roblox\Versions'), (Join-Path ${env:ProgramFiles(x86)} 'Roblox\Versions'))
          $studio = $roots | Where-Object { Test-Path $_ } | ForEach-Object { Get-ChildItem $_ -Recurse -Filter RobloxStudioBeta.exe -ErrorAction SilentlyContinue } | Sort-Object LastWriteTime -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $studio) { throw 'RobloxStudioBeta.exe not found' }
          $mcp = Join-Path (Split-Path $studio -Parent) 'StudioMCP.exe'
          if (-not (Test-Path $mcp)) { $mcp = Join-Path $env:LOCALAPPDATA 'Roblox\mcp.bat' }
          if (-not (Test-Path $mcp)) { throw 'StudioMCP not found' }
          Write-Host "STUDIO=$studio MCP=$mcp"
          $out = Join-Path $env:RUNNER_TEMP 'mare-frames'
          $reportFile = Join-Path $out 'report.json'
          $studioNodeExitCode = 1
          # [메인] MCP 통신이 끊긴 경우에만 같은 빌드·같은 작업을 새 Studio 세션으로 한 번 재시도한다.
          # 게임 코드 오류, 클릭 실패, 화면 불일치는 재시도하지 않고 기존 QA 실패로 남긴다.
          for ($studioAttempt = 1; $studioAttempt -le 2; $studioAttempt++) {
            Remove-Item -Recurse -Force $out -ErrorAction SilentlyContinue
            New-Item -ItemType Directory $out -Force | Out-Null
            Write-Host "STUDIO_MCP_CAPTURE_ATTEMPT=$studioAttempt"
            try {
              Start-Process -FilePath $studio -ArgumentList @($env:MARE_PLACE) -PassThru | Out-Null
              if ($env:CAP_SCRIPT -ne '') {
                & node 'main/tools/company-development-roblox-studio-local-play.mjs' --mode=studio-script "--script=main/$($env:CAP_SCRIPT)" "--mcp-command=$mcp" '--studio-name=marecheck' "--out-dir=$out"
              } else {
                & node 'main/tools/company-development-roblox-studio-local-play.mjs' --mode=opening-capture "--mcp-command=$mcp" '--studio-name=marecheck' "--out-dir=$out"
              }
              $studioNodeExitCode = [int]$LASTEXITCODE
            } catch {
              $studioNodeExitCode = 1
              Write-Warning ("STUDIO_MCP_CAPTURE_PROCESS_ERROR=" + $_.Exception.GetType().Name)
            } finally {
              Get-Process RobloxStudioBeta -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            }
            Write-Host "NODE_EXIT=$studioNodeExitCode"
            Write-Host "STUDIO_SCRIPT_PROCESS_EXIT=$studioNodeExitCode"
            if ($studioAttempt -ge 2) { break }
            $attemptReport = $null
            if (Test-Path -LiteralPath $reportFile) {
              try { $attemptReport = Get-Content -LiteralPath $reportFile -Raw | ConvertFrom-Json } catch {}
            }
            $attemptErrors = @($attemptReport.errors | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) })
            $rpcStalled = $attemptErrors.Count -gt 0 -and
              @($attemptErrors | Where-Object { [string]$_ -notmatch 'MCP timeout: tools/call|MCP process exited code=' }).Count -eq 0
            if (-not $rpcStalled) { break }
            Write-Warning 'STUDIO_MCP_TRANSPORT_RETRY=FRESH_OFFICIAL_STUDIO_SESSION_ONCE'
            Start-Sleep -Seconds 8
          }
          # [실증 검증] 성공처럼 보이는 빈 캡처·스크립트 오류는 실패로 처리한다.
          $reportFile = Join-Path $out 'report.json'
          # [오류 증거] Node가 먼저 실패해도 원인 기록을 남겨 기존 복구 작업으로 전달한다.
          if (-not (Test-Path $reportFile)) {
            [ordered]@{
              log = @()
              errors = @('STUDIO_REPORT_MISSING')
              evidenceScope = 'WORKFLOW_FAILURE_DIAGNOSTIC_ONLY_NOT_STUDIO_PLAY'
            } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $reportFile -Encoding UTF8
          }
          try {
            $report = Get-Content $reportFile -Raw | ConvertFrom-Json
          } catch {
            [ordered]@{
              log = @()
              errors = @('STUDIO_REPORT_INVALID_JSON')
              evidenceScope = 'WORKFLOW_FAILURE_DIAGNOSTIC_ONLY_NOT_STUDIO_PLAY'
            } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $reportFile -Encoding UTF8
            $report = Get-Content $reportFile -Raw | ConvertFrom-Json
          }
          # [런타임 진단] 실제 Studio 결과만 사용한다. 실패해도 증거를 먼저 저장한다.
          $qaStage = ''
          $qaSignature = ''
          if ($studioNodeExitCode -ne 0) {
            $qaStage = 'STUDIO_EXECUTION'
            $qaSignature = 'STUDIO_SCRIPT_REPORTED_ERRORS'
          }
          if (@($report.errors).Count -gt 0) {
            $qaStage = 'STUDIO_EXECUTION'
            $qaSignature = 'STUDIO_SCRIPT_REPORTED_ERRORS'
            # [복구 분류] Studio MCP 통신 타임아웃을 게임 소스 오류로 위장하지 않는다.
            if (@($report.errors | Where-Object { [string]$_ -match 'MCP timeout: tools/call' }).Count -gt 0) {
              $qaSignature = 'STUDIO_MCP_TOOL_TIMEOUT'
            }
          }
          # [실증 분류] 185단계 버튼 PASS와 모델·이미지/음악·게임 기능 전수 PASS를 분리한다.
          if (@($report.errors | Where-Object { [string]$_ -eq 'STUDIO_ASSET_AUDIT_FAILED' }).Count -gt 0) {
            $qaStage = 'STUDIO_GAME_RUNTIME'
            $qaSignature = 'STUDIO_ASSET_AUDIT_FAILED'
          } elseif (@($report.errors | Where-Object { [string]$_ -eq 'STUDIO_FEATURE_AUDIT_FAILED' }).Count -gt 0) {
            $qaStage = 'STUDIO_GAME_RUNTIME'
            $qaSignature = 'STUDIO_FEATURE_AUDIT_FAILED'
          } elseif (@($report.errors | Where-Object { [string]$_ -eq 'STUDIO_FULL_AUDIT_INCOMPLETE' }).Count -gt 0) {
            $qaStage = 'STUDIO_EXECUTION'
            $qaSignature = 'STUDIO_FULL_AUDIT_INCOMPLETE'
          }
          if ($report.assetAudit) {
            Write-Host ("STUDIO_MARE_ASSET_AUDIT_MODELS=" + [string]$report.assetAudit.models.status)
            Write-Host ("STUDIO_MARE_ASSET_AUDIT_MEDIA=" + [string]$report.assetAudit.registered.status)
            Write-Host ("STUDIO_MARE_FEATURE_AUDIT=" + [string]$report.assetAudit.features.status)
          }
          $runtimeRows = @($report.log | Where-Object {
            $_.ctx -in @('Client','Server') -and [string]$_.out -match 'LOGS\(([1-9][0-9]*)\):'
          } | Where-Object {
            # [환경 경고 제외] 로컬 Studio 는 게시된 유니버스 없이 열려 rbxassethash 로딩이 "Place universe not found"로 남는다.
            # 이 문구만으로 이뤄진 로그 묶음은 게임 오류가 아니다(이미지 로딩은 Client 전수 IsLoaded 검사가 따로 확정).
            $msgs = @(([string]$_.out -replace '^[^:]*LOGS\([0-9]+\):\s*','') -split ' // ' | Where-Object { $_.Trim() })
            # [서버 선로딩 정지] Client 전수 IsLoaded 검사가 이미지를 확정해 media 가 PASS 면, 서버 PreloadAsync 의 TIMEOUT_16S 기록도 제외한다.
            $mediaOk = ([string]$report.assetAudit.registered.status -eq 'PASS')
            $benign = @($msgs | Where-Object {
              $_ -match 'Place universe not found' -or
              ($mediaOk -and ($_ -match '^\[QA\] FAIL asset .* status=TIMEOUT_16S' -or $_ -match 'SERVER_PRELOAD_UNRESPONSIVE'))
            })
            -not ($msgs.Count -gt 0 -and $benign.Count -eq $msgs.Count)
          })
          # [자동 복구] 콘솔에서 확인한 게임 코드 오류를 기존 복구 마커로 넘긴다.
          $consoleErrors = @($report.consoleCapture.errors | Where-Object {
            $_.type -eq 'studio-console-error' -and -not [string]::IsNullOrWhiteSpace([string]$_.signature)
          })
          Write-Host "STUDIO_QA_CONSOLE_CAPTURED=$($report.consoleCapture.captured)"
          Write-Host "STUDIO_QA_CONSOLE_ERRORS=$($consoleErrors.Count)"
          $evidence = @($consoleErrors | ForEach-Object { [string]$_.signature })
          if (-not $qaStage) { $evidence += @($runtimeRows | ForEach-Object { [string]$_.out }) }
          $sourceFile = ''
          if ($evidence.Count -gt 0) {
            $prefix = "roblox-games/$($env:CAP_GAME)/"
            $paths = @($evidence | ForEach-Object {
              [regex]::Matches($_, [regex]::Escape($prefix) + '[A-Za-z0-9_./-]+\.luau:[0-9]+') |
                ForEach-Object { $_.Value -replace ':[0-9]+$','' }
            } | Sort-Object -Unique)
            # Studio 스택의 인스턴스 경로는 동일 프로젝트의 Rojo 소스맵으로만 변환한다.
            $scriptPaths = @($consoleErrors | ForEach-Object {
              [regex]::Matches([string]$_.signature, "(?:Script '([A-Za-z0-9_.-]+)', Line [0-9]+|(?<![A-Za-z0-9_./-])((?:Players|ReplicatedStorage|ServerScriptService|StarterPlayer)\.[A-Za-z0-9_.-]+):[0-9]+)") |
                ForEach-Object { if ($_.Groups[1].Success) { $_.Groups[1].Value } else { $_.Groups[2].Value } }
            } | ForEach-Object { $_ -replace '^Players\.[^.]+\.PlayerScripts\.', 'StarterPlayer.StarterPlayerScripts.' } | Sort-Object -Unique)
            if ($scriptPaths.Count -gt 0) {
              $rojo = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'rojo-bin') -Recurse -Filter rojo.exe | Select-Object -First 1 -ExpandProperty FullName
              if ($rojo) {
                $mapFile = Join-Path $env:RUNNER_TEMP 'studio-repair-sourcemap.json'
                $gameRoot = (Resolve-Path -LiteralPath ("main/" + $prefix)).Path
                Push-Location -LiteralPath $gameRoot
                try {
                  & $rojo sourcemap default.project.json --output $mapFile
                  if ($LASTEXITCODE -eq 0) {
                    $tree = Get-Content -LiteralPath $mapFile -Raw | ConvertFrom-Json
                    $nodes = [Collections.Generic.Queue[object]]::new()
                    foreach ($child in $tree.children) { $nodes.Enqueue(@{ node = $child; name = [string]$child.name }) }
                    while ($nodes.Count -gt 0) {
                      $entry = $nodes.Dequeue()
                      if ($scriptPaths -ccontains $entry.name) {
                        foreach ($file in $entry.node.filePaths) {
                          $relative = ([string]$file).Replace('\','/')
                          if ($relative -match '^[A-Za-z0-9_./-]+\.luau$' -and -not $relative.Contains('..')) {
                            $paths += $prefix + $relative
                          }
                        }
                      }
                      foreach ($child in $entry.node.children) {
                        $nodes.Enqueue(@{ node = $child; name = $entry.name + '.' + $child.name })
                      }
                    }
                  }
                } catch {
                  Write-Warning 'STUDIO_REPAIR_SOURCEMAP_UNAVAILABLE'
                } finally { Pop-Location }
              }
            }
            $paths = @($paths | Sort-Object -Unique)
            if ($paths.Count -eq 1 -and $scriptPaths.Count -le 1 -and $paths[0].Length -le 160 -and -not $paths[0].Contains('..') -and
                [string]$report.sourceRevision -eq $env:GITHUB_SHA -and (Test-Path -LiteralPath ("main/" + $paths[0]) -PathType Leaf)) {
              $qaStage = 'STUDIO_GAME_SOURCE'
              $qaSignature = 'STUDIO_OBSERVED_SOURCE_RUNTIME_ERROR'
              $sourceFile = $paths[0]
            } elseif (-not $qaStage) {
              $qaStage = 'STUDIO_GAME_RUNTIME'
              $qaSignature = 'STUDIO_OBSERVED_RUNTIME_WARNINGS'
            }
          }
          $frames = @(Get-ChildItem -Path $out -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in @('.png', '.jpg', '.jpeg') })
          if ($frames.Count -lt 1 -and -not $qaStage) {
            $qaStage = 'STUDIO_EXECUTION'
            $qaSignature = 'STUDIO_SCREENSHOTS_MISSING'
          }
          Write-Host "STUDIO_QA_FRAMES=$($frames.Count)"
          $dst = Join-Path $env:RUNNER_TEMP 'mare-publish'
          Remove-Item -Recurse -Force $dst -ErrorAction SilentlyContinue
          New-Item -ItemType Directory $dst | Out-Null
          Copy-Item "$out\*" $dst -Recurse
          Set-Location $dst
          git init -q
          git config user.name 'mare-capture-bot'
          git config user.email 'mare-capture-bot@users.noreply.github.com'
          git add -A
          git commit -q -m "studio frames $($env:CAP_GAME) run ${{ github.run_id }}"
          git push -f "https://x-access-token:$($env:GH_TOKEN)@github.com/${{ github.repository }}.git" HEAD:refs/heads/$($env:CAP_GAME)-studio-frames
          Write-Host "PUBLISHED=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { throw 'STUDIO_REPORT_PUBLISH_FAILED' }
          # 바이브 자동 점검(autopilot) 결과는 다른 Studio 실행이 덮어쓰지 못하게 별도 브랜치에도 보관한다(판단기가 읽는다).
          if ([string]$env:CAP_SCRIPT -match 'autopilot') {
            git push -f "https://x-access-token:$($env:GH_TOKEN)@github.com/${{ github.repository }}.git" HEAD:refs/heads/$($env:CAP_GAME)-autopilot-report
            Write-Host "AUTOPILOT_REPORT_PUBLISHED=$LASTEXITCODE"
          }
          if ($qaStage -ne '') {
            Write-Host "STUDIO_QA_GAME_ID=$($env:CAP_GAME)"
            Write-Host "STUDIO_QA_FAILURE_STAGE=$qaStage"
            Write-Host "STUDIO_QA_FAILURE_SIGNATURE=$qaSignature"
            if ($qaStage -eq 'STUDIO_GAME_SOURCE' -and $sourceFile) {
              Write-Host "STUDIO_QA_SOURCE_FILE=$sourceFile"
            }
            throw 'STUDIO_QA_FAILED_EVIDENCE_PUBLISHED'
          }
          Write-Host 'STUDIO_QA_RESULT=PASS'
