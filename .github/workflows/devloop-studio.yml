          # 중앙정책 전체 시각 파일 중 실제 수정한 파일만 검사한다. 외부 AI의 main 직접 반영은 금지.
          $designReport = Join-Path $out 'nemotron-design-review.json'
          if ($env:CAP_GAME -eq 'mare-essentia' -and (Test-Path -LiteralPath $designReport)) {
            $design = Get-Content -LiteralPath $designReport -Encoding UTF8 -Raw | ConvertFrom-Json
            if ([string]$design.status -eq 'CANDIDATE_EDITED') {
              Push-Location 'main'
              try {
                $designPolicy = (Get-Content -LiteralPath 'company-learning/external-ai-distillation-policy.json' -Encoding UTF8 -Raw | ConvertFrom-Json).directVisualDesign
                $allowlist = @($designPolicy.allowedSourceFiles)
                $expectedFiles = @($design.edits | ForEach-Object { [string]$_.path } | Sort-Object -Unique)
                $changedFiles = @(& git diff --name-only | Sort-Object -Unique)
                $expectedKey = [string]::Join('|', @($expectedFiles | Sort-Object))
                $changedKey = [string]::Join('|', @($changedFiles | Sort-Object))
                $invalidPaths = @($expectedFiles | Where-Object { $_ -notin $allowlist -or -not (Test-Path -LiteralPath $_ -PathType Leaf) })
                if ($expectedFiles.Count -eq 0 -or $expectedFiles.Count -gt [int]$designPolicy.maximumCandidateFilesPerRun -or
