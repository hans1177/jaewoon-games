# Mare Scientia: 오너 PC의 로그인된 Roblox Studio(기존 러너 라벨 roblox-studio-authenticated)로 마을을 직접 띄워 화면을 캡처한다.
# 기존 Studio MCP 도구(tools/company-development-roblox-studio-local-play.mjs, studio-script 모드)를 그대로 쓴다.
# 결과 사진·리포트는 브랜치 mare-studio-frames 에 올라간다 (다음 Claude 실행이 읽는다).
name: Devloop Studio Capture (Mare Scientia)
on:
  workflow_dispatch:
    inputs:
      script:
        description: Studio script JSON path in repo
        required: false
        default: roblox-games/mare-scientia/tools/devloop/studio-scripts/mare-town.json
        type: string
permissions:
  contents: write
concurrency:
  group: roblox-studio-shared-host
  cancel-in-progress: false
  queue: max
jobs:
  capture:
    if: github.repository == 'hans1177/jaewoon-games'
    runs-on: [self-hosted, Windows, X64, roblox-studio-authenticated]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Mare Scientia place with pinned Rojo
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $rojoZip = Join-Path $env:RUNNER_TEMP 'rojo.zip'
          $rojoDir = Join-Path $env:RUNNER_TEMP 'rojo-bin'
          Remove-Item -Recurse -Force $rojoDir -ErrorAction SilentlyContinue
          & curl.exe -fL --retry 3 -o $rojoZip 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip'
          $h = (Get-FileHash $rojoZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($h -ne '2179c44862a10ecbd725bdfeb4abc64e16dc4aad9b6c8f3e1a7c46a87280b949') { throw "rojo hash $h" }
          Expand-Archive $rojoZip -DestinationPath $rojoDir -Force
          $rojo = (Get-ChildItem $rojoDir -Recurse -Filter rojo.exe | Select-Object -First 1).FullName
          $place = Join-Path $env:RUNNER_TEMP 'marecheck.rbxl'
          Remove-Item $place -ErrorAction SilentlyContinue
          & $rojo build 'main/roblox-games/mare-scientia/default.project.json' -o $place
          if ($LASTEXITCODE -ne 0) { throw 'rojo build failed' }
          "MARE_PLACE=$place" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Launch Studio, run script, capture frames
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (@(Get-Process RobloxStudioBeta -ErrorAction SilentlyContinue).Count) { Get-Process RobloxStudioBeta -ErrorAction SilentlyContinue | Stop-Process -Force; Start-Sleep -Seconds 5 }
          $roots = @((Join-Path $env:LOCALAPPDATA 'Roblox\Versions'), (Join-Path ${env:ProgramFiles(x86)} 'Roblox\Versions'))
          $studio = $roots | Where-Object { Test-Path $_ } | ForEach-Object { Get-ChildItem $_ -Recurse -Filter RobloxStudioBeta.exe -ErrorAction SilentlyContinue } | Sort-Object LastWriteTime -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $studio) { throw 'RobloxStudioBeta.exe not found' }
          $mcp = Join-Path (Split-Path $studio -Parent) 'StudioMCP.exe'
          if (-not (Test-Path $mcp)) { $mcp = Join-Path $env:LOCALAPPDATA 'Roblox\mcp.bat' }
          if (-not (Test-Path $mcp)) { throw 'StudioMCP not found' }
          Write-Host "STUDIO=$studio MCP=$mcp"
          $proc = Start-Process -FilePath $studio -ArgumentList @($env:MARE_PLACE) -PassThru
          $out = Join-Path $env:RUNNER_TEMP 'mare-frames'
          Remove-Item -Recurse -Force $out -ErrorAction SilentlyContinue
          New-Item -ItemType Directory $out -Force | Out-Null
          try {
            & node 'main/tools/company-development-roblox-studio-local-play.mjs' --mode=studio-script "--script=main/${{ inputs.script }}" "--mcp-command=$mcp" '--studio-name=marecheck' "--out-dir=$out"
            Write-Host "NODE_EXIT=$LASTEXITCODE"
          } finally {
            Get-Process RobloxStudioBeta -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          if (-not (Test-Path $out)) { Write-Host 'NO_OUTPUT'; exit 0 }
          $dst = Join-Path $env:RUNNER_TEMP 'mare-publish'
          Remove-Item -Recurse -Force $dst -ErrorAction SilentlyContinue
          New-Item -ItemType Directory $dst | Out-Null
          Copy-Item "$out\*" $dst -Recurse
          Set-Location $dst
          git init -q
          git config user.name 'mare-capture-bot'
          git config user.email 'mare-capture-bot@users.noreply.github.com'
          git add -A
          git commit -q -m "mare studio frames run ${{ github.run_id }}"
          git push -f "https://x-access-token:$($env:GH_TOKEN)@github.com/${{ github.repository }}.git" HEAD:refs/heads/mare-studio-frames
          Write-Host "PUBLISHED=$LASTEXITCODE"
