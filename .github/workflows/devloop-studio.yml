          fs.writeFileSync(path.join(dst, 'README.md'), gallery.join('\n') + '\n');
          console.log('STUDIO_QA_CHECKS=' + JSON.stringify({result, steps: rows.length, audits}));
          console.log('STUDIO_SCREENSHOT_ARCHIVE=' + JSON.stringify({runId, kind, frames: frames.length,
            retained: kept.length, previous: previous?.runId || null}));
          '@
            $archive | & node - $dst $out $env:GITHUB_RUN_ID $env:CAP_SCRIPT $scriptFile $env:GITHUB_REPOSITORY $qaStage $qaSignature
