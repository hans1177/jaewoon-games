                        if ($LASTEXITCODE -ne 0) { Write-Host 'NEMOTRON_CANDIDATE=STUDIO_RECHECK_DISPATCH_UNVERIFIED' }
                        else { Write-Host 'NEMOTRON_CANDIDATE=STUDIO_RECHECK_DISPATCHED' }
