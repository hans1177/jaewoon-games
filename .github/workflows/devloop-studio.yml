                $changedKey = [string]::Join('|', @($changedFiles | Sort-Object))
                $invalidPaths = @($expectedFiles | Where-Object { $_ -notin $allowlist -or -not (Test-Path -LiteralPath $_ -PathType Leaf) })
                if ($expectedFiles.Count -eq 0 -or $expectedFiles.Count -gt [int]$designPolicy.maximumCandidateFilesPerRun -or
                    @($design.edits).Count -gt [int]$designPolicy.maximumSourceEditsPerRun -or
                    $invalidPaths.Count -gt 0 -or $expectedKey -ne $changedKey -or
