                  if ($LASTEXITCODE -ne 0) { throw 'NEMOTRON_REVIEWER_SYNTAX_FAILED' }
                  & node --test qa/mare-essentia-datastore-name.test.mjs
                  if ($LASTEXITCODE -ne 0) {
                    Write-Host 'NEMOTRON_CANDIDATE=BLOCKED_REGRESSION_FAILED'
                  } else {
                    # [정적 게임 검사] 동일 게임의 기존 Rojo 정의로 후보를 재빌드한다.
                    $rojo = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'rojo-bin') -Recurse -Filter rojo.exe |
                      Select-Object -First 1 -ExpandProperty FullName
                    $candidatePlace = Join-Path $env:RUNNER_TEMP 'mare-nemotron-candidate.rbxl'
                    & $rojo build 'roblox-games/mare-essentia/default.project.json' -o $candidatePlace
                    $buildExit = [int]$LASTEXITCODE
                    Remove-Item -LiteralPath $candidatePlace -ErrorAction SilentlyContinue
                    if ($buildExit -ne 0) {
                      Write-Host 'NEMOTRON_CANDIDATE=BLOCKED_ROJO_BUILD_FAILED'
                    } else {
