            else if (/^runs\/[0-9]+$/.test(row.path || ''))
              fs.rmSync(path.join(dst, row.path), {recursive: true, force: true});
          }
          fs.writeFileSync(indexFile, JSON.stringify({version: 1, retentionDays: 7, latest: record,
            lastDeepAt: kept.find(row => row.kind === 'deep')?.at || null, runs: kept}, null, 2) + '\n');
          const gallery = ['# Studio QA screenshot history', '', 'Latest: [screenshots](./) | [checklist](checks.json) | [history](index.json)', 'Retention: 7 days, full 4 runs and others 6 runs', '',
            '| Run | Type | Status | Frames | Changed files |', '|---|---|---|---:|---:|',
            ...kept.map(row => '| [' + row.runId + '](runs/' + row.runId + '/) | ' + row.kind + ' | ' + row.result + ' | ' + row.frames + ' | ' + row.changedFrames + ' |')];
          fs.writeFileSync(path.join(dst, 'README.md'), gallery.join('\n') + '\n');
          console.log('STUDIO_QA_CHECKS=' + JSON.stringify({result, steps: rows.length, audits}));
          console.log('STUDIO_SCREENSHOT_ARCHIVE=' + JSON.stringify({runId, kind, frames: frames.length,
            retained: kept.length, previous: previous?.runId || null}));
          '@
            $archive | & node - $dst $out $env:GITHUB_RUN_ID $env:CAP_SCRIPT $scriptFile $env:GITHUB_REPOSITORY $qaStage $qaSignature
            if ($LASTEXITCODE -ne 0) { throw 'STUDIO_ARCHIVE_REPORT_FAILED' }
            $storedChecks = Get-Content -LiteralPath (Join-Path $dst 'checks.json') -Encoding UTF8 -Raw | ConvertFrom-Json
            Write-Host ("STUDIO_SCREENSHOT_REAL_IMAGES=" + [string]$storedChecks.screenshotFrameAudit.checked + " INVALID=" + [string]$storedChecks.screenshotFrameAudit.invalid)
            if ([int]$storedChecks.screenshotFrameAudit.invalid -gt 0 -and -not $qaStage) {
              $qaStage = 'STUDIO_EXECUTION'
              $qaSignature = 'STUDIO_SCREENSHOT_INVALID_IMAGE'
