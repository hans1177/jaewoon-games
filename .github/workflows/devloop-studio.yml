                          $matched = $runs | Where-Object {
                            $_.headSha -eq $env:STUDIO_SOURCE_SHA -and
                            [DateTimeOffset]::Parse([string]$_.createdAt).UtcDateTime -ge $checksStart
                          } | Sort-Object createdAt -Descending | Select-Object -First 1
                          if ($matched) { break }
                          Start-Sleep -Seconds 4
                        }
                        if (-not $matched) { throw ('DESIGN_SECURITY_RUN_NOT_FOUND:' + $workflowName) }
                        & gh run watch $matched.databaseId --repo $env:GITHUB_REPOSITORY --exit-status
                        if ($LASTEXITCODE -ne 0) { throw ('DESIGN_SECURITY_QA_FAILED:' + $workflowName) }
                      }
                      # [병합 권한] 체크아웃·PR·중앙 main이 정확히 동일한 F0 전 기준선일 때만 병합.
                      $prJson = & gh pr view $env:STUDIO_CANDIDATE_REF --repo $env:GITHUB_REPOSITORY --json headRefOid,baseRefOid,state
                      if ($LASTEXITCODE -ne 0) { throw 'DESIGN_PR_READ_FAILED' }
                      $pr = $prJson | ConvertFrom-Json
                      $mainSha = & gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha'
                      if ($LASTEXITCODE -ne 0 -or [string]$pr.state -ne 'OPEN' -or
                          [string]$pr.headRefOid -ne [string]$env:STUDIO_SOURCE_SHA -or
                          [string]$pr.baseRefOid -ne [string]$env:STUDIO_BASE_SHA -or
                          ([string]$mainSha).Trim() -ne [string]$env:STUDIO_BASE_SHA) {
                        throw 'DESIGN_AUTO_MERGE_STALE_BASE_OR_HEAD'
                      }
                      & gh pr merge $env:STUDIO_CANDIDATE_REF --repo $env:GITHUB_REPOSITORY --merge
                      if ($LASTEXITCODE -ne 0) { throw 'DESIGN_AUTO_MERGE_FAILED' }
                      Write-Host 'DESIGN_AUTO_MERGE=MERGED_AFTER_STUDIO_VISUAL_SECURITY_QA'
                      # Actions 토큰으로 병합하면 main push가 하위 작업을 깨우지 못할 수 있어 기존 source sync를 명시 호출한다.
                      & gh workflow run company-roblox-source-drift-sync.yml --repo $env:GITHUB_REPOSITORY --ref main -f game_id=mare-essentia -f restart_from_f0=true
                      if ($LASTEXITCODE -ne 0) { throw 'DESIGN_F0_SYNC_DISPATCH_UNVERIFIED' }
                      Write-Host 'DESIGN_F0_F9_HANDOFF=DISPATCHED_EXISTING_CANONICAL_WORKFLOW'
                    } finally { Pop-Location }
                  }
                }
              }
            }
          }
          # [자동 판단] 별도 autopilot-report 브랜치는 기존처럼 최신 1회만 유지한다.
          if ([string]$env:CAP_SCRIPT -match 'autopilot') {
            $autoDst = Join-Path $env:RUNNER_TEMP 'mare-autopilot-publish'
            Remove-Item -Recurse -Force $autoDst -ErrorAction SilentlyContinue
            New-Item -ItemType Directory $autoDst | Out-Null
            Get-ChildItem -LiteralPath $out -File | Where-Object { $_.Extension.ToLowerInvariant() -notin @('.png','.jpg','.jpeg') } | Copy-Item -Destination $autoDst
            Push-Location $autoDst
            try {
              git init -q
              git config user.name 'mare-capture-bot'
              git config user.email 'mare-capture-bot@users.noreply.github.com'
              git add -A
              git commit -q -m "autopilot report $($env:CAP_GAME) run $env:GITHUB_RUN_ID"
              if ($LASTEXITCODE -ne 0) { throw 'AUTOPILOT_REPORT_COMMIT_FAILED' }
              & git push -q -f $remote "HEAD:refs/heads/$($env:CAP_GAME)-autopilot-report"
              if ($LASTEXITCODE -ne 0) { throw 'AUTOPILOT_REPORT_PUBLISH_FAILED' }
              Write-Host 'AUTOPILOT_REPORT_PUBLISHED=1'
            } finally {
              Pop-Location
            }
          }
          if ($qaStage -ne '') {
            Write-Host "STUDIO_QA_GAME_ID=$($env:CAP_GAME)"
            Write-Host "STUDIO_QA_FAILURE_STAGE=$qaStage"
            Write-Host "STUDIO_QA_FAILURE_SIGNATURE=$qaSignature"
            if ($qaStage -eq 'STUDIO_GAME_SOURCE' -and $sourceFile) {
              Write-Host "STUDIO_QA_SOURCE_FILE=$sourceFile"
            }
            throw 'STUDIO_QA_FAILED_EVIDENCE_PUBLISHED'
          }
          Write-Host 'STUDIO_QA_RESULT=PASS'
          # [종료 코드] 모든 관문 통과 후에도 앞선 보조 명령(git 등)의 $LASTEXITCODE가 남아 단계가 실패로 끝나던 문제
          # (실행 44900555159·44901499291: STUDIO_QA_RESULT=PASS 직후 exit code 1). 실패 판정은 위 throw만 사용한다.
          exit 0

      - name: Upload actual Studio screenshots for one day
        id: studio_photo_artifact
        if: ${{ !cancelled() && env.STUDIO_CAPTURE_ATTEMPTED == 'YES' }}
        uses: actions/upload-artifact@v4
        with:
          name: studio-frames-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mare-frames/*.jpg
            ${{ runner.temp }}/mare-frames/*.jpeg
            ${{ runner.temp }}/mare-frames/*.png
            ${{ runner.temp }}/mare-frames/checks.json
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          overwrite: true
      - name: Clean local Studio screenshots after upload
        if: ${{ !cancelled() && steps.studio_photo_artifact.outcome == 'success' }}
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          # [검사 디스크 자동 정리] 스크린샷·임시 Git 아카이브는 1일 결과물 업로드 성공 뒤에만 로컬에서 지운다.
          # [MYBOX 정책] QA 스크린샷을 N:에 복사하지 않는다. 게임 코드·승인 자산·러너 등록정보도 이동하지 않는다.
          $cleanRoot = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')
          $expectedCleanRoot = [IO.Path]::GetFullPath('E:\JaewoonRobloxStudioRunner\_work\_temp').TrimEnd('\')
          if (-not [string]::Equals($cleanRoot, $expectedCleanRoot, [StringComparison]::OrdinalIgnoreCase)) {
            Write-Warning 'STUDIO_LOCAL_EVIDENCE_CLEAN_SKIP=UNEXPECTED_TEMP_PATH'
          } else {
            $localCleanCount = 0
            $localCleanBytes = [long]0
            foreach ($name in @('mare-frames','mare-first-attempt','mare-publish','mare-autopilot-publish','mare-baseline-photos')) {
              $folder = Join-Path $cleanRoot $name
              if (-not (Test-Path -LiteralPath $folder -PathType Container)) { continue }
              $item = Get-Item -LiteralPath $folder -Force -ErrorAction SilentlyContinue
              if (-not $item -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
                Write-Warning "STUDIO_LOCAL_EVIDENCE_CLEAN_SKIP=REPARSE_POINT:$name"
                continue
              }
              try {
                $bytes = (Get-ChildItem -LiteralPath $folder -Recurse -File -Force -ErrorAction Stop |
                  Measure-Object Length -Sum).Sum
                Remove-Item -LiteralPath $folder -Recurse -Force -ErrorAction Stop
                $localCleanBytes += [long]$bytes
                $localCleanCount++
              } catch {
                Write-Warning "STUDIO_LOCAL_EVIDENCE_CLEAN_FAILED=$name"
              }
            }
            Write-Host "STUDIO_LOCAL_EVIDENCE_CLEANED_FOLDERS=$localCleanCount"
            Write-Host "STUDIO_LOCAL_EVIDENCE_CLEANED_MB=$([math]::Round($localCleanBytes/1MB,2))"
            Write-Host "STUDIO_E_DRIVE_FREE_MB_AFTER_ARCHIVE=$([math]::Round(([IO.DriveInfo]::new('E:\')).AvailableFreeSpace/1MB,2))"
          }
      - name: Continue exact-revision world survey
        if: ${{ success() && steps.studio_photo_artifact.outcome == 'success' && inputs.port_chain && inputs.port_batch != '0' }}
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $batch = [int]$env:STUDIO_PORT_BATCH
          if ($batch -lt 1 -or $batch -gt 327) { throw 'STUDIO_PORT_BATCH_INVALID' }
          if ($batch -eq 327) { Write-Host 'STUDIO_WORLD_SURVEY_LAST_BATCH_FINISHED=327'; exit 0 }
          $mainSha = (& gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha').Trim()
          if ($LASTEXITCODE -ne 0 -or $mainSha -ne $env:STUDIO_PORT_REVISION) { throw 'STUDIO_PORT_SURVEY_MAIN_CHANGED_RESTART_REQUIRED' }
          & gh workflow run devloop-studio.yml --repo $env:GITHUB_REPOSITORY --ref main -f game=mare-essentia -f "port_batch=$($batch + 1)" -f port_chain=true -f "port_revision=$mainSha"
          if ($LASTEXITCODE -ne 0) { throw 'STUDIO_PORT_SURVEY_NEXT_DISPATCH_FAILED' }
          Write-Host "STUDIO_PORT_SURVEY_NEXT_BATCH=$($batch + 1)"
      - name: Backup registered 3D assets to MYBOX
        # [백업 전용] 무료 네이버 MYBOX N:이 연결된 경우에만 기존 등록 원본을 증분 복사한다.
        # [게임 보호] QA 스크린샷, .git, 게임 저장 파일, 미검증 바이너리, 러너 등록정보는 백업하지 않는다.
        # [승인 분리] 원본 해시/사용권한 확인은 백업 자격일 뿐 실제 게임 품질 승인 또는 출시 PASS가 아니다.
        if: ${{ !cancelled() }}
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          # [러너 자체 진단] Claude 앱 연결 없이 현재 GitHub Actions 러너 계정·세션·정확한 실행기 개수를 확인한다.
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $session = (Get-Process -Id $PID).SessionId
          Write-Host "MYBOX_RUNNER_ACCOUNT=$($identity.Name)"
          Write-Host "MYBOX_RUNNER_SESSION=$session"
          $listenerPath = [IO.Path]::GetFullPath('E:\JaewoonRobloxStudioRunner\bin\Runner.Listener.exe')
          $listeners = @(Get-CimInstance Win32_Process -Filter "Name='Runner.Listener.exe'" -ErrorAction SilentlyContinue |
            Where-Object { $_.ExecutablePath -and [string]::Equals([IO.Path]::GetFullPath($_.ExecutablePath),$listenerPath,[StringComparison]::OrdinalIgnoreCase) })
          Write-Host "MYBOX_RUNNER_LISTENER_COUNT=$($listeners.Count)"
          # [중복 러너 진단] 경로와 무관하게 PC 전체의 Runner.Listener/Worker 개수·경로를 기록한다(종료하지 않음).
          foreach ($procName in @('Runner.Listener.exe','Runner.Worker.exe')) {
            $all = @(Get-CimInstance Win32_Process -Filter "Name='$procName'" -ErrorAction SilentlyContinue)
            Write-Host "MYBOX_PROCESS_COUNT=${procName}:$($all.Count)"
            foreach ($proc in $all) { Write-Host "MYBOX_PROCESS_PATH=${procName}:$($proc.ProcessId):$($proc.ExecutablePath)" }
          }
          if (@($listeners).Count -gt 1) { Write-Warning 'MYBOX_RUNNER_DUPLICATE_LISTENER=DETECTED' }
          # [로그인 세션] 대화형 사용자(explorer.exe 소유자)와 러너 계정을 비교한다. MYBOX N:은 로그인 사용자 세션에 붙는다.
          $interactive = @()
          foreach ($ex in @(Get-CimInstance Win32_Process -Filter "Name='explorer.exe'" -ErrorAction SilentlyContinue)) {
            try {
              $o = Invoke-CimMethod -InputObject $ex -MethodName GetOwner -ErrorAction Stop
              if ($o.ReturnValue -eq 0) { $interactive += "$($o.Domain)\$($o.User)@session$($ex.SessionId)" }
            } catch {}
          }
          $interactive = @($interactive | Sort-Object -Unique)
          Write-Host "MYBOX_INTERACTIVE_USERS=$(if ($interactive.Count) { $interactive -join ',' } else { 'NONE' })"
          $sameUser = @($interactive | Where-Object { $_ -like "$($identity.Name)@*" }).Count -gt 0
          Write-Host "MYBOX_INTERACTIVE_MATCHES_RUNNER=$sameUser"
          # [실행 계정 대조] 실제 Runner.Listener 소유자와 현재 QA 작업 계정을 비교한다.
          foreach ($listener in $listeners) {
            try {
              $owner = Invoke-CimMethod -InputObject $listener -MethodName GetOwner -ErrorAction Stop
              if ($owner.ReturnValue -eq 0) {
                $listenerAccount = "$($owner.Domain)\$($owner.User)"
                Write-Host "MYBOX_LISTENER_ACCOUNT=$listenerAccount"
                Write-Host "MYBOX_LISTENER_ACCOUNT_MATCHES_JOB=$([string]::Equals($identity.Name,$listenerAccount,[StringComparison]::OrdinalIgnoreCase))"
              } else {
                Write-Warning "MYBOX_LISTENER_ACCOUNT=UNVERIFIED_RETURN_$($owner.ReturnValue)"
              }
            } catch {
              Write-Warning 'MYBOX_LISTENER_ACCOUNT=UNVERIFIED_OWNER_QUERY'
            }
          }
          $repo = Join-Path $env:GITHUB_WORKSPACE 'main'
          $registryFile = Join-Path $repo 'roblox-games\mare-essentia\assets-registered.json'
          if (-not (Test-Path -LiteralPath $registryFile -PathType Leaf)) {
            Write-Host 'MYBOX_BACKUP=SKIPPED_SOURCE_CHECKOUT_MISSING'
            return
          }
          if (-not (Test-Path -LiteralPath 'N:\' -PathType Container)) {
            Write-Host 'MYBOX_BACKUP=SKIPPED_DRIVE_OFFLINE'
            return
          }
          # [무료 저장 공간] 네이버 가상 드라이브가 없거나 로컬 캐시 디스크가 부족하면 복사하지 않는다.
          $systemDrive = [IO.DriveInfo]::new('C:\')
          if ($systemDrive.AvailableFreeSpace -lt 1GB) {
            Write-Host 'MYBOX_BACKUP=SKIPPED_SYSTEM_CACHE_SPACE_LOW'
            return
          }
          # [MYBOX 개인 폴더] 네이버 MYBOX는 N:\ 최상위(개인·공유·즐겨찾기·휴지통)에 새 폴더를 만들 수 없다(실행 44889808617 진단).
          # 오너 승인(2026-11-21)으로 기존 개인 저장 공간 아래에 둔다. PowerShell 5 스크립트 인코딩 안전을 위해 '개인'은 문자 코드로 만든다.
          $personalRoot = Join-Path 'N:\' (-join ([char]0xAC1C, [char]0xC778))
          $parentRoot = Join-Path $personalRoot 'Jaewoon3D'
          $destinationRoot = Join-Path $parentRoot 'mare-essentia'
          Write-Host "MYBOX_PERSONAL_EXISTS=$(Test-Path -LiteralPath $personalRoot -PathType Container)"
          # [N: 드라이브 진단] 드라이브 종류·형식·여유·최상위 폴더 이름만 읽는다(최상위에는 쓰지 않음).
          try {
            $nDrive = [IO.DriveInfo]::new('N:\')
            Write-Host "MYBOX_DRIVE=type=$($nDrive.DriveType) format=$($nDrive.DriveFormat) ready=$($nDrive.IsReady) freeMB=$([math]::Round($nDrive.AvailableFreeSpace/1MB))"
          } catch { Write-Warning "MYBOX_DRIVE=UNREADABLE:$($_.Exception.GetType().Name)" }
          try {
            $top = @(Get-ChildItem -LiteralPath 'N:\' -Directory -Force -ErrorAction Stop | Select-Object -First 20 -ExpandProperty Name)
            Write-Host "MYBOX_TOP_FOLDERS=$($top -join '|')"
          } catch { Write-Warning "MYBOX_TOP_FOLDERS=UNREADABLE:$($_.Exception.GetType().Name)" }
          # [MYBOX 경로 진단] 루트 생성 제한과 러너 계정 쓰기 권한을 분리해서 확인한다.
          Write-Host "MYBOX_PARENT_EXISTS=$(Test-Path -LiteralPath $parentRoot -PathType Container)"
          Write-Host "MYBOX_TARGET_EXISTS=$(Test-Path -LiteralPath $destinationRoot -PathType Container)"
          $copied = 0
          $existing = 0
          $skipped = 0
          $failed = 0
          $copiedBytes = [long]0
          $maxBytes = 256MB
          $maxFileBytes = 128MB
          $maxFiles = 32
          $deadline = (Get-Date).AddSeconds(100)
          try {
            $registry = Get-Content -LiteralPath $registryFile -Raw -Encoding UTF8 | ConvertFrom-Json
            if (-not $registry.assets) { throw 'MYBOX_REGISTRY_ASSETS_MISSING' }
            # [반복 실패 자동 중단] 같은 권한 실패가 3회 연속이면 24시간 동안 쓰기 시도를 멈추고 진단만 남긴다.
            $stateDir = 'E:\JaewoonRobloxStudioRunner\_work\_mybox'
            $stateFile = Join-Path $stateDir 'state.json'
            $state = $null
            try { if (Test-Path -LiteralPath $stateFile) { $state = Get-Content -LiteralPath $stateFile -Raw | ConvertFrom-Json } } catch { $state = $null }
            if ($state -and [int]$state.streak -ge 3 -and ([datetime]$state.lastFailure).AddHours(24) -gt (Get-Date)) {
              Write-Warning "MYBOX_BACKUP=PAUSED_REPEATED_FAILURE:$($state.signature):streak=$($state.streak)"
              throw 'MYBOX_PAUSED_REPEATED_FAILURE'
            }
            $op = 'NONE'
            try {
              # [기존 대상 보존] 새 저장소를 만들거나 우회 위치를 쓰지 않고 기존 MYBOX 보관 경로만 검사한다.
              # [자동복구] 개인 폴더 아래에 Jaewoon3D\mare-essentia를 만든다. 개인 폴더 자체가 없으면 원인을 기록한다.
              if (-not (Test-Path -LiteralPath $personalRoot -PathType Container)) { $op = 'PERSONAL_FOLDER_MISSING' }
              elseif (-not (Test-Path -LiteralPath $parentRoot -PathType Container)) { $op = 'CREATE_PARENT_Jaewoon3D' }
              elseif (-not (Test-Path -LiteralPath $destinationRoot -PathType Container)) { $op = 'CREATE_TARGET' }
              else { $op = 'WRITE_FILE' }
              New-Item -ItemType Directory -Path $destinationRoot -Force -ErrorAction Stop | Out-Null
              $op = 'WRITE_FILE'
              # [MYBOX 파일명] 점(.)으로 시작하는 숨김 이름은 MYBOX가 거부한다(실행 44892653018). 일반 .txt 이름을 쓴다.
              $probePath = Join-Path $destinationRoot ('vibe-write-probe-' + $env:GITHUB_RUN_ID + '.txt')
              if (Test-Path -LiteralPath $probePath) { throw 'MYBOX_PROBE_NAME_COLLISION' }
              try {
                # 가상 드라이브가 새 폴더를 늦게 반영할 수 있어 최대 3번(2초 간격)만 다시 쓴다.
                for ($try = 1; $try -le 3; $try++) {
                  try { [IO.File]::WriteAllText($probePath, 'VIBE_MYBOX_WRITE_CHECK'); break }
                  catch { if ($try -eq 3) { throw }; Start-Sleep -Seconds 2 }
                }
                if (-not (Test-Path -LiteralPath $probePath -PathType Leaf)) { throw 'MYBOX_WRITE_PROBE_NOT_VISIBLE' }
                Write-Host 'MYBOX_WRITE_PROBE=PASS'
                Remove-Item -LiteralPath $stateFile -Force -ErrorAction SilentlyContinue
              } finally {
                if (Test-Path -LiteralPath $probePath -PathType Leaf) {
                  Remove-Item -LiteralPath $probePath -Force -ErrorAction SilentlyContinue
                }
              }
            } catch {
              $failure = if (-not (Test-Path -LiteralPath $parentRoot -PathType Container)) {
                'MYBOX_ROOT_PARENT_CREATE_BLOCKED'
              } else { 'MYBOX_TARGET_WRITE_DENIED' }
              Write-Warning "MYBOX_WRITE_PROBE=FAIL:${failure}:$($_.Exception.GetType().Name)"
              Write-Warning "MYBOX_FAILED_OPERATION=$op"
              Write-Warning "MYBOX_FAILED_MESSAGE=$($_.Exception.Message)"
              if (-not $sameUser) { Write-Warning 'MYBOX_CAUSE_HINT=RUNNER_ACCOUNT_DIFFERS_FROM_LOGGED_IN_USER' }
              elseif ($op -like 'CREATE_PARENT*') { Write-Warning 'MYBOX_CAUSE_HINT=MYBOX_ROOT_FOLDER_CREATE_BLOCKED_USE_EXISTING_FOLDER' }
              else { Write-Warning 'MYBOX_CAUSE_HINT=TARGET_FOLDER_PERMISSION_DENIED' }
              try {
                New-Item -ItemType Directory -Path $stateDir -Force | Out-Null
                $sig = "${failure}:$op"
                $streak = if ($state -and $state.signature -eq $sig) { [int]$state.streak + 1 } else { 1 }
                @{ signature = $sig; streak = $streak; lastFailure = (Get-Date).ToString('o'); account = $identity.Name } | ConvertTo-Json | Set-Content -LiteralPath $stateFile -Encoding UTF8
                Write-Host "MYBOX_FAILURE_STREAK=$streak"
              } catch {}
              throw
            }
            # [라이선스 추적] 원본 파일과 사용권한·출처·해시 메타데이터를 함께 보관한다.
            Copy-Item -LiteralPath $registryFile -Destination (Join-Path $destinationRoot 'assets-registered.json') -Force -ErrorAction Stop
            $sourcesFile = Join-Path $repo 'roblox-games\mare-essentia\assets\SOURCES.md'
            if (Test-Path -LiteralPath $sourcesFile -PathType Leaf) {
              Copy-Item -LiteralPath $sourcesFile -Destination (Join-Path $destinationRoot 'SOURCES.md') -Force -ErrorAction Stop
            }
            $prefix = 'roblox-games/mare-essentia/assets/'
            foreach ($property in @($registry.assets.PSObject.Properties | Sort-Object Name)) {
              if ($copied -ge $maxFiles -or $copiedBytes -ge $maxBytes -or (Get-Date) -gt $deadline) { break }
              $entry = $property.Value
              $relative = [string]$entry.source
              $expected = ([string]$entry.sourceSha256).ToLowerInvariant()
              if ($entry.usePermissionGranted -ne $true -or
                  [string]$entry.assetType -ne 'Model' -or
                  [string]$entry.license -notin @('CC0-1.0','PROJECT_ORIGINAL_ART','PUBLIC-DOMAIN','CC-BY-3.0','CC-BY-4.0') -or
                  $expected -notmatch '^[0-9a-f]{64}$' -or
                  $relative -notmatch '^roblox-games/mare-essentia/assets/(?:[A-Za-z0-9_-]+/)*[A-Za-z0-9_-]+\.(?:glb|fbx|blend)$') {
                continue
              }
              $sourceFile = Join-Path $repo ($relative.Replace('/','\'))
              if (-not (Test-Path -LiteralPath $sourceFile -PathType Leaf)) { $skipped++; continue }
              $file = Get-Item -LiteralPath $sourceFile -Force -ErrorAction Stop
              if (($file.Attributes -band [IO.FileAttributes]::ReparsePoint) -or
                  $file.Length -le 0 -or $file.Length -gt $maxFileBytes -or
                  ($copiedBytes + $file.Length) -gt $maxBytes) {
                $skipped++
                continue
              }
              try {
                $actual = (Get-FileHash -LiteralPath $sourceFile -Algorithm SHA256 -ErrorAction Stop).Hash.ToLowerInvariant()
                if ($actual -ne $expected) { Write-Warning "MYBOX_BACKUP_SOURCE_HASH_MISMATCH=$($file.Name)"; $failed++; $skipped++; continue }
                $subpath = $relative.Substring($prefix.Length).Replace('/','\')
                $parent = Split-Path -Path $subpath -Parent
                $folder = if ($parent) { Join-Path $destinationRoot $parent } else { $destinationRoot }
                $name = [IO.Path]::GetFileNameWithoutExtension($subpath) + '-' + $expected.Substring(0,12) + [IO.Path]::GetExtension($subpath)
                $target = Join-Path $folder $name
                if (Test-Path -LiteralPath $target -PathType Leaf) {
                  $saved = (Get-FileHash -LiteralPath $target -Algorithm SHA256 -ErrorAction Stop).Hash.ToLowerInvariant()
                  if ($saved -ne $expected) { Write-Warning "MYBOX_BACKUP_EXISTING_HASH_MISMATCH=$name"; $failed++; $skipped++ }
                  else { $existing++ }
                  continue
                }
                New-Item -ItemType Directory -Path $folder -Force | Out-Null
                # [중단 안전] 임시 이름으로 복사해 해시를 확인한 뒤에만 정식 이름으로 바꾼다.
                $upload = $target + '.upload-' + $env:GITHUB_RUN_ID
                if (Test-Path -LiteralPath $upload) { Write-Warning "MYBOX_BACKUP_PENDING_FILE=$name"; $skipped++; continue }
                try {
                  Copy-Item -LiteralPath $sourceFile -Destination $upload -ErrorAction Stop
                  $uploaded = (Get-FileHash -LiteralPath $upload -Algorithm SHA256 -ErrorAction Stop).Hash.ToLowerInvariant()
                  if ($uploaded -ne $expected) { throw 'MYBOX_BACKUP_TRANSFER_HASH_MISMATCH' }
                  Move-Item -LiteralPath $upload -Destination $target -ErrorAction Stop
                  $copied++
                  $copiedBytes += [long]$file.Length
                } catch {
                  Remove-Item -LiteralPath $upload -Force -ErrorAction SilentlyContinue
                  throw
                }
              } catch {
                $failed++
                $skipped++
                Write-Warning "MYBOX_BACKUP_ITEM_FAILED=$($file.Name):$($_.Exception.GetType().Name)"
              }
            }
            # N: 가상 드라이브의 파일 해시 확인은 서버 업로드 완료 인증과는 별개다.
            if ($failed -gt 0) { Write-Warning 'MYBOX_BACKUP=PARTIAL_LOCAL_HASH_VERIFIED_CLOUD_UNVERIFIED' }
            elseif ($copied -gt 0) { Write-Host 'MYBOX_BACKUP=LOCAL_HASH_VERIFIED_CLOUD_UNVERIFIED' }
            elseif ($existing -gt 0) { Write-Host 'MYBOX_BACKUP=EXISTING_LOCAL_HASH_VERIFIED_CLOUD_UNVERIFIED' }
            else { Write-Host 'MYBOX_BACKUP=SKIPPED_NO_ELIGIBLE_LOCAL_MODELS' }
          } catch {
            # [독립 보호] N: 접속 불안정이 Roblox Studio QA 결과를 가리지 않게 한다.
            Write-Warning "MYBOX_BACKUP=UNVERIFIED:$($_.Exception.GetType().Name)"
          }
          Write-Host "MYBOX_BACKUP_COPIED=$copied EXISTING=$existing SKIPPED=$skipped FAILED=$failed MB=$([math]::Round($copiedBytes/1MB,2))"
          if ($env:GITHUB_STEP_SUMMARY) {
            @("### MYBOX 자체 진단", "- 러너 계정: $($identity.Name) (세션 $session)", "- 로그인 사용자: $(if ($interactive.Count) { $interactive -join ', ' } else { '없음' })",
              "- Runner.Listener(E:): $($listeners.Count)", "- 복사 $copied / 기존 $existing / 실패 $failed") | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
          }
