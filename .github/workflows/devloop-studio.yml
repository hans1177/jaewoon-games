# 공통(게임 id 입력): 오너 PC의 로그인된 Roblox Studio(기존 러너 라벨 roblox-studio-authenticated)로 마을을 직접 띄워 화면을 캡처한다.
# 기존 Studio MCP 도구(tools/company-development-roblox-studio-local-play.mjs, studio-script 모드)를 그대로 쓴다.
# 사진은 1일 만료 Actions 결과물에만 보관한다. 기존 <game>-studio-frames 브랜치는 검사 보고서와 사진 해시만 유지한다.
name: Devloop Studio Capture
run-name: Devloop Studio Capture · ${{ inputs.game || 'mare-essentia' }} · ${{ inputs.candidate_ref || github.sha }}
on:
  # push 트리거는 뺐다: 병합마다 Studio가 줄을 서서 서로 취소되던 문제. 점검은 vibe-autopilot(주기 실행)과 수동 실행이 맡는다.
  workflow_dispatch:
    inputs:
      game:
        description: 게임 폴더 이름 (roblox-games/<game>)
        required: false
        default: mare-essentia
        type: string
      candidate_ref:
        description: 격리 디자인 PR 동일 Studio 재검증 (main 변경 없음)
        required: false
        default: ''
        type: string
      script:
        description: Studio script JSON path in repo (비우면 게임의 tools/devloop/studio-scripts/default.json, 없으면 opening-capture)
        required: false
        default: ''
        type: string
      port_batch:
        description: 전수 촬영 (0=기존 검사, 1~19 항구, 20~79 탐험, 80~106 해역, 107~146 기능, 147~327 항구 변형)
        required: false
        default: '0'
        type: string
      port_chain:
        description: 촬영 성공 후 다음 회차 자동 연결
        required: false
        default: true
        type: boolean
      port_revision:
        description: 전수 촬영의 시작 main SHA (후속 회차용)
        required: false
        default: ''
        type: string
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: roblox-studio-shared-host
  cancel-in-progress: false
  queue: max
jobs:
  capture:
    if: github.repository == 'hans1177/jaewoon-games' && (github.event_name == 'push' || inputs.game == 'mare-essentia')
    runs-on: [self-hosted, Windows, X64, roblox-studio-authenticated]
    timeout-minutes: 50
    steps:
      - name: Free runner E drive space
        # [E: 실행기 보존] 등록정보·실행기·게임 원본·현재 작업은 건드리지 않는다.
        # [지난 작업 정리] 6시간이 지난 QA 캡처·임시 빌드만 정리하고 실제 삭제 성공 용량을 기록한다.
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $runnerRoot = [IO.Path]::GetFullPath('E:\JaewoonRobloxStudioRunner').TrimEnd('\')
          $work = Join-Path $runnerRoot '_work'
          $temp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')
          $expectedTemp = Join-Path $work '_temp'
          if (-not [string]::Equals($temp, $expectedTemp, [StringComparison]::OrdinalIgnoreCase)) {
            Write-Warning 'RUNNER_DISK_CLEAN_SKIP=UNEXPECTED_TEMP_PATH'
            return
          }
          if (-not (Test-Path -LiteralPath $temp -PathType Container)) {
            Write-Warning 'RUNNER_DISK_CLEAN_SKIP=TEMP_MISSING'
            return
          }
          $volume = [IO.DriveInfo]::new('E:\')
          $before = $volume.AvailableFreeSpace
          Write-Host "RUNNER_DISK_FREE_MB_BEFORE=$([math]::Round($before/1MB))"
          $cut = (Get-Date).AddHours(-6)
          # [원본 보호] 기존 체크아웃의 .git이 포함된 폴더는 전체 보존한다.
          $repos = @(Get-ChildItem -LiteralPath $work -Directory -Recurse -Depth 4 -Force -Filter '.git' -ErrorAction SilentlyContinue |
            ForEach-Object { $_.Parent.FullName.TrimEnd('\') + '\' })
          $removed = 0
          $freed = [long]0
          $failed = 0
          $tempPrefix = $temp + '\'
          $workPrefix = $work.TrimEnd('\') + '\'
          # [개별 파일 검사] 폴더의 수정일만 오래됐다는 이유로 새 촬영본을 지우지 않는다.
          $files = @(Get-ChildItem -LiteralPath $work -Recurse -File -Force -ErrorAction SilentlyContinue |
            Where-Object {
              $path = $_.FullName
              if (-not $path.StartsWith($workPrefix, [StringComparison]::OrdinalIgnoreCase) -or
                  ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -or
                  $_.LastWriteTime -ge $cut) { return $false }
              if ($path.StartsWith($tempPrefix, [StringComparison]::OrdinalIgnoreCase)) { return $true }
              if ($_.Extension.ToLowerInvariant() -notin @('.jpg','.jpeg','.png','.webp','.rbxl','.rbxlx','.zip','.mp4','.webm')) {
                return $false
              }
              if ($path -match '(?i)\\\.git\\') { return $false }
              foreach ($repo in $repos) {
                if ($path.StartsWith($repo, [StringComparison]::OrdinalIgnoreCase)) { return $false }
              }
              return $true
            })
          foreach ($file in $files) {
            try {
              $size = $file.Length
              Remove-Item -LiteralPath $file.FullName -Force -ErrorAction Stop
              $removed++
              $freed += $size
            } catch {
              $failed++
              Write-Warning "RUNNER_DISK_CLEAN_LOCKED=$($file.Name)"
            }
          }
          # [빈 결과 폴더] 생성된 임시 폴더만 비었을 때 정리한다.
          foreach ($name in @('mare-frames','mare-first-attempt','rojo-bin')) {
            $dir = Join-Path $temp $name
            if (Test-Path -LiteralPath $dir -PathType Container) {
              $remaining = @(Get-ChildItem -LiteralPath $dir -Force -ErrorAction SilentlyContinue)
              if ($remaining.Count -eq 0) { Remove-Item -LiteralPath $dir -Force -ErrorAction SilentlyContinue }
            }
          }
          Write-Host "RUNNER_DISK_REMOVED_FILES=$removed RUNNER_DISK_REMOVED_MB=$([math]::Round($freed/1MB)) RUNNER_DISK_CLEAN_FAILURES=$failed"
          $volume = [IO.DriveInfo]::new('E:\')
          Write-Host "RUNNER_DISK_FREE_MB_AFTER=$([math]::Round($volume.AvailableFreeSpace/1MB))"
          # [자동 복구] 공간이 6GB 미만이면 이 러너의 지난 GitHub Actions 작업 복사본만 검증 후 정리한다.
          # [데이터 보호] 현재 러너는 이 작업만 수행한다. 이전 체크아웃에 로컬 변경·잠금·다른 Git 실행이 있으면 삭제하지 않는다.
          if ($volume.AvailableFreeSpace -lt 6GB) {
            $previousCheckout = Join-Path $env:GITHUB_WORKSPACE 'main'
            $knownCheckout = Join-Path $work 'jaewoon-games\jaewoon-games\main'
            $gitFolder = Join-Path $previousCheckout '.git'
            if (-not [string]::Equals([IO.Path]::GetFullPath($previousCheckout), [IO.Path]::GetFullPath($knownCheckout), [StringComparison]::OrdinalIgnoreCase)) {
              Write-Warning 'RUNNER_DISK_WORKTREE_RECOVERY=SKIPPED_UNEXPECTED_PATH'
            } elseif (-not (Test-Path -LiteralPath $gitFolder -PathType Container)) {
              Write-Host 'RUNNER_DISK_WORKTREE_RECOVERY=SKIPPED_NO_PRIOR_CHECKOUT'
            } elseif (@(Get-Process -Name 'git','git-lfs' -ErrorAction SilentlyContinue).Count -gt 0) {
              Write-Warning 'RUNNER_DISK_WORKTREE_RECOVERY=SKIPPED_GIT_BUSY'
            } else {
              try {
                $origin = @(& git -C $previousCheckout remote get-url origin)
                $remoteExit = $LASTEXITCODE
                $changes = @(& git -C $previousCheckout status --porcelain --untracked-files=all)
                $statusExit = $LASTEXITCODE
                $locks = @(Get-ChildItem -LiteralPath $gitFolder -Recurse -File -Filter '*.lock' -ErrorAction Stop)
                if ($remoteExit -ne 0 -or $statusExit -ne 0 -or $origin.Count -ne 1 -or
                    [string]$origin[0] -notmatch '^https://github\.com/hans1177/jaewoon-games(\.git)?$' -or
                    $changes.Count -ne 0 -or $locks.Count -gt 0) {
                  Write-Warning "RUNNER_DISK_WORKTREE_RECOVERY=SKIPPED_UNVERIFIED_OR_MODIFIED:changes=$($changes.Count):locks=$($locks.Count)"
                } else {
                  $beforeRecovery = ([IO.DriveInfo]::new('E:\')).AvailableFreeSpace
                  Remove-Item -LiteralPath $previousCheckout -Recurse -Force -ErrorAction Stop
                  $afterRecovery = ([IO.DriveInfo]::new('E:\')).AvailableFreeSpace
                  Write-Host "RUNNER_DISK_WORKTREE_RECOVERY=VERIFIED_PRIOR_CHECKOUT_REMOVED"
                  Write-Host "RUNNER_DISK_WORKTREE_RECOVERED_MB=$([math]::Round([math]::Max(0, $afterRecovery - $beforeRecovery)/1MB,2))"
                  $volume = [IO.DriveInfo]::new('E:\')
                }
              } catch {
                Write-Warning "RUNNER_DISK_WORKTREE_RECOVERY=SKIPPED_OR_FAILED:$($_.Exception.GetType().Name)"
              }
            }
          }
          Write-Host "RUNNER_DISK_FREE_MB_AFTER_RECOVERY=$([math]::Round($volume.AvailableFreeSpace/1MB,2))"
          # [실행기 장애] 공간 미확보 상태에서는 체크아웃을 반복하지 않고 복구 큐에 정확한 원인을 알린다.
          if ($volume.AvailableFreeSpace -lt 2GB) {
            Write-Host 'STUDIO_QA_FAILURE_STAGE=STUDIO_EXECUTION'
            Write-Host 'STUDIO_QA_FAILURE_SIGNATURE=STUDIO_RUNNER_DISK_EXHAUSTED'
            throw 'ROBLOX_STUDIO_E_DRIVE_FREE_SPACE_REQUIRED'
          }
      - uses: actions/checkout@v4
        with:
          path: main
          ref: ${{ inputs.candidate_ref || github.sha }}
          fetch-depth: 1
          # [E: 재발 방지] 전체 대형 저장소 대신 Studio 게임/공용 런타임/원본 3D와 검증 정책만 내려받는다.
          # checkout의 기본 sparse cone이 필요한 파일만 부분 수신하므로 filter(우선권 있음)는 중복 지정하지 않는다.
          # [필수 보존] assets 공용 모듈, QA, 중앙정책, 게임의 전체 원본 에셋은 빠짐없이 포함한다.
          sparse-checkout: |
            .github
            assets
            company-learning
            qa
            tools
            roblox-games/mare-essentia
      - name: Verify E drive after Studio checkout
        # [운영 복구] 스파스 체크아웃의 실제 Git 팩 크기와 남은 용량을 기록해 0GB 재발을 탐지한다.
        # [실패 차단] 작업 폴더나 Git 객체를 임의 삭제하지 않는다. 로컬 공간 부족이면 빌드 전에 중단한다.
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $checkoutRoot = Join-Path $env:GITHUB_WORKSPACE 'main'
          if (-not (Test-Path -LiteralPath (Join-Path $checkoutRoot '.git'))) {
            throw 'STUDIO_CHECKOUT_NOT_FOUND'
          }
          $gitSize = @(& git -C $checkoutRoot count-objects -v)
          if ($LASTEXITCODE -ne 0) { throw 'STUDIO_CHECKOUT_GIT_SIZE_UNVERIFIED' }
          foreach ($row in $gitSize) {
            if ($row -match '^size-pack:\s*(\d+)$') {
              Write-Host "STUDIO_GIT_PACK_MB_AFTER_CHECKOUT=$([math]::Round([long]$Matches[1]/1024,2))"
            }
            if ($row -match '^size:\s*(\d+)$') {
              Write-Host "STUDIO_GIT_LOOSE_MB_AFTER_CHECKOUT=$([math]::Round([long]$Matches[1]/1024,2))"
            }
          }
          $free = ([IO.DriveInfo]::new('E:\')).AvailableFreeSpace
          Write-Host "RUNNER_DISK_FREE_MB_AFTER_CHECKOUT=$([math]::Round($free/1MB,2))"
          if ($free -lt 2GB) {
            Write-Host 'STUDIO_QA_FAILURE_STAGE=STUDIO_EXECUTION'
            Write-Host 'STUDIO_QA_FAILURE_SIGNATURE=STUDIO_RUNNER_DISK_EXHAUSTED_AFTER_CHECKOUT'
            throw 'ROBLOX_STUDIO_E_DRIVE_FREE_SPACE_REQUIRED_AFTER_CHECKOUT'
          }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate inputs
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GAME_IN: ${{ github.event_name == 'push' && 'mare-essentia' || inputs.game }}
          SCRIPT_IN: ${{ github.event_name == 'push' && 'roblox-games/mare-essentia/tools/devloop/studio-scripts/mare-qa-click.json' || inputs.candidate_ref != '' && 'roblox-games/mare-essentia/tools/devloop/studio-scripts/mare-qa-click.json' || inputs.script }}
          DESIGN_CANDIDATE_IN: ${{ inputs.candidate_ref || '' }}
          PORT_BATCH_IN: ${{ inputs.port_batch || '0' }}
          PORT_REVISION_IN: ${{ inputs.port_revision || '' }}
        run: |
          $g = $env:GAME_IN
          $candidateRef = [string]$env:DESIGN_CANDIDATE_IN
          if ($candidateRef -ne '' -and $candidateRef -notmatch '^nemotron-mare-design-[0-9]{5,}$') { throw 'STUDIO_CANDIDATE_REF_INVALID' }
          "STUDIO_CANDIDATE_REF=$candidateRef" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if ($g -notmatch '^[a-z0-9-]+$') { throw "bad game id" }
          if (-not (Test-Path "main/roblox-games/$g/default.project.json")) { throw "no project for $g" }
          $sc = $env:SCRIPT_IN
          if ($sc -eq '') {
            $d = "roblox-games/$g/tools/devloop/studio-scripts/default.json"
            if (Test-Path "main/$d") { $sc = $d } elseif ($g -eq 'mare-essentia') { $sc = "roblox-games/mare-essentia/tools/devloop/studio-scripts/mare-town.json" } else { $sc = '' }
          }
          if ($sc -ne '' -and $sc -notmatch '^roblox-games/[a-z0-9-]+/[A-Za-z0-9_./-]+\.json$') { throw "bad script path" }
          # [항구 전수] 기존 마을 시나리오와 QA 항구 목록에서 회차별 실제 촬영 절차를 생성한다.
          if ($env:PORT_BATCH_IN -notmatch '^(0|[1-9][0-9]{0,2})$') { throw 'STUDIO_PORT_BATCH_INVALID' }
          $portBatch = [int]$env:PORT_BATCH_IN
          if ($portBatch -gt 327) { throw 'STUDIO_PORT_BATCH_INVALID' }
          if ($portBatch -gt 0) {
            if ($g -ne 'mare-essentia' -or $candidateRef -ne '' -or [string]$env:SCRIPT_IN -ne '') { throw 'STUDIO_PORT_BATCH_SCOPE_INVALID' }
            $revision = (& git -C main rev-parse HEAD).Trim()
            if ($revision -notmatch '^[a-f0-9]{40}$' -or ([string]$env:PORT_REVISION_IN -ne '' -and $env:PORT_REVISION_IN -ne $revision)) { throw 'STUDIO_PORT_BATCH_REVISION_CHANGED' }
            $sc = "roblox-games/$g/tools/devloop/studio-scripts/mare-town.json"
            $generated = Join-Path $env:RUNNER_TEMP 'mare-port-survey.json'
            $generate = @'
          const fs = require('node:fs');
          const path = require('node:path');
          const [root, out, rawBatch] = process.argv.slice(2);
          const batch = Number(rawBatch);
          const scenarios = ["mare-town","mare-regions","mare-field","mare-fieldcombat","mare-discovery-forms","mare-voyage-manual","mare-voyage-manual-helm","mare-voyage","mare-helm","mare-depart","mare-events","mare-navalrt","mare-navalfleet","mare-naval2","mare-navalcards","mare-questscene-live","mare-questscene-tradefun","mare-questscene-probe","mare-cardbattle","mare-cardgallery","mare-cardflow","mare-cardgain","mare-facilities","mare-tradehall","mare-menus","mare-ships","mare-villagers","mare-zoo","mare-knowledge","mare-title","mare-ui","mare-ui2","mare-palaces","mare-tavern","mare-recruit","mare-trade","mare-wallet","mare-weapons","mare-repair","mare-cards"];
          const variantStart = 107 + scenarios.length;
          const maxBatch = variantStart + 181 - 1;
          if (!Number.isInteger(batch) || batch < 1 || batch > maxBatch) throw Error('STUDIO_SURVEY_BATCH_INVALID');
          const gameRoot = path.resolve(root, '../../..');
          const shared = path.join(gameRoot, 'src/ReplicatedStorage/Shared');
          // [지상 전수] 기존 지역 탐험의 정상 철수·카메라 구도를 그대로 사용한다. 지점 이름과 카드 풀은 런타임 정본에서 읽는다.
          if (batch >= 20 && batch <= 79) {
            const siteSource = fs.readFileSync(path.join(shared, 'Sites.luau'), 'utf8');
            const sites = [...siteSource.matchAll(/^\s*\{\s*id\s*=\s*"([a-z0-9_]+)",\s*name\s*=\s*"[^"]+",\s*portId\s*=\s*"([a-z0-9_]+)"/gm)].map(m => ({id:m[1],port:m[2]}));
            if (sites.length !== 592 || new Set(sites.map(row => row.id)).size !== sites.length) throw Error('STUDIO_FIELD_CATALOG_MISMATCH');
            const selected = sites.slice((batch - 20) * 10, (batch - 19) * 10);
            const regions = JSON.parse(fs.readFileSync(path.join(root, 'mare-regions.json'), 'utf8'));
            const steps = [regions[0],regions[1],{type:'luau',ctx:'Client',code:
              'local S=require(game:GetService("ReplicatedStorage").Shared.Sites).Sites assert(#S==592,"FIELD_SURVEY_CATALOG_COUNT") return "FIELD_SURVEY_CATALOG=592"'}];
            const cameraAngles = [['north','0,0.2,0.65','0,0,-0.18'],['east','0.65,0.2,0','-0.18,0,0'],['south','0,0.2,-0.65','0,0,0.18'],['west','-0.65,0.2,0','0.18,0,0'],['overhead','0,1.1,0','0,0,0']];
            for (const [i, row] of selected.entries()) {
              const id = row.id, port = row.port;
              steps.push({type:'luau',ctx:'Client',timeoutMs:90000,code:
                'local old=workspace:FindFirstChild("MareRegionQAExit") if old then old:Invoke() old:Destroy() end assert(not workspace:FindFirstChild("FieldScene"),"FIELD_SURVEY_SCENE_LEAK") '+
                'local RS=game:GetService("ReplicatedStorage") local site for _,s in require(RS.Shared.Sites).Sites do if s.id=="'+id+'" then site=s break end end assert(site and site.portId=="'+port+'","FIELD_SURVEY_SITE_MISMATCH") '+
                'workspace:SetAttribute("FieldErr","RUNNING:'+id+'") workspace:SetAttribute("VoyageActive",true) '+
                'task.spawn(function() local ok,result=xpcall(function() return require(RS.Shared.FieldScene).start({name=site.name,portId=site.portId,siteId=site.id,nodes=math.clamp(#site.pool,1,3),danger=math.clamp(site.minLevel,1,5),year=math.max(1700,site.fromYear or 1700),seed='+((batch-20)*10+i+1)+',observableCards=site.pool,weapon="sword",onFinish=function()end}) end,function(e) return debug.traceback(tostring(e)) end) '+
                'if not ok or type(result)~="table" or type(result.finish)~="function" then workspace:SetAttribute("FieldErr","FAIL:'+id+':"..tostring(result):sub(1,350)) return end local gate=Instance.new("BindableFunction") gate.Name="MareRegionQAExit" gate.OnInvoke=function() result.finish("retreat") end gate.Parent=workspace workspace:SetAttribute("FieldErr","PASS:'+id+'") end return "FIELD_SURVEY_LAUNCHED:'+id+'"'});
              steps.push({type:'wait',ms:3500},{type:'luau',ctx:'Client',timeoutMs:90000,code:
                'local state for i=1,200 do state=workspace:GetAttribute("FieldErr") if state=="PASS:'+id+'" or (type(state)=="string" and state:sub(1,5)=="FAIL:") then break end task.wait(0.3) end assert(state=="PASS:'+id+'","FIELD_SURVEY_BUILD:"..tostring(state)) local f=assert(workspace:FindFirstChild("FieldScene")) assert(f:GetAttribute("FieldSiteId")=="'+id+'" and f:GetAttribute("FieldPortId")=="'+port+'","FIELD_SURVEY_WRONG_SCENE") assert(workspace:GetAttribute("FieldCombatReady")==true,"FIELD_SURVEY_NOT_READY") local ground=assert(f:FindFirstChild("FieldGround")) assert(ground.Size.X>=180 and f:FindFirstChild("FieldSafetyFloor"),"FIELD_SURVEY_GROUND") return "FIELD_SURVEY_ID:'+id+'"'});
              for (const [name,from,to] of cameraAngles) {
                steps.push({type:'luau',ctx:'Client',code:
                  'local f=assert(workspace:FindFirstChild("FieldScene")) assert(f:GetAttribute("FieldSiteId")=="'+id+'","FIELD_SURVEY_CAMERA_ID") local g=assert(f:FindFirstChild("FieldGround")) local p=g.Position local s=math.max(g.Size.X,g.Size.Z) workspace:SetAttribute("ShotFov",70) workspace:SetAttribute("ShotCF",CFrame.lookAt(p+Vector3.new('+from+')*s,p+Vector3.new('+to+')*s,'+(name==='overhead'?'Vector3.new(0,0,-1)':'Vector3.yAxis')+')) return "FIELD_SURVEY_CAMERA:'+name+'"'},{type:'wait',ms:1500},{type:'capture',name:'field_'+id+'_'+name});
              }
            }
            steps.push(regions.at(-1));
            if (steps.filter(row=>row.type==='capture').length !== selected.length*5) throw Error('STUDIO_FIELD_CAPTURE_COUNT');
            fs.writeFileSync(out,JSON.stringify(steps));
            console.log('STUDIO_FIELD_BATCH='+batch+' SITES='+selected.length+' FRAMES='+selected.length*5);
            process.exit(0);
          }
          // [해역 전수] 원본 지시서 파일과 해전 코드의 해역 매핑을 대조하고 실제 해전 배경 ID를 검사한다.
          if (batch >= 80 && batch <= 106) {
            const navalSource=fs.readFileSync(path.join(shared,'NavalBattle.luau'),'utf8');
            const block=navalSource.match(/local briefPorts = \{([\s\S]*?)\n\s*\}/)?.[1] || '';
            const seas=[...block.matchAll(/^\s*([a-z_]+) = "([a-z0-9_]+)(?: [a-z0-9_]+)*",/gm)].map(m=>({id:m[1],port:m[2]})).sort((a,b)=>a.id.localeCompare(b.id));
            const docs=fs.readdirSync(path.join(gameRoot,'docs/battle_backdrops/naval')).filter(n=>n.endsWith('.md')).map(n=>n.slice(0,-3)).sort();
            if (seas.length!==27 || JSON.stringify(seas.map(row=>row.id))!==JSON.stringify(docs)) throw Error('STUDIO_NAVAL_CATALOG_MISMATCH');
            const sea=seas[batch-80];
            const naval=JSON.parse(fs.readFileSync(path.join(root,'mare-navalrt.json'),'utf8'));
            const start=naval[1].code.replace('function() NB.play({','function() return NB.play({portId="'+sea.port+'",portLat=assert(require(RS.Shared.Ports).Ports["'+sea.port+'"]).lat,portLon=require(RS.Shared.Ports).Ports["'+sea.port+'"].lon,');
            if (start===naval[1].code) throw Error('STUDIO_NAVAL_START_ANCHOR');
            const verifiedStart=start.replace("return 'play ok='..tostring(ok)..' '..tostring(err)",'assert(ok and type(err)=="table" and type(err.finish)=="function","NAVAL_SURVEY_START:"..tostring(err)) local gate=Instance.new("BindableFunction") gate.Name="MareNavalSurveyExit" gate.OnInvoke=function() err.finish(false) end gate.Parent=workspace return "NAVAL_SURVEY_STARTED"');
            if (verifiedStart===start) throw Error('STUDIO_NAVAL_RESULT_ANCHOR');
            const steps=[naval[0],{...naval[1],code:verifiedStart,timeoutMs:90000},{type:'wait',ms:4500},
              {type:'luau',ctx:'Client',code:'local f=assert(workspace:FindFirstChild("BattleScene")) assert(f:GetAttribute("NavalBriefSea")=="'+sea.id+'","NAVAL_SURVEY_WRONG_SEA") assert(game.Players.LocalPlayer.PlayerGui:FindFirstChild("BattleGui"),"NAVAL_SURVEY_GUI") return "NAVAL_SURVEY_SEA:'+sea.id+'"'},{type:'capture',name:'sea_'+sea.id+'_battle'}];
            const bind=JSON.parse(fs.readFileSync(path.join(root,'mare-town.json'),'utf8')).find(row=>row.type==='luau'&&row.code.includes('BindToRenderStep("MareShot"'));
            if (!bind) throw Error('STUDIO_NAVAL_CAMERA_BIND');
            steps.push(bind);
            for (const [name,from,to] of [['north','0,100,550','0,10,-350'],['east','550,100,0','-350,10,0'],['south','0,100,-550','0,10,350'],['west','-550,100,0','350,10,0'],['overhead','0,1100,0','0,0,0']]) {
              steps.push({type:'luau',ctx:'Client',code:'local f=assert(workspace:FindFirstChild("BattleScene")) assert(f:GetAttribute("NavalBriefSea")=="'+sea.id+'","NAVAL_SURVEY_CAMERA_ID") local p=assert(f:FindFirstChild("NavalSeaSurface")).Position workspace:SetAttribute("ShotFov",70) workspace:SetAttribute("ShotCF",CFrame.lookAt(p+Vector3.new('+from+'),p+Vector3.new('+to+'),'+(name==='overhead'?'Vector3.new(0,0,-1)':'Vector3.yAxis')+')) return "NAVAL_SURVEY_CAMERA:'+name+'"'},{type:'wait',ms:1500},{type:'capture',name:'sea_'+sea.id+'_'+name});
            }
            steps.push({type:'luau',ctx:'Client',code:'game:GetService("RunService"):UnbindFromRenderStep("MareShot") local gate=assert(workspace:FindFirstChild("MareNavalSurveyExit")) gate:Invoke() gate:Destroy() assert(not workspace:FindFirstChild("BattleScene"),"NAVAL_SURVEY_SCENE_LEAK") return "NAVAL_SURVEY_EXIT"'});
            fs.writeFileSync(out,JSON.stringify(steps));
            console.log('STUDIO_NAVAL_BATCH='+batch+' SEA='+sea.id+' FRAMES=6');
            process.exit(0);
          }
          // [기능 전수] 기존 검증 스크립트를 독립 Studio 실행으로 재사용한다. 동일한 이름의 사진은 기능명으로 구별한다.
          if (batch >= 107 && batch < variantStart) {
            const scenario=scenarios[batch-107];
            const helm=scenario==='mare-voyage-manual-helm';
            const file=helm?'mare-voyage-manual':scenario;
            const steps=JSON.parse(fs.readFileSync(path.join(root,file+'.json'),'utf8')).map(row=>{
              if (helm && row.type==='luau') return {...row,code:row.code.replace('rings=true,firstVisit=true','helm=true').replace('직접 항해','직접 조종').replaceAll('WindRing','HelmStick')};
              return row;
            }).map(row=>row.type==='capture'?{...row,name:scenario.replace(/^mare-/,'').replace(/-/g,'_')+'_'+row.name}:row);
            if (!steps.some(row=>row.type==='capture')) throw Error('STUDIO_FEATURE_CAPTURE_MISSING:'+scenario);
            fs.writeFileSync(out,JSON.stringify(steps));
            console.log('STUDIO_FEATURE_BATCH='+batch+' SCENARIO='+scenario+' FRAMES='+steps.filter(row=>row.type==='capture').length);
            process.exit(0);
          }
          const town = JSON.parse(fs.readFileSync(path.join(root, 'mare-town.json'), 'utf8'));
          const qa = JSON.parse(fs.readFileSync(path.join(root, 'mare-qa-click.json'), 'utf8'));
          const ports = qa.map(row => row.code?.match(/^-- \[항구 위치\] ([a-z0-9_]+)/)?.[1]).filter(Boolean);
          if (ports.length !== 181 || new Set(ports).size !== 181 || (batch > 19 && batch < variantStart))
            throw Error('STUDIO_PORT_SURVEY_CATALOG_MISMATCH');
          const variant = batch >= variantStart;
          const selected = variant ? [ports[batch - variantStart]] : ports.slice((batch - 1) * 10, batch * 10);
          // [도시 발전/계절/복식] 독립 축을 검증한다. 실제 저장 상태가 아닌 Studio 장면 입력이며 전 조합을 뜻하지 않는다.
          const conditions = variant ? [
            ...Array.from({length:6},(_,i)=>({key:'tier_'+(i+1),level:i+1,season:3,year:1700,weather:'clear'})),
            ...[1,2,3,4].map(season=>({key:'season_'+season,level:3,season,year:1700,weather:'clear'})),
            ...['rain','storm'].map(weather=>({key:'weather_'+weather,level:3,season:3,year:1700,weather})),
            ...[1517,1800].map(year=>({key:'era_'+year,level:3,season:3,year,weather:'clear'}))
          ] : [{key:'',level:1,season:0,year:1700,weather:'clear'}];
          const names = variant ? ['01_top','03_street','11_npc_front','12_npc_hair'] : ['01_top','02_plaza','03_street','04_dock','05_aerial','06_backstreet','07_wall','09_rural','10_economy','11_npc_front','12_npc_hair'];
          const cameras = names.map(name => {
            const i = town.findIndex(row => row.type === 'capture' && row.name === name);
            if (i < 2 || town[i-2].type !== 'luau' || town[i-1].type !== 'wait') throw Error('STUDIO_PORT_CAMERA_MISSING:' + name);
            return [town[i-2], town[i-1], town[i]];
          });
          const bind = town.find(row => row.type === 'luau' && row.code.includes('BindToRenderStep("MareShot"'));
          if (!bind) throw Error('STUDIO_PORT_CAMERA_BIND_MISSING');
          const steps = [town[0], town[1], {type:'luau',ctx:'Client',code:
            'local P=require(game:GetService("ReplicatedStorage").Shared.Ports).Ports local expected=' +
            '{' + ports.map(id => '"' + id + '"').join(',') + '}' +
            ' local n=0 for id,p in P do n+=1 end assert(n==#expected,"PORT_SURVEY_RUNTIME_COUNT") for _,id in expected do assert(P[id] and P[id].id==id,"PORT_SURVEY_RUNTIME_ID:"..id) end return "PORT_SURVEY_RUNTIME_CATALOG=181"'}];
          for (const id of selected) for (const condition of conditions) {
            const tag = id + (condition.key ? '_'+condition.key : '');
            const level = condition.level, season = condition.season, year = condition.year, weather = condition.weather;
            const verify = 'assert(scene:GetAttribute("CityPortVisualIdentity")==id,"PORT_SURVEY_WRONG_SCENE:"..id) ' +
              'assert(scene:GetAttribute("CityDisplayTier")=='+level+',"PORT_SURVEY_WRONG_TIER:"..id) ' +
              (variant ? 'assert(scene:GetAttribute("CitySourceLevel")=='+level+',"PORT_SURVEY_SOURCE_TIER:"..id) assert(scene:GetAttribute("CitySeasonIndex")=='+season+',"PORT_SURVEY_WRONG_SEASON:"..id) assert(scene:GetAttribute("PortVisualWeather")=="'+weather+'","PORT_SURVEY_WRONG_WEATHER:"..id) ' : '');
            steps.push({type:'luau',ctx:'Client',timeoutMs:90000,code:
              'local RS=game:GetService("ReplicatedStorage") local P=require(RS.Shared.Ports).Ports local id="' + id + '" local p=assert(P[id],"PORT_SURVEY_ID") ' +
              'for _,g in game.Players.LocalPlayer.PlayerGui:GetChildren() do if g:IsA("ScreenGui") then g.Enabled=false end end ' +
              'workspace:SetAttribute("ShotCF",nil) local day=0 local V=require(RS.Shared.Voyage) ' +
              (variant ? 'for _,d in {0,91,182,273} do if V.season(d,p.lat)=='+season+' then day=d break end end assert(V.season(day,p.lat)=='+season+',"PORT_SURVEY_SEASON_DAY") ' : '') +
              'local result=require(RS.Shared.PortScene).build({portId=id,portName=p.name,shipId="galleon",hasShipyard=p.shipyard,facilities={"bank","guild","harbormaster","palace"},storyCount=0,level='+level+',development={level='+level+'},year='+year+',day=day,weather="'+weather+'"},function() end) ' +
              'local scene=assert(result.folder,"PORT_SURVEY_SCENE_MISSING") assert(scene.Parent==workspace,"PORT_SURVEY_PARENT") '+verify +
              'local c=game.Players.LocalPlayer.Character if c and c:FindFirstChild("HumanoidRootPart") then c.HumanoidRootPart.Anchored=true c:PivotTo(result.spawn) end return "PORT_SURVEY_SCENE="..id'});
            steps.push({type:'wait',ms:8000}, bind);
            for (const [camera, wait, capture] of cameras) {
              steps.push({...camera,code:'local id="'+id+'" local scene=assert(workspace:FindFirstChild("PortScene"),"PORT_SURVEY_CAMERA_SCENE") '+verify+camera.code},wait,{...capture,name:'port_'+tag+'_'+capture.name});
            }
          }
          if (steps.filter(row => row.type === 'capture').length !== selected.length * conditions.length * names.length) throw Error('STUDIO_PORT_CAPTURE_COUNT_MISMATCH');
          fs.writeFileSync(out, JSON.stringify(steps));
          console.log('STUDIO_PORT_BATCH=' + batch + ' PORTS=' + selected.join(',') + ' CONDITIONS='+conditions.length+' PLANNED_FRAMES=' + selected.length * conditions.length * names.length);
          '@
            $generate | & node - (Join-Path $env:GITHUB_WORKSPACE "main/roblox-games/$g/tools/devloop/studio-scripts") $generated $portBatch
            if ($LASTEXITCODE -ne 0) { throw 'STUDIO_PORT_SURVEY_GENERATION_FAILED' }
            "CAP_SCRIPT_FILE=$generated" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "STUDIO_PORT_REVISION=$revision" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          "STUDIO_PORT_BATCH=$portBatch" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CAP_GAME=$g" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CAP_SCRIPT=$sc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build place with pinned Rojo
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          # [메인] 자동개발 빌드 임시 파일은 기존 E: 인증 실행기 작업 경로만 사용한다.
          $jobTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          if ([IO.Path]::GetPathRoot($jobTemp) -ne 'E:\') { throw 'ROBLOX_STUDIO_E_RUNNER_TEMP_REQUIRED' }
          if (([IO.DriveInfo]::new('E:\')).AvailableFreeSpace -lt 2GB) { throw 'ROBLOX_STUDIO_E_DRIVE_FREE_SPACE_REQUIRED' }
          $env:TEMP = $jobTemp
          $env:TMP = $jobTemp
          Write-Host 'ROBLOX_STUDIO_BUILD_TEMP_DRIVE=E'
          $rojoZip = Join-Path $env:RUNNER_TEMP 'rojo.zip'
          $rojoDir = Join-Path $env:RUNNER_TEMP 'rojo-bin'
          Remove-Item -Recurse -Force $rojoDir -ErrorAction SilentlyContinue
          & curl.exe -fL --retry 3 -o $rojoZip 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip'
          $h = (Get-FileHash $rojoZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($h -ne '2179c44862a10ecbd725bdfeb4abc64e16dc4aad9b6c8f3e1a7c46a87280b949') { throw "rojo hash $h" }
          Expand-Archive $rojoZip -DestinationPath $rojoDir -Force
          $rojo = (Get-ChildItem $rojoDir -Recurse -Filter rojo.exe | Select-Object -First 1).FullName
          $place = Join-Path $env:RUNNER_TEMP 'marecheck.rbxl'
          Remove-Item $place -ErrorAction SilentlyContinue
          & $rojo build "main/roblox-games/$($env:CAP_GAME)/default.project.json" -o $place
          if ($LASTEXITCODE -ne 0) { throw 'rojo build failed' }
          "MARE_PLACE=$place" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Launch Studio, run script, capture frames
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GH_TOKEN: ${{ github.token }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_FREE_TIER_VERIFIED: ${{ vars.NVIDIA_FREE_TIER_VERIFIED || 'NO' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_DESIGN_FREE_TIER_VERIFIED: ${{ vars.GEMINI_DESIGN_FREE_TIER_VERIFIED || 'NO' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_DESIGN_FREE_TIER_VERIFIED: ${{ vars.OPENROUTER_DESIGN_FREE_TIER_VERIFIED || 'NO' }}
          # [오너 허용] 이 Studio 디자인 검사에만 외부 무료 AI 사용을 명시적으로 허용한다.
          COMPANY_EXTERNAL_AI_ENABLED: 'YES'
          NEMOTRON_DESIGN_CANDIDATE: 'YES'
        run: |
          $ErrorActionPreference = 'Stop'
          # [후보 PR 검사] 본 저장소 main 대상의 네모트론 격리 브랜치인지 사전 검증.
          $sourceSha = (& git -C 'main' rev-parse HEAD).Trim()
          if ($env:STUDIO_CANDIDATE_REF -ne '') {
            $prJson = & gh pr view $env:STUDIO_CANDIDATE_REF --repo $env:GITHUB_REPOSITORY --json headRefName,headRefOid,baseRefName,baseRefOid,state,headRepositoryOwner
            if ($LASTEXITCODE -ne 0) { throw 'STUDIO_CANDIDATE_PR_NOT_FOUND' }
            $pr = $prJson | ConvertFrom-Json
            if ($pr.state -ne 'OPEN' -or $pr.baseRefName -ne 'main' -or
                $pr.headRefName -ne $env:STUDIO_CANDIDATE_REF -or $pr.headRefOid -ne $sourceSha -or
                $pr.headRepositoryOwner.login -ne 'hans1177') { throw 'STUDIO_CANDIDATE_PR_IDENTITY_MISMATCH' }
          }
          $env:GITHUB_SHA = $sourceSha
          $env:STUDIO_SOURCE_SHA = $sourceSha
          if ($env:STUDIO_CANDIDATE_REF -ne '') { $env:STUDIO_BASE_SHA = [string]$pr.baseRefOid }
          Write-Host "STUDIO_EXACT_SOURCE_SHA=$sourceSha"
          # [메인] 공식 Studio·MCP·Node의 사용자 임시 파일은 기존 E: 러너 작업 폴더에서 생성한다.
          # LOCALAPPDATA·로블록스 설치·계정/저장 경로는 이동하지 않는다.
          $jobTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          if ([IO.Path]::GetPathRoot($jobTemp) -ne 'E:\') { throw 'ROBLOX_STUDIO_E_RUNNER_TEMP_REQUIRED' }
          if (([IO.DriveInfo]::new('E:\')).AvailableFreeSpace -lt 2GB) { throw 'ROBLOX_STUDIO_E_DRIVE_FREE_SPACE_REQUIRED' }
          $env:TEMP = $jobTemp
          $env:TMP = $jobTemp
          Write-Host 'ROBLOX_STUDIO_PROCESS_TEMP_DRIVE=E'
          if (@(Get-Process RobloxStudioBeta -ErrorAction SilentlyContinue).Count) { Get-Process RobloxStudioBeta -ErrorAction SilentlyContinue | Stop-Process -Force; Start-Sleep -Seconds 5 }
          # [로그] Studio 실행 전 시스템 드라이브 압박만 해소한다. 오래된 Roblox 로그 외에는 삭제하지 않는다.
          $studioVolume = [IO.DriveInfo]::new([IO.Path]::GetPathRoot($env:LOCALAPPDATA))
          Write-Host "STUDIO_SYSTEM_DISK_FREE_MB_BEFORE=$([math]::Round($studioVolume.AvailableFreeSpace/1MB,1))"
          if ($studioVolume.AvailableFreeSpace -lt 128MB) {
            $robloxLogRoot = Join-Path $env:LOCALAPPDATA 'Roblox\logs'
            if (Test-Path -LiteralPath $robloxLogRoot -PathType Container) {
              $logRootInfo = Get-Item -LiteralPath $robloxLogRoot -Force
              if (-not ($logRootInfo.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
                $cutoff = (Get-Date).AddHours(-1)
                $cleared = 0
                foreach ($log in @(Get-ChildItem -LiteralPath $robloxLogRoot -File -ErrorAction Stop |
                  Where-Object { $_.LastWriteTime -lt $cutoff -and $_.Extension -in @('.log','.txt') -and
                    -not ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) })) {
                  try {
                    Remove-Item -LiteralPath $log.FullName -Force -ErrorAction Stop
                    $cleared++
                  } catch {
                    Write-Warning 'STUDIO_OLD_LOG_LOCKED_OR_UNAVAILABLE'
                  }
                }
                Write-Host "STUDIO_OLD_ROBLOX_LOGS_CLEARED=$cleared"
              }
            }
          }
          $studioVolume = [IO.DriveInfo]::new([IO.Path]::GetPathRoot($env:LOCALAPPDATA))
          Write-Host "STUDIO_SYSTEM_DISK_FREE_MB_AFTER=$([math]::Round($studioVolume.AvailableFreeSpace/1MB,1))"
          if ($studioVolume.AvailableFreeSpace -lt 32MB) { throw 'STUDIO_SYSTEM_DISK_SPACE_REQUIRED' }
          $roots = @((Join-Path $env:LOCALAPPDATA 'Roblox\Versions'), (Join-Path ${env:ProgramFiles(x86)} 'Roblox\Versions'))
          $studio = $roots | Where-Object { Test-Path $_ } | ForEach-Object { Get-ChildItem $_ -Recurse -Filter RobloxStudioBeta.exe -ErrorAction SilentlyContinue } | Sort-Object LastWriteTime -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $studio) { throw 'RobloxStudioBeta.exe not found' }
          $mcp = Join-Path (Split-Path $studio -Parent) 'StudioMCP.exe'
          if (-not (Test-Path $mcp)) { $mcp = Join-Path $env:LOCALAPPDATA 'Roblox\mcp.bat' }
          if (-not (Test-Path $mcp)) { throw 'StudioMCP not found' }
          Write-Host "STUDIO=$studio MCP=$mcp"
          $out = Join-Path $env:RUNNER_TEMP 'mare-frames'
          $reportFile = Join-Path $out 'report.json'
          $studioNodeExitCode = 1
          $firstAttempt = Join-Path $env:RUNNER_TEMP 'mare-first-attempt'
          Remove-Item -Recurse -Force $firstAttempt -ErrorAction SilentlyContinue
          # [메인] MCP 통신이 끊긴 경우에만 같은 빌드·같은 작업을 새 Studio 세션으로 한 번 재시도한다.
          # 게임 코드 오류, 클릭 실패, 화면 불일치는 재시도하지 않고 기존 QA 실패로 남긴다.
          for ($studioAttempt = 1; $studioAttempt -le 2; $studioAttempt++) {
            Remove-Item -Recurse -Force $out -ErrorAction SilentlyContinue
            New-Item -ItemType Directory $out -Force | Out-Null
            'STUDIO_CAPTURE_ATTEMPTED=YES' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "STUDIO_MCP_CAPTURE_ATTEMPT=$studioAttempt"
            try {
              Start-Process -FilePath $studio -ArgumentList @($env:MARE_PLACE) -PassThru | Out-Null
              if ($env:CAP_SCRIPT -ne '') {
                $activeScript = if ($env:CAP_SCRIPT_FILE) { $env:CAP_SCRIPT_FILE } else { "main/$($env:CAP_SCRIPT)" }
                & node 'main/tools/company-development-roblox-studio-local-play.mjs' --mode=studio-script "--script=$activeScript" "--mcp-command=$mcp" '--studio-name=marecheck' "--out-dir=$out"
              } else {
                & node 'main/tools/company-development-roblox-studio-local-play.mjs' --mode=opening-capture "--mcp-command=$mcp" '--studio-name=marecheck' "--out-dir=$out"
              }
              $studioNodeExitCode = [int]$LASTEXITCODE
            } catch {
              $studioNodeExitCode = 1
              Write-Warning ("STUDIO_MCP_CAPTURE_PROCESS_ERROR=" + $_.Exception.GetType().Name)
            } finally {
              Get-Process RobloxStudioBeta -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            }
            Write-Host "NODE_EXIT=$studioNodeExitCode"
            Write-Host "STUDIO_SCRIPT_PROCESS_EXIT=$studioNodeExitCode"
            if ($studioAttempt -ge 2) { break }
            $attemptReport = $null
            if (Test-Path -LiteralPath $reportFile) {
              try { $attemptReport = Get-Content -LiteralPath $reportFile -Encoding UTF8 -Raw | ConvertFrom-Json } catch {}
            }
            $attemptErrors = @($attemptReport.errors | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) })
            $rpcStalled = $attemptErrors.Count -gt 0 -and
              @($attemptErrors | Where-Object { [string]$_ -notmatch 'MCP timeout: tools/call|MCP process exited code=|ROBLOX_STUDIO_MCP_TOOL_ERROR:execute_luau:Network action .*Target is not reachable' }).Count -eq 0
            if (-not $rpcStalled) { break }
            Move-Item -LiteralPath $out -Destination $firstAttempt
            Write-Warning 'STUDIO_MCP_TRANSPORT_RETRY=FRESH_OFFICIAL_STUDIO_SESSION_ONCE'
            Start-Sleep -Seconds 8
          }
          if (Test-Path -LiteralPath $firstAttempt) {
            Copy-Item -LiteralPath (Join-Path $firstAttempt 'report.json') -Destination (Join-Path $out 'first-attempt-report.json')
            $lastShot = $attemptReport.abortDiagnostics.lastScreenshot
            if ($lastShot -match '^[a-zA-Z0-9_-]+$') {
              Get-ChildItem -LiteralPath $firstAttempt -Filter "$lastShot-*" -File | ForEach-Object {
                Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $out ('first-attempt-' + $_.Name))
              }
            }
          }
          # [실증 검증] 성공처럼 보이는 빈 캡처·스크립트 오류는 실패로 처리한다.
          $reportFile = Join-Path $out 'report.json'
          # [오류 증거] Node가 먼저 실패해도 원인 기록을 남겨 기존 복구 작업으로 전달한다.
          if (-not (Test-Path $reportFile)) {
            [ordered]@{
              log = @()
              errors = @('STUDIO_REPORT_MISSING')
              evidenceScope = 'WORKFLOW_FAILURE_DIAGNOSTIC_ONLY_NOT_STUDIO_PLAY'
            } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $reportFile -Encoding UTF8
          }
          # Windows PowerShell only consumes fields needed for routing. Keep the full UTF-8 evidence intact.
          $triageFile = Join-Path $env:RUNNER_TEMP 'mare-studio-triage.json'
          Remove-Item -LiteralPath $triageFile -ErrorAction SilentlyContinue
          $readReport = @'
          const fs = require('node:fs');
          const [source, output] = process.argv.slice(2);
          const report = JSON.parse(fs.readFileSync(source, 'utf8').replace(/^\uFEFF/, ''));
          if (!report || !Array.isArray(report.errors) || !Array.isArray(report.log)) {
            throw new Error('STUDIO_REPORT_SHAPE_INVALID');
          }
          const audit = report.assetAudit;
          const capture = report.consoleCapture;
          fs.writeFileSync(output, JSON.stringify({
            sourceRevision: report.sourceRevision,
            errors: report.errors,
            log: report.log.filter(row => row?.ctx === 'Client' || row?.ctx === 'Server')
              .map(row => ({ctx: row.ctx, out: row.out})),
            assetAudit: audit ? {
              models: {status: audit.models?.status},
              registered: {status: audit.registered?.status},
              features: {status: audit.features?.status}
            } : null,
            consoleCapture: capture ? {captured: capture.captured,
              errors: (Array.isArray(capture.errors) ? capture.errors : [])
                .map(row => ({type: row?.type, signature: row?.signature}))} : null
          }), 'utf8');
          '@
          try {
            $readReport | & node - $reportFile $triageFile
            if ($LASTEXITCODE -ne 0) { throw 'STUDIO_REPORT_INVALID_JSON' }
            $report = Get-Content -LiteralPath $triageFile -Encoding UTF8 -Raw | ConvertFrom-Json
          } catch {
            Write-Warning 'STUDIO_REPORT_TRIAGE_FAILED_RAW_EVIDENCE_RETAINED'
            $report = [pscustomobject]@{ log = @(); errors = @('STUDIO_REPORT_INVALID_JSON') }
          }
          # [런타임 진단] 실제 Studio 결과만 사용한다. 실패해도 증거를 먼저 저장한다.
          $qaStage = ''
          $qaSignature = ''
          if ($studioNodeExitCode -ne 0) {
            $qaStage = 'STUDIO_EXECUTION'
            $qaSignature = 'STUDIO_SCRIPT_REPORTED_ERRORS'
          }
          if (@($report.errors).Count -gt 0) {
            # [상세 복구] 중복·폭증을 막고 실제 실패한 단계만 최대 5건 기록한다.
            foreach ($failure in @($report.errors | Select-Object -First 5)) {
              $detail = ([string]$failure -replace '[\r\n]',' ')
              Write-Host ('STUDIO_QA_STEP_FAILURE=' + $detail.Substring(0,[Math]::Min(230,$detail.Length)))
            }
            $qaStage = 'STUDIO_EXECUTION'
            $qaSignature = 'STUDIO_SCRIPT_REPORTED_ERRORS'
            # [복구 분류] Studio MCP 통신 타임아웃을 게임 소스 오류로 위장하지 않는다.
            if (@($report.errors | Where-Object { [string]$_ -match 'MCP timeout: tools/call|MCP process exited code=' }).Count -gt 0) {
              $qaSignature = 'STUDIO_MCP_TOOL_TIMEOUT'
            } elseif (@($report.errors | Where-Object { [string]$_ -match 'ROBLOX_STUDIO_MCP_TOOL_ERROR:execute_luau:Network action .*Target is not reachable' }).Count -gt 0) {
              $qaSignature = 'STUDIO_MCP_PLAYCLIENT_UNREACHABLE'
            }
          }
          # [실증 분류] 버튼·실제 자산·게임 기능을 독립 판정하고 실패를 기존 복구 엔진에 전달한다.
          if (@($report.errors | Where-Object { [string]$_ -eq 'STUDIO_ASSET_AUDIT_FAILED' }).Count -gt 0) {
            $qaStage = 'STUDIO_GAME_RUNTIME'
            $qaSignature = 'STUDIO_ASSET_AUDIT_FAILED'
          } elseif (@($report.errors | Where-Object { [string]$_ -eq 'STUDIO_FEATURE_AUDIT_FAILED' }).Count -gt 0) {
            $qaStage = 'STUDIO_GAME_RUNTIME'
            $qaSignature = 'STUDIO_FEATURE_AUDIT_FAILED'
          } elseif (@($report.errors | Where-Object { [string]$_ -eq 'STUDIO_FULL_AUDIT_INCOMPLETE' }).Count -gt 0) {
            $qaStage = 'STUDIO_EXECUTION'
            $qaSignature = 'STUDIO_FULL_AUDIT_INCOMPLETE'
          }
          if ($report.assetAudit) {
            Write-Host ("STUDIO_MARE_ASSET_AUDIT_MODELS=" + [string]$report.assetAudit.models.status)
            Write-Host ("STUDIO_MARE_ASSET_AUDIT_MEDIA=" + [string]$report.assetAudit.registered.status)
            Write-Host ("STUDIO_MARE_FEATURE_AUDIT=" + [string]$report.assetAudit.features.status)
          }
          $runtimeRows = @($report.log | Where-Object {
            $_.ctx -in @('Client','Server') -and [string]$_.out -match 'LOGS\(([1-9][0-9]*)\):'
          } | Where-Object {
            # [환경 경고 제외] 로컬 Studio 는 게시된 유니버스 없이 열려 rbxassethash 로딩이 "Place universe not found"로 남는다.
            # 이 문구만으로 이뤄진 로그 묶음은 게임 오류가 아니다(이미지 로딩은 Client 전수 IsLoaded 검사가 따로 확정).
            # MCP 응답 마지막 타입 표식만 제거하고 원본 경고 보고서는 보존한다.
            $payload = ([string]$_.out -replace '^[^:]*LOGS\([0-9]+\):\s*','') -creplace '\r?\ntext\s*\z',''
            $msgs = @($payload -split ' // ' | Where-Object { $_.Trim() })
            # [서버 선로딩 정지] Client 전수 IsLoaded 검사가 이미지를 확정해 media 가 PASS 면, 서버 PreloadAsync 의 TIMEOUT_16S 기록도 제외한다.
            $mediaOk = ([string]$report.assetAudit.registered.status -eq 'PASS')
            # [실제 회복 증거] 전수 모델 로딩 및 등록 검사 이후에만 초기 모델 대기를 회복으로 분류한다.
            $modelAudit = $report.assetAudit.models
            $modelRecovered = ($env:CAP_GAME -ceq 'mare-essentia' -and
              [string]$modelAudit.status -ceq 'PASS' -and
              [int]$modelAudit.registered -gt 0 -and
              [int]$modelAudit.loaded -eq [int]$modelAudit.registered -and
              $null -ne $modelAudit.failed -and [int]$modelAudit.failed -eq 0 -and
              $null -ne $modelAudit.errors -and @($modelAudit.errors).Count -eq 0 -and
              [string]$report.assetRegistryAudit.status -ceq 'PASS' -and
              $mediaOk -and
              [string]$report.assetAudit.features.status -ceq 'PASS' -and
              $report.summary.abortedEarly -eq $false -and
              [int]$report.summary.plannedSteps -gt 0 -and
              [int]$report.summary.completedSteps -eq [int]$report.summary.plannedSteps -and
              @($report.errors).Count -eq 0)
            # [외부 자산 처리 중] 게임 소스·등록부에 없는 ContentId가 Roblox 서버에서 아직 변환 중이라는 문구는
            # 게임 결함이 아니다(아바타 등 외부 콘텐츠, 실행 44899533993). 게임이 참조하는 ID면 그대로 실패로 남긴다.
            $foreignProcessing = {
              param($m)
              if ($m -notmatch 'rbxassetid://([0-9]{6,20}) failed due to: Asset content representation is being generated') { return $false }
              $assetId = $Matches[1]
              if (-not $script:gameRefCache) { $script:gameRefCache = @{} }
              if (-not $script:gameRefCache.ContainsKey($assetId)) {
                $hit = Get-ChildItem -LiteralPath ("main/roblox-games/" + $env:CAP_GAME) -Recurse -File -Include *.luau,*.json -ErrorAction SilentlyContinue |
                  Select-String -SimpleMatch -Pattern $assetId -List -ErrorAction SilentlyContinue | Select-Object -First 1
                $script:gameRefCache[$assetId] = [bool]$hit
                Write-Host "STUDIO_EXTERNAL_ASSET_PROCESSING=$assetId referencedByGame=$([bool]$hit)"
              }
              return (-not $script:gameRefCache[$assetId])
            }
            $benign = @($msgs | Where-Object {
              (& $foreignProcessing $_) -or
              $_ -match 'Place universe not found' -or
              ($mediaOk -and ($_ -match '^\[QA\] FAIL asset .* status=TIMEOUT_16S' -or $_ -match 'SERVER_PRELOAD_UNRESPONSIVE')) -or
              ($modelRecovered -and $_ -cmatch '^\[MareEssentia\] 우선 모델 불러오기 제한시간 도달\s+[1-9][0-9]*\s*$')
            })
            if ($modelRecovered -and @($msgs | Where-Object { $_ -cmatch '^\[MareEssentia\] 우선 모델 불러오기 제한시간 도달\s+[1-9][0-9]*\s*$' }).Count -gt 0) {
              Write-Host "STUDIO_PRIORITY_MODEL_DELAY_RECOVERED=$($modelAudit.loaded)/$($modelAudit.registered)"
            }
            -not ($msgs.Count -gt 0 -and $benign.Count -eq $msgs.Count)
          })
          # [자동 복구] 콘솔에서 확인한 게임 코드 오류를 기존 복구 마커로 넘긴다.
          $consoleErrors = @($report.consoleCapture.errors | Where-Object {
            $_.type -eq 'studio-console-error' -and -not [string]::IsNullOrWhiteSpace([string]$_.signature)
          })
          Write-Host "STUDIO_QA_CONSOLE_CAPTURED=$($report.consoleCapture.captured)"
          Write-Host "STUDIO_QA_CONSOLE_ERRORS=$($consoleErrors.Count)"
          $evidence = @($consoleErrors | ForEach-Object { [string]$_.signature })
          if (-not $qaStage) { $evidence += @($runtimeRows | ForEach-Object { [string]$_.out }) }
          $sourceFile = ''
          if ($evidence.Count -gt 0) {
            $prefix = "roblox-games/$($env:CAP_GAME)/"
            $paths = @($evidence | ForEach-Object {
              [regex]::Matches($_, [regex]::Escape($prefix) + '[A-Za-z0-9_./-]+\.luau:[0-9]+') |
                ForEach-Object { $_.Value -replace ':[0-9]+$','' }
            } | Sort-Object -Unique)
            # Studio 스택의 인스턴스 경로는 동일 프로젝트의 Rojo 소스맵으로만 변환한다.
            $scriptPaths = @($consoleErrors | ForEach-Object {
              [regex]::Matches([string]$_.signature, "(?:Script '([A-Za-z0-9_.-]+)', Line [0-9]+|(?<![A-Za-z0-9_./-])((?:Players|ReplicatedStorage|ServerScriptService|StarterPlayer)\.[A-Za-z0-9_.-]+):[0-9]+)") |
                ForEach-Object { if ($_.Groups[1].Success) { $_.Groups[1].Value } else { $_.Groups[2].Value } }
            } | ForEach-Object { $_ -replace '^Players\.[^.]+\.PlayerScripts\.', 'StarterPlayer.StarterPlayerScripts.' } | Sort-Object -Unique)
            if ($scriptPaths.Count -gt 0) {
              $rojo = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'rojo-bin') -Recurse -Filter rojo.exe | Select-Object -First 1 -ExpandProperty FullName
              if ($rojo) {
                $mapFile = Join-Path $env:RUNNER_TEMP 'studio-repair-sourcemap.json'
                $gameRoot = (Resolve-Path -LiteralPath ("main/" + $prefix)).Path
                Push-Location -LiteralPath $gameRoot
                try {
                  & $rojo sourcemap default.project.json --output $mapFile
                  if ($LASTEXITCODE -eq 0) {
                    $tree = Get-Content -LiteralPath $mapFile -Raw | ConvertFrom-Json
                    $nodes = [Collections.Generic.Queue[object]]::new()
                    foreach ($child in $tree.children) { $nodes.Enqueue(@{ node = $child; name = [string]$child.name }) }
                    while ($nodes.Count -gt 0) {
                      $entry = $nodes.Dequeue()
                      if ($scriptPaths -ccontains $entry.name) {
                        foreach ($file in $entry.node.filePaths) {
                          $relative = ([string]$file).Replace('\','/')
                          if ($relative -match '^[A-Za-z0-9_./-]+\.luau$' -and -not $relative.Contains('..')) {
                            $paths += $prefix + $relative
                          }
                        }
                      }
                      foreach ($child in $entry.node.children) {
                        $nodes.Enqueue(@{ node = $child; name = $entry.name + '.' + $child.name })
                      }
                    }
                  }
                } catch {
                  Write-Warning 'STUDIO_REPAIR_SOURCEMAP_UNAVAILABLE'
                } finally { Pop-Location }
              }
            }
            $paths = @($paths | Sort-Object -Unique)
            if ($paths.Count -eq 1 -and $scriptPaths.Count -le 1 -and $paths[0].Length -le 160 -and -not $paths[0].Contains('..') -and
                [string]$report.sourceRevision -eq $env:GITHUB_SHA -and (Test-Path -LiteralPath ("main/" + $paths[0]) -PathType Leaf)) {
              $qaStage = 'STUDIO_GAME_SOURCE'
              $qaSignature = 'STUDIO_OBSERVED_SOURCE_RUNTIME_ERROR'
              $sourceFile = $paths[0]
            } elseif (-not $qaStage) {
              $qaStage = 'STUDIO_GAME_RUNTIME'
              $qaSignature = 'STUDIO_OBSERVED_RUNTIME_WARNINGS'
            }
          }
          # [검사] 실제 스크린샷과 보고서 단계·클릭·자산 감사 항목을 각각 기록한다.
          $frames = @(Get-ChildItem -Path $out -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in @('.png', '.jpg', '.jpeg') } | Sort-Object FullName)
          $rawReport = Get-Content -LiteralPath $reportFile -Raw -Encoding UTF8 | ConvertFrom-Json
          $sum = $rawReport.summary
          $runId = [string]$env:GITHUB_RUN_ID
          if ($runId -notmatch '^[0-9]+$') { throw 'STUDIO_RUN_ID_INVALID' }
          $kind = 'other'
          if ([string]$env:CAP_SCRIPT -match 'mare-qa-click\.json$') { $kind = 'full' }
          elseif ([string]$env:CAP_SCRIPT -match 'autopilot') { $kind = 'autopilot' }
          $stepsState = 'NOT_CHECKED'
          if ([int]$sum.plannedSteps -gt 0) {
            $stepsState = 'FAIL'
            if ([int]$sum.completedSteps -eq [int]$sum.plannedSteps -and $studioNodeExitCode -eq 0) { $stepsState = 'PASS' }
          }
          $clicksState = 'NOT_CHECKED'
          if ([int]$sum.plannedClicks -gt 0) {
            $clicksState = 'FAIL'
            if (([int]$sum.successfulClicks + [int]$sum.skippedOptionalClicks) -eq [int]$sum.plannedClicks) { $clicksState = 'PASS' }
          }
          $framesState = 'NOT_CHECKED'
          if ([int]$sum.plannedFrames -gt 0) {
            $framesState = 'FAIL'
            if ([int]$sum.capturedFrames -ge [int]$sum.plannedFrames -and $frames.Count -ge [int]$sum.plannedFrames) { $framesState = 'PASS' }
          }
          if ($frames.Count -lt 1 -or $framesState -eq 'FAIL') {
            if (-not $qaStage) { $qaStage = 'STUDIO_EXECUTION'; $qaSignature = 'STUDIO_SCREENSHOTS_INCOMPLETE' }
          }
          $consoleState = 'NOT_CHECKED'
          if ($rawReport.consoleCapture -and $rawReport.consoleCapture.captured -eq $true) {
            $consoleState = 'PASS'
            if ([int]$rawReport.consoleCapture.errorCount -gt 0 -or @($rawReport.consoleCapture.errors).Count -gt 0) { $consoleState = 'FAIL' }
          }
          $modelState = 'NOT_CHECKED'
          $mediaState = 'NOT_CHECKED'
          $featureState = 'NOT_CHECKED'
          if ($rawReport.assetAudit) {
            if ($rawReport.assetAudit.models.status) { $modelState = [string]$rawReport.assetAudit.models.status }
            if ($rawReport.assetAudit.registered.status) { $mediaState = [string]$rawReport.assetAudit.registered.status }
            if ($rawReport.assetAudit.features.status) { $featureState = [string]$rawReport.assetAudit.features.status }
          }
          if ($kind -eq 'full' -and ($modelState -eq 'NOT_CHECKED' -or $mediaState -eq 'NOT_CHECKED' -or $featureState -eq 'NOT_CHECKED')) {
            if (-not $qaStage) { $qaStage = 'STUDIO_EXECUTION'; $qaSignature = 'STUDIO_FULL_AUDIT_INCOMPLETE' }
          }
          $captureChecks = @()
          foreach ($entry in @($rawReport.log | Where-Object { $_.capture })) {
            $captureName = [string]$entry.capture
            $matches = @($frames | Where-Object { $_.BaseName -eq $captureName -or $_.BaseName.StartsWith($captureName + '-') })
            $captureChecks += [ordered]@{ name = $captureName; status = $(if ($matches.Count -gt 0) { 'PASS' } else { 'FAIL' }); files = @($matches | ForEach-Object { $_.Name }) }
          }
          if (@($captureChecks | Where-Object { $_.status -eq 'FAIL' }).Count -gt 0 -and -not $qaStage) {
            $qaStage = 'STUDIO_EXECUTION'
            $qaSignature = 'STUDIO_CAPTURE_STEP_MISSING'
          }
          Write-Host "STUDIO_QA_FRAMES=$($frames.Count)"
          Write-Host "STUDIO_QA_CHECKLIST_STEPS=$stepsState CLICKS=$clicksState FRAMES=$framesState CONSOLE=$consoleState MODELS=$modelState MEDIA=$mediaState FEATURES=$featureState"
          
          # [기존 아카이브] 이전 무료 모델의 사용량과 재시도 제한을 보존한다.
          $designBranch = "nemotron-mare-design-$env:GITHUB_RUN_ID"
          # [저장] 기존 report.json·checks.json 및 회차별 검사 기록을 보존한다.
          # 사진 원본은 Git 이력에 추가하지 않고 1일 만료 결과물에만 저장한다.
          $dst = Join-Path $env:RUNNER_TEMP 'mare-publish'
          $remote = "https://x-access-token:$($env:GH_TOKEN)@github.com/$($env:GITHUB_REPOSITORY).git"
          Remove-Item -Recurse -Force $dst -ErrorAction SilentlyContinue
          New-Item -ItemType Directory $dst | Out-Null
          Push-Location $dst
          try {
            git init -q
            git config user.name 'mare-capture-bot'
            git config user.email 'mare-capture-bot@users.noreply.github.com'
            & git fetch -q --depth=1 $remote "refs/heads/$($env:CAP_GAME)-studio-frames"
            if ($LASTEXITCODE -ne 0) { throw 'STUDIO_HISTORY_FETCH_FAILED' }
            & git checkout -q --detach FETCH_HEAD
            if ($LASTEXITCODE -ne 0) { throw 'STUDIO_HISTORY_CHECKOUT_FAILED' }
            # [디자인 자동 배치] 기존 Studio 브랜치에서 직전 모델 사용량과 쿨다운을 읽는다.
            $priorDesign = Join-Path $dst 'nemotron-design-review.json'
            $priorVisualFeedback = Join-Path $dst 'design-visual-comparison.json'
            if ($env:STUDIO_CANDIDATE_REF -eq '' -and $qaStage -eq '' -and $env:CAP_GAME -eq 'mare-essentia' -and
                [string]$env:CAP_SCRIPT -match 'mare-qa-click\.json$') {
              $checkoutRoot = Join-Path $env:GITHUB_WORKSPACE 'main'
              & git -C $checkoutRoot switch -q -c $designBranch
              if ($LASTEXITCODE -ne 0) { throw 'DESIGN_FREE_CANDIDATE_BRANCH_INVALID' }
              & node (Join-Path $checkoutRoot 'tools/company-nemotron-design-review.mjs') "--root=$checkoutRoot" "--frames=$out" "--previous=$priorDesign" "--feedback=$priorVisualFeedback" "--out=$(Join-Path $out 'nemotron-design-review.json')"
              if ($LASTEXITCODE -ne 0) { Write-Host 'DESIGN_FREE_REVIEW=UNVERIFIED' }
            }
            $scriptFile = if ($env:CAP_SCRIPT_FILE) { $env:CAP_SCRIPT_FILE } else { Join-Path $env:GITHUB_WORKSPACE ("main/" + $env:CAP_SCRIPT) }
            # [증거] 단계별 통과·실패, 감사 판정, 촬영 파일과 SHA256 비교를 원본 report에 연결한다.
            # SHA256 비교는 파일 변경 탐지이며 사진 품질의 개선·악화 판정으로 표시하지 않는다.
            $archive = @'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const [dst, out, runId, scriptName, scriptFile, repo, qaStage, qaSignature] = process.argv.slice(2);
          if (!/^\d{5,}$/.test(runId)) throw Error('STUDIO_ARCHIVE_RUN_ID_INVALID');
          const imageExt = /\.(?:png|jpe?g)$/i;
          const indexFile = path.join(dst, 'index.json');
          const prior = fs.existsSync(indexFile) ? JSON.parse(fs.readFileSync(indexFile, 'utf8')) : {runs: []};
          const history = Array.isArray(prior.runs) ? prior.runs : [];
          const deep = /\/mare-qa-click\.json$/.test(scriptName.replace(/\\/g, '/'));
          const portBatch = Number(process.env.STUDIO_PORT_BATCH || 0);
          const kind = portBatch ? (portBatch <= 19 ? 'port-survey' : portBatch <= 79 ? 'field-survey' : portBatch <= 106 ? 'naval-survey' : portBatch <= 146 ? 'feature-survey' : 'port-variant-survey') : deep ? 'deep' : (/autopilot/i.test(scriptName) ? 'autopilot' : 'studio');
          const previous = history.find(row => row.kind === kind && (!portBatch || row.portBatch === portBatch));
          const report = JSON.parse(fs.readFileSync(path.join(out, 'report.json'), 'utf8').replace(/^\uFEFF/, ''));
          const summary = report.summary || {};
          const errors = Array.isArray(report.errors) ? report.errors : ['STUDIO_ERRORS_INVALID'];
          const script = fs.existsSync(scriptFile) && fs.statSync(scriptFile).isFile()
            ? JSON.parse(fs.readFileSync(scriptFile, 'utf8')) : [];
          const frames = fs.readdirSync(out).filter(name => imageExt.test(name)).sort();
          // [스크린샷 실물 검증] JPG/PNG 실제 바이트에서 해상도를 읽는다. 파일명/해시만으로 화면 통과 처리 금지.
          const imageDimensions = name => {
            const bytes = fs.readFileSync(path.join(out, name));
            let width = 0, height = 0;
            if (bytes.length >= 24 && bytes.subarray(0, 8).equals(Buffer.from([137,80,78,71,13,10,26,10]))) {
              width = bytes.readUInt32BE(16); height = bytes.readUInt32BE(20);
            } else if (bytes.length >= 8 && bytes[0] === 255 && bytes[1] === 216) {
              for (let pos = 2; pos + 7 < bytes.length;) {
                if (bytes[pos] !== 255) { pos++; continue; }
                while (pos < bytes.length && bytes[pos] === 255) pos++;
                if (pos >= bytes.length) break;
                const marker = bytes[pos++];
                if (marker === 0xDA || marker === 0xD9) break;
                if (marker === 0x01 || (marker >= 0xD0 && marker <= 0xD7)) continue;
                if (pos + 2 > bytes.length) break;
                const len = bytes.readUInt16BE(pos);
                if (len < 2 || pos + len > bytes.length) break;
                if ((marker >= 0xC0 && marker <= 0xC3 || marker >= 0xC5 && marker <= 0xC7 ||
                     marker >= 0xC9 && marker <= 0xCB || marker >= 0xCD && marker <= 0xCF) && len >= 7) {
                  height = bytes.readUInt16BE(pos + 3);
                  width = bytes.readUInt16BE(pos + 5);
                  break;
                }
                pos += len;
              }
            }
            return {name, bytes: bytes.length, width, height,
              status: bytes.length >= 4096 && width >= 320 && height >= 180 ? 'PASS' : 'FAIL'};
          };
          const frameIntegrity = frames.map(imageDimensions);
          const badFrames = frameIntegrity.filter(row => row.status !== 'PASS');

          const digest = file => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const previousDir = previous && /^runs\/[0-9]+$/.test(previous.path || '')
            ? path.join(dst, previous.path) : dst;
          const previousChecksFile = path.join(previousDir, 'checks.json');
          const previousChecks = fs.existsSync(previousChecksFile) ? JSON.parse(fs.readFileSync(previousChecksFile, 'utf8')) : {};
          const previousHashes = new Map((previousChecks.screenshotComparison || []).map(row => [row.name, row.sha256]));
          const comparisons = frames.map(name => {
            const currentHash = digest(path.join(out, name));
            const baseline = previousHashes.get(name) || '';
            return {name, sha256: currentHash, comparison: baseline
              ? (baseline === currentHash ? 'SAME_BYTES' : 'CHANGED_BYTES') : 'NO_BASELINE'};
          });
          const rows = script.map((step, n) => {
            const executed = n < Number(summary.completedSteps || 0);
            const failed = errors.some(value => String(value).startsWith('step' + n + ':'));
            const skipped = (report.log || []).some(row => row.step === n && row.at === 'OPTIONAL_SKIPPED');
            const captures = step.type === 'capture'
              ? frames.filter(name => name.startsWith(String(step.name || 'cap' + n) + '-')) : [];
            return {step: n, type: step.type, name: step.name || step.label || step.text || '',
              status: !executed ? 'NOT_RUN' : failed || (step.type === 'capture' && !captures.length) ? 'FAIL' : skipped ? 'SKIPPED' : 'PASS',
              screenshots: captures};
          });
          const audits = Object.fromEntries(['models', 'registered', 'features'].map(key =>
            [key, report.assetAudit?.[key]?.status || (deep ? 'UNVERIFIED' : 'NOT_RUN')]));
          audits.registry = report.assetRegistryAudit?.status || (deep ? 'UNVERIFIED' : 'NOT_RUN');
          const requiredDone = frameIntegrity.every(row => row.status === 'PASS') && frames.length > 0 && frames.length >= Number(summary.plannedFrames)
            && Number(summary.completedSteps) === Number(summary.plannedSteps)
            && Number(summary.capturedFrames) >= Number(summary.plannedFrames)
            && Number(summary.successfulClicks || 0) + Number(summary.skippedOptionalClicks || 0)
              === Number(summary.plannedClicks || 0);
          let result = qaStage || errors.length || !requiredDone || rows.some(row => row.status === 'FAIL') ? 'FAIL' : 'PASS';
          if (deep && result === 'PASS' && Object.values(audits).some(status => status !== 'PASS'))
            result = 'UNVERIFIED';
          const captureArtifact = {name: 'studio-frames-' + runId, retentionDays: 1, runId};
          const link = 'https://github.com/' + repo + '/actions/runs/' + runId;
          const checks = {runId, kind, portBatch: portBatch || null, sourceRevision: report.sourceRevision || '', result, captureArtifact,
            failureStage: qaStage || null, failureSignature: qaSignature || null,
            summary, errors, audits, steps: rows,
            screenshotComparison: comparisons.map(row => ({...row, url: link})),
            screenshotFrameAudit: {checked: frameIntegrity.length, invalid: badFrames.length,
              images: frameIntegrity, meaning: 'Real JPEG/PNG headers, dimensions and byte lengths only; artistic quality requires visual review'},
            comparisonMeaning: 'SHA256 byte equality only; not visual quality evidence',
            previousRunId: previous?.runId || null};
