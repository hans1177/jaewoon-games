            }
          }
          fs.writeFileSync(path.join(out, 'checks.json'), JSON.stringify(checks, null, 2) + '\n');
          const record = {runId, kind, portBatch: portBatch || null, at: new Date().toISOString(), sourceRevision: checks.sourceRevision, captureArtifact,
            result, frames: frames.length, changedFrames: comparisons.filter(row => row.comparison === 'CHANGED_BYTES').length,
            summary, path: 'runs/' + runId};
