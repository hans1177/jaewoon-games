            # [완료 확정] 실제 저장한 검사 증거가 PASS가 아니면 Actions 성공으로 덮지 않는다.
            if ([string]$storedChecks.result -ne 'PASS' -and -not $qaStage) {
              $qaStage = 'STUDIO_EXECUTION'
              $qaSignature = 'STUDIO_FULL_AUDIT_INCOMPLETE'
            }
            git add -A
            git commit -q -m "studio frames $($env:CAP_GAME) run $env:GITHUB_RUN_ID"
            if ($LASTEXITCODE -ne 0) { throw 'STUDIO_ARCHIVE_COMMIT_FAILED' }
            # 이력 보존 브랜치는 강제 갱신하지 않는다. 동시 변경이 있으면 안전하게 실패한다.
            & git push -q $remote "HEAD:refs/heads/$($env:CAP_GAME)-studio-frames"
            if ($LASTEXITCODE -ne 0) { throw 'STUDIO_ARCHIVE_PUSH_FAILED' }
