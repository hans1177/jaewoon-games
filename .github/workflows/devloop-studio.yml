          if (!portBatch) {
            for (const entry of fs.readdirSync(dst, {withFileTypes: true})) {
              if (entry.isFile() && (imageExt.test(entry.name) || ['report.json', 'checks.json'].includes(entry.name)))
                fs.rmSync(path.join(dst, entry.name));
            }
            for (const entry of fs.readdirSync(out, {withFileTypes: true})) {
              if (entry.isFile() && !imageExt.test(entry.name)) fs.copyFileSync(path.join(out, entry.name), path.join(dst, entry.name));
            }
            fs.writeFileSync(path.join(dst, 'checks.json'), JSON.stringify(checks, null, 2) + '\n');
          }
          // 기존 회차의 Git 작업 트리 사진만 제거한다. 이미 만들어진 Git 커밋 이력은 강제 변경하지 않는다.
          for (const row of history) {
            if (!/^runs\/[0-9]+$/.test(row.path || '')) continue;
            const oldDir = path.join(dst, row.path);
            if (!fs.existsSync(oldDir)) continue;
