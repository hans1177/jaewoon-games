            lastDeepAt: kept.find(row => row.kind === 'deep')?.at || null, runs: kept}, null, 2) + '\n');
          const gallery = ['# Studio QA screenshot history', '', 'Latest: [screenshots](' + link + ') | [checklist](checks.json) | [history](index.json)', 'Screenshots: 1 day Actions retention. Metadata: 7 days, full 4 runs, others 6 runs, world survey 327 batches', '',
            '| Run | Type | Status | Frames | Changed files |', '|---|---|---|---:|---:|',
