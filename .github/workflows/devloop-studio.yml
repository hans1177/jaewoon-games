                      & git add -- $expectedFiles
                      & git commit -q -m "design(mare): Nemotron visual candidate from Studio $env:GITHUB_RUN_ID"
                      if ($LASTEXITCODE -ne 0) { throw 'NEMOTRON_CANDIDATE_COMMIT_FAILED' }
                      & git push -q $remote "HEAD:refs/heads/$designBranch"
                      if ($LASTEXITCODE -ne 0) { throw 'NEMOTRON_CANDIDATE_PUSH_FAILED' }
                      & gh pr create --base main --head $designBranch --title "design(mare): Free visual specialist candidate $env:GITHUB_RUN_ID" --body "Source-bound free visual specialists from exact Studio source $env:GITHUB_SHA. Exact visual expressions only. Node regression and Rojo build passed. Independent candidate Studio evidence and native security QA required before canonical main integration; F0-F9 and publish remain independent."
                      if ($LASTEXITCODE -ne 0) {
