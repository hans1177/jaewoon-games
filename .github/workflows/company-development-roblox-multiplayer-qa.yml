name: Company DEVELOPMENT_CONFIRMED Roblox Multiplayer QA

on:
  workflow_run:
    workflows: ["Company DEVELOPMENT_CONFIRMED Roblox Post-Runtime QA"]
    types: [completed]
  workflow_dispatch:
    inputs:
      game_id:
        description: Optional exact Roblox gameId to validate
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: company-development-roblox-multiplayer-qa
  cancel-in-progress: false

env:
  COMPANY_RUNTIME_BRANCH: company-runtime
  ROBLOX_AUTHENTICATED_RUNNER_WIP_MAX: '3'

jobs:
  multiplayer-plan:
    name: resolve Roblox multiplayer QA work
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      count: ${{ steps.targets.outputs.count }}
      matrix: ${{ steps.targets.outputs.matrix }}
      targets_json: ${{ steps.targets.outputs.targets_json }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          fetch-tags: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify multiplayer QA contract
        run: |
          set -euo pipefail
          node --test qa/company-development-roblox-multiplayer-qa.test.mjs
      - name: Fetch canonical runtime queue
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$COMPANY_RUNTIME_BRANCH"
          git show "origin/$COMPANY_RUNTIME_BRANCH:development-queue.json" > /tmp/development-queue.json
          rm -rf /tmp/roblox-design
          mkdir -p /tmp/roblox-design
          git archive "origin/$COMPANY_RUNTIME_BRANCH" design | tar -x -C /tmp/roblox-design
      - name: Resolve exact-artifact multiplayer targets
        id: targets
        env:
          REQUESTED_GAME_ID: ${{ inputs.game_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const q=JSON.parse(fs.readFileSync('/tmp/development-queue.json','utf8'));
          const requested=String(process.env.REQUESTED_GAME_ID||'').trim();
          const multiplayerModes=new Set(['COOP','COMPETITIVE','HYBRID']);
          const findLatestDesign=(gameId)=>{
            const root=path.join('/tmp/roblox-design/design',gameId);
            if(!fs.existsSync(root))return null;
            const files=[];
            const walk=dir=>{for(const e of fs.readdirSync(dir,{withFileTypes:true})){const p=path.join(dir,e.name);if(e.isDirectory())walk(p);else if(e.isFile()&&e.name==='design-revised.json')files.push(p);}};
            walk(root);files.sort().reverse();
            if(!files.length)return null;
            try{return JSON.parse(fs.readFileSync(files[0],'utf8'));}catch{return null;}
          };
          const rows=[];
          for(const item of q.items||[]){
            if(requested&&item.gameId!==requested)continue;
            if(String(item.productionClass||'').toUpperCase()!=='DEVELOPMENT_CONFIRMED')continue;
            if(String(item.selectedPlatform||item.targetPlatform||'').toUpperCase()!=='ROBLOX')continue;
            const revision=String(item.robloxSourceCommit||'').trim();
            const artifact=String(item.robloxBuildArtifactIdentity||'').trim();
            const exact=item.robloxBuildOrPackagePassed===true&&item.robloxBuildSourceRevision===revision&&artifact.startsWith('sha256:')&&item.robloxExactRevisionPassed===true;
            const prior=item.robloxRuntimePassed===true&&item.robloxServerClientBoundaryPassed===true&&item.robloxMobileControlUiPassed===true&&item.robloxIndependentQaPassed===true&&item.robloxRegressionPassed===true;
            const design=findLatestDesign(item.gameId);
            const rawMode=design?.content?.multiplayerMode??design?.content?.multiplayer?.mode??design?.multiplayerMode??'';
            const mode=String(rawMode||'').trim().toUpperCase();
            if(!exact||!prior||!multiplayerModes.has(mode)||item.robloxMultiplayerQaPassed===true)continue;
            rows.push({gameId:item.gameId,gameName:item.gameName||item.gameId,sourceRevision:revision,artifactIdentity:artifact,multiplayerMode:mode});
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`count=${rows.length}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`matrix=${JSON.stringify({include:rows})}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`targets_json=${JSON.stringify(rows)}\n`);
          console.log(`ROBLOX_MULTIPLAYER_QA_TARGET_COUNT=${rows.length}`);
          console.log(`ROBLOX_MULTIPLAYER_QA_TARGET_IDS=${rows.map(x=>x.gameId).join(',')||'NONE'}`);
          console.log('ROBLOX_MULTIPLAYER_QA_CLIENTS_REQUIRED=2');
          console.log('ROBLOX_MULTIPLAYER_QA_EXACT_ARTIFACT_REQUIRED=YES');
          NODE

  multiplayer-worker:
    name: Roblox real two-client QA ${{ matrix.gameId }}
    needs: multiplayer-plan
    if: needs.multiplayer-plan.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.multiplayer-plan.outputs.matrix) }}
    runs-on: [self-hosted, Windows, X64, roblox-studio-authenticated]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          fetch-tags: false

      - name: Resolve original immutable Roblox package by SHA256
        id: package
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_ID: ${{ matrix.gameId }}
          EXPECTED_ARTIFACT: ${{ matrix.artifactIdentity }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "development-roblox-package-$env:GAME_ID"
          $response = gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts?name=$name&per_page=100" | ConvertFrom-Json
          $candidates = @($response.artifacts | Where-Object { -not $_.expired } | Sort-Object created_at -Descending)
          if ($candidates.Count -eq 0) { throw "No retained package artifact: $name" }
          $matched = $null
          foreach ($artifact in $candidates) {
            $root = Join-Path $env:RUNNER_TEMP "roblox-multiplayer-package-$($artifact.id)"
            Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $root | Out-Null
            gh run download "$($artifact.workflow_run.id)" -n $name -D $root
            $place = Get-ChildItem -Path $root -Recurse -File -Filter *.rbxlx | Select-Object -First 1
            if (-not $place) { continue }
            $hash = (Get-FileHash -Algorithm SHA256 $place.FullName).Hash.ToLowerInvariant()
            if ("sha256:$hash" -eq $env:EXPECTED_ARTIFACT.ToLowerInvariant()) {
              $matched = [PSCustomObject]@{ place=$place.FullName; run=$artifact.workflow_run.id; hash=$hash }
              break
            }
          }
          if (-not $matched) { throw "No retained package matches $env:EXPECTED_ARTIFACT" }
          "place_file=$($matched.place)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "artifact_run=$($matched.run)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host 'ROBLOX_MULTIPLAYER_IMMUTABLE_ARTIFACT_BIND=PASS'
          Write-Host "ROBLOX_MULTIPLAYER_PACKAGE_SHA256=$($matched.hash)"

      - name: Resolve authenticated local Roblox Studio
        id: studio
        if: steps.package.outcome == 'success'
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $studio = $null
          $roots = @(
            "$env:LOCALAPPDATA\Roblox\Versions",
            "$env:PROGRAMFILES\Roblox\Versions",
            "${env:ProgramFiles(x86)}\Roblox\Versions"
          ) | Where-Object { $_ -and (Test-Path $_) }
          foreach ($root in $roots) {
            $candidate = Get-ChildItem -Path $root -Recurse -File -Filter RobloxStudioBeta.exe -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if ($candidate) { $studio = $candidate; break }
          }
          if (-not $studio) { throw 'RobloxStudioBeta.exe not found in authenticated local profile' }
          $running = @(Get-Process -Name RobloxStudioBeta -ErrorAction SilentlyContinue)
          if ($running.Count -gt 0) { throw 'Roblox Studio is already running; multiplayer QA requires an idle Studio profile' }
          "studio_exe=$($studio.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host 'ROBLOX_MULTIPLAYER_STUDIO_PROFILE=PASS'

      - name: Run exact-artifact real two-client multiplayer QA
        id: multiplayer
        if: steps.package.outcome == 'success' && steps.studio.outcome == 'success'
        continue-on-error: true
        env:
          STUDIO_EXE: ${{ steps.studio.outputs.studio_exe }}
          PLACE_FILE: ${{ steps.package.outputs.place_file }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $script = (Resolve-Path 'tools/company-development-roblox-multiplayer-qa.luau').Path
          $out = Join-Path $env:RUNNER_TEMP 'roblox-multiplayer-qa-output.log'
          $stdout = Join-Path $env:RUNNER_TEMP 'roblox-multiplayer-qa-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'roblox-multiplayer-qa-stderr.log'
          Remove-Item -Force $out,$stdout,$stderr -ErrorAction SilentlyContinue
          $argLine = "--task RunScript --localPlaceFile `"$env:PLACE_FILE`" --runScriptFile `"$script`" --outputFile `"$out`" --quitAfterExecution"
          $p = Start-Process -FilePath $env:STUDIO_EXE -ArgumentList $argLine -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $p.WaitForExit(240000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'Roblox two-client multiplayer QA timeout'
          }
          $combined = ''
          if (Test-Path $out) { $combined += (Get-Content $out -Raw) }
          if (Test-Path $stdout) { $combined += "`n" + (Get-Content $stdout -Raw) }
          if (Test-Path $stderr) { $combined += "`n" + (Get-Content $stderr -Raw) }
          $combined | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'roblox-multiplayer-qa-combined.log')
          Write-Host $combined
          if ($p.ExitCode -ne 0) { throw "Roblox Studio multiplayer QA exited $($p.ExitCode)" }
          if ($combined -notmatch 'ROBLOX_MULTIPLAYER_QA_CLIENTS=2') { throw 'Two-client sentinel missing' }
          if ($combined -notmatch 'ROBLOX_MULTIPLAYER_DISTINCT_PLAYERS=YES') { throw 'Distinct-player sentinel missing' }
          if ($combined -notmatch 'ROBLOX_MULTIPLAYER_SERVER_AUTHORITATIVE_ROUNDTRIP=YES') { throw 'Server-authoritative roundtrip sentinel missing' }
          if ($combined -notmatch 'ROBLOX_MULTIPLAYER_PEER_VISIBILITY=YES') { throw 'Peer visibility sentinel missing' }
          if ($combined -notmatch 'ROBLOX_MULTIPLAYER_QA=PASS') { throw 'Multiplayer QA PASS sentinel missing' }

      - name: Record exact multiplayer QA evidence
        if: always()
        env:
          GAME_ID: ${{ matrix.gameId }}
          SOURCE_REVISION: ${{ matrix.sourceRevision }}
          ARTIFACT_IDENTITY: ${{ matrix.artifactIdentity }}
          MULTIPLAYER_MODE: ${{ matrix.multiplayerMode }}
          ARTIFACT_RUN: ${{ steps.package.outputs.artifact_run }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          STUDIO_OUTCOME: ${{ steps.studio.outcome }}
          MULTIPLAYER_OUTCOME: ${{ steps.multiplayer.outcome }}
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'roblox-multiplayer-qa-evidence'
          $results = Join-Path $root 'results'
          New-Item -ItemType Directory -Force -Path $results | Out-Null
          $pass = $env:PACKAGE_OUTCOME -eq 'success' -and $env:STUDIO_OUTCOME -eq 'success' -and $env:MULTIPLAYER_OUTCOME -eq 'success'
          $failure = if ($env:PACKAGE_OUTCOME -ne 'success') { 'immutable-package-unavailable' } elseif ($env:STUDIO_OUTCOME -ne 'success') { 'roblox-studio-local-profile-unavailable' } elseif (-not $pass) { 'two-client-multiplayer-qa-failed' } else { $null }
          $combined = Join-Path $env:RUNNER_TEMP 'roblox-multiplayer-qa-combined.log'
          $outputSha = if (Test-Path $combined) { (Get-FileHash -Algorithm SHA256 $combined).Hash.ToLowerInvariant() } else { $null }
          $runId = 0
          if ($env:ARTIFACT_RUN -match '^\d+$') { $runId = [int64]$env:ARTIFACT_RUN }
          $evidence = [ordered]@{
            version=1; gameId=$env:GAME_ID; platform='ROBLOX'; checkedAt=(Get-Date).ToUniversalTime().ToString('o');
            sourceRevision=$env:SOURCE_REVISION; artifactIdentity=$env:ARTIFACT_IDENTITY; artifactRunId=$runId; exactRevision=$true;
            actualStudioRuntime=$true; multiplayerMode=$env:MULTIPLAYER_MODE; multiplayerClients=2;
            distinctPlayersPassed=$pass; serverAuthoritativeRoundtripPassed=$pass; peerVisibilityPassed=$pass;
            multiplayerQaPassed=$pass; outputSha256=$outputSha; failure=$failure; authority='roblox-real-studio-multiplayer-qa'
          }
          $safe = $env:GAME_ID -replace '[^a-zA-Z0-9._-]+','-'
          $evidence | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 (Join-Path $results "$safe.multiplayer.json")
          if (Test-Path $combined) { Copy-Item $combined (Join-Path $root 'roblox-multiplayer-qa-combined.log') -Force }
          Write-Host "ROBLOX_MULTIPLAYER_QA=$(if($pass){'PASS'}else{'FAIL'})"
          Write-Host 'ROBLOX_MULTIPLAYER_QA_CLIENTS=2'
          Write-Host 'ROBLOX_RELEASE_CLAIM=NO'

      - name: Upload multiplayer QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-roblox-multiplayer-qa-${{ matrix.gameId }}
          path: ${{ runner.temp }}/roblox-multiplayer-qa-evidence
          retention-days: 14
          if-no-files-found: error

      - name: Enforce multiplayer QA after evidence capture
        if: always()
        env:
          MULTIPLAYER_OUTCOME: ${{ steps.multiplayer.outcome }}
        shell: powershell
        run: |
          if ($env:MULTIPLAYER_OUTCOME -ne 'success') { Write-Host 'ROBLOX_MULTIPLAYER_QA=FAIL'; exit 1 }
          Write-Host 'ROBLOX_MULTIPLAYER_QA=PASS'
          Write-Host 'ROBLOX_MULTIPLAYER_QA_CLIENTS=2'
          Write-Host 'ROBLOX_RELEASE_CLAIM=NO'

  multiplayer-persist:
    name: persist exact Roblox multiplayer QA evidence
    needs: [multiplayer-plan, multiplayer-worker]
    if: always() && needs.multiplayer-plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: company-runtime-writer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: company-runtime
          fetch-depth: 1
          fetch-tags: false
      - name: Download multiplayer QA checkpoints
        if: needs.multiplayer-plan.outputs.count != '0'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: development-roblox-multiplayer-qa-*
          path: /tmp/roblox-multiplayer-qa-batch
          merge-multiple: true
      - name: Persist exact multiplayer QA state only
        if: needs.multiplayer-plan.outputs.count != '0'
        env:
          EXPECTED_TARGETS_JSON: ${{ needs.multiplayer-plan.outputs.targets_json }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$COMPANY_RUNTIME_BRANCH"
          git reset --hard "origin/$COMPANY_RUNTIME_BRANCH"
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const queue=JSON.parse(fs.readFileSync('development-queue.json','utf8'));
          const expected=JSON.parse(process.env.EXPECTED_TARGETS_JSON||'[]');
          const root='/tmp/roblox-multiplayer-qa-batch';
          const files=[];
          const walk=dir=>{for(const e of fs.readdirSync(dir,{withFileTypes:true})){const p=path.join(dir,e.name);if(e.isDirectory())walk(p);else if(e.isFile()&&e.name.endsWith('.multiplayer.json'))files.push(p);}};
          if(fs.existsSync(root))walk(root);
          const results=files.sort().map(file=>JSON.parse(fs.readFileSync(file,'utf8').replace(/^\uFEFF/,'')));
          const byId=new Map(results.map(x=>[x.gameId,x]));
          const stamp=new Date().toISOString();let pass=0,fail=0;
          console.log(`ROBLOX_MULTIPLAYER_QA_CHECKPOINT_FILES=${files.length}`);
          for(const target of expected){
            const item=(queue.items||[]).find(x=>x.gameId===target.gameId);if(!item)throw new Error(`queue item missing: ${target.gameId}`);
            const r=byId.get(target.gameId);
            const exact=r?.sourceRevision===item.robloxSourceCommit&&r?.artifactIdentity===item.robloxBuildArtifactIdentity&&r?.exactRevision===true;
            const prior=item.robloxRuntimePassed===true&&item.robloxServerClientBoundaryPassed===true&&item.robloxMobileControlUiPassed===true&&item.robloxIndependentQaPassed===true&&item.robloxRegressionPassed===true&&item.robloxExactRevisionPassed===true;
            const mode=String(target.multiplayerMode||'').toUpperCase();
            const modeMatch=r?.multiplayerMode===mode&&['COOP','COMPETITIVE','HYBRID'].includes(mode);
            const multiplayerPass=exact&&prior&&modeMatch&&r?.actualStudioRuntime===true&&r?.multiplayerClients===2&&r?.distinctPlayersPassed===true&&r?.serverAuthoritativeRoundtripPassed===true&&r?.peerVisibilityPassed===true&&r?.multiplayerQaPassed===true;
            item.robloxMultiplayerMode=mode;
            item.robloxMultiplayerApplicable=true;
            item.robloxMultiplayerQaEvidence=r||null;
            item.robloxMultiplayerQaPassed=multiplayerPass;
            item.robloxMultiplayerQaPassedAt=multiplayerPass?stamp:null;
            item.robloxFinalReviewPassed=false;
            item.robloxFinalReviewPassedAt=null;
            item.robloxFailureStage='FINAL_REVIEW';
            item.robloxFailureSignature=multiplayerPass?'ROBLOX_FINAL_REVIEW_PENDING':(r?.failure||'ROBLOX_MULTIPLAYER_QA_FAILED');
            item.routingBlockers=[multiplayerPass?'roblox-final-review-pending':'roblox-multiplayer-qa-failed'];
            if(item.executionEvidence){
              item.executionEvidence.failureStage='FINAL_REVIEW';
              item.executionEvidence.failureSignature=item.robloxFailureSignature;
            }
            item.updatedAt=stamp;
            if(multiplayerPass)pass++;else fail++;
          }
          queue.updatedAt=stamp;fs.writeFileSync('development-queue.json',JSON.stringify(queue,null,2)+'\n');
          console.log(`ROBLOX_MULTIPLAYER_QA_PASS_COUNT=${pass}`);
          console.log(`ROBLOX_MULTIPLAYER_QA_FAIL_COUNT=${fail}`);
          console.log('ROBLOX_EXISTING_RUNTIME_MOBILE_REGRESSION_EVIDENCE_PRESERVED=YES');
          console.log('ROBLOX_RELEASE_CLAIM=NO');
          NODE
          git config user.name 'jaewoon-roblox-runtime'
          git config user.email 'actions@users.noreply.github.com'
          git add development-queue.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'runtime: persist Roblox two-client multiplayer QA [skip ci]'
            for attempt in 1 2 3; do
              if git push origin HEAD:"$COMPANY_RUNTIME_BRANCH"; then break; fi
              git fetch --no-tags origin "$COMPANY_RUNTIME_BRANCH"
              git rebase "origin/$COMPANY_RUNTIME_BRANCH" || { git rebase --abort || true; exit 1; }
              sleep $((attempt*2))
            done
          fi
      - name: Multiplayer QA summary
        run: |
          echo 'ROBLOX_MULTIPLAYER_QA_CLIENTS_REQUIRED=2'
          echo 'ROBLOX_MULTIPLAYER_QA_EXACT_ARTIFACT_REQUIRED=YES'
          echo 'ROBLOX_EXISTING_RUNTIME_MOBILE_REGRESSION_EVIDENCE_PRESERVED=YES'
          echo 'ROBLOX_RELEASE_CLAIM=NO'
