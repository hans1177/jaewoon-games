name: Vibe3 Engine Contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Vibe3 machine contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const c=JSON.parse(fs.readFileSync('company-learning/vibe3-engine-contract.json','utf8'));
          if(c.version!==3||c.status!=='OWNER_DIRECT_LOCKED') throw new Error('Vibe3 contract version/status mismatch');
          if(c.relationshipToVibe2!=='INTELLIGENCE_LAYER_UPGRADE_INSIDE_EXISTING_PIPELINE'||c.parallelPipeline!==false) throw new Error('Vibe3 must remain inside canonical pipeline');
          if(c.execution?.defaultIndependentCandidates!==3||c.execution?.defaultMaxRepairAttempts!==3) throw new Error('Vibe3 default tournament/repair contract changed');
          if(c.assetTransformation?.originalImmutable!==true||c.assetTransformation?.variantTournamentRequired!==true) throw new Error('Vibe3 asset transformation safety changed');
          if(c.modelSelection?.route!=='LOCAL_SELF_HOSTED_ONLY'||c.modelSelection?.paidApiAllowed!==false||c.modelSelection?.githubHostedTrainingAllowed!==false) throw new Error('Vibe3 model route policy changed');
          if(c.promotion?.freshAdapterState!=='TRAINED_UNVERIFIED') throw new Error('Vibe3 promotion gate changed');
          console.log('PASS Vibe3 machine contract');
          NODE

      - name: Check Vibe3 JavaScript syntax
        run: |
          node --input-type=module --check < assets/vibe-v3-engine.js
          node --input-type=module --check < assets/vibe-development-ai.js
          node --input-type=module --check < assets/vibe-art-pipeline.js
          node --input-type=module --check < tools/vibe3-trajectory-ingest.mjs
          node --input-type=module --check < tools/vibe3-model-selection.mjs

      - name: Run Vibe3 engine contract tests
        run: node qa/vibe3-engine.test.mjs

      - name: Run Vibe3 trajectory and model-selection tests
        run: node qa/vibe3-trajectory-ingest.test.mjs

      - name: Check trainer syntax
        run: python -m py_compile tools/vibe2-train.py qa/vibe3-trainer-black-box.test.py

      - name: Verify external black-box trainer contract
        run: python qa/vibe3-trainer-black-box.test.py

      - name: Verify no parallel bypass contract
        run: |
          node --input-type=module <<'NODE'
          import { createVibeV3ExecutionContract } from './assets/vibe-v3-engine.js';
          const c=createVibeV3ExecutionContract();
          if(c.integration.parallelPipeline!==false) throw new Error('parallel V3 pipeline forbidden');
          if(c.integration.reuseExistingCheckpoint!==true) throw new Error('existing checkpoint must be reused');
          if(c.integration.reuseExistingQaAndRegression!==true) throw new Error('existing QA/regression must be reused');
          if(c.policy.originalSourceOverwriteBeforeWinnerForbidden!==true) throw new Error('candidate source overwrite before winner is forbidden');
          console.log('PASS Vibe3 canonical integration contract');
          NODE
