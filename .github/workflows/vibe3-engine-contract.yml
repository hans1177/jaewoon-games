name: Vibe3 Engine Contract

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: vibe3-engine-contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Vibe3 machine contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const c=JSON.parse(fs.readFileSync('company-learning/vibe3-engine-contract.json','utf8'));
          if(c.version!==4||c.status!=='OWNER_DIRECT_LOCKED') throw new Error('Vibe3 contract version/status mismatch');
          if(c.relationshipToVibe2!=='INTELLIGENCE_LAYER_UPGRADE_INSIDE_EXISTING_PIPELINE'||c.parallelPipeline!==false) throw new Error('Vibe3 must remain inside canonical pipeline');
          const co=c.robloxCoDevelopmentDesign;
          if(co?.version!==1||co?.status!=='DESIGNED_IMPLEMENTATION_PENDING'||co?.constraints?.preserveExistingPipelineStages!==true||co?.constraints?.noShadowPipeline!==true) throw new Error('roblox co-development design contract missing');
          if(c.execution?.minIndependentCandidates!==3||c.execution?.maxIndependentCandidates!==5||c.execution?.defaultIndependentCandidates!==5||c.execution?.defaultMaxRepairAttempts!==3) throw new Error('Vibe3 Pump tournament/repair contract changed');
          if(c.pumpMode?.enabled!==true||c.pumpMode?.localWeightsRequired!==false||c.pumpMode?.hourlyRefresh!==true) throw new Error('Vibe3 Pump mode disabled');
          if(c.pumpMode?.benchmarkCountsAsTrainingSample!==false||c.pumpMode?.githubHostedModelTrainingAllowed!==false||c.pumpMode?.paidTeacherFallbackAllowed!==false) throw new Error('Vibe3 Pump safety contract changed');
          if(c.pumpMode?.maxFreeTeacherCandidates!==2||c.pumpMode?.teacherCandidateAuthority!=='NON_AUTHORITATIVE') throw new Error('teacher candidate authority changed');
          if(c.verifiedRag?.positiveMemoryRequiresVerifiedEvidence!==true||c.verifiedRag?.failureMemoryIsWarningOnly!==true) throw new Error('verified RAG boundary changed');
          if(c.verifiedRag?.portableContextMayCrossPlatforms!==true||c.verifiedRag?.platformPassEvidenceMayNotTransfer!==true) throw new Error('portable context evidence boundary changed');
          if(!c.verifiedRag?.supportedPlaybooks?.includes('roblox')) throw new Error('Roblox playbook missing');
          const web=c.portableWebLearning;
          if(web?.enabled!==false||web?.sourceEngine!=='DISABLED'||web?.legacyCompatibilityOnly!==true) throw new Error('portable Web learning must remain disabled');
          if(web?.separateCronOrPipelineAllowed===true) throw new Error('disabled Web learning may not create a shadow pipeline');
          if(c.assetTransformation?.originalImmutable!==true||c.assetTransformation?.variantTournamentRequired!==true) throw new Error('Vibe3 asset transformation safety contract changed');
          if(c.modelSelection?.route!=='LOCAL_SELF_HOSTED_ONLY'||c.modelSelection?.paidApiAllowed!==false||c.modelSelection?.githubHostedTrainingAllowed!==false) throw new Error('Vibe3 model route policy changed');
          const roadmap=c.platformRoadmap;
          if(roadmap?.enabled!==true||JSON.stringify(roadmap.priority)!==JSON.stringify(['ROBLOX','UNITY'])) throw new Error('platform roadmap priority changed');
          if(JSON.stringify(roadmap?.priorityTiers)!==JSON.stringify([['ROBLOX','UNITY']])||roadmap?.currentPhase!=='ROBLOX_UNITY_DIRECT_NATIVE_DUAL_DEVELOPMENT'||roadmap?.unityExistingPathPreserved!==true||roadmap?.separatePlatformLearningPipelineAllowed!==false) throw new Error('direct dual-native phase/preservation changed');
          const dual=c.directNativeDualPlatformDevelopment;
          if(dual?.enabled!==true||dual?.requestEitherStartsBoth!==true||JSON.stringify(dual?.targets)!==JSON.stringify(['ROBLOX','UNITY'])||dual?.globalGameCountCap!==null) throw new Error('direct dual-native Vibe contract missing');
          if(dual?.design?.commonCoreRequired!==true||JSON.stringify(dual?.design?.platformProfilesRequired)!==JSON.stringify(['ROBLOX','UNITY'])||dual?.design?.samePlatformDesignReuseForbidden!==true||dual?.design?.minimumContractMayStartDevelopment!==true) throw new Error('dual-platform design contract missing');
          if(dual?.platformRuntimeEvidenceIndependent!==true||dual?.onePlatformFailureDoesNotCancelOther!==true||dual?.internalReleaseFirst!==true||dual?.externalReleaseIndependent!==true) throw new Error('dual-native evidence/release isolation missing');
          if(!fs.existsSync(dual.centralSyncDocument)||!fs.existsSync('tools/company-minimum-design-contract.mjs')||!fs.existsSync('qa/company-minimum-design-contract.test.mjs')) throw new Error('dual-native executable/document bindings missing');
          const uw=c.unityWebFirstStage;
          if(uw?.enabled!==false||uw?.scope!=='DISABLED'||uw?.status!=='DISABLED_BY_OWNER_DIRECTIVE'||uw?.developmentAdmissionAuthority!==false) throw new Error('Unity Web must remain disabled');
          if(c.portableWebLearning?.enabled!==false||c.portableWebLearning?.sourceEngine!=='DISABLED') throw new Error('portable Web learning must remain disabled');
          if(c.promotion?.freshAdapterState!=='TRAINED_UNVERIFIED') throw new Error('Vibe3 promotion gate changed');
          console.log('PASS Vibe3 Pump machine contract with direct Roblox Unity native pairing');
          NODE

      - name: Validate canonical dual-native learning contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pipeline=JSON.parse(fs.readFileSync('company-learning/canonical-learning-pipeline.json','utf8'));
          const web=pipeline.portableWebLearning||{};
          if(web.enabled!==false||web.status!=='LEGACY_DISABLED'||web.sourceEngine!=='DISABLED'||web.developmentAdmissionAuthority!==false)throw new Error('canonical Unity Web learning must remain disabled');
          const dual=pipeline.dualNativeLearning||{};
          if(dual.enabled!==true||JSON.stringify(dual.platforms)!==JSON.stringify(['ROBLOX','UNITY'])||dual.platformEvidenceIndependent!==true||dual.onePlatformEvidenceCannotSatisfyOtherPlatformRuntimeGate!==true)throw new Error('canonical dual-native learning contract missing');
          if(dual.verifiedPatternsFeedSharedV3Memory!==true||dual.separatePlatformShadowPipelineForbidden!==true)throw new Error('dual-native canonical memory boundary changed');
          const playbooks=JSON.parse(fs.readFileSync('company-learning/vibe3-task-playbooks.json','utf8'));
          const ctx=playbooks.directNativePlatformContext||{};
          if(ctx.unityWeb!=='DISABLED'||ctx.requestEitherStartsBoth!==true||ctx.platformEvidenceIndependent!==true)throw new Error('department playbooks not synced to dual-native context');
          const audio=playbooks?.taskTypes?.audio||playbooks?.playbooks?.audio||{};
          if((audio.checklist||[]).includes('unlock-web-audio-after-first-user-gesture'))throw new Error('legacy Web audio lifecycle remains active');
          console.log('PASS canonical dual-native learning and department playbooks');
          NODE

      - name: Validate platform roadmap machine contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('company-learning/platform-release-roadmap.json','utf8'));
          if(r.status!=='OWNER_DIRECT_LOCKED') throw new Error('platform roadmap not owner locked');
          if(JSON.stringify(r.priority)!==JSON.stringify(['ROBLOX','UNITY'])) throw new Error('platform priority mismatch');
          if(r.currentPhase!=='ROBLOX_UNITY_DIRECT_NATIVE_DUAL_DEVELOPMENT') throw new Error('direct dual-native phase required');
          const dual=r.directNativeDualPlatformDevelopment;
          if(dual?.status!=='OWNER_DIRECT_LOCKED'||dual?.mode!=='ROBLOX_UNITY_APP_BIDIRECTIONAL_AUTO_PAIR'||dual?.triggerRule!=='REQUEST_EITHER_PLATFORM_STARTS_BOTH_FOR_SAME_GAME') throw new Error('direct dual-native central contract missing');
          if(JSON.stringify(dual?.development?.concurrentTargets)!==JSON.stringify(['ROBLOX','UNITY'])||dual?.development?.bidirectionalAutoPair!==true||dual?.development?.noArtificialGlobalGameCountCap!==true||dual?.development?.globalGameDevelopmentWindow!==null) throw new Error('dual-native concurrency contract changed');
          if(dual?.design?.required!==true||dual?.design?.sharedCoreRequired!==true||dual?.design?.oneIdenticalPlatformDesignForbidden!==true||dual?.design?.strictDesignReviewRunsInParallel!==true) throw new Error('dual-native design contract changed');
          if(dual?.internalRelease?.ROBLOX!=='PRIVATE_OR_RESTRICTED_TEST_EXPERIENCE_OWNER_PLAYABLE'||dual?.internalRelease?.UNITY!=='INTERNAL_OR_CLOSED_APP_TEST_BUILD') throw new Error('internal release targets changed');
          if(dual?.externalRelease?.platformIndependent!==true||dual?.externalRelease?.onePlatformMayPublishWithoutWaitingForOther!==true) throw new Error('platform-independent public release changed');
          if(r.unityWebFirstStage?.enabled!==false||r.unityWebFirstStage?.scope!=='DISABLED'||r.webCompanion?.engine!=='DISABLED') throw new Error('Unity Web/Web companion must remain disabled');
          if(JSON.stringify(r.developmentLifecycleMachine?.targetPlatformDevelopment?.allowedPlatforms)!==JSON.stringify(['ROBLOX','UNITY'])||r.developmentLifecycleMachine?.targetPlatformDevelopment?.bidirectionalAutoPair!==true||r.developmentLifecycleMachine?.targetPlatformDevelopment?.admissionGate!=='MINIMUM_DESIGN_CONTRACT_READY') throw new Error('native development admission changed');
          if(!fs.existsSync('company-learning/DIRECT_NATIVE_DUAL_PLATFORM.md')) throw new Error('dual-native central sync document missing');
          console.log('PASS platform release roadmap contract');
          NODE

      - name: Check Vibe3 syntax
        run: |
          node --input-type=module --check < assets/vibe-v3-engine.js
          node --input-type=module --check < assets/vibe-development-ai.js
          node --input-type=module --check < assets/vibe-art-pipeline.js
          node --input-type=module --check < tools/vibe3-trajectory-ingest.mjs
          node --input-type=module --check < tools/vibe3-model-selection.mjs
          node --input-type=module --check < tools/vibe3-pump-index.mjs
          node --input-type=module --check < tools/vibe3-roblox-platform.mjs
          node --input-type=module --check < tools/company-development-roblox-runtime-foundation.mjs
          node --input-type=module --check < tools/company-development-roblox-headless-fast-mvp.mjs
          node --input-type=module --check < tools/company-tester-debug-intake.mjs
          node --check tools/company-minimum-design-contract.mjs

      - name: Run Vibe3 engine contract tests
        run: node qa/vibe3-engine.test.mjs

      - name: Run minimum dual-platform design contract tests
        run: node --test qa/company-minimum-design-contract.test.mjs

      - name: Run Vibe3 Pump tests
        run: node qa/vibe3-pump-index.test.mjs

      - name: Run Vibe3 trajectory and model-selection tests
        run: node qa/vibe3-trajectory-ingest.test.mjs

      - name: Run Roblox Phase 1 adapter tests
        run: node qa/vibe3-roblox-platform.test.mjs

      - name: Run Roblox native foundation and tester QA contract tests
        run: |
          node --test             qa/company-development-roblox-runtime-foundation.test.mjs             qa/company-development-roblox-headless-fast-mvp.test.mjs             qa/company-development-roblox-release-promotion.test.mjs             qa/company-tester-debug-intake.test.mjs             qa/company-development-roblox-runtime.test.mjs

      - name: Run direct native router tests
        run: node --test qa/company-selected-platform-router.test.mjs

      - name: Check trainer syntax
        run: python -m py_compile tools/vibe2-train.py qa/vibe3-trainer-black-box.test.py

      - name: Verify external black-box trainer contract
        run: python qa/vibe3-trainer-black-box.test.py

      - name: Verify no parallel bypass contract
        run: |
          node --input-type=module <<'NODE'
          import { createVibeV3ExecutionContract, createVibePumpModeContract } from './assets/vibe-v3-engine.js';
          const c=createVibeV3ExecutionContract(),p=createVibePumpModeContract();
          if(c.integration.parallelPipeline!==false||p.integration.parallelPipeline!==false) throw new Error('parallel V3 pipeline forbidden');
          if(c.integration.reuseExistingCheckpoint!==true) throw new Error('existing checkpoint must be reused');
          if(c.integration.reuseExistingQaAndRegression!==true) throw new Error('existing QA/regression must be reused');
          if(c.integration.reuseExistingDistillationWorkflow!==true) throw new Error('canonical distillation workflow must be reused');
          if(c.policy.originalSourceOverwriteBeforeWinnerForbidden!==true) throw new Error('candidate source overwrite before winner is forbidden');
          if(p.experiencePump.benchmarkCountsAsTrainingSample!==false) throw new Error('benchmark cannot auto-enter training');
          console.log('PASS Vibe3 Pump canonical integration contract');
          NODE
