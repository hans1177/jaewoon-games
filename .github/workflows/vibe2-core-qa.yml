permissions:
  contents: read
  pull-requests: read

concurrency:
  # PR updates supersede their own checks, but each merged main commit must finish its QA.
  # Separate main commits by SHA so newer pushes neither cancel active checks nor replace pending ones.
  group: vibe2-core-qa-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-slim
    timeout-minutes: 2
    outputs:
      parallelism_only: ${{ steps.scope.outputs.parallelism_only }}
      coding_benchmark: ${{ steps.scope.outputs.coding_benchmark }}
      changed_web_games: ${{ steps.scope.outputs.changed_web_games }}
    steps:
      # Read PR path diffs from API: avoid gigantic game asset checkout in scope.
      - uses: actions/checkout@v4
        if: ${{ github.event_name == 'push' }}
        with:
          fetch-depth: 2
          fetch-tags: false
          filter: blob:none

      - name: Resolve impact-scoped Core QA work
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          GH_READ_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          REPO_NAME: ${{ github.repository }}
        run: |
          set -euo pipefail
          parallelism_only=NO
          if [ "$EVENT_NAME" = 'pull_request' ]; then
            # Exact-head paginated PR files; errors, truncation and stale heads stop QA.
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const {GH_READ_TOKEN:token,REPO_NAME:repo,PR_NUMBER:number,EXPECTED_PR_HEAD:head}=process.env;
          if(!token||!/^\d+$/.test(number||'')||!repo||!(/^[a-f0-9]{40}$/i).test(head||''))throw Error('CORE_SCOPE_PR_IDENTITY_INVALID');
          const api='https://api.github.com/repos/'+repo+'/pulls/'+number;
          const headers={Authorization:'Bearer '+token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
          async function get(url){
            const response=await fetch(url,{headers,signal:AbortSignal.timeout(30000)});
            if(!response.ok)throw Error('CORE_SCOPE_GITHUB_API_FAILED:'+response.status);
            return response.json();
          }
          const before=await get(api);
          if(before.head?.sha!==head)throw Error('CORE_SCOPE_STALE_HEAD');
          if(!Number.isSafeInteger(before.changed_files)||before.changed_files<1||before.changed_files>3000)throw Error('CORE_SCOPE_CHANGED_FILE_LIMIT');
          const files=[];
          for(let page=1;page<=30;page++){
            const entries=await get(api+'/files?per_page=100&page='+page);
            if(!Array.isArray(entries)||entries.some(item=>typeof item.filename!=='string'||!item.filename))throw Error('CORE_SCOPE_MALFORMED_PR_FILES');
            files.push(...entries.map(item=>item.filename));
            if(entries.length<100)break;
          }
          const after=await get(api);
          if(after.head?.sha!==head||files.length!==after.changed_files||new Set(files).size!==files.length)throw Error('CORE_SCOPE_STALE_OR_PARTIAL_PR_FILES');
          fs.writeFileSync('/tmp/vibe2-core-qa-files.txt',files.join('\n')+'\n');
          console.log('VIBE2_CORE_QA_PR_FILES_API=PASS changed_files='+files.length);
          NODE
          elif [ "$EVENT_NAME" = 'push' ] && [ -n "${PUSH_BEFORE:-}" ] && ! printf '%s' "$PUSH_BEFORE" | grep -Eq '^0+$'; then
            base_sha="$PUSH_BEFORE"
            git cat-file -e "$base_sha^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$base_sha"
            git diff --name-only "$base_sha" HEAD > /tmp/vibe2-core-qa-files.txt
          else
            echo "parallelism_only=$parallelism_only" >> "$GITHUB_OUTPUT"
            echo 'changed_web_games=ALL' >> "$GITHUB_OUTPUT"
            echo 'VIBE2_CORE_QA_SCOPE=FULL_NON_DIFF_EVENT'
            exit 0
          fi
          changed_web_games=ALL
          if [ "$EVENT_NAME" = 'pull_request' ]; then
            changed_web_games="$(awk -F/ '$1=="web-games" && $2 ~ /^[a-z0-9-]+$/ {print $2}' /tmp/vibe2-core-qa-files.txt | sort -u | paste -sd, -)"
            [ -n "$changed_web_games" ] || changed_web_games=NONE
            if grep -Eq '^(game-catalog\.json|tools/vibe2-existing-web-assessment\.mjs)$' /tmp/vibe2-core-qa-files.txt; then changed_web_games=ALL; fi
          fi
          echo "changed_web_games=$changed_web_games" >> "$GITHUB_OUTPUT"
          coding_benchmark=NO
          if grep -Eq '^(tools/vibe2-learning-practice-worker\.mjs|company-learning/roblox-practice\.json|qa/vibe2-learning-practice-worker\.test\.mjs)$' /tmp/vibe2-core-qa-files.txt; then
            coding_benchmark=YES
          fi
          echo "coding_benchmark=$coding_benchmark" >> "$GITHUB_OUTPUT"
          if [ -s /tmp/vibe2-core-qa-files.txt ] && ! grep -Ev '^(\.github/workflows/vibe2-(continuous-core|24h-runner|parallelism-contract-qa)\.yml|qa/vibe2-parallelism-(main|20)-contract\.test\.mjs)$' /tmp/vibe2-core-qa-files.txt | grep -q .; then
            parallelism_only=YES
          fi
          echo "parallelism_only=$parallelism_only" >> "$GITHUB_OUTPUT"
          echo "VIBE2_CORE_QA_PARALLELISM_ONLY=$parallelism_only"

  test:
    needs: scope
    if: ${{ needs.scope.outputs.parallelism_only != 'YES' }}
    runs-on: ubuntu-slim
    # native asset production full regression may exceed the previous 10-minute job limit.
    # Keep every test and the slim control runner; only allow the existing full suite to finish.
    timeout-minutes: 25
    env:
      # 검증된 main 중앙정책 문서 경로를 기존 핵심 QA 실행과 임시 테스트 저장소에 전달한다.
      COMPANY_VERIFIED_POLICY_PATH: company-learning/platform-release-roadmap.json
      VIBE2_BROWSER_CHANGED_GAMES: ${{ needs.scope.outputs.changed_web_games || 'ALL' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify production-bound auto-coding preflight before broader regression
        run: node --test --test-name-pattern='^real production Roblox auto-coding preflight' qa/vibe2-central-work-contract.test.mjs

      - name: Syntax check
        run: |
          set -euo pipefail
          node qa/external-mobile-free-game-playtest-workflow.test.mjs
          node --test qa/jaewoon-motion-engine.test.cjs
          # New independent ocean game: real CC0 GLB, game logic, saves, mobile entry contract
          node --test qa/ocean-voyage.test.mjs
          # 마력숲 바닥·모션 변경은 기존 코어 QA 안에서 원본 OBJ/저장/3D 회귀를 검사한다.
          if [[ "${VIBE2_BROWSER_CHANGED_GAMES}" == "ALL" || ",${VIBE2_BROWSER_CHANGED_GAMES}," == *",fantasy-survival,"* ]]; then
            node --check web-games/fantasy-survival/world3d.mjs
            node --test qa/fantasy-survival-native-3d-download.test.mjs
          fi
          node --check assets/vibe-engine-adapter.js
          node --check assets/vibe-workbench.js
          node --check assets/vibe-core-runtime.js
          node --check assets/vibe-motion-core.js
          node --check assets/vibe-experience-memory.js
          node --check assets/vibe-continuous-queue.js
          node --check tools/autonomous-safe-edit.mjs
          node --check tools/vibe2-auto-planner.mjs
          node --check tools/company-build-up-directive.mjs
          node --check qa/company-build-up-directive.test.mjs
          node --check tools/company-roblox-production-plan.mjs
          node --check tools/vibe2-continuous-runner.mjs
          node --check tools/vibe2-openai-agent-patterns.mjs
          node --input-type=module --check < multiplayer/worker.js
          node --input-type=module --check < multiplayer/multiplayer-client.js
          node --check qa/company-development-roblox-multiplayer-qa.test.mjs
          node --check qa/vibe2-openai-agent-patterns.test.mjs
          node --check tools/vibe2-asset-production-plan.mjs
          node --check tools/vibe2-central-work-contract.mjs
          node --check tools/vibe2-neural-diagnosis.mjs
          node --check tools/vibe2-neural-feedback.mjs
          node --check tools/vibe2-neural-critic.mjs
          node --check tools/vibe2-neural-root-cause.mjs
          node --check tools/vibe2-neural-event-router.mjs
          node --check tools/vibe2-neural-work-graph.mjs
          node --check tools/vibe2-neural-shadow-audit.mjs
          node --check tools/vibe2-neural-event-telemetry.mjs
          node --check tools/vibe2-neural-phase2-readiness.mjs
          node --check tools/vibe2-system-steward.mjs
          node --check tools/vibe2-system-evolution-verify.mjs
          node --check tools/vibe2-system-architecture-contract.mjs
          node --check tools/vibe2-self-architecture-evolution.mjs
          node --check tools/vibe2-neural-expansion-readiness.mjs
          node --check tools/vibe2-design-intelligence.mjs
          node --check tools/vibe2-exploration-worker.mjs
          node --check tools/vibe2-existing-web-assessment.mjs
          node --check tools/vibe2-source-worker.mjs
          node --check tools/vibe2-capability-distillation.mjs
          node --check tools/vibe2-merged-pr-provenance.mjs
          node --check tools/vibe2-performance-sanity.mjs
          node --check tools/vibe2-fan-in-review.mjs
          node --check tools/vibe2-queue-control.mjs
          node --check tools/vibe2-work-package.mjs
