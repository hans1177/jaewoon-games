  browser-smoke:
    needs: scope
    if: ${{ needs.scope.outputs.parallelism_only != 'YES' }}
    name: Development Web browser startup smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run browser startup smoke
        run: |
          set -euo pipefail
          node qa/vibe2-development-web-browser-smoke.mjs



  practice-runtime:
    needs: scope
    if: ${{ needs.scope.outputs.parallelism_only != 'YES' }}
    name: Practice fault cards runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated practice executors
        id: executors
        run: |
          set -euo pipefail
          practice_deps="$RUNNER_TEMP/vibe2-practice-browser"
          npm install --prefix "$practice_deps" --no-audit --no-fund playwright@1.58.2
          node "$practice_deps/node_modules/playwright/cli.js" install --with-deps chromium
          echo "VIBE2_PLAYWRIGHT_MODULE=$practice_deps/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
          docker pull mcr.microsoft.com/dotnet/sdk:8.0
          echo 'VIBE2_TEST_CSHARP_RUNTIME=1' >> "$GITHUB_ENV"
          luau_dir="$RUNNER_TEMP/vibe2-practice-luau"
          mkdir -p "$luau_dir"
          curl -fsSL --retry 3 -o "$luau_dir/luau.zip" https://github.com/luau-lang/luau/releases/download/0.739/luau-ubuntu.zip
          unzip -oq "$luau_dir/luau.zip" -d "$luau_dir"
          chmod +x "$luau_dir/luau" "$luau_dir/luau-compile"
          echo "VIBE2_LUAU_BINARY=$luau_dir/luau" >> "$GITHUB_ENV"
          echo "VIBE2_LUAU_COMPILER=$luau_dir/luau-compile" >> "$GITHUB_ENV"
      - name: Execute baseline repair and hidden variants
        run: |
          test -x "$VIBE2_LUAU_BINARY"
          node --test qa/roblox-common-motion-source.test.mjs
          VIBE2_TEST_LUAU_COMPILER="$VIBE2_LUAU_COMPILER" node --test --test-name-pattern="internal motion sampler" qa/vibe2-source-worker.test.mjs
          node --test qa/vibe3-roblox-studio-lessons.test.mjs
          node --test qa/vibe2-learning-practice-worker.test.mjs
          node --test --test-name-pattern="managed spawn executes" qa/company-development-roblox-runtime-foundation.test.mjs
      - name: Execute native GLB authoring and platform material checks
        if: always() && !cancelled() && steps.executors.outcome == 'success'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender python3-numpy libegl1 libgl1 libgl1-mesa-dri
          blender --background --factory-startup --python-exit-code 1 --python-expr "import numpy; import bpy; print('VIBE_GLB_EXPORT_DEPENDENCIES=PASS')"
          VIBE2_BLENDER_BINARY=blender node --test --test-name-pattern="actual Blender authoring|GLB production inspection|native asset recipe preserves" qa/vibe2-native-asset-production.test.mjs
      - name: Preserve authored GLB and preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibe2-glb-authoring-evidence
          path: ${{ runner.temp }}/vibe2-glb-authoring-evidence
          if-no-files-found: error
          retention-days: 14
      - name: Prepare the existing local Vibe model for coding measurement
        id: local-model
        if: always() && !cancelled() && steps.executors.outcome == 'success' && needs.scope.outputs.coding_benchmark == 'YES'
        uses: ./.github/actions/prepare-ollama
        with:
          model: qwen3:1.7b
          cache-model: 'true'
          pull-model: 'true'
          preload-model: 'true'
      - name: Measure actual generated implementations and repairs
        if: always() && !cancelled() && steps.local-model.outcome == 'success' && needs.scope.outputs.coding_benchmark == 'YES'
        env:
          VIBE2_LIVE_CODING_BENCHMARK: '1'
          VIBE2_LOCAL_MODEL: qwen3:1.7b
        run: node --test --test-name-pattern="live Vibe coding" qa/vibe2-learning-practice-worker.test.mjs
      - name: Preserve coding performance evidence
        if: always() && needs.scope.outputs.coding_benchmark == 'YES'
        uses: actions/upload-artifact@v4
        with:
          name: vibe2-coding-repair-benchmark
          path: ${{ runner.temp }}/vibe2-coding-repair-benchmark.json
          if-no-files-found: error
          retention-days: 14
