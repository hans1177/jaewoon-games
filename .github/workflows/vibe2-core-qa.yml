name: Vibe2 Core QA

on:
  push:
    branches:
      - vibe2-unreal-core
    paths:
      - 'VIBE2_CORE.md'
      - 'VIBE2_MOTION_CORE.md'
      - 'assets/vibe-engine-adapter.js'
      - 'assets/vibe-workbench.js'
      - 'assets/vibe-core-runtime.js'
      - 'assets/vibe-motion-core.js'
      - 'assets/vibe-experience-memory.js'
      - 'assets/vibe-continuous-queue.js'
      - 'tools/vibe2-continuous-runner.mjs'
      - 'tools/vibe2-source-worker.mjs'
      - 'tools/vibe2-queue-control.mjs'
      - 'qa/vibe2-core-engine-motion.test.mjs'
      - 'qa/vibe2-source-worker.test.mjs'
      - 'qa/vibe2-queue-control.test.mjs'
      - '.github/workflows/vibe2-core-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vibe2-core-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check
        run: |
          node --check assets/vibe-engine-adapter.js
          node --check assets/vibe-workbench.js
          node --check assets/vibe-core-runtime.js
          node --check assets/vibe-motion-core.js
          node --check assets/vibe-experience-memory.js
          node --check assets/vibe-continuous-queue.js
          node --check tools/vibe2-continuous-runner.mjs
          node --check tools/vibe2-source-worker.mjs
          node --check tools/vibe2-queue-control.mjs
          node --check qa/vibe2-core-engine-motion.test.mjs
          node --check qa/vibe2-source-worker.test.mjs
          node --check qa/vibe2-queue-control.test.mjs

      - name: Vibe2 core tests
        run: |
          node --test qa/vibe2-core-engine-motion.test.mjs
          node --test qa/vibe2-source-worker.test.mjs
          node --test qa/vibe2-queue-control.test.mjs
