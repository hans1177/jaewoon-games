  native-asset-regression:
    needs: scope
    if: ${{ needs.scope.outputs.parallelism_only != 'YES' }}
    name: Native CC0 asset production regression
    runs-on: ubuntu-slim
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run complete original native CC0 asset regression
        run: |
          set -euo pipefail
          node --test qa/vibe2-native-asset-production.test.mjs

  remaining-contracts:
    needs: scope
    if: ${{ needs.scope.outputs.parallelism_only != 'YES' }}
    name: Vibe2 remaining core contracts
    runs-on: ubuntu-slim
    timeout-minutes: 25
    env:
      COMPANY_VERIFIED_POLICY_PATH: company-learning/platform-release-roadmap.json
      VIBE2_BROWSER_CHANGED_GAMES: ${{ needs.scope.outputs.changed_web_games || 'ALL' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run remaining source, game, learning and design regressions
        run: |
          set -euo pipefail
          # [Rule5] Real approved seed artbooks live only on company-runtime, not main.
          # Reuse the identical read-only source hydration already verified by Vibe QA;
          # do not fake fixtures, skip tests, or promote missing artbook evidence.
          git fetch --no-tags --depth=1 origin '+refs/heads/company-runtime:refs/remotes/origin/company-runtime'
          runtime_design_sha="$(git rev-parse origin/company-runtime)"
          test "$(git ls-tree -d --name-only "$runtime_design_sha" -- artbook-submissions)" = 'artbook-submissions'
          git restore --source="$runtime_design_sha" --worktree -- artbook-submissions
          echo "VIBE2_CORE_QA_SEED_ARTBOOK_SOURCE=company-runtime:$runtime_design_sha"
          # [Rule5] 삭제 자산 재등록, CC0 출처와 허위 검증 차단: 전체 자산 회귀는 이 코어 QA가 판정한다.
          node --test qa/vibe-studio-asset-universe.test.mjs
          node --test qa/vibe2-external-customization.test.mjs
          node --test qa/vibe2-neural-diagnosis.test.mjs
          node --test qa/vibe2-neural-feedback.test.mjs
          node --test qa/vibe2-neural-critic.test.mjs
          node --test qa/vibe2-neural-root-cause.test.mjs
          node --test qa/vibe2-neural-event-router.test.mjs
          node --test qa/vibe2-neural-work-graph.test.mjs
          node --test qa/vibe2-neural-shadow-audit.test.mjs
          node --test qa/vibe2-neural-event-telemetry.test.mjs
          node --test qa/vibe2-neural-phase2-readiness.test.mjs
          node --test qa/vibe2-neural-fanin-root-cause.test.mjs
          node --test qa/vibe2-core-engine-motion.test.mjs
          node --test qa/vibe2-design-intelligence.test.mjs
          node --test qa/vibe2-exploration-worker.test.mjs
          node --test qa/vibe2-existing-web-assessment.test.mjs
          # Actual game consumer proof: canonical CC0 bytes, lineage and original mobile save/input contract.
          node --test qa/insect-survival.test.mjs
          node --test qa/vibe2-local-web-develop.test.mjs
          node --test qa/roblox-onepatch.test.mjs
          # 기존 중단된 로컬 모델·유니티 작업 시험은 제외하고 유효한 소스/저장/권한 검증은 유지.
          node --test --test-name-pattern='Web true 3D engine selection keeps|asset synchronization detects|single motion work unit rejects stale source|game context capsule keeps|candidate self review rejects comment-only|full-file candidates compare against|rejected patch fingerprint ignores|repeat-rejected source candidates|Vibe libraries and development tools rematch|native game BUILD_UP receives bounded|source worker wires deterministic diagnostic|independent authoring generates working mobile action code|verified quest and crafting choices bind real gameplay state|no-model Roblox generates touch controls|no-model quest crafting enemy and region choices change gameplay state|no-model connected quest routes add distinct playable source records|exact edit validates the entire batch|asset inspection and exact writes share|semantic diff hard gate protects existing save keys|semantic diff invariant blocks variable-backed save|native save key changes remain possible|invalid edit path recovery requires|exact edit accepts only unique indentation|exact edit still rejects materially different|model response completion stops only|failed source generation still performs post-work|runtime model-call gate rejects|source worker emits auditable APK learning' qa/vibe2-source-worker.test.mjs
          node --test qa/vibe3-roblox-distillation.test.mjs
          node --test qa/vibe2-capability-distillation.test.mjs
