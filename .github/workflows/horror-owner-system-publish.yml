name: Horror Owner System Publish
# Asset import uses the existing authenticated account session; place publishing uses its API key.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/horror-owner-system-publish.yml'
      - 'assets/roblox/midnight-manor/**'
      - 'roblox-games/horror-escape-room/**'
      - 'tools/horror-manor-*.mjs'
      - 'qa/horror-manor.test.mjs'
permissions:
  contents: read
  actions: write
concurrency:
  group: horror-owner-system-publish-cloud-v2
  cancel-in-progress: true
jobs:
  import-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install cloud Blender and pinned Rojo
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y blender python3-numpy
          mkdir -p /tmp/rojo-bin
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip
          echo '22503e5839864f9d7c2171c48b536fc229f2cc4d8774c9cc149f60941d864073  /tmp/rojo.zip' | sha256sum -c -
          unzip -q /tmp/rojo.zip -d /tmp/rojo-bin
          chmod +x /tmp/rojo-bin/rojo
      - name: Rebuild canonical Blender manor in cloud
        shell: bash
        run: |
          set -euo pipefail
          blender --background --python assets/roblox/midnight-manor/build.py
          test -s assets/roblox/midnight-manor/generated/manor-lobby.glb
          test -s assets/roblox/midnight-manor/generated/build-evidence.json
          test -s assets/roblox/midnight-manor/generated/import-bounds.json
          echo 'MANOR_CLOUD_BLENDER_BUILD=PASS'
      - name: Validate manor release contract
        env:
          MANOR_CLOUD_BUILD: '1'
        shell: bash
        run: node --test qa/horror-manor.test.mjs
      - name: Import verified original GLB
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_ROBLOSECURITY: ${{ secrets.ROBLOX_ROBLOSECURITY }}
          ROBLOX_SECURITY_COOKIE: ${{ secrets.ROBLOX_SECURITY_COOKIE }}
        shell: pwsh
        run: node tools/horror-manor-assets.mjs
      - name: Verify imported native manor asset in cloud
        env:
          ROBLOX_ROBLOSECURITY: ${{ secrets.ROBLOX_ROBLOSECURITY }}
          ROBLOX_SECURITY_COOKIE: ${{ secrets.ROBLOX_SECURITY_COOKIE }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/horror-manor-native-check.mjs
          echo 'MANOR_CLOUD_NATIVE_ASSET_CHECK=PASS'
      - name: Build exact cloud place
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/horror-personal-manor
          /tmp/rojo-bin/rojo build roblox-games/horror-escape-room/default.project.json -o /tmp/horror-personal-manor/horror-escape-room.rbxlx
          test -s /tmp/horror-personal-manor/horror-escape-room.rbxlx
          echo "MANOR_PLACE=/tmp/horror-personal-manor/horror-escape-room.rbxlx" >> "$GITHUB_ENV"
          echo "MANOR_PLACE_SHA256=$(sha256sum /tmp/horror-personal-manor/horror-escape-room.rbxlx | awk '{print $1}')"
      - name: Publish verified manor to owner-only private target
        if: github.ref == 'refs/heads/main'
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsSL -X POST             -H "x-api-key: $ROBLOX_OPEN_CLOUD_API_KEY"             -H 'Content-Type: application/xml'             --data-binary @"$MANOR_PLACE"             'https://apis.roblox.com/universes/v1/10767445796/places/98222620265768/versions?versionType=Published')"
          version="$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write(String(x.versionNumber||""))' "$response")"
          test -n "$version" && test "$version" -gt 0
          echo "MANOR_PUBLISHED_VERSION=$version"
          node - "$version" <<'NODE'
          const fs=require('fs');
          const version=Number(process.argv[2]);
          fs.writeFileSync('assets/roblox/midnight-manor/generated/publication.json',JSON.stringify({
            sourceRevision:process.env.GITHUB_SHA,
            placeId:'98222620265768',
            universeId:'10767445796',
            publishedVersion:version,
            publishedAt:new Date().toISOString(),
            actualRobloxPlayTest:false,
            buildSurface:'GITHUB_HOSTED_UBUNTU_CLOUD'
          },null,2)+'\n');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: horror-manor-release-evidence
          path: |
            assets/roblox/midnight-manor/generated/roblox-asset.json
            roblox-games/horror-escape-room/shared/ManorAssets.luau
            assets/roblox/midnight-manor/generated/native-import-check.json
            assets/roblox/midnight-manor/generated/publication.json
      - name: Return horror changes to canonical development flow
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          gh workflow run company-design-promotion-sync.yml --repo $env:GITHUB_REPOSITORY --ref main
          if($LASTEXITCODE -ne 0){throw 'HORROR_CANONICAL_FLOW_DISPATCH_FAILED'}
          Write-Host 'HORROR_CANONICAL_FLOW=DESIGN_PROMOTION_TO_DEVELOPMENT'
          Write-Host 'HORROR_CANONICAL_FLOW_GAME_ID=horror-escape-room'
