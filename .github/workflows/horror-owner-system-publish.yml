name: Horror Owner System Publish
# Asset import uses the existing authenticated account session; place publishing uses its API key.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/horror-owner-system-publish.yml'
      - 'assets/roblox/midnight-manor/generated/manor-lobby.glb'
      - 'assets/roblox/midnight-manor/generated/import-bounds.json'
      - 'roblox-games/horror-escape-room/server/ManorLobby.luau'
      - 'roblox-games/horror-escape-room/client/ManorLobby.client.luau'
permissions:
  contents: read
concurrency:
  group: horror-owner-system-publish
  cancel-in-progress: false
jobs:
  import-build-publish:
    runs-on: [self-hosted, Windows, X64, roblox-studio-authenticated]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate manor release contract
        shell: pwsh
        run: node --test qa/horror-manor.test.mjs
      - name: Import verified original GLB
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_ROBLOSECURITY: ${{ secrets.ROBLOX_ROBLOSECURITY }}
          ROBLOX_SECURITY_COOKIE: ${{ secrets.ROBLOX_SECURITY_COOKIE }}
        shell: pwsh
        run: node tools/horror-manor-assets.mjs
      - name: Build native place
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'horror-personal-manor'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $zip=Join-Path $root 'rojo.zip'
          Invoke-WebRequest 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-windows-x86_64.zip' -OutFile $zip
          if((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '2179c44862a10ecbd725bdfeb4abc64e16dc4aad9b6c8f3e1a7c46a87280b949'){throw 'ROJO_HASH_MISMATCH'}
          Expand-Archive $zip (Join-Path $root 'bin') -Force
          $rojo=(Get-ChildItem (Join-Path $root 'bin') -Filter rojo.exe -Recurse | Select-Object -First 1).FullName
          $place=Join-Path $root 'horror-escape-room.rbxlx'
          & $rojo build roblox-games/horror-escape-room/default.project.json -o $place
          if($LASTEXITCODE -ne 0){throw 'MANOR_BUILD_FAILED'}
          "MANOR_PLACE=$place" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify Roblox-converted native model
        env:
          ROBLOX_ROBLOSECURITY: ${{ secrets.ROBLOX_ROBLOSECURITY }}
          ROBLOX_SECURITY_COOKIE: ${{ secrets.ROBLOX_SECURITY_COOKIE }}
        shell: pwsh
        run: node tools/horror-manor-native-check.mjs
      - name: Publish verified manor
        if: github.ref == 'refs/heads/main'
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $uri='https://apis.roblox.com/universes/v1/10767445796/places/98222620265768/versions?versionType=Published'
          $r=Invoke-RestMethod -Method Post -Uri $uri -Headers @{'x-api-key'=$env:ROBLOX_OPEN_CLOUD_API_KEY} -ContentType application/xml -InFile $env:MANOR_PLACE
          if([int]$r.versionNumber -le 0){throw 'MANOR_PUBLISH_VERSION_MISSING'}
          Write-Host "MANOR_PUBLISHED_VERSION=$($r.versionNumber)"
          @{sourceRevision=$env:GITHUB_SHA;placeId='98222620265768';universeId='10767445796';publishedVersion=$r.versionNumber;publishedAt=(Get-Date).ToUniversalTime().ToString('o');actualRobloxPlayTest=$false} | ConvertTo-Json | Set-Content assets/roblox/midnight-manor/generated/publication.json -Encoding utf8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: horror-manor-release-evidence
          path: |
            assets/roblox/midnight-manor/generated/roblox-asset.json
            roblox-games/horror-escape-room/shared/ManorAssets.luau
            assets/roblox/midnight-manor/generated/native-import-check.json
            assets/roblox/midnight-manor/generated/publication.json
