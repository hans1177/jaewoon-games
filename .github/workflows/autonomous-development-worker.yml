name: Autonomous Development Worker

on:
  workflow_dispatch:
    inputs:
      game_id:
        description: "Company game/project id"
        required: true
        type: string
      source_path:
        description: "Read-only stable source path under web-games/"
        required: true
        type: string
      goal:
        description: "Candidate improvement goal"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: autonomous-development-worker
  cancel-in-progress: false

env:
  AUTONOMOUS_LOCAL_MODEL: qwen3:0.6b
  OLLAMA_HOST: 127.0.0.1:11434

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout stable main read-only baseline
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deterministic worker safety tests
        run: node --test qa/autonomous-development-worker.test.mjs

      - name: Create isolated candidate branch
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          branch="autonomous/candidate-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
          echo "CANDIDATE_BRANCH=$branch"
          echo "MAIN_DIRECT_WRITE=NO"

      - name: Install local Ollama
        shell: bash
        run: |
          set -euo pipefail
          installed=0
          for attempt in 1 2 3; do
            echo "OLLAMA_INSTALL_ATTEMPT=$attempt/3"
            if curl -fsSL --retry 3 --retry-all-errors --connect-timeout 15 https://ollama.com/install.sh | sh; then
              installed=1
              break
            fi
            sleep $((attempt * 4))
          done
          test "$installed" = 1
          nohup ollama serve > /tmp/ollama-autonomous.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && exit 0
            sleep 2
          done
          cat /tmp/ollama-autonomous.log || true
          exit 1

      - name: Pull free local model
        run: |
          ollama pull "$AUTONOMOUS_LOCAL_MODEL"
          echo "LOCAL_MODEL=$AUTONOMOUS_LOCAL_MODEL"
          echo "PAID_API=NO"
          echo "API_KEY_REQUIRED=NO"

      - name: Generate candidate copy only
        env:
          AUTONOMOUS_GAME_ID: ${{ inputs.game_id }}
          AUTONOMOUS_SOURCE_PATH: ${{ inputs.source_path }}
          AUTONOMOUS_GOAL: ${{ inputs.goal }}
          AUTONOMOUS_CANDIDATE_ID: ${{ inputs.game_id }}-${{ github.run_id }}
        run: node tools/autonomous-development-worker.mjs

      - name: Candidate QA and regression
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find "web-games/.autonomous-candidates/${{ inputs.game_id }}/${{ inputs.game_id }}-${{ github.run_id }}" -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -print0)
          if [ -f qa/vibe-regression.mjs ]; then node qa/vibe-regression.mjs; fi
          echo "CANDIDATE_QA=PASS"
          echo "PUBLIC_STABLE_MODIFIED=NO"

      - name: Commit candidate evidence to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "jaewoon-autonomous-worker"
          git config user.email "autonomous-worker@users.noreply.github.com"
          git add -f "web-games/.autonomous-candidates/${{ inputs.game_id }}/${{ inputs.game_id }}-${{ github.run_id }}" ".autonomous/evidence/${{ inputs.game_id }}-${{ github.run_id }}.json"
          if git diff --cached --quiet; then
            echo "No candidate changes produced" >&2
            exit 1
          fi
          git commit -m "candidate: ${{ inputs.game_id }} autonomous development ${GITHUB_RUN_ID}"
          git push origin "HEAD:${{ steps.branch.outputs.name }}"
          echo "CANDIDATE_COMMIT=$(git rev-parse HEAD)"
          echo "SELF_PROMOTE=NO"

      - name: Summary
        run: |
          echo "### Autonomous Development Candidate" >> "$GITHUB_STEP_SUMMARY"
          echo "- game: ${{ inputs.game_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- branch: ${{ steps.branch.outputs.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- paid API: NO" >> "$GITHUB_STEP_SUMMARY"
          echo "- main direct write: NO" >> "$GITHUB_STEP_SUMMARY"
          echo "- promotion authority: independent QA + JAY" >> "$GITHUB_STEP_SUMMARY"
