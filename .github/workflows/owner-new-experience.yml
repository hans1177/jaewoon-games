name: Owner New Roblox Experience

on:
  workflow_dispatch:
    inputs:
      game_id:
        description: 'roblox-games 폴더 이름 (fantasy-survival 또는 mare-essentia)'
        required: true
        type: string
      game_name:
        description: '새 체험 이름'
        required: true
        type: string
      universe_id:
        description: '(선택) 미리 만든 빈 체험 Universe ID. 넣으면 생성 대신 그 체험에 게시하고 쿠키를 쓰지 않음'
        required: false
        type: string
        default: ''
      place_id:
        description: '(선택) 그 체험의 Place ID. 비우면 대표 Place 자동 조회'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: owner-new-experience-${{ inputs.game_id }}
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Rojo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rojo-bin
          bash tools/install-rojo.sh /tmp/rojo-bin
      - name: Build place
        shell: bash
        env:
          GAME_ID: ${{ inputs.game_id }}
        run: |
          set -euo pipefail
          case "$GAME_ID" in fantasy-survival|mare-essentia) ;; *) echo 'GAME_NOT_ALLOWED'; exit 1;; esac
          mkdir -p /tmp/new-exp
          /tmp/rojo-bin/rojo build "roblox-games/$GAME_ID/default.project.json" -o "/tmp/new-exp/$GAME_ID.rbxl"
          test -s "/tmp/new-exp/$GAME_ID.rbxl"
      - name: Create new private Experience and publish
        shell: bash
        env:
          GAME_ID: ${{ inputs.game_id }}
          GAME_NAME: ${{ inputs.game_name }}
          REUSE_UNIVERSE_ID: ${{ inputs.universe_id }}
          REUSE_PLACE_ID: ${{ inputs.place_id }}
          # 배포 전용 키(ROBLOX_DEPLOY_API_KEY)가 있으면 우선 사용. 기존 체험 지정 시 쿠키는 넘기지 않는다.
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_DEPLOY_API_KEY || secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_ROBLOSECURITY: ${{ inputs.universe_id == '' && secrets.ROBLOX_ROBLOSECURITY || '' }}
          ROBLOX_SECURITY_COOKIE: ${{ inputs.universe_id == '' && secrets.ROBLOX_SECURITY_COOKIE || '' }}
        run: |
          set -euo pipefail
          args=(--game-id "$GAME_ID" --game-name "$GAME_NAME" --place-file "/tmp/new-exp/$GAME_ID.rbxl" --source-revision "$(git rev-parse HEAD)" --output "/tmp/new-exp/result.json")
          if [[ -n "${REUSE_UNIVERSE_ID:-}" ]]; then
            [[ "$REUSE_UNIVERSE_ID" =~ ^[0-9]+$ ]] || { echo 'UNIVERSE_ID_INVALID'; exit 1; }
            if [[ -z "${REUSE_PLACE_ID:-}" ]]; then
              REUSE_PLACE_ID="$(curl -fsS --retry 3 -H "x-api-key: ${ROBLOX_OPEN_CLOUD_API_KEY}" "https://apis.roblox.com/cloud/v2/universes/${REUSE_UNIVERSE_ID}" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const m=String(JSON.parse(d).rootPlace||'').match(/(\\d+)\\s*$/);if(!m){console.error('ROOT_PLACE_LOOKUP_FAILED');process.exit(1)}console.log(m[1])})")"
            fi
            [[ "$REUSE_PLACE_ID" =~ ^[0-9]+$ ]] || { echo 'PLACE_ID_INVALID'; exit 1; }
            echo "REUSE_TARGET=${REUSE_UNIVERSE_ID}/${REUSE_PLACE_ID} (R15는 체험 생성 시 Creator Hub에서 설정)"
            args+=(--reuse-universe-id "$REUSE_UNIVERSE_ID" --reuse-place-id "$REUSE_PLACE_ID")
          elif [[ "$GAME_ID" == 'fantasy-survival' ]]; then
            args+=(--avatar-rig R15)
          fi
          node tools/company-roblox-dedicated-experience.mjs "${args[@]}"
          cat /tmp/new-exp/result.json
      - name: Record new target through an existing GitHub pull request
        shell: bash
        env:
          GAME_ID: ${{ inputs.game_id }}
          GAME_NAME: ${{ inputs.game_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node -e "
          const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/new-exp/result.json','utf8'));
          if(!r.pass&&!(r.published&&r.universeId&&r.placeId))throw Error('NEW_EXPERIENCE_FAILED '+r.stage+' '+r.error);
          fs.writeFileSync('roblox-games/'+process.env.GAME_ID+'/experience-target.json',JSON.stringify({gameId:process.env.GAME_ID,gameName:process.env.GAME_NAME,universeId:String(r.universeId),placeId:String(r.placeId),createdAt:new Date().toISOString()},null,2)+'\n');
          console.log('NEW_UNIVERSE_ID='+r.universeId+' NEW_PLACE_ID='+r.placeId);"
          # [기록] main 직접 쓰기 금지. 기존 PR 검토 경로를 사용한다.
          branch="owner/roblox-new-target-$GAME_ID-$GITHUB_RUN_ID"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "roblox-games/$GAME_ID/experience-target.json"
          git commit -m "새 로블록스 체험 대상 기록: $GAME_ID"
          git push -q origin "HEAD:refs/heads/$branch"
          gh pr create --base main --head "$branch" --title "로블록스 신규 체험 대상 확인: $GAME_ID" \
            --body "게임: $GAME_NAME. 로블록스 게시 ID와 키 기반 결과는 이 PR에서 검토 후 main에 반영. 기존 저장과 게임 규칙은 변경하지 않음."
          echo "ROBLOX_NEW_TARGET_MAIN_RECORD=PENDING_PR_REVIEW"
