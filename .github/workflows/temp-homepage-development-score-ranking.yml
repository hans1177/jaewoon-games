name: Temp Homepage Development Score Ranking

on:
  push:
    branches:
      - feat/homepage-development-score-ranking

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/homepage-development-score-ranking
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact homepage score-ranking patch
        run: python3 tools/temp-homepage-development-score-ranking.py
      - name: Syntax checks
        run: |
          node --check assets/homepage-enhancements-core.js
          node --check assets/homepage-enhancements.js
          node --check tools/homepage-manager.mjs
      - name: Targeted homepage regression
        run: node --test qa/homepage-manager-publication-order.test.mjs
      - name: Homepage Manager self-QA
        run: node tools/homepage-manager.mjs
      - name: Verify changed files
        run: |
          git diff --check
          git status --short
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add COMPANY_FLOW.md company-directive.json HOMEPAGE_OPERATIONS.md assets/homepage-enhancements-core.js assets/homepage-enhancements.js tools/homepage-manager.mjs qa/homepage-manager-publication-order.test.mjs
          git diff --cached --quiet && { echo "NO_PATCH"; exit 1; }
          git commit -m "feat(homepage): rank development games by score"
          git push origin HEAD:feat/homepage-development-score-ranking
