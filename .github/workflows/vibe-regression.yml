name: Vibe Integrated Regression

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          files=(
            assets/common-ai.js
            assets/ai-party.js
            assets/animation-state.js
            assets/asset-selector.js
            assets/game-content.js
            assets/game-kit.js
            assets/godot-game-generator.js
            assets/godot-project-qa.js
            assets/vibe-build-plan.js
            assets/vibe-project.js
            assets/vibe-workbench.js
            assets/vibe-rebuild-planner.js
            assets/vibe-rebuild-engine.js
            assets/vibe-development-ai.js
            assets/vibe-quality-intelligence.js
            assets/vibe-presentation-director.js
            assets/vibe-motion-effects-director.js
            assets/vibe-v2-runtime.js
            qa/vibe-regression.mjs
            qa/vibe-agent-causality.mjs
            qa/vibe-presentation-causality.mjs
            qa/vibe-world-macro-causality.mjs
            qa/vibe-development-ai-evidence.mjs
            qa/vibe-auto-repair-causality.mjs
            qa/vibe-v2-e2e.mjs
          )
          for file in "${files[@]}"; do
            node --input-type=module --check < "$file"
          done
          echo 'PASS JavaScript syntax'

      - name: Run integrated regression suite
        run: node qa/vibe-regression.mjs

      - name: Test agent causality determinism
        run: node qa/vibe-agent-causality.mjs

      - name: Test presentation causality contract
        run: node qa/vibe-presentation-causality.mjs

      - name: Test world macro causality contract
        run: node qa/vibe-world-macro-causality.mjs

      - name: Test development AI evidence gate
        run: node qa/vibe-development-ai-evidence.mjs

      - name: Test replay regression auto repair contract
        run: node qa/vibe-auto-repair-causality.mjs

      - name: Test Vibe V2 end to end execution loop
        run: node qa/vibe-v2-e2e.mjs
