name: Unity Personal Activation File

on:
  push:
    branches: [main]
    paths:
      - '.build-requests/unity-personal-activation.request'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-alf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Create Unity 6000.6.0f1 manual activation request
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p activation-output
          docker run --rm \
            -v "$PWD/activation-output:/activation-output" \
            -w /activation-output \
            unityci/editor:ubuntu-6000.6.0f1-android-3 \
            /bin/bash -lc 'unity-editor -nographics -createManualActivationFile -logFile /activation-output/unity-alf.log || true'
          alf="$(find activation-output -maxdepth 1 -type f -name '*.alf' -print -quit)"
          if [[ -z "$alf" || ! -s "$alf" ]]; then
            echo 'Unity did not produce a non-empty .alf activation request.' >&2
            echo '--- Unity activation log tail ---'
            tail -n 80 activation-output/unity-alf.log 2>/dev/null || true
            exit 1
          fi
          echo "[PASS] Created $(basename "$alf")"
          echo "alf_path=$alf" >> "$GITHUB_ENV"

      - name: Upload activation request artifact
        uses: actions/upload-artifact@v4
        with:
          name: unity-6000.6.0f1-personal-activation-request
          path: ${{ env.alf_path }}
          if-no-files-found: error
          retention-days: 3
