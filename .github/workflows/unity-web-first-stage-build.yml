name: Unity Web Development Floor
run-name: Unity Web Floor ${{ inputs.game_id || inputs.request_file || github.event.head_commit.message }}

on:
  push:
    branches:
      - main
    paths:
      - '.build-requests/unity-web/**'
  workflow_call:
    inputs:
      request_file:
        required: false
        type: string
      game_id:
        required: false
        type: string
      project_path:
        required: false
        type: string
      build_method:
        required: false
        type: string
      source_commit:
        required: false
        type: string
      base_main_sha:
        required: false
        type: string
      vibe2_task_id:
        required: false
        type: string
      vibe2_candidate_branch:
        required: false
        type: string
      generated_asset_files:
        required: false
        default: '[]'
        type: string
      publish_to_main:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      request_file:
        description: 'Optional tracked .build-requests/unity-web/*.json request file'
        required: false
        default: ''
        type: string
      game_id:
        description: 'Direct game id when request_file is omitted'
        required: false
        default: ''
        type: string
      project_path:
        description: 'Direct canonical Unity project path'
        required: false
        default: ''
        type: string
      build_method:
        description: 'Direct fully qualified Unity BuildWeb method'
        required: false
        default: ''
        type: string
      source_commit:
        description: 'Direct source revision binding'
        required: false
        default: ''
        type: string
      base_main_sha:
        description: 'Pinned main revision used to reject concurrent Unity source drift'
        required: false
        default: ''
        type: string
      vibe2_task_id:
        description: 'Optional Vibe2 task settled only after reviewed merge and Cloudflare main deployment'
        required: false
        default: ''
        type: string
      vibe2_candidate_branch:
        description: 'Optional exact Vibe2 candidate branch for audit evidence'
        required: false
        default: ''
        type: string
      generated_asset_files:
        description: 'JSON array of exact Work-Locked generated asset paths to carry with the candidate'
        required: false
        default: '[]'
        type: string
      publish_to_main:
        description: 'Create one reviewed PR containing candidate Unity source plus verified WebGL output'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  build:
    concurrency:
      group: unity-web-floor-exec-${{ inputs.game_id || inputs.request_file || github.run_id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      repair_required: ${{ steps.repair.outputs.required }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve Unity Web request
        id: request
        shell: bash
        env:
          REQUEST_INPUT: ${{ inputs.request_file }}
          DIRECT_GAME_ID: ${{ inputs.game_id }}
          DIRECT_PROJECT_PATH: ${{ inputs.project_path }}
          DIRECT_BUILD_METHOD: ${{ inputs.build_method }}
          DIRECT_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          request_file="$REQUEST_INPUT"
          game_id="$DIRECT_GAME_ID"
          project="$DIRECT_PROJECT_PATH"
          method="$DIRECT_BUILD_METHOD"
          source_commit="$DIRECT_SOURCE_COMMIT"

          if [[ -z "$request_file" && -z "$game_id" && "${GITHUB_EVENT_NAME}" == "push" ]]; then
            request_file="$(git show --format= --name-only "$GITHUB_SHA" | grep -E '^\.build-requests/unity-web/[A-Za-z0-9._-]+\.json$' | head -n 1 || true)"
          fi

          python3 - "$request_file" "$game_id" "$project" "$method" "$source_commit" "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, re, sys
          request_file, game_id, project, method, source_commit, output = sys.argv[1:]
          if request_file:
              if not re.fullmatch(r'\.build-requests/unity-web/[A-Za-z0-9._-]+\.json', request_file):
                  raise SystemExit('invalid Unity Web request path')
              request = pathlib.Path(request_file)
              if not request.is_file():
                  raise SystemExit('Unity Web request missing')
              data = json.loads(request.read_text(encoding='utf-8'))
              if data.get('version') != 1:
                  raise SystemExit('unsupported Unity Web request version')
              game_id = str(data.get('gameId','')).strip()
              project = str(data.get('projectPath','')).replace('\\','/').strip('/')
              method = str(data.get('buildMethod','')).strip()
              source_commit = str(data.get('sourceCommit','')).strip()
          else:
              project = str(project).replace('\\','/').strip('/')

          if not re.fullmatch(r'[a-z0-9][a-z0-9-]{1,80}', game_id):
              raise SystemExit('invalid gameId')
          if project != f'unity-games/{game_id}':
              raise SystemExit('projectPath must equal unity-games/<gameId>')
          if not method:
              editor = pathlib.Path(project) / 'Assets' / 'Editor'
              candidates = []
              if editor.is_dir():
                  for file in editor.rglob('*.cs'):
                      source = file.read_text(encoding='utf-8', errors='ignore')
                      if not re.search(r'public\s+static\s+void\s+BuildWeb\s*\(', source):
                          continue
                      namespace = re.search(r'\bnamespace\s+([A-Za-z_][A-Za-z0-9_.]*)', source)
                      classes = re.findall(r'(?:public\s+)?static\s+class\s+([A-Za-z_][A-Za-z0-9_]*)', source)
                      if len(classes) == 1:
                          prefix = f'{namespace.group(1)}.' if namespace else ''
                          candidates.append(f'{prefix}{classes[0]}.BuildWeb')
              candidates = sorted(set(candidates))
              if len(candidates) != 1:
                  raise SystemExit(f'BuildWeb method unresolved: {candidates}')
              method = candidates[0]
          if not re.fullmatch(r'[A-Za-z0-9_.]+', method):
              raise SystemExit('invalid buildMethod')
          version_file = pathlib.Path(project) / 'ProjectSettings' / 'ProjectVersion.txt'
          if not version_file.is_file():
              raise SystemExit('ProjectVersion.txt missing')
          text = version_file.read_text(encoding='utf-8')
          version = re.search(r'm_EditorVersion:\s*([^\s]+)', text)
          revision = re.search(r'm_EditorVersionWithRevision:\s*[^\s]+\s*\(([A-Za-z0-9]+)\)', text)
          if not version or not revision:
              raise SystemExit('Unity editor version unresolved')
          with open(output,'a',encoding='utf-8') as f:
              f.write(f'game_id={game_id}\n')
              f.write(f'project_path={project}\n')
              f.write(f'build_method={method}\n')
              f.write(f'source_commit={source_commit}\n')
              f.write(f'unity_version={version.group(1)}\n')
              f.write(f'unity_revision={revision.group(1)}\n')
          print(f'UNITY_WEB_GAME_ID={game_id}')
          print(f'UNITY_WEB_PROJECT={project}')
          print(f'UNITY_WEB_BUILD_METHOD={method}')
          PY

      - name: Verify Unity Web development-floor contract
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const policy=JSON.parse(fs.readFileSync('company-learning/platform-release-roadmap.json','utf8'));
          const c=policy.unityWebFirstStage;
          const gate=policy.directNativeDualPlatformDevelopment?.upperPlatformDevelopmentReadinessGate;
          if(c?.status!=='OWNER_DIRECT_LOCKED') throw new Error('Unity Web policy not locked');
          if(c?.scope!=='UPPER_PLATFORM_PREDEVELOPMENT_FULL_DEVELOPMENT_QA_FLOOR'||c?.enabled!==true||c?.developmentAdmissionAuthority!==false) throw new Error('Unity Web development floor contract changed');
          if(c?.canonicalGameSourceRoot!=='unity-games/<gameId>/') throw new Error('canonical Unity source changed');
          if(c?.publicWebBuildRoot!=='web-games/<gameId>/') throw new Error('Web build output changed');
          if(gate?.gateId!=='UPPER_PLATFORM_DEVELOPMENT_READY'||gate?.allCriteriaRequired!==true) throw new Error('upper-platform readiness gate missing');
          console.log('UNITY_WEB_DEVELOPMENT_FLOOR_CONTRACT=PASS');
          NODE

      - name: Bind canonical Unity source tree
        id: source
        shell: bash
        env:
          PROJECT_PATH: ${{ steps.request.outputs.project_path }}
        run: |
          set -euo pipefail
          test -d "$PROJECT_PATH"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          const root=process.env.PROJECT_PATH;
          const files=[];
          const walk=dir=>{for(const e of fs.readdirSync(dir,{withFileTypes:true})){const full=path.join(dir,e.name);const rel=path.relative(root,full).replaceAll('\\','/');if(e.isDirectory()){if(rel==='Library'||rel.startsWith('Library/')||rel==='Temp'||rel.startsWith('Temp/'))continue;walk(full);}else if(e.isFile())files.push(rel);}};
          walk(root);files.sort();
          const hash=crypto.createHash('sha256');
          for(const rel of files){hash.update(rel);hash.update('\0');hash.update(fs.readFileSync(path.join(root,rel)));hash.update('\0');}
          const digest=hash.digest('hex');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'tree_sha='+digest+'\n');
          console.log('UNITY_WEB_CANONICAL_SOURCE_TREE_SHA256='+digest);
          NODE

      - name: Cache Unity Web Library
        id: library_cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.request.outputs.project_path }}/Library
          key: unity-web-library-${{ runner.os }}-${{ steps.request.outputs.game_id }}-${{ hashFiles(format('{0}/Packages/manifest.json', steps.request.outputs.project_path), format('{0}/ProjectSettings/ProjectVersion.txt', steps.request.outputs.project_path)) }}
          restore-keys: |
            unity-web-library-${{ runner.os }}-${{ steps.request.outputs.game_id }}-

      - name: Record Unity Web Library cache decision
        shell: bash
        run: |
          echo "UNITY_WEB_LIBRARY_CACHE_HIT=${{ steps.library_cache.outputs.cache-hit }}"
          echo "UNITY_WEB_LIBRARY_CACHE_GAME=${{ steps.request.outputs.game_id }}"

      - name: Verify Unity credentials
        shell: bash
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$UNITY_EMAIL" ]] || { echo 'UNITY_EMAIL secret missing' >&2; exit 21; }
          [[ -n "$UNITY_PASSWORD" ]] || { echo 'UNITY_PASSWORD secret missing' >&2; exit 22; }

      - name: Install Unity Hub and WebGL Editor
        id: unity
        shell: bash
        env:
          UNITY_VERSION: ${{ steps.request.outputs.unity_version }}
          UNITY_REVISION: ${{ steps.request.outputs.unity_revision }}
        run: |
          set -euo pipefail
          sudo sh -c 'dbus-uuidgen > /etc/machine-id'
          sudo mkdir -p /var/lib/dbus
          sudo ln -sfn /etc/machine-id /var/lib/dbus/machine-id
          wget -qO- https://hub.unity3d.com/linux/keys/public | gpg --dearmor | sudo tee /usr/share/keyrings/Unity_Technologies_ApS.gpg >/dev/null
          sudo tee /etc/apt/sources.list.d/unityhub.sources >/dev/null <<'EOF'
          Types: deb
          URIs: https://hub.unity3d.com/linux/repos/deb
          Suites: stable
          Components: main
          Signed-By: /usr/share/keyrings/Unity_Technologies_ApS.gpg
          EOF
          echo 'deb https://archive.ubuntu.com/ubuntu jammy main universe' | sudo tee /etc/apt/sources.list.d/unity-jammy-compat.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unityhub xvfb libgtk2.0-0 libglu1-mesa libgconf-2-4 libncurses5
          sudo rm -rf /opt/unityhub
          sudo ln -s /usr/lib/unityhub /opt/unityhub
          sudo tee /usr/local/bin/unity-hub >/dev/null <<'EOF'
          #!/bin/bash
          set -e
          exec xvfb-run --auto-servernum /opt/unityhub/unityhub --headless "$@"
          EOF
          sudo chmod 755 /usr/local/bin/unity-hub
          install_root=/opt/unity/editors
          sudo mkdir -p "$install_root"
          sudo chown -R "$(id -u):$(id -g)" /opt/unity
          unity-hub install-path --set "$install_root"
          unity-hub install --version "$UNITY_VERSION" --changeset "$UNITY_REVISION" -m webgl --cm
          editor="$(find "$install_root" -type f -path '*/Editor/Unity' -perm -111 2>/dev/null | head -n1 || true)"
          [[ -n "$editor" && -x "$editor" ]] || { echo 'Unity editor missing' >&2; exit 25; }
          echo "editor=$editor" >> "$GITHUB_OUTPUT"

      - name: Activate Unity Personal
        id: license
        continue-on-error: true
        uses: RageAgainstThePixel/activate-unity-license@v2
        env:
          UNITY_HUB_PATH: /opt/unityhub/unityhub
          UNITY_EDITOR_PATH: ${{ steps.unity.outputs.editor }}
        with:
          license: personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}
          license-version: 6.x

      - name: Enforce Unity activation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ steps.license.outcome }}' == 'success' ]] || exit 198

      - name: Build Unity Web
        shell: bash
        env:
          UNITY_EDITOR_PATH: ${{ steps.unity.outputs.editor }}
          PROJECT_PATH: ${{ steps.request.outputs.project_path }}
          BUILD_METHOD: ${{ steps.request.outputs.build_method }}
        run: |
          set -euo pipefail
          "$UNITY_EDITOR_PATH" \
            -batchmode \
            -nographics \
            -quit \
            -buildTarget WebGL \
            -projectPath "$GITHUB_WORKSPACE/$PROJECT_PATH" \
            -executeMethod "$BUILD_METHOD" \
            -logFile /dev/stdout

      - name: Collect Unity Web output
        id: output
        shell: bash
        env:
          GAME_ID: ${{ steps.request.outputs.game_id }}
        run: |
          set -euo pipefail
          src="build/WebGL/$GAME_ID"
          test -s "$src/index.html"
          test -n "$(find "$src" -type f \( -name '*.wasm' -o -name '*.wasm.*' \) -size +0c | head -n1)"
          test -n "$(find "$src" -type f -name '*.data*' -size +0c | head -n1)"
          test -n "$(find "$src" -type f -name '*.framework.js*' -size +0c | head -n1)"
          test -n "$(find "$src" -type f -name '*.loader.js' -size +0c | head -n1)"
          out="/tmp/unity-web/web-games/$GAME_ID"
          mkdir -p "$out"
          cp -R "$src"/. "$out"/

          # 실제 Unity WebGL 페이지 안의 모바일 화면 점유·전체화면 제어
          python3 - "$out/index.html" <<'PY'
          import pathlib, re, sys
          entry=pathlib.Path(sys.argv[1])
          html=entry.read_text(encoding='utf-8')
          if 'createUnityInstance' not in html:
              raise SystemExit('Unity WebGL runtime entry missing')
          viewport='<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">'
          vp=r'<meta[^>]*name\s*=\s*["\x27]viewport["\x27][^>]*>'
          if re.search(vp,html,re.I):
              html=re.sub(vp,lambda match:viewport,html,count=1,flags=re.I)
          else:
              html=html.replace('</head>',viewport+'\n</head>',1)
          style="""<style id="jaewoon-unity-web-screen">
          html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
          #unity-container{width:100%!important;height:100%!important;min-height:100dvh;position:fixed!important;inset:0!important}
          #unity-canvas{width:100%!important;height:100%!important;display:block;touch-action:none}
          #jaewoon-fullscreen{position:fixed;z-index:2147483000;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));padding:10px 14px;background:#182438de;color:#fff;border:1px solid #ffffff66;border-radius:10px;font:600 14px sans-serif;touch-action:manipulation;cursor:pointer}
          </style>"""
          control="""<button id="jaewoon-fullscreen" type="button" aria-label="전체화면 전환">전체화면</button>
          <script>
          (()=>{const button=document.getElementById('jaewoon-fullscreen');
            button.addEventListener('pointerdown',event=>event.stopPropagation());
            button.addEventListener('click',event=>{
              event.stopPropagation();
              if(document.fullscreenElement){document.exitFullscreen?.();return;}
              const root=document.documentElement;
              const enter=root.requestFullscreen||root.webkitRequestFullscreen;
              if(!enter)return;
              try{const result=enter.call(root);if(result?.catch)result.catch(()=>{});}catch{}
            });
            const update=()=>{button.textContent=document.fullscreenElement?'전체화면 종료':'전체화면';};
            document.addEventListener('fullscreenchange',update);
            document.addEventListener('webkitfullscreenchange',update);
          })();
          </script>"""
          if '</head>' not in html or '</body>' not in html:
              raise SystemExit('Unity WebGL entry HTML incomplete')
          html=html.replace('</head>',style+'\n</head>',1)
          html=html.replace('</body>',control+'\n</body>',1)
          entry.write_text(html,encoding='utf-8')
          print('UNITY_WEB_FULLSCREEN_BUTTON=READY')
          PY

          # Cloudflare Pages serves each static asset only up to 25 MiB.
          # Fail before publication instead of exposing a homepage link to an undeployable bundle.
          python3 - "$out" "$GAME_ID" <<'PY'
          import hashlib, json, pathlib, sys
          root=pathlib.Path(sys.argv[1])
          game=sys.argv[2]
          build=root/'Build'
          if not build.is_dir():
              raise SystemExit('Unity Web Build directory missing from collected output')
          groups={
              'loader': sorted(build.glob('*.loader.js')),
              'data': sorted(build.glob('*.data*')),
              'framework': sorted(build.glob('*.framework.js*')),
              'wasm': sorted(build.glob('*.wasm*')),
          }
          missing=[name for name,files in groups.items() if not files]
          if missing:
              raise SystemExit('Unity Web deploy bundle incomplete: '+','.join(missing))
          max_bytes=25*1024*1024
          oversized=[]
          files=[]
          for file in sorted(build.iterdir()):
              if not file.is_file():
                  continue
              size=file.stat().st_size
              files.append({'path':file.relative_to(root).as_posix(),'bytes':size})
              if size>max_bytes:
                  oversized.append(f'{file.name}:{size}')
          if oversized:
              raise SystemExit('Cloudflare Pages 25MiB asset limit exceeded: '+' | '.join(oversized))
          manifest={
              'version':1,
              'engine':'UNITY_WEB',
              'gameId':game,
              'bundleComplete':True,
              'requiredGroups':{name:[f.relative_to(root).as_posix() for f in group] for name,group in groups.items()},
              'files':files,
              'cloudflareSingleAssetMaxBytes':max_bytes,
          }
          # Bind the approved world to this exact canonical Unity project build.
          approved=pathlib.Path('unity-games')/game/'Assets/Resources/vibe-world-layout.json'
          if approved.is_file():
              blob=approved.read_bytes()
              layout=json.loads(blob)
              if layout.get('layoutStatus')!='STATIC_LAYOUT_PROPOSED' or layout.get('gameplayCollisionAuthority') is not False or layout.get('saveMutation') is not False:
                  raise SystemExit('Unity Web approved environment source contract invalid')
              manifest['approvedEnvironment']={
                  'required':True,
                  'layoutSha256':hashlib.sha256(blob).hexdigest(),
                  'terrainCells':len(layout.get('heights') or []),
                  'buildingCount':len(layout.get('buildings') or []),
                  'vegetationCount':len(layout.get('vegetation') or []),
                  'collisionAuthorityChanged':False,
                  'saveMeaningChanged':False,
              }
          else:
              manifest['approvedEnvironment']={'required':False}
          (root/'unity-web-deploy-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          PY

          tree_sha="$(find "$out" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          echo "tree_sha=$tree_sha" >> "$GITHUB_OUTPUT"

      - name: Prepare Unity Web browser runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          echo 'UNITY_WEB_BROWSER_RUNTIME=READY'

      - name: Run Unity Web actual browser play
        # Daechung 테스트 공개를 위해 FPS 실패 시에도 실제 전투·터치·저장 증거까지 기록한다.
        # 실패 판정과 정식 플랫폼 QA 게이트는 유지한다.
        continue-on-error: true
        shell: bash
        env:
          GAME_ID: ${{ steps.request.outputs.game_id }}
        run: |
          set -euo pipefail
          cd /tmp/unity-web
          node "$GITHUB_WORKSPACE/tools/company-unity-web-gameplay-validation.mjs" \
            --game-id="$GAME_ID" \
            --source="web-games/$GAME_ID" \
            --port=4187 \
            --output="/tmp/unity-web/web-games/$GAME_ID/unity-web-gameplay-validation.json" \
            --screenshot="/tmp/unity-web/gameplay-mobile.png"

      - name: Run Unity Web independent QA
        # Daechung 테스트 공개를 위해 FPS 실패 시에도 실제 전투·터치·저장 증거까지 기록한다.
        # 실패 판정과 정식 플랫폼 QA 게이트는 유지한다.
        continue-on-error: true
        shell: bash
        env:
          GAME_ID: ${{ steps.request.outputs.game_id }}
        run: |
          set -euo pipefail
          cd /tmp/unity-web
          node "$GITHUB_WORKSPACE/tools/company-unity-web-gameplay-validation.mjs" \
            --game-id="$GAME_ID" \
            --source="web-games/$GAME_ID" \
            --port=4188 \
            --output="/tmp/unity-web/web-games/$GAME_ID/unity-web-independent-qa.json" \
            --screenshot="/tmp/unity-web/independent-qa-mobile.png"

      - name: Run Unity Web regression
        # Daechung 테스트 공개를 위해 FPS 실패 시에도 실제 전투·터치·저장 증거까지 기록한다.
        # 실패 판정과 정식 플랫폼 QA 게이트는 유지한다.
        continue-on-error: true
        shell: bash
        env:
          GAME_ID: ${{ steps.request.outputs.game_id }}
        run: |
          set -euo pipefail
          cd /tmp/unity-web
          node "$GITHUB_WORKSPACE/tools/company-unity-web-gameplay-validation.mjs" \
            --game-id="$GAME_ID" \
            --source="web-games/$GAME_ID" \
            --port=4189 \
            --output="/tmp/unity-web/web-games/$GAME_ID/unity-web-regression.json" \
            --screenshot="/tmp/unity-web/regression-mobile.png"

      - name: Write build evidence
        id: evidence
        shell: bash
        env:
          GAME_ID: ${{ steps.request.outputs.game_id }}
          SOURCE_COMMIT: ${{ steps.request.outputs.source_commit }}
          TREE_SHA: ${{ steps.output.outputs.tree_sha }}
          UNITY_SOURCE_TREE_SHA: ${{ steps.source.outputs.tree_sha }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const gameId=process.env.GAME_ID;
          const root='/tmp/unity-web/web-games/'+gameId;
          const play=JSON.parse(fs.readFileSync(root+'/unity-web-gameplay-validation.json','utf8'));
          const independent=JSON.parse(fs.readFileSync(root+'/unity-web-independent-qa.json','utf8'));
          const regression=JSON.parse(fs.readFileSync(root+'/unity-web-regression.json','utf8'));
          const checks=[play,independent,regression];
          // 3회 실제 브라우저 부팅 증거가 없는 경우 다른 성공 표식으로 대체하지 않는다.
          if(checks.some(e=>e.playableBrowserTest!==true||e.boot?.pass!==true))
            throw new Error('UNITY_WEB_ACTUAL_PLAY_BOOT_EVIDENCE_REQUIRED');
          // 실제 3회 브라우저에서 부팅·터치·전투·보상·저장이 확인된 경우만 테스트 링크 허용.
          // 소프트웨어 모바일 렌더러 FPS 미달은 QA FAIL로 보존하며 정식 출시를 금지한다.
          const playable=checks.every(e=>e.playableBrowserTest===true
            &&e.boot?.pass===true&&e.input?.pass===true&&e.gameplay?.pass===true
            &&e.coreFun?.pass===true&&e.saveRestore?.pass===true
            &&e.mobile?.pass===true&&e.noCriticalRuntimeError===true
            &&e.visualQa?.pass===true);
          if(!playable)throw new Error('UNITY_WEB_REAL_BROWSER_PLAYABILITY_REQUIRED');
          // 개발자 테스트도 실제 3D, 실조작, 모바일 및 저장 증거가 필수다.
          // 프레임 성능·최종 회귀 실패는 QA 실패로 남기되 테스트 접근을 막지는 않는다.
          const verified3d=checks.every(e=>e.spatialGameplay?.pass===true&&e.spatialGameplay?.requiredDimension==='3D'
            &&Number(e.spatialGameplay.observedMeshCount)>0&&Number(e.spatialGameplay.observedTriangles)>0
            &&e.spatialGameplay.depthPass===true&&e.spatialGameplay.perspectiveCamera===true
            &&Number(e.spatialGameplay.worldMeshes3d)>=2&&Number(e.spatialGameplay.worldDepthCm)>=50
            &&Number(e.spatialGameplay.gameplayActors3d)>=1&&e.spatialGameplay.spriteGameplayActors===0
            &&e.visualQa?.nativeUnityMesh?.pass===true);
          if(!verified3d)throw new Error('UNITY_WEB_OWNER_TEST_REQUIRES_REAL_3D_GAMEPLAY');
          const gatePass=checks.every(e=>e.pass===true&&e.performance?.pass===true)&&verified3d;
          const file=root+'/unity-web-build.json';
          console.log('UNITY_WEB_BOOT_SMOKE=PASS:ACTUAL_PLAY_EVIDENCE');
          console.log('UNITY_WEB_GAMEPLAY_QA='+(gatePass?'PASS':'REPAIR_REQUIRED'));
          fs.writeFileSync(file,JSON.stringify({
            version:2,
            engine:'UNITY_WEB',
            gameId,
            canonicalSourceRoot:'unity-games/'+gameId,
            buildOutputRoot:'web-games/'+gameId,
            sourceCommit:process.env.SOURCE_COMMIT||process.env.GITHUB_SHA,
            unitySourceTreeSha256:process.env.UNITY_SOURCE_TREE_SHA,
            buildTreeSha256:process.env.TREE_SHA,
            bootSmoke:'PASS',
            actualBrowserPlay:gatePass?'PASS':'PLAYABLE_TEST_ONLY',
            ownerBrowserTestEligible:true,
            ownerTestRequiresNative3d:true,
            finalQaPassed:gatePass,
            independentQa:independent.pass===true?'PASS':'REPAIR_REQUIRED',
            regression:regression.pass===true?'PASS':'REPAIR_REQUIRED',
            upperPlatformGateCandidate:gatePass,
            validationSurfaceOnly:!gatePass,
            nativeGateAuthority:gatePass,
            releaseOrDeploymentAuthority:false,
            generatedAt:new Date().toISOString()
          },null,2)+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'owner_test_eligible=true\n');
          console.log('UNITY_WEB_OWNER_TEST_ELIGIBLE=YES');
          NODE

      - name: Evaluate upper-platform development readiness
        id: readiness
        shell: bash
        env:
          GAME_ID: ${{ steps.request.outputs.game_id }}
          SOURCE_COMMIT: ${{ steps.request.outputs.source_commit }}
          UNITY_SOURCE_TREE_SHA: ${{ steps.source.outputs.tree_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin company-runtime
          git show origin/company-runtime:development-queue.json > /tmp/company-runtime-development-queue.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          const gameId=process.env.GAME_ID;
          const root='/tmp/unity-web/web-games/'+gameId;
          const queue=JSON.parse(fs.readFileSync('/tmp/company-runtime-development-queue.json','utf8'));
          const item=(queue.items||[]).find(row=>row.gameId===gameId);
          if(!item)throw new Error('UPPER_PLATFORM_QUEUE_ITEM_MISSING:'+gameId);
          const build=JSON.parse(fs.readFileSync(path.join(root,'unity-web-build.json'),'utf8'));
          const play=JSON.parse(fs.readFileSync(path.join(root,'unity-web-gameplay-validation.json'),'utf8'));
          const independent=JSON.parse(fs.readFileSync(path.join(root,'unity-web-independent-qa.json'),'utf8'));
          const regression=JSON.parse(fs.readFileSync(path.join(root,'unity-web-regression.json'),'utf8'));
          const project=path.join(process.cwd(),'unity-games',gameId);
          const countFiles=dir=>{
            const target=path.join(project,'Assets',dir);
            if(!fs.existsSync(target))return 0;
            let n=0;
            const walk=p=>{for(const e of fs.readdirSync(p,{withFileTypes:true})){const full=path.join(p,e.name);if(e.isDirectory())walk(full);else if(e.isFile()&&!e.name.endsWith('.meta'))n++;}};
            walk(target);return n;
          };
          const designPass=item.minimumDesignContract?.pass===true
            &&Boolean(item.platformDesignProfiles?.ROBLOX?.source)
            &&Boolean(item.platformDesignProfiles?.UNITY?.source);
          const codePass=play.pass===true&&play.gameplay?.pass===true&&play.coreFun?.pass===true&&play.noCriticalRuntimeError===true;
          const graphicsCounts={Art:countFiles('Art'),Prefabs:countFiles('Prefabs'),Materials:countFiles('Materials'),Animations:countFiles('Animations')};
          const floorSourceFile=path.join(project,'unity-web-floor-source.json');
          let floorSource={};try{if(fs.existsSync(floorSourceFile))floorSource=JSON.parse(fs.readFileSync(floorSourceFile,'utf8'));}catch{}
          const bootstrapGraphicsBlocked=floorSource?.presentationState==='BOOTSTRAP_REQUIRES_GRAPHICS_BUILDUP'||floorSource?.upperPlatformReady===false;
          // 기존 2D 검증 결과와 가짜 표시를 제외하고, 세 번의 브라우저 QA에서 실제 Unity 메시를 확인한다.
          const native3dChecks=[
            ['BROWSER_PLAY',play],['INDEPENDENT_QA',independent],['REGRESSION',regression]
          ].map(([stage,e])=>({
            stage,requiredDimension:e.spatialGameplay?.requiredDimension||null,
            source:e.spatialGameplay?.source||null,
            observedMeshCount:Number(e.spatialGameplay?.observedMeshCount||0),
            observedTriangles:Number(e.spatialGameplay?.observedTriangles||0),
            depthPass:e.spatialGameplay?.depthPass===true,
            perspectiveCamera:e.spatialGameplay?.perspectiveCamera===true,
            worldMeshes3d:Number(e.spatialGameplay?.worldMeshes3d||0),
            worldDepthCm:Number(e.spatialGameplay?.worldDepthCm||0),
            gameplayActors3d:Number(e.spatialGameplay?.gameplayActors3d||0),
            spriteGameplayActors:Number(e.spatialGameplay?.spriteGameplayActors??-1),
            pass:e.spatialGameplay?.pass===true&&e.spatialGameplay?.depthPass===true
              &&e.visualQa?.nativeUnityMesh?.pass===true
              &&e.visualQa?.nativeUnityMesh?.measurementState==='UNITY_RUNTIME_MESH_INSPECTION'
          }));
          const native3dVerified=native3dChecks.every(e=>
            e.pass&&e.requiredDimension==='3D'&&e.source==='UNITY_RUNTIME_MESH_FILTER_TRIANGLE_AND_3AXIS_WORLD_DEPTH_PROOF'
            &&Number.isSafeInteger(e.observedMeshCount)&&e.observedMeshCount>0
            &&Number.isSafeInteger(e.observedTriangles)&&e.observedTriangles>0
             &&e.depthPass===true&&e.perspectiveCamera===true
             &&Number.isSafeInteger(e.worldMeshes3d)&&e.worldMeshes3d>=2
             &&Number.isSafeInteger(e.worldDepthCm)&&e.worldDepthCm>=50
             &&Number.isSafeInteger(e.gameplayActors3d)&&e.gameplayActors3d>=1
             &&e.spriteGameplayActors===0);
          const graphicsPass=!bootstrapGraphicsBlocked
            &&Object.values(graphicsCounts).filter(v=>v>0).length>=3
            &&fs.existsSync('/tmp/unity-web/gameplay-mobile.png')
            &&native3dVerified;
          const webglPass=build.bootSmoke==='PASS'
            &&build.unitySourceTreeSha256===process.env.UNITY_SOURCE_TREE_SHA
            &&Boolean(build.buildTreeSha256)
            &&fs.existsSync(path.join(root,'unity-web-deploy-manifest.json'));
          const actualPlayPass=play.pass===true&&play.mobile?.pass===true&&play.coreFun?.pass===true;
          const designSource=String(item.minimumDesignContract?.source||'');
          let multiplayerRequired=false;
          if(designSource){
            try{
              const raw=JSON.parse(execFileSync('git',['show','origin/company-runtime:'+designSource],{encoding:'utf8'}));
              const mode=String(raw?.content?.multiplayerMode||'').toUpperCase();
              multiplayerRequired=Boolean(mode&&mode!=='SINGLE'&&mode!=='SINGLE_PLAYER');
            }catch{}
          }
          const multiplayerEvidence=item.unityWebMultiplayerQaEvidence||null;
          const multiplayerPass=!multiplayerRequired
            ||(multiplayerEvidence?.pass===true&&Number(multiplayerEvidence?.participantCount||0)>=2&&multiplayerEvidence?.authoritativeSync===true);
          const qaPass=independent.pass===true&&regression.pass===true
            &&independent.saveRestore?.pass===true&&regression.saveRestore?.pass===true
            &&multiplayerPass;
          const portabilityPass=designPass
            &&build.canonicalSourceRoot==='unity-games/'+gameId
            &&build.buildOutputRoot==='web-games/'+gameId;
          const criteria={
            design:{pass:designPass},
            code:{pass:codePass},
            graphics:{pass:graphicsPass,native3dVerified,requiredDimension:'3D',native3dChecks,assetCounts:graphicsCounts,bootstrapGraphicsBlocked},
            webglBuild:{pass:Boolean(webglPass)},
            actualPlay:{pass:actualPlayPass},
            qa:{pass:qaPass,multiplayerRequired,multiplayerPass},
            portability:{pass:portabilityPass},
          };
          const pass=Object.values(criteria).every(row=>row.pass===true);
          const evidence={
            version:1,
            gameId,
            state:pass?'UPPER_PLATFORM_DEVELOPMENT_READY':'REPAIR_REQUIRED',
            pass,
            sourceCommit:process.env.SOURCE_COMMIT||process.env.GITHUB_SHA,
            unitySourceTreeSha256:process.env.UNITY_SOURCE_TREE_SHA,
            buildTreeSha256:build.buildTreeSha256,
            criteria,
            passAction:pass?'START_CONCURRENT_ROBLOX_AND_UNITY_UPPER_PLATFORM_DEVELOPMENT':null,
            failureAction:pass?null:'REPAIR_CAUSAL_UNITY_WEB_FLOOR_THEN_REBUILD_REPLAY_REQA_REREGRESSION',
            releaseOrDeploymentAuthority:false,
            generatedAt:new Date().toISOString(),
          };
          fs.writeFileSync(path.join(root,'upper-platform-development-readiness.json'),JSON.stringify(evidence,null,2)+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'pass='+(pass?'true':'false')+'\n');
          console.log('UPPER_PLATFORM_DEVELOPMENT_READY='+(pass?'PASS':'NO'));
          if(!pass)console.log('UPPER_PLATFORM_REPAIR_REQUIRED='+JSON.stringify(criteria));
          NODE

      - name: Upload Unity Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: unity-web-${{ steps.request.outputs.game_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/unity-web
          if-no-files-found: error
          retention-days: 7

      - name: Create verified Unity Web readiness PR
        if: steps.evidence.outputs.owner_test_eligible == 'true' && (github.event_name == 'push' || inputs.publish_to_main == true)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_ID: ${{ steps.request.outputs.game_id }}
          READINESS_PASS: ${{ steps.readiness.outputs.pass }}
          OWNER_TEST_ELIGIBLE: ${{ steps.evidence.outputs.owner_test_eligible }}
          SOURCE_COMMIT: ${{ steps.request.outputs.source_commit || github.sha }}
          BASE_MAIN_SHA: ${{ inputs.base_main_sha }}
          VIBE2_TASK_ID: ${{ inputs.vibe2_task_id }}
          VIBE2_CANDIDATE_BRANCH: ${{ inputs.vibe2_candidate_branch }}
          GENERATED_ASSET_FILES: ${{ inputs.generated_asset_files || '[]' }}
        run: |
          set -euo pipefail
          mapfile -t generated_asset_files < <(node -e "for(const file of JSON.parse(process.env.GENERATED_ASSET_FILES||'[]'))console.log(file)")
          for file in "${generated_asset_files[@]}"; do
            [[ "$file" == assets/* ]] || { echo "UNITY_WEB_GENERATED_ASSET_PATH_INVALID=$file" >&2; exit 1; }
            [[ "$file" != /* && "$file" != *"/../"* && "$file" != ../* && "$file" != */.. ]] || { echo "UNITY_WEB_GENERATED_ASSET_PATH_INVALID=$file" >&2; exit 1; }
            git cat-file -e "${SOURCE_COMMIT}:$file" 2>/dev/null || { echo "UNITY_WEB_GENERATED_ASSET_MISSING=$file" >&2; exit 1; }
          done
          candidate_paths=("unity-games/$GAME_ID" "${generated_asset_files[@]}")
          # 정식 QA가 끝난 게임만 기존 주소로 승격한다.
          # 실제 3D 조작·저장 검증을 통과한 개발 빌드는 같은 게임의 /unity/ 경로에서 시험한다.
          test "$OWNER_TEST_ELIGIBLE" = "true"
          runtime_dir="web-games/$GAME_ID"
          if [ "$READINESS_PASS" != 'true' ]; then
            runtime_dir="web-games/$GAME_ID/unity"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main
          git cat-file -e "${SOURCE_COMMIT}^{commit}" 2>/dev/null || { echo 'UNITY_WEB_SOURCE_COMMIT_MISSING' >&2; exit 1; }
          # 이전 Unity 소스로 최신 main 그래픽·아트·멀티 변경을 덮어쓰지 않는다.
          git diff --quiet "$SOURCE_COMMIT" origin/main -- "${candidate_paths[@]}" || {
            echo 'UNITY_WEB_SOURCE_SUPERSEDED_BY_NEW_MAIN_REBUILD_REQUIRED' >&2
            exit 1
          }
          if [ -n "$VIBE2_TASK_ID" ]; then
            [[ "$BASE_MAIN_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'VIBE2_UNITY_WEB_BASE_MAIN_SHA_INVALID' >&2; exit 1; }
            [ -n "$VIBE2_CANDIDATE_BRANCH" ] || { echo 'VIBE2_UNITY_WEB_CANDIDATE_BRANCH_MISSING' >&2; exit 1; }
          fi
          if [ -n "$BASE_MAIN_SHA" ]; then
            git cat-file -e "${BASE_MAIN_SHA}^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$BASE_MAIN_SHA"
            git diff --quiet "$BASE_MAIN_SHA" origin/main -- "${candidate_paths[@]}" || { echo 'VIBE2_UNITY_WEB_MAIN_SOURCE_OR_ASSET_DRIFT_BEFORE_PR' >&2; exit 1; }
          fi

          branch="unity-web/$GAME_ID-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -B "$branch" origin/main
          git checkout "$SOURCE_COMMIT" -- "${candidate_paths[@]}"
          # 개발 테스트는 기존 /web-games/<gameId>/ 및 저장 키를 건드리지 않는다.
          rm -rf "$runtime_dir"
          mkdir -p "$runtime_dir"
          cp -R "/tmp/unity-web/web-games/$GAME_ID"/. "$runtime_dir"/
          test -s "$runtime_dir/index.html"
          test -d "$runtime_dir/Build"
          test -s "$runtime_dir/unity-web-deploy-manifest.json"
          test -s "$runtime_dir/unity-web-gameplay-validation.json"
          test -s "$runtime_dir/unity-web-independent-qa.json"
          test -s "$runtime_dir/unity-web-regression.json"
          git add "unity-games/$GAME_ID" "$runtime_dir"
          if [ "${#generated_asset_files[@]}" -gt 0 ]; then
            git add -- "${generated_asset_files[@]}"
          fi
          # Historical repo-wide Unity ignore rules matched this nested public Build directory.
          # Force-add the runtime bundle so index.html never lands without loader/data/framework/wasm.
          git add -f "$runtime_dir/Build"
          test -n "$(git ls-files "$runtime_dir/Build/*.loader.js" | head -n1)"
          test -n "$(git ls-files "$runtime_dir/Build/*.data*" | head -n1)"
          test -n "$(git ls-files "$runtime_dir/Build/*.framework.js*" | head -n1)"
          test -n "$(git ls-files "$runtime_dir/Build/*.wasm*" | head -n1)"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "UNITY_WEB_PUBLICATION_PR=NO_CHANGE"
            if [ -n "$VIBE2_TASK_ID" ]; then
              echo 'VIBE2_UNITY_WEB_REVIEWED_PROMOTION_REQUIRED_BUT_NO_CHANGE' >&2
              exit 1
            fi
            exit 0
          fi

          if [ "$READINESS_PASS" = 'true' ]; then
            publication_label='Unity Web readiness'
          else
            publication_label='Unity Web owner playable test (final QA repair required)'
          fi
          git commit -m "build: publish $GAME_ID $publication_label"
          release_commit="$(git rev-parse HEAD)"
          git push --force-with-lease origin HEAD:"$branch"
          pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "build: publish $GAME_ID $publication_label" \
            --body "Actual Unity WebGL owner test from workflow run $GITHUB_RUN_ID. Game: $GAME_ID; runtime path: $runtime_dir; canonical source: $SOURCE_COMMIT. Browser boot, 3D gameplay, mobile input and save/restore are required for every owner test. UPPER_PLATFORM_DEVELOPMENT_READY=$READINESS_PASS. When false, this is PLAYABLE_TEST_ONLY with QA REPAIR_REQUIRED, not final validation or release; /web-games/$GAME_ID/ and its saved data remain unchanged. When true, the validated build uses the established game URL.")"
          echo "UNITY_WEB_READINESS_PR=$pr_url"
          echo "UNITY_WEB_REVIEWED_PROMOTION_PR=$pr_url"
          echo 'UNITY_WEB_DIRECT_MAIN_WRITE=NO'

          for attempt in $(seq 1 60); do
            pages_state="$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/commits/$release_commit/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name=="Cloudflare Pages")] | sort_by(.started_at) | last | if . == null then "missing:" else (.status + ":" + (.conclusion // "")) end')"
            echo "UNITY_WEB_CLOUDFLARE_PREVIEW=$pages_state"
            case "$pages_state" in
              completed:success) break ;;
              completed:*) echo "Unity Web Cloudflare preview failed: $pages_state" >&2; exit 1 ;;
            esac
            if [ "$attempt" -ge 60 ]; then echo 'Unity Web Cloudflare preview did not complete successfully' >&2; exit 1; fi
            sleep 10
          done

          git fetch --no-tags origin main
          git diff --quiet "$SOURCE_COMMIT" origin/main -- "${candidate_paths[@]}" || {
            echo 'UNITY_WEB_SOURCE_SUPERSEDED_DURING_PREVIEW_REBUILD_REQUIRED' >&2
            exit 1
          }
          if [ -n "$BASE_MAIN_SHA" ]; then
            git diff --quiet "$BASE_MAIN_SHA" origin/main -- "${candidate_paths[@]}" || { echo 'VIBE2_UNITY_WEB_MAIN_SOURCE_OR_ASSET_DRIFT_BEFORE_MERGE' >&2; exit 1; }
          fi
          gh pr merge "$pr_url" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
          git fetch --no-tags origin main
          merged_paths=("unity-games/$GAME_ID" "$runtime_dir" "${generated_asset_files[@]}")
          git diff --quiet "$release_commit" origin/main -- "${merged_paths[@]}" || { echo 'UNITY_WEB_MERGED_TREE_MISMATCH' >&2; exit 1; }

          promotion_sha="$(git rev-parse origin/main)"
          unity_source_tree_sha="$(git rev-parse "origin/main:unity-games/$GAME_ID")"
          web_source_tree_sha="$(git rev-parse "origin/main:web-games/$GAME_ID")"
          [[ "$unity_source_tree_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$web_source_tree_sha" =~ ^[0-9a-f]{40}$ ]]

          for attempt in $(seq 1 60); do
            pages_state="$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/commits/$promotion_sha/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name=="Cloudflare Pages")] | sort_by(.started_at) | last | if . == null then "missing:" else (.status + ":" + (.conclusion // "")) end')"
            echo "UNITY_WEB_CLOUDFLARE_MAIN=$pages_state"
            case "$pages_state" in
              completed:success) break ;;
              completed:*) echo "Unity Web Cloudflare main deployment failed: $pages_state" >&2; exit 1 ;;
            esac
            if [ "$attempt" -ge 60 ]; then echo 'Unity Web Cloudflare main deployment did not complete successfully' >&2; exit 1; fi
            sleep 10
          done

          echo "UNITY_WEB_MAIN_PROMOTION_SHA=$promotion_sha"
          echo "UNITY_WEB_PUBLIC_BROWSER_TEST_PATH=/$runtime_dir/"
          echo "UNITY_WEB_UPPER_PLATFORM_READY=$READINESS_PASS"
          echo "UNITY_WEB_MAIN_UNITY_SOURCE_TREE_SHA=$unity_source_tree_sha"
          echo "UNITY_WEB_MAIN_RUNTIME_SOURCE_TREE_SHA=$web_source_tree_sha"

          if [ -n "$VIBE2_TASK_ID" ] && [ "$READINESS_PASS" = 'true' ]; then
            rm -rf /tmp/vibe2-control /tmp/vibe2-main-contract
            gh auth setup-git --hostname github.com
            gh repo clone "$GITHUB_REPOSITORY" /tmp/vibe2-control -- --branch vibe2-unreal-core --single-branch --depth=1 --no-tags >/dev/null 2>&1
            git -C /tmp/vibe2-control fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main --quiet
            git -C /tmp/vibe2-control worktree add --detach /tmp/vibe2-main-contract origin/main >/dev/null
            git -C /tmp/vibe2-control config user.name 'jaewoon-unity-web-release'
            git -C /tmp/vibe2-control config user.email 'unity-web-release@users.noreply.github.com'
            settled=0
            for settle_attempt in 1 2 3; do
              git -C /tmp/vibe2-control fetch --no-tags --depth=1 origin +refs/heads/vibe2-unreal-core:refs/remotes/origin/vibe2-unreal-core --quiet
              git -C /tmp/vibe2-control reset --hard origin/vibe2-unreal-core
              node /tmp/vibe2-main-contract/tools/vibe2-queue-control.mjs pass --queue=/tmp/vibe2-control/.vibe2/queue.json --id="$VIBE2_TASK_ID" --evidence="execution-surface:UNITY_WEB,unity-web-webgl-build-pass,unity-web-browser-play-pass,unity-web-independent-qa-pass,unity-web-regression-pass,unity-web-native-3d-runtime-pass,unity-web-cloudflare-preview-pass,unity-web-main-pr-merged,unity-web-cloudflare-deployment-pass,unity-web-candidate-branch:$VIBE2_CANDIDATE_BRANCH,unity-web-source-tree:$unity_source_tree_sha,unity-web-runtime-source-tree:$web_source_tree_sha,unity-web-main-sha:$promotion_sha,actions-run-${GITHUB_RUN_ID}"
              git -C /tmp/vibe2-control add .vibe2/queue.json
              if git -C /tmp/vibe2-control diff --cached --quiet; then
                settled=1
                break
              fi
              git -C /tmp/vibe2-control commit -m "vibe2: settle Unity Web task $VIBE2_TASK_ID PASS [skip ci]"
              if git -C /tmp/vibe2-control push origin HEAD:vibe2-unreal-core; then
                settled=1
                break
              fi
              sleep $((settle_attempt * 2))
            done
            test "$settled" = 1
            payload="$(jq -nc \
              --arg run "${GITHUB_RUN_ID:-}" \
              --arg attempt "${GITHUB_RUN_ATTEMPT:-}" \
              --arg task "$VIBE2_TASK_ID" \
              --arg outcome "VERIFIED" \
              '{event_type:"vibe2-fanin-refill",client_payload:{source_run:$run,source_attempt:$attempt,source_task:$task,source_outcome:$outcome,reason:"unity-web-reviewed-main-cloudflare-pass"}}')"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
              --data "$payload"
            echo "VIBE2_EVENT_DRIVEN_DEPENDENCY_REFILL=$VIBE2_TASK_ID:VERIFIED"
            echo "VIBE2_UNITY_WEB_TASK_FINAL_PASS=EXACT_SOURCE_RUNTIME_AND_DEPLOYMENT:$unity_source_tree_sha:$web_source_tree_sha"
          fi

      - name: Mark Unity Web floor repair requirement
        id: repair
        if: steps.readiness.outputs.pass != 'true'
        shell: bash
        env:
          GAME_ID: ${{ steps.request.outputs.game_id }}
        run: |
          set -euo pipefail
          echo 'required=true' >> "$GITHUB_OUTPUT"
          echo 'UNITY_WEB_FLOOR_STATE=REPAIR_REQUIRED'
          echo "UNITY_WEB_REPAIR_GAME_ID=$GAME_ID"
          echo 'UNITY_WEB_REPAIR_PLANNER_HANDOFF=REUSABLE_WORKFLOW'
          exit 42

  settle-vibe2-failure:
    name: Settle failed Vibe2 Unity Web candidate
    needs: build
    if: always() && needs.build.result == 'failure' && inputs.vibe2_task_id != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Requeue exact failed Unity Web stage
        env:
          GH_TOKEN: ${{ github.token }}
          VIBE2_TASK_ID: ${{ inputs.vibe2_task_id }}
          VIBE2_CANDIDATE_BRANCH: ${{ inputs.vibe2_candidate_branch }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/vibe2-control /tmp/vibe2-main-contract
          gh auth setup-git --hostname github.com
          gh repo clone "$GITHUB_REPOSITORY" /tmp/vibe2-control -- --branch vibe2-unreal-core --single-branch --depth=1 --no-tags >/dev/null 2>&1
          git -C /tmp/vibe2-control fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main --quiet
          git -C /tmp/vibe2-control worktree add --detach /tmp/vibe2-main-contract origin/main >/dev/null
          git -C /tmp/vibe2-control config user.name 'jaewoon-unity-web-release'
          git -C /tmp/vibe2-control config user.email 'unity-web-release@users.noreply.github.com'
          settled=0
          for attempt in 1 2 3; do
            git -C /tmp/vibe2-control fetch --no-tags --depth=1 origin +refs/heads/vibe2-unreal-core:refs/remotes/origin/vibe2-unreal-core --quiet
            git -C /tmp/vibe2-control reset --hard origin/vibe2-unreal-core
            node /tmp/vibe2-main-contract/tools/vibe2-queue-control.mjs fail --queue=/tmp/vibe2-control/.vibe2/queue.json --id="$VIBE2_TASK_ID" --blocker=unity-web-runtime-or-promotion-failed --evidence="execution-surface:UNITY_WEB,unity-web-candidate-branch:$VIBE2_CANDIDATE_BRANCH,actions-run-${GITHUB_RUN_ID}"
            git -C /tmp/vibe2-control add .vibe2/queue.json
            if git -C /tmp/vibe2-control diff --cached --quiet; then
              settled=1
              break
            fi
            git -C /tmp/vibe2-control commit -m "vibe2: settle Unity Web task $VIBE2_TASK_ID REPAIR_REQUIRED [skip ci]"
            if git -C /tmp/vibe2-control push origin HEAD:vibe2-unreal-core; then
              settled=1
              break
            fi
            sleep $((attempt * 2))
          done
          test "$settled" = 1
          payload="$(jq -nc \
            --arg run "${GITHUB_RUN_ID:-}" \
            --arg attempt "${GITHUB_RUN_ATTEMPT:-}" \
            --arg task "$VIBE2_TASK_ID" \
            --arg outcome "QUEUE_UPDATED" \
            '{event_type:"vibe2-fanin-refill",client_payload:{source_run:$run,source_attempt:$attempt,source_task:$task,source_outcome:$outcome,reason:"unity-web-repair-required"}}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
            --data "$payload"
          echo "VIBE2_UNITY_WEB_TASK_REPAIR_REQUIRED=$VIBE2_TASK_ID"

  repair-vibe2:
    name: Re-enter Vibe2 Unity Web causal repair
    needs: [build, settle-vibe2-failure]
    if: always() && (needs.build.outputs.repair_required == 'true' || needs.build.result == 'failure')
    permissions:
      contents: write
      actions: write
      pull-requests: write
    uses: ./.github/workflows/vibe2-24h-runner.yml
    secrets: inherit
