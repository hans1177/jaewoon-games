name: Unity Web Development Floor
run-name: Unity Web Floor ${{ inputs.game_id || inputs.request_file || github.event.head_commit.message }}

on:
  push:
    branches:
      - main
    paths:
      - '.build-requests/unity-web/**'
  workflow_call:
    inputs:
      request_file:
        required: false
        type: string
      game_id:
        required: false
        type: string
      project_path:
        required: false
        type: string
      build_method:
        required: false
        type: string
      source_commit:
        required: false
        type: string
      publish_to_main:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      request_file:
        description: 'Optional tracked .build-requests/unity-web/*.json request file'
        required: false
        default: ''
        type: string
      game_id:
        description: 'Direct game id when request_file is omitted'
        required: false
        default: ''
        type: string
      project_path:
        description: 'Direct canonical Unity project path'
        required: false
        default: ''
        type: string
      build_method:
        description: 'Direct fully qualified Unity BuildWeb method'
        required: false
        default: ''
        type: string
      source_commit:
        description: 'Direct source revision binding'
        required: false
        default: ''
        type: string
      publish_to_main:
        description: 'Create a PR containing verified output for web-games'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  dedupe:
    name: Keep one active exact Unity Web floor run
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Suppress duplicate same-game floor work before heavy runner allocation
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_ID: ${{ inputs.game_id || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$GAME_ID" ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'UNITY_WEB_FLOOR_DEDUPE=BYPASS_NO_EXACT_GAME_ID'
            exit 0
          fi
          title="Unity Web Floor $GAME_ID"
          winner="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/unity-web-first-stage-build.yml/runs?per_page=100" | jq -r --arg title "$title" --arg current "$GITHUB_RUN_ID" '
            [.workflow_runs[]
              | select(.display_title==$title)
              | select(.status=="queued" or .status=="pending" or .status=="in_progress" or .status=="requested")
              | .id]
            | map(select((tostring)==$current or . != null))
            | sort
            | .[0] // empty
          ')"
          echo "UNITY_WEB_FLOOR_ACTIVE_WINNER=${winner:-NONE}"
          if [[ "$winner" =~ ^[0-9]+$ && "$winner" != "$GITHUB_RUN_ID" ]]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo "UNITY_WEB_FLOOR_EXACT_DEDUPED_ACTIVE=$GAME_ID:$GITHUB_RUN_ID:$winner"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo "UNITY_WEB_FLOOR_EXACT_RUN_ALLOWED=$GAME_ID:$GITHUB_RUN_ID"
          fi

  build:
    needs: dedupe
    if: needs.dedupe.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      repair_required: ${{ steps.repair.outputs.required }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve Unity Web request
        id: request
        shell: bash
        env:
          REQUEST_INPUT: ${{ inputs.request_file }}
          DIRECT_GAME_ID: ${{ inputs.game_id }}
          DIRECT_PROJECT_PATH: ${{ inputs.project_path }}
          DIRECT_BUILD_METHOD: ${{ inputs.build_method }}
          DIRECT_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          request_file="$REQUEST_INPUT"
          game_id="$DIRECT_GAME_ID"
          project="$DIRECT_PROJECT_PATH"
          method="$DIRECT_BUILD_METHOD"
          source_commit="$DIRECT_SOURCE_COMMIT"

          if [[ -z "$request_file" && -z "$game_id" && "${GITHUB_EVENT_NAME}" == "push" ]]; then
            request_file="$(git show --format= --name-only "$GITHUB_SHA" | grep -E '^\.build-requests/unity-web/[A-Za-z0-9._-]+\.json$' | head -n 1 || true)"
          fi

          python3 - "$request_file" "$game_id" "$project" "$method" "$source_commit" "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, re, sys
          request_file, game_id, project, method, source_commit, output = sys.argv[1:]
          if request_file:
              if not re.fullmatch(r'\.build-requests/unity-web/[A-Za-z0-9._-]+\.json', request_file):
                  raise SystemExit('invalid Unity Web request path')
              request = pathlib.Path(request_file)
              if not request.is_file():
                  raise SystemExit('Unity Web request missing')
              data = json.loads(request.read_text(encoding='utf-8'))
              if data.get('version') != 1:
                  raise SystemExit('unsupported Unity Web request version')
              game_id = str(data.get('gameId','')).strip()
              project = str(data.get('projectPath','')).replace('\\','/').strip('/')
              method = str(data.get('buildMethod','')).strip()
              source_commit = str(data.get('sourceCommit','')).strip()
          else:
              project = str(project).replace('\\','/').strip('/')

          if not re.fullmatch(r'[a-z0-9][a-z0-9-]{1,80}', game_id):
              raise SystemExit('invalid gameId')
          if project != f'unity-games/{game_id}':
              raise SystemExit('projectPath must equal unity-games/<gameId>')
          if not method:
              editor = pathlib.Path(project) / 'Assets' / 'Editor'
              candidates = []
              if editor.is_dir():
                  for file in editor.rglob('*.cs'):
                      source = file.read_text(encoding='utf-8', errors='ignore')
                      if not re.search(r'public\s+static\s+void\s+BuildWeb\s*\(', source):
                          continue
                      namespace = re.search(r'\bnamespace\s+([A-Za-z_][A-Za-z0-9_.]*)', source)
                      classes = re.findall(r'(?:public\s+)?static\s+class\s+([A-Za-z_][A-Za-z0-9_]*)', source)
                      if len(classes) == 1:
                          prefix = f'{namespace.group(1)}.' if namespace else ''
                          candidates.append(f'{prefix}{classes[0]}.BuildWeb')
              candidates = sorted(set(candidates))
              if len(candidates) != 1:
                  raise SystemExit(f'BuildWeb method unresolved: {candidates}')
              method = candidates[0]
          if not re.fullmatch(r'[A-Za-z0-9_.]+', method):
              raise SystemExit('invalid buildMethod')
          version_file = pathlib.Path(project) / 'ProjectSettings' / 'ProjectVersion.txt'
          if not version_file.is_file():
              raise SystemExit('ProjectVersion.txt missing')
          text = version_file.read_text(encoding='utf-8')
          version = re.search(r'm_EditorVersion:\s*([^\s]+)', text)
          revision = re.search(r'm_EditorVersionWithRevision:\s*[^\s]+\s*\(([A-Za-z0-9]+)\)', text)
          if not version or not revision:
              raise SystemExit('Unity editor version unresolved')
          with open(output,'a',encoding='utf-8') as f:
              f.write(f'game_id={game_id}\n')
              f.write(f'project_path={project}\n')
              f.write(f'build_method={method}\n')
              f.write(f'source_commit={source_commit}\n')
              f.write(f'unity_version={version.group(1)}\n')
              f.write(f'unity_revision={revision.group(1)}\n')
          print(f'UNITY_WEB_GAME_ID={game_id}')
          print(f'UNITY_WEB_PROJECT={project}')
          print(f'UNITY_WEB_BUILD_METHOD={method}')
          PY

      - name: Verify Unity Web development-floor contract
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const policy=JSON.parse(fs.readFileSync('company-learning/platform-release-roadmap.json','utf8'));
          const c=policy.unityWebFirstStage;
          const gate=policy.directNativeDualPlatformDevelopment?.upperPlatformDevelopmentReadinessGate;
          if(c?.status!=='OWNER_DIRECT_LOCKED') throw new Error('Unity Web policy not locked');
          if(c?.scope!=='UPPER_PLATFORM_PREDEVELOPMENT_FULL_DEVELOPMENT_QA_FLOOR'||c?.enabled!==true||c?.developmentAdmissionAuthority!==true) throw new Error('Unity Web development floor contract changed');
          if(c?.canonicalGameSourceRoot!=='unity-games/<gameId>/') throw new Error('canonical Unity source changed');
          if(c?.publicWebBuildRoot!=='web-games/<gameId>/') throw new Error('Web build output changed');
          if(gate?.gateId!=='UPPER_PLATFORM_DEVELOPMENT_READY'||gate?.allCriteriaRequired!==true) throw new Error('upper-platform readiness gate missing');
          console.log('UNITY_WEB_DEVELOPMENT_FLOOR_CONTRACT=PASS');
          NODE

      - name: Bind canonical Unity source tree
        id: source
        shell: bash
        env:
          PROJECT_PATH: ${{ steps.request.outputs.project_path }}
        run: |
          set -euo pipefail
          test -d "$PROJECT_PATH"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          const root=process.env.PROJECT_PATH;
          const files=[];
          const walk=dir=>{for(const e of fs.readdirSync(dir,{withFileTypes:true})){const full=path.join(dir,e.name);const rel=path.relative(root,full).replaceAll('\\','/');if(e.isDirectory()){if(rel==='Library'||rel.startsWith('Library/')||rel==='Temp'||rel.startsWith('Temp/'))continue;walk(full);}else if(e.isFile())files.push(rel);}};
          walk(root);files.sort();
          const hash=crypto.createHash('sha256');
          for(const rel of files){hash.update(rel);hash.update('\0');hash.update(fs.readFileSync(path.join(root,rel)));hash.update('\0');}
          const digest=hash.digest('hex');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'tree_sha='+digest+'\n');
          console.log('UNITY_WEB_CANONICAL_SOURCE_TREE_SHA256='+digest);
          NODE

      - name: Verify Unity credentials
        shell: bash
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$UNITY_EMAIL" ]] || { echo 'UNITY_EMAIL secret missing' >&2; exit 21; }
          [[ -n "$UNITY_PASSWORD" ]] || { echo 'UNITY_PASSWORD secret missing' >&2; exit 22; }

      - name: Install Unity Hub and WebGL Editor
        id: unity
        shell: bash
        env:
          UNITY_VERSION: ${{ steps.request.outputs.unity_version }}
          UNITY_REVISION: ${{ steps.request.outputs.unity_revision }}
        run: |
          set -euo pipefail
          sudo sh -c 'dbus-uuidgen > /etc/machine-id'
          sudo mkdir -p /var/lib/dbus
          sudo ln -sfn /etc/machine-id /var/lib/dbus/machine-id
          wget -qO- https://hub.unity3d.com/linux/keys/public | gpg --dearmor | sudo tee /usr/share/keyrings/Unity_Technologies_ApS.gpg >/dev/null
          sudo tee /etc/apt/sources.list.d/unityhub.sources >/dev/null <<'EOF'
          Types: deb
          URIs: https://hub.unity3d.com/linux/repos/deb
          Suites: stable
          Components: main
          Signed-By: /usr/share/keyrings/Unity_Technologies_ApS.gpg
          EOF
          echo 'deb https://archive.ubuntu.com/ubuntu jammy main universe' | sudo tee /etc/apt/sources.list.d/unity-jammy-compat.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unityhub xvfb libgtk2.0-0 libglu1-mesa libgconf-2-4 libncurses5
          sudo rm -rf /opt/unityhub
          sudo ln -s /usr/lib/unityhub /opt/unityhub
          sudo tee /usr/local/bin/unity-hub >/dev/null <<'EOF'
          #!/bin/bash
          set -e
          exec xvfb-run --auto-servernum /opt/unityhub/unityhub --headless "$@"
          EOF
          sudo chmod 755 /usr/local/bin/unity-hub
          install_root=/opt/unity/editors
          sudo mkdir -p "$install_root"
          sudo chown -R "$(id -u):$(id -g)" /opt/unity
          unity-hub install-path --set "$install_root"
          unity-hub install --version "$UNITY_VERSION" --changeset "$UNITY_REVISION" -m webgl --cm
          editor="$(find "$install_root" -type f -path '*/Editor/Unity' -perm -111 2>/dev/null | head -n1 || true)"
          [[ -n "$editor" && -x "$editor" ]] || { echo 'Unity editor missing' >&2; exit 25; }
          echo "editor=$editor" >> "$GITHUB_OUTPUT"

      - name: Activate Unity Personal
        id: license
        continue-on-error: true
        uses: RageAgainstThePixel/activate-unity-license@v2
        env:
          UNITY_HUB_PATH: /opt/unityhub/unityhub
          UNITY_EDITOR_PATH: ${{ steps.unity.outputs.editor }}
        with:
          license: personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}
          license-version: 6.x

      - name: Enforce Unity activation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ steps.license.outcome }}' == 'success' ]] || exit 198

      - name: Build Unity Web
        shell: bash
        env:
          UNITY_EDITOR_PATH: ${{ steps.unity.outputs.editor }}
          PROJECT_PATH: ${{ steps.request.outputs.project_path }}
          BUILD_METHOD: ${{ steps.request.outputs.build_method }}
        run: |
          set -euo pipefail
          "$UNITY_EDITOR_PATH" \
            -batchmode \
            -nographics \
            -quit \
            -buildTarget WebGL \
            -projectPath "$GITHUB_WORKSPACE/$PROJECT_PATH" \
            -executeMethod "$BUILD_METHOD" \
            -logFile /dev/stdout

      - name: Collect Unity Web output
        id: output
        shell: bash
        env:
          GAME_ID: ${{ steps.request.outputs.game_id }}
        run: |
          set -euo pipefail
          src="build/WebGL/$GAME_ID"
          test -s "$src/index.html"
          test -n "$(find "$src" -type f \( -name '*.wasm' -o -name '*.wasm.*' \) -size +0c | head -n1)"
          test -n "$(find "$src" -type f -name '*.data*' -size +0c | head -n1)"
          test -n "$(find "$src" -type f -name '*.framework.js*' -size +0c | head -n1)"
          test -n "$(find "$src" -type f -name '*.loader.js' -size +0c | head -n1)"
          out="/tmp/unity-web/web-games/$GAME_ID"
          mkdir -p "$out"
          cp -R "$src"/. "$out"/

          # Cloudflare Pages serves each static asset only up to 25 MiB.
          # Fail before publication instead of exposing a homepage link to an undeployable bundle.
          python3 - "$out" "$GAME_ID" <<'PY'
          import json, pathlib, sys
          root=pathlib.Path(sys.argv[1])
          game=sys.argv[2]
          build=root/'Build'
          if not build.is_dir():
              raise SystemExit('Unity Web Build directory missing from collected output')
          groups={
              'loader': sorted(build.glob('*.loader.js')),
              'data': sorted(build.glob('*.data*')),
              'framework': sorted(build.glob('*.framework.js*')),
              'wasm': sorted(build.glob('*.wasm*')),
          }
          missing=[name for name,files in groups.items() if not files]
          if missing:
              raise SystemExit('Unity Web deploy bundle incomplete: '+','.join(missing))
          max_bytes=25*1024*1024
          oversized=[]
          files=[]
          for file in sorted(build.iterdir()):
              if not file.is_file():
                  continue
              size=file.stat().st_size
              files.append({'path':file.relative_to(root).as_posix(),'bytes':size})
              if size>max_bytes:
                  oversized.append(f'{file.name}:{size}')
          if oversized:
              raise SystemExit('Cloudflare Pages 25MiB asset limit exceeded: '+' | '.join(oversized))
          manifest={
              'version':1,
              'engine':'UNITY_WEB',
              'gameId':game,
              'bundleComplete':True,
              'requiredGroups':{name:[f.relative_to(root).as_posix() for f in group] for name,group in groups.items()},
              'files':files,
              'cloudflareSingleAssetMaxBytes':max_bytes,
          }
          (root/'unity-web-deploy-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          PY

          tree_sha="$(find "$out" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          echo "tree_sha=$tree_sha" >> "$GITHUB_OUTPUT"

      - name: Browser boot smoke
        shell: bash
        env:
          GAME_ID: ${{ steps.request.outputs.game_id }}
        run: |
          set -euo pipefail
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python3 -m http.server 4181 --directory /tmp/unity-web >/tmp/unity-web-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          const game=process.env.GAME_ID;
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
          const errors=[];
          page.on('pageerror',e=>errors.push(e.message));
          page.on('console',m=>{ if(m.type()==='error') errors.push(m.text()); });
          await page.goto(`http://127.0.0.1:4181/web-games/${game}/`,{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForSelector('canvas',{state:'visible',timeout:60000});
          await page.waitForTimeout(3000);
          const box=await page.locator('canvas').first().boundingBox();
          if(!box||box.width<1||box.height<1) throw new Error('Unity canvas not rendered');
          const fatal=errors.filter(x=>/wasm|abort|out of memory|failed to fetch|build error/i.test(x));
          if(fatal.length) throw new Error(fatal.join(' | '));
          await page.screenshot({path:'/tmp/unity-web/boot-mobile.png',fullPage:true});
          await browser.close();
          console.log('UNITY_WEB_BOOT_SMOKE=PASS');
          NODE

      - name: Run Unity Web actual browser play
        shell: bash
        env:
          GAME_ID: ${{ steps.request.outputs.game_id }}
        run: |
          set -euo pipefail
          cd /tmp/unity-web
          node "$GITHUB_WORKSPACE/tools/company-unity-web-gameplay-validation.mjs" \
            --game-id="$GAME_ID" \
            --source="web-games/$GAME_ID" \
            --port=4187 \
            --output="/tmp/unity-web/web-games/$GAME_ID/unity-web-gameplay-validation.json" \
            --screenshot="/tmp/unity-web/gameplay-mobile.png"

      - name: Run Unity Web independent QA
        shell: bash
        env:
          GAME_ID: ${{ steps.request.outputs.game_id }}
        run: |
          set -euo pipefail
          cd /tmp/unity-web
          node "$GITHUB_WORKSPACE/tools/company-unity-web-gameplay-validation.mjs" \
            --game-id="$GAME_ID" \
            --source="web-games/$GAME_ID" \
            --port=4188 \
            --output="/tmp/unity-web/web-games/$GAME_ID/unity-web-independent-qa.json" \
            --screenshot="/tmp/unity-web/independent-qa-mobile.png"

      - name: Run Unity Web regression
        shell: bash
        env:
          GAME_ID: ${{ steps.request.outputs.game_id }}
        run: |
          set -euo pipefail
          cd /tmp/unity-web
          node "$GITHUB_WORKSPACE/tools/company-unity-web-gameplay-validation.mjs" \
            --game-id="$GAME_ID" \
            --source="web-games/$GAME_ID" \
            --port=4189 \
            --output="/tmp/unity-web/web-games/$GAME_ID/unity-web-regression.json" \
            --screenshot="/tmp/unity-web/regression-mobile.png"

      - name: Write build evidence
        shell: bash
        env:
          GAME_ID: ${{ steps.request.outputs.game_id }}
          SOURCE_COMMIT: ${{ steps.request.outputs.source_commit }}
          TREE_SHA: ${{ steps.output.outputs.tree_sha }}
          UNITY_SOURCE_TREE_SHA: ${{ steps.source.outputs.tree_sha }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const gameId=process.env.GAME_ID;
          const file='/tmp/unity-web/web-games/'+gameId+'/unity-web-build.json';
          fs.writeFileSync(file,JSON.stringify({
            version:2,
            engine:'UNITY_WEB',
            gameId,
            canonicalSourceRoot:'unity-games/'+gameId,
            buildOutputRoot:'web-games/'+gameId,
            sourceCommit:process.env.SOURCE_COMMIT||process.env.GITHUB_SHA,
            unitySourceTreeSha256:process.env.UNITY_SOURCE_TREE_SHA,
            buildTreeSha256:process.env.TREE_SHA,
            bootSmoke:'PASS',
            actualBrowserPlay:'PASS',
            independentQa:'PASS',
            regression:'PASS',
            upperPlatformGateCandidate:true,
            validationSurfaceOnly:false,
            nativeGateAuthority:true,
            releaseOrDeploymentAuthority:false,
            generatedAt:new Date().toISOString()
          },null,2)+'\n');
          NODE

      - name: Evaluate upper-platform development readiness
        id: readiness
        shell: bash
        env:
          GAME_ID: ${{ steps.request.outputs.game_id }}
          SOURCE_COMMIT: ${{ steps.request.outputs.source_commit }}
          UNITY_SOURCE_TREE_SHA: ${{ steps.source.outputs.tree_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin company-runtime
          git show origin/company-runtime:development-queue.json > /tmp/company-runtime-development-queue.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          const gameId=process.env.GAME_ID;
          const root='/tmp/unity-web/web-games/'+gameId;
          const queue=JSON.parse(fs.readFileSync('/tmp/company-runtime-development-queue.json','utf8'));
          const item=(queue.items||[]).find(row=>row.gameId===gameId);
          if(!item)throw new Error('UPPER_PLATFORM_QUEUE_ITEM_MISSING:'+gameId);
          const build=JSON.parse(fs.readFileSync(path.join(root,'unity-web-build.json'),'utf8'));
          const play=JSON.parse(fs.readFileSync(path.join(root,'unity-web-gameplay-validation.json'),'utf8'));
          const independent=JSON.parse(fs.readFileSync(path.join(root,'unity-web-independent-qa.json'),'utf8'));
          const regression=JSON.parse(fs.readFileSync(path.join(root,'unity-web-regression.json'),'utf8'));
          const project=path.join(process.cwd(),'unity-games',gameId);
          const countFiles=dir=>{
            const target=path.join(project,'Assets',dir);
            if(!fs.existsSync(target))return 0;
            let n=0;
            const walk=p=>{for(const e of fs.readdirSync(p,{withFileTypes:true})){const full=path.join(p,e.name);if(e.isDirectory())walk(full);else if(e.isFile()&&!e.name.endsWith('.meta'))n++;}};
            walk(target);return n;
          };
          const designPass=item.minimumDesignContract?.pass===true
            &&Boolean(item.platformDesignProfiles?.ROBLOX?.source)
            &&Boolean(item.platformDesignProfiles?.UNITY?.source);
          const codePass=play.pass===true&&play.gameplay?.pass===true&&play.coreFun?.pass===true&&play.noCriticalRuntimeError===true;
          const graphicsCounts={Art:countFiles('Art'),Prefabs:countFiles('Prefabs'),Materials:countFiles('Materials'),Animations:countFiles('Animations')};
          const floorSourceFile=path.join(project,'unity-web-floor-source.json');
          let floorSource={};try{if(fs.existsSync(floorSourceFile))floorSource=JSON.parse(fs.readFileSync(floorSourceFile,'utf8'));}catch{}
          const bootstrapGraphicsBlocked=floorSource?.presentationState==='BOOTSTRAP_REQUIRES_GRAPHICS_BUILDUP'||floorSource?.upperPlatformReady===false;
          const graphicsPass=!bootstrapGraphicsBlocked
            &&Object.values(graphicsCounts).filter(v=>v>0).length>=3
            &&fs.existsSync('/tmp/unity-web/gameplay-mobile.png');
          const webglPass=build.bootSmoke==='PASS'
            &&build.unitySourceTreeSha256===process.env.UNITY_SOURCE_TREE_SHA
            &&Boolean(build.buildTreeSha256)
            &&fs.existsSync(path.join(root,'unity-web-deploy-manifest.json'));
          const actualPlayPass=play.pass===true&&play.mobile?.pass===true&&play.coreFun?.pass===true;
          const designSource=String(item.minimumDesignContract?.source||'');
          let multiplayerRequired=false;
          if(designSource){
            try{
              const raw=JSON.parse(execFileSync('git',['show','origin/company-runtime:'+designSource],{encoding:'utf8'}));
              const mode=String(raw?.content?.multiplayerMode||'').toUpperCase();
              multiplayerRequired=Boolean(mode&&mode!=='SINGLE'&&mode!=='SINGLE_PLAYER');
            }catch{}
          }
          const multiplayerEvidence=item.unityWebMultiplayerQaEvidence||null;
          const multiplayerPass=!multiplayerRequired
            ||(multiplayerEvidence?.pass===true&&Number(multiplayerEvidence?.participantCount||0)>=2&&multiplayerEvidence?.authoritativeSync===true);
          const qaPass=independent.pass===true&&regression.pass===true
            &&independent.saveRestore?.pass===true&&regression.saveRestore?.pass===true
            &&multiplayerPass;
          const portabilityPass=designPass
            &&build.canonicalSourceRoot==='unity-games/'+gameId
            &&build.buildOutputRoot==='web-games/'+gameId;
          const criteria={
            design:{pass:designPass},
            code:{pass:codePass},
            graphics:{pass:graphicsPass,assetCounts:graphicsCounts,bootstrapGraphicsBlocked},
            webglBuild:{pass:Boolean(webglPass)},
            actualPlay:{pass:actualPlayPass},
            qa:{pass:qaPass,multiplayerRequired,multiplayerPass},
            portability:{pass:portabilityPass},
          };
          const pass=Object.values(criteria).every(row=>row.pass===true);
          const evidence={
            version:1,
            gameId,
            state:pass?'UPPER_PLATFORM_DEVELOPMENT_READY':'REPAIR_REQUIRED',
            pass,
            sourceCommit:process.env.SOURCE_COMMIT||process.env.GITHUB_SHA,
            unitySourceTreeSha256:process.env.UNITY_SOURCE_TREE_SHA,
            buildTreeSha256:build.buildTreeSha256,
            criteria,
            passAction:pass?'START_CONCURRENT_ROBLOX_AND_UNITY_UPPER_PLATFORM_DEVELOPMENT':null,
            failureAction:pass?null:'REPAIR_CAUSAL_UNITY_WEB_FLOOR_THEN_REBUILD_REPLAY_REQA_REREGRESSION',
            releaseOrDeploymentAuthority:false,
            generatedAt:new Date().toISOString(),
          };
          fs.writeFileSync(path.join(root,'upper-platform-development-readiness.json'),JSON.stringify(evidence,null,2)+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'pass='+(pass?'true':'false')+'\n');
          console.log('UPPER_PLATFORM_DEVELOPMENT_READY='+(pass?'PASS':'NO'));
          if(!pass)console.log('UPPER_PLATFORM_REPAIR_REQUIRED='+JSON.stringify(criteria));
          NODE

      - name: Upload Unity Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: unity-web-${{ steps.request.outputs.game_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/unity-web
          if-no-files-found: error
          retention-days: 7

      - name: Mark Unity Web floor repair requirement
        id: repair
        if: steps.readiness.outputs.pass != 'true'
        shell: bash
        env:
          GAME_ID: ${{ steps.request.outputs.game_id }}
        run: |
          set -euo pipefail
          echo 'required=true' >> "$GITHUB_OUTPUT"
          echo 'UNITY_WEB_FLOOR_STATE=REPAIR_REQUIRED'
          echo "UNITY_WEB_REPAIR_GAME_ID=$GAME_ID"
          echo 'UNITY_WEB_REPAIR_PLANNER_HANDOFF=REUSABLE_WORKFLOW'
          exit 42

      - name: Create verified Unity Web readiness PR
        if: steps.readiness.outputs.pass == 'true' && (github.event_name == 'push' || inputs.publish_to_main == true)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_ID: ${{ steps.request.outputs.game_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main
          branch="unity-web/${GAME_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -B "$branch" origin/main
          rm -rf "web-games/$GAME_ID"
          mkdir -p "web-games/$GAME_ID"
          cp -R "/tmp/unity-web/web-games/$GAME_ID"/. "web-games/$GAME_ID"/
          test -d "web-games/$GAME_ID/Build"
          test -s "web-games/$GAME_ID/unity-web-deploy-manifest.json"
          git add "web-games/$GAME_ID"
          # Historical repo-wide Unity ignore rules matched this nested public Build directory.
          # Force-add the runtime bundle so index.html never lands without loader/data/framework/wasm.
          git add -f "web-games/$GAME_ID/Build"
          test -n "$(git ls-files "web-games/$GAME_ID/Build/*.loader.js" | head -n1)"
          test -n "$(git ls-files "web-games/$GAME_ID/Build/*.data*" | head -n1)"
          test -n "$(git ls-files "web-games/$GAME_ID/Build/*.framework.js*" | head -n1)"
          test -n "$(git ls-files "web-games/$GAME_ID/Build/*.wasm*" | head -n1)"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "UNITY_WEB_PUBLICATION_PR=NO_CHANGE"
            exit 0
          fi
          git commit -m "build: publish $GAME_ID Unity Web readiness"
          git push --force-with-lease origin HEAD:"$branch"
          pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch"             --title "build: publish $GAME_ID Unity Web readiness"             --body "Verified Unity Web development-floor artifact from workflow run $GITHUB_RUN_ID. upper-platform-development-readiness.json must PASS before Roblox/Unity upper-platform development starts. This artifact is not release or deployment authority.")"
          echo "UNITY_WEB_READINESS_PR=$pr_url"
          echo 'UNITY_WEB_DIRECT_MAIN_WRITE=NO'


  repair-vibe2:
    name: Re-enter Vibe2 Unity Web causal repair
    needs: build
    if: always() && (needs.build.outputs.repair_required == 'true' || needs.build.result == 'failure')
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/vibe2-24h-runner.yml
    secrets: inherit
