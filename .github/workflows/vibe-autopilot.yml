# 파일명: .github/workflows/vibe-autopilot.yml
# [메인] 10분 예약 + 기존 Studio 종료 + 독립 System AI 시작·완료 신호로 예약 누락을 보정한다.
# [중복 방지] System AI 이벤트는 원장의 마지막 판단이 10분 이내면 건너뛴다.
# 같은 점검을 되풀이하지 않는다(최근 기록 감점, 안 해 본 영역 가산, 코드 변화 없으면 건너뜀). 결과로 배우고 작업 지시서를 남긴다.
# 끄기: 저장소 변수 VIBE_AUTOPILOT=off.
name: Vibe Autopilot
run-name: Vibe Autopilot · ${{ github.run_number }}
on:
  schedule:
    - cron: '8-58/10 * * * *'
  # [예약 누락 복구] 기존 Studio 결과와 독립 System AI 이벤트를 사용한다.
  workflow_run:
    workflows: ['Devloop Studio Capture', 'Company System AI Workers']
    types: [requested, completed]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: vibe-autopilot
  cancel-in-progress: false
jobs:
  decide:
    if: >-
      github.repository == 'hans1177/jaewoon-games' &&
      vars.VIBE_AUTOPILOT != 'off' &&
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.path == '.github/workflows/devloop-studio.yml' ||
       (github.event.workflow_run.path == '.github/workflows/company-system-ai-workers.yml' &&
        (github.event.action == 'requested' || github.event.workflow_run.conclusion == 'success') &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gather reports, ledger, code heads and Studio queue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          mkdir -p build/reports
          for g in mare-essentia; do
            gh api "repos/${GITHUB_REPOSITORY}/contents/report.json?ref=${g}-autopilot-report" --jq .content 2>/dev/null | base64 -d > "build/reports/${g}.json" 2>/dev/null || gh api "repos/${GITHUB_REPOSITORY}/contents/report.json?ref=${g}-studio-frames" --jq .content 2>/dev/null | base64 -d > "build/reports/${g}.json" 2>/dev/null || rm -f "build/reports/${g}.json"
          done
          gh api "repos/${GITHUB_REPOSITORY}/contents/autopilot-ledger.json?ref=vibe-gym-data" --jq .content 2>/dev/null | base64 -d > build/autopilot-ledger.json 2>/dev/null || rm -f build/autopilot-ledger.json
          # [중복 방지] 독립 신호만 10분 내 판단 기록이 있으면 생략한다.
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_run' ]] &&
             jq -e '.workflow_run.path == ".github/workflows/company-system-ai-workers.yml"' "$GITHUB_EVENT_PATH" >/dev/null 2>&1; then
            last_decision=$(node -e "const fs=require('fs');try{const j=JSON.parse(fs.readFileSync('build/autopilot-ledger.json','utf8'));process.stdout.write(String(Number(j.lastDecisionAt)||0))}catch{process.stdout.write('0')}")
            now_ms=$(date +%s%3N)
            if [[ "$last_decision" =~ ^[0-9]+$ ]] && (( last_decision > 0 && now_ms >= last_decision && now_ms - last_decision < 600000 )); then
              echo 'AUTOPILOT_SKIP=true' >> "$GITHUB_ENV"
              echo "AUTOPILOT_FALLBACK_SKIP=RECENT_DECISION:$(((now_ms-last_decision)/60000))min"
              exit 0
            fi
            echo 'AUTOPILOT_FALLBACK_RECOVERY=DECISION_OVERDUE'
          fi
          : > build/heads.txt
          for g in mare-essentia; do
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits?sha=main&path=roblox-games/${g}&per_page=1" --jq '.[0].sha // ""' 2>/dev/null || true)
            echo "${g}=${sha}" >> build/heads.txt
          done
          node -e "const fs=require('fs');const h={};for(const l of fs.readFileSync('build/heads.txt','utf8').split('\n')){const [k,v]=l.split('=');if(k&&v)h[k]=v}fs.writeFileSync('build/heads.json',JSON.stringify(h))"
          q=0
          for st in queued in_progress pending; do
            n=$(gh run list --workflow devloop-studio.yml --status $st -L 20 --json databaseId --jq 'length' 2>/dev/null || echo 0)
            q=$((q + n))
          done
          echo "QUEUED=$q" >> "$GITHUB_ENV"
      - name: Decide and request the next check
        if: env.AUTOPILOT_SKIP != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/vibe-autopilot.mjs --run --game mare-essentia --queued "$QUEUED" --ledger build/autopilot-ledger.json --reports build/reports --heads build/heads.json
      - name: Save ledger and work orders to vibe-gym-data (never main)
        if: env.AUTOPILOT_SKIP != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          put() {
            local src="$1" dest="$2" sha
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${dest}?ref=vibe-gym-data" --jq .sha 2>/dev/null || true)"
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/${dest}" -f message="autopilot: ${dest}" -f branch=vibe-gym-data -f content="$(base64 -w0 "$src")" ${sha:+-f sha="$sha"} >/dev/null
            echo "SAVED $dest"
          }
          put build/autopilot-ledger.json autopilot-ledger.json
          put build/autopilot-orders.json autopilot-orders.json
