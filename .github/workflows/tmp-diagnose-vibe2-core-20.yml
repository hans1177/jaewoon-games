name: TMP Diagnose Vibe2 Core 20

on:
  push:
    branches: [feat/adaptive-parallel-20-final-core]
    paths:
      - '.github/workflows/tmp-diagnose-vibe2-core-20.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: auto planner
        run: node --test qa/vibe2-auto-planner.test.mjs
      - name: core engine motion
        run: node --test qa/vibe2-core-engine-motion.test.mjs
      - name: source worker
        run: node --test qa/vibe2-source-worker.test.mjs
      - name: queue control
        run: node --test qa/vibe2-queue-control.test.mjs
      - name: incremental qa
        run: node --test qa/vibe2-incremental-qa.test.mjs
      - name: controller contract
        run: node --test qa/vibe2-controller-contract.test.mjs
      - name: candidate reconcile
        run: node --test qa/vibe2-candidate-reconcile.test.mjs
      - name: experience control
        run: node --test qa/vibe2-experience-control.test.mjs
