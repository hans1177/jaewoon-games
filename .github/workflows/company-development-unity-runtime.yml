# owner-first-gate platform kick: fantasy-survival 2026-09-21
name: Company DEVELOPMENT_CONFIRMED Unity Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/company-development-unity-runtime.yml'
      - '.github/workflows/unity-android-regression.yml'
      - '.build-requests/unity/**'
      - 'unity-games/**'
      - 'tools/company-selected-platform-router.mjs'
      - 'tools/company-minimum-design-contract.mjs'
      - 'tools/company-development-unity-platform.mjs'
      - 'tools/company-development-unity-bootstrap.mjs'
      - 'tools/unity-package-fatal-logcat.py'
      - 'tools/unity-apk-runtime-smoke.sh'
      - 'tools/company-homepage-platform-exposure-sync.mjs'
      - 'tools/company-development-unity-evidence.mjs'
      - 'qa/company-shared-context.test.mjs'
      - 'tools/company-shared-context.mjs'
      - 'company-learning/company-architecture-map.json'
      - 'company-learning/company-log-map.json'
      - 'company-learning/platform-release-roadmap.json'
      - 'qa/company-development-unity-runtime.test.mjs'
      - 'qa/unity-package-fatal-logcat.test.mjs'
      - 'qa/company-selected-platform-router.test.mjs'
  workflow_call:
    inputs:
      game_id:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      game_id:
        description: Optional exact gameId. Empty keeps the existing batch behavior.
        required: false
        type: string

permissions:
  contents: write
  actions: write

jobs:
  prepare:
    name: prepare selected-platform Unity queue
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      run: ${{ steps.queue.outputs.run }}
      matrix: ${{ steps.queue.outputs.matrix }}
      canary: ${{ steps.queue.outputs.canary }}
      canary_game_id: ${{ steps.queue.outputs.canary_game_id }}
      main_sha: ${{ steps.main.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          fetch-tags: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Unity selected-platform execution contracts
        run: |
          node --check tools/company-shared-context.mjs
          node --test qa/company-shared-context.test.mjs
          node tools/company-shared-context.mjs --output=/tmp/company-shared-context-unity-plan.json
          node --check tools/company-selected-platform-router.mjs
          node --check tools/company-development-unity-platform.mjs
          node --check tools/company-development-unity-bootstrap.mjs
          node --check tools/company-development-unity-evidence.mjs
          node --test qa/company-selected-platform-router.test.mjs
          node --test qa/company-development-unity-runtime.test.mjs
          node --test qa/unity-package-fatal-logcat.test.mjs

      - name: Bind current main
        id: main
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve Unity work from unbounded parallel game-id wave with representative canary observation
        id: queue
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_GAME_ID: ${{ inputs.game_id || '' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin company-runtime
          git show origin/company-runtime:development-queue.json > /tmp/development-queue.json
          requested_ids="$REQUESTED_GAME_ID"
          if [[ -n "$requested_ids" && ! "$requested_ids" =~ ^[a-z0-9][a-z0-9-]{1,80}$ ]]; then
            echo "UNITY_REQUESTED_GAME_ID_INVALID=$requested_ids" >&2
            exit 13
          fi
          if [[ -z "$requested_ids" && "$GITHUB_EVENT_NAME" == 'push' ]]; then
            requested_ids="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '
              [.files[].filename
                | if test("^\\.build-requests/unity/[^/]+\\.json$") then
                    sub("^\\.build-requests/unity/";"") | sub("\\.json$";"") | sub("-development$";"")
                  elif test("^unity-games/[^/]+/") then
                    split("/")[1]
                  else empty end]
              | unique | join(",")
            ')"
          fi
          export REQUESTED_GAME_IDS="$requested_ids"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {DEVELOPMENT_GAME_WIP_MAX,platformDevelopmentEligible,selectRepresentativeCanary,selectTargetPlatformDevelopmentWindow} from './tools/company-selected-platform-router.mjs';
          const q=JSON.parse(fs.readFileSync('/tmp/development-queue.json','utf8'));
          const roadmap=JSON.parse(fs.readFileSync('company-learning/platform-release-roadmap.json','utf8'));
          const globalWindow=selectTargetPlatformDevelopmentWindow(q.items||[]);
          const windowIds=new Set(globalWindow.map(item=>item.gameId));
          const rows=(q.items||[]).filter(item=>{
            if(!windowIds.has(item.gameId))return false;
            if(String(item.productionClass||'').toUpperCase()!=='DEVELOPMENT_CONFIRMED')return false;
            if(String(item.status||'').toUpperCase()!=='ACTIVE')return false;
             console.log('UNITY_PARALLEL_ADMISSION='+item.gameId+':MINIMUM_DESIGN_READY');
            return platformDevelopmentEligible(item,'UNITY');
          }).map(item=>({
            gameId:item.gameId,gameName:item.gameName,designBaselineSource:item.designBaselineSource,
            sourcePath:item.unityProjectPath||item.targetSourcePaths?.UNITY||`unity-games/${item.gameId}`,
            platformDesignProfile:item.platformDesignProfiles?.UNITY||null,
            selectedPlatform:'UNITY',
            unityCandidateBranch:item.unityCandidateBranch||null,
            unitySourceCommit:item.unitySourceCommit||null,
            unityBuildRunId:Number(item.unityBuildRunId||0)||null,
            unityRuntimeSmokeRunId:Number(item.unityRuntimeSmokeRunId||0)||null,
            unityIndependentQaRunId:Number(item.unityIndependentQaRunId||0)||null,
            unityRegressionRunId:Number(item.unityRegressionRunId||0)||null,
            executionEvidence:item.executionEvidence||null,
            failureCount:Number(item.failureCount||0),
          }));
          const counts=new Map();
          for(const row of rows){const sig=row.executionEvidence?.failureSignature;if(sig)counts.set(sig,(counts.get(sig)||0)+1);}
          const repeated=[...counts.entries()].some(([,n])=>n>=2);
          const migrationCanary=Number(q.executionContractVersion||0)<1;
          const canaryRequired=rows.length>0&&(migrationCanary||repeated);
          const requestedIds=[...new Set(String(process.env.REQUESTED_GAME_IDS||'').split(',').map(x=>x.trim()).filter(Boolean))];
          const requestedSet=new Set(requestedIds);
          const requestedRows=requestedIds.length?rows.filter(row=>requestedSet.has(row.gameId)):[];
          const canary=requestedRows.length?null:(canaryRequired?selectRepresentativeCanary(rows):null);
          const batchMax=Math.max(1,Math.min(256,Number(roadmap?.developmentSpeedExecution?.externalMatrixBatchMax||256)));
          const selected=requestedRows.length?requestedRows.slice(0,batchMax):rows.slice(0,batchMax);
          const parallel=Math.max(1,Math.min(batchMax,selected.length||1));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`run=${selected.length?'true':'false'}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`matrix=${JSON.stringify(selected)}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`canary=${canary?'true':'false'}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`canary_game_id=${canary?.gameId||''}\n`);
          console.log('DEVELOPMENT_GAME_ELIGIBILITY_CAP=NONE');
          console.log(`DEVELOPMENT_GAME_WIP_WINDOW_IDS=${globalWindow.map(x=>x.gameId).join(',')||'NONE'}`);
          console.log(`UNITY_TARGET_N=${rows.length}`);
          console.log(`UNITY_SELECTED_N=${selected.length}`);
          console.log(`UNITY_REQUESTED_GAME_IDS=${requestedIds.join(',')||'NONE'}`);
          console.log(`REPRESENTATIVE_CANARY=${canary?.gameId||'NONE'}`);
          console.log('REPRESENTATIVE_CANARY_MODE=PARALLEL_OBSERVATION_ONLY');
          console.log('CANARY_SERIALIZES_GAME_ID_WAVE=NO');
          console.log(`COMMON_FAILURE_DETECTED=${repeated?'YES':'NO'}`);
          console.log(`UNITY_EXECUTION_BATCH_CAPACITY=${batchMax}`);
          NODE

  unity-technical-validation:
    name: Unity staged validation (${{ matrix.item.gameName }})
    needs: prepare
    if: needs.prepare.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 160
    steps:
      - name: Checkout current canonical implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.main_sha }}
          fetch-depth: 1
          fetch-tags: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch current company runtime and Vibe build-up state
        run: |
          git fetch --no-tags --depth=1 origin company-runtime
          git fetch --no-tags --depth=1 origin "+refs/heads/vibe2-unreal-core:refs/remotes/origin/vibe2-unreal-core"

      - name: Materialize locked design and runtime catalog
        id: context
        env:
          GAME_ID: ${{ matrix.item.gameId }}
          DESIGN_SOURCE: ${{ matrix.item.designBaselineSource }}
        shell: bash
        run: |
          set -euo pipefail
          base="$(dirname "$DESIGN_SOURCE")"
          date="$(basename "$base")"
          project="unity-games/$GAME_ID"
          request=".build-requests/unity/${GAME_ID}-development.json"
          mkdir -p "$base"
          git show "origin/company-runtime:$DESIGN_SOURCE" > "$DESIGN_SOURCE"
          git show origin/company-runtime:game-catalog.json > game-catalog.json
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));const p=d?.content?.platformProfiles?.UNITY;if(!p||p.platform!=='UNITY')process.exit(2);for(const k of ['inputModel','sessionModel','multiplayerRuntime','performanceBudget','uiUx','saveAndNetwork','platformContentAdaptation','internalReleaseTarget','validationEvidence'])if(String(p[k]||'').trim().length<8)process.exit(3);console.log('UNITY_PLATFORM_PROFILE_INPUT=READY')" "$DESIGN_SOURCE"
          directive="/tmp/build-up-directive-$GAME_ID.json"
          if git cat-file -e "origin/vibe2-unreal-core:.vibe2/build-up-directives/$GAME_ID/current.json" 2>/dev/null; then
            git show "origin/vibe2-unreal-core:.vibe2/build-up-directives/$GAME_ID/current.json" > "$directive"
            echo "UNITY_BUILD_UP_DIRECTIVE_SOURCE=VIBE_RUNTIME:$GAME_ID"
          else
            directive=''
            echo "UNITY_BUILD_UP_DIRECTIVE_SOURCE=BASELINE_ONLY_NO_VIBE_DIRECTIVE:$GAME_ID"
          fi
          {
            echo "base=$base"
            echo "date=$date"
            echo "project=$project"
            echo "request=$request"
            echo "directive=$directive"
          } >> "$GITHUB_OUTPUT"

      - name: Change detection and exact-source reuse
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_ID: ${{ matrix.item.gameId }}
          GAME_NAME: ${{ matrix.item.gameName }}
          EXISTING_BRANCH: ${{ matrix.item.unityCandidateBranch }}
          EXISTING_SOURCE: ${{ matrix.item.unitySourceCommit }}
          PROJECT: ${{ steps.context.outputs.project }}
          REQUEST: ${{ steps.context.outputs.request }}
          DESIGN_SOURCE: ${{ matrix.item.designBaselineSource }}
          BUILD_UP_DIRECTIVE: ${{ steps.context.outputs.directive }}
        shell: bash
        run: |
          set -euo pipefail
          bind_catalog() {
            node -e 'const fs=require("fs");const project=process.argv[1];const catalog=JSON.parse(fs.readFileSync("game-catalog.json","utf8"));const game=(catalog.games||[]).find(x=>x.id===process.env.GAME_ID);if(!game)throw new Error(`runtime catalog game missing: ${process.env.GAME_ID}`);game.selectedPlatform="UNITY";game.targetPlatform="UNITY";game.unityProjectPath=project;game.productionClass="DEVELOPMENT_CONFIRMED";game.homepagePublicationApproved=false;game.publishTestBuildWhenReady=false;fs.writeFileSync("game-catalog.json",JSON.stringify(catalog,null,2)+"\n");' "$PROJECT"
          }

          direct_request=".build-requests/unity/${GAME_ID}.json"
          if [[ -f "$PROJECT/ProjectSettings/ProjectVersion.txt" ]]; then
            [[ -f "$direct_request" ]] || { echo "UNITY_EXISTING_SOURCE_BUILD_REQUEST_MISSING=$GAME_ID" >&2; exit 12; }
            branch="development/unity-tech-${GAME_ID}-${GITHUB_RUN_ID}"
            git config user.name 'jaewoon-development-unity-runtime'
            git config user.email 'actions@users.noreply.github.com'
            git checkout -b "$branch"
            source_commit="$(git rev-parse HEAD)"
            mkdir -p "$(dirname "$REQUEST")"
            node - "$direct_request" "$REQUEST" "$GAME_ID" "$PROJECT" "$source_commit" "$GITHUB_RUN_ID" <<'NODE'
          const fs=require('fs');
          const [directFile,file,gameId,projectPath,sourceCommit,runId]=process.argv.slice(2);
          const direct=JSON.parse(fs.readFileSync(directFile,'utf8').replace(/^\uFEFF/,''));
          const directProject=String(direct.projectPath||'').replace(/\\/g,'/').replace(/^\/+|\/+$/g,'');
          if(Number(direct.version)!==1||String(direct.gameId||'')!==gameId||directProject!==projectPath||!String(direct.buildMethod||'').trim()){
            throw new Error('UNITY_EXISTING_SOURCE_BUILD_REQUEST_INVALID:'+gameId);
          }
          const out={
            version:1,
            requestId:`development-unity-${gameId}-${runId}`,
            gameId,
            projectPath,
            buildMethod:String(direct.buildMethod).trim(),
            sourceCommit,
            productionClass:'DEVELOPMENT_CONFIRMED',
            purpose:'TARGET_PLATFORM_TECHNICAL_VALIDATION',
            homepagePublicationApproved:false,
            publishTestBuildWhenReady:false,
            releaseAuthority:false,
          };
          const applicationId=String(direct.applicationId||'').trim();
          if(applicationId)out.applicationId=applicationId;
          fs.writeFileSync(file,JSON.stringify(out,null,2)+'\n');
          NODE
            git add "$REQUEST"
            git diff --cached --check
            git commit -m "ci: validate existing $GAME_ID Unity source [skip ci]"
            request_commit="$(git rev-parse HEAD)"
            git push origin HEAD:"$branch"
            echo "source_revision=$request_commit" >> "$GITHUB_OUTPUT"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
            echo 'source_reused=true' >> "$GITHUB_OUTPUT"
            echo 'CHANGE_DETECTION=CURRENT_MAIN_SOURCE_REUSED'
            exit 0
          fi

          reuse_branch=''
          reuse_source=''
          if [[ -n "$EXISTING_BRANCH" ]]; then
            if git fetch --no-tags --depth=1 origin "$EXISTING_BRANCH:refs/remotes/origin/unity-reuse" >/dev/null 2>&1; then
              candidate="$(git rev-parse refs/remotes/origin/unity-reuse)"
              if [[ ! "$EXISTING_SOURCE" =~ ^[0-9a-f]{40}$ || "$candidate" == "$EXISTING_SOURCE" ]]; then
                reuse_branch="$EXISTING_BRANCH"
                reuse_source="$candidate"
              fi
            fi
          fi

          if [[ -z "$reuse_source" ]]; then
            prefix="development/unity-tech-${GAME_ID}-"
            latest_branch="$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/$prefix" --jq '.[].ref' 2>/dev/null | sed 's#^refs/heads/##' | awk -F- '{print $NF "\t" $0}' | sort -n | tail -n1 | cut -f2- || true)"
            if [[ -n "$latest_branch" ]] && git fetch --no-tags --depth=1 origin "$latest_branch:refs/remotes/origin/unity-history" >/dev/null 2>&1; then
              reuse_branch="$latest_branch"
              reuse_source="$(git rev-parse refs/remotes/origin/unity-history)"
              echo "UNITY_SOURCE_MIGRATION_BRANCH=$reuse_branch"
            fi
          fi

          if [[ "$reuse_source" =~ ^[0-9a-f]{40}$ ]]; then
            git checkout "$reuse_source" -- "$PROJECT" "$REQUEST" 2>/dev/null || true
            current_generator="$(sha256sum tools/company-development-unity-bootstrap.mjs | awk '{print $1}')"
            source_generator=''
            if [[ -f "$PROJECT/prototype-source.json" ]]; then
              source_generator="$(node -e 'const fs=require("fs");try{const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(String(p.generatorFingerprint||""));}catch{}' "$PROJECT/prototype-source.json")"
            fi
            if [[ -f "$PROJECT/ProjectSettings/ProjectVersion.txt" && -f "$REQUEST" && "$source_generator" == "$current_generator" ]]; then
              bind_catalog
              echo "source_revision=$reuse_source" >> "$GITHUB_OUTPUT"
              echo "branch=$reuse_branch" >> "$GITHUB_OUTPUT"
              echo 'source_reused=true' >> "$GITHUB_OUTPUT"
              echo 'CHANGE_DETECTION=UNCHANGED_SOURCE_REUSED'
              exit 0
            fi
            echo "UNITY_SOURCE_REUSE_INVALIDATED=GENERATOR_FINGERPRINT_MISMATCH old=${source_generator:-MISSING} current=$current_generator"
          fi

          directive_args=()
          if [[ -n "$BUILD_UP_DIRECTIVE" && -f "$BUILD_UP_DIRECTIVE" ]]; then directive_args+=(--build-up-directive="$BUILD_UP_DIRECTIVE"); fi
          node tools/company-development-unity-bootstrap.mjs \
            --game-id="$GAME_ID" \
            --game-name="$GAME_NAME" \
            --baseline="$DESIGN_SOURCE" \
            --output="$PROJECT" \
            "${directive_args[@]}"
          bind_catalog
          branch="development/unity-tech-${GAME_ID}-${GITHUB_RUN_ID}"
          git config user.name 'jaewoon-development-unity-runtime'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b "$branch"
          git add "$PROJECT" game-catalog.json
          git diff --cached --check
          git commit -m "dev: bind $GAME_ID selected-platform Unity source [skip ci]"
          mkdir -p "$(dirname "$REQUEST")"
          source_commit="$(git rev-parse HEAD)"
          node - "$REQUEST" "$GAME_ID" "$PROJECT" "$source_commit" "$GITHUB_RUN_ID" <<'NODE'
          const fs=require('fs');
          const [file,gameId,projectPath,sourceCommit,runId]=process.argv.slice(2);
          fs.writeFileSync(file,JSON.stringify({version:1,requestId:`development-unity-${gameId}-${runId}`,gameId,projectPath,buildMethod:'SeedAndroidBuild.Build',sourceCommit,productionClass:'DEVELOPMENT_CONFIRMED',purpose:'TARGET_PLATFORM_TECHNICAL_VALIDATION',homepagePublicationApproved:false,publishTestBuildWhenReady:false,releaseAuthority:false},null,2)+'\n');
          NODE
          git add "$REQUEST"
          git commit -m "ci: request $GAME_ID selected-platform Unity build [skip ci]"
          request_commit="$(git rev-parse HEAD)"
          git push origin HEAD:"$branch"
          echo "source_revision=$request_commit" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo 'source_reused=false' >> "$GITHUB_OUTPUT"
          echo 'CHANGE_DETECTION=SOURCE_CHANGED_OR_MISSING'

      - name: Cheap precheck and checkpoint resume plan
        id: plan
        env:
          PREVIOUS_EVIDENCE: ${{ toJSON(matrix.item.executionEvidence) }}
          SOURCE_REVISION: ${{ steps.source.outputs.source_revision }}
          SOURCE_PATH: ${{ steps.context.outputs.project }}
          EXISTING_BUILD_RUN: ${{ matrix.item.unityBuildRunId }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createSelectedPlatformExecutionPlan} from './tools/company-selected-platform-router.mjs';
          let previous={};try{previous=JSON.parse(process.env.PREVIOUS_EVIDENCE||'null')||{};}catch{}
          const plan=createSelectedPlatformExecutionPlan({selectedPlatform:'UNITY',sourceRevision:process.env.SOURCE_REVISION,sourcePath:process.env.SOURCE_PATH,buildConfigFingerprint:'unity-android-development-v2',previousEvidence:previous});
          const reusable=plan.artifactReusable&&/^\d+$/.test(process.env.EXISTING_BUILD_RUN||'');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`fingerprint=${plan.sourceFingerprint}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`reuse_build=${reusable?'true':'false'}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`resume_stage=${plan.resumeStage}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`previous_runtime=${plan.sameFingerprint&&previous.runtimePassed===true?'true':'false'}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`previous_qa=${plan.sameFingerprint&&previous.independentQaPassed===true?'true':'false'}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`previous_regression=${plan.sameFingerprint&&previous.regressionPassed===true?'true':'false'}\n`);
          if(!plan.precheck.pass)process.exitCode=2;
          console.log(`CHEAP_PRECHECK=${plan.precheck.pass?'PASS':'FAIL'}`);
          console.log(`SOURCE_FINGERPRINT=${plan.sourceFingerprint}`);
          console.log(`RESUME_STAGE=${plan.resumeStage}`);
          console.log(`BUILD_REUSE=${reusable?'YES':'NO'}`);
          NODE

      - name: Dispatch one Unity cloud build for this source fingerprint
        id: build
        if: steps.plan.outputs.reuse_build != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.source.outputs.branch }}
          REQUEST: ${{ steps.context.outputs.request }}
        shell: bash
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/actions/workflows/unity-cloud-android-test.yml"
          baseline="$(gh api "$api/runs?branch=$BRANCH&event=workflow_dispatch&per_page=20" --jq '[.workflow_runs[].id] | max // 0')"
          jq -n --arg ref "$BRANCH" --arg request "$REQUEST" '{ref:$ref,inputs:{request_file:$request}}' | gh api --method POST "$api/dispatches" --input -
          run_id=''
          for _ in $(seq 1 60); do
            run_id="$(gh api "$api/runs?branch=$BRANCH&event=workflow_dispatch&per_page=20" | jq -r --argjson b "$baseline" '[.workflow_runs[] | select(.id > $b) | .id] | max // empty')"
            [[ "$run_id" =~ ^[0-9]+$ ]] && break
            sleep 4
          done
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo 'Unity cloud build run was not created' >&2; exit 2; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "CLOUD_UNITY_BUILD_RUN_ID=$run_id"

      - name: Resolve immutable build run reference
        id: buildref
        env:
          REUSE: ${{ steps.plan.outputs.reuse_build }}
          EXISTING: ${{ matrix.item.unityBuildRunId }}
          CREATED: ${{ steps.build.outputs.run_id }}
        run: |
          if [[ "$REUSE" == 'true' ]]; then run="$EXISTING"; else run="$CREATED"; fi
          [[ "$run" =~ ^[0-9]+$ ]] || exit 3
          echo "run_id=$run" >> "$GITHUB_OUTPUT"

      - name: Inspect build and legacy install-gate outcome without discarding successful APK
        id: buildstate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.buildref.outputs.run_id }}
          REUSE: ${{ steps.plan.outputs.reuse_build }}
          PREVIOUS_RUNTIME: ${{ steps.plan.outputs.previous_runtime }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REUSE" == 'true' ]]; then
            echo 'build_passed=true' >> "$GITHUB_OUTPUT"
            echo "runtime_passed=$PREVIOUS_RUNTIME" >> "$GITHUB_OUTPUT"
            echo 'SINGLE_BUILD_OR_PACKAGE=REUSED'
            exit 0
          fi
          for _ in $(seq 1 1320); do
            status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.status')"
            [[ "$status" == completed ]] && break
            sleep 5
          done
          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100")"
          build="$(jq -r '[.jobs[]|select(.name=="build")|.conclusion][0]//"missing"' <<<"$jobs")"
          legacy_job="$(jq -r '[.jobs[]|select(.name=="android16-install-gate")|.conclusion][0]//"missing"' <<<"$jobs")"
          legacy_verify="$(jq -r '[.jobs[]|select(.name=="android16-install-gate")|.steps[]?|select(.name=="Install and launch exact APK on matching ARM64 runtime")|.conclusion][0]//"missing"' <<<"$jobs")"
          echo "build_passed=$([[ "$build" == success ]]&&echo true||echo false)" >> "$GITHUB_OUTPUT"
          echo "runtime_passed=$([[ "$legacy_verify" == success ]]&&echo true||echo false)" >> "$GITHUB_OUTPUT"
          echo "BUILD_JOB_CONCLUSION=$build"
          echo "LEGACY_RUNTIME_JOB_CONCLUSION=$legacy_job"
          echo "LEGACY_RUNTIME_VERIFY_CONCLUSION=$legacy_verify"

      - name: Bind immutable APK artifact identity
        id: artifact
        if: steps.buildstate.outputs.build_passed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ steps.buildref.outputs.run_id }}
          SOURCE_REVISION: ${{ steps.source.outputs.source_revision }}
          SOURCE_FINGERPRINT: ${{ steps.plan.outputs.fingerprint }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/unity-build && mkdir -p /tmp/unity-build
          gh run download "$BUILD_RUN" -D /tmp/unity-build
          info="$(find /tmp/unity-build -type f -name build-info.json -size +0c | head -n1)"
          apk="$(find /tmp/unity-build -type f -name '*.apk' -size +0c | head -n1)"
          test -n "$info" -a -n "$apk"
          expected="$(node -e "const b=require(process.argv[1]);process.stdout.write(String(b.sha256||''))" "$info")"
          source="$(node -e "const b=require(process.argv[1]);process.stdout.write(String(b.sourceCommit||''))" "$info")"
          actual="$(sha256sum "$apk" | awk '{print $1}')"
          [[ "$actual" == "$expected" && "$source" == "$SOURCE_REVISION" ]] || { echo 'immutable artifact/source mismatch' >&2; exit 4; }
          git fetch --no-tags --depth=1 origin "$source" >/dev/null 2>&1 || true
          source_tree="$(git rev-parse "${source}^{tree}")"
          node - "$info" "$source_tree" <<'NODE'
          const fs=require('fs');const [file,tree]=process.argv.slice(2);const b=JSON.parse(fs.readFileSync(file,'utf8').replace(/^\uFEFF/,''));b.sourceTreeSha=tree;fs.writeFileSync(file,JSON.stringify(b,null,2)+'\n');
          NODE
          echo "identity=sha256:$actual" >> "$GITHUB_OUTPUT"
          echo "source_revision=$source" >> "$GITHUB_OUTPUT"
          echo "source_tree=$source_tree" >> "$GITHUB_OUTPUT"
          echo "source_fingerprint=$SOURCE_FINGERPRINT" >> "$GITHUB_OUTPUT"
          echo 'IMMUTABLE_ARTIFACT_BIND=PASS'

      - name: Resume target-platform runtime only from its failed checkpoint
        id: runtime
        if: steps.buildstate.outputs.build_passed == 'true' && steps.buildstate.outputs.runtime_passed != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ steps.buildref.outputs.run_id }}
          REUSE: ${{ steps.plan.outputs.reuse_build }}
        shell: bash
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/actions/workflows/unity-android-runtime-smoke.yml"
          title="Unity Android Runtime Smoke $BUILD_RUN"
          child=''
          if [[ "$REUSE" != 'true' ]]; then
            for _ in $(seq 1 60); do
              child="$(gh api "$api/runs?event=workflow_run&per_page=50" | jq -r --arg title "$title" '[.workflow_runs[]|select(.display_title==$title)|.id]|max//empty')"
              [[ "$child" =~ ^[0-9]+$ ]] && break
              sleep 2
            done
            if [[ "$child" =~ ^[0-9]+$ ]]; then
              echo "UNITY_RUNTIME_SMOKE_REUSED_AUTO=$child"
            fi
          fi
          if [[ ! "$child" =~ ^[0-9]+$ ]]; then
            baseline="$(gh api "$api/runs?branch=main&event=workflow_dispatch&per_page=20" --jq '[.workflow_runs[].id] | max // 0')"
            jq -n --arg ref main --arg run "$BUILD_RUN" '{ref:$ref,inputs:{run_id:$run}}' | gh api --method POST "$api/dispatches" --input -
            for _ in $(seq 1 60); do
              child="$(gh api "$api/runs?branch=main&event=workflow_dispatch&per_page=20" | jq -r --argjson b "$baseline" --arg title "$title" '[.workflow_runs[]|select(.id>$b and .display_title==$title)|.id]|max//empty')"
              [[ "$child" =~ ^[0-9]+$ ]] && break
              sleep 4
            done
            [[ "$child" =~ ^[0-9]+$ ]] || exit 5
            echo "UNITY_RUNTIME_SMOKE_DISPATCHED_MANUAL=$child"
          fi
          echo "run_id=$child" >> "$GITHUB_OUTPUT"
          for _ in $(seq 1 420); do
            row="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$child" --jq '[.status,.conclusion]|@tsv')"; status="${row%%$'\t'*}"; conclusion="${row#*$'\t'}"
            if [[ "$status" == completed ]]; then [[ "$conclusion" == success ]] && exit 0 || exit 6; fi
            sleep 5
          done
          exit 7

      - name: Resolve runtime checkpoint result
        id: runtimestate
        env:
          PREVIOUS: ${{ steps.plan.outputs.previous_runtime }}
          LEGACY: ${{ steps.buildstate.outputs.runtime_passed }}
          RESUME_OUTCOME: ${{ steps.runtime.outcome }}
        run: |
          if [[ "$PREVIOUS" == true || "$LEGACY" == true || "$RESUME_OUTCOME" == success ]]; then pass=true; else pass=false; fi
          echo "passed=$pass" >> "$GITHUB_OUTPUT"
          echo "TARGET_PLATFORM_RUNTIME=$pass"

      - name: Run independent QA only after runtime PASS
        id: independent
        if: steps.runtimestate.outputs.passed == 'true' && steps.plan.outputs.previous_qa != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ steps.buildref.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/actions/workflows/unity-android-independent-qa.yml"; title="Unity Android Independent QA $BUILD_RUN"
          baseline="$(gh api "$api/runs?branch=main&event=workflow_dispatch&per_page=20" --jq '[.workflow_runs[].id] | max // 0')"
          jq -n --arg ref main --arg run "$BUILD_RUN" '{ref:$ref,inputs:{run_id:$run}}' | gh api --method POST "$api/dispatches" --input -
          child=''; for _ in $(seq 1 60); do child="$(gh api "$api/runs?branch=main&event=workflow_dispatch&per_page=20" | jq -r --argjson b "$baseline" --arg title "$title" '[.workflow_runs[]|select(.id>$b and .display_title==$title)|.id]|max//empty')"; [[ "$child" =~ ^[0-9]+$ ]]&&break; sleep 4; done
          [[ "$child" =~ ^[0-9]+$ ]]||exit 8; echo "run_id=$child" >> "$GITHUB_OUTPUT"
          for _ in $(seq 1 420); do row="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$child" --jq '[.status,.conclusion]|@tsv')"; s="${row%%$'\t'*}"; c="${row#*$'\t'}"; if [[ "$s" == completed ]];then [[ "$c" == success ]]&&exit 0||exit 9;fi;sleep 5;done;exit 10

      - name: Resolve independent QA checkpoint result
        id: independentstate
        env:
          PREVIOUS: ${{ steps.plan.outputs.previous_qa }}
          OUTCOME: ${{ steps.independent.outcome }}
        run: |
          if [[ "$PREVIOUS" == true || "$OUTCOME" == success ]]; then pass=true; else pass=false; fi
          echo "passed=$pass" >> "$GITHUB_OUTPUT"
          echo "INDEPENDENT_QA=$pass"

      - name: Run regression on the same immutable APK
        id: regression
        if: steps.independentstate.outputs.passed == 'true' && steps.plan.outputs.previous_regression != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ steps.buildref.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/actions/workflows/unity-android-regression.yml"; title="Unity Android Regression $BUILD_RUN"
          baseline="$(gh api "$api/runs?branch=main&event=workflow_dispatch&per_page=20" --jq '[.workflow_runs[].id] | max // 0')"
          jq -n --arg ref main --arg run "$BUILD_RUN" '{ref:$ref,inputs:{run_id:$run}}' | gh api --method POST "$api/dispatches" --input -
          child=''; for _ in $(seq 1 60); do child="$(gh api "$api/runs?branch=main&event=workflow_dispatch&per_page=20" | jq -r --argjson b "$baseline" --arg title "$title" '[.workflow_runs[]|select(.id>$b and .display_title==$title)|.id]|max//empty')"; [[ "$child" =~ ^[0-9]+$ ]]&&break; sleep 4; done
          [[ "$child" =~ ^[0-9]+$ ]]||exit 11; echo "run_id=$child" >> "$GITHUB_OUTPUT"
          for _ in $(seq 1 420); do row="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$child" --jq '[.status,.conclusion]|@tsv')"; s="${row%%$'\t'*}"; c="${row#*$'\t'}"; if [[ "$s" == completed ]];then [[ "$c" == success ]]&&exit 0||exit 12;fi;sleep 5;done;exit 13

      - name: Resolve regression checkpoint result
        id: regressionstate
        env:
          PREVIOUS: ${{ steps.plan.outputs.previous_regression }}
          OUTCOME: ${{ steps.regression.outcome }}
        run: |
          if [[ "$PREVIOUS" == true || "$OUTCOME" == success ]]; then pass=true; else pass=false; fi
          echo "passed=$pass" >> "$GITHUB_OUTPUT"
          echo "REGRESSION=$pass"

      - name: Bind passed stages into canonical DEVELOPMENT evidence
        id: canonical
        if: steps.regressionstate.outputs.passed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_ID: ${{ matrix.item.gameId }}
          BASE: ${{ steps.context.outputs.base }}
          PROJECT: ${{ steps.context.outputs.project }}
          BUILD_RUN: ${{ steps.buildref.outputs.run_id }}
          RUNTIME_RUN_NEW: ${{ steps.runtime.outputs.run_id }}
          RUNTIME_RUN_OLD: ${{ matrix.item.unityRuntimeSmokeRunId }}
          QA_RUN_NEW: ${{ steps.independent.outputs.run_id }}
          QA_RUN_OLD: ${{ matrix.item.unityIndependentQaRunId }}
          REGRESSION_RUN_NEW: ${{ steps.regression.outputs.run_id }}
          REGRESSION_RUN_OLD: ${{ matrix.item.unityRegressionRunId }}
          SOURCE_REVISION: ${{ steps.source.outputs.source_revision }}
        shell: bash
        run: |
          set -euo pipefail
          runtime_run="${RUNTIME_RUN_NEW:-$RUNTIME_RUN_OLD}"; qa_run="${QA_RUN_NEW:-$QA_RUN_OLD}"; regression_run="${REGRESSION_RUN_NEW:-$REGRESSION_RUN_OLD}"
          rm -rf /tmp/unity-runtime /tmp/unity-independent /tmp/unity-regression
          mkdir -p /tmp/unity-runtime /tmp/unity-independent /tmp/unity-regression
          if [[ "$runtime_run" =~ ^[0-9]+$ ]]; then gh run download "$runtime_run" -D /tmp/unity-runtime; else cp -R /tmp/unity-build/. /tmp/unity-runtime/; fi
          [[ "$qa_run" =~ ^[0-9]+$ ]] && gh run download "$qa_run" -D /tmp/unity-independent
          [[ "$regression_run" =~ ^[0-9]+$ ]] && gh run download "$regression_run" -D /tmp/unity-regression
          build_info="$(find /tmp/unity-build -type f -name build-info.json | head -n1)"
          runtime_json="$(find /tmp/unity-runtime -type f -name evidence.json | head -n1)"
          independent_json="$(find /tmp/unity-independent -type f -name evidence.json | head -n1)"
          runtime_log="$(find /tmp/unity-runtime -type f -name logcat.txt | head -n1 || true)"
          independent_log="$(find /tmp/unity-independent -type f -name logcat.txt | head -n1 || true)"
          test -n "$build_info" -a -n "$runtime_json" -a -n "$independent_json"
          node tools/company-development-unity-evidence.mjs --game-id="$GAME_ID" --build-info="$build_info" --runtime="$runtime_json" --independent="$independent_json" --runtime-log="$runtime_log" --independent-log="$independent_log" --project="$PROJECT" --output="$BASE/unity-technical-validation.json"
          regression_json="$(find /tmp/unity-regression -type f -name evidence.json | head -n1 || true)"; [[ -n "$regression_json" ]] && cp "$regression_json" "$BASE/unity-regression-validation.json"
          echo "runtime_run=$runtime_run" >> "$GITHUB_OUTPUT"; echo "qa_run=$qa_run" >> "$GITHUB_OUTPUT"; echo "regression_run=$regression_run" >> "$GITHUB_OUTPUT"

      - name: Prepare free models only after technical stages pass
        if: steps.regressionstate.outputs.passed == 'true'
        uses: ./.github/actions/prepare-ollama
        with:
          model: 'llama3.2:1b'
          version: '0.33.3'
          pull-model: 'true'
          department-role: development

      - name: Ensure configured department models only for evidence meeting
        if: steps.regressionstate.outputs.passed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t models < <(node -e "const d=require('./company-directive.json');for(const m of [...new Set(d.ai?.modelPool||[])])console.log(m)")
          have="$(ollama list | awk 'NR>1{print $1}')"; for model in "${models[@]}";do grep -Fxq "$model"<<<"$have"||ollama pull "$model";done

      - name: Revalidate shared worker context before Unity checkpoint
        run: node tools/company-shared-context.mjs --output=/tmp/company-shared-context-unity-before-checkpoint.json

      - name: Persist exact checkpoint package even when a later stage fails
        id: checkpoint
        if: always()
        env:
          GAME_ID: ${{ matrix.item.gameId }}
          BASE: ${{ steps.context.outputs.base }}
          PROJECT: ${{ steps.context.outputs.project }}
          BRANCH: ${{ steps.source.outputs.branch }}
          SOURCE_REVISION: ${{ steps.source.outputs.source_revision }}
          SOURCE_FINGERPRINT: ${{ steps.plan.outputs.fingerprint }}
          BUILD_RUN: ${{ steps.buildref.outputs.run_id }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.identity }}
          BUILD_PASS: ${{ steps.buildstate.outputs.build_passed }}
          RUNTIME_PASS: ${{ steps.runtimestate.outputs.passed }}
          QA_PASS: ${{ steps.independentstate.outputs.passed }}
          REGRESSION_PASS: ${{ steps.regressionstate.outputs.passed }}
          RUNTIME_RUN_NEW: ${{ steps.runtime.outputs.run_id }}
          RUNTIME_RUN_OLD: ${{ matrix.item.unityRuntimeSmokeRunId }}
          QA_RUN_NEW: ${{ steps.independent.outputs.run_id }}
          QA_RUN_OLD: ${{ matrix.item.unityIndependentQaRunId }}
          REGRESSION_RUN_NEW: ${{ steps.regression.outputs.run_id }}
          REGRESSION_RUN_OLD: ${{ matrix.item.unityRegressionRunId }}
          IS_CANARY: ${{ matrix.item.gameId == needs.prepare.outputs.canary_game_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-persist/"$(dirname "$BASE")" runtime-persist/queue
          [[ -d "$BASE" ]] && cp -R "$BASE" runtime-persist/"$(dirname "$BASE")"/
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {failureSignature} from './tools/company-selected-platform-router.mjs';
          const yes=v=>String(v).toLowerCase()==='true';
          const build=yes(process.env.BUILD_PASS),runtime=yes(process.env.RUNTIME_PASS),qa=yes(process.env.QA_PASS),regression=yes(process.env.REGRESSION_PASS);
          let last='CHEAP_PRECHECK',failure=null;
          if(build)last='SINGLE_BUILD_OR_PACKAGE';else failure='SINGLE_BUILD_OR_PACKAGE';
          if(build&&process.env.ARTIFACT_ID)last='IMMUTABLE_ARTIFACT_BIND';
          if(build&&!runtime)failure='TARGET_PLATFORM_RUNTIME';else if(runtime)last='TARGET_PLATFORM_RUNTIME';
          if(runtime&&!qa)failure='INDEPENDENT_QA';else if(qa)last='INDEPENDENT_QA';
          if(qa&&!regression)failure='REGRESSION';else if(regression)last='REGRESSION';
          const canonical=process.env.MEETING_STATE||'WAITING_TARGET_PLATFORM_VALIDATION';
          const runtimeRun=Number(process.env.RUNTIME_RUN_NEW||process.env.RUNTIME_RUN_OLD||0)||null;
          const qaRun=Number(process.env.QA_RUN_NEW||process.env.QA_RUN_OLD||0)||null;
          const regressionRun=Number(process.env.REGRESSION_RUN_NEW||process.env.REGRESSION_RUN_OLD||0)||null;
          const buildRun=Number(process.env.BUILD_RUN||0)||null;
          const artifactIdentity=process.env.ARTIFACT_ID||null;
          const stamp=new Date().toISOString();
          const evidence={version:1,platform:'UNITY',sourceRevision:process.env.SOURCE_REVISION||null,sourceFingerprint:process.env.SOURCE_FINGERPRINT||null,buildOrPackagePassed:build,artifactIdentity,runtimePassed:runtime,independentQaPassed:qa,regressionPassed:regression,exactRevision:Boolean(artifactIdentity&&process.env.SOURCE_REVISION),lastSuccessfulStage:last,failureStage:failure,failureSignature:failure?failureSignature({stage:failure,code:'STAGE_NOT_PASSED',message:`${process.env.GAME_ID}:${failure}`}):null};
          const internalReady=build&&runtime&&qa&&regression&&Boolean(artifactIdentity)&&Boolean(process.env.SOURCE_REVISION);
          const row={
            gameId:process.env.GAME_ID,status:'ACTIVE',selectedPlatform:'UNITY',targetPlatform:'UNITY',
            currentStep:internalReady?'INTERNAL_PLATFORM_PLAYTEST_AND_DEBUG':'TARGET_PLATFORM_TECHNICAL_VALIDATION',
            canonicalState:internalReady?'INTERNAL_PLATFORM_PLAYTEST_AND_DEBUG':canonical,
            platformAdapter:'tools/company-development-unity-platform.mjs',
            unityProjectPath:process.env.PROJECT,unityCandidateBranch:process.env.BRANCH||null,unitySourceCommit:process.env.SOURCE_REVISION||null,
            unityBuildRunId:buildRun,unityRuntimeSmokeRunId:runtimeRun,unityIndependentQaRunId:qaRun,unityRegressionRunId:regressionRun,
            unityInternalReleaseReady:internalReady,
            unityInternalReleaseAt:internalReady?stamp:null,
            unityInternalReleaseEvidence:internalReady?{
              version:1,platform:'UNITY',sourceRevision:process.env.SOURCE_REVISION,artifactIdentity,
              buildRunId:buildRun,runtimeRunId:runtimeRun,independentQaRunId:qaRun,regressionRunId:regressionRun,
              distribution:'INTERNAL_OR_CLOSED_APP_TEST_BUILD',artifactInternalTestingAllowed:true,publicRelease:false,
              authority:'unity-exact-apk-runtime-qa-regression'
            }:null,
            unityPublicReleaseReady:false,unityPublicRelease:false,
            executionEvidence:evidence,resumeStage:failure||(internalReady?'INTERNAL_PLATFORM_PLAYTEST_AND_DEBUG':'IMMEDIATE_NEXT_STAGE_DISPATCH'),
            failureCount:failure?1:0,contractCanaryPassed:String(process.env.IS_CANARY).toLowerCase()==='true'&&regression,updatedAt:stamp
          };
          fs.writeFileSync(`runtime-persist/queue/${process.env.GAME_ID}.json`,JSON.stringify(row,null,2)+'\n');
          fs.writeFileSync(`runtime-persist/queue/${process.env.GAME_ID}.evidence.json`,JSON.stringify(evidence,null,2)+'\n');
          console.log(`CHECKPOINT_LAST_SUCCESS=${last}`);console.log(`CHECKPOINT_FAILURE_STAGE=${failure||'NONE'}`);console.log(`UNITY_INTERNAL_RELEASE_READY=${internalReady?'YES':'NO'}`);console.log('UNITY_PUBLIC_RELEASE=NO');
          NODE

      - name: Upload checkpoint for company-runtime persistence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-unity-runtime-${{ matrix.item.gameId }}-${{ github.run_id }}
          path: runtime-persist/
          retention-days: 14
          if-no-files-found: error

      - name: Enforce stage result after checkpoint is safely captured
        if: always()
        env:
          BUILD_PASS: ${{ steps.buildstate.outputs.build_passed }}
          RUNTIME_PASS: ${{ steps.runtimestate.outputs.passed }}
          QA_PASS: ${{ steps.independentstate.outputs.passed }}
          REGRESSION_PASS: ${{ steps.regressionstate.outputs.passed }}
        run: |
          [[ "$BUILD_PASS" == true ]] || { echo 'FAILED_STAGE=SINGLE_BUILD_OR_PACKAGE' >&2; exit 21; }
          [[ "$RUNTIME_PASS" == true ]] || { echo 'FAILED_STAGE=TARGET_PLATFORM_RUNTIME' >&2; exit 22; }
          [[ "$QA_PASS" == true ]] || { echo 'FAILED_STAGE=INDEPENDENT_QA' >&2; exit 23; }
          [[ "$REGRESSION_PASS" == true ]] || { echo 'FAILED_STAGE=REGRESSION' >&2; exit 24; }
          echo 'UNITY_SPEED_SEQUENCE=PASS'

  persist-runtime:
    name: persist Unity exact checkpoints
    needs: [prepare, unity-technical-validation]
    if: needs.prepare.outputs.run == 'true' && always()
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: company-runtime-writer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: company-runtime
          fetch-depth: 1
          fetch-tags: false
      - name: Download all checkpoint packages including failed-stage jobs
        id: packages
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: development-unity-runtime-*-${{ github.run_id }}
          path: /tmp/development-unity-runtime
          merge-multiple: true
      - name: Merge checkpoint evidence into company runtime
        id: persist
        if: steps.packages.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin company-runtime main
          git reset --hard origin/company-runtime
          checkpoint_root=''
          if [[ -d /tmp/development-unity-runtime/runtime-persist/queue ]]; then
            checkpoint_root=/tmp/development-unity-runtime/runtime-persist
          elif [[ -d /tmp/development-unity-runtime/queue ]]; then
            checkpoint_root=/tmp/development-unity-runtime
          fi
          [[ -n "$checkpoint_root" ]] || { echo 'checkpoint queue directory missing after artifact extraction' >&2; find /tmp/development-unity-runtime -maxdepth 3 -type d -print; exit 15; }
          export CHECKPOINT_ROOT="$checkpoint_root"
          if [[ -d "$checkpoint_root/design" ]]; then cp -R "$checkpoint_root/design/." design/; fi
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const queue=JSON.parse(fs.readFileSync('development-queue.json','utf8'));
          const dir=path.join(process.env.CHECKPOINT_ROOT,'queue');
          const updates=fs.readdirSync(dir).filter(x=>x.endsWith('.json')&&!x.endsWith('.evidence.json')).map(x=>JSON.parse(fs.readFileSync(path.join(dir,x),'utf8')));
          let anyPassed=false,anyFailed=false;
          for(const update of updates){const item=(queue.items||[]).find(x=>x.gameId===update.gameId);if(!item)throw new Error(`queue item missing: ${update.gameId}`);Object.assign(item,update);if(update.contractCanaryPassed)queue.executionContractVersion=1;if(update.executionEvidence?.failureStage)anyFailed=true;else anyPassed=true;}
          queue.executionContract='CHANGE_DETECTION>CHEAP_PRECHECK>REPRESENTATIVE_CANARY>SINGLE_BUILD_OR_PACKAGE>IMMUTABLE_ARTIFACT_BIND>TARGET_PLATFORM_RUNTIME>INDEPENDENT_QA>REGRESSION>IMMEDIATE_NEXT_STAGE_DISPATCH>RESUME_EXACT_FAILURE_POINT';
          queue.developmentGameWipMax=null;
          queue.updatedAt=new Date().toISOString();
          fs.writeFileSync('development-queue.json',JSON.stringify(queue,null,2)+'\n');
          fs.writeFileSync('/tmp/persist-result.json',JSON.stringify({count:updates.length,anyPassed,anyFailed}));
          console.log(`DEVELOPMENT_UNITY_PERSIST_COUNT=${updates.length}`);
          console.log('DEVELOPMENT_GAME_ELIGIBILITY_CAP=NONE');
          NODE
          git checkout origin/main -- tools/company-homepage-platform-exposure-sync.mjs
          node tools/company-homepage-platform-exposure-sync.mjs development-queue.json game-catalog.json homepage-platform-exposure.json
          git reset -- tools/company-homepage-platform-exposure-sync.mjs >/dev/null 2>&1 || true
          git config user.name 'jaewoon-development-unity-runtime'
          git config user.email 'actions@users.noreply.github.com'
          git add design development-queue.json homepage-platform-exposure.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'runtime: persist Unity exact-stage checkpoints [skip ci]'
            for attempt in 1 2 3;do if git push origin HEAD:company-runtime;then break;fi;git fetch --no-tags origin company-runtime;git rebase origin/company-runtime||{ git rebase --abort||true;exit 1;};sleep $((attempt*2));done
          fi
          anyPassed="$(node -e "process.stdout.write(String(require('/tmp/persist-result.json').anyPassed))")"
          anyFailed="$(node -e "process.stdout.write(String(require('/tmp/persist-result.json').anyFailed))")"
          echo "any_passed=$anyPassed" >> "$GITHUB_OUTPUT"
          echo "any_failed=$anyFailed" >> "$GITHUB_OUTPUT"
          echo 'COMPANY_RUNTIME_UNITY_PERSIST=PASS'

      - name: Immediately continue only successful canonical progress
        if: steps.persist.outputs.any_passed == 'true' && steps.persist.outputs.any_failed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run company-development-confirmed-runtime.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'IMMEDIATE_NEXT_STAGE_DISPATCH=YES'

      - name: Unity runtime summary
        if: always()
        run: |
          echo 'DEVELOPMENT_GAME_ELIGIBILITY_CAP=NONE'
          echo 'DEVELOPMENT_GAME_ELIGIBILITY_SCOPE=UNBOUNDED_CAPACITY_BATCHED'
          echo 'UNITY_WEB_PARALLEL_LANE=NATIVE_DEVELOPMENT_DOES_NOT_WAIT_FOR_WEB'
          echo 'UNITY_WEB_PARALLEL_LANE_OWNER=unity-web-first-stage-build.yml'
          echo 'UNITY_WEB_CANONICAL_SOURCE=SAME_UNITY_PROJECT'
          echo 'CHANGE_DETECTION=ENABLED'
          echo 'CHEAP_PRECHECK=ENABLED'
          echo 'REPRESENTATIVE_CANARY=PARALLEL_OBSERVATION_ONLY'
          echo 'CANARY_SERIALIZES_GAME_ID_WAVE=NO'
          echo 'BUILD_ONCE_PER_SOURCE_FINGERPRINT=ENABLED'
          echo 'IMMUTABLE_ARTIFACT_REUSE=ENABLED'
          echo 'RUNTIME_THEN_INDEPENDENT_QA_THEN_REGRESSION=ENABLED'
