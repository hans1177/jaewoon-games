# owner-first-gate platform kick: fantasy-survival 2026-09-21
name: Company DEVELOPMENT_CONFIRMED Unity Runtime
run-name: Unity runtime · ${{ inputs.game_id || 'batch' }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/company-development-unity-runtime.yml'
      - '.github/workflows/unity-android-regression.yml'
      - '.build-requests/unity/**'
      - 'unity-games/**'
      - 'tools/company-development-unity-platform.mjs'
      - 'tools/company-development-unity-bootstrap.mjs'
      - 'tools/unity-package-fatal-logcat.py'
      - 'tools/unity-apk-runtime-smoke.sh'
      - 'tools/company-development-unity-evidence.mjs'
  workflow_call:
    inputs:
      game_id:
        required: false
        type: string
      publication_retry_only:
        required: false
        type: boolean
        default: false
      publication_retry_source_revision:
        required: false
        type: string
        default: ''
      publication_retry_artifact_identity:
        required: false
        type: string
        default: ''
      publication_retry_build_run_id:
        required: false
        type: string
        default: ''
      publication_retry_runtime_run_id:
        required: false
        type: string
        default: ''
      publication_retry_qa_run_id:
        required: false
        type: string
        default: ''
      publication_retry_regression_run_id:
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      game_id:
        description: Optional exact gameId. Empty keeps the existing batch behavior.
        required: false
        type: string
      publication_retry_only:
        description: Retry only the exact previously F9-verified publication artifact.
        required: false
        default: false
        type: boolean
      publication_retry_source_revision:
        description: Exact F9 source revision for publication repair.
        required: false
        type: string
      publication_retry_artifact_identity:
        description: Exact F9 APK sha256 identity for publication repair.
        required: false
        type: string
      publication_retry_build_run_id:
        description: Exact build run containing the F9 APK.
        required: false
        type: string
      publication_retry_runtime_run_id:
        description: Exact runtime evidence run for the failed publication cycle.
        required: false
        type: string
      publication_retry_qa_run_id:
        description: Exact independent QA run for the failed publication cycle.
        required: false
        type: string
      publication_retry_regression_run_id:
        description: Exact regression run for the failed publication cycle.
        required: false
        type: string

permissions:
  contents: write
  actions: write

env:
  VIBE2_LEARNING_RUNTIME_BRANCH: vibe2-learning-runtime

concurrency:
  group: unity-native-exact-${{ inputs.game_id || (github.event_name == 'push' && 'batch-push') || github.run_id }}
  cancel-in-progress: false

jobs:
  publication-repair:
    name: retry exact F9 Unity publication
    if: ${{ inputs.publication_retry_only == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          fetch-tags: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact persisted F9 publication repair identity
        env:
          GAME_ID: ${{ inputs.game_id }}
          SOURCE_REVISION: ${{ inputs.publication_retry_source_revision }}
          ARTIFACT_ID: ${{ inputs.publication_retry_artifact_identity }}
          BUILD_RUN_ID: ${{ inputs.publication_retry_build_run_id }}
          RUNTIME_RUN_ID: ${{ inputs.publication_retry_runtime_run_id }}
          QA_RUN_ID: ${{ inputs.publication_retry_qa_run_id }}
          REGRESSION_RUN_ID: ${{ inputs.publication_retry_regression_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GAME_ID" =~ ^[a-z0-9][a-z0-9-]{1,80}$ ]]
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ARTIFACT_ID" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          git fetch --no-tags --depth=1 origin company-runtime
          git show origin/company-runtime:development-queue.json > /tmp/development-queue.json
          node <<'NODE'
          const fs=require('fs');
          const q=JSON.parse(fs.readFileSync('/tmp/development-queue.json','utf8'));
          const item=(q.items||[]).find(row=>row.gameId===process.env.GAME_ID);
          if(!item)throw new Error('Unity publication retry game missing');
          const ev=item.unityInternalReleaseEvidence||{};
          if(item.unityF9ReleaseRegressionPassed!==true||ev.f0ThroughF9Passed!==true||ev.f9ReleaseRegressionPassed!==true)throw new Error('Unity publication retry requires persisted exact F9 PASS');
          const exact=
            String(ev.sourceRevision||'')===process.env.SOURCE_REVISION
            &&String(ev.artifactIdentity||'')===process.env.ARTIFACT_ID
            &&String(ev.buildRunId||'')===process.env.BUILD_RUN_ID
            &&String(ev.runtimeRunId||'')===String(process.env.RUNTIME_RUN_ID||'')
            &&String(ev.independentQaRunId||'')===String(process.env.QA_RUN_ID||'')
            &&String(ev.regressionRunId||'')===String(process.env.REGRESSION_RUN_ID||'');
          if(!exact)throw new Error('Unity publication retry identity drift');
          console.log('UNITY_F9_PUBLICATION_RETRY_IDENTITY=PASS');
          NODE

      - name: Retry exact F9 Unity APK publication
        id: publish
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_ID: ${{ inputs.game_id }}
          SOURCE_REVISION: ${{ inputs.publication_retry_source_revision }}
          ARTIFACT_ID: ${{ inputs.publication_retry_artifact_identity }}
          BUILD_RUN_ID: ${{ inputs.publication_retry_build_run_id }}
          RUNTIME_RUN_ID: ${{ inputs.publication_retry_runtime_run_id }}
          QA_RUN_ID: ${{ inputs.publication_retry_qa_run_id }}
          REGRESSION_RUN_ID: ${{ inputs.publication_retry_regression_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/unity-build /tmp/unity-runtime /tmp/unity-independent /tmp/unity-regression
          mkdir -p /tmp/unity-build /tmp/unity-runtime /tmp/unity-independent /tmp/unity-regression
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" -D /tmp/unity-build
          [[ "$RUNTIME_RUN_ID" =~ ^[0-9]+$ ]] && gh run download "$RUNTIME_RUN_ID" --repo "$GITHUB_REPOSITORY" -D /tmp/unity-runtime || true
          [[ "$QA_RUN_ID" =~ ^[0-9]+$ ]] && gh run download "$QA_RUN_ID" --repo "$GITHUB_REPOSITORY" -D /tmp/unity-independent || true
          [[ "$REGRESSION_RUN_ID" =~ ^[0-9]+$ ]] && gh run download "$REGRESSION_RUN_ID" --repo "$GITHUB_REPOSITORY" -D /tmp/unity-regression || true
          apk="$(find /tmp/unity-build -type f -name '*.apk' -size +0c | head -n1)"
          info="$(find /tmp/unity-build -type f -name build-info.json -size +0c | head -n1)"
          test -n "$apk" -a -n "$info"
          expected="${ARTIFACT_ID#sha256:}"
          actual="$(sha256sum "$apk" | awk '{print $1}')"
          [ "$actual" = "$expected" ]
          info_source="$(node -e "const b=require(process.argv[1]);process.stdout.write(String(b.sourceCommit||''))" "$info")"
          [ "$info_source" = "$SOURCE_REVISION" ]
          release_dir="/tmp/unity-f9-repair-$GAME_ID"
          rm -rf "$release_dir" && mkdir -p "$release_dir"
          cp "$apk" "$release_dir/$GAME_ID.apk"
          cp "$info" "$release_dir/build-info.json"
          printf '%s  %s\n' "$actual" "$GAME_ID.apk" > "$release_dir/$GAME_ID.apk.sha256"
          for pair in "runtime:/tmp/unity-runtime" "independent:/tmp/unity-independent" "regression:/tmp/unity-regression"; do
            label="${pair%%:*}"; dir="${pair#*:}"
            evidence="$(find "$dir" -type f -name evidence.json -size +0c 2>/dev/null | head -n1 || true)"
            [ -n "$evidence" ] && cp "$evidence" "$release_dir/$label-evidence.json"
          done
          tag="unity-f9-$GAME_ID-${SOURCE_REVISION:0:12}-$BUILD_RUN_ID"
          published=0
          for publish_attempt in 1 2 3; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              if gh release upload "$tag" "$release_dir"/* --repo "$GITHUB_REPOSITORY" --clobber; then published=1; break; fi
            else
              if gh release create "$tag" "$release_dir"/* --repo "$GITHUB_REPOSITORY" --target "$SOURCE_REVISION" --title "$GAME_ID Unity F9 verified build" --notes "Exact F9-verified Unity build publication repair. Source: $SOURCE_REVISION. Artifact: $ARTIFACT_ID." --prerelease; then published=1; break; fi
            fi
            sleep "$publish_attempt"
          done
          [ "$published" = 1 ] || exit 23
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "UNITY_F9_PUBLICATION_REPAIR=PASS:$GAME_ID:$tag"

      - name: Persist exact Unity publication repair outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_ID: ${{ inputs.game_id }}
          SOURCE_REVISION: ${{ inputs.publication_retry_source_revision }}
          ARTIFACT_ID: ${{ inputs.publication_retry_artifact_identity }}
          BUILD_RUN_ID: ${{ inputs.publication_retry_build_run_id }}
          RUNTIME_RUN_ID: ${{ inputs.publication_retry_runtime_run_id }}
          QA_RUN_ID: ${{ inputs.publication_retry_qa_run_id }}
          REGRESSION_RUN_ID: ${{ inputs.publication_retry_regression_run_id }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          RELEASE_TAG: ${{ steps.publish.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-unity-publication-repair'
          git config user.email 'actions@users.noreply.github.com'
          persisted=0
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags --depth=1 origin company-runtime
            git checkout --detach origin/company-runtime
            node <<'NODE'
          const fs=require('fs');
          const q=JSON.parse(fs.readFileSync('development-queue.json','utf8'));
          const item=(q.items||[]).find(row=>row.gameId===process.env.GAME_ID);
          if(!item)throw new Error('Unity publication repair queue item missing');
          const stamp=new Date().toISOString();
          const pass=String(process.env.PUBLISH_OUTCOME||'')==='success';
          const retry={
            version:1,status:pass?'PUBLISHED':'RETRY_REQUIRED',
            sourceRevision:process.env.SOURCE_REVISION,
            artifactIdentity:process.env.ARTIFACT_ID,
            buildRunId:Number(process.env.BUILD_RUN_ID),
            runtimeRunId:Number(process.env.RUNTIME_RUN_ID||0)||null,
            independentQaRunId:Number(process.env.QA_RUN_ID||0)||null,
            regressionRunId:Number(process.env.REGRESSION_RUN_ID||0)||null,
            releaseTag:process.env.RELEASE_TAG||null,
            lastAttemptAt:stamp,
            workflowRunId:Number(process.env.GITHUB_RUN_ID||0)||null
          };
          item.unityCanonicalPublishPending=!pass;
          item.unityCanonicalPublishRepairRequired=!pass;
          item.unityCanonicalPublishRetry=retry;
          if(pass){
            const evidence={...retry,published:true,publishedAt:stamp,authority:'unity-f9-exact-publication-repair'};
            const history=Array.isArray(item.unityCanonicalPublishHistory)?item.unityCanonicalPublishHistory:[];
            for(const completed of [item.unityCanonicalReleaseEvidence,evidence]){
              if(completed?.published===true&&!history.some(row=>row.sourceRevision===completed.sourceRevision&&row.artifactIdentity===completed.artifactIdentity))history.push(completed);
            }
            item.unityCanonicalPublishHistory=history;
            item.unityCanonicalReleaseEvidence=evidence;
          }
          item.updatedAt=stamp;q.updatedAt=stamp;
          fs.writeFileSync('development-queue.json',JSON.stringify(q,null,2)+'\n');
          NODE
            git add development-queue.json
            if git diff --cached --quiet; then persisted=1; break; fi
            git commit -m "runtime: persist Unity publication repair $GAME_ID [skip ci]"
            if git push origin HEAD:company-runtime; then persisted=1; break; fi
            sleep $((attempt*2))
          done
          test "$persisted" = 1

      - name: Re-dispatch exact Unity publication repair until success
        if: always() && steps.publish.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_ID: ${{ inputs.game_id }}
          SOURCE_REVISION: ${{ inputs.publication_retry_source_revision }}
          ARTIFACT_ID: ${{ inputs.publication_retry_artifact_identity }}
          BUILD_RUN_ID: ${{ inputs.publication_retry_build_run_id }}
          RUNTIME_RUN_ID: ${{ inputs.publication_retry_runtime_run_id }}
          QA_RUN_ID: ${{ inputs.publication_retry_qa_run_id }}
          REGRESSION_RUN_ID: ${{ inputs.publication_retry_regression_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run company-development-unity-runtime.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f game_id="$GAME_ID" \
            -f publication_retry_only=true \
            -f publication_retry_source_revision="$SOURCE_REVISION" \
            -f publication_retry_artifact_identity="$ARTIFACT_ID" \
            -f publication_retry_build_run_id="$BUILD_RUN_ID" \
            -f publication_retry_runtime_run_id="$RUNTIME_RUN_ID" \
            -f publication_retry_qa_run_id="$QA_RUN_ID" \
            -f publication_retry_regression_run_id="$REGRESSION_RUN_ID"
          echo "UNITY_F9_PUBLICATION_AUTOMATIC_REDISPATCH=YES:$GAME_ID:$BUILD_RUN_ID"
          echo 'UNITY_PUBLICATION_RETRY_BLOCKS_NEXT_EVOLUTION=NO'

  prepare:
    name: prepare selected-platform Unity queue
    if: ${{ inputs.publication_retry_only != true }}
    runs-on: ubuntu-slim
    timeout-minutes: 12
    outputs:
      run: ${{ steps.queue.outputs.run }}
      matrix: ${{ steps.queue.outputs.matrix }}
      canary: ${{ steps.queue.outputs.canary }}
      main_sha: ${{ steps.main.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          fetch-tags: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Unity contracts while fetching runtime queue
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin company-runtime &
          queue_fetch_pid=$!
          verify_status=0
          {
            node --check tools/company-shared-context.mjs
            node tools/company-shared-context.mjs --output=/tmp/company-shared-context-unity-plan.json
            node --check tools/company-selected-platform-router.mjs
            node --check tools/company-development-unity-platform.mjs
            node --check tools/company-upper-platform-admission.mjs
            node --check tools/company-development-unity-bootstrap.mjs
            node --check tools/company-development-unity-evidence.mjs
          } || verify_status=$?
          queue_fetch_status=0
          wait "$queue_fetch_pid" || queue_fetch_status=$?
          if (( verify_status != 0 || queue_fetch_status != 0 )); then
            echo "UNITY_PREPARE_INPUT_OVERLAP=FAIL:VERIFY=$verify_status:QUEUE=$queue_fetch_status" >&2
            exit 14
          fi
          git show origin/company-runtime:development-queue.json > /tmp/development-queue.json
          echo 'UNITY_PREPARE_CONTRACT_VERIFY=PASS'
          echo 'UNITY_PREPARE_QUEUE_FETCH=PASS'
          echo 'UNITY_PREPARE_INPUT_OVERLAP=PASS'

      - name: Bind current main
        id: main
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve Unity work from unbounded native queue with representative canary
        id: queue
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_GAME_ID: ${{ inputs.game_id || '' }}
        shell: bash
        run: |
          set -euo pipefail
          requested_ids="$REQUESTED_GAME_ID"
          if [[ -n "$requested_ids" && ! "$requested_ids" =~ ^[a-z0-9][a-z0-9-]{1,80}$ ]]; then
            echo "UNITY_REQUESTED_GAME_ID_INVALID=$requested_ids" >&2
            exit 13
          fi
          if [[ -z "$requested_ids" && "$GITHUB_EVENT_NAME" == 'push' ]]; then
            requested_ids="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '
              [.files[].filename
                | if test("^\\.build-requests/unity/[^/]+\\.json$") then
                    sub("^\\.build-requests/unity/";"") | sub("\\.json$";"") | sub("-development$";"")
                  elif test("^unity-games/[^/]+/") then
                    split("/")[1]
                  else empty end]
              | unique | join(",")
            ')"
          fi
          export REQUESTED_GAME_IDS="$requested_ids"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {DEVELOPMENT_GAME_WIP_MAX,platformDevelopmentEligible,selectRepresentativeCanary,selectTargetPlatformDevelopmentWindow} from './tools/company-selected-platform-router.mjs';
          import {classifyUpperPlatformAdmission} from './tools/company-upper-platform-admission.mjs';
          const q=JSON.parse(fs.readFileSync('/tmp/development-queue.json','utf8'));
          const roadmap=JSON.parse(fs.readFileSync('company-learning/platform-release-roadmap.json','utf8'));
          const grandfatherGameIds=roadmap?.directNativeDualPlatformDevelopment?.upperPlatformAdmissionMigration?.grandfatherGameIds||[];
          const globalWindow=selectTargetPlatformDevelopmentWindow(q.items||[]);
          const windowIds=new Set(globalWindow.map(item=>item.gameId));
          const rows=(q.items||[]).filter(item=>{
            if(!windowIds.has(item.gameId))return false;
            if(String(item.productionClass||'').toUpperCase()!=='DEVELOPMENT_CONFIRMED')return false;
            if(String(item.status||'').toUpperCase()!=='ACTIVE')return false;
            const admission=classifyUpperPlatformAdmission(item,{repoRoot:process.cwd(),grandfatherGameIds});
            if(admission.state!=='UPPER_PLATFORM'){
              console.log('UNITY_NATIVE_ADMISSION_BLOCKED='+item.gameId+':'+admission.state+':'+admission.reason);
              return false;
            }
            return platformDevelopmentEligible(item,'UNITY');
          }).map(item=>({
            gameId:item.gameId,gameName:item.gameName,designBaselineSource:item.designBaselineSource,
            sourcePath:item.unityProjectPath||item.targetSourcePaths?.UNITY||`unity-games/${item.gameId}`,
            platformDesignProfile:item.platformDesignProfiles?.UNITY||null,
            selectedPlatform:'UNITY',
            unityCandidateBranch:item.unityCandidateBranch||null,
            unitySourceCommit:item.unitySourceCommit||null,
            unityBuildRunId:Number(item.unityBuildRunId||0)||null,
            unityRuntimeSmokeRunId:Number(item.unityRuntimeSmokeRunId||0)||null,
            unityIndependentQaRunId:Number(item.unityIndependentQaRunId||0)||null,
            unityRegressionRunId:Number(item.unityRegressionRunId||0)||null,
            executionEvidence:item.executionEvidence||null,
            failureCount:Number(item.failureCount||0),
          }));
          const counts=new Map();
          for(const row of rows){const sig=row.executionEvidence?.failureSignature;if(sig)counts.set(sig,(counts.get(sig)||0)+1);}
          const repeated=[...counts.entries()].some(([,n])=>n>=2);
          const migrationCanary=Number(q.executionContractVersion||0)<1;
          const canaryRequired=rows.length>0&&(migrationCanary||repeated);
          const requestedIds=[...new Set(String(process.env.REQUESTED_GAME_IDS||'').split(',').map(x=>x.trim()).filter(Boolean))];
          const requestedSet=new Set(requestedIds);
          const requestedRows=requestedIds.length?rows.filter(row=>requestedSet.has(row.gameId)):[];
          const canary=requestedRows.length?null:(canaryRequired?selectRepresentativeCanary(rows):null);
          const batchMax=Math.max(1,Math.min(256,Number(roadmap?.developmentSpeedExecution?.externalMatrixBatchMax||256)));
          const selected=requestedRows.length?requestedRows.slice(0,batchMax):(canary?[canary]:rows.slice(0,batchMax));
          const parallel=Math.max(1,Math.min(batchMax,selected.length||1));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`run=${selected.length?'true':'false'}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`matrix=${JSON.stringify(selected)}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`canary=${canary?'true':'false'}\n`);
          console.log('DEVELOPMENT_GAME_ELIGIBILITY_CAP=NONE');
          console.log(`DEVELOPMENT_GAME_WIP_WINDOW_IDS=${globalWindow.map(x=>x.gameId).join(',')||'NONE'}`);
          console.log(`UNITY_TARGET_N=${rows.length}`);
          console.log(`UNITY_SELECTED_N=${selected.length}`);
          console.log(`UNITY_REQUESTED_GAME_IDS=${requestedIds.join(',')||'NONE'}`);
          console.log(`REPRESENTATIVE_CANARY=${canary?.gameId||'NONE'}`);
          console.log(`COMMON_FAILURE_DETECTED=${repeated?'YES':'NO'}`);
          console.log(`UNITY_EXECUTION_BATCH_CAPACITY=${batchMax}`);
          NODE

  unity-technical-validation:
    name: Unity staged validation (${{ matrix.item.gameName }})
    needs: prepare
    if: needs.prepare.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 160
    steps:
      - name: Checkout current canonical implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.main_sha }}
          fetch-depth: 1
          fetch-tags: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch current company runtime, verified Vibe learning, and build-up state
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin company-runtime
          git fetch --no-tags --depth=1 origin "+refs/heads/$VIBE2_LEARNING_RUNTIME_BRANCH:refs/remotes/origin/$VIBE2_LEARNING_RUNTIME_BRANCH"
          git fetch --no-tags --depth=1 origin "+refs/heads/vibe2-unreal-core:refs/remotes/origin/vibe2-unreal-core"
          git show "origin/$VIBE2_LEARNING_RUNTIME_BRANCH:company-learning/vibe3-task-playbooks.json" > /tmp/vibe3-task-playbooks.json
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('/tmp/vibe3-task-playbooks.json'));const u=p.taskTypes?.unity||{};const rows=(u.reuse||[]).filter(x=>String(x.id||'').startsWith('external-black-box-'));if(p.policy?.verifiedExternalBlackBoxTruncationForbidden!==true||u.authority!=='verified-task-playbook'||Number(u.verifiedExternalBlackBoxCoveragePct||0)!==100||!rows.length)process.exit(2);console.log('UNITY_VERIFIED_EXTERNAL_LEARNING_MEMORY=READY:'+rows.length)"

      - name: Materialize locked design and runtime catalog
        id: context
        env:
          GAME_ID: ${{ matrix.item.gameId }}
          DESIGN_SOURCE: ${{ matrix.item.designBaselineSource }}
        shell: bash
        run: |
          set -euo pipefail
          base="$(dirname "$DESIGN_SOURCE")"
          date="$(basename "$base")"
          project="unity-games/$GAME_ID"
          request=".build-requests/unity/${GAME_ID}-development.json"
          mkdir -p "$base"
          git show "origin/company-runtime:$DESIGN_SOURCE" > "$DESIGN_SOURCE"
          git show origin/company-runtime:game-catalog.json > game-catalog.json
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));const p=d?.content?.platformProfiles?.UNITY;if(!p||p.platform!=='UNITY')process.exit(2);for(const k of ['inputModel','sessionModel','multiplayerRuntime','performanceBudget','uiUx','saveAndNetwork','platformContentAdaptation','internalReleaseTarget','validationEvidence'])if(String(p[k]||'').trim().length<8)process.exit(3);console.log('UNITY_PLATFORM_PROFILE_INPUT=READY')" "$DESIGN_SOURCE"
          directive="/tmp/build-up-directive-$GAME_ID.json"
          if git cat-file -e "origin/vibe2-unreal-core:.vibe2/build-up-directives/$GAME_ID/current.json" 2>/dev/null; then
            git show "origin/vibe2-unreal-core:.vibe2/build-up-directives/$GAME_ID/current.json" > "$directive"
            echo "UNITY_BUILD_UP_DIRECTIVE_SOURCE=VIBE_RUNTIME:$GAME_ID"
          else
            directive=''
            echo "UNITY_BUILD_UP_DIRECTIVE_SOURCE=BASELINE_ONLY_NO_VIBE_DIRECTIVE:$GAME_ID"
          fi
          {
            echo "base=$base"
            echo "date=$date"
            echo "project=$project"
            echo "request=$request"
            echo "directive=$directive"
          } >> "$GITHUB_OUTPUT"

      - name: Change detection and exact-source reuse
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_ID: ${{ matrix.item.gameId }}
          GAME_NAME: ${{ matrix.item.gameName }}
          EXISTING_BRANCH: ${{ matrix.item.unityCandidateBranch }}
          EXISTING_SOURCE: ${{ matrix.item.unitySourceCommit }}
          PROJECT: ${{ steps.context.outputs.project }}
          REQUEST: ${{ steps.context.outputs.request }}
          DESIGN_SOURCE: ${{ matrix.item.designBaselineSource }}
          BUILD_UP_DIRECTIVE: ${{ steps.context.outputs.directive }}
        shell: bash
        run: |
          set -euo pipefail
          bind_catalog() {
            node -e 'const fs=require("fs");const project=process.argv[1];const catalog=JSON.parse(fs.readFileSync("game-catalog.json","utf8"));const game=(catalog.games||[]).find(x=>x.id===process.env.GAME_ID);if(!game)throw new Error(`runtime catalog game missing: ${process.env.GAME_ID}`);game.selectedPlatform="UNITY";game.targetPlatform="UNITY";game.unityProjectPath=project;game.productionClass="DEVELOPMENT_CONFIRMED";game.homepagePublicationApproved=false;game.publishTestBuildWhenReady=false;fs.writeFileSync("game-catalog.json",JSON.stringify(catalog,null,2)+"\n");' "$PROJECT"
          }

          direct_request=".build-requests/unity/${GAME_ID}.json"
          current_generator="$({ cat tools/company-development-unity-bootstrap.mjs; printf '\n'; node -e "const fs=require('fs'),crypto=require('crypto');const p=JSON.parse(fs.readFileSync('/tmp/vibe3-task-playbooks.json','utf8'));const rows=[];for(const task of Object.values(p.taskTypes||{}))for(const row of task.reuse||[])if(String(row.id||'').startsWith('external-black-box-'))rows.push(row);const by=new Map();for(const row of rows){const id=String(row.id);const prev=by.get(id)||{id,project:String(row.project||''),sourceRevision:String(row.sourceRevision||''),distilledApplicationPrinciples:[],distilledAvoidancePrinciples:[],distilledLearningUseAllowed:[],distilledLearningUseForbidden:[]};for(const k of ['distilledApplicationPrinciples','distilledAvoidancePrinciples','distilledLearningUseAllowed','distilledLearningUseForbidden'])prev[k]=[...new Set([...prev[k],...(row[k]||[]).map(String)])];by.set(id,prev);}const stable=[...by.values()].sort((a,b)=>a.id.localeCompare(b.id));process.stdout.write(crypto.createHash('sha256').update(JSON.stringify(stable)).digest('hex'))"; } | sha256sum | awk '{print $1}')"
          if [[ -f "$PROJECT/ProjectSettings/ProjectVersion.txt" ]]; then
            source_generator=''
            source_learning_coverage=''
            if [[ -f "$PROJECT/prototype-source.json" ]]; then
              source_generator="$(node -e 'const fs=require("fs");try{const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(String(p.generatorFingerprint||""));}catch{}' "$PROJECT/prototype-source.json")"
              source_learning_coverage="$(node -e 'const fs=require("fs");try{const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(String(p.verifiedExternalLearningCoveragePct||""));}catch{}' "$PROJECT/prototype-source.json")"
            fi
            if [[ "$source_generator" == "$current_generator" && "$source_learning_coverage" == "100" ]]; then
              [[ -f "$direct_request" ]] || { echo "UNITY_EXISTING_SOURCE_BUILD_REQUEST_MISSING=$GAME_ID" >&2; exit 12; }
              branch="development/unity-tech-${GAME_ID}-${GITHUB_RUN_ID}"
            git config user.name 'jaewoon-development-unity-runtime'
            git config user.email 'actions@users.noreply.github.com'
            git checkout -b "$branch"
            source_commit="$(git rev-parse HEAD)"
            mkdir -p "$(dirname "$REQUEST")"
            node - "$direct_request" "$REQUEST" "$GAME_ID" "$PROJECT" "$source_commit" "$GITHUB_RUN_ID" <<'NODE'
          const fs=require('fs');
          const [directFile,file,gameId,projectPath,sourceCommit,runId]=process.argv.slice(2);
          const direct=JSON.parse(fs.readFileSync(directFile,'utf8').replace(/^\uFEFF/,''));
          const directProject=String(direct.projectPath||'').replace(/\\/g,'/').replace(/^\/+|\/+$/g,'');
          if(Number(direct.version)!==1||String(direct.gameId||'')!==gameId||directProject!==projectPath||!String(direct.buildMethod||'').trim()){
            throw new Error('UNITY_EXISTING_SOURCE_BUILD_REQUEST_INVALID:'+gameId);
          }
          const out={
            version:1,
            requestId:`development-unity-${gameId}-${runId}`,
            gameId,
            projectPath,
            buildMethod:String(direct.buildMethod).trim(),
            sourceCommit,
            productionClass:'DEVELOPMENT_CONFIRMED',
            purpose:'TARGET_PLATFORM_TECHNICAL_VALIDATION',
            homepagePublicationApproved:false,
            publishTestBuildWhenReady:false,
            releaseAuthority:false,
          };
          const applicationId=String(direct.applicationId||'').trim();
          if(applicationId)out.applicationId=applicationId;
          fs.writeFileSync(file,JSON.stringify(out,null,2)+'\n');
          NODE
            git add "$REQUEST"
            git diff --cached --check
            git commit -m "ci: validate existing $GAME_ID Unity source [skip ci]"
            request_commit="$(git rev-parse HEAD)"
            git push origin HEAD:"$branch"
            echo "source_revision=$request_commit" >> "$GITHUB_OUTPUT"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
            echo 'source_reused=true' >> "$GITHUB_OUTPUT"
              echo 'CHANGE_DETECTION=CURRENT_MAIN_SOURCE_REUSED'
              exit 0
            fi
            echo "UNITY_CURRENT_MAIN_SOURCE_REUSE_INVALIDATED=VERIFIED_EXTERNAL_LEARNING_OR_GENERATOR_STALE old=${source_generator:-MISSING} current=$current_generator coverage=${source_learning_coverage:-MISSING}"
          fi

          reuse_branch=''
          reuse_source=''
          if [[ -n "$EXISTING_BRANCH" ]]; then
            if git fetch --no-tags --depth=1 origin "$EXISTING_BRANCH:refs/remotes/origin/unity-reuse" >/dev/null 2>&1; then
              candidate="$(git rev-parse refs/remotes/origin/unity-reuse)"
              if [[ ! "$EXISTING_SOURCE" =~ ^[0-9a-f]{40}$ || "$candidate" == "$EXISTING_SOURCE" ]]; then
                reuse_branch="$EXISTING_BRANCH"
                reuse_source="$candidate"
              fi
            fi
          fi

          if [[ -z "$reuse_source" ]]; then
            prefix="development/unity-tech-${GAME_ID}-"
            latest_branch="$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/$prefix" --jq '.[].ref' 2>/dev/null | sed 's#^refs/heads/##' | awk -F- '{print $NF "\t" $0}' | sort -n | tail -n1 | cut -f2- || true)"
            if [[ -n "$latest_branch" ]] && git fetch --no-tags --depth=1 origin "$latest_branch:refs/remotes/origin/unity-history" >/dev/null 2>&1; then
              reuse_branch="$latest_branch"
              reuse_source="$(git rev-parse refs/remotes/origin/unity-history)"
              echo "UNITY_SOURCE_MIGRATION_BRANCH=$reuse_branch"
            fi
          fi

          if [[ "$reuse_source" =~ ^[0-9a-f]{40}$ ]]; then
            git checkout "$reuse_source" -- "$PROJECT" "$REQUEST" 2>/dev/null || true
            source_generator=''
            if [[ -f "$PROJECT/prototype-source.json" ]]; then
              source_generator="$(node -e 'const fs=require("fs");try{const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(String(p.generatorFingerprint||""));}catch{}' "$PROJECT/prototype-source.json")"
            fi
            if [[ -f "$PROJECT/ProjectSettings/ProjectVersion.txt" && -f "$REQUEST" && "$source_generator" == "$current_generator" ]]; then
              bind_catalog
              echo "source_revision=$reuse_source" >> "$GITHUB_OUTPUT"
              echo "branch=$reuse_branch" >> "$GITHUB_OUTPUT"
              echo 'source_reused=true' >> "$GITHUB_OUTPUT"
              echo 'CHANGE_DETECTION=UNCHANGED_SOURCE_REUSED'
              exit 0
            fi
            echo "UNITY_SOURCE_REUSE_INVALIDATED=GENERATOR_FINGERPRINT_MISMATCH old=${source_generator:-MISSING} current=$current_generator"
          fi

          directive_args=()
          if [[ -n "$BUILD_UP_DIRECTIVE" && -f "$BUILD_UP_DIRECTIVE" ]]; then directive_args+=(--build-up-directive="$BUILD_UP_DIRECTIVE"); fi
          node tools/company-development-unity-bootstrap.mjs \
            --game-id="$GAME_ID" \
            --game-name="$GAME_NAME" \
            --baseline="$DESIGN_SOURCE" \
            --playbooks=/tmp/vibe3-task-playbooks.json \
            --output="$PROJECT" \
            "${directive_args[@]}"
          bind_catalog
          branch="development/unity-tech-${GAME_ID}-${GITHUB_RUN_ID}"
          git config user.name 'jaewoon-development-unity-runtime'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b "$branch"
          git add "$PROJECT" game-catalog.json
          git diff --cached --check
          git commit -m "dev: bind $GAME_ID selected-platform Unity source [skip ci]"
          mkdir -p "$(dirname "$REQUEST")"
          source_commit="$(git rev-parse HEAD)"
          node - "$REQUEST" "$GAME_ID" "$PROJECT" "$source_commit" "$GITHUB_RUN_ID" <<'NODE'
          const fs=require('fs');
          const [file,gameId,projectPath,sourceCommit,runId]=process.argv.slice(2);
          fs.writeFileSync(file,JSON.stringify({version:1,requestId:`development-unity-${gameId}-${runId}`,gameId,projectPath,buildMethod:'SeedAndroidBuild.Build',sourceCommit,productionClass:'DEVELOPMENT_CONFIRMED',purpose:'TARGET_PLATFORM_TECHNICAL_VALIDATION',homepagePublicationApproved:false,publishTestBuildWhenReady:false,releaseAuthority:false},null,2)+'\n');
          NODE
          git add "$REQUEST"
          git commit -m "ci: request $GAME_ID selected-platform Unity build [skip ci]"
          request_commit="$(git rev-parse HEAD)"
          git push origin HEAD:"$branch"
          echo "source_revision=$request_commit" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo 'source_reused=false' >> "$GITHUB_OUTPUT"
          echo 'CHANGE_DETECTION=SOURCE_CHANGED_OR_MISSING'

      - name: Cheap precheck and checkpoint resume plan
        id: plan
        env:
          PREVIOUS_EVIDENCE: ${{ toJSON(matrix.item.executionEvidence) }}
          SOURCE_REVISION: ${{ steps.source.outputs.source_revision }}
          SOURCE_PATH: ${{ steps.context.outputs.project }}
          EXISTING_BUILD_RUN: ${{ matrix.item.unityBuildRunId }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createSelectedPlatformExecutionPlan} from './tools/company-selected-platform-router.mjs';
          let previous={};try{previous=JSON.parse(process.env.PREVIOUS_EVIDENCE||'null')||{};}catch{}
          const plan=createSelectedPlatformExecutionPlan({selectedPlatform:'UNITY',sourceRevision:process.env.SOURCE_REVISION,sourcePath:process.env.SOURCE_PATH,buildConfigFingerprint:'unity-android-development-v2',previousEvidence:previous});
          const reusable=plan.artifactReusable&&/^\d+$/.test(process.env.EXISTING_BUILD_RUN||'');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`fingerprint=${plan.sourceFingerprint}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`reuse_build=${reusable?'true':'false'}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`resume_stage=${plan.resumeStage}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`previous_runtime=${plan.sameFingerprint&&previous.runtimePassed===true?'true':'false'}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`previous_qa=${plan.sameFingerprint&&previous.independentQaPassed===true?'true':'false'}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`previous_regression=${plan.sameFingerprint&&previous.regressionPassed===true?'true':'false'}\n`);
          if(!plan.precheck.pass)process.exitCode=2;
          console.log(`CHEAP_PRECHECK=${plan.precheck.pass?'PASS':'FAIL'}`);
          console.log(`SOURCE_FINGERPRINT=${plan.sourceFingerprint}`);
          console.log(`RESUME_STAGE=${plan.resumeStage}`);
          console.log(`BUILD_REUSE=${reusable?'YES':'NO'}`);
          NODE

      - name: Dispatch one Unity cloud build for this source fingerprint
        id: build
        if: steps.plan.outputs.reuse_build != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.source.outputs.branch }}
          REQUEST: ${{ steps.context.outputs.request }}
        shell: bash
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/actions/workflows/unity-cloud-android-test.yml"
          baseline="$(gh api "$api/runs?branch=$BRANCH&event=workflow_dispatch&per_page=20" --jq '[.workflow_runs[].id] | max // 0')"
          jq -n --arg ref "$BRANCH" --arg request "$REQUEST" '{ref:$ref,inputs:{request_file:$request}}' | gh api --method POST "$api/dispatches" --input -
          run_id=''
          for _ in $(seq 1 60); do
            run_id="$(gh api "$api/runs?branch=$BRANCH&event=workflow_dispatch&per_page=20" | jq -r --argjson b "$baseline" '[.workflow_runs[] | select(.id > $b) | .id] | max // empty')"
            [[ "$run_id" =~ ^[0-9]+$ ]] && break
            sleep 4
          done
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo 'Unity cloud build run was not created' >&2; exit 2; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "CLOUD_UNITY_BUILD_RUN_ID=$run_id"

      - name: Resolve immutable build run reference
        id: buildref
        env:
          REUSE: ${{ steps.plan.outputs.reuse_build }}
          EXISTING: ${{ matrix.item.unityBuildRunId }}
          CREATED: ${{ steps.build.outputs.run_id }}
        run: |
          if [[ "$REUSE" == 'true' ]]; then run="$EXISTING"; else run="$CREATED"; fi
          [[ "$run" =~ ^[0-9]+$ ]] || exit 3
          echo "run_id=$run" >> "$GITHUB_OUTPUT"

      - name: Inspect build and legacy install-gate outcome without discarding successful APK
        id: buildstate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.buildref.outputs.run_id }}
          REUSE: ${{ steps.plan.outputs.reuse_build }}
          PREVIOUS_RUNTIME: ${{ steps.plan.outputs.previous_runtime }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REUSE" == 'true' ]]; then
            echo 'build_passed=true' >> "$GITHUB_OUTPUT"
            echo "runtime_passed=$PREVIOUS_RUNTIME" >> "$GITHUB_OUTPUT"
            echo 'SINGLE_BUILD_OR_PACKAGE=REUSED'
            exit 0
          fi
          for _ in $(seq 1 1320); do
            status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.status')"
            [[ "$status" == completed ]] && break
            sleep 5
          done
          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100")"
          build="$(jq -r '[.jobs[]|select(.name=="build")|.conclusion][0]//"missing"' <<<"$jobs")"
          legacy_job="$(jq -r '[.jobs[]|select(.name=="android16-install-gate")|.conclusion][0]//"missing"' <<<"$jobs")"
          legacy_verify="$(jq -r '[.jobs[]|select(.name=="android16-install-gate")|.steps[]?|select(.name=="Install and launch exact APK on matching ARM64 runtime")|.conclusion][0]//"missing"' <<<"$jobs")"
          echo "build_passed=$([[ "$build" == success ]]&&echo true||echo false)" >> "$GITHUB_OUTPUT"
          echo "runtime_passed=$([[ "$legacy_verify" == success ]]&&echo true||echo false)" >> "$GITHUB_OUTPUT"
          echo "BUILD_JOB_CONCLUSION=$build"
          echo "LEGACY_RUNTIME_JOB_CONCLUSION=$legacy_job"
          echo "LEGACY_RUNTIME_VERIFY_CONCLUSION=$legacy_verify"

      - name: Bind immutable APK artifact identity
        id: artifact
        if: steps.buildstate.outputs.build_passed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ steps.buildref.outputs.run_id }}
          SOURCE_REVISION: ${{ steps.source.outputs.source_revision }}
          SOURCE_FINGERPRINT: ${{ steps.plan.outputs.fingerprint }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/unity-build && mkdir -p /tmp/unity-build
          gh run download "$BUILD_RUN" -D /tmp/unity-build
          info="$(find /tmp/unity-build -type f -name build-info.json -size +0c | head -n1)"
          apk="$(find /tmp/unity-build -type f -name '*.apk' -size +0c | head -n1)"
          test -n "$info" -a -n "$apk"
          expected="$(node -e "const b=require(process.argv[1]);process.stdout.write(String(b.sha256||''))" "$info")"
          source="$(node -e "const b=require(process.argv[1]);process.stdout.write(String(b.sourceCommit||''))" "$info")"
          actual="$(sha256sum "$apk" | awk '{print $1}')"
          [[ "$actual" == "$expected" && "$source" == "$SOURCE_REVISION" ]] || { echo 'immutable artifact/source mismatch' >&2; exit 4; }
          git fetch --no-tags --depth=1 origin "$source" >/dev/null 2>&1 || true
          source_tree="$(git rev-parse "${source}^{tree}")"
          node - "$info" "$source_tree" <<'NODE'
          const fs=require('fs');const [file,tree]=process.argv.slice(2);const b=JSON.parse(fs.readFileSync(file,'utf8').replace(/^\uFEFF/,''));b.sourceTreeSha=tree;fs.writeFileSync(file,JSON.stringify(b,null,2)+'\n');
          NODE
          echo "identity=sha256:$actual" >> "$GITHUB_OUTPUT"
          echo "source_revision=$source" >> "$GITHUB_OUTPUT"
          echo "source_tree=$source_tree" >> "$GITHUB_OUTPUT"
          echo "source_fingerprint=$SOURCE_FINGERPRINT" >> "$GITHUB_OUTPUT"
          echo 'IMMUTABLE_ARTIFACT_BIND=PASS'

      - name: Resume target-platform runtime only from its failed checkpoint
        id: runtime
        if: steps.buildstate.outputs.build_passed == 'true' && steps.buildstate.outputs.runtime_passed != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ steps.buildref.outputs.run_id }}
          REUSE: ${{ steps.plan.outputs.reuse_build }}
        shell: bash
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/actions/workflows/unity-android-runtime-smoke.yml"
          title="Unity Android Runtime Smoke $BUILD_RUN"
          child=''
          if [[ "$REUSE" != 'true' ]]; then
            for _ in $(seq 1 60); do
              child="$(gh api "$api/runs?event=workflow_run&per_page=50" | jq -r --arg title "$title" '[.workflow_runs[]|select(.display_title==$title)|.id]|max//empty')"
              [[ "$child" =~ ^[0-9]+$ ]] && break
              sleep 2
            done
            if [[ "$child" =~ ^[0-9]+$ ]]; then
              echo "UNITY_RUNTIME_SMOKE_REUSED_AUTO=$child"
            fi
          fi
          if [[ ! "$child" =~ ^[0-9]+$ ]]; then
            baseline="$(gh api "$api/runs?branch=main&event=workflow_dispatch&per_page=20" --jq '[.workflow_runs[].id] | max // 0')"
            jq -n --arg ref main --arg run "$BUILD_RUN" '{ref:$ref,inputs:{run_id:$run}}' | gh api --method POST "$api/dispatches" --input -
            for _ in $(seq 1 60); do
              child="$(gh api "$api/runs?branch=main&event=workflow_dispatch&per_page=20" | jq -r --argjson b "$baseline" --arg title "$title" '[.workflow_runs[]|select(.id>$b and .display_title==$title)|.id]|max//empty')"
              [[ "$child" =~ ^[0-9]+$ ]] && break
              sleep 4
            done
            [[ "$child" =~ ^[0-9]+$ ]] || exit 5
            echo "UNITY_RUNTIME_SMOKE_DISPATCHED_MANUAL=$child"
          fi
          echo "run_id=$child" >> "$GITHUB_OUTPUT"
          for _ in $(seq 1 420); do
            row="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$child" --jq '[.status,.conclusion]|@tsv')"; status="${row%%$'\t'*}"; conclusion="${row#*$'\t'}"
            if [[ "$status" == completed ]]; then [[ "$conclusion" == success ]] && exit 0 || exit 6; fi
            sleep 5
          done
          exit 7

      - name: Resolve runtime checkpoint result
        id: runtimestate
        env:
          PREVIOUS: ${{ steps.plan.outputs.previous_runtime }}
          LEGACY: ${{ steps.buildstate.outputs.runtime_passed }}
          RESUME_OUTCOME: ${{ steps.runtime.outcome }}
        run: |
          if [[ "$PREVIOUS" == true || "$LEGACY" == true || "$RESUME_OUTCOME" == success ]]; then pass=true; else pass=false; fi
          echo "passed=$pass" >> "$GITHUB_OUTPUT"
          echo "TARGET_PLATFORM_RUNTIME=$pass"

      - name: Run independent QA only after runtime PASS
        id: independent
        if: steps.runtimestate.outputs.passed == 'true' && steps.plan.outputs.previous_qa != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ steps.buildref.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/actions/workflows/unity-android-independent-qa.yml"; title="Unity Android Independent QA $BUILD_RUN"
          active="$(gh api "$api/runs?branch=main&event=workflow_dispatch&per_page=100" | jq -r --arg title "$title" '[.workflow_runs[]|select(.display_title==$title and (.status=="queued" or .status=="pending" or .status=="in_progress" or .status=="requested"))|.id]|min//empty')"
          if [[ "$active" =~ ^[0-9]+$ ]]; then
            child="$active"
            echo "UNITY_ANDROID_INDEPENDENT_QA_REUSE_ACTIVE=$BUILD_RUN:$child"
          else
            baseline="$(gh api "$api/runs?branch=main&event=workflow_dispatch&per_page=100" --jq '[.workflow_runs[].id] | max // 0')"
            jq -n --arg ref main --arg run "$BUILD_RUN" '{ref:$ref,inputs:{run_id:$run}}' | gh api --method POST "$api/dispatches" --input -
            child=''; for _ in $(seq 1 60); do child="$(gh api "$api/runs?branch=main&event=workflow_dispatch&per_page=100" | jq -r --argjson b "$baseline" --arg title "$title" '[.workflow_runs[]|select(.id>$b and .display_title==$title)|.id]|max//empty')"; [[ "$child" =~ ^[0-9]+$ ]]&&break; sleep 4; done
            echo "UNITY_ANDROID_INDEPENDENT_QA_DISPATCHED=$BUILD_RUN:${child:-NONE}"
          fi
          [[ "$child" =~ ^[0-9]+$ ]]||exit 8; echo "run_id=$child" >> "$GITHUB_OUTPUT"
          for _ in $(seq 1 420); do row="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$child" --jq '[.status,.conclusion]|@tsv')"; s="${row%%$'\t'*}"; c="${row#*$'\t'}"; if [[ "$s" == completed ]];then [[ "$c" == success ]]&&exit 0||exit 9;fi;sleep 5;done;exit 10

      - name: Resolve independent QA checkpoint result
        id: independentstate
        env:
          PREVIOUS: ${{ steps.plan.outputs.previous_qa }}
          OUTCOME: ${{ steps.independent.outcome }}
        run: |
          if [[ "$PREVIOUS" == true || "$OUTCOME" == success ]]; then pass=true; else pass=false; fi
          echo "passed=$pass" >> "$GITHUB_OUTPUT"
          echo "INDEPENDENT_QA=$pass"

      - name: Run regression on the same immutable APK
        id: regression
        if: steps.independentstate.outputs.passed == 'true' && steps.plan.outputs.previous_regression != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ steps.buildref.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/actions/workflows/unity-android-regression.yml"; title="Unity Android Regression $BUILD_RUN"
          active="$(gh api "$api/runs?branch=main&event=workflow_dispatch&per_page=100" | jq -r --arg title "$title" '[.workflow_runs[]|select(.display_title==$title and (.status=="queued" or .status=="pending" or .status=="in_progress" or .status=="requested"))|.id]|min//empty')"
          if [[ "$active" =~ ^[0-9]+$ ]]; then
            child="$active"
            echo "UNITY_ANDROID_REGRESSION_REUSE_ACTIVE=$BUILD_RUN:$child"
          else
            baseline="$(gh api "$api/runs?branch=main&event=workflow_dispatch&per_page=100" --jq '[.workflow_runs[].id] | max // 0')"
            jq -n --arg ref main --arg run "$BUILD_RUN" '{ref:$ref,inputs:{run_id:$run}}' | gh api --method POST "$api/dispatches" --input -
            child=''; for _ in $(seq 1 60); do child="$(gh api "$api/runs?branch=main&event=workflow_dispatch&per_page=100" | jq -r --argjson b "$baseline" --arg title "$title" '[.workflow_runs[]|select(.id>$b and .display_title==$title)|.id]|max//empty')"; [[ "$child" =~ ^[0-9]+$ ]]&&break; sleep 4; done
            echo "UNITY_ANDROID_REGRESSION_DISPATCHED=$BUILD_RUN:${child:-NONE}"
          fi
          [[ "$child" =~ ^[0-9]+$ ]]||exit 11; echo "run_id=$child" >> "$GITHUB_OUTPUT"
          for _ in $(seq 1 420); do row="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$child" --jq '[.status,.conclusion]|@tsv')"; s="${row%%$'\t'*}"; c="${row#*$'\t'}"; if [[ "$s" == completed ]];then [[ "$c" == success ]]&&exit 0||exit 12;fi;sleep 5;done;exit 13

      - name: Resolve regression checkpoint result
        id: regressionstate
        env:
          PREVIOUS: ${{ steps.plan.outputs.previous_regression }}
          OUTCOME: ${{ steps.regression.outcome }}
        run: |
          if [[ "$PREVIOUS" == true || "$OUTCOME" == success ]]; then pass=true; else pass=false; fi
          echo "passed=$pass" >> "$GITHUB_OUTPUT"
          echo "REGRESSION=$pass"

      - name: Bind passed stages into canonical DEVELOPMENT evidence
        id: canonical
        if: steps.regressionstate.outputs.passed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_ID: ${{ matrix.item.gameId }}
          BASE: ${{ steps.context.outputs.base }}
          PROJECT: ${{ steps.context.outputs.project }}
          BUILD_RUN: ${{ steps.buildref.outputs.run_id }}
          RUNTIME_RUN_NEW: ${{ steps.runtime.outputs.run_id }}
          RUNTIME_RUN_OLD: ${{ matrix.item.unityRuntimeSmokeRunId }}
          QA_RUN_NEW: ${{ steps.independent.outputs.run_id }}
          QA_RUN_OLD: ${{ matrix.item.unityIndependentQaRunId }}
          REGRESSION_RUN_NEW: ${{ steps.regression.outputs.run_id }}
          REGRESSION_RUN_OLD: ${{ matrix.item.unityRegressionRunId }}
          SOURCE_REVISION: ${{ steps.source.outputs.source_revision }}
        shell: bash
        run: |
          set -euo pipefail
          runtime_run="${RUNTIME_RUN_NEW:-$RUNTIME_RUN_OLD}"; qa_run="${QA_RUN_NEW:-$QA_RUN_OLD}"; regression_run="${REGRESSION_RUN_NEW:-$REGRESSION_RUN_OLD}"
          rm -rf /tmp/unity-runtime /tmp/unity-independent /tmp/unity-regression
          mkdir -p /tmp/unity-runtime /tmp/unity-independent /tmp/unity-regression
          if [[ "$runtime_run" =~ ^[0-9]+$ ]]; then gh run download "$runtime_run" -D /tmp/unity-runtime; else cp -R /tmp/unity-build/. /tmp/unity-runtime/; fi
          [[ "$qa_run" =~ ^[0-9]+$ ]] && gh run download "$qa_run" -D /tmp/unity-independent
          [[ "$regression_run" =~ ^[0-9]+$ ]] && gh run download "$regression_run" -D /tmp/unity-regression
          build_info="$(find /tmp/unity-build -type f -name build-info.json | head -n1)"
          runtime_json="$(find /tmp/unity-runtime -type f -name evidence.json | head -n1)"
          independent_json="$(find /tmp/unity-independent -type f -name evidence.json | head -n1)"
          runtime_log="$(find /tmp/unity-runtime -type f -name logcat.txt | head -n1 || true)"
          independent_log="$(find /tmp/unity-independent -type f -name logcat.txt | head -n1 || true)"
          test -n "$build_info" -a -n "$runtime_json" -a -n "$independent_json"
          node tools/company-development-unity-evidence.mjs --game-id="$GAME_ID" --build-info="$build_info" --runtime="$runtime_json" --independent="$independent_json" --runtime-log="$runtime_log" --independent-log="$independent_log" --project="$PROJECT" --output="$BASE/unity-technical-validation.json"
          regression_json="$(find /tmp/unity-regression -type f -name evidence.json | head -n1 || true)"; [[ -n "$regression_json" ]] && cp "$regression_json" "$BASE/unity-regression-validation.json"
          echo "runtime_run=$runtime_run" >> "$GITHUB_OUTPUT"; echo "qa_run=$qa_run" >> "$GITHUB_OUTPUT"; echo "regression_run=$regression_run" >> "$GITHUB_OUTPUT"

      - name: Prepare free models only after technical stages pass
        if: steps.regressionstate.outputs.passed == 'true'
        uses: ./.github/actions/prepare-ollama
        with:
          model: 'llama3.2:1b'
          version: '0.33.3'
          pull-model: 'true'
          department-role: development
          cache-model: 'true'

      - name: Ensure configured department models only for evidence meeting
        if: steps.regressionstate.outputs.passed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t models < <(node -e "const d=require('./company-directive.json');for(const m of [...new Set(d.ai?.modelPool||[])])console.log(m)")
          have="$(ollama list | awk 'NR>1{print $1}')"; for model in "${models[@]}";do grep -Fxq "$model"<<<"$have"||ollama pull "$model";done

      - name: Revalidate shared worker context before Unity checkpoint
        run: node tools/company-shared-context.mjs --output=/tmp/company-shared-context-unity-before-checkpoint.json

      - name: Persist exact checkpoint package even when a later stage fails
        id: checkpoint
        if: always()
        env:
          GAME_ID: ${{ matrix.item.gameId }}
          BASE: ${{ steps.context.outputs.base }}
          PROJECT: ${{ steps.context.outputs.project }}
          BRANCH: ${{ steps.source.outputs.branch }}
          SOURCE_REVISION: ${{ steps.source.outputs.source_revision }}
          SOURCE_FINGERPRINT: ${{ steps.plan.outputs.fingerprint }}
          BUILD_RUN: ${{ steps.buildref.outputs.run_id }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.identity }}
          BUILD_PASS: ${{ steps.buildstate.outputs.build_passed }}
          RUNTIME_PASS: ${{ steps.runtimestate.outputs.passed }}
          QA_PASS: ${{ steps.independentstate.outputs.passed }}
          REGRESSION_PASS: ${{ steps.regressionstate.outputs.passed }}
          RUNTIME_RUN_NEW: ${{ steps.runtime.outputs.run_id }}
          RUNTIME_RUN_OLD: ${{ matrix.item.unityRuntimeSmokeRunId }}
          QA_RUN_NEW: ${{ steps.independent.outputs.run_id }}
          QA_RUN_OLD: ${{ matrix.item.unityIndependentQaRunId }}
          REGRESSION_RUN_NEW: ${{ steps.regression.outputs.run_id }}
          REGRESSION_RUN_OLD: ${{ matrix.item.unityRegressionRunId }}
          IS_CANARY: ${{ needs.prepare.outputs.canary }}
          DESIGN_SOURCE: ${{ matrix.item.designBaselineSource }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-persist/"$(dirname "$BASE")" runtime-persist/queue
          [[ -d "$BASE" ]] && cp -R "$BASE" runtime-persist/"$(dirname "$BASE")"/
          source_tree_sha="$(git rev-parse "$SOURCE_REVISION:$PROJECT")"
          [[ "$source_tree_sha" =~ ^[0-9a-f]{40}$ ]]
          export SOURCE_TREE_SHA="$source_tree_sha"
          echo "UNITY_CHECKPOINT_SOURCE_TREE_SHA=$source_tree_sha"
          git show origin/company-runtime:development-queue.json > /tmp/unity-current-queue.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {failureSignature} from './tools/company-selected-platform-router.mjs';
          const yes=v=>String(v).toLowerCase()==='true';
          const build=yes(process.env.BUILD_PASS),runtime=yes(process.env.RUNTIME_PASS),qa=yes(process.env.QA_PASS),regression=yes(process.env.REGRESSION_PASS);
          const currentQueue=JSON.parse(fs.readFileSync('/tmp/unity-current-queue.json','utf8'));
          const currentItem=(currentQueue.items||[]).find(x=>x.gameId===process.env.GAME_ID)||{};
          let design={};
          try{design=JSON.parse(fs.readFileSync(process.env.DESIGN_SOURCE,'utf8'));}catch{}
          const multiplayerMode=String(design?.content?.multiplayerMode||'').trim().toUpperCase();
          const unityMultiplayer=String(design?.content?.platformProfiles?.UNITY?.multiplayerRuntime||'').trim().toUpperCase();
          const singleMode=multiplayerMode==='SINGLE'||multiplayerMode==='SINGLE_PLAYER'||/SINGLE[-_ ]?PLAYER|NETWORKING REMAINS DISABLED|LOCAL GAMEPLAY AUTHORITY/.test(unityMultiplayer);
          const multiplayerRequired=Boolean((multiplayerMode||unityMultiplayer)&&!singleMode);
          const mp=currentItem.unityMultiplayerQaEvidence||{};
          const multiplayerPass=!multiplayerRequired||(mp.pass===true&&Number(mp.participantCount||0)>=2&&mp.authoritativeSync===true);
          let last='CHEAP_PRECHECK',failure=null;
          if(build)last='F0_SOURCE_INTEGRITY';else failure='F0_SOURCE_INTEGRITY';
          if(build&&process.env.ARTIFACT_ID)last='F0_SOURCE_INTEGRITY';
          if(build&&!runtime)failure='F1_SERVER_BOOT';else if(runtime)last='F4_PHYSICS_AND_MOVEMENT';
          if(runtime&&!qa)failure='F5_INPUT_CAMERA_UI';else if(qa)last='F6_CORE_SERVICES';
          if(runtime&&qa&&!multiplayerPass)failure='F7_MULTIPLAYER_FOUNDATION';else if(multiplayerPass&&runtime&&qa)last='F7_MULTIPLAYER_FOUNDATION';
          if(runtime&&qa&&multiplayerPass)last='F8_GAMEPLAY_SYSTEMS';
          if(runtime&&qa&&multiplayerPass&&!regression)failure='F9_RELEASE_REGRESSION';else if(regression&&multiplayerPass)last='F9_RELEASE_REGRESSION';
          const canonical=process.env.MEETING_STATE||'WAITING_TARGET_PLATFORM_VALIDATION';
          const runtimeRun=Number(process.env.RUNTIME_RUN_NEW||process.env.RUNTIME_RUN_OLD||0)||null;
          const qaRun=Number(process.env.QA_RUN_NEW||process.env.QA_RUN_OLD||0)||null;
          const regressionRun=Number(process.env.REGRESSION_RUN_NEW||process.env.REGRESSION_RUN_OLD||0)||null;
          const buildRun=Number(process.env.BUILD_RUN||0)||null;
          const artifactIdentity=process.env.ARTIFACT_ID||null;
          const stamp=new Date().toISOString();
          const exactBinding=Boolean(artifactIdentity&&process.env.SOURCE_REVISION&&process.env.SOURCE_TREE_SHA);
          const f0ToF9={
            version:1,platform:'UNITY',sourceRevision:process.env.SOURCE_REVISION||null,artifactIdentity,sourceRootTreeSha:process.env.SOURCE_TREE_SHA||null,
            evidenceMode:'EXISTING_EXACT_APK_RUNTIME_QA_REGRESSION_WITH_PLATFORM_APPLICABILITY',
            floors:{
              F0:{state:build&&exactBinding?'PASS':'FAIL',authority:'IMMUTABLE_APK_BUILD_AND_SOURCE_BINDING'},
              F1:{state:runtime?'PASS':'FAIL',authority:'EXACT_ANDROID_RUNTIME_SESSION'},
              F2:{state:runtime?'PASS_REUSED_EXACT_RUNTIME_SESSION':'FAIL',authority:'EXACT_ANDROID_RUNTIME_SESSION'},
              F3:{state:runtime?'PASS_REUSED_EXACT_RUNTIME_SESSION':'FAIL',authority:'EXACT_ANDROID_RUNTIME_SESSION'},
              F4:{state:runtime?'PASS_REUSED_EXACT_RUNTIME_SESSION':'FAIL',authority:'EXACT_ANDROID_RUNTIME_SESSION'},
              F5:{state:qa?'PASS':'FAIL',authority:'INDEPENDENT_ANDROID_QA_TOUCH_INPUT_SCREEN_RUNTIME'},
              F6:{state:qa?'PASS':'FAIL',authority:'INDEPENDENT_ANDROID_QA_AND_EXACT_RUNTIME_STATE_EVIDENCE'},
              F7:{state:multiplayerRequired?(multiplayerPass?'PASS':'FAIL'):'NOT_APPLICABLE',authority:multiplayerRequired?'UNITY_MULTIPLAYER_QA_EVIDENCE':'VERIFIED_DESIGN_SINGLE_PLAYER',participantCount:Number(mp.participantCount||0),authoritativeSync:mp.authoritativeSync===true},
              F8:{state:runtime&&qa?'PASS':'FAIL',authority:'EXACT_RUNTIME_PLUS_INDEPENDENT_QA'},
              F9:{state:build&&runtime&&qa&&multiplayerPass&&regression&&exactBinding?'PASS':'FAIL',authority:'EXACT_ARTIFACT_REGRESSION_FAN_IN'}
            },
            multiplayerRequired,
            verifiedAt:stamp
          };
          const internalReady=f0ToF9.floors.F9.state==='PASS';
          const evidence={version:3,platform:'UNITY',sourceRevision:process.env.SOURCE_REVISION||null,sourceRootTreeSha:process.env.SOURCE_TREE_SHA||null,sourceFingerprint:process.env.SOURCE_FINGERPRINT||null,buildOrPackagePassed:build,artifactIdentity,runtimePassed:runtime,independentQaPassed:qa,multiplayerPassed:multiplayerPass,regressionPassed:regression,f0ToF9Passed:internalReady,exactRevision:exactBinding,lastSuccessfulStage:last,failureStage:failure,failureSignature:failure?failureSignature({stage:failure,code:'STAGE_NOT_PASSED',message:`${process.env.GAME_ID}:${failure}`}):null};
          const row={
            gameId:process.env.GAME_ID,status:'ACTIVE',selectedPlatform:'UNITY',targetPlatform:'UNITY',
            currentStep:internalReady?'INTERNAL_PLATFORM_PLAYTEST_AND_DEBUG':'TARGET_PLATFORM_TECHNICAL_VALIDATION',
            canonicalState:internalReady?'INTERNAL_PLATFORM_PLAYTEST_AND_DEBUG':canonical,
            platformAdapter:'tools/company-development-unity-platform.mjs',
            unityProjectPath:process.env.PROJECT,unityCandidateBranch:process.env.BRANCH||null,unitySourceCommit:process.env.SOURCE_REVISION||null,
            unityBuildRunId:buildRun,unityRuntimeSmokeRunId:runtimeRun,unityIndependentQaRunId:qaRun,unityRegressionRunId:regressionRun,
            unityF0ThroughF9Evidence:f0ToF9,
            unityF9ReleaseRegressionPassed:internalReady,
            unityF9ReleaseRegressionPassedAt:internalReady?stamp:null,
            unityCanonicalPublishPending:internalReady,
            unityInternalReleaseReady:internalReady,
            unityInternalReleaseAt:internalReady?stamp:null,
            unityInternalReleaseEvidence:internalReady?{
              version:2,platform:'UNITY',sourceRevision:process.env.SOURCE_REVISION,sourceRootTreeSha:process.env.SOURCE_TREE_SHA,artifactIdentity,
              buildRunId:buildRun,runtimeRunId:runtimeRun,independentQaRunId:qaRun,regressionRunId:regressionRun,
              distribution:'INTERNAL_OR_CLOSED_APP_TEST_BUILD',artifactInternalTestingAllowed:true,publicRelease:false,
              f0ThroughF9Passed:true,f9ReleaseRegressionPassed:true,
              authority:'unity-exact-apk-runtime-qa-regression'
            }:null,
            executionEvidence:evidence,resumeStage:failure||(internalReady?'INTERNAL_PLATFORM_PLAYTEST_AND_DEBUG':'IMMEDIATE_NEXT_STAGE_DISPATCH'),
            failureCount:failure?1:0,contractCanaryPassed:String(process.env.IS_CANARY).toLowerCase()==='true'&&regression,updatedAt:stamp
          };
          fs.writeFileSync(`runtime-persist/queue/${process.env.GAME_ID}.json`,JSON.stringify(row,null,2)+'\n');
          fs.writeFileSync(`runtime-persist/queue/${process.env.GAME_ID}.evidence.json`,JSON.stringify(evidence,null,2)+'\n');
          console.log(`CHECKPOINT_LAST_SUCCESS=${last}`);console.log(`CHECKPOINT_FAILURE_STAGE=${failure||'NONE'}`);console.log(`UNITY_INTERNAL_RELEASE_READY=${internalReady?'YES':'NO'}`);console.log(`UNITY_PLATFORM_F0_TO_F9_VERIFIED=${internalReady?'YES':'NO'}`);console.log('UNITY_PUBLIC_RELEASE_MUTATION=NO');
          NODE

      - name: Upload checkpoint for company-runtime persistence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-unity-runtime-${{ matrix.item.gameId }}-${{ github.run_id }}
          path: runtime-persist/
          retention-days: 14
          if-no-files-found: error

      - name: Persist this game's checkpoint immediately
        id: persist_game
        if: always() && steps.checkpoint.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_ID: ${{ matrix.item.gameId }}
        shell: bash
        run: |
          set -euo pipefail
          row="runtime-persist/queue/$GAME_ID.json"
          test -s "$row"
          passed="$(node -e "const r=require('./'+process.argv[1]);process.stdout.write(String(!r.executionEvidence?.failureStage))" "$row")"
          state_dir="/tmp/company-runtime-$GAME_ID"
          git config user.name 'jaewoon-development-unity-runtime'
          git config user.email 'actions@users.noreply.github.com'
          persisted=0
          for attempt in 1 2 3 4 5; do
            echo "UNITY_RUNTIME_GAME_PERSIST_OPTIMISTIC_ATTEMPT=$GAME_ID:$attempt/5"
            git worktree remove "$state_dir" --force >/dev/null 2>&1 || true
            git worktree prune
            git fetch --no-tags --depth=1 origin company-runtime main
            git worktree add --force --detach "$state_dir" origin/company-runtime >/dev/null
            mkdir -p "$state_dir/design"
            if [[ -d runtime-persist/design ]]; then cp -R runtime-persist/design/. "$state_dir/design/"; fi
            STATE_DIR="$state_dir" ROW_PATH="$PWD/$row" node <<'NODE'
          const fs=require('fs'),path=require('path');
          const root=process.env.STATE_DIR;
          const queuePath=path.join(root,'development-queue.json');
          const queue=JSON.parse(fs.readFileSync(queuePath,'utf8'));
          const update=JSON.parse(fs.readFileSync(process.env.ROW_PATH,'utf8'));
          const item=(queue.items||[]).find(x=>x.gameId===update.gameId);
          if(!item)throw new Error('queue item missing: '+update.gameId);
          const mergedUpdate={...update};
          const concurrent=Array.isArray(item.concurrentTargetPlatforms)
            &&item.concurrentTargetPlatforms.includes('ROBLOX')
            &&item.concurrentTargetPlatforms.includes('UNITY');
          const exactRobloxBuild=item.robloxBuildOrPackagePassed===true
            &&item.robloxBuildPreflightPassed===true
            &&item.robloxFoundationF0Passed===true
            &&String(item.robloxBuildSourceRevision||'')===String(item.robloxSourceCommit||'')
            &&/^sha256:[a-f0-9]{64}$/i.test(String(item.robloxBuildArtifactIdentity||''));
          const exactCandidate=item.robloxRuntimeCandidateEvidence||{};
          const exactRobloxCandidate=exactCandidate.published===true
            &&String(exactCandidate.sourceRevision||'')===String(item.robloxSourceCommit||'')
            &&String(exactCandidate.artifactIdentity||'')===String(item.robloxBuildArtifactIdentity||'')
            &&Number(exactCandidate.versionNumber)>0;
          const robloxInternal=item.robloxInternalReleaseReady===true
            ||item.robloxInternalReleasePublished===true
            ||item.robloxInternalReleaseEvidence?.published===true;
          const robloxRepairRequired=
            String(item.canonicalState||'').toUpperCase()==='TARGET_PLATFORM_REPAIR_REQUIRED'
            &&Boolean(String(item.robloxFailureStage||'').trim());
          if(concurrent&&update.unityInternalReleaseReady!==true){
            if(robloxInternal){
              mergedUpdate.currentStep='INTERNAL_PLATFORM_PLAYTEST_AND_DEBUG';
              mergedUpdate.canonicalState='INTERNAL_PLATFORM_PLAYTEST_AND_DEBUG';
              console.log('UNITY_SHARED_PROGRESS_PRESERVED_FROM_ROBLOX='+update.gameId+':INTERNAL_PLATFORM_PLAYTEST_AND_DEBUG');
            }else if(exactRobloxCandidate){
              mergedUpdate.currentStep='TARGET_PLATFORM_RUNTIME_FOUNDATION';
              mergedUpdate.canonicalState='PRIVATE_RUNTIME_CANDIDATE_DEPLOYED';
              console.log('UNITY_SHARED_PROGRESS_PRESERVED_FROM_ROBLOX='+update.gameId+':TARGET_PLATFORM_RUNTIME_FOUNDATION');
            }else if(exactRobloxBuild){
              mergedUpdate.currentStep='PRIVATE_RUNTIME_CANDIDATE_DEPLOY';
              mergedUpdate.canonicalState='F0_SOURCE_PREFLIGHT_PASSED';
              console.log('UNITY_SHARED_PROGRESS_PRESERVED_FROM_ROBLOX='+update.gameId+':PRIVATE_RUNTIME_CANDIDATE_DEPLOY');
            }else if(robloxRepairRequired){
              mergedUpdate.currentStep=String(item.currentStep||'TARGET_PLATFORM_TECHNICAL_VALIDATION');
              mergedUpdate.canonicalState='TARGET_PLATFORM_REPAIR_REQUIRED';
              console.log('UNITY_SHARED_REPAIR_PRESERVED_FROM_ROBLOX='+update.gameId+':'+mergedUpdate.currentStep);
            }
          }
          Object.assign(item,mergedUpdate);
          if(update.contractCanaryPassed)queue.executionContractVersion=1;
          queue.executionContract='CHANGE_DETECTION>CHEAP_PRECHECK>REPRESENTATIVE_CANARY>SINGLE_BUILD_OR_PACKAGE>IMMUTABLE_ARTIFACT_BIND>TARGET_PLATFORM_RUNTIME>INDEPENDENT_QA>REGRESSION>IMMEDIATE_NEXT_STAGE_DISPATCH>RESUME_EXACT_FAILURE_POINT';
          queue.developmentGameWipMax=null;
          queue.updatedAt=new Date().toISOString();
          fs.writeFileSync(queuePath,JSON.stringify(queue,null,2)+'\n');
          console.log('DEVELOPMENT_UNITY_GAME_PERSIST='+update.gameId);
          NODE
            git -C "$state_dir" checkout origin/main -- tools/company-homepage-platform-exposure-sync.mjs
            (
              cd "$state_dir"
              node tools/company-homepage-platform-exposure-sync.mjs development-queue.json game-catalog.json homepage-platform-exposure.json
              git reset -- tools/company-homepage-platform-exposure-sync.mjs >/dev/null 2>&1 || true
              git add design development-queue.json homepage-platform-exposure.json
              git diff --cached --check
              if git diff --cached --quiet; then
                echo "UNITY_RUNTIME_GAME_PERSIST_WRITE=NO_CHANGE:$GAME_ID"
                exit 10
              fi
              git commit -m "runtime: persist Unity checkpoint $GAME_ID [skip ci]"
            ) && commit_state=0 || commit_state=$?
            if [[ "$commit_state" == 10 ]]; then
              persisted=1
              git worktree remove "$state_dir" --force >/dev/null 2>&1 || true
              break
            fi
            if [[ "$commit_state" != 0 ]]; then
              git worktree remove "$state_dir" --force >/dev/null 2>&1 || true
              exit "$commit_state"
            fi
            if git -C "$state_dir" push origin HEAD:company-runtime; then
              persisted=1
              echo "UNITY_RUNTIME_GAME_PERSIST_WRITE=PUSHED:$GAME_ID"
              git worktree remove "$state_dir" --force >/dev/null 2>&1 || true
              break
            fi
            echo "UNITY_RUNTIME_GAME_PERSIST_CONFLICT_RETRY=$GAME_ID:$attempt"
            git worktree remove "$state_dir" --force >/dev/null 2>&1 || true
            sleep $((attempt*2))
          done
          test "$persisted" = '1'
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
          echo "COMPANY_RUNTIME_UNITY_GAME_PERSIST=PASS:$GAME_ID"

      - name: Publish exact F9 Unity APK to canonical internal release target
        id: f9_publish
        if: always() && steps.persist_game.outcome == 'success' && steps.persist_game.outputs.passed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_ID: ${{ matrix.item.gameId }}
          SOURCE_REVISION: ${{ steps.source.outputs.source_revision }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.identity }}
          BUILD_RUN_ID: ${{ steps.buildref.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ARTIFACT_ID" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          apk="$(find /tmp/unity-build -type f -name '*.apk' -size +0c | head -n1)"
          info="$(find /tmp/unity-build -type f -name build-info.json -size +0c | head -n1)"
          test -n "$apk" -a -n "$info"
          expected="${ARTIFACT_ID#sha256:}"
          actual="$(sha256sum "$apk" | awk '{print $1}')"
          [ "$actual" = "$expected" ] || { echo "UNITY_F9_CANONICAL_ARTIFACT_MISMATCH=$GAME_ID" >&2; exit 21; }
          info_source="$(node -e "const b=require(process.argv[1]);process.stdout.write(String(b.sourceCommit||''))" "$info")"
          [ "$info_source" = "$SOURCE_REVISION" ] || { echo "UNITY_F9_CANONICAL_SOURCE_MISMATCH=$GAME_ID" >&2; exit 22; }

          release_dir="/tmp/unity-f9-release-$GAME_ID"
          rm -rf "$release_dir"
          mkdir -p "$release_dir"
          cp "$apk" "$release_dir/$GAME_ID.apk"
          cp "$info" "$release_dir/build-info.json"
          printf '%s  %s\n' "$actual" "$GAME_ID.apk" > "$release_dir/$GAME_ID.apk.sha256"
          for pair in "runtime:/tmp/unity-runtime" "independent:/tmp/unity-independent" "regression:/tmp/unity-regression"; do
            label="${pair%%:*}"
            dir="${pair#*:}"
            evidence="$(find "$dir" -type f -name evidence.json -size +0c 2>/dev/null | head -n1 || true)"
            [ -n "$evidence" ] && cp "$evidence" "$release_dir/$label-evidence.json"
          done

          tag="unity-f9-$GAME_ID-${SOURCE_REVISION:0:12}-$BUILD_RUN_ID"
          published=0
          for publish_attempt in 1 2 3; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              if gh release upload "$tag" "$release_dir"/* --repo "$GITHUB_REPOSITORY" --clobber; then published=1; break; fi
            else
              if gh release create "$tag" "$release_dir"/* --repo "$GITHUB_REPOSITORY" --target "$SOURCE_REVISION" --title "$GAME_ID Unity F9 verified build" --notes "Exact F9-verified Unity build. Source: $SOURCE_REVISION. Artifact: $ARTIFACT_ID." --prerelease; then published=1; break; fi
            fi
            echo "UNITY_F9_CANONICAL_PUBLISH_RETRY=$GAME_ID:$publish_attempt" >&2
            sleep "$publish_attempt"
          done
          [ "$published" = 1 ] || { echo "UNITY_F9_CANONICAL_PUBLISH_REPAIR_REQUIRED=$GAME_ID:$tag" >&2; exit 23; }
          release_url="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_url=$release_url" >> "$GITHUB_OUTPUT"
          echo "UNITY_F9_CANONICAL_RELEASE=$GAME_ID:$tag"
          echo "UNITY_F9_CANONICAL_SOURCE_ARTIFACT_MATCH=YES"

      - name: Record Unity F9 publication dispatch without gating next cycle
        if: always() && steps.persist_game.outcome == 'success' && steps.persist_game.outputs.passed == 'true'
        env:
          GAME_ID: ${{ matrix.item.gameId }}
          PUBLISH_OUTCOME: ${{ steps.f9_publish.outcome }}
          RELEASE_TAG: ${{ steps.f9_publish.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          echo "UNITY_F9_VERIFIED=$GAME_ID"
          echo "PLATFORM_F9_VERIFIED=UNITY:$GAME_ID"
          echo "UNITY_F9_CANONICAL_PUBLISH_DISPATCHED=$GAME_ID"
          echo "PLATFORM_PUBLISH_OR_DEPLOY_DISPATCHED=UNITY:$GAME_ID"
          echo "UNITY_F9_CANONICAL_PUBLISH_OUTCOME=${PUBLISH_OUTCOME:-unknown}"
          echo "UNITY_F9_DEPLOYED_INTERNAL_OR_CLOSED_BUILD=$GAME_ID:${PUBLISH_OUTCOME:-unknown}:${RELEASE_TAG:-NONE}"
          if [ "${PUBLISH_OUTCOME:-}" != success ]; then
            echo "UNITY_F9_PUBLICATION_REPAIR_REQUIRED=$GAME_ID"
          fi
          echo 'UNITY_F9_CANONICAL_PUBLISH_BLOCKS_NEXT_CYCLE=NO'
          echo 'UNITY_PUBLICATION_OUTCOME_BLOCKS_EVOLUTION=NO'

      - name: Persist Unity F9 publication outcome without gating evolution
        if: always() && steps.persist_game.outcome == 'success' && steps.persist_game.outputs.passed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_ID: ${{ matrix.item.gameId }}
          SOURCE_REVISION: ${{ steps.source.outputs.source_revision }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.identity }}
          BUILD_RUN_ID: ${{ steps.buildref.outputs.run_id }}
          RUNTIME_RUN_ID: ${{ steps.runtime.outputs.run_id || matrix.item.unityRuntimeSmokeRunId }}
          QA_RUN_ID: ${{ steps.independent.outputs.run_id || matrix.item.unityIndependentQaRunId }}
          REGRESSION_RUN_ID: ${{ steps.regression.outputs.run_id || matrix.item.unityRegressionRunId }}
          PUBLISH_OUTCOME: ${{ steps.f9_publish.outcome }}
          RELEASE_TAG: ${{ steps.f9_publish.outputs.release_tag }}
          RELEASE_URL: ${{ steps.f9_publish.outputs.release_url }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/unity-publication-state
          git clone --filter=blob:none --branch company-runtime --single-branch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/unity-publication-state >/dev/null 2>&1
          git -C /tmp/unity-publication-state config user.name 'jaewoon-unity-publication'
          git -C /tmp/unity-publication-state config user.email 'actions@users.noreply.github.com'
          persisted=0
          for attempt in 1 2 3 4 5; do
            git -C /tmp/unity-publication-state fetch origin company-runtime --quiet
            git -C /tmp/unity-publication-state reset --hard origin/company-runtime >/dev/null
            (
              cd /tmp/unity-publication-state
              node <<'NODE'
          const fs=require('fs');
          const q=JSON.parse(fs.readFileSync('development-queue.json','utf8'));
          const item=(q.items||[]).find(row=>row.gameId===process.env.GAME_ID);
          if(!item)throw new Error('Unity publication state item missing');
          const exact=item.unityInternalReleaseEvidence||{};
          if(item.unityF9ReleaseRegressionPassed!==true||exact.f0ThroughF9Passed!==true||exact.f9ReleaseRegressionPassed!==true)throw new Error('Unity publication state requires exact F9 PASS');
          if(String(exact.sourceRevision||'')!==String(process.env.SOURCE_REVISION||'')||String(exact.artifactIdentity||'')!==String(process.env.ARTIFACT_ID||'')||String(exact.buildRunId||'')!==String(process.env.BUILD_RUN_ID||''))throw new Error('Unity publication state identity drift');
          const stamp=new Date().toISOString();
          const pass=String(process.env.PUBLISH_OUTCOME||'')==='success';
          const record={
            version:1,status:pass?'PUBLISHED':'RETRY_REQUIRED',
            sourceRevision:process.env.SOURCE_REVISION,
            artifactIdentity:process.env.ARTIFACT_ID,
            buildRunId:Number(process.env.BUILD_RUN_ID),
            runtimeRunId:Number(process.env.RUNTIME_RUN_ID||0)||null,
            independentQaRunId:Number(process.env.QA_RUN_ID||0)||null,
            regressionRunId:Number(process.env.REGRESSION_RUN_ID||0)||null,
            releaseTag:process.env.RELEASE_TAG||null,
            releaseUrl:process.env.RELEASE_URL||null,
            lastAttemptAt:stamp,
            workflowRunId:Number(process.env.GITHUB_RUN_ID||0)||null
          };
          item.unityCanonicalPublishPending=!pass;
          item.unityCanonicalPublishRepairRequired=!pass;
          item.unityCanonicalPublishRetry=record;
          if(pass){
            const evidence={...record,published:true,publishedAt:stamp,authority:'unity-f9-exact-canonical-internal-release'};
            const history=Array.isArray(item.unityCanonicalPublishHistory)?item.unityCanonicalPublishHistory:[];
            for(const completed of [item.unityCanonicalReleaseEvidence,evidence]){
              if(completed?.published===true&&!history.some(row=>row.sourceRevision===completed.sourceRevision&&row.artifactIdentity===completed.artifactIdentity))history.push(completed);
            }
            item.unityCanonicalPublishHistory=history;
            item.unityCanonicalReleaseEvidence=evidence;
          }
          item.updatedAt=stamp;q.updatedAt=stamp;
          fs.writeFileSync('development-queue.json',JSON.stringify(q,null,2)+'\n');
          NODE
              git add development-queue.json
              if git diff --cached --quiet; then exit 10; fi
              git commit -m "runtime: persist Unity publication outcome $GAME_ID [skip ci]"
            ) && commit_state=0 || commit_state=$?
            if [[ "$commit_state" == 10 ]]; then persisted=1; break; fi
            if [[ "$commit_state" != 0 ]]; then exit "$commit_state"; fi
            if git -C /tmp/unity-publication-state push origin HEAD:company-runtime; then persisted=1; break; fi
            sleep $((attempt*2))
          done
          test "$persisted" = 1
          echo "UNITY_F9_PUBLICATION_STATE_PERSISTED=$GAME_ID:${PUBLISH_OUTCOME:-unknown}"
          echo 'UNITY_PUBLICATION_OUTCOME_BLOCKS_EVOLUTION=NO'

      - name: Dispatch exact Unity F9 publication repair in parallel
        if: always() && steps.persist_game.outcome == 'success' && steps.persist_game.outputs.passed == 'true' && steps.f9_publish.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_ID: ${{ matrix.item.gameId }}
          SOURCE_REVISION: ${{ steps.source.outputs.source_revision }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.identity }}
          BUILD_RUN_ID: ${{ steps.buildref.outputs.run_id }}
          RUNTIME_RUN_ID: ${{ steps.runtime.outputs.run_id || matrix.item.unityRuntimeSmokeRunId }}
          QA_RUN_ID: ${{ steps.independent.outputs.run_id || matrix.item.unityIndependentQaRunId }}
          REGRESSION_RUN_ID: ${{ steps.regression.outputs.run_id || matrix.item.unityRegressionRunId }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run company-development-unity-runtime.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f game_id="$GAME_ID" \
            -f publication_retry_only=true \
            -f publication_retry_source_revision="$SOURCE_REVISION" \
            -f publication_retry_artifact_identity="$ARTIFACT_ID" \
            -f publication_retry_build_run_id="$BUILD_RUN_ID" \
            -f publication_retry_runtime_run_id="$RUNTIME_RUN_ID" \
            -f publication_retry_qa_run_id="$QA_RUN_ID" \
            -f publication_retry_regression_run_id="$REGRESSION_RUN_ID"
          echo "UNITY_F9_PUBLICATION_AUTOMATIC_REDISPATCH=YES:$GAME_ID:$BUILD_RUN_ID"
          echo 'UNITY_PUBLICATION_RETRY_BLOCKS_NEXT_EVOLUTION=NO'

      - name: Refill Unity repair loop after any failed F0-F9 floor
        if: always() && steps.persist_game.outcome == 'success' && steps.persist_game.outputs.passed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_ID: ${{ matrix.item.gameId }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg run "${GITHUB_RUN_ID:-}" --arg attempt "${GITHUB_RUN_ATTEMPT:-}" --arg game "${GAME_ID:-}" '{event_type:"vibe2-fanin-refill",client_payload:{source_run:$run,source_attempt:$attempt,source_task:$game,source_outcome:"REPAIR_REQUIRED",reason:"unity-f0-f9-floor-repair"}}')"
          curl --fail-with-body --silent --show-error --request POST             --header 'Accept: application/vnd.github+json'             --header "Authorization: Bearer $GH_TOKEN"             --header 'X-GitHub-Api-Version: 2022-11-28'             "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" --data "$payload"
          echo "UNITY_F0_F9_REPAIR_REFILL_DISPATCHED=$GAME_ID"

      - name: Immediately continue this successful Unity game
        if: always() && steps.persist_game.outcome == 'success' && steps.persist_game.outputs.passed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_ID: ${{ matrix.item.gameId }}
        run: |
          gh workflow run company-development-confirmed-runtime.yml --repo "$GITHUB_REPOSITORY" --ref main -f game_id="$GAME_ID"
          echo "IMMEDIATE_NEXT_STAGE_DISPATCH=YES:$GAME_ID"
          echo "UNITY_NEXT_EVOLUTION_CYCLE_DEPENDS_ON_PUBLICATION_OUTCOME=NO"

      - name: Settle exact Vibe Unity BUILD_UP task after runtime QA and regression
        if: always() && steps.persist_game.outcome == 'success' && steps.persist_game.outputs.passed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_ID: ${{ matrix.item.gameId }}
          PROJECT: ${{ steps.context.outputs.project }}
          SOURCE_REVISION: ${{ steps.source.outputs.source_revision }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.identity }}
          BUILD_RUN_ID: ${{ steps.buildref.outputs.run_id }}
          RUNTIME_RUN_ID: ${{ steps.runtime.outputs.run_id || matrix.item.unityRuntimeSmokeRunId }}
          QA_RUN_ID: ${{ steps.independent.outputs.run_id || matrix.item.unityIndependentQaRunId }}
          REGRESSION_RUN_ID: ${{ steps.regression.outputs.run_id || matrix.item.unityRegressionRunId }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${SOURCE_REVISION}^{commit}" 2>/dev/null || git fetch --no-tags origin "$SOURCE_REVISION"
          runtime_source_tree_sha="$(git rev-parse "$SOURCE_REVISION:$PROJECT")"
          [[ "$runtime_source_tree_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "UNITY_BUILD_UP_RUNTIME_SOURCE_TREE_SHA=$GAME_ID:$runtime_source_tree_sha"
          rm -rf /tmp/vibe2-unity-runtime-control
          git clone --branch vibe2-unreal-core --single-branch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/vibe2-unity-runtime-control >/dev/null 2>&1
          git -C /tmp/vibe2-unity-runtime-control config user.name 'jaewoon-unity-runtime-fanin'
          git -C /tmp/vibe2-unity-runtime-control config user.email 'actions@users.noreply.github.com'
          pushed=0
          settled_count=0
          for attempt in 1 2 3; do
            attempt_settled=0
            git -C /tmp/vibe2-unity-runtime-control fetch origin vibe2-unreal-core --quiet
            git -C /tmp/vibe2-unity-runtime-control reset --hard origin/vibe2-unreal-core >/dev/null
            mapfile -t task_ids < <(GAME_ID="$GAME_ID" RUNTIME_SOURCE_TREE_SHA="$runtime_source_tree_sha" node --input-type=module <<'NODE'
            import fs from 'node:fs';
            const q=JSON.parse(fs.readFileSync('/tmp/vibe2-unity-runtime-control/.vibe2/queue.json','utf8'));
            const game=String(process.env.GAME_ID||'').trim();
            const sourceTree=String(process.env.RUNTIME_SOURCE_TREE_SHA||'').trim();
            const exactTreeMarker='unity-runtime-await-source-tree:'+sourceTree;
            for(const task of q.tasks||[]){
              const evidence=(task.evidence||[]).map(String);
              if(task.gameId!==game)continue;
              if(String(task.target||'').toLowerCase()!=='unity')continue;
              if(String(task.status||'').toLowerCase()!=='blocked'&&String(task.status||'').toLowerCase()!=='running')continue;
              if(String(task.blocker||'')!=='candidate-awaiting-unity-runtime-qa')continue;
              if(!evidence.includes('unity-runtime-await-game:'+game))continue;
              if(!evidence.includes(exactTreeMarker))continue;
              process.stdout.write(String(task.id)+'\n');
            }
            NODE
            )
            for task_id in "${task_ids[@]}"; do
              (
                cd /tmp/vibe2-unity-runtime-control
                node "$GITHUB_WORKSPACE/tools/vibe2-queue-control.mjs" pass --id="$task_id" --evidence="unity-f0-f9-verified,unity-f9-pass,unity-f9-nonterminal,unity-publication-outcome-blocks-evolution:NO,unity-runtime-pass,unity-independent-qa-pass,unity-regression-pass,unity-runtime-source-revision:${SOURCE_REVISION},unity-runtime-source-tree:${runtime_source_tree_sha},unity-artifact:${ARTIFACT_ID},unity-build-run:${BUILD_RUN_ID},unity-runtime-run:${RUNTIME_RUN_ID},unity-independent-qa-run:${QA_RUN_ID},unity-regression-run:${REGRESSION_RUN_ID},verification-conclusion:success,actions-run:${GITHUB_RUN_ID}"
              )
              echo "UNITY_BUILD_UP_VIBE_TASK_PASS=${GAME_ID}:${task_id}:source_tree=${runtime_source_tree_sha}"
              attempt_settled=$((attempt_settled+1))
            done
            git -C /tmp/vibe2-unity-runtime-control add .vibe2/queue.json
            if git -C /tmp/vibe2-unity-runtime-control diff --cached --quiet; then
              pushed=1
              settled_count=$attempt_settled
              break
            fi
            git -C /tmp/vibe2-unity-runtime-control commit -m "vibe2: settle Unity tasks after exact runtime QA [skip ci]"
            if git -C /tmp/vibe2-unity-runtime-control push origin HEAD:vibe2-unreal-core; then
              pushed=1
              settled_count=$attempt_settled
              break
            fi
            sleep $((attempt*2))
          done
          test "$pushed" = 1
          echo "UNITY_BUILD_UP_VIBE_SETTLED_COUNT=$settled_count"
          payload="$(jq -nc --arg run "${GITHUB_RUN_ID:-}" --arg attempt "${GITHUB_RUN_ATTEMPT:-}" --arg game "${GAME_ID:-}" '{event_type:"vibe2-fanin-refill",client_payload:{source_run:$run,source_attempt:$attempt,source_task:$game,source_outcome:"VERIFIED",reason:"unity-verified-cycle-complete-next-cycle"}}')"
          curl --fail-with-body --silent --show-error --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" --data "$payload"
          echo "UNITY_NEXT_EVOLUTION_CYCLE_DISPATCHED=$GAME_ID"
          echo "PLATFORM_NEXT_EVOLUTION_CYCLE_DISPATCHED=UNITY:$GAME_ID"
          echo 'UNITY_NEXT_EVOLUTION_CYCLE_DEPENDS_ON_PUBLICATION_OUTCOME=NO'
          echo "UNITY_BUILD_UP_VIBE_REFILL_DISPATCHED=$settled_count"
      - name: Unity runtime summary
        if: always()
        run: |
          echo 'DEVELOPMENT_GAME_ELIGIBILITY_CAP=NONE'
          echo 'DEVELOPMENT_GAME_ELIGIBILITY_SCOPE=UNBOUNDED_CAPACITY_BATCHED'
          echo 'UNITY_WEB_PREDEVELOPMENT_FLOOR=UPPER_PLATFORM_DEVELOPMENT_READY_REQUIRED_FOR_NEW_NATIVE_ENTRY'
          echo 'UNITY_WEB_FLOOR_OWNER=unity-web-first-stage-build.yml'
          echo 'UNITY_WEB_CANONICAL_SOURCE=SAME_UNITY_PROJECT'
          echo 'CHANGE_DETECTION=ENABLED'
          echo 'CHEAP_PRECHECK=ENABLED'
          echo 'REPRESENTATIVE_CANARY=ENABLED'
          echo 'BUILD_ONCE_PER_SOURCE_FINGERPRINT=ENABLED'
          echo 'IMMUTABLE_ARTIFACT_REUSE=ENABLED'
          echo 'RUNTIME_THEN_INDEPENDENT_QA_THEN_REGRESSION=ENABLED'
          echo 'PER_GAME_CHECKPOINT_PERSIST=IMMEDIATE_OPTIMISTIC_RETRY'
          echo 'COHORT_PERSIST_FAN_IN=DISABLED'
          echo 'RESUME_EXACT_FAILURE_POINT=ENABLED'
          echo 'QUALITY_GATE_WEAKENING=NO'
          echo 'PUBLIC_MAIN_SOURCE_WRITE=NO'

      - name: Enforce stage result after checkpoint is safely captured
        if: always()
        env:
          BUILD_PASS: ${{ steps.buildstate.outputs.build_passed }}
          RUNTIME_PASS: ${{ steps.runtimestate.outputs.passed }}
          QA_PASS: ${{ steps.independentstate.outputs.passed }}
          REGRESSION_PASS: ${{ steps.regressionstate.outputs.passed }}
        run: |
          [[ "$BUILD_PASS" == true ]] || { echo 'FAILED_STAGE=SINGLE_BUILD_OR_PACKAGE' >&2; exit 21; }
          [[ "$RUNTIME_PASS" == true ]] || { echo 'FAILED_STAGE=TARGET_PLATFORM_RUNTIME' >&2; exit 22; }
          [[ "$QA_PASS" == true ]] || { echo 'FAILED_STAGE=INDEPENDENT_QA' >&2; exit 23; }
          [[ "$REGRESSION_PASS" == true ]] || { echo 'FAILED_STAGE=REGRESSION' >&2; exit 24; }
          echo 'UNITY_SPEED_SEQUENCE=PASS'

