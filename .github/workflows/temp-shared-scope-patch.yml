name: Temporary Shared Scope Patch

on:
  push:
    branches:
      - fix/shared-engine-approved-scopes
    paths:
      - '.github/workflows/temp-shared-scope-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/shared-engine-approved-scopes
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply shared engine scope repair
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/temp-adjust-shared-scope-helper.py
          python3 tools/temp-shared-scope-patch.py
          node --check tools/company-development-web-bootstrap.mjs
          node --check web-games/_shared/vibe2-final.js
          node --test qa/company-development-web-runtime.test.mjs
          git diff --check
          git diff --stat
      - name: Commit canonical repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-runtime-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tools/company-development-web-bootstrap.mjs web-games/_shared/vibe2-final.js qa/company-development-web-runtime.test.mjs
          git diff --cached --quiet && { echo 'no canonical diff' >&2; exit 1; }
          git commit -m 'fix(web): bind all approved scopes in shared engine'
          git push origin HEAD:fix/shared-engine-approved-scopes
# rerun: semantic scope mapping
