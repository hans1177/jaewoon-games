name: Public Game Health

on:
  workflow_dispatch:
    inputs:
      released_game_id:
        description: 'Optional exact game slug just promoted to public main'
        required: false
        type: string
      release_task_id:
        description: 'Optional release/candidate task id for verified learning evidence'
        required: false
        type: string
      release_origin:
        description: 'Optional release origin; AUTONOMOUS_DEV_VERIFIED_HANDOFF closes the autonomous loop'
        required: false
        type: string
  schedule:
    - cron: '17 */12 * * *'
  push:
    branches: [main]
    paths:
      - public-health.request

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: public-game-health-main
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser test runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start local public site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/jaewoon-public-server.log 2>&1 &
          echo $! > /tmp/jaewoon-public-server.pid
          sleep 2
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null

      - name: Smoke-play every homepage web game
        env:
          PUBLIC_BASE_URL: http://127.0.0.1:4173
        run: node tools/public-game-health.mjs

      - name: Convert smoke-play results to company QA evidence
        run: |
          node tools/company-qa-public-web-evidence.mjs
          test -s company-qa-runtime-evidence.json
          echo 'COMPANY_QA_RUNTIME_EVIDENCE=PASS'

      - name: Check asset sources licenses and animation evidence
        continue-on-error: true
        run: node tools/asset-health-check.mjs

      - name: Select verified rollback baselines
        run: node tools/update-release-baselines.mjs

      - name: Check public homepage reachability
        continue-on-error: true
        run: curl --fail --location --retry 2 --max-time 20 https://jaewoon-games.pages.dev/ >/dev/null

      - name: Evaluate exact released game after public promotion
        id: release_health
        env:
          RELEASED_GAME_ID: ${{ github.event.inputs.released_game_id || '' }}
          RELEASE_TASK_ID: ${{ github.event.inputs.release_task_id || '' }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const game=String(process.env.RELEASED_GAME_ID||'').trim();
          const out=process.env.GITHUB_OUTPUT;
          const put=(k,v)=>fs.appendFileSync(out,`${k}=${String(v??'').replaceAll('\n',' ')}\n`);
          if(!game){put('tracked','false');put('result','NOT_APPLICABLE');put('revision_enqueued','false');process.exit(0);}
          const health=JSON.parse(fs.readFileSync('public-game-health.json','utf8'));
          const row=(health.games||[]).find(x=>String(x.gameId||'')===game);
          const threshold=Number(health.policy?.healthyAtLeast||75);
          const pass=Boolean(row&&String(row.status||'').toLowerCase()==='healthy'&&Number(row.score)>=threshold);
          const status=String(row?.status||'missing').toLowerCase(), score=Number(row?.score||0);
          let revisionEnqueued=false;
          if(!pass&&status==='critical'){
            const queue=JSON.parse(fs.readFileSync('artbook-revision-queue.json','utf8'));
            const safeTask=String(process.env.RELEASE_TASK_ID||process.env.GITHUB_RUN_ID||'release').replace(/[^A-Za-z0-9._-]+/g,'-').slice(0,80);
            const id=`release-health-${game}-${safeTask}`;
            if(!(queue.tasks||[]).some(x=>x.id===id)){
              const p=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
              const get=t=>p.find(x=>x.type===t)?.value||'';const dueDate=`${get('year')}-${get('month')}-${get('day')}`;
              queue.tasks=Array.isArray(queue.tasks)?queue.tasks:[];
              queue.tasks.push({id,type:'ARTBOOK_REVISION_REQUEST',gameId:game,status:'SCHEDULED',dueDate,requestedAt:new Date().toISOString(),trigger:'IMPLEMENTATION_DRIFT',reason:`Post-release public health became critical: ${row?.healthReason||'unknown'}`,evidence:[`public-game-health:${game}:${status}:${score}`,`release-task:${process.env.RELEASE_TASK_ID||'unknown'}`],selectedDepartments:['planning','graphics','development','qa','balance']});
              queue.updatedAt=new Date().toISOString();
              fs.writeFileSync('artbook-revision-queue.json',JSON.stringify(queue,null,2)+'\n');
              revisionEnqueued=true;
            }
          }
          fs.writeFileSync('/tmp/released-game-health.json',JSON.stringify({gameId:game,result:pass?'PASS':'FAIL',status,score,threshold,healthReason:row?.healthReason||null,issues:row?.issues||[],releaseTaskId:process.env.RELEASE_TASK_ID||null,checkedAt:new Date().toISOString()},null,2)+'\n');
          put('tracked','true');put('result',pass?'PASS':'FAIL');put('status',status);put('score',score);put('revision_enqueued',revisionEnqueued?'true':'false');
          console.log(`RELEASED_GAME_HEALTH=${game}:${pass?'PASS':'FAIL'}:${status}:${score}`);
          NODE

      - name: Record verified post-release Vibe learning evidence
        if: steps.release_health.outputs.tracked == 'true'
        env:
          RELEASED_GAME_ID: ${{ github.event.inputs.released_game_id }}
          RELEASE_TASK_ID: ${{ github.event.inputs.release_task_id }}
          RELEASE_RESULT: ${{ steps.release_health.outputs.result }}
          RELEASE_STATUS: ${{ steps.release_health.outputs.status }}
          RELEASE_SCORE: ${{ steps.release_health.outputs.score }}
        shell: bash
        run: |
          set -euo pipefail
          safe_game="$(printf '%s' "$RELEASED_GAME_ID" | tr -cs 'A-Za-z0-9._-' '-')"
          mkdir -p company-learning/evidence
          node tools/evolution-evidence-recorder.mjs \
            --output="company-learning/evidence/post-release-${safe_game}-${GITHUB_RUN_ID}.json" \
            --id="vibe2-post-release-${safe_game}-${GITHUB_RUN_ID}" \
            --type=VIBE2 \
            --pattern-id=public-release-health-verified \
            --title="Public release health verified outcome" \
            --game-id="$RELEASED_GAME_ID" \
            --condition=POST_RELEASE_PUBLIC_HEALTH \
            --outcome="$([ "$RELEASE_RESULT" = PASS ] && echo SUCCESS || echo FAILURE)" \
            --delta=0 \
            --source-revision="$GITHUB_SHA" \
            --independent-qa=PASS \
            --evidence="public-game-health.json,company-qa-runtime-evidence.json,release-task-${RELEASE_TASK_ID:-unknown},status-${RELEASE_STATUS},score-${RELEASE_SCORE}"
          echo "POST_RELEASE_LEARNING_EVIDENCE=$RELEASE_RESULT"

      - name: Upload health evidence
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: public-game-health-${{ github.run_id }}
          path: |
            qa-artifacts/public-game-health/
            public-game-health.json
            company-qa-runtime-evidence.json
            asset-health.json
            /tmp/released-game-health.json
          if-no-files-found: warn
          retention-days: 14

      - name: Persist health, learning evidence and revision request through merged PR
        id: persist_health
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "jaewoon-company-ai"
          git config user.email "actions@users.noreply.github.com"
          git add public-game-health.json public-release-baselines.json asset-health.json company-qa-runtime-evidence.json company-learning/bug-memory.json artbook-revision-queue.json
          if [ -d company-learning/evidence ]; then
            git add company-learning/evidence
          fi
          if git diff --cached --quiet; then
            echo "No health-state changes."
            echo 'merged=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "qa-health: record public game monitoring [skip ci]"
          git fetch origin main
          git rebase origin/main
          branch="automation/public-game-health-${GITHUB_RUN_ID}"
          git push origin "HEAD:$branch"
          pr_url="$(gh pr create --base main --head "$branch" --title "qa-health: record public game monitoring" --body "Verified public-health state from workflow run ${GITHUB_RUN_ID}. Follow-up automation must wait until this PR is merged.")"
          sleep 5
          gh pr checks "$pr_url" --watch --fail-fast
          git fetch origin main
          gh pr merge "$pr_url" --squash --delete-branch
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo 'Health persistence PR did not merge into main.' >&2
            exit 1
          }
          echo 'merged=true' >> "$GITHUB_OUTPUT"
          echo "PUBLIC_HEALTH_PERSIST_PR=$pr_url"

      - name: Close autonomous post-release loop only after merged health result
        if: github.event.inputs.release_origin == 'AUTONOMOUS_DEV_VERIFIED_HANDOFF' && steps.persist_health.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RESULT: ${{ steps.release_health.outputs.result }}
          REVISION_ENQUEUED: ${{ steps.release_health.outputs.revision_enqueued }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run company-dna-learning.yml --repo "$GITHUB_REPOSITORY" --ref main
          if [ "$RELEASE_RESULT" = PASS ] || [ "$REVISION_ENQUEUED" = true ]; then
            active="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow artbook-free-department-bots.yml --limit 10 --json status --jq '[.[]|select(.status=="in_progress" or .status=="queued" or .status=="pending")]|length')"
            if [ "$active" = 0 ]; then
              gh workflow run artbook-free-department-bots.yml --repo "$GITHUB_REPOSITORY" --ref main
              echo 'ARTBOOK_POST_RELEASE_DISPATCHED=YES'
            else
              echo 'ARTBOOK_POST_RELEASE_DISPATCHED=EXISTING_CHAIN_ACTIVE'
            fi
          fi
          gh workflow run autonomous-continuous-development.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "POST_RELEASE_NEXT_FLOOR=DISPATCHED"
          echo "POST_RELEASE_VIBE_LEARNING=DISPATCHED"
          [ "$RELEASE_RESULT" = PASS ]
