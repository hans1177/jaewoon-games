name: Candidate Central20 Stale Test Fix

on:
  push:
    branches:
      - fix/central-20-runtime-persist-v2-20260915

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[stale-test-fix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/central-20-runtime-persist-v2-20260915
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update only stale central-20 assertions
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          function replaceExact(file,from,to,expected=1){
            let text=fs.readFileSync(file,'utf8');
            const count=text.split(from).length-1;
            if(count!==expected)throw new Error(`${file}: expected ${expected} occurrences of ${from}, found ${count}`);
            fs.writeFileSync(file,text.split(from).join(to));
            console.log(`UPDATED=${file}:${from}->${to}`);
          }
          replaceExact('qa/company-development-web-runtime.test.mjs','assert.match(source,/max-parallel: 6/);','assert.match(source,/max-parallel: 20/);');
          replaceExact('qa/company-game-seed-flow.test.mjs','assert.match(flow,/concurrentGameWipMax: 6/);','assert.match(flow,/concurrentGameWipMax: 20/);');
          replaceExact('qa/company-game-seed-flow.test.mjs','assert.equal(directive.productionThroughput.concurrentGameWipMax,6);','assert.equal(directive.productionThroughput.concurrentGameWipMax,20);');
          NODE
      - name: Verify affected contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test qa/company-development-web-runtime.test.mjs
          node --test qa/company-game-seed-flow.test.mjs
          node --test qa/company-central-policy-contract.test.mjs qa/company-speed-sequence-workflow.test.mjs qa/company-selected-platform-router.test.mjs
      - name: Commit test-contract sync and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-candidate-sync'
          git config user.email 'candidate-sync@users.noreply.github.com'
          git rm .github/workflows/candidate-central20-stale-test-fix.yml
          git add qa/company-development-web-runtime.test.mjs qa/company-game-seed-flow.test.mjs
          git diff --cached --check
          git commit -m 'test(runtime): sync stale six-worker assertions to central 20 [stale-test-fix]'
          git push origin HEAD:fix/central-20-runtime-persist-v2-20260915
