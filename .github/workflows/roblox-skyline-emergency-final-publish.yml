name: Skyline Rush Normalized Publish

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: skyline-rush-normalized-publish
  cancel-in-progress: true

env:
  GAME_ID: seed-roblox-obby-party-minigam-tower-of-hell
  SOURCE_REVISION: 117a87320e67c690c1c8b3972598d331cf366c56
  REVIEWED_ARTIFACT_IDENTITY: sha256:7d80197d95f3e197ab30b888c71764123125b3d0d840f24ed789bce868eec3cc
  SOURCE_ROOT: roblox-games/seed-roblox-obby-party-minigam-tower-of-hell
  ROBLOX_UNIVERSE_ID: '10766723635'
  ROBLOX_PLACE_ID: '129342889720619'
  ROJO_VERSION: '7.7.0'
  ROJO_SHA256: 22503e5839864f9d7c2171c48b536fc229f2cc4d8774c9cc149f60941d864073

jobs:
  publish:
    name: rebuild validate and publish Skyline Rush
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout implementation
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
          fetch-depth: 0
          fetch-tags: false

      - name: Checkout canonical runtime evidence
        uses: actions/checkout@v4
        with:
          ref: company-runtime
          path: runtime
          fetch-depth: 1
          fetch-tags: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify reviewed Skyline evidence and target
        working-directory: main
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const q=JSON.parse(fs.readFileSync('../runtime/development-queue.json','utf8'));
          const item=(q.items||[]).find(row=>row.gameId===process.env.GAME_ID);
          if(!item) throw new Error('Skyline runtime item missing');
          const checks=[
            ['productionClass',String(item.productionClass||'').toUpperCase()==='DEVELOPMENT_CONFIRMED'],
            ['platform',String(item.selectedPlatform||item.targetPlatform||'').toUpperCase()==='ROBLOX'],
            ['sourceRevision',item.robloxSourceCommit===process.env.SOURCE_REVISION],
            ['buildSourceRevision',item.robloxBuildSourceRevision===process.env.SOURCE_REVISION],
            ['reviewedArtifactIdentity',item.robloxBuildArtifactIdentity===process.env.REVIEWED_ARTIFACT_IDENTITY],
            ['finalReview',item.robloxFinalReviewPassed===true],
            ['build',item.robloxBuildOrPackagePassed===true],
            ['preflight',item.robloxBuildPreflightPassed===true],
            ['runtime',item.robloxRuntimePassed===true],
            ['serverClient',item.robloxServerClientBoundaryPassed===true],
            ['mobile',item.robloxMobileControlUiPassed===true],
            ['independentQa',item.robloxIndependentQaPassed===true],
            ['regression',item.robloxRegressionPassed===true],
            ['exactRevision',item.robloxExactRevisionPassed===true],
            ['multiplayerQa',item.robloxMultiplayerApplicable!==true||item.robloxMultiplayerQaPassed===true],
            ['universeId',String(item.robloxPublicationTarget?.universeId||'')===process.env.ROBLOX_UNIVERSE_ID],
            ['placeId',String(item.robloxPublicationTarget?.placeId||'')===process.env.ROBLOX_PLACE_ID],
            ['targetVerified',item.robloxPublicationTarget?.verified===true],
          ];
          const failed=checks.filter(([,ok])=>!ok).map(([name])=>name);
          if(failed.length) throw new Error(`SKYLINE_REVIEWED_EVIDENCE_BLOCKED:${failed.join(',')}`);
          if(!item.designBaselineSource) throw new Error('Skyline design baseline missing');
          fs.writeFileSync('/tmp/skyline-baseline-path.txt',String(item.designBaselineSource));
          console.log('SKYLINE_REVIEWED_EVIDENCE=PASS');
          console.log(`SKYLINE_TARGET=${process.env.ROBLOX_UNIVERSE_ID}/${process.env.ROBLOX_PLACE_ID}`);
          NODE

      - name: Verify source unchanged and assemble release evidence
        working-directory: main
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${SOURCE_REVISION}^{commit}"
          git merge-base --is-ancestor "$SOURCE_REVISION" HEAD
          git diff --quiet "$SOURCE_REVISION" HEAD -- "$SOURCE_ROOT"
          git fetch --no-tags origin company-runtime:refs/remotes/origin/company-runtime
          node tools/vibe3-roblox-platform.mjs \
            --assemble-development-release-evidence \
            --queue ../runtime/development-queue.json \
            --game-id "$GAME_ID" \
            --output /tmp/skyline-release-evidence.json
          grep -q '"state": "PASS"' /tmp/skyline-release-evidence.json
          baseline="../runtime/$(cat /tmp/skyline-baseline-path.txt)"
          test -f "$baseline"
          cp "$baseline" /tmp/skyline-baseline.json
          echo 'SKYLINE_SOURCE_AND_RELEASE_EVIDENCE=PASS'

      - name: Install pinned Rojo
        working-directory: main
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/rojo-$ROJO_VERSION"
          archive="$RUNNER_TEMP/rojo.zip"
          rm -rf "$root" "$archive"
          mkdir -p "$root"
          curl -fsSL --retry 3 --retry-all-errors \
            "https://github.com/rojo-rbx/rojo/releases/download/v${ROJO_VERSION}/rojo-${ROJO_VERSION}-linux-x86_64.zip" \
            -o "$archive"
          echo "$ROJO_SHA256  $archive" | sha256sum -c -
          unzip -q "$archive" -d "$root"
          chmod +x "$root/rojo"
          "$root/rojo" --version
          printf 'ROJO_PATH=%s\n' "$root/rojo" >> "$GITHUB_ENV"

      - name: Test normalized Roblox packager
        working-directory: main
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/company-development-roblox-package.mjs
          node --test qa/company-development-roblox-package.test.mjs
          echo 'SKYLINE_NORMALIZED_PACKAGER_TEST=PASS'

      - name: Rebuild exact reviewed source through normalized packager
        id: package
        working-directory: main
        env:
          COMPANY_RUNTIME_BRANCH: company-runtime
        shell: bash
        run: |
          set -euo pipefail
          out="$SOURCE_ROOT/.release"
          evidence="$RUNNER_TEMP/skyline-build-evidence.json"
          rm -rf "$out" "$evidence"
          mkdir -p "$out"
          node tools/company-development-roblox-package.mjs \
            --repo-root=. \
            --game-id="$GAME_ID" \
            --source-path="$SOURCE_ROOT" \
            --source-revision="$SOURCE_REVISION" \
            --baseline=/tmp/skyline-baseline.json \
            --rojo="$ROJO_PATH" \
            --output-dir="$out" \
            --evidence="$evidence" | tee /tmp/skyline-package.log
          grep -q '^ROBLOX_BUILD_PACKAGE=PASS:' /tmp/skyline-package.log
          grep -q '^ROBLOX_BUILD_SCRIPT_INVENTORY=PASS:' /tmp/skyline-package.log
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';
          const evidence=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/skyline-build-evidence.json','utf8'));
          if(!evidence.artifactPath||!fs.existsSync(evidence.artifactPath)) throw new Error('rebuilt Skyline artifact missing');
          const hash=crypto.createHash('sha256').update(fs.readFileSync(evidence.artifactPath)).digest('hex');
          const identity=`sha256:${hash}`;
          if(identity!==evidence.artifactIdentity) throw new Error('fresh build evidence hash mismatch');
          if(identity!==process.env.REVIEWED_ARTIFACT_IDENTITY) throw new Error(`fresh exact-source artifact differs from reviewed artifact: ${identity}`);
          const placeFile=path.relative(process.cwd(),evidence.artifactPath).replaceAll('\\','/');
          if(!placeFile.startsWith('roblox-games/')) throw new Error(`rebuilt Skyline artifact outside Roblox source root: ${placeFile}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`place_file=${placeFile}\nartifact_identity=${identity}\n`);
          console.log(`SKYLINE_REBUILT_ARTIFACT_IDENTITY=${identity}`);
          console.log(`SKYLINE_REBUILT_PLACE_FILE=${placeFile}`);
          console.log('SKYLINE_REBUILT_REVIEWED_ARTIFACT_MATCH=PASS');
          NODE

      - name: Validate exact Open Cloud publish plan
        working-directory: main
        env:
          PLACE_FILE: ${{ steps.package.outputs.place_file }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/vibe3-roblox-platform.mjs \
            --place-file "$PLACE_FILE" \
            --evidence /tmp/skyline-release-evidence.json \
            --source-revision "$SOURCE_REVISION" | tee /tmp/skyline-plan.log
          grep -q '^ROBLOX_V3_STATE=READY$' /tmp/skyline-plan.log
          echo 'SKYLINE_OPEN_CLOUD_PLAN=READY'

      - name: Publish Skyline Rush through Roblox Open Cloud
        id: publish
        working-directory: main
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          PLACE_FILE: ${{ steps.package.outputs.place_file }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            : > /tmp/skyline-publish.log
            set +e
            node --input-type=module <<'NODE' 2>&1 | tee /tmp/skyline-publish.log
          import fs from 'node:fs';
          import {createRobloxPlacePublishPlan,publishRobloxPlace} from './tools/vibe3-roblox-platform.mjs';
          const evidence=JSON.parse(fs.readFileSync('/tmp/skyline-release-evidence.json','utf8'));
          const plan=createRobloxPlacePublishPlan({
            placeFile:process.env.PLACE_FILE,
            universeId:process.env.ROBLOX_UNIVERSE_ID,
            placeId:process.env.ROBLOX_PLACE_ID,
            sourceRevision:process.env.SOURCE_REVISION,
            evidence,
          });
          if(plan.executionReady!==true) throw new Error(`Skyline publish blocked: ${(plan.blockedReasons||[]).join(',')}`);
          const result=await publishRobloxPlace({plan,retryDelaysMs:[]});
          console.log(`ROBLOX_V3_STATE=${result.state}`);
          console.log(`ROBLOX_PUBLISHED_VERSION_NUMBER=${result.versionNumber}`);
          NODE
            rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -eq 0 ]; then
              grep -q '^ROBLOX_V3_STATE=PUBLISHED$' /tmp/skyline-publish.log
              version="$(sed -n 's/^ROBLOX_PUBLISHED_VERSION_NUMBER=//p' /tmp/skyline-publish.log | tail -n1)"
              [[ "$version" =~ ^[1-9][0-9]*$ ]]
              printf 'version_number=%s\n' "$version" >> "$GITHUB_OUTPUT"
              echo 'SKYLINE_ROBLOX_OPEN_CLOUD_PUBLISH=PASS'
              exit 0
            fi
            if [ "$attempt" -eq 3 ] || ! grep -Eqi 'HTTP 409:.*(server is busy|unable to process your upload request)' /tmp/skyline-publish.log; then
              exit "$rc"
            fi
            echo "SKYLINE_ROBLOX_BUSY_RETRY=$attempt"
            sleep 60
          done

      - name: Publish result
        env:
          VERSION_NUMBER: ${{ steps.publish.outputs.version_number }}
          ARTIFACT_IDENTITY: ${{ steps.package.outputs.artifact_identity }}
        run: |
          set -euo pipefail
          [[ "$VERSION_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [ "$ARTIFACT_IDENTITY" = "$REVIEWED_ARTIFACT_IDENTITY" ]
          echo "SKYLINE_RUSH_DEPLOYED_VERSION=$VERSION_NUMBER"
          echo "SKYLINE_RUSH_DEPLOYED_ARTIFACT=$ARTIFACT_IDENTITY"
          echo 'SKYLINE_RUSH_DEPLOYMENT=PASS'
