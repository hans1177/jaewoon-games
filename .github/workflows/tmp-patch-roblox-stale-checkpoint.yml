name: Temporary patch stale Roblox checkpoint

on:
  push:
    branches:
      - fix/roblox-stale-runtime-checkpoint-20260916
    paths:
      - .github/workflows/tmp-patch-roblox-stale-checkpoint.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/roblox-stale-runtime-checkpoint-20260916
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch stale checkpoint handling
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path('.github/workflows/company-development-roblox-runtime-continuation.yml')
          s=p.read_text()
          old="""            if(!exactBuild||item.robloxBuildPreflightPassed===true)continue;\n            if(item.robloxBuildPreflightFailedAt)continue;\n            rows.push({gameId:item.gameId,gameName:item.gameName||item.gameId,sourceRevision:revision,artifactIdentity:item.robloxBuildArtifactIdentity});"""
          new="""            if(!exactBuild||item.robloxBuildPreflightPassed===true)continue;\n            const preflightFailedAt=Date.parse(String(item.robloxBuildPreflightFailedAt||''));\n            const buildPassedAt=Date.parse(String(item.robloxBuildPassedAt||''));\n            const stalePreflightFailure=Number.isFinite(preflightFailedAt)&&Number.isFinite(buildPassedAt)&&buildPassedAt>preflightFailedAt;\n            if(item.robloxBuildPreflightFailedAt&&!stalePreflightFailure)continue;\n            rows.push({gameId:item.gameId,gameName:item.gameName||item.gameId,sourceRevision:revision,artifactIdentity:item.robloxBuildArtifactIdentity});"""
          if old not in s: raise SystemExit('preflight planner target missing')
          s=s.replace(old,new,1)

          old="""              Object.assign(item,{robloxBuildPreflightPassed:true,robloxBuildPreflightPassedAt:stamp,robloxBuildPreflightFailedAt:null,robloxBuildPreflightEvidence:result,\n                robloxLastSuccessfulStage:'FIVE_DISTINCT_LEAD_BUILD_PREFLIGHT',robloxFailureStage:'TARGET_PLATFORM_RUNTIME',robloxFailureSignature:'ROBLOX_RUNTIME_PENDING',routingBlockers:['roblox-runtime-pending'],updatedAt:stamp});"""
          new="""              Object.assign(item,{robloxBuildPreflightPassed:true,robloxBuildPreflightPassedAt:stamp,robloxBuildPreflightFailedAt:null,robloxBuildPreflightEvidence:result,\n                robloxRuntimePassed:false,robloxRuntimePassedAt:null,robloxRuntimeFailedAt:null,robloxRuntimeEvidence:null,robloxRuntimeRetryCount:0,robloxRuntimeHarnessVersion:null,\n                robloxServerClientBoundaryPassed:false,robloxDatastoreRejoinPassed:false,robloxMobileControlUiPassed:false,\n                robloxIndependentQaPassed:false,robloxIndependentQaPassedAt:null,robloxRegressionPassed:false,robloxRegressionPassedAt:null,\n                robloxFinalReviewPassed:false,robloxFinalReviewPassedAt:null,robloxPostRuntimeQaEvidence:null,\n                robloxLastSuccessfulStage:'FIVE_DISTINCT_LEAD_BUILD_PREFLIGHT',robloxFailureStage:'TARGET_PLATFORM_RUNTIME',robloxFailureSignature:'ROBLOX_RUNTIME_PENDING',routingBlockers:['roblox-runtime-pending'],updatedAt:stamp});"""
          if old not in s: raise SystemExit('preflight persist target missing')
          s=s.replace(old,new,1)

          old="""            const retryableMissingEvidence=retryBudgetAvailable&&item.robloxRuntimePassed!==true&&Boolean(item.robloxRuntimeFailedAt)&&item.robloxRuntimeEvidence==null&&item.robloxFailureSignature==='ROBLOX_RUNTIME_RESULT_MISSING';\n            const retryableAuthMigration=!sameHarness&&item.robloxRuntimePassed!==true&&item.robloxRuntimeEvidence?.failure==='roblox-studio-authentication-required';\n            if(item.robloxBuildPreflightPassed!==true||(item.robloxRuntimePassed===true&&sameHarness)||(item.robloxRuntimeFailedAt&&!retryableInstallFailure&&!retryableRuntimeFailure&&!retryableMissingEvidence&&!retryableAuthMigration))continue;"""
          new="""            const retryableMissingEvidence=retryBudgetAvailable&&item.robloxRuntimePassed!==true&&Boolean(item.robloxRuntimeFailedAt)&&item.robloxRuntimeEvidence==null&&item.robloxFailureSignature==='ROBLOX_RUNTIME_RESULT_MISSING';\n            const retryableAuthMigration=!sameHarness&&item.robloxRuntimePassed!==true&&item.robloxRuntimeEvidence?.failure==='roblox-studio-authentication-required';\n            const runtimeFailedAt=Date.parse(String(item.robloxRuntimeFailedAt||''));\n            const preflightPassedAt=Date.parse(String(item.robloxBuildPreflightPassedAt||''));\n            const staleRuntimeFailure=Number.isFinite(runtimeFailedAt)&&Number.isFinite(preflightPassedAt)&&preflightPassedAt>runtimeFailedAt;\n            if(item.robloxBuildPreflightPassed!==true||(item.robloxRuntimePassed===true&&sameHarness)||(item.robloxRuntimeFailedAt&&!staleRuntimeFailure&&!retryableInstallFailure&&!retryableRuntimeFailure&&!retryableMissingEvidence&&!retryableAuthMigration))continue;"""
          if old not in s: raise SystemExit('runtime planner target missing')
          s=s.replace(old,new,1)

          old="""            const retryableAuthMigration=!sameHarness&&item.robloxRuntimePassed!==true&&item.robloxRuntimeEvidence?.failure==='roblox-studio-authentication-required';\n            const runtimePending=exact&&item.robloxBuildPreflightPassed===true&&(item.robloxRuntimePassed!==true||!sameHarness)&&(!item.robloxRuntimeFailedAt||retryableInstallFailure||retryableRuntimeFailure||retryableMissingEvidence||retryableAuthMigration);"""
          new="""            const retryableAuthMigration=!sameHarness&&item.robloxRuntimePassed!==true&&item.robloxRuntimeEvidence?.failure==='roblox-studio-authentication-required';\n            const runtimeFailedAt=Date.parse(String(item.robloxRuntimeFailedAt||''));\n            const preflightPassedAt=Date.parse(String(item.robloxBuildPreflightPassedAt||''));\n            const staleRuntimeFailure=Number.isFinite(runtimeFailedAt)&&Number.isFinite(preflightPassedAt)&&preflightPassedAt>runtimeFailedAt;\n            const runtimePending=exact&&item.robloxBuildPreflightPassed===true&&(item.robloxRuntimePassed!==true||!sameHarness)&&(!item.robloxRuntimeFailedAt||staleRuntimeFailure||retryableInstallFailure||retryableRuntimeFailure||retryableMissingEvidence||retryableAuthMigration);"""
          if old not in s: raise SystemExit('continuation redispatch target missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('.github/workflows/company-development-roblox-runtime.yml')
          s=p.read_text()
          old="""                const retryableMissingEvidence=retryBudgetAvailable&&Boolean(item.robloxRuntimeFailedAt)&&item.robloxRuntimeEvidence==null&&item.robloxFailureSignature==='ROBLOX_RUNTIME_RESULT_MISSING';\n                const retryableAuthMigration=!sameHarness&&item.robloxRuntimePassed!==true&&item.robloxRuntimeEvidence?.failure==='roblox-studio-authentication-required';\n                if(!item.robloxRuntimeFailedAt||retryableInstallFailure||retryableRuntimeFailure||retryableMissingEvidence||retryableAuthMigration)runtimeReady++;"""
          new="""                const retryableMissingEvidence=retryBudgetAvailable&&Boolean(item.robloxRuntimeFailedAt)&&item.robloxRuntimeEvidence==null&&item.robloxFailureSignature==='ROBLOX_RUNTIME_RESULT_MISSING';\n                const retryableAuthMigration=!sameHarness&&item.robloxRuntimePassed!==true&&item.robloxRuntimeEvidence?.failure==='roblox-studio-authentication-required';\n                const runtimeFailedAt=Date.parse(String(item.robloxRuntimeFailedAt||''));\n                const preflightPassedAt=Date.parse(String(item.robloxBuildPreflightPassedAt||''));\n                const staleRuntimeFailure=Number.isFinite(runtimeFailedAt)&&Number.isFinite(preflightPassedAt)&&preflightPassedAt>runtimeFailedAt;\n                if(!item.robloxRuntimeFailedAt||staleRuntimeFailure||retryableInstallFailure||retryableRuntimeFailure||retryableMissingEvidence||retryableAuthMigration)runtimeReady++;"""
          if old not in s: raise SystemExit('parent continuation target missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --test qa/company-development-roblox-runtime-continuation.test.mjs qa/company-development-roblox-runtime.test.mjs
          git diff --check
      - name: Export tested patch files
        uses: actions/upload-artifact@v4
        with:
          name: tested-stale-roblox-checkpoint-patch
          path: |
            .github/workflows/company-development-roblox-runtime-continuation.yml
            .github/workflows/company-development-roblox-runtime.yml
          retention-days: 1
      - name: Commit branch patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hans1177'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/company-development-roblox-runtime-continuation.yml .github/workflows/company-development-roblox-runtime.yml
          git commit -m 'fix: invalidate stale Roblox runtime checkpoints'
          git push origin HEAD:fix/roblox-stale-runtime-checkpoint-20260916
