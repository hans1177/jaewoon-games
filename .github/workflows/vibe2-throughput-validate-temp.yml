name: Vibe2 Throughput Validate Temp

on:
  push:
    branches:
      - 'feat/vibe2-throughput-overlap'
    paths:
      - '.github/workflows/vibe2-throughput-validate-temp.yml'
      - 'tools/vibe2-throughput-validate-temp.py'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vibe2-throughput-overlap
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply remaining throughput optimization
        run: python tools/vibe2-throughput-validate-temp.py

      - name: Syntax and machine-state check
        run: |
          set -euo pipefail
          node --check tools/vibe2-handoff.mjs
          node --check tools/vibe2-queue-control.mjs
          node --check tools/vibe2-continuous-runner.mjs
          node tools/vibe2-handoff.mjs --check --output=/tmp/vibe2-handoff-throughput.json >/tmp/vibe2-handoff-throughput.log

      - name: Auto planner tests
        run: node --test qa/vibe2-auto-planner.test.mjs
      - name: Core engine motion tests
        run: node --test qa/vibe2-core-engine-motion.test.mjs
      - name: Source worker tests
        run: node --test qa/vibe2-source-worker.test.mjs
      - name: Queue control tests
        run: node --test qa/vibe2-queue-control.test.mjs
      - name: Incremental QA tests
        run: node --test qa/vibe2-incremental-qa.test.mjs
      - name: Parallelism telemetry tests
        run: node --test qa/vibe2-parallelism-telemetry.test.mjs
      - name: Controller contract tests
        run: node --test qa/vibe2-controller-contract.test.mjs
      - name: Candidate reconcile tests
        run: node --test qa/vibe2-candidate-reconcile.test.mjs
      - name: Experience control tests
        run: node --test qa/vibe2-experience-control.test.mjs
      - name: Handoff tests
        run: node --test qa/vibe2-handoff.test.mjs

      - name: Concurrent fan-in regression contract
        run: |
          node --test --test-concurrency=4 \
            qa/vibe2-auto-planner.test.mjs \
            qa/vibe2-core-engine-motion.test.mjs \
            qa/vibe2-source-worker.test.mjs \
            qa/vibe2-queue-control.test.mjs \
            qa/vibe2-incremental-qa.test.mjs \
            qa/vibe2-parallelism-telemetry.test.mjs \
            qa/vibe2-controller-contract.test.mjs \
            qa/vibe2-candidate-reconcile.test.mjs \
            qa/vibe2-experience-control.test.mjs \
            qa/vibe2-handoff.test.mjs

      - name: Diff check
        run: git diff --check

      - name: Commit verified non-workflow state and workflow snapshot
        run: |
          set -euo pipefail
          git checkout -- .github/workflows/vibe2-continuous-core.yml
          git config user.name 'jaewoon-vibe2-throughput'
          git config user.email 'vibe2-throughput@users.noreply.github.com'
          git add vibe2-runtime.json qa/vibe2-controller-contract.test.mjs qa/vibe2-handoff.test.mjs .vibe2/workflow-snapshots/vibe2-continuous-core.yml
          git diff --cached --check
          git commit -m 'vibe2: complete throughput refill and fan-in optimization'
          git push origin HEAD:feat/vibe2-throughput-overlap
