name: Unity Local PC Android APK (Legacy Manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-animation-test:
    runs-on: [self-hosted, Windows, X64, jaewoon-unity]
    defaults:
      run:
        shell: powershell

    steps:
      - name: Legacy runner notice
        run: |
          Write-Host '[LEGACY] This workflow requires the local Jaewoon PC self-hosted runner.'
          Write-Host '[INFO] Normal remote test delivery now uses unity-cloud-android-test.yml on GitHub-hosted runners.'

      - name: Checkout requested commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Detect matching local Unity
        run: |
          $project = Join-Path $env:GITHUB_WORKSPACE 'unity-games\animation-test'
          $versionFile = Join-Path $project 'ProjectSettings\ProjectVersion.txt'
          if (-not (Test-Path $versionFile)) { throw "ProjectVersion.txt missing: $versionFile" }

          $line = Get-Content $versionFile | Where-Object { $_ -match '^m_EditorVersion:' } | Select-Object -First 1
          if (-not $line) { throw 'Unity editor version could not be read.' }
          $version = ($line -split ':', 2)[1].Trim()
          $unity = Join-Path $env:ProgramFiles "Unity\Hub\Editor\$version\Editor\Unity.exe"
          if (-not (Test-Path $unity)) { throw "Matching local Unity is not installed: $unity" }

          $android = Join-Path (Split-Path $unity -Parent) 'Data\PlaybackEngines\AndroidPlayer'
          if (-not (Test-Path $android)) { throw "Android Build Support missing for Unity $version" }

          "UNITY_EXE=$unity" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PROJECT_PATH=$project" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build APK with installed PC Unity
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'animation-test-unity-build.log'
          & $env:UNITY_EXE `
            -batchmode `
            -nographics `
            -quit `
            -projectPath $env:PROJECT_PATH `
            -executeMethod AndroidCiBuild.Build `
            -logFile $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 250 }
            throw "Unity Android build failed with exit code $code"
          }

      - name: Verify and stage APK
        run: |
          $apk = Join-Path $env:PROJECT_PATH 'Build\animation-test.apk'
          if (-not (Test-Path $apk)) { throw "APK missing: $apk" }
          if ((Get-Item $apk).Length -le 0) { throw 'APK is empty.' }
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          Copy-Item $apk (Join-Path $dist 'animation-test.apk') -Force

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: animation-test-android-${{ github.sha }}
          path: dist/animation-test.apk
          if-no-files-found: error
          retention-days: 14
