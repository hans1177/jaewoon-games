name: Unity Local PC Android APK

on:
  workflow_call:
    inputs:
      request_file:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      request_file:
        description: 'Tracked .build-requests/unity/*.json request file'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: [self-hosted, Windows, X64, jaewoon-unity]
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"

    steps:
      - name: Checkout requested commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Resolve build request
        id: request
        run: |
          $requestFile = '${{ inputs.request_file }}'
          if ($requestFile -notmatch '^\.build-requests/unity/[A-Za-z0-9._-]+\.json$') { throw "Invalid request path: $requestFile" }
          $fullRequest = Join-Path $env:GITHUB_WORKSPACE ($requestFile -replace '/', '\')
          if (-not (Test-Path $fullRequest)) { throw "Build request missing: $requestFile" }
          $data = [System.IO.File]::ReadAllText($fullRequest, [System.Text.Encoding]::UTF8) | ConvertFrom-Json
          if ($data.version -ne 1) { throw 'Unsupported build request version.' }
          $gameId = [string]$data.gameId
          $projectPath = ([string]$data.projectPath).Replace('\','/').Trim('/')
          $buildMethod = [string]$data.buildMethod
          $requestId = [string]$data.requestId
          $sourceCommit = [string]$data.sourceCommit
          if ($gameId -notmatch '^[a-z0-9][a-z0-9-]{1,48}$') { throw "Invalid gameId: $gameId" }
          if ($projectPath -notmatch '^unity-games/[A-Za-z0-9._-]+$' -or $projectPath.Contains('..')) { throw "Invalid projectPath: $projectPath" }
          if ([string]::IsNullOrWhiteSpace($buildMethod) -or $buildMethod -notmatch '^[A-Za-z0-9_.]+$') { throw 'buildMethod is required.' }
          if ([string]::IsNullOrWhiteSpace($requestId)) { $requestId = "run-$gameId" }
          if ([string]::IsNullOrWhiteSpace($sourceCommit)) { $sourceCommit = $env:GITHUB_SHA }
          if ($sourceCommit -notmatch '^[0-9a-fA-F]{40}$') { throw "sourceCommit must be an exact 40-character Git SHA: $sourceCommit" }

          $publishHomepage = $false
          $catalogPath = Join-Path $env:GITHUB_WORKSPACE 'game-catalog.json'
          if (Test-Path $catalogPath) {
            $catalog = [System.IO.File]::ReadAllText($catalogPath, [System.Text.Encoding]::UTF8) | ConvertFrom-Json
            $game = $catalog.games | Where-Object { $_.id -eq $gameId } | Select-Object -First 1
            if ($game -and $game.homepagePublicationApproved -eq $true -and $game.publishTestBuildWhenReady -eq $true) { $publishHomepage = $true }
          }

          "game_id=$gameId" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "project_path=$projectPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "build_method=$buildMethod" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "request_id=$requestId" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "source_commit=$sourceCommit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "publish_homepage=$($publishHomepage.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Checkout exact Unity source revision
        run: |
          $sourceCommit = '${{ steps.request.outputs.source_commit }}'
          git cat-file -e "$sourceCommit`^{commit}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            git fetch origin $sourceCommit
            if ($LASTEXITCODE -ne 0) { throw "Exact source commit is unavailable: $sourceCommit" }
          }
          git checkout --detach $sourceCommit
          if ($LASTEXITCODE -ne 0) { throw "Could not checkout exact source commit: $sourceCommit" }
          git lfs pull
          if ($LASTEXITCODE -ne 0) { throw 'git lfs pull failed for exact source revision.' }
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $sourceCommit) { throw "Exact source binding failed: expected=$sourceCommit actual=$actual" }
          Write-Host "[PASS] Exact Unity source revision checked out: $actual"

      - name: Preflight local Unity, Android support and Personal license
        run: |
          $project = Join-Path $env:GITHUB_WORKSPACE ('${{ steps.request.outputs.project_path }}' -replace '/', '\')
          $versionFile = Join-Path $project 'ProjectSettings\ProjectVersion.txt'
          if (-not (Test-Path $versionFile)) { throw "ProjectVersion.txt missing: $versionFile" }
          $line = Get-Content $versionFile | Where-Object { $_ -match '^m_EditorVersion:' } | Select-Object -First 1
          if (-not $line) { throw 'Unity editor version could not be read.' }
          $version = ($line -split ':', 2)[1].Trim()
          $unity = Join-Path $env:ProgramFiles "Unity\Hub\Editor\$version\Editor\Unity.exe"
          if (-not (Test-Path $unity)) { throw "Matching local Unity is not installed: $unity" }
          $android = Join-Path (Split-Path $unity -Parent) 'Data\PlaybackEngines\AndroidPlayer'
          if (-not (Test-Path $android)) { throw "Android Build Support missing for Unity $version" }

          $license = Join-Path $env:ProgramData 'Unity\Unity_lic.ulf'
          if (-not (Test-Path $license)) { throw "Local Unity license file missing: $license" }
          $licenseText = Get-Content $license -Raw -ErrorAction Stop
          if ([string]::IsNullOrWhiteSpace($licenseText) -or $licenseText.Length -lt 500) { throw 'Local Unity license file is empty or incomplete.' }
          if ($licenseText -notmatch 'DeveloperData') { throw 'Local Unity license is missing DeveloperData.' }
          if ($licenseText -notmatch 'UnityPersonal') { throw 'Local Unity license is not marked as Unity Personal.' }

          $localAppData = [Environment]::GetFolderPath('LocalApplicationData')
          $appData = [Environment]::GetFolderPath('ApplicationData')
          if ([string]::IsNullOrWhiteSpace($localAppData)) { $localAppData = Join-Path $env:USERPROFILE 'AppData\Local' }
          if ([string]::IsNullOrWhiteSpace($appData)) { $appData = Join-Path $env:USERPROFILE 'AppData\Roaming' }
          New-Item -ItemType Directory -Path (Join-Path $localAppData 'Unity\Caches') -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $appData 'Unity') -Force | Out-Null
          "LOCALAPPDATA=$localAppData" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "APPDATA=$appData" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "UNITY_EXE=$unity" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PROJECT_PATH=$project" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "[PASS] Local Unity $version + Android Build Support detected."
          Write-Host '[PASS] Local Unity Personal license file is present and structurally valid.'
          Write-Host "[PASS] Unity service-account cache prepared: $localAppData"

      - name: Build APK with local activated Unity
        run: |
          $log = Join-Path $env:RUNNER_TEMP '${{ steps.request.outputs.game_id }}-unity-build.log'
          if (Test-Path $log) { Remove-Item $log -Force }
          $unityArgs = @(
            '-batchmode',
            '-nographics',
            '-quit',
            '-projectPath', $env:PROJECT_PATH,
            '-executeMethod', '${{ steps.request.outputs.build_method }}',
            '-logFile', $log
          )
          $process = Start-Process -FilePath $env:UNITY_EXE -ArgumentList $unityArgs -PassThru -Wait
          $code = $process.ExitCode
          if ($code -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 400 }
            throw "Unity Android build failed with exit code $code"
          }
          if (Test-Path $log) { Get-Content $log -Tail 80 }
          Write-Host "[PASS] Unity process completed with exit code $code"

      - name: Verify APK and create metadata
        id: artifact
        run: |
          $roots = @(
            (Join-Path $env:GITHUB_WORKSPACE 'build'),
            (Join-Path $env:PROJECT_PATH 'Build'),
            (Join-Path $env:PROJECT_PATH 'build')
          ) | Select-Object -Unique
          $apk = $null
          foreach ($root in $roots) {
            if (Test-Path $root) {
              $apk = Get-ChildItem $root -Filter '*.apk' -File -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Length -gt 0 } | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
              if ($apk) { break }
            }
          }
          if (-not $apk) { throw 'No non-empty APK was produced.' }

          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          $game = '${{ steps.request.outputs.game_id }}'
          $sourceCommit = '${{ steps.request.outputs.source_commit }}'
          $out = Join-Path $dist "$game-test.apk"
          Copy-Item $apk.FullName $out -Force
          $sha = (Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes = (Get-Item $out).Length
          $sourceTreeSha = (git rev-parse "$sourceCommit`^{tree}").Trim()
          if ($LASTEXITCODE -ne 0 -or $sourceTreeSha -notmatch '^[0-9a-f]{40}$') { throw 'Could not resolve exact source tree SHA.' }
          $tag = "test-$game-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          "$sha  $game-test.apk" | Set-Content "$out.sha256" -Encoding ascii
          $info = [ordered]@{
            version = 2
            gameId = $game
            requestId = '${{ steps.request.outputs.request_id }}'
            sourceCommit = $sourceCommit
            sourceTreeSha = $sourceTreeSha
            buildRequestCommit = $env:GITHUB_SHA
            runId = [int64]$env:GITHUB_RUN_ID
            runAttempt = [int]$env:GITHUB_RUN_ATTEMPT
            releaseTag = $tag
            artifactName = "$game-test.apk"
            sha256 = $sha
            bytes = [int64]$bytes
            channel = 'test'
            buildRoute = 'local-pc'
            homepagePublicationApproved = ('${{ steps.request.outputs.publish_homepage }}' -eq 'true')
            homepagePublished = $false
            builtAt = (Get-Date).ToUniversalTime().ToString('o')
          }
          $info | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $dist 'build-info.json') -Encoding utf8
          "apk_path=dist/$game-test.apk" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sha256=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "bytes=$bytes" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "[PASS] LOCAL APK sourceCommit=$sourceCommit sourceTreeSha=$sourceTreeSha bytes=$bytes sha256=$sha"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.request.outputs.game_id }}-android-local-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.artifact.outputs.apk_path }}
            ${{ steps.artifact.outputs.apk_path }}.sha256
            dist/build-info.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish test prerelease download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.artifact.outputs.release_tag }}
          name: ${{ steps.request.outputs.game_id }} Android Test #${{ github.run_number }}
          prerelease: true
          make_latest: false
          body: |
            Automated Jaewoon Company Android test build.
            Route: local PC self-hosted Unity
            Game: ${{ steps.request.outputs.game_id }}
            Source: ${{ steps.request.outputs.source_commit }}
            Build request commit: ${{ github.sha }}
            Request: ${{ steps.request.outputs.request_id }}
          files: |
            ${{ steps.artifact.outputs.apk_path }}
            ${{ steps.artifact.outputs.apk_path }}.sha256
            dist/build-info.json
          fail_on_unmatched_files: true

      - name: Propose verified build homepage state through PR
        if: steps.request.outputs.publish_homepage == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $game = '${{ steps.request.outputs.game_id }}'
          $sourceCommit = '${{ steps.request.outputs.source_commit }}'
          $tag = '${{ steps.artifact.outputs.release_tag }}'
          $releaseUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$tag"
          $downloadUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$game-test.apk"
          $branch = "automation/unity-build-state-$game-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"

          git fetch origin main
          git checkout -B $branch origin/main

          $path = Join-Path $env:GITHUB_WORKSPACE 'company-status.json'
          $data = [System.IO.File]::ReadAllText($path, [System.Text.Encoding]::UTF8) | ConvertFrom-Json
          $kept = @($data.testBuilds | Where-Object { $_.gameId -ne $game })
          $entry = [pscustomobject]@{
            gameId = $game
            requestId = '${{ steps.request.outputs.request_id }}'
            status = 'ready'
            channel = 'test'
            buildRoute = 'local-pc'
            homepagePublished = $true
            sourceCommit = $sourceCommit
            releaseTag = $tag
            release = $releaseUrl
            download = $downloadUrl
            sha256 = '${{ steps.artifact.outputs.sha256 }}'
            bytes = [int64]'${{ steps.artifact.outputs.bytes }}'
            builtAt = (Get-Date).ToUniversalTime().ToString('o')
          }
          $data.testBuilds = @($kept) + @($entry)
          if (-not $data.summary) { $data | Add-Member -NotePropertyName summary -NotePropertyValue ([pscustomobject]@{}) }
          $data.summary | Add-Member -NotePropertyName testBuilds -NotePropertyValue $data.testBuilds.Count -Force
          $data.updatedAt = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
          $data | ConvertTo-Json -Depth 20 | Set-Content $path -Encoding utf8

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add company-status.json
          git diff --cached --quiet
          $hasChanges = $LASTEXITCODE -ne 0
          if (-not $hasChanges) {
            Write-Host '[PASS] Homepage state already matches verified build; no PR required.'
            exit 0
          }

          git commit -m "company-ai: publish $game verified local test build"
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit homepage build-state proposal.' }
          git push origin "HEAD:refs/heads/$branch"
          if ($LASTEXITCODE -ne 0) { throw 'Could not push homepage build-state proposal branch.' }

          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $prBody = [ordered]@{
            title = "company-ai: publish $game verified local test build"
            head = $branch
            base = 'main'
            body = "Automated verified Unity Android build-state update. Exact game source: $sourceCommit`nBuild request source: $env:GITHUB_SHA`nRun: $env:GITHUB_RUN_ID/$env:GITHUB_RUN_ATTEMPT`nDirect main write: NO"
          } | ConvertTo-Json

          try {
            $response = Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/pulls" -Headers $headers -ContentType 'application/json' -Body $prBody -ErrorAction Stop
            Write-Host "[PASS] Approved homepage build state PR opened: $($response.html_url)"
            Write-Host 'HOMEPAGE_STATE_PR=OPENED'
          }
          catch {
            Write-Warning "Homepage state branch was pushed but this Actions token cannot open the PR: $($_.Exception.Message)"
            Write-Host "HOMEPAGE_STATE_BRANCH=$branch"
            Write-Host 'HOMEPAGE_STATE_PR=DEFERRED'
            Write-Host 'VERIFIED_APK_STATE=PASS'
          }
          Write-Host 'PUBLIC_MAIN_WRITE=NO'
          Write-Host "[PASS] Verified test build download: $downloadUrl"
