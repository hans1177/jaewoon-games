name: Roblox World Ghost Assets
on:
  push:
    branches: [main]
    paths:
      - 'assets/roblox/world-ghosts/**'
      - 'qa/roblox-world-ghost-skins.test.mjs'
      - '.github/workflows/roblox-world-ghost-assets.yml'
  pull_request:
    paths:
      - 'assets/roblox/world-ghosts/**'
      - 'qa/roblox-world-ghost-skins.test.mjs'
      - '.github/workflows/roblox-world-ghost-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ghost-assets-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install checksum-pinned official asset tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ghost-tools/rojo /tmp/ghost-tools/luau
          curl -fsSL --retry 3 -o /tmp/ghost-tools/rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip
          curl -fsSL --retry 3 -o /tmp/ghost-tools/luau.zip https://github.com/luau-lang/luau/releases/download/0.739/luau-ubuntu.zip
          echo '22503e5839864f9d7c2171c48b536fc229f2cc4d8774c9cc149f60941d864073  /tmp/ghost-tools/rojo.zip' | sha256sum -c -
          echo '8a9b4b381021722c82d6e6cda0964b5c9e7f354ec1035fcd8b657acc22e49247  /tmp/ghost-tools/luau.zip' | sha256sum -c -
          unzip -q /tmp/ghost-tools/rojo.zip -d /tmp/ghost-tools/rojo
          unzip -q /tmp/ghost-tools/luau.zip -d /tmp/ghost-tools/luau
          chmod +x /tmp/ghost-tools/rojo/rojo /tmp/ghost-tools/luau/luau /tmp/ghost-tools/luau/luau-compile
      - name: Validate committed source and native-package parity
        env:
          VIBE2_LUAU_BINARY: /tmp/ghost-tools/luau/luau
        run: node --test qa/roblox-world-ghost-skins.test.mjs
      - name: Rebuild gallery and reusable native module pack
        env:
          VIBE2_LUAU_COMPILER: /tmp/ghost-tools/luau/luau-compile
          VIBE2_ROJO_BINARY: /tmp/ghost-tools/rojo/rojo
        run: node assets/roblox/world-ghosts/build-native.mjs
      - name: Verify regenerated packages
        env:
          VIBE2_LUAU_BINARY: /tmp/ghost-tools/luau/luau
        run: node --test qa/roblox-world-ghost-skins.test.mjs
      - name: Install Blender for authored spider mesh
        run: |
          sudo apt-get update -y
          sudo apt-get install -y blender python3-numpy libegl1 libgl1 libgl1-mesa-dri
          blender --background --python-expr "import numpy; print('BLENDER_NUMPY_OK', numpy.__version__)"
      - name: Build high-detail spider asset
        run: |
          blender --background --python assets/roblox/world-ghosts/build-spider.py -- --output assets/roblox/world-ghosts/native/spider --render
      - name: Validate spider GLB and 12 motions
        run: |
          python3 - <<'PY'
          import json, struct
          from pathlib import Path
          root=Path('assets/roblox/world-ghosts/native/spider')
          evidence=json.loads((root/'evidence.json').read_text(encoding='utf-8'))
          assert evidence['legCount']==8
          assert evidence['eyeCount']==8
          assert evidence['bones']>=45
          assert evidence['motionCount']==12
          expected={'idle','walk','run','strafe','climb','threat','bite','pounce','web_cast','hit','stagger','death'}
          assert set(evidence['clips'])==expected
          raw=(root/'spider.glb').read_bytes()
          magic,version,total=struct.unpack_from('<4sII',raw,0)
          assert magic==b'glTF' and version==2 and total==len(raw)
          off=12; doc=None
          while off<total:
              size,kind=struct.unpack_from('<II',raw,off); off+=8
              chunk=raw[off:off+size]; off+=size
              if kind==0x4E4F534A:
                  doc=json.loads(chunk.decode('utf-8').rstrip('\x00 '))
          assert doc is not None
          names={a.get('name') for a in doc.get('animations',[])}
          assert names==expected, (names, expected)
          assert len(doc.get('skins',[]))>=1
          print('SPIDER_GLTF_OK', {'animations':len(names),'skins':len(doc.get('skins',[])),'bones':evidence['bones'],'vertices':evidence['vertices'],'triangles':evidence['triangles']})
          PY
      - name: Commit generated spider asset
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/roblox/world-ghosts/native/spider/spider.glb assets/roblox/world-ghosts/native/spider/spider.png assets/roblox/world-ghosts/native/spider/evidence.json
          if git diff --cached --quiet; then
            echo "Spider artifacts already current"
            exit 0
          fi
          git commit -m "assets: build high-detail spider mesh"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: world-ghosts-native-${{ github.sha }}
          path: assets/roblox/world-ghosts/native/
          if-no-files-found: error
          retention-days: 14

