# 파일명: .github/workflows/company-development-roblox-player-blackbox.yml
name: Company DEVELOPMENT_CONFIRMED Roblox Player Black Box
run-name: Roblox player blackbox · ${{ inputs.game_id }}

on:
  workflow_dispatch:
    inputs:
      game_id:
        description: Exact Roblox gameId with an isolated validation candidate
        required: true
        type: string

permissions:
  contents: write
  actions: write

env:
  COMPANY_RUNTIME_BRANCH: company-runtime

jobs:
  prepare:
    name: checkpoint exact candidate before PC runtime
    runs-on: ubuntu-slim
    timeout-minutes: 8
    outputs:
      run: ${{ steps.bind.outputs.run }}
      session_id: ${{ steps.bind.outputs.session_id }}
      source_revision: ${{ steps.bind.outputs.source_revision }}
      artifact_identity: ${{ steps.bind.outputs.artifact_identity }}
      universe_id: ${{ steps.bind.outputs.universe_id }}
      place_id: ${{ steps.bind.outputs.place_id }}
      version_number: ${{ steps.bind.outputs.version_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
          fetch-depth: 1
          fetch-tags: false
      - uses: actions/checkout@v4
        with:
          ref: company-runtime
          path: runtime
          fetch-depth: 1
          fetch-tags: false

      - name: Bind exact validation candidate and newest run
        id: bind
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_ID: ${{ inputs.game_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GAME_ID" =~ ^[a-z0-9][a-z0-9-]{1,48}$ ]]
          payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/company-development-roblox-player-blackbox.yml/runs?per_page=100")"
          winner="$(printf '%s' "$payload" | GAME_ID="$GAME_ID" node -e "
            let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{
              const j=JSON.parse(s),states=new Set(['queued','pending','in_progress','requested']);
              const title='Roblox player blackbox · '+process.env.GAME_ID;
              const ids=(j.workflow_runs||[]).filter(r=>states.has(String(r.status||'').toLowerCase())&&String(r.display_title||'')===title).map(r=>Number(r.id)).filter(Number.isFinite).sort((a,b)=>b-a);
              process.stdout.write(ids.length?String(ids[0]):'');
            });
          ")"
          if [ -n "$winner" ] && [ "$winner" != "$GITHUB_RUN_ID" ]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo "ROBLOX_PLAYER_BLACK_BOX_DEDUPED_NEWER=$GAME_ID:$winner"
            exit 0
          fi
          GAME_ID="$GAME_ID" GITHUB_RUN_ID="$GITHUB_RUN_ID" node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import fs from 'node:fs';
          const q=JSON.parse(fs.readFileSync('runtime/development-queue.json','utf8'));
          const gameId=String(process.env.GAME_ID||'').trim();
          const item=(q.items||[]).find(row=>row.gameId===gameId);
          if(!item)throw new Error('ROBLOX_BLACKBOX_GAME_NOT_FOUND:'+gameId);
          const c=item.robloxRuntimeCandidateEvidence||{};
          const source=String(item.robloxSourceCommit||'').trim();
          const artifact=String(item.robloxBuildArtifactIdentity||'').trim();
          const exact=c.published===true&&c.validationOnly===true&&c.canonicalGameTarget===false
            &&c.sourceRevision===source&&c.artifactIdentity===artifact
            &&/^[1-9][0-9]*$/.test(String(c.universeId||''))&&/^[1-9][0-9]*$/.test(String(c.placeId||''))
            &&Number(c.versionNumber)>0;
          if(!exact)throw new Error('ROBLOX_BLACKBOX_EXACT_VALIDATION_CANDIDATE_REQUIRED:'+gameId);
          const sessionId=String(process.env.GITHUB_RUN_ID)+'-'+gameId+'-'+Number(c.versionNumber);
          const put=(k,v)=>process.stdout.write(k+'='+String(v)+'\n');
          put('run','true'); put('session_id',sessionId); put('source_revision',source); put('artifact_identity',artifact);
          put('universe_id',c.universeId); put('place_id',c.placeId); put('version_number',Number(c.versionNumber));
          console.error('ROBLOX_PLAYER_BLACK_BOX_EXACT_BIND=PASS:'+gameId+':'+c.versionNumber);
          NODE

      - name: Persist reboot-safe checkpoint before Windows execution
        if: steps.bind.outputs.run == 'true'
        working-directory: runtime
        env:
          GAME_ID: ${{ inputs.game_id }}
          SESSION_ID: ${{ steps.bind.outputs.session_id }}
          SOURCE_REVISION: ${{ steps.bind.outputs.source_revision }}
          ARTIFACT_IDENTITY: ${{ steps.bind.outputs.artifact_identity }}
          VERSION_NUMBER: ${{ steps.bind.outputs.version_number }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-roblox-player-blackbox'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin "$COMPANY_RUNTIME_BRANCH"
            git reset --hard "origin/$COMPANY_RUNTIME_BRANCH"
            node <<'NODE'
          const fs=require('fs');
          const q=JSON.parse(fs.readFileSync('development-queue.json','utf8'));
          const item=(q.items||[]).find(row=>row.gameId===process.env.GAME_ID);
          if(!item)throw new Error('checkpoint game missing');
          const c=item.robloxRuntimeCandidateEvidence||{};
          if(String(item.robloxSourceCommit||'')!==process.env.SOURCE_REVISION
            ||String(item.robloxBuildArtifactIdentity||'')!==process.env.ARTIFACT_IDENTITY
            ||Number(c.versionNumber||0)!==Number(process.env.VERSION_NUMBER)
            ||c.published!==true||c.validationOnly!==true){
            throw new Error('checkpoint exact candidate changed');
          }
          const stamp=new Date().toISOString();
          item.robloxPlayerBlackBoxSession={
            version:1,sessionId:process.env.SESSION_ID,workflowRunId:Number(process.env.WORKFLOW_RUN_ID),
            sourceRevision:process.env.SOURCE_REVISION,artifactIdentity:process.env.ARTIFACT_IDENTITY,
            candidateVersionNumber:Number(process.env.VERSION_NUMBER),status:'PC_RUNTIME_STARTED',startedAt:stamp,
            rebootSafeCheckpoint:true,hostStateAuthoritative:false,companyRuntimeAuthoritative:true
          };
          item.currentStep='TARGET_PLATFORM_RUNTIME_FOUNDATION';
          item.robloxFailureStage='TARGET_PLATFORM_RUNTIME_FOUNDATION';
          item.updatedAt=stamp;q.updatedAt=stamp;
          fs.writeFileSync('development-queue.json',JSON.stringify(q,null,2)+'\n');
          NODE
            git add development-queue.json
            git diff --cached --check
            if git diff --cached --quiet; then echo 'ROBLOX_PLAYER_BLACK_BOX_CHECKPOINT=ALREADY_CURRENT'; exit 0; fi
            git commit -m "runtime: checkpoint Roblox Player blackbox $GAME_ID [skip ci]"
            if git push origin HEAD:"$COMPANY_RUNTIME_BRANCH"; then echo "ROBLOX_PLAYER_BLACK_BOX_CHECKPOINT=PUSHED:$attempt"; exit 0; fi
            sleep $((attempt*2))
          done
          exit 2

  player-blackbox:
    name: actual Roblox Player black-box runtime
    needs: prepare
    if: needs.prepare.outputs.run == 'true'
    runs-on: [self-hosted, Windows, X64, roblox-studio-authenticated]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
          fetch-depth: 1
          fetch-tags: false

      - name: Run exact private Roblox Player session
        shell: powershell
        env:
          GAME_ID: ${{ inputs.game_id }}
          SESSION_ID: ${{ needs.prepare.outputs.session_id }}
          SOURCE_REVISION: ${{ needs.prepare.outputs.source_revision }}
          ARTIFACT_IDENTITY: ${{ needs.prepare.outputs.artifact_identity }}
          UNIVERSE_ID: ${{ needs.prepare.outputs.universe_id }}
          PLACE_ID: ${{ needs.prepare.outputs.place_id }}
          VERSION_NUMBER: ${{ needs.prepare.outputs.version_number }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP ("roblox-player-blackbox\" + $env:SESSION_ID)
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          "ROBLOX_BLACKBOX_OUTPUT=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & powershell -NoProfile -ExecutionPolicy Bypass -File "main/tools/roblox-player-blackbox.ps1" -GameId $env:GAME_ID -PlaceId $env:PLACE_ID -UniverseId $env:UNIVERSE_ID -VersionNumber ([int]$env:VERSION_NUMBER) -SourceRevision $env:SOURCE_REVISION -ArtifactIdentity $env:ARTIFACT_IDENTITY -SessionId $env:SESSION_ID -OutputDir $out
          exit $LASTEXITCODE

      - name: Upload evidence even on runtime failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roblox-player-blackbox-${{ inputs.game_id }}-${{ needs.prepare.outputs.session_id }}
          path: ${{ env.ROBLOX_BLACKBOX_OUTPUT }}
          if-no-files-found: warn
          retention-days: 2

  finalize:
    name: persist result and recover interrupted PC session
    needs: [prepare, player-blackbox]
    if: always() && needs.prepare.outputs.run == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
          fetch-depth: 1
          fetch-tags: false
      - uses: actions/checkout@v4
        with:
          ref: company-runtime
          path: runtime
          fetch-depth: 1
          fetch-tags: false

      - name: Download Player evidence when available
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: roblox-player-blackbox-${{ inputs.game_id }}-${{ needs.prepare.outputs.session_id }}
          path: blackbox-evidence

      - name: Fetch exact source tree
        env:
          SOURCE_REVISION: ${{ needs.prepare.outputs.source_revision }}
          GAME_ID: ${{ inputs.game_id }}
        working-directory: main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$SOURCE_REVISION"
          rm -rf /tmp/roblox-blackbox-source
          mkdir -p /tmp/roblox-blackbox-source
          git archive "$SOURCE_REVISION" "roblox-games/$GAME_ID" | tar -x -C /tmp/roblox-blackbox-source

      - name: Validate exact Player runtime
        working-directory: main
        env:
          GAME_ID: ${{ inputs.game_id }}
          SESSION_ID: ${{ needs.prepare.outputs.session_id }}
          SOURCE_REVISION: ${{ needs.prepare.outputs.source_revision }}
          ARTIFACT_IDENTITY: ${{ needs.prepare.outputs.artifact_identity }}
          UNIVERSE_ID: ${{ needs.prepare.outputs.universe_id }}
          PLACE_ID: ${{ needs.prepare.outputs.place_id }}
          VERSION_NUMBER: ${{ needs.prepare.outputs.version_number }}
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {fetchRobloxRuntimeFoundationEvidence,validateRobloxRuntimeFoundationEvidence,validateRobloxMultiplayerSourceContract} from './tools/company-development-roblox-runtime-foundation.mjs';

          const gameId=String(process.env.GAME_ID||''),sourceRevision=String(process.env.SOURCE_REVISION||''),artifactIdentity=String(process.env.ARTIFACT_IDENTITY||'');
          const universeId=String(process.env.UNIVERSE_ID||''),placeId=String(process.env.PLACE_ID||''),candidateVersionNumber=Number(process.env.VERSION_NUMBER||0);
          const queuePath='../runtime/development-queue.json';
          const q=JSON.parse(fs.readFileSync(queuePath,'utf8'));
          const item=(q.items||[]).find(row=>row.gameId===gameId);
          if(!item)throw new Error('ROBLOX_BLACKBOX_FINALIZE_GAME_MISSING:'+gameId);
          const candidate=item.robloxRuntimeCandidateEvidence||{};
          const exactCurrent=String(item.robloxSourceCommit||'')===sourceRevision&&String(item.robloxBuildArtifactIdentity||'')===artifactIdentity
            &&candidate.published===true&&candidate.validationOnly===true&&candidate.canonicalGameTarget===false
            &&candidate.sourceRevision===sourceRevision&&candidate.artifactIdentity===artifactIdentity
            &&String(candidate.universeId||'')===universeId&&String(candidate.placeId||'')===placeId&&Number(candidate.versionNumber||0)===candidateVersionNumber;
          if(!exactCurrent)throw new Error('ROBLOX_BLACKBOX_FINALIZE_EXACT_CANDIDATE_DRIFT:'+gameId);

          const evidencePath=path.resolve('../blackbox-evidence/evidence.json');
          const player=fs.existsSync(evidencePath)?JSON.parse(fs.readFileSync(evidencePath,'utf8').replace(/^\uFEFF/,'')):null;
          const hostInterrupted=!player;
          const stamp=new Date().toISOString();
          const sourceRoot='/tmp/roblox-blackbox-source/roblox-games/'+gameId;
          const files=[];
          const walk=dir=>{if(!fs.existsSync(dir))return;for(const ent of fs.readdirSync(dir,{withFileTypes:true})){const file=path.join(dir,ent.name);if(ent.isDirectory())walk(file);else if(/\.(?:lua|luau)$/i.test(ent.name))files.push(file);}};
          walk(sourceRoot);
          const serverSource=files.filter(file=>/\.server\.(?:lua|luau)$/i.test(file)).map(file=>fs.readFileSync(file,'utf8')).join('\n');
          const clientSource=files.filter(file=>/\.client\.(?:lua|luau)$/i.test(file)).map(file=>fs.readFileSync(file,'utf8')).join('\n');
          const allSource=files.map(file=>fs.readFileSync(file,'utf8')).join('\n');

          let sentinel=null,foundation=null,sentinelError=null;
          if(player?.pass===true){
            try{
              if(!process.env.ROBLOX_OPEN_CLOUD_API_KEY)throw new Error('ROBLOX_OPEN_CLOUD_API_KEY_MISSING');
              sentinel=await fetchRobloxRuntimeFoundationEvidence({universeId,apiKey:process.env.ROBLOX_OPEN_CLOUD_API_KEY});
              foundation=validateRobloxRuntimeFoundationEvidence({sentinel,gameId,placeId,versionNumber:candidateVersionNumber});
            }catch(error){sentinelError=String(error?.message||error);}
          }

          const multiplayerRequired=foundation?.requirements?.multiplayerRequired===true;
          const multiplayerSourceContract=validateRobloxMultiplayerSourceContract({serverSource,clientSource});
          const multiplayerPass=!multiplayerRequired||multiplayerSourceContract.passed===true;
          const assetRequired=item.robloxStudioAssetBindingApplied===true;
          const staticAssetBinding=/StudioAssets\s*=\s*\{/.test(allSource)&&/StudioAssetBindingVersion/.test(allSource)&&/(StudioAssetAtoms|hasStudioAssetAtom|hasStudioAtom)/.test(allSource);
          const assetRuntimePass=!assetRequired||(player?.pass===true&&player?.postInputScreenCaptured===true&&staticAssetBinding);
          const foundationPass=player?.pass===true&&foundation?.runtimeFoundationPassed===true&&foundation?.developmentContinuationPassed===true;
          const pass=foundationPass&&multiplayerPass&&assetRuntimePass;

          item.robloxPlayerBlackBoxSession={...(item.robloxPlayerBlackBoxSession||{}),version:1,sessionId:process.env.SESSION_ID,sourceRevision,artifactIdentity,candidateVersionNumber,status:hostInterrupted?'INTERRUPTED_RETRY_PENDING':pass?'PASS':'FAIL',completedAt:stamp,rebootSafeCheckpoint:true,hostStateAuthoritative:false,companyRuntimeAuthoritative:true};
          item.robloxPlayerBlackBoxEvidence=player?{...player,exactSourceRevision:sourceRevision,exactArtifactIdentity:artifactIdentity,exactCandidateVersionNumber:candidateVersionNumber,sentinelObserved:sentinel!==null,sentinelError,foundation,multiplayerRequired,multiplayerSourceContract,multiplayerPass,assetBindingRequired:assetRequired,assetStaticBinding:staticAssetBinding,assetRuntimePass,finalPass:pass,verifiedAt:stamp}:null;

          if(hostInterrupted){
            item.robloxPlayerBlackBoxHostRetryRequired=true;
            item.robloxPlayerBlackBoxInterruptedAt=stamp;
            item.routingBlockers=['roblox-player-blackbox-host-interrupted-retry'];
            fs.writeFileSync('/tmp/roblox-blackbox-finalize.json',JSON.stringify({gameId,pass:false,retryHost:true,hostInterrupted:true},null,2)+'\n');
          }else if(pass){
            const runtimeEvidence={...foundation,version:4,gameId,sourceRevision,artifactIdentity,artifactRunId:Number(item.robloxFoundationF0Evidence?.artifactRunId||0),universeId,placeId,candidateVersionNumber,actualRuntimeEvidence:true,actualPlayerRuntime:true,exactPrivateValidationTarget:true,playerBlackBoxSessionId:process.env.SESSION_ID,playerBlackBoxEvidence:item.robloxPlayerBlackBoxEvidence,f7MultiplayerSourceContractPassed:multiplayerPass,multiplayerSourceContract,studioUsed:false,browserUsed:false,singleRuntimeSession:true,runtimeReplayForF9Required:false,authority:'roblox-player-exact-private-black-box-v1',observedAt:stamp};
            item.robloxRuntimeFoundationEvidence=runtimeEvidence;
            item.robloxRuntimeEvidence={...runtimeEvidence,runtimePassed:true};
            item.robloxRuntimeFoundationPassed=true;item.robloxRuntimePassed=true;item.robloxRuntimePassedAt=stamp;item.robloxRuntimeFailedAt=null;
            item.robloxServerClientBoundaryPassed=foundation.f6CoreServicesPassed===true;item.robloxDatastoreRejoinPassed=foundation.f6CoreServicesPassed===true;item.robloxMobileControlUiPassed=foundation.f5InputCameraUiPassed===true;item.robloxMultiplayerQaPassed=multiplayerPass;
            item.robloxIndependentQaPassed=true;item.robloxIndependentQaPassedAt=stamp;item.robloxRegressionPassed=true;item.robloxRegressionPassedAt=stamp;
            item.robloxStudioAssetRuntimeBindingPassed=assetRuntimePass;
            item.robloxStudioAssetRuntimeBindingEvidence=assetRequired?{version:2,gameId,sourceRevision,artifactIdentity,candidateVersionNumber,actualPlatformRuntime:true,actualPlayerRuntime:true,staticExactSourceBinding:staticAssetBinding,runtimeScreenObserved:player.postInputScreenCaptured===true,marker:assetRuntimePass?'ROBLOX_PLAYER_ASSET_RUNTIME_BINDING_PASS':'ROBLOX_PLAYER_ASSET_RUNTIME_BINDING_PENDING',authority:'roblox-player-black-box-asset-binding-v1',verifiedAt:assetRuntimePass?stamp:null}:null;
            item.robloxPostRuntimeQaEvidence={version:6,gameId,sourceRevision,artifactIdentity,artifactRunId:Number(item.robloxFoundationF0Evidence?.artifactRunId||0),candidateVersionNumber,runtimeFoundationEvidence:runtimeEvidence,exactRevision:true,independentQaPassed:true,regressionPassed:true,actualRuntimeEvidence:true,actualPlayerRuntime:true,playerBlackBoxPassed:true,studioUsed:false,officialStudioMcpActualPlayPassed:false,internalStudioValidationOnly:false,studioAssetBindingRequired:assetRequired,studioAssetRuntimeBindingPassed:assetRuntimePass,studioAssetRuntimeBindingEvidence:item.robloxStudioAssetRuntimeBindingEvidence,f9RuntimeReplayRequired:false,authority:'roblox-player-black-box-independent-qa-v1',verifiedAt:stamp};
            item.robloxPlayerBlackBoxHostRetryRequired=false;item.currentStep='ROBLOX_FINAL_REVIEW_REVALIDATION';item.canonicalState='ROBLOX_RUNTIME_ACCEPTANCE_PASSED';item.robloxLastSuccessfulStage='TARGET_PLATFORM_REGRESSION';item.robloxFailureStage='ROBLOX_FINAL_REVIEW_REVALIDATION';item.robloxFailureSignature='ROBLOX_FINAL_REVIEW_PENDING';item.routingBlockers=['roblox-final-review-pending'];
            if(item.executionEvidence){item.executionEvidence.lastSuccessfulStage='TARGET_PLATFORM_REGRESSION';item.executionEvidence.runtimePassed=true;item.executionEvidence.independentQaPassed=true;item.executionEvidence.regressionPassed=true;item.executionEvidence.failureStage=null;item.executionEvidence.failureSignature=null;}
            fs.writeFileSync('/tmp/roblox-blackbox-finalize.json',JSON.stringify({gameId,pass:true,retryHost:false,hostInterrupted:false},null,2)+'\n');
          }else{
            item.robloxPlayerBlackBoxHostRetryRequired=false;item.robloxRuntimeFoundationPassed=false;item.robloxRuntimePassed=false;item.robloxRuntimeFailedAt=stamp;item.robloxIndependentQaPassed=false;item.robloxRegressionPassed=false;item.currentStep='TARGET_PLATFORM_TECHNICAL_VALIDATION';item.canonicalState='TARGET_PLATFORM_REPAIR_REQUIRED';item.robloxFailureStage='TARGET_PLATFORM_RUNTIME_FOUNDATION';
            item.robloxFailureSignature=sentinelError?'ROBLOX_PLAYER_BLACK_BOX_SENTINEL_UNAVAILABLE':player?.pass!==true?'ROBLOX_PLAYER_BLACK_BOX_RUNTIME_FAILED':!multiplayerPass?'ROBLOX_MULTIPLAYER_CODE_CONTRACT_FAILED':!assetRuntimePass?'ROBLOX_PLAYER_ASSET_RUNTIME_BINDING_FAILED':'ROBLOX_PLAYER_BLACK_BOX_FOUNDATION_FAILED';
            item.routingBlockers=sentinelError?['roblox-runtime-sentinel-unavailable-after-actual-player']:Array.isArray(foundation?.blockers)&&foundation.blockers.length?foundation.blockers.map(value=>'roblox-runtime-'+String(value).toLowerCase().replace(/[^a-z0-9]+/g,'-')):[item.robloxFailureSignature.toLowerCase().replace(/_/g,'-')];
            fs.writeFileSync('/tmp/roblox-blackbox-finalize.json',JSON.stringify({gameId,pass:false,retryHost:false,hostInterrupted:false,failureSignature:item.robloxFailureSignature},null,2)+'\n');
          }
          item.updatedAt=stamp;q.updatedAt=stamp;
          fs.writeFileSync(queuePath,JSON.stringify(q,null,2)+'\n');
          console.log('ROBLOX_PLAYER_BLACK_BOX_FINAL='+fs.readFileSync('/tmp/roblox-blackbox-finalize.json','utf8').trim());
          NODE

      - name: Persist result on company-runtime
        working-directory: runtime
        env:
          GAME_ID: ${{ inputs.game_id }}
        shell: bash
        run: |
          set -euo pipefail
          cp development-queue.json /tmp/roblox-blackbox-updated-queue.json
          git config user.name 'jaewoon-roblox-player-blackbox'
          git config user.email 'actions@users.noreply.github.com'
          persisted=0
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin "$COMPANY_RUNTIME_BRANCH"
            git reset --hard "origin/$COMPANY_RUNTIME_BRANCH"
            cp /tmp/roblox-blackbox-updated-queue.json development-queue.json
            git add development-queue.json
            git diff --cached --check
            if git diff --cached --quiet; then persisted=1; break; fi
            git commit -m "runtime: persist Roblox Player blackbox $GAME_ID [skip ci]"
            if git push origin HEAD:"$COMPANY_RUNTIME_BRANCH"; then persisted=1; break; fi
            sleep $((attempt*2))
          done
          test "$persisted" = '1'

      - name: Dispatch F9 after exact black-box PASS
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pass="$(node -e "const x=require('/tmp/roblox-blackbox-finalize.json');process.stdout.write(x.pass?'true':'false')")"
          if [ "$pass" = 'true' ]; then
            gh workflow run company-development-roblox-final-review-revalidation.yml --repo "$GITHUB_REPOSITORY" --ref main -f game_id="${{ inputs.game_id }}"
            echo "ROBLOX_PLAYER_BLACK_BOX_F9_DISPATCH=${{ inputs.game_id }}"
          else
            echo 'ROBLOX_PLAYER_BLACK_BOX_F9_DISPATCH=NO'
          fi

      - name: Requeue only when the PC session disappeared before evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          retry="$(node -e "const x=require('/tmp/roblox-blackbox-finalize.json');process.stdout.write(x.retryHost?'true':'false')")"
          if [ "$retry" = 'true' ]; then
            gh workflow run company-development-roblox-player-blackbox.yml --repo "$GITHUB_REPOSITORY" --ref main -f game_id="${{ inputs.game_id }}"
            echo "ROBLOX_PLAYER_BLACK_BOX_REBOOT_REQUEUE=YES:${{ inputs.game_id }}"
          else
            echo 'ROBLOX_PLAYER_BLACK_BOX_REBOOT_REQUEUE=NO'
          fi
