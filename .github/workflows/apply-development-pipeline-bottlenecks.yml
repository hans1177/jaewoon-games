name: Apply Development Pipeline Bottlenecks

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply-development-pipeline-bottlenecks.mjs'
      - '.github/workflows/apply-development-pipeline-bottlenecks.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-development-pipeline-bottlenecks
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply pipeline bottleneck policy and runtime wiring
        run: node tools/apply-development-pipeline-bottlenecks.mjs
      - name: Validate lifecycle and bottleneck contracts
        run: |
          node --test qa/game-lifecycle-sync-policy.test.mjs
          node --test qa/development-pipeline-bottleneck.test.mjs
      - name: Syntax check modified runtime tools
        run: |
          node --check tools/company-status-sync.mjs
          node --check tools/vibe2-auto-planner.mjs
      - name: Commit applied policy
        run: |
          if git diff --quiet -- COMPANY_FLOW.md tools/company-status-sync.mjs tools/vibe2-auto-planner.mjs qa/development-pipeline-bottleneck.test.mjs; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add COMPANY_FLOW.md tools/company-status-sync.mjs tools/vibe2-auto-planner.mjs qa/development-pipeline-bottleneck.test.mjs
          git commit -m 'company: resolve development pipeline bottlenecks'
          git push origin main
