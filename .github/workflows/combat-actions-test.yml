name: Combat Actions Test

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test combat actions and session restore
        run: |
          rm -rf /tmp/jaewoon-actions
          mkdir -p /tmp/jaewoon-actions
          cp assets/combat-actions.js assets/targeting-system.js assets/combat-vitals.js assets/status-effects.js \
             assets/game-session.js assets/resource-gathering.js assets/day-night-cycle.js assets/wave-spawner.js \
             assets/game-timers.js assets/state-machine.js assets/scene-flow.js assets/input-actions.js assets/game-loop.js \
             assets/vibe-runtime.js assets/game-blueprint.js assets/game-presets.js assets/game-kit.js \
             assets/d20-rules.js assets/turn-combat.js assets/character-progression.js assets/inventory-equipment.js \
             assets/quest-dialogue.js assets/skill-effects.js assets/economy-loot-shop.js assets/save-versioning.js \
             assets/stat-modifiers.js assets/crafting-recipes.js assets/achievements-unlocks.js /tmp/jaewoon-actions/
          printf '{"type":"module"}\n' > /tmp/jaewoon-actions/package.json
          cd /tmp/jaewoon-actions
          node --check combat-actions.js
          node --check game-session.js
          node --input-type=module <<'NODE'
          import { JaewoonCombatActions } from './combat-actions.js';
          import { JaewoonTargetingSystem } from './targeting-system.js';
          import { JaewoonCombatVitals } from './combat-vitals.js';
          import { JaewoonStatusEffects } from './status-effects.js';
          import { createGameSession } from './game-session.js';
          import { buildGamePreset } from './game-presets.js';

          const targeting = new JaewoonTargetingSystem({ entities: [
            { id: 'hero', team: 'ally', x: 0, y: 0, hp: 100, maxHp: 100 },
            { id: 'enemy', team: 'enemy', x: 3, y: 4, hp: 100, maxHp: 100 },
            { id: 'friend', team: 'ally', x: 1, y: 0, hp: 100, maxHp: 100 },
          ] });
          const vitals = new JaewoonCombatVitals({ entities: [
            { id: 'hero', hp: 100, maxHp: 100 },
            { id: 'enemy', hp: 100, maxHp: 100 },
            { id: 'friend', hp: 100, maxHp: 100 },
          ] });
          const statuses = new JaewoonStatusEffects();
          const rolls = [0, 0, 0];
          const actions = new JaewoonCombatActions({ targeting, combatVitals: vitals, statusEffects: statuses, rng: () => rolls.shift() ?? 0 });
          actions.register({ id: 'slash', damage: 10, range: 5, cooldown: 2, criticalChance: 1, criticalMultiplier: 2, statusEffects: [{ id: 'bleed', duration: 3, tickInterval: 1, magnitude: 2, chance: 1 }] });
          let result = actions.use('hero', 'slash', 'enemy');
          if (!result.ok || !result.critical || vitals.get('enemy').hp !== 80 || !statuses.has('enemy', 'bleed')) throw new Error('combat action hit failed');
          if (actions.use('hero', 'slash', 'enemy').reason !== 'cooldown') throw new Error('combat action cooldown failed');
          actions.update(2);
          if (actions.cooldownRemaining('hero', 'slash') !== 0) throw new Error('combat action cooldown tick failed');
          if (actions.use('hero', 'slash', 'friend').reason !== 'friendly-fire-blocked') throw new Error('friendly fire failed');
          targeting.setPosition('enemy', 20, 0);
          if (actions.use('hero', 'slash', 'enemy').reason !== 'out-of-range') throw new Error('range check failed');

          const storage = new Map();
          globalThis.localStorage = {
            getItem: (key) => storage.has(key) ? storage.get(key) : null,
            setItem: (key, value) => storage.set(key, String(value)),
            removeItem: (key) => storage.delete(key),
          };
          const options = {
            gameId: 'combat-action-session', genre: 'action', autoRestore: false,
            combatActionOptions: { actions: [{ id: 'shot', damage: 15, range: 10, cooldown: 3 }], rng: () => 0 },
          };
          const session = createGameSession(options);
          session.registerCombatEntity({ id: 'player', hp: 100, maxHp: 100 });
          session.registerCombatEntity({ id: 'goblin', hp: 40, maxHp: 40 });
          session.registerTargetEntity({ id: 'player', team: 'ally', x: 0, y: 0, hp: 100, maxHp: 100 });
          session.registerTargetEntity({ id: 'goblin', team: 'enemy', x: 4, y: 0, hp: 40, maxHp: 40 });
          result = session.useCombatAction('player', 'shot', 'goblin');
          if (!result.ok || session.combatVitals.get('goblin').hp !== 25 || session.targeting.get('goblin').hp !== 25) throw new Error('session combat action failed');
          session.updateCombatActions(1);
          session.save();
          const restored = createGameSession({ ...options, autoRestore: true });
          if (restored.combatActions.cooldownRemaining('player', 'shot') !== 2) throw new Error('combat action save restore failed');
          restored.destroy();

          const actionPreset = buildGamePreset({ genre: 'action' });
          const defensePreset = buildGamePreset({ genre: 'defense' });
          const puzzlePreset = buildGamePreset({ genre: 'puzzle' });
          if (!actionPreset.systems.includes('combat-actions') || !defensePreset.systems.includes('combat-actions')) throw new Error('combat action preset missing');
          if (puzzlePreset.systems.includes('combat-actions')) throw new Error('puzzle should not force combat actions');
          console.log('PASS combat actions');
          NODE
