name: Free Budget Telemetry QA

on:
  push:
    branches: [main]
    paths:
      - 'tools/free-budget-telemetry.mjs'
      - 'qa/free-budget-telemetry.test.mjs'
      - 'tools/company-bridge-export.mjs'
      - 'qa/company-bridge-export.test.mjs'
      - 'tools/company-game-seed-bootstrap.mjs'
      - '.github/workflows/company-game-seed-bootstrap.yml'
      - '.github/workflows/free-budget-telemetry-qa.yml'
  pull_request:
    paths:
      - 'tools/free-budget-telemetry.mjs'
      - 'qa/free-budget-telemetry.test.mjs'
      - 'tools/company-bridge-export.mjs'
      - 'qa/company-bridge-export.test.mjs'
      - 'tools/company-game-seed-bootstrap.mjs'
      - '.github/workflows/company-game-seed-bootstrap.yml'
      - '.github/workflows/free-budget-telemetry-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verified-free-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deterministic telemetry and bridge tests
        run: |
          node --check tools/free-budget-telemetry.mjs
          node --check tools/company-game-seed-bootstrap.mjs
          node --test qa/free-budget-telemetry.test.mjs
          node --test qa/company-bridge-export.test.mjs
      - name: Live public-repository free-budget verification
        shell: bash
        run: |
          set -euo pipefail
          node tools/free-budget-telemetry.mjs \
            --verify-public-repo=true \
            --runner=ubuntu-latest \
            --model-calls=1 \
            --runner-minutes=20 \
            --output=/tmp/free-budget-live.json
          node <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/free-budget-live.json','utf8'));
          const actions=d.providers.find(x=>x.providerId==='GITHUB_PUBLIC_STANDARD');
          const authoritativeVisibilitySources=new Set(['GITHUB_REPO_API','GITHUB_EVENT_PAYLOAD']);
          if(d.allowed!==true)throw new Error('free budget live gate not allowed');
          if(d.execution.visibility!=='public'||!authoritativeVisibilitySources.has(d.execution.visibilitySource))throw new Error('public visibility was not authoritatively verified');
          if(actions?.quotaMode!=='UNMETERED_FREE'||actions?.status!=='AVAILABLE')throw new Error('public standard runner not classified as unmetered free');
          if(actions?.visibility!=='public'||actions?.visibilitySource!==d.execution.visibilitySource)throw new Error('runner evidence is not bound to verified public repository visibility');
          console.log(`LIVE_FREE_BUDGET=PASS source=${d.execution.visibilitySource}`);
          NODE
      - name: Enforce preflight-before-Ollama contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const file='.github/workflows/company-game-seed-bootstrap.yml';
          const text=fs.readFileSync(file,'utf8');
          const gate=text.indexOf('Verified free budget preflight');
          const runtime=text.indexOf('uses: ./.github/actions/prepare-ollama');
          if(gate<0||runtime<0||gate>runtime)throw new Error(`${file}: free budget gate must precede Ollama runtime preparation`);
          if(!text.includes('runs-on: ubuntu-latest'))throw new Error(`${file}: standard runner contract missing`);
          if(!text.includes('--runner-minutes=20'))throw new Error(`${file}: verified free-budget runner-minute contract missing`);
          if(!text.includes('--verify-public-repo=true'))throw new Error(`${file}: live repository verification missing`);
          if(!text.includes('--model-calls=1'))throw new Error('GAME_SEED bootstrap must declare its one batch model call');
          const seedTool=fs.readFileSync('tools/company-game-seed-bootstrap.mjs','utf8');
          if(!seedTool.includes('callModelBatch(targets)'))throw new Error('GAME_SEED bootstrap must batch seed generation');
          console.log('CENTRAL_FREE_BUDGET_CONTRACT=PASS');
          NODE
