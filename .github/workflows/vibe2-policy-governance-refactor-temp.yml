name: Vibe2 Policy Governance Refactor Temp

on:
  push:
    branches:
      - 'feat/vibe2-auto-state-policy-approval'
    paths:
      - '.github/workflows/vibe2-policy-governance-refactor-temp.yml'
      - 'tools/vibe2-policy-governance-refactor-temp.py'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vibe2-auto-state-policy-approval
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply central policy governance contract
        run: python tools/vibe2-policy-governance-refactor-temp.py

      - name: Verify machine-state governance
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/vibe2-handoff.mjs
          node --check qa/vibe2-handoff.test.mjs
          node --check qa/vibe2-controller-contract.test.mjs
          node tools/vibe2-handoff.mjs --check --output=/tmp/vibe2-handoff.json >/tmp/vibe2-handoff.log
          node --test qa/vibe2-handoff.test.mjs
          node --test qa/vibe2-controller-contract.test.mjs
          node --test qa/vibe2-auto-planner.test.mjs
          node --test qa/vibe2-queue-control.test.mjs
          git diff --check

      - name: Commit verified product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-vibe2-core'
          git config user.email 'vibe2-core@users.noreply.github.com'
          git add vibe2-runtime.json VIBE2.md tools/vibe2-handoff.mjs qa/vibe2-handoff.test.mjs qa/vibe2-controller-contract.test.mjs
          git commit -m 'vibe2: enforce automatic state refresh with policy approval gate'
          git push origin HEAD:feat/vibe2-auto-state-policy-approval
