                if [[ -n "$sha" ]] || ! grep -Fq 'HTTP 404' "$read_error"; then
                  echo "MARE_ASSET_READ_RETRY $attempt $f" >&2
                  if [[ "$attempt" -lt 5 ]]; then sleep "$((attempt * 3))"; fi
                  continue
                fi
              elif [[ ! "$saved_blob" =~ ^[0-9a-f]{40}$ ]]; then
                saved_blob=""
                echo "MARE_ASSET_READ_INVALID_SHA $attempt $f" >&2
                if [[ "$attempt" -lt 5 ]]; then sleep "$((attempt * 3))"; fi
                continue
              fi
              [[ "$saved_blob" == "$expected_blob" ]] && break
              if [[ "$saved_blob" != "$sha" ]]; then
                rm -f "$payload" "$read_error"
                echo "::error::MARE_ASSET_CONCURRENT_WRITE:$f" >&2
                exit 1
              fi
              [[ "$attempt" -lt 5 ]] || break
              if ! gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/${f}" --input "$payload" > /dev/null; then
                echo "MARE_ASSET_WRITE_RESPONSE_ERROR $attempt $f" >&2
                sleep "$((attempt * 3))"
              fi
            done
            rm -f "$payload" "$read_error"
            if [[ "$saved_blob" != "$expected_blob" ]]; then
              echo "::error::MARE_ASSET_WRITE_NOT_VERIFIED:$f" >&2
              exit 1
            fi
            echo "COMMITTED $f"
          done
          # [등록 완료 정리] 원본·라이선스·등록 ID 반영 후에만 동일 inbox 파일을 제거한다.
          for f in "${london_files[@]}"; do
            if [[ "$f" == */assets/terrain/veg_* ]]; then
              src="roblox-games/mare-essentia/assets/inbox/Terrain/${f##*/}"
            else
              src="roblox-games/mare-essentia/assets/inbox/Town/${f##*/}"
            fi
            original="$(git rev-parse "HEAD:$src")"
            current="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${src}?ref=main" --jq .sha)"
            saved="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${f}?ref=main" --jq .sha)"
            [[ "$current" == "$original" && "$saved" == "$(git hash-object "$f")" ]] || exit 1
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/contents/${src}" -f message="Mare Essentia: remove registered London inbox copy" -f sha="$current" -f branch=main --silent
          done
          # 정상 건축·식생은 위에서 저장했다. 미등록 원본은 보존하고 전체 완료로 표시하지 않는다.
          if [[ "${MARE_LONDON_SOURCE_OUTCOME}" == "success" ]] && { [[ -s "$pending_london" ]] || compgen -G 'roblox-games/mare-essentia/assets/inbox/Town/london_*.glb' >/dev/null; }; then
            echo "::error::MARE_LONDON_REGISTRATION_PARTIAL"
            exit 1
          fi
          if [[ "${MARE_LONDON_SOURCE_OUTCOME}" == "success" ]] && { [[ -s "$pending_vegetation" ]] || compgen -G 'roblox-games/mare-essentia/assets/inbox/Terrain/veg_*.glb' >/dev/null; }; then
            echo "::error::MARE_VEGETATION_REGISTRATION_PARTIAL"
            exit 1
          fi

          # [정기 등록 후 게시] 원본 확보·렌더 장부만 바뀐 경우에는 게시하지 않는다.
          # 등록 성공과 현재 main의 두 실제 등록 파일 일치가 모두 확인된 경우만 후속 게시를 요청한다.
          registry=roblox-games/mare-essentia/assets-registered.json
          ids=roblox-games/mare-essentia/src/ReplicatedStorage/Shared/AssetIds.luau
          changed=false
          if [[ "$MARE_ASSET_OUTCOME" == "success" ]] && ! git diff --quiet HEAD -- "$registry" "$ids"; then
            for f in "$registry" "$ids"; do
              actual="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${f}?ref=main" --jq .sha)"
              expected="$(git hash-object "$f")"
              if [[ "$actual" != "$expected" ]]; then
                echo "::error::MARE_ASSET_PUBLISH_HANDOFF_NOT_VERIFIED:$f"
                exit 1
              fi
            done
            changed=true
          fi
          echo "registered_change=$changed" >> "$GITHUB_OUTPUT"
          echo "MARE_REGISTERED_CHANGE_VERIFIED=$changed"

      - name: Publish the place with the new asset IDs
        if: ${{ success() && inputs.studio_regrant != true && (inputs.publish_after_register == true || ((env.MARE_MODELS_ONLY == 'true' || steps.card_recovery.outputs.pending == 'true') && steps.asset_registration.outcome == 'success' && steps.registered_commit.outputs.registered_change == 'true')) }}
        env:
          GH_TOKEN: ${{ github.token }}
          MARE_PUBLISH_UNIVERSE: ${{ inputs.universe_id || '10775310508' }}
        run: |
          set -euo pipefail
          gh workflow run owner-mare-essentia-direct-publish.yml --ref main -f universe_id="$MARE_PUBLISH_UNIVERSE"
          # [증거 분리] 게시 요청은 실제 게시 성공 또는 게임 배치/Studio 통과가 아니다.
          echo "MARE_ASSET_PUBLISH_REQUESTED=YES"
