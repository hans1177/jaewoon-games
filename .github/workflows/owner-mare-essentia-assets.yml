# 파일명: .github/workflows/owner-mare-essentia-assets.yml
# Mare Essentia: CC0 모델과 CC BY 3.0 메뉴 그림을 기존 Open Cloud 등록 통로로 등록한다.
# main 자산 변경·정기·수동 등록. 정기 실행은 검증된 등록 변경이 실제 main에 반영될 때만 기존 게시기로 연결한다.
name: Owner Mare Essentia Register Assets
run-name: Owner Mare Essentia assets · ${{ github.sha }}${{ inputs.scheduled_recovery == true && ' · periodic' || '' }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/owner-mare-essentia-assets.yml'
      - 'roblox-games/mare-essentia/assets/**'
      - 'roblox-games/mare-essentia/assets-wanted.seed.json'
      - 'tools/devloop/assets_wanted.py'
      - 'tools/vibe_mesh_audit.py'
      - 'tools/devloop/register_asset.py'
      - 'qa/company-roblox-dedicated-experience.test.mjs'
      - 'tools/mare-essentia-upload-assets.mjs'
      - 'tools/mare-essentia-character-finish.mjs'
      - 'tools/mare-essentia-ship-v5.py'
  # [동물 원본] 5분마다 동물·항구·해전·지상전 원본을 기존 절차에서 찾는다.
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:
    inputs:
      universe_id:
        description: 'Universe ID (사용 권한을 줄 체험)'
        type: string
        required: false
        default: '10775310508'
      studio_regrant:
        description: '실제 Studio 실패 보고서의 미디어만 권한 재검증(원본 재업로드 금지)'
        type: boolean
        required: false
        default: false
      register_v5:
        description: '선박 36척 V5 고품질·모바일 72개 신규 자산 등록'
        type: boolean
        required: false
        default: false
      upgrade_cargo_quality:
        description: '검증된 3D 교역품 8종을 기존 원본 등록 경로로 재생성'
        type: boolean
        required: false
        default: false
      animal_preview:
        description: '기존 무료 동물 원본 렌더링 검사 즉시 실행 (승인 아님)'
        type: boolean
        required: false
        default: false
      scheduled_recovery:
        description: '기존 무료 연습 체인의 정기 누락 복구 (정기 모델 검사와 동일)'
        type: boolean
        required: false
        default: false
      publish_after_register:
        description: '자산 등록 확인 후 게시까지 할지 (기본: 게시 안 함)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: write
  pull-requests: write

# [정체 복구] 평소에는 중단 없이 순차 등록한다. 저장소 체크아웃이 멈춘 경우만
# 명시된 복구 커밋에서 기존 실행을 종료하고 최신 메인의 동일 정식 등록기로 재개한다.
concurrency:
  group: owner-mare-essentia-assets
  cancel-in-progress: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[mare-recover-stalled-run]') }}

jobs:
  register:
    if: ${{ inputs.scheduled_recovery != true || (inputs.studio_regrant != true && inputs.register_v5 != true && inputs.upgrade_cargo_quality != true && inputs.publish_after_register != true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      MARE_MODELS_ONLY: ${{ github.event_name == 'schedule' || inputs.scheduled_recovery == true }}
      MARE_ANIMAL_PREVIEW: ${{ github.event_name == 'schedule' || inputs.scheduled_recovery == true || (github.event_name == 'push' && contains(github.event.head_commit.message, '[mare-animal-preview]')) || (github.event_name == 'workflow_dispatch' && inputs.animal_preview == true && inputs.studio_regrant != true) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          lfs: false
          # [대용량 저장소] 게임 원본과 등록 코드만 가져와 빌드 시간을 단축한다.
          # 기존 등록기·QA·메인 자산 승격 절차 및 권한 검사는 그대로 사용한다.
          filter: blob:none
          sparse-checkout: |
            .github/workflows
            company-learning
            tools
            qa
            roblox-games/mare-essentia

      - uses: actions/setup-node@v4
        with:
          node-version: '20'


      # [드롭박스 원화 인입] 검수 완료된 원본만 기존 승인표와 함께 후보 브랜치에 보관한다.
      # 활성 승인·main·기존 Roblox 번호는 직접 바꾸지 않는다. 기존 PR 검사를 통과해야 등록한다.
      - name: Stage reviewed Dropbox original in existing card transfer lane
        id: dropbox_stage
        if: ${{ inputs.studio_regrant != true }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # 후보가 없으면 외부 인증 및 네트워크 접근을 하지 않는다.
          python3 - <<'PYDROPBOX'
          import base64, hashlib, json, os, pathlib, re, struct, subprocess
          import urllib.request, urllib.parse, urllib.error
          root = pathlib.Path('roblox-games/mare-essentia')
          manifest = root/'assets/APPROVED_IMAGES.json'
          doc = json.loads(manifest.read_text(encoding='utf-8'))
          pending = doc.get('dropboxPending', {})
          if not pending:
              print('CARD_DROPBOX_NO_REVIEWED_CANDIDATE')
              raise SystemExit(0)
          if not isinstance(pending, dict):
              raise SystemExit('CARD_DROPBOX_PENDING_INVALID')
          # 중앙 검증기는 기존 책임 파일을 그대로 실행한다.
          safe_env = {k:v for k,v in os.environ.items() if not k.startswith('DROPBOX_')}
          subprocess.run(['node','tools/company-shared-context.mjs'], env=safe_env, check=True)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          def request(url, headers, data, limit):
              try:
                  with opener.open(urllib.request.Request(url, data=data, headers=headers, method='POST'), timeout=45) as response:
                      result = response.read(limit+1)
                  if len(result)>limit:
                      raise SystemExit('CARD_DROPBOX_RESPONSE_LIMIT')
                  return result
              except urllib.error.HTTPError as exc:
                  raise SystemExit('CARD_DROPBOX_HTTP_'+str(exc.code)) from None
              except (urllib.error.URLError, TimeoutError):
                  raise SystemExit('CARD_DROPBOX_NETWORK_ERROR') from None
          def gh(endpoint, payload):
              result = subprocess.run(['gh','api','--method','POST','repos/'+os.environ['GITHUB_REPOSITORY']+'/'+endpoint,'--input','-','--jq','.sha // .object.sha // empty'],input=json.dumps(payload),text=True,capture_output=True,env=safe_env)
              if result.returncode:
                  raise SystemExit('CARD_DROPBOX_GIT_OBJECT_WRITE_FAILED:'+endpoint)
              return result.stdout.strip()
          registry = json.loads((root/'assets-registered.json').read_text(encoding='utf-8'))['assets']
          checks = ['subjectMatch','historicalContext','houseStyle','singleFinishedScene','noPartsOrSprites','robloxSafety','commercialRights']
          for card, candidate in sorted(pending.items()):
              match = re.fullmatch(r'CardArt/((?:eu|ea|me|nw|af|sa)_(?:0[1-9]|[1-4][0-9]))',card)
              if not match:
                  raise SystemExit('CARD_DROPBOX_ID_INVALID')
              name = match.group(1)
              relative = 'assets/cardart/src/'+name+'-original.png'
              review = candidate['review']
              digest = review['sourceSha256']
              previous = registry.get(card,{})
              if not re.fullmatch(r'[a-f0-9]{64}',digest) or review.get('sourceFile')!=relative or review.get('sourceType')!='IMAGE_GENERATION_MODEL' or review.get('reviewer')!='VIBE_AGENT_VISUAL_REVIEW' or review.get('license')!='PROJECT_ORIGINAL_ART' or not re.fullmatch(r'\d{4}-\d{2}-\d{2}',review.get('reviewedAt','')) or not all(review.get(k) is True for k in checks):
                  raise SystemExit('CARD_DROPBOX_REVIEW_INVALID:'+card)
              if doc['approved'].get(card)==digest:
                  print('CARD_DROPBOX_ALREADY_APPROVED',card)
                  continue
              if previous.get('sourceSha256')!=review.get('replacesSha256') or doc['approved'].get(card)!=review.get('replacesSha256') or str(previous.get('assetId'))!=str(review.get('replacesAssetId')) or previous.get('assetType')!='Image' or previous.get('usePermissionGranted') is not True:
                  raise SystemExit('CARD_DROPBOX_REPLACEMENT_STALE:'+card)
              target = root/'assets/cardart'/ (name+'.png')
              if hashlib.sha256(target.read_bytes()).hexdigest()!=review['replacesSha256']:
                  raise SystemExit('CARD_DROPBOX_REGISTERED_BYTES_CHANGED:'+card)
              branch = 'mare-dropbox-card-'+name+'-'+digest[:12]
              remote = subprocess.run(['git','ls-remote','--exit-code','--heads','origin','refs/heads/'+branch],capture_output=True,env=safe_env)
              if remote.returncode == 0:
                  print('CARD_DROPBOX_CANDIDATE_EXISTS',card,branch)
                  with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('branch='+branch+'\n')
                  break
              if remote.returncode != 2:
                  raise SystemExit('CARD_DROPBOX_REF_CHECK_FAILED')
              keys = [os.environ.get(k,'') for k in ('DROPBOX_APP_KEY','DROPBOX_APP_SECRET','DROPBOX_REFRESH_TOKEN')]
              if not all(keys):
                  raise SystemExit('CARD_DROPBOX_AUTH_NOT_CONFIGURED')
              basic = base64.b64encode((keys[0]+':'+keys[1]).encode()).decode()
              grant = urllib.parse.urlencode({'grant_type':'refresh_token','refresh_token':keys[2]}).encode()
              token = json.loads(request('https://api.dropboxapi.com/oauth2/token',{'Authorization':'Basic '+basic,'Content-Type':'application/x-www-form-urlencoded'},grant,65536)).get('access_token')
              if not token:
                  raise SystemExit('CARD_DROPBOX_ACCESS_TOKEN_MISSING')
              arg = json.dumps({'path':'/Vibe2Transfer/'+name+'-original.png'})
              raw = request('https://content.dropboxapi.com/2/files/download',{'Authorization':'Bearer '+token,'Dropbox-API-Arg':arg},None,20*1024*1024)
              if len(raw)!=candidate['bytes'] or len(raw)<50000 or hashlib.sha256(raw).hexdigest()!=digest:
                  raise SystemExit('CARD_DROPBOX_ORIGINAL_HASH_OR_SIZE_MISMATCH:'+card)
              if raw[:8]!=b'\x89PNG\r\n\x1a\n' or raw[12:16]!=b'IHDR' or raw[24]!=8 or raw[25] not in (2,6):
                  raise SystemExit('CARD_DROPBOX_RGB_PNG_REQUIRED:'+card)
              width,height=struct.unpack('>II',raw[16:24])
              if (width,height)!=(candidate['width'],candidate['height']) or width<1049 or height<1499 or width>4096 or height>4096 or abs(width*10-height*7)>height*0.05:
                  raise SystemExit('CARD_DROPBOX_DIMENSIONS_INVALID:'+card)
              # SHA로 고정된 실물과 승인 변경만 같은 후보 커밋에 저장한다.
              blob = gh('git/blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})
              if blob!=hashlib.sha1(('blob '+str(len(raw))+'\0').encode()+raw).hexdigest():
                  raise SystemExit('CARD_DROPBOX_GIT_BLOB_MISMATCH')
              doc['approved'][card]=digest
              doc['modelOriginals'][card]=review
              del doc['dropboxPending'][card]
              if not doc['dropboxPending']:
                  del doc['dropboxPending']
              base = subprocess.check_output(['git','rev-parse','HEAD'],text=True,env=safe_env).strip()
              tree = subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True,env=safe_env).strip()
              candidate_tree=gh('git/trees',{'base_tree':tree,'tree':[
                  {'path':str(root/relative),'mode':'100644','type':'blob','sha':blob},
                  {'path':str(manifest),'mode':'100644','type':'blob','content':json.dumps(doc,ensure_ascii=False,indent=2)+'\n'}]})
              commit=gh('git/commits',{'message':'Mare Essentia: verified Dropbox original '+name,'tree':candidate_tree,'parents':[base]})
              ref=gh('git/refs',{'ref':'refs/heads/'+branch,'sha':commit})
              if ref!=commit:
                  raise SystemExit('CARD_DROPBOX_REF_MISMATCH')
              print('CARD_DROPBOX_CANDIDATE_READY',card,branch,commit,digest)
              with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('branch='+branch+'\n')
              break
          PYDROPBOX


      # [원본 후보 승인] 기존 GitHub PR/검사 통로를 사용한다. Dropbox 인증 변수는 전달하지 않는다.
      - name: Open reviewed Dropbox candidate PR and merge only after checks
        if: ${{ steps.dropbox_stage.outputs.branch != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CARD_BRANCH: ${{ steps.dropbox_stage.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CARD_BRANCH" =~ ^mare-dropbox-card-(eu|ea|me|nw|af|sa)_[0-9]{2}-[a-f0-9]{12}$ ]]
          card="$(printf '%s' "$CARD_BRANCH" | cut -d- -f4)"
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base main --head "$CARD_BRANCH" --json number --jq '.[0].number // empty')"
          if [[ -z "$pr" ]]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$CARD_BRANCH" --title "Mare Essentia: verified Dropbox original $card" --body "Reviewed original and approval, existing registration retained until successful replacement."
            pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base main --head "$CARD_BRANCH" --json number --jq '.[0].number // empty')"
          fi
          [[ "$pr" =~ ^[0-9]+$ ]]
          head="$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
          [[ "$head" =~ ^[a-f0-9]{40}$ ]]
          export CARD_PR="$pr" CARD_HEAD="$head" CARD_NAME="$card"
          python3 - <<'PYPR'
          import base64,hashlib,json,os,subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          def api(path):
              return json.loads(subprocess.check_output(['gh','api',path],text=True))
          pr=api('repos/'+repo+'/pulls/'+os.environ['CARD_PR'])
          head=os.environ['CARD_HEAD']
          if pr['head']['sha']!=head or pr['base']['ref']!='main' or pr['head']['repo']['full_name']!=repo:
              raise SystemExit('CARD_DROPBOX_PR_REF_INVALID')
          files=api('repos/'+repo+'/pulls/'+os.environ['CARD_PR']+'/files?per_page=100')
          root='roblox-games/mare-essentia/assets/'
          card='CardArt/'+os.environ['CARD_NAME']
          manifest=root+'APPROVED_IMAGES.json'
          original=root+'cardart/src/'+os.environ['CARD_NAME']+'-original.png'
          if pr['changed_files']!=2 or {f['filename'] for f in files}!={manifest,original}:
              raise SystemExit('CARD_DROPBOX_PR_FILES_INVALID')
          def contents(path,ref):
              row=api('repos/'+repo+'/contents/'+path+'?ref='+ref)
              blob=api('repos/'+repo+'/git/blobs/'+row['sha'])
              return base64.b64decode(blob['content'])
          current=json.loads(contents(manifest,'main'))
          candidate=current.get('dropboxPending',{}).get(card)
          if not candidate:
              raise SystemExit('CARD_DROPBOX_PENDING_REVIEW_CHANGED')
          review=candidate['review']
          current['approved'][card]=review['sourceSha256']
          current['modelOriginals'][card]=review
          del current['dropboxPending'][card]
          if not current['dropboxPending']:
              del current['dropboxPending']
          if json.loads(contents(manifest,head))!=current:
              raise SystemExit('CARD_DROPBOX_PR_APPROVAL_DRIFT')
          raw=contents(original,head)
          if len(raw)!=candidate['bytes'] or hashlib.sha256(raw).hexdigest()!=review['sourceSha256']:
              raise SystemExit('CARD_DROPBOX_PR_ORIGINAL_MISMATCH')
          runs=api('repos/'+repo+'/actions/runs?event=pull_request&head_sha='+head+'&per_page=100')['workflow_runs']
          latest={}
          for row in sorted(runs,key=lambda x:x['id'],reverse=True):
              latest.setdefault(row['name'],row)
          required={'All Games Development Sync','Vibe QA','Devloop Gates (Mare Essentia)'}
          if not required.issubset(latest) or any(r['status']!='completed' or r['conclusion']!='success' for r in latest.values()):
              raise SystemExit('CARD_DROPBOX_PR_CHECKS_PENDING_OR_FAILED')
          print('CARD_DROPBOX_PR_CHECKS_VERIFIED',head)
          PYPR
          gh pr checks "$pr" --repo "$GITHUB_REPOSITORY" --required
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$head"
          echo "CARD_DROPBOX_PR_MERGED=$pr"

      # [원화 등록 복구] 메인에 승인된 실물 원화가 등록표보다 새로우면 정기 실행도 기존 전체 등록기를 사용한다.
      - name: Select existing full registration for pending approved card originals
        id: card_recovery
        if: ${{ inputs.studio_regrant != true }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYRECOVERY'
          import hashlib,json,os,pathlib,re
          root=pathlib.Path('roblox-games/mare-essentia')
          doc=json.loads((root/'assets/APPROVED_IMAGES.json').read_text(encoding='utf-8'))
          registry=json.loads((root/'assets-registered.json').read_text(encoding='utf-8'))['assets']
          for card,review in doc.get('modelOriginals',{}).items():
              if not re.fullmatch(r'CardArt/(?:eu|ea|me|nw|af|sa)_[0-9]{2}',card):
                  continue
              old=registry.get(card,{})
              digest=review.get('sourceSha256')
              if not digest or doc['approved'].get(card)!=digest or old.get('sourceSha256')==digest:
                  continue
              if old.get('sourceSha256')!=review.get('replacesSha256') or str(old.get('assetId'))!=str(review.get('replacesAssetId')) or old.get('usePermissionGranted') is not True:
                  continue
              name=card.split('/')[1]
              rel=review.get('sourceFile')
              if rel not in ('assets/cardart/src/'+name+'-original.png','assets/cardart/src/'+name+'-1400x2000.png'):
                  continue
              source=root/rel
              if not source.is_file() or source.stat().st_size>20*1024*1024:
                  continue
              raw=source.read_bytes()
              if len(raw)<50000 or raw[:8]!=b'\x89PNG\r\n\x1a\n' or raw[12:16]!=b'IHDR' or raw[24]!=8 or raw[25] not in (2,6) or hashlib.sha256(raw).hexdigest()!=digest:
                  continue
              with open(os.environ['GITHUB_ENV'],'a') as out: out.write('MARE_MODELS_ONLY=false\n')
              with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('pending=true\n')
              print('CARD_APPROVED_REGISTRATION_RECOVERY',card,digest)
              break
          PYRECOVERY

      - name: Check reviewed animal originals and rotate missing source search
        id: animal_practice
        if: ${{ github.event_name == 'schedule' || inputs.scheduled_recovery == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/mare-essentia-upload-assets.mjs --animal-source-preflight

      # [풀컬러 원본 인입] 큰 PNG 전송 실패 시 동일 원본의 Base64 분할 파일을 정식 등록 직전에 복원한다.
      # 로블록스 등록기·이미지 승인 절차는 변경하지 않는다. 원본 SHA 불일치 시 실패한다.
      - name: Restore full-color originals from verified transfer parts
        if: ${{ env.MARE_MODELS_ONLY != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root='roblox-games/mare-essentia/assets/cardart/src'
          for id in eu_01 eu_02 eu_03 eu_21 eu_22 eu_23 af_19 af_20; do
            stage="$root/.transfer/$id"
            [[ -d "$stage" ]] || continue
            mapfile -t parts < <(find "$stage" -maxdepth 1 -type f -name 'part*.b64' | sort)
            if [[ ${#parts[@]} -eq 0 || ! -f "$stage/sha256" ]]; then
              echo "::error::CARD_TRANSFER_INCOMPLETE:$id"; exit 1
            fi
            expected="$(awk '{print $1}' "$stage/sha256")"
            approved="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("approved",{}).get("CardArt/"+sys.argv[2],""))' "roblox-games/mare-essentia/assets/APPROVED_IMAGES.json" "$id")"
            if [[ "$expected" != "$approved" ]]; then
              echo "CARD_TRANSFER_STALE_APPROVAL_SKIPPED $id $expected $approved"
              continue
            fi
            tmp="$(mktemp)"
            cat "${parts[@]}" | base64 --decode > "$tmp"
            actual="$(sha256sum "$tmp" | awk '{print $1}')"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::CARD_TRANSFER_SHA_MISMATCH:$id"; exit 1
            fi
            python3 - "$tmp" "$id" <<'PYCARD'
          import pathlib,struct,sys
          p=pathlib.Path(sys.argv[1]); b=p.read_bytes(); card=sys.argv[2]
          if b[:8]!=b'\x89PNG\r\n\x1a\n' or b[12:16]!=b'IHDR' or b[24]!=8 or b[25] not in (2,6):
              raise SystemExit('CARD_TRANSFER_RGB_PNG_REQUIRED:'+card)
          w,h=struct.unpack('>II',b[16:24])
          if w<768 or h<768 or w>4096 or h>4096:
              raise SystemExit('CARD_TRANSFER_PNG_DIMENSIONS_INVALID:'+card)
          print('CARD_TRANSFER_VERIFIED',card,w,h,len(b))
          PYCARD
            dest="$root/$id-original.png"
            cp "$tmp" "$dest"
            current="$(gh api "repos/${GITHUB_REPOSITORY}/contents/$dest?ref=main" --jq .sha 2>/dev/null || true)"
            if [[ "$current" == "$(git hash-object "$tmp")" ]]; then
              rm -f "$tmp"
              echo "CARD_ORIGINAL_ALREADY_VERIFIED $id $actual"
              continue
            fi
            payload="$(mktemp)"
            python3 - "$dest" "$current" "$payload" <<'PYPAYLOAD'
          import base64,json,pathlib,sys
          source,sha,out=sys.argv[1:]
          body={'message':'Mare Essentia: restore verified full-color original '+pathlib.Path(source).name,
                'branch':'main','content':base64.b64encode(pathlib.Path(source).read_bytes()).decode('ascii')}
          if sha: body['sha']=sha
          pathlib.Path(out).write_text(json.dumps(body),encoding='utf-8')
          PYPAYLOAD
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/$dest" --input "$payload" --silent
            rm -f "$tmp" "$payload"
            echo "CARD_ORIGINAL_MAIN_RESTORED $id $actual"
          done

      # [원화 품질 확인] PNG 색상 종류(헤더 25번째 바이트)를 실제로 검증하고 삭제 대상을 기록한다.
      - name: Audit 256-color indexed card artwork without altering registered assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, struct
          root = pathlib.Path('roblox-games/mare-essentia/assets')
          count = 0
          for folder in ('cardart', 'portraits', 'inbox', 'inbox-hold'):
              base = root / folder
              if not base.exists():
                  continue
              for path in sorted(base.rglob('*.png')):
                  with path.open('rb') as f:
                      header = f.read(26)
                  if header[:8] != b'\x89PNG\r\n\x1a\n' or len(header) < 26:
                      print('ART_PNG_INVALID ' + str(path), flush=True)
                      continue
                  if header[25] == 3:
                      count += 1
                      print('ART_PALETTE256_FOUND ' + str(path), flush=True)
          print('ART_PALETTE256_TOTAL=' + str(count), flush=True)
          PY

      - name: Practice and verify approved trade goods using existing asset ledger
        id: trade_goods
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/devloop/assets_wanted.py roblox-games/mare-essentia --verify-goods
          python3 - <<'PY'
          import json,os
          report=json.load(open('roblox-games/mare-essentia/assets-wanted.json',encoding='utf-8'))
          j=report['tradeGoodsPractice']
          s=j['stats']
          if s['targetCount']!=16 or s['excludedCount']!=2 or s['blocked']!=2:
              raise SystemExit('TRADE_GOODS_PRACTICE_COVERAGE_MISMATCH')
          if s['invalid']:
              raise SystemExit('TRADE_GOODS_PRACTICE_INVALID')
          # [교역품 3D] 현재 항구 상품 69종을 현행 Cargo 등록/실물/권한과 반복 대조한다.
          three=report['tradeGoods3DPractice']
          t=three['stats']
          if t['targetCount']<69 or t['targetCount']!=len(three['goods']):
              raise SystemExit('TRADE_GOODS_3D_CATALOG_INCOMPLETE')
          if t['targetCount']!=t['registeredSourceChecked']+t['missingExactModel']+t['unverified']+t['visualRestricted']:
              raise SystemExit('TRADE_GOODS_3D_COVERAGE_INCONSISTENT')
          if t['unverified']:
              raise SystemExit('TRADE_GOODS_3D_REGISTERED_SOURCE_OR_RIGHTS_INVALID')
          if any(row['state']=='REGISTERED_SOURCE_CHECKED_RUNTIME_PENDING' and
                 (not row.get('sourceSha256') or not row.get('assetId')) for row in three['goods']):
              raise SystemExit('TRADE_GOODS_3D_SOURCE_PROVENANCE_MISSING')
          print('TRADE_GOODS_3D_TARGET='+str(t['targetCount']))
          print('TRADE_GOODS_3D_SOURCE_CHECKED='+str(t['registeredSourceChecked']))
          print('TRADE_GOODS_3D_MISSING='+str(t['missingExactModel']))
          print('TRADE_GOODS_3D_RUNTIME_VERIFIED=NO')
          pending=s['readyToRegister']+s['permissionPending']
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write(f'pending={pending}\n')
          print('TRADE_GOODS_APPROVED_REGISTRATION_PENDING='+str(pending))
          print('TRADE_GOODS_AUTO_GAME_PUBLISH=NO')
          PY

      - name: Check trade goods practice and safe ingredient game bindings
        shell: bash
        run: |
          node --test --test-name-pattern='Mare (trade|generated original|licensed galleon|ship original)' qa/company-roblox-dedicated-experience.test.mjs

      # [5차 선박] 기존 3D 자산 등록 작업 안에서만 36척×2종 원본을 재현한다.
      # 원본 해시와 다르면 모델/자산번호를 갱신하지 않으며, 평시·정기 실행에는 추가 비용이 없다.
      - name: Rebuild and verify original 36-ship V5 models
        id: ship_v5
        if: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[mare-v5-register]')) || (github.event_name == 'workflow_dispatch' && inputs.register_v5 == true) }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet numpy==2.3.5 trimesh==4.11.1 pillow==12.3.0
          # [메모리 안정성] 36척을 동일 생성기로 6척씩 실행해 원본 메시 누적 메모리를 피한다.
          python3 - <<'PY'
          import runpy, subprocess, sys
          source = 'tools/mare-essentia-ship-v5.py'
          entries = runpy.run_path(source)['OLD']
          ids = [entry['id'] for entry in entries]
          if len(ids) != 36 or len(set(ids)) != 36:
              raise SystemExit('MARE_V5_EXACT_36_BLUEPRINTS_REQUIRED')
          for start in range(0, 36, 6):
              print('MARE_V5_REBUILD_BATCH', start // 6 + 1, ids[start:start + 6], flush=True)
              subprocess.run([sys.executable, source, *ids[start:start + 6]], check=True)
          PY

      # [교역품 3D 개선] 동일한 원본 등록 작업에서만 8종을 재생성한다. 등록 실패 시 기존 로블록스 번호 유지.
      - name: Rebuild reviewed cargo 3D geometry on the existing registration path
        id: cargo_quality
        if: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[mare-cargo-quality-upgrade]')) || (github.event_name == 'workflow_dispatch' && inputs.upgrade_cargo_quality == true) }}
        shell: bash
        run: |
          set -euo pipefail
          node roblox-games/mare-essentia/tools/make_cargo.mjs --check
          node roblox-games/mare-essentia/tools/make_cargo.mjs --registered-upgrade

      # [런던 원본] 기존 inbox 등록기가 검사 후 승격하므로 동일 시험 검사를 반복하지 않는다.
      - name: Validate and stage London source models through canonical asset register
        id: london_source
        if: ${{ env.MARE_MODELS_ONLY != 'true' && inputs.studio_regrant != true }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/devloop/register_asset.py roblox-games/mare-essentia --kind=Town --prefix=london_ --allow-partial
          if compgen -G 'roblox-games/mare-essentia/assets/inbox/Terrain/veg_*.glb' >/dev/null; then
            python3 tools/devloop/register_asset.py roblox-games/mare-essentia --kind=Terrain --prefix=veg_
          fi

      - name: Upload licensed models and menu icons to Roblox and write AssetIds
        id: asset_registration
        # 검수 원본이 존재하는 정기 실행만 기존 정식 업로드 경로를 사용한다.
        if: ${{ env.MARE_MODELS_ONLY != 'true' || steps.animal_practice.outputs.pending == 'true' }}
        env:
          MARE_UNIVERSE_ID: ${{ inputs.universe_id }}
          # 새 소유 계정(Anyanguy1980) 키만 사용한다. 제재 계정 쿠키는 넘기지 않는다.
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_DEPLOY_API_KEY }}
          ROBLOX_CREATOR_USER_ID: '11664914771'
          STUDIO_REGRANT: ${{ inputs.studio_regrant || false }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ROBLOX_OPEN_CLOUD_API_KEY:-}" ]]; then
            echo "::error::MARE_1980_DEPLOY_API_KEY_MISSING" >&2
            exit 1
          fi
          if [[ "$STUDIO_REGRANT" == "true" ]]; then
            # [기존 실측 증거] 별도 공식 Studio 출력 브랜치에서 실제 실패 자산만 가져온다.
            git fetch --no-tags --depth=1 origin refs/heads/mare-essentia-studio-frames
            git show FETCH_HEAD:report.json > "$RUNNER_TEMP/mare-studio-report.json"
            node tools/mare-essentia-upload-assets.mjs "--studio-regrant=$RUNNER_TEMP/mare-studio-report.json"
          else
            node tools/mare-essentia-upload-assets.mjs
          fi
          # [지상전 신규 CC0 실물 3종] 로블록스 번호·실제 Universe 사용권·원본 해시 확인 후에만 GitHub에 승격한다.
          if [[ "$STUDIO_REGRANT" != "true" ]]; then
            python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('roblox-games/mare-essentia')
          registry=json.loads((root/'assets-registered.json').read_text(encoding='utf-8'))['assets']
          ziphash='fa7974a0d342bfe63c38664ba9f8ec1a4aab8ea25f099bdc56870e33588c4d9d'
          confirmed=set()
          for name in (
              'kenney_rock_largeB', 'kenney_tree_fat', 'kenney_mushroom_red',
              'kenney_mushroom_redGroup', 'kenney_stump_old', 'kenney_stone_smallFlatA',
              'kenney_rock_largeD', 'kenney_rock_tallE', 'kenney_rock_smallFlatA',
              'kenney_stone_largeB', 'kenney_path_stoneCircle', 'kenney_tree_defaultDark',
              'kenney_tree_pinetallD_detailed', 'kenney_tree_palmShort',
              'kenney_mushroom_tanGroup', 'kenney_stump_roundDetailed',
              'kenney_plant_bushTriangle', 'kenney_grass_leafs',
              'kenney_log_stackLarge', 'kenney_ground_riverCorner',
              'kenney_ground_pathCorner',
          ):
              original=root/'assets'/'terrain'/(name+'.glb')
              proof=json.loads(pathlib.Path(str(original)+'.license.json').read_text(encoding='utf-8'))
              row=registry.get('Terrain/'+name) or {}
              sha=hashlib.sha256(original.read_bytes()).hexdigest()
              if (proof.get('sourceSha256')!=sha or proof.get('archiveSha256')!=ziphash
                  or proof.get('license')!='CC0-1.0' or proof.get('author')!='Kenney'
                  or proof.get('sourcePage')!='https://kenney.nl/assets/nature-kit'
                  or row.get('sourceSha256')!=sha or row.get('license')!='CC0-1.0'
                  or row.get('assetType')!='Model' or row.get('usePermissionGranted') is not True
                  or not str(row.get('assetId','')).isdigit() or int(row.get('assetId',0))<1):
                  raise SystemExit('MARE_NATURE_ID_RIGHTS_OR_ORIGINAL_INVALID:'+name)
              confirmed.add(str(row['assetId']))
              print('MARE_NATURE_ROBLOX_REGISTERED',name,row['assetId'],sha)
          if len(confirmed)!=21: raise SystemExit('MARE_NATURE_DUPLICATE_ASSET_ID')
          print('MARE_NATURE_REGISTERED_RIGHTS_VERIFIED=21')
          print('MARE_NATURE_STUDIO_3D_VISUAL_QA=UNVERIFIED')
          PY
          fi
          # [36척 V5 등록 확정] 72개가 전부 실제 자산번호와 Universe 사용 권한을 받아야 성공이다.
          if [[ "${{ steps.ship_v5.outcome }}" == "success" ]]; then
            python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path("roblox-games/mare-essentia/assets/naval")
          registry = json.loads(pathlib.Path("roblox-games/mare-essentia/assets-registered.json").read_text())
          models = sorted(root.glob("*-v5*.glb"))
          if len(models) != 72:
              raise SystemExit("MARE_V5_72_SOURCE_FILES_REQUIRED:" + str(len(models)))
          ids = set()
          for model in models:
              key = "Naval/" + model.stem
              proof = json.loads(pathlib.Path(str(model) + ".license.json").read_text())
              row = registry["assets"].get(key) or {}
              source_hash = hashlib.sha256(model.read_bytes()).hexdigest()
              if (proof.get("sourceSha256") != source_hash
                  or proof.get("license") != "PROJECT_ORIGINAL_ART"
                  or row.get("sourceSha256") != source_hash
                  or row.get("assetType") != "Model"
                  or row.get("usePermissionGranted") is not True
                  or not str(row.get("assetId", "")).isdigit()
                  or not int(row["assetId"])):
                  raise SystemExit("MARE_V5_MODEL_ID_RIGHTS_OR_HASH_INVALID:" + key)
              ids.add(str(row["assetId"]))
          if len(ids) != 72:
              raise SystemExit("MARE_V5_DUPLICATE_ASSET_IDS")
          print("MARE_V5_72_MODELS_REGISTERED_RIGHTS_CONFIRMED=72")
          print("MARE_V5_NATIVE_STUDIO_QA=UNVERIFIED")
          PY
          fi

      - name: Verify external CC0 nau and three coastal merchant hulls with Roblox granted assets
        id: nau_check
        if: ${{ steps.asset_registration.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-name-pattern='Mare external CC0 (nau|coastal) original hull and Roblox registration integrity' qa/company-roblox-dedicated-experience.test.mjs

      # [동물 원본 시각 증거] 기존 무료 Blender 검사기를 같은 등록 흐름에서 사용한다.
      - name: Prepare free Blender source preview
        if: ${{ always() && env.MARE_ANIMAL_PREVIEW == 'true' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # 배포판 Blender의 내장 파이썬은 별도 pip 환경이 아니라 시스템 NumPy를 사용한다.
          if ! command -v blender >/dev/null || ! dpkg-query -W -f='${db:Status-Status}' python3-numpy 2>/dev/null | grep -qx installed; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=25 update
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=25 install -y --no-install-recommends blender python3-numpy libegl1 libgl1 libgl1-mesa-dri
          fi
          blender --version | head -n 1
          # 외부 원본이 아닌 고정 삼각형으로 실제 가져오기와 격리 환경의 모듈 로딩을 검사한다.
          probe="$(mktemp -d)"
          trap 'rm -rf "$probe"' EXIT
          python3 - "$probe/probe.gltf" <<'PY'
          import base64, json, struct, sys
          data = struct.pack("<9f", 0, 0, 0, 1, 0, 0, 0, 1, 0)
          model = {"asset": {"version": "2.0"}, "scene": 0, "scenes": [{"nodes": [0]}],
                   "nodes": [{"mesh": 0}], "meshes": [{"primitives": [{"attributes": {"POSITION": 0}}]}],
                   "buffers": [{"byteLength": len(data), "uri": "data:application/octet-stream;base64," + base64.b64encode(data).decode("ascii")}],
                   "bufferViews": [{"buffer": 0, "byteLength": len(data), "target": 34962}],
                   "accessors": [{"bufferView": 0, "componentType": 5126, "count": 3, "type": "VEC3",
                                  "min": [0, 0, 0], "max": [1, 1, 0]}]}
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump(model, handle)
          PY
          env -i PATH="$PATH" HOME="$probe" TMPDIR="$probe" LANG=C.UTF-8 LIBGL_ALWAYS_SOFTWARE=1 blender \
            --background --factory-startup --disable-autoexec --python-exit-code 1 \
            --python-expr 'import bpy, numpy, os; bpy.ops.wm.read_factory_settings(use_empty=True); assert "FINISHED" in bpy.ops.import_scene.gltf(filepath=os.path.join(os.environ["HOME"], "probe.gltf")); assert any(o.type == "MESH" for o in bpy.data.objects); print("MARE_BLENDER_GLTF_PREFLIGHT=PASS")'

      - name: Refresh asset practice ledger after Roblox registration
        id: asset_ledger
        if: always()
        env:
          VIBE2_VISION_MODEL: ${{ vars.VIBE2_VISION_MODEL }}
          VIBE2_LOCAL_AI_OWNER_APPROVED: ${{ vars.VIBE2_LOCAL_AI_OWNER_APPROVED }}
          VIBE2_GEMINI_FREE_TIER_VERIFIED: ${{ vars.VIBE2_GEMINI_FREE_TIER_VERIFIED }}
          GEMINI_API_KEY: ${{ vars.VIBE2_GEMINI_FREE_TIER_VERIFIED == 'YES' && secrets.GEMINI_API_KEY || '' }}
        shell: bash
        run: |
          set -euo pipefail
          preview_args=()
          if [[ "$MARE_ANIMAL_PREVIEW" == "true" ]]; then
            preview_args+=("--animal-preview-dir=$RUNNER_TEMP/mare-animal-source-preview")
          fi
          python3 tools/devloop/assets_wanted.py roblox-games/mare-essentia --verify-goods "${preview_args[@]}"
          if [[ "$MARE_ANIMAL_PREVIEW" == "true" ]]; then
            node tools/mare-essentia-upload-assets.mjs --animal-source-visual-review="$RUNNER_TEMP/mare-animal-source-preview"
          fi
          if [[ "$MARE_MODELS_ONLY" != "true" ]]; then
            python3 - <<'PY'
          import json
          report = json.load(open("roblox-games/mare-essentia/assets-wanted.json", encoding="utf-8"))
          audit = report["tradeGoods3DPractice"]
          s = audit["stats"]
          complete = (s["targetCount"] == 69 and s["visualRestricted"] == 4
                      and s["registeredSourceChecked"] == 65
                      and s["missingExactModel"] == 0 and s["unverified"] == 0)
          if not complete:
              raise SystemExit("TRADE_GOODS_3D_REGISTRATION_NOT_COMPLETE:" + json.dumps(s))
          for row in audit["goods"]:
              if row["state"] == "VISUAL_POLICY_RESTRICTED":
                  continue
              if (row["state"] != "REGISTERED_SOURCE_CHECKED_RUNTIME_PENDING"
                  or not row["assetId"] or not row["sourceSha256"] or not row["source"]):
                  raise SystemExit("TRADE_GOODS_3D_ITEM_NOT_VERIFIED:" + row["id"])
          print("TRADE_GOODS_3D_ALL_ALLOWED_REGISTERED_WITH_UNIVERSE_RIGHTS=65")
          print("TRADE_GOODS_3D_RUNTIME_AND_VISUAL_QA=UNVERIFIED")
          PY
          fi

      - name: Keep bounded animal source review frames
        if: ${{ always() && env.MARE_ANIMAL_PREVIEW == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: mare-animal-source-preview
          path: |
            ${{ runner.temp }}/mare-animal-source-preview/**/*.png
            ${{ runner.temp }}/mare-animal-source-preview/**/quality.glb
          if-no-files-found: ignore
          retention-days: 3

      - name: Commit registered asset IDs (API, main이 움직여도 안전)
        id: registered_commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          MARE_SHIP_V5_OUTCOME: ${{ steps.ship_v5.outcome }}
          MARE_ASSET_OUTCOME: ${{ steps.asset_registration.outcome }}
          MARE_NAU_CHECK_OUTCOME: ${{ steps.nau_check.outcome }}
          MARE_LONDON_SOURCE_OUTCOME: ${{ steps.london_source.outcome }}
          MARE_CARGO_QUALITY_OUTCOME: ${{ steps.cargo_quality.outcome }}
          MARE_ASSET_LEDGER_OUTCOME: ${{ steps.asset_ledger.outcome }}
        run: |
          set -euo pipefail
          # 검수된 생성 모델 원화만 기존 등록기에서 승격했다면 같은 정식 카드 폴더로 GitHub에 자동 전송한다.
          # 등록·권한 확인 실패 시 바이너리를 main에 반영하지 않는다.
          if [[ "${MARE_SHIP_V5_OUTCOME}" == "failure" ]]; then
            echo "::error::MARE_V5_ORIGINAL_MODEL_GENERATION_FAILED"
            exit 1
          fi
          if [[ "${MARE_SHIP_V5_OUTCOME}" == "success" && "${MARE_ASSET_OUTCOME}" != "success" ]]; then
            echo "::error::MARE_V5_72_MODEL_REGISTRATION_INCOMPLETE"
            exit 1
          fi
          if [[ "${MARE_NAU_CHECK_OUTCOME}" == "failure" ]]; then
            echo "::error::MARE_EXTERNAL_CC0_HULL_OR_REGISTRATION_QA_FAILED"
            exit 1
          fi
          # [런던 원본 승격] 신규 파일은 실제 등록번호·사용권이 확인된 것만 기존 API 반영 목록에 추가한다.
          asset_root=roblox-games/mare-essentia/assets
          london_files=()
          verified_london="$RUNNER_TEMP/mare-london-verified"
          pending_london="$RUNNER_TEMP/mare-london-pending"
          : > "$verified_london"
          : > "$pending_london"
          verified_vegetation="$RUNNER_TEMP/mare-vegetation-verified"
          pending_vegetation="$RUNNER_TEMP/mare-vegetation-pending"
          : > "$verified_vegetation"
          : > "$pending_vegetation"
          if [[ "${MARE_LONDON_SOURCE_OUTCOME}" == "success" ]]; then
            MARE_ASSET_REGISTRATION_OUTCOME="${MARE_ASSET_OUTCOME}" python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path('roblox-games/mare-essentia')
          registry = json.loads((root/'assets-registered.json').read_text())['assets']
          verified_vegetation = pathlib.Path(os.environ['RUNNER_TEMP'])/'mare-vegetation-verified'
          pending_vegetation = pathlib.Path(os.environ['RUNNER_TEMP'])/'mare-vegetation-pending'
          verified_london = pathlib.Path(os.environ['RUNNER_TEMP'])/'mare-london-verified'
