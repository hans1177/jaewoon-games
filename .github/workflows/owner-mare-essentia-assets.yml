# 파일명: .github/workflows/owner-mare-essentia-assets.yml
# Mare Essentia: CC0 모델과 CC BY 3.0 메뉴 그림을 기존 Open Cloud 등록 통로로 등록한다.
# main 자산 변경 또는 수동 실행 시 동작하며 게임 게시 기본값은 꺼져 있다.
name: Owner Mare Essentia Register Assets
run-name: Owner Mare Essentia assets · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/owner-mare-essentia-assets.yml'
      - 'roblox-games/mare-essentia/assets/**'
      - 'roblox-games/mare-essentia/assets-wanted.seed.json'
      - 'tools/devloop/assets_wanted.py'
      - 'tools/devloop/register_asset.py'
      - 'qa/company-roblox-dedicated-experience.test.mjs'
      - 'tools/mare-essentia-upload-assets.mjs'
      - 'tools/mare-essentia-character-finish.mjs'
      - 'tools/mare-essentia-ship-v5.py'
  # [자체 연습] 기존 무료 자산 등록 절차에서 하루 한 번 누락된 3D 원본만 재검사한다.
  schedule:
    - cron: '20 19 * * *'
  workflow_dispatch:
    inputs:
      universe_id:
        description: 'Universe ID (사용 권한을 줄 체험)'
        type: string
        required: false
        default: '10775310508'
      studio_regrant:
        description: '실제 Studio 실패 보고서의 미디어만 권한 재검증(원본 재업로드 금지)'
        type: boolean
        required: false
        default: false
      register_v5:
        description: '선박 36척 V5 고품질·모바일 72개 신규 자산 등록'
        type: boolean
        required: false
        default: false
      upgrade_cargo_quality:
        description: '검증된 3D 교역품 8종을 기존 원본 등록 경로로 재생성'
        type: boolean
        required: false
        default: false
      publish_after_register:
        description: '자산 등록 확인 후 게시까지 할지 (기본: 게시 안 함)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: write

# [정체 복구] 평소에는 중단 없이 순차 등록한다. 저장소 체크아웃이 멈춘 경우만
# 명시된 복구 커밋에서 기존 실행을 종료하고 최신 메인의 동일 정식 등록기로 재개한다.
concurrency:
  group: owner-mare-essentia-assets
  cancel-in-progress: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[mare-recover-stalled-run]') }}

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          lfs: false
          # [대용량 저장소] 게임 원본과 등록 코드만 가져와 빌드 시간을 단축한다.
          # 기존 등록기·QA·메인 자산 승격 절차 및 권한 검사는 그대로 사용한다.
          filter: blob:none
          sparse-checkout: |
            .github/workflows
            company-learning
            tools
            qa
            roblox-games/mare-essentia

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # [풀컬러 원본 인입] 큰 PNG 전송 실패 시 동일 원본의 Base64 분할 파일을 정식 등록 직전에 복원한다.
      # 로블록스 등록기·이미지 승인 절차는 변경하지 않는다. 원본 SHA 불일치 시 실패한다.
      - name: Restore full-color originals from verified transfer parts
        if: ${{ github.event_name != 'schedule' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root='roblox-games/mare-essentia/assets/cardart/src'
          for id in eu_01 eu_02 eu_03 eu_21 eu_22 eu_23 af_19 af_20; do
            stage="$root/.transfer/$id"
            [[ -d "$stage" ]] || continue
            mapfile -t parts < <(find "$stage" -maxdepth 1 -type f -name 'part*.b64' | sort)
            if [[ ${#parts[@]} -eq 0 || ! -f "$stage/sha256" ]]; then
              echo "::error::CARD_TRANSFER_INCOMPLETE:$id"; exit 1
            fi
            expected="$(awk '{print $1}' "$stage/sha256")"
            approved="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("approved",{}).get("CardArt/"+sys.argv[2],""))' "roblox-games/mare-essentia/assets/APPROVED_IMAGES.json" "$id")"
            if [[ "$expected" != "$approved" ]]; then
              echo "CARD_TRANSFER_STALE_APPROVAL_SKIPPED $id $expected $approved"
              continue
            fi
            tmp="$(mktemp)"
            cat "${parts[@]}" | base64 --decode > "$tmp"
            actual="$(sha256sum "$tmp" | awk '{print $1}')"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::CARD_TRANSFER_SHA_MISMATCH:$id"; exit 1
            fi
            python3 - "$tmp" "$id" <<'PYCARD'
          import pathlib,struct,sys
          p=pathlib.Path(sys.argv[1]); b=p.read_bytes(); card=sys.argv[2]
          if b[:8]!=b'\x89PNG\r\n\x1a\n' or b[12:16]!=b'IHDR' or b[24]!=8 or b[25] not in (2,6):
              raise SystemExit('CARD_TRANSFER_RGB_PNG_REQUIRED:'+card)
          w,h=struct.unpack('>II',b[16:24])
          if w<768 or h<768 or w>4096 or h>4096:
              raise SystemExit('CARD_TRANSFER_PNG_DIMENSIONS_INVALID:'+card)
          print('CARD_TRANSFER_VERIFIED',card,w,h,len(b))
          PYCARD
            dest="$root/$id-original.png"
            cp "$tmp" "$dest"
            current="$(gh api "repos/${GITHUB_REPOSITORY}/contents/$dest?ref=main" --jq .sha 2>/dev/null || true)"
            if [[ "$current" == "$(git hash-object "$tmp")" ]]; then
              rm -f "$tmp"
              echo "CARD_ORIGINAL_ALREADY_VERIFIED $id $actual"
              continue
            fi
            payload="$(mktemp)"
            python3 - "$dest" "$current" "$payload" <<'PYPAYLOAD'
          import base64,json,pathlib,sys
          source,sha,out=sys.argv[1:]
          body={'message':'Mare Essentia: restore verified full-color original '+pathlib.Path(source).name,
                'branch':'main','content':base64.b64encode(pathlib.Path(source).read_bytes()).decode('ascii')}
          if sha: body['sha']=sha
          pathlib.Path(out).write_text(json.dumps(body),encoding='utf-8')
          PYPAYLOAD
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/$dest" --input "$payload" --silent
            rm -f "$tmp" "$payload"
            echo "CARD_ORIGINAL_MAIN_RESTORED $id $actual"
          done

      # [원화 품질 확인] PNG 색상 종류(헤더 25번째 바이트)를 실제로 검증하고 삭제 대상을 기록한다.
      - name: Audit 256-color indexed card artwork without altering registered assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, struct
          root = pathlib.Path('roblox-games/mare-essentia/assets')
          count = 0
          for folder in ('cardart', 'portraits', 'inbox', 'inbox-hold'):
              base = root / folder
              if not base.exists():
                  continue
              for path in sorted(base.rglob('*.png')):
                  with path.open('rb') as f:
                      header = f.read(26)
                  if header[:8] != b'\x89PNG\r\n\x1a\n' or len(header) < 26:
                      print('ART_PNG_INVALID ' + str(path), flush=True)
                      continue
                  if header[25] == 3:
                      count += 1
                      print('ART_PALETTE256_FOUND ' + str(path), flush=True)
          print('ART_PALETTE256_TOTAL=' + str(count), flush=True)
          PY

      - name: Practice and verify approved trade goods using existing asset ledger
        id: trade_goods
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/devloop/assets_wanted.py roblox-games/mare-essentia --verify-goods
          python3 - <<'PY'
          import json,os
          report=json.load(open('roblox-games/mare-essentia/assets-wanted.json',encoding='utf-8'))
          j=report['tradeGoodsPractice']
          s=j['stats']
          if s['targetCount']!=16 or s['excludedCount']!=2 or s['blocked']!=2:
              raise SystemExit('TRADE_GOODS_PRACTICE_COVERAGE_MISMATCH')
          if s['invalid']:
              raise SystemExit('TRADE_GOODS_PRACTICE_INVALID')
          # [교역품 3D] 현재 항구 상품 69종을 현행 Cargo 등록/실물/권한과 반복 대조한다.
          three=report['tradeGoods3DPractice']
          t=three['stats']
          if t['targetCount']<69 or t['targetCount']!=len(three['goods']):
              raise SystemExit('TRADE_GOODS_3D_CATALOG_INCOMPLETE')
          if t['targetCount']!=t['registeredSourceChecked']+t['missingExactModel']+t['unverified']+t['visualRestricted']:
              raise SystemExit('TRADE_GOODS_3D_COVERAGE_INCONSISTENT')
          if t['unverified']:
              raise SystemExit('TRADE_GOODS_3D_REGISTERED_SOURCE_OR_RIGHTS_INVALID')
          if any(row['state']=='REGISTERED_SOURCE_CHECKED_RUNTIME_PENDING' and
                 (not row.get('sourceSha256') or not row.get('assetId')) for row in three['goods']):
              raise SystemExit('TRADE_GOODS_3D_SOURCE_PROVENANCE_MISSING')
          print('TRADE_GOODS_3D_TARGET='+str(t['targetCount']))
          print('TRADE_GOODS_3D_SOURCE_CHECKED='+str(t['registeredSourceChecked']))
          print('TRADE_GOODS_3D_MISSING='+str(t['missingExactModel']))
          print('TRADE_GOODS_3D_RUNTIME_VERIFIED=NO')
          pending=s['readyToRegister']+s['permissionPending']
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write(f'pending={pending}\n')
          print('TRADE_GOODS_APPROVED_REGISTRATION_PENDING='+str(pending))
          print('TRADE_GOODS_AUTO_GAME_PUBLISH=NO')
          PY

      - name: Check trade goods practice and safe ingredient game bindings
        shell: bash
        run: |
          node --test --test-name-pattern='Mare (trade|generated original|licensed galleon|ship original)' qa/company-roblox-dedicated-experience.test.mjs

      # [5차 선박] 기존 3D 자산 등록 작업 안에서만 36척×2종 원본을 재현한다.
      # 원본 해시와 다르면 모델/자산번호를 갱신하지 않으며, 평시·정기 실행에는 추가 비용이 없다.
      - name: Rebuild and verify original 36-ship V5 models
        id: ship_v5
        if: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[mare-v5-register]')) || (github.event_name == 'workflow_dispatch' && inputs.register_v5 == true) }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet numpy==2.3.5 trimesh==4.11.1 pillow==12.3.0
          # [메모리 안정성] 36척을 동일 생성기로 6척씩 실행해 원본 메시 누적 메모리를 피한다.
          python3 - <<'PY'
          import runpy, subprocess, sys
          source = 'tools/mare-essentia-ship-v5.py'
          entries = runpy.run_path(source)['OLD']
          ids = [entry['id'] for entry in entries]
          if len(ids) != 36 or len(set(ids)) != 36:
              raise SystemExit('MARE_V5_EXACT_36_BLUEPRINTS_REQUIRED')
          for start in range(0, 36, 6):
              print('MARE_V5_REBUILD_BATCH', start // 6 + 1, ids[start:start + 6], flush=True)
              subprocess.run([sys.executable, source, *ids[start:start + 6]], check=True)
          PY

      # [교역품 3D 개선] 동일한 원본 등록 작업에서만 8종을 재생성한다. 등록 실패 시 기존 로블록스 번호 유지.
      - name: Rebuild reviewed cargo 3D geometry on the existing registration path
        id: cargo_quality
        if: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[mare-cargo-quality-upgrade]')) || (github.event_name == 'workflow_dispatch' && inputs.upgrade_cargo_quality == true) }}
        shell: bash
        run: |
          set -euo pipefail
          node roblox-games/mare-essentia/tools/make_cargo.mjs --check
          node roblox-games/mare-essentia/tools/make_cargo.mjs --registered-upgrade

      # [런던 원본] 기존 inbox 등록기가 검사 후 승격하므로 동일 시험 검사를 반복하지 않는다.
      - name: Validate and stage London source models through canonical asset register
        id: london_source
        if: ${{ github.event_name != 'schedule' && inputs.studio_regrant != true }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/devloop/register_asset.py roblox-games/mare-essentia --kind=Town --prefix=london_ --allow-partial
          if compgen -G 'roblox-games/mare-essentia/assets/inbox/Terrain/veg_*.glb' >/dev/null; then
            python3 tools/devloop/register_asset.py roblox-games/mare-essentia --kind=Terrain --prefix=veg_
          fi

      - name: Upload licensed models and menu icons to Roblox and write AssetIds
        id: asset_registration
        # 정기 연습은 무료 정적 진단만 수행한다. 신규/변경 승인 자산 업로드는 기존 push·수동 경로.
        if: ${{ github.event_name != 'schedule' }}
        env:
          MARE_UNIVERSE_ID: ${{ inputs.universe_id }}
          # 새 소유 계정(Anyanguy1980) 키만 사용한다. 제재 계정 쿠키는 넘기지 않는다.
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_DEPLOY_API_KEY }}
          ROBLOX_CREATOR_USER_ID: '11664914771'
          STUDIO_REGRANT: ${{ inputs.studio_regrant || false }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ROBLOX_OPEN_CLOUD_API_KEY:-}" ]]; then
            echo "::error::MARE_1980_DEPLOY_API_KEY_MISSING" >&2
            exit 1
          fi
          if [[ "$STUDIO_REGRANT" == "true" ]]; then
            # [기존 실측 증거] 별도 공식 Studio 출력 브랜치에서 실제 실패 자산만 가져온다.
            git fetch --no-tags --depth=1 origin refs/heads/mare-essentia-studio-frames
            git show FETCH_HEAD:report.json > "$RUNNER_TEMP/mare-studio-report.json"
            node tools/mare-essentia-upload-assets.mjs "--studio-regrant=$RUNNER_TEMP/mare-studio-report.json"
          else
            node tools/mare-essentia-upload-assets.mjs
          fi
          # [지상전 신규 CC0 실물 3종] 로블록스 번호·실제 Universe 사용권·원본 해시 확인 후에만 GitHub에 승격한다.
          if [[ "$STUDIO_REGRANT" != "true" ]]; then
            python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('roblox-games/mare-essentia')
          registry=json.loads((root/'assets-registered.json').read_text(encoding='utf-8'))['assets']
          ziphash='fa7974a0d342bfe63c38664ba9f8ec1a4aab8ea25f099bdc56870e33588c4d9d'
          confirmed=set()
          for name in (
              'kenney_rock_largeB', 'kenney_tree_fat', 'kenney_mushroom_red',
              'kenney_mushroom_redGroup', 'kenney_stump_old', 'kenney_stone_smallFlatA',
              'kenney_rock_largeD', 'kenney_rock_tallE', 'kenney_rock_smallFlatA',
              'kenney_stone_largeB', 'kenney_path_stoneCircle', 'kenney_tree_defaultDark',
              'kenney_tree_pinetallD_detailed', 'kenney_tree_palmShort',
              'kenney_mushroom_tanGroup', 'kenney_stump_roundDetailed',
              'kenney_plant_bushTriangle', 'kenney_grass_leafs',
              'kenney_log_stackLarge', 'kenney_ground_riverCorner',
              'kenney_ground_pathCorner',
          ):
              original=root/'assets'/'terrain'/(name+'.glb')
              proof=json.loads(pathlib.Path(str(original)+'.license.json').read_text(encoding='utf-8'))
              row=registry.get('Terrain/'+name) or {}
              sha=hashlib.sha256(original.read_bytes()).hexdigest()
              if (proof.get('sourceSha256')!=sha or proof.get('archiveSha256')!=ziphash
                  or proof.get('license')!='CC0-1.0' or proof.get('author')!='Kenney'
                  or proof.get('sourcePage')!='https://kenney.nl/assets/nature-kit'
                  or row.get('sourceSha256')!=sha or row.get('license')!='CC0-1.0'
                  or row.get('assetType')!='Model' or row.get('usePermissionGranted') is not True
                  or not str(row.get('assetId','')).isdigit() or int(row.get('assetId',0))<1):
                  raise SystemExit('MARE_NATURE_ID_RIGHTS_OR_ORIGINAL_INVALID:'+name)
              confirmed.add(str(row['assetId']))
              print('MARE_NATURE_ROBLOX_REGISTERED',name,row['assetId'],sha)
          if len(confirmed)!=21: raise SystemExit('MARE_NATURE_DUPLICATE_ASSET_ID')
          print('MARE_NATURE_REGISTERED_RIGHTS_VERIFIED=21')
          print('MARE_NATURE_STUDIO_3D_VISUAL_QA=UNVERIFIED')
          PY
          fi
          # [36척 V5 등록 확정] 72개가 전부 실제 자산번호와 Universe 사용 권한을 받아야 성공이다.
          if [[ "${{ steps.ship_v5.outcome }}" == "success" ]]; then
            python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path("roblox-games/mare-essentia/assets/naval")
          registry = json.loads(pathlib.Path("roblox-games/mare-essentia/assets-registered.json").read_text())
          models = sorted(root.glob("*-v5*.glb"))
          if len(models) != 72:
              raise SystemExit("MARE_V5_72_SOURCE_FILES_REQUIRED:" + str(len(models)))
          ids = set()
          for model in models:
              key = "Naval/" + model.stem
              proof = json.loads(pathlib.Path(str(model) + ".license.json").read_text())
              row = registry["assets"].get(key) or {}
              source_hash = hashlib.sha256(model.read_bytes()).hexdigest()
              if (proof.get("sourceSha256") != source_hash
                  or proof.get("license") != "PROJECT_ORIGINAL_ART"
                  or row.get("sourceSha256") != source_hash
                  or row.get("assetType") != "Model"
                  or row.get("usePermissionGranted") is not True
                  or not str(row.get("assetId", "")).isdigit()
                  or not int(row["assetId"])):
                  raise SystemExit("MARE_V5_MODEL_ID_RIGHTS_OR_HASH_INVALID:" + key)
              ids.add(str(row["assetId"]))
          if len(ids) != 72:
              raise SystemExit("MARE_V5_DUPLICATE_ASSET_IDS")
          print("MARE_V5_72_MODELS_REGISTERED_RIGHTS_CONFIRMED=72")
          print("MARE_V5_NATIVE_STUDIO_QA=UNVERIFIED")
          PY
          fi

      - name: Verify external CC0 nau and three coastal merchant hulls with Roblox granted assets
        id: nau_check
        if: ${{ steps.asset_registration.outcome == 'success' && github.event_name != 'schedule' }}
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-name-pattern='Mare external CC0 (nau|coastal) original hull and Roblox registration integrity' qa/company-roblox-dedicated-experience.test.mjs

      - name: Refresh asset practice ledger after Roblox registration
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/devloop/assets_wanted.py roblox-games/mare-essentia --verify-goods
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            python3 - <<'PY'
          import json
          report = json.load(open("roblox-games/mare-essentia/assets-wanted.json", encoding="utf-8"))
          audit = report["tradeGoods3DPractice"]
          s = audit["stats"]
          complete = (s["targetCount"] == 69 and s["visualRestricted"] == 4
                      and s["registeredSourceChecked"] == 65
                      and s["missingExactModel"] == 0 and s["unverified"] == 0)
          if not complete:
              raise SystemExit("TRADE_GOODS_3D_REGISTRATION_NOT_COMPLETE:" + json.dumps(s))
          for row in audit["goods"]:
              if row["state"] == "VISUAL_POLICY_RESTRICTED":
                  continue
              if (row["state"] != "REGISTERED_SOURCE_CHECKED_RUNTIME_PENDING"
                  or not row["assetId"] or not row["sourceSha256"] or not row["source"]):
                  raise SystemExit("TRADE_GOODS_3D_ITEM_NOT_VERIFIED:" + row["id"])
          print("TRADE_GOODS_3D_ALL_ALLOWED_REGISTERED_WITH_UNIVERSE_RIGHTS=65")
          print("TRADE_GOODS_3D_RUNTIME_AND_VISUAL_QA=UNVERIFIED")
          PY
          fi

      - name: Commit registered asset IDs (API, main이 움직여도 안전)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 검수된 생성 모델 원화만 기존 등록기에서 승격했다면 같은 정식 카드 폴더로 GitHub에 자동 전송한다.
          # 등록·권한 확인 실패 시 바이너리를 main에 반영하지 않는다.
          if [[ "${{ steps.ship_v5.outcome }}" == "failure" ]]; then
            echo "::error::MARE_V5_ORIGINAL_MODEL_GENERATION_FAILED"
            exit 1
          fi
          if [[ "${{ steps.ship_v5.outcome }}" == "success" && "${{ steps.asset_registration.outcome }}" != "success" ]]; then
            echo "::error::MARE_V5_72_MODEL_REGISTRATION_INCOMPLETE"
            exit 1
          fi
          if [[ "${{ steps.nau_check.outcome }}" == "failure" ]]; then
            echo "::error::MARE_EXTERNAL_CC0_HULL_OR_REGISTRATION_QA_FAILED"
            exit 1
          fi
          # [런던 원본 승격] 신규 파일은 실제 등록번호·사용권이 확인된 것만 기존 API 반영 목록에 추가한다.
          asset_root=roblox-games/mare-essentia/assets
          london_files=()
          verified_london="$RUNNER_TEMP/mare-london-verified"
          pending_london="$RUNNER_TEMP/mare-london-pending"
          : > "$verified_london"
          : > "$pending_london"
          verified_vegetation="$RUNNER_TEMP/mare-vegetation-verified"
          pending_vegetation="$RUNNER_TEMP/mare-vegetation-pending"
          : > "$verified_vegetation"
          : > "$pending_vegetation"
          if [[ "${{ steps.london_source.outcome }}" == "success" ]]; then
            MARE_ASSET_REGISTRATION_OUTCOME="${{ steps.asset_registration.outcome }}" python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path('roblox-games/mare-essentia')
          registry = json.loads((root/'assets-registered.json').read_text())['assets']
          verified_vegetation = pathlib.Path(os.environ['RUNNER_TEMP'])/'mare-vegetation-verified'
          pending_vegetation = pathlib.Path(os.environ['RUNNER_TEMP'])/'mare-vegetation-pending'
          verified_london = pathlib.Path(os.environ['RUNNER_TEMP'])/'mare-london-verified'
          pending_london = pathlib.Path(os.environ['RUNNER_TEMP'])/'mare-london-pending'
          verified_sources = []
          for kind, prefix in (('Town', 'london_'), ('Town', 'observatory-dome-source'), ('Town', 'opera-curtain-'), ('Town', 'london-rope-twist-02-source'), ('Town', 'london-wooden-ladder-source'), ('Town', 'london-wood-stake-source'), ('Town', 'london-brick-source'), ('Town', 'london-scroll-01-source'), ('Town', 'london-wheelbarrow-source'), ('Town', 'london-building-scaffolding-source'), ('Town', 'london-firewood-01-source'), ('Town', 'london-wood-barrel-source'), ('Town', 'london-clothes-peg-source'), ('Town', 'london-noticeboard-source'), ('Town', 'london-shovel-01-source'), ('Town', 'london-chicken-coop-source'), ('Town', 'london-awning-02-source'), ('Town', 'london-column-leg-bench-source'), ('Town', 'london-pick-axe-source'), ('Town', 'london-saw-horse-source'), ('Town', 'london-wooden-mallet-source'), ('Town', 'london-wooden-produce-crate-source'), ('Town', 'london-curved-stone-bench-source'), ('Town', 'london-finger-post-sign-01-source'), ('Town', 'london-flower-pot-source'), ('Town', 'london-rustic-wood-hand-basket-source'), ('Town', 'london-statue-base-source'), ('Town', 'london-architrave-heritage-source'), ('Town', 'london-awning-01-source'), ('Town', 'london-brick-hammer-source'), ('Town', 'london-brick-trowel-source'), ('Town', 'london-cartwheel-source'), ('Town', 'london-chisel-source'), ('Town', 'london-english-bond-brick-source'), ('Town', 'london-iron-flambeaux-01-source'), ('Town', 'london-stone-archway-01-source'), ('Town', 'london-stone-archway-02-source'), ('Town', 'london-wall-open-scaffold-source'), ('Town', 'london-water-drip-source'), ('Town', 'london-wooden-gate-01-source'), ('Terrain', 'veg_')):
            for path in sorted((root/'assets'/kind.lower()).glob(prefix+'*.glb')):
              inbox = root/'assets/inbox'/kind/path.name
              if inbox.exists() or subprocess.run(['git','ls-files','--error-unmatch',str(inbox)],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode:
                  continue
              row = registry.get(kind+'/'+path.stem, {})
              proof = json.loads(path.with_suffix('.glb.license.json').read_text())
              verified = (row.get('assetType') == 'Model' and row.get('usePermissionGranted') is True and str(row.get('assetId','')).isdigit() and int(row['assetId']) > 0 and row.get('source') == str(path) and hashlib.sha256(path.read_bytes()).hexdigest() == proof['sha256'])
              if kind == 'Terrain':
                  if not verified or row.get('sourceSha256') != proof['sha256']:
                      # 확인된 사용권·번호·해시가 없으면 inbox 원본을 삭제하거나 승격하지 않는다.
                      print('MARE_VEGETATION_REGISTRATION_PENDING',path.stem)
                      with pending_vegetation.open('a') as pending: pending.write(str(path)+'\n')
                      continue
                  with verified_vegetation.open('a') as confirmed: confirmed.write(str(path)+'\n')
                  verified_sources.append(f"| `terrain/` | {path.name} | {proof['author']} · {proof['license']} | {proof['source']} |")
              elif prefix == 'london_':
                  if not verified or row.get('sourceSha256') != proof['sha256']:
                      print('MARE_LONDON_REGISTRATION_PENDING',path.stem)
                      with pending_london.open('a') as pending: pending.write(str(path)+'\n')
                      continue
                  with verified_london.open('a') as confirmed: confirmed.write(str(path)+'\n')
                  verified_sources.append(f"| `town/` | {path.name} | {proof['author']} · {proof['license']} | {proof['source']} |")
              elif not verified:
                  raise SystemExit('MARE_LONDON_REGISTRATION_PENDING:'+path.stem)
              print('MARE_LONDON_REGISTERED_SOURCE_VERIFIED',path.stem,row['assetId'])
          if verified_sources:
              sources = root/'assets/SOURCES.md'
              # 다른 자산 등록 실패 시 기존 장부에 번호·사용권·해시 확인분만 반영한다.
              content = sources.read_text(encoding='utf-8') if os.environ['MARE_ASSET_REGISTRATION_OUTCOME'] == 'success' else subprocess.check_output(['git','show','HEAD:'+str(sources)],text=True)
              for line in verified_sources:
                  if line not in content.splitlines(): content = content.rstrip()+'\n'+line+'\n'
              sources.write_text(content,encoding='utf-8')
          PY
            while IFS= read -r src; do
              case "$src" in
                */assets/inbox/Town/london_*.glb)
                  dest="roblox-games/mare-essentia/assets/town/${src##*/}"
                  grep -Fxq "$dest" "$verified_london" || continue
                  ;;
                */assets/inbox/Town/*)
                  [[ "$src" == */assets/inbox/Town/@(observatory-dome-source|opera-curtain-*-source|london-@(rope-twist-02|wooden-ladder|wood-stake|brick|scroll-01|wheelbarrow|building-scaffolding|firewood-01|wood-barrel|clothes-peg|noticeboard|shovel-01|chicken-coop|awning-02|column-leg-bench|pick-axe|saw-horse|wooden-mallet|wooden-produce-crate|curved-stone-bench|finger-post-sign-01|flower-pot|rustic-wood-hand-basket|statue-base|architrave-heritage|awning-01|brick-hammer|brick-trowel|cartwheel|chisel|english-bond-brick|iron-flambeaux-01|stone-archway-01|stone-archway-02|wall-open-scaffold|water-drip|wooden-gate-01)-source).glb ]] || continue
                  dest="roblox-games/mare-essentia/assets/town/${src##*/}"
                  ;;
                */assets/inbox/Terrain/veg_*.glb)
                  dest="roblox-games/mare-essentia/assets/terrain/${src##*/}"
                  grep -Fxq "$dest" "$verified_vegetation" || continue
                  ;;
                *) continue ;;
              esac
              [[ -f "$dest" && -f "$dest.license.json" ]] || exit 1
              london_files+=("$dest" "$dest.license.json")
            done < <(git diff --name-only --diff-filter=D)
          fi
          for f in "${london_files[@]}" roblox-games/mare-essentia/assets-registered.json roblox-games/mare-essentia/src/ReplicatedStorage/Shared/AssetIds.luau roblox-games/mare-essentia/assets-wanted.json "$asset_root"/relics/weapon-mace.glb "$asset_root"/relics/weapon-mace.glb.license.json "$asset_root"/relics/weapon-crossbow.glb "$asset_root"/relics/weapon-crossbow.glb.license.json "$asset_root"/relics/weapon-flintlock-pistol.glb "$asset_root"/relics/weapon-flintlock-pistol.glb.license.json "$asset_root"/relics/weapon-flintlock-musket.glb "$asset_root"/relics/weapon-flintlock-musket.glb.license.json "$asset_root"/naval/fishing-net.glb "$asset_root"/naval/fishing-net.glb.license.json "$asset_root"/naval/net-floats.glb "$asset_root"/naval/net-floats.glb.license.json "$asset_root"/naval/galleon-heritage.glb "$asset_root"/naval/galleon-heritage.glb.license.json "$asset_root"/naval/nau-source.glb "$asset_root"/naval/nau-custom.glb "$asset_root"/naval/nau-custom.glb.license.json "$asset_root"/naval/atlantic_brigantine-custom.glb "$asset_root"/naval/atlantic_brigantine-custom.glb.license.json "$asset_root"/naval/zanzibar_jahazi-custom.glb "$asset_root"/naval/zanzibar_jahazi-custom.glb.license.json "$asset_root"/naval/rowboat-source.glb "$asset_root"/naval/jahazi-custom.glb "$asset_root"/naval/jahazi-custom.glb.license.json "$asset_root"/naval/kotia-custom.glb "$asset_root"/naval/kotia-custom.glb.license.json "$asset_root"/naval/mtepe-custom.glb "$asset_root"/naval/mtepe-custom.glb.license.json "$asset_root"/cardart/*.png "$asset_root"/terrain/kenney_*.glb* "$asset_root"/SOURCES.md "$asset_root"/naval/*-v5*.glb* "$asset_root"/cargo/{amber,ambergris,camphor,coal,guano,gum_arabic,jade,nitrate}.glb* roblox-games/mare-essentia/assets/people/{outfit_*,hair_*,acc_*}.glb* "$asset_root"/animals/discovery_{seagull,bald_eagle,panda,whale}.glb* "$asset_root"/town/{greenhouse-source,clock-tower-source,scarecrow-source,bread-oven-source,stage-curtain-source}.glb*; do
            if [[ ( "$f" == "$asset_root"/naval/nau-source.glb || "$f" == "$asset_root"/naval/nau-custom.glb* || "$f" == "$asset_root"/naval/atlantic_brigantine-custom.glb* || "$f" == "$asset_root"/naval/zanzibar_jahazi-custom.glb* || "$f" == "$asset_root"/naval/rowboat-source.glb || "$f" == "$asset_root"/naval/jahazi-custom.glb* || "$f" == "$asset_root"/naval/kotia-custom.glb* || "$f" == "$asset_root"/naval/mtepe-custom.glb* ) && ( "${{ steps.asset_registration.outcome }}" != "success" || "${{ steps.nau_check.outcome }}" != "success" ) ]]; then
              echo "SKIP_UNVERIFIED_EXTERNAL_CC0_HULL $f"
              continue
            fi
            if [[ ( "$f" == "$asset_root"/relics/weapon-*.glb* || "$f" == "$asset_root"/naval/fishing-net.glb* || "$f" == "$asset_root"/naval/net-floats.glb* || "$f" == "$asset_root"/naval/galleon-heritage.glb* ) && "${{ steps.asset_registration.outcome }}" != "success" ]]; then
              echo "SKIP_UNVERIFIED_WEAPON_MODEL $f"
              continue
            fi
            if [[ "$f" == "$asset_root"/cargo/*.glb* && ( "${{ steps.cargo_quality.outcome }}" != "success" || "${{ steps.asset_registration.outcome }}" != "success" ) ]]; then
              echo "SKIP_UNREGISTERED_CARGO_QUALITY $f"
              continue
            fi
            # [26종 PBR 정본] 실제 Roblox 등록과 Universe 사용 권한이 확인된 원본만 같은 등록기에서 승격한다.
            if [[ "$f" == "$asset_root"/people/* && "${{ steps.asset_registration.outcome }}" != "success" ]]; then
              echo "SKIP_UNREGISTERED_CHARACTER_PBR $f"
              continue
            fi
            if [[ "$f" == "$asset_root"/cardart/*.png && "${{ steps.asset_registration.outcome }}" != "success" ]]; then
              echo "SKIP_UNVERIFIED_MODEL_ORIGINAL $f"
              continue
            fi
            # [지상전 3D 실물] 등록·권한 확정 전에는 외부 GLB·권리 증빙·SOURCES 장부를 반영하지 않는다.
            if [[ "${{ steps.asset_registration.outcome }}" != "success" ]]; then
              if [[ "$f" == "$asset_root"/terrain/kenney_*.glb* || ( "$f" == "$asset_root"/SOURCES.md && ! -s "$verified_vegetation" && ! -s "$verified_london" ) ]]; then
                echo "SKIP_UNVERIFIED_KENNEY_NATURE $f"
                continue
              fi
            fi
            # [V5 원본 파일 승격] 등록번호와 Universe 사용 권한을 검증하기 전에는 GitHub 원본도 승격하지 않는다.
            if [[ "$f" == "$asset_root"/naval/*-v5*.glb* && ( "${{ steps.ship_v5.outcome }}" != "success" || "${{ steps.asset_registration.outcome }}" != "success" ) ]]; then
              echo "SKIP_UNREGISTERED_V5 $f"
              continue
            fi
            # [건축 원본] 완성 건물과 분리해 실제 원본 해시·번호·사용권이 모두 맞는 경우만 저장한다.
            if [[ "$f" == "$asset_root"/town/@(greenhouse-source|clock-tower-source|scarecrow-source|bread-oven-source|stage-curtain-source|observatory-dome-source|opera-curtain-*-source|london-@(rope-twist-02|wooden-ladder|wood-stake|brick|scroll-01|wheelbarrow|building-scaffolding|firewood-01|wood-barrel|clothes-peg|noticeboard|shovel-01|chicken-coop|awning-02|column-leg-bench|pick-axe|saw-horse|wooden-mallet|wooden-produce-crate|curved-stone-bench|finger-post-sign-01|flower-pot|rustic-wood-hand-basket|statue-base|architrave-heritage|awning-01|brick-hammer|brick-trowel|cartwheel|chisel|english-bond-brick|iron-flambeaux-01|stone-archway-01|stone-archway-02|wall-open-scaffold|water-drip|wooden-gate-01)-source).glb* ]]; then
              if [ ! -e "$f" ]; then continue; fi
              if [[ "${{ steps.asset_registration.outcome }}" != "success" ]]; then
                echo "SKIP_UNVERIFIED_TOWN_ORIGINAL $f"
                continue
              fi
              python3 - "$f" <<'PYTOWN'
          import hashlib,json,pathlib,sys
          root=pathlib.Path('roblox-games/mare-essentia')
          path=pathlib.Path(sys.argv[1].removesuffix('.license.json'))
          proof=json.loads(path.with_suffix('.glb.license.json').read_text())
          row=json.loads((root/'assets-registered.json').read_text())['assets'].get('Town/'+path.stem,{})
          data=path.read_bytes()
          digest=hashlib.sha256(data).hexdigest()
          blob=hashlib.sha1(('blob %d\0'%len(data)).encode()+data).hexdigest()
          if not ((not proof.get('pinnedBlobSha') or proof['pinnedBlobSha']==blob) and proof['sourceSha256']==proof['originalSha256']==proof['sha256']==digest==row.get('sourceSha256')
                  and proof['bytes']==len(data) and proof['license']=='CC0-1.0' and row.get('license')=='CC0-1.0'
                  and row.get('source')==str(path) and row.get('assetType')=='Model'
                  and row.get('usePermissionGranted') is True and str(row.get('assetId','')).isdigit()
                  and int(row['assetId'])>0):
              raise SystemExit('MARE_TOWN_ORIGINAL_REGISTRATION_UNVERIFIED:'+path.stem)
          print('MARE_TOWN_ORIGINAL_REGISTERED',path.stem,digest,row['assetId'])
          PYTOWN
            fi
            # [발견물] 실제 원본과 로블록스 번호·Universe 사용권을 모두 대조한다.
            if [[ "$f" == "$asset_root"/animals/discovery_*.glb* ]]; then
              if [[ "${{ steps.asset_registration.outcome }}" != "success" ]]; then
                echo "SKIP_UNVERIFIED_DISCOVERY_MODEL $f"
                continue
              fi
              python3 - "$f" <<'PYBIRD'
          import hashlib,json,pathlib,sys
          root=pathlib.Path('roblox-games/mare-essentia')
          path=pathlib.Path(sys.argv[1].removesuffix('.license.json'))
          if not path.exists(): sys.exit(0)
          proof=json.loads(path.with_suffix('.glb.license.json').read_text())
          row=json.loads((root/'assets-registered.json').read_text())['assets'].get('Animals/'+path.stem,{})
          data=path.read_bytes()
          digest=hashlib.sha256(data).hexdigest()
          blob=hashlib.sha1(('blob %d\0'%len(data)).encode()+data).hexdigest()
          if not (proof['sourceSha256']==digest==row.get('sourceSha256') and proof['pinnedBlobSha']==blob
                  and proof['license']=='CC0-1.0' and row.get('source')==str(path)
                  and row.get('assetType')=='Model' and row.get('usePermissionGranted') is True
                  and str(row.get('assetId','')).isdigit() and int(row['assetId'])>0):
              raise SystemExit('MARE_DISCOVERY_ORIGINAL_REGISTRATION_UNVERIFIED:'+path.stem)
          print('MARE_DISCOVERY_ORIGINAL_REGISTERED',path.stem,digest,row['assetId'])
          PYBIRD
            fi
            if [ ! -e "$f" ]; then echo "SKIP_MISSING $f"; continue; fi
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1 && git diff --quiet -- "$f"; then echo "SKIP_UNCHANGED $f"; continue; fi
            # [등록 장부 저장] 체크아웃 원본을 기준으로 재시도하며 동시 수정은 덮어쓰지 않는다.
            sha="$(git rev-parse --verify "HEAD:$f" 2>/dev/null || true)"
            expected_blob="$(git hash-object "$f")"
            payload="$(mktemp)"
            read_error="$(mktemp)"
            python3 - "$f" "$sha" "$payload" <<'PYJSON'
          import base64
          import json
          import os
          import pathlib
          import sys
          source, current_sha, output = sys.argv[1:]
          body = {
              "message": "Mare Essentia: Roblox 등록 자산 ID 갱신",
              "content": base64.b64encode(pathlib.Path(source).read_bytes()).decode("ascii"),
              "branch": os.environ["GITHUB_REF_NAME"],
          }
          if current_sha:
              body["sha"] = current_sha
          pathlib.Path(output).write_text(json.dumps(body), encoding="utf-8")
          PYJSON
            # 최대 4회 저장, 매 시도 전 및 마지막에 원격 blob 확인. 502/응답 오류 뒤 성공한 저장은 반복하지 않는다.
            saved_blob=""
            for attempt in 1 2 3 4 5; do
              if ! saved_blob="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${f}?ref=${GITHUB_REF_NAME}" --jq .sha 2>"$read_error")"; then
                saved_blob=""
                if [[ -n "$sha" ]] || ! grep -Fq 'HTTP 404' "$read_error"; then
                  echo "MARE_ASSET_READ_RETRY $attempt $f" >&2
                  if [[ "$attempt" -lt 5 ]]; then sleep "$((attempt * 3))"; fi
                  continue
                fi
              elif [[ ! "$saved_blob" =~ ^[0-9a-f]{40}$ ]]; then
                saved_blob=""
                echo "MARE_ASSET_READ_INVALID_SHA $attempt $f" >&2
                if [[ "$attempt" -lt 5 ]]; then sleep "$((attempt * 3))"; fi
                continue
              fi
              [[ "$saved_blob" == "$expected_blob" ]] && break
              if [[ "$saved_blob" != "$sha" ]]; then
                rm -f "$payload" "$read_error"
                echo "::error::MARE_ASSET_CONCURRENT_WRITE:$f" >&2
                exit 1
              fi
              [[ "$attempt" -lt 5 ]] || break
              if ! gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/${f}" --input "$payload" > /dev/null; then
                echo "MARE_ASSET_WRITE_RESPONSE_ERROR $attempt $f" >&2
                sleep "$((attempt * 3))"
              fi
            done
            rm -f "$payload" "$read_error"
            if [[ "$saved_blob" != "$expected_blob" ]]; then
              echo "::error::MARE_ASSET_WRITE_NOT_VERIFIED:$f" >&2
              exit 1
            fi
            echo "COMMITTED $f"
          done
          # [등록 완료 정리] 원본·라이선스·등록 ID 반영 후에만 동일 inbox 파일을 제거한다.
          for f in "${london_files[@]}"; do
            if [[ "$f" == */assets/terrain/veg_* ]]; then
              src="roblox-games/mare-essentia/assets/inbox/Terrain/${f##*/}"
            else
              src="roblox-games/mare-essentia/assets/inbox/Town/${f##*/}"
            fi
            original="$(git rev-parse "HEAD:$src")"
            current="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${src}?ref=main" --jq .sha)"
            saved="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${f}?ref=main" --jq .sha)"
            [[ "$current" == "$original" && "$saved" == "$(git hash-object "$f")" ]] || exit 1
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/contents/${src}" -f message="Mare Essentia: remove registered London inbox copy" -f sha="$current" -f branch=main --silent
          done
          # 정상 건축·식생은 위에서 저장했다. 미등록 원본은 보존하고 전체 완료로 표시하지 않는다.
          if [[ "${{ steps.london_source.outcome }}" == "success" ]] && { [[ -s "$pending_london" ]] || compgen -G 'roblox-games/mare-essentia/assets/inbox/Town/london_*.glb' >/dev/null; }; then
            echo "::error::MARE_LONDON_REGISTRATION_PARTIAL"
            exit 1
          fi
          if [[ "${{ steps.london_source.outcome }}" == "success" ]] && { [[ -s "$pending_vegetation" ]] || compgen -G 'roblox-games/mare-essentia/assets/inbox/Terrain/veg_*.glb' >/dev/null; }; then
            echo "::error::MARE_VEGETATION_REGISTRATION_PARTIAL"
            exit 1
          fi

      - name: Publish the place with the new asset IDs
        if: ${{ inputs.publish_after_register == true && inputs.studio_regrant != true && success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run owner-mare-essentia-direct-publish.yml --ref main -f universe_id="${{ inputs.universe_id }}"
