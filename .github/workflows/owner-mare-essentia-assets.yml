# 파일명: .github/workflows/owner-mare-essentia-assets.yml
# Mare Essentia: CC0 모델과 CC BY 3.0 메뉴 그림을 기존 Open Cloud 등록 통로로 등록한다.
# main 자산 변경 또는 수동 실행 시 동작하며 게임 게시 기본값은 꺼져 있다.
name: Owner Mare Essentia Register Assets
run-name: Owner Mare Essentia assets · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/owner-mare-essentia-assets.yml'
      - 'roblox-games/mare-essentia/assets/**'
      - 'roblox-games/mare-essentia/assets-wanted.seed.json'
      - 'tools/devloop/assets_wanted.py'
      - 'qa/company-roblox-dedicated-experience.test.mjs'
      - 'tools/mare-essentia-upload-assets.mjs'
  # [자체 연습] 기존 무료 자산 등록 절차에서 하루 한 번 누락된 3D 원본만 재검사한다.
  schedule:
    - cron: '20 19 * * *'
  workflow_dispatch:
    inputs:
      universe_id:
        description: 'Universe ID (사용 권한을 줄 체험)'
        type: string
        required: false
        default: '10775310508'
      studio_regrant:
        description: '실제 Studio 실패 보고서의 미디어만 권한 재검증(원본 재업로드 금지)'
        type: boolean
        required: false
        default: false
      publish_after_register:
        description: '자산 등록 확인 후 게시까지 할지 (기본: 게시 안 함)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: owner-mare-essentia-assets
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Practice and verify approved trade goods using existing asset ledger
        id: trade_goods
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/devloop/assets_wanted.py roblox-games/mare-essentia --verify-goods
          python3 - <<'PY'
          import json,os
          report=json.load(open('roblox-games/mare-essentia/assets-wanted.json',encoding='utf-8'))
          j=report['tradeGoodsPractice']
          s=j['stats']
          if s['targetCount']!=16 or s['excludedCount']!=2 or s['blocked']!=2:
              raise SystemExit('TRADE_GOODS_PRACTICE_COVERAGE_MISMATCH')
          if s['invalid']:
              raise SystemExit('TRADE_GOODS_PRACTICE_INVALID')
          # [교역품 3D] 현재 항구 상품 69종을 현행 Cargo 등록/실물/권한과 반복 대조한다.
          three=report['tradeGoods3DPractice']
          t=three['stats']
          if t['targetCount']<69 or t['targetCount']!=len(three['goods']):
              raise SystemExit('TRADE_GOODS_3D_CATALOG_INCOMPLETE')
          if t['targetCount']!=t['registeredSourceChecked']+t['missingExactModel']+t['unverified']+t['visualRestricted']:
              raise SystemExit('TRADE_GOODS_3D_COVERAGE_INCONSISTENT')
          if t['unverified']:
              raise SystemExit('TRADE_GOODS_3D_REGISTERED_SOURCE_OR_RIGHTS_INVALID')
          if any(row['state']=='REGISTERED_SOURCE_CHECKED_RUNTIME_PENDING' and
                 (not row.get('sourceSha256') or not row.get('assetId')) for row in three['goods']):
              raise SystemExit('TRADE_GOODS_3D_SOURCE_PROVENANCE_MISSING')
          print('TRADE_GOODS_3D_TARGET='+str(t['targetCount']))
          print('TRADE_GOODS_3D_SOURCE_CHECKED='+str(t['registeredSourceChecked']))
          print('TRADE_GOODS_3D_MISSING='+str(t['missingExactModel']))
          print('TRADE_GOODS_3D_RUNTIME_VERIFIED=NO')
          pending=s['readyToRegister']+s['permissionPending']
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write(f'pending={pending}\n')
          print('TRADE_GOODS_APPROVED_REGISTRATION_PENDING='+str(pending))
          print('TRADE_GOODS_AUTO_GAME_PUBLISH=NO')
          PY

      - name: Check trade goods practice and safe ingredient game bindings
        shell: bash
        run: |
          node --test --test-name-pattern='Mare trade' qa/company-roblox-dedicated-experience.test.mjs

      - name: Upload licensed models and menu icons to Roblox and write AssetIds
        # 정기 연습은 무료 정적 진단만 수행한다. 신규/변경 승인 자산 업로드는 기존 push·수동 경로.
        if: ${{ github.event_name != 'schedule' }}
        env:
          MARE_UNIVERSE_ID: ${{ inputs.universe_id }}
          # 새 소유 계정(Anyanguy1980) 키만 사용한다. 제재 계정 쿠키는 넘기지 않는다.
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_DEPLOY_API_KEY }}
          ROBLOX_CREATOR_USER_ID: '11664914771'
          STUDIO_REGRANT: ${{ inputs.studio_regrant || false }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ROBLOX_OPEN_CLOUD_API_KEY:-}" ]]; then
            echo "::error::MARE_1980_DEPLOY_API_KEY_MISSING" >&2
            exit 1
          fi
          if [[ "$STUDIO_REGRANT" == "true" ]]; then
            # [기존 실측 증거] 별도 공식 Studio 출력 브랜치에서 실제 실패 자산만 가져온다.
            git fetch --no-tags --depth=1 origin refs/heads/mare-essentia-studio-frames
            git show FETCH_HEAD:report.json > "$RUNNER_TEMP/mare-studio-report.json"
            node tools/mare-essentia-upload-assets.mjs "--studio-regrant=$RUNNER_TEMP/mare-studio-report.json"
          else
            node tools/mare-essentia-upload-assets.mjs
          fi

      - name: Refresh asset practice ledger after Roblox registration
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/devloop/assets_wanted.py roblox-games/mare-essentia --verify-goods
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            python3 - <<'PY'
          import json
          report = json.load(open("roblox-games/mare-essentia/assets-wanted.json", encoding="utf-8"))
          audit = report["tradeGoods3DPractice"]
          s = audit["stats"]
          complete = (s["targetCount"] == 69 and s["visualRestricted"] == 4
                      and s["registeredSourceChecked"] == 65
                      and s["missingExactModel"] == 0 and s["unverified"] == 0)
          if not complete:
              raise SystemExit("TRADE_GOODS_3D_REGISTRATION_NOT_COMPLETE:" + json.dumps(s))
          for row in audit["goods"]:
              if row["state"] == "VISUAL_POLICY_RESTRICTED":
                  continue
              if (row["state"] != "REGISTERED_SOURCE_CHECKED_RUNTIME_PENDING"
                  or not row["assetId"] or not row["sourceSha256"] or not row["source"]):
                  raise SystemExit("TRADE_GOODS_3D_ITEM_NOT_VERIFIED:" + row["id"])
          print("TRADE_GOODS_3D_ALL_ALLOWED_REGISTERED_WITH_UNIVERSE_RIGHTS=65")
          print("TRADE_GOODS_3D_RUNTIME_AND_VISUAL_QA=UNVERIFIED")
          PY
          fi

      - name: Commit registered asset IDs (API, main이 움직여도 안전)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for f in roblox-games/mare-essentia/assets-registered.json roblox-games/mare-essentia/src/ReplicatedStorage/Shared/AssetIds.luau roblox-games/mare-essentia/assets-wanted.json; do
            if [ ! -e "$f" ]; then echo "SKIP_MISSING $f"; continue; fi
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1 && git diff --quiet -- "$f"; then echo "SKIP_UNCHANGED $f"; continue; fi
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${f}?ref=${GITHUB_REF_NAME}" --jq .sha 2>/dev/null || true)"
            # 대용량 이미지의 base64를 명령행 인자로 넘기면 ARG_MAX를 초과한다.
            # 기존 GitHub Contents API로 전송하되 JSON 본문을 임시 파일로 전달한다.
            payload="$(mktemp)"
            python3 - "$f" "$sha" "$payload" <<'PYJSON'
          import base64
          import json
          import os
          import pathlib
          import sys
          source, current_sha, output = sys.argv[1:]
          body = {
              "message": "Mare Essentia: Roblox 등록 자산 ID 갱신",
              "content": base64.b64encode(pathlib.Path(source).read_bytes()).decode("ascii"),
              "branch": os.environ["GITHUB_REF_NAME"],
          }
          if current_sha:
              body["sha"] = current_sha
          pathlib.Path(output).write_text(json.dumps(body), encoding="utf-8")
          PYJSON
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/${f}" --input "$payload" --silent
            rm -f "$payload"
            echo "COMMITTED $f"
          done

      - name: Publish the place with the new asset IDs
        if: ${{ inputs.publish_after_register == true && inputs.studio_regrant != true && success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run owner-mare-essentia-direct-publish.yml --ref main -f universe_id="${{ inputs.universe_id }}"
