name: TMP Apply Adaptive Parallel 20 Main

on:
  push:
    branches: [feat/adaptive-parallel-20-policy-final]
    paths:
      - 'tools/apply-adaptive-parallel-20-main.mjs'
      - '.github/workflows/tmp-apply-adaptive-parallel-20-main.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/adaptive-parallel-20-policy-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply central 20-slot migration
        id: migrate
        continue-on-error: true
        run: node tools/apply-adaptive-parallel-20-main.mjs > qa/tmp-main20-migration.log 2>&1
      - name: Persist migration diagnostics
        if: steps.migrate.outcome == 'failure'
        run: |
          git config user.name 'jaewoon-vibe2-migration'
          git config user.email 'vibe2-migration@users.noreply.github.com'
          git add -f qa/tmp-main20-migration.log
          git commit -m 'debug: capture main20 migration failure'
          git push origin HEAD:feat/adaptive-parallel-20-policy-final
      - name: Stop on migration failure
        if: steps.migrate.outcome == 'failure'
        run: exit 1
      - name: Verify main parallelism contract
        run: node --test qa/vibe2-parallelism-main-contract.test.mjs
      - name: Verify central policy regression
        run: node --test qa/company-central-policy-contract.test.mjs
      - name: Commit verified policy changes
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-vibe2-migration'
          git config user.email 'vibe2-migration@users.noreply.github.com'
          git add COMPANY_FLOW.md VIBE2_PARALLEL_ARCHITECTURE.md qa/vibe2-parallelism-main-contract.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'vibe2: unify central policy on adaptive 20-slot parallelism'
          git push origin HEAD:feat/adaptive-parallel-20-policy-final
