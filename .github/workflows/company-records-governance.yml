name: Company Records Governance

on:
  pull_request:
    branches: [main]
    paths:
      - 'company-records/**'
      - 'assets/runtime-evidence/**'
      - 'company-learning/platform-release-roadmap.json'
      - 'company-learning/company-architecture-map.json'
      - 'company-learning/company-log-map.json'
      - 'company-learning/security-immune-system.json'
      - 'tools/company-records-governance.mjs'
      - 'qa/company-records-governance.test.mjs'
      - 'qa/company-central-policy-contract.test.mjs'
      - '.github/workflows/company-records-governance.yml'
  push:
    branches: [main]
    paths:
      - 'company-records/**'
      - 'assets/runtime-evidence/**'
      - 'company-learning/platform-release-roadmap.json'
      - 'company-learning/company-architecture-map.json'
      - 'company-learning/company-log-map.json'
      - 'company-learning/security-immune-system.json'
      - 'tools/company-records-governance.mjs'
      - 'qa/company-records-governance.test.mjs'
      - 'qa/company-central-policy-contract.test.mjs'
      - '.github/workflows/company-records-governance.yml'
  schedule:
    - cron: '10 21 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'validate or prune'
        required: false
        default: 'validate'
        type: choice
        options:
          - validate
          - prune

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: company-records-governance-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  records-governance:
    name: Records Schema and File Hygiene
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout governed revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate record tooling syntax
        run: |
          set -euo pipefail
          node --check tools/company-records-governance.mjs
          node -e "JSON.parse(require('fs').readFileSync('company-records/record-contract.json','utf8'))"

      - name: Run record contract tests
        run: |
          set -euo pipefail
          node --test qa/company-records-governance.test.mjs
          node --test qa/company-central-policy-contract.test.mjs

      - name: Scan all governed records and runtime media
        run: |
          set -euo pipefail
          node tools/company-records-governance.mjs --scan

      - name: Validate central document retention and growth
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base_sha="${PR_BASE_SHA:-${PUSH_BASE_SHA:-}}"
          if [ -n "$base_sha" ] && ! [[ "$base_sha" =~ ^0+$ ]]; then
            if ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$base_sha"
            fi
            git cat-file -e "$base_sha^{commit}"
            node tools/company-records-governance.mjs --central-report "--central-base=$base_sha"
          else
            node tools/company-records-governance.mjs --central-report
          fi

      - name: Scheduled records hygiene summary
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          echo "COMPANY_RECORDS_SCHEDULE=${{ github.event.schedule }}"
          node tools/company-records-governance.mjs --summary
          echo 'COMPANY_RECORDS_SCHEDULED_HYGIENE=PASS'

  central-current-use-prune:
    name: Auto-prune unused central policy
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'prune')
    runs-on: ubuntu-slim
    timeout-minutes: 30
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify pruning tool
        run: |
          set -euo pipefail
          node --check tools/company-records-governance.mjs
          node --test qa/company-records-governance.test.mjs

      - name: Archive unused central documents and keep only current references
        id: prune
        run: |
          set -euo pipefail
          node tools/company-records-governance.mjs --central-auto-prune | tee /tmp/central-auto-prune.log
          git diff --check
          if git diff --quiet -- company-learning/platform-release-roadmap.json company-learning/company-architecture-map.json company-learning/company-log-map.json company-records/operations; then
            echo "changed=NO" >> "$GITHUB_OUTPUT"
            echo 'CENTRAL_POLICY_CURRENT_USE_PRUNE=NO_CHANGE'
          else
            echo "changed=YES" >> "$GITHUB_OUTPUT"
            echo 'CENTRAL_POLICY_CURRENT_USE_PRUNE=CHANGED'
          fi

      - name: Open, validate, and merge automatic current-use policy PR
        if: steps.prune.outputs.changed == 'YES'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="records/central-current-use-${GITHUB_RUN_ID}"
          git config user.name 'jaewoon-records-governance'
          git config user.email 'actions@users.noreply.github.com'
          git switch -c "$branch"
          git add company-learning/platform-release-roadmap.json company-learning/company-architecture-map.json company-learning/company-log-map.json company-records/operations
          git commit -m 'records: auto-prune unused central policy'
          head_sha="$(git rev-parse HEAD)"
          git push origin "$branch"
          pr_url="$(gh pr create --base main --head "$branch" --title 'records: auto-prune unused central policy' --body '자동 현재사용 참조 스캔 결과에 따라 미사용 중앙정책/아키텍처/로그 블록을 company-records로 아카이브하고 중앙문서에서 제거합니다. 현재 코드 참조와 핵심 핀은 유지되고 제거 내용은 먼저 company-records에 아카이브됩니다.')"
          echo "CENTRAL_POLICY_AUTO_PR=$pr_url"

          dispatch() {
            local workflow="$1"
            shift
            gh workflow run "$workflow" --ref "$branch" "$@"
          }
          find_run() {
            local workflow="$1"
            local run_id=""
            for attempt in $(seq 1 40); do
              run_id="$(gh run list --workflow "$workflow" --branch "$branch" --event workflow_dispatch --limit 20 --json databaseId,headSha,createdAt --jq ".[] | select(.headSha==\"$head_sha\") | .databaseId" | head -n 1)"
              if [ -n "$run_id" ]; then
                printf '%s' "$run_id"
                return 0
              fi
              sleep 3
            done
            return 1
          }

          dispatch company-records-governance.yml -f mode=validate
          dispatch company-central-policy-contract-qa.yml
          dispatch company-security-immune.yml

          records_run="$(find_run company-records-governance.yml)"
          policy_run="$(find_run company-central-policy-contract-qa.yml)"
          security_run="$(find_run company-security-immune.yml)"
          echo "CENTRAL_POLICY_AUTO_RECORDS_RUN=$records_run"
          echo "CENTRAL_POLICY_AUTO_POLICY_RUN=$policy_run"
          echo "CENTRAL_POLICY_AUTO_SECURITY_RUN=$security_run"

          gh run watch "$records_run" --exit-status
          gh run watch "$policy_run" --exit-status
          gh run watch "$security_run" --exit-status

          gh pr merge "$pr_url" --squash --delete-branch
          echo 'CENTRAL_POLICY_AUTO_PRUNE_MERGE=PASS'
