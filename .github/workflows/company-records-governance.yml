name: Company Records Governance

on:
  pull_request:
    branches: [main]
    paths:
      - 'company-records/**'
      - 'assets/runtime-evidence/**'
      - 'company-directive.json'
      - 'company-learning/platform-release-roadmap.json'
      - 'tools/company-policy-steward.mjs'
      - 'qa/company-policy-steward.test.mjs'
      - 'company-learning/company-architecture-map.json'
      - 'company-learning/company-log-map.json'
      - 'company-learning/security-immune-system.json'
      - 'tools/company-records-governance.mjs'
      - 'qa/company-records-governance.test.mjs'
      - 'qa/company-shared-context-retained.test.mjs'
      - '.github/workflows/company-records-governance.yml'
  push:
    branches: [main]
    paths:
      - 'company-records/**'
      - 'assets/runtime-evidence/**'
      - 'company-directive.json'
      - 'company-learning/platform-release-roadmap.json'
      - 'tools/company-policy-steward.mjs'
      - 'qa/company-policy-steward.test.mjs'
      - 'company-learning/company-architecture-map.json'
      - 'company-learning/company-log-map.json'
      - 'company-learning/security-immune-system.json'
      - 'tools/company-records-governance.mjs'
      - 'qa/company-records-governance.test.mjs'
      - 'qa/company-shared-context-retained.test.mjs'
      - '.github/workflows/company-records-governance.yml'
  schedule:
    - cron: '10 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: company-records-governance-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  records-governance:
    name: Records Schema and File Hygiene
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout governed revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate record tooling syntax
        run: |
          set -euo pipefail
          node --check tools/company-records-governance.mjs
          node -e "JSON.parse(require('fs').readFileSync('company-records/record-contract.json','utf8'))"

      - name: Run record contract tests
        run: |
          set -euo pipefail
          node --test qa/company-records-governance.test.mjs
          node --test qa/company-shared-context-retained.test.mjs

      - name: Audit four central documents without blocking game development
        continue-on-error: true
        run: |
          set -euo pipefail
          node --check tools/company-policy-steward.mjs
          node --test qa/company-policy-steward.test.mjs
          node tools/company-policy-steward.mjs

      - name: Scan all governed records and runtime media
        run: |
          set -euo pipefail
          node tools/company-records-governance.mjs --scan

      - name: Validate central document retention and growth
        env:
          COMPANY_VERIFIED_POLICY_PATH: company-learning/platform-release-roadmap.json
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          node tools/company-constitution-enforcer.mjs --phase=records-governance
          base_sha="${PR_BASE_SHA:-${PUSH_BASE_SHA:-}}"
          if [ -n "$base_sha" ] && ! [[ "$base_sha" =~ ^0+$ ]]; then
            if ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$base_sha"
            fi
            git cat-file -e "$base_sha^{commit}"
            node tools/company-records-governance.mjs --central-report "--central-base=$base_sha"
          else
            node tools/company-records-governance.mjs --central-report
          fi

      - name: Scheduled records hygiene summary
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          echo "COMPANY_RECORDS_SCHEDULE=${{ github.event.schedule }}"
          node tools/company-records-governance.mjs --summary
          echo 'COMPANY_RECORDS_SCHEDULED_HYGIENE=PASS'

