name: Temporary deterministic-first Web patch

on:
  push:
    branches:
      - fix/web-deterministic-first-ai-optional-20260915

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/web-deterministic-first-ai-optional-20260915
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic-first model-lazy Web patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          bootstrap = Path('tools/company-development-web-bootstrap.mjs')
          text = bootstrap.read_text()
          old = """  let result,review,generation;
          if(preserved?.preservationEligible&&!forceRepair){
            result=preserved;
            review=preserved.review;
            generation={mode:preserved.generationMode,modelAttempts:0,modelContractFailures:[],modelUsed:false,modelInvoked:false,sourcePreserved:true,forcedRepair:false,model:null,developmentContext};
          }else{
            await ensureLocalVibeRuntime(model);
            const vibe=await buildVibePlayable({gameId,gameName,baseline,inventory,model,existingHtml:preserved?.html||'',preservationBlockers,developmentContext});
            ({result,review,generation}=vibe);
            generation={...generation,forcedRepair:Boolean(forceRepair)};
            if(!result){
              if(preserved)throw new Error(`VIBE2_PRESERVED_SOURCE_REPAIR_FAILED:${(generation.modelContractFailures||[]).join(' || ')||'no-valid-model-candidate'}`);
              try{
                const fallback=buildContractSafePlayable({gameId,gameName,baseline});
                result=fallback;
                review=fallback.review||validateBootstrapHtml(fallback.html,{scopeInventory:fallback.approvedScopeInventory});
                generation={...generation,mode:'VIBE2_FAILED_SAFE_GENRE_FALLBACK',fallbackMode:fallback.generationMode,sourcePreserved:false};
              }catch(error){
                const modelFailure=(generation.modelContractFailures||[]).join(' || ');
                throw new Error(`VIBE2_PRIMARY_IMPLEMENTATION_FAILED:${modelFailure||'no-valid-model-candidate'};${String(error?.message||error)}`);
              }
            }
          }
          """
          new = """  let result,review,generation;
          if(preserved?.preservationEligible&&!forceRepair){
            result=preserved;
            review=preserved.review;
            generation={mode:preserved.generationMode,modelAttempts:0,modelContractFailures:[],modelUsed:false,modelInvoked:false,sourcePreserved:true,forcedRepair:false,deterministicAttempted:false,deterministicFailure:null,model:null,developmentContext};
          }else{
            let deterministicFailure='';
            if(!preserved&&!forceRepair){
              try{
                const deterministic=buildContractSafePlayable({gameId,gameName,baseline});
                result=deterministic;
                review=deterministic.review||validateBootstrapHtml(deterministic.html,{scopeInventory:deterministic.approvedScopeInventory});
                generation={mode:'DETERMINISTIC_GENRE_IMPLEMENTATION',fallbackMode:deterministic.generationMode,modelAttempts:0,modelContractFailures:[],modelUsed:false,modelInvoked:false,sourcePreserved:false,forcedRepair:false,deterministicAttempted:true,deterministicFailure:null,model:null,developmentContext};
              }catch(error){
                deterministicFailure=String(error?.message||error).replace(/\\s+/g,' ').slice(0,1800);
              }
            }
            if(!result){
              await ensureLocalVibeRuntime(model);
              const vibe=await buildVibePlayable({gameId,gameName,baseline,inventory,model,existingHtml:preserved?.html||'',preservationBlockers,developmentContext});
              ({result,review,generation}=vibe);
              generation={...generation,forcedRepair:Boolean(forceRepair),deterministicAttempted:!preserved&&!forceRepair,deterministicFailure:deterministicFailure||null};
              if(!result){
                if(preserved)throw new Error(`VIBE2_PRESERVED_SOURCE_REPAIR_FAILED:${(generation.modelContractFailures||[]).join(' || ')||'no-valid-model-candidate'}`);
                const modelFailure=(generation.modelContractFailures||[]).join(' || ');
                throw new Error(`VIBE2_PRIMARY_IMPLEMENTATION_FAILED:${modelFailure||'no-valid-model-candidate'};${deterministicFailure||'DETERMINISTIC_IMPLEMENTATION_UNAVAILABLE'}`);
              }
            }
          }
          """
          if text.count(old) != 1:
              raise SystemExit(f'bootstrap replacement count={text.count(old)}')
          text = text.replace(old, new)
          marker = "  console.log('VIBE2_PRIMARY_DEVELOPER=YES');\n"
          replacement = "  console.log('VIBE2_PRIMARY_DEVELOPER=YES');\n  console.log('DETERMINISTIC_FIRST=YES');\n  console.log('BOOTSTRAP_MODE='+generation.mode);\n"
          if text.count(marker) != 1:
              raise SystemExit(f'bootstrap log marker count={text.count(marker)}')
          bootstrap.write_text(text.replace(marker, replacement))

          workflow = Path('.github/workflows/company-development-confirmed-runtime.yml')
          w = workflow.read_text()
          eager = "      - name: Prepare local Vibe2 model for development cycles\n" + "        if: matrix.runtimeStage == 'initial-cycle' && matrix.existingWebValidated != true\n" + "        uses: ./.github/actions/prepare-ollama\n" + "        with:\n" + "          model: qwen3:1.7b\n" + "          pull-model: 'true'\n\n"
          if w.count(eager) != 1:
              raise SystemExit(f'eager model step count={w.count(eager)}')
          workflow.write_text(w.replace(eager, ''))

          qa = Path('qa/company-development-web-runtime.test.mjs')
          q = qa.read_text()
          anchor = """test('legacy frozen implementation context requires an exact canonical game and seed binding',()=>{
          """
          test_block = """test('Web bootstrap is deterministic-first and only prepares a model on demand',()=>{
            const source=fs.readFileSync('tools/company-development-web-bootstrap.mjs','utf8');
            const start=source.indexOf('export async function buildFirstPlayable');
            const end=source.indexOf('async function main()',start);
            const body=source.slice(start,end);
            const deterministicIndex=body.indexOf('buildContractSafePlayable({gameId,gameName,baseline})');
            const modelIndex=body.indexOf('await ensureLocalVibeRuntime(model)');
            assert.ok(deterministicIndex>=0,'deterministic implementation attempt missing');
            assert.ok(modelIndex>deterministicIndex,'model runtime must be prepared only after deterministic attempt');
            assert.match(body,/mode:'DETERMINISTIC_GENRE_IMPLEMENTATION'/);
            assert.match(source,/DETERMINISTIC_FIRST=YES/);
            assert.match(source,/BOOTSTRAP_MODE=/);
            const workflow=fs.readFileSync('.github/workflows/company-development-confirmed-runtime.yml','utf8');
            assert.doesNotMatch(workflow,/name: Prepare local Vibe2 model for development cycles/);
            assert.doesNotMatch(workflow,/uses: \.\/\.github\/actions\/prepare-ollama/);
          });

          """
          if q.count(anchor) != 1:
              raise SystemExit(f'qa anchor count={q.count(anchor)}')
          qa.write_text(q.replace(anchor, test_block+anchor))
          PY

          node --check tools/company-development-web-bootstrap.mjs
          node --test qa/company-development-web-runtime.test.mjs
          node --test qa/company-development-validation-selected-platform.test.mjs qa/company-web-validation-evidence-contract.test.mjs
      - name: Commit final candidate without temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-deterministic-first-ai-optional-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/company-development-web-bootstrap.mjs .github/workflows/company-development-confirmed-runtime.yml qa/company-development-web-runtime.test.mjs
          git diff --cached --check
          git commit -m "fix(web): prefer deterministic implementation before optional AI"
          git push origin HEAD:fix/web-deterministic-first-ai-optional-20260915
