# one-shot migration trigger after workflow is present on main
name: One-shot Common Development Policy Migration

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply-common-development-quality-policy.mjs'
      - '.github/workflows/one-shot-common-development-policy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply idempotent policy migration
        run: |
          node --check tools/apply-common-development-quality-policy.mjs
          node tools/apply-common-development-quality-policy.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='qa/company-web-real-game-regression.test.mjs';
          let text=fs.readFileSync(file,'utf8');
          let changed=false;

          const schemaFrom="assert.equal(WEB_VALIDATION_SCHEMA_VERSION,13,'Web evidence schema must carry staged-play semantics');";
          const schemaTo="assert.equal(WEB_VALIDATION_SCHEMA_VERSION,14,'Web evidence schema must carry common-development-quality semantics');";
          if(!text.includes(schemaTo)){
            if(!text.includes(schemaFrom))throw new Error('SCHEMA14_REGRESSION_ASSERTION_ANCHOR_MISSING');
            text=text.replace(schemaFrom,schemaTo);
            changed=true;
          }

          const scopeFrom="    musicRuntime:{pass:true},runtimeSmokePassed:true,";
          const scopeTo="    musicRuntime:{pass:true},runtimeSmokePassed:true,\n    approvedScopeFullyImplemented:true,\n    scopeCoverage:{pass:true,mechanicBindings:['tower-place','wave','upgrade','economy','strategy']},";
          if(!text.includes(scopeTo)){
            if(!text.includes(scopeFrom))throw new Error('SCHEMA14_SCOPE_FIXTURE_ANCHOR_MISSING');
            text=text.replace(scopeFrom,scopeTo);
            changed=true;
          }

          const replayFrom="    strictReview:{totalScore:92,hardFailures:[]},webStrictScore:92,";
          const replayTo="    strictReview:{totalScore:92,hardFailures:[]},webStrictScore:92,\n    promotionRevalidation:{pass:true,independentRun:true,sourceHashMatch:true,baselineHashMatch:true,secondSubstancePass:true,secondContentDepthPass:true,secondTerminalReached:true},";
          if(!text.includes(replayTo)){
            if(!text.includes(replayFrom))throw new Error('SCHEMA14_REPLAY_FIXTURE_ANCHOR_MISSING');
            text=text.replace(replayFrom,replayTo);
            changed=true;
          }

          if(changed)fs.writeFileSync(file,text);
          NODE
      - name: Verify modified contract syntax
        run: |
          node --check tools/company-common-development-quality-contract.mjs
          node --check tools/company-web-validation-evidence-contract.mjs
          node --check tools/company-development-web-bootstrap.mjs
          node --check tools/company-development-web-gameplay-validation.mjs
          node --check tools/company-development-validation-cycle.mjs
      - name: Test common development quality contract
        run: node --test qa/company-common-development-quality-contract.test.mjs
      - name: Test web validation evidence contract
        id: web_validation_test
        continue-on-error: true
        run: node --test qa/company-web-validation-evidence-contract.test.mjs > web-validation-test.log 2>&1
      - name: Upload web validation test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-validation-test-log
          path: web-validation-test.log
          if-no-files-found: error
          retention-days: 1
      - name: Fail on web validation test error
        if: steps.web_validation_test.outcome != 'success'
        run: exit 1
      - name: Test selected platform validation contract
        run: node --test qa/company-development-validation-selected-platform.test.mjs
      - name: Test central policy contract
        run: node --test qa/company-central-policy-contract.test.mjs
      - name: Commit migration result to automation branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo 'MIGRATION_NO_CHANGES=YES'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add COMPANY_FLOW.md company-directive.json tools/company-common-development-quality-contract.mjs tools/company-web-validation-evidence-contract.mjs qa/company-common-development-quality-contract.test.mjs qa/company-development-validation-selected-platform.test.mjs qa/company-web-real-game-regression.test.mjs .github/workflows/company-central-policy-contract-qa.yml
          git commit -m 'apply common development quality policy'
          git push --force origin HEAD:refs/heads/automation/common-development-policy-migration
          echo 'MIGRATION_BRANCH=automation/common-development-policy-migration'
