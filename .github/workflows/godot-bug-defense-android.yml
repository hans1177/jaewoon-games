name: Bug Defense Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'godot-games/bug-defense/**'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Export Android debug APK
        id: export
        uses: firebelley/godot-export@v7.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: godot-games/bug-defense
          use_preset_export_path: true
          presets_to_export: Android
          export_debug: true
          cache: true

      - name: Align APK
        id: align
        shell: bash
        run: |
          set -euo pipefail
          APK="${{ steps.export.outputs.build_directory }}/Android/bug-defense.apk"
          ALIGNED="${RUNNER_TEMP}/bug-defense-aligned.apk"
          ZIPALIGN="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -n "$ZIPALIGN"
          "$ZIPALIGN" -p -f 4 "$APK" "$ALIGNED"
          echo "aligned_apk=$ALIGNED" >> "$GITHUB_OUTPUT"

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "${RUNNER_TEMP}/bug-defense-debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Sign APK
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks "${RUNNER_TEMP}/bug-defense-debug.keystore" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out "${RUNNER_TEMP}/bug-defense.apk" \
            "${{ steps.align.outputs.aligned_apk }}"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "${RUNNER_TEMP}/bug-defense.apk"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bug-defense-android-debug
          path: '${{ runner.temp }}/bug-defense.apk'
          if-no-files-found: error
