# 파일명: .github/workflows/vibe2-recovery-fast.yml
name: Vibe2 Recovery Fast

on:
  workflow_dispatch:
  repository_dispatch:
    types: [vibe2-recovery-fast]
  workflow_run:
    workflows:
      - Vibe2 Continuous Core
      - Company System AI Workers
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write
  actions: write

env:
  VIBE2_RUNNER_PRESSURE_DISPATCH_THRESHOLD: '4'

concurrency:
  # Recovery recomputes from the latest control state, so stale runs are disposable.
  group: vibe2-recovery-fast
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Escalate and redispatch recovery from latest control state
        id: recovery
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/company-recovery-escalation.mjs
          node --check tools/company-recovery-dispatch.mjs
          mkdir -p /tmp/vibe2-recovery-fast
          changed=0
          system_ai_queued=0
          system_ai_recovery_dispatched=0
          primary_ai_collaboration_requested=0
          vibe_requeued=0

          for attempt in 1 2 3; do
            rm -rf /tmp/vibe2-recovery-control
            git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main +refs/heads/vibe2-unreal-core:refs/remotes/origin/vibe2-unreal-core --quiet
            git worktree prune
            git worktree add --detach /tmp/vibe2-recovery-control origin/vibe2-unreal-core >/dev/null
            control=/tmp/vibe2-recovery-control

            test -f "$control/.vibe2/queue.json"
            test -f "$control/.vibe2/system-ai-queue.json" || printf '%s\n' '{"version":1,"kind":"company-system-ai-queue","policy":"PRIMARY_AI_SUPERVISED_FREE_EXTERNAL_AI_SYSTEM_WORK","tasks":[]}' > "$control/.vibe2/system-ai-queue.json"
            test -f "$control/.vibe2/recovery-queue.json" || printf '%s\n' '{"version":1,"kind":"company-recovery-queue","policy":"REPEATED_FAILURE_AND_BOTTLENECK_RECOVERY_WITH_VERIFIED_LEARNING","tasks":[]}' > "$control/.vibe2/recovery-queue.json"

            node tools/company-recovery-escalation.mjs --queue="$control/.vibe2/queue.json" --system-ai="$control/.vibe2/system-ai-queue.json" --recovery="$control/.vibe2/recovery-queue.json" | tee /tmp/vibe2-recovery-fast/escalation.log
            node tools/company-recovery-dispatch.mjs --route=all --queue="$control/.vibe2/queue.json" --system-ai="$control/.vibe2/system-ai-queue.json" --recovery="$control/.vibe2/recovery-queue.json" | tee /tmp/vibe2-recovery-fast/dispatch.log

            system_ai_recovery_dispatched="$(grep -Ec '^RECOVERY_DISPATCH=.*:SYSTEM_AI:[1-9][0-9]*$' /tmp/vibe2-recovery-fast/dispatch.log || true)"
            system_ai_queued="$(node -e "const q=require(process.argv[1]);process.stdout.write(String((q.tasks||[]).filter(t=>String(t.status||'').toLowerCase()==='queued').length))" "$control/.vibe2/system-ai-queue.json")"
            primary_ai_collaboration_requested="$(node -e "const q=require(process.argv[1]);process.stdout.write(String((q.tasks||[]).filter(t=>(t.evidence||[]).includes('primary-ai-collaboration:REQUESTED')).length))" "$control/.vibe2/recovery-queue.json")"
            # 누적 대기 작업 수는 새 복구가 아니다. 이번 호출이 돌려보낸 작업만 즉시 예약한다.
            vibe_requeued="$(awk -F= '$1 == "RECOVERY_GAME_REQUEUED_COUNT" { print $2 }' /tmp/vibe2-recovery-fast/dispatch.log)"
            [[ "$vibe_requeued" =~ ^[0-9]+$ ]]

            cd "$control"
            git config user.name 'jaewoon-vibe2-recovery-fast'
            git config user.email 'vibe2-recovery-fast@users.noreply.github.com'
            git add .vibe2/queue.json .vibe2/system-ai-queue.json .vibe2/recovery-queue.json

            if git diff --cached --quiet; then
              echo 'VIBE2_RECOVERY_FAST_WRITE=NO'
              changed=0
              break
            fi

            git commit -m 'vibe2: fast recovery escalation and redispatch [skip ci]'
            if git push origin HEAD:vibe2-unreal-core; then
              changed=1
              echo 'VIBE2_RECOVERY_FAST_WRITE=YES'
              break
            fi

            echo "VIBE2_RECOVERY_FAST_PUSH_RETRY=$attempt"
            cd "$GITHUB_WORKSPACE"
            rm -rf /tmp/vibe2-recovery-control
            sleep $((attempt * 2))
            test "$attempt" -lt 3
          done

          cd "$GITHUB_WORKSPACE"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "system_ai_queued=$system_ai_queued" >> "$GITHUB_OUTPUT"
          echo "system_ai_recovery_dispatched=$system_ai_recovery_dispatched" >> "$GITHUB_OUTPUT"
          echo "primary_ai_collaboration_requested=$primary_ai_collaboration_requested" >> "$GITHUB_OUTPUT"
          echo "vibe_requeued=$vibe_requeued" >> "$GITHUB_OUTPUT"
          echo "VIBE2_RECOVERY_FAST_SYSTEM_AI_QUEUED=$system_ai_queued"
          echo "VIBE2_RECOVERY_FAST_SYSTEM_AI_NEW_RECOVERY_DISPATCH=$system_ai_recovery_dispatched"
          echo "VIBE2_RECOVERY_FAST_PRIMARY_AI_COLLABORATION_REQUESTED=$primary_ai_collaboration_requested"
          echo "VIBE2_RECOVERY_FAST_GAME_REQUEUED=$vibe_requeued"
          if [ "$vibe_requeued" -gt 0 ]; then
            echo 'VIBE2_RECOVERY_FAST_GAME_WORKER_DISPATCH=PENDING_CAUSAL_RETURN_TO_GAME_PRIMARY_ATOMIC_REFILL'
          else
            echo 'VIBE2_RECOVERY_FAST_GAME_WORKER_DISPATCH=SKIPPED_NO_NEW_GAME_RECOVERY'
          fi

      - name: Return recovered game work to GAME_PRIMARY immediately
        if: steps.recovery.outputs.vibe_requeued != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pressure_file="$(mktemp)"
          pressure_code="$(curl --silent --show-error --output "$pressure_file" --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" || true)"
          if [ "$pressure_code" != '200' ]; then
            rm -f "$pressure_file"
            echo "VIBE2_RECOVERY_FAST_GAME_WORKER_DISPATCH=DEFERRED_PRESSURE_UNKNOWN_HTTP_$pressure_code"
            exit 0
          fi
          pressure_count="$(CURRENT_RUN_ID="$GITHUB_RUN_ID" node - "$pressure_file" <<'NODE'
          const fs=require('fs');
          const payload=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const current=String(process.env.CURRENT_RUN_ID||'');
          const states=new Set(['queued','pending','requested']);
          const count=(payload.workflow_runs||[]).filter(row=>String(row.id||'')!==current&&states.has(String(row.status||'').toLowerCase())).length;
          process.stdout.write(String(count));
          NODE
          )"
          rm -f "$pressure_file"
          echo "VIBE2_RECOVERY_FAST_RUNNER_QUEUE_PRESSURE=$pressure_count"
          if [ "$pressure_count" -ge "${VIBE2_RUNNER_PRESSURE_DISPATCH_THRESHOLD:-4}" ]; then
            echo 'VIBE2_RECOVERY_FAST_GAME_WORKER_DISPATCH=DEFERRED_RUNNER_PRESSURE_QUEUE_STATE_PRESERVED'
            exit 0
          fi
          payload='{"event_type":"vibe2-fanin-refill","client_payload":{"execution_lane":"game-primary","reason":"recovery-fast-causal-return"}}'
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
            --data "$payload"
          echo 'VIBE2_RECOVERY_FAST_GAME_WORKER_DISPATCH=GAME_PRIMARY_ATOMIC_REFILL'

      - name: Dispatch supervised system-AI recovery immediately
        if: steps.recovery.outputs.system_ai_recovery_dispatched != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --request POST --header 'Accept: application/vnd.github+json' --header "Authorization: Bearer $GH_TOKEN" --header 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" --data '{"event_type":"company-system-ai-cycle"}'
          echo 'VIBE2_RECOVERY_FAST_SYSTEM_AI_DISPATCH=YES'

      - name: Upload fast recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibe2-recovery-fast-${{ github.run_id }}
          path: /tmp/vibe2-recovery-fast
          if-no-files-found: ignore
          retention-days: 3
