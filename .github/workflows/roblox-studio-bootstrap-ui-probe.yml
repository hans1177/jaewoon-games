name: Roblox Studio Bootstrap UI Probe

on:
  push:
    branches: [fix/roblox-auto-bootstrap]
    paths:
      - '.github/workflows/roblox-studio-bootstrap-ui-probe.yml'

permissions:
  contents: read
  actions: read

jobs:
  probe:
    name: probe authenticated Studio publish UI
    runs-on: [self-hosted, Windows, X64, roblox-studio-authenticated]
    timeout-minutes: 15
    env:
      GAME_ID: seed-roblox-battleground-fight-welcome-to-bloxburg
      EXPECTED_ARTIFACT: sha256:97d89f3dcd07ef9433f96f7c7f5178ec0a9979105051d79a9447da4e7fe71691
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/roblox-auto-bootstrap
          fetch-depth: 1
          fetch-tags: false

      - name: Resolve exact retained Vector Clash package
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "development-roblox-package-$env:GAME_ID"
          $response = gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts?name=$name&per_page=100" | ConvertFrom-Json
          $candidates = @($response.artifacts | Where-Object { -not $_.expired } | Sort-Object created_at -Descending)
          if ($candidates.Count -eq 0) { throw "No retained package artifact: $name" }
          $matched = $null
          foreach ($artifact in $candidates) {
            $root = Join-Path $env:RUNNER_TEMP "roblox-bootstrap-probe-$($artifact.id)"
            Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $root | Out-Null
            gh run download "$($artifact.workflow_run.id)" --repo "$env:GITHUB_REPOSITORY" -n $name -D $root
            $place = Get-ChildItem -Path $root -Recurse -File | Where-Object { $_.Extension -in '.rbxl','.rbxlx' } | Select-Object -First 1
            if (-not $place) { continue }
            $hash = (Get-FileHash -Algorithm SHA256 $place.FullName).Hash.ToLowerInvariant()
            if ("sha256:$hash" -eq $env:EXPECTED_ARTIFACT.ToLowerInvariant()) {
              $matched = $place.FullName
              break
            }
          }
          if (-not $matched) { throw "No retained package matches $env:EXPECTED_ARTIFACT" }
          "place_file=$matched" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host 'ROBLOX_BOOTSTRAP_PROBE_IMMUTABLE_ARTIFACT=PASS'

      - name: Probe Studio UI Automation tree without creating an experience
        env:
          PLACE_FILE: ${{ steps.package.outputs.place_file }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type -AssemblyName System.Windows.Forms

          $studio = $null
          $roots = @(
            "$env:LOCALAPPDATA\Roblox\Versions",
            "$env:PROGRAMFILES\Roblox\Versions",
            "${env:ProgramFiles(x86)}\Roblox\Versions"
          ) | Where-Object { $_ -and (Test-Path $_) }
          foreach ($root in $roots) {
            $candidate = Get-ChildItem -Path $root -Recurse -File -Filter RobloxStudioBeta.exe -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if ($candidate) { $studio = $candidate; break }
          }
          if (-not $studio) { throw 'RobloxStudioBeta.exe not found' }
          $running = @(Get-Process -Name RobloxStudioBeta -ErrorAction SilentlyContinue)
          if ($running.Count -gt 0) { throw 'Roblox Studio must be idle for bootstrap UI probe' }

          $probeScript = Join-Path $env:RUNNER_TEMP 'roblox-bootstrap-probe.luau'
          @"
          print('ROBLOX_BOOTSTRAP_PROBE_SCRIPT=PASS')
          print('ROBLOX_BOOTSTRAP_PROBE_PLACE_ID=' .. tostring(game.PlaceId))
          print('ROBLOX_BOOTSTRAP_PROBE_GAME_ID=' .. tostring(game.GameId))
          "@ | Set-Content -Encoding utf8 $probeScript

          $argLine = "--task RunScript --localPlaceFile `"$env:PLACE_FILE`" --runScriptFile `"$probeScript`""
          $p = Start-Process -FilePath $studio.FullName -ArgumentList $argLine -PassThru
          try {
            $null = $p.WaitForInputIdle(60000)
            Start-Sleep -Seconds 8
            $root = [System.Windows.Automation.AutomationElement]::RootElement
            $pidCondition = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ProcessIdProperty, $p.Id)
            $windows = $root.FindAll([System.Windows.Automation.TreeScope]::Children, $pidCondition)
            Write-Host "ROBLOX_BOOTSTRAP_PROBE_TOP_WINDOWS=$($windows.Count)"
            foreach ($window in $windows) {
              Write-Host ("ROBLOX_BOOTSTRAP_PROBE_WINDOW name='{0}' automationId='{1}' class='{2}'" -f $window.Current.Name,$window.Current.AutomationId,$window.Current.ClassName)
            }

            $shell = New-Object -ComObject WScript.Shell
            $activated = $shell.AppActivate($p.Id)
            Write-Host "ROBLOX_BOOTSTRAP_PROBE_APPACTIVATE=$activated"
            if (-not $activated) { throw 'Authenticated Studio process is not attached to an interactive desktop' }
            Start-Sleep -Seconds 2
            $shell.SendKeys('%p')
            Start-Sleep -Seconds 10

            $windowsAfter = $root.FindAll([System.Windows.Automation.TreeScope]::Children, $pidCondition)
            Write-Host "ROBLOX_BOOTSTRAP_PROBE_TOP_WINDOWS_AFTER_PUBLISH=$($windowsAfter.Count)"
            $publishLike = 0
            $interesting = 0
            foreach ($window in $windowsAfter) {
              Write-Host ("ROBLOX_BOOTSTRAP_PROBE_WINDOW_AFTER name='{0}' automationId='{1}' class='{2}'" -f $window.Current.Name,$window.Current.AutomationId,$window.Current.ClassName)
              $all = $window.FindAll([System.Windows.Automation.TreeScope]::Descendants,[System.Windows.Automation.Condition]::TrueCondition)
              $limit = [Math]::Min($all.Count, 1200)
              for ($i=0; $i -lt $limit; $i++) {
                $e = $all.Item($i)
                $name = [string]$e.Current.Name
                $aid = [string]$e.Current.AutomationId
                $ctype = [string]$e.Current.ControlType.ProgrammaticName
                if ($name -match '(Publish|Roblox|Create|Experience|Name)' -or $aid -match '(?i)(publish|create|name|experience)') {
                  $publishLike++
                  Write-Host ("ROBLOX_BOOTSTRAP_PROBE_MATCH type='{0}' name='{1}' automationId='{2}' enabled='{3}'" -f $ctype,$name,$aid,$e.Current.IsEnabled)
                }
                if ($interesting -lt 300 -and $ctype -match 'ControlType\.(Button|Edit|ComboBox|MenuItem|TabItem)' -and ($name -or $aid)) {
                  $interesting++
                  Write-Host ("ROBLOX_BOOTSTRAP_PROBE_CONTROL type='{0}' name='{1}' automationId='{2}' enabled='{3}' offscreen='{4}'" -f $ctype,$name,$aid,$e.Current.IsEnabled,$e.Current.IsOffscreen)
                }
              }
            }
            Write-Host "ROBLOX_BOOTSTRAP_PROBE_PUBLISH_MATCHES=$publishLike"
            Write-Host "ROBLOX_BOOTSTRAP_PROBE_INTERESTING_CONTROLS=$interesting"
            if ($interesting -lt 1) { throw 'Studio UI Automation tree was not discoverable' }
            $shell.SendKeys('{ESC}')
            Write-Host 'ROBLOX_BOOTSTRAP_PROBE=PASS'
            Write-Host 'ROBLOX_EXPERIENCE_CREATED=NO'
          }
          finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
