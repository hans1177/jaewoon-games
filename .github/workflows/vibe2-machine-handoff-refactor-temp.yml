name: Vibe2 Machine Handoff Refactor Temp

on:
  push:
    branches:
      - 'feat/vibe2-machine-handoff-runtime'
    paths:
      - '.github/workflows/vibe2-machine-handoff-refactor-temp.yml'
      - 'tools/vibe2-machine-handoff-refactor-temp.py'
      - 'tools/vibe2-machine-handoff-refactor-temp-fix.py'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vibe2-machine-handoff-runtime
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply refactor
        shell: bash
        run: |
          set -euo pipefail
          python tools/vibe2-machine-handoff-refactor-temp-fix.py before
          python tools/vibe2-machine-handoff-refactor-temp.py
          python tools/vibe2-machine-handoff-refactor-temp-fix.py after

      - name: Verify machine-state integration
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/vibe2-handoff.mjs
          node --check tools/vibe2-auto-planner.mjs
          node --check tools/vibe2-continuous-runner.mjs
          node --check qa/vibe2-handoff.test.mjs
          node --check qa/vibe2-controller-contract.test.mjs
          node tools/vibe2-handoff.mjs --check --output=/tmp/vibe2-handoff.json >/tmp/vibe2-handoff.log
          node --test qa/vibe2-handoff.test.mjs
          node --test qa/vibe2-auto-planner.test.mjs
          node --test qa/vibe2-controller-contract.test.mjs
          node --test qa/vibe2-queue-control.test.mjs
          node --test qa/vibe2-parallelism-telemetry.test.mjs
          git diff --check

      - name: Remove temporary refactor assets and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/vibe2-machine-handoff-refactor-temp.yml
          rm -f tools/vibe2-machine-handoff-refactor-temp.py
          rm -f tools/vibe2-machine-handoff-refactor-temp-fix.py
          git diff --check
          git config user.name 'jaewoon-vibe2-refactor'
          git config user.email 'vibe2-refactor@users.noreply.github.com'
          git add -A
          git commit -m 'vibe2: automate machine handoff consumption and consistency'
          git push origin HEAD:feat/vibe2-machine-handoff-runtime
