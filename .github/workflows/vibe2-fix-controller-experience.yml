name: Vibe2 Fix Controller Experience Fixture

on:
  push:
    branches:
      - fix/vibe2-study-24h

permissions:
  contents: write

jobs:
  fix-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: fix/vibe2-study-24h
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Align controller Experience fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('qa/vibe2-controller-contract.test.mjs')
          text = path.read_text(encoding='utf-8')
          old = "fs.writeFileSync(experienceFile,JSON.stringify({version:1,records:[]}), 'utf8');"
          new = "fs.writeFileSync(experienceFile,JSON.stringify({version:3,records:[]}), 'utf8');"
          if text.count(old) != 1:
              raise SystemExit(f'expected one controller Experience v1 fixture, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Run affected Core QA
        shell: bash
        run: |
          set -euo pipefail
          node --check qa/vibe2-controller-contract.test.mjs
          node --test qa/vibe2-controller-contract.test.mjs
          node --test qa/vibe2-handoff.test.mjs
          node --test qa/vibe2-game-study.test.mjs

      - name: Commit verified fixture fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-vibe2-fix'
          git config user.email 'vibe2-fix@users.noreply.github.com'
          git rm .github/workflows/vibe2-fix-controller-experience.yml
          git add qa/vibe2-controller-contract.test.mjs
          git commit -m "test(vibe2): align controller Experience fixture"
          git push origin HEAD:fix/vibe2-study-24h
