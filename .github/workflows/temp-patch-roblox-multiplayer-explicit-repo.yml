name: Temp Patch Roblox Multiplayer Explicit Repo

on:
  push:
    branches: [fix/roblox-multiplayer-explicit-repo]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/roblox-multiplayer-explicit-repo
          fetch-depth: 1
      - name: Apply explicit repository binding and contract
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/company-development-roblox-multiplayer-qa.yml')
          text = workflow.read_text(encoding='utf-8')
          old = '            gh run download "$($artifact.workflow_run.id)" -n $name -D $root'
          new = '            gh run download "$($artifact.workflow_run.id)" --repo "$env:GITHUB_REPOSITORY" -n $name -D $root'
          if old not in text:
              raise SystemExit('expected gh run download command not found')
          workflow.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_file = Path('qa/company-development-roblox-multiplayer-qa.test.mjs')
          test = test_file.read_text(encoding='utf-8')
          marker = "  assert.doesNotMatch(workflow, /shell: pwsh/);\n"
          assertion = "  assert.match(workflow, /gh run download .*--repo \\\"\\$env:GITHUB_REPOSITORY\\\"/);\n"
          if assertion not in test:
              if marker not in test:
                  raise SystemExit('test insertion marker not found')
              test = test.replace(marker, marker + assertion, 1)
          test_file.write_text(test, encoding='utf-8')

          Path('.github/workflows/temp-patch-roblox-multiplayer-explicit-repo.yml').unlink()
          PY
          node --test qa/company-development-roblox-multiplayer-qa.test.mjs
          git config user.name 'jaewoon-ci-fix'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/company-development-roblox-multiplayer-qa.yml qa/company-development-roblox-multiplayer-qa.test.mjs .github/workflows/temp-patch-roblox-multiplayer-explicit-repo.yml
          git diff --cached --check
          git commit -m 'fix(ci): bind Roblox package download to repository'
          git push origin HEAD:fix/roblox-multiplayer-explicit-repo
