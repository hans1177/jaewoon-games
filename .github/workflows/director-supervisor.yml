name: Director Staff Supervisor

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  workflow_run:
    workflows:
      - Company Seed DESIGN_ONLY Runtime
      - Company DESIGN_ONLY Promotion Sync
      - Company DEVELOPMENT_CONFIRMED Runtime
      - Company DEVELOPMENT_CONFIRMED Unity Runtime
      # Homepage Manager already contains its own Director supervision/publication stage.
      # Do not re-wake the full central supervisor after that sink completes.
      - Public Game Health
      - Unity Hybrid Android Build
      - Unity Android Runtime Smoke
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'company-directive.json'
      - 'company-learning/platform-release-roadmap.json'
      - 'development-queue.json'
      - '.github/workflows/company-seed-design-runtime.yml'
      - '.github/workflows/company-design-promotion-sync.yml'
      - '.github/workflows/company-development-confirmed-runtime.yml'
      - '.github/workflows/company-development-unity-runtime.yml'
      - '.github/workflows/director-supervisor.yml'
      - 'qa/company-central-pipeline-only.test.mjs'
      - '.github/workflows/vibe2-continuous-core.yml'
      - 'vibe2-runtime.json'
      - 'company-learning/company-architecture-map.json'

permissions:
  contents: read
  actions: write

jobs:
  runner-drain:
    name: drain superseded queued work
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    concurrency:
      # Preserve an active drain; GitHub coalesces pending runs within the same group.
      group: director-runner-drain-v3
      cancel-in-progress: false
    # Queue eviction must stay off the saturated slim control lane.
    # Keep the dedicated fixed 24.04 control capacity while game-heavy work remains unchanged.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Cancel superseded control-plane and duplicate Roblox queue runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/director-run-drain.ndjson
          fetch_runs() {
            local query="$1"
            local paginate="${2:-false}"
            local page=1
            local attempt code body count page_query fetched
            while :; do
              page_query="$query"
              if [ "$paginate" = 'true' ]; then
                page_query="${query}&page=${page}"
              fi
              fetched=0
              for attempt in 1 2 3; do
                body="$(mktemp)"
                code="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
                  --header 'Accept: application/vnd.github+json' \
                  --header "Authorization: Bearer $GH_TOKEN" \
                  --header 'X-GitHub-Api-Version: 2022-11-28' \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?${page_query}" || true)"
                if [ "$code" = '200' ]; then
                  count="$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(String((j.workflow_runs||[]).length))" "$body")"
                  node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(JSON.stringify(j)+'\\n')" "$body" >> /tmp/director-run-drain.ndjson
                  echo "DIRECTOR_RUNNER_DRAIN_FETCH_PAGE=${page}:${count}:${query}"
                  rm -f "$body"
                  fetched=1
                  break
                fi
                echo "DIRECTOR_RUNNER_DRAIN_FETCH_RETRY=${attempt}:${code}:${page_query}"
                rm -f "$body"
                sleep $((attempt*2))
              done
              if [ "$fetched" != '1' ]; then
                return 1
              fi
              if [ "$paginate" != 'true' ] || [ "${count:-0}" -lt 100 ]; then
                return 0
              fi
              page=$((page+1))
            done
          }

          # Keep one recent mixed page for statuses GitHub may surface outside the targeted filters,
          # then exhaust every documented active-status query so old stale work cannot hide past row 100.
          fetch_runs 'per_page=100'
          fetch_runs 'status=in_progress&per_page=100' true
          fetch_runs 'status=queued&per_page=100' true
          fetch_runs 'status=pending&per_page=100' true
          fetch_runs 'status=requested&per_page=100' true || true
          fetch_runs 'status=waiting&per_page=100' true || true
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          CURRENT_MAIN_SHA="$current_main" node <<'NODE' > /tmp/director-run-cancel.list
          const fs=require('fs');
          const pages=fs.readFileSync('/tmp/director-run-drain.ndjson','utf8').trim().split('\n').filter(Boolean).map(JSON.parse);
          const byId=new Map();
          for(const page of pages)for(const run of page.workflow_runs||[])byId.set(Number(run.id),run);
          const runs=[...byId.values()].filter(r=>Number(r.id)!==Number(process.env.GITHUB_RUN_ID));
          const active=new Set(['queued','pending','requested','in_progress']);
          const queued=new Set(['queued','pending','requested']);
          const cancel=new Map();
          const add=(run,reason)=>{
            if(!run||!active.has(String(run.status||'').toLowerCase()))return;
            cancel.set(Number(run.id),reason);
          };


          // Platform exposure sync is control-plane state projection, so a newer same-branch run may supersede a stale one.
          const pureControlPlane=new Set([
            '.github/workflows/company-evolution-qa.yml',
            '.github/workflows/company-central-policy-contract-qa.yml',
            '.github/workflows/vibe2-parallelism-contract-qa.yml',
            '.github/workflows/company-security-immune.yml',
            '.github/workflows/main-write-guard.yml',
            '.github/workflows/vibe3-engine-contract.yml',
            '.github/workflows/vibe2-core-qa.yml',
            '.github/workflows/company-game-seed-qa.yml',
            '.github/workflows/company-platform-exposure-sync.yml',
          ]);
          for(const path of pureControlPlane){
            const rows=runs.filter(r=>r.path===path&&active.has(String(r.status||'').toLowerCase()));
            const groups=new Map();
            for(const run of rows){
              const key=String(run.event||'')+':'+String(run.head_branch||'');
              if(!groups.has(key))groups.set(key,[]);
              groups.get(key).push(run);
            }
            for(const group of groups.values()){
              group.sort((a,b)=>Number(b.id)-Number(a.id));
              for(const stale of group.slice(1))add(stale,'CONTROL_PLANE_SUPERSEDED');
            }
          }

          for(const stale of runs.filter(r=>
            r.path==='.github/workflows/director-supervisor.yml'
            &&queued.has(String(r.status||'').toLowerCase())
          ))add(stale,'DIRECTOR_SUPERSEDED');

          // Recovery Fast re-reads the latest control queues on every run, so multiple queued wakes
          // are redundant control-plane pressure. Preserve every active run and only the newest queued wake.
          const recoveryFastQueued=runs
            .filter(r=>r.path==='.github/workflows/vibe2-recovery-fast.yml'
              &&queued.has(String(r.status||'').toLowerCase()))
            .sort((a,b)=>Number(b.id)-Number(a.id));
          for(const stale of recoveryFastQueued.slice(1))add(stale,'VIBE2_RECOVERY_FAST_SUPERSEDED_QUEUED');

          const centralPush=runs
            .filter(r=>r.path==='.github/workflows/company-development-confirmed-runtime.yml'
              &&String(r.event||'')==='push'
              &&String(r.head_branch||'')==='main'
              &&active.has(String(r.status||'').toLowerCase()))
            .sort((a,b)=>Number(b.id)-Number(a.id));
          for(const stale of centralPush.slice(1)){
            if(queued.has(String(stale.status||'').toLowerCase()))add(stale,'CENTRAL_DEVELOPMENT_PUSH_SUPERSEDED');
          }

          // Unscoped batch wakes from push/manual/status recovery can target the same exact head.
          // Preserve the active batch and remove only queued/pending duplicates for that same head.
          const activeCentralBatch=runs
            .filter(r=>
              r.path==='.github/workflows/company-development-confirmed-runtime.yml'
              &&String(r.status||'').toLowerCase()==='in_progress'
              &&/^DEVELOPMENT cycle \| batch \|/.test(String(r.display_title||''))
            )
            .sort((a,b)=>Number(a.id)-Number(b.id))[0];
          if(activeCentralBatch){
            for(const stale of runs.filter(r=>
              r.path==='.github/workflows/company-development-confirmed-runtime.yml'
              &&String(r.event||'')==='workflow_dispatch'
              &&queued.has(String(r.status||'').toLowerCase())
              &&/^DEVELOPMENT cycle \| batch \|/.test(String(r.display_title||''))
            ))add(stale,'CENTRAL_MANUAL_BATCH_SUPERSEDED_BY_ACTIVE_BATCH');
          }

          const centralBatchByHead=new Map();
          for(const run of runs.filter(r=>
            r.path==='.github/workflows/company-development-confirmed-runtime.yml'
            &&active.has(String(r.status||'').toLowerCase())
            &&/^DEVELOPMENT cycle \| batch \|/.test(String(r.display_title||''))
          )){
            const key=String(run.head_sha||'');
            if(!key)continue;
            if(!centralBatchByHead.has(key))centralBatchByHead.set(key,[]);
            centralBatchByHead.get(key).push(run);
          }
          for(const group of centralBatchByHead.values()){
            if(group.length<2)continue;
            const running=group.filter(r=>String(r.status||'').toLowerCase()==='in_progress').sort((a,b)=>Number(a.id)-Number(b.id));
            const winner=running[0]||[...group].sort((a,b)=>Number(b.id)-Number(a.id))[0];
            for(const stale of group){
              if(Number(stale.id)===Number(winner.id))continue;
              if(queued.has(String(stale.status||'').toLowerCase()))add(stale,'CENTRAL_DEVELOPMENT_BATCH_DUPLICATE_SAME_HEAD');
            }
          }

          const dedupeByTitle=(path,newestQueuedWins=false)=>{
            const rows=runs.filter(r=>r.path===path&&active.has(String(r.status||'').toLowerCase()));
            const groups=new Map();
            for(const run of rows){
              const title=String(run.display_title||'');
              if(!title)continue;
              if(!groups.has(title))groups.set(title,[]);
              groups.get(title).push(run);
            }
            for(const [title,group] of groups){
              if(group.length<2)continue;
              const inProgress=group
                .filter(r=>String(r.status||'').toLowerCase()==='in_progress')
                .sort((a,b)=>Number(a.id)-Number(b.id));
              let winner;
              if(inProgress.length)winner=inProgress[0];
              else if(newestQueuedWins)winner=[...group].sort((a,b)=>Number(b.id)-Number(a.id))[0];
              else winner=[...group].sort((a,b)=>Number(a.id)-Number(b.id))[0];
              for(const stale of group){
                if(Number(stale.id)===Number(winner.id))continue;
                if(queued.has(String(stale.status||'').toLowerCase())){
                  add(stale,newestQueuedWins?'DUPLICATE_TITLE_STALE_QUEUED':'DUPLICATE_TITLE');
                }
              }
            }
          };
          // Native runtime duplicates for the same title carry newer source/runtime state.
          // Never cancel active same-title work; when none is active, keep only the newest queued run.
          dedupeByTitle('.github/workflows/company-development-roblox-runtime.yml',true);
          dedupeByTitle('.github/workflows/company-development-roblox-runtime-continuation.yml',true);
          dedupeByTitle('.github/workflows/company-development-unity-runtime.yml',true);
          dedupeByTitle('.github/workflows/company-development-roblox-release-promotion.yml',false);
          dedupeByTitle('.github/workflows/unity-android-independent-qa.yml',false);
          dedupeByTitle('.github/workflows/unity-android-regression.yml',false);
          // Scheduler runs carry no game-specific evidence. Preserve an active scheduler;
          // otherwise keep only the newest queued duplicate for the same title.
          dedupeByTitle('.github/workflows/vibe2-24h-runner.yml',true);

          const currentMain=String(process.env.CURRENT_MAIN_SHA||'').trim();
          if(currentMain){
            const currentRobloxBatchReplacementActive=runs.some(r=>
              r.path==='.github/workflows/company-development-roblox-runtime.yml'
              &&active.has(String(r.status||'').toLowerCase())
              &&String(r.head_branch||'')==='main'
              &&String(r.head_sha||'')===currentMain
              &&String(r.display_title||'')==='Roblox runtime · batch'
            );
            if(currentRobloxBatchReplacementActive){
              for(const stale of runs.filter(r=>
                [
                  '.github/workflows/company-development-roblox-runtime.yml',
                  '.github/workflows/company-development-roblox-runtime-continuation.yml',
                ].includes(String(r.path||''))
                &&queued.has(String(r.status||'').toLowerCase())
                &&String(r.head_branch||'')==='main'
                &&String(r.head_sha||'')!==currentMain
                &&(
                  String(r.display_title||'')==='Roblox runtime · batch'
                  ||String(r.display_title||'').startsWith('Roblox shared preflight · ')
                )
              ))add(stale,'ROBLOX_STALE_UNSTARTED_NATIVE_WORK_REPLACED_BY_CURRENT_BATCH');
            }

            const currentCentralReplacementActive=runs.some(r=>
              r.path==='.github/workflows/company-development-confirmed-runtime.yml'
              &&active.has(String(r.status||'').toLowerCase())
              &&String(r.head_branch||'')==='main'
              &&String(r.head_sha||'')===currentMain
            );
            if(currentCentralReplacementActive){
              for(const stale of runs.filter(r=>
                r.path==='.github/workflows/company-development-confirmed-runtime.yml'
                &&String(r.event||'')==='push'
                &&queued.has(String(r.status||'').toLowerCase())
                &&String(r.head_branch||'')==='main'
                &&String(r.head_sha||'')!==currentMain
              ))add(stale,'CENTRAL_DEVELOPMENT_STALE_HEAD_REPLACED_BY_CURRENT_RUN');

              // Exact-game coordinator runs are run-scoped so independent cycles may overlap.
              // Retire only an unstarted stale-head ingress when the same exact game already has
              // a current-main replacement. Active old-head work is never cancelled here.
              const exactGameId=run=>{
                const m=String(run.display_title||'').match(/^DEVELOPMENT cycle \| ([a-z0-9][a-z0-9-]{1,80}) \|/);
                return m&&m[1]!=='batch'?m[1]:null;
              };
              const currentCentralExactGames=new Set(runs
                .filter(r=>
                  r.path==='.github/workflows/company-development-confirmed-runtime.yml'
                  &&String(r.event||'')==='workflow_dispatch'
                  &&active.has(String(r.status||'').toLowerCase())
                  &&String(r.head_branch||'')==='main'
                  &&String(r.head_sha||'')===currentMain
                )
                .map(exactGameId)
                .filter(Boolean));
              for(const stale of runs.filter(r=>{
                if(r.path!=='.github/workflows/company-development-confirmed-runtime.yml')return false;
                if(String(r.event||'')!=='workflow_dispatch')return false;
                if(!queued.has(String(r.status||'').toLowerCase()))return false;
                if(String(r.head_branch||'')!=='main'||String(r.head_sha||'')===currentMain)return false;
                const gameId=exactGameId(r);
                return Boolean(gameId&&currentCentralExactGames.has(gameId));
              }))add(stale,'CENTRAL_EXACT_GAME_STALE_HEAD_REPLACED_BY_CURRENT_GAME_RUN');

              // Coalesce only exact duplicate same-head exact-game ingress.
              // Preserve any already-running representative; otherwise keep the newest queued wake.
              const exactSameHeadGroups=new Map();
              for(const run of runs){
                if(run.path!=='.github/workflows/company-development-confirmed-runtime.yml')continue;
                if(String(run.event||'')!=='workflow_dispatch')continue;
                if(!active.has(String(run.status||'').toLowerCase()))continue;
                const gameId=exactGameId(run);
                if(!gameId)continue;
                const head=String(run.head_sha||'');
                const title=String(run.display_title||'');
                if(!head||!title)continue;
                const key=[gameId,head,title].join('|');
                if(!exactSameHeadGroups.has(key))exactSameHeadGroups.set(key,[]);
                exactSameHeadGroups.get(key).push(run);
              }
              for(const group of exactSameHeadGroups.values()){
                if(group.length<2)continue;
                const running=group
                  .filter(r=>String(r.status||'').toLowerCase()==='in_progress')
                  .sort((a,b)=>Number(a.id)-Number(b.id));
                const winner=running[0]||[...group].sort((a,b)=>Number(b.id)-Number(a.id))[0];
                for(const stale of group){
                  if(Number(stale.id)===Number(winner.id))continue;
                  if(queued.has(String(stale.status||'').toLowerCase()))add(stale,'CENTRAL_EXACT_GAME_DUPLICATE_SAME_HEAD');
                }
              }

              for(const stale of runs.filter(r=>
                [
                  '.github/workflows/company-development-roblox-runtime.yml',
                  '.github/workflows/company-development-unity-runtime.yml',
                ].includes(String(r.path||''))
                &&String(r.event||'')==='push'
                &&queued.has(String(r.status||'').toLowerCase())
                &&String(r.head_branch||'')==='main'
                &&String(r.head_sha||'')!==currentMain
                &&/ runtime · batch$/.test(String(r.display_title||''))
              ))add(stale,'NATIVE_STALE_BATCH_PUSH_REPLACED_BY_CURRENT_CENTRAL');
            }

            for(const stale of runs.filter(r=>
              r.path==='.github/workflows/vibe2-24h-runner.yml'
              &&queued.has(String(r.status||'').toLowerCase())
              &&String(r.head_branch||'')==='main'
              &&String(r.head_sha||'')!==currentMain
            ))add(stale,'VIBE2_STALE_UNSTARTED_SCHEDULER');

            for(const stale of runs.filter(r=>
              r.path==='.github/workflows/vibe2-continuous-core.yml'
              &&String(r.event||'')==='push'
              &&queued.has(String(r.status||'').toLowerCase())
              &&String(r.head_branch||'')==='main'
              &&String(r.head_sha||'')!==currentMain
            ))add(stale,'VIBE2_STALE_UNSTARTED_MAIN_PUSH_GAME_PRIMARY_WAKE');

            for(const stale of runs.filter(r=>
              r.path==='.github/workflows/vibe2-continuous-core.yml'
              &&String(r.display_title||'')==='vibe2-fanin-refill'
              &&queued.has(String(r.status||'').toLowerCase())
              &&String(r.head_branch||'')==='main'
              &&String(r.head_sha||'')!==currentMain
            ))add(stale,'VIBE2_STALE_UNSTARTED_FANIN_REFILL');
          }

          const staleBefore=Date.now()-(15*60*1000);
          const legacyRoblox=runs
            .filter(r=>[
                '.github/workflows/company-development-roblox-runtime.yml',
                '.github/workflows/company-development-roblox-runtime-continuation.yml',
              ].includes(String(r.path||''))
              &&active.has(String(r.status||'').toLowerCase())
              &&String(r.head_sha||'')!==String(process.env.GITHUB_SHA||'')
              &&Date.parse(String(r.created_at||0))<staleBefore
              &&(
                String(r.display_title||'')==='Company DEVELOPMENT_CONFIRMED Roblox Runtime'
                ||String(r.display_title||'')==='Roblox runtime · batch'
                ||String(r.display_title||'')==='Company DEVELOPMENT_CONFIRMED Roblox Vibe Shared Preflight'
              ));
          for(const stale of legacyRoblox)add(stale,'ROBLOX_STALE_LEGACY_OR_BATCH');

          for(const [id,reason] of [...cancel.entries()].sort((a,b)=>a[0]-b[0]))console.log(String(id)+'|'+reason);
          NODE

          # 2026-10-05 owner cloud-only validation disabled local Studio/MCP execution.
          # Retire only legacy candidate-release tails whose only unfinished work is queued Studio MCP.
          # Never cancel an active job or any current hosted/Open Cloud validation.
          cloud_only_cutoff='2026-10-05T06:44:59Z'
          CLOUD_ONLY_CUTOFF="$cloud_only_cutoff" node <<'NODE' > /tmp/director-legacy-studio-run-ids
          const fs=require('fs');
          const pages=fs.readFileSync('/tmp/director-run-drain.ndjson','utf8').trim().split('\n').filter(Boolean).map(JSON.parse);
          const byId=new Map();
          for(const page of pages)for(const run of page.workflow_runs||[])byId.set(Number(run.id),run);
          const waiting=new Set(['queued','pending','requested','waiting']);
          const cutoff=Date.parse(String(process.env.CLOUD_ONLY_CUTOFF||''));
          if(!Number.isFinite(cutoff))throw new Error('DIRECTOR_CLOUD_ONLY_CUTOFF_INVALID');
          for(const run of byId.values()){
            if(String(run.path||'')!=='.github/workflows/vibe2-candidate-release.yml')continue;
            if(!waiting.has(String(run.status||'').toLowerCase()))continue;
            const created=Date.parse(String(run.created_at||''));
            if(!Number.isFinite(created)||created>=cutoff)continue;
            console.log(run.id);
          }
          NODE

          legacy_studio_candidates=0
          legacy_studio_enqueued=0
          while read -r run_id; do
            [ -n "$run_id" ] || continue
            legacy_studio_candidates=$((legacy_studio_candidates+1))
            jobs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" 2>/dev/null || true)"
            [ -n "$jobs_json" ] || continue
            decision="$(printf '%s' "$jobs_json" | node -e "
              let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{
                const jobs=(JSON.parse(s).jobs||[]);
                const waiting=new Set(['queued','pending','requested','waiting']);
                const unfinished=jobs.filter(j=>String(j.status||'').toLowerCase()!=='completed');
                const active=jobs.filter(j=>String(j.status||'').toLowerCase()==='in_progress');
                const legacyStudio=unfinished.filter(j=>
                  String(j.name||'').includes('Official Studio MCP actual play ')
                  &&waiting.has(String(j.status||'').toLowerCase())
                );
                process.stdout.write(active.length===0&&unfinished.length>0&&legacyStudio.length===unfinished.length?'RETIRE':'PRESERVE');
              });
            ")"
            if [ "$decision" != 'RETIRE' ]; then
              echo "DIRECTOR_LEGACY_STUDIO_TAIL_PRESERVED=${run_id}:${decision}"
              continue
            fi
            if ! grep -q "^${run_id}|" /tmp/director-run-cancel.list; then
              echo "${run_id}|ROBLOX_LEGACY_STUDIO_MCP_DISABLED_BY_CLOUD_ONLY" >> /tmp/director-run-cancel.list
              legacy_studio_enqueued=$((legacy_studio_enqueued+1))
              echo "DIRECTOR_LEGACY_STUDIO_TAIL_ENQUEUED=${run_id}"
            fi
          done < /tmp/director-legacy-studio-run-ids
          echo "DIRECTOR_LEGACY_STUDIO_BACKLOG_CANDIDATE_COUNT=$legacy_studio_candidates"
          echo "DIRECTOR_LEGACY_STUDIO_BACKLOG_CANCEL_ENQUEUED_COUNT=$legacy_studio_enqueued"

          cancelled=0
          failed=0
          while IFS='|' read -r run_id reason; do
            [ -n "$run_id" ] || continue
            pre_cancel_state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status' 2>/dev/null || true)"
            pre_cancel_active_jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" --jq '[.jobs[] | select(.status=="in_progress")] | length' 2>/dev/null || echo 0)"
            pre_cancel_state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status' 2>/dev/null || true)"
            if [ "$pre_cancel_state" = 'in_progress' ] || [ "${pre_cancel_active_jobs:-0}" != '0' ]; then
              echo "DIRECTOR_RUNNER_DRAIN_ACTIVE_PRESERVED=${run_id}:${reason}:${pre_cancel_state:-unknown}:${pre_cancel_active_jobs:-0}"
              continue
            fi
            if [[ "$pre_cancel_state" != 'queued' && "$pre_cancel_state" != 'pending' && "$pre_cancel_state" != 'requested' && "$pre_cancel_state" != 'waiting' ]]; then
              echo "DIRECTOR_RUNNER_DRAIN_NON_WAITING_PRESERVED=${run_id}:${reason}:${pre_cancel_state:-unknown}"
              continue
            fi
            safe_force_cancel=false
            if [[ "$reason" == 'DUPLICATE_TITLE_STALE_QUEUED' || "$reason" == 'ROBLOX_STALE_LEGACY_OR_BATCH' || "$reason" == 'ROBLOX_STALE_UNSTARTED_NATIVE_WORK_REPLACED_BY_CURRENT_BATCH' || "$reason" == 'CONTROL_PLANE_SUPERSEDED' || "$reason" == 'VIBE2_RECOVERY_FAST_SUPERSEDED_QUEUED' || "$reason" == 'CENTRAL_EXACT_GAME_STALE_HEAD_REPLACED_BY_CURRENT_GAME_RUN' || "$reason" == 'CENTRAL_EXACT_GAME_DUPLICATE_SAME_HEAD' || "$reason" == 'ROBLOX_LEGACY_STUDIO_MCP_DISABLED_BY_CLOUD_ONLY' ]]; then
              safe_force_cancel=true
            fi
            if gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null 2>&1; then
              current_state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status' 2>/dev/null || true)"
              if [ "$safe_force_cancel" = true ] && [[ "$current_state" == 'queued' || "$current_state" == 'pending' || "$current_state" == 'requested' || "$current_state" == 'waiting' ]]; then
                if gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/force-cancel" >/dev/null 2>&1; then
                  cancelled=$((cancelled+1))
                  echo "DIRECTOR_RUNNER_DRAIN_FORCE_CANCELLED_AFTER_ACCEPTED_CANCEL=${run_id}:${reason}:${current_state}"
                else
                  # GitHub may accept /cancel and asynchronously settle the run while /force-cancel
                  # races that transition. Re-read briefly before declaring a real drain failure.
                  settled=false
                  settle_state="$current_state"
                  for settle_attempt in 1 2 3 4 5; do
                    sleep 1
                    settle_state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status' 2>/dev/null || true)"
                    if [[ "$settle_state" == 'completed' ]]; then
                      settled=true
                      break
                    fi
                  done
                  if [ "$settled" = true ]; then
                    cancelled=$((cancelled+1))
                    echo "DIRECTOR_RUNNER_DRAIN_CANCEL_SETTLED_AFTER_ACCEPTED_CANCEL=${run_id}:${reason}:${settle_state}"
                  else
                    failed=$((failed+1))
                    echo "DIRECTOR_RUNNER_DRAIN_FORCE_CANCEL_FAILED_AFTER_ACCEPTED_CANCEL=${run_id}:${reason}:${settle_state:-${current_state}}"
                  fi
                fi
              else
                cancelled=$((cancelled+1))
                echo "DIRECTOR_RUNNER_DRAIN_CANCELLED=${run_id}:${reason}:${current_state:-unknown}"
              fi
            elif [ "$safe_force_cancel" = true ]; then
              force_state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status' 2>/dev/null || true)"
              force_active_jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" --jq '[.jobs[] | select(.status=="in_progress")] | length' 2>/dev/null || echo 0)"
              force_state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status' 2>/dev/null || true)"
              if [ "$force_state" = 'in_progress' ] || [ "${force_active_jobs:-0}" != '0' ]; then
                echo "DIRECTOR_RUNNER_DRAIN_ACTIVE_PRESERVED=${run_id}:${reason}:${force_state:-unknown}:${force_active_jobs:-0}"
              elif [[ "$force_state" == 'queued' || "$force_state" == 'pending' || "$force_state" == 'requested' || "$force_state" == 'waiting' ]] && gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/force-cancel" >/dev/null 2>&1; then
                cancelled=$((cancelled+1))
                echo "DIRECTOR_RUNNER_DRAIN_FORCE_CANCELLED=${run_id}:${reason}:${force_state}"
              else
                failed=$((failed+1))
                echo "DIRECTOR_RUNNER_DRAIN_CANCEL_FAILED=${run_id}:${reason}:${force_state:-unknown}"
              fi
            else
              failed=$((failed+1))
              echo "DIRECTOR_RUNNER_DRAIN_CANCEL_FAILED=${run_id}:${reason}"
            fi
          done < /tmp/director-run-cancel.list
          echo "DIRECTOR_RUNNER_DRAIN_CANCELLED_COUNT=$cancelled"
          echo "DIRECTOR_RUNNER_DRAIN_CANCEL_FAILED_COUNT=$failed"
          echo 'DIRECTOR_RUNNER_DRAIN_INDEPENDENT_GAME_CANCEL=FORBIDDEN'

  game-primary-gate:
    # Gate and queue drain are independent lightweight control lanes; supervision waits for both.
    if: always() && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled')
    concurrency:
      group: director-game-primary-gate-v1
      # Preserve the active fallback gate so queued GAME_PRIMARY work is not starved.
      cancel-in-progress: false
    runs-on: ubuntu-slim
    outputs:
      defer: ${{ steps.gate.outputs.defer }}
      active_game_work: ${{ steps.gate.outputs.active_game_work }}
    steps:
      - name: Defer noncritical work while Vibe2 game primary is active
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          queue_api="repos/${GITHUB_REPOSITORY}/contents/.vibe2/queue.json?ref=vibe2-unreal-core"
          if ! queue_response="$(gh api "$queue_api" 2>/dev/null)"; then
            echo 'defer=true' >> "$GITHUB_OUTPUT"
            echo 'active_game_work=unknown' >> "$GITHUB_OUTPUT"
            echo 'GAME_PRIMARY_GATE=DEFER_QUEUE_UNAVAILABLE'
            exit 0
          fi
          queue_b64="$(jq -r '.content // empty' <<<"$queue_response" | tr -d '\n')"
          queue_json="$(printf '%s' "$queue_b64" | base64 -d 2>/dev/null || true)"
          if [ -z "$queue_json" ] || ! jq -e . >/dev/null 2>&1 <<<"$queue_json"; then
            echo 'defer=true' >> "$GITHUB_OUTPUT"
            echo 'active_game_work=unknown' >> "$GITHUB_OUTPUT"
            echo 'GAME_PRIMARY_GATE=DEFER_QUEUE_INVALID'
            exit 0
          fi
          active_game_work="$(jq '[.tasks[]? | select(
            ((((.status // "") | ascii_downcase) == "queued") or (((.status // "") | ascii_downcase) == "running"))
            and (((.department // "") | ascii_downcase) == "development")
            and (((.type // "") | ascii_downcase) == "implementation"))
          ] | length' <<<"$queue_json")"
          queued_game_work="$(jq '[.tasks[]? | select(
            (((.status // "") | ascii_downcase) == "queued")
            and (((.department // "") | ascii_downcase) == "development")
            and (((.type // "") | ascii_downcase) == "implementation"))
          ] | length' <<<"$queue_json")"
          echo "active_game_work=$active_game_work" >> "$GITHUB_OUTPUT"
          echo "queued_game_work=$queued_game_work" >> "$GITHUB_OUTPUT"

          if [ "$queued_game_work" -gt 0 ]; then
            current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha' 2>/dev/null || true)"
            if [ -z "$current_main" ]; then
              echo 'DIRECTOR_GAME_PRIMARY_FALLBACK_WAKE=SKIPPED_CURRENT_MAIN_UNAVAILABLE'
            else
              echo "DIRECTOR_GAME_PRIMARY_CURRENT_MAIN=$current_main"
              core_runs_api="repos/${GITHUB_REPOSITORY}/actions/workflows/vibe2-continuous-core.yml/runs?per_page=100"
              if core_runs="$(gh api "$core_runs_api" 2>/dev/null)"; then
                active_scoped_core="$(jq --arg currentMain "$current_main" '[.workflow_runs[]? | . as $run | select(
                  (($run.event // "") != "push")
                  and (
                    ((($run.status // "") | ascii_downcase) == "in_progress")
                    or (
                      ((["queued","pending","requested"] | index((($run.status // "") | ascii_downcase))) != null)
                      and (($run.head_sha // "") == $currentMain)
                    )
                  )
                )] | length' <<<"$core_runs")"
                echo "DIRECTOR_GAME_PRIMARY_SCOPED_CORE_ACTIVE=$active_scoped_core"
                if [ "$active_scoped_core" -eq 0 ]; then
                gh api --method POST                   "repos/${GITHUB_REPOSITORY}/actions/workflows/vibe2-continuous-core.yml/dispatches"                   -f ref=main                   -f 'inputs[execution_lane]=game-primary'                   -f 'inputs[lane_max]=64' >/dev/null
                echo 'DIRECTOR_GAME_PRIMARY_FALLBACK_WAKE=DISPATCHED'
                else
                  echo 'DIRECTOR_GAME_PRIMARY_FALLBACK_WAKE=SKIPPED_ACTIVE_CORE'
                fi
              else
                echo 'DIRECTOR_GAME_PRIMARY_FALLBACK_WAKE=SKIPPED_ACTIVE_SCAN_UNAVAILABLE'
              fi
            fi
          else
            echo 'DIRECTOR_GAME_PRIMARY_FALLBACK_WAKE=SKIPPED_NO_QUEUED_WORK'
          fi

          if [ "$active_game_work" -gt 0 ]; then
            echo 'defer=true' >> "$GITHUB_OUTPUT"
            echo "GAME_PRIMARY_GATE=DEFER_ACTIVE_GAME_WORK:$active_game_work"
          else
            echo 'defer=false' >> "$GITHUB_OUTPUT"
            echo 'GAME_PRIMARY_GATE=RUN'
          fi

  supervise:
    needs: [runner-drain, game-primary-gate]
    if: always() && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled') && (needs.runner-drain.result == 'success' || needs.runner-drain.result == 'skipped') && needs.game-primary-gate.outputs.defer != 'true'
    concurrency:
      group: director-central-company-supervise-v3
      cancel-in-progress: false
    runs-on: ubuntu-slim
    timeout-minutes: 8
    steps:
      - name: Checkout central policy source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize central roadmap context (director)
        shell: bash
        run: |
          set -euo pipefail
          node tools/company-shared-context.mjs --output=/tmp/worker-shared-context.json

      - name: Verify central policy authority
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const machineSource='company-learning/platform-release-roadmap.json';
          const directive=JSON.parse(fs.readFileSync('company-directive.json','utf8'));
          const policy=JSON.parse(fs.readFileSync(machineSource,'utf8'));
          if(directive.policyDocument!==machineSource||directive.machineSourceOfTruth!==machineSource)throw new Error('central policy source mismatch');
          if(directive.authority!=='MACHINE_EXECUTION_CONTRACT')throw new Error('company directive machine authority mismatch');
          if(policy.policySource!==machineSource||policy.machineSourceOfTruth!==machineSource||policy.authority!=='MACHINE_EXECUTION_CONTRACT'||policy.humanDocumentRequired!==false)throw new Error('canonical machine policy authority mismatch');
          const docs=policy.centralDocumentation||{};
          if(docs.canonicalSet?.policy!==machineSource)throw new Error('central documentation canonical policy mismatch');
          if(docs.humanReadableArtifactPolicy?.humanReadablePolicyMirrorRequired!==false)throw new Error('human policy mirror must remain disabled');
          if(policy.legacyPolicyMirror!==undefined)throw new Error('legacy policy mirror field must be removed');
          console.log('CENTRAL_POLICY_AUTHORITY=PASS');
          NODE

      - name: Read central runtime state and workflow evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin company-runtime --quiet
          if git cat-file -e origin/company-runtime:development-queue.json 2>/dev/null; then
            git show origin/company-runtime:development-queue.json > /tmp/development-queue.json
          else
            printf '{"version":1,"items":[]}' > /tmp/development-queue.json
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" > /tmp/actions-runs.json
          node <<'NODE' > /tmp/director-central.env
          const fs=require('fs');
          const queue=JSON.parse(fs.readFileSync('/tmp/development-queue.json','utf8'));
          const actions=JSON.parse(fs.readFileSync('/tmp/actions-runs.json','utf8'));
          const runs=actions.workflow_runs||[];
          const active=name=>runs.some(r=>r.name===name&&['queued','in_progress'].includes(String(r.status||'')));
          const latest=name=>runs.filter(r=>r.name===name).sort((a,b)=>new Date(b.updated_at||b.created_at||0)-new Date(a.updated_at||a.created_at||0))[0]||null;
          const development=(queue.items||[]).filter(x=>String(x.productionClass||'').toUpperCase()==='DEVELOPMENT_CONFIRMED');
          const pending=development.filter(x=>String(x.status||'').toUpperCase()==='PENDING');
          const unityPending=development.filter(x=>
            String(x.status||'').toUpperCase()==='ACTIVE' &&
            String(x.currentStep||'').toUpperCase()==='UNITY_ANDROID_TECHNICAL_VALIDATION' &&
            String(x.canonicalState||'').toUpperCase()==='WAITING_UNITY_VALIDATION'
          );
          const devName='Company DEVELOPMENT_CONFIRMED Runtime';
          const unityName='Company DEVELOPMENT_CONFIRMED Unity Runtime';
          const devActive=active(devName);
          const unityActive=active(unityName);
          const latestDev=latest(devName);
          const latestUnity=latest(unityName);
          console.log(`PENDING_DEVELOPMENT_COUNT=${pending.length}`);
          console.log(`PENDING_DEVELOPMENT_IDS=${pending.map(x=>x.gameId).join(',')}`);
          console.log(`WAITING_UNITY_DEVELOPMENT_COUNT=${unityPending.length}`);
          console.log(`WAITING_UNITY_DEVELOPMENT_IDS=${unityPending.map(x=>x.gameId).join(',')}`);
          console.log(`DEVELOPMENT_RUNTIME_ACTIVE=${devActive?'true':'false'}`);
          console.log(`DEVELOPMENT_RUNTIME_LAST_CONCLUSION=${latestDev?.conclusion||''}`);
          console.log(`DEVELOPMENT_UNITY_RUNTIME_ACTIVE=${unityActive?'true':'false'}`);
          console.log(`DEVELOPMENT_UNITY_RUNTIME_LAST_CONCLUSION=${latestUnity?.conclusion||''}`);
          console.log(`DEVELOPMENT_RECOVER=${pending.length>0&&!devActive?'true':'false'}`);
          console.log(`DEVELOPMENT_UNITY_RECOVER=${unityPending.length>0&&!unityActive?'true':'false'}`);
          NODE
          cat /tmp/director-central.env

      - name: Recover central development queues
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/director-central.env
          recovered='false'
          if [ "$DEVELOPMENT_RECOVER" = 'true' ]; then
            gh workflow run company-development-confirmed-runtime.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo 'DIRECTOR_RECOVERY=COMPANY_DEVELOPMENT_CONFIRMED_RUNTIME'
            recovered='true'
          fi
          if [ "$DEVELOPMENT_UNITY_RECOVER" = 'true' ]; then
            gh workflow run company-development-unity-runtime.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo 'DIRECTOR_RECOVERY=COMPANY_DEVELOPMENT_CONFIRMED_UNITY_RUNTIME'
            recovered='true'
          fi
          if [ "$recovered" = 'false' ]; then
            echo 'DIRECTOR_RECOVERY=NOT_REQUIRED'
          fi
          echo 'LEGACY_AUTONOMOUS_PIPELINE_DISPATCH=FORBIDDEN'

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Central company supervision'
            echo '- policy authority: company-learning/platform-release-roadmap.json (MACHINE_EXECUTION_CONTRACT)'
            echo '- design pipeline: Company Seed DESIGN_ONLY Runtime'
            echo '- promotion pipeline: Company DESIGN_ONLY Promotion Sync'
            echo '- development pipeline: Company DEVELOPMENT_CONFIRMED Runtime'
            echo '- Unity technical validation: Company DEVELOPMENT_CONFIRMED Unity Runtime'
            echo '- legacy autonomous top-level pipeline: removed'
            if [ -f /tmp/director-central.env ]; then
              source /tmp/director-central.env
              echo "- pending development games: ${PENDING_DEVELOPMENT_COUNT:-0}"
              echo "- waiting Unity development games: ${WAITING_UNITY_DEVELOPMENT_COUNT:-0}"
              echo "- central development runtime active: ${DEVELOPMENT_RUNTIME_ACTIVE:-false}"
              echo "- Unity development runtime active: ${DEVELOPMENT_UNITY_RUNTIME_ACTIVE:-false}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
