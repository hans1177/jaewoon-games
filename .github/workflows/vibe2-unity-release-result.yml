name: Vibe2 Unity Release Result

on:
  workflow_run:
    workflows: ['Unity Hybrid Android Build']
    types: [completed]

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: vibe2-release-serial
  cancel-in-progress: false

jobs:
  candidate-result:
    if: startsWith(github.event.workflow_run.head_branch, 'vibe2/candidate/')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate result
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve candidate manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          mapfile -t manifests < <(find .vibe2/candidates -type f -name manifest.json 2>/dev/null | sort)
          test "${#manifests[@]}" -eq 1
          git show origin/main:game-catalog.json > /tmp/main-game-catalog.json
          MANIFEST="${manifests[0]}" node <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync(process.env.MANIFEST,'utf8'));
          const catalog=JSON.parse(fs.readFileSync('/tmp/main-game-catalog.json','utf8'));
          const out=process.env.GITHUB_OUTPUT;
          const put=(k,v)=>fs.appendFileSync(out,`${k}=${String(v??'').replaceAll('\n',' ')}\n`);
          const task=String(m.taskId||'').trim(), game=String(m.gameId||'').trim();
          const target=String(m.target||'').trim(), root=String(m.sourceRoot||'').replaceAll('\\','/').replace(/^\.\//,'').replace(/\/$/,'');
          const base=String(m.baseMainSha||'').trim();
          const origin=String(m.origin||'VIBE2_NATIVE').trim().toUpperCase();
          const row=(catalog.games||[]).find(g=>String(g.id||'')===game);
          const productionClass=String(row?.productionClass||'').trim().toUpperCase();
          const state=productionClass==='RELEASE_CONFIRMED'?'release-confirmed':productionClass==='DEVELOPMENT_CONFIRMED'?'development-confirmed':'other';
          if(!task||!game||target!=='unity'||root!==`unity-games/${game}`||!base) throw new Error('invalid Unity Vibe2 candidate manifest');
          if(!['RELEASE_CONFIRMED','DEVELOPMENT_CONFIRMED'].includes(productionClass))throw new Error('candidate productionClass is not deployable');
          put('task_id',task); put('game_id',game); put('source_root',root); put('base_sha',base); put('release_state',state); put('production_class',productionClass); put('origin',origin);
          NODE

      - name: Revalidate semantic authority and BASE_SHA after successful APK build
        id: revalidate
        if: github.event.workflow_run.conclusion == 'success'
        continue-on-error: true
        env:
          SOURCE_ROOT: ${{ steps.manifest.outputs.source_root }}
          BASE_SHA: ${{ steps.manifest.outputs.base_sha }}
          PRODUCTION_CLASS: ${{ steps.manifest.outputs.production_class }}
        shell: bash
        run: |
          set -euo pipefail
          case "$PRODUCTION_CLASS" in RELEASE_CONFIRMED|DEVELOPMENT_CONFIRMED) ;; *) exit 1 ;; esac
          git fetch origin main --quiet
          git cat-file -e "${BASE_SHA}^{commit}"
          test -z "$(git diff --name-only "$BASE_SHA" origin/main -- "$SOURCE_ROOT")"
          echo 'VIBE2_UNITY_CANDIDATE_APK_BUILD=PASS'

      - name: Promote verified Unity source root through reviewed PR
        id: promote
        if: github.event.workflow_run.conclusion == 'success' && steps.revalidate.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ROOT: ${{ steps.manifest.outputs.source_root }}
          BASE_SHA: ${{ steps.manifest.outputs.base_sha }}
          TASK_ID: ${{ steps.manifest.outputs.task_id }}
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test -z "$(git diff --name-only "$BASE_SHA" origin/main -- "$SOURCE_ROOT")" || exit 1
          rm -rf /tmp/vibe2-promote
          git worktree prune
          safe_task="$(printf '%s' "$TASK_ID" | tr -cs 'A-Za-z0-9._-' '-' | sed 's/^-*//;s/-*$//' | cut -c1-60)"
          release_branch="automation/vibe2-unity-release-${safe_task}-${GITHUB_RUN_ID}"
          git worktree add -b "$release_branch" /tmp/vibe2-promote origin/main >/dev/null
          cd /tmp/vibe2-promote
          git config user.name 'jaewoon-vibe2-release'
          git config user.email 'vibe2-release@users.noreply.github.com'
          git checkout "$CANDIDATE_SHA" -- "$SOURCE_ROOT"
          git diff --check
          git add "$SOURCE_ROOT"
          git diff --cached --quiet && exit 1
          git commit -m "vibe2: deploy ${TASK_ID}"
          release_commit="$(git rev-parse HEAD)"
          git push origin "HEAD:$release_branch"
          pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$release_branch" --title "vibe2: deploy ${TASK_ID}" --body "Verified Unity implementation candidate. APK build workflow: ${{ github.event.workflow_run.id }}. Direct main write: NO. This is incremental implementation/build evidence only; Development Baseline implementation completion, device validation and independent release QA remain separate gates.")"
          sleep 5
          gh pr checks "$pr_url" --watch --fail-fast --interval 10
          git fetch origin main --quiet
          test -z "$(git diff --name-only "$BASE_SHA" origin/main -- "$SOURCE_ROOT")" || exit 1
          gh pr merge "$pr_url" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
          git fetch origin main --quiet
          git diff --quiet "$release_commit" origin/main -- "$SOURCE_ROOT"
          echo "promotion_sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          echo "VIBE2_MAIN_PROMOTION_SHA=$(git rev-parse origin/main)"
          echo "VIBE2_RELEASE_PR=$pr_url"
          echo 'DIRECT_MAIN_WRITE=NO'

      - name: Resolve exact Unity Android presentation runtime evidence
        id: presentation_runtime
        if: github.event.workflow_run.conclusion == 'success' && steps.revalidate.outcome == 'success' && steps.promote.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_ID: ${{ steps.manifest.outputs.task_id }}
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin vibe2-unreal-core --quiet
          git show origin/vibe2-unreal-core:.vibe2/queue.json > /tmp/vibe2-unity-control-queue.json
          required="$(node <<'NODE'
          const fs=require('fs');
          const q=JSON.parse(fs.readFileSync('/tmp/vibe2-unity-control-queue.json','utf8'));
          const task=(q.tasks||[]).find(row=>String(row?.id||'').trim()===String(process.env.TASK_ID||'').trim());
          const evidence=(task?.evidence||[]).map(String);
          const studio=task?.studioQualityEvolution&&typeof task.studioQualityEvolution==='object'?task.studioQualityEvolution:{};
          const required=studio.finalFanInComparisonRequired===true
            ||studio.runtimeBeforeAfterComparisonRequired===true
            ||evidence.includes('graphics-evolution-before-after-comparison-required')
            ||evidence.includes('presentation-runtime-qa-required');
          process.stdout.write(required?'YES':'NO');
          NODE
          )"
          echo "required=$([ "$required" = YES ] && printf true || printf false)" >> "$GITHUB_OUTPUT"
          if [ "$required" != YES ]; then
            echo 'pass=true' >> "$GITHUB_OUTPUT"
            echo 'UNITY_PRESENTATION_RUNTIME_COMPARE=NOT_REQUIRED'
            exit 0
          fi

          rm -rf /tmp/vibe2-build-artifacts
          mkdir -p /tmp/vibe2-build-artifacts
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir /tmp/vibe2-build-artifacts
          evidence_file="$(find /tmp/vibe2-build-artifacts -type f -name 'evidence.json' -path '*android16-install-gate*' -print -quit)"
          screenshot_file="$(find /tmp/vibe2-build-artifacts -type f -name 'screenshot.png' -path '*android16-install-gate*' -size +0c -print -quit)"
          test -n "$evidence_file"
          test -n "$screenshot_file"
          node - "$evidence_file" <<'NODE'
          const fs=require('fs');
          const row=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(row.target!=='unity-android')throw new Error('UNITY_RUNTIME_TARGET_INVALID');
          if(row.runtimeSmokePassed!==true||row.qaPassEligibleRuntimeEvidence!==true)throw new Error('UNITY_RUNTIME_SMOKE_NOT_PASS');
          if(row.runtimeAbiCompatible!==true||row.fatalRuntimeErrorDetected===true)throw new Error('UNITY_RUNTIME_EVIDENCE_INVALID');
          if(row.processObservedAfterLaunch!==true||row.processAliveAfterInput!==true)throw new Error('UNITY_RUNTIME_PROCESS_NOT_OBSERVED');
          NODE
          screenshot_sha256="$(sha256sum "$screenshot_file" | awk '{print $1}')"
          evidence_sha256="$(sha256sum "$evidence_file" | awk '{print $1}')"
          test -n "$screenshot_sha256"
          test -n "$evidence_sha256"
          echo "screenshot_sha256=$screenshot_sha256" >> "$GITHUB_OUTPUT"
          echo "runtime_evidence_sha256=$evidence_sha256" >> "$GITHUB_OUTPUT"
          echo 'pass=true' >> "$GITHUB_OUTPUT"
          echo "UNITY_PRESENTATION_RUNTIME_SCREENSHOT_SHA256=$screenshot_sha256"
          echo "UNITY_PRESENTATION_RUNTIME_EVIDENCE_SHA256=$evidence_sha256"
          echo 'UNITY_PRESENTATION_RUNTIME_COMPARE=ACTUAL_RUNTIME_OBSERVED'

      - name: Record current-source incremental Vibe2 and APK build evidence
        id: release_evidence
        if: github.event.workflow_run.conclusion == 'success' && steps.revalidate.outcome == 'success' && steps.promote.outcome == 'success' && steps.manifest.outputs.production_class == 'RELEASE_CONFIRMED'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_ID: ${{ steps.manifest.outputs.game_id }}
          TASK_ID: ${{ steps.manifest.outputs.task_id }}
          SOURCE_ROOT: ${{ steps.manifest.outputs.source_root }}
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          current_main="$(git rev-parse origin/main)"
          source_tree_sha="$(git rev-parse "origin/main:$SOURCE_ROOT")"
          test -n "$source_tree_sha"

          if [ ! -d /tmp/vibe2-build-artifacts ]; then
            mkdir -p /tmp/vibe2-build-artifacts
            gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir /tmp/vibe2-build-artifacts
          fi
          mapfile -t apks < <(find /tmp/vibe2-build-artifacts -type f -name '*.apk' -size +0c | sort)
          test "${#apks[@]}" -gt 0
          mapfile -t apk_hashes < <(for apk in "${apks[@]}"; do sha256sum "$apk" | awk '{print $1}'; done | sort -u)
          test "${#apk_hashes[@]}" -eq 1
          apk_sha256="${apk_hashes[0]}"
          test -n "$apk_sha256"

          kst_date="$(TZ=Asia/Seoul date +%F)"
          evidence_dir="design/$GAME_ID/$kst_date"
          rm -rf /tmp/vibe2-release-evidence
          git worktree prune
          evidence_branch="automation/vibe2-release-evidence-${GAME_ID}-${GITHUB_RUN_ID}"
          git worktree add -b "$evidence_branch" /tmp/vibe2-release-evidence origin/main >/dev/null
          cd /tmp/vibe2-release-evidence
          mkdir -p "$evidence_dir"
          node - "$evidence_dir" "$GAME_ID" "$TASK_ID" "$SOURCE_ROOT" "$source_tree_sha" "$current_main" "$CANDIDATE_SHA" "$BUILD_RUN_ID" "$apk_sha256" <<'NODE'
          const fs=require('fs'),path=require('path');
          const [dir,gameId,taskId,sourceRoot,sourceTreeSha,sourceCommit,candidateSha,buildRunId,apkSha256]=process.argv.slice(2);
          const now=new Date().toISOString();
          const implementation={
            version:1,gameId,status:'PARTIAL_BUILD_VERIFIED',owner:'VIBE2',role:'PRIMARY_DEVELOPMENT_ENGINE',
            developmentBaselineImplemented:false,sourceRoot,sourceTreeSha,sourceCommit,candidateSha,taskId,buildWorkflowRunId:Number(buildRunId),
            coreDesignLockViolation:false,policyDocument:'COMPANY_FLOW.md',verifiedAt:now,
            evidence:['incremental-candidate-source-promoted-through-reviewed-pr','unity-hybrid-android-build-success'],
            note:'Incremental Vibe2 task/build verified. This is not Development Baseline implementation completion evidence.'
          };
          const build={
            version:1,gameId,status:'PASS',pass:true,buildId:apkSha256,sha256:apkSha256,
            sourceRoot,sourceTreeSha,sourceCommit,candidateSha,workflow:'Unity Hybrid Android Build',workflowRunId:Number(buildRunId),
            artifactVerified:true,coreDesignLockViolation:false,policyDocument:'COMPANY_FLOW.md',verifiedAt:now,
            evidence:['downloaded-nonempty-apk-artifact','single-consistent-apk-sha256','build-workflow-conclusion-success']
          };
          fs.writeFileSync(path.join(dir,'vibe2-release-implementation.json'),JSON.stringify(implementation,null,2)+'\n');
          fs.writeFileSync(path.join(dir,'unity-android-build.json'),JSON.stringify(build,null,2)+'\n');
          NODE

          git config user.name 'jaewoon-vibe2-release-evidence'
          git config user.email 'vibe2-release@users.noreply.github.com'
          git add "$evidence_dir/vibe2-release-implementation.json" "$evidence_dir/unity-android-build.json"
          git diff --cached --quiet && exit 1
          git commit -m "release: bind incremental Vibe2 build ${GAME_ID}"
          git push origin "HEAD:$evidence_branch"
          pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$evidence_branch" --title "release: bind current incremental Vibe2 build ${GAME_ID}" --body "Current-source incremental implementation/build evidence for RELEASE_CONFIRMED. sourceTreeSha=${source_tree_sha}; APK sha256=${apk_sha256}; build run=${BUILD_RUN_ID}. Development Baseline implementation completion=false. This does NOT assert device validation or independent QA PASS. Direct main write: NO.")"
          sleep 5
          gh pr checks "$pr_url" --watch --fail-fast --interval 10
          gh pr merge "$pr_url" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
          echo "source_tree_sha=$source_tree_sha" >> "$GITHUB_OUTPUT"
          echo "build_id=$apk_sha256" >> "$GITHUB_OUTPUT"
          echo 'RELEASE_INCREMENTAL_BUILD_EVIDENCE=RECORDED'
          echo 'DEVELOPMENT_BASELINE_IMPLEMENTATION_COMPLETE=NO'
          echo 'INDEPENDENT_RELEASE_QA=NOT_ASSERTED'
          echo 'DEVICE_VALIDATION=NOT_ASSERTED'

      - name: Settle Unity result and continue correct source queue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_ID: ${{ steps.manifest.outputs.task_id }}
          BUILD_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          REVALIDATE_OUTCOME: ${{ steps.revalidate.outcome }}
          PROMOTE_OUTCOME: ${{ steps.promote.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.release_evidence.outcome }}
          PRESENTATION_RUNTIME_OUTCOME: ${{ steps.presentation_runtime.outcome }}
          PRESENTATION_RUNTIME_REQUIRED: ${{ steps.presentation_runtime.outputs.required }}
          PRESENTATION_RUNTIME_SCREENSHOT_SHA256: ${{ steps.presentation_runtime.outputs.screenshot_sha256 }}
          PRESENTATION_RUNTIME_EVIDENCE_SHA256: ${{ steps.presentation_runtime.outputs.runtime_evidence_sha256 }}
          PRODUCTION_CLASS: ${{ steps.manifest.outputs.production_class }}
          CANDIDATE_ORIGIN: ${{ steps.manifest.outputs.origin }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TASK_ID"
          if [ "$BUILD_CONCLUSION" = success ] && [ "$REVALIDATE_OUTCOME" = success ] && [ "$PROMOTE_OUTCOME" = success ] && [ "$PRESENTATION_RUNTIME_OUTCOME" = success ]; then result=PASS; else result=FAIL; fi
          if [ "$PRODUCTION_CLASS" = 'RELEASE_CONFIRMED' ] && [ "$result" = PASS ] && [ "$EVIDENCE_OUTCOME" != success ]; then result=FAIL; fi
          if [ "$CANDIDATE_ORIGIN" = 'AUTONOMOUS_DEV_VERIFIED_HANDOFF' ]; then
            if [ "$result" = PASS ]; then
              active="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow artbook-free-department-bots.yml --limit 10 --json status --jq '[.[]|select(.status=="in_progress" or .status=="queued" or .status=="pending")]|length')"
              if [ "$active" = 0 ]; then
                gh workflow run artbook-free-department-bots.yml --repo "$GITHUB_REPOSITORY" --ref main -f game_id="${{ steps.manifest.outputs.game_id }}"
                echo 'AUTONOMOUS_UNITY_RELEASE_GATE_RESUME=DISPATCHED'
              else
                echo 'AUTONOMOUS_UNITY_RELEASE_GATE_RESUME=EXISTING_CHAIN_ACTIVE'
              fi
            fi
            gh workflow run autonomous-continuous-development.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo "AUTONOMOUS_UNITY_INCREMENTAL_BUILD_RESULT=$result"
            echo 'AUTONOMOUS_NEXT_FLOOR=DISPATCHED'
            [ "$result" = PASS ]
            exit
          fi
          rm -rf /tmp/vibe2-control
          git clone --branch vibe2-unreal-core --single-branch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/vibe2-control >/dev/null 2>&1
          git -C /tmp/vibe2-control fetch origin main --quiet
          rm -rf /tmp/vibe2-main-contract
          git -C /tmp/vibe2-control worktree add --detach /tmp/vibe2-main-contract origin/main >/dev/null
          cd /tmp/vibe2-control
          git config user.name 'jaewoon-vibe2-release'
          git config user.email 'vibe2-release@users.noreply.github.com'
          if [ "$result" = PASS ]; then
            presentation_mode="$(TASK_ID="$TASK_ID" CURRENT_SCREENSHOT="$PRESENTATION_RUNTIME_SCREENSHOT_SHA256" node --input-type=module <<'NODE'
            import fs from 'node:fs';
            const q=JSON.parse(fs.readFileSync('.vibe2/queue.json','utf8'));
            const task=(q.tasks||[]).find(row=>String(row?.id||'')===String(process.env.TASK_ID||''))||{};
            const evidence=(task.evidence||[]).map(String);
            const studio=task?.studioQualityEvolution&&typeof task.studioQualityEvolution==='object'?task.studioQualityEvolution:{};
            const required=studio.finalFanInComparisonRequired===true
              ||studio.runtimeBeforeAfterComparisonRequired===true
              ||evidence.includes('graphics-evolution-before-after-comparison-required')
            ||evidence.includes('presentation-runtime-qa-required');
            if(!required){process.stdout.write('NOT_REQUIRED|NONE');process.exit(0);}
            if(!evidence.includes('presentation-source-delta:PASS')){process.stdout.write('BLOCK_SOURCE_DELTA|NONE');process.exit(0);}
            const prior=(q.tasks||[]).filter(row=>{
              if(row.gameId!==task.gameId||String(row.target||'').toLowerCase()!=='unity')return false;
              if(String(row.status||'').toLowerCase()!=='verified')return false;
              const ev=(row.evidence||[]).map(String);
              return ev.includes('presentation-runtime-actual:PASS')&&ev.some(value=>value.startsWith('unity-runtime-screenshot-sha256:'));
            }).at(-1)||null;
            if(!prior){process.stdout.write('BASELINE|NONE');process.exit(0);}
            const priorHash=((prior.evidence||[]).map(String).find(value=>value.startsWith('unity-runtime-screenshot-sha256:'))||'').slice('unity-runtime-screenshot-sha256:'.length);
            if(!priorHash||priorHash===String(process.env.CURRENT_SCREENSHOT||'')){process.stdout.write('BLOCK_NO_VISUAL_DELTA|'+String(prior.id||'NONE'));process.exit(0);}
            process.stdout.write('COMPARE|'+String(prior.id||'NONE'));
            NODE
            )"
            IFS='|' read -r presentation_mode_kind prior_task_id <<< "$presentation_mode"
            runtime_evidence="unity-candidate-apk-build-pass,unity-build-run-${{ github.event.workflow_run.id }},unity-runtime-actual:PASS,unity-runtime-screenshot-sha256:${PRESENTATION_RUNTIME_SCREENSHOT_SHA256},unity-runtime-evidence-sha256:${PRESENTATION_RUNTIME_EVIDENCE_SHA256},presentation-runtime-actual:PASS,main-pr-merged,incremental-release-evidence-${EVIDENCE_OUTCOME},actions-run-${GITHUB_RUN_ID}"
            case "$presentation_mode_kind" in
              BLOCK_SOURCE_DELTA)
                result=FAIL
                node /tmp/vibe2-main-contract/tools/vibe2-queue-control.mjs fail --id="$TASK_ID" --blocker=unity-presentation-runtime-source-delta-missing --evidence="${runtime_evidence},presentation-runtime-before-after:BLOCKED,presentation-source-delta:FAIL"
                ;;
              BLOCK_NO_VISUAL_DELTA)
                result=FAIL
                node /tmp/vibe2-main-contract/tools/vibe2-queue-control.mjs fail --id="$TASK_ID" --blocker=unity-presentation-runtime-visible-delta-missing --evidence="${runtime_evidence},presentation-runtime-before-task:${prior_task_id},presentation-runtime-before-after:BLOCKED"
                ;;
              BASELINE)
                node /tmp/vibe2-main-contract/tools/vibe2-queue-control.mjs pass --id="$TASK_ID" --evidence="${runtime_evidence},presentation-runtime-baseline-established:unity,presentation-runtime-before:FOUNDATION_BASELINE_CREATION,presentation-runtime-before-after:BASELINE_ESTABLISHED"
                ;;
              COMPARE)
                node /tmp/vibe2-main-contract/tools/vibe2-queue-control.mjs pass --id="$TASK_ID" --evidence="${runtime_evidence},presentation-runtime-before-after:PASS,presentation-runtime-before-task:${prior_task_id},presentation-source-delta:PASS,presentation-protected-regression:PASS"
                ;;
              *)
                node /tmp/vibe2-main-contract/tools/vibe2-queue-control.mjs pass --id="$TASK_ID" --evidence="${runtime_evidence},unity-runtime-presentation-compare:NOT_REQUIRED"
                ;;
            esac
          else
            node /tmp/vibe2-main-contract/tools/vibe2-queue-control.mjs fail --id="$TASK_ID" --blocker=unity-build-presentation-runtime-promotion-or-release-evidence-failed --evidence="build-${BUILD_CONCLUSION},presentation-runtime-${PRESENTATION_RUNTIME_OUTCOME},revalidate-${REVALIDATE_OUTCOME},promotion-${PROMOTE_OUTCOME},release-evidence-${EVIDENCE_OUTCOME},unity-build-run-${{ github.event.workflow_run.id }}"
          fi
          git add .vibe2/queue.json
          git commit -m "vibe2: settle Unity task ${TASK_ID} ${result} [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin vibe2-unreal-core
            git push origin HEAD:vibe2-unreal-core && break
            test "$attempt" -lt 3
            sleep $((attempt * 2))
          done
          payload="$(jq -nc \
            --arg run "${GITHUB_RUN_ID:-}" \
            --arg attempt "${GITHUB_RUN_ATTEMPT:-}" \
            --arg task "${TASK_ID:-}" \
            --arg outcome "${result:-QUEUE_UPDATED}" \
            '{event_type:"vibe2-fanin-refill",client_payload:{source_run:$run,source_attempt:$attempt,source_task:$task,source_outcome:$outcome,reason:"dependency-or-retry-ready"}}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
            --data "$payload"
          echo "VIBE2_EVENT_DRIVEN_DEPENDENCY_REFILL=${TASK_ID:-NONE}:${result:-QUEUE_UPDATED}"
          echo "VIBE2_UNITY_INCREMENTAL_BUILD=$result"
          [ "$result" = PASS ]
