name: Stat Modifiers Test

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test stat modifiers and game kit integration
        run: |
          rm -rf /tmp/jaewoon-stats
          mkdir -p /tmp/jaewoon-stats
          cp assets/stat-modifiers.js assets/game-kit.js assets/game-blueprint.js assets/game-presets.js assets/d20-rules.js assets/turn-combat.js assets/character-progression.js assets/inventory-equipment.js assets/quest-dialogue.js assets/skill-effects.js assets/economy-loot-shop.js assets/save-versioning.js /tmp/jaewoon-stats/
          printf '{"type":"module"}\n' > /tmp/jaewoon-stats/package.json
          cd /tmp/jaewoon-stats
          node --check stat-modifiers.js
          node --check game-kit.js
          node --check game-blueprint.js
          node --check game-presets.js
          node --input-type=module <<'NODE'
          import { JaewoonStatModifiers } from './stat-modifiers.js';
          import { createGameKit } from './game-kit.js';
          import { buildGameBlueprint } from './game-blueprint.js';
          import { buildGamePreset } from './game-presets.js';

          const stats = new JaewoonStatModifiers();
          const state = stats.createState({ base: { hp: 100, damage: 10 } });
          stats.addModifier(state, 'hp', { id: 'armor', source: 'equipment', flat: 50 });
          stats.addModifier(state, 'hp', { id: 'buff', source: 'skill', percent: 0.2 });
          stats.addModifier(state, 'damage', { id: 'rage', multiplier: 1.5, max: 20 });
          if (stats.calculate(state, 'hp') !== 180) throw new Error('flat/percent calculation failed');
          if (stats.calculate(state, 'damage') !== 15) throw new Error('multiplier calculation failed');
          stats.setEnabled(state, 'hp', 'buff', false);
          if (stats.calculate(state, 'hp') !== 150) throw new Error('enable toggle failed');
          if (stats.removeSource(state, 'equipment') !== 1 || stats.calculate(state, 'hp') !== 100) throw new Error('source removal failed');

          const kit = createGameKit({
            gameId: 'stat-kit',
            statModifiers: { initialState: { base: { speed: 5 } } },
            versionedSave: true,
          });
          kit.get('stats').addModifier(kit.state.stats, 'speed', { id: 'boots', flat: 2 });
          const saved = kit.wrapSave();
          const restored = createGameKit({ gameId: 'stat-kit', statModifiers: true, versionedSave: true });
          restored.restoreState(saved);
          if (restored.get('stats').calculate(restored.state.stats, 'speed') !== 7) throw new Error('kit stat restore failed');

          const blueprint = buildGameBlueprint({ gameId: 'rpg-stats', genre: 'rpg' });
          const blueprintKit = blueprint.createKit();
          if (!blueprint.systems.includes('stat-modifiers') || !blueprintKit.has('stats')) throw new Error('blueprint stat system missing');

          const puzzle = buildGamePreset({ genre: 'puzzle' });
          if (puzzle.systems.includes('stat-modifiers')) throw new Error('puzzle should not force stat modifiers');
          console.log('PASS stat modifiers');
          NODE
