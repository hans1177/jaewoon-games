name: Unity Local Runner Heartbeat

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unity-local-runner-heartbeat.yml'

permissions:
  contents: read

concurrency:
  group: unity-local-runner-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: [self-hosted, Windows, X64, jaewoon-unity]
    timeout-minutes: 3
    steps:
      - name: Recover colocated Roblox Studio runner
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $runnerRoot = 'C:\actions-runner'
          $metadataPath = Join-Path $runnerRoot '.runner'
          $runCmd = Join-Path $runnerRoot 'run.cmd'
          $svcCmd = Join-Path $runnerRoot 'svc.cmd'

          if (-not (Test-Path -LiteralPath $metadataPath) -or -not (Test-Path -LiteralPath $runCmd)) {
            Write-Host 'ROBLOX_RUNNER_COLOCATED=NO'
            exit 0
          }

          $metadata = Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json
          if ([string]$metadata.agentName -ne 'roblox-studio-local') {
            Write-Host "ROBLOX_RUNNER_COLOCATED=NO:$($metadata.agentName)"
            exit 0
          }
          Write-Host 'ROBLOX_RUNNER_COLOCATED=YES'

          $service = Get-Service -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like 'actions.runner.*' -and $_.Name -match 'roblox-studio-local' } |
            Select-Object -First 1

          if (-not $service -and (Test-Path -LiteralPath $svcCmd)) {
            Push-Location $runnerRoot
            try {
              & $svcCmd install
            } finally {
              Pop-Location
            }
            $service = Get-Service -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -like 'actions.runner.*' -and $_.Name -match 'roblox-studio-local' } |
              Select-Object -First 1
          }

          if ($service) {
            Set-Service -Name $service.Name -StartupType Automatic
            $service = Get-Service -Name $service.Name
            if ($service.Status -ne 'Running') {
              Start-Service -Name $service.Name
              $service.WaitForStatus('Running',[TimeSpan]::FromSeconds(20))
            }
            Write-Host "ROBLOX_RUNNER_RECOVERY=SERVICE_RUNNING:$($service.Name)"
          } else {
            $existing = Get-CimInstance Win32_Process -Filter "Name='Runner.Listener.exe'" -ErrorAction SilentlyContinue |
              Where-Object { [string]$_.CommandLine -match [regex]::Escape($runnerRoot) } |
              Select-Object -First 1
            if (-not $existing) {
              Start-Process -FilePath 'cmd.exe' -ArgumentList '/c',('"' + $runCmd + '"') -WorkingDirectory $runnerRoot -WindowStyle Hidden
              Start-Sleep -Seconds 5
            }
            $listener = Get-CimInstance Win32_Process -Filter "Name='Runner.Listener.exe'" -ErrorAction SilentlyContinue |
              Where-Object { [string]$_.CommandLine -match [regex]::Escape($runnerRoot) } |
              Select-Object -First 1
            if (-not $listener) { throw 'ROBLOX_RUNNER_LISTENER_NOT_RECOVERED' }
            Write-Host "ROBLOX_RUNNER_RECOVERY=HIDDEN_LISTENER_RUNNING:$($listener.ProcessId)"
          }

      - name: Confirm local Unity runner and editor capabilities
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $now = (Get-Date).ToUniversalTime().ToString('o')
          Write-Host "LOCAL_UNITY_RUNNER_ONLINE=true"
          Write-Host "HEARTBEAT_UTC=$now"
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"

          $root = Join-Path $env:ProgramFiles 'Unity\Hub\Editor'
          if (-not (Test-Path $root)) {
            Write-Host 'UNITY_EDITOR_ROOT_PRESENT=false'
            throw "Unity Hub editor root missing: $root"
          }

          $editors = @(Get-ChildItem $root -Directory -ErrorAction Stop | ForEach-Object {
            $unity = Join-Path $_.FullName 'Editor\Unity.exe'
            $android = Join-Path $_.FullName 'Editor\Data\PlaybackEngines\AndroidPlayer'
            if (Test-Path $unity) {
              [pscustomobject]@{
                Version = $_.Name
                UnityExe = $unity
                AndroidSupport = (Test-Path $android)
              }
            }
          } | Sort-Object Version)

          if ($editors.Count -eq 0) {
            Write-Host 'UNITY_EDITOR_COUNT=0'
            throw 'No local Unity editors were detected.'
          }

          Write-Host "UNITY_EDITOR_COUNT=$($editors.Count)"
          foreach ($editor in $editors) {
            Write-Host "UNITY_EDITOR version=$($editor.Version) androidSupport=$($editor.AndroidSupport) path=$($editor.UnityExe)"
          }
          $androidEditors = @($editors | Where-Object { $_.AndroidSupport -eq $true })
          Write-Host "UNITY_ANDROID_EDITOR_COUNT=$($androidEditors.Count)"
          if ($androidEditors.Count -eq 0) {
            throw 'No installed Unity editor has Android Build Support.'
          }
          Write-Host "LOCAL_UNITY_RUNNER_CAPABILITY=PASS"
