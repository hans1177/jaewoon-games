name: One-time Artbook Page Policy Sync

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-artbook-page-policy-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync artbook page policy to 30 cuts
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='game-artbooks.json';
          const data=JSON.parse(fs.readFileSync(path,'utf8'));
          data.policy ||= {};
          data.policy.maxCutsPerEdition=30;
          fs.writeFileSync(path,JSON.stringify(data,null,2)+'\n');
          NODE
      - name: Commit policy sync
        run: |
          set -euo pipefail
          if git diff --quiet -- game-artbooks.json; then
            echo 'ARTBOOK_PAGE_POLICY_ALREADY_SYNCED=YES'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game-artbooks.json
          git commit -m 'fix(artbook): sync max cuts to 30'
          git push origin HEAD:main
