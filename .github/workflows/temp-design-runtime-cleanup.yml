name: Temporary DESIGN_ONLY Runtime Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-design-runtime-cleanup.yml'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Keep newest design runtime and cancel migration leftovers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/company-seed-design-runtime.yml/runs?branch=main&per_page=100")"
          mapfile -t active_ids < <(printf '%s' "$runs" | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const j=JSON.parse(s);(j.workflow_runs||[]).filter(r=>['queued','in_progress','pending','requested','waiting'].includes(r.status)).sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at))).forEach(r=>console.log(r.id));})")
          if [ "${#active_ids[@]}" -eq 0 ]; then
            echo 'DESIGN_RUNTIME_CLEANUP=NO_ACTIVE_RUNS'
            exit 0
          fi
          keep="${active_ids[0]}"
          echo "DESIGN_RUNTIME_CLEANUP_KEEP=$keep"
          cancelled=0
          for run_id in "${active_ids[@]:1}"; do
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null || true
            echo "DESIGN_RUNTIME_CLEANUP_CANCEL_REQUESTED=$run_id"
            cancelled=$((cancelled+1))
          done
          echo "DESIGN_RUNTIME_CLEANUP_CANCELLED_COUNT=$cancelled"
