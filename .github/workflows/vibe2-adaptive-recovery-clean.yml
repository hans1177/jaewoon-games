name: Vibe2 Adaptive Recovery Clean Probe

on:
  pull_request:
    branches: [vibe2-unreal-core]
    paths:
      - '.github/workflows/vibe2-adaptive-recovery-clean.yml'

permissions:
  contents: read

jobs:
  setup_a:
    runs-on: ubuntu-latest
    outputs:
      reserved_at: ${{ steps.time.outputs.reserved_at }}
    steps:
      - id: time
        shell: bash
        run: echo "reserved_at=$(date +%s%3N)" >> "$GITHUB_OUTPUT"

  workers_a:
    needs: setup_a
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        id: [1,2,3,4]
    steps:
      - name: Mark worker start
        shell: bash
        run: echo "$(date +%s%3N)" > /tmp/probe-start
      - uses: actions/checkout@v4
      - name: Run recovery sample A
        env:
          WORKER_ID: ${{ matrix.id }}
          RESERVED_AT: ${{ needs.setup_a.outputs.reserved_at }}
          RUN_ID: recovery-clean-a-${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          start="$(cat /tmp/probe-start)"
          after_checkout="$(date +%s%3N)"
          checkout_ms=$((after_checkout-start))
          sleep 20
          finish="$(date +%s%3N)"
          mkdir -p /tmp/probe
          START="$start" FINISH="$finish" CHECKOUT_MS="$checkout_ms" node <<'NODE'
          const fs=require('fs');
          const row={
            taskId:`recovery-clean-a-${process.env.WORKER_ID}`,
            runId:process.env.RUN_ID,
            outcome:'PASS',
            metrics:{
              runId:process.env.RUN_ID,
              reservedAt:Number(process.env.RESERVED_AT),
              workerStartedAt:Number(process.env.START),
              workerFinishedAt:Number(process.env.FINISH),
              checkoutMs:Number(process.env.CHECKOUT_MS),
              candidateMs:0,
              qaMs:0,
              workerTotalMs:Number(process.env.FINISH)-Number(process.env.START)
            }
          };
          fs.writeFileSync(`/tmp/probe/result-${process.env.WORKER_ID}.json`,JSON.stringify(row));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-clean-a-${{ matrix.id }}
          path: /tmp/probe/*.json
          retention-days: 1

  fanin_a:
    needs: workers_a
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: recovery-clean-a-*
          path: /tmp/a
          merge-multiple: true
      - name: Verify first healthy saturated run
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { computeParallelismTelemetry } from './tools/vibe2-parallelism-telemetry.mjs';
          import { createParallelismControl, decideAdaptiveBackpressure } from './tools/vibe2-adaptive-backpressure.mjs';
          const rows=fs.readdirSync('/tmp/a').filter(x=>x.endsWith('.json')).map(x=>JSON.parse(fs.readFileSync(`/tmp/a/${x}`,'utf8')));
          const telemetry=computeParallelismTelemetry({results:rows,requestedMax:4,effectiveMax:4,taskCount:4});
          const seed=createParallelismControl({currentMax:4});
          const first=decideAdaptiveBackpressure(seed,telemetry);
          console.log(`RECOVERY_CLEAN_A_PEAK=${telemetry.actualPeakConcurrency}`);
          console.log(`RECOVERY_CLEAN_A_UTIL=${telemetry.effectivePeakUtilizationPct}`);
          console.log(`RECOVERY_CLEAN_A_QUEUE_P95_MS=${telemetry.queueWait.p95Ms}`);
          console.log(`RECOVERY_CLEAN_A_CHECKOUT_P95_MS=${telemetry.checkout.p95Ms}`);
          console.log(`RECOVERY_CLEAN_A_BOTTLENECK=${telemetry.bottleneck}`);
          console.log(`RECOVERY_CLEAN_FIRST=4->${first.currentMax}:${first.lastReason}`);
          const healthy=first.currentMax===4 && first.healthyStreak===1 && first.lastDecision==='HOLD' && first.lastReason==='HEALTHY_STREAK_1';
          console.log(`RECOVERY_CLEAN_A_HEALTHY=${healthy?'PASS':'FAIL'}`);
          if(!healthy) process.exit(1);
          fs.writeFileSync('/tmp/recovery-a.json',JSON.stringify(telemetry,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-clean-a-telemetry
          path: /tmp/recovery-a.json
          retention-days: 1

  setup_b:
    needs: fanin_a
    runs-on: ubuntu-latest
    outputs:
      reserved_at: ${{ steps.time.outputs.reserved_at }}
    steps:
      - id: time
        shell: bash
        run: echo "reserved_at=$(date +%s%3N)" >> "$GITHUB_OUTPUT"

  workers_b:
    needs: setup_b
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        id: [1,2,3,4]
    steps:
      - name: Mark worker start
        shell: bash
        run: echo "$(date +%s%3N)" > /tmp/probe-start
      - uses: actions/checkout@v4
      - name: Run recovery sample B
        env:
          WORKER_ID: ${{ matrix.id }}
          RESERVED_AT: ${{ needs.setup_b.outputs.reserved_at }}
          RUN_ID: recovery-clean-b-${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          start="$(cat /tmp/probe-start)"
          after_checkout="$(date +%s%3N)"
          checkout_ms=$((after_checkout-start))
          sleep 20
          finish="$(date +%s%3N)"
          mkdir -p /tmp/probe
          START="$start" FINISH="$finish" CHECKOUT_MS="$checkout_ms" node <<'NODE'
          const fs=require('fs');
          const row={
            taskId:`recovery-clean-b-${process.env.WORKER_ID}`,
            runId:process.env.RUN_ID,
            outcome:'PASS',
            metrics:{
              runId:process.env.RUN_ID,
              reservedAt:Number(process.env.RESERVED_AT),
              workerStartedAt:Number(process.env.START),
              workerFinishedAt:Number(process.env.FINISH),
              checkoutMs:Number(process.env.CHECKOUT_MS),
              candidateMs:0,
              qaMs:0,
              workerTotalMs:Number(process.env.FINISH)-Number(process.env.START)
            }
          };
          fs.writeFileSync(`/tmp/probe/result-${process.env.WORKER_ID}.json`,JSON.stringify(row));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-clean-b-${{ matrix.id }}
          path: /tmp/probe/*.json
          retention-days: 1

  fanin_b:
    needs: workers_b
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: recovery-clean-b-*
          path: /tmp/b
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: recovery-clean-a-telemetry
          path: /tmp/a-telemetry
      - name: Verify two-run recovery hysteresis
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { computeParallelismTelemetry } from './tools/vibe2-parallelism-telemetry.mjs';
          import { createParallelismControl, decideAdaptiveBackpressure } from './tools/vibe2-adaptive-backpressure.mjs';
          const telemetryA=JSON.parse(fs.readFileSync('/tmp/a-telemetry/recovery-a.json','utf8'));
          const rowsB=fs.readdirSync('/tmp/b').filter(x=>x.endsWith('.json')).map(x=>JSON.parse(fs.readFileSync(`/tmp/b/${x}`,'utf8')));
          const telemetryB=computeParallelismTelemetry({results:rowsB,requestedMax:4,effectiveMax:4,taskCount:4});
          const seed=createParallelismControl({currentMax:4});
          const first=decideAdaptiveBackpressure(seed,telemetryA);
          const second=decideAdaptiveBackpressure(first,telemetryB);
          console.log(`RECOVERY_CLEAN_B_PEAK=${telemetryB.actualPeakConcurrency}`);
          console.log(`RECOVERY_CLEAN_B_UTIL=${telemetryB.effectivePeakUtilizationPct}`);
          console.log(`RECOVERY_CLEAN_B_QUEUE_P95_MS=${telemetryB.queueWait.p95Ms}`);
          console.log(`RECOVERY_CLEAN_B_CHECKOUT_P95_MS=${telemetryB.checkout.p95Ms}`);
          console.log(`RECOVERY_CLEAN_B_BOTTLENECK=${telemetryB.bottleneck}`);
          console.log(`RECOVERY_CLEAN_FIRST=4->${first.currentMax}:${first.lastReason}`);
          console.log(`RECOVERY_CLEAN_SECOND=${first.currentMax}->${second.currentMax}:${second.lastReason}`);
          const pass=first.currentMax===4 && first.healthyStreak===1 && first.lastReason==='HEALTHY_STREAK_1' && second.currentMax===8 && second.lastDecision==='UP' && second.lastReason==='HEALTHY_STREAK_2';
          console.log(`RECOVERY_CLEAN_TWO_HEALTHY_RUNS=${pass?'PASS':'FAIL'}`);
          if(!pass) process.exit(1);
          NODE
