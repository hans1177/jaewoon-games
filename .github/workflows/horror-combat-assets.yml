name: Horror Authored Combat Assets
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/horror-combat-assets.yml'
      - 'tools/horror-combat-assets.mjs'
      - 'assets/roblox/world-ghosts/native/mesh/bride.glb'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: horror-authored-combat-assets-v2
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import authored skinned combat model
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_ROBLOSECURITY: ${{ secrets.ROBLOX_ROBLOSECURITY }}
          ROBLOX_SECURITY_COOKIE: ${{ secrets.ROBLOX_SECURITY_COOKIE }}
        run: node tools/horror-combat-assets.mjs
      - name: Open exact combat asset binding PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-horror-combat-assets'
          git config user.email 'actions@users.noreply.github.com'
          git add roblox-games/horror-escape-room/shared/CombatAssets.luau assets/roblox/world-ghosts/native/combat-roblox-assets.json
          if git diff --cached --quiet; then
            echo 'COMBAT_ASSET_BINDING_ALREADY_CURRENT=YES'
            exit 0
          fi
          git commit -m 'horror: bind authored combat model asset'
          branch="automation/horror-combat-asset-${GITHUB_RUN_ID}"
          git push origin "HEAD:$branch"
          pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title '심야 대탈출 authored 전투 자산 바인딩' --body 'Roblox에 등록된 exact bride.glb ModelId와 SHA만 바인딩한다. 게임 수치/저장/로비 구조는 변경하지 않는다.')"
          echo "COMBAT_ASSET_BINDING_PR=$pr_url"
