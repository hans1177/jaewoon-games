name: Horror Authored Combat Assets
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/horror-combat-assets.yml'
      - 'tools/horror-combat-assets.mjs'
      - 'assets/roblox/common-ui-v1/icons.png'
      - 'assets/roblox/common-ui-v1/panel.png'
      - 'company-asset-library.json'
      - 'assets/roblox/actors/native/**'
      - 'assets/shared/*.glb'
      - 'assets/roblox/world-ghosts/native/mesh/bride.glb'
      - 'assets/roblox/common-materials-v1/manifest.json'
      - 'assets/roblox/common-materials-v1/sources/**'
  workflow_dispatch:
    inputs:
      ui_only:
        description: 오너 승인 UI 이미지만 등록
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: horror-authored-combat-assets-v2
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import combat model and verified shared PBR sources
        env:
          UI_ONLY: ${{ inputs.ui_only || false }}
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_ROBLOSECURITY: ${{ secrets.ROBLOX_ROBLOSECURITY }}
          ROBLOX_SECURITY_COOKIE: ${{ secrets.ROBLOX_SECURITY_COOKIE }}
        run: |
          if [ "$UI_ONLY" = "true" ] || git diff --name-only HEAD^ HEAD -- assets/roblox/common-ui-v1/icons.png assets/roblox/common-ui-v1/panel.png roblox-games/daechung-rpg/shared/RPGMenu.luau | grep -q .; then
            node tools/horror-combat-assets.mjs --shared-ui-only
          else
            node tools/horror-combat-assets.mjs --include-shared-materials --include-shared-models
          fi
      - name: Preserve native import receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-material-import-receipts
          path: |
            assets/roblox/common-materials-v1/native-bindings.json
            assets/roblox/world-ghosts/native/combat-roblox-assets.json
            company-asset-library.json
            assets/roblox/common-ui-v1/catalog.json
          if-no-files-found: ignore
      - name: Open exact combat asset binding PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-horror-combat-assets'
          git config user.email 'actions@users.noreply.github.com'
          for binding_path in roblox-games/daechung-rpg/shared/RPGMenu.luau assets/roblox/common-ui-v1/catalog.json assets/roblox/common-ui-v1/RobloxCommonUI.luau roblox-games/horror-escape-room/shared/RobloxCommonUI.luau roblox-games/cozy-island/shared/RobloxCommonUI.luau roblox-games/daechung-rpg/shared/RobloxCommonUI.luau company-asset-library.json roblox-games/horror-escape-room/shared/CombatAssets.luau assets/roblox/world-ghosts/native/combat-roblox-assets.json assets/roblox/common-materials-v1/native-bindings.json roblox-games/horror-escape-room/default.project.json roblox-games/cozy-island/default.project.json roblox-games/daechung-rpg/default.project.json; do
            if test -f "$binding_path"; then git add -- "$binding_path"; fi
          done
          if git diff --cached --quiet; then
            echo 'COMBAT_ASSET_BINDING_ALREADY_CURRENT=YES'
            exit 0
          fi
          git commit -m 'assets: bind native combat model and shared PBR textures'
          branch="automation/horror-combat-asset-${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/$branch"
          pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title '기존 공용 모델 자동 변환과 네이티브 PBR 바인딩' --body '기존 권리·해시 확인 공용 GLB와 CC0 재질을 같은 네이티브 자산 등록 경로로 자동 변환·업로드한다. 범용 원본은 보존하고 플랫폼 파생 ID를 기존 자산 원장에 별도로 기록한다. 성공한 부분만 보존하며 실패 자산은 미완료로 남긴다. API 등록 성공은 화면 검증 완료를 뜻하지 않으며 productionVerified는 false로 유지한다. 동일 소스의 모바일 런타임·이미지 검증이 필요하다.')"
          echo "COMBAT_ASSET_BINDING_PR=$pr_url"
