name: Horror Authored Combat Assets
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/horror-combat-assets.yml'
      - 'tools/horror-combat-assets.mjs'
      - 'assets/roblox/world-ghosts/native/mesh/bride.glb'
      - 'assets/roblox/common-materials-v1/manifest.json'
      - 'assets/roblox/common-materials-v1/sources/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: horror-authored-combat-assets-v2
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import combat model and verified shared PBR sources
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_ROBLOSECURITY: ${{ secrets.ROBLOX_ROBLOSECURITY }}
          ROBLOX_SECURITY_COOKIE: ${{ secrets.ROBLOX_SECURITY_COOKIE }}
        run: node tools/horror-combat-assets.mjs --include-shared-materials
      - name: Preserve native import receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-material-import-receipts
          path: assets/roblox/common-materials-v1/native-bindings.json
          if-no-files-found: ignore
      - name: Open exact combat asset binding PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-horror-combat-assets'
          git config user.email 'actions@users.noreply.github.com'
          git add roblox-games/horror-escape-room/shared/CombatAssets.luau assets/roblox/world-ghosts/native/combat-roblox-assets.json assets/roblox/common-materials-v1/native-bindings.json roblox-games/horror-escape-room/default.project.json roblox-games/cozy-island/default.project.json roblox-games/daechung-rpg/default.project.json
          if git diff --cached --quiet; then
            echo 'COMBAT_ASSET_BINDING_ALREADY_CURRENT=YES'
            exit 0
          fi
          git commit -m 'assets: bind native combat model and shared PBR textures'
          branch="automation/horror-combat-asset-${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/$branch"
          pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title '심야·대충알피지·포근섬 네이티브 PBR 재질 바인딩' --body '해시를 확인한 CC0 재질 채널을 기존 네이티브 자산 등록 경로로 업로드하고, 세 게임의 MaterialVariant에 실제 자산 ID를 연결한다. API 등록 성공은 화면 검증 완료를 뜻하지 않으며 productionVerified는 false로 유지한다. 동일 소스의 모바일 런타임·이미지 검증이 필요하다.')"
          echo "COMBAT_ASSET_BINDING_PR=$pr_url"
