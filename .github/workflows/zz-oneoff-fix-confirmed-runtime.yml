name: One-off confirmed runtime schema binding repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zz-oneoff-fix-confirmed-runtime.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch latest confirmed runtime workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python - <<'PY'
          from pathlib import Path

          target=Path('.github/workflows/company-development-confirmed-runtime.yml')
          text=target.read_text()

          trigger="      - 'qa/company-web-validation-evidence-contract.test.mjs'\n"
          real_game="      - 'qa/company-web-real-game-regression.test.mjs'\n"
          if real_game not in text:
              if trigger not in text:
                  raise SystemExit('trigger anchor missing')
              text=text.replace(trigger,trigger+real_game,1)

          def replace_after(source, marker, old, new):
              start=source.find(marker)
              if start < 0:
                  raise SystemExit(f'marker missing: {marker}')
              pos=source.find(old,start)
              if pos < 0:
                  raise SystemExit(f'old text missing after marker: {marker}: {old}')
              return source[:pos]+new+source[pos+len(old):]

          web_marker='      - name: Persist parallel Web evidence and queue state\n'
          web_checkout='          git checkout -B development-web-persist "origin/$COMPANY_RUNTIME_BRANCH"\n'
          web_capture=(
              "          WEB_VALIDATION_SCHEMA_VERSION=\"$(node --input-type=module -e 'import {WEB_VALIDATION_SCHEMA_VERSION as v} from \"./tools/company-web-validation-evidence-contract.mjs\"; process.stdout.write(String(v));')\"\n"
              "          export WEB_VALIDATION_SCHEMA_VERSION\n"
              + web_checkout
          )
          text=replace_after(text,web_marker,web_checkout,web_capture)
          web_import="          import {WEB_VALIDATION_SCHEMA_VERSION} from './tools/company-web-validation-evidence-contract.mjs';\n"
          web_bound=(
              "          const WEB_VALIDATION_SCHEMA_VERSION=Number(process.env.WEB_VALIDATION_SCHEMA_VERSION||0);\n"
              "          if(!Number.isInteger(WEB_VALIDATION_SCHEMA_VERSION)||WEB_VALIDATION_SCHEMA_VERSION<=0)throw new Error('WEB_VALIDATION_SCHEMA_VERSION_MISSING');\n"
          )
          text=replace_after(text,web_marker,web_import,web_bound)

          route_marker='      - name: Persist canonical routed queue state\n'
          route_checkout='          git checkout -B development-router-persist "origin/$COMPANY_RUNTIME_BRANCH"\n'
          route_capture=(
              "          WEB_VALIDATION_SCHEMA_VERSION=\"$(node --input-type=module -e 'import {WEB_VALIDATION_SCHEMA_VERSION as v} from \"./tools/company-web-validation-evidence-contract.mjs\"; process.stdout.write(String(v));')\"\n"
              "          export WEB_VALIDATION_SCHEMA_VERSION\n"
              + route_checkout
          )
          text=replace_after(text,route_marker,route_checkout,route_capture)
          route_import="          import {WEB_VALIDATION_SCHEMA_VERSION} from './tools/company-web-validation-evidence-contract.mjs';\n"
          route_bound=(
              "          const WEB_VALIDATION_SCHEMA_VERSION=Number(process.env.WEB_VALIDATION_SCHEMA_VERSION||0);\n"
              "          if(!Number.isInteger(WEB_VALIDATION_SCHEMA_VERSION)||WEB_VALIDATION_SCHEMA_VERSION<=0)throw new Error('WEB_VALIDATION_SCHEMA_VERSION_MISSING');\n"
          )
          text=replace_after(text,route_marker,route_import,route_bound)

          target.write_text(text)
          PY
          git config user.name 'jaewoon-runtime-repair'
          git config user.email 'actions@users.noreply.github.com'
          git rm --ignore-unmatch .github/workflows/zz-oneoff-fix-confirmed-runtime.yml
          git add .github/workflows/company-development-confirmed-runtime.yml
          git diff --cached --check
          git diff --cached -- .github/workflows/company-development-confirmed-runtime.yml
          if git diff --cached --quiet; then
            echo 'ONEOFF_PATCH=NO_CHANGES'
            exit 0
          fi
          git commit -m 'Fix runtime schema binding across state checkouts'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo 'ONEOFF_PATCH=PASS'
              exit 0
            fi
            git pull --rebase origin main
          done
          echo 'ONEOFF_PATCH=PUSH_FAILED' >&2
          exit 2