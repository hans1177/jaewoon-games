name: Vibe2 Platform Focus Apply

on:
  push:
    branches:
      - vibe2-unreal-core
    paths:
      - '.vibe2/platform-focus.json'
      - '.vibe2/owner-directives-roblox.json'
      - 'assets/vibe-continuous-queue.js'
      - 'tools/vibe2-platform-focus-policy.mjs'
      - 'tools/vibe2-roblox-owner-queue.mjs'
      - 'tools/vibe2-source-worker.mjs'
      - 'tools/vibe2-development-execution-policy.mjs'
      - 'tools/vibe2-deterministic-source-worker.mjs'
      - 'tools/vibe2-implementation-worker.mjs'
      - '.github/workflows/vibe2-continuous-core.yml'
      - 'qa/vibe2-platform-focus-policy.test.mjs'
      - 'qa/vibe2-roblox-owner-queue.test.mjs'
      - 'qa/vibe2-source-worker.test.mjs'
      - 'qa/vibe2-source-worker-roblox-full-rebuild.test.mjs'
      - 'qa/vibe2-development-execution-policy.test.mjs'
      - 'qa/vibe2-deterministic-source-worker.test.mjs'
      - '.github/workflows/vibe2-platform-focus-apply.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    concurrency:
      group: vibe2-control-state-vibe2-unreal-core
      cancel-in-progress: false
    steps:
      - name: Checkout Vibe2 control line
        uses: actions/checkout@v4
        with:
          ref: vibe2-unreal-core
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Roblox focus and owner queue contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/vibe-continuous-queue.js
          node --check tools/vibe2-platform-focus-policy.mjs
          node --check tools/vibe2-roblox-owner-queue.mjs
          node --check tools/vibe2-source-worker.mjs
          node --check tools/vibe2-development-execution-policy.mjs
          node --check tools/vibe2-deterministic-source-worker.mjs
          node --check tools/vibe2-implementation-worker.mjs
          node --test qa/vibe2-platform-focus-policy.test.mjs
          node --test qa/vibe2-roblox-owner-queue.test.mjs
          node --test qa/vibe2-source-worker.test.mjs
          node --test qa/vibe2-source-worker-roblox-full-rebuild.test.mjs
          node --test qa/vibe2-development-execution-policy.test.mjs
          node --test qa/vibe2-deterministic-source-worker.test.mjs

      - name: Apply Roblox owner work and focus to current control queue
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jaewoon-vibe2-platform-focus'
          git config user.email 'vibe2-platform-focus@users.noreply.github.com'
          git fetch origin vibe2-unreal-core --quiet
          git reset --hard origin/vibe2-unreal-core
          node tools/vibe2-roblox-owner-queue.mjs \
            --queue=.vibe2/queue.json \
            --directives=.vibe2/owner-directives-roblox.json | tee /tmp/vibe2-roblox-owner-queue.log
          node tools/vibe2-platform-focus-policy.mjs \
            --queue=.vibe2/queue.json \
            --config=.vibe2/platform-focus.json | tee /tmp/vibe2-platform-focus.log
          if git diff --quiet -- .vibe2/queue.json; then
            echo 'VIBE2_PLATFORM_FOCUS_LIVE_QUEUE_WRITE=NO'
            exit 0
          fi
          git add .vibe2/queue.json
          git commit -m 'vibe2: apply Roblox primary work to queue [skip ci]'
          pushed=0
          for attempt in 1 2 3; do
            if git pull --rebase origin vibe2-unreal-core && git push origin HEAD:vibe2-unreal-core; then
              pushed=1
              break
            fi
            git rebase --abort 2>/dev/null || true
            git fetch origin vibe2-unreal-core --quiet
            sleep $((attempt * 2))
          done
          test "$pushed" = 1
          echo 'VIBE2_PLATFORM_FOCUS_LIVE_QUEUE_WRITE=YES'

      - name: Upload focus evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibe2-platform-focus-${{ github.run_id }}
          path: |
            /tmp/vibe2-roblox-owner-queue.log
            /tmp/vibe2-platform-focus.log
          if-no-files-found: ignore
          retention-days: 7

  continuous:
    needs: apply
    if: ${{ always() && needs.apply.result == 'success' }}
    uses: ./.github/workflows/vibe2-continuous-core.yml
    permissions:
      contents: write
      actions: write
