name: Unity Cloud Android Test

on:
  push:
    branches: [main]
    paths:
      - '.build-requests/unity/*.json'
  workflow_dispatch:
    inputs:
      request_file:
        description: 'Tracked .build-requests/unity/*.json request file'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: unity-cloud-android-test
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Resolve build request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            request_file='${{ inputs.request_file }}'
          else
            before='${{ github.event.before }}'
            if [[ -n "$before" && ! "$before" =~ ^0+$ ]]; then
              mapfile -t files < <(git diff --name-only "$before" "$GITHUB_SHA" -- '.build-requests/unity/*.json')
            else
              mapfile -t files < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- '.build-requests/unity/*.json')
            fi
            if [[ ${#files[@]} -ne 1 ]]; then
              echo "Exactly one Unity build request must change. Found ${#files[@]}: ${files[*]}" >&2
              exit 1
            fi
            request_file="${files[0]}"
          fi

          python - "$request_file" "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, re, sys
          request_file, output = sys.argv[1], sys.argv[2]
          if not re.fullmatch(r'\.build-requests/unity/[A-Za-z0-9._-]+\.json', request_file):
              raise SystemExit(f'invalid request path: {request_file}')
          path = pathlib.Path(request_file)
          if not path.is_file():
              raise SystemExit(f'build request missing: {request_file}')
          data = json.loads(path.read_text(encoding='utf-8'))
          if data.get('version') != 1:
              raise SystemExit('unsupported build request version')
          game_id = str(data.get('gameId',''))
          project = str(data.get('projectPath','')).replace('\\','/').strip('/')
          if not re.fullmatch(r'[a-z0-9][a-z0-9-]{1,48}', game_id):
              raise SystemExit(f'invalid gameId: {game_id}')
          if not re.fullmatch(r'unity-games/[A-Za-z0-9._-]+', project) or '..' in project:
              raise SystemExit(f'invalid projectPath: {project}')
          if not (pathlib.Path(project) / 'ProjectSettings' / 'ProjectVersion.txt').is_file():
              raise SystemExit(f'not a Unity project: {project}')
          request_id = str(data.get('requestId') or f'run-{game_id}')

          publish_homepage = False
          catalog_path = pathlib.Path('game-catalog.json')
          if catalog_path.is_file():
              catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
              for game in catalog.get('games', []):
                  if game.get('id') == game_id:
                      publish_homepage = bool(
                          game.get('homepagePublicationApproved') is True
                          and game.get('publishTestBuildWhenReady') is True
                      )
                      break

          with open(output, 'a', encoding='utf-8') as f:
              f.write(f'request_file={request_file}\n')
              f.write(f'game_id={game_id}\n')
              f.write(f'project_path={project}\n')
              f.write(f'request_id={request_id}\n')
              f.write(f'publish_homepage={str(publish_homepage).lower()}\n')
          print(f'[INFO] homepage publication approved={publish_homepage}')
          PY

      - name: Verify Unity cloud license secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$UNITY_LICENSE" ]] || { echo 'UNITY_LICENSE secret is required.' >&2; exit 2; }
          [[ -n "$UNITY_EMAIL" ]] || { echo 'UNITY_EMAIL secret is required.' >&2; exit 2; }
          [[ -n "$UNITY_PASSWORD" ]] || { echo 'UNITY_PASSWORD secret is required.' >&2; exit 2; }
          echo '[PASS] Unity cloud license secrets are present.'

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: ${{ steps.request.outputs.project_path }}/Library
          key: unity-library-${{ runner.os }}-${{ steps.request.outputs.game_id }}-${{ hashFiles(format('{0}/Packages/manifest.json', steps.request.outputs.project_path), format('{0}/ProjectSettings/ProjectVersion.txt', steps.request.outputs.project_path)) }}
          restore-keys: |
            unity-library-${{ runner.os }}-${{ steps.request.outputs.game_id }}-

      - name: Build Android APK in GitHub cloud
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ steps.request.outputs.project_path }}
          unityVersion: auto
          targetPlatform: Android
          androidExportType: androidPackage
          buildName: ${{ steps.request.outputs.game_id }}
          buildsPath: build
          buildMethod: JaewoonGames.DaechungRpg.Editor.AndroidTestBuild.Build

      - name: Verify APK and create metadata
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find build -type f -name '*.apk' -print -quit)"
          [[ -n "$apk" && -s "$apk" ]] || { echo 'No non-empty APK was produced.' >&2; exit 1; }
          mkdir -p dist
          game='${{ steps.request.outputs.game_id }}'
          out="dist/${game}-test.apk"
          cp "$apk" "$out"
          sha="$(sha256sum "$out" | awk '{print $1}')"
          bytes="$(stat -c%s "$out")"
          tag="test-${game}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s  %s\n' "$sha" "${game}-test.apk" > "${out}.sha256"
          python - "$game" '${{ steps.request.outputs.request_id }}' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$tag" "$sha" "$bytes" '${{ steps.request.outputs.publish_homepage }}' > dist/build-info.json <<'PY'
          import json, sys, datetime
          game, req, sha_source, run_id, attempt, tag, apk_sha, size, approved = sys.argv[1:]
          print(json.dumps({
              'version': 1,
              'gameId': game,
              'requestId': req,
              'sourceCommit': sha_source,
              'runId': int(run_id),
              'runAttempt': int(attempt),
              'releaseTag': tag,
              'artifactName': f'{game}-test.apk',
              'sha256': apk_sha,
              'bytes': int(size),
              'channel': 'test',
              'homepagePublicationApproved': approved.lower() == 'true',
              'homepagePublished': False,
              'builtAt': datetime.datetime.now(datetime.timezone.utc).isoformat()
          }, ensure_ascii=False, indent=2))
          PY
          echo "apk_path=$out" >> "$GITHUB_OUTPUT"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
          echo "[PASS] APK=$out bytes=$bytes sha256=$sha"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.request.outputs.game_id }}-android-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.artifact.outputs.apk_path }}
            ${{ steps.artifact.outputs.apk_path }}.sha256
            dist/build-info.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish test prerelease download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.artifact.outputs.release_tag }}
          name: ${{ steps.request.outputs.game_id }} Android Test #${{ github.run_number }}
          prerelease: true
          make_latest: false
          body: |
            Automated Jaewoon Company Android test build.
            Game: ${{ steps.request.outputs.game_id }}
            Source: ${{ github.sha }}
            Request: ${{ steps.request.outputs.request_id }}
            Homepage publication approved: ${{ steps.request.outputs.publish_homepage }}
          files: |
            ${{ steps.artifact.outputs.apk_path }}
            ${{ steps.artifact.outputs.apk_path }}.sha256
            dist/build-info.json
          fail_on_unmatched_files: true

      - name: Publish verified build to approved homepage state
        if: steps.request.outputs.publish_homepage == 'true'
        shell: bash
        run: |
          set -euo pipefail
          game='${{ steps.request.outputs.game_id }}'
          tag='${{ steps.artifact.outputs.release_tag }}'
          apk_name="${game}-test.apk"
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${apk_name}"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B homepage-build-state origin/main

            python - "$game" '${{ steps.request.outputs.request_id }}' "$GITHUB_SHA" "$tag" "$release_url" "$download_url" '${{ steps.artifact.outputs.sha256 }}' '${{ steps.artifact.outputs.bytes }}' <<'PY'
          import json, pathlib, sys, datetime
          game, request_id, source_commit, tag, release_url, download_url, sha256, size = sys.argv[1:]
          path = pathlib.Path('company-status.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          builds = [b for b in data.get('testBuilds', []) if b.get('gameId') != game]
          builds.append({
              'gameId': game,
              'requestId': request_id,
              'status': 'ready',
              'channel': 'test',
              'homepagePublished': True,
              'sourceCommit': source_commit,
              'releaseTag': tag,
              'release': release_url,
              'download': download_url,
              'sha256': sha256,
              'bytes': int(size),
              'builtAt': datetime.datetime.now(datetime.timezone.utc).isoformat()
          })
          data['testBuilds'] = builds
          data.setdefault('summary', {})['testBuilds'] = len(builds)
          data['updatedAt'] = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

            git add company-status.json
            if git diff --cached --quiet; then
              echo '[PASS] Approved homepage test build state already current.'
              exit 0
            fi
            git commit -m "company-ai: publish ${game} verified test build"
            if git push origin HEAD:main; then
              echo "[PASS] Approved homepage test build published: $download_url"
              exit 0
            fi
            echo "[WARN] main changed during publication attempt $attempt; retrying..."
            sleep $((attempt * 2))
          done

          echo 'Could not publish approved homepage build state after 3 attempts.' >&2
          exit 1

      - name: Confirm unapproved homepage remains unchanged
        if: steps.request.outputs.publish_homepage != 'true'
        shell: bash
        run: |
          echo '[PASS] Test APK prerelease published for direct testing.'
          echo '[PASS] No homepage download pointer was changed because this game has no explicit publication approval.'