name: Unity Cloud Android Test

on:
  workflow_call:
    inputs:
      request_file:
        required: true
        type: string
    secrets:
      UNITY_LICENSE:
        required: false
      UNITY_EMAIL:
        required: true
      UNITY_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      request_file:
        description: 'Tracked .build-requests/unity/*.json request file'
        required: true
        type: string

permissions:
  contents: write

env:
  JAEWOON_ANDROID_VERIFY_API: '36'

concurrency:
  group: unity-cloud-android-test
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      game_id: ${{ steps.request.outputs.game_id }}
      request_id: ${{ steps.request.outputs.request_id }}
      application_id: ${{ steps.apk_verify.outputs.application_id }}
      publish_homepage: ${{ steps.request.outputs.publish_homepage }}
      artifact_name: ${{ steps.artifact.outputs.artifact_name }}
      release_tag: ${{ steps.artifact.outputs.release_tag }}
      apk_name: ${{ steps.artifact.outputs.apk_name }}
      sha256: ${{ steps.artifact.outputs.sha256 }}
      bytes: ${{ steps.artifact.outputs.bytes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Resolve build request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request_file='${{ inputs.request_file }}'
          python3 - "$request_file" "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, re, sys
          request_file, output = sys.argv[1], sys.argv[2]
          if not re.fullmatch(r'\.build-requests/unity/[A-Za-z0-9._-]+\.json', request_file):
              raise SystemExit('[JAEWOON_BUILD_ERROR:INVALID_REQUEST_PATH] invalid Unity build request path')
          path = pathlib.Path(request_file)
          if not path.is_file():
              raise SystemExit('[JAEWOON_BUILD_ERROR:REQUEST_MISSING] Unity build request file is missing')
          data = json.loads(path.read_text(encoding='utf-8'))
          if data.get('version') != 1:
              raise SystemExit('[JAEWOON_BUILD_ERROR:REQUEST_VERSION_UNSUPPORTED] unsupported build request version')
          game_id = str(data.get('gameId',''))
          project = str(data.get('projectPath','')).replace('\\','/').strip('/')
          method = str(data.get('buildMethod','')).strip()
          request_id = str(data.get('requestId') or f'run-{game_id}')
          application_id = str(data.get('applicationId','')).strip()
          if not re.fullmatch(r'[a-z0-9][a-z0-9-]{1,48}', game_id):
              raise SystemExit('[JAEWOON_BUILD_ERROR:INVALID_GAME_ID] invalid gameId')
          if not re.fullmatch(r'unity-games/[A-Za-z0-9._-]+', project) or '..' in project:
              raise SystemExit('[JAEWOON_BUILD_ERROR:INVALID_PROJECT_PATH] invalid Unity projectPath')
          if not method or not re.fullmatch(r'[A-Za-z0-9_.]+', method):
              raise SystemExit('[JAEWOON_BUILD_ERROR:INVALID_BUILD_METHOD] buildMethod must be a fully qualified Unity static method')
          if application_id and not re.fullmatch(r'[a-z][a-z0-9_]*(?:\.[a-z][a-z0-9_]*){2,}', application_id):
              raise SystemExit('[JAEWOON_BUILD_ERROR:INVALID_APPLICATION_ID] invalid Android applicationId')
          version_path = pathlib.Path(project) / 'ProjectSettings' / 'ProjectVersion.txt'
          if not version_path.is_file():
              raise SystemExit('[JAEWOON_BUILD_ERROR:UNITY_PROJECT_MISSING] ProjectVersion.txt is missing')
          version_text = version_path.read_text(encoding='utf-8')
          m = re.search(r'm_EditorVersion:\s*([^\s]+)', version_text)
          r = re.search(r'm_EditorVersionWithRevision:\s*[^\s]+\s*\(([A-Za-z0-9]+)\)', version_text)
          if not m or not r:
              raise SystemExit('[JAEWOON_BUILD_ERROR:UNITY_VERSION_UNRESOLVED] could not resolve Unity editor version/revision')

          publish_homepage = False
          catalog_path = pathlib.Path('game-catalog.json')
          if catalog_path.is_file():
              catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
              for game in catalog.get('games', []):
                  if game.get('id') == game_id:
                      publish_homepage = bool(game.get('homepagePublicationApproved') is True and game.get('publishTestBuildWhenReady') is True)
                      break

          with open(output, 'a', encoding='utf-8') as f:
              f.write(f'game_id={game_id}\n')
              f.write(f'project_path={project}\n')
              f.write(f'build_method={method}\n')
              f.write(f'request_id={request_id}\n')
              f.write(f'application_id={application_id}\n')
              f.write(f'unity_version={m.group(1)}\n')
              f.write(f'unity_revision={r.group(1)}\n')
              f.write(f'publish_homepage={str(publish_homepage).lower()}\n')
          PY

      - name: Verify Unity Personal cloud credentials
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$UNITY_EMAIL" ]] || { echo '::error title=JAEWOON_BUILD_ERROR[UNITY_EMAIL_MISSING]::UNITY_EMAIL secret is required.'; exit 21; }
          [[ -n "$UNITY_PASSWORD" ]] || { echo '::error title=JAEWOON_BUILD_ERROR[UNITY_PASSWORD_MISSING]::UNITY_PASSWORD secret is required.'; exit 22; }
          echo '[PASS] Unity account credentials are present.'

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: ${{ steps.request.outputs.project_path }}/Library
          key: unity-library-${{ runner.os }}-${{ steps.request.outputs.game_id }}-${{ hashFiles(format('{0}/Packages/manifest.json', steps.request.outputs.project_path), format('{0}/ProjectSettings/ProjectVersion.txt', steps.request.outputs.project_path)) }}
          restore-keys: |
            unity-library-${{ runner.os }}-${{ steps.request.outputs.game_id }}-

      - name: Install Unity Hub and matching Android Editor
        id: unity_install
        env:
          UNITY_VERSION: ${{ steps.request.outputs.unity_version }}
          UNITY_REVISION: ${{ steps.request.outputs.unity_revision }}
        shell: bash
        run: |
          set -euo pipefail
          sudo sh -c 'dbus-uuidgen > /etc/machine-id'
          sudo mkdir -p /var/lib/dbus
          sudo ln -sfn /etc/machine-id /var/lib/dbus/machine-id

          wget -qO- https://hub.unity3d.com/linux/keys/public | gpg --dearmor | sudo tee /usr/share/keyrings/Unity_Technologies_ApS.gpg >/dev/null
          sudo rm -f /etc/apt/sources.list.d/unityhub.list
          sudo tee /etc/apt/sources.list.d/unityhub.sources >/dev/null <<'EOF'
          Types: deb
          URIs: https://hub.unity3d.com/linux/repos/deb
          Suites: stable
          Components: main
          Signed-By: /usr/share/keyrings/Unity_Technologies_ApS.gpg
          EOF
          echo 'deb https://archive.ubuntu.com/ubuntu jammy main universe' | sudo tee /etc/apt/sources.list.d/unity-jammy-compat.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            unityhub xvfb ffmpeg libgtk2.0-0 libglu1-mesa libgconf-2-4 libncurses5 pulseaudio desktop-file-utils

          hub_bin="$(readlink -f "$(command -v unityhub)")"
          [[ -n "$hub_bin" && -x "$hub_bin" ]] || { echo '::error title=JAEWOON_BUILD_ERROR[UNITY_HUB_MISSING]::Unity Hub executable was not found.'; exit 23; }

          sudo rm -rf /opt/unityhub
          sudo ln -s /usr/lib/unityhub /opt/unityhub
          [[ -x /opt/unityhub/unityhub ]] || { echo '::error title=JAEWOON_BUILD_ERROR[UNITY_HUB_COMPAT_PATH]::Unity Hub compatibility path is invalid.'; exit 24; }

          sudo tee /usr/local/bin/unity-hub >/dev/null <<'EOF'
          #!/bin/bash
          set -e
          hub_bin="$(readlink -f "$(command -v unityhub)")"
          exec xvfb-run --auto-servernum "$hub_bin" --headless "$@"
          EOF
          sudo chmod 755 /usr/local/bin/unity-hub

          install_root=/opt/unity/editors
          sudo mkdir -p "$install_root"
          sudo chown -R "$(id -u):$(id -g)" /opt/unity
          unity-hub install-path --set "$install_root"
          unity-hub install --version "$UNITY_VERSION" --changeset "$UNITY_REVISION" -m android --cm

          editor="$(find "$install_root" -type f -path '*/Editor/Unity' -perm -111 2>/dev/null | head -n 1 || true)"
          if [[ -z "$editor" ]]; then
            editor="$(find "$HOME" /opt -type f -path "*/$UNITY_VERSION/Editor/Unity" -perm -111 2>/dev/null | head -n 1 || true)"
          fi
          [[ -n "$editor" && -x "$editor" ]] || { echo "::error title=JAEWOON_BUILD_ERROR[UNITY_EDITOR_MISSING]::Unity $UNITY_VERSION executable was not found after installation."; exit 25; }
          echo "unity_editor_path=$editor" >> "$GITHUB_OUTPUT"
          echo "[PASS] Unity Editor installed: $editor"

      - name: Activate Unity Personal on GitHub host
        id: unity_license
        continue-on-error: true
        uses: RageAgainstThePixel/activate-unity-license@v2
        env:
          UNITY_HUB_PATH: /opt/unityhub/unityhub
          UNITY_EDITOR_PATH: ${{ steps.unity_install.outputs.unity_editor_path }}
        with:
          license: personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}
          license-version: 6.x

      - name: Enforce Unity activation result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ steps.unity_license.outcome }}' != 'success' ]]; then
            echo '::error title=JAEWOON_BUILD_ERROR[UNITY_LICENSE_198]::Unity Personal activation failed. Historical Unity exit code 198 means no valid Editor license was available.'
            exit 198
          fi
          echo '[PASS] Unity Personal activation succeeded.'

      - name: Build Android APK on GitHub host
        env:
          UNITY_EDITOR_PATH: ${{ steps.unity_install.outputs.unity_editor_path }}
          PROJECT_PATH: ${{ steps.request.outputs.project_path }}
          BUILD_METHOD: ${{ steps.request.outputs.build_method }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$UNITY_EDITOR_PATH" && -x "$UNITY_EDITOR_PATH" ]] || { echo '::error title=JAEWOON_BUILD_ERROR[UNITY_EDITOR_UNAVAILABLE]::Unity executable is unavailable at build time.'; exit 31; }
          echo '[INFO] Unity Personal is active. Starting Android build.'
          set +e
          "$UNITY_EDITOR_PATH" \
            -batchmode \
            -nographics \
            -quit \
            -buildTarget Android \
            -projectPath "$GITHUB_WORKSPACE/$PROJECT_PATH" \
            -executeMethod "$BUILD_METHOD" \
            -logFile /dev/stdout
          status=$?
          set -e
          if [[ "$status" -ne 0 ]]; then
            if [[ "$status" -eq 198 ]]; then
              echo '::error title=JAEWOON_BUILD_ERROR[UNITY_LICENSE_198]::Unity returned exit code 198 while building; the Editor license is not valid on this host.'
            else
              echo "::error title=JAEWOON_BUILD_ERROR[UNITY_BUILD_PROCESS_FAILED]::Unity Android build process exited with code $status."
            fi
            exit "$status"
          fi

      - name: Collect APK
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          game='${{ steps.request.outputs.game_id }}'
          apk="build/Android/${game}.apk"
          [[ -s "$apk" ]] || { echo "::error title=JAEWOON_BUILD_ERROR[APK_OUTPUT_MISSING]::Expected non-empty Unity APK at $apk."; exit 41; }
          mkdir -p dist
          out="dist/${game}-test.apk"
          source_sha="$(sha256sum "$apk" | awk '{print $1}')"
          source_bytes="$(stat -c%s "$apk")"
          cp "$apk" "$out"
          sha="$(sha256sum "$out" | awk '{print $1}')"
          bytes="$(stat -c%s "$out")"
          [[ "$source_sha" == "$sha" && "$source_bytes" == "$bytes" ]] || { echo '::error title=JAEWOON_BUILD_ERROR[APK_COPY_MISMATCH]::Collected APK does not match the exact Unity output.'; exit 51; }
          tag="test-${game}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          artifact_name="${game}-android-cloud-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s  %s\n' "$sha" "${game}-test.apk" > "${out}.sha256"
          echo "apk_path=$out" >> "$GITHUB_OUTPUT"
          echo "apk_name=${game}-test.apk" >> "$GITHUB_OUTPUT"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
          echo "[PASS] APK source=$apk output=$out bytes=$bytes sha256=$sha"

      - name: Verify APK signature, package and CPU payloads
        id: apk_verify
        env:
          APK_PATH: ${{ steps.artifact.outputs.apk_path }}
          EXPECTED_APPLICATION_ID: ${{ steps.request.outputs.application_id }}
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [[ -n "$SDK" ]] || { echo '::error title=JAEWOON_BUILD_ERROR[ANDROID_SDK_MISSING]::Android SDK path is unavailable.'; exit 42; }
          build_tools="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1 || true)"
          apksigner="$build_tools/apksigner"
          zipalign="$build_tools/zipalign"
          aapt="$build_tools/aapt"
          [[ -x "$apksigner" && -x "$zipalign" && -x "$aapt" ]] || { echo '::error title=JAEWOON_BUILD_ERROR[ANDROID_BUILD_TOOLS_MISSING]::apksigner, zipalign or aapt is missing.'; exit 43; }

          "$zipalign" -c -v 4 "$APK_PATH" >/tmp/zipalign-check.log || { cat /tmp/zipalign-check.log; echo '::error title=JAEWOON_BUILD_ERROR[APK_ZIPALIGN_FAILED]::APK zip alignment validation failed.'; exit 44; }
          "$apksigner" verify --verbose --print-certs "$APK_PATH" >/tmp/apksigner-check.log 2>&1 || { cat /tmp/apksigner-check.log; echo '::error title=JAEWOON_BUILD_ERROR[APK_SIGNATURE_INVALID]::APK signature verification failed.'; exit 45; }
          cat /tmp/apksigner-check.log

          badging="$($aapt dump badging "$APK_PATH")" || { echo '::error title=JAEWOON_BUILD_ERROR[APK_BADGING_UNREADABLE]::aapt could not read APK metadata.'; exit 46; }
          package="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<<"$badging" | head -n 1)"
          [[ -n "$package" ]] || { echo '::error title=JAEWOON_BUILD_ERROR[APK_PACKAGE_MISSING]::APK package id could not be resolved.'; exit 47; }
          if [[ -n "$EXPECTED_APPLICATION_ID" && "$package" != "$EXPECTED_APPLICATION_ID" ]]; then
            echo "::error title=JAEWOON_BUILD_ERROR[APK_PACKAGE_MISMATCH]::Expected $EXPECTED_APPLICATION_ID but APK contains $package."
            exit 48
          fi

          apk_entries="$(unzip -Z1 "$APK_PATH")" || { echo '::error title=JAEWOON_BUILD_ERROR[APK_ENTRY_LIST_UNREADABLE]::Could not list APK archive entries.'; exit 49; }
          grep -q '^lib/arm64-v8a/' <<<"$apk_entries" || { echo '::error title=JAEWOON_BUILD_ERROR[APK_ARM64_MISSING]::APK does not contain ARM64 native libraries.'; exit 49; }

          min_sdk="$(sed -n "s/^sdkVersion:'\([^']*\)'.*/\1/p" <<<"$badging" | head -n 1)"
          target_sdk="$(sed -n "s/^targetSdkVersion:'\([^']*\)'.*/\1/p" <<<"$badging" | head -n 1)"
          echo "application_id=$package" >> "$GITHUB_OUTPUT"
          echo "[PASS] APK package=$package minSdk=${min_sdk:-unknown} targetSdk=${target_sdk:-unknown} architectures=arm64-v8a"

      - name: Create pre-gate build metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - \
            '${{ steps.request.outputs.game_id }}' \
            '${{ steps.request.outputs.request_id }}' \
            '${{ steps.apk_verify.outputs.application_id }}' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            '${{ steps.artifact.outputs.release_tag }}' \
            '${{ steps.artifact.outputs.sha256 }}' \
            '${{ steps.artifact.outputs.bytes }}' \
            '${{ steps.request.outputs.publish_homepage }}' \
            "$JAEWOON_ANDROID_VERIFY_API" > dist/build-info.json <<'PY'
          import json, sys, datetime
          game, req, app_id, source, run_id, attempt, tag, apk_sha, size, approved, api = sys.argv[1:]
          print(json.dumps({
              'version': 2,
              'gameId': game,
              'requestId': req,
              'applicationId': app_id,
              'sourceCommit': source,
              'runId': int(run_id),
              'runAttempt': int(attempt),
              'releaseTag': tag,
              'artifactName': f'{game}-test.apk',
              'sha256': apk_sha,
              'bytes': int(size),
              'channel': 'test',
              'buildRoute': 'github-cloud-host-personal',
              'architectures': ['arm64-v8a'],
              'androidVerificationApi': int(api),
              'signatureVerified': True,
              'installAndLaunchVerified': False,
              'verificationStatus': 'pending',
              'runtimeVerification': 'android-16-avd-api-36-pending',
              'runtimeInstallLaunchVerified': False,
              'testBuildStatus': 'ready',
              'homepagePublicationApproved': approved.lower() == 'true',
              'homepagePublished': approved.lower() == 'true',
              'builtAt': datetime.datetime.now(datetime.timezone.utc).isoformat()
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload unverified APK for install gate
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: |
            ${{ steps.artifact.outputs.apk_path }}
            ${{ steps.artifact.outputs.apk_path }}.sha256
            dist/build-info.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish test prerelease immediately for owner testing
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.artifact.outputs.release_tag }}
          name: ${{ steps.request.outputs.game_id }} Android Test #${{ github.run_number }}
          prerelease: true
          make_latest: false
          body: |
            Automated Jaewoon Company Android TEST build.
            Static signature/package/ABI verification: PASS
            Android 16 install + launch gate: PENDING
            This APK is synchronized immediately for owner device testing and is not production/stable verified yet.
            Package: ${{ steps.apk_verify.outputs.application_id }}
            Architectures: arm64-v8a
            Source: ${{ github.sha }}
            Request: ${{ steps.request.outputs.request_id }}
          files: |
            ${{ steps.artifact.outputs.apk_path }}
            ${{ steps.artifact.outputs.apk_path }}.sha256
            dist/build-info.json
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Sync test APK to approved homepage immediately
        if: steps.request.outputs.publish_homepage == 'true'
        shell: bash
        run: |
          set -euo pipefail
          game='${{ steps.request.outputs.game_id }}'
          tag='${{ steps.artifact.outputs.release_tag }}'
          apk_name='${{ steps.artifact.outputs.apk_name }}'
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${apk_name}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git reset --hard HEAD

          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B homepage-build-state origin/main
            python3 - "$game" '${{ steps.request.outputs.request_id }}' "$GITHUB_SHA" "$tag" "$release_url" "$download_url" '${{ steps.artifact.outputs.sha256 }}' '${{ steps.artifact.outputs.bytes }}' '${{ steps.apk_verify.outputs.application_id }}' <<'PY'
          import json, pathlib, sys, datetime
          game, request_id, source_commit, tag, release_url, download_url, sha256, size, application_id = sys.argv[1:]
          path = pathlib.Path('company-status.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          now = datetime.datetime.now(datetime.timezone.utc).isoformat()
          builds = [b for b in data.get('testBuilds', []) if b.get('gameId') != game]
          builds.append({
              'gameId': game,
              'requestId': request_id,
              'status': 'ready',
              'channel': 'test',
              'buildRoute': 'github-cloud-host-personal',
              'mobileReady': True,
              'homepagePublished': True,
              'homepagePublishedAt': now,
              'deviceCompatibility': 'android-10+',
              'sourceCommit': source_commit,
              'releaseTag': tag,
              'release': release_url,
              'download': download_url,
              'applicationId': application_id,
              'sha256': sha256,
              'bytes': int(size),
              'androidVerificationApi': 36,
              'signatureVerified': True,
              'installAndLaunchVerified': False,
              'runtimeVerification': 'android-16-avd-api-36-pending',
              'runtimeVerificationSource': 'github-actions',
              'runtimeInstallLaunchVerified': False,
              'testBuildStatus': 'ready',
              'builtAt': now
          })
          data['testBuilds'] = builds
          data.setdefault('summary', {})['testBuilds'] = len(builds)
          data['updatedAt'] = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
            git add company-status.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "company-ai: sync ${game} test APK before runtime gate"
            if git push origin HEAD:main; then
              echo "[PASS] Owner test APK synchronized immediately: $download_url"
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo '::error title=JAEWOON_BUILD_ERROR[TEST_SYNC_FAILED]::Could not synchronize owner test APK after 3 attempts.'
          exit 63

  android16-install-gate:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout runtime QA tools
        uses: actions/checkout@v4

      - name: Download exact APK built above
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: gate-input

      - name: Locate exact APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find gate-input -type f -name '*.apk' -size +0c | head -n 1 || true)"
          [[ -n "$apk" && -s "$apk" ]] || { echo '::error title=JAEWOON_BUILD_ERROR[INSTALL_GATE_APK_MISSING]::Install gate could not find the built APK.'; exit 51; }
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Prepare Android 16 emulator
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [[ -n "$SDK" ]] || { echo '::error title=JAEWOON_BUILD_ERROR[ANDROID_SDK_MISSING]::Android SDK path is unavailable.'; exit 52; }
          sdkmanager_bin="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)"
          avdmanager_bin="$(find "$SDK/cmdline-tools" -type f -name avdmanager 2>/dev/null | sort -V | tail -n 1 || true)"
          [[ -x "$sdkmanager_bin" ]] || { echo "::error title=JAEWOON_BUILD_ERROR[SDKMANAGER_MISSING]::sdkmanager not found under $SDK/cmdline-tools"; exit 52; }
          [[ -x "$avdmanager_bin" ]] || { echo "::error title=JAEWOON_BUILD_ERROR[AVDMANAGER_MISSING]::avdmanager not found under $SDK/cmdline-tools"; exit 52; }
          cmdline_bin="$(dirname "$sdkmanager_bin")"
          avd_home="$RUNNER_TEMP/android-avd-install-gate"
          mkdir -p "$avd_home"
          export ANDROID_AVD_HOME="$avd_home"
          export PATH="$cmdline_bin:$SDK/platform-tools:$SDK/emulator:$PATH"
          echo "ANDROID_AVD_HOME=$avd_home" >> "$GITHUB_ENV"
          echo "$cmdline_bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/emulator" >> "$GITHUB_PATH"
          yes | "$sdkmanager_bin" --licenses >/dev/null || true
          "$sdkmanager_bin" 'platform-tools' 'emulator' 'build-tools;36.0.0' 'system-images;android-36;google_apis;x86_64'
          echo no | "$avdmanager_bin" create avd --force --name jaewoon-install-gate --package 'system-images;android-36;google_apis;x86_64' --device 'pixel_6'
          "$SDK/emulator/emulator" -list-avds | tee /tmp/jaewoon-install-avd-list.txt
          grep -Fxq 'jaewoon-install-gate' /tmp/jaewoon-install-avd-list.txt || { echo '::error title=JAEWOON_BUILD_ERROR[ANDROID_AVD_NOT_CREATED]::jaewoon-install-gate missing from emulator AVD list.'; exit 52; }
          if [[ -e /dev/kvm ]]; then sudo chmod 666 /dev/kvm || true; fi
          nohup "$SDK/emulator/emulator" -avd jaewoon-install-gate -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > /tmp/jaewoon-install-emulator.log 2>&1 &
          echo $! > /tmp/jaewoon-install-emulator.pid

      - name: Install and launch exact APK on Android 16
        shell: bash
        run: |
          set +e
          bash tools/unity-apk-runtime-smoke.sh '${{ steps.apk.outputs.path }}' qa-artifacts/android16-install-gate
          status=$?
          set -e
          if [[ "$status" -ne 0 ]]; then
            echo "::error title=JAEWOON_BUILD_ERROR[APK_ANDROID16_INSTALL_OR_LAUNCH_FAILED]::The exact APK failed Android 16 install/runtime smoke; smoke exit=$status."
            exit 53
          fi
          echo '[PASS] Exact APK installed and launched on Android 16 emulator.'

      - name: Upload install gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android16-install-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            qa-artifacts/android16-install-gate/
            /tmp/jaewoon-install-emulator.log
            /tmp/jaewoon-install-avd-list.txt
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: [build, android16-install-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout publication baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download install-verified APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist

      - name: Mark metadata install-verified
        shell: bash
        run: |
          set -euo pipefail
          info="$(find dist -type f -name build-info.json | head -n 1 || true)"
          apk="$(find dist -type f -name '*.apk' -size +0c | head -n 1 || true)"
          checksum="$(find dist -type f -name '*.apk.sha256' | head -n 1 || true)"
          [[ -n "$info" && -n "$apk" && -n "$checksum" ]] || { echo '::error title=JAEWOON_BUILD_ERROR[PUBLISH_ARTIFACT_INCOMPLETE]::Verified publication files are incomplete.'; exit 61; }
          python3 - "$info" <<'PY'
          import json, pathlib, sys, datetime
          path = pathlib.Path(sys.argv[1])
          data = json.loads(path.read_text(encoding='utf-8'))
          data['installAndLaunchVerified'] = True
          data['verificationStatus'] = 'verified'
          data['runtimeVerification'] = 'android-16-avd-api-36-passed'
          data['runtimeInstallLaunchVerified'] = True
          data['testBuildStatus'] = 'verified'
          data['installVerifiedAt'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          mkdir -p release-files
          cp "$apk" "release-files/${{ needs.build.outputs.apk_name }}"
          cp "$checksum" "release-files/${{ needs.build.outputs.apk_name }}.sha256"
          cp "$info" release-files/build-info.json

      - name: Publish install-verified test prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          name: ${{ needs.build.outputs.game_id }} Android Test #${{ github.run_number }}
          prerelease: true
          make_latest: false
          body: |
            Automated Jaewoon Company Android test build.
            Android 16 install + launch gate: PASS
            Package: ${{ needs.build.outputs.application_id }}
            Architectures: arm64-v8a
            Source: ${{ github.sha }}
            Request: ${{ needs.build.outputs.request_id }}
          files: |
            release-files/${{ needs.build.outputs.apk_name }}
            release-files/${{ needs.build.outputs.apk_name }}.sha256
            release-files/build-info.json
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Publish verified build to approved homepage state
        if: needs.build.outputs.publish_homepage == 'true'
        shell: bash
        run: |
          set -euo pipefail
          game='${{ needs.build.outputs.game_id }}'
          tag='${{ needs.build.outputs.release_tag }}'
          apk_name='${{ needs.build.outputs.apk_name }}'
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${apk_name}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B homepage-build-state origin/main
            python3 - "$game" '${{ needs.build.outputs.request_id }}' "$GITHUB_SHA" "$tag" "$release_url" "$download_url" '${{ needs.build.outputs.sha256 }}' '${{ needs.build.outputs.bytes }}' '${{ needs.build.outputs.application_id }}' <<'PY'
          import json, pathlib, sys, datetime
          game, request_id, source_commit, tag, release_url, download_url, sha256, size, application_id = sys.argv[1:]
          path = pathlib.Path('company-status.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          now = datetime.datetime.now(datetime.timezone.utc).isoformat()
          builds = [b for b in data.get('testBuilds', []) if b.get('gameId') != game]
          builds.append({
              'gameId': game,
              'requestId': request_id,
              'status': 'ready',
              'channel': 'test',
              'buildRoute': 'github-cloud-host-personal',
              'mobileReady': True,
              'homepagePublished': True,
              'homepagePublishedAt': now,
              'deviceCompatibility': 'android-10+',
              'sourceCommit': source_commit,
              'releaseTag': tag,
              'release': release_url,
              'download': download_url,
              'applicationId': application_id,
              'sha256': sha256,
              'bytes': int(size),
              'androidVerificationApi': 36,
              'signatureVerified': True,
              'installAndLaunchVerified': True,
              'runtimeVerification': 'android-16-avd-api-36-passed',
              'runtimeVerificationSource': 'github-actions',
              'runtimeInstallLaunchVerified': True,
              'testBuildStatus': 'verified',
              'builtAt': now
          })
          data['testBuilds'] = builds
          data.setdefault('summary', {})['testBuilds'] = len(builds)
          data['updatedAt'] = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
            git add company-status.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "company-ai: publish ${game} install-verified test build"
            if git push origin HEAD:main; then
              echo "[PASS] Approved homepage build state updated: $download_url"
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo '::error title=JAEWOON_BUILD_ERROR[HOMEPAGE_STATE_PUBLISH_FAILED]::Could not publish approved homepage build state after 3 attempts.'
          exit 62

  mark-runtime-failure:
    needs: [build, android16-install-gate]
    if: ${{ always() && needs.build.result == 'success' && needs.android16-install-gate.result == 'failure' && needs.build.outputs.publish_homepage == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout runtime failure baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep owner test APK available and mark runtime gate failed
        shell: bash
        run: |
          set -euo pipefail
          game='${{ needs.build.outputs.game_id }}'
          tag='${{ needs.build.outputs.release_tag }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B homepage-build-state origin/main
            python3 - "$game" "$tag" <<'PY'
          import json, pathlib, sys, datetime
          game, tag = sys.argv[1:]
          path = pathlib.Path('company-status.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          target = None
          for build in data.get('testBuilds', []):
              if build.get('gameId') == game and build.get('releaseTag') == tag:
                  target = build
                  break
          if target is None:
              raise SystemExit(f'latest synchronized test build not found for {game} tag={tag}')
          target['status'] = 'ready'
          target['installAndLaunchVerified'] = False
          target['runtimeVerification'] = 'android-16-avd-api-36-failed'
          target['runtimeVerificationSource'] = 'github-actions'
          target['runtimeInstallLaunchVerified'] = False
          target['testBuildStatus'] = 'runtime-failed'
          target['runtimeVerificationUpdatedAt'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          data['updatedAt'] = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
            git add company-status.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "company-ai: record ${game} Android runtime gate failure"
            if git push origin HEAD:main; then
              echo '[PASS] Runtime gate failure recorded while owner test APK remains downloadable.'
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo '::error title=JAEWOON_BUILD_ERROR[RUNTIME_FAILURE_STATE_SYNC_FAILED]::Could not record Android runtime gate failure after 3 attempts.'
          exit 64