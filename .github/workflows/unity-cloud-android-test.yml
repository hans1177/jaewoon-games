name: Unity Cloud Android Test

on:
  workflow_call:
    inputs:
      request_file:
        required: true
        type: string
    secrets:
      UNITY_LICENSE:
        required: false
      UNITY_EMAIL:
        required: true
      UNITY_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      request_file:
        description: 'Tracked .build-requests/unity/*.json request file'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: unity-cloud-android-test
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Resolve build request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request_file='${{ inputs.request_file }}'
          python3 - "$request_file" "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, re, sys
          request_file, output = sys.argv[1], sys.argv[2]
          if not re.fullmatch(r'\.build-requests/unity/[A-Za-z0-9._-]+\.json', request_file):
              raise SystemExit(f'invalid request path: {request_file}')
          path = pathlib.Path(request_file)
          if not path.is_file():
              raise SystemExit(f'build request missing: {request_file}')
          data = json.loads(path.read_text(encoding='utf-8'))
          if data.get('version') != 1:
              raise SystemExit('unsupported build request version')
          game_id = str(data.get('gameId',''))
          project = str(data.get('projectPath','')).replace('\\','/').strip('/')
          method = str(data.get('buildMethod','')).strip()
          request_id = str(data.get('requestId') or f'run-{game_id}')
          if not re.fullmatch(r'[a-z0-9][a-z0-9-]{1,48}', game_id):
              raise SystemExit(f'invalid gameId: {game_id}')
          if not re.fullmatch(r'unity-games/[A-Za-z0-9._-]+', project) or '..' in project:
              raise SystemExit(f'invalid projectPath: {project}')
          if not method or not re.fullmatch(r'[A-Za-z0-9_.]+', method):
              raise SystemExit('buildMethod is required and must be a fully qualified Unity static method')
          version_path = pathlib.Path(project) / 'ProjectSettings' / 'ProjectVersion.txt'
          if not version_path.is_file():
              raise SystemExit(f'not a Unity project: {project}')
          m = re.search(r'm_EditorVersion:\s*([^\s]+)', version_path.read_text(encoding='utf-8'))
          if not m:
              raise SystemExit('could not resolve Unity editor version')
          unity_version = m.group(1)

          publish_homepage = False
          catalog_path = pathlib.Path('game-catalog.json')
          if catalog_path.is_file():
              catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
              for game in catalog.get('games', []):
                  if game.get('id') == game_id:
                      publish_homepage = bool(game.get('homepagePublicationApproved') is True and game.get('publishTestBuildWhenReady') is True)
                      break

          with open(output, 'a', encoding='utf-8') as f:
              f.write(f'game_id={game_id}\n')
              f.write(f'project_path={project}\n')
              f.write(f'build_method={method}\n')
              f.write(f'request_id={request_id}\n')
              f.write(f'unity_version={unity_version}\n')
              f.write(f'publish_homepage={str(publish_homepage).lower()}\n')
          PY

      - name: Verify Unity named-user cloud credentials
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$UNITY_EMAIL" ]] || { echo 'UNITY_EMAIL secret is required.' >&2; exit 2; }
          [[ -n "$UNITY_PASSWORD" ]] || { echo 'UNITY_PASSWORD secret is required.' >&2; exit 2; }
          echo '[PASS] Named-user credentials are present. UNITY_LICENSE is intentionally not used by the cloud build.'

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: ${{ steps.request.outputs.project_path }}/Library
          key: unity-library-${{ runner.os }}-${{ steps.request.outputs.game_id }}-${{ hashFiles(format('{0}/Packages/manifest.json', steps.request.outputs.project_path), format('{0}/ProjectSettings/ProjectVersion.txt', steps.request.outputs.project_path)) }}
          restore-keys: |
            unity-library-${{ runner.os }}-${{ steps.request.outputs.game_id }}-

      - name: Build Android APK in GitHub cloud
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_IMAGE: unityci/editor:ubuntu-${{ steps.request.outputs.unity_version }}-android-3
          PROJECT_PATH: ${{ steps.request.outputs.project_path }}
          BUILD_METHOD: ${{ steps.request.outputs.build_method }}
        shell: bash
        run: |
          set -euo pipefail
          echo "[INFO] Pulling $UNITY_IMAGE"
          docker pull "$UNITY_IMAGE"
          docker run --rm \
            -e UNITY_EMAIL \
            -e UNITY_PASSWORD \
            -e PROJECT_PATH \
            -e BUILD_METHOD \
            -v "$GITHUB_WORKSPACE:/github/workspace" \
            -w /github/workspace \
            "$UNITY_IMAGE" \
            /bin/bash -lc '
              set -euo pipefail
              mkdir -p /root/.cache/unity3d /root/.config/unity3d /root/.local/share/unity3d/Unity
              unity_bin="/opt/unity/Editor/Unity"
              if [[ ! -x "$unity_bin" ]]; then
                unity_bin="$(find /opt /usr -type f -path "*/Editor/Unity" -perm -111 2>/dev/null | head -n 1 || true)"
              fi
              [[ -n "$unity_bin" && -x "$unity_bin" ]] || { echo "Unity executable not found in container." >&2; exit 3; }
              echo "[INFO] Unity executable resolved."
              echo "[INFO] Activating named-user license with an intentionally empty serial value."
              "$unity_bin" -batchmode -nographics -quit -serial -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" -logFile /dev/stdout
              echo "[PASS] Unity named-user activation command completed."
              "$unity_bin" -batchmode -nographics -quit -projectPath "/github/workspace/$PROJECT_PATH" -executeMethod "$BUILD_METHOD" -logFile /dev/stdout
            '

      - name: Verify APK and create metadata
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find build '${{ steps.request.outputs.project_path }}/Build' '${{ steps.request.outputs.project_path }}/build' -type f -name '*.apk' -size +0c 2>/dev/null | head -n 1 || true)"
          [[ -n "$apk" && -s "$apk" ]] || { echo 'No non-empty APK was produced.' >&2; exit 1; }
          mkdir -p dist
          game='${{ steps.request.outputs.game_id }}'
          out="dist/${game}-test.apk"
          cp "$apk" "$out"
          sha="$(sha256sum "$out" | awk '{print $1}')"
          bytes="$(stat -c%s "$out")"
          tag="test-${game}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s  %s\n' "$sha" "${game}-test.apk" > "${out}.sha256"
          python3 - "$game" '${{ steps.request.outputs.request_id }}' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$tag" "$sha" "$bytes" '${{ steps.request.outputs.publish_homepage }}' > dist/build-info.json <<'PY'
          import json, sys, datetime
          game, req, source, run_id, attempt, tag, apk_sha, size, approved = sys.argv[1:]
          print(json.dumps({
              'version': 1,
              'gameId': game,
              'requestId': req,
              'sourceCommit': source,
              'runId': int(run_id),
              'runAttempt': int(attempt),
              'releaseTag': tag,
              'artifactName': f'{game}-test.apk',
              'sha256': apk_sha,
              'bytes': int(size),
              'channel': 'test',
              'buildRoute': 'github-cloud-named-user',
              'homepagePublicationApproved': approved.lower() == 'true',
              'homepagePublished': False,
              'builtAt': datetime.datetime.now(datetime.timezone.utc).isoformat()
          }, ensure_ascii=False, indent=2))
          PY
          echo "apk_path=$out" >> "$GITHUB_OUTPUT"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
          echo "[PASS] CLOUD APK=$out bytes=$bytes sha256=$sha"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.request.outputs.game_id }}-android-cloud-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.artifact.outputs.apk_path }}
            ${{ steps.artifact.outputs.apk_path }}.sha256
            dist/build-info.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish test prerelease download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.artifact.outputs.release_tag }}
          name: ${{ steps.request.outputs.game_id }} Android Test #${{ github.run_number }}
          prerelease: true
          make_latest: false
          body: |
            Automated Jaewoon Company Android test build.
            Route: GitHub-hosted Unity named-user cloud
            Game: ${{ steps.request.outputs.game_id }}
            Source: ${{ github.sha }}
            Request: ${{ steps.request.outputs.request_id }}
          files: |
            ${{ steps.artifact.outputs.apk_path }}
            ${{ steps.artifact.outputs.apk_path }}.sha256
            dist/build-info.json
          fail_on_unmatched_files: true

      - name: Publish verified build to approved homepage state
        if: steps.request.outputs.publish_homepage == 'true'
        shell: bash
        run: |
          set -euo pipefail
          game='${{ steps.request.outputs.game_id }}'
          tag='${{ steps.artifact.outputs.release_tag }}'
          apk_name="${game}-test.apk"
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${apk_name}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B homepage-build-state origin/main
            python3 - "$game" '${{ steps.request.outputs.request_id }}' "$GITHUB_SHA" "$tag" "$release_url" "$download_url" '${{ steps.artifact.outputs.sha256 }}' '${{ steps.artifact.outputs.bytes }}' <<'PY'
          import json, pathlib, sys, datetime
          game, request_id, source_commit, tag, release_url, download_url, sha256, size = sys.argv[1:]
          path = pathlib.Path('company-status.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          builds = [b for b in data.get('testBuilds', []) if b.get('gameId') != game]
          builds.append({
              'gameId': game,
              'requestId': request_id,
              'status': 'ready',
              'channel': 'test',
              'buildRoute': 'github-cloud-named-user',
              'homepagePublished': True,
              'sourceCommit': source_commit,
              'releaseTag': tag,
              'release': release_url,
              'download': download_url,
              'sha256': sha256,
              'bytes': int(size),
              'builtAt': datetime.datetime.now(datetime.timezone.utc).isoformat()
          })
          data['testBuilds'] = builds
          data.setdefault('summary', {})['testBuilds'] = len(builds)
          data['updatedAt'] = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
            git add company-status.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "company-ai: publish ${game} verified cloud test build"
            if git push origin HEAD:main; then
              echo "[PASS] Approved homepage build state updated: $download_url"
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Could not publish approved homepage build state after 3 attempts.' >&2
          exit 1
