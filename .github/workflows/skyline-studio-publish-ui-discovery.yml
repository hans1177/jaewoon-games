name: Skyline Studio Publish UI Discovery

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/skyline-studio-publish-ui-discovery.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: skyline-studio-publish-ui-discovery
  cancel-in-progress: true

jobs:
  discover:
    if: github.head_ref == 'diag/skyline-studio-publish-ui-20260917'
    runs-on: [self-hosted, Windows, X64, roblox-studio-authenticated]
    timeout-minutes: 8
    steps:
      - name: Open exact Skyline artifact in authenticated Studio and inspect UI only
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $runnerMetadata = Get-Content 'C:\actions-runner\.runner' -Raw | ConvertFrom-Json
          if ([string]$runnerMetadata.agentName -ne 'roblox-studio-local') { throw "Unexpected runner: $($runnerMetadata.agentName)" }
          if (@(Get-Process -Name RobloxStudioBeta -ErrorAction SilentlyContinue).Count -gt 0) { throw 'Roblox Studio already running' }

          $studio = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Roblox\Versions\*\RobloxStudioBeta.exe') -File -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $studio) { throw 'RobloxStudioBeta.exe not found' }

          $root = Join-Path $env:RUNNER_TEMP 'skyline-publish-ui-exact-package'
          if (Test-Path $root) { Remove-Item -Recurse -Force $root }
          New-Item -ItemType Directory -Path $root | Out-Null
          gh run download 35110903876 --repo $env:GITHUB_REPOSITORY --name development-roblox-package-seed-roblox-obby-party-minigam-tower-of-hell --dir $root
          if ($LASTEXITCODE -ne 0) { throw 'exact Skyline package download failed' }
          $places = @(Get-ChildItem $root -Recurse -File | Where-Object { $_.Extension -in @('.rbxl','.rbxlx') })
          if ($places.Count -ne 1) { throw "expected one exact Skyline place, found $($places.Count)" }
          $place = $places[0]
          $hash = (Get-FileHash $place.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '7d80197d95f3e197ab30b888c71764123125b3d0d840f24ed789bce868eec3cc') { throw "exact Skyline artifact hash mismatch: $hash" }
          Write-Host 'SKYLINE_PUBLISH_UI_EXACT_ARTIFACT=PASS'

          $argLine = "--task EditFile --localPlaceFile `"$($place.FullName)`""
          $p = Start-Process -FilePath $studio.FullName -ArgumentList $argLine -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(60)
            $handle = [IntPtr]::Zero
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 2
              $p.Refresh()
              if ($p.HasExited) { throw "Studio exited before UI discovery: $($p.ExitCode)" }
              if ($p.MainWindowHandle -ne 0) { $handle = [IntPtr]$p.MainWindowHandle; break }
            }
            if ($handle -eq [IntPtr]::Zero) { throw 'Studio main window handle unavailable' }
            Write-Host "SKYLINE_PUBLISH_UI_MAIN_WINDOW_HANDLE=$handle"
            Write-Host "SKYLINE_PUBLISH_UI_WINDOW_TITLE=$($p.MainWindowTitle)"

            Add-Type -AssemblyName UIAutomationClient
            Add-Type -AssemblyName UIAutomationTypes
            $window = [System.Windows.Automation.AutomationElement]::FromHandle($handle)
            if (-not $window) { throw 'UI Automation root unavailable' }
            $all = $window.FindAll([System.Windows.Automation.TreeScope]::Descendants,[System.Windows.Automation.Condition]::TrueCondition)
            $hits = @()
            $limit = [Math]::Min($all.Count, 1500)
            for ($i=0; $i -lt $limit; $i++) {
              $e = $all.Item($i)
              $name = [string]$e.Current.Name
              $auto = [string]$e.Current.AutomationId
              $class = [string]$e.Current.ClassName
              $type = [string]$e.Current.ControlType.ProgrammaticName
              if ($name -match '(?i)publish|roblox|experience|create|file|save') {
                $hits += [PSCustomObject]@{Name=$name;AutomationId=$auto;ClassName=$class;ControlType=$type}
              }
            }
            Write-Host "SKYLINE_PUBLISH_UI_ELEMENT_COUNT=$($all.Count)"
            Write-Host "SKYLINE_PUBLISH_UI_RELEVANT_COUNT=$($hits.Count)"
            foreach ($hit in $hits) {
              $line = ($hit | ConvertTo-Json -Compress)
              Write-Host "SKYLINE_PUBLISH_UI_ELEMENT=$line"
            }
            Write-Host 'SKYLINE_PUBLISH_UI_READ_ONLY_DISCOVERY=PASS'
            Write-Host 'SKYLINE_PUBLISH_ACTION=NONE'
          }
          finally {
            if ($p -and -not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          }
