name: Skyline Studio Publish UI Discovery

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/skyline-studio-publish-ui-discovery.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: skyline-studio-publish-ui-discovery
  cancel-in-progress: true

jobs:
  discover:
    if: github.head_ref == 'diag/skyline-studio-publish-ui-20260917'
    runs-on: [self-hosted, Windows, X64, roblox-studio-authenticated]
    timeout-minutes: 8
    steps:
      - name: Open exact Skyline artifact and inspect official Publish dialog without creating
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $runnerMetadata = Get-Content 'C:\actions-runner\.runner' -Raw | ConvertFrom-Json
          if ([string]$runnerMetadata.agentName -ne 'roblox-studio-local') { throw "Unexpected runner: $($runnerMetadata.agentName)" }
          if (@(Get-Process -Name RobloxStudioBeta -ErrorAction SilentlyContinue).Count -gt 0) { throw 'Roblox Studio already running' }

          $studio = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Roblox\Versions\*\RobloxStudioBeta.exe') -File -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $studio) { throw 'RobloxStudioBeta.exe not found' }

          $root = Join-Path $env:RUNNER_TEMP 'skyline-publish-ui-exact-package'
          if (Test-Path $root) { Remove-Item -Recurse -Force $root }
          New-Item -ItemType Directory -Path $root | Out-Null
          gh run download 35110903876 --repo $env:GITHUB_REPOSITORY --name development-roblox-package-seed-roblox-obby-party-minigam-tower-of-hell --dir $root
          if ($LASTEXITCODE -ne 0) { throw 'exact Skyline package download failed' }
          $places = @(Get-ChildItem $root -Recurse -File | Where-Object { $_.Extension -in @('.rbxl','.rbxlx') })
          if ($places.Count -ne 1) { throw "expected one exact Skyline place, found $($places.Count)" }
          $place = $places[0]
          $hash = (Get-FileHash $place.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '7d80197d95f3e197ab30b888c71764123125b3d0d840f24ed789bce868eec3cc') { throw "exact Skyline artifact hash mismatch: $hash" }
          Write-Host 'SKYLINE_PUBLISH_UI_EXACT_ARTIFACT=PASS'

          Add-Type @'
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public static class SkylineWin32 {
            public delegate bool EnumWindowsProc(IntPtr hWnd, IntPtr lParam);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumWindowsProc lpEnumFunc, IntPtr lParam);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr hWnd, out uint processId);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr hWnd, StringBuilder text, int maxCount);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetClassName(IntPtr hWnd, StringBuilder text, int maxCount);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr hWnd);
          }
          '@
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes

          function Get-StudioTopWindows([uint32]$pid) {
            $rows = New-Object System.Collections.Generic.List[object]
            $callback = [SkylineWin32+EnumWindowsProc]{
              param([IntPtr]$hWnd,[IntPtr]$lParam)
              [uint32]$windowPid = 0
              [void][SkylineWin32]::GetWindowThreadProcessId($hWnd,[ref]$windowPid)
              if ($windowPid -eq $pid) {
                $titleBuilder = New-Object System.Text.StringBuilder 1024
                $classBuilder = New-Object System.Text.StringBuilder 512
                [void][SkylineWin32]::GetWindowText($hWnd,$titleBuilder,$titleBuilder.Capacity)
                [void][SkylineWin32]::GetClassName($hWnd,$classBuilder,$classBuilder.Capacity)
                $rows.Add([PSCustomObject]@{Handle=$hWnd.ToInt64();Title=$titleBuilder.ToString();ClassName=$classBuilder.ToString();Visible=[SkylineWin32]::IsWindowVisible($hWnd)})
              }
              return $true
            }
            [void][SkylineWin32]::EnumWindows($callback,[IntPtr]::Zero)
            return @($rows)
          }

          $argLine = "--task EditFile --localPlaceFile `"$($place.FullName)`""
          $p = Start-Process -FilePath $studio.FullName -ArgumentList $argLine -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(60)
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 2
              $p.Refresh()
              if ($p.HasExited) { throw "Studio exited before UI discovery: $($p.ExitCode)" }
              if ($p.MainWindowHandle -ne 0) { break }
            }
            if ($p.MainWindowHandle -eq 0) { throw 'Studio main window handle unavailable' }
            Write-Host "SKYLINE_PUBLISH_UI_MAIN_WINDOW_HANDLE=$($p.MainWindowHandle)"
            Write-Host "SKYLINE_PUBLISH_UI_WINDOW_TITLE=$($p.MainWindowTitle)"

            $shell = New-Object -ComObject WScript.Shell
            $activated = $shell.AppActivate($p.Id)
            Write-Host "SKYLINE_PUBLISH_UI_APP_ACTIVATE=$activated"
            if (-not $activated) { throw 'Unable to activate authenticated Studio window' }
            Start-Sleep -Seconds 2
            $shell.SendKeys('%p')
            Write-Host 'SKYLINE_PUBLISH_UI_OFFICIAL_HOTKEY_SENT=ALT_P'
            Start-Sleep -Seconds 10

            $windows = Get-StudioTopWindows ([uint32]$p.Id)
            Write-Host "SKYLINE_PUBLISH_UI_TOP_WINDOW_COUNT=$($windows.Count)"
            foreach ($w in $windows) {
              Write-Host "SKYLINE_PUBLISH_UI_TOP_WINDOW=$(($w | ConvertTo-Json -Compress))"
              try {
                $element = [System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$w.Handle)
                if ($element) {
                  $desc = $element.FindAll([System.Windows.Automation.TreeScope]::Descendants,[System.Windows.Automation.Condition]::TrueCondition)
                  Write-Host "SKYLINE_PUBLISH_UI_TOP_WINDOW_UIA_COUNT=$($w.Handle):$($desc.Count)"
                  $limit = [Math]::Min($desc.Count,800)
                  for ($i=0; $i -lt $limit; $i++) {
                    $e = $desc.Item($i)
                    $name = [string]$e.Current.Name
                    if ($name -match '(?i)publish|roblox|experience|create|name|description|device|cancel') {
                      $row = [PSCustomObject]@{Window=$w.Handle;Name=$name;AutomationId=[string]$e.Current.AutomationId;ClassName=[string]$e.Current.ClassName;ControlType=[string]$e.Current.ControlType.ProgrammaticName}
                      Write-Host "SKYLINE_PUBLISH_UI_DIALOG_ELEMENT=$(($row | ConvertTo-Json -Compress))"
                    }
                  }
                }
              } catch {
                Write-Host "SKYLINE_PUBLISH_UI_UIA_ERROR=$($w.Handle):$($_.Exception.Message)"
              }
            }
            Write-Host 'SKYLINE_PUBLISH_UI_DIALOG_DISCOVERY=PASS'
            Write-Host 'SKYLINE_PUBLISH_ACTION=NONE'
            Write-Host 'SKYLINE_CREATE_ACTION=NONE'
          }
          finally {
            if ($p -and -not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          }
