name: ChatGPT Vibe2 Capability Review

on:
  push:
    branches: [chatgpt/vibe2-capability-review-20260909]
    paths:
      - '.github/workflows/chatgpt-vibe2-capability-review.yml'
      - '.github/workflows/autonomous-continuous-development.yml'
      - '.github/workflows/autonomous-candidate-promotion.yml'
      - 'tools/autonomous-development-worker.mjs'
      - 'tools/autonomous-department-scope.mjs'
      - 'tools/autonomous-candidate-browser-qa.mjs'
      - 'tools/autonomous-candidate-review.mjs'
      - 'qa/autonomous-development-worker.test.mjs'
      - 'qa/autonomous-department-scope.test.mjs'
      - 'qa/autonomous-candidate-browser-qa.test.mjs'
      - 'qa/autonomous-candidate-review.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/vibe2-capability-review-20260909
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and workflow parse
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/autonomous-development-worker.mjs
          node --check tools/autonomous-department-scope.mjs
          node --check tools/autonomous-candidate-browser-qa.mjs
          node --check tools/autonomous-candidate-review.mjs
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/autonomous-continuous-development.yml'); YAML.load_file('.github/workflows/autonomous-candidate-promotion.yml')"
          git diff --check origin/main...HEAD
      - name: Deterministic Vibe2 tests
        run: |
          node --test qa/autonomous-development-worker.test.mjs
          node --test qa/autonomous-department-scope.test.mjs
          node --test qa/autonomous-candidate-browser-qa.test.mjs
          node --test qa/autonomous-candidate-review.test.mjs
          node --test qa/autonomous-diagnostics.test.mjs
          node --test qa/autonomous-work-planner.test.mjs
      - name: Install headless Chromium for real candidate QA
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Real mobile browser QA fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture='web-games/__vibe2-browser-review__'
          rm -rf "$fixture"
          mkdir -p "$fixture"
          cat > "$fixture/index.html" <<'HTML'
          <!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><button id="go">GO</button><script>document.getElementById('go').addEventListener('click',()=>document.body.dataset.ok='1')</script></body></html>
          HTML
          node tools/autonomous-candidate-browser-qa.mjs \
            --source="$fixture" \
            --port=4183 \
            --output=/tmp/vibe2-browser-review.json \
            --screenshot=/tmp/vibe2-browser-review.png
          rm -rf "$fixture"
          test "$(node -p "require('/tmp/vibe2-browser-review.json').pass")" = true
