name: Prepare cached local Ollama runtime
description: Build or restore a pinned CPU-only Ollama runtime cache, start the local server only when needed, and optionally pull the model.
inputs:
  model:
    description: Ollama model name to make available locally.
    required: true
  version:
    description: Pinned Ollama version without the leading v.
    required: false
    default: '0.33.3'
  pull-model:
    description: Whether this caller needs a runnable Ollama server and the requested model. false is cache-warm mode only.
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Detect deterministic planning-final no-model path
      id: model-need
      shell: bash
      run: |
        set -euo pipefail
        skip=false
        if [ "${{ inputs.pull-model }}" = 'true' ] && [ "${GITHUB_JOB:-}" = 'planning_final' ] && [ -s .autonomous/work-order.json ] && [ -d department-results ]; then
          if node --input-type=module <<'NODE'
        import fs from 'node:fs';
        import path from 'node:path';
        import { canUseDeterministicFinalization } from './tools/autonomous-department-cycle.mjs';
        const roles=['planning','development','graphics','qa','balance'];
        const order=JSON.parse(fs.readFileSync('.autonomous/work-order.json','utf8'));
        const packages=roles.map(role=>JSON.parse(fs.readFileSync(path.join('department-results',`${role}.json`),'utf8')));
        const results=packages.map(item=>item.result);
        const vibeCore=packages[0]?.vibeCore||{};
        const fast=String(order.workLane||'FULL').trim().toUpperCase()==='FAST';
        const deterministic=fast||canUseDeterministicFinalization({vibeCore,results});
        console.log(`PLANNING_FINAL_MODEL_RUNTIME=${deterministic?'SKIPPED_DETERMINISTIC':'REQUIRED_AI'}`);
        process.exit(deterministic?0:1);
        NODE
          then
            skip=true
          else
            echo 'PLANNING_FINAL_MODEL_RUNTIME=REQUIRED_AI_OR_PROBE_FAILED'
          fi
        fi
        echo "skip=$skip" >> "$GITHUB_OUTPUT"

    - name: Deterministic planning-final runtime summary
      if: steps.model-need.outputs.skip == 'true'
      shell: bash
      run: |
        set -euo pipefail
        echo 'OLLAMA_RUNTIME=SKIPPED_DETERMINISTIC_PLANNING_FINAL'
        echo 'OLLAMA_MODEL_PULL=SKIPPED_DETERMINISTIC_PLANNING_FINAL'
        echo 'PAID_API=NO'

    - name: Probe or restore pinned CPU-only Ollama runtime archive
      id: runtime-cache
      if: steps.model-need.outputs.skip != 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/jaewoon-ollama/ollama-linux-amd64-cpu-${{ inputs.version }}.tar.zst
        key: jaewoon-ollama-cpu-runtime-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}
        lookup-only: ${{ inputs.pull-model == 'false' }}

    - name: Build slim CPU runtime on cache miss
      if: steps.model-need.outputs.skip != 'true' && steps.runtime-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        cache_dir="$HOME/.cache/jaewoon-ollama"
        slim="$cache_dir/ollama-linux-amd64-cpu-${{ inputs.version }}.tar.zst"
        upstream="$RUNNER_TEMP/ollama-linux-amd64-${{ inputs.version }}.tar.zst"
        stage="$RUNNER_TEMP/ollama-cpu-${{ inputs.version }}"
        manifest="$RUNNER_TEMP/ollama-cpu-files-${{ inputs.version }}.txt"
        mkdir -p "$cache_dir" "$stage"
        downloaded=0
        for attempt in 1 2 3; do
          echo "OLLAMA_UPSTREAM_DOWNLOAD_ATTEMPT=$attempt/3"
          if curl -fL --retry 3 --retry-all-errors --connect-timeout 15 \
            "https://ollama.com/download/ollama-linux-amd64.tar.zst?version=${{ inputs.version }}" \
            -o "$upstream"; then
            downloaded=1
            break
          fi
          sleep $((attempt * 4))
        done
        test "$downloaded" = 1
        test -s "$upstream"

        # GitHub-hosted ubuntu runners have no production GPU workload here. Keep the
        # Ollama executable and root CPU runtime libraries, while excluding the very
        # large CUDA/ROCm/MLX payload directories bundled in the 1GB+ upstream archive.
        tar --zstd -tf "$upstream" | awk '
          $0 == "bin/ollama" || $0 ~ /^lib\/ollama\/[^/]+$/ { print }
        ' > "$manifest"
        grep -qx 'bin/ollama' "$manifest"
        grep -qx 'lib/ollama/llama-server' "$manifest"
        tar --zstd -xf "$upstream" -C "$stage" -T "$manifest"
        test -x "$stage/bin/ollama"
        test -x "$stage/lib/ollama/llama-server"
        tar --zstd -cf "$slim" -C "$stage" bin lib
        test -s "$slim"
        full_bytes="$(stat -c %s "$upstream")"
        slim_bytes="$(stat -c %s "$slim")"
        test "$slim_bytes" -lt "$full_bytes"
        echo "OLLAMA_UPSTREAM_BYTES=$full_bytes"
        echo "OLLAMA_CPU_SLIM_BYTES=$slim_bytes"
        echo 'OLLAMA_GPU_PAYLOAD_EXCLUDED=YES'
        rm -rf "$upstream" "$stage" "$manifest"

    - name: Cache warmup fast-path summary
      if: steps.model-need.outputs.skip != 'true' && inputs.pull-model == 'false'
      shell: bash
      run: |
        set -euo pipefail
        cache_hit="${{ steps.runtime-cache.outputs.cache-hit }}"
        echo 'OLLAMA_RUNTIME_CACHE_LOOKUP_ONLY=YES'
        echo "OLLAMA_CPU_RUNTIME_CACHE_HIT=$cache_hit"
        if [ "$cache_hit" = 'true' ]; then
          echo 'OLLAMA_CPU_RUNTIME_RESTORE=SKIPPED_CACHE_HIT'
        else
          slim="$HOME/.cache/jaewoon-ollama/ollama-linux-amd64-cpu-${{ inputs.version }}.tar.zst"
          test -s "$slim"
          echo "OLLAMA_CPU_SLIM_BYTES=$(stat -c %s "$slim")"
          echo 'OLLAMA_CPU_RUNTIME_REBUILT=YES'
        fi
        echo 'OLLAMA_CPU_SLIM_RUNTIME=YES'
        echo 'OLLAMA_RUNTIME_EXTRACTION=SKIPPED_FOR_WARMUP'
        echo 'OLLAMA_SERVER_START=SKIPPED_FOR_WARMUP'

    - name: Install slim CPU runtime and start local server
      if: steps.model-need.outputs.skip != 'true' && inputs.pull-model == 'true'
      shell: bash
      run: |
        set -euo pipefail
        slim="$HOME/.cache/jaewoon-ollama/ollama-linux-amd64-cpu-${{ inputs.version }}.tar.zst"
        test -s "$slim"
        command -v zstd >/dev/null
        sudo tar --zstd -xf "$slim" -C /usr
        command -v ollama >/dev/null
        test -x /usr/lib/ollama/llama-server
        nohup ollama serve > /tmp/ollama-autonomous.log 2>&1 &
        for i in $(seq 1 30); do
          if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
            echo "OLLAMA_CPU_RUNTIME_CACHE_HIT=${{ steps.runtime-cache.outputs.cache-hit }}"
            echo 'OLLAMA_CPU_SLIM_RUNTIME=YES'
            echo 'OLLAMA_SYSTEM_SERVICE_SETUP=SKIPPED'
            exit 0
          fi
          sleep 2
        done
        cat /tmp/ollama-autonomous.log || true
        exit 1

    - name: Ensure requested local model
      if: steps.model-need.outputs.skip != 'true' && inputs.pull-model == 'true'
      shell: bash
      run: |
        set -euo pipefail
        ollama pull "${{ inputs.model }}"
        echo 'PAID_API=NO'
